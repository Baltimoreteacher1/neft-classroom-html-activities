<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owner Dashboard — EduWonderLab</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --card: #ffffff;
        --ink: #17202a;
        --muted: #52606d;
        --border: #d9e2ec;
        --accent: #0f766e;
        --warn: #b45309;
        --bad: #b91c1c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      h1 { margin: 0; font-size: 1.5rem; }
      .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      input, select, button {
        font: inherit;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--ink);
      }
      button {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        cursor: pointer;
        font-weight: 600;
      }
      button.ghost {
        background: var(--card);
        color: var(--ink);
        border-color: var(--border);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .card h2 {
        margin: 0 0 10px;
        font-size: 1.05rem;
      }
      .stat {
        font-size: 1.75rem;
        font-weight: 700;
        margin: 4px 0;
      }
      .muted { color: var(--muted); font-size: 0.9rem; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }
      th, td {
        text-align: left;
        padding: 8px 6px;
        border-bottom: 1px solid var(--border);
      }
      th { color: var(--muted); font-weight: 600; }
      .num { text-align: right; font-variant-numeric: tabular-nums; }
      .status { margin: 8px 0 16px; font-size: 0.95rem; color: var(--muted); }
      .status.err { color: var(--bad); }
      .pills { display: flex; flex-wrap: wrap; gap: 8px; }
      .pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.85rem;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Owner Dashboard</h1>
          <p class="sub">Read-only aggregate telemetry and class-platform health. Zero student PII.</p>
        </div>
        <div class="bar">
          <label for="daysSelect" class="muted">Window</label>
          <select id="daysSelect">
            <option value="7">Last 7 days</option>
            <option value="14" selected>Last 14 days</option>
            <option value="30">Last 30 days</option>
          </select>
          <button type="button" id="refreshBtn">Refresh</button>
          <a href="/curriculum/" class="muted">Curriculum Hub</a>
        </div>
      </header>

      <section class="card" aria-labelledby="authHead">
        <h2 id="authHead">Teacher API Key</h2>
        <form id="keyForm" class="bar">
          <input
            id="keyInput"
            type="password"
            autocomplete="off"
            placeholder="Enter x-teacher-key"
            aria-label="Teacher API key"
          />
          <button type="submit">Load overview</button>
          <button type="button" id="clearKeyBtn" class="ghost">Clear key</button>
        </form>
        <p id="statusMsg" class="status" role="status"></p>
      </section>

      <div id="dashRoot" hidden>
        <div class="grid" id="summaryCards"></div>
        <div class="grid">
          <section class="card">
            <h2>Usage by Area</h2>
            <div id="areaTable"></div>
          </section>
          <section class="card">
            <h2>Core Web Vitals</h2>
            <div id="vitalsTable"></div>
          </section>
        </div>
        <section class="card">
          <h2>Top Pages</h2>
          <div id="pagesTable"></div>
        </section>
        <section class="card">
          <h2>Recent Field JS Errors (7d)</h2>
          <div id="errorsTable"></div>
        </section>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
