<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parent Updates · Neft Teacher</title>
    <meta
      name="description"
      content="Generate personalized bilingual (English/Spanish) family progress notes from live gradebook data. Teacher-only."
    />
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --ink: #0f2b3c;
        --muted: #5e6e7e;
        --line: #e2e7ec;
        --accent: #1a6fb5;
        --good: #157347;
        --warn: #b45309;
        --bg: #f4f6f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.5;
      }
      header {
        background: #0f2b3c;
        color: #fff;
        padding: 16px 22px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      header h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      header small {
        display: block;
        color: #9db4c6;
        font-weight: 500;
        font-size: 0.78rem;
      }
      header a {
        color: #cfe6f5;
        text-decoration: none;
        font-size: 0.85rem;
      }
      .wrap {
        max-width: 1000px;
        margin: 0 auto;
        padding: 22px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 18px;
      }
      label {
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      select,
      input,
      button {
        font: inherit;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
      }
      button {
        cursor: pointer;
        font-weight: 600;
        background: #0f2b3c;
        color: #fff;
        border: none;
      }
      button.ghost {
        background: #eef2f5;
        color: var(--ink);
      }
      button:active {
        transform: translateY(1px);
      }
      .grow {
        flex: 1;
      }
      #msg {
        min-height: 1.2em;
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 2px 14px;
      }
      #msg.err {
        color: #b42318;
      }
      #msg.ok {
        color: var(--good);
      }
      /* Gate */
      .gate {
        max-width: 420px;
        margin: 8vh auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 26px;
        text-align: center;
        box-shadow: 0 6px 24px rgba(15, 43, 60, 0.08);
      }
      .gate input {
        width: 100%;
        margin: 12px 0;
        text-align: center;
      }
      .gate button {
        width: 100%;
      }
      /* Notes */
      .parent-note {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px;
        margin: 0 0 20px;
        box-shadow: 0 2px 10px rgba(15, 43, 60, 0.05);
      }
      .pn-head {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
        margin-bottom: 12px;
      }
      .pn-class {
        color: var(--accent);
        font-weight: 700;
      }
      .pn-meta {
        color: var(--muted);
        font-size: 13px;
      }
      .pn-print {
        background: #eef2f5;
        color: var(--ink);
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 8px;
      }
      .pn-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: flex-start;
      }
      .pn-log[disabled] {
        color: var(--good);
        cursor: default;
        opacity: 1;
      }
      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      @media (max-width: 680px) {
        .cols {
          grid-template-columns: 1fr;
        }
      }
      .lang {
        background: #fbfdff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .lang h2 {
        margin: 2px 0 4px;
        font-size: 18px;
      }
      .lang h3 {
        font-size: 14px;
        margin: 14px 0 4px;
      }
      .lang .flag {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .lang ul {
        margin: 6px 0;
        padding-left: 20px;
      }
      @media print {
        header,
        .bar,
        #msg,
        .pn-print {
          display: none;
        }
        body {
          background: #fff;
        }
        .parent-note {
          break-inside: avoid;
          box-shadow: none;
        }
        body.printing-one .parent-note:not(.print-target) {
          display: none;
        }
      }
    </style>
    <!-- mobile-access-injected:begin (shared mobile a11y — tools/inject-mobile-access.js) -->
    <link rel="stylesheet" href="/assets/mobile-access.css" />
    <!-- mobile-access-injected:end -->
    <!-- support-profile-injected:begin (persistent support profile — tools/inject-support-profile.js) -->
  <link rel="stylesheet" href="/shared/support/support-profile.css">
  <!-- support-profile-injected:end -->
</head>
  <body>
    <header>
      <h1>👪 Parent Updates <small>Bilingual family progress notes · teacher-only</small></h1>
      <div>
        <a href="/teacher-tools/">← Teacher Tools</a> &nbsp;
        <a href="/teacher-tools/gradebook/">Gradebook</a>
      </div>
    </header>

    <div id="app" class="wrap" hidden>
      <div class="bar">
        <div>
          <label for="section">Class</label><br /><select id="section">
            <option value="">All classes</option>
          </select>
        </div>
        <div>
          <label for="mode">View</label><br /><select id="mode">
            <option value="notes">Progress notes</option>
            <option value="weekly">Weekly digest</option>
          </select>
        </div>
        <div class="grow"></div>
        <button class="ghost" id="refresh">↻ Refresh from gradebook</button>
        <button id="printAll">🖨 Print all</button>
        <button class="ghost" id="signout">Sign out</button>
      </div>
      <div id="msg"></div>
      <div id="notes"></div>
    </div>

    <div id="gate" class="gate" hidden>
      <h2>Teacher sign-in</h2>
      <p class="pn-meta">
        Enter your teacher key to load gradebook data. Nothing is stored on any server; notes are
        built in your browser.
      </p>
      <input id="gateKey" type="password" placeholder="Teacher key" autocomplete="off" />
      <button id="gateGo">Unlock</button>
      <p id="gateMsg" class="pn-meta"></p>
    </div>

    <script src="/curriculum/lesson-family-homework.js"></script>
    <script>
      const LS_KEY = "neft.teacher.key";
      const API = "/api/progress";
      const STRONG = 85,
        PRACTICE_BELOW = 70;
      const $ = (s) => document.querySelector(s);
      let rows = [];
      let digest = null; // GET /api/progress/digest response (weekly mode)

      /* ---- mastery phrasing (mirror scripts/lib/parent-note.mjs) ---- */
      function bandInfo(pct) {
        if (pct == null || Number.isNaN(pct))
          return { en: "is just getting started this term.", es: "está comenzando este período." };
        if (pct >= STRONG)
          return {
            en: "is doing excellent work in math.",
            es: "está haciendo un trabajo excelente en matemáticas.",
          };
        if (pct >= 70)
          return { en: "is doing well and is on track.", es: "va bien y está en camino." };
        if (pct >= 60)
          return {
            en: "is making steady progress and building skills.",
            es: "está progresando de manera constante y desarrollando habilidades.",
          };
        return {
          en: "would benefit from some extra practice at home.",
          es: "se beneficiaría de práctica adicional en casa.",
        };
      }
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const num = (v) => (v === "" || v == null || !Number.isFinite(Number(v)) ? null : Number(v));
      const firstName = (n) =>
        String(n || "your child")
          .trim()
          .split(/\s+/)[0] || "your child";
      const liList = (arr) => arr.map((t) => `<li>${esc(t)}</li>`).join("");

      function summarize(grades) {
        const acts = grades.activities || [];
        return (grades.rows || []).map((row) => {
          const cells = row.slice(2, 2 + acts.length);
          const scored = acts
            .map((title, i) => ({ title, score: num(cells[i]) }))
            .filter((a) => a.score != null);
          return {
            name: row[0],
            section: row[1],
            average: num(row[row.length - 1]),
            completed: scored.length,
            strengths: scored.filter((a) => a.score >= STRONG).map((a) => a.title),
            practice: scored.filter((a) => a.score < PRACTICE_BELOW).map((a) => a.title),
          };
        });
      }

      function noteHTML(s) {
        const b = bandInfo(s.average);
        const avg = s.average == null ? "—" : s.average + "%";
        const fn = esc(firstName(s.name));
        const strEn = s.strengths.length
          ? `<ul>${liList(s.strengths)}</ul>`
          : "<p>Keep up the great effort!</p>";
        const strEs = s.strengths.length
          ? `<ul>${liList(s.strengths)}</ul>`
          : "<p>¡Sigan con el gran esfuerzo!</p>";
        const prEn = s.practice.length
          ? `<ul>${liList(s.practice)}</ul><p>Try the <strong>Spiral Review</strong> together at eduwonderlab.com/spiral-review — 5 minutes a few nights a week makes a big difference.</p>`
          : "<p>Nothing specific to reteach right now — a few minutes of Spiral Review keeps skills sharp.</p>";
        const prEs = s.practice.length
          ? `<ul>${liList(s.practice)}</ul><p>Practiquen juntos el <strong>Repaso en Espiral</strong> en eduwonderlab.com/spiral-review — 5 minutos algunas noches por semana hacen una gran diferencia.</p>`
          : "<p>Nada específico que repasar por ahora — unos minutos de Repaso en Espiral mantienen las habilidades firmes.</p>";
        return (
          `<article class="parent-note"><header class="pn-head">` +
          `<div><strong>${esc(s.name || "Student")}</strong> · <span class="pn-class">${esc(s.section || "")}</span>` +
          ` <span class="pn-meta">avg ${avg} · ${s.completed} done</span></div>` +
          `<div class="pn-actions"><button class="pn-print pn-log" type="button" data-student="${esc(s.name || "Student")}">＋ Log contact</button>` +
          `<button class="pn-print" type="button">🖨 Print this</button></div></header>` +
          `<div class="cols"><div class="lang"><span class="flag">🇺🇸 English</span>` +
          `<h2>How ${fn} is doing</h2><p>${fn} ${b.en}${s.average == null ? "" : ` (average ${avg}).`}</p>` +
          `<h3>Strengths</h3>${strEn}<h3>Let's practice at home</h3>${prEn}</div>` +
          `<div class="lang"><span class="flag">🇲🇽 Español</span>` +
          `<h2>Cómo va ${fn}</h2><p>${fn} ${b.es}${s.average == null ? "" : ` (promedio ${avg}).`}</p>` +
          `<h3>Fortalezas</h3>${strEs}<h3>Practiquemos en casa</h3>${prEs}</div></div></article>`
        );
      }

      /* ---- weekly digest (mirror buildWeeklyDigest in scripts/lib/parent-note.mjs) ---- */
      function homeworkFor(activityId) {
        const map = window.LESSON_FAMILY_HOMEWORK;
        if (!activityId || !map) return null;
        const id = String(activityId);
        if (map[id]) return map[id];
        const m = id.match(/(\d{1,2}-\d{1,2}(?:-flagship)?)$/);
        return (m && map[m[1]]) || null;
      }

      function digestHTML(s) {
        const acts = Array.isArray(s.activities) ? s.activities : [];
        const scored = acts.filter((a) => a && num(a.scorePct) != null);
        const avg = scored.length
          ? Math.round(scored.reduce((t, a) => t + Number(a.scorePct), 0) / scored.length)
          : null;
        const b = bandInfo(avg);
        const fn = esc(firstName(s.studentName));
        const counts = s.telemetryCounts || {};
        const checkins = Number(counts["family-checkin"]) || 0;
        const mastery = Array.isArray(s.masteryReached) ? s.masteryReached.filter(Boolean) : [];

        const actLine = (a) => {
          const bits = [];
          if (num(a.progressPercent) != null)
            bits.push(`${Math.round(Number(a.progressPercent))}%`);
          if (num(a.scorePct) != null) bits.push(`score ${Math.round(Number(a.scorePct))}%`);
          return `${a.activityTitle || a.activityId || "Activity"}${bits.length ? ` — ${bits.join(" · ")}` : ""}`;
        };
        const shown = acts.slice(0, 8);
        const more = acts.length - shown.length;
        const workedEn = acts.length
          ? `<ul>${liList(shown.map(actLine))}</ul>${more > 0 ? `<p>…and ${more} more.</p>` : ""}`
          : "<p>No logged activity this week — a fresh week starts now!</p>";
        const workedEs = acts.length
          ? `<ul>${liList(shown.map(actLine))}</ul>${more > 0 ? `<p>…y ${more} más.</p>` : ""}`
          : "<p>No hay actividad registrada esta semana — ¡una nueva semana comienza ahora!</p>";

        const masteryEn = mastery.length
          ? `<p>New skills mastered this week: <strong>${esc(mastery.join(", "))}</strong> 🎉</p>`
          : "<p>Still working toward the next mastery check — steady progress counts!</p>";
        const masteryEs = mastery.length
          ? `<p>Nuevas habilidades dominadas esta semana: <strong>${esc(mastery.join(", "))}</strong> 🎉</p>`
          : "<p>Seguimos trabajando hacia el próximo logro — ¡el progreso constante cuenta!</p>";

        const byScore = [...scored].sort((a, z) => Number(a.scorePct) - Number(z.scorePct));
        const weakest =
          byScore.length && Number(byScore[0].scorePct) < PRACTICE_BELOW ? byScore[0] : null;
        const strongest = byScore.length ? byScore[byScore.length - 1] : null;
        const askTarget = weakest || strongest;
        let askEn, askEs;
        if (weakest) {
          const t = esc(weakest.activityTitle || weakest.activityId);
          askEn = `Ask ${fn} to walk you through one problem from “${t}” — explaining it out loud is the fastest way to lock it in.`;
          askEs = `Pídale a ${fn} que le explique un problema de “${t}” — explicarlo en voz alta es la manera más rápida de dominarlo.`;
        } else if (strongest) {
          const t = esc(strongest.activityTitle || strongest.activityId);
          askEn = `Ask ${fn} to teach you something from “${t}” — they did great work there this week.`;
          askEs = `Pídale a ${fn} que le enseñe algo de “${t}” — hizo un gran trabajo allí esta semana.`;
        } else {
          askEn = `Ask ${fn} what math class is about this week.`;
          askEs = `Pregúntele a ${fn} de qué trata la clase de matemáticas esta semana.`;
        }

        let hw = null,
          hwTitle = "";
        for (const a of [askTarget, ...acts]) {
          if (!a) continue;
          const hit = homeworkFor(a.activityId);
          if (hit && hit.href) {
            hw = hit;
            hwTitle = a.activityTitle || a.activityId || "";
            break;
          }
        }
        const hwEn = hw
          ? `<p><strong>5-minute home activity:</strong> <a href="${esc(hw.href)}">Try the family activity for “${esc(hwTitle)}”</a> — quick, hands-on, and made for families.</p>`
          : "";
        const hwEs = hw
          ? `<p><strong>Actividad de 5 minutos en casa:</strong> <a href="${esc(hw.href)}">Prueben la actividad familiar de “${esc(hwTitle)}”</a> — rápida, práctica y hecha para las familias.</p>`
          : "";
        const checkinEn =
          checkins > 0
            ? `<p>Family practice logged ✅ ${checkins}× this week — thank you!</p>`
            : "";
        const checkinEs =
          checkins > 0
            ? `<p>Práctica en familia registrada ✅ ${checkins} veces esta semana — ¡gracias!</p>`
            : "";
        const avgText = avg == null ? "" : ` (average ${avg}%).`;
        const avgTextEs = avg == null ? "" : ` (promedio ${avg}%).`;

        return (
          `<article class="parent-note"><header class="pn-head">` +
          `<div><strong>${esc(s.studentName || "Student")}</strong> · <span class="pn-class">${esc(s.section || "")}</span>` +
          ` <span class="pn-meta">weekly digest · ${acts.length} activit${acts.length === 1 ? "y" : "ies"}</span></div>` +
          `<div class="pn-actions"><button class="pn-print pn-log" type="button" data-student="${esc(s.studentName || "Student")}">＋ Log contact</button>` +
          `<button class="pn-print" type="button">🖨 Print this</button></div></header>` +
          `<div class="cols"><div class="lang"><span class="flag">🇺🇸 English</span>` +
          `<h2>${fn}'s week in math</h2><p>${fn} ${b.en}${avgText}</p>` +
          `<h3>What we worked on</h3>${workedEn}` +
          `<h3>Mastery reached</h3>${masteryEn}` +
          `<h3>One thing to ask your child</h3><p>${askEn}</p>${hwEn}${checkinEn}</div>` +
          `<div class="lang"><span class="flag">🇲🇽 Español</span>` +
          `<h2>La semana de ${fn} en matemáticas</h2><p>${fn} ${b.es}${avgTextEs}</p>` +
          `<h3>En qué trabajamos</h3>${workedEs}` +
          `<h3>Dominio alcanzado</h3>${masteryEs}` +
          `<h3>Algo para preguntarle a su hijo/a</h3><p>${askEs}</p>${hwEs}${checkinEs}</div></div></article>`
        );
      }

      function renderSections(summaries) {
        const sel = $("#section");
        const sections = [...new Set(summaries.map((s) => s.section).filter(Boolean))].sort();
        sel.innerHTML =
          '<option value="">All classes</option>' +
          sections.map((s) => `<option>${esc(s)}</option>`).join("");
      }

      function render() {
        const filter = $("#section").value;
        if ($("#mode").value === "weekly") {
          let list = (digest && digest.students) || [];
          if (filter) list = list.filter((s) => String(s.section) === filter);
          $("#notes").innerHTML = list.length
            ? list.map(digestHTML).join("")
            : '<p class="pn-meta">No student activity in the last 7 days for this class.</p>';
          $("#msg").textContent =
            `${list.length} digest(s) · last 7 days · built in your browser · not saved anywhere.`;
          $("#msg").className = "";
          return;
        }
        let list = summarize({ activities: rows.activities, rows: rows.rows });
        if (filter) list = list.filter((s) => String(s.section) === filter);
        $("#notes").innerHTML = list.length
          ? list.map(noteHTML).join("")
          : '<p class="pn-meta">No students in this class yet.</p>';
        $("#msg").textContent =
          `${list.length} note(s) · built in your browser · not saved anywhere.`;
        $("#msg").className = "";
      }

      async function loadWeekly() {
        const key = localStorage.getItem(LS_KEY);
        if (!key) return showGate();
        $("#msg").textContent = "Loading weekly digest…";
        $("#msg").className = "";
        try {
          const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
          const r = await fetch(`${API}/digest?since=${encodeURIComponent(since)}`, {
            headers: { "x-teacher-key": key },
          });
          if (r.status === 401) {
            localStorage.removeItem(LS_KEY);
            return showGate("That key was rejected. Try again.");
          }
          if (r.status === 503) {
            $("#msg").textContent =
              "The digest backend isn't configured yet (no TEACHER_KEY on the server).";
            $("#msg").className = "err";
            return;
          }
          const d = await r.json();
          if (!d.ok) throw new Error(d.error || "load failed");
          digest = d;
          const secs = [...new Set(d.students.map((s) => s.section).filter(Boolean))].sort();
          const sel = $("#section");
          if (sel.options.length <= 1)
            sel.innerHTML =
              '<option value="">All classes</option>' +
              secs.map((s) => `<option>${esc(s)}</option>`).join("");
          render();
        } catch (e) {
          $("#msg").textContent = "Could not load digest: " + e.message;
          $("#msg").className = "err";
        }
      }

      async function load() {
        const key = localStorage.getItem(LS_KEY);
        if (!key) return showGate();
        $("#msg").textContent = "Loading gradebook…";
        $("#msg").className = "";
        try {
          const r = await fetch(`${API}/grades?format=json`, { headers: { "x-teacher-key": key } });
          if (r.status === 401) {
            localStorage.removeItem(LS_KEY);
            return showGate("That key was rejected. Try again.");
          }
          if (r.status === 503) {
            $("#msg").textContent =
              "The gradebook backend isn't configured yet (no TEACHER_KEY on the server).";
            $("#msg").className = "err";
            return;
          }
          const d = await r.json();
          if (!d.ok) throw new Error(d.error || "load failed");
          rows = d;
          renderSections(summarize(d));
          render();
        } catch (e) {
          $("#msg").textContent = "Could not load gradebook: " + e.message;
          $("#msg").className = "err";
        }
      }

      function showGate(msg) {
        $("#app").hidden = true;
        $("#gate").hidden = false;
        $("#gateMsg").textContent = msg || "";
      }
      function showApp() {
        $("#gate").hidden = true;
        $("#app").hidden = false;
      }

      $("#gateGo").addEventListener("click", () => {
        const k = $("#gateKey").value.trim();
        if (!k) return;
        localStorage.setItem(LS_KEY, k);
        $("#gateKey").value = "";
        showApp();
        load();
      });
      $("#gateKey").addEventListener("keydown", (e) => e.key === "Enter" && $("#gateGo").click());
      $("#section").addEventListener("change", render);
      $("#mode").addEventListener("change", () => {
        if ($("#mode").value === "weekly" && !digest) return loadWeekly();
        render();
      });
      $("#refresh").addEventListener("click", () => {
        if ($("#mode").value === "weekly") return loadWeekly();
        load();
      });
      $("#printAll").addEventListener("click", () => {
        document.body.classList.remove("printing-one");
        window.print();
      });
      $("#signout").addEventListener("click", () => {
        localStorage.removeItem(LS_KEY);
        showGate("Signed out.");
      });
      $("#notes").addEventListener("click", (e) => {
        const btn = e.target.closest(".pn-print");
        if (!btn || btn.classList.contains("pn-log")) return;
        const note = btn.closest(".parent-note");
        document
          .querySelectorAll(".parent-note")
          .forEach((n) => n.classList.remove("print-target"));
        note.classList.add("print-target");
        document.body.classList.add("printing-one");
        window.print();
      });

      /* ---- log a shared note into the Parent Contact Log (same-origin localStorage) ---- */
      const CONTACT_LOG_KEY = "nt-parent-contact-log-v1";
      const todayISO = () => {
        const d = new Date();
        const p = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
      };
      $("#notes").addEventListener("click", (e) => {
        const btn = e.target.closest(".pn-log");
        if (!btn || btn.disabled) return;
        const student = btn.getAttribute("data-student") || "Student";
        let log = [];
        try {
          const parsed = JSON.parse(localStorage.getItem(CONTACT_LOG_KEY));
          if (Array.isArray(parsed)) log = parsed;
        } catch (_) {
          log = [];
        }
        log.push({
          id: "pu" + Date.now() + "-" + Math.floor(Math.random() * 1e6),
          date: todayISO(),
          student,
          guardian: "",
          method: "Note home",
          reason: "Academic",
          summary: "Progress note shared (strengths + practice focus).",
          followUp: false,
          followUpDate: "",
          outcome: "",
        });
        try {
          localStorage.setItem(CONTACT_LOG_KEY, JSON.stringify(log));
        } catch (_) {
          /* storage full/blocked — keep UI responsive, do not throw */
        }
        btn.textContent = "✓ Logged";
        btn.disabled = true;
        $("#msg").textContent = "Logged to Parent Contact Log.";
        $("#msg").className = "ok";
      });

      if (localStorage.getItem(LS_KEY)) {
        showApp();
        load();
      } else {
        showGate();
      }
    </script>
    <!-- support-profile-injected:begin (persistent support profile — tools/inject-support-profile.js) -->
  <script src="/shared/support/support-profile.js" defer></script>
  <!-- support-profile-injected:end -->
</body>
</html>
