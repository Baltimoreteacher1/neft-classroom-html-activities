<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parent Updates · Neft Teacher</title>
    <meta
      name="description"
      content="Generate personalized bilingual (English/Spanish) family progress notes from live gradebook data. Teacher-only."
    />
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --ink: #0f2b3c;
        --muted: #5e6e7e;
        --line: #e2e7ec;
        --accent: #1a6fb5;
        --good: #157347;
        --warn: #b45309;
        --bg: #f4f6f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.5;
      }
      header {
        background: #0f2b3c;
        color: #fff;
        padding: 16px 22px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      header h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      header small {
        display: block;
        color: #9db4c6;
        font-weight: 500;
        font-size: 0.78rem;
      }
      header a {
        color: #cfe6f5;
        text-decoration: none;
        font-size: 0.85rem;
      }
      .wrap {
        max-width: 1000px;
        margin: 0 auto;
        padding: 22px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 18px;
      }
      label {
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      select,
      input,
      button {
        font: inherit;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
      }
      button {
        cursor: pointer;
        font-weight: 600;
        background: #0f2b3c;
        color: #fff;
        border: none;
      }
      button.ghost {
        background: #eef2f5;
        color: var(--ink);
      }
      button:active {
        transform: translateY(1px);
      }
      .grow {
        flex: 1;
      }
      #msg {
        min-height: 1.2em;
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 2px 14px;
      }
      #msg.err {
        color: #b42318;
      }
      #msg.ok {
        color: var(--good);
      }
      /* Gate */
      .gate {
        max-width: 420px;
        margin: 8vh auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 26px;
        text-align: center;
        box-shadow: 0 6px 24px rgba(15, 43, 60, 0.08);
      }
      .gate input {
        width: 100%;
        margin: 12px 0;
        text-align: center;
      }
      .gate button {
        width: 100%;
      }
      /* Notes */
      .parent-note {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px;
        margin: 0 0 20px;
        box-shadow: 0 2px 10px rgba(15, 43, 60, 0.05);
      }
      .pn-head {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
        margin-bottom: 12px;
      }
      .pn-class {
        color: var(--accent);
        font-weight: 700;
      }
      .pn-meta {
        color: var(--muted);
        font-size: 13px;
      }
      .pn-print {
        background: #eef2f5;
        color: var(--ink);
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 8px;
      }
      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      @media (max-width: 680px) {
        .cols {
          grid-template-columns: 1fr;
        }
      }
      .lang {
        background: #fbfdff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .lang h2 {
        margin: 2px 0 4px;
        font-size: 18px;
      }
      .lang h3 {
        font-size: 14px;
        margin: 14px 0 4px;
      }
      .lang .flag {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .lang ul {
        margin: 6px 0;
        padding-left: 20px;
      }
      @media print {
        header,
        .bar,
        #msg,
        .pn-print {
          display: none;
        }
        body {
          background: #fff;
        }
        .parent-note {
          break-inside: avoid;
          box-shadow: none;
        }
        body.printing-one .parent-note:not(.print-target) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>👪 Parent Updates <small>Bilingual family progress notes · teacher-only</small></h1>
      <div>
        <a href="/teacher-tools/">← Teacher Tools</a> &nbsp;
        <a href="/teacher-tools/gradebook/">Gradebook</a>
      </div>
    </header>

    <div id="app" class="wrap" hidden>
      <div class="bar">
        <div>
          <label for="section">Class</label><br /><select id="section">
            <option value="">All classes</option>
          </select>
        </div>
        <div class="grow"></div>
        <button class="ghost" id="refresh">↻ Refresh from gradebook</button>
        <button id="printAll">🖨 Print all</button>
        <button class="ghost" id="signout">Sign out</button>
      </div>
      <div id="msg"></div>
      <div id="notes"></div>
    </div>

    <div id="gate" class="gate" hidden>
      <h2>Teacher sign-in</h2>
      <p class="pn-meta">
        Enter your teacher key to load gradebook data. Nothing is stored on any server; notes are
        built in your browser.
      </p>
      <input id="gateKey" type="password" placeholder="Teacher key" autocomplete="off" />
      <button id="gateGo">Unlock</button>
      <p id="gateMsg" class="pn-meta"></p>
    </div>

    <script>
      const LS_KEY = "neft.teacher.key";
      const API = "/api/progress";
      const STRONG = 85,
        PRACTICE_BELOW = 70;
      const $ = (s) => document.querySelector(s);
      let rows = [];

      /* ---- mastery phrasing (mirror scripts/lib/parent-note.mjs) ---- */
      function bandInfo(pct) {
        if (pct == null || Number.isNaN(pct))
          return { en: "is just getting started this term.", es: "está comenzando este período." };
        if (pct >= STRONG)
          return {
            en: "is doing excellent work in math.",
            es: "está haciendo un trabajo excelente en matemáticas.",
          };
        if (pct >= 70)
          return { en: "is doing well and is on track.", es: "va bien y está en camino." };
        if (pct >= 60)
          return {
            en: "is making steady progress and building skills.",
            es: "está progresando de manera constante y desarrollando habilidades.",
          };
        return {
          en: "would benefit from some extra practice at home.",
          es: "se beneficiaría de práctica adicional en casa.",
        };
      }
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const num = (v) => (v === "" || v == null || !Number.isFinite(Number(v)) ? null : Number(v));
      const firstName = (n) =>
        String(n || "your child")
          .trim()
          .split(/\s+/)[0] || "your child";
      const liList = (arr) => arr.map((t) => `<li>${esc(t)}</li>`).join("");

      function summarize(grades) {
        const acts = grades.activities || [];
        return (grades.rows || []).map((row) => {
          const cells = row.slice(2, 2 + acts.length);
          const scored = acts
            .map((title, i) => ({ title, score: num(cells[i]) }))
            .filter((a) => a.score != null);
          return {
            name: row[0],
            section: row[1],
            average: num(row[row.length - 1]),
            completed: scored.length,
            strengths: scored.filter((a) => a.score >= STRONG).map((a) => a.title),
            practice: scored.filter((a) => a.score < PRACTICE_BELOW).map((a) => a.title),
          };
        });
      }

      function noteHTML(s) {
        const b = bandInfo(s.average);
        const avg = s.average == null ? "—" : s.average + "%";
        const fn = esc(firstName(s.name));
        const strEn = s.strengths.length
          ? `<ul>${liList(s.strengths)}</ul>`
          : "<p>Keep up the great effort!</p>";
        const strEs = s.strengths.length
          ? `<ul>${liList(s.strengths)}</ul>`
          : "<p>¡Sigan con el gran esfuerzo!</p>";
        const prEn = s.practice.length
          ? `<ul>${liList(s.practice)}</ul><p>Try the <strong>Spiral Review</strong> together at eduwonderlab.com/spiral-review — 5 minutes a few nights a week makes a big difference.</p>`
          : "<p>Nothing specific to reteach right now — a few minutes of Spiral Review keeps skills sharp.</p>";
        const prEs = s.practice.length
          ? `<ul>${liList(s.practice)}</ul><p>Practiquen juntos el <strong>Repaso en Espiral</strong> en eduwonderlab.com/spiral-review — 5 minutos algunas noches por semana hacen una gran diferencia.</p>`
          : "<p>Nada específico que repasar por ahora — unos minutos de Repaso en Espiral mantienen las habilidades firmes.</p>";
        return (
          `<article class="parent-note"><header class="pn-head">` +
          `<div><strong>${esc(s.name || "Student")}</strong> · <span class="pn-class">${esc(s.section || "")}</span>` +
          ` <span class="pn-meta">avg ${avg} · ${s.completed} done</span></div>` +
          `<button class="pn-print" type="button">🖨 Print this</button></header>` +
          `<div class="cols"><div class="lang"><span class="flag">🇺🇸 English</span>` +
          `<h2>How ${fn} is doing</h2><p>${fn} ${b.en}${s.average == null ? "" : ` (average ${avg}).`}</p>` +
          `<h3>Strengths</h3>${strEn}<h3>Let's practice at home</h3>${prEn}</div>` +
          `<div class="lang"><span class="flag">🇲🇽 Español</span>` +
          `<h2>Cómo va ${fn}</h2><p>${fn} ${b.es}${s.average == null ? "" : ` (promedio ${avg}).`}</p>` +
          `<h3>Fortalezas</h3>${strEs}<h3>Practiquemos en casa</h3>${prEs}</div></div></article>`
        );
      }

      function renderSections(summaries) {
        const sel = $("#section");
        const sections = [...new Set(summaries.map((s) => s.section).filter(Boolean))].sort();
        sel.innerHTML =
          '<option value="">All classes</option>' +
          sections.map((s) => `<option>${esc(s)}</option>`).join("");
      }

      function render() {
        const filter = $("#section").value;
        let list = summarize({ activities: rows.activities, rows: rows.rows });
        if (filter) list = list.filter((s) => String(s.section) === filter);
        $("#notes").innerHTML = list.length
          ? list.map(noteHTML).join("")
          : '<p class="pn-meta">No students in this class yet.</p>';
        $("#msg").textContent =
          `${list.length} note(s) · built in your browser · not saved anywhere.`;
        $("#msg").className = "";
      }

      async function load() {
        const key = localStorage.getItem(LS_KEY);
        if (!key) return showGate();
        $("#msg").textContent = "Loading gradebook…";
        $("#msg").className = "";
        try {
          const r = await fetch(`${API}/grades?format=json`, { headers: { "x-teacher-key": key } });
          if (r.status === 401) {
            localStorage.removeItem(LS_KEY);
            return showGate("That key was rejected. Try again.");
          }
          if (r.status === 503) {
            $("#msg").textContent =
              "The gradebook backend isn't configured yet (no TEACHER_KEY on the server).";
            $("#msg").className = "err";
            return;
          }
          const d = await r.json();
          if (!d.ok) throw new Error(d.error || "load failed");
          rows = d;
          renderSections(summarize(d));
          render();
        } catch (e) {
          $("#msg").textContent = "Could not load gradebook: " + e.message;
          $("#msg").className = "err";
        }
      }

      function showGate(msg) {
        $("#app").hidden = true;
        $("#gate").hidden = false;
        $("#gateMsg").textContent = msg || "";
      }
      function showApp() {
        $("#gate").hidden = true;
        $("#app").hidden = false;
      }

      $("#gateGo").addEventListener("click", () => {
        const k = $("#gateKey").value.trim();
        if (!k) return;
        localStorage.setItem(LS_KEY, k);
        $("#gateKey").value = "";
        showApp();
        load();
      });
      $("#gateKey").addEventListener("keydown", (e) => e.key === "Enter" && $("#gateGo").click());
      $("#section").addEventListener("change", render);
      $("#refresh").addEventListener("click", load);
      $("#printAll").addEventListener("click", () => {
        document.body.classList.remove("printing-one");
        window.print();
      });
      $("#signout").addEventListener("click", () => {
        localStorage.removeItem(LS_KEY);
        showGate("Signed out.");
      });
      $("#notes").addEventListener("click", (e) => {
        const btn = e.target.closest(".pn-print");
        if (!btn) return;
        const note = btn.closest(".parent-note");
        document
          .querySelectorAll(".parent-note")
          .forEach((n) => n.classList.remove("print-target"));
        note.classList.add("print-target");
        document.body.classList.add("printing-one");
        window.print();
      });

      if (localStorage.getItem(LS_KEY)) {
        showApp();
        load();
      } else {
        showGate();
      }
    </script>
  </body>
</html>
