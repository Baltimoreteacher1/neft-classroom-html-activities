<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Neft Learning Forecast Engine</title>
    <meta
      name="description"
      content="Plan the next instructional move: forecasts with honest ranges, what-if scenarios, small groups and expert data analysis explained in plain words. Everything stays in your browser."
    />
    <link rel="stylesheet" href="/assets/fonts/outfit-hanken-grotesk-b9bf38.css" />
    <link rel="stylesheet" href="./controls.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./views.css" />
    <!-- mobile-access-injected:begin (shared mobile a11y — tools/inject-mobile-access.js) -->
    <link rel="stylesheet" href="/assets/mobile-access.css" />
    <!-- mobile-access-injected:end -->
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="app">
      <aside class="rail" aria-label="Forecast Engine">
        <div class="brand">
          <svg
            class="brand-mark"
            width="38"
            height="38"
            viewBox="0 0 38 38"
            aria-hidden="true"
            focusable="false"
          >
            <rect width="38" height="38" rx="10" fill="#1FA6A2" />
            <polygon points="19,22 33,10 33,30" fill="#17324D" opacity="0.28" />
            <polyline
              points="5,28 12,22 19,23 33,13"
              fill="none"
              stroke="#17324D"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="19" cy="23" r="3" fill="#F2C15B" stroke="#17324D" stroke-width="2" />
          </svg>
          <div>
            <div class="brand-name">Forecast Engine</div>
            <div class="brand-sub">Neft Teacher</div>
          </div>
        </div>
        <div class="class-card">
          <div class="class-name" id="classLine">My class</div>
          <div class="class-counts" id="classCounts"></div>
        </div>
        <nav id="nav" class="nav" aria-label="Sections"></nav>
        <p class="rail-foot">Planning estimates, not labels. Your data stays in this browser.</p>
      </aside>

      <div class="main">
        <header class="top">
          <div>
            <h1 id="pageTitle" tabindex="-1">Overview</h1>
            <p id="pageSubtitle">The class at a glance and your next moves.</p>
          </div>
          <div class="top-actions">
            <span class="save" id="saveBadge" role="status">Saved on this device</span>
            <button
              class="btn icon-btn"
              id="helpBtn"
              type="button"
              aria-label="Open the plain-language guide"
            >
              ?
            </button>
            <button
              class="btn icon-btn"
              id="themeBtn"
              type="button"
              aria-label="Switch to dark mode"
              aria-pressed="false"
            ></button>
          </div>
        </header>

        <main id="main" class="content">
          <section class="panel" id="p-overview" aria-label="Overview"></section>
          <section class="panel" id="p-data" aria-label="Data" hidden></section>
          <section class="panel" id="p-forecast" aria-label="Forecast" hidden></section>
          <section class="panel" id="p-scenarios" aria-label="Scenarios" hidden></section>
          <section class="panel" id="p-analysis" aria-label="Analysis" hidden></section>
          <section class="panel" id="p-groups" aria-label="Groups" hidden></section>
          <section class="panel" id="p-reports" aria-label="Reports" hidden></section>
          <section class="panel" id="p-settings" aria-label="Settings" hidden></section>
        </main>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="tip" class="tip" role="tooltip"></div>

    <script
      src="./vendor/xlsx.full.min.js"
      onload="window.__SHEETJS_READY = true"
      onerror="window.__SHEETJS_FAILED = true"
    ></script>
    <script src="./stats.js" defer></script>
    <script src="./model.js" defer></script>
    <script src="./ui.js" defer></script>
    <script src="./store.js" defer></script>
    <script src="./importers.js" defer></script>
    <script src="./charts.js" defer></script>
    <script src="./compute.js" defer></script>
    <script src="./view-overview.js" defer></script>
    <script src="./view-data.js" defer></script>
    <script src="./view-forecast.js" defer></script>
    <script src="./view-scenarios.js" defer></script>
    <script src="./view-analysis.js" defer></script>
    <script src="./view-groups.js" defer></script>
    <script src="./view-reports.js" defer></script>
    <script src="./view-settings.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="/assets/nt-page-enhance.js" defer></script>
    <script src="/assets/math-workbench-launcher.js" defer></script>
    <script src="/assets/formula-popup.js" defer></script>
    <!-- nt-chrome-injected:begin (shared page chrome — tools/inject-nt-chrome.js) -->
    <script src="/assets/nt-chrome.js" defer></script>
    <!-- nt-chrome-injected:end -->
  </body>
</html>
