name = "shai-school"
pages_build_output_dir = "."
compatibility_date = "2026-05-25"

# Cloud sync KV binding for the Focus School planner.
# WARNING: this block IS authoritative for the production Pages project — a
# `wrangler pages deploy` applies it and will REMOVE the binding (→ 503, sync
# down for every device) if it is deleted. Do NOT remove it. The id below
# (noam-school-sync) is the live, populated production namespace that holds
# every device's routines/data.

# Real-time sync Durable Object, defined by the separately-deployed
# `focus-school-sync` Worker (see focus-school/sync-worker/). Declared here so
# every `wrangler pages deploy` keeps the binding — without this block a deploy
# drops the dashboard-added binding and /api/live 503s, silently degrading
# every device to 10s KV polling.
