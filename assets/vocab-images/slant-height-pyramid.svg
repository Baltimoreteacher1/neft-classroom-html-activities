<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Slant height of a pyramid: the height of a triangular face, measured along the slanted surface</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="24,64 108,58 136,76 52,84" fill="#e6efe9" stroke="#12355b" stroke-width="1.5"/>
<polygon points="74,18 52,84 136,76" fill="#cfe6e5" stroke="#12355b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="74,18 24,64 52,84" fill="#dce7ee" stroke="#12355b" stroke-width="2" stroke-linejoin="round"/>
<line x1="74" y1="18" x2="80" y2="70" stroke="#54677c" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="74" y1="18" x2="94" y2="80" stroke="#d9795d" stroke-width="4" stroke-linecap="round"/>
<text x="64" y="66" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#54677c" text-anchor="end">h</text>
<text x="102" y="52" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#d9795d" text-anchor="start">slant</text>
<text x="102" y="63" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#d9795d" text-anchor="start">height</text>
<text x="80" y="104" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="800" fill="#54677c" text-anchor="middle">up the slanted face, not straight up</text>
</svg>
