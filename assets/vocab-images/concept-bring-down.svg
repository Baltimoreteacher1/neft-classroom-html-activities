<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Bring down: 13 − 12 = 1, then bring down the 4 to make 14</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="23" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="51" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">13 − 12 </text>
<text x="74" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="83.9" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="53.1" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 1, then</text>
<text x="16.4" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="127.2" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">bring down the 4</text>
<text x="40.4" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="79.2" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">to make 14</text>
</svg>
