<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Order of operations: 3 + 4 × 2² → 3 + 4 × 4 → 3 + 16 = 19</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="10.7" y="51.1" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="138.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">3 + 4 × 2² → 3 + 4 ×</text>
<text x="29.8" y="72.9" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="72.3" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">4 → 3 + 16 </text>
<text x="102.1" y="72.9" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="112" y="72.9" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="18.3" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 19</text>
</svg>
