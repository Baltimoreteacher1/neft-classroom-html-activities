<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Decompose: break one figure apart into simpler shapes whose areas add back to the whole</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="14,20 42,20 42,48 62,48 62,80 14,80" fill="#1fa6a2" stroke="#12355b" stroke-width="2" stroke-linejoin="round"/>
<line x1="42" y1="48" x2="42" y2="80" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3"/>
<text x="38" y="93" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#54677c" text-anchor="middle">one figure</text>
<path d="M72 50 L88 50" stroke="#d9795d" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="88,50 82,46 82,54" fill="#d9795d"/>
<rect x="98" y="20" width="26" height="60" fill="#1fa6a2" stroke="#12355b" stroke-width="2"/>
<rect x="130" y="48" width="18" height="32" fill="#f2c15b" stroke="#12355b" stroke-width="2"/>
<text x="122" y="93" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#54677c" text-anchor="middle">simpler parts</text>
<text x="80" y="110" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#12355b" text-anchor="middle">the parts add back up</text>
</svg>
