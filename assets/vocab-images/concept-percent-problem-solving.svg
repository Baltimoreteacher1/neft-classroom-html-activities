<text x="35" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="80.1" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">Sale price </text>
<text x="115.1" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="21.2" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="117.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">original price −</text>
