<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Rates and Unit Rates: 180 miles in 3 hours = 60 miles per 1 hour.</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="30.5" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="99" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">180 miles in 3</text>
<text x="17.6" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="48" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">hours </text>
<text x="65.6" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="75.5" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="66.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 60 miles</text>
<text x="40.4" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="79.2" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">per 1 hour.</text>
</svg>
