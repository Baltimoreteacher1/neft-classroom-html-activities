<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Decimal Division Algorithm: move both points 1 place, then 18.9 ÷ 6.3 becomes 189 ÷ 63 = 3</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="80" y="25" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="800" fill="#12355b" xml:space="preserve">18.9 ÷ 6.3</text>
<path d="M62 34 q9 11 18 0" fill="none" stroke="#d9795d" stroke-width="2.4" stroke-linecap="round"/>
<path d="M80 34 l-4.5 -1 l1 4.5 z" fill="#d9795d"/>
<path d="M104 34 q9 11 18 0" fill="none" stroke="#d9795d" stroke-width="2.4" stroke-linecap="round"/>
<path d="M122 34 l-4.5 -1 l1 4.5 z" fill="#d9795d"/>
<text x="80" y="60" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="11" font-weight="700" fill="#d9795d" xml:space="preserve">move both 1 place</text>
<text x="80" y="86" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" xml:space="preserve">189 ÷ 63 = 3</text>
<line x1="34" y1="96" x2="126" y2="96" stroke="#c8bfae" stroke-width="1.6" stroke-linecap="round"/>
<text x="80" y="110" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="700" fill="#6b6355" xml:space="preserve">whole-number divisor</text>
</svg>
