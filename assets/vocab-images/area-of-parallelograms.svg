<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Area of a parallelogram: A equals base times height</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="34,24 96,24 84,60 22,60" fill="#cfe6e5" stroke="#12355b" stroke-width="2" stroke-linejoin="round"/>
<line x1="22" y1="60" x2="84" y2="60" stroke="#d9795d" stroke-width="4"/>
<line x1="52" y1="24" x2="52" y2="60" stroke="#1fa6a2" stroke-width="3" stroke-dasharray="4 3"/>
<rect x="52" y="54" width="6" height="6" fill="none" stroke="#1fa6a2" stroke-width="1.5"/>
<text x="53" y="72" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#d9795d" text-anchor="middle">b = 10 cm</text>
<text x="58" y="44" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="800" fill="#1fa6a2" text-anchor="start">h = 6</text>
<text x="126" y="36" font-family="Outfit, system-ui, sans-serif" font-size="11" font-weight="800" fill="#12355b" text-anchor="middle">A = b × h</text>
<text x="126" y="52" font-family="Outfit, system-ui, sans-serif" font-size="11" font-weight="800" fill="#1fa6a2" text-anchor="middle">= 60 cm²</text>
<text x="80" y="96" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#12355b" text-anchor="middle">A = b × h</text>
<text x="80" y="110" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#54677c" text-anchor="middle">use the perpendicular height</text>
</svg>
