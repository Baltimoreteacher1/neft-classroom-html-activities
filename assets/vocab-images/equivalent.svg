<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t" style="background:white">
<title id="t">Equivalent: 1/2, 0.5 and 2/4 all name the same point on the number line</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<!-- Three names for one value -->
<text x="80" y="26" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="800" fill="#12355b" text-anchor="middle"><tspan>1/2</tspan><tspan fill="#e2725b"> = </tspan><tspan>0.5</tspan><tspan fill="#e2725b"> = </tspan><tspan>2/4</tspan></text>
<!-- Arrow from the names down to the single shared point -->
<line x1="80" y1="34" x2="80" y2="56" stroke="#1fa6a2" stroke-width="2"/>
<path d="M80 62 L75 54 L85 54 Z" fill="#1fa6a2"/>
<!-- Number line 0 to 1 with the halfway point marked -->
<line x1="20" y1="78" x2="140" y2="78" stroke="#12355b" stroke-width="2"/>
<line x1="20" y1="72" x2="20" y2="84" stroke="#12355b" stroke-width="2"/>
<line x1="80" y1="73" x2="80" y2="83" stroke="#12355b" stroke-width="1.5"/>
<line x1="140" y1="72" x2="140" y2="84" stroke="#12355b" stroke-width="2"/>
<circle cx="80" cy="78" r="5.5" fill="#1fa6a2" stroke="#fff" stroke-width="1.5"/>
<text x="20" y="97" font-family="Outfit, system-ui, sans-serif" font-size="11" font-weight="800" fill="#12355b" text-anchor="middle">0</text>
<text x="140" y="97" font-family="Outfit, system-ui, sans-serif" font-size="11" font-weight="800" fill="#12355b" text-anchor="middle">1</text>
<text x="80" y="113" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#1fa6a2" text-anchor="middle">Three names, one exact point</text>
</svg>
