<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Perpendicular: two lines that meet to make a square corner of 90 degrees</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<line x1="24" y1="74" x2="136" y2="74" stroke="#1fa6a2" stroke-width="4" stroke-linecap="round"/>
<line x1="70" y1="18" x2="70" y2="88" stroke="#1fa6a2" stroke-width="4" stroke-linecap="round"/>
<rect x="70" y="60" width="14" height="14" fill="none" stroke="#d9795d" stroke-width="2.5"/>
<text x="104" y="56" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#d9795d" text-anchor="middle">90°</text>
<text x="80" y="104" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#12355b" text-anchor="middle">they meet at a square corner</text>
</svg>
