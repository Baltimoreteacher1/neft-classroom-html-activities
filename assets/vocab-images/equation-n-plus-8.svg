<text x="41.3" y="60" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" textLength="43.5" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">n + 8 </text>
