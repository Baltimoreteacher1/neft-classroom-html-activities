<text x="25.6" y="44.6" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#12355b" textLength="108.7" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">Each touching bar</text>
<text x="8.4" y="62" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#12355b" textLength="143.3" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">shows how many values</text>
<text x="21" y="79.4" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#12355b" textLength="118.1" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">fall in one interval.</text>
