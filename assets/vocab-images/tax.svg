<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Tax: $20 price plus 6% tax of $1.20 equals $21.20 total</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="36" y="26" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#5b6b7a" text-anchor="middle">price</text>
<text x="116" y="26" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#7a5bb0" text-anchor="middle">6% tax</text>
<rect x="12" y="32" width="48" height="30" rx="6" fill="#ffffff" stroke="#21313f" stroke-width="2"/>
<text x="36" y="52" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#21313f" text-anchor="middle">$20</text>
<text x="74" y="53" font-family="Outfit, system-ui, sans-serif" font-size="18" font-weight="800" fill="#7a5bb0" text-anchor="middle">+</text>
<rect x="90" y="32" width="52" height="30" rx="6" fill="#7a5bb0"/>
<text x="116" y="52" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">$1.20</text>
<rect x="12" y="74" width="136" height="30" rx="6" fill="#12355b"/>
<text x="80" y="94" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">you pay $21.20</text>
</svg>
