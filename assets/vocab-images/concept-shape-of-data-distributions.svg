<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Shape of Data Distributions: A long tail to the right means the distribution is skewed right.</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="10.6" y="44.6" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#12355b" textLength="138.7" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">A long tail to the right</text>
<text x="9.4" y="62" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#12355b" textLength="141.1" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">means the distribution</text>
<text x="30.7" y="79.4" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#12355b" textLength="98.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">is skewed right.</text>
</svg>
