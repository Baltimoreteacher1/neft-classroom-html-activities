<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Solve One-Step Addition and Subtraction Equations: x + 7 = 12 → x = 5</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="18.5" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="40.8" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">x + 7 </text>
<text x="59.3" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="69.2" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="49.2" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 12 → x </text>
<text x="118.4" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="128.3" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="13.2" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 5</text>
</svg>
