<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Equation: x plus 25 equals 60</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="36.6" y="60" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" textLength="52.8" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">x + 25 </text>
<text x="89.4" y="60" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#d9795d" textLength="10.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="100" y="60" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" textLength="23.4" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 60</text>
<text x="8.5" y="92" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#1fa6a2" textLength="143.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">both sides equal 60 when x = 35</text>
</svg>
