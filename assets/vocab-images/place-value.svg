<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img" aria-labelledby="t">
<title id="t">Place value: a place-value chart showing 345.6, where the 4 sits in the tens place and is worth 40</title>
<rect x="0" y="0" width="200" height="120" rx="10" fill="#f7f4ec"/>

<!-- Column headers -->
<g font-family="Outfit, system-ui, sans-serif" font-size="7" font-weight="800" fill="#12355b" text-anchor="middle">
  <rect x="8" y="22" width="36" height="16" rx="3" fill="#dff1f0" stroke="#d7e2ed" stroke-width="0.8"/>
  <text x="26" y="33" textLength="32" lengthAdjust="spacingAndGlyphs">Hundreds</text>
  <rect x="46" y="22" width="36" height="16" rx="3" fill="#dff1f0" stroke="#d7e2ed" stroke-width="0.8"/>
  <text x="64" y="33">Tens</text>
  <rect x="84" y="22" width="36" height="16" rx="3" fill="#dff1f0" stroke="#d7e2ed" stroke-width="0.8"/>
  <text x="102" y="33">Ones</text>
  <rect x="128" y="22" width="36" height="16" rx="3" fill="#fdeede" stroke="#d7e2ed" stroke-width="0.8"/>
  <text x="146" y="33">Tenths</text>
</g>

<!-- Digit cells. The tens digit is highlighted because that is the whole point
     of the term: the same digit is worth a different amount in each column. -->
<g stroke="#d7e2ed" stroke-width="1">
  <rect x="8" y="40" width="36" height="34" fill="#ffffff"/>
  <rect x="46" y="40" width="36" height="34" fill="#1fa6a2"/>
  <rect x="84" y="40" width="36" height="34" fill="#ffffff"/>
  <rect x="128" y="40" width="36" height="34" fill="#ffffff"/>
</g>
<g font-family="Outfit, system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
  <text x="26" y="64" fill="#12355b">3</text>
  <text x="64" y="64" fill="#ffffff">4</text>
  <text x="102" y="64" fill="#12355b">5</text>
  <text x="146" y="64" fill="#12355b">6</text>
</g>

<!-- The decimal point sits between the ones and tenths columns -->
<circle cx="124" cy="70" r="3.2" fill="#e07a3f"/>

<text x="64" y="86" font-family="Outfit, system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#0f6d78" text-anchor="middle">4 here means 40</text>
<text x="100" y="105" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#12355b" text-anchor="middle">345.6</text>
</svg>
