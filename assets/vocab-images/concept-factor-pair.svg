<text x="19.7" y="51.1" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="21.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">48 </text>
<text x="41.6" y="51.1" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="51.5" y="51.1" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="88.8" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 2 × 24, so 2</text>
<text x="7.3" y="72.9" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="145.5" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">packs of 24 pencils</text>
