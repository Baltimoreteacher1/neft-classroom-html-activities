<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-labelledby="t">
<title id="t">Net: a 2D pattern that folds into a 3D rectangular prism</title>
<rect x="0" y="0" width="300" height="200" rx="10" fill="#f7f4ec"/>
<!-- Cross-shaped net of a rectangular prism (6 faces) -->
<!-- Center column: top, front, bottom, back -->
<rect x="100" y="10" width="60" height="40" rx="2" fill="#fce6de" stroke="#d9795d" stroke-width="2"/>
<text x="130" y="34" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="700" fill="#d9795d" text-anchor="middle">Top</text>
<rect x="100" y="50" width="60" height="60" rx="2" fill="#1fa6a2" opacity="0.25" stroke="#1fa6a2" stroke-width="2"/>
<text x="130" y="84" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1fa6a2" text-anchor="middle">Front</text>
<rect x="100" y="110" width="60" height="40" rx="2" fill="#fce6de" stroke="#d9795d" stroke-width="2"/>
<text x="130" y="134" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="700" fill="#d9795d" text-anchor="middle">Bottom</text>
<rect x="100" y="150" width="60" height="40" rx="2" fill="#f2c15b" opacity="0.4" stroke="#f2c15b" stroke-width="2"/>
<text x="130" y="174" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="700" fill="#b8860b" text-anchor="middle">Back</text>
<!-- Side flaps: left and right of front face -->
<rect x="40" y="50" width="60" height="60" rx="2" fill="#f2c15b" opacity="0.4" stroke="#f2c15b" stroke-width="2"/>
<text x="70" y="84" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="700" fill="#b8860b" text-anchor="middle">Left</text>
<rect x="160" y="50" width="60" height="60" rx="2" fill="#f2c15b" opacity="0.4" stroke="#f2c15b" stroke-width="2"/>
<text x="190" y="84" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="700" fill="#b8860b" text-anchor="middle">Right</text>
<!-- Fold lines (dashed) -->
<line x1="100" y1="50" x2="160" y2="50" stroke="#12355b" stroke-width="1" stroke-dasharray="3"/>
<line x1="100" y1="110" x2="160" y2="110" stroke="#12355b" stroke-width="1" stroke-dasharray="3"/>
<line x1="100" y1="150" x2="160" y2="150" stroke="#12355b" stroke-width="1" stroke-dasharray="3"/>
<line x1="100" y1="50" x2="100" y2="110" stroke="#12355b" stroke-width="1" stroke-dasharray="3"/>
<line x1="160" y1="50" x2="160" y2="110" stroke="#12355b" stroke-width="1" stroke-dasharray="3"/>
<!-- Arrow icon -->
<text x="240" y="34" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#12355b" text-anchor="middle">folds into</text>
<text x="240" y="50" font-family="Outfit, system-ui, sans-serif" font-size="18" fill="#12355b" text-anchor="middle">📦</text>
</svg>
