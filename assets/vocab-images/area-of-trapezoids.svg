<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Area of a trapezoid: A equals one half times the sum of the two bases times the height</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="38,22 78,22 92,58 24,58" fill="#cfe6e5" stroke="#12355b" stroke-width="2" stroke-linejoin="round"/>
<line x1="38" y1="22" x2="78" y2="22" stroke="#d9795d" stroke-width="3.5"/>
<line x1="24" y1="58" x2="92" y2="58" stroke="#d9795d" stroke-width="3.5"/>
<path d="M54,17 L60,22 L54,27" fill="none" stroke="#1fa6a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M54,53 L60,58 L54,63" fill="none" stroke="#1fa6a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="58" y1="22" x2="58" y2="58" stroke="#1fa6a2" stroke-width="3" stroke-dasharray="4 3"/>
<rect x="58" y="52" width="6" height="6" fill="none" stroke="#1fa6a2" stroke-width="1.5"/>
<text x="58" y="16" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="800" fill="#d9795d" text-anchor="middle">b₁ = 6</text>
<text x="58" y="70" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="800" fill="#d9795d" text-anchor="middle">b₂ = 10</text>
<text x="53" y="44" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="800" fill="#1fa6a2" text-anchor="end">h = 4</text>
<text x="126" y="34" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#12355b" text-anchor="middle">½(6 + 10)4</text>
<text x="126" y="50" font-family="Outfit, system-ui, sans-serif" font-size="11" font-weight="800" fill="#1fa6a2" text-anchor="middle">= 32</text>
<text x="80" y="94" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#12355b" text-anchor="middle">A = ½(b₁ + b₂)h</text>
<text x="80" y="110" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#54677c" text-anchor="middle">add the bases, then take half</text>
</svg>
