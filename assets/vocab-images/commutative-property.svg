<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Commutative property: the order can swap and the sum stays the same</title>
<defs>
<marker id="cah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#536174"/>
</marker>
</defs>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="46" y="40" font-family="Outfit, system-ui, sans-serif" font-size="17" font-weight="800" fill="#1fa6a2" text-anchor="middle">3</text>
<text x="70" y="40" font-family="Outfit, system-ui, sans-serif" font-size="17" font-weight="800" fill="#12355b" text-anchor="middle">+</text>
<text x="94" y="40" font-family="Outfit, system-ui, sans-serif" font-size="17" font-weight="800" fill="#d9795d" text-anchor="middle">7</text>
<path d="M50 46 q26 18 42 24" stroke="#1fa6a2" stroke-width="2" fill="none" marker-end="url(#cah)"/>
<path d="M90 46 q-26 18 -42 24" stroke="#d9795d" stroke-width="2" fill="none" marker-end="url(#cah)"/>
<text x="46" y="90" font-family="Outfit, system-ui, sans-serif" font-size="17" font-weight="800" fill="#d9795d" text-anchor="middle">7</text>
<text x="70" y="90" font-family="Outfit, system-ui, sans-serif" font-size="17" font-weight="800" fill="#12355b" text-anchor="middle">+</text>
<text x="94" y="90" font-family="Outfit, system-ui, sans-serif" font-size="17" font-weight="800" fill="#1fa6a2" text-anchor="middle">3</text>
<text x="132" y="66" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="800" fill="#12355b" text-anchor="middle">= 10</text>
</svg>
