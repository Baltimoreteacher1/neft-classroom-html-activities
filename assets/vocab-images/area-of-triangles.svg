<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Area of a triangle: A equals one half times base times height</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="24,58 92,58 74,20" fill="#cfe6e5" stroke="#12355b" stroke-width="2" stroke-linejoin="round"/>
<line x1="24" y1="58" x2="92" y2="58" stroke="#d9795d" stroke-width="4"/>
<line x1="74" y1="20" x2="74" y2="58" stroke="#1fa6a2" stroke-width="3" stroke-dasharray="4 3"/>
<rect x="68" y="52" width="6" height="6" fill="none" stroke="#1fa6a2" stroke-width="1.5"/>
<text x="52" y="70" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#d9795d" text-anchor="middle">b = 8 cm</text>
<text x="66" y="48" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="800" fill="#1fa6a2" text-anchor="end">h = 5</text>
<text x="126" y="34" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#12355b" text-anchor="middle">½ × 8 × 5</text>
<text x="126" y="50" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#1fa6a2" text-anchor="middle">= 20 cm²</text>
<text x="80" y="94" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#12355b" text-anchor="middle">A = ½ b h</text>
<text x="80" y="110" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#54677c" text-anchor="middle">half of the parallelogram</text>
</svg>
