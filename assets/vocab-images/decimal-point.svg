<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img" aria-labelledby="t">
<title id="t">Decimal point: in 12.5 the dot between the 2 and the 5 separates the whole-number places from the parts smaller than one</title>
<rect x="0" y="0" width="200" height="120" rx="10" fill="#f7f4ec"/>

<!-- Side labels -->
<g font-family="Outfit, system-ui, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">
  <text x="58" y="32" fill="#12355b">whole numbers</text>
  <text x="150" y="32" fill="#b45f2f">parts of one</text>
</g>

<!-- The number 12.5 with the decimal point highlighted -->
<g font-family="Outfit, system-ui, sans-serif" font-size="30" font-weight="800" text-anchor="middle">
  <text x="42" y="72" fill="#12355b">1</text>
  <text x="70" y="72" fill="#12355b">2</text>
  <circle cx="100" cy="66" r="12" fill="#1fa6a2"/>
  <circle cx="100" cy="66" r="4" fill="#ffffff"/>
  <text x="152" y="72" fill="#12355b">5</text>
</g>

<!-- Divider hint under the point -->
<line x1="100" y1="82" x2="100" y2="94" stroke="#1fa6a2" stroke-width="2" stroke-dasharray="3,2"/>

<g font-family="Outfit, system-ui, sans-serif" text-anchor="middle">
  <text x="100" y="106" font-size="8" font-weight="700" fill="#54677c">the dot that separates ones from tenths</text>
</g>
</svg>
