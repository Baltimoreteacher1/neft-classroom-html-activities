<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Convert Measurement Units: 3 feet × 12 inches per foot = 36 inches.</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="13.1" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="133.8" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">3 feet × 12 inches</text>
<text x="29.1" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="69.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">per foot </text>
<text x="99.1" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="109" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="21.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 36</text>
<text x="53.6" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="52.8" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">inches.</text>
</svg>
