<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Rational Numbers on the Number Line: −1/2 and −0.5 name the same point.</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<line x1="16" y1="46" x2="144" y2="46" stroke="#12355b" stroke-width="2.5"/>
<polygon points="144,46 136,41 136,51" fill="#12355b"/>
<polygon points="16,46 24,41 24,51" fill="#12355b"/>
<line x1="16" y1="40" x2="16" y2="52" stroke="#12355b" stroke-width="1.6"/>
<text x="16" y="64" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#12355b" text-anchor="middle">-1</text>
<line x1="32" y1="42.5" x2="32" y2="49.5" stroke="#12355b" stroke-width="1"/>
<line x1="48" y1="42.5" x2="48" y2="49.5" stroke="#12355b" stroke-width="1"/>
<line x1="64" y1="42.5" x2="64" y2="49.5" stroke="#12355b" stroke-width="1"/>
<line x1="80" y1="40" x2="80" y2="52" stroke="#12355b" stroke-width="1.6"/>
<text x="80" y="64" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#12355b" text-anchor="middle">0</text>
<line x1="96" y1="42.5" x2="96" y2="49.5" stroke="#12355b" stroke-width="1"/>
<line x1="112" y1="42.5" x2="112" y2="49.5" stroke="#12355b" stroke-width="1"/>
<line x1="128" y1="42.5" x2="128" y2="49.5" stroke="#12355b" stroke-width="1"/>
<line x1="144" y1="40" x2="144" y2="52" stroke="#12355b" stroke-width="1.6"/>
<text x="144" y="64" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#12355b" text-anchor="middle">1</text>
<circle cx="48" cy="46" r="5" fill="#d9795d"/>
<text x="48" y="34" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#d9795d" text-anchor="middle">−1/2 = −0.5</text>
<text x="8.8" y="77" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="142.5" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">−1/2 and −0.5 name</text>
<text x="20.9" y="98" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="118.2" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">the same point.</text>
</svg>
