<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Rational Numbers on the Number Line: −3/2 sits halfway between −2 and −1, and 1/2 sits halfway between 0 and 1. Integers, fractions and decimals all take exact positions on the same line.</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<line x1="16" y1="46" x2="144" y2="46" stroke="#12355b" stroke-width="2.5"/>
<polygon points="144,46 136,41 136,51" fill="#12355b"/>
<polygon points="16,46 24,41 24,51" fill="#12355b"/>
<line x1="16" y1="40" x2="16" y2="52" stroke="#12355b" stroke-width="1.6"/>
<text x="16" y="64" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#12355b" text-anchor="middle">-2</text>
<line x1="32" y1="42.5" x2="32" y2="49.5" stroke="#12355b" stroke-width="1"/>
<line x1="48" y1="40" x2="48" y2="52" stroke="#12355b" stroke-width="1.6"/>
<text x="48" y="64" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#12355b" text-anchor="middle">-1</text>
<line x1="64" y1="42.5" x2="64" y2="49.5" stroke="#12355b" stroke-width="1"/>
<line x1="80" y1="40" x2="80" y2="52" stroke="#12355b" stroke-width="1.6"/>
<text x="80" y="64" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#12355b" text-anchor="middle">0</text>
<line x1="96" y1="42.5" x2="96" y2="49.5" stroke="#12355b" stroke-width="1"/>
<line x1="112" y1="40" x2="112" y2="52" stroke="#12355b" stroke-width="1.6"/>
<text x="112" y="64" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#12355b" text-anchor="middle">1</text>
<line x1="128" y1="42.5" x2="128" y2="49.5" stroke="#12355b" stroke-width="1"/>
<line x1="144" y1="40" x2="144" y2="52" stroke="#12355b" stroke-width="1.6"/>
<text x="144" y="64" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#12355b" text-anchor="middle">2</text>
<circle cx="16" cy="46" r="3.5" fill="#d9795d"/>
<circle cx="32" cy="46" r="5" fill="#d9795d"/>
<text x="32" y="34" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#d9795d" text-anchor="middle">−3/2 = −1.5</text>
<circle cx="80" cy="46" r="3.5" fill="#d9795d"/>
<circle cx="96" cy="46" r="5" fill="#d9795d"/>
<text x="96" y="34" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#d9795d" text-anchor="middle">1/2 = 0.5</text>
<circle cx="144" cy="46" r="3.5" fill="#d9795d"/>
<text x="19.7" y="84" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#12355b" textLength="27" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">−3/2 </text>
<text x="46.7" y="84" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#d9795d" textLength="6.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="53.3" y="84" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#12355b" textLength="63" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> −1.5 and 1/2 </text>
<text x="116.3" y="84" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#d9795d" textLength="6.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="122.9" y="84" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#12355b" textLength="17.4" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 0.5</text>
<text x="9.7" y="98" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#12355b" textLength="140.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">each sit at one exact point.</text>
</svg>
