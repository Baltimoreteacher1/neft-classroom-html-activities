<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Relationship: how two quantities move together</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<rect x="14" y="30" width="46" height="22" rx="6" fill="#1fa6a2"/><text x="37" y="46" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#fff">hours</text><rect x="100" y="30" width="46" height="22" rx="6" fill="#e4572e"/><text x="123" y="46" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#fff">miles</text><path d="M62 41 h34" fill="none" stroke="#9bb0c3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 35 l8 6 l-8 6" fill="none" stroke="#9bb0c3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="76" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1f2a37">1 hour → 48 miles</text><text x="80" y="96" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1f2a37">2 hours → 96 miles</text>
</svg>
