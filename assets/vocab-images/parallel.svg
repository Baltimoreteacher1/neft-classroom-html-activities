<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Parallel: two lines that stay the same distance apart and never meet</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<line x1="20" y1="36" x2="140" y2="36" stroke="#1fa6a2" stroke-width="4" stroke-linecap="round"/>
<line x1="20" y1="72" x2="140" y2="72" stroke="#1fa6a2" stroke-width="4" stroke-linecap="round"/>
<path d="M62,31 L68,36 L62,41" fill="none" stroke="#1fa6a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M62,67 L68,72 L62,77" fill="none" stroke="#1fa6a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g stroke="#d9795d" stroke-width="1.5" stroke-dasharray="3 2">
<line x1="32" y1="36" x2="32" y2="72"/>
<line x1="128" y1="36" x2="128" y2="72"/>
</g>
<text x="80" y="58" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#d9795d" text-anchor="middle">same distance apart</text>
<text x="80" y="92" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#12355b" text-anchor="middle">they never meet</text>
<text x="80" y="108" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#54677c" text-anchor="middle">matching arrows = parallel</text>
</svg>
