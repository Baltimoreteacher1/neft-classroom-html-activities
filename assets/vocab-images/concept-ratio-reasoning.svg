<text x="8.1" y="83" font-family="Outfit, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#12355b" textLength="143.8" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">notebooks cost $10.</text>
