<text x="29.3" y="60" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" textLength="76.8" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">3/4 ÷ 1/8 </text>
<text x="106.1" y="60" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#d9795d" textLength="10.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="116.6" y="60" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" textLength="14.1" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 6</text>
<text x="11.3" y="92" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="800" fill="#1fa6a2" textLength="137.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">both sides name the same amount</text>
