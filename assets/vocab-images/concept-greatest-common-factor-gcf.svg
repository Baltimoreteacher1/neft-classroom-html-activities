<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Greatest common factor (GCF): 48 and 36 share 1, 2, 3, 4, 6, 12 → GCF = 12</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="14.1" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="131.7" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">48 and 36 share 1,</text>
<text x="9.2" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="131.7" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">2, 3, 4, 6, 12 → GCF </text>
<text x="140.9" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="73.1" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="13.8" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">12</text>
</svg>
