<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Convert Measurements within the Same System: 4 feet = 48 inches; 4 liters = 4,000 milliliters</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="37.9" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="52.5" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">4 feet </text>
<text x="90.4" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="100.3" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="21.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 48</text>
<text x="12.8" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="124.5" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">inches; 4 liters </text>
<text x="137.3" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="19.1" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="121.8" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">4,000 milliliters</text>
</svg>
