<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Equation: x plus 3 equals 6</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="45.9" y="60" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" textLength="43.5" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">x + 3 </text>
<text x="89.4" y="60" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#d9795d" textLength="10.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="100" y="60" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" textLength="14.1" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 6</text>
<text x="10" y="92" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#1fa6a2" textLength="140" lengthAdjust="spacingAndGlyphs" xml:space="preserve">both sides equal 6 when x = 3</text>
</svg>
