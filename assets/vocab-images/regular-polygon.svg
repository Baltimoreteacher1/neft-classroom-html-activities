<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Regular polygon: a closed shape with straight sides, all sides equal and all angles equal, split from the center into congruent triangles</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="80,18 106,33 106,63 80,78 54,63 54,33" fill="#1fa6a2" stroke="#12355b" stroke-width="2" stroke-linejoin="round"/>
<g stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3">
<line x1="80" y1="48" x2="80" y2="18"/>
<line x1="80" y1="48" x2="106" y2="33"/>
<line x1="80" y1="48" x2="106" y2="63"/>
<line x1="80" y1="48" x2="80" y2="78"/>
<line x1="80" y1="48" x2="54" y2="63"/>
<line x1="80" y1="48" x2="54" y2="33"/>
</g>
<circle cx="80" cy="48" r="2.5" fill="#ffffff"/>
<text x="80" y="96" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#12355b" text-anchor="middle">equal sides, equal angles</text>
<text x="80" y="109" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#54677c" text-anchor="middle">6 sides &#8594; 6 triangles</text>
</svg>
