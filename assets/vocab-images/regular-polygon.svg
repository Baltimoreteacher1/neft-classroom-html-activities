<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Regular polygon: a closed shape with straight sides, all sides equal and all angles equal, split from the center into congruent triangles</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="80,20 106,35 106,65 80,80 54,65 54,35" fill="#1fa6a2"/>
<g stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3">
<line x1="80" y1="50" x2="80" y2="20"/>
<line x1="80" y1="50" x2="106" y2="35"/>
<line x1="80" y1="50" x2="106" y2="65"/>
<line x1="80" y1="50" x2="80" y2="80"/>
<line x1="80" y1="50" x2="54" y2="65"/>
<line x1="80" y1="50" x2="54" y2="35"/>
</g>
<circle cx="80" cy="50" r="2.5" fill="#ffffff"/>
<text x="80" y="99" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#12355b" text-anchor="middle">equal sides + equal angles</text>
<text x="80" y="111" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="700" fill="#54677c" text-anchor="middle">6 sides &#8594; 6 congruent triangles</text>
</svg>
