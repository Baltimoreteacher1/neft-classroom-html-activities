<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Appropriate Measures of Center: Use the median when an outlier would pull the mean too far.</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="9.1" y="42.4" font-family="Outfit, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#12355b" textLength="141.8" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">Use the median when</text>
<text x="9.7" y="62" font-family="Outfit, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#12355b" textLength="140.7" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">an outlier would pull</text>
<text x="19.3" y="81.6" font-family="Outfit, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#12355b" textLength="121.5" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">the mean too far.</text>
</svg>
