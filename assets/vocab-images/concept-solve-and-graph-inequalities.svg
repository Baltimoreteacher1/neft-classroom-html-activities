<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Solve and Graph Inequalities: x + 2 ≤ 7 → x ≤ 5; closed circle at 5, arrow left.</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="17.9" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="124.2" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">x + 2 ≤ 7 → x ≤ 5;</text>
<text x="11.3" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="137.4" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">closed circle at 5,</text>
<text x="36.2" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="87.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">arrow left.</text>
</svg>
