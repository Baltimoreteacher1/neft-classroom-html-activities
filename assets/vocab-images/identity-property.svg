<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Identity property: adding 0 or multiplying by 1 keeps the same value</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="80" y="46" font-family="Outfit, system-ui, sans-serif" font-size="17" font-weight="800" fill="#12355b" text-anchor="middle">9 + <tspan fill="#1fa6a2">0</tspan> = 9</text>
<text x="80" y="86" font-family="Outfit, system-ui, sans-serif" font-size="17" font-weight="800" fill="#12355b" text-anchor="middle">6 × <tspan fill="#d9795d">1</tspan> = 6</text>
<text x="80" y="108" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#536174" text-anchor="middle">value stays the same</text>
</svg>
