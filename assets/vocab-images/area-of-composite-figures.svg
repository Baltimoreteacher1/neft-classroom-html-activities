<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Area of a composite figure: break it into basic shapes, find each area, then add or subtract</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<rect x="22" y="22" width="46" height="30" fill="#cfe6e5" stroke="#12355b" stroke-width="2"/>
<rect x="22" y="52" width="80" height="26" fill="#e6efe9" stroke="#12355b" stroke-width="2"/>
<text x="45" y="42" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#1fa6a2" text-anchor="middle">A₁</text>
<text x="62" y="70" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#1fa6a2" text-anchor="middle">A₂</text>
<line x1="22" y1="52" x2="102" y2="52" stroke="#d9795d" stroke-width="2" stroke-dasharray="4 3"/>
<text x="130" y="40" font-family="Outfit, system-ui, sans-serif" font-size="11" font-weight="800" fill="#12355b" text-anchor="middle">A₁ + A₂</text>
<text x="130" y="56" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#1fa6a2" text-anchor="middle">= total</text>
<text x="80" y="96" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#12355b" text-anchor="middle">A = A₁ + A₂</text>
<text x="80" y="110" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="800" fill="#54677c" text-anchor="middle">add the parts (or subtract a hole)</text>
</svg>
