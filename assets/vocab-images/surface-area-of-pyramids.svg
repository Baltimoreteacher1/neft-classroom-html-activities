<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Surface area of a pyramid: add the base and every triangular lateral face</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<rect x="56" y="44" width="34" height="34" fill="#d9795d" opacity="0.6" stroke="#12355b" stroke-width="1.5"/>
<polygon points="56,44 90,44 73,16" fill="#cfe6e5" stroke="#12355b" stroke-width="1.5"/>
<polygon points="56,78 90,78 73,104" fill="#cfe6e5" stroke="#12355b" stroke-width="1.5"/>
<polygon points="56,44 56,78 26,61" fill="#cfe6e5" stroke="#12355b" stroke-width="1.5"/>
<polygon points="90,44 90,78 120,61" fill="#cfe6e5" stroke="#12355b" stroke-width="1.5"/>
<text x="73" y="65" font-family="Outfit, system-ui, sans-serif" font-size="11" font-weight="800" fill="#12355b" text-anchor="middle">B</text>
<text x="130" y="34" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#12355b" text-anchor="middle">SA = B</text>
<text x="130" y="46" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#1fa6a2" text-anchor="middle">+ lateral</text>
