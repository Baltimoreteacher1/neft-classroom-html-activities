<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Associative property: the grouping can change and the sum stays the same</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="80" y="40" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" text-anchor="middle"><tspan fill="#1fa6a2">(3 + 5)</tspan> + 2</text>
<path d="M52 46 q11 9 22 0" stroke="#1fa6a2" stroke-width="2" fill="none"/>
<text x="80" y="90" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" text-anchor="middle">3 + <tspan fill="#d9795d">(5 + 2)</tspan></text>
<path d="M86 96 q11 9 22 0" stroke="#d9795d" stroke-width="2" fill="none"/>
<text x="80" y="112" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#536174" text-anchor="middle">both = 10</text>
</svg>
