<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Integers and Absolute Value: |−6| = 6 because −6 is 6 units from zero.</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="7.5" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="33.3" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">|−6| </text>
<text x="40.8" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="50.7" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="101.7" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 6 because −6</text>
<text x="22.5" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="114.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">is 6 units from</text>
<text x="60.5" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="39" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">zero.</text>
</svg>
