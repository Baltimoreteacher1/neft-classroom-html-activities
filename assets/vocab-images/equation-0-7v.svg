<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Equation: 0.7v = 26,600 — the percent times the unknown whole equals the part</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="14" y="60" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="34" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">0.7v </text>
<text x="48" y="60" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="10" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="58" y="60" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="88" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 26,600</text>
<text x="11" y="88" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="800" fill="#1fa6a2" textLength="138" lengthAdjust="spacingAndGlyphs" xml:space="preserve">percent × unknown whole = the part you know</text>
</svg>
