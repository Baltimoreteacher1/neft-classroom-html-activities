<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Long division: 1,344 ÷ 12 → divide, multiply, subtract, bring down, repeat</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="12.5" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="135" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">1,344 ÷ 12 → divide,</text>
<text x="7.3" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="145.5" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">multiply, subtract,</text>
<text x="7.8" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="144.3" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">bring down, repeat</text>
</svg>
