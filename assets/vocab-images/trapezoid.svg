<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Trapezoid: exactly one pair of parallel sides, called the bases</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="48,28 112,28 134,76 26,76" fill="#cfe6e5" stroke="#12355b" stroke-width="2" stroke-linejoin="round"/>
<path d="M76,23 L82,28 L76,33" fill="none" stroke="#1fa6a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M76,71 L82,76 L76,81" fill="none" stroke="#1fa6a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="20" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#1fa6a2" text-anchor="middle">b₁</text>
<text x="80" y="90" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#1fa6a2" text-anchor="middle">b₂</text>
<text x="80" y="106" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#12355b" text-anchor="middle">› b₁ and b₂ are parallel</text>
<text x="80" y="117" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#54677c" text-anchor="middle">the legs are NOT parallel</text>
</svg>
