<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img" aria-labelledby="t">
<title id="t">Tenths: in 2.58 the digit 5 sits in the tenths place, the first place after the decimal point, so it is worth 5 tenths or 0.5</title>
<rect x="0" y="0" width="200" height="120" rx="10" fill="#f7f4ec"/>

<!-- Column headers -->
<g font-family="Outfit, system-ui, sans-serif" font-size="7" font-weight="800" fill="#12355b" text-anchor="middle">
  <rect x="24" y="22" width="40" height="16" rx="3" fill="#dff1f0" stroke="#d7e2ed" stroke-width="0.8"/>
  <text x="44" y="33">Ones</text>
  <rect x="90" y="22" width="40" height="16" rx="3" fill="#fdeede" stroke="#d7e2ed" stroke-width="0.8"/>
  <text x="110" y="33">Tenths</text>
  <rect x="132" y="22" width="44" height="16" rx="3" fill="#dff1f0" stroke="#d7e2ed" stroke-width="0.8"/>
  <text x="154" y="33" textLength="40" lengthAdjust="spacingAndGlyphs">Hundredths</text>
</g>

<!-- Digit cells: 2 . 5 8 — the 5 is highlighted because it sits in the FIRST
     place after the decimal point, which is what "tenths" names. -->
<g stroke="#d7e2ed" stroke-width="1">
  <rect x="24" y="40" width="40" height="34" fill="#ffffff"/>
  <rect x="90" y="40" width="40" height="34" fill="#1fa6a2"/>
  <rect x="132" y="40" width="44" height="34" fill="#ffffff"/>
</g>
<g font-family="Outfit, system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
  <text x="44" y="64" fill="#12355b">2</text>
  <text x="77" y="66" fill="#12355b">.</text>
  <text x="110" y="64" fill="#ffffff">5</text>
  <text x="154" y="64" fill="#12355b">8</text>
</g>

<g font-family="Outfit, system-ui, sans-serif" text-anchor="middle">
  <text x="100" y="94" font-size="9" font-weight="800" fill="#0e7c78">5 tenths = 0.5 = 5/10</text>
  <text x="100" y="108" font-size="7.5" font-weight="600" fill="#54677c">first place after the decimal point</text>
</g>
</svg>
