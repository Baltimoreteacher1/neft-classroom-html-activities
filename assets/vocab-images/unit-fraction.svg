<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t" style="background:white">
<title id="t">Unit fraction: 1 out of 4 equal parts</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<circle cx="60" cy="54" r="38" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2"/>
<!-- 1/4 shaded: a single quadrant filled, because a unit fraction has a numerator of 1 -->
<path d="M60 54 L60 16 A38 38 0 0 1 98 54 Z" fill="#1fa6a2"/>
<!-- Divider lines to show 4 equal parts -->
<line x1="60" y1="16" x2="60" y2="92" stroke="#fff" stroke-width="2"/>
<line x1="22" y1="54" x2="98" y2="54" stroke="#fff" stroke-width="2"/>
<text x="124" y="52" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" text-anchor="middle">1</text>
<line x1="114" y1="56" x2="134" y2="56" stroke="#12355b" stroke-width="2"/>
<text x="124" y="72" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" text-anchor="middle">4</text>
<text x="80" y="110" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#1fa6a2" text-anchor="middle">1 of 4 equal parts</text>
</svg>
