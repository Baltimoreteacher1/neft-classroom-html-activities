<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Volume of a rectangular prism: V equals length times width times height</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="26,36 82,36 100,24 44,24" fill="#e6efe9" stroke="#12355b" stroke-width="1.5"/>
<rect x="26" y="36" width="56" height="30" fill="#cfe6e5" stroke="#12355b" stroke-width="1.5"/>
<polygon points="82,36 100,24 100,54 82,66" fill="#dce7ee" stroke="#12355b" stroke-width="1.5"/>
<text x="54" y="76" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#d9795d" text-anchor="middle">l</text>
<text x="94" y="70" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#d9795d" text-anchor="middle">w</text>
<text x="20" y="54" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#d9795d" text-anchor="end">h</text>
<text x="132" y="44" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#1fa6a2" text-anchor="middle">= B × h</text>
<text x="80" y="96" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#12355b" text-anchor="middle">V = l × w × h</text>
<text x="80" y="110" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#54677c" text-anchor="middle">counted in cubic units</text>
</svg>
