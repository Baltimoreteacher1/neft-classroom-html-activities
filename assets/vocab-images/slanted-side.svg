<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Slanted side: the leaning side of a parallelogram — not the perpendicular height</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="34,26 104,26 88,74 18,74" fill="#cfe6e5" stroke="#12355b" stroke-width="2" stroke-linejoin="round"/>
<line x1="104" y1="26" x2="88" y2="74" stroke="#d9795d" stroke-width="6" stroke-linecap="round"/>
<line x1="34" y1="26" x2="18" y2="74" stroke="#d9795d" stroke-width="6" stroke-linecap="round"/>
<line x1="34" y1="26" x2="34" y2="74" stroke="#54677c" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="34" y="66" width="8" height="8" fill="none" stroke="#54677c" stroke-width="1.5"/>
<line x1="130" y1="52" x2="104" y2="52" stroke="#d9795d" stroke-width="1.5"/>
<polygon points="102,52 109,48 109,56" fill="#d9795d"/>
<text x="131" y="38" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#d9795d" text-anchor="middle">slanted</text>
<text x="131" y="48" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#d9795d" text-anchor="middle">side</text>
<text x="46" y="44" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#54677c" text-anchor="middle">h</text>
<text x="53" y="88" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#12355b" text-anchor="middle">base</text>
<text x="80" y="106" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="800" fill="#54677c" text-anchor="middle">the leaning side — not the height</text>
</svg>
