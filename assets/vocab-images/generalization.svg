<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Generalization: one rule that covers every case</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="80" y="32" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1f2a37">1→3   2→5   3→7</text><path d="M20 44 h120" fill="none" stroke="#9bb0c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="38" y="56" width="84" height="22" rx="6" fill="#1fa6a2"/><text x="80" y="72" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#fff">n → 2n + 1</text><text x="80" y="100" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e4572e">true for ANY n</text>
</svg>
