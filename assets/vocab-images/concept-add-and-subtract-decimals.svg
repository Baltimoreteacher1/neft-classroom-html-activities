<text x="97.9" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="107.8" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="43.5" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 7.34;</text>
<text x="8.8" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="142.5" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">line up the decimal</text>
