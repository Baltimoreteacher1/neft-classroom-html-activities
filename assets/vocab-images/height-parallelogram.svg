<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Height of a parallelogram: the perpendicular distance from the base to the opposite side</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="40,28 122,28 106,76 24,76" fill="#cfe6e5" stroke="#12355b" stroke-width="2" stroke-linejoin="round"/>
<line x1="122" y1="28" x2="106" y2="76" stroke="#54677c" stroke-width="3"/>
<line x1="70" y1="28" x2="70" y2="76" stroke="#d9795d" stroke-width="4" stroke-dasharray="5 3"/>
<rect x="70" y="68" width="8" height="8" fill="none" stroke="#d9795d" stroke-width="1.5"/>
<text x="60" y="54" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#d9795d" text-anchor="end">h</text>
<text x="136" y="54" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#54677c" text-anchor="middle">not</text>
<text x="136" y="64" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#54677c" text-anchor="middle">this</text>
<text x="65" y="92" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#12355b" text-anchor="middle">base</text>
<text x="80" y="108" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#54677c" text-anchor="middle">not the slanted side</text>
</svg>
