<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Percent bar: 4 equal parts with 3 shaded (75%)</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<!-- 4-part percent bar -->
<rect x="15" y="38" width="32.5" height="26" rx="2" fill="#1fa6a2" stroke="#12355b" stroke-width="1.5"/>
<rect x="47.5" y="38" width="32.5" height="26" rx="2" fill="#1fa6a2" stroke="#12355b" stroke-width="1.5"/>
<rect x="80" y="38" width="32.5" height="26" rx="2" fill="#1fa6a2" stroke="#12355b" stroke-width="1.5"/>
<rect x="112.5" y="38" width="32.5" height="26" rx="2" fill="#ffffff" stroke="#12355b" stroke-width="1.5"/>
<rect x="15" y="38" width="130" height="26" rx="3" fill="none" stroke="#12355b" stroke-width="2"/>
<!-- Top label -->
<text x="64" y="26" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#0f766e" text-anchor="middle">3 of 4 shaded = 75%</text>
<!-- Axis ticks -->
<text x="15" y="78" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#12355b" text-anchor="middle">0%</text>
<text x="112.5" y="78" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#0f766e" text-anchor="middle">75%</text>
<text x="145" y="78" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#12355b" text-anchor="middle">100%</text>
<text x="80" y="102" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#12355b" text-anchor="middle">Each part = 25%</text>
</svg>
