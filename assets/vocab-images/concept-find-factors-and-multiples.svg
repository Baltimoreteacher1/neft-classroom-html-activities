<text x="62.2" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="35.7" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">is 24</text>
