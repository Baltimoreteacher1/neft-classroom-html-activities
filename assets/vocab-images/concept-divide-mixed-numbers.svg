<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Divide Mixed Numbers: 2 1/2 ÷ 1 1/4 = 5/2 ÷ 5/4 = 5/2 × 4/5 = 2</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="14.1" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="91.2" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">2 1/2 ÷ 1 1/4 </text>
<text x="105.4" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="115.3" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="30.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 5/2</text>
<text x="7.5" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="45" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">÷ 5/4 </text>
<text x="52.6" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="62.5" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="80.1" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 5/2 × 4/5 </text>
<text x="142.5" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="75.7" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="8.7" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">2</text>
</svg>
