<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Area of a regular polygon: split it into congruent triangles from the center, find one triangle's area, then multiply by the number of triangles</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="42,16 66,30 66,58 42,72 18,58 18,30" fill="#cfe6e5" stroke="#12355b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="42,44 42,16 66,30" fill="#1fa6a2" stroke="#12355b" stroke-width="1.5"/>
<g stroke="#12355b" stroke-width="1" stroke-dasharray="3 2">
<line x1="42" y1="44" x2="66" y2="58"/>
<line x1="42" y1="44" x2="42" y2="72"/>
<line x1="42" y1="44" x2="18" y2="58"/>
<line x1="42" y1="44" x2="18" y2="30"/>
</g>
<circle cx="42" cy="44" r="2" fill="#12355b"/>
<path d="M74 42 L88 42" stroke="#d9795d" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="88,42 82,38 82,46" fill="#d9795d"/>
<text x="124" y="30" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#54677c" text-anchor="middle">ONE triangle</text>
<text x="124" y="46" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#1fa6a2" text-anchor="middle">&#189; &#215; b &#215; h</text>
<text x="124" y="62" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#12355b" text-anchor="middle">then &#215; 6</text>
<text x="80" y="94" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#12355b" text-anchor="middle">find 1 triangle, then</text>
<text x="80" y="107" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#54677c" text-anchor="middle">multiply by the sides</text>
</svg>
