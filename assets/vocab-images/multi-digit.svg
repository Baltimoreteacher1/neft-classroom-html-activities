<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Multi-digit: a number written with more than one digit</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<text x="80" y="24" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#d9795d" text-anchor="middle">more than one digit</text>
<rect x="22" y="38" width="26" height="34" rx="6" fill="#ffffff" stroke="#12355b" stroke-width="2"/>
<rect x="52" y="38" width="26" height="34" rx="6" fill="#ffffff" stroke="#12355b" stroke-width="2"/>
<rect x="82" y="38" width="26" height="34" rx="6" fill="#ffffff" stroke="#12355b" stroke-width="2"/>
<rect x="112" y="38" width="26" height="34" rx="6" fill="#ffffff" stroke="#12355b" stroke-width="2"/>
<text x="35" y="62" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" text-anchor="middle">1</text>
<text x="65" y="62" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" text-anchor="middle">3</text>
<text x="95" y="62" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" text-anchor="middle">4</text>
<text x="125" y="62" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#12355b" text-anchor="middle">4</text>
<text x="35" y="90" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="700" fill="#1fa6a2" text-anchor="middle">thousands</text>
<text x="65" y="90" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="700" fill="#1fa6a2" text-anchor="middle">hundreds</text>
<text x="95" y="90" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="700" fill="#1fa6a2" text-anchor="middle">tens</text>
<text x="125" y="90" font-family="Outfit, system-ui, sans-serif" font-size="8" font-weight="700" fill="#1fa6a2" text-anchor="middle">ones</text>
<text x="80" y="108" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#12355b" text-anchor="middle">1,344 has 4 digits</text>
</svg>
