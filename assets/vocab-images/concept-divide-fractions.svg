<text x="16.5" y="51.1" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="72" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">2/3 ÷ 1/4 </text>
<text x="88.6" y="51.1" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="98.5" y="51.1" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="45" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 2/3 ×</text>
<text x="46.3" y="72.9" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="27" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">4/1 </text>
<text x="73.3" y="72.9" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="83.2" y="72.9" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="30.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 8/3</text>
