<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Composite figure: one figure built from simpler shapes, so its area is part A plus part B</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<rect x="34" y="18" width="46" height="32" fill="#1fa6a2"/>
<rect x="34" y="50" width="92" height="32" fill="#f2c15b"/>
<line x1="34" y1="50" x2="80" y2="50" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3"/>
<polygon points="34,18 80,18 80,50 126,50 126,82 34,82" fill="none" stroke="#12355b" stroke-width="2.5" stroke-linejoin="round"/>
<text x="57" y="39" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
<text x="80" y="71" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#12355b" text-anchor="middle">B</text>
<text x="80" y="98" font-family="Outfit, system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#12355b" text-anchor="middle">one figure, simpler parts</text>
<text x="80" y="111" font-family="Outfit, system-ui, sans-serif" font-size="10" font-weight="800" fill="#54677c" text-anchor="middle">area = A + B</text>
</svg>
