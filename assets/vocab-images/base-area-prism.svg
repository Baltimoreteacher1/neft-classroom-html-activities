<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
<title id="t">Base area of a prism: the area of the bottom face, written B</title>
<rect x="0" y="0" width="160" height="120" rx="10" fill="#f7f4ec"/>
<polygon points="34,40 104,40 126,26 56,26" fill="#e6efe9" stroke="#12355b" stroke-width="1.5"/>
<rect x="34" y="40" width="70" height="34" fill="#cfe6e5" stroke="#12355b" stroke-width="1.5"/>
<polygon points="104,40 126,26 126,60 104,74" fill="#dce7ee" stroke="#12355b" stroke-width="1.5"/>
<polygon points="34,74 104,74 126,60 56,60" fill="#d9795d" opacity="0.75" stroke="#d9795d" stroke-width="2"/>
<text x="80" y="72" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
<text x="80" y="94" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="800" fill="#12355b" text-anchor="middle">B = l × w (the bottom face)</text>
<text x="80" y="108" font-family="Outfit, system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#54677c" text-anchor="middle">then V = B × h</text>
</svg>
