<text x="37.4" y="40.3" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="85.2" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">4 × 20 is an</text>
<text x="9.2" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="141.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">expression; 4 × 20</text>
<text x="8.7" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#d9795d" textLength="9.9" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">=</text>
<text x="18.6" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="132.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve"> 80 is an equation</text>
