<text x="11.3" y="62" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="137.4" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">many halves fit in</text>
<text x="7.7" y="83.8" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#12355b" textLength="144.6" lengthAdjust="spacingAndGlyphs" class="row" xml:space="preserve">3; the answer is 6.</text>
