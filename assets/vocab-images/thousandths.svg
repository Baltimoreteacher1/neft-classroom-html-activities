<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img" aria-labelledby="t">
<title id="t">Thousandths: in 2.583 the digit 3 sits in the thousandths place, the third place after the decimal point, so it is worth 3 thousandths or 0.003</title>
<rect x="0" y="0" width="200" height="120" rx="10" fill="#f7f4ec"/>

<!-- Column headers -->
<g font-family="Outfit, system-ui, sans-serif" font-size="6.5" font-weight="800" fill="#12355b" text-anchor="middle">
  <rect x="10" y="22" width="30" height="16" rx="3" fill="#dff1f0" stroke="#d7e2ed" stroke-width="0.8"/>
  <text x="25" y="33">Ones</text>
  <rect x="56" y="22" width="34" height="16" rx="3" fill="#dff1f0" stroke="#d7e2ed" stroke-width="0.8"/>
  <text x="73" y="33">Tenths</text>
  <rect x="92" y="22" width="42" height="16" rx="3" fill="#dff1f0" stroke="#d7e2ed" stroke-width="0.8"/>
  <text x="113" y="33" textLength="38" lengthAdjust="spacingAndGlyphs">Hundredths</text>
  <rect x="136" y="22" width="44" height="16" rx="3" fill="#fdeede" stroke="#d7e2ed" stroke-width="0.8"/>
  <text x="158" y="33" textLength="40" lengthAdjust="spacingAndGlyphs">Thousandths</text>
</g>

<!-- Digit cells: 2 . 5 8 3 — the 3 is highlighted because it sits in the THIRD
     place after the decimal point, which is what "thousandths" names. -->
<g stroke="#d7e2ed" stroke-width="1">
  <rect x="10" y="40" width="30" height="34" fill="#ffffff"/>
  <rect x="56" y="40" width="34" height="34" fill="#ffffff"/>
  <rect x="92" y="40" width="42" height="34" fill="#ffffff"/>
  <rect x="136" y="40" width="44" height="34" fill="#1fa6a2"/>
</g>
<g font-family="Outfit, system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">
  <text x="25" y="63" fill="#12355b">2</text>
  <text x="47" y="65" fill="#12355b">.</text>
  <text x="73" y="63" fill="#12355b">5</text>
  <text x="113" y="63" fill="#12355b">8</text>
  <text x="158" y="63" fill="#ffffff">3</text>
</g>

<g font-family="Outfit, system-ui, sans-serif" text-anchor="middle">
  <text x="100" y="94" font-size="9" font-weight="800" fill="#0e7c78">3 thousandths = 0.003 = 3/1000</text>
  <text x="100" y="108" font-size="7.5" font-weight="600" fill="#54677c">third place after the decimal point</text>
</g>
</svg>
