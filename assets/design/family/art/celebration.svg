<symbol id="fc-confetti-4" viewBox="0 0 16 16"><g class="fc-b" color="var(--unit-accent,#1FA6A2)"><path d="M8 1v14M1 8h14" class="fc-ln"/></g></symbol>
<symbol id="fc-confetti-5" viewBox="0 0 16 16"><g class="fc-y" color="var(--art-amber,#F2C15B)"><path d="M1 11q3.5-8 7 0t7 0" class="fc-ln"/></g></symbol>
<symbol id="fc-confetti-6" viewBox="0 0 16 16"><g class="fc-k" color="var(--ink,#17324D)"><path d="M8 1l6 7-6 7-6-7z"/></g></symbol>
</svg>
