<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" role="img"
     aria-labelledby="mn-title mn-desc" font-family="Hanken Grotesk, Segoe UI, system-ui, sans-serif">
  <title id="mn-title">Math Notes — what my notebook page looks like</title>
  <desc id="mn-desc">A lined notebook page. A heading line at the top holds the lesson number and the date. Below it, three numbered sections: 1 Math Words, a two-column list of each word and what it means in my own words; 2 Today's Math, a box holding the rule, formula, or model; 3 My Work, numbered problems with every step shown.</desc>

  <rect width="700" height="900" fill="#ffffff"/>
  <!-- margin rule -->
  <line x1="72" y1="0" x2="72" y2="900" stroke="#f0b8b8" stroke-width="2"/>
  <!-- ruled lines -->
  <g stroke="#dce6f0" stroke-width="1">
    <line x1="0" y1="120" x2="700" y2="120"/><line x1="0" y1="152" x2="700" y2="152"/>
    <line x1="0" y1="184" x2="700" y2="184"/><line x1="0" y1="216" x2="700" y2="216"/>
    <line x1="0" y1="248" x2="700" y2="248"/><line x1="0" y1="280" x2="700" y2="280"/>
    <line x1="0" y1="312" x2="700" y2="312"/><line x1="0" y1="344" x2="700" y2="344"/>
    <line x1="0" y1="376" x2="700" y2="376"/><line x1="0" y1="408" x2="700" y2="408"/>
    <line x1="0" y1="440" x2="700" y2="440"/><line x1="0" y1="472" x2="700" y2="472"/>
    <line x1="0" y1="504" x2="700" y2="504"/><line x1="0" y1="536" x2="700" y2="536"/>
    <line x1="0" y1="568" x2="700" y2="568"/><line x1="0" y1="600" x2="700" y2="600"/>
    <line x1="0" y1="632" x2="700" y2="632"/><line x1="0" y1="664" x2="700" y2="664"/>
    <line x1="0" y1="696" x2="700" y2="696"/><line x1="0" y1="728" x2="700" y2="728"/>
    <line x1="0" y1="760" x2="700" y2="760"/><line x1="0" y1="792" x2="700" y2="792"/>
    <line x1="0" y1="824" x2="700" y2="824"/><line x1="0" y1="856" x2="700" y2="856"/>
  </g>

  <!-- heading line -->
  <text x="92" y="60" font-size="27" font-weight="800" fill="#21313f">Lesson 1-1</text>
  <text x="470" y="60" font-size="27" font-weight="800" fill="#21313f">Sept. 3</text>
  <line x1="88" y1="76" x2="656" y2="76" stroke="#21313f" stroke-width="3"/>

  <!-- 1. MATH WORDS -->
  <circle cx="104" cy="112" r="17" fill="#0c6f6b"/>
  <text x="104" y="121" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="132" y="120" font-size="23" font-weight="800" fill="#0c6f6b">MATH WORDS</text>
  <g font-size="19" fill="#21313f">
    <text x="96" y="176">variable</text>
    <text x="330" y="176">a letter that stands for a number</text>
    <text x="96" y="208">expression</text>
    <text x="330" y="208">a math phrase, no equals sign</text>
    <text x="96" y="240">evaluate</text>
    <text x="330" y="240">find out what it equals</text>
  </g>
  <line x1="310" y1="132" x2="310" y2="252" stroke="#d7e2ed" stroke-width="2"/>

  <!-- 2. TODAY'S MATH -->
  <circle cx="104" cy="300" r="17" fill="#0c6f6b"/>
  <text x="104" y="309" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="132" y="308" font-size="23" font-weight="800" fill="#0c6f6b">TODAY'S MATH</text>
  <rect x="96" y="326" width="560" height="112" rx="12" fill="#dff2ee" stroke="#0c6f6b" stroke-width="2.5"/>
  <text x="128" y="374" font-size="25" font-weight="800" fill="#21313f">Area = base × height</text>
  <text x="128" y="412" font-size="19" fill="#21313f">the base and the height must meet at a right angle</text>

  <!-- 3. MY WORK -->
  <circle cx="104" cy="490" r="17" fill="#0c6f6b"/>
  <text x="104" y="499" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="132" y="498" font-size="23" font-weight="800" fill="#0c6f6b">MY WORK</text>
  <g font-size="19" fill="#21313f">
    <text x="96" y="562">1.</text>
    <text x="136" y="562">A = 8 × 5</text>
    <text x="136" y="594">A = 40 square feet</text>
    <text x="96" y="658">2.</text>
    <text x="136" y="658">A = 12 × 3</text>
    <text x="136" y="690">A = 36 square inches</text>
    <text x="96" y="754">3.</text>
    <text x="136" y="754">A = 6 × 6</text>
    <text x="136" y="786">A = 36 square meters</text>
  </g>
  <text x="96" y="866" font-size="17" font-style="italic" fill="#5f6f80">Number every problem. Show every step.</text>
</svg>
