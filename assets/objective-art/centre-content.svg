<title id="centre-content-title">A dot plot of the data 3, 5, 5, 6 and 11 on a number line from 0 to 12. A dashed marker stands at the median 5, another at the mean 6, and a ring circles the repeated value 5. Labels read mean = 30 ÷ 5 = 6, median = 5, mode = 5, and note that the outlier 11 pulls the mean above the median.</title>
