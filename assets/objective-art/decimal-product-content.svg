<title id="decimalProduct-content-title">A hundredths grid ten squares by ten. Four columns are shaded for 0.4 and seven rows are shaded for 0.7, so the 28 squares where they cross are shaded twice. Beside it the same product is written down as 0.4 × 0.7 = 0.28, with a note that one decimal place plus one decimal place makes two decimal places.</title>
