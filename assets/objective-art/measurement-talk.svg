<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="measurement-talk-title">
<title id="measurement-talk-title">The same feet-to-inches ratio table and conversion factor, with two partners drawn beneath. Their speech bubbles say 12 inches and 1 foot are the same length, so multiplying by 12 inches over 1 foot changes the unit without changing the amount.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Saying a conversion out loud</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><rect x="140" y="60" width="190" height="58" rx="0" fill="#12355b" stroke="#12355b" stroke-width="2" /><text x="235" y="99.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">Feet</text><rect x="330" y="60" width="190" height="58" rx="0" fill="#12355b" stroke="#12355b" stroke-width="2" /><text x="425" y="99.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">Inches</text><rect x="140" y="118" width="190" height="58" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="235" y="157.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#21313f" text-anchor="middle">1</text><rect x="330" y="118" width="190" height="58" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="425" y="157.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#21313f" text-anchor="middle">12</text><rect x="140" y="176" width="190" height="58" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="235" y="215.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#21313f" text-anchor="middle">2</text><rect x="330" y="176" width="190" height="58" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="425" y="215.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#21313f" text-anchor="middle">24</text><rect x="140" y="234" width="190" height="58" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="235" y="273.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#21313f" text-anchor="middle">3</text><rect x="330" y="234" width="190" height="58" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="425" y="273.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#21313f" text-anchor="middle">36</text><rect x="140" y="292" width="190" height="58" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="235" y="331.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#21313f" text-anchor="middle">4</text><rect x="330" y="292" width="190" height="58" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="425" y="331.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#21313f" text-anchor="middle">48</text><rect x="140" y="60" width="380" height="290" rx="6" fill="none" stroke="#12355b" stroke-width="3.5" /><line x1="536" y1="205" x2="554" y2="205" stroke="#d9795d" stroke-width="3" stroke-linecap="round" /><polygon points="566,205 554,211.6 554,198.4" fill="#d9795d" /><rect x="570.672" y="178" width="98.656" height="54" rx="27" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="620" y="215.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">× 12</text><text x="812" y="202" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#12355b" text-anchor="end">5 ft ×</text><text x="884" y="174" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="middle">12 in</text><line x1="824" y1="190" x2="944" y2="190" stroke="#0c6f6b" stroke-width="3.5" stroke-linecap="round" /><text x="884" y="228" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="middle">1 ft</text><text x="968" y="202" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#a8412a" text-anchor="start">= 60 in</text><rect x="734.108" y="273" width="291.784" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="880" y="310.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">12 inches = 1 foot</text><rect x="332.11599999999993" y="387" width="535.7680000000001" height="54" rx="27" fill="#e6f7ef" stroke="#0f7c4a" stroke-width="2.5" /><text x="600" y="424.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f7c4a" text-anchor="middle">5 × 12 = 60, so 5 feet = 60 inches</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">12 inches and 1 foot are the same length, so that</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">comparison is my conversion factor.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Multiplying by 12 inches over 1 foot changes the</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">unit without changing the amount.</text>
</svg>
