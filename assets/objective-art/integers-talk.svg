<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="integers-talk-title">
<title id="integers-talk-title">The same number line with −4 and 4 marked as opposites and their absolute values labelled, and two partners drawn beneath. Their speech bubbles say absolute value is a distance so it is never negative, and that the number further left is always the smaller one.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Saying what absolute value means</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><text x="600" y="56" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">Opposites sit the same distance from 0</text><text x="600" y="100" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#5f6f80" text-anchor="middle">−4 is to the left of 4, so −4 &lt; 4</text><line x1="600" y1="168" x2="307.3333333333333" y2="168" stroke="#a8412a" stroke-width="3" stroke-linecap="round" /><polygon points="293.3333333333333,168 307.3333333333333,160.3 307.3333333333333,175.7" fill="#a8412a" /><line x1="600" y1="168" x2="892.6666666666667" y2="168" stroke="#0c6f6b" stroke-width="3" stroke-linecap="round" /><polygon points="906.6666666666667,168 892.6666666666667,175.7 892.6666666666667,160.3" fill="#0c6f6b" /><text x="446.66666666666663" y="152" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#a8412a" text-anchor="middle">4 units</text><text x="753.3333333333334" y="152" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">4 units</text><line x1="122" y1="230" x2="1078" y2="230" stroke="#12355b" stroke-width="4" stroke-linecap="round" /><polygon points="114,230 132,220 132,240" fill="#12355b" /><polygon points="1086,230 1068,220 1068,240" fill="#12355b" /><line x1="140" y1="218" x2="140" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="140" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">−6</text><line x1="216.66666666666666" y1="218" x2="216.66666666666666" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="216.66666666666666" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">−5</text><line x1="293.3333333333333" y1="218" x2="293.3333333333333" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="293.3333333333333" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">−4</text><line x1="370" y1="218" x2="370" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="370" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">−3</text><line x1="446.66666666666663" y1="218" x2="446.66666666666663" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="446.66666666666663" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">−2</text><line x1="523.3333333333334" y1="218" x2="523.3333333333334" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="523.3333333333334" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">−1</text><line x1="600" y1="218" x2="600" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="600" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">0</text><line x1="676.6666666666667" y1="218" x2="676.6666666666667" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="676.6666666666667" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">1</text><line x1="753.3333333333333" y1="218" x2="753.3333333333333" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="753.3333333333333" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">2</text><line x1="830" y1="218" x2="830" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="830" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">3</text><line x1="906.6666666666667" y1="218" x2="906.6666666666667" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="906.6666666666667" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">4</text><line x1="983.3333333333333" y1="218" x2="983.3333333333333" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="983.3333333333333" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">5</text><line x1="1060" y1="218" x2="1060" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="1060" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">6</text><circle cx="293.3333333333333" cy="230" r="14" fill="#d9795d" stroke="#ffffff" stroke-width="3" /><circle cx="906.6666666666667" cy="230" r="14" fill="#1fa6a2" stroke="#ffffff" stroke-width="3" /><circle cx="600" cy="230" r="10" fill="#12355b" /><path d="M 293.3333333333333 296 Q 600 362 892.9800508021222 298.945597762152" fill="none" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><polygon points="906.6666666666667,296 894.6001295713057,306.47323648765155 891.3599720329386,291.4179590366524" fill="#5f6f80" /><text x="600" y="376" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">opposites</text><rect x="202.59199999999998" y="393" width="154.81600000000003" height="54" rx="27" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="280" y="430.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">|−4| = 4</text><rect x="852.264" y="393" width="135.47199999999998" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="920" y="430.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">|4| = 4</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">−4 and 4 are opposites: both sit 4 units from zero,</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">just on different sides.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Absolute value is a distance, so it is never</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">negative — |−4| and |4| are both 4.</text>
</svg>
