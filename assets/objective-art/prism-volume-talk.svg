<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="prismVolume-talk-title">
<title id="prismVolume-talk-title">The same prism with its shaded base and two partners drawn beneath it. Their speech bubbles say the base is the face the prism sits on with an area of 2 × 1.5 = 3 square feet, and that stacking that base 1 foot high gives 3 cubic feet, the same as 2 × 1.5 × 1.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Saying how the base and the height make the volume</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><text x="600" y="48" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">Volume = base area × height</text><polygon points="150,180 330,180 420,130 240,130" fill="#fff" stroke="#12355b" stroke-width="2.5" /><polygon points="330,180 420,130 420,250 330,300" fill="#dff2ee" stroke="#12355b" stroke-width="2.5" /><polygon points="150,180 330,180 330,300 150,300" fill="#dff2ee" stroke="#12355b" stroke-width="2.5" /><polygon points="150,300 330,300 420,250 240,250" fill="#fef7e0" stroke="#f2c15b" stroke-width="3.5" /><line x1="210" y1="300" x2="300" y2="250" stroke="#f2c15b" stroke-width="1.5" stroke-linecap="round" /><line x1="270" y1="300" x2="360" y2="250" stroke="#f2c15b" stroke-width="1.5" stroke-linecap="round" /><line x1="150" y1="275" x2="330" y2="275" stroke="#f2c15b" stroke-width="1.5" stroke-linecap="round" /><line x1="150" y1="330" x2="316" y2="330" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="330,330 316,337.7 316,322.3" fill="#12355b" /><text x="240" y="392" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#12355b" text-anchor="middle">l = 2 ft</text><line x1="130" y1="180" x2="130" y2="286" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="130,300 122.3,286 137.7,286" fill="#12355b" /><text x="96" y="246" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#12355b" text-anchor="middle">h = 1 ft</text><line x1="344" y1="310" x2="417.77523217179123" y2="268.8231262296979" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="430,262 421.52795159812507,275.5467485352127 414.0225127454574,262.09950392418307" fill="#12355b" /><text x="424" y="320" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#12355b" text-anchor="middle">w = 1.5 ft</text><rect x="592.4968" y="105" width="335.00640000000004" height="50" rx="25" fill="#fef7e0" stroke="#f2c15b" stroke-width="2.5" /><text x="760" y="139.1" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#8a5a00" text-anchor="middle">Step 1 — shade the base</text><text x="760" y="190" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">B = l × w = 2 × 1.5</text><text x="760" y="230" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#8a5a00" text-anchor="middle">B = 3 square feet</text><rect x="550.1791999999999" y="271" width="419.6416000000002" height="50" rx="25" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="760" y="305.1" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">Step 2 — stack it up the height</text><text x="760" y="356" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">V = B × h = 3 × 1</text><text x="760" y="396" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#0c6f6b" text-anchor="middle">V = 3 cubic feet (ft³)</text><text x="760" y="446" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#5f6f80" text-anchor="middle">same as l × w × h = 2 × 1.5 × 1 = 3</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The base is the face the prism sits on, and its area</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">is 2 × 1.5 = 3 square feet.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Stacking that base 1 foot high gives 3 cubic feet —</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">the same as 2 × 1.5 × 1.</text>
</svg>
