<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="planeArea-talk-title">
<title id="planeArea-talk-title">The same parallelogram, triangle and trapezoid on one grid with their areas worked out, and two partners drawn beneath. Their speech bubbles say the height is always perpendicular to the base, and that the triangle is half the parallelogram on the same base and height.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Naming a base and its height</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><line x1="60" y1="90" x2="60" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="90" y1="90" x2="90" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="120" y1="90" x2="120" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="150" y1="90" x2="150" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="180" y1="90" x2="180" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="210" y1="90" x2="210" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="240" y1="90" x2="240" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="270" y1="90" x2="270" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="300" y1="90" x2="300" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="330" y1="90" x2="330" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="360" y1="90" x2="360" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="390" y1="90" x2="390" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="420" y1="90" x2="420" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="450" y1="90" x2="450" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="480" y1="90" x2="480" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="510" y1="90" x2="510" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="540" y1="90" x2="540" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="570" y1="90" x2="570" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="600" y1="90" x2="600" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="630" y1="90" x2="630" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="660" y1="90" x2="660" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="690" y1="90" x2="690" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="720" y1="90" x2="720" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="750" y1="90" x2="750" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="780" y1="90" x2="780" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="810" y1="90" x2="810" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="840" y1="90" x2="840" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="870" y1="90" x2="870" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="900" y1="90" x2="900" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="930" y1="90" x2="930" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="960" y1="90" x2="960" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="990" y1="90" x2="990" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="1020" y1="90" x2="1020" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="1050" y1="90" x2="1050" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="1080" y1="90" x2="1080" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="1110" y1="90" x2="1110" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="1140" y1="90" x2="1140" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="1170" y1="90" x2="1170" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="60" y1="90" x2="1170" y2="90" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="60" y1="120" x2="1170" y2="120" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="60" y1="150" x2="1170" y2="150" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="60" y1="180" x2="1170" y2="180" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="60" y1="210" x2="1170" y2="210" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="60" y1="240" x2="1170" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><polygon points="120,90 360,90 330,240 90,240" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3.5" /><line x1="120" y1="90" x2="120" y2="240" stroke="#a8412a" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7" /><text x="134" y="172" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#a8412a" text-anchor="start">h = 5</text><text x="210" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">b = 8</text><rect x="55.03200000000001" y="296" width="339.936" height="52" rx="26" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="225" y="331.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">A = b × h = 8 × 5 = 40</text><polygon points="480,240 720,240 600,90" fill="#fef7e0" stroke="#f2c15b" stroke-width="3.5" /><line x1="600" y1="90" x2="600" y2="240" stroke="#a8412a" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7" /><text x="614" y="172" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#a8412a" text-anchor="start">h = 5</text><text x="600" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">b = 8</text><rect x="455.8032" y="296" width="288.3936" height="52" rx="26" fill="#fef7e0" stroke="#8a5a00" stroke-width="2.5" /><text x="600" y="331.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#8a5a00" text-anchor="middle">A = ½ × 8 × 5 = 20</text><polygon points="900,90 1080,90 1140,240 840,240" fill="#fce6de" stroke="#d9795d" stroke-width="3.5" /><line x1="900" y1="90" x2="900" y2="240" stroke="#a8412a" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7" /><text x="914" y="172" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#a8412a" text-anchor="start">h = 5</text><text x="990" y="74" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">b₁ = 6</text><text x="990" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">b₂ = 10</text><rect x="816.9248" y="296" width="336.15039999999993" height="52" rx="26" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="985" y="331.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#a8412a" text-anchor="middle">A = ½(6 + 10) × 5 = 40</text><rect x="227.43999999999983" y="383" width="745.1200000000003" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="600" y="420.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">every area here comes from a base and a height</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The base is the side I measure along, and the height</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">meets it at a right angle.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The triangle is half the parallelogram on the same</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">base and height, so its area is 20.</text>
</svg>
