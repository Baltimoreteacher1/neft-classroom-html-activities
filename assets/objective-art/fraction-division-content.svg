<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="fractionDivision-content-title">
<title id="fractionDivision-content-title">A bar model. A bar marked 3 wholes and cut into three equal parts sits above a second bar of exactly the same length cut into six equal halves, each labelled one half and numbered 1 to 6. Labels read 6 halves fit inside 3 wholes and 3 ÷ ½ = 3 × 2 = 6.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#12355b" text-anchor="start">Dividing by a fraction</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">3 ÷ ½ = 6</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(88 190) scale(1)"><line x1="230" y1="44" x2="1010" y2="44" stroke="#12355b" stroke-width="3" stroke-linecap="round" /><line x1="230" y1="36" x2="230" y2="52" stroke="#12355b" stroke-width="3" stroke-linecap="round" /><line x1="1010" y1="36" x2="1010" y2="52" stroke="#12355b" stroke-width="3" stroke-linecap="round" /><text x="600" y="26" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">3 wholes</text><rect x="230" y="62" width="260" height="66" rx="0" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><text x="360" y="106" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0c6f6b" text-anchor="middle">1</text><rect x="490" y="62" width="260" height="66" rx="0" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><text x="620" y="106" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0c6f6b" text-anchor="middle">1</text><rect x="750" y="62" width="260" height="66" rx="0" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><text x="880" y="106" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0c6f6b" text-anchor="middle">1</text><rect x="230" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="295" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="295" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">1</text><rect x="360" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="425" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="425" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">2</text><rect x="490" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="555" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="555" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">3</text><rect x="620" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="685" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="685" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">4</text><rect x="750" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="815" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="815" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">5</text><rect x="880" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="945" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="945" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">6</text><text x="206" y="108" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#0c6f6b" text-anchor="end">wholes</text><text x="206" y="218" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#8a5a00" text-anchor="end">halves</text><rect x="373.924" y="309" width="452.1520000000001" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="600" y="346.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">6 halves fit inside 3 wholes</text><rect x="456.604" y="385" width="286.79200000000003" height="54" rx="27" fill="#e6f7ef" stroke="#0f7c4a" stroke-width="2.5" /><text x="600" y="422.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f7c4a" text-anchor="middle">3 ÷ ½ = 3 × 2 = 6</text></g>
