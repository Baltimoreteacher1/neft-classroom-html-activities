 stroke-width="1.6" stroke-linecap="butt" /><line x1="240" y1="86" x2="600" y2="86" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="butt" /><line x1="600" y1="50" x2="600" y2="410" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="butt" /><line x1="240" y1="50" x2="600" y2="50" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="butt" /><line x1="226" y1="230" x2="614" y2="230" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><line x1="420" y1="36" x2="420" y2="424" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><polygon points="622,230 604,221 604,239" fill="#12355b" /><polygon points="218,230 236,221 236,239" fill="#12355b" /><polygon points="420,28 411,46 429,46" fill="#12355b" /><polygon points="420,432 411,414 429,414" fill="#12355b" /><text x="276" y="262" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">−4</text><text x="404" y="381.2" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">−4</text><text x="348" y="262" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">−2</text><text x="404" y="309.2" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">−2</text><text x="492" y="262" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">2</text><text x="404" y="165.2" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">2</text><text x="564" y="262" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">4</text><text x="404" y="93.2" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">4</text><text x="406" y="262" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">0</text><text x="640" y="239" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">x</text><text x="422" y="16" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">y</text><text x="560.4" y="97.6" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#5f6f80" text-anchor="middle">I</text><text x="279.6" y="97.6" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#5f6f80" text-anchor="middle">II</text><text x="279.6" y="378.4" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#5f6f80" text-anchor="middle">III</text><text x="560.4" y="378.4" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#5f6f80" text-anchor="middle">IV</text><line x1="312" y1="158" x2="564" y2="158" stroke="#1fa6a2" stroke-width="7" stroke-linecap="round" /><line x1="564" y1="158" x2="564" y2="338" stroke="#f2c15b" stroke-width="7" stroke-linecap="round" /><circle cx="312" cy="158" r="11" fill="#1fa6a2" stroke="#ffffff" stroke-width="3" /><text x="296" y="140" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="end">P</text><circle cx="564" cy="158" r="11" fill="#1fa6a2" stroke="#ffffff" stroke-width="3" /><text x="580" y="140" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="start">Q</text><circle cx="564" cy="338" r="11" fill="#f2c15b" stroke="#ffffff" stroke-width="3" /><text x="580" y="350" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#8a5a00" text-anchor="start">R</text><text x="482" y="134" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">7 units</text><text x="548" y="300" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#8a5a00" text-anchor="end">5 units</text><text x="660" y="104" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#0c6f6b" text-anchor="start">P(−3, 2) to Q(4, 2)</text><text x="660" y="148" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#5f6f80" text-anchor="start">|−3| + |4| = 3 + 4 = 7</text><text x="660" y="220" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#8a5a00" text-anchor="start">Q(4, 2) to R(4, −3)</text><text x="660" y="264" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#5f6f80" text-anchor="start">|2| + |−3| = 2 + 3 = 5</text><rect x="667.06" y="325" width="465.88000000000017" height="50" rx="25" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="900" y="359.1" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">across 0, add the absolute values</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">P and Q sit on opposite sides of the y-axis, so I</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">add: |−3| + |4| = 7 units apart.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Q and R are on opposite sides of the x-axis too, so</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">|2| + |−3| = 5 units apart.</text>
</svg>
