<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="inequalities-content-title">
<title id="inequalities-content-title">Two number lines from −2 to 8. The first graphs x &gt; 3 with an open circle at 3 and a shaded ray running right; the second graphs x ≤ 5 with a closed circle at 5 and a shaded ray running left. Notes read open circle — 3 is not a solution, and closed circle — 5 is a solution.</title>
