<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="mathPractice-talk-title">
<title id="mathPractice-talk-title">The same growing dot pattern of 1, 3 and 7 dots, with two partners drawn beneath it. Their speech bubbles read that each box doubles the dots before and adds one more, and that this is why the next box would hold 15 dots.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Saying the rule out loud</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><text x="600" y="60" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#12355b" text-anchor="middle">Step 1 · Notice how the pattern grows</text><rect x="210" y="96" width="180" height="132" rx="16" fill="#ffffff" stroke="#12355b" stroke-width="2.5" /><circle cx="264" cy="168" r="10" fill="#1fa6a2" /><text x="300" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">1 dot</text><rect x="510" y="96" width="180" height="132" rx="16" fill="#ffffff" stroke="#12355b" stroke-width="2.5" /><circle cx="564" cy="168" r="10" fill="#1fa6a2" /><circle cx="590" cy="168" r="10" fill="#1fa6a2" /><circle cx="616" cy="168" r="10" fill="#1fa6a2" /><text x="600" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">3 dots</text><rect x="810" y="96" width="180" height="132" rx="16" fill="#ffffff" stroke="#12355b" stroke-width="2.5" /><circle cx="864" cy="168" r="10" fill="#1fa6a2" /><circle cx="890" cy="168" r="10" fill="#1fa6a2" /><circle cx="916" cy="168" r="10" fill="#1fa6a2" /><circle cx="942" cy="168" r="10" fill="#1fa6a2" /><circle cx="864" cy="142" r="10" fill="#1fa6a2" /><circle cx="890" cy="142" r="10" fill="#1fa6a2" /><circle cx="916" cy="142" r="10" fill="#1fa6a2" /><text x="900" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">7 dots</text><line x1="400" y1="162" x2="486" y2="162" stroke="#d9795d" stroke-width="3" stroke-linecap="round" /><polygon points="500,162 486,169.7 486,154.3" fill="#d9795d" /><line x1="700" y1="162" x2="786" y2="162" stroke="#d9795d" stroke-width="3" stroke-linecap="round" /><polygon points="800,162 786,169.7 786,154.3" fill="#d9795d" /><rect x="289.6735999999998" y="260" width="620.6528000000004" height="52" rx="26" fill="#fef7e0" stroke="#8a5a00" stroke-width="2.5" /><text x="600" y="295.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#8a5a00" text-anchor="middle">Step 2 · Test the rule: double it, then add 1</text><rect x="254.72959999999983" y="330" width="690.5408000000003" height="52" rx="26" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="600" y="365.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#a8412a" text-anchor="middle">Step 3 · Explain why: 7 × 2 + 1 = 15 comes next</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Each box doubles the dots in the box before it</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">and then adds one more.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">So the next box would hold 7 x 2 + 1 = 15 dots.</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">That is why the rule works.</text>
</svg>
