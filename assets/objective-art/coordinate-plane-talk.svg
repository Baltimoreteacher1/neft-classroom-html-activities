 stroke-width="1.6" stroke-linecap="butt" /><line x1="240" y1="86" x2="600" y2="86" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="butt" /><line x1="600" y1="50" x2="600" y2="410" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="butt" /><line x1="240" y1="50" x2="600" y2="50" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="butt" /><line x1="226" y1="230" x2="614" y2="230" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><line x1="420" y1="36" x2="420" y2="424" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><polygon points="622,230 604,221 604,239" fill="#12355b" /><polygon points="218,230 236,221 236,239" fill="#12355b" /><polygon points="420,28 411,46 429,46" fill="#12355b" /><polygon points="420,432 411,414 429,414" fill="#12355b" /><text x="276" y="262" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">−4</text><text x="404" y="381.2" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">−4</text><text x="348" y="262" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">−2</text><text x="404" y="309.2" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">−2</text><text x="492" y="262" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">2</text><text x="404" y="165.2" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">2</text><text x="564" y="262" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">4</text><text x="404" y="93.2" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">4</text><text x="406" y="262" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#5f6f80" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">0</text><text x="640" y="239" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">x</text><text x="422" y="16" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">y</text><text x="560.4" y="97.6" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#5f6f80" text-anchor="middle">I</text><text x="279.6" y="97.6" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#5f6f80" text-anchor="middle">II</text><text x="279.6" y="378.4" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#5f6f80" text-anchor="middle">III</text><text x="560.4" y="378.4" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#5f6f80" text-anchor="middle">IV</text><line x1="420" y1="158" x2="528" y2="158" stroke="#d9795d" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7" /><line x1="528" y1="230" x2="528" y2="158" stroke="#d9795d" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7" /><circle cx="528" cy="158" r="11" fill="#d9795d" stroke="#ffffff" stroke-width="3" /><text x="546" y="138" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#a8412a" text-anchor="start">(3, 2)</text><text x="660" y="104" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#12355b" text-anchor="start">(3, 2)</text><text x="660" y="154" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#5f6f80" text-anchor="start">3 right along x, then 2 up along y</text><rect x="760.784" y="209" width="238.43199999999996" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="880" y="246.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">x first, then y</text><text x="660" y="330" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="start">the origin is (0, 0)</text><text x="660" y="376" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#a8412a" text-anchor="start">the two axes cut the plane into 4 quadrants</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">I start at the origin, move 3 along the x-axis and</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">then 2 up along the y-axis.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The x-coordinate always comes first, so (3, 2) and</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">(2, 3) are different points.</text>
</svg>
