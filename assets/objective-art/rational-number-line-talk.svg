<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="rationalNumberLine-talk-title">
<title id="rationalNumberLine-talk-title">The same number line from −3 to 3 with −2½, −0.75, ½ and 2¼ plotted, and two partners drawn beneath. Their speech bubbles say each small mark is one quarter, and that a number further left is always the smaller one.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Ordering numbers on a line</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><text x="600" y="58" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">Fractions and decimals live between the whole numbers</text><line x1="122" y1="250" x2="1078" y2="250" stroke="#12355b" stroke-width="4" stroke-linecap="round" /><polygon points="114,250 132,240 132,260" fill="#12355b" /><polygon points="1086,250 1068,240 1068,260" fill="#12355b" /><line x1="140" y1="238" x2="140" y2="262" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="140" y="298" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">−3</text><line x1="178.33333333333331" y1="243.4" x2="178.33333333333331" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="216.66666666666666" y1="243.4" x2="216.66666666666666" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="255" y1="243.4" x2="255" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="293.3333333333333" y1="238" x2="293.3333333333333" y2="262" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="293.3333333333333" y="298" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">−2</text><line x1="331.6666666666667" y1="243.4" x2="331.6666666666667" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="370" y1="243.4" x2="370" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="408.33333333333337" y1="243.4" x2="408.33333333333337" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="446.66666666666663" y1="238" x2="446.66666666666663" y2="262" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="446.66666666666663" y="298" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">−1</text><line x1="485" y1="243.4" x2="485" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="523.3333333333334" y1="243.4" x2="523.3333333333334" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="561.6666666666666" y1="243.4" x2="561.6666666666666" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="600" y1="238" x2="600" y2="262" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="600" y="298" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">0</text><line x1="638.3333333333333" y1="243.4" x2="638.3333333333333" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="676.6666666666667" y1="243.4" x2="676.6666666666667" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="715" y1="243.4" x2="715" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="753.3333333333333" y1="238" x2="753.3333333333333" y2="262" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="753.3333333333333" y="298" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">1</text><line x1="791.6666666666667" y1="243.4" x2="791.6666666666667" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="830" y1="243.4" x2="830" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="868.3333333333333" y1="243.4" x2="868.3333333333333" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="906.6666666666667" y1="238" x2="906.6666666666667" y2="262" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="906.6666666666667" y="298" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">2</text><line x1="945" y1="243.4" x2="945" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="983.3333333333333" y1="243.4" x2="983.3333333333333" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="1021.6666666666667" y1="243.4" x2="1021.6666666666667" y2="256.6" stroke="#12355b" stroke-width="2.5" stroke-linecap="round" /><line x1="1060" y1="238" x2="1060" y2="262" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="1060" y="298" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">3</text><line x1="216.66666666666666" y1="212" x2="216.66666666666666" y2="250" stroke="#d9795d" stroke-width="3" stroke-linecap="round" /><circle cx="216.66666666666666" cy="250" r="13" fill="#d9795d" stroke="#ffffff" stroke-width="3" /><text x="216.66666666666666" y="200" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">−2½</text><line x1="485" y1="212" x2="485" y2="250" stroke="#d9795d" stroke-width="3" stroke-linecap="round" /><circle cx="485" cy="250" r="13" fill="#d9795d" stroke="#ffffff" stroke-width="3" /><text x="485" y="200" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">−0.75</text><line x1="676.6666666666667" y1="212" x2="676.6666666666667" y2="250" stroke="#d9795d" stroke-width="3" stroke-linecap="round" /><circle cx="676.6666666666667" cy="250" r="13" fill="#d9795d" stroke="#ffffff" stroke-width="3" /><text x="676.6666666666667" y="200" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">½</text><line x1="945" y1="212" x2="945" y2="250" stroke="#d9795d" stroke-width="3" stroke-linecap="round" /><circle cx="945" cy="250" r="13" fill="#d9795d" stroke="#ffffff" stroke-width="3" /><text x="945" y="200" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">2¼</text><rect x="213.52479999999963" y="330" width="772.9504000000007" height="52" rx="26" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="600" y="365.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">each mark between the whole numbers is one quarter</text><rect x="424.78" y="393" width="350.44" height="54" rx="27" fill="#e6f7ef" stroke="#0f7c4a" stroke-width="2.5" /><text x="600" y="430.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f7c4a" text-anchor="middle">−2½ &lt; −0.75 &lt; ½ &lt; 2¼</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Each small mark is one quarter, so −0.75 lands three</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">quarters of the way from 0 towards −1.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Whichever number sits further left is the smaller</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">one, so −2½ is the least of the four.</text>
</svg>
