<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="exponents-talk-title">
<title id="exponents-talk-title">The same power 2 to the fourth with its base and exponent labelled, and two partners drawn beneath. Their speech bubbles say the base is the factor being repeated and the exponent counts how many times it is used, so 2 to the fourth is 16, not 8.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Naming a base and an exponent</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><text x="300" y="176" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="100" font-weight="800" fill="#12355b" text-anchor="middle">2</text><text x="356" y="126" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="54" font-weight="800" fill="#a8412a" text-anchor="middle">4</text><text x="430" y="166" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#5f6f80" text-anchor="middle">=</text><text x="640" y="166" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#12355b" text-anchor="middle">2 × 2 × 2 × 2</text><line x1="505" y1="196" x2="775" y2="196" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><text x="640" y="230" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#5f6f80" text-anchor="middle">4 factors</text><text x="830" y="166" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#5f6f80" text-anchor="middle">=</text><text x="900" y="172" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#0f7c4a" text-anchor="middle">16</text><rect x="125.68" y="139" width="108.64" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="180" y="176.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">base</text><line x1="242" y1="166" x2="250" y2="166" stroke="#1fa6a2" stroke-width="3" stroke-linecap="round" /><polygon points="262,166 250,172.6 250,159.4" fill="#1fa6a2" /><rect x="414.636" y="43" width="170.72799999999998" height="54" rx="27" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="500" y="80.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">exponent</text><line x1="430" y1="94" x2="387.25298512868443" y2="109.83222773011687" stroke="#d9795d" stroke-width="3" stroke-linecap="round" /><polygon points="376,114 384.9607103802487,103.64308590934043 389.54525987712015,116.02136955089331" fill="#d9795d" /><text x="430" y="320" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="38" font-weight="800" fill="#12355b" text-anchor="end">10</text><text x="438" y="294" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#a8412a" text-anchor="start">3</text><text x="470" y="320" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="38" font-weight="800" fill="#12355b" text-anchor="start">= 10 × 10 × 10 = 1,000</text><rect x="190.6655999999997" y="378" width="818.6688000000006" height="52" rx="26" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="600" y="413.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">the exponent counts how many times the base is a factor</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The base is 2 — the factor being repeated — and the</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">exponent 4 counts how many times it is used.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">So 2 to the fourth is 2 × 2 × 2 × 2, which is 16,</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">not 2 × 4.</text>
</svg>
