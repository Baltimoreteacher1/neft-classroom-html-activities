" stroke-linecap="round" /><line x1="60" y1="120" x2="1170" y2="120" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="60" y1="150" x2="1170" y2="150" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="60" y1="180" x2="1170" y2="180" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="60" y1="210" x2="1170" y2="210" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><line x1="60" y1="240" x2="1170" y2="240" stroke="#d7e2ed" stroke-width="1.4" stroke-linecap="round" /><polygon points="120,90 360,90 330,240 90,240" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3.5" /><line x1="120" y1="90" x2="120" y2="240" stroke="#a8412a" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7" /><text x="134" y="172" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#a8412a" text-anchor="start">h = 5</text><text x="210" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">b = 8</text><rect x="55.03200000000001" y="296" width="339.936" height="52" rx="26" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="225" y="331.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">A = b × h = 8 × 5 = 40</text><polygon points="480,240 720,240 600,90" fill="#fef7e0" stroke="#f2c15b" stroke-width="3.5" /><line x1="600" y1="90" x2="600" y2="240" stroke="#a8412a" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7" /><text x="614" y="172" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#a8412a" text-anchor="start">h = 5</text><text x="600" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">b = 8</text><rect x="455.8032" y="296" width="288.3936" height="52" rx="26" fill="#fef7e0" stroke="#8a5a00" stroke-width="2.5" /><text x="600" y="331.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#8a5a00" text-anchor="middle">A = ½ × 8 × 5 = 20</text><polygon points="900,90 1080,90 1140,240 840,240" fill="#fce6de" stroke="#d9795d" stroke-width="3.5" /><line x1="900" y1="90" x2="900" y2="240" stroke="#a8412a" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7" /><text x="914" y="172" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#a8412a" text-anchor="start">h = 5</text><text x="990" y="74" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">b₁ = 6</text><text x="990" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">b₂ = 10</text><rect x="816.9248" y="296" width="336.15039999999993" height="52" rx="26" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="985" y="331.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#a8412a" text-anchor="middle">A = ½(6 + 10) × 5 = 40</text><rect x="227.43999999999983" y="383" width="745.1200000000003" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="600" y="420.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">every area here comes from a base and a height</text></g>
</svg>
