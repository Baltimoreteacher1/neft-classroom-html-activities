<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="statQuestions-talk-title">
<title id="statQuestions-talk-title">The same two question cards and the dot plot of 14 class heights, with two partners drawn beneath. Their speech bubbles say a statistical question is one you expect different answers to, and that the spread of the data is what makes it worth collecting.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Deciding if a question is statistical</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><rect x="70" y="36" width="500" height="110" rx="18" fill="#fce6de" stroke="#d9795d" stroke-width="3" /><text x="320" y="84" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">How tall am I?</text><text x="320" y="122" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#a8412a" text-anchor="middle">one answer — not statistical</text><rect x="630" y="36" width="500" height="110" rx="18" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><text x="880" y="84" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">How tall are students in our class?</text><text x="880" y="122" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0c6f6b" text-anchor="middle">many different answers — statistical</text><line x1="282" y1="340" x2="918" y2="340" stroke="#12355b" stroke-width="4" stroke-linecap="round" /><polygon points="274,340 292,330 292,350" fill="#12355b" /><polygon points="926,340 908,330 908,350" fill="#12355b" /><line x1="300" y1="328" x2="300" y2="352" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="300" y="382" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">54</text><line x1="400" y1="328" x2="400" y2="352" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="400" y="382" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">55</text><line x1="500" y1="328" x2="500" y2="352" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="500" y="382" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">56</text><line x1="600" y1="328" x2="600" y2="352" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="600" y="382" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">57</text><line x1="700" y1="328" x2="700" y2="352" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="700" y="382" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">58</text><line x1="800" y1="328" x2="800" y2="352" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="800" y="382" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">59</text><line x1="900" y1="328" x2="900" y2="352" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="900" y="382" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">60</text><circle cx="300" cy="316" r="11" fill="#1fa6a2" /><circle cx="400" cy="316" r="11" fill="#1fa6a2" /><circle cx="400" cy="290" r="11" fill="#1fa6a2" /><circle cx="500" cy="316" r="11" fill="#1fa6a2" /><circle cx="500" cy="290" r="11" fill="#1fa6a2" /><circle cx="500" cy="264" r="11" fill="#1fa6a2" /><circle cx="500" cy="238" r="11" fill="#1fa6a2" /><circle cx="600" cy="316" r="11" fill="#1fa6a2" /><circle cx="600" cy="290" r="11" fill="#1fa6a2" /><circle cx="600" cy="264" r="11" fill="#1fa6a2" /><circle cx="700" cy="316" r="11" fill="#1fa6a2" /><circle cx="700" cy="290" r="11" fill="#1fa6a2" /><circle cx="800" cy="316" r="11" fill="#1fa6a2" /><circle cx="900" cy="316" r="11" fill="#1fa6a2" /><text x="600" y="420" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">Height in inches — 14 students answered</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">How tall am I has one answer, so it is not a</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">statistical question.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">How tall are students in our class gives many</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">different answers — that spread is the point.</text>
