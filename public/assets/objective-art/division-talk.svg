<title id="division-talk-title">The same long division of 4,896 by 12, with two partners drawn beneath it. Their speech bubbles name the divisor 12 and the dividend 4,896, and say the quotient is 408 with a remainder of 0 because 12 × 408 = 4,896.</title>
