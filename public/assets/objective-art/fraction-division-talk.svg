<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="fractionDivision-talk-title">
<title id="fractionDivision-talk-title">The same bar model of three wholes cut into six halves, with two partners drawn beneath it. Their speech bubbles ask how many halves fit inside 3 and answer that dividing by one half gives the same result as multiplying by its reciprocal, 2.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Saying what dividing by a fraction asks</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><line x1="230" y1="44" x2="1010" y2="44" stroke="#12355b" stroke-width="3" stroke-linecap="round" /><line x1="230" y1="36" x2="230" y2="52" stroke="#12355b" stroke-width="3" stroke-linecap="round" /><line x1="1010" y1="36" x2="1010" y2="52" stroke="#12355b" stroke-width="3" stroke-linecap="round" /><text x="600" y="26" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">3 wholes</text><rect x="230" y="62" width="260" height="66" rx="0" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><text x="360" y="106" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0c6f6b" text-anchor="middle">1</text><rect x="490" y="62" width="260" height="66" rx="0" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><text x="620" y="106" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0c6f6b" text-anchor="middle">1</text><rect x="750" y="62" width="260" height="66" rx="0" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><text x="880" y="106" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0c6f6b" text-anchor="middle">1</text><rect x="230" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="295" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="295" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">1</text><rect x="360" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="425" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="425" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">2</text><rect x="490" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="555" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="555" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">3</text><rect x="620" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="685" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="685" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">4</text><rect x="750" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="815" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="815" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">5</text><rect x="880" y="172" width="130" height="66" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="945" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">½</text><text x="945" y="276" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#5f6f80" text-anchor="middle">6</text><text x="206" y="108" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#0c6f6b" text-anchor="end">wholes</text><text x="206" y="218" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#8a5a00" text-anchor="end">halves</text><rect x="373.924" y="309" width="452.1520000000001" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="600" y="346.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">6 halves fit inside 3 wholes</text><rect x="456.604" y="385" width="286.79200000000003" height="54" rx="27" fill="#e6f7ef" stroke="#0f7c4a" stroke-width="2.5" /><text x="600" y="422.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f7c4a" text-anchor="middle">3 ÷ ½ = 3 × 2 = 6</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The question is how many halves fit inside 3, and</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">counting the pieces gives 6.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Dividing by ½ gives the same answer as multiplying</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">by its reciprocal, 2.</text>
</svg>
