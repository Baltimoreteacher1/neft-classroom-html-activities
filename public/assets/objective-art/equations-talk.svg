<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="equations-talk-title">
<title id="equations-talk-title">A drawn pan balance labelled x + 3 = 7. The left pan holds one teal tile marked x and three unit cubes; the right pan holds seven unit cubes. Labels read the pans stay level, take 3 off both pans, and x = 4. Two partners drawn beneath say in speech bubbles that whatever is taken from one pan must come off the other.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Talking about an equation as a balance</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><polygon points="555,410 645,410 600,340" fill="#12355b" /><line x1="600" y1="342" x2="600" y2="150" stroke="#12355b" stroke-width="8" stroke-linecap="butt" /><line x1="330" y1="150" x2="870" y2="150" stroke="#12355b" stroke-width="9" stroke-linecap="round" /><circle cx="600" cy="150" r="13" fill="#f2c15b" stroke="#12355b" stroke-width="3" /><line x1="400" y1="150" x2="400" y2="222" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><line x1="800" y1="150" x2="800" y2="222" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><path d="M 300 222 h 200 l -30 40 h -140 z" fill="#18466f" /><path d="M 700 222 h 200 l -30 40 h -140 z" fill="#18466f" /><rect x="312" y="158" width="64" height="64" rx="8" fill="#1fa6a2" stroke="#0c6f6b" stroke-width="3" /><text x="344" y="202" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">x</text><rect x="384" y="190" width="32" height="32" rx="5" fill="#f2c15b" stroke="#8a5a00" stroke-width="2.5" /><rect x="420" y="190" width="32" height="32" rx="5" fill="#f2c15b" stroke="#8a5a00" stroke-width="2.5" /><rect x="456" y="190" width="32" height="32" rx="5" fill="#f2c15b" stroke="#8a5a00" stroke-width="2.5" /><rect x="712" y="190" width="32" height="32" rx="5" fill="#f2c15b" stroke="#8a5a00" stroke-width="2.5" /><rect x="748" y="190" width="32" height="32" rx="5" fill="#f2c15b" stroke="#8a5a00" stroke-width="2.5" /><rect x="784" y="190" width="32" height="32" rx="5" fill="#f2c15b" stroke="#8a5a00" stroke-width="2.5" /><rect x="820" y="190" width="32" height="32" rx="5" fill="#f2c15b" stroke="#8a5a00" stroke-width="2.5" /><rect x="730" y="158" width="32" height="32" rx="5" fill="#f2c15b" stroke="#8a5a00" stroke-width="2.5" /><rect x="766" y="158" width="32" height="32" rx="5" fill="#f2c15b" stroke="#8a5a00" stroke-width="2.5" /><rect x="802" y="158" width="32" height="32" rx="5" fill="#f2c15b" stroke="#8a5a00" stroke-width="2.5" /><text x="400" y="300" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="middle">x + 3</text><text x="800" y="300" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#8a5a00" text-anchor="middle">7</text><text x="600" y="438" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#12355b" text-anchor="middle">x + 3 = 7</text><rect x="980.2304" y="132" width="119.53920000000001" height="56" rx="28" fill="#e6f7ef" stroke="#0f7c4a" stroke-width="2.5" /><text x="1040" y="171.2" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0f7c4a" text-anchor="middle">x = 4</text><rect x="893.0472" y="281" width="293.90560000000005" height="50" rx="25" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="1040" y="315.1" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">take 3 off both pans</text><rect x="10.212800000000016" y="175" width="279.57439999999997" height="50" rx="25" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="150" y="209.1" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">the pans stay level</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The tile marked x is the unknown, and the equal sign</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">says both pans weigh the same.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">If I take 3 cubes off one pan I have to take 3 off</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">the other, which leaves x = 4.</text>
</svg>
