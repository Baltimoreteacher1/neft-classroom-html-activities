<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="mad-content-title">
<title id="mad-content-title">The data 3, 5, 5, 6 and 11 plotted on a number line from 0 to 12 with a dashed line at the mean of 6. Arrows measure each value's distance from the mean — 3, 1, 1, 0 and 5 — and a label reads MAD = (3 + 1 + 1 + 0 + 5) ÷ 5 = 2.</title>
