<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="expressions-talk-title">
<title id="expressions-talk-title">The same area model for 3(x + 5) = 3x + 15, with two partners drawn beneath it. Their speech bubbles name 3 as the coefficient, x as the variable and 15 as the constant, and say the two expressions are equivalent because they cover the same rectangle.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Naming the parts of an expression</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><rect x="260" y="90" width="240" height="110" rx="0" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><rect x="500" y="90" width="200" height="110" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="380" y="160" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#0c6f6b" text-anchor="middle">3x</text><text x="600" y="160" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#8a5a00" text-anchor="middle">15</text><line x1="260" y1="74" x2="500" y2="74" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="500" y1="74" x2="700" y2="74" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="260" y1="66" x2="260" y2="82" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="500" y1="66" x2="500" y2="82" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="700" y1="66" x2="700" y2="82" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><text x="380" y="58" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0c6f6b" text-anchor="middle">x</text><text x="600" y="58" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#8a5a00" text-anchor="middle">5</text><line x1="244" y1="90" x2="244" y2="200" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="236" y1="90" x2="252" y2="90" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="236" y1="200" x2="252" y2="200" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><text x="224" y="156" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="end">3</text><text x="760" y="132" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#12355b" text-anchor="start">3(x + 5)</text><text x="760" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#a8412a" text-anchor="start">= 3x + 15</text><text x="380" y="238" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0c6f6b" text-anchor="middle">3 rows of x</text><text x="600" y="238" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#8a5a00" text-anchor="middle">3 rows of 5</text><text x="150" y="320" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0c6f6b" text-anchor="start">3 = coefficient</text><text x="150" y="372" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="start">x = variable</text><text x="150" y="424" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#8a5a00" text-anchor="start">15 = constant</text><text x="470" y="320" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#5f6f80" text-anchor="start">3x and 15 are terms</text><rect x="680.6208" y="336" width="398.7584" height="52" rx="26" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="880" y="371.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">when x = 4:  3(4 + 5) = 27</text><rect x="728.232" y="402" width="303.536" height="52" rx="26" fill="#e6f7ef" stroke="#0f7c4a" stroke-width="2.5" /><text x="880" y="437.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#0f7c4a" text-anchor="middle">and 3 × 4 + 15 = 27</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">3 is the coefficient, x is the variable and 15 is</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">the constant; 3x and 15 are the two terms.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Both forms cover the same rectangle, so they are</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">equivalent — at x = 4 each one gives 27.</text>
</svg>
