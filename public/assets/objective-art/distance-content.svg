<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="distance-content-title">
<title id="distance-content-title">A coordinate plane with P at (−3, 2), Q at (4, 2) and R at (4, −3). The horizontal segment from P to Q is labelled 7 units and the vertical segment from Q to R is labelled 5 units, with the working |−3| + |4| = 3 + 4 = 7 and |2| + |−3| = 2 + 3 = 5.</title>
