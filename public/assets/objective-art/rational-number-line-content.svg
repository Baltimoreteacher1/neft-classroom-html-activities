<title id="rationalNumberLine-content-title">A number line from −3 to 3 marked every quarter, with −2½, −0.75, ½ and 2¼ each plotted and labelled. Underneath, the order is written out as −2½ &lt; −0.75 &lt; ½ &lt; 2¼.</title>
