<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="solids-content-title">
<title id="solids-content-title">A 3D isometric rectangular prism alongside its unfolded 2D paper net with 6 numbered faces. Dimensions length 8 inches, width 4 inches, height 5 inches are labeled, and formulas read Volume = 8 × 4 × 5 = 160 cubic inches and Surface Area = 2(32 + 40 + 20) = 184 square inches.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#12355b" text-anchor="start">3D shapes, nets, surface area and volume</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">V = l × w × h   ·   SA = 2(lw + lh + wh)</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(88 190) scale(1)"><text x="600" y="48" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">3D Rectangular Prism &amp; Unfolded 2D Net</text><polygon points="80,200 220,200 290,155 150,155" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><polygon points="220,200 290,155 290,275 220,320" fill="#fef7e0" stroke="#f2c15b" stroke-width="2.5" /><polygon points="80,200 220,200 220,320 80,320" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><line x1="150" y1="155" x2="150" y2="275" stroke="#5f6f80" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4" /><line x1="80" y1="320" x2="150" y2="275" stroke="#5f6f80" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4" /><line x1="290" y1="275" x2="150" y2="275" stroke="#5f6f80" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4" /><text x="150" y="260" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#a8412a" text-anchor="middle">Front</text><text x="185" y="182" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#0c6f6b" text-anchor="middle">Top</text><text x="255" y="235" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#8a5a00" text-anchor="middle">Right</text><line x1="80" y1="342" x2="206" y2="342" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="220,342 206,349.7 206,334.3" fill="#12355b" /><line x1="220" y1="342" x2="94" y2="342" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="80,342 94,334.3 94,349.7" fill="#12355b" /><text x="150" y="368" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#12355b" text-anchor="middle">l = 8 in</text><line x1="62" y1="200" x2="62" y2="306" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="62,320 54.3,306 69.7,306" fill="#12355b" /><line x1="62" y1="320" x2="62" y2="214" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="62,200 69.7,214 54.3,214" fill="#12355b" /><text x="42" y="266" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#12355b" text-anchor="middle">h = 5 in</text><line x1="232" y1="330" x2="290.2235013447283" y2="292.570606278389" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="302,285 294.38733479784224,299.0476805387884 286.0596678916143,286.09353201798956" fill="#12355b" /><line x1="302" y1="285" x2="243.77649865527175" y2="322.429393721611" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="232,330 239.6126652021578,315.9523194612116 247.9403321083857,328.90646798201044" fill="#12355b" /><text x="280" y="320" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#12355b" text-anchor="middle">w = 4 in</text><text x="185" y="410" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#12355b" text-anchor="middle">3D Solid Prism</text><path d="M 330 240 Q 375 200 409.53626953842877 230.69890625638112" fill="none" stroke="#1fa6a2" stroke-width="3.5" stroke-linecap="round" /><polygon points="420,240 404.4206679794384,236.45395801024532 414.65187109741913,224.94385450251693" fill="#1fa6a2" /><text x="375" y="180" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#0c6f6b" text-anchor="middle">Unfold / Fold</text><rect x="530" y="90" width="100" height="60" rx="0" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2" /><text x="580" y="126" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#0c6f6b" text-anchor="middle">Top (1)</text><rect x="530" y="150" width="100" height="70" rx="0" fill="#fce6de" stroke="#d9795d" stroke-width="2" /><text x="580" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#a8412a" text-anchor="middle">Back (2)</text><rect x="470" y="150" width="60" height="70" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="2" /><text x="500" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#8a5a00" text-anchor="middle">L (3)</text><rect x="630" y="150" width="60" height="70" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="2" /><text x="660" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#8a5a00" text-anchor="middle">R (4)</text><rect x="530" y="220" width="100" height="60" rx="0" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2" /><text x="580" y="256" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#0c6f6b" text-anchor="middle">Bottom (5)</text><rect x="530" y="280" width="100" height="70" rx="0" fill="#fce6de" stroke="#d9795d" stroke-width="2" /><text x="580" y="322" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#a8412a" text-anchor="middle">Front (6)</text><text x="580" y="410" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#12355b" text-anchor="middle">Unfolded 2D Net (6 Faces)</text><rect x="768.716" y="95" width="322.56800000000004" height="50" rx="25" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="930" y="129.1" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">Volume (Space Inside)</text><text x="930" y="175" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">V = length × width × height</text><text x="930" y="215" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">V = 8 × 4 × 5 = 160 cu in</text><rect x="742.0816" y="250" width="375.8368000000001" height="50" rx="25" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="930" y="284.1" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#a8412a" text-anchor="middle">Surface Area (All 6 Faces)</text><text x="930" y="330" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">SA = 2(lw + lh + wh)</text><text x="930" y="370" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#a8412a" text-anchor="middle">SA = 2(32 + 40 + 20) = 184 sq in</text><rect x="734.4064" y="396" width="391.18720000000013" height="48" rx="24" fill="#fef7e0" stroke="#f2c15b" stroke-width="2.5" /><text x="930" y="428.4" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#8a5a00" text-anchor="middle">2D net area = 3D surface area</text></g>
</svg>
