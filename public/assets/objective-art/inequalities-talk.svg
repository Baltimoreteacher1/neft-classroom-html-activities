<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="inequalities-talk-title">
<title id="inequalities-talk-title">The same two number lines graphing x &gt; 3 and x ≤ 5, with two partners drawn beneath them. Their speech bubbles explain that an open circle leaves the endpoint out while a closed circle takes it in, and that the shaded ray shows every number that makes the statement true.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Saying an inequality out loud</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><line x1="182" y1="150" x2="978" y2="150" stroke="#12355b" stroke-width="4" stroke-linecap="round" /><polygon points="174,150 192,140 192,160" fill="#12355b" /><polygon points="986,150 968,140 968,160" fill="#12355b" /><line x1="200" y1="138" x2="200" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="200" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">−2</text><line x1="276" y1="138" x2="276" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="276" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">−1</text><line x1="352" y1="138" x2="352" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="352" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">0</text><line x1="428" y1="138" x2="428" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="428" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">1</text><line x1="504" y1="138" x2="504" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="504" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">2</text><line x1="580" y1="138" x2="580" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="580" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">3</text><line x1="656" y1="138" x2="656" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="656" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">4</text><line x1="732" y1="138" x2="732" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="732" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">5</text><line x1="808" y1="138" x2="808" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="808" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">6</text><line x1="884" y1="138" x2="884" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="884" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">7</text><line x1="960" y1="138" x2="960" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="960" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">8</text><line x1="182" y1="310" x2="978" y2="310" stroke="#12355b" stroke-width="4" stroke-linecap="round" /><polygon points="174,310 192,300 192,320" fill="#12355b" /><polygon points="986,310 968,300 968,320" fill="#12355b" /><line x1="200" y1="298" x2="200" y2="322" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="200" y="352" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">−2</text><line x1="276" y1="298" x2="276" y2="322" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="276" y="352" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">−1</text><line x1="352" y1="298" x2="352" y2="322" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="352" y="352" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">0</text><line x1="428" y1="298" x2="428" y2="322" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="428" y="352" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">1</text><line x1="504" y1="298" x2="504" y2="322" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="504" y="352" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">2</text><line x1="580" y1="298" x2="580" y2="322" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="580" y="352" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">3</text><line x1="656" y1="298" x2="656" y2="322" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="656" y="352" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">4</text><line x1="732" y1="298" x2="732" y2="322" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="732" y="352" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">5</text><line x1="808" y1="298" x2="808" y2="322" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="808" y="352" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">6</text><line x1="884" y1="298" x2="884" y2="322" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="884" y="352" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">7</text><line x1="960" y1="298" x2="960" y2="322" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="960" y="352" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">8</text><line x1="580" y1="150" x2="972" y2="150" stroke="#d9795d" stroke-width="9" stroke-linecap="round" /><polygon points="994,150 970,137 970,163" fill="#d9795d" /><circle cx="580" cy="150" r="15" fill="#ffffff" stroke="#d9795d" stroke-width="5" /><line x1="732" y1="310" x2="188" y2="310" stroke="#1fa6a2" stroke-width="9" stroke-linecap="round" /><polygon points="166,310 190,297 190,323" fill="#1fa6a2" /><circle cx="732" cy="310" r="15" fill="#1fa6a2" /><rect x="205" y="46" width="190" height="60" rx="30" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="300" y="88.6" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#a8412a" text-anchor="middle">x &gt; 3</text><rect x="205" y="210" width="190" height="60" rx="30" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="300" y="252.6" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#12355b" text-anchor="middle">x ≤ 5</text><text x="800" y="84" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#5f6f80" text-anchor="middle">open circle — 3 is not a solution</text><text x="800" y="248" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#5f6f80" text-anchor="middle">closed circle — 5 is a solution</text><rect x="311.5239999999999" y="387" width="576.9520000000002" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="600" y="424.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">the shaded ray shows every solution</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">x &gt; 3 gets an open circle, because 3 itself is not</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">a solution — only the numbers past it.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">x ≤ 5 gets a closed circle, because 5 is included,</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">and the ray shows every other solution.</text>
</svg>
