<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="histogram-talk-title">
<title id="histogram-talk-title">The same histogram of reading time in five equal intervals, with two partners drawn beneath. Their speech bubbles say each bar counts how many students fall inside one interval, and that the bars touch because the intervals run straight on from one another.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Naming the parts of a histogram</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><line x1="190" y1="310" x2="1010" y2="310" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="round" /><text x="178" y="318" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#5f6f80" text-anchor="end">0</text><line x1="190" y1="262" x2="1010" y2="262" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="round" /><text x="178" y="270" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#5f6f80" text-anchor="end">2</text><line x1="190" y1="214" x2="1010" y2="214" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="round" /><text x="178" y="222" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#5f6f80" text-anchor="end">4</text><line x1="190" y1="166" x2="1010" y2="166" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="round" /><text x="178" y="174" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#5f6f80" text-anchor="end">6</text><line x1="190" y1="118" x2="1010" y2="118" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="round" /><text x="178" y="126" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#5f6f80" text-anchor="end">8</text><line x1="190" y1="70" x2="1010" y2="70" stroke="#d7e2ed" stroke-width="1.6" stroke-linecap="round" /><text x="178" y="78" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#5f6f80" text-anchor="end">10</text><rect x="200" y="238" width="160" height="72" rx="0" fill="#dff2ee" stroke="#12355b" stroke-width="3" /><text x="280" y="224" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">3</text><text x="280" y="344" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">0–9</text><rect x="360" y="142" width="160" height="168" rx="0" fill="#dff2ee" stroke="#12355b" stroke-width="3" /><text x="440" y="128" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">7</text><text x="440" y="344" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">10–19</text><rect x="520" y="94" width="160" height="216" rx="0" fill="#dff2ee" stroke="#12355b" stroke-width="3" /><text x="600" y="80" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">9</text><text x="600" y="344" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">20–29</text><rect x="680" y="190" width="160" height="120" rx="0" fill="#dff2ee" stroke="#12355b" stroke-width="3" /><text x="760" y="176" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">5</text><text x="760" y="344" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">30–39</text><rect x="840" y="262" width="160" height="48" rx="0" fill="#dff2ee" stroke="#12355b" stroke-width="3" /><text x="920" y="248" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">2</text><text x="920" y="344" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">40–49</text><line x1="200" y1="60" x2="200" y2="310" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><line x1="190" y1="310" x2="1010" y2="310" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="170" y="46" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="start">Students</text><text x="600" y="384" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">Minutes of reading</text><rect x="277.8279999999998" y="397" width="644.3440000000004" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="600" y="434.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">26 students · 5 equal intervals · no gaps</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Each bar counts how many students fall inside one</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">interval — the frequency for that interval.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The intervals are all 10 minutes wide and run</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">straight on, so the bars touch with no gaps.</text>
</svg>
