<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="rates-talk-title">
<title id="rates-talk-title">The same double number line matching dollars to pounds, with two partners drawn beneath it. Their speech bubbles say $12 for 4 pounds is a rate, and that dividing by 4 gives the unit rate of $3 for 1 pound.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Saying a rate out loud</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><rect x="212" y="118" width="211" height="214" rx="16" fill="#fce6de" /><line x1="220" y1="150" x2="220" y2="300" stroke="#d7e2ed" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7" /><line x1="415" y1="150" x2="415" y2="300" stroke="#d7e2ed" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7" /><line x1="610" y1="150" x2="610" y2="300" stroke="#d7e2ed" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7" /><line x1="805" y1="150" x2="805" y2="300" stroke="#d7e2ed" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7" /><line x1="1000" y1="150" x2="1000" y2="300" stroke="#d7e2ed" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7" /><line x1="202" y1="150" x2="1018" y2="150" stroke="#12355b" stroke-width="4" stroke-linecap="round" /><polygon points="194,150 212,140 212,160" fill="#12355b" /><polygon points="1026,150 1008,140 1008,160" fill="#12355b" /><line x1="220" y1="138" x2="220" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="220" y="124" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">0</text><line x1="415" y1="138" x2="415" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="415" y="124" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">3</text><line x1="610" y1="138" x2="610" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="610" y="124" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">6</text><line x1="805" y1="138" x2="805" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="805" y="124" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">9</text><line x1="1000" y1="138" x2="1000" y2="162" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="1000" y="124" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">12</text><line x1="202" y1="300" x2="1018" y2="300" stroke="#12355b" stroke-width="4" stroke-linecap="round" /><polygon points="194,300 212,290 212,310" fill="#12355b" /><polygon points="1026,300 1008,290 1008,310" fill="#12355b" /><line x1="220" y1="288" x2="220" y2="312" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="220" y="346" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">0</text><line x1="415" y1="288" x2="415" y2="312" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="415" y="346" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">1</text><line x1="610" y1="288" x2="610" y2="312" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="610" y="346" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">2</text><line x1="805" y1="288" x2="805" y2="312" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="805" y="346" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">3</text><line x1="1000" y1="288" x2="1000" y2="312" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="1000" y="346" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">4</text><text x="174" y="158" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#0c6f6b" text-anchor="end">Cost ($)</text><text x="174" y="308" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#8a5a00" text-anchor="end">Weight (lb)</text><text x="600" y="44" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#12355b" text-anchor="middle">$12 for 4 pounds</text><rect x="193.292" y="201" width="248.416" height="54" rx="27" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="317.5" y="238.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">$3 per 1 pound</text><rect x="270.3399999999998" y="397" width="659.3200000000004" height="54" rx="27" fill="#e6f7ef" stroke="#0f7c4a" stroke-width="2.5" /><text x="600" y="434.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f7c4a" text-anchor="middle">12 ÷ 4 = 3, so the unit rate is $3 per pound</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">$12 for 4 pounds is a rate, because it compares</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">two quantities with different units.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Dividing by 4 gives the unit rate: $3 for 1 pound,</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">which is the cost per pound.</text>
</svg>
