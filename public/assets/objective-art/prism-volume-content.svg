<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="prismVolume-content-title">
<title id="prismVolume-content-title">A 3D isometric rectangular prism 2 feet long, 1.5 feet wide and 1 foot tall, with its bottom face shaded and divided into half-foot squares. Two steps read: base area B = 2 × 1.5 = 3 square feet, then volume V = B × 1 = 3 cubic feet, which is the same as 2 × 1.5 × 1.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#12355b" text-anchor="start">Volume as base area × height</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">B = l × w   ·   V = B × h</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(88 190) scale(1)"><text x="600" y="48" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">Volume = base area × height</text><polygon points="150,180 330,180 420,130 240,130" fill="#fff" stroke="#12355b" stroke-width="2.5" /><polygon points="330,180 420,130 420,250 330,300" fill="#dff2ee" stroke="#12355b" stroke-width="2.5" /><polygon points="150,180 330,180 330,300 150,300" fill="#dff2ee" stroke="#12355b" stroke-width="2.5" /><polygon points="150,300 330,300 420,250 240,250" fill="#fef7e0" stroke="#f2c15b" stroke-width="3.5" /><line x1="210" y1="300" x2="300" y2="250" stroke="#f2c15b" stroke-width="1.5" stroke-linecap="round" /><line x1="270" y1="300" x2="360" y2="250" stroke="#f2c15b" stroke-width="1.5" stroke-linecap="round" /><line x1="150" y1="275" x2="330" y2="275" stroke="#f2c15b" stroke-width="1.5" stroke-linecap="round" /><line x1="150" y1="330" x2="316" y2="330" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="330,330 316,337.7 316,322.3" fill="#12355b" /><text x="240" y="392" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#12355b" text-anchor="middle">l = 2 ft</text><line x1="130" y1="180" x2="130" y2="286" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="130,300 122.3,286 137.7,286" fill="#12355b" /><text x="96" y="246" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#12355b" text-anchor="middle">h = 1 ft</text><line x1="344" y1="310" x2="417.77523217179123" y2="268.8231262296979" stroke="#12355b" stroke-width="2" stroke-linecap="round" /><polygon points="430,262 421.52795159812507,275.5467485352127 414.0225127454574,262.09950392418307" fill="#12355b" /><text x="424" y="320" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#12355b" text-anchor="middle">w = 1.5 ft</text><rect x="592.4968" y="105" width="335.00640000000004" height="50" rx="25" fill="#fef7e0" stroke="#f2c15b" stroke-width="2.5" /><text x="760" y="139.1" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#8a5a00" text-anchor="middle">Step 1 — shade the base</text><text x="760" y="190" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">B = l × w = 2 × 1.5</text><text x="760" y="230" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#8a5a00" text-anchor="middle">B = 3 square feet</text><rect x="550.1791999999999" y="271" width="419.6416000000002" height="50" rx="25" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="760" y="305.1" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0c6f6b" text-anchor="middle">Step 2 — stack it up the height</text><text x="760" y="356" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">V = B × h = 3 × 1</text><text x="760" y="396" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#0c6f6b" text-anchor="middle">V = 3 cubic feet (ft³)</text><text x="760" y="446" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#5f6f80" text-anchor="middle">same as l × w × h = 2 × 1.5 × 1 = 3</text></g>
</svg>
