ze="40" font-weight="800" fill="#12355b" text-anchor="middle">4</text><rect x="710" y="144" width="160" height="68" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="790" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#12355b" text-anchor="middle">5</text><rect x="330" y="224" width="110" height="68" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="385" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#12355b" text-anchor="middle">1</text><rect x="440" y="224" width="110" height="68" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="495" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#12355b" text-anchor="middle">6</text><rect x="550" y="224" width="50" height="68" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="575" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#12355b" text-anchor="middle">.</text><rect x="600" y="224" width="110" height="68" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="655" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#12355b" text-anchor="middle">2</text><rect x="710" y="224" width="160" height="68" rx="0" fill="#ffffff" stroke="#12355b" stroke-width="2" /><text x="790" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#12355b" text-anchor="middle">5</text><text x="304" y="190" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#a8412a" text-anchor="end">+</text><line x1="290" y1="214" x2="870" y2="214" stroke="#a8412a" stroke-width="4" stroke-linecap="round" /><text x="894" y="130" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#8a5a00" text-anchor="start">placeholder 0</text><line x1="888" y1="122" x2="846.9675993405174" y2="118.8436614877321" stroke="#8a5a00" stroke-width="2.5" stroke-linecap="round" /><polygon points="836,118 847.43161315877,112.81148185044754 846.5035855222648,124.87584112501668" fill="#8a5a00" /><line x1="575" y1="336" x2="575" y2="316" stroke="#0c6f6b" stroke-width="3" stroke-linecap="round" /><polygon points="575,302 582.7,316 567.3,316" fill="#0c6f6b" /><rect x="378.24159999999995" y="340" width="393.51680000000016" height="52" rx="26" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="575" y="375.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">the decimal points line up</text><rect x="430.24" y="401" width="339.5199999999999" height="54" rx="27" fill="#e6f7ef" stroke="#0f7c4a" stroke-width="2.5" /><text x="600" y="438.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f7c4a" text-anchor="middle">12.80 + 3.45 = 16.25</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The 8 is in the tenths place and the 0 is in the</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">hundredths place, so the columns match up.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">I write a placeholder 0 after 12.8 so every digit</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">still sits in a column of its own.</text>
