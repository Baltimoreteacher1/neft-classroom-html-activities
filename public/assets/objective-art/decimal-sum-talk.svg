<title id="decimalSum-talk-title">The same place-value chart adding 12.80 and 3.45 to make 16.25, with two partners drawn beneath it. Their speech bubbles name the tenths and hundredths places and explain that the 0 written after 12.8 is a placeholder that keeps every digit in its own column.</title>
