<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="centre-talk-title">
<title id="centre-talk-title">The same dot plot of 3, 5, 5, 6 and 11 with its mean, median and mode marked, and two partners drawn beneath. Their speech bubbles say the mean shares the total equally while the median is the middle value, and that the outlier 11 is why the two disagree.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Naming the measures of centre</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
