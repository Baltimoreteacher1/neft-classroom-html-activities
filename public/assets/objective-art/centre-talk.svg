ken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">3</text><line x1="453.3333333333333" y1="218" x2="453.3333333333333" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="453.3333333333333" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">4</text><line x1="516.6666666666667" y1="218" x2="516.6666666666667" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="516.6666666666667" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">5</text><line x1="580" y1="218" x2="580" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="580" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">6</text><line x1="643.3333333333334" y1="218" x2="643.3333333333334" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="643.3333333333334" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">7</text><line x1="706.6666666666666" y1="218" x2="706.6666666666666" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="706.6666666666666" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">8</text><line x1="770" y1="218" x2="770" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="770" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">9</text><line x1="833.3333333333334" y1="218" x2="833.3333333333334" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="833.3333333333334" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">10</text><line x1="896.6666666666666" y1="218" x2="896.6666666666666" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="896.6666666666666" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">11</text><line x1="960" y1="218" x2="960" y2="242" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="960" y="272" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#21313f" text-anchor="middle">12</text><circle cx="390" cy="206" r="12" fill="#12355b" /><circle cx="516.6666666666667" cy="206" r="12" fill="#12355b" /><circle cx="516.6666666666667" cy="178" r="12" fill="#12355b" /><circle cx="580" cy="206" r="12" fill="#12355b" /><circle cx="896.6666666666666" cy="206" r="12" fill="#12355b" /><rect x="125.06000000000003" y="313" width="309.87999999999994" height="54" rx="27" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="280" y="350.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">mean = 30 ÷ 5 = 6</text><rect x="498.256" y="313" width="203.48800000000003" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="600" y="350.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">median = 5</text><rect x="812.14" y="313" width="175.72" height="54" rx="27" fill="#fef7e0" stroke="#8a5a00" stroke-width="2.5" /><text x="900" y="350.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#8a5a00" text-anchor="middle">mode = 5</text><rect x="244.9119999999998" y="387" width="710.1760000000004" height="54" rx="27" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="600" y="424.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">the outlier 11 pulls the mean above the median</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The mean shares the total equally: 30 ÷ 5 = 6. The</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">median is the middle value, 5.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The mode is 5 because it appears most often, and the</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">outlier 11 is why the mean sits higher.</text>
</svg>
