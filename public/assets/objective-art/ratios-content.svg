<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="ratios-content-title">
<title id="ratios-content-title">Three teal squares, a colon, then two coral squares, labelled 3 : 2. Underneath, six teal squares and four coral squares are labelled 6 : 4, with a curved arrow marked times 2 joining the two rows and a note that the same ratio reads as 3 to 2, 3 : 2 or 3/2.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#12355b" text-anchor="start">Ratios and equivalent ratios</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">3 : 2 = 6 : 4</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(88 190) scale(1)"><rect x="300" y="76" width="72" height="72" rx="8" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><rect x="382" y="76" width="72" height="72" rx="8" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><rect x="464" y="76" width="72" height="72" rx="8" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><text x="566" y="132" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#12355b" text-anchor="middle">:</text><rect x="608" y="76" width="72" height="72" rx="8" fill="#fce6de" stroke="#d9795d" stroke-width="3" /><rect x="690" y="76" width="72" height="72" rx="8" fill="#fce6de" stroke="#d9795d" stroke-width="3" /><rect x="865" y="83" width="170" height="58" rx="29" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="950" y="123.9" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#12355b" text-anchor="middle">3 : 2</text><rect x="300" y="238" width="52" height="52" rx="8" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><rect x="360" y="238" width="52" height="52" rx="8" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><rect x="420" y="238" width="52" height="52" rx="8" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><rect x="480" y="238" width="52" height="52" rx="8" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><rect x="540" y="238" width="52" height="52" rx="8" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><rect x="600" y="238" width="52" height="52" rx="8" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><text x="686" y="278" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#12355b" text-anchor="middle">:</text><rect x="724" y="238" width="52" height="52" rx="8" fill="#fce6de" stroke="#d9795d" stroke-width="3" /><rect x="784" y="238" width="52" height="52" rx="8" fill="#fce6de" stroke="#d9795d" stroke-width="3" /><rect x="865" y="235" width="170" height="58" rx="29" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="950" y="275.9" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#12355b" text-anchor="middle">6 : 4</text><path d="M 268 116 Q 268 73 268 236" fill="none" stroke="#d9795d" stroke-width="3.5" stroke-linecap="round" /><polygon points="268,250 260.3,236 275.7,236" fill="#d9795d" /><rect x="105.976" y="159" width="88.048" height="54" rx="27" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="150" y="196.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">× 2</text><text x="600" y="356" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#5f6f80" text-anchor="middle">read it: 3 to 2, 3 : 2, or 3/2</text><rect x="494.2" y="387" width="211.6" height="54" rx="27" fill="#e6f7ef" stroke="#0f7c4a" stroke-width="2.5" /><text x="600" y="424.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f7c4a" text-anchor="middle">3 : 2 = 6 : 4</text></g>
</svg>
