<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="mathPractice-content-title">
<title id="mathPractice-content-title">Three boxes in a row hold a growing dot pattern — one dot, then three, then seven — with arrows between them. A heading reads Step 1, notice how the pattern grows. Two labels underneath read Step 2, test the rule: double it, then add 1, and Step 3, explain why: 7 x 2 + 1 = 15 comes next.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#12355b" text-anchor="start">Notice a rule, test it, explain why</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">1  ·  3  ·  7  →  double it, then add 1</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(88 190) scale(1)"><text x="600" y="60" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#12355b" text-anchor="middle">Step 1 · Notice how the pattern grows</text><rect x="210" y="96" width="180" height="132" rx="16" fill="#ffffff" stroke="#12355b" stroke-width="2.5" /><circle cx="264" cy="168" r="10" fill="#1fa6a2" /><text x="300" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">1 dot</text><rect x="510" y="96" width="180" height="132" rx="16" fill="#ffffff" stroke="#12355b" stroke-width="2.5" /><circle cx="564" cy="168" r="10" fill="#1fa6a2" /><circle cx="590" cy="168" r="10" fill="#1fa6a2" /><circle cx="616" cy="168" r="10" fill="#1fa6a2" /><text x="600" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">3 dots</text><rect x="810" y="96" width="180" height="132" rx="16" fill="#ffffff" stroke="#12355b" stroke-width="2.5" /><circle cx="864" cy="168" r="10" fill="#1fa6a2" /><circle cx="890" cy="168" r="10" fill="#1fa6a2" /><circle cx="916" cy="168" r="10" fill="#1fa6a2" /><circle cx="942" cy="168" r="10" fill="#1fa6a2" /><circle cx="864" cy="142" r="10" fill="#1fa6a2" /><circle cx="890" cy="142" r="10" fill="#1fa6a2" /><circle cx="916" cy="142" r="10" fill="#1fa6a2" /><text x="900" y="216" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#12355b" text-anchor="middle">7 dots</text><line x1="400" y1="162" x2="486" y2="162" stroke="#d9795d" stroke-width="3" stroke-linecap="round" /><polygon points="500,162 486,169.7 486,154.3" fill="#d9795d" /><line x1="700" y1="162" x2="786" y2="162" stroke="#d9795d" stroke-width="3" stroke-linecap="round" /><polygon points="800,162 786,169.7 786,154.3" fill="#d9795d" /><rect x="289.6735999999998" y="260" width="620.6528000000004" height="52" rx="26" fill="#fef7e0" stroke="#8a5a00" stroke-width="2.5" /><text x="600" y="295.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#8a5a00" text-anchor="middle">Step 2 · Test the rule: double it, then add 1</text><rect x="254.72959999999983" y="330" width="690.5408000000003" height="52" rx="26" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="600" y="365.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#a8412a" text-anchor="middle">Step 3 · Explain why: 7 × 2 + 1 = 15 comes next</text></g>
