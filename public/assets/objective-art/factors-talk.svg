<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="factors-talk-title">
<title id="factors-talk-title">The same two factor trees for 24 and 36, with two partners drawn beneath them. Their speech bubbles read that 24 breaks into the prime factors 2, 2, 2 and 3, and that both trees share 2, 2 and 3 so the greatest common factor of 24 and 36 is 12.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
