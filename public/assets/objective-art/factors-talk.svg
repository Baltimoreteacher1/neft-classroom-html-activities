<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><line x1="300" y1="88" x2="200" y2="126" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><line x1="200" y1="198" x2="140" y2="236" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><line x1="200" y1="198" x2="260" y2="236" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><line x1="300" y1="88" x2="400" y2="126" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><line x1="400" y1="198" x2="340" y2="236" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><line x1="400" y1="198" x2="460" y2="236" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><circle cx="300" cy="52" r="36" fill="#12355b" stroke="#12355b" stroke-width="3" /><text x="300" y="64" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">24</text><circle cx="200" cy="162" r="36" fill="#ffffff" stroke="#12355b" stroke-width="3" /><text x="200" y="174" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#12355b" text-anchor="middle">4</text><circle cx="400" cy="162" r="36" fill="#ffffff" stroke="#12355b" stroke-width="3" /><text x="400" y="174" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#12355b" text-anchor="middle">6</text><circle cx="140" cy="272" r="36" fill="#f2c15b" stroke="#8a5a00" stroke-width="3" /><text x="140" y="284" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">2</text><circle cx="260" cy="272" r="36" fill="#f2c15b" stroke="#8a5a00" stroke-width="3" /><text x="260" y="284" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">2</text><circle cx="340" cy="272" r="36" fill="#f2c15b" stroke="#8a5a00" stroke-width="3" /><text x="340" y="284" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">2</text><circle cx="460" cy="272" r="36" fill="#f2c15b" stroke="#8a5a00" stroke-width="3" /><text x="460" y="284" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">3</text><line x1="900" y1="88" x2="800" y2="126" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><line x1="800" y1="198" x2="740" y2="236" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><line x1="800" y1="198" x2="860" y2="236" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><line x1="900" y1="88" x2="1000" y2="126" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><line x1="1000" y1="198" x2="940" y2="236" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><line x1="1000" y1="198" x2="1060" y2="236" stroke="#5f6f80" stroke-width="3" stroke-linecap="round" /><circle cx="900" cy="52" r="36" fill="#12355b" stroke="#12355b" stroke-width="3" /><text x="900" y="64" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">36</text><circle cx="800" cy="162" r="36" fill="#ffffff" stroke="#12355b" stroke-width="3" /><text x="800" y="174" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#12355b" text-anchor="middle">4</text><circle cx="1000" cy="162" r="36" fill="#ffffff" stroke="#12355b" stroke-width="3" /><text x="1000" y="174" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#12355b" text-anchor="middle">9</text><circle cx="740" cy="272" r="36" fill="#f2c15b" stroke="#8a5a00" stroke-width="3" /><text x="740" y="284" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">2</text><circle cx="860" cy="272" r="36" fill="#f2c15b" stroke="#8a5a00" stroke-width="3" /><text x="860" y="284" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">2</text><circle cx="940" cy="272" r="36" fill="#f2c15b" stroke="#8a5a00" stroke-width="3" /><text x="940" y="284" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">3</text><circle cx="1060" cy="272" r="36" fill="#f2c15b" stroke="#8a5a00" stroke-width="3" /><text x="1060" y="284" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#8a5a00" text-anchor="middle">3</text><rect x="145.84" y="323" width="308.32" height="54" rx="27" fill="#ffffff" stroke="#12355b" stroke-width="2.5" /><text x="300" y="360.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">24 = 2 × 2 × 2 × 3</text><rect x="745.84" y="323" width="308.32" height="54" rx="27" fill="#ffffff" stroke="#12355b" stroke-width="2.5" /><text x="900" y="360.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="middle">36 = 2 × 2 × 3 × 3</text><rect x="130.86400000000003" y="389" width="338.27199999999993" height="54" rx="27" fill="#fef7e0" stroke="#8a5a00" stroke-width="2.5" /><text x="300" y="426.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#8a5a00" text-anchor="middle">GCF = 2 × 2 × 3 = 12</text><rect x="669.0880000000001" y="389" width="461.8239999999999" height="54" rx="27" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="900" y="426.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#a8412a" text-anchor="middle">LCM = 2 × 2 × 2 × 3 × 3 = 72</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">24 breaks down into the prime factors 2, 2, 2 and 3,</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">so I write 24 = 2 × 2 × 2 × 3.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">Both trees share 2, 2 and 3, so the greatest common</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">factor of 24 and 36 is 12.</text>
</svg>
