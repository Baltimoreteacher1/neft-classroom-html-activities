<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="expressions-content-title">
<title id="expressions-content-title">An area model: a rectangle three units tall is split into a part of width x and a part of width 5, and the two areas are labelled 3x and 15 beside the equation 3(x + 5) = 3x + 15. A key names 3 as the coefficient, x as the variable and 15 as the constant, calls 3x and 15 the terms, and checks that when x = 4 both forms give 27.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#12355b" text-anchor="start">Expressions and the distributive property</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">3(x + 5) = 3x + 15</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(88 190) scale(1)"><rect x="260" y="90" width="240" height="110" rx="0" fill="#dff2ee" stroke="#1fa6a2" stroke-width="3" /><rect x="500" y="90" width="200" height="110" rx="0" fill="#fef7e0" stroke="#f2c15b" stroke-width="3" /><text x="380" y="160" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#0c6f6b" text-anchor="middle">3x</text><text x="600" y="160" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#8a5a00" text-anchor="middle">15</text><line x1="260" y1="74" x2="500" y2="74" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="500" y1="74" x2="700" y2="74" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="260" y1="66" x2="260" y2="82" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="500" y1="66" x2="500" y2="82" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="700" y1="66" x2="700" y2="82" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><text x="380" y="58" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0c6f6b" text-anchor="middle">x</text><text x="600" y="58" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#8a5a00" text-anchor="middle">5</text><line x1="244" y1="90" x2="244" y2="200" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="236" y1="90" x2="252" y2="90" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><line x1="236" y1="200" x2="252" y2="200" stroke="#5f6f80" stroke-width="2.5" stroke-linecap="round" /><text x="224" y="156" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="end">3</text><text x="760" y="132" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#12355b" text-anchor="start">3(x + 5)</text><text x="760" y="192" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#a8412a" text-anchor="start">= 3x + 15</text><text x="380" y="238" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0c6f6b" text-anchor="middle">3 rows of x</text><text x="600" y="238" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#8a5a00" text-anchor="middle">3 rows of 5</text><text x="150" y="320" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0c6f6b" text-anchor="start">3 = coefficient</text><text x="150" y="372" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#12355b" text-anchor="start">x = variable</text><text x="150" y="424" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#8a5a00" text-anchor="start">15 = constant</text><text x="470" y="320" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#5f6f80" text-anchor="start">3x and 15 are terms</text><rect x="680.6208" y="336" width="398.7584" height="52" rx="26" fill="#dff2ee" stroke="#1fa6a2" stroke-width="2.5" /><text x="880" y="371.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#12355b" text-anchor="middle">when x = 4:  3(4 + 5) = 27</text><rect x="728.232" y="402" width="303.536" height="52" rx="26" fill="#e6f7ef" stroke="#0f7c4a" stroke-width="2.5" /><text x="880" y="437.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#0f7c4a" text-anchor="middle">and 3 × 4 + 15 = 27</text></g>
</svg>
