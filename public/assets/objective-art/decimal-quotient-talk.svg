<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="decimalQuotient-talk-title">
<title id="decimalQuotient-talk-title">The same pair of long division frames turning 7.2 ÷ 0.9 into 72 ÷ 9 = 8, with two partners drawn beneath. Their speech bubbles say that multiplying the divisor and the dividend by ten makes the divisor a whole number without changing the quotient.</title>
<rect x="0" y="0" width="1376" height="768" rx="0" fill="#f7f4ec" />
<rect x="20" y="20" width="1336" height="728" rx="30" fill="none" stroke="#d7e2ed" stroke-width="3" />
<text x="72" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#0c6f6b" text-anchor="start">Naming the move that clears a decimal</text><text x="1304" y="82" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0c6f6b" text-anchor="end">partner talk</text>
<rect x="44" y="112" width="1288" height="612" rx="26" fill="#ffffff" stroke="#d7e2ed" stroke-width="3" />
<g transform="translate(238 132) scale(0.75)"><text x="600" y="44" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#12355b" text-anchor="middle">Make the divisor a whole number</text><text x="300" y="232" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#0c6f6b" text-anchor="end">0.9</text><line x1="314" y1="190" x2="486" y2="190" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><path d="M 314 188 q 22 30 0 62" fill="none" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="404" y="232" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#12355b" text-anchor="middle">7.2</text><line x1="390" y1="320" x2="390" y2="278" stroke="#a8412a" stroke-width="3" stroke-linecap="round" /><polygon points="390,264 397.7,278 382.3,278" fill="#a8412a" /><rect x="342.6272" y="330" width="94.7456" height="52" rx="26" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="390" y="365.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#a8412a" text-anchor="middle">× 10</text><line x1="556" y1="214" x2="660" y2="214" stroke="#5f6f80" stroke-width="4" stroke-linecap="round" /><polygon points="676,214 660,222.8 660,205.2" fill="#5f6f80" /><text x="616" y="186" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#5f6f80" text-anchor="middle">same quotient</text><text x="800" y="232" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#0c6f6b" text-anchor="end">9</text><line x1="814" y1="190" x2="966" y2="190" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><path d="M 814 188 q 22 30 0 62" fill="none" stroke="#12355b" stroke-width="3.5" stroke-linecap="round" /><text x="890" y="232" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#12355b" text-anchor="middle">72</text><text x="916" y="172" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#a8412a" text-anchor="middle">8</text><line x1="890" y1="320" x2="890" y2="278" stroke="#a8412a" stroke-width="3" stroke-linecap="round" /><polygon points="890,264 897.7,278 882.3,278" fill="#a8412a" /><rect x="842.6272" y="330" width="94.7456" height="52" rx="26" fill="#fce6de" stroke="#d9795d" stroke-width="2.5" /><text x="890" y="365.8" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#a8412a" text-anchor="middle">× 10</text><rect x="417.13599999999997" y="397" width="365.728" height="54" rx="27" fill="#e6f7ef" stroke="#0f7c4a" stroke-width="2.5" /><text x="600" y="434.5" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f7c4a" text-anchor="middle">7.2 ÷ 0.9 = 72 ÷ 9 = 8</text></g><path d="M 64.5 567 a 37.5 37.5 0 0 1 75 0 z" fill="#1fa6a2" /><circle cx="102" cy="522" r="30" fill="#1fa6a2" /><circle cx="112.2" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="97.8" cy="518.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 93 532.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="144,543.2 172,521.36 172,565.04" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><rect x="170" y="486" width="1120" height="104" rx="20" fill="#ffffff" stroke="#1fa6a2" stroke-width="2.5" /><text x="730" y="528.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">I multiply the divisor and the dividend by 10 so</text><text x="730" y="566.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">the divisor becomes the whole number 9.</text><path d="M 1236.5 683 a 37.5 37.5 0 0 1 75 0 z" fill="#d9795d" /><circle cx="1274" cy="638" r="30" fill="#d9795d" /><circle cx="1263.8" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><circle cx="1278.2" cy="634.4" r="3.9000000000000004" fill="#ffffff" /><path d="M 1265 648.8 q 9 8.4 18 0" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" /><polygon points="1232,659.2 1204,637.36 1204,681.04" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><rect x="86" y="602" width="1120" height="104" rx="20" fill="#ffffff" stroke="#d9795d" stroke-width="2.5" /><text x="646" y="644.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">The quotient does not change, so 7.2 ÷ 0.9 is the</text><text x="646" y="682.52" font-family="Outfit, 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#21313f" text-anchor="middle">same as 72 ÷ 9, which is 8.</text>
</svg>
