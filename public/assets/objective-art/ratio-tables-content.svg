<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="ratioTables-content-title">
<title id="ratioTables-content-title">A ratio table of juice to water reading 1 and 3, 2 and 6, 3 and 9, 4 and 12, marked times 3. Beside it a graph plots those same pairs — (1, 3), (2, 6), (3, 9) and (4, 12) — and they all sit on one straight line through the origin.</title>
