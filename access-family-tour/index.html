<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="A guided, bilingual tour of the ACCESS Practice Lab for families. Seven short stops in any order show what each part of the site is for and how to use it, on any phone, tablet or computer. Recorrido guiado bilingüe del laboratorio ACCESS para familias."
    />
    <meta name="theme-color" content="#173a50" />
    <title>Family Expedition | Expedición familiar</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='11' fill='%23173a50'/%3E%3Cpath d='m18 5 3.5 9.5L31 18l-9.5 3.5L18 31l-3.5-9.5L5 18l9.5-3.5Z' fill='%23ffce5b'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --navy: #173a50;
        --ink: #163247;
        --muted: #496477;
        --line: #c2d2df;
        --paper: #edf5fa;
        --card: #fff;
        --gold: #ffce5b;
        --teal: #006a65;
        --accent: #234cda;
        --tint: #e8efff;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          17px/1.55 "Avenir Next",
          Avenir,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      a {
        color: #1843ba;
        text-underline-offset: 3px;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font:
          500 clamp(32px, 7vw, 56px) / 1.08 Georgia,
          serif;
        letter-spacing: -1px;
        color: var(--navy);
      }
      h2 {
        font-size: clamp(20px, 4.6vw, 24px);
        line-height: 1.3;
        color: var(--navy);
      }
      .es {
        display: block;
        font-weight: 500;
        color: var(--muted);
        margin-top: 2px;
      }
      button,
      .btn {
        font: inherit;
        font-weight: 700;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-height: 52px;
        padding: 11px 18px;
        border-radius: 10px;
        border: 1px solid #8ea7ba;
        background: var(--card);
        color: var(--navy);
        text-decoration: none;
        text-align: center;
        cursor: pointer;
        width: 100%;
        line-height: 1.3;
        touch-action: manipulation;
      }
      button:hover,
      .btn:hover {
        background: #f0f6fb;
        border-color: #5f7f96;
      }
      button .es,
      .btn .es {
        font-weight: 600;
        color: inherit;
        opacity: 0.85;
        margin: 0;
      }
      :focus-visible {
        outline: 3px solid #aa4600;
        outline-offset: 3px;
      }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .primary:hover {
        background: #1738ae;
        border-color: #1738ae;
      }
      .quiet {
        border-color: transparent;
        background: transparent;
        text-decoration: underline;
        text-underline-offset: 4px;
        font-weight: 600;
        min-height: 48px;
        width: auto;
        padding-inline: 8px;
      }
      .skip {
        position: absolute;
        top: -90px;
        background: #fff;
        padding: 12px;
        z-index: 30;
      }
      .skip:focus {
        top: 8px;
      }
      header,
      main,
      footer {
        max-width: 1040px;
        margin: auto;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px 14px;
        padding: 14px 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        color: var(--navy);
        font-size: 18px;
        text-decoration: none;
      }
      .brand svg {
        flex: none;
      }
      .brand small {
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        border-left: 1px solid #b7cad7;
        padding-left: 12px;
      }
      .head-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .head-actions button {
        width: auto;
        min-height: 48px;
        padding: 8px 14px;
        font-size: 15px;
        flex-direction: row;
      }
      .lang {
        display: flex;
        border: 1px solid #8ea7ba;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
      }
      .lang button {
        border: 0;
        border-radius: 0;
        font-size: 15px;
        background: #fff;
      }
      .lang button[aria-pressed="true"] {
        background: var(--navy);
        color: #fff;
      }
      main {
        padding: 6px 16px 36px;
        outline: none;
      }
      .tag,
      .pill {
        display: inline-block;
        justify-self: start;
        padding: 6px 13px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 750;
        line-height: 1.4;
      }
      .tag {
        background: #fff7dc;
        border: 1px solid #e1c477;
        color: #5c4300;
      }
      .pill {
        background: var(--tint);
        color: var(--accent);
      }
      .lead {
        font-size: 20px;
        line-height: 1.5;
      }
      .note {
        font-size: 15px;
        color: var(--muted);
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .row {
        display: grid;
        gap: 12px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* welcome */
      .welcome {
        display: grid;
        border: 1px solid #ccdae5;
        border-radius: 22px;
        overflow: hidden;
        background: #fff;
      }
      .welcome-copy {
        padding: 28px 22px;
      }
      .welcome-visual {
        display: none;
        background: #dfeff5;
        padding: 38px 30px;
        align-content: center;
      }
      .postcard {
        background: #fff;
        border: 1px solid #a8c0ce;
        border-radius: 14px;
        padding: 25px 24px;
        box-shadow: 9px 10px 0 #c0dae7;
        transform: rotate(3deg);
      }
      .postcard h2 {
        font:
          500 29px/1.15 Georgia,
          serif;
      }
      .icon-row {
        display: flex;
        justify-content: space-between;
        margin: 20px 0;
        color: var(--teal);
      }
      .icon-row svg {
        width: 37px;
        height: 37px;
      }
      .grades {
        display: grid;
        gap: 12px;
      }
      .grade {
        align-items: flex-start;
        text-align: left;
        padding: 16px 18px;
        min-height: 88px;
        border-radius: 12px;
      }
      .grade strong {
        font-size: 21px;
      }
      .grade[aria-pressed="true"] {
        border: 2px solid var(--teal);
        background: #eaf6f2;
      }
      .grade[aria-pressed="true"] strong::after {
        content: " ✓";
      }
      .brief {
        display: grid;
        gap: 16px;
        margin: 22px 6px 0;
      }
      .brief .n {
        display: block;
        font-size: 14px;
        font-weight: 750;
        color: var(--accent);
      }
      .brief h2 {
        font-size: 18px;
      }
      .brief p {
        font-size: 15px;
      }

      /* map */
      .hub-head {
        display: grid;
        gap: 10px;
        margin: 12px 4px 18px;
      }
      .hub-head p {
        font-size: 18px;
      }
      progress {
        width: 100%;
        height: 10px;
        accent-color: var(--teal);
      }
      .progress-line {
        font-weight: 750;
      }
      .hub-layout {
        display: grid;
        gap: 18px;
        grid-template-areas: "next" "map" "ticket";
      }
      .next-card {
        grid-area: next;
      }
      .worldmap {
        grid-area: map;
      }
      .ticket {
        grid-area: ticket;
      }
      .railcard {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
      }
      .next-card {
        border-top: 5px solid var(--gold);
      }
      .ticket {
        border-top: 5px solid var(--teal);
      }
      .visit-list {
        list-style: none;
        padding: 0;
        margin: 6px 0 12px;
      }
      .visit-list li {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 16px;
        padding: 6px 0;
      }
      .checkdot {
        display: grid;
        place-items: center;
        min-width: 24px;
        height: 24px;
        border: 1px solid #9db4c2;
        border-radius: 50%;
        font-size: 13px;
      }
      .checkdot.done {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }
      .worldmap {
        position: relative;
        border: 1px solid #bad1dd;
        border-radius: 20px;
        background: #e2f0f3;
        padding: 18px 14px 20px;
        display: grid;
        gap: 14px;
        overflow: hidden;
      }
      .terrain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.7;
      }
      .map-label {
        position: relative;
        font-size: 13px;
        color: #3d6372;
        font-weight: 700;
      }
      .portals {
        position: relative;
        display: grid;
        gap: 14px;
      }
      .portal {
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr);
        column-gap: 12px;
        align-items: center;
        text-align: left;
        padding: 16px 16px 12px;
        min-height: 112px;
        border: 1px solid #a7becb;
        border-bottom: 5px solid var(--accent);
        border-radius: 13px;
        box-shadow: 0 5px 0 #b8d1de;
      }
      .portal:hover {
        background: #fff;
        box-shadow: 0 7px 0 #b8d1de;
      }
      .portal .icon {
        grid-row: 1 / 3;
        width: 46px;
        height: 46px;
        padding: 10px;
        border-radius: 10px;
        background: var(--tint);
        color: var(--accent);
      }
      .portal .icon svg {
        width: 100%;
        height: 100%;
      }
      .portal .name {
        font-size: 19px;
        font-weight: 800;
        display: block;
        text-align: left;
      }
      .portal .place {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        display: block;
        text-align: left;
      }
      .portal .badge {
        grid-column: 1 / -1;
        margin-top: 8px;
        font-size: 13px;
        color: var(--accent);
        font-weight: 750;
        display: block;
        text-align: left;
      }
      .portal.next {
        border: 2px solid var(--accent);
        border-bottom-width: 5px;
        background: var(--tint);
      }
      .portal.visited .badge {
        color: #006449;
      }

      /* stop */
      .return-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 10px 0 14px;
      }
      .screen {
        background: #fff;
        border: 1px solid #ccdbe4;
        border-radius: 20px;
        overflow: hidden;
      }
      .destination-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        background: var(--tint);
        padding: 22px 20px;
        border-bottom: 1px solid #d1dfe7;
      }
      .destination-top h1 {
        font-size: clamp(30px, 7vw, 48px);
        margin-top: 10px;
      }
      .large-icon {
        width: 76px;
        height: 76px;
        padding: 16px;
        color: var(--accent);
        border: 2px solid currentColor;
        border-radius: 50%;
        transform: rotate(-7deg);
      }
      .large-icon svg {
        width: 100%;
        height: 100%;
      }
      .destination-body {
        padding: 20px;
        display: grid;
        gap: 18px;
      }
      .mini-map {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .mini-map button {
        display: grid;
        justify-items: center;
        gap: 4px;
        min-height: 68px;
        padding: 8px 2px;
        font-size: 13px;
        border-radius: 10px;
      }
      .mini-map svg {
        width: 24px;
        height: 24px;
        color: var(--accent);
      }
      .mini-map button[aria-current="page"] {
        border: 2px solid var(--accent);
        background: var(--tint);
      }
      .mini-map button.visited::after {
        content: "✓";
        font-size: 12px;
        color: var(--teal);
        line-height: 1;
      }
      .steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 14px;
        counter-reset: s;
      }
      .steps li {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        counter-increment: s;
      }
      .steps li::before {
        content: counter(s);
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-weight: 800;
        font-size: 15px;
        display: grid;
        place-items: center;
        margin-top: 1px;
      }
      .playcard {
        border: 1px solid #b8cdd8;
        border-radius: 13px;
        padding: 20px;
        background: #f8fbfd;
        display: grid;
        gap: 16px;
      }
      .ask {
        background: #fff6de;
        border: 1px solid #ddc98c;
        border-radius: 12px;
        padding: 14px 16px;
      }
      .ask strong {
        color: #6b4a00;
      }
      .stop-actions {
        display: grid;
        gap: 10px;
        border-top: 1px solid #ccdae4;
        padding-top: 18px;
      }
      .stop-actions .primary {
        background: var(--accent);
        border-color: var(--accent);
      }
      .collected {
        background: #e5f6ed;
        border: 1px solid #afd1be;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        color: #064a35;
      }

      /* end */
      .outro {
        background: #fff;
        border: 1px solid #c2d4df;
        border-radius: 20px;
        padding: 26px 20px;
      }
      .stars {
        font-size: 34px;
        letter-spacing: 6px;
        color: #8a5f00;
        text-align: center;
      }
      .souvenirs {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }
      .souvenir {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        background: var(--tint);
        color: var(--accent);
        border: 1px solid #c2d2df;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 700;
      }
      .souvenir svg {
        width: 20px;
        height: 20px;
      }
      .confirm {
        max-width: 1008px;
        margin: 0 auto 14px;
        padding: 16px;
        background: #fff6de;
        border: 1px solid #ddc98c;
        border-radius: 12px;
      }
      .confirm .row {
        margin-top: 12px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        background: var(--navy);
        color: #fff;
        border: 2px solid var(--gold);
        padding: 12px 22px;
        border-radius: 30px;
        font-size: 16px;
        max-width: 92%;
        text-align: center;
        z-index: 5;
      }
      footer {
        padding: 0 16px 30px;
        color: var(--muted);
        font-size: 14px;
      }
      [hidden] {
        display: none !important;
      }
      .portal {
        min-height: 92px;
      }
      .portal .icon {
        grid-row: 1;
      }
      .mini-map {
        grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      }
      @media (min-width: 640px) {
        .grades,
        .row.two,
        .brief,
        .portals {
          grid-template-columns: 1fr 1fr;
        }
        .brief {
          grid-template-columns: repeat(3, 1fr);
        }
        .portals .portal:nth-child(even) {
          margin-top: 26px;
        }
        .destination-top,
        .destination-body,
        .outro {
          padding-inline: 32px;
        }
        .stop-actions {
          grid-template-columns: auto 1fr;
          align-items: center;
        }
        .large-icon {
          width: 110px;
          height: 110px;
          padding: 24px;
        }
      }
      @media (min-width: 900px) {
        header,
        main,
        footer {
          padding-inline: 28px;
        }
        .welcome {
          grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
        }
        .welcome-copy {
          padding: 42px 44px;
        }
        .welcome-visual {
          display: grid;
        }
        .hub-layout {
          grid-template-columns: minmax(0, 1fr) 290px;
          grid-template-areas: "map next" "map ticket";
          align-items: start;
        }
        .worldmap {
          padding: 26px 24px 30px;
        }
      }
      @media (max-width: 520px) {
        .brand small {
          display: none;
        }
        .head-actions {
          width: 100%;
        }
        .lang {
          flex: 1 1 100%;
        }
        .head-actions > button {
          flex: 1;
        }
        .lang button {
          flex: 1;
          padding-inline: 6px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        main > * {
          animation: rise 0.25s ease-out;
        }
        .portal {
          transition:
            transform 0.15s,
            box-shadow 0.15s;
        }
        .portal:hover {
          transform: translateY(-2px);
        }
        @keyframes rise {
          from {
            opacity: 0;
            transform: translateY(6px);
          }
          to {
            opacity: 1;
            transform: none;
          }
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#content">Skip to the tour · Saltar al recorrido</a>
    <header>
      <a class="brand" href="/access-practice-lab/family"
        ><svg aria-hidden="true" width="34" height="34" viewBox="0 0 36 36">
          <rect width="36" height="36" rx="11" fill="#173a50" />
          <path d="m18 5 3.5 9.5L31 18l-9.5 3.5L18 31l-3.5-9.5L5 18l9.5-3.5Z" fill="#ffce5b" /></svg
        ><span>EduWonderLab <small id="brandSub"></small></span
      ></a>
      <nav class="head-actions" aria-label="Tour / Recorrido">
        <div class="lang" role="group" aria-label="Language / Idioma" id="lang"></div>
        <button type="button" id="mapBtn" hidden></button>
        <button type="button" id="resetBtn" hidden></button>
      </nav>
    </header>
    <div id="resetBar" class="confirm" role="alertdialog" aria-labelledby="resetMsg" hidden></div>
    <main id="content" tabindex="-1"></main>
    <footer id="foot"></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      ><p style="padding: 16px">
        Turn on JavaScript to use the Family Expedition, or go to the
        <a href="/access-practice-lab/family">Family Corner</a>. · Active JavaScript para usar la
        Expedición familiar, o vaya al <a href="/access-practice-lab/family">Rincón de la familia</a>.
      </p></noscript
    >
    <script type="module">
      import {
        LAB,
        MODES,
        STOPS,
        TOTAL,
        esc,
        loadState,
        modeOf,
        saveState,
        stopUrl,
        tr,
        trText,
      } from "./stops.js";

      (() => {
        const LAB_PREFS = "accessPracticeLab:v1:prefs";

        const ICONS = {
          listening:
            '<path d="M5 14v-4a7 7 0 0 1 14 0v4M5 11H3v7h4v-7Zm14 0h2v7h-4v-7ZM9 11v5m3-7v9m3-7v5"/>',
          home: '<path d="m2 10 10-8 10 8M5 8v14h14V8M9 22v-7h6v7"/>',
          find: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
          help: '<circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/>',
          passport:
            '<path d="M5 2h14a2 2 0 0 1 2 2v18H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm0 0v20M9 18h8"/><circle cx="13" cy="10" r="4"/>',
          trip: '<circle cx="12" cy="12" r="10"/><path d="m16 8-3 5-5 3 3-5 5-3Z"/>',
          save: '<path d="M5 3h12l2 2v16H5Z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/>',
        };
        const svg = (id) =>
          `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</svg>`;

        const COPY = {
          sub: ["Family expedition", "Expedición familiar"],
          tagline: [
            "A guided tour for the whole family",
            "Un recorrido guiado para toda la familia",
          ],
          welcomeTitle: ["Family Expedition", "Expedición familiar"],
          welcomeLead: [
            `${TOTAL} short stops, in any order. At each one you open a real part of the site, see what it is for, and try it. About ${TOTAL * 2} minutes in all. Stop any time and come back.`,
            `${TOTAL} paradas cortas, en el orden que quieran. En cada una abren una parte real del sitio, ven para qué sirve y la prueban. Unos ${TOTAL * 2} minutos en total. Pueden parar cuando quieran y volver.`,
          ],
          pickGrade: [
            "Tap your child’s grade so the links open the right practice.",
            "Toquen el grado de su hijo o hija para que los enlaces abran la práctica correcta.",
          ],
          g35: ["Grades 3–5", "Grados 3–5"],
          g35s: ["Elementary school", "Primaria"],
          g68: ["Grades 6–8", "Grados 6–8"],
          g68s: ["Middle school", "Secundaria"],
          saved: [
            "No account. Your place is saved on this device only.",
            "Sin cuenta. Su avance se guarda solo en este dispositivo.",
          ],
          practiceNote: [
            "The practice itself is in English. These pages explain the site in your language.",
            "La práctica es en inglés. Estas páginas explican el sitio en su idioma.",
          ],
          postcardTitle: ["Seven stops.\nYour route.", "Siete paradas.\nSu ruta."],
          postcardLine: [
            "Home base, today’s mission,\nhelp, passport and more.",
            "Punto de partida, misión de hoy,\nayuda, pasaporte y más.",
          ],
          brief: [
            [
              "01 · Pick a stop",
              "Escojan una parada",
              "Go in any order. The map keeps your place.",
              "Vayan en el orden que quieran. El mapa guarda su avance.",
            ],
            [
              "02 · See it for real",
              "Véanlo de verdad",
              "Each stop opens a real part of the site, with a guide beside you.",
              "Cada parada abre una parte real del sitio, con una guía a su lado.",
            ],
            [
              "03 · Check it off",
              "Márquenlo",
              "Come back, tap the check, and head to the next stop.",
              "Regresen, toquen la marca y sigan a la próxima parada.",
            ],
          ],
          mapTitle: ["Pick your next stop", "Escojan su próxima parada"],
          mapLead: [
            `${TOTAL} stops. Any order. About 2 minutes each.`,
            `${TOTAL} paradas. En cualquier orden. Unos 2 minutos cada una.`,
          ],
          progress: (n) => [`${n} of ${TOTAL} stops done`, `${n} de ${TOTAL} paradas hechas`],
          nextTitle: ["Up next", "Sigue"],
          startStop: (name) => [`Start with ${name[0]}`, `Empezar con ${name[1]}`],
          nextStop: (name) => [`Next stop: ${name[0]}`, `Próxima parada: ${name[1]}`],
          seeEnd: ["See what’s next", "Ver qué sigue"],
          nextHelp: [
            "Not sure where to start? Tap the big button. Or pick any door on the map.",
            "¿No saben por dónde empezar? Toquen el botón grande. O escojan cualquier puerta del mapa.",
          ],
          mapLabel: [
            "Expedition map · every door is open",
            "Mapa de la expedición · todas las puertas están abiertas",
          ],
          ticketTitle: ["Our tour", "Nuestro recorrido"],
          startHere: ["Start here", "Empiecen aquí"],
          upNext: ["Up next", "Sigue"],
          doneOpen: ["✓ Done · open again", "✓ Hecho · abrir otra vez"],
          openStop: ["Open this stop", "Abrir esta parada"],
          changeGrade: ["Change grade", "Cambiar de grado"],
          stopOf: (n) => [`Stop ${n} of ${TOTAL}`, `Parada ${n} de ${TOTAL}`],
          about: ["About 2 minutes", "Unos 2 minutos"],
          open: ["Open this part of the site", "Abrir esta parte del sitio"],
          comeBack: [
            "A guide stays with you while you look around: beside the page on a computer, at the bottom on a phone. Tap “Back to the tour” in it any time.",
            "Una guía los acompaña mientras exploran: al lado de la página en una computadora, abajo en un teléfono. Toquen “Volver al recorrido” cuando quieran.",
          ],
          where: ["Where to next?", "¿A dónde ahora?"],
          didNext: (name) => [`I know this one. Next: ${name[0]}`, `Ya lo conozco. Sigue: ${name[1]}`],
          didLast: ["I know this one. See what’s next", "Ya lo conozco. Ver qué sigue"],
          doneHere: ["This stop is checked off. ✓", "Esta parada ya está marcada. ✓"],
          backMap: ["‹ Back to map", "‹ Volver al mapa"],
          mapBtn: ["Map", "Mapa"],
          askTitle: ["Good to know", "Es bueno saber"],
          toastDone: ["Stop checked off!", "¡Parada marcada!"],
          endTitle: ["You know your way around!", "¡Ya conocen el sitio!"],
          endLead: [
            "Come back to any stop whenever you want a reminder.",
            "Vuelvan a cualquier parada cuando quieran un recordatorio.",
          ],
          readyTitle: ["Ready to practice?", "¿Listos para practicar?"],
          again: ["Take the tour again", "Hacer el recorrido otra vez"],
          start: ["Start over", "Empezar de nuevo"],
          startQ: ["Start over from the beginning?", "¿Empezar de nuevo desde el principio?"],
          startQd: [
            "This clears your grade and your checked stops on this page. Your lab practice stays saved.",
            "Esto borra su grado y las paradas marcadas en esta página. Su práctica en el laboratorio se conserva.",
          ],
          yesStart: ["Yes, start over", "Sí, empezar de nuevo"],
          keep: ["Keep my place", "Conservar mi avance"],
          fresh: [
            "Fresh start. Pick a grade to begin.",
            "Comienzo nuevo. Elijan un grado para empezar.",
          ],
          foot: [
            "A family companion to the ACCESS Practice Lab by EduWonderLab. No names or emails are collected here.",
            "Un complemento familiar del Laboratorio de práctica ACCESS de EduWonderLab. Aquí no se recopilan nombres ni correos.",
          ],
          adventure: ["Family Adventure", "Aventura familiar"],
          adventureHelp: [
            "Four short practice activities, one for each skill",
            "Cuatro actividades cortas de práctica, una por cada destreza",
          ],
          mission: ["Start today’s mission", "Empezar la misión de hoy"],
          missionHelp: [
            "Five to fifteen minutes of practice",
            "De cinco a quince minutos de práctica",
          ],
          labLink: ["ACCESS Lab", "Laboratorio ACCESS"],
        };

        const fresh = () => ({ lang: "", band: "", stop: 0, done: [], view: "welcome" });
        let state = fresh(),
          toastTimer;
        const $ = (id) => document.getElementById(id);
        // Language: one decision point (see stops.js for the three modes).
        const mode = () => modeOf(state.lang);
        const lines = (v) => String(v).replace(/\n/g, "\u0000");
        const T = (pair) => tr(state.lang, pair.map(lines)).replace(/\u0000/g, "<br>");
        const S = (pair) => trText(state.lang, pair);

        function readLabPrefs() {
          try {
            return JSON.parse(localStorage.getItem(LAB_PREFS) || "{}") || {};
          } catch {
            return {};
          }
        }
        function shareLangWithLab() {
          // The lab reads the same preference, so a family only chooses a language once.
          try {
            const p = readLabPrefs();
            localStorage.setItem(
              LAB_PREFS,
              JSON.stringify({ ...p, lang: mode(), langChosen: true }),
            );
          } catch {}
        }
        function restore() {
          const saved = loadState();
          const lab = readLabPrefs();
          const navEs = /^es\b/i.test(navigator.language || "");
          state.lang = saved?.lang
            ? saved.lang
            : lab.langChosen && MODES.includes(lab.lang)
              ? lab.lang
              : navEs
                ? "es"
                : "en";
          if (saved) Object.assign(state, saved, { lang: state.lang });
        }
        const save = () => saveState(state);

        const theme = (s) => `--accent:${s.color};--tint:${s.tint}`;
        const isDone = (i) => state.done.includes(i);
        // The stop to suggest: the first one not done, searching on from the stop the family is on.
        function nextIdx() {
          const start = isDone(state.stop) ? state.stop + 1 : state.stop;
          for (let k = 0; k < TOTAL; k++) {
            const i = (start + k) % TOTAL;
            if (!isDone(i)) return i;
          }
          return -1;
        }
        // The stop after the current one: the first one not done, wrapping, never the current stop.
        function following() {
          for (let k = 1; k < TOTAL; k++) {
            const i = (state.stop + k) % TOTAL;
            if (!isDone(i)) return i;
          }
          return -1;
        }
        const gradeLabel = () => (state.band === "6-8" ? COPY.g68 : COPY.g35);

        function welcome() {
          const grade = (band, title, sub) =>
            `<button type="button" class="grade" data-band="${band}" aria-pressed="${state.band === band}"><strong>${T(title)}</strong><span>${T(sub)}</span></button>`;
          return `<section class="welcome"><div class="welcome-copy stack"><span class="tag">${esc(S(COPY.tagline))}</span>
  <h1>${T(COPY.welcomeTitle)}</h1><p class="lead">${T(COPY.welcomeLead)}</p>
  <h2>${T(COPY.pickGrade)}</h2>
  <div class="grades">${grade("3-5", COPY.g35, COPY.g35s)}${grade("6-8", COPY.g68, COPY.g68s)}</div>
  <p class="note">${T(COPY.practiceNote)}</p><p class="note">${T(COPY.saved)}</p></div>
  <div class="welcome-visual" aria-hidden="true"><div class="postcard"><span class="note">${esc(S(COPY.sub))}</span><h2>${T(COPY.postcardTitle)}</h2><div class="icon-row">${STOPS.slice(0, 4)
    .map((s) => svg(s.id))
    .join("")}</div><p class="note">${T(COPY.postcardLine)}</p></div></div></section>
  <section class="brief" aria-label="${esc(S(COPY.sub))}">${COPY.brief.map(([n, nEs, t, tEs]) => `<div><span class="n">${T([n, nEs])}</span><p>${T([t, tEs])}</p></div>`).join("")}</section>`;
        }

        function terrain() {
          return `<svg class="terrain" viewBox="0 0 900 650" preserveAspectRatio="none" aria-hidden="true"><g stroke="#c0dde2" fill="none"><path d="M-40 80Q170-10 320 120T940 90M-40 170Q170 80 320 210T940 180M-40 260Q170 170 320 300T940 270M-40 350Q170 260 320 390T940 360M-40 440Q170 350 320 480T940 450M-40 530Q170 440 320 570T940 540"/></g><path d="M220 135C395 10 735 125 670 200S120 220 220 295 760 265 670 365 120 390 220 465 760 440 670 530" fill="none" stroke="#729aaf" stroke-width="3" stroke-dasharray="6 9"/></svg>`;
        }
        function portal(s, i) {
          const done = isDone(i),
            next = i === nextIdx();
          const badge = done
            ? COPY.doneOpen
            : next
              ? state.done.length
                ? COPY.upNext
                : COPY.startHere
              : COPY.openStop;
          return `<button type="button" class="portal ${done ? "visited" : ""} ${next ? "next" : ""}" style="${theme(s)}" data-stop="${i}"><span class="icon">${svg(s.id)}</span><span class="name">${T(s.name)}</span><span class="badge">${T(badge)}</span></button>`;
        }
        function visitList() {
          return `<ul class="visit-list">${STOPS.map((s, i) => `<li><span class="checkdot ${isDone(i) ? "done" : ""}" aria-hidden="true">${isDone(i) ? "✓" : "·"}</span>${T(s.name)}</li>`).join("")}</ul>`;
        }
        function map() {
          const n = state.done.length,
            nx = nextIdx();
          const go =
            nx < 0
              ? `<button type="button" class="primary" data-view="end">${T(COPY.seeEnd)}</button>`
              : `<button type="button" class="primary" data-stop="${nx}">${T((n ? COPY.nextStop : COPY.startStop)(STOPS[nx].name))}</button>`;
          return `<div class="hub-head"><span class="tag">${esc(S(gradeLabel()))}</span><h1>${T(COPY.mapTitle)}</h1><p>${T(COPY.mapLead)}</p>
  <div><div class="progress-line">${T(COPY.progress(n))}</div><progress max="${TOTAL}" value="${n}" aria-label="${esc(S(COPY.progress(n)))}"></progress></div></div>
  <div class="hub-layout">
  <section class="railcard next-card"><h2>${T(COPY.nextTitle)}</h2><div class="stack"><p class="note">${T(COPY.nextHelp)}</p>${go}</div></section>
  <section class="worldmap" aria-label="${esc(S(COPY.mapLabel))}">${terrain()}<div class="map-label">${esc(S(COPY.mapLabel))}</div><div class="portals">${STOPS.map(portal).join("")}</div></section>
  <section class="railcard ticket"><h2>${T(COPY.ticketTitle)}</h2>${visitList()}<button type="button" class="quiet" data-view="welcome">${T(COPY.changeGrade)}</button></section></div>`;
        }

        function miniMap(current) {
          return `<nav class="mini-map" aria-label="${esc(S(COPY.where))}">${STOPS.map((s, i) => `<button type="button" style="${theme(s)}" class="${isDone(i) ? "visited" : ""}" data-stop="${i}" ${i === current ? 'aria-current="page"' : ""}>${svg(s.id)}${T(s.name)}</button>`).join("")}</nav>`;
        }
        function stop() {
          const s = STOPS[state.stop],
            done = isDone(state.stop);
          const nx = following();
          const doneLabel = nx < 0 ? COPY.didLast : COPY.didNext(STOPS[nx].name);
          return `<div class="return-line"><button type="button" class="quiet" data-view="map">${T(COPY.backMap)}</button><span class="tag">${esc(S(COPY.stopOf(state.stop + 1)))} · ${esc(S(COPY.about))}</span></div>
  <article class="screen" style="${theme(s)}"><header class="destination-top"><div><span class="pill">${esc(S(s.name))}</span><h1 id="stopTitle">${T(s.title)}</h1></div><div class="large-icon">${svg(s.id)}</div></header>
  <div class="destination-body">${miniMap(state.stop)}
  <p class="lead">${T(s.what)}</p>
  <section class="playcard"><ol class="steps">${s.steps.map(([e, es]) => `<li><span>${T([e, es])}</span></li>`).join("")}</ol>
  <a class="btn primary" href="${stopUrl(state.stop, state.band)}">${T(COPY.open)}</a>
  <p class="note">${T(COPY.comeBack)}</p></section>
  <div class="ask"><strong>${T(COPY.askTitle)}</strong><p>${T(s.tip)}</p></div>
  ${done ? `<p class="collected">${T(COPY.doneHere)}</p>` : ""}
  <div class="stop-actions"><button type="button" class="quiet" data-view="map">${T(COPY.backMap)}</button><button type="button" class="primary" data-done>${T(doneLabel)}</button></div></div></article>`;
        }
        function end() {
          const n = state.done.length;
          const link = (href, title, help) =>
            `<a class="btn" href="${href}">${T(title)}<span class="note">${T(help)}</span></a>`;
          return `<section class="outro stack"><div class="stars" role="img" aria-label="${n} / ${TOTAL}">${STOPS.map((_, i) => (isDone(i) ? "★" : "☆")).join("")}</div>
  <h1>${T(COPY.endTitle)}</h1><p class="lead">${T(COPY.endLead)}</p>
  <h2>${T(COPY.readyTitle)}</h2>
  <div class="row">${link("/access-family-expedition/", COPY.adventure, COPY.adventureHelp)}${link(`${LAB}/?grades=${state.band}`, COPY.mission, COPY.missionHelp)}</div>
  <div class="row two"><button type="button" data-view="map">${T(COPY.backMap)}</button><button type="button" data-restart-run>${T(COPY.again)}</button></div></section>`;
        }

        function chrome() {
          const labels = { en: "English", es: "Español", bi: "EN + ES" };
          $("lang").innerHTML = MODES.map(
            (m) =>
              `<button type="button" data-lang="${m}" aria-pressed="${mode() === m}" ${m === "es" ? 'lang="es"' : ""}>${labels[m]}</button>`,
          ).join("");
          const started = !!state.band;
          $("mapBtn").hidden = !started || state.view === "map";
          $("mapBtn").textContent = S(COPY.mapBtn);
          $("resetBtn").hidden = !started;
          $("resetBtn").textContent = S(COPY.start);
          $("brandSub").textContent = S(COPY.sub);
          $("resetBar").innerHTML =
            `<p id="resetMsg"><strong>${T(COPY.startQ)}</strong><br>${T(COPY.startQd)}</p><div class="row two"><button type="button" class="primary" data-reset>${T(COPY.yesStart)}</button><button type="button" data-reset-cancel>${T(COPY.keep)}</button></div>`;
          $("foot").innerHTML =
            `<p>${T(COPY.foot)}</p><p><a href="${LAB}/">${esc(S(COPY.labLink))}</a></p>`;
          document.documentElement.lang = mode() === "es" ? "es" : "en";
          document.title = S(["Family Expedition", "Expedición familiar"]) + " | EduWonderLab";
        }
        function render(focus = true) {
          if (!state.band) state.view = "welcome";
          const views = { welcome, map, stop, end };
          $("content").innerHTML = (views[state.view] || map)();
          chrome();
          save();
          if (focus) {
            $("content").focus({ preventScroll: true });
            window.scrollTo(0, 0);
          }
        }
        function toast(pair) {
          clearTimeout(toastTimer);
          $("toast").textContent = S(pair);
          $("toast").hidden = false;
          toastTimer = setTimeout(() => {
            $("toast").hidden = true;
          }, 2600);
        }
        function finishStop() {
          if (!isDone(state.stop)) {
            state.done.push(state.stop);
            toast(COPY.toastDone);
          }
          const nx = nextIdx();
          if (nx < 0) {
            state.view = "end";
          } else {
            state.stop = nx;
            state.view = "stop";
          }
          render();
        }

        document.addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          if (b.dataset.lang) {
            state.lang = b.dataset.lang;
            shareLangWithLab();
            render(false);
            $("lang").querySelector(`[data-lang="${state.lang}"]`)?.focus();
            return;
          }
          if (b.dataset.band) {
            state.band = b.dataset.band;
            state.view = "map";
            render();
            return;
          }
          if (b.dataset.stop !== undefined) {
            state.stop = Number(b.dataset.stop);
            state.view = "stop";
            render();
            return;
          }
          if (b.dataset.view) {
            state.view = b.dataset.view;
            render();
            return;
          }
          if ("done" in b.dataset) return finishStop();
          if ("restartRun" in b.dataset) {
            state.view = "map";
            state.stop = 0;
            state.done = [];
            render();
            return;
          }
          if (b.id === "mapBtn") {
            state.view = "map";
            render();
            return;
          }
          if (b.id === "resetBtn") {
            $("resetBar").hidden = false;
            $("resetBar").scrollIntoView({ block: "nearest" });
            $("resetBar").querySelector("[data-reset]").focus({ preventScroll: true });
            return;
          }
          if ("resetCancel" in b.dataset) {
            $("resetBar").hidden = true;
            $("resetBtn").focus();
            return;
          }
          if ("reset" in b.dataset) {
            const lang = state.lang;
            state = fresh();
            state.lang = lang;
            $("resetBar").hidden = true;
            render();
            toast(COPY.fresh);
          }
        });

        try {
          sessionStorage.removeItem("ewl-tour-dock");
        } catch {}
        restore();
        render(false);
      })();
    </script>
  </body>
</html>
