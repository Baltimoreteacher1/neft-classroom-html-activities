<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>TheLanguagePage.com · Academic Discourse & Translanguaging Studios</title>
    <link rel="stylesheet" href="/assets/fonts/small-group.css" />
    <link rel="stylesheet" href="./discourse-architect.css" />
    <link rel="stylesheet" href="./speaking-sparring.css" />
    <link rel="stylesheet" href="./translanguaging-bridge.css" />
    <style>
      :root {
        --page-bg: #030712;
        --page-text: #f9fafb;
        --page-accent: #38bdf8;
      }
      body {
        margin: 0;
        padding: 0;
        background: var(--page-bg);
        color: var(--page-text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .app-wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 16px 80px 16px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .studio-navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #0f172a;
        padding: 12px 20px;
        border-radius: 10px;
        border: 1px solid #1e293b;
        flex-wrap: wrap;
        gap: 12px;
      }
      .studio-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 16px;
        color: #38bdf8;
      }
      .studio-tabs {
        display: flex;
        gap: 8px;
      }
      .studio-tab-btn {
        background: transparent;
        border: 1px solid transparent;
        color: #94a3b8;
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .studio-tab-btn:hover {
        background: #1e293b;
        color: #f8fafc;
      }
      .studio-tab-btn.active {
        background: #0284c7;
        color: #ffffff;
      }
      .module-view {
        display: none;
      }
      .module-view.active {
        display: block;
      }
      .hotkey-hint {
        font-size: 11px;
        color: #64748b;
        background: #0f172a;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid #1e293b;
      }
    </style>
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
  <link rel="stylesheet" href="/shared/save-resume/save-resume-styles.css?v=20260714-v2">
  <!-- nsr-injected:end -->
</head>
  <body>
    <div class="app-wrapper">
      <header class="studio-navbar">
        <div class="studio-brand">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <span>TheLanguagePage.com · Academic Discourse Rehearsal</span>
        </div>
        <nav class="studio-tabs" role="tablist" aria-label="Studio Navigation Tabs">
          <button type="button" class="studio-tab-btn active" data-target="discourse-architect-app" role="tab" aria-selected="true">
            1. Discourse Architect
          </button>
          <button type="button" class="studio-tab-btn" data-target="speaking-sparring-app" role="tab" aria-selected="false">
            2. Speaking Sparring Partner
          </button>
          <button type="button" class="studio-tab-btn" data-target="translanguaging-bridge-app" role="tab" aria-selected="false">
            3. Translanguaging Bridge
          </button>
        </nav>
        <div class="hotkey-hint">Diagnostics: <strong>Ctrl + Shift + D</strong></div>
      </header>

      <main>
        <!-- Module 1: The Discourse Architect -->
        <section id="discourse-architect-app" class="module-view active" aria-label="Discourse Architect Loom"></section>

        <!-- Module 2: The Speaking Sparring Partner -->
        <section id="speaking-sparring-app" class="module-view" aria-label="Asynchronous Discourse Sparring Partner"></section>

        <!-- Module 3: The Multimodal Translanguaging Bridge -->
        <section id="translanguaging-bridge-app" class="module-view" aria-label="Multimodal Translanguaging Bridge"></section>
      </main>
    </div>

    <script type="module">
      import { initDiscourseArchitect } from "./src/studios/discourse-architect.js";
      import { initSpeakingSparring } from "./src/studios/speaking-sparring.js";
      import { initTranslanguagingBridge } from "./src/studios/translanguaging-bridge.js";

      // Initialize all three modules on target containers
      const loom = initDiscourseArchitect("#discourse-architect-app");
      const sparring = initSpeakingSparring("#speaking-sparring-app");
      const bridge = initTranslanguagingBridge("#translanguaging-bridge-app");

      // Setup Tab Switching
      const tabBtns = document.querySelectorAll(".studio-tab-btn");
      const modules = document.querySelectorAll(".module-view");

      tabBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          tabBtns.forEach(b => {
            b.classList.remove("active");
            b.setAttribute("aria-selected", "false");
          });
          modules.forEach(m => m.classList.remove("active"));

          btn.classList.add("active");
          btn.setAttribute("aria-selected", "true");
          const targetId = btn.dataset.target;
          const targetModule = document.getElementById(targetId);
          if (targetModule) targetModule.classList.add("active");
        });
      });
    </script>
  <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
  <script src="/shared/save-resume/save-resume-engine.js?v=20260714-v2" defer></script>
  <!-- nsr-injected:end -->
  </body>
</html>
