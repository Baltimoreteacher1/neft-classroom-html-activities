<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Short listening passages, speaking models, and bilingual directions for family practice." />
    <title>Audio Practice · The Language Page</title>
    <link rel="stylesheet" href="./audio-practice.css" />
    <script type="module" src="./audio-practice.js"></script>
  </head>
  <body>
    <main>
      <header>
        <a id="back" href="/access-practice-lab/">← ACCESS Practice Lab</a>
        <h1 id="title">Audio practice</h1>
        <p id="intro">Listen to a short passage, rehearse a response, or try an activity together.</p>
      </header>
      <nav id="practice-types" aria-label="Practice type">
        <a data-view="listening" href="?view=listening">Listening</a>
        <a data-view="speaking" href="?view=speaking">Speaking models</a>
        <a data-view="family" href="?view=family">Family directions</a>
      </nav>
      <div class="choices">
        <label id="grade-control" for="grades">
          Grade band
          <select id="grades">
            <option value="3–5">Grades 3–5</option>
            <option value="6–8">Grades 6–8</option>
          </select>
        </label>
        <nav id="languages" aria-label="Language / Idioma" hidden>
          <a lang="en" href="?view=family&amp;lang=en">English</a>
          <a lang="es" href="?view=family&amp;lang=es">Español</a>
        </nav>
      </div>
      <h2 id="activity-title">Listening passages</h2>
      <p id="status" role="status"></p>
      <div class="clip-grid" id="clips"></div>
      <noscript>Enable JavaScript to choose and play the practice clips.</noscript>
    </main>
  </body>
</html>
