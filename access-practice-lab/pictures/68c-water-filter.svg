<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img">
<title>A diagram of a cut plastic bottle turned upside down as a water filter. Muddy brown water is poured in at the top. It passes down through a layer of gravel, then a layer of sand, then a layer of black charcoal, then a cotton pad, and clear water drips into a glass at the bottom.</title>
<rect width="640" height="400" fill="#cfe8f3"/>
<rect y="350" width="640" height="50" fill="#f2cc8f"/>
<!-- pitcher pouring muddy water -->
<g stroke="#24323f" stroke-width="3" stroke-linejoin="round">
  <path d="M120 40 L200 40 L210 60 L250 72 L246 82 L205 78 L196 120 L124 120 Z" fill="#e8eef2"/>
  <path d="M130 64 L198 64 L194 116 L128 116 Z" fill="#8b5e34" stroke="none"/>
</g>
<path d="M248 80 C262 92 268 104 270 118" stroke="#8b5e34" stroke-width="8" fill="none" stroke-linecap="round"/>
<!-- bottle body (upside down: wide top, narrow neck at bottom) -->
<g stroke="#24323f" stroke-width="3" stroke-linejoin="round">
  <path d="M230 110 L370 110 L370 270 C370 292 336 300 322 312 L322 334 L278 334 L278 312 C264 300 230 292 230 270 Z" fill="#ffffff" fill-opacity="0.5"/>
</g>
<!-- muddy water at top -->
<rect x="232" y="120" width="136" height="26" fill="#8b5e34"/>
<!-- gravel layer -->
<rect x="232" y="146" width="136" height="38" fill="#9aa5ad"/>
<g fill="#6f7b84" stroke="#24323f" stroke-width="1.5">
  <ellipse cx="246" cy="158" rx="9" ry="6"/><ellipse cx="270" cy="170" rx="10" ry="7"/><ellipse cx="296" cy="156" rx="9" ry="6"/>
  <ellipse cx="320" cy="172" rx="10" ry="6"/><ellipse cx="346" cy="160" rx="10" ry="7"/><ellipse cx="358" cy="176" rx="7" ry="5"/>
  <ellipse cx="252" cy="178" rx="7" ry="5"/><ellipse cx="300" cy="178" rx="7" ry="4"/>
</g>
<!-- sand layer -->
<rect x="232" y="184" width="136" height="40" fill="#e9c98b"/>
<g fill="#c9a061">
  <circle cx="246" cy="194" r="2"/><circle cx="262" cy="210" r="2"/><circle cx="280" cy="198" r="2"/><circle cx="300" cy="214" r="2"/>
  <circle cx="318" cy="196" r="2"/><circle cx="336" cy="212" r="2"/><circle cx="354" cy="200" r="2"/><circle cx="290" cy="190" r="2"/>
</g>
<!-- charcoal layer -->
<path d="M232 224 L368 224 L368 262 L232 262 Z" fill="#2b2b2b"/>
<g fill="#4a4a4a"><rect x="244" y="232" width="12" height="9" rx="2"/><rect x="276" y="244" width="14" height="9" rx="2"/><rect x="312" y="232" width="12" height="9" rx="2"/><rect x="342" y="246" width="12" height="8" rx="2"/></g>
<!-- cotton pad -->
<path d="M240 262 L360 262 C356 284 334 294 322 304 L278 304 C266 294 244 284 240 262 Z" fill="#ffffff" stroke="#c7ccd1" stroke-width="2"/>
<g fill="#eef1f4"><circle cx="270" cy="276" r="7"/><circle cx="300" cy="282" r="8"/><circle cx="330" cy="276" r="7"/></g>
<!-- bottle outline on top again -->
<path d="M230 110 L370 110 L370 270 C370 292 336 300 322 312 L322 334 L278 334 L278 312 C264 300 230 292 230 270 Z" fill="none" stroke="#24323f" stroke-width="3" stroke-linejoin="round"/>
<!-- drip -->
<path d="M300 338 C294 348 294 354 300 356 C306 354 306 348 300 338 Z" fill="#7cc4e4" stroke="#24323f" stroke-width="1.5"/>
<!-- glass -->
<path d="M262 344 L338 344 L330 396 L270 396 Z" fill="#ffffff" fill-opacity="0.6" stroke="#24323f" stroke-width="3" stroke-linejoin="round"/>
<path d="M266 368 L334 368 L330 394 L270 394 Z" fill="#9fd8f0"/>
<!-- layer pointer lines (no words) -->
<g stroke="#3d405b" stroke-width="2" stroke-dasharray="4 4">
  <line x1="372" y1="133" x2="430" y2="133"/><line x1="372" y1="165" x2="430" y2="165"/>
  <line x1="372" y1="204" x2="430" y2="204"/><line x1="372" y1="243" x2="430" y2="243"/><line x1="362" y1="282" x2="430" y2="282"/>
</g>
<g stroke="#24323f" stroke-width="2">
  <rect x="432" y="122" width="22" height="22" rx="4" fill="#8b5e34"/>
  <rect x="432" y="154" width="22" height="22" rx="4" fill="#9aa5ad"/>
  <rect x="432" y="193" width="22" height="22" rx="4" fill="#e9c98b"/>
  <rect x="432" y="232" width="22" height="22" rx="4" fill="#2b2b2b"/>
  <rect x="432" y="271" width="22" height="22" rx="4" fill="#ffffff"/>
</g>
<!-- arrow showing flow down -->
<path d="M190 150 L190 300" stroke="#1f766f" stroke-width="6" stroke-linecap="round"/>
<path d="M176 290 L190 314 L204 290 Z" fill="#1f766f"/>
</svg>
