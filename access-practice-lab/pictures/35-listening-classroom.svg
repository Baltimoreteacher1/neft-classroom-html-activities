<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img">
<title>A classroom with a window and a bookshelf under it, a whiteboard, a teacher's desk, cubbies by the door, and a round reading rug on the floor.</title>
<rect width="640" height="270" fill="#f6efe2"/>
<rect y="262" width="640" height="138" fill="#e9d8b4"/>
<rect y="258" width="640" height="8" fill="#c9b38a"/>
<!-- window -->
<rect x="30" y="36" width="150" height="112" rx="6" fill="#cfe8f3" stroke="#24323f" stroke-width="3"/>
<line x1="105" y1="36" x2="105" y2="148" stroke="#24323f" stroke-width="3"/>
<line x1="30" y1="92" x2="180" y2="92" stroke="#24323f" stroke-width="3"/>
<circle cx="150" cy="62" r="14" fill="#f2cc8f"/>
<!-- bookshelf under window -->
<rect x="30" y="168" width="150" height="94" rx="4" fill="#b07d4f" stroke="#24323f" stroke-width="3"/>
<line x1="30" y1="215" x2="180" y2="215" stroke="#24323f" stroke-width="3"/>
<rect x="40" y="178" width="12" height="35" fill="#e07a5f"/><rect x="54" y="182" width="12" height="31" fill="#3d405b"/><rect x="68" y="176" width="12" height="37" fill="#81b29a"/><rect x="82" y="180" width="12" height="33" fill="#f2cc8f"/><rect x="100" y="184" width="30" height="10" fill="#1f766f"/><rect x="100" y="194" width="30" height="19" fill="#e07a5f"/>
<rect x="40" y="224" width="14" height="36" fill="#1f766f"/><rect x="56" y="228" width="12" height="32" fill="#f2cc8f"/><rect x="70" y="222" width="12" height="38" fill="#e07a5f"/><rect x="120" y="226" width="12" height="34" fill="#3d405b"/><rect x="134" y="224" width="12" height="36" fill="#81b29a"/>
<!-- whiteboard -->
<rect x="215" y="32" width="230" height="120" rx="6" fill="#ffffff" stroke="#24323f" stroke-width="3"/>
<rect x="215" y="150" width="230" height="8" fill="#9aa5ad"/>
<path d="M240 70 q20 -18 40 0 t40 0" fill="none" stroke="#1f766f" stroke-width="4" stroke-linecap="round"/>
<circle cx="380" cy="80" r="18" fill="none" stroke="#e07a5f" stroke-width="4"/>
<polygon points="250,130 270,100 290,130" fill="none" stroke="#3d405b" stroke-width="4"/>
<!-- teacher desk -->
<rect x="240" y="222" width="180" height="20" rx="4" fill="#b07d4f" stroke="#24323f" stroke-width="3"/>
<rect x="250" y="242" width="40" height="60" fill="#a06d40" stroke="#24323f" stroke-width="3"/>
<rect x="400" y="242" width="12" height="60" fill="#a06d40" stroke="#24323f" stroke-width="3"/>
<circle cx="390" cy="212" r="10" fill="#e07a5f" stroke="#24323f" stroke-width="2"/><path d="M390 202 q4 -6 8 -6" stroke="#2f5d3a" stroke-width="3" fill="none"/>
<rect x="300" y="208" width="50" height="14" rx="2" fill="#3d405b"/>
<!-- door -->
<rect x="548" y="70" width="72" height="192" rx="4" fill="#81b29a" stroke="#24323f" stroke-width="3"/>
<circle cx="606" cy="170" r="6" fill="#f2cc8f" stroke="#24323f" stroke-width="2"/>
<rect x="562" y="88" width="44" height="40" rx="3" fill="#cfe8f3" stroke="#24323f" stroke-width="2"/>
<!-- cubbies by the door -->
<rect x="448" y="160" width="90" height="102" fill="#d9b48a" stroke="#24323f" stroke-width="3"/>
<line x1="493" y1="160" x2="493" y2="262" stroke="#24323f" stroke-width="3"/>
<line x1="448" y1="194" x2="538" y2="194" stroke="#24323f" stroke-width="3"/>
<line x1="448" y1="228" x2="538" y2="228" stroke="#24323f" stroke-width="3"/>
<rect x="458" y="168" width="24" height="22" rx="6" fill="#e07a5f"/><rect x="503" y="202" width="24" height="22" rx="6" fill="#1f766f"/><rect x="458" y="236" width="24" height="22" rx="6" fill="#3d405b"/>
<!-- reading rug -->
<ellipse cx="150" cy="335" rx="120" ry="44" fill="#e07a5f" stroke="#24323f" stroke-width="3"/>
<ellipse cx="150" cy="335" rx="84" ry="30" fill="#f2cc8f"/>
<ellipse cx="150" cy="335" rx="44" ry="15" fill="#81b29a"/>
<!-- student desks -->
<rect x="400" y="320" width="90" height="14" rx="3" fill="#cfa36e" stroke="#24323f" stroke-width="3"/>
<line x1="410" y1="334" x2="410" y2="372" stroke="#24323f" stroke-width="4"/><line x1="480" y1="334" x2="480" y2="372" stroke="#24323f" stroke-width="4"/>
<rect x="520" y="320" width="90" height="14" rx="3" fill="#cfa36e" stroke="#24323f" stroke-width="3"/>
<line x1="530" y1="334" x2="530" y2="372" stroke="#24323f" stroke-width="4"/><line x1="600" y1="334" x2="600" y2="372" stroke="#24323f" stroke-width="4"/>
</svg>
