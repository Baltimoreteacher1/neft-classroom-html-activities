<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img">
<title>The water cycle. The sun shines on a lake. Wavy arrows show water rising from the lake into the sky. Clouds form over a mountain, rain falls on the mountain, and a river flows back down into the lake.</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#24323f"/></marker></defs>
<rect width="640" height="400" fill="#cfe8f3"/>
<circle cx="80" cy="70" r="42" fill="#f4c542" stroke="#24323f" stroke-width="3"/>
<g stroke="#f4c542" stroke-width="5" stroke-linecap="round"><line x1="80" y1="10" x2="80" y2="20"/><line x1="140" y1="70" x2="130" y2="70"/><line x1="122" y1="112" x2="114" y2="104"/><line x1="122" y1="28" x2="114" y2="36"/><line x1="20" y1="70" x2="30" y2="70"/></g>
<!-- mountain -->
<path d="M360 330 L500 150 L640 330 Z" fill="#81b29a" stroke="#24323f" stroke-width="3"/>
<path d="M500 150 L470 190 L488 184 L500 198 L514 184 L530 190 Z" fill="#ffffff" stroke="#24323f" stroke-width="2"/>
<!-- ground and lake -->
<rect y="320" width="640" height="80" fill="#a7c58a"/>
<ellipse cx="190" cy="352" rx="180" ry="40" fill="#4f9fc4" stroke="#24323f" stroke-width="3"/>
<path d="M80 350 q15 -8 30 0 t30 0 M200 362 q15 -8 30 0 t30 0" stroke="#cfe8f3" stroke-width="3" fill="none"/>
<!-- river -->
<path d="M520 260 C480 300 430 290 400 320 C380 338 360 345 340 350" fill="none" stroke="#4f9fc4" stroke-width="12" stroke-linecap="round"/>
<!-- rising vapor arrows -->
<g fill="none" stroke="#24323f" stroke-width="3" marker-end="url(#ah)">
<path d="M150 300 q-10 -20 0 -40 t0 -40 t0 -40"/>
<path d="M210 300 q-10 -20 0 -40 t0 -40 t0 -40"/>
<path d="M270 300 q-10 -20 0 -40 t0 -40 t0 -40"/>
</g>
<!-- arrow from vapor to cloud -->
<path d="M260 120 Q330 60 400 80" fill="none" stroke="#24323f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/>
<!-- clouds -->
<g fill="#ffffff" stroke="#24323f" stroke-width="3">
<path d="M430 110 a28 28 0 0 1 40 -30 a34 34 0 0 1 62 6 a26 26 0 0 1 22 44 h-114 a22 22 0 0 1 -10 -20 Z"/>
</g>
<!-- rain -->
<g stroke="#4f9fc4" stroke-width="4" stroke-linecap="round">
<line x1="452" y1="146" x2="444" y2="166"/><line x1="476" y1="150" x2="468" y2="170"/><line x1="500" y1="146" x2="492" y2="166"/><line x1="524" y1="150" x2="516" y2="170"/><line x1="548" y1="146" x2="540" y2="166"/>
<line x1="464" y1="178" x2="456" y2="198"/><line x1="512" y1="180" x2="504" y2="200"/><line x1="536" y1="182" x2="528" y2="202"/>
</g>
</svg>
