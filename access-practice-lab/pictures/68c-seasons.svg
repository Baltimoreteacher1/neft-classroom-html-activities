<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img">
<title>A diagram of the Sun in the center with Earth shown at two places in its orbit. On the left, Earth's tilted axis leans its northern half toward the Sun, and sunlight hits the north directly. On the right, on the opposite side of the orbit, the same tilt now leans the northern half away from the Sun, and sunlight hits the north at a low slant.</title>
<rect width="640" height="400" fill="#1d2440"/>
<g fill="#ffffff" opacity="0.8"><circle cx="40" cy="40" r="1.5"/><circle cx="600" cy="30" r="1.5"/><circle cx="560" cy="360" r="1.5"/><circle cx="90" cy="350" r="1.5"/><circle cx="320" cy="40" r="1.2"/><circle cx="330" cy="370" r="1.2"/></g>
<!-- orbit -->
<ellipse cx="320" cy="200" rx="250" ry="90" fill="none" stroke="#9aa5ad" stroke-width="2" stroke-dasharray="6 6"/>
<!-- sun rays -->
<g stroke="#f2cc8f" stroke-width="3" opacity="0.8">
  <line x1="270" y1="200" x2="150" y2="200"/><line x1="270" y1="185" x2="150" y2="170"/><line x1="270" y1="215" x2="150" y2="230"/>
  <line x1="370" y1="200" x2="490" y2="200"/><line x1="370" y1="185" x2="490" y2="170"/><line x1="370" y1="215" x2="490" y2="230"/>
</g>
<!-- sun -->
<circle cx="320" cy="200" r="46" fill="#f4b942" stroke="#e07a5f" stroke-width="4"/>
<!-- LEFT EARTH: north tilted toward sun (to the right) -->
<g transform="translate(70 200)">
  <circle r="44" fill="#5fa8d3" stroke="#24323f" stroke-width="3"/>
  <g transform="rotate(23.5)">
    <path d="M-30 -20 C-10 -34 10 -30 26 -18 C14 -6 -10 -4 -30 -20 Z" fill="#81b29a"/>
    <path d="M-20 14 C-4 6 14 10 24 22 C8 30 -10 28 -20 14 Z" fill="#81b29a"/>
    <line x1="0" y1="-64" x2="0" y2="64" stroke="#ffffff" stroke-width="3"/>
    <line x1="-44" y1="0" x2="44" y2="0" stroke="#e07a5f" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="0" cy="-64" r="4" fill="#ffffff"/>
  </g>
  <!-- light side -->
  <path d="M0 -44 A44 44 0 0 1 0 44 Z" fill="#fff6d6" opacity="0.35"/>
</g>
<!-- RIGHT EARTH: same tilt, north now leans away from sun (to the right) -->
<g transform="translate(570 200)">
  <circle r="44" fill="#5fa8d3" stroke="#24323f" stroke-width="3"/>
  <g transform="rotate(23.5)">
    <path d="M-30 -20 C-10 -34 10 -30 26 -18 C14 -6 -10 -4 -30 -20 Z" fill="#81b29a"/>
    <path d="M-20 14 C-4 6 14 10 24 22 C8 30 -10 28 -20 14 Z" fill="#81b29a"/>
    <line x1="0" y1="-64" x2="0" y2="64" stroke="#ffffff" stroke-width="3"/>
    <line x1="-44" y1="0" x2="44" y2="0" stroke="#e07a5f" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="0" cy="-64" r="4" fill="#ffffff"/>
  </g>
  <path d="M0 -44 A44 44 0 0 0 0 44 Z" fill="#fff6d6" opacity="0.35"/>
</g>
<!-- orbit direction arrows -->
<path d="M300 110 L330 110" stroke="#9aa5ad" stroke-width="3"/><path d="M330 103 L344 110 L330 117 Z" fill="#9aa5ad"/>
<path d="M340 290 L310 290" stroke="#9aa5ad" stroke-width="3"/><path d="M310 283 L296 290 L310 297 Z" fill="#9aa5ad"/>
</svg>
