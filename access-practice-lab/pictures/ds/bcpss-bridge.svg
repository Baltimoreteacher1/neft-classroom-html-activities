<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-hidden="true">
  <title>Baltimore curriculum bridge linking K–8 subjects and language notebook</title>
  <defs>
    <linearGradient id="bgPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf9f6"/>
      <stop offset="100%" stop-color="#efeae0"/>
    </linearGradient>
    <linearGradient id="bridgeArch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="waterBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9f0ec"/>
      <stop offset="100%" stop-color="#e8eef6"/>
    </linearGradient>
    <filter id="softDrop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#182230" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Warm Editorial Academic backdrop -->
  <rect width="640" height="400" fill="url(#bgPaper)"/>
  <circle cx="540" cy="72" r="54" fill="#f5d6a8" opacity="0.45"/>
  <circle cx="94" cy="96" r="38" fill="#d9f0ec" opacity="0.55"/>

  <!-- Subtle harbor horizon & stylized Baltimore curriculum bridge -->
  <path d="M0 306 Q160 288 320 304 T640 296 L640 400 L0 400 Z" fill="url(#waterBand)" opacity="0.72"/>
  <path d="M44 292 Q320 128 596 292" fill="none" stroke="url(#bridgeArch)" stroke-width="10" stroke-linecap="round"/>
  <path d="M44 292 L596 292" stroke="#1e3a5f" stroke-width="5" stroke-linecap="round"/>
  <!-- Bridge suspension cables -->
  <g stroke="#1e3a5f" stroke-width="2" opacity="0.32">
    <line x1="132" y1="290" x2="132" y2="236"/>
    <line x1="196" y1="290" x2="196" y2="206"/>
    <line x1="258" y1="290" x2="258" y2="188"/>
    <line x1="320" y1="290" x2="320" y2="182"/>
    <line x1="382" y1="290" x2="382" y2="188"/>
    <line x1="444" y1="290" x2="444" y2="206"/>
    <line x1="508" y1="290" x2="508" y2="236"/>
  </g>
  <!-- Bridge piers -->
  <rect x="66" y="292" width="18" height="44" rx="4" fill="#1e3a5f" opacity="0.85"/>
  <rect x="556" y="292" width="18" height="44" rx="4" fill="#1e3a5f" opacity="0.85"/>

  <!-- Four K-8 curriculum subject blocks resting above the bridge -->
  <!-- 1. ELA / Wit & Wisdom (Indigo) -->
  <g transform="translate(88, 126)" filter="url(#softDrop)">
    <rect width="102" height="86" rx="14" fill="#ffffff"/>
    <rect width="102" height="16" rx="14" fill="#2e4a94"/>
    <rect y="8" width="102" height="8" fill="#2e4a94"/>
    <!-- Open book motif -->
    <path d="M24 38 Q37 32 51 39 L51 67 Q37 61 24 66 Z" fill="#e4eafa"/>
    <path d="M78 38 Q65 32 51 39 L51 67 Q65 61 78 66 Z" fill="#d5dceb"/>
    <line x1="51" y1="39" x2="51" y2="67" stroke="#2e4a94" stroke-width="2"/>
    <line x1="30" y1="47" x2="44" y2="47" stroke="#2e4a94" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="54" x2="43" y2="54" stroke="#2e4a94" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="58" y1="47" x2="72" y2="47" stroke="#2e4a94" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="54" x2="70" y2="54" stroke="#2e4a94" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 2. Math / Reveal Math (Deep Teal) -->
  <g transform="translate(208, 92)" filter="url(#softDrop)">
    <rect width="102" height="86" rx="14" fill="#ffffff"/>
    <rect width="102" height="16" rx="14" fill="#0f766e"/>
    <rect y="8" width="102" height="8" fill="#0f766e"/>
    <!-- Fraction tape / grid model -->
    <rect x="20" y="34" width="62" height="16" rx="4" fill="#d9f0ec"/>
    <rect x="20" y="34" width="38" height="16" rx="4" fill="#0f766e"/>
    <line x1="39" y1="34" x2="39" y2="50" stroke="#ffffff" stroke-width="2"/>
    <rect x="20" y="57" width="18" height="14" rx="3" fill="#e1f2ef"/>
    <rect x="42" y="57" width="18" height="14" rx="3" fill="#91e2d6"/>
    <rect x="64" y="57" width="18" height="14" rx="3" fill="#b45309" opacity="0.85"/>
  </g>

  <!-- 3. Science / SABES & IQWST (Sage / Copper) -->
  <g transform="translate(330, 92)" filter="url(#softDrop)">
    <rect width="102" height="86" rx="14" fill="#ffffff"/>
    <rect width="102" height="16" rx="14" fill="#264e48"/>
    <rect y="8" width="102" height="8" fill="#264e48"/>
    <!-- Lab flask + botanical leaf -->
    <path d="M42 32 L54 32 L54 44 L66 64 Q68 69 62 69 L34 69 Q28 69 30 64 L42 44 Z" fill="#d0e3cd"/>
    <path d="M35 58 L61 58 L64 65 Q65 68 61 68 L35 68 Q31 68 32 65 Z" fill="#0f766e"/>
    <circle cx="46" cy="52" r="3" fill="#264e48" opacity="0.5"/>
    <path d="M68 44 Q82 34 80 50 Q74 56 66 52 Z" fill="#5a9481"/>
  </g>

  <!-- 4. Language & Multilingual Bridges (Garnet & Gold) -->
  <g transform="translate(450, 126)" filter="url(#softDrop)">
    <rect width="102" height="86" rx="14" fill="#ffffff"/>
    <rect width="102" height="16" rx="14" fill="#8a3a5c"/>
    <rect y="8" width="102" height="8" fill="#8a3a5c"/>
    <!-- Bilingual speech bubbles -->
    <rect x="18" y="32" width="44" height="24" rx="8" fill="#f7e6ed"/>
    <path d="M26 56 L22 64 L34 56 Z" fill="#f7e6ed"/>
    <line x1="27" y1="41" x2="52" y2="41" stroke="#8a3a5c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="27" y1="48" x2="45" y2="48" stroke="#8a3a5c" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <rect x="42" y="45" width="42" height="24" rx="8" fill="#fbead9"/>
    <path d="M74 69 L80 76 L67 69 Z" fill="#fbead9"/>
    <line x1="51" y1="54" x2="74" y2="54" stroke="#9a4a26" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="51" y1="61" x2="68" y2="61" stroke="#9a4a26" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- Foreground Editorial Language Notebook -->
  <g transform="translate(174, 232)" filter="url(#softDrop)">
    <!-- Notebook cover -->
    <rect x="0" y="8" width="292" height="124" rx="14" fill="#1e3a5f"/>
    <!-- Open ivory pages -->
    <rect x="10" y="14" width="134" height="110" rx="8" fill="#fffcf5"/>
    <rect x="148" y="14" width="134" height="110" rx="8" fill="#faf9f6"/>
    <!-- Center spine -->
    <rect x="143" y="12" width="6" height="114" fill="#d5dceb"/>
    <!-- Index tabs -->
    <rect x="282" y="26" width="14" height="22" rx="4" fill="#b45309"/>
    <rect x="282" y="54" width="14" height="22" rx="4" fill="#0f766e"/>
    <rect x="282" y="82" width="14" height="22" rx="4" fill="#8a3a5c"/>
    <!-- Left page: structured language frames -->
    <rect x="24" y="28" width="58" height="8" rx="4" fill="#1e3a5f"/>
    <rect x="24" y="45" width="102" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="24" y="58" width="88" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="24" y="74" width="104" height="34" rx="6" fill="#e1f2ef"/>
    <rect x="34" y="84" width="76" height="5" rx="2.5" fill="#0f766e"/>
    <rect x="34" y="95" width="56" height="5" rx="2.5" fill="#0f766e" opacity="0.6"/>
    <!-- Right page: K-8 scaffold chips & check -->
    <rect x="164" y="28" width="44" height="16" rx="5" fill="#e8eef6"/>
    <rect x="214" y="28" width="52" height="16" rx="5" fill="#fbead9"/>
    <rect x="164" y="54" width="102" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="164" y="67" width="90" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="164" y="80" width="78" height="6" rx="3" fill="#cbd5e1"/>
    <circle cx="248" cy="100" r="14" fill="#0f766e"/>
    <path d="M242 100 L246 104 L255 95" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtle editorial accent dots -->
  <circle cx="72" cy="236" r="5" fill="#b45309" opacity="0.7"/>
  <circle cx="568" cy="232" r="6" fill="#0f766e" opacity="0.6"/>
  <circle cx="320" cy="54" r="4" fill="#1e3a5f" opacity="0.45"/>
</svg>
