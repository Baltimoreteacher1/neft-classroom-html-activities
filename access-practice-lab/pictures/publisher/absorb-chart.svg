ans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">Pavement</text><path d="M320 300 V184.0 Q320 179.0 325 179.0 H385 Q390 179.0 390 184.0 V300Z" fill="url(#lg3)"/><text x="355" y="173" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">55</text><path d="M400 300 V206.0 Q400 201.0 405 201.0 H465 Q470 201.0 470 206.0 V300Z" fill="url(#lg4)"/><text x="435" y="195" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">45</text><text x="395" y="326" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">Lawn</text><path d="M520 300 V118.0 Q520 113.0 525 113.0 H585 Q590 113.0 590 118.0 V300Z" fill="url(#lg5)"/><text x="555" y="107.0" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">85</text><path d="M600 300 V272.0 Q600 267.0 605 267.0 H665 Q670 267.0 670 272.0 V300Z" fill="url(#lg6)"/><text x="635" y="261" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">15</text><text x="595" y="326" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">Rain garden</text><path d="M90 300L690 300" stroke="#8a9aab" stroke-width="2" stroke-linecap="round" fill="none"/></g></svg>
