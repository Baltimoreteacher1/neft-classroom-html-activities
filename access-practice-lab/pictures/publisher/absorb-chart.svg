<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Water absorbed and water that ran off, by surface</title>
  <desc id="d">Bar chart of 100 liters poured on each surface. Pavement: 5 absorbed, 95 ran off. Lawn: 55 absorbed, 45 ran off. Rain garden: 85 absorbed, 15 ran off.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <g font-family="Atkinson Hyperlegible, Arial, sans-serif" fill="#17324d">
    <text x="360" y="26" font-size="18" font-weight="700" text-anchor="middle">Liters out of 100 poured, after ten minutes</text>
    <rect x="250" y="38" width="14" height="14" fill="#1d5a8a"/><text x="270" y="50" font-size="14">Absorbed</text><rect x="360" y="38" width="14" height="14" fill="#5a6673"/><text x="380" y="50" font-size="14">Ran off</text>
    <line x1="90" y1="300.0" x2="690" y2="300.0" stroke="#c9d3dc"/><text x="80" y="305.0" font-size="14" text-anchor="end">0</text>
    <line x1="90" y1="245.0" x2="690" y2="245.0" stroke="#c9d3dc"/><text x="80" y="250.0" font-size="14" text-anchor="end">25</text>
    <line x1="90" y1="190.0" x2="690" y2="190.0" stroke="#c9d3dc"/><text x="80" y="195.0" font-size="14" text-anchor="end">50</text>
    <line x1="90" y1="135.0" x2="690" y2="135.0" stroke="#c9d3dc"/><text x="80" y="140.0" font-size="14" text-anchor="end">75</text>
    <line x1="90" y1="80.0" x2="690" y2="80.0" stroke="#c9d3dc"/><text x="80" y="85.0" font-size="14" text-anchor="end">100</text>
    <rect x="120" y="289.0" width="70" height="11.0" fill="#1d5a8a"/>
    <text x="155" y="283.0" font-size="16" font-weight="700" text-anchor="middle">5</text>
    <rect x="200" y="91.0" width="70" height="209.0" fill="#5a6673"/>
    <text x="235" y="85.0" font-size="16" font-weight="700" text-anchor="middle">95</text>
    <text x="195" y="326" font-size="16" font-weight="700" text-anchor="middle">Pavement</text>
    <rect x="320" y="179.0" width="70" height="121.0" fill="#1d5a8a"/>
    <text x="355" y="173.0" font-size="16" font-weight="700" text-anchor="middle">55</text>
    <rect x="400" y="201.0" width="70" height="99.0" fill="#5a6673"/>
    <text x="435" y="195.0" font-size="16" font-weight="700" text-anchor="middle">45</text>
    <text x="395" y="326" font-size="16" font-weight="700" text-anchor="middle">Lawn</text>
    <rect x="520" y="113.0" width="70" height="187.0" fill="#1d5a8a"/>
    <text x="555" y="107.0" font-size="16" font-weight="700" text-anchor="middle">85</text>
    <rect x="600" y="267.0" width="70" height="33.0" fill="#5a6673"/>
    <text x="635" y="261.0" font-size="16" font-weight="700" text-anchor="middle">15</text>
    <text x="595" y="326" font-size="16" font-weight="700" text-anchor="middle">Rain garden</text>
  </g>
</svg>
