<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img"><title>Water absorbed and water that ran off, by surface</title><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#346a93"/><stop offset="1" stop-color="#1d5a8a"/></linearGradient><linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b747e"/><stop offset="1" stop-color="#5a6673"/></linearGradient><linearGradient id="lg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#346a93"/><stop offset="1" stop-color="#1d5a8a"/></linearGradient><linearGradient id="lg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b747e"/><stop offset="1" stop-color="#5a6673"/></linearGradient><linearGradient id="lg5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#346a93"/><stop offset="1" stop-color="#1d5a8a"/></linearGradient><linearGradient id="lg6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b747e"/><stop offset="1" stop-color="#5a6673"/></linearGradient></defs><g stroke-linejoin="round" stroke-linecap="round"><desc>Bar chart of 100 liters poured on each surface. Pavement: 5 absorbed, 95 ran off. Lawn: 55 absorbed, 45 ran off. Rain garden: 85 absorbed, 15 ran off.</desc><rect x="0" y="0" width="720" height="360" fill="#ffffff"/><text x="360" y="26" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d" text-anchor="middle">Liters out of 100 poured, after ten minutes</text><rect x="250" y="38" width="14" height="14" fill="#1d5a8a" rx="3"/><text x="270" y="50" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#17324d" text-anchor="start">Absorbed</text><rect x="360" y="38" width="14" height="14" fill="#5a6673" rx="3"/><text x="380" y="50" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1