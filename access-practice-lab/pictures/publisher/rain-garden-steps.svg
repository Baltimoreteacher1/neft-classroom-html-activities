<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">The three steps of a rain garden</title>
  <desc id="d">Side view in three numbered steps from left to right. Step 1: a small channel guides water off the pavement. Step 2: the water slows in a shallow bowl filled with plants. Step 3: soil filters the water as it soaks down to the ground below.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <g font-family="Atkinson Hyperlegible, Arial, sans-serif" fill="#17324d">
    <!-- ground -->
    <rect x="20" y="170" width="680" height="170" fill="#7f6446"/>
    <rect x="20" y="150" width="200" height="20" fill="#6a7580"/>
    <!-- bowl -->
    <path d="M250 170 Q360 235 470 170 Z" fill="#4b3a27"/>
    <!-- plants -->
    <g stroke="#2e6b3a" stroke-width="5" stroke-linecap="round"><path d="M320 190l-6-30M345 200l0-38M370 200l4-34M395 192l8-28"/></g>
    <!-- soil layers -->
    <rect x="500" y="170" width="200" height="170" fill="#8a6c4c"/>
    <g fill="#a98a66"><circle cx="540" cy="215" r="5"/><circle cx="590" cy="240" r="6"/><circle cx="640" cy="215" r="5"/><circle cx="560" cy="290" r="6"/><circle cx="620" cy="300" r="5"/></g>
    <!-- water -->
    <g stroke="#2b6fa5" stroke-width="5" stroke-linecap="round" fill="none"><path d="M40 140 L200 140"/><path d="M215 146 Q250 160 275 190"/><path d="M570 175 L570 320"/><path d="M620 175 L620 320"/></g>
    <path d="M285 200 Q360 238 435 200 Q360 222 285 200Z" fill="#2b6fa5"/>
    <!-- numbers -->
    <g font-weight="700" font-size="20" text-anchor="middle"><circle cx="120" cy="60" r="20" fill="#17324d"/><text x="120" y="67" fill="#fff">1</text><circle cx="360" cy="60" r="20" fill="#17324d"/><text x="360" y="67" fill="#fff">2</text><circle cx="600" cy="60" r="20" fill="#17324d"/><text x="600" y="67" fill="#fff">3</text></g>
    <g font-size="16" font-weight="700" text-anchor="middle"><text x="120" y="102">A channel guides</text><text x="120" y="122">the water</text><text x="360" y="102">The bowl slows</text><text x="360" y="122">the water</text><text x="600" y="102">Soil filters the</text><text x="600" y="122">water as it soaks in</text></g>
  </g>
</svg>
