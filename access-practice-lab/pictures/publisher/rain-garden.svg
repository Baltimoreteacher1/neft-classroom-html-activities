<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Rain on pavement and rain in a rain garden</title>
  <desc id="d">Left: rain lands on a parking lot and runs along the pavement to a puddle at the school doors. Right: a channel carries water to a shallow bowl with plants, and the water soaks down through soil.</desc>
  <rect width="720" height="360" fill="#eef4f8"/>
  <g font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" fill="#17324d">
    <!-- clouds -->
    <g fill="#c7d6e2"><ellipse cx="170" cy="46" rx="90" ry="26"/><ellipse cx="230" cy="52" rx="60" ry="22"/><ellipse cx="540" cy="46" rx="90" ry="26"/><ellipse cx="600" cy="52" rx="60" ry="22"/></g>
    <!-- rain -->
    <g stroke="#2b6fa5" stroke-width="3" stroke-linecap="round">
      <path d="M110 82l-8 20M150 86l-8 20M190 82l-8 20M230 86l-8 20"/>
      <path d="M480 82l-8 20M520 86l-8 20M560 82l-8 20M600 86l-8 20M640 82l-8 20"/>
    </g>
    <!-- divider -->
    <line x1="360" y1="20" x2="360" y2="340" stroke="#9fb3c4" stroke-dasharray="6 6" stroke-width="2"/>
    <!-- LEFT: pavement + school -->
    <rect x="20" y="150" width="330" height="40" fill="#7d8791"/>
    <rect x="20" y="190" width="330" height="150" fill="#7f6446"/>
    <text x="30" y="176" fill="#fff" font-weight="700">Pavement</text>
    <rect x="262" y="96" width="88" height="54" fill="#d9a441"/><rect x="292" y="116" width="28" height="34" fill="#17324d"/>
    <text x="256" y="90" font-weight="700">School doors</text>
    <path d="M60 142 L230 142" stroke="#2b6fa5" stroke-width="5" marker-end="url(#ar)"/>
    <text x="70" y="132" font-weight="700" fill="#1d4f7c">Runoff</text>
    <ellipse cx="300" cy="152" rx="46" ry="7" fill="#2b6fa5"/>
    <text x="30" y="234" font-weight="700" fill="#fff">No water soaks in</text>
    <text x="30" y="256" fill="#fff">Ground below stays dry</text>
    <text x="30" y="330" font-weight="700" fill="#fff">1. The flood</text>
    <!-- RIGHT: rain garden -->
    <rect x="370" y="150" width="150" height="40" fill="#7d8791"/><rect x="680" y="150" width="20" height="40" fill="#7d8791"/>
    <rect x="370" y="190" width="330" height="150" fill="#7a5c3e"/>
    <path d="M520 150 L520 190 Q600 262 680 190 L680 150Z" fill="#5d4630"/>
    <g stroke="#2f7d46" stroke-width="4" stroke-linecap="round" fill="none"><path d="M560 200v-40M580 214v-66M604 220v-60M628 214v-70M652 200v-44"/></g>
    <g fill="#3f9a5b"><circle cx="560" cy="156" r="9"/><circle cx="580" cy="144" r="9"/><circle cx="604" cy="152" r="9"/><circle cx="628" cy="142" r="9"/><circle cx="652" cy="156" r="9"/></g>
    <path d="M390 172 L515 172" stroke="#2b6fa5" stroke-width="5" marker-end="url(#ar)"/>
    <text x="394" y="140" font-weight="700" fill="#1d4f7c">Channel</text>
    <text x="540" y="128" font-weight="700">Bowl with plants</text>
    <g stroke="#2b6fa5" stroke-width="4" marker-end="url(#ar)"><path d="M580 240v46"/><path d="M620 244v46"/></g>
    <text x="540" y="296" font-weight="700" fill="#fff">Soil filters the water</text>
    <text x="540" y="316" fill="#fff">Water soaks in</text>
    <text x="380" y="330" font-weight="700" fill="#fff">2. The rain garden</text>
  </g>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b6fa5"/></marker></defs>
</svg>
