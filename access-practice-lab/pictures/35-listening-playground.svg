<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img">
<title>A playground with a slide, swings, a big tree, and a bench. A child plays at each place.</title>
<rect width="640" height="400" fill="#cfe8f3"/>
<circle cx="580" cy="60" r="30" fill="#f2cc8f"/>
<rect y="290" width="640" height="110" fill="#81b29a"/>
<!-- slide -->
<rect x="40" y="150" width="10" height="150" fill="#3d405b"/><rect x="80" y="150" width="10" height="150" fill="#3d405b"/>
<line x1="45" y1="180" x2="85" y2="180" stroke="#3d405b" stroke-width="5"/><line x1="45" y1="215" x2="85" y2="215" stroke="#3d405b" stroke-width="5"/><line x1="45" y1="250" x2="85" y2="250" stroke="#3d405b" stroke-width="5"/>
<rect x="36" y="142" width="60" height="12" rx="3" fill="#e07a5f" stroke="#24323f" stroke-width="2"/>
<path d="M92 146 L190 290 L210 290 L104 142 Z" fill="#e07a5f" stroke="#24323f" stroke-width="3"/>
<!-- child on slide -->
<circle cx="66" cy="112" r="14" fill="#8d5524" stroke="#24323f" stroke-width="2"/>
<rect x="54" y="126" width="24" height="18" rx="6" fill="#f2cc8f" stroke="#24323f" stroke-width="2"/>
<circle cx="61" cy="110" r="2" fill="#24323f"/><circle cx="71" cy="110" r="2" fill="#24323f"/><path d="M61 117 q5 4 10 0" stroke="#24323f" stroke-width="2" fill="none"/>
<!-- swings -->
<path d="M230 300 L260 150 L380 150 L410 300" fill="none" stroke="#3d405b" stroke-width="8" stroke-linejoin="round"/>
<line x1="290" y1="150" x2="290" y2="250" stroke="#24323f" stroke-width="2"/><line x1="320" y1="150" x2="320" y2="250" stroke="#24323f" stroke-width="2"/>
<rect x="284" y="248" width="42" height="8" rx="3" fill="#1f766f"/>
<line x1="340" y1="150" x2="340" y2="255" stroke="#24323f" stroke-width="2"/><line x1="368" y1="150" x2="368" y2="255" stroke="#24323f" stroke-width="2"/>
<rect x="334" y="253" width="40" height="8" rx="3" fill="#1f766f"/>
<!-- child on swing -->
<circle cx="305" cy="208" r="14" fill="#f1c27d" stroke="#24323f" stroke-width="2"/>
<rect x="293" y="222" width="24" height="26" rx="6" fill="#e07a5f" stroke="#24323f" stroke-width="2"/>
<circle cx="300" cy="206" r="2" fill="#24323f"/><circle cx="310" cy="206" r="2" fill="#24323f"/><path d="M300 213 q5 4 10 0" stroke="#24323f" stroke-width="2" fill="none"/>
<!-- big tree -->
<rect x="482" y="190" width="32" height="112" fill="#8a5a3b" stroke="#24323f" stroke-width="3"/>
<circle cx="498" cy="150" r="64" fill="#2f7d55" stroke="#24323f" stroke-width="3"/>
<circle cx="450" cy="180" r="38" fill="#2f7d55" stroke="#24323f" stroke-width="3"/>
<circle cx="548" cy="178" r="38" fill="#2f7d55" stroke="#24323f" stroke-width="3"/>
<!-- child under tree -->
<circle cx="458" cy="262" r="14" fill="#c68642" stroke="#24323f" stroke-width="2"/>
<rect x="446" y="276" width="24" height="26" rx="6" fill="#3d405b" stroke="#24323f" stroke-width="2"/>
<circle cx="453" cy="260" r="2" fill="#24323f"/><circle cx="463" cy="260" r="2" fill="#24323f"/><path d="M453 267 q5 4 10 0" stroke="#24323f" stroke-width="2" fill="none"/>
<!-- bench -->
<rect x="140" y="330" width="130" height="12" rx="3" fill="#b07d4f" stroke="#24323f" stroke-width="3"/>
<rect x="140" y="310" width="130" height="10" rx="3" fill="#b07d4f" stroke="#24323f" stroke-width="3"/>
<line x1="152" y1="342" x2="152" y2="372" stroke="#24323f" stroke-width="5"/><line x1="258" y1="342" x2="258" y2="372" stroke="#24323f" stroke-width="5"/>
<!-- child on bench -->
<circle cx="205" cy="290" r="14" fill="#e0ac69" stroke="#24323f" stroke-width="2"/>
<rect x="193" y="304" width="24" height="26" rx="6" fill="#81b29a" stroke="#24323f" stroke-width="2"/>
<circle cx="200" cy="288" r="2" fill="#24323f"/><circle cx="210" cy="288" r="2" fill="#24323f"/><path d="M200 295 q5 4 10 0" stroke="#24323f" stroke-width="2" fill="none"/>
</svg>
