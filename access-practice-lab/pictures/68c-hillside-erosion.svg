<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img">
<title>Two hillsides next to a river after a rainstorm. The left hillside is covered with trees and grass, and the river beside it is blue and clear. The right hillside has only tree stumps and bare brown soil, with deep grooves where mud has washed down into the river, turning that part of the river brown.</title>
<rect width="640" height="400" fill="#cfe8f3"/>
<!-- clouds after rain -->
<g fill="#ffffff" opacity="0.9"><ellipse cx="120" cy="50" rx="50" ry="18"/><ellipse cx="160" cy="44" rx="34" ry="16"/><ellipse cx="480" cy="56" rx="54" ry="18"/><ellipse cx="520" cy="48" rx="30" ry="14"/></g>
<!-- river -->
<path d="M0 330 L640 330 L640 400 L0 400 Z" fill="#5fa8d3"/>
<path d="M330 330 L640 330 L640 400 L360 400 Z" fill="#9c6b3c"/>
<path d="M330 330 C345 360 340 380 360 400" stroke="#7d5530" stroke-width="4" fill="none"/>
<g stroke="#ffffff" stroke-width="2" opacity="0.7" fill="none"><path d="M40 360 q15 -6 30 0"/><path d="M150 378 q15 -6 30 0"/><path d="M240 352 q15 -6 30 0"/></g>
<!-- left hillside: green with trees -->
<path d="M0 330 L0 170 C80 120 180 120 300 200 L320 330 Z" fill="#81b29a" stroke="#24323f" stroke-width="3" stroke-linejoin="round"/>
<g stroke="#4f8a6d" stroke-width="2"><path d="M40 260 l4 -10 l4 10"/><path d="M110 290 l4 -10 l4 10"/><path d="M200 300 l4 -10 l4 10"/><path d="M250 270 l4 -10 l4 10"/><path d="M70 310 l4 -10 l4 10"/></g>
<g stroke="#24323f" stroke-width="2.5">
  <rect x="56" y="170" width="10" height="34" fill="#8b5e34"/><circle cx="61" cy="158" r="26" fill="#1f766f"/>
  <rect x="136" y="160" width="10" height="36" fill="#8b5e34"/><circle cx="141" cy="146" r="28" fill="#2f8a6f"/>
  <rect x="216" y="196" width="10" height="34" fill="#8b5e34"/><circle cx="221" cy="182" r="26" fill="#1f766f"/>
  <rect x="100" y="230" width="10" height="32" fill="#8b5e34"/><circle cx="105" cy="218" r="24" fill="#2f8a6f"/>
  <rect x="180" y="250" width="10" height="32" fill="#8b5e34"/><circle cx="185" cy="238" r="24" fill="#1f766f"/>
</g>
<!-- roots hint -->
<g stroke="#6b4a2a" stroke-width="2" fill="none"><path d="M61 204 l-12 14 M61 204 l12 14"/><path d="M221 230 l-12 14 M221 230 l12 14"/></g>
<!-- right hillside: bare soil -->
<path d="M320 330 L340 200 C460 120 560 120 640 170 L640 330 Z" fill="#b07a45" stroke="#24323f" stroke-width="3" stroke-linejoin="round"/>
<!-- erosion grooves -->
<g stroke="#7d5530" stroke-width="5" fill="none" stroke-linecap="round">
  <path d="M440 170 C430 220 420 270 400 330"/><path d="M520 150 C515 210 500 270 470 330"/><path d="M590 160 C590 220 580 280 560 330"/>
</g>
<!-- mud flowing into river -->
<g fill="#9c6b3c" stroke="#24323f" stroke-width="2"><path d="M390 325 q10 12 30 8 q-5 -14 -30 -8 z"/><path d="M462 325 q12 12 32 8 q-6 -14 -32 -8 z"/></g>
<!-- stumps -->
<g stroke="#24323f" stroke-width="2.5" fill="#8b5e34">
  <rect x="400" y="190" width="18" height="14" rx="2"/><ellipse cx="409" cy="190" rx="9" ry="4" fill="#d9a066"/>
  <rect x="480" y="170" width="18" height="14" rx="2"/><ellipse cx="489" cy="170" rx="9" ry="4" fill="#d9a066"/>
  <rect x="560" y="186" width="18" height="14" rx="2"/><ellipse cx="569" cy="186" rx="9" ry="4" fill="#d9a066"/>
  <rect x="520" y="250" width="18" height="14" rx="2"/><ellipse cx="529" cy="250" rx="9" ry="4" fill="#d9a066"/>
  <rect x="440" y="260" width="18" height="14" rx="2"/><ellipse cx="449" cy="260" rx="9" ry="4" fill="#d9a066"/>
</g>
</svg>
