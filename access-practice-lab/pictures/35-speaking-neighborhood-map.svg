<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" font-family="Arial, Helvetica, sans-serif"><title>A map of a neighborhood. Main Street goes across the middle, and Oak Street and Pine Avenue go up and down. The school is at the corner of Main Street and Oak Street. The library is across Main Street from the school, and the park with trees is next to the library. A store and a fire station are on Pine Avenue. Two empty lots are marked Lot 1, next to the school, and Lot 2, next to the store. Houses fill the middle blocks. A compass shows north at the top.</title><rect width="640" height="400" fill="#f1e9d2"/><rect x="0" y="180" width="640" height="40" fill="#8d99ae"/><rect x="260" y="0" width="40" height="400" fill="#8d99ae"/><rect x="460" y="0" width="40" height="400" fill="#8d99ae"/><path d="M0 200 L640 200" stroke="#fff" stroke-width="2" stroke-dasharray="12 10"/><text x="110" y="205" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Main St</text><text x="280" y="110" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" transform="rotate(-90 280 110)">Oak St</text><text x="480" y="320" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" transform="rotate(-90 480 320)">Pine Ave</text><rect x="130" y="60" width="120" height="110" rx="4" fill="#e5989b" stroke="#24323f" stroke-width="2"/><path d="M190 60 L190 40" stroke="#24323f" stroke-width="2"/><path d="M190 40 L206 46 L190 52 Z" fill="#e63946"/><text x="190" y="125" font-size="15" font-weight="700" text-anchor="middle" fill="#24323f">School</text><rect x="20" y="90" width="96" height="80" rx="4" fill="#e9edc9" stroke="#24323f" stroke-width="2" stroke-dasharray="6 4"/><text x="68" y="135" font-size="14" font-weight="700" text-anchor="middle" fill="#24323f">Lot 1</text><rect x="150" y="232" width="100" height="90" rx="4" fill="#a2d2ff" stroke="#24323f" stroke-width="2"/><text x="200" y="282" font-size="15" font-weight="700" text-anchor="middle" fill="#24323f">Library</text><rect x="12" y="232" width="126" height="156" rx="8" fill="#95d5b2" stroke="#24323f" stroke-width="2"/><text x="75" y="378" font-size="14" font-weight="700" text-anchor="middle" fill="#24323f">Park</text><circle cx="40" cy="262" r="15" fill="#2d6a4f" stroke="#24323f" stroke-width="1.5"/><circle cx="95" cy="270" r="15" fill="#2d6a4f" stroke="#24323f" stroke-width="1.5"/><circle cx="55" cy="318" r="15" fill="#2d6a4f" stroke="#24323f" stroke-width="1.5"/><circle cx="110" cy="330" r="15" fill="#2d6a4f" stroke="#24323f" stroke-width="1.5"/><rect x="320" y="80" width="40" height="34" fill="#f2cc8f" stroke="#24323f" stroke-width="2"/><path d="M316 80 L340 62 L364 80 Z" fill="#9c6644" stroke="#24323f" stroke-width="2"/><rect x="400" y="80" width="40" height="34" fill="#cdb4db" stroke="#24323f" stroke-width="2"/><path d="M396 80 L420 62 L444 80 Z" fill="#9c6644" stroke="#24323f" stroke-width="2"/><rect x="320" y="140" width="40" height="34" fill="#bde0fe" stroke="#24323f" stroke-width="2"/><path d="M316 140 L340 122 L364 140 Z" fill="#9c6644" stroke="#24323f" stroke-width="2"/><rect x="400" y="140" width="40" height="34" fill="#ffc8dd" stroke="#24323f" stroke-width="2"/><path d="M396 140 L420 122 L444 140 Z" fill="#9c6644" stroke="#24323f" stroke-width="2"/><rect x="320" y="260" width="40" height="34" fill="#f2cc8f" stroke="#24323f" stroke-width="2"/><path d="M316 260 L340 242 L364 260 Z" fill="#9c6644" stroke="#24323f" stroke-width="2"/><rect x="400" y="260" width="40" height="34" fill="#cdb4db" stroke="#24323f" stroke-width="2"/><path d="M396 260 L420 242 L444 260 Z" fill="#9c6644" stroke="#24323f" stroke-width="2"/><rect x="510" y="20" width="120" height="66" rx="4" fill="#e9edc9" stroke="#24323f" stroke-width="2" stroke-dasharray="6 4"/><text x="570" y="58" font-size="14" font-weight="700" text-anchor="middle" fill="#24323f">Lot 2</text><rect x="510" y="96" width="120" height="76" rx="4" fill="#ffd166" stroke="#24323f" stroke-width="2"/><text x="570" y="140" font-size="15" font-weight="700" text-anchor="middle" fill="#24323f">Store</text><rect x="510" y="232" width="120" height="90" rx="4" fill="#e63946" stroke="#24323f" stroke-width="2"/><rect x="530" y="282" width="36" height="40" fill="#fff" stroke="#24323f" stroke-width="2"/><rect x="574" y="282" width="36" height="40" fill="#fff" stroke="#24323f" stroke-width="2"/><text x="570" y="268" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">Fire Station</text><g transform="translate(400 350)"><circle r="26" fill="#fff" stroke="#24323f" stroke-width="2"/><path d="M0 -20 L7 0 L0 20 L-7 0 Z" fill="#3d405b"/><path d="M0 -20 L7 0 L-7 0 Z" fill="#e63946"/><text x="0" y="-30" font-size="13" font-weight="700" text-anchor="middle" fill="#24323f">N</text></g></svg>