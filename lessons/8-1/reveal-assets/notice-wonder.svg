<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="720" height="300" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">The clue on Detective Ruiz's case board</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">Some gems were stolen, 8 more turned up in the safe, and together they make 20.</text><rect x="70" y="140" width="340" height="70" fill="#ffffff" stroke="#264653" stroke-width="2.5" stroke-dasharray="7 5"/><text x="240" y="185" font-size="30" font-weight="800" fill="#6b7f88" text-anchor="middle">?</text><text x="240" y="126" font-size="15" font-weight="800" fill="#6b7f88" text-anchor="middle">gems stolen (unknown)</text><rect x="410" y="140" width="170" height="70" fill="rgba(233,196,106,0.45)" stroke="#264653" stroke-width="2.5"/><text x="495" y="184" font-size="26" font-weight="800" fill="#264653" text-anchor="middle">8</text><text x="495" y="126" font-size="15" font-weight="800" fill="#b8860b" text-anchor="middle">found in the safe</text><line x1="70" y1="232" x2="580" y2="232" stroke="#264653" stroke-width="2"/><line x1="70" y1="224" x2="70" y2="240" stroke="#264653" stroke-width="2"/><line x1="580" y1="224" x2="580" y2="240" stroke="#264653" stroke-width="2"/><text x="325" y="262" font-size="20" font-weight="800" fill="#264653" text-anchor="middle">20 gems in all</text></svg>
