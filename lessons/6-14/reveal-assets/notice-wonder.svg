<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="780" height="360" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">A merch order for 9 band members, written two ways</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">Same order, same bundles — two different expressions on the form.</text><rect x="60" y="100" width="320" height="150" rx="10" fill="rgba(42,157,143,0.12)" stroke="#264653" stroke-width="2"/><text x="220" y="134" font-size="16" font-weight="800" fill="#264653" text-anchor="middle">ONE BUNDLE</text><text x="220" y="176" font-size="19" font-weight="700" fill="#264653" text-anchor="middle">t-shirt  $18</text><text x="220" y="208" font-size="19" font-weight="700" fill="#264653" text-anchor="middle">strap  $7</text><text x="220" y="280" font-size="16" font-weight="800" fill="#d9795d" text-anchor="middle">9 band members = 9 bundles</text><rect x="440" y="100" width="320" height="150" rx="10" fill="#fffdf6" stroke="#264653" stroke-width="2"/><text x="600" y="134" font-size="16" font-weight="800" fill="#264653" text-anchor="middle">THE ORDER FORM WRITES IT</text><text x="600" y="178" font-size="23" font-weight="800" fill="#2a9d8f" text-anchor="middle">9(18 + 7)</text><text x="600" y="210" font-size="14" font-weight="700" fill="#6b7f88" text-anchor="middle">and also</text><text x="600" y="240" font-size="23" font-weight="800" fill="#d9795d" text-anchor="middle">9 × 18 + 9 × 7</text></svg>
