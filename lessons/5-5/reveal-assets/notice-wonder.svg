<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif">
  <rect width="620" height="400" fill="#ffffff"/>
  <text x="24" y="26" font-size="17" font-weight="700" fill="#264653">L-shaped room — floor plan</text>

  <!-- Part 1 fill: 6 ft x 5 ft rectangle -->
  <path d="M100,40 L244,40 L244,160 L100,160 Z" fill="rgba(233,196,106,0.38)" stroke="none"/>
  <!-- Part 2 fill: 12 ft x 8 ft rectangle -->
  <path d="M100,160 L388,160 L388,352 L100,352 Z" fill="rgba(42,157,143,0.24)" stroke="none"/>

  <!-- L-shape outline -->
  <path d="M100,40 L244,40 L244,160 L388,160 L388,352 L100,352 Z" fill="none" stroke="#264653" stroke-width="3" stroke-linejoin="round"/>

  <!-- dashed line splitting the L into two rectangles -->
  <line x1="100" y1="160" x2="244" y2="160" stroke="#264653" stroke-width="2.5" stroke-dasharray="7 6"/>

  <!-- dimension: Part 1 width (6 ft) -->
  <line x1="100" y1="24" x2="244" y2="24" stroke="#264653" stroke-width="1.4"/>
  <line x1="100" y1="18" x2="100" y2="30" stroke="#264653" stroke-width="1.4"/>
  <line x1="244" y1="18" x2="244" y2="30" stroke="#264653" stroke-width="1.4"/>
  <text x="172" y="16" font-size="15" font-weight="700" fill="#264653" text-anchor="middle">6 ft</text>

  <!-- dimension: Part 1 height (5 ft) -->
  <line x1="76" y1="40" x2="76" y2="160" stroke="#264653" stroke-width="1.4"/>
  <line x1="70" y1="40" x2="82" y2="40" stroke="#264653" stroke-width="1.4"/>
  <line x1="70" y1="160" x2="82" y2="160" stroke="#264653" stroke-width="1.4"/>
  <text x="60" y="104" font-size="15" font-weight="700" fill="#264653" text-anchor="end">5 ft</text>

  <!-- dimension: Part 2 width (12 ft) -->
  <line x1="100" y1="372" x2="388" y2="372" stroke="#264653" stroke-width="1.4"/>
  <line x1="100" y1="366" x2="100" y2="378" stroke="#264653" stroke-width="1.4"/>
  <line x1="388" y1="366" x2="388" y2="378" stroke="#264653" stroke-width="1.4"/>
  <text x="244" y="392" font-size="15" font-weight="700" fill="#264653" text-anchor="middle">12 ft</text>

  <!-- dimension: Part 2 height (8 ft) -->
  <line x1="406" y1="160" x2="406" y2="352" stroke="#264653" stroke-width="1.4"/>
  <line x1="400" y1="160" x2="412" y2="160" stroke="#264653" stroke-width="1.4"/>
  <line x1="400" y1="352" x2="412" y2="352" stroke="#264653" stroke-width="1.4"/>
  <text x="418" y="260" font-size="15" font-weight="700" fill="#264653" text-anchor="start">8 ft</text>

  <text x="172" y="105" font-size="14" font-weight="700" fill="#b8860b" text-anchor="middle">Part 1</text>
  <text x="244" y="262" font-size="14" font-weight="700" fill="#1f7a6c" text-anchor="middle">Part 2</text>
</svg>
