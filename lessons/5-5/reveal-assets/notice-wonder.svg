<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="800" height="380" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">Two time capsules, side by side</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">Both are drawn to the same scale.</text><polygon points="120,140 188,140 239,89 171,89" fill="rgba(42,157,143,0.55)" fill-opacity="0.75" stroke="#264653" stroke-width="2"/><polygon points="188,140 188,276 239,225 239,89" fill="rgba(42,157,143,0.55)" fill-opacity="0.5" stroke="#264653" stroke-width="2"/><rect x="120" y="140" width="68" height="136" fill="rgba(42,157,143,0.55)" fill-opacity="0.9" stroke="#264653" stroke-width="2"/><text x="154" y="310" font-size="16" font-weight="800" fill="#264653" text-anchor="middle">Capsule A</text><text x="154" y="332" font-size="14" font-weight="700" fill="#6b7f88" text-anchor="middle">4 in x 3 in x 8 in</text><polygon points="430,174 532,174 634,72 532,72" fill="rgba(233,196,106,0.75)" fill-opacity="0.75" stroke="#264653" stroke-width="2"/><polygon points="532,174 532,276 634,174 634,72" fill="rgba(233,196,106,0.75)" fill-opacity="0.5" stroke="#264653" stroke-width="2"/><rect x="430" y="174" width="102" height="102" fill="rgba(233,196,106,0.75)" fill-opacity="0.9" stroke="#264653" stroke-width="2"/><text x="481" y="310" font-size="16" font-weight="800" fill="#264653" text-anchor="middle">Capsule B</text><text x="481" y="332" font-size="14" font-weight="700" fill="#6b7f88" text-anchor="middle">6 in x 6 in x 6 in</text><text x="400" y="362" font-size="16" font-weight="700" fill="#264653" text-anchor="middle">A classmate says Capsule A must hold more, because it looks taller.</text></svg>
