<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif">
  <defs>
    <pattern id="tiles55" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#eef4f3"/>
      <rect width="24" height="24" fill="none" stroke="#cdd6dd" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="24" y="26" font-size="17" font-weight="700" fill="#264653">L-shaped lobby floor — tile order</text>

  <!-- full L-shape floor tiled -->
  <path d="M100,50 L244,50 L244,170 L388,170 L388,362 L100,362 Z" fill="url(#tiles55)" stroke="#264653" stroke-width="3" stroke-linejoin="round"/>

  <!-- dashed line splitting the L into two rectangles to decompose -->
  <line x1="100" y1="170" x2="244" y2="170" stroke="#264653" stroke-width="2.5" stroke-dasharray="7 6"/>

  <!-- dimension: 6 ft width of small rectangle -->
  <line x1="100" y1="34" x2="244" y2="34" stroke="#264653" stroke-width="1.4"/>
  <line x1="100" y1="28" x2="100" y2="40" stroke="#264653" stroke-width="1.4"/>
  <line x1="244" y1="28" x2="244" y2="40" stroke="#264653" stroke-width="1.4"/>
  <text x="172" y="26" font-size="15" font-weight="700" fill="#264653" text-anchor="middle">6 ft</text>

  <!-- dimension: 5 ft height of small rectangle -->
  <line x1="76" y1="50" x2="76" y2="170" stroke="#264653" stroke-width="1.4"/>
  <line x1="70" y1="50" x2="82" y2="50" stroke="#264653" stroke-width="1.4"/>
  <line x1="70" y1="170" x2="82" y2="170" stroke="#264653" stroke-width="1.4"/>
  <text x="60" y="114" font-size="15" font-weight="700" fill="#264653" text-anchor="end">5 ft</text>

  <!-- dimension: 12 ft width of big rectangle -->
  <line x1="100" y1="382" x2="388" y2="382" stroke="#264653" stroke-width="1.4"/>
  <line x1="100" y1="376" x2="100" y2="388" stroke="#264653" stroke-width="1.4"/>
  <line x1="388" y1="376" x2="388" y2="388" stroke="#264653" stroke-width="1.4"/>
  <text x="244" y="399" font-size="15" font-weight="700" fill="#264653" text-anchor="middle">12 ft</text>

  <!-- dimension: 8 ft height of big rectangle -->
  <line x1="406" y1="170" x2="406" y2="362" stroke="#264653" stroke-width="1.4"/>
  <line x1="400" y1="170" x2="412" y2="170" stroke="#264653" stroke-width="1.4"/>
  <line x1="400" y1="362" x2="412" y2="362" stroke="#264653" stroke-width="1.4"/>
  <text x="418" y="270" font-size="15" font-weight="700" fill="#264653" text-anchor="start">8 ft</text>

  <!-- price tag -->
  <rect x="454" y="50" width="164" height="60" rx="10" fill="rgba(217,121,93,0.16)" stroke="#d9795d" stroke-width="2"/>
  <text x="536" y="76" font-size="16" font-weight="800" fill="#d9795d" text-anchor="middle">$2.89</text>
  <text x="536" y="96" font-size="13" fill="#d9795d" text-anchor="middle">per sq ft (tile)</text>
</svg>
