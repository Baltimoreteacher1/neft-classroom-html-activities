<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="160" viewBox="0 0 360 160" role="img" aria-label="Algebra balance scale equation model" style="background:white;max-width:100%;height:auto;border:1.5px solid #cbd5e1;border-radius:8px;padding:4px;">
    <!-- Fulcrum Base -->
    <polygon points="180,50 155,120 205,120" fill="#0f172a"/>
    <rect x="135" y="120" width="90" height="8" rx="2" fill="#0f172a"/>
    <!-- Beam -->
    <line x1="50" y1="50" x2="310" y2="50" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="180" cy="50" r="5" fill="#b45309"/>
    <!-- Left Pan -->
    <line x1="80" y1="50" x2="80" y2="85" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 45 85 Q 80 100 115 85 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <text x="80" y="80" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">n + 23</text>
    <!-- Right Pan -->
    <line x1="280" y1="50" x2="280" y2="85" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 245 85 Q 280 100 315 85 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <text x="280" y="80" text-anchor="middle" font-size="11" font-weight="800" fill="#0f766e">58</text>
    <!-- Equal Sign -->
    <text x="180" y="36" text-anchor="middle" font-size="18" font-weight="900" fill="#b45309">=</text>
  </svg>
