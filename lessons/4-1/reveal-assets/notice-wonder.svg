<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="720" height="320" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">Arcade leaderboard: one score above the goal, one tiny bonus</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">The dashed box is the whole weekly goal.</text><rect x="60" y="130" width="600" height="44" fill="rgba(42,157,143,0.35)" stroke="#264653" stroke-width="2"/><text x="76" y="160" font-size="20" font-weight="800" fill="#264653">150% scored</text><rect x="60" y="130" width="400" height="44" fill="#ffffff" stroke="#6b7f88" stroke-width="1.5" stroke-dasharray="6 5"/><text x="460" y="118" font-size="14" font-weight="800" fill="#6b7f88" text-anchor="middle">weekly goal = 100%</text><rect x="60" y="240" width="400" height="26" fill="#ffffff" stroke="#6b7f88" stroke-width="1.5"/><rect x="60" y="240" width="2" height="26" fill="#d9795d" stroke="#d9795d" stroke-width="1.5"/><text x="74" y="292" font-size="16" font-weight="800" fill="#d9795d">the 0.5% bonus, drawn to the same scale</text></svg>
