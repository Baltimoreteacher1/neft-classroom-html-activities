<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 212" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="620" height="212" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">Two smoothie stands report their morning</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">Each stand sold a different number of smoothies over a different number of hours.</text><rect x="90" y="92" width="440" height="132" rx="10" fill="#fffdf6" stroke="#264653" stroke-width="2"/><rect x="90" y="92" width="440" height="42" rx="10" fill="#264653"/><text x="310" y="120" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">CHEF ACADEMY — MORNING SALES</text><line x1="90" y1="136" x2="530" y2="136" stroke="#e2e8f0" stroke-width="1"/><text x="110" y="165" font-size="16" font-weight="700" fill="#264653">Stand A</text><text x="510" y="165" font-size="17" font-weight="800" fill="#2a9d8f" text-anchor="end">45 smoothies in 9 hours</text><line x1="90" y1="180" x2="530" y2="180" stroke="#e2e8f0" stroke-width="1"/><text x="110" y="209" font-size="16" font-weight="700" fill="#264653">Stand B</text><text x="510" y="209" font-size="17" font-weight="800" fill="#2a9d8f" text-anchor="end">56 smoothies in 8 hours</text></svg>
