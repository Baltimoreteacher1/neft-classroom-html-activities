<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="760" height="320" fill="#ffffff"/><text x="28" y="40" font-size="17" font-weight="700" fill="#264653">Station fuel tank: one delivery in, one burn out</text><text x="28" y="64" font-size="15" font-weight="700" fill="#2a9d8f">128.75 L, then +46.8 L, then −19.35 L. Every amount is in liters.</text><text x="60" y="136" font-size="14" font-weight="800" fill="#2a9d8f">tank now</text><text x="360" y="136" font-size="14" font-weight="800" fill="#b8860b">shuttle delivers</text><text x="505" y="116" font-size="14" font-weight="800" fill="#d9795d" text-anchor="middle">thrusters burn</text><line x1="505" y1="122" x2="505" y2="146" stroke="#d9795d" stroke-width="1.5"/><text x="605" y="136" font-size="14" font-weight="800" fill="#6b7f88" text-anchor="middle">tank after</text><rect x="60" y="150" width="300" height="66" fill="rgba(42,157,143,0.28)" stroke="#264653" stroke-width="2"/><text x="210" y="191" font-size="22" font-weight="800" fill="#264653" text-anchor="middle">128.75 L</text><rect x="360" y="150" width="110" height="66" fill="rgba(233,196,106,0.45)" stroke="#264653" stroke-width="2"/><text x="415" y="190" font-size="17" font-weight="800" fill="#264653" text-anchor="middle">+46.8</text><rect x="470" y="150" width="70" height="66" fill="rgba(217,121,93,0.30)" stroke="#264653" stroke-width="2" stroke-dasharray="6 4"/><text x="505" y="190" font-size="17" font-weight="800" fill="#d9795d" text-anchor="middle">−19.35</text><rect x="540" y="150" width="130" height="66" fill="#ffffff" stroke="#264653" stroke-width="2" stroke-dasharray="4 5"/><text x="605" y="191" font-size="26" font-weight="800" fill="#6b7f88" text-anchor="middle">?</text><text x="380" y="262" font-size="16" font-weight="700" fill="#264653" text-anchor="middle">The decimal points have to line up before you can add or subtract.</text></svg>
