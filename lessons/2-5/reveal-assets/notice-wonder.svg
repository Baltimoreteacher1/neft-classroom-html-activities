<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="820" height="300" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">5/8 of an hour of security footage, marked at equal spacing</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">A marker goes every 1/16 of an hour. The dashed outline is one whole hour.</text><rect x="60" y="130" width="700" height="74" fill="#ffffff" stroke="#6b7f88" stroke-width="1.5" stroke-dasharray="6 5"/><text x="760" y="118" font-size="14" font-weight="700" fill="#6b7f88" text-anchor="end">1 whole hour</text><line x1="60" y1="104" x2="497.5" y2="104" stroke="#264653" stroke-width="2"/><line x1="60" y1="96" x2="60" y2="112" stroke="#264653" stroke-width="2"/><line x1="497.5" y1="96" x2="497.5" y2="112" stroke="#264653" stroke-width="2"/><text x="278.75" y="88" font-size="21" font-weight="800" fill="#264653" text-anchor="middle">5/8 hour</text><rect x="60" y="130" width="43.75" height="74" fill="rgba(233,196,106,0.32)" stroke="#264653" stroke-width="1.4"/><rect x="103.75" y="130" width="43.75" height="74" fill="rgba(42,157,143,0.20)" stroke="#264653" stroke-width="1.4"/><rect x="147.5" y="130" width="43.75" height="74" fill="rgba(233,196,106,0.32)" stroke="#264653" stroke-width="1.4"/><rect x="191.25" y="130" width="43.75" height="74" fill="rgba(42,157,143,0.20)" stroke="#264653" stroke-width="1.4"/><rect x="235" y="130" width="43.75" height="74" fill="rgba(233,196,106,0.32)" stroke="#264653" stroke-width="1.4"/><rect x="278.75" y="130" width="43.75" height="74" fill="rgba(42,157,143,0.20)" stroke="#264653" stroke-width="1.4"/><rect x="322.5" y="130" width="43.75" height="74" fill="rgba(233,196,106,0.32)" stroke="#264653" stroke-width="1.4"/><rect x="366.25" y="130" width="43.75" height="74" fill="rgba(42,157,143,0.20)" stroke="#264653" stroke-width="1.4"/><rect x="410" y="130" width="43.75" height="74" fill="rgba(233,196,106,0.32)" stroke="#264653" stroke-width="1.4"/><rect x="453.75" y="130" width="43.75" height="74" fill="rgba(42,157,143,0.20)" stroke="#264653" stroke-width="1.4"/><rect x="60" y="130" width="43.75" height="74" fill="none" stroke="#d9795d" stroke-width="3"/><text x="81.875" y="230" font-size="15" font-weight="800" fill="#d9795d" text-anchor="middle">1/16 hr</text><text x="81.875" y="250" font-size="13" font-weight="700" fill="#6b7f88" text-anchor="middle">one marker gap</text><text x="410" y="274" font-size="17" font-weight="700" fill="#264653" text-anchor="middle">How many marker gaps fit into 5/8 hour?</text></svg>
