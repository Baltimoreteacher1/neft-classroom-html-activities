<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="720" height="340" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">Margaret's phone storage</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">The bar is the whole 6 GB. Photos take the widest stripe.</text><g transform="translate(0,26)"><line x1="90" y1="96" x2="690" y2="96" stroke="#264653" stroke-width="2"/><line x1="90" y1="88" x2="90" y2="104" stroke="#264653" stroke-width="2"/><line x1="690" y1="88" x2="690" y2="104" stroke="#264653" stroke-width="2"/><text x="390" y="82" font-size="16" font-weight="800" fill="#264653" text-anchor="middle">6 GB total</text><rect x="90" y="120" width="350" height="76" fill="rgba(42,157,143,0.35)" stroke="#264653" stroke-width="2"/><rect x="440" y="120" width="20" height="76" fill="rgba(233,196,106,0.75)" stroke="#264653" stroke-width="2"/><rect x="460" y="120" width="20" height="76" fill="rgba(217,121,93,0.65)" stroke="#264653" stroke-width="2"/><rect x="480" y="120" width="10" height="76" fill="rgba(184,134,11,0.55)" stroke="#264653" stroke-width="2"/><rect x="490" y="120" width="200" height="76" fill="#ffffff" stroke="#264653" stroke-width="2" stroke-dasharray="7 6"/><text x="265" y="165" font-size="16" font-weight="800" fill="#264653" text-anchor="middle">Photos</text><text x="590" y="165" font-size="16" font-weight="700" fill="#6b7f88" text-anchor="middle">still free</text><line x1="450" y1="200" x2="450" y2="224" stroke="#6b7f88" stroke-width="1.4"/><line x1="470" y1="200" x2="486" y2="224" stroke="#6b7f88" stroke-width="1.4"/><line x1="485" y1="200" x2="556" y2="224" stroke="#6b7f88" stroke-width="1.4"/><text x="424" y="240" font-size="13" font-weight="700" fill="#6b7f88">mail</text><text x="470" y="240" font-size="13" font-weight="700" fill="#6b7f88">messages</text><text x="548" y="240" font-size="13" font-weight="700" fill="#6b7f88">documents</text><line x1="90" y1="266" x2="490" y2="266" stroke="#d9795d" stroke-width="2"/><line x1="90" y1="258" x2="90" y2="274" stroke="#d9795d" stroke-width="2"/><line x1="490" y1="258" x2="490" y2="274" stroke="#d9795d" stroke-width="2"/><text x="290" y="292" font-size="16" font-weight="800" fill="#d9795d" text-anchor="middle">4 GB used</text><text x="590" y="292" font-size="17" font-weight="800" fill="#264653" text-anchor="middle">? % of the phone is full</text></g></svg>
