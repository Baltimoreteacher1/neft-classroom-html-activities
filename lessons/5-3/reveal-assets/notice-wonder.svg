<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="680" height="330" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">Blueprint: a rectangular park plot, split by a diagonal path</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">The path runs corner to corner, making two triangular garden beds.</text><polygon points="120,96 540,96 120,276" fill="rgba(42,157,143,0.22)"/><polygon points="540,96 540,276 120,276" fill="rgba(233,196,106,0.35)"/><rect x="120" y="96" width="420" height="180" fill="none" stroke="#264653" stroke-width="2.5"/><line x1="540" y1="96" x2="120" y2="276" stroke="#d9795d" stroke-width="3"/><text x="246" y="153.6" font-size="15" font-weight="800" fill="#264653" text-anchor="middle">bed A</text><text x="414" y="225.6" font-size="15" font-weight="800" fill="#264653" text-anchor="middle">bed B</text><text x="330" y="304" font-size="16" font-weight="800" fill="#264653" text-anchor="middle">20 ft</text><text x="106" y="186" font-size="16" font-weight="800" fill="#264653" text-anchor="end">14 ft</text><text x="532" y="84" font-size="14" font-weight="800" fill="#d9795d" text-anchor="end">diagonal path</text><path d="M 120 260 L 136 260 L 136 276" fill="none" stroke="#264653" stroke-width="1.6"/></svg>
