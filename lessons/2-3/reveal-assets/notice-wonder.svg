-width="1.4"/><rect x="468.33333333333337" y="130" width="58.333333333333336" height="74" fill="rgba(42,157,143,0.20)" stroke="#264653" stroke-width="1.4"/><rect x="526.6666666666667" y="130" width="58.333333333333336" height="74" fill="rgba(233,196,106,0.32)" stroke="#264653" stroke-width="1.4"/><rect x="585" y="130" width="58.333333333333336" height="74" fill="rgba(42,157,143,0.20)" stroke="#264653" stroke-width="1.4"/><rect x="60" y="130" width="58.333333333333336" height="74" fill="none" stroke="#d9795d" stroke-width="3"/><text x="89.16666666666667" y="230" font-size="15" font-weight="800" fill="#d9795d" text-anchor="middle">1/12 lb</text><text x="89.16666666666667" y="250" font-size="13" font-weight="700" fill="#6b7f88" text-anchor="middle">one tube</text><text x="410" y="274" font-size="17" font-weight="700" fill="#264653" text-anchor="middle">How many tubes fit into 5/6 pound?</text></svg>
