<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="780" height="260" fill="#ffffff"/><text x="40" y="48" font-size="19" font-weight="800" fill="#264653">Concert setup — total cost</text><rect x="40" y="90" width="200" height="90" rx="12" fill="rgba(42,157,143,0.12)" stroke="#2a9d8f" stroke-width="2"/><text x="140" y="128" font-size="17" font-weight="700" fill="#264653" text-anchor="middle">base venue fee</text><text x="140" y="156" font-size="20" font-weight="800" fill="#2a9d8f" text-anchor="middle">$150</text><text x="262" y="146" font-size="34" font-weight="800" fill="#264653" text-anchor="middle">+</text><rect x="288" y="90" width="200" height="90" rx="12" fill="rgba(233,196,106,0.22)" stroke="#e9c46a" stroke-width="2"/><text x="388" y="128" font-size="17" font-weight="700" fill="#264653" text-anchor="middle">per speaker rented</text><text x="388" y="156" font-size="20" font-weight="800" fill="#b8860b" text-anchor="middle">$12 × s</text><text x="510" y="146" font-size="30" font-weight="800" fill="#264653" text-anchor="middle">=</text><rect x="536" y="90" width="200" height="90" rx="12" fill="rgba(217,121,93,0.12)" stroke="#d9795d" stroke-width="2"/><text x="636" y="128" font-size="17" font-weight="700" fill="#264653" text-anchor="middle">total cost</text><text x="636" y="156" font-size="20" font-weight="800" fill="#d9795d" text-anchor="middle">150 + 12s</text><text x="40" y="230" font-size="16" fill="#2a9d8f" font-weight="700">s = the number of speakers rented (unknown)</text></svg>
