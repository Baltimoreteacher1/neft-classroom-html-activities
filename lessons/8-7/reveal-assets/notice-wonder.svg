<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="800" height="320" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">Detective Chen's two case notes</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">One note fixes an amount. The other sets a limit.</text><rect x="60" y="96" width="320" height="170" rx="10" fill="#fffdf6" stroke="#264653" stroke-width="2"/><rect x="60" y="96" width="320" height="38" rx="10" fill="#2a9d8f"/><rect x="60" y="120" width="320" height="14" fill="#2a9d8f"/><text x="220" y="122" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">NOTE A</text><text x="80" y="172" font-size="16" font-weight="700" fill="#264653">The evidence locker holds</text><text x="80" y="202" font-size="16" font-weight="700" fill="#264653">EXACTLY 54 files, split</text><text x="80" y="232" font-size="16" font-weight="700" fill="#264653">equally among 6 shelves.</text><rect x="420" y="96" width="320" height="170" rx="10" fill="#fffdf6" stroke="#264653" stroke-width="2"/><rect x="420" y="96" width="320" height="38" rx="10" fill="#d9795d"/><rect x="420" y="120" width="320" height="14" fill="#d9795d"/><text x="580" y="122" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">NOTE B</text><text x="440" y="172" font-size="16" font-weight="700" fill="#264653">The surveillance van must</text><text x="440" y="202" font-size="16" font-weight="700" fill="#264653">stay parked NO MORE THAN</text><text x="440" y="232" font-size="16" font-weight="700" fill="#264653">45 minutes.</text></svg>
