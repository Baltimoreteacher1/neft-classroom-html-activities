<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="820" height="300" fill="#ffffff"/><text x="28" y="36" font-size="17" font-weight="700" fill="#264653">Arm A resets every 9 minutes. Arm B resets every 15 minutes.</text><text x="28" y="60" font-size="15" font-weight="700" fill="#2a9d8f">Both just reset at the same moment. When does that happen again?</text><line x1="60" y1="120" x2="760" y2="120" stroke="#264653" stroke-width="2"/><line x1="60" y1="200" x2="760" y2="200" stroke="#264653" stroke-width="2"/><circle cx="186" cy="120" r="9" fill="#2a9d8f" stroke="#264653" stroke-width="1.5"/><text x="186" y="102" font-size="14" font-weight="700" fill="#264653" text-anchor="middle">9</text><circle cx="312" cy="120" r="9" fill="#2a9d8f" stroke="#264653" stroke-width="1.5"/><text x="312" y="102" font-size="14" font-weight="700" fill="#264653" text-anchor="middle">18</text><circle cx="438" cy="120" r="9" fill="#2a9d8f" stroke="#264653" stroke-width="1.5"/><text x="438" y="102" font-size="14" font-weight="700" fill="#264653" text-anchor="middle">27</text><circle cx="564" cy="120" r="9" fill="#2a9d8f" stroke="#264653" stroke-width="1.5"/><text x="564" y="102" font-size="14" font-weight="700" fill="#264653" text-anchor="middle">36</text><circle cx="690" cy="120" r="9" fill="#2a9d8f" stroke="#264653" stroke-width="1.5"/><text x="690" y="102" font-size="14" font-weight="700" fill="#264653" text-anchor="middle">45</text><rect x="261" y="191" width="18" height="18" fill="#e9c46a" stroke="#264653" stroke-width="1.5"/><text x="270" y="232" font-size="14" font-weight="700" fill="#264653" text-anchor="middle">15</text><rect x="471" y="191" width="18" height="18" fill="#e9c46a" stroke="#264653" stroke-width="1.5"/><text x="480" y="232" font-size="14" font-weight="700" fill="#264653" text-anchor="middle">30</text><rect x="681" y="191" width="18" height="18" fill="#e9c46a" stroke="#264653" stroke-width="1.5"/><text x="690" y="232" font-size="14" font-weight="700" fill="#264653" text-anchor="middle">45</text><text x="52" y="126" font-size="15" font-weight="800" fill="#2a9d8f" text-anchor="end">Arm A</text><text x="52" y="206" font-size="15" font-weight="800" fill="#b8860b" text-anchor="end">Arm B</text><text x="760" y="270" font-size="15" fill="#6b7f88" text-anchor="end">minutes since both arms last reset together</text></svg>
