<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="760" height="320" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">Two ticket booths at NeonPlex Arcade</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">The two signs quote the same thing in opposite orders.</text><rect x="60" y="96" width="300" height="180" rx="14" fill="#fffdf6" stroke="#264653" stroke-width="2.5"/><rect x="60" y="96" width="300" height="44" rx="14" fill="#2a9d8f"/><rect x="60" y="126" width="300" height="14" fill="#2a9d8f"/><text x="210" y="126" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">BOOTH A</text><text x="210" y="198" font-size="34" font-weight="800" fill="#264653" text-anchor="middle">5 games</text><text x="210" y="232" font-size="17" font-weight="700" fill="#6b7f88" text-anchor="middle">for</text><text x="210" y="264" font-size="30" font-weight="800" fill="#2a9d8f" text-anchor="middle">$3.00</text><rect x="400" y="96" width="300" height="180" rx="14" fill="#fffdf6" stroke="#264653" stroke-width="2.5"/><rect x="400" y="96" width="300" height="44" rx="14" fill="#d9795d"/><rect x="400" y="126" width="300" height="14" fill="#d9795d"/><text x="550" y="126" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">BOOTH B</text><text x="550" y="198" font-size="34" font-weight="800" fill="#264653" text-anchor="middle">8 games</text><text x="550" y="232" font-size="17" font-weight="700" fill="#6b7f88" text-anchor="middle">for</text><text x="550" y="264" font-size="30" font-weight="800" fill="#d9795d" text-anchor="middle">$5.00</text><text x="380" y="296" font-size="16" font-weight="700" fill="#264653" text-anchor="middle">Different amounts, different prices.</text></svg>
