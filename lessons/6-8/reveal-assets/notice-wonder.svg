<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="760" height="340" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">Guitar 15, bass 22, drums 8 — the engineer's sum, written four ways</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">Same three channels every time. Only the order and the grouping change.</text><rect x="70" y="92" width="620" height="54" rx="9" fill="rgba(42,157,143,0.14)" stroke="#264653" stroke-width="1.6"/><text x="92" y="127" font-size="22" font-weight="800" fill="#264653">15 + 22 + 8</text><text x="600" y="127" font-size="22" font-weight="800" fill="#6b7f88">=</text><rect x="622" y="103" width="52" height="32" rx="6" fill="#ffffff" stroke="#6b7f88" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="70" y="154" width="620" height="54" rx="9" fill="rgba(233,196,106,0.22)" stroke="#264653" stroke-width="1.6"/><text x="92" y="189" font-size="22" font-weight="800" fill="#264653">8 + 15 + 22</text><text x="600" y="189" font-size="22" font-weight="800" fill="#6b7f88">=</text><rect x="622" y="165" width="52" height="32" rx="6" fill="#ffffff" stroke="#6b7f88" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="70" y="216" width="620" height="54" rx="9" fill="rgba(42,157,143,0.14)" stroke="#264653" stroke-width="1.6"/><text x="92" y="251" font-size="22" font-weight="800" fill="#264653">(15 + 22) + 8</text><text x="600" y="251" font-size="22" font-weight="800" fill="#6b7f88">=</text><rect x="622" y="227" width="52" height="32" rx="6" fill="#ffffff" stroke="#6b7f88" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="70" y="278" width="620" height="54" rx="9" fill="rgba(233,196,106,0.22)" stroke="#264653" stroke-width="1.6"/><text x="92" y="313" font-size="22" font-weight="800" fill="#264653">15 + (22 + 8)</text><text x="600" y="313" font-size="22" font-weight="800" fill="#6b7f88">=</text><rect x="622" y="289" width="52" height="32" rx="6" fill="#ffffff" stroke="#6b7f88" stroke-width="1.6" stroke-dasharray="5 4"/></svg>
