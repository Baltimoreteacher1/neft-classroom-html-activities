<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="820" height="300" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">A 3-hour afternoon session, filled with equal activities</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">Every activity is 45 minutes — that is 3/4 of an hour.</text><line x1="60" y1="104" x2="760" y2="104" stroke="#264653" stroke-width="2"/><line x1="60" y1="96" x2="60" y2="112" stroke="#264653" stroke-width="2"/><line x1="760" y1="96" x2="760" y2="112" stroke="#264653" stroke-width="2"/><text x="410" y="88" font-size="21" font-weight="800" fill="#264653" text-anchor="middle">3 hours</text><rect x="60" y="130" width="175" height="74" fill="rgba(233,196,106,0.32)" stroke="#264653" stroke-width="1.4"/><rect x="235" y="130" width="175" height="74" fill="rgba(42,157,143,0.20)" stroke="#264653" stroke-width="1.4"/><rect x="410" y="130" width="175" height="74" fill="rgba(233,196,106,0.32)" stroke="#264653" stroke-width="1.4"/><rect x="585" y="130" width="175" height="74" fill="rgba(42,157,143,0.20)" stroke="#264653" stroke-width="1.4"/><rect x="60" y="130" width="175" height="74" fill="none" stroke="#d9795d" stroke-width="3"/><text x="147.5" y="230" font-size="15" font-weight="800" fill="#d9795d" text-anchor="middle">45 min</text><text x="147.5" y="250" font-size="13" font-weight="700" fill="#6b7f88" text-anchor="middle">one activity</text><text x="410" y="274" font-size="17" font-weight="700" fill="#264653" text-anchor="middle">How many activities fit into 3 hours?</text></svg>
