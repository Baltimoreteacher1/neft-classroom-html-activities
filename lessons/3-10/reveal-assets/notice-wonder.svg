<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" font-family="'Hanken Grotesk','Segoe UI',sans-serif"><rect width="640" height="340" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#264653">A highway sign in Canada</text><text x="28" y="58" font-size="15" font-weight="700" fill="#2a9d8f">Same speed limit, a different unit on the sign.</text><rect x="230" y="90" width="180" height="200" rx="10" fill="#ffffff" stroke="#264653" stroke-width="5"/><text x="320" y="140" font-size="20" font-weight="800" fill="#264653" text-anchor="middle">MAXIMUM</text><text x="320" y="222" font-size="72" font-weight="800" fill="#264653" text-anchor="middle">100</text><text x="320" y="262" font-size="26" font-weight="800" fill="#264653" text-anchor="middle">km/h</text><text x="460" y="176" font-size="16" font-weight="700" fill="#6b7f88">Evelyn is used to</text><text x="460" y="200" font-size="16" font-weight="700" fill="#6b7f88">signs in miles per</text><text x="460" y="224" font-size="16" font-weight="700" fill="#6b7f88">hour, not km/h.</text><text x="460" y="256" font-size="26" font-weight="800" fill="#d9795d">? mi/h</text></svg>
