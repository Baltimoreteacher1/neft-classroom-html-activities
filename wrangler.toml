name = "neft-classroom-html-activities"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-25"

# Cloud sync for the Noam School planner (focus-school/ app, functions/api/state.js).
# Optional feature: if this binding is absent the endpoint returns 503 and the
# app stays local-only. KV namespace "noam-school-sync".
[[kv_namespaces]]
binding = "NOAM_SCHOOL_KV"
id = "59075911253f400f807345430425946c"

[[d1_databases]]
binding = "DB"
database_name = "neft-student-progress"
database_id = "b6de897c-2cde-4f47-9c59-db39844396ea"

[[services]]
binding = "FAMILY_MEETING_EMAIL_SERVICE"
service = "neft-family-meeting-email"

# AI tutor backend (functions/api/tutor). Workers AI needs no external secret, so
# the embedded lesson tutor goes live on deploy. If ANTHROPIC_API_KEY is later set
# as a Pages secret, the tutor function auto-prefers Claude (higher quality) and
# uses this binding only as fallback.
[ai]
binding = "AI"
