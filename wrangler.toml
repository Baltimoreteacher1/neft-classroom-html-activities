name = "neft-classroom-html-activities"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-25"

# Cloudflare Access in front of tenant teacher surfaces (/t/*/teach*).
# Non-secret: the team domain and the Access application's audience tag,
# verified in-app by functions/_lib/access-jwt.js on every teacher call.
[vars]
ACCESS_TEAM_DOMAIN = "flat-haze-aa5c.cloudflareaccess.com"
ACCESS_AUD_TEACH = "f1bc9e3fc91afacb2c4cf84d2c93919ef16b3f3c522d447d0004517c3b2b906a"

# Cloud sync for the Noam School planner (focus-school/ app, functions/api/state.js).
# Optional feature: if this binding is absent the endpoint returns 503 and the
# app stays local-only. KV namespace "noam-school-sync".
[[kv_namespaces]]
binding = "NOAM_SCHOOL_KV"
id = "59075911253f400f807345430425946c"

[[d1_databases]]
binding = "DB"
database_name = "neft-student-progress"
database_id = "b6de897c-2cde-4f47-9c59-db39844396ea"

# Staging tenant progress (Phase 3 milestone 1). The tenant wrapper at
# functions/t/[tenant]/api/progress/ resolves this by name from the registry
# and forwards it as DB — the classroom DB above is never reachable from
# tenant routes. See docs/tenancy-provisioning.md.
[[d1_databases]]
binding = "TENANT_DB_STAGING"
database_name = "tenant-staging-progress"
database_id = "59d0ca08-7f2d-4ee7-802c-521c091b3f5f"

# Lesson plan documents for /curriculum/plan-notes/ (functions/api/plan-notes).
# Teacher-authored and district-authored plan files, keyed by content hash.
#
# KV rather than R2: R2 is not enabled on this account, and the access pattern
# here — write once, read on open, well under the 25 MB value ceiling — is one
# KV serves correctly. Swap to R2 if plans ever outgrow it.
#
# Optional: if this binding is absent, repo-lesson annotation still works and
# document upload is refused with a reason instead of failing silently.
[[kv_namespaces]]
binding = "PLAN_DOCS"
id = "e674aa1d3e9f4c75883d6d72f808557a"

[[services]]
binding = "FAMILY_MEETING_EMAIL_SERVICE"
service = "neft-family-meeting-email"

# AI tutor backend (functions/api/tutor). Workers AI needs no external secret, so
# the embedded lesson tutor goes live on deploy. If ANTHROPIC_API_KEY is later set
# as a Pages secret, the tutor function auto-prefers Claude (higher quality) and
# uses this binding only as fallback.
[ai]
binding = "AI"

# Browser Run, for POST /api/worksheet-pdf — it renders the practice-worksheet
# pack into a real .pdf file so "One PDF" downloads like every other format
# instead of handing the teacher a print dialog. Quick Actions need no API
# token and no puppeteer dependency, only this binding and a compatibility_date
# of 2026-03-24 or later (above).
#
# Optional, like PLAN_DOCS: with the binding absent the endpoint answers 503
# with a reason and the downloader falls back to the in-browser print view.
# To exercise it with `wrangler pages dev`, add `remote = true` here for the
# session — Quick Actions have no local implementation. It is left off in the
# committed config so a local dev server never spends live Browser Run quota.
[browser]
binding = "BROWSER"
