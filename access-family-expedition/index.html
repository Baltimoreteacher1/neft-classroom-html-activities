<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="A short, bilingual family adventure through the ACCESS Practice Lab. Four stops in any order, about 12 minutes, on any phone, tablet or computer. Aventura familiar bilingüe en inglés y español."
    />
    <meta name="theme-color" content="#173a50" />
    <title>Family Adventure | Aventura familiar</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='11' fill='%23173a50'/%3E%3Cpath d='m18 5 3.5 9.5L31 18l-9.5 3.5L18 31l-3.5-9.5L5 18l9.5-3.5Z' fill='%23ffce5b'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --navy: #173a50;
        --ink: #163247;
        --muted: #496477;
        --line: #c2d2df;
        --paper: #edf5fa;
        --card: #fff;
        --gold: #ffce5b;
        --teal: #006a65;
        --accent: #234cda;
        --tint: #e8efff;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          17px/1.55 "Avenir Next",
          Avenir,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      a {
        color: #1843ba;
        text-underline-offset: 3px;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font:
          500 clamp(32px, 7vw, 56px) / 1.08 Georgia,
          serif;
        letter-spacing: -1px;
        color: var(--navy);
      }
      h2 {
        font-size: clamp(20px, 4.6vw, 24px);
        line-height: 1.3;
        color: var(--navy);
      }
      .es {
        display: block;
        font-weight: 500;
        color: var(--muted);
        margin-top: 2px;
      }
      button,
      .btn {
        font: inherit;
        font-weight: 700;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-height: 52px;
        padding: 11px 18px;
        border-radius: 10px;
        border: 1px solid #8ea7ba;
        background: var(--card);
        color: var(--navy);
        text-decoration: none;
        text-align: center;
        cursor: pointer;
        width: 100%;
        line-height: 1.3;
        touch-action: manipulation;
      }
      button:hover,
      .btn:hover {
        background: #f0f6fb;
        border-color: #5f7f96;
      }
      button .es,
      .btn .es {
        font-weight: 600;
        color: inherit;
        opacity: 0.85;
        margin: 0;
      }
      :focus-visible {
        outline: 3px solid #aa4600;
        outline-offset: 3px;
      }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .primary:hover {
        background: #1738ae;
        border-color: #1738ae;
      }
      .quiet {
        border-color: transparent;
        background: transparent;
        text-decoration: underline;
        text-underline-offset: 4px;
        font-weight: 600;
        min-height: 48px;
        width: auto;
        padding-inline: 8px;
      }
      .skip {
        position: absolute;
        top: -90px;
        background: #fff;
        padding: 12px;
        z-index: 30;
      }
      .skip:focus {
        top: 8px;
      }
      header,
      main,
      footer {
        max-width: 1040px;
        margin: auto;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px 14px;
        padding: 14px 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        color: var(--navy);
        font-size: 18px;
        text-decoration: none;
      }
      .brand svg {
        flex: none;
      }
      .brand small {
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        border-left: 1px solid #b7cad7;
        padding-left: 12px;
      }
      .head-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .head-actions button {
        width: auto;
        min-height: 48px;
        padding: 8px 14px;
        font-size: 15px;
        flex-direction: row;
      }
      .lang {
        display: flex;
        border: 1px solid #8ea7ba;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
      }
      .lang button {
        border: 0;
        border-radius: 0;
        font-size: 15px;
        background: #fff;
      }
      .lang button[aria-pressed="true"] {
        background: var(--navy);
        color: #fff;
      }
      main {
        padding: 6px 16px 36px;
        outline: none;
      }
      .tag,
      .pill {
        display: inline-block;
        justify-self: start;
        padding: 6px 13px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 750;
        line-height: 1.4;
      }
      .tag {
        background: #fff7dc;
        border: 1px solid #e1c477;
        color: #5c4300;
      }
      .pill {
        background: var(--tint);
        color: var(--accent);
      }
      .lead {
        font-size: 20px;
        line-height: 1.5;
      }
      .note {
        font-size: 15px;
        color: var(--muted);
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .row {
        display: grid;
        gap: 12px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* welcome */
      .welcome {
        display: grid;
        border: 1px solid #ccdae5;
        border-radius: 22px;
        overflow: hidden;
        background: #fff;
      }
      .welcome-copy {
        padding: 28px 22px;
      }
      .welcome-visual {
        display: none;
        background: #dfeff5;
        padding: 38px 30px;
        align-content: center;
      }
      .postcard {
        background: #fff;
        border: 1px solid #a8c0ce;
        border-radius: 14px;
        padding: 25px 24px;
        box-shadow: 9px 10px 0 #c0dae7;
        transform: rotate(3deg);
      }
      .postcard h2 {
        font:
          500 29px/1.15 Georgia,
          serif;
      }
      .icon-row {
        display: flex;
        justify-content: space-between;
        margin: 20px 0;
        color: var(--teal);
      }
      .icon-row svg {
        width: 37px;
        height: 37px;
      }
      .grades {
        display: grid;
        gap: 12px;
      }
      .grade {
        align-items: flex-start;
        text-align: left;
        padding: 16px 18px;
        min-height: 88px;
        border-radius: 12px;
      }
      .grade strong {
        font-size: 21px;
      }
      .grade[aria-pressed="true"] {
        border: 2px solid var(--teal);
        background: #eaf6f2;
      }
      .grade[aria-pressed="true"] strong::after {
        content: " ✓";
      }
      .brief {
        display: grid;
        gap: 16px;
        margin: 22px 6px 0;
      }
      .brief .n {
        display: block;
        font-size: 14px;
        font-weight: 750;
        color: var(--accent);
      }
      .brief h2 {
        font-size: 18px;
      }
      .brief p {
        font-size: 15px;
      }

      /* map */
      .hub-head {
        display: grid;
        gap: 10px;
        margin: 12px 4px 18px;
      }
      .hub-head p {
        font-size: 18px;
      }
      progress {
        width: 100%;
        height: 10px;
        accent-color: var(--teal);
      }
      .progress-line {
        font-weight: 750;
      }
      .hub-layout {
        display: grid;
        gap: 18px;
        grid-template-areas: "next" "map" "ticket";
      }
      .next-card {
        grid-area: next;
      }
      .worldmap {
        grid-area: map;
      }
      .ticket {
        grid-area: ticket;
      }
      .railcard {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
      }
      .next-card {
        border-top: 5px solid var(--gold);
      }
      .ticket {
        border-top: 5px solid var(--teal);
      }
      .visit-list {
        list-style: none;
        padding: 0;
        margin: 6px 0 12px;
      }
      .visit-list li {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 16px;
        padding: 6px 0;
      }
      .checkdot {
        display: grid;
        place-items: center;
        min-width: 24px;
        height: 24px;
        border: 1px solid #9db4c2;
        border-radius: 50%;
        font-size: 13px;
      }
      .checkdot.done {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }
      .worldmap {
        position: relative;
        border: 1px solid #bad1dd;
        border-radius: 20px;
        background: #e2f0f3;
        padding: 18px 14px 20px;
        display: grid;
        gap: 14px;
        overflow: hidden;
      }
      .terrain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.7;
      }
      .map-label {
        position: relative;
        font-size: 13px;
        color: #3d6372;
        font-weight: 700;
      }
      .portals {
        position: relative;
        display: grid;
        gap: 14px;
      }
      .portal {
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr);
        column-gap: 12px;
        align-items: center;
        text-align: left;
        padding: 16px 16px 12px;
        min-height: 112px;
        border: 1px solid #a7becb;
        border-bottom: 5px solid var(--accent);
        border-radius: 13px;
        box-shadow: 0 5px 0 #b8d1de;
      }
      .portal:hover {
        background: #fff;
        box-shadow: 0 7px 0 #b8d1de;
      }
      .portal .icon {
        grid-row: 1 / 3;
        width: 46px;
        height: 46px;
        padding: 10px;
        border-radius: 10px;
        background: var(--tint);
        color: var(--accent);
      }
      .portal .icon svg {
        width: 100%;
        height: 100%;
      }
      .portal .name {
        font-size: 19px;
        font-weight: 800;
        display: block;
        text-align: left;
      }
      .portal .place {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        display: block;
        text-align: left;
      }
      .portal .badge {
        grid-column: 1 / -1;
        margin-top: 8px;
        font-size: 13px;
        color: var(--accent);
        font-weight: 750;
        display: block;
        text-align: left;
      }
      .portal.next {
        border: 2px solid var(--accent);
        border-bottom-width: 5px;
        background: var(--tint);
      }
      .portal.visited .badge {
        color: #006449;
      }

      /* stop */
      .return-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 10px 0 14px;
      }
      .screen {
        background: #fff;
        border: 1px solid #ccdbe4;
        border-radius: 20px;
        overflow: hidden;
      }
      .destination-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        background: var(--tint);
        padding: 22px 20px;
        border-bottom: 1px solid #d1dfe7;
      }
      .destination-top h1 {
        font-size: clamp(30px, 7vw, 48px);
        margin-top: 10px;
      }
      .large-icon {
        width: 76px;
        height: 76px;
        padding: 16px;
        color: var(--accent);
        border: 2px solid currentColor;
        border-radius: 50%;
        transform: rotate(-7deg);
      }
      .large-icon svg {
        width: 100%;
        height: 100%;
      }
      .destination-body {
        padding: 20px;
        display: grid;
        gap: 18px;
      }
      .mini-map {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .mini-map button {
        display: grid;
        justify-items: center;
        gap: 4px;
        min-height: 68px;
        padding: 8px 2px;
        font-size: 13px;
        border-radius: 10px;
      }
      .mini-map svg {
        width: 24px;
        height: 24px;
        color: var(--accent);
      }
      .mini-map button[aria-current="page"] {
        border: 2px solid var(--accent);
        background: var(--tint);
      }
      .mini-map button.visited::after {
        content: "✓";
        font-size: 12px;
        color: var(--teal);
        line-height: 1;
      }
      .steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 14px;
        counter-reset: s;
      }
      .steps li {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        counter-increment: s;
      }
      .steps li::before {
        content: counter(s);
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-weight: 800;
        font-size: 15px;
        display: grid;
        place-items: center;
        margin-top: 1px;
      }
      .playcard {
        border: 1px solid #b8cdd8;
        border-radius: 13px;
        padding: 20px;
        background: #f8fbfd;
        display: grid;
        gap: 16px;
      }
      .ask {
        background: #fff6de;
        border: 1px solid #ddc98c;
        border-radius: 12px;
        padding: 14px 16px;
      }
      .ask strong {
        color: #6b4a00;
      }
      .stop-actions {
        display: grid;
        gap: 10px;
        border-top: 1px solid #ccdae4;
        padding-top: 18px;
      }
      .stop-actions .primary {
        background: var(--accent);
        border-color: var(--accent);
      }
      .collected {
        background: #e5f6ed;
        border: 1px solid #afd1be;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        color: #064a35;
      }

      /* end */
      .outro {
        background: #fff;
        border: 1px solid #c2d4df;
        border-radius: 20px;
        padding: 26px 20px;
      }
      .stars {
        font-size: 34px;
        letter-spacing: 6px;
        color: #8a5f00;
        text-align: center;
      }
      .souvenirs {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }
      .souvenir {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        background: var(--tint);
        color: var(--accent);
        border: 1px solid #c2d2df;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 700;
      }
      .souvenir svg {
        width: 20px;
        height: 20px;
      }
      .confirm {
        max-width: 1008px;
        margin: 0 auto 14px;
        padding: 16px;
        background: #fff6de;
        border: 1px solid #ddc98c;
        border-radius: 12px;
      }
      .confirm .row {
        margin-top: 12px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        background: var(--navy);
        color: #fff;
        border: 2px solid var(--gold);
        padding: 12px 22px;
        border-radius: 30px;
        font-size: 16px;
        max-width: 92%;
        text-align: center;
        z-index: 5;
      }
      footer {
        padding: 0 16px 30px;
        color: var(--muted);
        font-size: 14px;
      }
      [hidden] {
        display: none !important;
      }
      @media (min-width: 640px) {
        .grades,
        .row.two,
        .brief,
        .portals {
          grid-template-columns: 1fr 1fr;
        }
        .brief {
          grid-template-columns: repeat(3, 1fr);
        }
        .portals .portal:nth-child(even) {
          margin-top: 26px;
        }
        .destination-top,
        .destination-body,
        .outro {
          padding-inline: 32px;
        }
        .stop-actions {
          grid-template-columns: auto 1fr;
          align-items: center;
        }
        .large-icon {
          width: 110px;
          height: 110px;
          padding: 24px;
        }
      }
      @media (min-width: 900px) {
        header,
        main,
        footer {
          padding-inline: 28px;
        }
        .welcome {
          grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
        }
        .welcome-copy {
          padding: 42px 44px;
        }
        .welcome-visual {
          display: grid;
        }
        .hub-layout {
          grid-template-columns: minmax(0, 1fr) 290px;
          grid-template-areas: "map next" "map ticket";
          align-items: start;
        }
        .worldmap {
          padding: 26px 24px 30px;
        }
      }
      @media (max-width: 520px) {
        .brand small {
          display: none;
        }
        .head-actions {
          width: 100%;
        }
        .lang {
          flex: 1 1 100%;
        }
        .head-actions > button {
          flex: 1;
        }
        .lang button {
          flex: 1;
          padding-inline: 6px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        main > * {
          animation: rise 0.25s ease-out;
        }
        .portal {
          transition:
            transform 0.15s,
            box-shadow 0.15s;
        }
        .portal:hover {
          transform: translateY(-2px);
        }
        @keyframes rise {
          from {
            opacity: 0;
            transform: translateY(6px);
          }
          to {
            opacity: 1;
            transform: none;
          }
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#content">Skip to the adventure · Saltar a la aventura</a>
    <header>
      <a class="brand" href="/access-practice-lab/family"
        ><svg aria-hidden="true" width="34" height="34" viewBox="0 0 36 36">
          <rect width="36" height="36" rx="11" fill="#173a50" />
          <path d="m18 5 3.5 9.5L31 18l-9.5 3.5L18 31l-3.5-9.5L5 18l9.5-3.5Z" fill="#ffce5b" /></svg
        ><span>EduWonderLab <small id="brandSub"></small></span
      ></a>
      <nav class="head-actions" aria-label="Adventure / Aventura">
        <div class="lang" role="group" aria-label="Language / Idioma" id="lang"></div>
        <button type="button" id="mapBtn" hidden></button>
        <button type="button" id="resetBtn" hidden></button>
      </nav>
    </header>
    <div id="resetBar" class="confirm" role="alertdialog" aria-labelledby="resetMsg" hidden></div>
    <main id="content" tabindex="-1"></main>
    <footer id="foot"></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      ><p style="padding: 16px">
        Turn on JavaScript to use the Family Adventure, or go to the
        <a href="/access-practice-lab/family">Family Corner</a>. · Active JavaScript para usar la
        Aventura familiar, o vaya al <a href="/access-practice-lab/family">Rincón de la familia</a>.
      </p></noscript
    >
    <script>
      (() => {
        "use strict";
        const KEY = "ewl-family-adventure-v1";
        const LAB_PREFS = "accessPracticeLab:v1:prefs";
        const LAB = "/access-practice-lab";
        const MODES = ["en", "es", "bi"];
        const BANDS = ["3-5", "6-8"];

        const ICONS = {
          listening:
            '<path d="M5 14v-4a7 7 0 0 1 14 0v4M5 11H3v7h4v-7Zm14 0h2v7h-4v-7ZM9 11v5m3-7v9m3-7v5"/>',
          reading:
            '<path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1Zm0 0v15M5 8h4m-4 4h4m6-4h4m-4 4h4"/>',
          speaking:
            '<path d="M14 16H8l-5 4v-6a7 7 0 0 1-1-4 7 7 0 0 1 7-7h4a7 7 0 0 1 7 7c0 3-2 5-6 6Z"/><path d="m17 16 4 4v-7M7 9h8M7 12h5"/>',
          writing: '<path d="m4 16-1 5 5-1L21 7l-4-4L4 16Zm0 0 4 4M14 6l4 4"/>',
          compass: '<circle cx="12" cy="12" r="10"/><path d="m16 8-3 5-5 3 3-5 5-3Z"/>',
        };
        const svg = (id) =>
          `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</svg>`;

        // One table: the four stops, their colors, the real lab activity per grade band, and the copy.
        // Spanish addresses the family as "ustedes" (adult and child together), matching the lab's family pages.
        const STOPS = [
          {
            id: "listening",
            color: "#234cda",
            tint: "#e9efff",
            path: {
              "3-5": "Listening/A/g35-l-a-classroom-place",
              "6-8": "Listening/A/classroom-directions",
            },
            name: ["Listen", "Escuchar"],
            place: ["Signal Station", "Estación de señales"],
            title: ["Hear it. Then do it.", "Escúchenlo. Luego háganlo."],
            steps: [
              [
                "Press the play button and listen for what to do.",
                "Toquen el botón de reproducir y escuchen qué hay que hacer.",
              ],
              [
                "Pick the answer you think is right. You can listen again.",
                "Elijan la respuesta que crean correcta. Pueden escuchar otra vez.",
              ],
              ["Check your answer.", "Revisen su respuesta."],
            ],
            ask: [
              "What did you hear first? Say it in any language you like.",
              "¿Qué oyeron primero? Díganlo en el idioma que quieran.",
            ],
          },
          {
            id: "reading",
            color: "#006c60",
            tint: "#e4f4ec",
            path: { "3-5": "Reading/A/g35-r-a-library", "6-8": "Reading/A/read-main-idea" },
            name: ["Read", "Leer"],
            place: ["Evidence City", "Ciudad de evidencias"],
            title: ["Find the clue.", "Encuentren la pista."],
            steps: [
              [
                "Read the short text together. Take turns if you like.",
                "Lean juntos el texto corto. Pueden turnarse.",
              ],
              [
                "Choose the answer that matches the text.",
                "Elijan la respuesta que coincida con el texto.",
              ],
              [
                "Check your answer. Read the feedback.",
                "Revisen su respuesta. Lean los comentarios.",
              ],
            ],
            ask: [
              "Where in the text did you find the answer?",
              "¿En qué parte del texto encontraron la respuesta?",
            ],
          },
          {
            id: "speaking",
            color: "#9a5700",
            tint: "#fff3d5",
            path: {
              "3-5": "Speaking/A/g35-s-a-playground",
              "6-8": "Speaking/A/sv5-describe-lunch-tray",
            },
            name: ["Speak", "Hablar"],
            place: ["Conversation Quest", "Misión de conversación"],
            title: ["Say it out loud.", "Díganlo en voz alta."],
            steps: [
              ["Look at the picture and read the prompt.", "Miren la imagen y lean la indicación."],
              [
                "Say one sentence in English. It is okay to start in your home language first.",
                "Digan una oración en inglés. Pueden empezar en su idioma si quieren.",
              ],
              ["Say it again, a little more slowly.", "Díganla otra vez, un poco más despacio."],
            ],
            ask: ["Can you say it a second way?", "¿Pueden decirlo de otra manera?"],
          },
          {
            id: "writing",
            color: "#b13f31",
            tint: "#ffebe6",
            path: { "3-5": "Writing/A/g35-w-a-class-pet", "6-8": "Writing/A/write-complete-frame" },
            name: ["Write", "Escribir"],
            place: ["StoryWorks", "Taller de cuentos"],
            title: ["Finish the sentence.", "Terminen la oración."],
            steps: [
              ["Read the sentence starter.", "Lean el comienzo de la oración."],
              [
                "Add your own idea. A short sentence is great.",
                "Agreguen su propia idea. Una oración corta está muy bien.",
              ],
              [
                "Read your sentence out loud to each other.",
                "Lean su oración en voz alta el uno al otro.",
              ],
            ],
            ask: ["Which word did you choose, and why?", "¿Qué palabra eligieron y por qué?"],
          },
        ];
        const TOTAL = STOPS.length;

        const COPY = {
          sub: ["Family adventure", "Aventura familiar"],
          tagline: [
            "A short adventure for the whole family",
            "Una aventura corta para toda la familia",
          ],
          welcomeTitle: ["Family Adventure", "Aventura familiar"],
          welcomeLead: [
            `Four short stops, in any order. About ${TOTAL * 3} minutes. Try English practice together on a phone, tablet or computer.`,
            `Cuatro paradas cortas, en el orden que quieran. Unos ${TOTAL * 3} minutos. Practiquen inglés juntos en un teléfono, una tableta o una computadora.`,
          ],
          pickGrade: [
            "Tap your child’s grade to begin.",
            "Toquen el grado de su hijo o hija para empezar.",
          ],
          g35: ["Grades 3–5", "Grados 3–5"],
          g35s: ["Elementary school", "Primaria"],
          g68: ["Grades 6–8", "Grados 6–8"],
          g68s: ["Middle school", "Secundaria"],
          saved: [
            "No account. Your place is saved on this device only.",
            "Sin cuenta. Su avance se guarda solo en este dispositivo.",
          ],
          practiceNote: [
            "The practice is in English. These pages help in your language.",
            "La práctica es en inglés. Estas páginas ayudan en su idioma.",
          ],
          postcardTitle: ["Four stops.\nYour route.", "Cuatro paradas.\nSu ruta."],
          postcardLine: [
            "Listen. Read. Speak. Write.\nTogether.",
            "Escuchar. Leer. Hablar. Escribir.\nJuntos.",
          ],
          brief: [
            [
              "01 · Pick a stop",
              "Escojan una parada",
              "Go in any order. The map keeps your place.",
              "Vayan en el orden que quieran. El mapa guarda su avance.",
            ],
            [
              "02 · Try it together",
              "Inténtenlo juntos",
              "Each stop opens a real activity. Three short steps.",
              "Cada parada abre una actividad real. Tres pasos cortos.",
            ],
            [
              "03 · Tap “We did it!”",
              "Toquen “¡Lo hicimos!”",
              "Come back, earn a star, and head to the next stop.",
              "Regresen, ganen una estrella y sigan a la próxima parada.",
            ],
          ],
          mapTitle: ["Pick your next stop", "Escojan su próxima parada"],
          mapLead: [
            "Four stops. Any order. About 3 minutes each.",
            "Cuatro paradas. En cualquier orden. Unos 3 minutos cada una.",
          ],
          progress: (n) => [`${n} of ${TOTAL} stops done`, `${n} de ${TOTAL} paradas hechas`],
          nextTitle: ["Up next", "Sigue"],
          startStop: (name) => [`Start with ${name[0]}`, `Empezar con ${name[1]}`],
          nextStop: (name) => [`Next stop: ${name[0]}`, `Próxima parada: ${name[1]}`],
          seeStars: ["See our stars", "Ver nuestras estrellas"],
          nextHelp: [
            "Not sure where to start? Tap the big button. Or pick any door on the map.",
            "¿No saben por dónde empezar? Toquen el botón grande. O escojan cualquier puerta del mapa.",
          ],
          mapLabel: [
            "Adventure map · every door is open",
            "Mapa de la aventura · todas las puertas están abiertas",
          ],
          ticketTitle: ["Our trip", "Nuestro viaje"],
          startHere: ["Start here", "Empiecen aquí"],
          upNext: ["Up next", "Sigue"],
          doneOpen: ["✓ Done · open again", "✓ Hecho · abrir otra vez"],
          openStop: ["Open this stop", "Abrir esta parada"],
          changeGrade: ["Change grade", "Cambiar de grado"],
          stopOf: (n) => [`Stop ${n} of ${TOTAL}`, `Parada ${n} de ${TOTAL}`],
          about: ["About 3 minutes", "Unos 3 minutos"],
          open: ["Open the activity", "Abrir la actividad"],
          newTab: [
            "Opens in a new tab. When you finish, come back to this tab and tap “We did it!”",
            "Se abre en otra pestaña. Cuando terminen, regresen a esta pestaña y toquen “¡Lo hicimos!”",
          ],
          newTabSr: [" (opens in a new tab)", " (se abre en otra pestaña)"],
          where: ["Where to next?", "¿A dónde ahora?"],
          didNext: (name) => [`We did it! Next: ${name[0]}`, `¡Lo hicimos! Sigue: ${name[1]}`],
          didLast: ["We did it! See our stars", "¡Lo hicimos! Ver nuestras estrellas"],
          doneHere: ["This stop is on your map. ★", "Esta parada ya está en su mapa. ★"],
          backMap: ["‹ Back to map", "‹ Volver al mapa"],
          mapBtn: ["Map", "Mapa"],
          askTitle: ["Talk about it together", "Conversen juntos"],
          toastDone: ["Star earned!", "¡Estrella ganada!"],
          endTitle: ["You finished the adventure!", "¡Terminaron la aventura!"],
          endLead: [
            "Every stop counts, even a short one. Come back any day.",
            "Cada parada cuenta, aunque sea corta. Vuelvan cualquier día.",
          ],
          nextSteps: ["Keep going", "Sigan adelante"],
          corner: ["Family Corner", "Rincón de la familia"],
          cornerHelp: ["A practice plan and tips", "Un plan de práctica y consejos"],
          helpMe: ["Help My Child", "Ayuda para mi hijo o hija"],
          helpMeHelp: ["How to help without giving the answer", "Cómo ayudar sin dar la respuesta"],
          trip: ["Family Trip", "Viaje familiar"],
          tripHelp: [
            "A longer practice for the weekend",
            "Una práctica más larga para el fin de semana",
          ],
          tour: ["Family Expedition", "Expedición familiar"],
          tourHelp: [
            "A guided tour of every part of the site",
            "Un recorrido guiado por cada parte del sitio",
          ],
          again: ["Do the adventure again", "Hacer la aventura otra vez"],
          start: ["Start over", "Empezar de nuevo"],
          startQ: ["Start over from the beginning?", "¿Empezar de nuevo desde el principio?"],
          startQd: [
            "This clears your grade and your stars on this page. Your lab practice stays saved.",
            "Esto borra su grado y sus estrellas en esta página. Su práctica en el laboratorio se conserva.",
          ],
          yesStart: ["Yes, start over", "Sí, empezar de nuevo"],
          keep: ["Keep my place", "Conservar mi avance"],
          fresh: [
            "Fresh start. Pick a grade to begin.",
            "Comienzo nuevo. Elijan un grado para empezar.",
          ],
          foot: [
            "A family companion to the ACCESS Practice Lab by EduWonderLab. No names or emails are collected here.",
            "Un complemento familiar del Laboratorio de práctica ACCESS de EduWonderLab. Aquí no se recopilan nombres ni correos.",
          ],
          labLink: ["ACCESS Lab", "Laboratorio ACCESS"],
        };

        const fresh = () => ({ lang: "", band: "", stop: 0, done: [], view: "welcome" });
        let state = fresh(),
          toastTimer;
        const $ = (id) => document.getElementById(id);
        const esc = (v) =>
          String(v ?? "").replace(
            /[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
          );

        // Language: one decision point. 'en' English only, 'es' Spanish only, 'bi' English with Spanish beneath.
        const mode = () => (MODES.includes(state.lang) ? state.lang : "en");
        const lines = (v) => esc(v).replace(/\n/g, "<br>");
        const T = (pair) => {
          const [e, s] = pair;
          const m = mode();
          return m === "en"
            ? lines(e)
            : m === "es"
              ? lines(s)
              : `${lines(e)}<span class="es" lang="es">${lines(s)}</span>`;
        };
        const S = (pair) => {
          const [e, s] = pair;
          const m = mode();
          return m === "en" ? e : m === "es" ? s : `${e} / ${s}`;
        };

        function readLabPrefs() {
          try {
            return JSON.parse(localStorage.getItem(LAB_PREFS) || "{}") || {};
          } catch {
            return {};
          }
        }
        function shareLangWithLab() {
          // The lab reads the same preference, so a family only chooses a language once.
          try {
            const p = readLabPrefs();
            localStorage.setItem(
              LAB_PREFS,
              JSON.stringify({ ...p, lang: mode(), langChosen: true }),
            );
          } catch {}
        }
        function restore() {
          let raw = null;
          try {
            raw = JSON.parse(localStorage.getItem(KEY) || "null");
          } catch {}
          const lab = readLabPrefs();
          const navEs = /^es\b/i.test(navigator.language || "");
          state.lang = MODES.includes(raw?.lang)
            ? raw.lang
            : lab.langChosen && MODES.includes(lab.lang)
              ? lab.lang
              : navEs
                ? "es"
                : "en";
          if (!raw || !BANDS.includes(raw.band)) return;
          state.band = raw.band;
          state.done = Array.isArray(raw.done)
            ? [...new Set(raw.done.filter((i) => Number.isInteger(i) && i >= 0 && i < TOTAL))]
            : [];
          state.stop =
            Number.isInteger(raw.stop) && raw.stop >= 0 && raw.stop < TOTAL ? raw.stop : 0;
          state.view = ["map", "stop", "end"].includes(raw.view) ? raw.view : "map";
        }
        function save() {
          try {
            localStorage.setItem(KEY, JSON.stringify(state));
          } catch {}
        }

        const labHref = (path) => `${LAB}/${path}?grades=${state.band || "3-5"}`;
        const theme = (s) => `--accent:${s.color};--tint:${s.tint}`;
        const isDone = (i) => state.done.includes(i);
        // The stop to suggest: the first one not done, searching on from the stop the family is on.
        function nextIdx() {
          const start = isDone(state.stop) ? state.stop + 1 : state.stop;
          for (let k = 0; k < TOTAL; k++) {
            const i = (start + k) % TOTAL;
            if (!isDone(i)) return i;
          }
          return -1;
        }
        // The stop after the current one: the first one not done, wrapping, never the current stop.
        function following() {
          for (let k = 1; k < TOTAL; k++) {
            const i = (state.stop + k) % TOTAL;
            if (!isDone(i)) return i;
          }
          return -1;
        }
        const gradeLabel = () => (state.band === "6-8" ? COPY.g68 : COPY.g35);

        function welcome() {
          const grade = (band, title, sub) =>
            `<button type="button" class="grade" data-band="${band}" aria-pressed="${state.band === band}"><strong>${T(title)}</strong><span>${T(sub)}</span></button>`;
          return `<section class="welcome"><div class="welcome-copy stack"><span class="tag">${esc(S(COPY.tagline))}</span>
  <h1>${T(COPY.welcomeTitle)}</h1><p class="lead">${T(COPY.welcomeLead)}</p>
  <h2>${T(COPY.pickGrade)}</h2>
  <div class="grades">${grade("3-5", COPY.g35, COPY.g35s)}${grade("6-8", COPY.g68, COPY.g68s)}</div>
  <p class="note">${T(COPY.practiceNote)}</p><p class="note">${T(COPY.saved)}</p></div>
  <div class="welcome-visual" aria-hidden="true"><div class="postcard"><span class="note">${esc(S(COPY.sub))}</span><h2>${T(COPY.postcardTitle)}</h2><div class="icon-row">${STOPS.map((s) => svg(s.id)).join("")}</div><p class="note">${T(COPY.postcardLine)}</p></div></div></section>
  <section class="brief" aria-label="${esc(S(COPY.sub))}">${COPY.brief.map(([n, nEs, t, tEs]) => `<div><span class="n">${T([n, nEs])}</span><p>${T([t, tEs])}</p></div>`).join("")}</section>`;
        }

        function terrain() {
          return `<svg class="terrain" viewBox="0 0 900 650" preserveAspectRatio="none" aria-hidden="true"><g stroke="#c0dde2" fill="none"><path d="M-40 80Q170-10 320 120T940 90M-40 170Q170 80 320 210T940 180M-40 260Q170 170 320 300T940 270M-40 350Q170 260 320 390T940 360M-40 440Q170 350 320 480T940 450M-40 530Q170 440 320 570T940 540"/></g><path d="M220 135C395 10 735 125 670 200S120 220 220 295 760 265 670 365 120 390 220 465 760 440 670 530" fill="none" stroke="#729aaf" stroke-width="3" stroke-dasharray="6 9"/></svg>`;
        }
        function portal(s, i) {
          const done = isDone(i),
            next = i === nextIdx();
          const badge = done
            ? COPY.doneOpen
            : next
              ? state.done.length
                ? COPY.upNext
                : COPY.startHere
              : COPY.openStop;
          return `<button type="button" class="portal ${done ? "visited" : ""} ${next ? "next" : ""}" style="${theme(s)}" data-stop="${i}"><span class="icon">${svg(s.id)}</span><span class="name">${T(s.name)}</span><span class="place">${T(s.place)}</span><span class="badge">${T(badge)}</span></button>`;
        }
        function visitList() {
          return `<ul class="visit-list">${STOPS.map((s, i) => `<li><span class="checkdot ${isDone(i) ? "done" : ""}" aria-hidden="true">${isDone(i) ? "✓" : "·"}</span>${T(s.name)}</li>`).join("")}</ul>`;
        }
        function map() {
          const n = state.done.length,
            nx = nextIdx();
          const go =
            nx < 0
              ? `<button type="button" class="primary" data-view="end">${T(COPY.seeStars)}</button>`
              : `<button type="button" class="primary" data-stop="${nx}">${T((n ? COPY.nextStop : COPY.startStop)(STOPS[nx].name))}</button>`;
          return `<div class="hub-head"><span class="tag">${esc(S(gradeLabel()))}</span><h1>${T(COPY.mapTitle)}</h1><p>${T(COPY.mapLead)}</p>
  <div><div class="progress-line">${T(COPY.progress(n))}</div><progress max="${TOTAL}" value="${n}" aria-label="${esc(S(COPY.progress(n)))}"></progress></div></div>
  <div class="hub-layout">
  <section class="railcard next-card"><h2>${T(COPY.nextTitle)}</h2><div class="stack"><p class="note">${T(COPY.nextHelp)}</p>${go}</div></section>
  <section class="worldmap" aria-label="${esc(S(COPY.mapLabel))}">${terrain()}<div class="map-label">${esc(S(COPY.mapLabel))}</div><div class="portals">${STOPS.map(portal).join("")}</div></section>
  <section class="railcard ticket"><h2>${T(COPY.ticketTitle)}</h2>${visitList()}<button type="button" class="quiet" data-view="welcome">${T(COPY.changeGrade)}</button></section></div>`;
        }

        function miniMap(current) {
          return `<nav class="mini-map" aria-label="${esc(S(COPY.where))}">${STOPS.map((s, i) => `<button type="button" style="${theme(s)}" class="${isDone(i) ? "visited" : ""}" data-stop="${i}" ${i === current ? 'aria-current="page"' : ""}>${svg(s.id)}${T(s.name)}</button>`).join("")}</nav>`;
        }
        function stop() {
          const s = STOPS[state.stop],
            done = isDone(state.stop);
          const nx = following();
          const doneLabel = nx < 0 ? COPY.didLast : COPY.didNext(STOPS[nx].name);
          return `<div class="return-line"><button type="button" class="quiet" data-view="map">${T(COPY.backMap)}</button><span class="tag">${esc(S(COPY.stopOf(state.stop + 1)))} · ${esc(S(COPY.about))}</span></div>
  <article class="screen" style="${theme(s)}"><header class="destination-top"><div><span class="pill">${esc(S(s.name))} · ${esc(S(s.place))}</span><h1 id="stopTitle">${T(s.title)}</h1></div><div class="large-icon">${svg(s.id)}</div></header>
  <div class="destination-body">${miniMap(state.stop)}
  <section class="playcard"><ol class="steps">${s.steps.map(([e, es]) => `<li><span>${T([e, es])}</span></li>`).join("")}</ol>
  <a class="btn primary" href="${labHref(s.path[state.band])}" target="_blank" rel="noopener noreferrer">${T(COPY.open)}<span class="sr">${esc(S(COPY.newTabSr))}</span></a>
  <p class="note">${T(COPY.newTab)}</p></section>
  <div class="ask"><strong>${T(COPY.askTitle)}</strong><p>${T(s.ask)}</p></div>
  ${done ? `<p class="collected">${T(COPY.doneHere)}</p>` : ""}
  <div class="stop-actions"><button type="button" class="quiet" data-view="map">${T(COPY.backMap)}</button><button type="button" class="primary" data-done>${T(doneLabel)}</button></div></div></article>`;
        }
        function end() {
          const n = state.done.length;
          const link = (href, title, help) =>
            `<a class="btn" href="${href}">${T(title)}<span class="note">${T(help)}</span></a>`;
          return `<section class="outro stack"><div class="stars" role="img" aria-label="${n} / ${TOTAL}">${STOPS.map((_, i) => (isDone(i) ? "★" : "☆")).join("")}</div>
  <h1>${T(COPY.endTitle)}</h1><p class="lead">${T(COPY.endLead)}</p>
  <div class="souvenirs">${STOPS.map((s, i) => (isDone(i) ? `<span class="souvenir" style="${theme(s)}">${svg(s.id)}${T(s.name)}</span>` : "")).join("")}</div>
  <h2>${T(COPY.nextSteps)}</h2>
  <div class="row">${link(`${LAB}/family?grades=${state.band}`, COPY.corner, COPY.cornerHelp)}${link(`${LAB}/family/help?grades=${state.band}`, COPY.helpMe, COPY.helpMeHelp)}${link(`${LAB}/family/trip?grades=${state.band}`, COPY.trip, COPY.tripHelp)}${link("/access-family-tour/", COPY.tour, COPY.tourHelp)}</div>
  <div class="row two"><button type="button" data-view="map">${T(COPY.backMap)}</button><button type="button" data-restart-run>${T(COPY.again)}</button></div></section>`;
        }

        function chrome() {
          const labels = { en: "English", es: "Español", bi: "EN + ES" };
          $("lang").innerHTML = MODES.map(
            (m) =>
              `<button type="button" data-lang="${m}" aria-pressed="${mode() === m}" ${m === "es" ? 'lang="es"' : ""}>${labels[m]}</button>`,
          ).join("");
          const started = !!state.band;
          $("mapBtn").hidden = !started || state.view === "map";
          $("mapBtn").textContent = S(COPY.mapBtn);
          $("resetBtn").hidden = !started;
          $("resetBtn").textContent = S(COPY.start);
          $("brandSub").textContent = S(COPY.sub);
          $("resetBar").innerHTML =
            `<p id="resetMsg"><strong>${T(COPY.startQ)}</strong><br>${T(COPY.startQd)}</p><div class="row two"><button type="button" class="primary" data-reset>${T(COPY.yesStart)}</button><button type="button" data-reset-cancel>${T(COPY.keep)}</button></div>`;
          $("foot").innerHTML =
            `<p>${T(COPY.foot)}</p><p><a href="${LAB}/">${esc(S(COPY.labLink))}</a></p>`;
          document.documentElement.lang = mode() === "es" ? "es" : "en";
          document.title = S(["Family Adventure", "Aventura familiar"]) + " | EduWonderLab";
        }
        function render(focus = true) {
          if (!state.band) state.view = "welcome";
          const views = { welcome, map, stop, end };
          $("content").innerHTML = (views[state.view] || map)();
          chrome();
          save();
          if (focus) {
            $("content").focus({ preventScroll: true });
            window.scrollTo(0, 0);
          }
        }
        function toast(pair) {
          clearTimeout(toastTimer);
          $("toast").textContent = S(pair);
          $("toast").hidden = false;
          toastTimer = setTimeout(() => {
            $("toast").hidden = true;
          }, 2600);
        }
        function finishStop() {
          const first = !isDone(state.stop);
          if (first) {
            state.done.push(state.stop);
            toast(COPY.toastDone);
          }
          const nx = nextIdx();
          if (nx < 0) {
            state.view = "end";
          } else {
            state.stop = nx;
            state.view = "stop";
          }
          render();
        }

        document.addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          if (b.dataset.lang) {
            state.lang = b.dataset.lang;
            shareLangWithLab();
            render(false);
            $("lang").querySelector(`[data-lang="${state.lang}"]`)?.focus();
            return;
          }
          if (b.dataset.band) {
            state.band = b.dataset.band;
            state.view = "map";
            render();
            return;
          }
          if (b.dataset.stop !== undefined) {
            state.stop = Number(b.dataset.stop);
            state.view = "stop";
            render();
            return;
          }
          if (b.dataset.view) {
            state.view = b.dataset.view;
            render();
            return;
          }
          if ("done" in b.dataset) return finishStop();
          if ("restartRun" in b.dataset) {
            state.view = "map";
            state.stop = 0;
            state.done = [];
            render();
            return;
          }
          if (b.id === "mapBtn") {
            state.view = "map";
            render();
            return;
          }
          if (b.id === "resetBtn") {
            $("resetBar").hidden = false;
            $("resetBar").scrollIntoView({ block: "nearest" });
            $("resetBar").querySelector("[data-reset]").focus({ preventScroll: true });
            return;
          }
          if ("resetCancel" in b.dataset) {
            $("resetBar").hidden = true;
            $("resetBtn").focus();
            return;
          }
          if ("reset" in b.dataset) {
            const lang = state.lang;
            state = fresh();
            state.lang = lang;
            $("resetBar").hidden = true;
            render();
            toast(COPY.fresh);
          }
        });

        restore();
        render(false);
      })();
    </script>
  </body>
</html>
