<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Nightly Hebrew</title>
    <meta
      name="description"
      content="Nightly Hebrew — learn and practice the Hebrew letters and their sounds, one inning at a time."
    />
    <link rel="icon" href="../icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Noto+Sans+Hebrew:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="hebrew.css" />
  </head>
  <body data-unit="5">
    <header class="topbar">
      <div class="inner">
        <span class="ball" aria-hidden="true">⚾</span>
        <span class="inning-chip" id="inning-chip">Inning</span>
        <h1 id="page-title">Nightly Hebrew</h1>
        <span class="scorebug" title="Activities finished tonight"
          ><span aria-hidden="true">📋</span> <span id="scorebug">0/7</span></span
        >
      </div>
      <div class="bar" style="height: 4px; border-radius: 0">
        <span id="topbar-bar" style="width: 0%"></span>
      </div>
    </header>

    <main class="wrap">
      <section class="hero" id="hero"></section>

      <div id="acts"></div>

      <section class="act">
        <header>
          <div class="num">💰</div>
          <div>
            <h3>Payday</h3>
            <p class="how">Finish all seven activities and this inning pays $0.20.</p>
          </div>
        </header>
        <div id="payout" class="payout"></div>
      </section>

      <nav class="footnav" id="footnav" aria-label="Other innings"></nav>
    </main>

    <script src="data.js"></script>
    <script src="engine.js"></script>
    <script src="games/unit-5.js"></script>
    <script>
      HEB.boot();
    </script>
    <script src="/assets/math-workbench-launcher.js" defer></script>
  <script src="/assets/formula-popup.js" defer></script>
</body>
</html>
