<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Nightly Hebrew</title>
    <meta
      name="description"
      content="Nightly Hebrew — learn and practice the Hebrew letters and their sounds, one inning at a time."
    />
    <link rel="icon" href="../icons/favicon.svg" />
    <link
      href="/assets/fonts/frank-ruhl-libre-noto-sans-hebrew-e6db03.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="hebrew.css" />
    <!-- mobile-access-injected:begin (shared mobile a11y — tools/inject-mobile-access.js) -->
  <link rel="stylesheet" href="/assets/mobile-access.css">
  <!-- mobile-access-injected:end -->
</head>
  <body data-unit="2">
    <header class="topbar">
      <div class="inner">
        <span class="ball" aria-hidden="true">⚾</span>
        <span class="inning-chip" id="inning-chip">Inning</span>
        <h1 id="page-title">Nightly Hebrew</h1>
        <span class="scorebug" title="Activities finished tonight"
          ><span aria-hidden="true">📋</span> <span id="scorebug">0/12</span></span
        >
      </div>
      <div class="bar" style="height: 4px; border-radius: 0">
        <span id="topbar-bar" style="width: 0%"></span>
      </div>
    </header>

    <main class="wrap">
      <section class="hero" id="hero"></section>

      <div id="acts"></div>

      <section class="act">
        <header>
          <div class="num">💰</div>
          <div>
            <h3>Payday</h3>
            <p class="how">Finish the twelve main activities and this inning pays $0.20. Extra Innings are optional.</p>
          </div>
        </header>
        <div id="payout" class="payout"></div>
      </section>

      <nav class="footnav" id="footnav" aria-label="Other innings"></nav>
    </main>

    <script src="data.js"></script>
    <script src="units.js"></script>
    <script src="engine.js"></script>
    <script src="activities/warmup.js"></script>
    <script src="activities/letters.js"></script>
    <script src="activities/vowels.js"></script>
    <script src="activities/blend.js"></script>
    <script src="activities/fluency.js"></script>
    <script src="activities/words.js"></script>
    <script src="activities/read.js"></script>
    <script src="activities/prove.js"></script>
    <script src="games/unit-2.js"></script>
    <script>
      HEB.boot();
    </script>
    <script src="/assets/math-workbench-launcher.js" defer></script>
  <script src="/assets/formula-popup.js" defer></script>
</body>
</html>
