<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Focus School</title>
    <meta
      name="description"
      content="A simple student focus dashboard with routines, timers, calming sounds, and school planning tools."
    />
    <meta name="theme-color" content="#1e293b" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Focus School" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <!-- mobile-access-injected:begin (shared mobile a11y — tools/inject-mobile-access.js) -->
    <link rel="stylesheet" href="/assets/mobile-access.css" />
    <!-- mobile-access-injected:end -->
  </head>
  <body>
    <!-- Ambient Backdrop Glows -->
    <div class="ambient-glow bg-blob-1" aria-hidden="true"></div>
    <div class="ambient-glow bg-blob-2" aria-hidden="true"></div>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <div class="logo" aria-hidden="true">F</div>
          <div>
            <h1 id="brandName">Focus School</h1>
            <p>Focus &amp; Plan</p>
          </div>
        </div>
        <div class="top-actions">
          <button
            class="btn sm"
            data-act="open-command-bar"
            id="searchBtn"
            aria-label="Search and commands"
            title="Search and commands (Cmd+K)"
          >
            🔍 Search
          </button>
          <button
            class="chip online"
            data-act="view-sync"
            id="connChip"
            title="Connection status"
            aria-label="Connection and sync status — tap for details"
          >
            <span class="dot" aria-hidden="true"></span
            ><span id="connText">Online</span>
          </button>
          <button class="btn sm" data-act="install" id="installBtn" hidden>
            ⬇️ Install
          </button>
        </div>
      </header>

      <section id="hero" class="hero" aria-label="Right now"></section>
      <main id="main" tabindex="-1"></main>
    </div>

    <button
      class="fab"
      id="fab"
      data-act="quick-add"
      aria-label="Quick add an assignment"
      title="Quick add an assignment"
    >
      ＋
    </button>

    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
    <button
      class="sync-fab"
      id="syncFab"
      data-act="sync-fab"
      aria-label="Sync — enter your code to load your planner"
    >
      ☁️ Sync
    </button>

    <div
      class="modal-back"
      id="modalBack"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      aria-hidden="true"
    >
      <div class="modal">
        <div class="head">
          <h2 id="modalTitle">Edit</h2>
          <button class="btn sm" data-act="close-modal" aria-label="Close">
            ✕
          </button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>

    <div
      class="focus-overlay"
      id="focusOverlay"
      role="dialog"
      aria-modal="true"
      aria-label="Focus session"
    >
      <div class="fhead">
        <div>
          <div class="ftitle" id="fTitle">Focus</div>
          <div class="fclass" id="fClass"></div>
        </div>
        <button class="btn sm" data-act="focus-stop" aria-label="Exit focus">
          ✕ Exit
        </button>
      </div>
      <div class="timer-ring">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <circle
            class="track"
            cx="150"
            cy="150"
            r="130"
            fill="none"
            stroke-width="16"
          ></circle>
          <circle
            class="prog"
            id="fProg"
            cx="150"
            cy="150"
            r="130"
            fill="none"
            stroke-width="16"
            stroke-dasharray="816.81"
            stroke-dashoffset="0"
          ></circle>
          <path
            id="fVisualizer"
            fill="none"
            stroke="var(--accent)"
            stroke-width="3"
            stroke-linecap="round"
            opacity="0.6"
            d=""
          ></path>
        </svg>
        <div class="time" id="fTime" role="timer" aria-live="off">15:00</div>
        <div class="phase" id="fPhase">Focus</div>
      </div>
      <div class="fsteps" id="fSteps"></div>
      <!-- Focus Timer Presets -->
      <div
        class="fambient-controls"
        id="fPresetsControls"
        style="margin-bottom: 12px"
      >
        <span class="fambient-label">⏱️ Focus Timer Preset</span>
        <div class="fambient-buttons">
          <button class="btn sm" data-act="set-focus-preset" data-arg="15">
            Quick Burst (15m)
          </button>
          <button class="btn sm" data-act="set-focus-preset" data-arg="25">
            Pomodoro (25m)
          </button>
          <button class="btn sm" data-act="set-focus-preset" data-arg="45">
            Deep Work (45m)
          </button>
        </div>
      </div>
      <!-- Procedural Focus Sound Engine Controls -->
      <div class="fambient-controls" id="fAmbientControls">
        <span class="fambient-label">🧠 Background Focus Sound</span>
        <div class="fambient-buttons">
          <button
            class="btn sm"
            data-act="focus-sound"
            data-arg="none"
            aria-pressed="true"
          >
            Silence
          </button>
          <button class="btn sm" data-act="focus-sound" data-arg="rain">
            Gentle Rain
          </button>
          <button class="btn sm" data-act="focus-sound" data-arg="rumble">
            Cozy Rumble
          </button>
          <button class="btn sm" data-act="focus-sound" data-arg="ocean">
            Ocean Waves
          </button>
          <button class="btn sm" data-act="focus-sound" data-arg="wind">
            Forest Wind
          </button>
          <button class="btn sm" data-act="focus-sound" data-arg="binaural">
            Space Hum
          </button>
          <button class="btn sm" data-act="focus-sound" data-arg="ticks">
            Focus Ticks
          </button>
          <button class="btn sm" data-act="focus-sound" data-arg="synth">
            🎹 Cozy Synth
          </button>
        </div>
      </div>
      <div class="factions">
        <button class="btn" data-act="focus-stop">⏹ Stop</button>
        <button class="btn go" data-act="complete" id="fDone">
          ✓ Mark done
        </button>
      </div>
    </div>

    <div
      class="guide-overlay"
      id="guideOverlay"
      role="dialog"
      aria-modal="true"
      aria-label="Guided routine"
    >
      <div class="ghead">
        <div>
          <div class="gtitle" id="gTitle">Routine</div>
          <div class="gsub" id="gSub"></div>
        </div>
        <button class="btn sm" data-act="guide-stop" aria-label="Exit routine">
          ✕ Exit
        </button>
      </div>
      <div class="gprog" aria-hidden="true">
        <div class="gprog-bar"><span id="gBar"></span></div>
        <div class="gprog-text" id="gCount"></div>
      </div>
      <div class="gbody" id="gBody"></div>
      <div class="gcountdown" id="gCountdown" aria-live="polite"></div>
      <div class="gactions" id="gActions"></div>
    </div>

    <!-- Command Bar Modal -->
    <div
      class="command-bar-back"
      id="commandBarBack"
      role="dialog"
      aria-modal="true"
      aria-label="Command bar"
      aria-hidden="true"
    >
      <div class="command-bar-modal">
        <div class="cmd-head">
          <input
            type="text"
            id="cmdInput"
            placeholder="Search tasks, switch views, or type commands... (try /focus, /theme)"
            autocomplete="off"
          />
          <button
            class="btn sm danger"
            data-act="close-command-bar"
            aria-label="Close"
          >
            ✕
          </button>
        </div>
        <div class="cmd-results" id="cmdResults"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js" defer></script>
    <!-- Intentionally NOT loading /assets/nt-page-enhance.js here: its fixed
         "Save as PDF/DOC" bar (position:fixed; bottom:0; max z-index) overlays
         this PWA's own bottom tab nav + quick-add button and blocks taps. This
         app is a self-contained planner and needs none of the hub enhancer. -->
    <!-- mwb-injected:begin (Math Workbench launcher — tools/inject-math-workbench.js) -->
    <script src="/assets/math-workbench-launcher.js" defer></script>
    <!-- mwb-injected:end -->
  </body>
</html>
