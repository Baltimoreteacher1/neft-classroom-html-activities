<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Class Pulse — anonymous insights dashboard for the Student Digital Mailbox (teacher only)."
    />
    <title>Class Pulse — Student Digital Mailbox Insights</title>
    <link
      rel="stylesheet"
      href="/assets/fonts/hub-curriculum.css"
    />
    <link rel="stylesheet" href="../../mailbox.css" />
    <style>
      .stat-row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin: 18px 0 8px;
      }
      .stat {
        flex: 1 1 160px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px;
      }
      .stat .n {
        font-family: "Nunito", system-ui, sans-serif;
        font-size: 2.2rem;
        font-weight: 800;
        line-height: 1;
        color: var(--navy);
      }
      .stat .lbl {
        color: var(--muted);
        font-size: 0.92rem;
        margin-top: 6px;
      }
      .stat.alert .n {
        color: #b42318;
      }
      .stat.alert {
        background: #fff4e9;
        border-color: #f3c79a;
      }
      .ch-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        margin: 10px 0 24px;
      }
      .ch {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px;
      }
      .ch h2 {
        font-family: "Nunito", system-ui, sans-serif;
        font-size: 1.18rem;
        margin: 0 0 4px;
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ch .counts {
        color: var(--muted);
        font-size: 0.95rem;
        margin: 0 0 10px;
      }
      .ch .counts b {
        color: var(--navy);
        font-weight: 800;
      }
      .badge-urgent {
        background: #b42318;
        color: #fff;
        font-size: 0.72rem;
        font-weight: 800;
        padding: 2px 8px;
        border-radius: 999px;
      }
      .entries {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }
      .entries li {
        background: var(--surface-2);
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 0.95rem;
        color: var(--ink);
      }
      .ch .note {
        font-size: 0.9rem;
        color: var(--muted);
        font-style: italic;
      }
      .ch .empty {
        font-size: 0.92rem;
        color: var(--muted);
      }
      #status {
        font-size: 0.95rem;
        color: var(--muted);
      }
      #error {
        background: #fff4e9;
        border: 1px solid #f3c79a;
        color: #6b4310;
        border-radius: 14px;
        padding: 16px 18px;
      }
    </style>
    <!-- mobile-access-injected:begin (shared mobile a11y — tools/inject-mobile-access.js) -->
    <link rel="stylesheet" href="/assets/mobile-access.css" />
    <!-- mobile-access-injected:end -->
  </head>
  <body>
    <div class="wrap">
      <header class="mb-head">
        <p class="mb-eyebrow">Teacher · Anonymous Insights</p>
        <h1><span class="mb-emoji" aria-hidden="true">📊</span>Class Pulse</h1>
        <p class="mb-intro">
          A live, anonymous read of your Student Digital Mailbox. No student names are collected.
          Private Notes show counts only — read those in the form. <span id="status">Loading…</span>
        </p>
      </header>

      <div id="error" hidden role="alert"></div>

      <section aria-label="Weekly totals">
        <div class="stat-row" id="stats"></div>
        <p class="mb-intro" id="generated" style="font-size: 0.85rem"></p>
      </section>

      <section aria-label="Channels">
        <div class="ch-grid" id="channels"></div>
      </section>

      <footer class="mb-foot">
        <a class="mb-btn ghost" href="/curriculum/student-digital-mailbox/teacher/"
          >← Teacher Setup</a
        >
        <a
          class="mb-btn ghost"
          href="https://drive.google.com/drive/folders/1NGNJCslmlYZdZV33IrD4zRlpqo0Zk0yP"
          target="_blank"
          rel="noopener"
          >Open responses in Drive →</a
        >
      </footer>
    </div>

    <script>
      // Read-only Apps Script Web App returning ANONYMOUS aggregate JSON.
      // Safe to expose: no secrets, no student identity, and this page is behind
      // the site password (it is NOT in the public allowlist).
      var INSIGHTS_URL =
        "https://script.google.com/macros/s/AKfycbxs4s0aA4LQCuIyrmdg6RIvv27eVm7PpbDrWR1SVmWsqvRVdfDWHEzFzaEpnorpPe7wrQ/exec";

      function esc(s) {
        var d = document.createElement("div");
        d.textContent = s == null ? "" : String(s);
        return d.innerHTML;
      }

      function render(data) {
        document.getElementById("status").textContent = "";
        document.getElementById("generated").textContent = "Updated " + (data.generated || "—");

        var stats = document.getElementById("stats");
        stats.innerHTML =
          '<div class="stat"><div class="n">' +
          (data.weekTotal || 0) +
          '</div><div class="lbl">new this week</div></div>' +
          '<div class="stat' +
          (data.urgentTotal ? " alert" : "") +
          '"><div class="n">' +
          (data.urgentTotal || 0) +
          '</div><div class="lbl">marked urgent</div></div>' +
          '<div class="stat"><div class="n">' +
          (data.channels || []).length +
          '</div><div class="lbl">channels</div></div>';

        var wrap = document.getElementById("channels");
        wrap.innerHTML = "";
        (data.channels || []).forEach(function (c) {
          var el = document.createElement("article");
          el.className = "ch";
          var urgentBadge = c.urgent
            ? ' <span class="badge-urgent">' + c.urgent + " urgent</span>"
            : "";
          var counts =
            '<p class="counts"><b>' +
            (c.week || 0) +
            "</b> this week · <b>" +
            (c.total || 0) +
            "</b> total</p>";

          var bodyHtml;
          if (c.error) {
            bodyHtml = '<p class="empty">Could not read this channel yet.</p>';
          } else if (c.sensitive) {
            bodyHtml =
              '<p class="note">Private — counts only. Read entries in the form / your email alerts.</p>';
          } else if (c.recent && c.recent.length) {
            bodyHtml =
              '<ul class="entries">' +
              c.recent
                .map(function (r) {
                  return "<li>" + esc(r) + "</li>";
                })
                .join("") +
              "</ul>";
          } else {
            bodyHtml = '<p class="empty">No entries this week.</p>';
          }

          el.innerHTML = "<h2>" + esc(c.label) + urgentBadge + "</h2>" + counts + bodyHtml;
          wrap.appendChild(el);
        });
      }

      function showError(msg) {
        document.getElementById("status").textContent = "";
        var box = document.getElementById("error");
        box.hidden = false;
        box.textContent = msg;
      }

      // Apps Script's /exec redirects to googleusercontent, and that redirect
      // target serves an intermittent 404 for a perfectly live deployment.
      // Measured 2026-08-12: three of five sequential calls came back as
      // Google's 404 page, the other two returned correct JSON. A single-shot
      // fetch therefore showed this teacher "Couldn't load live data" more often
      // than it showed the data — the deployment was fine every time.
      //
      // So: retry the transport, tell the teacher it is still working rather
      // than freezing on "Loading…", and leave a way to ask again by hand
      // instead of making a page reload the only recovery.
      var ATTEMPTS = 3;
      var RETRY_MS = 800;
      var statusEl = document.getElementById("status");

      function setStatus(text) {
        if (statusEl) statusEl.textContent = text;
      }

      function loadInsights(attempt) {
        attempt = attempt || 1;
        setStatus(attempt === 1 ? "Loading…" : "Still loading… (try " + attempt + ")");
        fetch(INSIGHTS_URL)
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (data) {
            setStatus("");
            render(data);
          })
          .catch(function () {
            if (attempt < ATTEMPTS) {
              setTimeout(function () {
                loadInsights(attempt + 1);
              }, RETRY_MS * attempt);
              return;
            }
            showError(
              "Couldn't load live data after " +
                ATTEMPTS +
                " tries. Open the responses folder in Drive to review submissions directly.",
            );
            var again = document.createElement("button");
            again.type = "button";
            again.className = "btn";
            again.style.marginTop = "10px";
            again.textContent = "Try again";
            again.onclick = function () {
              var box = document.getElementById("error");
              box.hidden = true;
              box.textContent = "";
              loadInsights(1);
            };
            document.getElementById("error").appendChild(again);
          });
      }

      loadInsights(1);
    </script>
    <script src="/assets/nt-usage.js" data-nt-usage="1" defer></script>
    <script src="/assets/math-workbench-launcher.js" defer></script>
    <script src="/assets/formula-popup.js" defer></script>
  </body>
</html>
