<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Mission Builder: choose a topic and a goal, then preview an interactive math mission with its worksheet, answer key, Word file and offline version, all from one source."
    />
    <title>Mission Builder | Neft Teacher</title>
    <link rel="stylesheet" href="./nexus.css" />
  </head>
  <body>
    <a class="nx-skip" href="#nx-app">Skip to the builder</a>
    <div class="nx-shell">
      <header class="nx-top">
        <a class="nx-brand" href="/curriculum/">← Neft Teacher</a>
        <a class="nx-btn" href="/activity-studio/">Activity Studio</a>
      </header>
      <p class="nx-kicker">Mission Builder</p>
      <h1>Build an interactive math mission</h1>
      <p class="nx-lede">
        Pick a topic and what students should accomplish. You get a working student mission plus a
        printable worksheet, answer key, Word file and offline copy, all made from the same numbers.
      </p>
      <main id="nx-app">
        <noscript><p>The Mission Builder needs JavaScript.</p></noscript>
      </main>
    </div>
    <script type="module" src="./builder.js"></script>
  </body>
</html>
