<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activities and tools | EduWonderLab</title>
    <meta name="description" content="Browse Grade 6 math activities, games, practice, projects, and math tools by purpose and unit.">
    <link rel="canonical" href="https://eduwonderlab.com/curriculum/activities/">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/fonts/hub-curriculum.css">
    <link rel="stylesheet" href="/assets/curriculum-shell.css">
    <link rel="stylesheet" href="./activities.css">
    <script src="/assets/curriculum-shell-state.js" defer></script>
    <script src="./activities.js" defer></script>
  </head>
  <body>
    <a class="activity-skip" href="#activity-main">Skip to activities</a>
    <header class="curriculum-header" data-active-route="curriculum"></header>
    <main id="activity-main" class="activity-page">
      <p class="activity-eyebrow">Grade 6 math · Beyond the core lesson</p>
      <h1>Activities and tools</h1>
      <p class="activity-lede">Find a practice activity, game, project, or math tool. Choose a purpose and unit, or search by topic.</p>
      <nav class="activity-paths" aria-label="Other ways to find materials">
        <a href="/curriculum/lesson-materials/">Everything for a lesson</a>
        <a href="/curriculum/learning-labs/">Learning labs</a>
        <a href="/curriculum/units/">Units and lessons</a>
      </nav>
      <form id="activity-filters" class="activity-filters" role="search">
        <div class="activity-search"><label for="activity-query">Search activities</label><input id="activity-query" type="search" placeholder="Try fractions, balance, ratios…" autocomplete="off"></div>
        <div><label for="activity-type">Purpose</label><select id="activity-type">
          <option value="all">All purposes</option>
          <option value="activity">Explore and apply</option>
          <option value="practice">Practice</option>
          <option value="game">Games</option>
          <option value="project">Projects</option>
          <option value="tool">Math tools</option>
          <option value="review">Review and get ready</option>
        </select></div>
        <div><label for="activity-unit">Unit</label><select id="activity-unit"><option value="all">All units</option><option value="1">Unit 1</option><option value="2">Unit 2</option><option value="3">Unit 3</option><option value="4">Unit 4</option><option value="5">Unit 5</option><option value="6">Unit 6</option><option value="7">Unit 7</option><option value="8">Unit 8</option><option value="9">Unit 9</option><option value="10">Unit 10</option></select></div>
        <button type="reset" class="activity-reset">Clear filters</button>
      </form>
      <p id="activity-status" class="activity-status" role="status">Loading activities…</p>
      <div id="activity-results" class="activity-results"></div>
      <button id="activity-more" class="activity-more" type="button" hidden>Show more activities</button>
      <noscript><p>Enable JavaScript to filter activities. You can still use the <a href="/directory/">site directory</a>.</p></noscript>
    </main>
  </body>
</html>
