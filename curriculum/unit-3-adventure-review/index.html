    const has = State.hasProgress();
    UI.screen('title', `<section class="title"><div class="title-art" aria-hidden="true"><div class="peak p1"></div><div class="peak p2"></div><div class="peak p3"></div><div class="beacon"></div></div>
      <div class="title-card"><p class="eyebrow">Grade 6 · Unit 3 Review · Ratios and Rates</p><h1>Expedition <span>Meridian</span></h1><p class="lede">Cross seven zones, collect the Society's instruments, and reactivate the observatory. Every lock opens with ratios and rates.</p>
      <div class="title-actions">${has ? `<button type="button" class="btn btn-primary btn-lg" id="btn-continue" autofocus>${icon('arrow')} Continue Adventure</button><button type="button" class="btn btn-ghost btn-lg" id="btn-new">Start New Adventure</button>` : `<button type="button" class="btn btn-primary btn-lg" id="btn-new" autofocus>${icon('arrow')} Begin the Expedition</button>`}</div>
      ${has ? `<p class="title-meta">${s.xp} XP · ${Rules.overallProgress(s).pct}% of the route mapped</p>` : ''}</div></section>`);
    const c = document.getElementById('btn-continue'); if (c) c.addEventListener('click', () => { if (s.current) { try { renderQuestion(); return; } catch (e) { s.current = null; State.save(); } } showMap(); });
    document.getElementById('btn-new').addEventListener('click', async () => { if (has) { const ok = await UI.confirm('Start a new adventure?', '<p>This erases all saved progress, XP, and collectibles on this device.</p>', 'Erase and restart'); if (!ok) return; State.reset(); s = State.load(); } s.startedAt = Date.now(); State.save(); showIntro(); });
  }

  function showIntro() {
    UI.hud(null);
    const st = U3.STORY;
    UI.screen('intro', `<section class="intro"><div class="intro-card"><p class="eyebrow">Mission Briefing</p><h2>The Observatory Has Gone Dark</h2>${st.intro.map((p) => `<p>${p}</p>`).join('')}
      <div class="brief-grid"><div><span class="brief-k">Your role</span><span>Field Cartographer</span></div><div><span class="brief-k">Objective</span><span>Reach the Summit and relight the beacon</span></div><div><span class="brief-k">Tools</span><span>Ratios, rates, tables, graphs, conversions</span></div></div>
      <div class="title-actions"><button type="button" class="btn btn-primary btn-lg" id="btn-go" autofocus>Open the Map ${icon('arrow')}</button></div></div></section>`);
    document.getElementById('btn-go').addEventListener('click', showMap);
  }

  // ---------- Map ----------
  function showMap() {
    s = State.load();
    const prog = Rules.overallProgress(s), next = Rules.nextZone(s);
    UI.hud({ xp: s.xp, streak: s.streak, title: 'Expedition Map', sub: next ? `Next: ${next.name}` : 'Route complete' });
    const arts = U3.ZONES.map((z) => `<span class="art ${s.collectibles.includes(z.artifact.id) ? 'is-got' : ''}" title="${esc(z.artifact.name)}${s.collectibles.includes(z.artifact.id) ? '' : ' (not yet found)'}">${icon(z.artifact.icon)}<span>${esc(z.artifact.name)}</span></span>`).join('');
    UI.screen('map', `<section class="map-screen"><div class="map-top"><div><p class="eyebrow">Alder Range · Route to the Observatory</p><h2>Expedition Map</h2></div><div class="map-progress" aria-label="Overall progress ${prog.pct}%"><div class="bar"><div class="bar-fill" style="width:${prog.pct}%"></div></div><span>${prog.done} of ${prog.total} missions · ${prog.pct}%</span></div></div>
      <div class="map-wrap"><div class="map-canvas">${UI.mapSvg(s)}${UI.mapNodes(s)}</div><div class="map-list">${UI.mapList(s)}</div></div>
      <div class="map-bottom"><div class="satchel"><span class="satchel-title">${icon('satchel')} Satchel</span><div class="arts">${arts}</div></div>
        <div class="map-actions">${Rules.isZoneComplete(s, 'summit') ? `<button type="button" class="btn btn-primary" id="btn-results">${icon('chart')} View Mission Report</button>` : ''}<button type="button" class="btn btn-ghost" id="btn-ach">${icon('medal')} Achievements (${Object.keys(s.achievements).length}/${U3.ACHIEVEMENTS.length})</button></div></div></section>`);
    document.querySelectorAll('[data-zone]').forEach((b) => b.addEventListener('click', () => { const z = zoneById(b.dataset.zone); if (!Rules.isUnlocked(s, z.id)) { UI.toast(`${z.name} is locked. Finish ${lockReason(z)} first.`, 'warn'); return; } openZone(z); }));
    const r = document.getElementById('btn-results'); if (r) r.addEventListener('click', showResults);
    document.getElementById('btn-ach').addEventListener('click', openAchievements);
  }
  function lockReason(z) { if (z.optional) return zoneById(z.unlockAfter).name; const core = U3.ZONES.filter((x) => !x.optional); const i = core.findIndex((x) => x.id === z.id); return core[i - 1].name; }

  function openZone(z) {
    if (z.id === 'cave') { const got = Rules.evaluate(s, { event: 'enter', zone: 'cave' }); State.save(); announce(got); }
    const body = `<p class="zone-story">${z.story}</p><p class="zone-lesson">${icon('book')} Lesson ${esc(z.lesson)} · ${esc(z.lessonName)}</p><div class="mission-list">${z.missions.map((m, i) => { const md = s.zones[z.id] && s.zones[z.id].missions[m.id]; const done = md && md.completed; const prev = i === 0 || (s.zones[z.id] && s.zones[z.id].missions[z.missions[i - 1].id] && s.zones[z.id].missions[z.missions[i - 1].id].completed); const open = z.final ? prev : true; return `<button type="button" class="mission-row ${done ? 'is-done' : ''} ${open ? '' : 'is-locked'}" data-m="${m.id}" ${open ? '' : 'disabled'}><span class="mr-num">${done ? icon('check') : open ? i + 1 : icon('lock')}</span><span class="mr-body"><span class="mr-name">${esc(m.name)}</span><span class="mr-meta">${m.gens.length} challenges${done ? ` · best ${md.best.first}/${md.best.total} first try` : ''}</span></span><span class="mr-cta">${done ? 'Replay' : 'Start'} ${icon('arrow')}</span></button>`; }).join('')}</div>`;
    const m = UI.modal({ title: `<span class="zone-title" style="--accent:${z.accent}">${icon(z.emblem)} ${esc(z.name)}</span>`, body, cls: 'modal-zone' });
    m.el.querySelectorAll('.mission-row').forEach((b) => b.addEventListener('click', () => { m.close(); startMission(z.id, b.dataset.m); }));
  }

  // ---------- Mission flow ----------
  function startMission(zid, mid) {
    const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
    s.current = { zone: zid, mission: mid, seed, qIndex: 0, results: [] };
    State.save();
    renderQuestion();
  }
  function buildQuestions(cur) {
    const r = U3.R.make(cur.seed);
    return missionDef(cur.zone, cur.mission).gens.map((g) => (Array.isArray(g) ? U3.G.make(g[0], r, g[1]) : U3.G.make(g, r, {})));
  }
  function renderQuestion() {
    const cur = s.current; const z = zoneById(cur.zone), m = missionDef(cur.zone, cur.mission);
    const qs = buildQuestions(cur); q = qs[cur.qIndex];
    attempts = 0; hintLevel = 0; helpUsed = false; solutionShown = false;
    const dots = qs.map((_, i) => (i < cur.qIndex ? (cur.results[i] && cur.results[i].correct ? 'done' : 'miss') : i === cur.qIndex ? 'now' : ''));
    UI.hud({ xp: s.xp, streak: s.streak, title: z.name, sub: m.name, dots });
    const skill = U3.SKILLS[q.skill];
    UI.screen('mission', `<section class="mission" style="--accent:${z.accent}"><div class="q-card"><div class="q-head"><span class="q-skill">${icon('star')} Skill: ${esc(skill.label)}</span><span class="q-num">Challenge ${cur.qIndex + 1} of ${qs.length}${z.final ? ' · Glyph' : ''}</span></div>
      ${z.final ? `<div class="glyphs" aria-label="Chamber glyphs">${qs.map((_, i) => `<span class="glyph ${i < cur.qIndex ? 'is-lit' : i === cur.qIndex ? 'is-now' : ''}">${icon('star')}</span>`).join('')}<span class="glyph-label">${cur.qIndex} of ${qs.length} glyphs lit</span></div>` : ''}<h2 class="q-title">${esc(q.title)}</h2><div class="q-prompt">${q.prompt}</div><div class="q-body" id="q-body"></div>
      <div class="q-actions"><div class="q-actions-left"><button type="button" class="btn btn-ghost" id="btn-help">${icon('help')} Need help?</button>${q.reference ? `<button type="button" class="btn btn-ghost" data-act="reference">${icon('ref')} Reference sheet</button>` : ''}${s.settings.readAloud ? `<button type="button" class="btn btn-ghost btn-icon" data-act="speak" aria-label="Read aloud">${icon('speaker')}</button>` : ''}</div><button type="button" class="btn btn-primary" id="btn-check">Check answer</button></div>
      <div class="q-feedback" id="q-feedback" aria-live="polite" hidden></div></div></section>`);
    widget = U3.Widgets[q.type](document.getElementById('q-body'), q, { submit });
    document.getElementById('btn-check').addEventListener('click', submit);
    document.getElementById('btn-help').addEventListener('click', openHelp);
    setTimeout(() => { const first = document.querySelector('#q-body input, #q-body .choice, #q-body button'); if (first && root.innerWidth > 700) first.focus({ preventScroll: true }); }, 60);
  }

  function submit() {
    if (!widget || document.getElementById('btn-check').disabled) return;
    if (!widget.canSubmit()) { UI.toast('Finish answering before checking.', 'warn'); const fb = document.getElementById('q-body'); fb.classList.remove('shake'); void fb.offsetWidth; fb.classList.add('shake'); return; }
    const ans = widget.getAnswer();
    const res = U3.check(q, ans);
    attempts++;
    const cur = s.current;
    if (res.correct) {
      const first = attempts === 1 && !solutionShown;
      const mult = solutionShown ? XP_AFTER_SOLUTION : attempts === 1 ? 1 : XP_SECOND;
      const xp = Math.round(q.xp * mult);
      const missRunBefore = s.stats.missRun;
      s.xp += xp; s.streak += 1; s.bestStreak = Math.max(s.bestStreak, s.streak); s.stats.missRun = 0;
      recordResult({ correct: true, firstTry: first, attempts });
      if (first && q.skill === 'unit-rate') s.stats.unitRateFirst++;
      if (first && q.type === 'plot') s.stats.plotFirstTry++;
      if (q.type === 'error') s.stats.errorsSolved++;
      widget.markResult(Object.assign({ final: true }, res)); widget.setDisabled(true);
      showFeedback(true, `${q.feedback.correct || 'Correct.'}`, xp, first);
      const got = Rules.evaluate(s, { event: 'answer', correct: true, missRunBefore }); State.save(); announce(got);
    } else {
      s.streak = 0;
      if (attempts >= 2 || solutionShown) {
        s.stats.missRun++;
        recordResult({ correct: false, firstTry: false, attempts });
        widget.markResult(Object.assign({ final: true }, res)); widget.setDisabled(true);
        showFeedback(false, `${wrongText(ans, res)}<div class="fb-solution"><span class="fb-label">${icon('bulb')} Here is how it works</span>${q.solution}</div>`, 0, false, true);
        State.save();
      } else {
        widget.markResult(Object.assign({ final: false }, res));
        showFeedback(false, `${wrongText(ans, res)} <span class="fb-again">Try once more. You can also open <b>Need help?</b> for a hint.</span>`, 0, false, false);
        State.save();
      }
    }
    UI.hud({ xp: s.xp, streak: s.streak, title: zoneById(cur.zone).name, sub: missionDef(cur.zone, cur.mission).name, dots: buildQuestions(cur).map((_, i) => (i < cur.qIndex ? (cur.results[i] && cur.results[i].correct ? 'done' : 'miss') : i === cur.qIndex ? 'now' : '')) });
  }
  function wrongText(ans, res) { const w = q.feedback.wrong; let t = typeof w === 'function' ? w(ans, res.detail || {}) : w; if (!t && q.options && typeof ans === 'number' && q.options[ans] && q.options[ans].why) t = q.options[ans].why; if (!t) t = q.hints[0] || 'Not quite. Look at the question again.'; return `<span class="fb-text">${t}</span>`; }
  function recordResult(r) {
    const cur = s.current;
    cur.results[cur.qIndex] = Object.assign({ gen: q.gen, skill: q.skill, help: helpUsed }, r);
    const sk = State.skill(q.skill); sk.seen++; sk.attempts += r.attempts; if (r.correct) sk.correct++; if (r.firstTry) sk.first++;
    s.stats.answered++; if (r.correct) s.stats.correct++; if (r.firstTry) s.stats.firstTry++;
  }
  function showFeedback(ok, html, xp, first, final) {
    const fb = document.getElementById('q-feedback');
    fb.hidden = false; fb.className = 'q-feedback ' + (ok ? 'is-ok' : final ? 'is-final' : 'is-retry');
    const done = ok || final;
    fb.innerHTML = `<div class="fb-head">${icon(ok ? 'check' : 'x')}<b>${ok ? (first ? 'Correct!' : 'Correct') : final ? 'Let\'s look at the solution' : 'Not yet'}</b>${ok ? `<span class="fb-xp">+${xp} XP${first ? '' : ' (retry)'}</span>` : ''}</div><div class="fb-body">${html}</div>${done ? `<div class="fb-actions"><button type="button" class="btn btn-primary" id="btn-next">${s.current.qIndex + 1 < missionDef(s.current.zone, s.current.mission).gens.length ? 'Next challenge' : 'Finish mission'} ${icon('arrow')}</button></div>` : ''}`;
    const check = document.getElementById('btn-check'); if (done) { check.disabled = true; document.getElementById('btn-next').addEventListener('click', next); setTimeout(() => { const b = document.getElementById('btn-next'); if (b) b.focus(); }, 50); } else { check.textContent = 'Check again'; }
    fb.scrollIntoView({ behavior: s.settings.reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
  }
  function next() {
    const cur = s.current; cur.qIndex++;
    const m = missionDef(cur.zone, cur.mission);
    if (cur.qIndex >= m.gens.length) return completeMission();
    State.save(); renderQuestion();
  }

  function completeMission() {
    const cur = s.current, z = zoneById(cur.zone), m = missionDef(cur.zone, cur.mission);
    const total = cur.results.length, first = cur.results.filter((r) => r.firstTry).length, correct = cur.results.filter((r) => r.correct).length;
    const md = State.mission(z.id, m.id); md.plays++; const wasDone = md.completed; md.completed = true;
    if (!md.best || first > md.best.first) md.best = { first, total };
    s.stats.missions++;
    const zoneState = State.zone(z.id); const zoneNowDone = z.missions.every((mm) => zoneState.missions[mm.id] && zoneState.missions[mm.id].completed);
    let newArtifact = null;
    if (zoneNowDone && !zoneState.completed) { zoneState.completed = true; zoneState.completedAt = Date.now(); if (!s.collectibles.includes(z.artifact.id)) { s.collectibles.push(z.artifact.id); newArtifact = z.artifact; } }
    const firstRate = zoneNowDone ? zoneFirstRate(z) : 0;
    const got = [].concat(Rules.evaluate(s, { event: 'mission', first, total }), zoneNowDone ? Rules.evaluate(s, { event: 'zone', zone: z.id, firstRate }) : []);
    s.current = null; State.save();
    const skillRows = summarizeSkills(cur.results);
    UI.hud({ xp: s.xp, streak: s.streak, title: z.name, sub: 'Mission complete' });
    UI.screen('complete', `<section class="complete" style="--accent:${z.accent}"><div class="complete-card"><div class="confetti" aria-hidden="true">${Array.from({ length: 18 }, (_, i) => `<i style="--i:${i}"></i>`).join('')}</div>
      <p class="eyebrow">${esc(z.name)} · ${esc(m.name)}</p><h2>${zoneNowDone && z.final ? 'The Beacon Is Lit' : zoneNowDone ? `${esc(z.name)} Cleared` : 'Mission Complete'}</h2>
      <div class="stat-row"><div class="stat"><b>${correct}/${total}</b><span>correct</span></div><div class="stat"><b>${first}/${total}</b><span>first try</span></div><div class="stat"><b>${s.xp}</b><span>total XP</span></div></div>
      ${newArtifact ? `<div class="artifact-reveal">${icon(newArtifact.icon)}<div><span class="ar-k">Instrument recovered</span><b>${esc(newArtifact.name)}</b></div></div>` : ''}
      ${got.length ? `<div class="ach-reveal">${got.map((id) => { const a = U3.ACHIEVEMENTS.find((x) => x.id === id); return `<span class="ach-chip">${icon(a.icon)} ${esc(a.name)}</span>`; }).join('')}</div>` : ''}
      <div class="skill-rows">${skillRows}</div>
      <div class="title-actions">${zoneNowDone && z.final ? `<button type="button" class="btn btn-primary btn-lg" id="btn-results" autofocus>${icon('chart')} See your Mission Report</button>` : `<button type="button" class="btn btn-primary btn-lg" id="btn-map" autofocus>Back to the map ${icon('arrow')}</button>`}<button type="button" class="btn btn-ghost" id="btn-replay">${icon('replay')} Replay this mission</button></div></div></section>`);
    const bm = document.getElementById('btn-map'); if (bm) bm.addEventListener('click', showMap);
    const br = document.getElementById('btn-results'); if (br) br.addEventListener('click', showResults);
    document.getElementById('btn-replay').addEventListener('click', () => startMission(z.id, m.id));
    void wasDone;
  }
  function zoneFirstRate(z) { let f = 0, t = 0; z.missions.forEach((m) => { const md = s.zones[z.id].missions[m.id]; if (md && md.best) { f += md.best.first; t += md.best.total; } }); return t ? f / t : 0; }
  function summarizeSkills(results) {
    const by = {}; results.forEach((r) => { const b = by[r.skill] || (by[r.skill] = { n: 0, first: 0 }); b.n++; if (r.firstTry) b.first++; });
    return Object.keys(by).map((k) => { const b = by[k], band = Rules.skillBand(b.first / b.n); return `<div class="skill-row"><span>${esc(U3.SKILLS[k].label)}</span><span class="band band-${band.replace(/\s/g, '').toLowerCase()}">${band}</span></div>`; }).join('');
  }

  // ---------- Help ----------
  function openHelp() {
    s.stats.helpOpened++; helpUsed = true;
    const got = Rules.evaluate(s, { event: 'help' }); State.save(); announce(got);
    const render = () => `<div class="help-steps">${q.hints.slice(0, hintLevel).map((t, i) => `<div class="help-step"><span class="hs-k">Hint ${i + 1}</span><div>${t}</div></div>`).join('')}${solutionShown ? `<div class="help-step help-solution"><span class="hs-k">${icon('bulb')} Show me how</span><div>${q.solution}</div></div>` : ''}</div><p class="help-foot">${solutionShown ? 'Close this and enter the answer to finish the challenge.' : hintLevel < q.hints.length ? 'Try the problem after each hint. Open the next hint only if you are still stuck.' : 'The last step shows the full solution. Use it if you need it.'}</p>`;
    const m = UI.modal({ title: `${icon('help')} Need help?`, body: render(), wide: true, actions: [{ label: 'Close and try it', cls: 'btn-primary' }, { label: hintLevel < q.hints.length ? 'Next hint' : 'Show me how', cls: 'btn-ghost', keep: true, onClick: (entry) => { if (hintLevel < q.hints.length) hintLevel++; else solutionShown = true; entry.el.querySelector('.modal-body').innerHTML = render(); const b = entry.el.querySelector('.modal-actions [data-i="1"]'); if (solutionShown) b.disabled = true; else if (hintLevel >= q.hints.length) b.textContent = 'Show me how'; return false; } }] });
    if (hintLevel === 0 && !solutionShown) { hintLevel = 1; m.el.querySelector('.modal-body').innerHTML = render(); }
  }

  // ---------- Modals: field guide, reference, settings, achievements ----------
  function openFieldGuide() {
    s.stats.helpOpened++; const got = Rules.evaluate(s, { event: 'help' }); State.save(); announce(got);
    UI.modal({ title: `${icon('book')} Field Guide`, wide: true, body: `<p class="muted">Tap a term to see its meaning and an example.</p><div class="vocab">${U3.VOCAB.map((v) => `<details class="vocab-item"><summary>${esc(v.term)}</summary><div class="vocab-body"><p>${v.def}</p>${v.ex ? `<p class="vocab-ex"><b>Example:</b> ${esc(v.ex)}</p>` : ''}${v.visual ? `<div class="vocab-viz">${v.visual()}</div>` : ''}</div></details>`).join('')}</div><h3 class="ref-h">Reference sheet</h3>${U3.REFERENCE_SHEET}` });
  }

  function openSettings() {
    const st = s.settings;
    const row = (k, label, desc) => `<label class="setting"><span><b>${label}</b><small>${desc}</small></span><input type="checkbox" data-k="${k}" ${st[k] ? 'checked' : ''}><span class="switch" aria-hidden="true"></span></label>`;

    m.el.querySelectorAll('input[type="checkbox"]').forEach((c) => c.addEventListener('change', () => { st[c.dataset.k] = c.checked; State.save(); applySettings(); if (c.dataset.k === 'readAloud' && document.getElementById('screen').dataset.screen === 'mission') { const left = document.querySelector('.q-actions-left'); const ex = left.querySelector('[data-act="speak"]'); if (c.checked && !ex) left.insertAdjacentHTML('beforeend', `<button type="button" class="btn btn-ghost btn-icon" data-act="speak" aria-label="Read aloud">${icon('speaker')}</button>`); if (!c.checked && ex) ex.remove(); } }));
    m.el.querySelector('#btn-reset').addEventListener('click', async () => { const ok = await UI.confirm('Reset the adventure?', '<p>This permanently erases progress, XP, achievements, and collectibles saved on this device.</p>', 'Erase everything'); if (!ok) return; State.reset(); s = State.load(); m.close(); UI.toast('Adventure reset.', 'ok'); showTitle(); });
  }
  function openAchievements() { UI.modal({ title: `${icon('medal')} Achievements`, wide: true, body: `<div class="ach-grid">${U3.ACHIEVEMENTS.map((a) => `<div class="ach ${s.achievements[a.id] ? 'is-got' : ''}"><span class="ach-ic">${icon(a.icon)}</span><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></div>`).join('')}</div>` }); }
  function announce(ids) { (ids || []).forEach((id, i) => { const a = U3.ACHIEVEMENTS.find((x) => x.id === id); setTimeout(() => UI.toast(`${icon('medal')} Achievement: <b>${esc(a.name)}</b>`, 'ach'), 300 + i * 900); }); }

  // ---------- Results ----------
  function showResults() {
    s = State.load();
    const skills = Object.keys(U3.SKILLS).map((k) => { const sk = s.skills[k] || { seen: 0, first: 0 }; const rate = sk.seen ? sk.first / sk.seen : null; return { k, label: U3.SKILLS[k].label, zone: U3.SKILLS[k].zone, rate, seen: sk.seen, band: rate == null ? 'Not yet seen' : Rules.skillBand(rate) }; });
    const seen = skills.filter((x) => x.rate != null);
    const strong = seen.filter((x) => x.band === 'Strong'), practice = seen.filter((x) => x.band !== 'Strong');
    const acc = s.stats.answered ? Math.round((100 * s.stats.firstTry) / s.stats.answered) : 0;
    const zonesDone = U3.ZONES.filter((z) => Rules.isZoneComplete(s, z.id));
    UI.hud({ xp: s.xp, streak: s.streak, title: 'Mission Report' });
    UI.screen('results', `<section class="results"><div class="results-card"><p class="eyebrow">Expedition Meridian · Unit 3</p><h2>Mission Complete</h2><p class="lede">The observatory is back online. Here is your field report.</p>
      <div class="stat-row"><div class="stat"><b>${acc}%</b><span>first-try accuracy</span></div><div class="stat"><b>${s.xp}</b><span>XP earned</span></div><div class="stat"><b>${zonesDone.length}/${U3.ZONES.length}</b><span>zones cleared</span></div><div class="stat"><b>${Object.keys(s.achievements).length}/${U3.ACHIEVEMENTS.length}</b><span>achievements</span></div></div>
      <div class="results-cols"><div><h3>Strongest skills</h3>${strong.length ? strong.map((x) => `<div class="skill-row"><span>${esc(x.label)}</span><span class="band band-strong">Strong</span></div>`).join('') : '<p class="muted">Keep practicing to build strong skills.</p>'}</div>
      <div><h3>Keep practicing</h3>${practice.length ? practice.map((x) => `<div class="skill-row"><span>${esc(x.label)}</span><span class="band band-${x.band.replace(/\s/g, '').toLowerCase()}">${x.band}</span></div>`).join('') : '<p class="muted">Every skill is strong. Try the Hidden Cave for a challenge.</p>'}</div></div>
      ${practice.length ? `<div class="recommend"><h3>Recommended replays</h3><div class="rec-list">${[...new Set(practice.map((x) => x.zone))].map((zid) => { const z = zoneById(zid); return `<button type="button" class="btn btn-ghost" data-zone="${z.id}">${icon(z.emblem)} ${esc(z.name)}</button>`; }).join('')}</div></div>` : ''}
      <div class="ach-reveal">${U3.ACHIEVEMENTS.filter((a) => s.achievements[a.id]).map((a) => `<span class="ach-chip">${icon(a.icon)} ${esc(a.name)}</span>`).join('')}</div>
      <div class="title-actions"><button type="button" class="btn btn-primary btn-lg" id="btn-map" autofocus>Back to the map ${icon('arrow')}</button></div></div></section>`);
    document.getElementById('btn-map').addEventListener('click', showMap);
    document.querySelectorAll('.rec-list [data-zone]').forEach((b) => b.addEventListener('click', () => openZone(zoneById(b.dataset.zone))));
  }

  U3.Game = { boot, showMap, startMission, showResults, _debug: () => ({ q, widget, s }), resumeIfNeeded() { if (s.current) { try { renderQuestion(); return true; } catch (e) { s.current = null; State.save(); } } return false; } };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Expedition Meridian — boot. */
(function () {
  'use strict';
  document.addEventListener('DOMContentLoaded', function () {
    window.U3.Game.boot();
  });
})();

</script>
</body>
</html>
