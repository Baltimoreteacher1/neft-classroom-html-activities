        solution: `<p>One ratio group has ${a} + ${b} + ${c} = ${t} marbles, so red to all marbles is ${a} : ${t}. ${name} added only red and blue. With ${a * m} red marbles there are ${m} groups, so the total is ${m} × ${t} = <b>${t * m}</b>.</p>`,
        feedback: {
          correct: 'Correct. The whole must include every part, including the third color.',
          wrong(ans, d) {
            if (!d.mistakeOk) return why(sh.options, ans.mistake) || 'Which marbles belong in "all the marbles"?';
            const f = RX.parseNum(ans.fix);
            if (f === (a + b) * m) return `That total leaves out the green marbles again. One group has ${t} marbles, not ${a + b}.`;
            if (f === (b + c) * m) return `That counts only the blue and green marbles. "All" includes the ${a * m} red ones too.`;
            return `You found the mistake. For the fix, find the number of groups (${a * m} ÷ ${a}), then multiply by ${t} marbles per group.`;
          },
        },
      };
    }
    const [a, b] = r.pick([
        [2, 3],
        [3, 5],
        [1, 4],
        [3, 4],
      ]),
      t = a + b;
    const sh = shuffleOptions(
      r,
      [
        { html: `${name} used the part-to-part ratio ${a} : ${b}. The question asks for red compared to the <b>total</b>, which is ${a} : ${t}.`, ok: true },
        { html: `${name} should have added ${a} and ${b} in every column instead of multiplying.`, why: 'The multiplying is fine. The problem is which two quantities are being compared.' },
        { html: `${name}'s table is correct.`, why: `The table compares red to blue (${a} : ${b}). "Red out of all the marbles" is red to total (${a} : ${t}).` },
        { html: `${name} should have used ${b} : ${t}.`, why: `${b} : ${t} would be blue to total. The question asks about red.` },
      ],
      0,
    );
    return {
      type: 'error',
      skill: 'part-whole',
      lesson: '3-1',
      title: 'Challenge: part or whole?',
      xp: 20,
      prompt: `<p>A bag has ${hl(a + ' red')} marbles for every ${hl(b + ' blue')} marbles. ${name} was asked to make a table of the ratio of red marbles to <b>all</b> the marbles.</p>${V.table(
        [
          ['Red', ...ks.map((k) => String(a * k))],
          ['All marbles', ...ks.map((k) => String(b * k))],
        ],
        { header: false, rowHeader: true, cls: 'compact' },
      )}<p>What is wrong?</p>`,
      work: `Red : all = ${a} : ${b}`,
      options: sh.options,
      answer: sh.answer,
      fix: { label: `If there are ${a * 4} red marbles, how many marbles in all? `, answer: t * 4 },
      hints: [
        '"All the marbles" means red + blue. What is that for one group?',
        `One group has ${a} + ${b} = ${t} marbles. Red to all is ${a} : ${t}.`,
        `With ${a * 4} red marbles there are 4 groups: 4 × ${t}.`,
      ],
      hintEs: '"Todas las canicas" significa las rojas más las azules. ¿Cuántas son en un grupo?',
      solution: `<p>Red to all marbles is ${a} : ${t}, not ${a} : ${b}. With ${a * 4} red marbles (4 groups), the total is 4 × ${t} = <b>${t * 4}</b>.</p>`,
      feedback: {
        correct: 'Correct. Always check whether a ratio compares to another part or to the whole.',
        wrong(ans, d) {
          if (!d.mistakeOk) return why(sh.options, ans.mistake) || 'Which two quantities should be compared?';
          const f = RX.parseNum(ans.fix);
          if (f === b * 4) return `${b * 4} is only the blue marbles. "In all" means red plus blue.`;
          return `Right. For the fix, each group has ${t} marbles total, and ${a * 4} red means 4 groups.`;
        },
      },
    };
  });

  // ---------- Three students, one correct (who) ----------
  G.define('c_threeStudents', (r, o) => {
    const hard = !!o.hard;
    const [n1, n2, n3] = r.pickN(NAMES, 3);
    if (hard) {
      // Job B is paid by minutes; Job B always has the higher hourly rate but the smaller total
      const ua = r.pick([12, 14, 16, 18]),
        ub = ua + r.pick([2, 4]);
      const ha = r.pick([5, 6]),
        mb = r.pick([90, 150]),
        hb = mb / 60;
      const pa = ua * ha,
        pb = ub * hb;
      const sh = shuffleOptions(
        r,
        [
          { title: n1, html: `${mb} minutes = ${hb} hours.<br>Job A: $${pa} ÷ ${ha} = $${ua}/h.<br>Job B: $${pb} ÷ ${hb} = $${ub}/h.<br><b>Job B pays more per hour.</b>`, ok: true },
          {
            title: n2,
            html: `Job A: $${pa} ÷ ${ha} = $${ua} per hour.<br>Job B: $${pb} ÷ ${mb} = $${round(pb / mb, 2)} per minute.<br><b>Job A pays more, since $${ua} is more than $${round(pb / mb, 2)}.</b>`,
            why: `${n2} compared dollars per hour with dollars per minute. Change ${mb} minutes to ${hb} hours first so both rates use the same unit.`,
          },
          {
            title: n3,
            html: `Job A pays $${pa} for ${ha} hours of work.<br>Job B pays $${pb} for ${mb} minutes of work.<br><b>Job A pays more, since $${pa} is more than $${pb}.</b>`,
            why: `${n3} compared total pay, but the amounts of time are different. Compare dollars per hour.`,
          },
        ],
        0,
      );
      return {
        type: 'who',
        skill: 'compare',
        lesson: '3-5',
        title: 'Challenge: which job pays more?',
        xp: 20,
        prompt: `<p>Job A pays ${hl('$' + pa)} for ${hl(ha + ' hours')}. Job B pays ${hl('$' + pb)} for ${hl(mb + ' minutes')}. Three students decide which job pays more <b>per hour</b>. Who is correct?</p>`,
        options: sh.options,
        answer: sh.answer,
        layout: 'cards',
        hints: [
          'Both rates must use the same time unit. Change minutes to hours before you divide (60 minutes = 1 hour).',
          `${mb} ÷ 60 = ${hb} hours. Job A: ${pa} ÷ ${ha}. Job B: ${pb} ÷ ${hb}.`,
          'Compare the two dollars-per-hour rates. Check which student did exactly that.',
        ],
        hintEs: 'Las dos tasas deben usar la misma unidad de tiempo. Cambia los minutos a horas antes de dividir (60 minutos = 1 hora).',
        solution: `<p>${mb} minutes = ${hb} hours. Job A: $${pa} ÷ ${ha} = $${ua} per hour. Job B: $${pb} ÷ ${hb} = $${ub} per hour. <b>Job B</b> pays more per hour, so <b>${n1}</b> is correct, even though Job A pays more in total.</p>`,
        feedback: {
          correct: 'Correct. Matching the time units first makes the unit rates comparable.',
          wrong: (ans) => why(sh.options, ans) || 'Change minutes to hours, then compare dollars per hour.',
        },
      };
    }
    // the better-paying job has fewer hours, so comparing totals points the wrong way
    const low = r.int(12, 18),
      high = low + r.pick([2, 3]);
    const highIsA = r.chance(0.5);
    const ua = highIsA ? high : low,
      ub = highIsA ? low : high;
    const hShort = r.int(2, 3),
      hLong = r.int(5, 6);
    const ha = highIsA ? hShort : hLong,
      hb = highIsA ? hLong : hShort;
    const pa = ua * ha,
      pb = ub * hb;
    const better = ua > ub ? 'A' : 'B',
      worse = better === 'A' ? 'B' : 'A';
    const sh = shuffleOptions(
      r,
      [
        { title: n1, html: `Job A: $${pa} ÷ ${ha} = $${ua}/h.<br>Job B: $${pb} ÷ ${hb} = $${ub}/h.<br><b>Job ${better} pays more per hour.</b>`, ok: true },
        {
          title: n2,
          html: `Job A pays $${pa} for ${ha} hours of work.<br>Job B pays $${pb} for ${hb} hours of work.<br><b>Job ${worse} pays more, since $${Math.max(pa, pb)} is more than $${Math.min(pa, pb)}.</b>`,
          why: `${n2} compared totals, but the hours are different (${ha} and ${hb}). Compare dollars per hour.`,
        },
        {
          title: n3,
          html: `Job A: ${ha} ÷ ${pa} = ${round(ha / pa, 3)}.<br>Job B: ${hb} ÷ ${pb} = ${round(hb / pb, 3)}.<br><b>Job ${worse} pays more, since its number is bigger.</b>`,
          why: `${n3} divided hours by dollars, which gives hours per dollar. Dollars per hour is dollars ÷ hours.`,
        },
      ],
      0,
    );
    return {
      type: 'who',
      skill: 'compare',
      lesson: '3-5',
      title: 'Challenge: which job pays more?',
      xp: 20,
      prompt: `<p>Job A pays ${hl('$' + pa)} for ${hl(ha + ' hours')}. Job B pays ${hl('$' + pb)} for ${hl(hb + ' hours')}. Three students decide which job pays more <b>per hour</b>. Who is correct?</p>`,
      options: sh.options,
      answer: sh.answer,
      layout: 'cards',
      hints: ['Dollars per hour means dollars ÷ hours.', `Job A: ${pa} ÷ ${ha}. Job B: ${pb} ÷ ${hb}.`, 'Compare the two dollars-per-hour rates. Check which student did exactly that.'],
      hintEs: 'Dólares por hora significa dólares ÷ horas.',
      solution: `<p>Job A: $${pa} ÷ ${ha} = $${ua} per hour. Job B: $${pb} ÷ ${hb} = $${ub} per hour. <b>Job ${better}</b> pays more per hour. <b>${n1}</b> is correct, even though Job ${worse} pays more in total.</p>`,
      feedback: {
        correct: 'Correct. The right unit rate, in the right direction, settles the comparison.',
        wrong: (ans) => why(sh.options, ans) || 'Divide dollars by hours for each job, then compare.',
      },
    };
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — save state (localStorage). */
(function (root) {
  'use strict';
  const RX = root.RX;
  const KEY = () => (RX.UNIT && RX.UNIT.saveKey) || 'rx-expedition-v1';

  function defaults() {
    return {
      version: 1, startedAt: null, updatedAt: null,
      xp: 0, streak: 0, bestStreak: 0,
      zones: {},            // zoneId -> { missions: { missionId -> {completed, best:{first,total}, plays} }, completed, completedAt }
      current: null,        // { zone, mission, seed, qIndex, results: [{gen, skill, firstTry, attempts, correct, help}] }
      skills: {},           // skillId -> { attempts, first, correct, seen }
      achievements: {},     // id -> timestamp
      collectibles: [],     // artifact ids
      settings: { readAloud: false, largeText: false, reduceMotion: false, sound: false, dyslexic: false },
      stats: { answered: 0, firstTry: 0, correct: 0, errorsSolved: 0, helpOpened: 0, missRun: 0, plotFirstTry: 0, unitRateFirst: 0, missions: 0 },
    };
  }

  let state = null;
  function load() {
    if (state) return state;
    try { const raw = root.localStorage && root.localStorage.getItem(KEY()); state = raw ? Object.assign(defaults(), JSON.parse(raw)) : defaults(); }
    catch (e) { state = defaults(); }
    state.settings = Object.assign(defaults().settings, state.settings || {});
    state.stats = Object.assign(defaults().stats, state.stats || {});
    return state;
  }
  function save() {
    state.updatedAt = Date.now();
    try { root.localStorage && root.localStorage.setItem(KEY(), JSON.stringify(state)); } catch (e) { /* storage unavailable: play continues in memory */ }
    return state;
  }
  function reset() { const settings = state ? state.settings : null; state = defaults(); if (settings) state.settings = settings; save(); return state; }
  function hasProgress() { const s = load(); return !!s.startedAt; }
  function zone(id) { const s = load(); if (!s.zones[id]) s.zones[id] = { missions: {}, completed: false }; return s.zones[id]; }
  function mission(zoneId, mId) { const z = zone(zoneId); if (!z.missions[mId]) z.missions[mId] = { completed: false, best: null, plays: 0 }; return z.missions[mId]; }
  function skill(id) { const s = load(); if (!s.skills[id]) s.skills[id] = { attempts: 0, first: 0, correct: 0, seen: 0 }; return s.skills[id]; }

  RX.State = { load, save, reset, hasProgress, zone, mission, skill, defaults, KEY, unload() { state = null; } };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — unlock + achievement rules. Pure functions over state.
   Achievements are declarative: each unit pack lists { id, name, desc, icon, when } and this file evaluates `when`.
   Supported `when` shapes:
     { missions: n }                      — total missions completed >= n
     { zoneComplete: zoneId }             — zone cleared
     { zoneFirstRate: zoneId, gte: 0.8 }  — zone cleared with first-try rate >= gte (checked on the zone event)
     { streak: n }                        — current streak >= n
     { stat: name, gte: n }               — s.stats[name] >= n (errorsSolved, helpOpened, missions, answered …)
     { skillFirst: skillId, gte: n }      — first-try correct answers on a skill >= n
     { typeFirst: widgetType, gte: n }    — first-try correct answers on a question type >= n
     { event: 'comeback' }                — a correct answer right after missing two in a row
     { event: 'perfect-mission' }         — mission finished with every answer right first try
     { event: 'enter', zone: zoneId }     — zone opened (used for optional zones)
*/
(function (root) {
  'use strict';
  const RX = root.RX;

  function zoneIndex(id) {
    return RX.ZONES.findIndex((z) => z.id === id);
  }
  function zoneDef(id) {
    return RX.ZONES[zoneIndex(id)];
  }
  function isZoneComplete(s, id) {
    const z = s.zones[id];
    return !!(z && z.completed);
  }
  function isUnlocked(s, id) {
    const z = zoneDef(id);
    if (z.optional) return isZoneComplete(s, z.unlockAfter);
    const i = zoneIndex(id);
    if (i === 0) return true;
    const core = RX.ZONES.filter((x) => !x.optional);
    const ci = core.findIndex((x) => x.id === id);
    // the final zone requires every core zone before it; other zones require the previous core zone
    if (z.final) return core.slice(0, ci).every((x) => isZoneComplete(s, x.id));
    return isZoneComplete(s, core[ci - 1].id);
  }
  function missionDone(s, zoneId, mId) {
    const z = s.zones[zoneId];
    return !!(z && z.missions[mId] && z.missions[mId].completed);
  }
  function zoneProgress(s, id) {
    const z = zoneDef(id);
    const done = z.missions.filter((m) => missionDone(s, id, m.id)).length;
    return { done, total: z.missions.length };
  }
  function overallProgress(s) {
    const core = RX.ZONES.filter((z) => !z.optional);
    let d = 0,
      t = 0;
    core.forEach((z) => {
      const p = zoneProgress(s, z.id);
      d += p.done;
      t += p.total;
    });
    return { done: d, total: t, pct: t ? Math.round((100 * d) / t) : 0 };
  }
  function nextZone(s) {
    return RX.ZONES.find((z) => !z.optional && !isZoneComplete(s, z.id)) || null;
  }
  function finalZone() {
    return RX.ZONES.find((z) => z.final) || RX.ZONES[RX.ZONES.length - 1];
  }
  function optionalZones() {
    return RX.ZONES.filter((z) => z.optional);
  }

  function ruleMet(s, w, ctx) {
    const st = s.stats;
    if (w.missions != null) return st.missions >= w.missions;
    if (w.zoneComplete) return isZoneComplete(s, w.zoneComplete);
    if (w.zoneFirstRate) return ctx.event === 'zone' && ctx.zone === w.zoneFirstRate && ctx.firstRate >= (w.gte == null ? 0.8 : w.gte);
    if (w.streak != null) return s.streak >= w.streak;
    if (w.stat) return (st[w.stat] || 0) >= w.gte;
    if (w.skillFirst) return ((st.skillFirst || {})[w.skillFirst] || 0) >= w.gte;
    if (w.typeFirst) return ((st.typeFirst || {})[w.typeFirst] || 0) >= w.gte;
    if (w.event === 'comeback') return ctx.event === 'answer' && ctx.correct && ctx.missRunBefore >= 2;
    if (w.event === 'perfect-mission') return ctx.event === 'mission' && ctx.first === ctx.total && ctx.total > 0;
    if (w.event === 'enter') return ctx.event === 'enter' && ctx.zone === w.zone;
    return false;
  }

  /** Evaluate every achievement rule against state + the triggering event. Returns newly unlocked ids. */
  function evaluate(s, ctx) {
    const unlocked = [];
    (RX.ACHIEVEMENTS || []).forEach((a) => {
      if (s.achievements[a.id]) return;
      if (a.when && ruleMet(s, a.when, ctx || {})) {
        s.achievements[a.id] = Date.now();
        unlocked.push(a.id);
      }
    });
    return unlocked;
  }

  function skillBand(rate) {
    return rate >= 0.8 ? 'Strong' : rate >= 0.5 ? 'Almost There' : 'Practice Again';
  }

  RX.Rules = {
    zoneIndex,
    zoneDef,
    isZoneComplete,
    isUnlocked,
    missionDone,
    zoneProgress,
    overallProgress,
    nextZone,
    finalZone,
    optionalZones,
    evaluate,
    skillBand,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — basic response widgets: mc/who/rep, ms, num, blanks, cloze, tf, error, cr. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const W = RX.Widgets || (RX.Widgets = {});
  const esc = RX.esc;

  function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function numInput(o) {
    o = o || {};
    const wrap = h(`<label class="fld ${o.width ? 'w-' + o.width : ''}">${o.label ? `<span class="fld-label">${o.label}</span>` : ''}<span class="fld-ctl">${o.prefix ? `<span class="fld-pre">${esc(o.prefix)}</span>` : ''}<input type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="${esc(o.aria || (o.label ? String(o.label).replace(/<[^>]+>/g, '') : 'answer'))}" placeholder="${esc(o.placeholder || '')}">${o.suffix ? `<span class="fld-suf">${esc(o.suffix)}</span>` : ''}</span></label>`);
    return wrap;
  }
  function bindEnter(host, ctx) { host.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); ctx.submit(); } }); }
  function inputsOf(host) { return Array.from(host.querySelectorAll('input[type="text"]')); }
  function disableAll(host, on) { host.querySelectorAll('input, button, select, textarea').forEach((n) => { n.disabled = on; }); host.classList.toggle('is-locked', on); }
  function markInputs(host, inputs, wrongIdx) { inputs.forEach((inp, i) => { inp.classList.toggle('is-wrong', wrongIdx.includes(i)); inp.classList.toggle('is-right', !wrongIdx.includes(i)); }); }
  RX.WUtil = { h, numInput, bindEnter, inputsOf, disableAll, markInputs };

  /** Choice list used by mc/who/rep (single) and ms (multi). */
  function choiceList(host, q, multi) {
    const list = h(`<div class="choices ${q.layout === 'cards' ? 'choices-cards' : ''}" role="${multi ? 'group' : 'radiogroup'}" aria-label="Answer choices"></div>`);
    const letters = 'ABCDEFGH';
    q.options.forEach((o, i) => {
      const b = h(`<button type="button" class="choice" role="${multi ? 'checkbox' : 'radio'}" aria-checked="false" data-i="${i}"><span class="choice-key">${letters[i]}</span><span class="choice-body">${o.title ? `<span class="choice-title">${esc(o.title)}</span>` : ''}<span class="choice-text">${o.html}</span></span></button>`);
      b.addEventListener('click', () => {
        if (b.disabled) return;
        if (multi) { const on = b.getAttribute('aria-checked') === 'true'; b.setAttribute('aria-checked', String(!on)); b.classList.toggle('is-selected', !on); }
        else { list.querySelectorAll('.choice').forEach((x) => { x.setAttribute('aria-checked', 'false'); x.classList.remove('is-selected'); }); b.setAttribute('aria-checked', 'true'); b.classList.add('is-selected'); }
      });
      list.appendChild(b);
    });
    host.appendChild(list);
    return {
      selected() { return Array.from(list.querySelectorAll('.choice[aria-checked="true"]')).map((b) => Number(b.dataset.i)); },
      lock() { list.querySelectorAll('.choice').forEach((b) => { b.disabled = true; }); },
      mark(correctIdx) { list.querySelectorAll('.choice').forEach((b) => { const i = Number(b.dataset.i); if (correctIdx.includes(i)) b.classList.add('is-correct'); else if (b.getAttribute('aria-checked') === 'true') b.classList.add('is-incorrect'); }); },
      clearMarks() { list.querySelectorAll('.choice').forEach((b) => b.classList.remove('is-incorrect')); },
    };
  }

  W.mc = W.who = W.rep = function (host, q) {
    const c = choiceList(host, q, false);
    return { getAnswer: () => c.selected()[0], canSubmit: () => c.selected().length === 1, setDisabled: (on) => { if (on) c.lock(); }, markResult: (res) => { if (!res.correct) c.clearMarks(); if (res.final) c.mark([q.answer]); else if (!res.correct) c.mark([]); }, focus: () => host.querySelector('.choice').focus() };
  };
  W.ms = function (host, q) {
    host.appendChild(h('<p class="hint-line">Select every answer that applies.</p>'));
    const c = choiceList(host, q, true);
    return { getAnswer: () => c.selected(), canSubmit: () => c.selected().length >= 1, setDisabled: (on) => { if (on) c.lock(); }, markResult: (res) => { c.clearMarks(); if (res.final) c.mark(q.answers); else if (!res.correct) c.mark([]); }, focus: () => host.querySelector('.choice').focus() };
  };

  W.num = function (host, q, ctx) {
    const f = numInput({ label: 'Your answer', suffix: q.unit, aria: 'Answer in ' + (q.unit || 'numbers'), placeholder: '' });
    f.classList.add('fld-single');
    host.appendChild(f);
    bindEnter(host, ctx);
    const inp = f.querySelector('input');
    return { getAnswer: () => inp.value, canSubmit: () => RX.parseNum(inp.value) != null, setDisabled: (on) => disableAll(host, on), markResult: (res) => { markInputs(host, [inp], res.correct ? [] : [0]); if (res.final && !res.correct) inp.value = String(q.answer); }, focus: () => inp.focus() };
  };

  W.blanks = function (host, q, ctx) {
    let wrap;
    if (q.layout === 'fraction') {
      wrap = h('<div class="blanks blanks-fraction"></div>');
      const fr = h('<div class="frac-input" aria-label="Fraction"></div>');
      q.fields.forEach((f, i) => { const n = numInput({ aria: f.label, width: 'sm' }); n.classList.add(i === 0 ? 'frac-top' : 'frac-bot'); fr.appendChild(n); if (i === 0) fr.appendChild(h('<div class="frac-bar" aria-hidden="true"></div>')); });
      wrap.appendChild(fr);
    } else if (q.template) {
      wrap = h('<div class="blanks blanks-sentences"></div>');
      const tpl = Array.isArray(q.template) ? q.template : [q.template];
      tpl.forEach((t) => {
        const p = h('<p class="sentence"></p>');
        t.split(/(\{\d+\})/).forEach((part) => { const m = part.match(/^\{(\d+)\}$/); if (m) { const f = q.fields[Number(m[1])]; p.appendChild(numInput({ aria: 'blank ' + (Number(m[1]) + 1), width: f.width || 'sm' })); } else p.appendChild(document.createTextNode(part)); });
        wrap.appendChild(p);
      });
    } else if (q.layout === 'two-col') {
      wrap = h('<div class="blanks blanks-two-col"></div>');
      const half = q.fields.length / 2;
      [0, 1].forEach((g) => { const col = h(`<div class="blanks-col"><h4>${esc(q.groups ? q.groups[g] : '')}</h4></div>`); q.fields.slice(g * half, (g + 1) * half).forEach((f) => col.appendChild(numInput(f))); wrap.appendChild(col); });
    } else {
      wrap = h('<div class="blanks"></div>');
      q.fields.forEach((f) => wrap.appendChild(numInput(f)));
    }
    host.appendChild(wrap);
    bindEnter(host, ctx);
    // inputs in DOM order correspond to field index for every layout except template (handled by order of {i} appearances)
    let inputs = inputsOf(host);

<script>
/* Grade 6 Review Expeditions — model widgets: table, match, sort, seq, plot, dnl, tape. */
(function (root) {
  'use strict';
  const RX = root.RX;

  const { h, numInput, bindEnter, disableAll, markInputs } = RX.WUtil;
  const esc = RX.esc;

  W.table = function (host, q, ctx) {

  };

  W.match = function (host, q) {

    const L = wrap.querySelector('.match-left'), R = wrap.querySelector('.match-right');
    const pairs = new Map(); // leftIdx -> rightIdx
    let pendingL = null;
    const COLORS = ['#1FA6A2', '#F2A33A', '#3B6FB6', '#C8553D', '#6B7F3A', '#17324D'];
    const render = () => {
      L.querySelectorAll('.match-item').forEach((b) => { const i = Number(b.dataset.i); const r = pairs.get(i); b.classList.toggle('is-pending', pendingL === i); b.classList.toggle('is-paired', r != null); b.style.setProperty('--pair', r != null ? COLORS[i % COLORS.length] : 'transparent'); b.querySelector('.badge').textContent = r != null ? String(i + 1) : ''; });

    };
    q.left.forEach((txt, i) => { const b = h(`<button type="button" class="match-item" data-i="${i}"><span class="badge" aria-hidden="true"></span><span>${txt}</span></button>`); b.addEventListener('click', () => { if (b.disabled) return; if (pairs.has(i)) { pairs.delete(i); pendingL = i; } else pendingL = pendingL === i ? null : i; render(); }); L.appendChild(b); });
    q.right.forEach((txt, j) => { const b = h(`<button type="button" class="match-item" data-i="${j}"><span class="badge" aria-hidden="true"></span><span>${txt}</span></button>`); b.addEventListener('click', () => { if (b.disabled) return; let owner = null; pairs.forEach((rv, lk) => { if (rv === j) owner = lk; }); if (owner != null) { pairs.delete(owner); pendingL = owner; render(); return; } if (pendingL == null) return; pairs.set(pendingL, j); pendingL = null; render(); }); R.appendChild(b); });
    host.appendChild(h('<p class="hint-line">Click a term, then click its meaning. Click a matched item to undo.</p>'));
    host.appendChild(wrap);
    render();
    return { getAnswer: () => Array.from(pairs.entries()), canSubmit: () => pairs.size === q.left.length, setDisabled: (on) => disableAll(host, on), markResult: (res) => { L.querySelectorAll('.match-item').forEach((b) => { const i = Number(b.dataset.i); const bad = !res.correct && res.detail.wrong.includes(i); b.classList.toggle('is-incorrect', bad); }); if (res.final) { pairs.clear(); q.pairs.forEach(([l, r]) => pairs.set(l, r)); render(); L.querySelectorAll('.match-item').forEach((b) => b.classList.remove('is-incorrect')); } }, focus: () => L.querySelector('.match-item').focus() };
  };

  W.sort = function (host, q) {
    const wrap = h(`<div class="sort"><div class="sort-pool" aria-label="Items to sort"><div class="sort-title">Items</div><div class="sort-items" data-bin="pool"></div></div><div class="sort-bins">${q.bins.map((b, i) => `<div class="sort-bin" data-bin="${i}"><div class="sort-title">${esc(b)}</div><div class="sort-items" data-bin="${i}"></div></div>`).join('')}</div></div>`);
    host.appendChild(h('<p class="hint-line">Click an item, then click a category. Or drag it. Click a sorted item to send it back.</p>'));
    host.appendChild(wrap);
    const place = {}; let pending = null;
    const items = q.items.map((it, i) => { const b = h(`<button type="button" class="sort-item" draggable="true" data-i="${i}"><span>${it.html}</span></button>`); b.addEventListener('click', () => { if (b.disabled) return; if (place[i] != null) { delete place[i]; pending = null; render(); return; } pending = pending === i ? null : i; render(); }); b.addEventListener('dragstart', (e) => { if (b.disabled) { e.preventDefault(); return; } e.dataTransfer.setData('text/plain', String(i)); pending = i; b.classList.add('is-dragging'); }); b.addEventListener('dragend', () => b.classList.remove('is-dragging')); return b; });

    const pool = wrap.querySelector('.sort-pool'); pool.addEventListener('dragover', (e) => e.preventDefault()); pool.addEventListener('drop', (e) => { e.preventDefault(); const i = Number(e.dataTransfer.getData('text/plain')); if (!Number.isNaN(i)) { delete place[i]; pending = null; render(); } });
    render();
    return { getAnswer: () => Object.assign({}, place), canSubmit: () => Object.keys(place).length === q.items.length, setDisabled: (on) => { disableAll(host, on); items.forEach((b) => { b.draggable = !on; }); }, markResult: (res) => { items.forEach((b, i) => { const bad = !res.correct && res.detail.wrong.includes(i); b.classList.toggle('is-incorrect', bad); b.classList.toggle('is-correct', res.final && !bad); }); if (res.final) { q.items.forEach((it, i) => { place[i] = it.bin; }); render(); items.forEach((b) => b.classList.remove('is-incorrect')); } }, focus: () => items[0].focus() };
  };

  W.seq = function (host, q) {
    let order = q.items.map((_, i) => i);
    if (order.every((v, i) => v === q.order[i])) order.reverse();
    if (order.every((v, i) => v === q.order[i])) order = [order[1], order[0]].concat(order.slice(2));
    const list = h('<ol class="seq" aria-label="Ordered list"></ol>');

        const li = h(`<li class="seq-item" draggable="true" data-pos="${pos}"><span class="seq-num">${pos + 1}</span><div class="seq-body">${q.items[idx].html}</div><div class="seq-ctl"><button type="button" class="seq-up" aria-label="Move up" ${pos === 0 ? 'disabled' : ''}>▲</button><button type="button" class="seq-down" aria-label="Move down" ${pos === order.length - 1 ? 'disabled' : ''}>▼</button></div></li>`);
        li.querySelector('.seq-up').addEventListener('click', () => { [order[pos - 1], order[pos]] = [order[pos], order[pos - 1]]; render(); list.querySelectorAll('.seq-up')[pos - 1].focus(); });
        li.querySelector('.seq-down').addEventListener('click', () => { [order[pos + 1], order[pos]] = [order[pos], order[pos + 1]]; render(); list.querySelectorAll('.seq-down')[pos + 1].focus(); });
        li.addEventListener('dragstart', (e) => { if (host.classList.contains('is-locked')) { e.preventDefault(); return; } dragFrom = pos; e.dataTransfer.setData('text/plain', String(pos)); li.classList.add('is-dragging'); });
        li.addEventListener('dragover', (e) => { e.preventDefault(); li.classList.add('is-over'); });
        li.addEventListener('dragleave', () => li.classList.remove('is-over'));
        li.addEventListener('drop', (e) => { e.preventDefault(); if (dragFrom == null) return; const [m] = order.splice(dragFrom, 1); order.splice(pos, 0, m); dragFrom = null; render(); });

    return { getAnswer: () => order.slice(), canSubmit: () => true, setDisabled: (on) => { disableAll(host, on); list.querySelectorAll('.seq-item').forEach((li) => { li.draggable = !on; }); }, markResult: (res) => { if (res.final && !res.correct) { order = q.order.slice(); render(); list.querySelectorAll('.seq-item').forEach((li) => li.classList.add('is-correct')); } else list.querySelectorAll('.seq-item').forEach((li, pos) => li.classList.toggle('is-incorrect', !res.correct && order[pos] !== q.order[pos])); }, focus: () => list.querySelector('button:not([disabled])').focus() };
  };

  W.plot = function (host, q) {
    const size = 340, pad = { l: 54, r: 18, t: 18, b: 50 };
    const px = (x) => pad.l + (x / q.xMax) * (size - pad.l - pad.r), py = (y) => size - pad.b - (y / q.yMax) * (size - pad.t - pad.b);

    const base = RX.V.graph({ xLabel: q.xLabel, yLabel: q.yLabel, xMax: q.xMax, yMax: q.yMax, yStep: ys, size, series: [] });
    const wrap = h(`<div class="plot"><div class="plot-stage">${base}</div><div class="plot-status" aria-live="polite"></div></div>`);
    host.appendChild(wrap);
    const svg = wrap.querySelector('svg'); svg.classList.add('plot-svg'); svg.setAttribute('role', 'group'); svg.setAttribute('aria-label', 'Coordinate grid. Choose grid points to place them.'); svg.setAttribute('width', '100%'); svg.removeAttribute('height');

    const hits = document.createElementNS(ns, 'g'); svg.appendChild(hits);

    const refresh = () => { layer.innerHTML = ''; pts.forEach((p) => { const c = document.createElementNS(ns, 'circle'); c.setAttribute('cx', px(p[0])); c.setAttribute('cy', py(p[1])); c.setAttribute('r', 7); c.setAttribute('class', 'plot-pt'); layer.appendChild(c); const t = document.createElementNS(ns, 'text'); t.setAttribute('x', px(p[0]) + 9); t.setAttribute('y', py(p[1]) - 8); t.setAttribute('class', 'plot-lbl'); t.textContent = `(${p[0]}, ${p[1]})`; layer.appendChild(t); }); status.textContent = `${pts.size} of ${q.count} points placed`; };
    let locked = false;
    for (let x = 0; x <= q.xMax; x++) for (let y = 0; y <= q.yMax; y += 1) {
      const c = document.createElementNS(ns, 'circle'); c.setAttribute('cx', px(x)); c.setAttribute('cy', py(y)); c.setAttribute('r', Math.max(5, Math.min(11, (size - pad.t - pad.b) / q.yMax / 2.1))); c.setAttribute('class', 'plot-hit'); c.setAttribute('tabindex', '0'); c.setAttribute('role', 'button'); c.setAttribute('aria-label', `Point (${x}, ${y})`);

  };

  W.dnl = function (host, q, ctx) {

    const ticks = wrap.querySelector('.dnl-ticks');

  };

  W.tape = function (host, q, ctx) {

    const inputs = {};
    const draw = () => { const box = inputs.box ? RX.parseNum(inputs.box.value) : null; viz.innerHTML = RX.V.tape(q.rows.map((r, ri) => ({ label: r.label, boxes: r.boxes, value: box != null ? box : '?', total: ri === 0 && given.rowA != null ? given.rowA : null })), { boxW: 46, labelW: 110 }) + (q.total != null ? `<div class="tape-total">Total: <b>${q.total}</b></div>` : ''); };

<script>
/* Grade 6 Review Expeditions — extra widgets + checkers: nl (number-line placement), ineq (graph an inequality),
   shade (shade a grid), and a four-quadrant upgrade of plot. Checkers are pure and shared with the Node verifier. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const C = RX.checkers;
  const { parseNum, near } = RX;

  // ---------- Checkers ----------
  /** q: {min,max,step,points:[v...],count, tolerance} ; answer: [v...] */
  C.nl = function (q, a) {
    a = Array.isArray(a) ? a : [];
    const tol = q.tolerance == null ? (q.step || 1) / 4 : q.tolerance;
    const missing = q.points.filter((p) => !a.some((v) => near(v, p, tol)));
    const extra = a.filter((v) => !q.points.some((p) => near(v, p, tol)));
    return { correct: missing.length === 0 && extra.length === 0 && a.length === q.points.length, detail: { missing, extra } };
  };
  /** q: {min,max,step,point,open:boolean,dir:'left'|'right'} ; answer: {point, open, dir} */
  C.ineq = function (q, a) {
    a = a || {};
    const pointOk = a.point != null && near(a.point, q.point, (q.step || 1) / 4);
    const openOk = a.open === q.open;
    const dirOk = a.dir === q.dir;
    return { correct: pointOk && openOk && dirOk, detail: { pointOk, openOk, dirOk } };
  };
  /** q: {cells, count} ; answer: number of shaded cells */
  C.shade = function (q, a) {
    const n = Number(a);
    return { correct: n === q.count, detail: { value: n } };
  };

  if (typeof document === 'undefined') return; // Node verifier stops here

  const W = RX.Widgets;
  const { h, disableAll } = RX.WUtil;
  const ns = 'http://www.w3.org/2000/svg';
  const fmtN = (n) => (Number.isInteger(n) ? String(n) : String(Math.round(n * 1000) / 1000));

  /** Shared interactive number line. Returns {svg, x(v), ticks:[v], layer, hits, lock(on)} */
  function buildLine(host, q, onTick) {
    const w = 560,
      padL = 30,
      padR = 30,
      y = 56,
      hgt = 100;
    const x = (v) => padL + ((v - q.min) / (q.max - q.min)) * (w - padL - padR);
    const stage = h(`<div class="nl-stage">${RX.V.numberLine({ min: q.min, max: q.max, step: q.step, labelEvery: q.labelEvery, width: w, ticksOnly: !!q.ticksOnly })}</div>`);
    host.appendChild(stage);
    const svg = stage.querySelector('svg');
    svg.classList.add('nl-svg');
    svg.setAttribute('role', 'group');
    svg.setAttribute('aria-label', `Number line from ${q.min} to ${q.max}. Each tick is ${q.step}. Choose a tick to place a point.`);
    svg.setAttribute('width', '100%');
    svg.removeAttribute('height');
    svg.setAttribute('viewBox', `0 0 ${w} ${hgt}`);
    const layer = document.createElementNS(ns, 'g');
    svg.appendChild(layer);
    const hits = document.createElementNS(ns, 'g');
    svg.appendChild(hits);
    const ticks = [];
    const n = Math.round((q.max - q.min) / q.step);
    let locked = false;
    for (let i = 0; i <= n; i++) {
      const v = Math.round((q.min + i * q.step) * 1000) / 1000;
      ticks.push(v);
      const c = document.createElementNS(ns, 'rect');
      c.setAttribute('x', x(v) - 11);
      c.setAttribute('y', y - 22);
      c.setAttribute('width', 22);
      c.setAttribute('height', 44);
      c.setAttribute('rx', 6);
      c.setAttribute('class', 'nl-hit');
      c.setAttribute('tabindex', '0');
      c.setAttribute('role', 'button');
      c.setAttribute('aria-label', `Point at ${fmtN(v)}`);
      const go = () => {
        if (!locked) onTick(v);
      };
      c.addEventListener('click', go);
      c.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          go();
        }
      });
      hits.appendChild(c);
    }
    return {
      svg,
      x,
      y,
      ticks,
      layer,
      hits,
      lock(on) {
        locked = on;
        svg.classList.toggle('is-locked', on);
      },
    };
  }
  const circle = (cx, cy, r, cls) => {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', cx);
    c.setAttribute('cy', cy);
    c.setAttribute('r', r);
    c.setAttribute('class', cls);
    return c;
  };
  const text = (x, y, t, cls) => {
    const e = document.createElementNS(ns, 'text');
    e.setAttribute('x', x);
    e.setAttribute('y', y);
    e.setAttribute('class', cls);
    e.setAttribute('text-anchor', 'middle');
    e.textContent = t;
    return e;
  };

  /** Place `count` points on a number line. q: {min,max,step,labelEvery,count,points,labels?:[...]} */
  W.nl = function (host, q) {
    const pts = [];
    const wrap = h('<div class="nl-w"></div>');
    host.appendChild(wrap);
    const status = h('<div class="plot-status" aria-live="polite"></div>');
    const L = buildLine(wrap, q, (v) => {
      const i = pts.indexOf(v);
      if (i >= 0) pts.splice(i, 1);
      else {
        if (pts.length >= q.count) {
          status.textContent = `You already placed ${q.count} point${q.count > 1 ? 's' : ''}. Click a point to remove it first.`;
          return;
        }
        pts.push(v);
      }
      refresh();
    });
    wrap.appendChild(status);
    const refresh = () => {
      L.layer.innerHTML = '';
      pts.forEach((v, i) => {
        L.layer.appendChild(circle(L.x(v), L.y, 8, 'nl-pt'));
        L.layer.appendChild(text(L.x(v), L.y - 16, q.labels && q.labels[i] != null ? q.labels[i] : fmtN(v), 'nl-lbl'));
      });
      status.textContent = `${pts.length} of ${q.count} point${q.count > 1 ? 's' : ''} placed`;
    };
    refresh();
    return {
      getAnswer: () => pts.slice(),
      canSubmit: () => pts.length === q.count,
      setDisabled: (on) => L.lock(on),
      markResult: (res) => {
        if (res.final && !res.correct) {
          pts.length = 0;
          q.points.forEach((p) => pts.push(p));
          refresh();
          L.layer.querySelectorAll('.nl-pt').forEach((c) => c.classList.add('is-correct'));
        } else if (!res.correct) {
          L.layer.querySelectorAll('.nl-pt').forEach((c, i) => {
            if (res.detail.extra.includes(pts[i])) c.classList.add('is-incorrect');
          });
        }
      },
      focus: () => L.hits.firstChild.focus(),
    };
  };

  /** Graph an inequality: pick the boundary point, open/closed, and the direction. q: {min,max,step,labelEvery,point,open,dir,variable} */
  W.ineq = function (host, q) {
    const st = { point: null, open: null, dir: null };
    const wrap = h(
      `<div class="ineq-w"><div class="ineq-ctl" role="group" aria-label="Circle type"><span class="ineq-k">Circle</span><button type="button" class="tf-btn" data-open="false">● Closed (includes the number)</button><button type="button" class="tf-btn" data-open="true">○ Open (does not include it)</button></div><div class="ineq-ctl" role="group" aria-label="Direction"><span class="ineq-k">Shade</span><button type="button" class="tf-btn" data-dir="left">◀ To the left (less than)</button><button type="button" class="tf-btn" data-dir="right">To the right (greater than) ▶</button></div><p class="hint-line">Click the number line where the boundary point goes.</p></div>`,
    );
    host.appendChild(wrap);
    const status = h('<div class="plot-status" aria-live="polite"></div>');
    const L = buildLine(wrap, q, (v) => {
      st.point = st.point === v ? null : v;
      refresh();
    });
    wrap.appendChild(status);
    const refresh = () => {
      L.layer.innerHTML = '';
      if (st.point != null) {
        if (st.dir) {
          const ln = document.createElementNS(ns, 'line');
          ln.setAttribute('x1', L.x(st.point));
          ln.setAttribute('x2', st.dir === 'right' ? 560 - 16 : 16);
          ln.setAttribute('y1', L.y);
          ln.setAttribute('y2', L.y);
          ln.setAttribute('class', 'ineq-ray');
          L.layer.appendChild(ln);
        }
        const c = circle(L.x(st.point), L.y, 9, 'ineq-pt' + (st.open ? ' is-open' : ''));
        L.layer.appendChild(c);
        L.layer.appendChild(text(L.x(st.point), L.y - 18, fmtN(st.point), 'nl-lbl'));
      }
      wrap.querySelectorAll('[data-open]').forEach((b) => {
        const on = st.open != null && String(st.open) === b.dataset.open;
        b.classList.toggle('is-selected', on);
        b.setAttribute('aria-pressed', String(on));
      });
      wrap.querySelectorAll('[data-dir]').forEach((b) => {
        const on = st.dir === b.dataset.dir;
        b.classList.toggle('is-selected', on);
        b.setAttribute('aria-pressed', String(on));
      });
      status.textContent =
        st.point == null
          ? 'No boundary point yet.'
          : `Boundary at ${fmtN(st.point)}${st.open == null ? '' : st.open ? ', open circle' : ', closed circle'}${st.dir ? ', shaded to the ' + st.dir : ''}.`;
    };
    wrap.querySelectorAll('[data-open]').forEach((b) =>
      b.addEventListener('click', () => {
        if (b.disabled) return;
        st.open = b.dataset.open === 'true';
        refresh();
      }),
    );
    wrap.querySelectorAll('[data-dir]').forEach((b) =>
      b.addEventListener('click', () => {
        if (b.disabled) return;
        st.dir = b.dataset.dir;
        refresh();
      }),
    );
    refresh();
    return {
      getAnswer: () => Object.assign({}, st),
      canSubmit: () => st.point != null && st.open != null && !!st.dir,
      setDisabled: (on) => {
        L.lock(on);
        disableAll(wrap, on);
      },
      markResult: (res) => {
        wrap.querySelectorAll('[data-open]').forEach((b) => b.classList.toggle('is-incorrect', !res.detail.openOk && b.classList.contains('is-selected')));
        wrap.querySelectorAll('[data-dir]').forEach((b) => b.classList.toggle('is-incorrect', !res.detail.dirOk && b.classList.contains('is-selected')));
        if (res.final && !res.correct) {
          st.point = q.point;
          st.open = q.open;
          st.dir = q.dir;
          refresh();
          L.layer.querySelectorAll('.ineq-pt, .ineq-ray').forEach((c) => c.classList.add('is-correct'));
          wrap.querySelectorAll('.tf-btn').forEach((b) => b.classList.remove('is-incorrect'));
        } else if (!res.detail.pointOk) L.layer.querySelectorAll('.ineq-pt').forEach((c) => c.classList.add('is-incorrect'));
      },
      focus: () => wrap.querySelector('.tf-btn').focus(),
    };
  };

  /** Shade cells of a grid. q: {cells:100|10|..., cols, count, label} */
  W.shade = function (host, q) {
    const cells = q.cells || 100,
      cols = q.cols || 10,
      size = 240,
      cw = size / cols,
      rows = Math.ceil(cells / cols);
    const wrap = h(
      `<div class="shade-w"><svg class="shade-svg" viewBox="0 0 ${size} ${(size / cols) * rows}" role="group" aria-label="Grid of ${cells} squares"></svg><div class="plot-status" aria-live="polite"></div><div class="shade-tools"><button type="button" class="btn btn-ghost btn-sm" data-fill="row">Shade a full row</button><button type="button" class="btn btn-ghost btn-sm" data-fill="clear">Clear</button></div></div>`,
    );
    host.appendChild(wrap);
    const svg = wrap.querySelector('svg'),
      status = wrap.querySelector('.plot-status');
    const on = new Set();
    let locked = false;
    const rects = [];
    for (let i = 0; i < cells; i++) {
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', (i % cols) * cw);
      r.setAttribute('y', Math.floor(i / cols) * cw);
      r.setAttribute('width', cw);
      r.setAttribute('height', cw);
      r.setAttribute('class', 'shade-cell');
      r.setAttribute('tabindex', '0');
      r.setAttribute('role', 'checkbox');
      r.setAttribute('aria-checked', 'false');
      r.setAttribute('aria-label', `Square ${i + 1}`);
      const t = () => {
        if (locked) return;
        if (on.has(i)) on.delete(i);
        else on.add(i);
        refresh();
      };
      r.addEventListener('click', t);
      r.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          t();
        }
      });
      svg.appendChild(r);
      rects.push(r);
    }
    const refresh = () => {
      rects.forEach((r, i) => {
        r.classList.toggle('is-on', on.has(i));
        r.setAttribute('aria-checked', String(on.has(i)));
      });
      status.textContent = `${on.size} of ${cells} squares shaded${q.label ? ' · ' + q.label : ''}`;
    };
    wrap.querySelector('[data-fill="row"]').addEventListener('click', () => {
      if (locked) return;
      for (let r = 0; r < rows; r++) {
        const rowIdx = Array.from({ length: cols }, (_, k) => r * cols + k).filter((i) => i < cells);
        if (rowIdx.some((i) => !on.has(i))) {
          rowIdx.forEach((i) => on.add(i));
          break;
        }
      }
      refresh();
    });
    wrap.querySelector('[data-fill="clear"]').addEventListener('click', () => {
      if (locked) return;
      on.clear();
      refresh();
    });
    refresh();
    return {
      getAnswer: () => on.size,
      canSubmit: () => on.size > 0,
      setDisabled: (o) => {
        locked = o;
        disableAll(wrap, o);
        svg.classList.toggle('is-locked', o);
      },
      markResult: (res) => {
        if (res.final && !res.correct) {
          on.clear();
          for (let i = 0; i < q.count; i++) on.add(i);
          refresh();
          svg.classList.add('is-shown');
        }
      },
      focus: () => rects[0].focus(),
    };
  };

  // ---------- Four-quadrant plot (upgrade of W.plot: honors q.xMin / q.yMin) ----------
  const plot0 = W.plot;
  W.plot = function (host, q) {
    if (!q.xMin && !q.yMin) return plot0(host, q);
    const size = 360,
      pad = { l: 30, r: 18, t: 18, b: 30 };
    const px = (x) => pad.l + ((x - q.xMin) / (q.xMax - q.xMin)) * (size - pad.l - pad.r),
      py = (y) => size - pad.b - ((y - q.yMin) / (q.yMax - q.yMin)) * (size - pad.t - pad.b);
    const base = RX.V.graph({
      xLabel: q.xLabel,
      yLabel: q.yLabel,
      xMin: q.xMin,
      xMax: q.xMax,
      yMin: q.yMin,
      yMax: q.yMax,
      size,
      series: q.given ? [{ points: q.given, color: '#5B6B7A', labels: q.givenLabels }] : [],
    });
    const wrap = h(`<div class="plot"><div class="plot-stage">${base}</div><div class="plot-status" aria-live="polite"></div></div>`);
    host.appendChild(wrap);
    const svg = wrap.querySelector('svg');
    svg.classList.add('plot-svg');
    svg.setAttribute('role', 'group');
    svg.setAttribute('aria-label', 'Coordinate grid. Choose grid points to place them.');
    svg.setAttribute('width', '100%');
    svg.removeAttribute('height');
    const pts = new Map();
    const key = (x, y) => x + ',' + y;
    const layer = document.createElementNS(ns, 'g');
    svg.appendChild(layer);
    const hits = document.createElementNS(ns, 'g');
    svg.appendChild(hits);
    const status = wrap.querySelector('.plot-status');
    const refresh = () => {
      layer.innerHTML = '';
      pts.forEach((p) => {
        layer.appendChild(circle(px(p[0]), py(p[1]), 6.5, 'plot-pt'));
        const t = text(px(p[0]) + 18, py(p[1]) - 8, `(${p[0]}, ${p[1]})`, 'plot-lbl');
        layer.appendChild(t);
      });
      status.textContent = `${pts.size} of ${q.count} points placed`;
    };
    let locked = false;
    for (let x = q.xMin; x <= q.xMax; x++)
      for (let y = q.yMin; y <= q.yMax; y++) {
        const c = circle(px(x), py(y), Math.max(5, Math.min(10, (size - pad.t - pad.b) / (q.yMax - q.yMin) / 2.1)), 'plot-hit');
        c.setAttribute('tabindex', '0');
        c.setAttribute('role', 'button');
        c.setAttribute('aria-label', `Point (${x}, ${y})`);
        const toggle = () => {
          if (locked) return;
          const k = key(x, y);
          if (pts.has(k)) pts.delete(k);
          else {
            if (pts.size >= q.count) {
              status.textContent = `You already placed ${q.count} points. Remove one first.`;
              return;
            }
            pts.set(k, [x, y]);
          }
          refresh();
        };
        c.addEventListener('click', toggle);
        c.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggle();
          }
        });
        hits.appendChild(c);
      }
    refresh();
    return {
      getAnswer: () => Array.from(pts.values()),
      canSubmit: () => pts.size === q.count,
      setDisabled: (on) => {
        locked = on;
        svg.classList.toggle('is-locked', on);
      },
      markResult: (res) => {
        if (res.final && !res.correct) {
          pts.clear();
          q.points.forEach((p) => pts.set(key(p[0], p[1]), p));
          refresh();
          layer.querySelectorAll('.plot-pt').forEach((c) => c.classList.add('is-correct'));
        } else if (!res.correct) {
          const arr = Array.from(pts.values());
          layer.querySelectorAll('.plot-pt').forEach((c, i) => {
            const p = arr[i];
            if (res.detail.extra.some((e) => e[0] === p[0] && e[1] === p[1])) c.classList.add('is-incorrect');
          });
        }
      },
      focus: () => hits.firstChild.focus(),
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — screens, HUD, map, modals, toasts. No game logic here. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { esc, icon } = RX;
  const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  let refs = {};
  let modalStack = [];

  function mount() { refs = { hud: document.getElementById('hud'), screen: document.getElementById('screen'), modal: document.getElementById('modal-root'), toast: document.getElementById('toast-root') }; document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1].close(); }); }

  function screen(name, html) {
    const s = refs.screen; s.classList.remove('enter'); void s.offsetWidth; s.dataset.screen = name; s.innerHTML = html; s.classList.add('enter'); root.scrollTo(0, 0);
    const first = s.querySelector('[autofocus]'); if (first) first.focus();
    return s;
  }

  function hud(o) {
    if (!o) { refs.hud.innerHTML = ''; refs.hud.hidden = true; return; }
    refs.hud.hidden = false;
    refs.hud.innerHTML = `<div class="hud-inner"><button type="button" class="hud-brand" data-act="map" aria-label="Back to the map">${icon('map')}<span>${esc(RX.UNIT.brand)}</span></button>${RX.UNIT.hubUrl ? `<a class="hud-atlas" href="${esc(RX.UNIT.hubUrl)}" aria-label="Back to the Expedition Atlas">${icon('atlas')}<span>Atlas</span></a>` : ''}
      <div class="hud-mid">${o.title ? `<span class="hud-zone">${esc(o.title)}</span>` : ''}${o.sub ? `<span class="hud-sub">${esc(o.sub)}</span>` : ''}${o.dots ? `<div class="hud-dots" role="img" aria-label="Question ${Math.max(1, o.dots.indexOf('now') + 1)} of ${o.dots.length}: ${o.dots.filter((d) => d === 'done').length} correct so far">${o.dots.map((d) => `<span class="dot ${d}"></span>`).join('')}</div>` : ''}</div>
      <div class="hud-right"><span class="hud-stat" title="Experience points">${icon('xp')}<b>${o.xp}</b> XP</span><span class="hud-stat ${o.streak >= 3 ? 'hot' : ''}" title="Streak">${icon('flame')}<b>${o.streak}</b></span>
      <button type="button" class="hud-btn" data-act="guide" aria-label="Field Guide">${icon('book')}<span>Field Guide</span></button><button type="button" class="hud-btn" data-act="settings" aria-label="Settings">${icon('settings')}</button></div></div>`;
  }

  function modal(o) {
    const back = h(`<div class="modal-back" role="presentation"><div class="modal ${o.wide ? 'modal-wide' : ''} ${o.cls || ''}" role="dialog" aria-modal="true" aria-labelledby="m-title-${modalStack.length}"><div class="modal-head"><h2 id="m-title-${modalStack.length}">${o.title}</h2>${o.noClose ? '' : `<button type="button" class="modal-x" aria-label="Close">${icon('x')}</button>`}</div><div class="modal-body">${o.body || ''}</div>${o.actions && o.actions.length ? `<div class="modal-actions">${o.actions.map((a, i) => `<button type="button" class="btn ${a.cls || 'btn-ghost'}" data-i="${i}">${a.label}</button>`).join('')}</div>` : ''}</div></div>`);
    const prevFocus = document.activeElement;
    const entry = { close() { back.classList.add('leaving'); setTimeout(() => back.remove(), 160); modalStack = modalStack.filter((m) => m !== entry); if (o.onClose) o.onClose(); if (prevFocus && prevFocus.focus) prevFocus.focus(); } };
    modalStack.push(entry);
    back.addEventListener('click', (e) => { if (e.target === back && !o.noClose) entry.close(); });
    const x = back.querySelector('.modal-x'); if (x) x.addEventListener('click', entry.close);
    (o.actions || []).forEach((a, i) => back.querySelector(`.modal-actions [data-i="${i}"]`).addEventListener('click', () => { const r = a.onClick ? a.onClick(entry) : null; if (r !== false && !a.keep) entry.close(); }));
    refs.modal.appendChild(back);
    const f = back.querySelector('.modal-actions .btn-primary, .modal-actions .btn, .modal-x, [tabindex], input, button'); if (f) setTimeout(() => f.focus(), 30);
    // focus trap
    back.addEventListener('keydown', (e) => { if (e.key !== 'Tab') return; const items = Array.from(back.querySelectorAll('button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])')); if (!items.length) return; const first = items[0], last = items[items.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } });
    entry.el = back;
    return entry;
  }
  function confirm(title, body, okLabel) { return new Promise((res) => { modal({ title, body, actions: [{ label: 'Cancel', onClick: () => res(false) }, { label: okLabel || 'Yes', cls: 'btn-danger', onClick: () => res(true) }], onClose: () => res(false) }); }); }
  function toast(msg, kind) { const t = h(`<div class="toast ${kind || ''}" role="status">${msg}</div>`); refs.toast.appendChild(t); setTimeout(() => t.classList.add('show'), 10); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2800); }

  /** Read text aloud. lang 'es' picks a Spanish voice when the device has one. */
  function speak(text, lang) {
    try {
      if (!root.speechSynthesis) return;
      root.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g, ' ').trim());
      u.rate = 0.95;
      if (lang === 'es') {
        u.lang = 'es-US';
        const v = root.speechSynthesis.getVoices().find((x) => /^es(-|_)/i.test(x.lang));
        if (v) u.voice = v;
      }
      root.speechSynthesis.speak(u);
    } catch (e) { /* unsupported */ }
  }

  // ---------- Map ----------
  /** Node positions (percent of the map canvas). A pack may supply RX.UNIT.mapPositions; otherwise a serpentine route is generated. */
  function nodePositions() {
    if (RX.UNIT.mapPositions) return RX.UNIT.mapPositions;
    const core = RX.ZONES.filter((z) => !z.optional);
    const pos = {};
    const n = core.length;
    const ys = [78, 46, 70, 36, 62, 30, 58, 26, 52, 22, 48, 18];
    core.forEach((z, i) => {
      const x = n === 1 ? 50 : 7 + (86 * i) / (n - 1);
      pos[z.id] = [Math.round(x), z.final ? 12 : ys[i % ys.length]];
    });
    RX.ZONES.filter((z) => z.optional).forEach((z, k) => {
      const anchor = pos[z.unlockAfter] || [50, 50];
      pos[z.id] = [Math.min(92, anchor[0] + 6 + k * 10), Math.min(94, anchor[1] + 22)];
    });
    return pos;
  }
  const curve = (pts) => pts.map((p, i) => (i === 0 ? `M${p[0] * 10},${p[1] * 5}` : `C${pts[i - 1][0] * 10 + 60},${pts[i - 1][1] * 5} ${p[0] * 10 - 60},${p[1] * 5} ${p[0] * 10},${p[1] * 5}`)).join(' ');
  function mapSvg(s) {
    const NODE_POS = nodePositions();
    const core = RX.ZONES.filter((z) => !z.optional);
    const pts = core.map((z) => NODE_POS[z.id]);
    const path = curve(pts);
    let doneUpTo = 0; core.forEach((z, i) => { if (RX.Rules.isZoneComplete(s, z.id)) doneUpTo = i + 1; });
    const donePath = curve(pts.slice(0, Math.max(1, doneUpTo + 1)));
    const side = RX.ZONES.filter((z) => z.optional).map((z) => { const a = NODE_POS[z.unlockAfter], b = NODE_POS[z.id]; return `<path d="M${a[0] * 10},${a[1] * 5} C${a[0] * 10 + 20},${a[1] * 5 + 60} ${b[0] * 10 - 20},${b[1] * 5 - 40} ${b[0] * 10},${b[1] * 5}" class="map-path map-path-side"/>`; }).join('');
    return `<svg class="map-svg" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="topo" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M0 60c30-20 60 20 120 0M0 90c30-20 60 20 120 0M0 30c30-20 60 20 120 0" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1.5"/></pattern></defs>
      <rect width="1000" height="500" fill="url(#topo)"/>
      <path d="M0 420 L120 300 L220 360 L340 250 L470 300 L600 180 L720 240 L860 120 L1000 160 L1000 500 L0 500Z" fill="rgba(255,255,255,.035)"/>
      <path d="${path}" class="map-path" /><path d="${donePath}" class="map-path-done" style="${doneUpTo === 0 ? 'display:none' : ''}"/>${side}</svg>`;
  }
  function mapNodes(s) {
    const NODE_POS = nodePositions();
    return RX.ZONES.map((z) => {
      const [x, y] = NODE_POS[z.id];
      const unlocked = RX.Rules.isUnlocked(s, z.id), done = RX.Rules.isZoneComplete(s, z.id), p = RX.Rules.zoneProgress(s, z.id);
      const next = RX.Rules.nextZone(s); const isCurrent = next && next.id === z.id;
      const cls = ['map-node', done ? 'is-done' : '', unlocked ? '' : 'is-locked', isCurrent ? 'is-current' : '', z.optional ? 'is-optional' : '', z.final ? 'is-final' : ''].join(' ');
      return `<button type="button" class="${cls}" style="left:${x}%;top:${y}%;--accent:${z.accent}" data-zone="${z.id}" ${unlocked ? '' : 'aria-disabled="true"'} aria-label="${esc(z.name)}: ${done ? 'completed' : unlocked ? (p.done ? p.done + ' of ' + p.total + ' missions done' : 'unlocked') : 'locked'}">
        <span class="node-emblem">${icon(done ? 'check' : unlocked ? z.emblem : 'lock')}</span><span class="node-label">${esc(z.name)}</span>${p.done && !done ? `<span class="node-prog">${p.done}/${p.total}</span>` : ''}${isCurrent ? '<span class="node-pulse" aria-hidden="true"></span>' : ''}</button>`;
    }).join('');
  }
  function mapList(s) {
    return RX.ZONES.map((z) => { const unlocked = RX.Rules.isUnlocked(s, z.id), done = RX.Rules.isZoneComplete(s, z.id), p = RX.Rules.zoneProgress(s, z.id); return `<button type="button" class="zone-card ${done ? 'is-done' : ''} ${unlocked ? '' : 'is-locked'}" data-zone="${z.id}" style="--accent:${z.accent}" ${unlocked ? '' : 'aria-disabled="true"'}><span class="zc-emblem">${icon(done ? 'check' : unlocked ? z.emblem : 'lock')}</span><span class="zc-body"><span class="zc-name">${esc(z.name)}</span><span class="zc-lesson">Lesson ${esc(z.lesson)} · ${esc(z.lessonName)}</span><span class="zc-blurb">${z.blurb}</span></span><span class="zc-status">${done ? 'Complete' : unlocked ? `${p.done}/${p.total}` : 'Locked'}</span></button>`; }).join('');
  }

  RX.UI = { mount, screen, hud, modal, confirm, toast, speak, mapSvg, mapNodes, mapList, nodePositions, h, refs: () => refs };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — support layer: student levels, Key Words screen, inline first hint (with Spanish),
   worked examples, and the portable progress code used by the teacher's Class Snapshot. No game flow lives here. */
(function (root) {
  'use strict';
  const RX = root.RX;

  const LEVELS = [
    { id: 0, label: 'Level 0 · Most Support', short: 'Level 0', desc: 'Key words first, a hint on every question, read-aloud on, Spanish help.' },
    { id: 1, label: 'Level 1 · Support', short: 'Level 1', desc: 'Key words first. A hint appears after a wrong try.' },
    { id: 2, label: 'Level 2 · Enrichment', short: 'Level 2', desc: 'Harder versions of every challenge. Hints only when you ask. More XP.' },
  ];
  const levelOf = (s) => (s && s.settings && [0, 1, 2].includes(s.settings.level) ? s.settings.level : 1);
  const levelInfo = (id) => LEVELS.find((l) => l.id === id) || LEVELS[1];
  const LEVEL2_XP = 1.25;

  /** Level picker markup: radio cards. Bind with bindLevelPicker(container, onChange). */
  function levelPicker(current, name) {
    return `<div class="lvl-pick" role="radiogroup" aria-label="Choose your level">${LEVELS.map((l) => `<label class="lvl-card ${l.id === current ? 'is-on' : ''}"><input type="radio" name="${name || 'rx-level'}" value="${l.id}" ${l.id === current ? 'checked' : ''}><span class="lvl-k">${RX.esc(l.label)}</span><span class="lvl-d">${RX.esc(l.desc)}</span></label>`).join('')}</div>`;
  }
  function bindLevelPicker(el, onChange) {
    el.querySelectorAll('.lvl-card input').forEach((inp) =>
      inp.addEventListener('change', () => {
        el.querySelectorAll('.lvl-card').forEach((c) => c.classList.toggle('is-on', c.contains(inp) && inp.checked));
        onChange(Number(inp.value));
      }),
    );
  }

  // ---------- Key Words ----------
  const lessonIds = (z) =>
    String(z.lesson || '')
      .split(/\s*\/\s*/)
      .filter(Boolean);
  function keyWordsFor(z) {
    if (!z || z.final || z.optional) return [];
    const ids = lessonIds(z);
    return (RX.VOCAB || []).filter((v) => Array.isArray(v.lessons) && v.lessons.some((l) => ids.includes(l)));
  }
  function keyWordCard(v, i, showEs) {
    const vis = v.visual ? `<div class="kw-viz">${v.visual()}</div>` : '';
    return `<article class="kw-card" style="--d:${i}"><div class="kw-text"><h3 class="kw-term">${RX.esc(v.term)}</h3>${v.es ? `<p class="kw-es" ${showEs ? '' : 'hidden'}><span class="kw-flag">ES</span> ${RX.esc(v.es)}</p>` : ''}<p class="kw-def">${v.def}</p>${v.esDef ? `<p class="kw-esdef" ${showEs ? '' : 'hidden'}>${RX.esc(v.esDef)}</p>` : ''}${v.ex ? `<p class="kw-ex"><b>Example:</b> ${RX.esc(v.ex)}</p>` : ''}</div>${vis}</article>`;
  }
  /** Full-screen Key Words step before a zone's first mission. opts: { level, onStart, onBack } */
  function showKeyWords(z, opts) {
    const words = keyWordsFor(z);
    const showEs = opts.level === 0;
    RX.UI.hud({ xp: opts.xp, streak: opts.streak, title: z.name, sub: 'Key words' });
    RX.UI.screen(
      'keywords',
      `<section class="keywords" style="--accent:${z.accent}"><div class="kw-head"><p class="eyebrow">Lesson ${RX.esc(z.lesson)} · ${RX.esc(z.lessonName)}</p><h2>Key words for ${RX.esc(z.name)}</h2><p class="lede">Read each word, its meaning, and the picture. You will use these words in the challenges.</p>
      <div class="kw-tools"><button type="button" class="btn btn-ghost btn-sm" id="kw-es" aria-pressed="${showEs}">${RX.icon('book')} <span>${showEs ? 'Hide Español' : 'Español'}</span></button><button type="button" class="btn btn-ghost btn-sm" id="kw-speak">${RX.icon('speaker')} Read aloud</button></div></div>
      <div class="kw-grid" style="--kw-cols:${words.length === 4 || words.length === 2 ? 2 : 3}">${words.map((v, i) => keyWordCard(v, i, showEs)).join('')}</div>
      <div class="title-actions"><button type="button" class="btn btn-primary btn-lg" id="kw-go">I know these words. Start ${RX.icon('arrow')}</button><button type="button" class="btn btn-ghost" id="kw-back">Back to the map</button></div></section>`,
    );
    const tog = document.getElementById('kw-es');
    tog.addEventListener('click', () => {
      const on = tog.getAttribute('aria-pressed') !== 'true';
      tog.setAttribute('aria-pressed', String(on));
      tog.querySelector('span').textContent = on ? 'Hide Español' : 'Español';
      document.querySelectorAll('.kw-es, .kw-esdef').forEach((el) => {
        el.hidden = !on;
      });
    });
    document.getElementById('kw-speak').addEventListener('click', () => RX.UI.speak(words.map((v) => `${v.term}. ${String(v.def).replace(/<[^>]+>/g, '')}`).join(' ')));
    document.getElementById('kw-go').addEventListener('click', opts.onStart);
    document.getElementById('kw-back').addEventListener('click', opts.onBack);
  }

  // ---------- Inline first hint ----------
  function inlineHintHtml(q, visible) {
    if (!q.hints || !q.hints[0]) return '';
    return `<div class="q-inline" id="q-inline" ${visible ? '' : 'hidden'}><div class="qi-head"><span class="qi-k">${RX.icon('bulb')} Hint</span><span class="qi-tools"><button type="button" class="qi-lang qi-say" id="qi-say" aria-label="Read the hint aloud">${RX.icon('speaker')}</button>${q.hintEs ? '<button type="button" class="qi-lang" id="qi-lang" aria-pressed="false">Español</button>' : ''}</span></div><div class="qi-en">${q.hints[0]}</div>${q.hintEs ? `<div class="qi-es" hidden lang="es">${q.hintEs}</div>` : ''}</div>`;
  }
  function bindInlineHint() {
    const say = document.getElementById('qi-say');
    if (say) say.addEventListener('click', () => { const es = document.querySelector('#q-inline .qi-es'); const useEs = es && !es.hidden; RX.UI.speak((useEs ? es : document.querySelector('#q-inline .qi-en')).innerText, useEs ? 'es' : 'en'); });
    const b = document.getElementById('qi-lang');
    if (!b) return;
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      b.textContent = on ? 'English' : 'Español';
      document.querySelector('#q-inline .qi-en').hidden = on;
      document.querySelector('#q-inline .qi-es').hidden = !on;
    });
  }
  function revealInlineHint() {
    const el = document.getElementById('q-inline');
    if (el && el.hidden) {
      el.hidden = false;
      el.classList.add('is-new');
    }
  }

  // ---------- Worked example: same generator, different numbers ----------
  function workedExample(q, seed, level) {
    try {
      const ex = RX.G.make(q.gen, RX.R.make((seed ^ 0x5bd1e995) >>> 0), level === 2 ? { hard: true } : {});
      if (RX.stripTags ? RX.stripTags(ex.prompt) === RX.stripTags(q.prompt) : ex.prompt === q.prompt) return null;
      return `<div class="worked"><span class="worked-k">${RX.icon('book')} Worked example · different numbers</span><div class="worked-q">${ex.prompt}</div><div class="worked-s">${ex.solution}</div><p class="worked-foot">Now use the same steps on your own question.</p></div>`;
    } catch (e) {
      return null;
    }
  }

  // ---------- Portable progress code (student report → teacher Class Snapshot) ----------
  const b64e = (str) =>
    root
      .btoa(unescape(encodeURIComponent(str)))
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/, '');
  const b64d = (str) => decodeURIComponent(escape(root.atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4))));
  function progressPayload(s, unitKey, name) {
    const k = {};
    Object.keys(s.skills || {}).forEach((id) => {
      const sk = s.skills[id];
      if (sk.seen) k[id] = [sk.seen, sk.first];
    });
    const zonesDone = Object.keys(s.zones || {}).filter((z) => s.zones[z].completed).length;
    const d = new Date();
    return {
      v: 1,
      u: unitKey,
      n: String(name || '').slice(0, 40),
      d: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
      l: levelOf(s),
      x: s.xp || 0,
      a: (s.stats && s.stats.answered) || 0,
      f: (s.stats && s.stats.firstTry) || 0,
      z: zonesDone,
      k,
    };
  }
  const encodeProgress = (p) => 'RX1.' + b64e(JSON.stringify(p));
  /** Find every RX1 code in pasted text. Returns [{...payload}] (invalid codes are skipped and counted). */
  function decodeAll(text) {
    const out = [];
    let bad = 0;
    String(text || '').replace(/RX1\.([A-Za-z0-9_-]{8,})/g, (m, body) => {
      try {
        const p = JSON.parse(b64d(body));
        if (p && p.v === 1 && p.u && p.k) out.push(p);
        else bad++;
      } catch (e) {
        bad++;
      }
      return m;
    });
    return { codes: out, bad };
  }

  RX.Support = {
    LEVELS,
    LEVEL2_XP,
    levelOf,
    levelInfo,
    levelPicker,
    bindLevelPicker,
    keyWordsFor,
    showKeyWords,
    inlineHintHtml,
    bindInlineHint,
    revealInlineHint,
    workedExample,
    progressPayload,
    encodeProgress,
    decodeAll,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — Mission Report screen, the copyable teacher report, and the name prompt.
   Split out of game.js; the controller passes its live state and navigation through ctx. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { UI, State, Rules, esc, icon } = RX;
  const Sup = () => RX.Support;
  let s, ctx;
  const levelNow = () => Sup().levelOf(s);
  const story = () => RX.STORY;
  const zoneById = (id) => RX.ZONES.find((z) => z.id === id);
  const exitTo = () => ctx.exitTo();
  const openZone = (z) => ctx.openZone(z);
  function skillReport() {
    return Object.keys(RX.SKILLS).map((k) => {
      const sk = s.skills[k] || { seen: 0, first: 0 };
      const rate = sk.seen ? sk.first / sk.seen : null;
      return {
        k,
        label: RX.SKILLS[k].label,
        lesson: RX.SKILLS[k].lesson,
        zone: RX.SKILLS[k].zone,
        rate,
        seen: sk.seen,
        band: rate == null ? 'Not yet seen' : Rules.skillBand(rate),
      };
    });
  }
  /** Plain-text report a student can paste into Canvas, email, or show a teacher. */
  function reportText() {
    const skills = skillReport();
    const acc = s.stats.answered ? Math.round((100 * s.stats.firstTry) / s.stats.answered) : 0;
    const zonesDone = RX.ZONES.filter((z) => Rules.isZoneComplete(s, z.id)).length;
    const lines = [
      `${RX.UNIT.brand} — Mission Report${s.settings.studentName ? ' — ' + s.settings.studentName : ''}`,
      `${RX.UNIT.unitLabel}`,
      `Date: ${new Date().toLocaleDateString()}`,
      '',
      `First-try accuracy: ${acc}%  ·  XP: ${s.xp}  ·  Zones cleared: ${zonesDone}/${RX.ZONES.length}  ·  Challenges answered: ${s.stats.answered}`,
      '',
      'Skills:',
    ];
    skills.forEach((x) =>
      lines.push(
        `  ${x.band === 'Strong' ? '✔' : x.band === 'Almost There' ? '~' : x.band === 'Not yet seen' ? '·' : '✘'} ${x.label} (Lesson ${x.lesson}): ${x.band}${x.seen ? ` — ${x.seen} seen` : ''}`,
      ),
    );
    lines.push('', `Achievements: ${Object.keys(s.achievements).length}/${RX.ACHIEVEMENTS.length}`);
    lines.push(`Level: ${Sup().levelInfo(levelNow()).label}`);
    lines.push('', `Teacher code: ${Sup().encodeProgress(Sup().progressPayload(s, RX.UNIT.id, s.settings.studentName))}`);
    return lines.join('\n');
  }
  /** Ask once for a name or initials so the teacher's Class Snapshot can tell reports apart. */
  function askName(then) {
    if (s.settings.studentName) return then();
    const m = UI.modal({
      title: `${icon('ref')} Your name for the report`,
      body: '<p>Type your first name or initials so your teacher knows whose report this is. It stays on this device.</p><label class="fld"><span class="fld-label">Name or initials</span><input type="text" id="rx-name" maxlength="40" autocomplete="off"></label>',
      actions: [
        { label: 'Cancel' },
        {
          label: 'Save and copy',
          cls: 'btn-primary',
          onClick: () => {
            const v = (m.el.querySelector('#rx-name').value || '').trim();
            if (!v) { UI.toast('Type a name or initials first.', 'warn'); return false; }
            s.settings.studentName = v;
            State.save();
            setTimeout(then, 50);
          },
        },
      ],
    });
  }
  function showResults() {
    s = State.load();
    const skills = skillReport();
    const seen = skills.filter((x) => x.rate != null);
    const strong = seen.filter((x) => x.band === 'Strong'),
      practice = seen.filter((x) => x.band !== 'Strong');
    const acc = s.stats.answered ? Math.round((100 * s.stats.firstTry) / s.stats.answered) : 0;
    const zonesDone = RX.ZONES.filter((z) => Rules.isZoneComplete(s, z.id));
    const finished = Rules.isZoneComplete(s, Rules.finalZone().id);
    const opt = Rules.optionalZones()[0];
    UI.hud({ xp: s.xp, streak: s.streak, title: 'Mission Report' });
    UI.screen(
      'results',
      `<section class="results"><div class="results-card"><p class="eyebrow">${esc(RX.UNIT.brand)} · ${esc(RX.UNIT.unitLabel)}</p><h2>${finished ? 'Mission Complete' : 'Progress Report'}</h2><p class="lede">${finished ? story().resultsLede : 'Here is how the expedition is going so far. Keep clearing zones to finish the route.'}</p>
      <div class="stat-row"><div class="stat"><b>${acc}%</b><span>first-try accuracy</span></div><div class="stat"><b>${s.xp}</b><span>XP earned</span></div><div class="stat"><b>${zonesDone.length}/${RX.ZONES.length}</b><span>zones cleared</span></div><div class="stat"><b>${Object.keys(s.achievements).length}/${RX.ACHIEVEMENTS.length}</b><span>achievements</span></div></div>
      <div class="results-cols"><div><h3>Strongest skills</h3>${strong.length ? strong.map((x) => `<div class="skill-row"><span>${esc(x.label)}</span><span class="band band-strong">Strong</span></div>`).join('') : '<p class="muted">Keep practicing to build strong skills.</p>'}</div>
      <div><h3>Keep practicing</h3>${practice.length ? practice.map((x) => `<div class="skill-row"><span>${esc(x.label)}</span><span class="band band-${x.band.replace(/\s/g, '').toLowerCase()}">${x.band}</span></div>`).join('') : `<p class="muted">Every skill you have met is strong.${opt ? ` Try ${esc(opt.name)} for a challenge.` : ''}</p>`}</div></div>
      ${
        practice.length
          ? `<div class="recommend"><h3>Recommended replays</h3><div class="rec-list">${[...new Set(practice.map((x) => x.zone))]
              .filter((zid) => zoneById(zid))
              .map((zid) => {
                const z = zoneById(zid);
                return `<button type="button" class="btn btn-ghost" data-zone="${z.id}">${icon(z.emblem)} ${esc(z.name)}</button>`;
              })
              .join('')}</div></div>`
          : ''
      }
      <div class="ach-reveal">${RX.ACHIEVEMENTS.filter((a) => s.achievements[a.id])
        .map((a) => `<span class="ach-chip">${icon(a.icon)} ${esc(a.name)}</span>`)
        .join('')}</div>
      <div class="title-actions"><button type="button" class="btn btn-primary btn-lg" id="btn-map" autofocus>${RX.UNIT.onExit ? 'Back to the Atlas' : 'Back to the map'} ${icon('arrow')}</button><button type="button" class="btn btn-ghost" id="btn-copy">${icon('ref')} Copy report for my teacher</button><button type="button" class="btn btn-ghost" id="btn-print">${icon('print')} Print report</button></div></div></section>`,
    );
    document.getElementById('btn-map').addEventListener('click', exitTo);
    document.getElementById('btn-copy').addEventListener('click', () => askName(copyReport));
    async function copyReport() {
      const t = reportText();
      try {
        await navigator.clipboard.writeText(t);
        UI.toast('Report copied. Paste it anywhere.', 'ok');
      } catch (e) {
        UI.modal({
          title: 'Your report',
          body: `<pre class="report-pre">${esc(t)}</pre>`,
        });
      }
    }
    document.getElementById('btn-print').addEventListener('click', () => root.print());
    document.querySelectorAll('.rec-list [data-zone]').forEach((b) => b.addEventListener('click', () => openZone(zoneById(b.dataset.zone))));
  }


  RX.Report = {
    bind(c) { ctx = c; },
    showResults() { s = ctx.state(); showResults(); s = ctx.state(); },
    reportText() { s = ctx.state(); return reportText(); },
    skillReport() { s = ctx.state(); return skillReport(); },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — game controller: flow, scoring, feedback, hints, achievements.
   Everything unit-specific comes from the pack: RX.UNIT (ids, brand, save key), RX.STORY (text), RX.ZONES, RX.SKILLS, RX.VOCAB,
   RX.ACHIEVEMENTS, and optionally RX.REFERENCE_SHEET. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { UI, State, Rules, esc, icon } = RX;
  let s, widget, q, attempts, hintLevel, helpUsed, solutionShown;

  const XP_SECOND = 0.6,
    XP_AFTER_SOLUTION = 0.3;
  const zoneById = (id) => RX.ZONES.find((z) => z.id === id);
  const missionDef = (zid, mid) => zoneById(zid).missions.find((m) => m.id === mid);
  const story = () => RX.STORY;
  const Sup = () => RX.Support;
  const levelNow = () => Sup().levelOf(s);
  /** The challenge list of the running mission: a sharpen replay, an ad-hoc retry list, or the mission's own generators. */
  const specsOf = (cur) => {
    if (cur.sharpen && cur.slots) return cur.slots;
    return cur.gens || missionDef(cur.zone, cur.mission).gens;
  };
  const missionName = (cur) => (cur.sharpen ? 'Sharpen' : cur.retry ? 'Practice what you missed' : missionDef(cur.zone, cur.mission).name);
  /** Self-paced stars for one finished round. 1 at 3 correct, 2 at a streak of 3 or 8 correct, 3 at 80%+ on a round of 4 or more. */
  function runStars(correct, total, bestStreak) {
    let stars = 0;
    if (correct >= 3) stars = 1;
    if (bestStreak >= 3 || correct >= 8) stars = 2;
    if (total >= 4 && correct / total >= 0.8) stars = 3;
    return stars;
  }
  function starMarkup(n) {
    const marks = [0, 1, 2].map((i) => `<span style="opacity:${i < n ? 1 : 0.28}">${icon('star')}</span>`).join('');
    const label = n === 1 ? '1 star' : `${n} stars`;
    return `<div class="rx-stars" role="img" aria-label="${label}. Self-paced." style="display:flex;gap:10px;color:#b8860b;margin:4px 0 4px">${marks}</div><p class="muted" style="margin-top:0">${label} · self-paced</p>`;
  }
  function genKey(g) {
    return JSON.stringify(Array.isArray(g) ? g : [g, {}]);
  }
  /** Missed items from this run, plus up to 2 generator specs from the same zone that this run did not use. */
  function sharpenPlan(cur, mission) {
    const played = cur.playedGens || cur.gens || mission.gens;
    const missedIdx = [];
    played.forEach((_, i) => {
      const row = cur.results[i];
      if (row && !row.correct) missedIdx.push(i);
    });
    if (!missedIdx.length) return null;
    const used = new Set(played.map(genKey));
    const unseen = [];
    zoneById(cur.zone).missions.forEach((mm) => mm.gens.forEach((g) => {
      const key = genKey(g);
      if (!used.has(key)) { used.add(key); unseen.push(g); }
    }));
    const pick = RX.R.make(((cur.seed || 1) ^ 0x9e3779b9) >>> 0);
    const extraGens = pick.shuffle(unseen).slice(0, 2);
    const slots = missedIdx.map((index) => ({ from: 'played', index })).concat(extraGens.map((_, extraIndex) => ({ from: 'extra', extraIndex })));
    return { seed: cur.seed, playedGens: played, extraGens, slots, level: cur.level };
  }
  const exitTo = () => (RX.UNIT.onExit ? RX.UNIT.onExit() : showMap());

  // ---------- Boot / title ----------
  function bindReport() {
    RX.Report.bind({ state: () => s, exitTo: () => exitTo(), openZone: (z) => openZone(z) });

  function boot() {

  /** Boot straight into one mission (used by the Atlas for the Daily Trek). */
  let bootedOnce = false;
  function bootMission(zid, mid) {

  function applySettings() {

  }
  function onGlobalClick(e) {

    ).join('');

  function lockReason(z) {
