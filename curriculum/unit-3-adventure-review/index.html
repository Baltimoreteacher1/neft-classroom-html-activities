/* Grade 6 Review Expeditions — shared utilities (pure, usable in browser and Node). */
(function (root) {
  'use strict';
  const RX = root.RX || (root.RX = {});

  /** Mulberry32 seeded PRNG. Returns function () -> [0,1). */
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const R = {
    make(seed) {
      const next = rng(seed);
      const api = {
        next,
        int(lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
        pick(arr) { return arr[Math.floor(next() * arr.length)]; },
        pickN(arr, n) { return api.shuffle(arr).slice(0, n); },
        shuffle(arr) {
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(next() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        },
        chance(p) { return next() < p; },
      };
      return api;
    },
  };

  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
  function simplify(a, b) { const g = gcd(a, b) || 1; return [a / g, b / g]; }
  function round(n, places) { const f = Math.pow(10, places); return Math.round((n + Number.EPSILON) * f) / f; }
  function money(n) { return '$' + n.toFixed(2); }
  function fmt(n) {
    if (Number.isInteger(n)) return n.toLocaleString('en-US');
    return String(round(n, 3));
  }
  function plural(n, one, many) { return n === 1 ? one : (many || one + 's'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  /** Parse a student-typed number. Accepts "1,200", "$5.65", "3/4", " 7 ". Returns null if invalid. */
  function parseNum(s) {
    if (s == null) return null;
    let t = String(s).trim().replace(/[$,\s]/g, '');
    if (!t) return null;
    const frac = t.match(/^(-?\d+)\/(\d+)$/);
    if (frac) { const d = Number(frac[2]); if (!d) return null; return Number(frac[1]) / d; }
    if (!/^-?\d*\.?\d+$/.test(t)) return null;
    return Number(t);

  function near(a, b, tol) { return Math.abs(a - b) <= (tol == null ? 1e-9 : tol); }

  /** Shuffle options and return {options, answer} with answer index remapped (single) or indexes (array). */
  function shuffleOptions(r, options, answer) {
    const idx = r.shuffle(options.map((_, i) => i));
    const out = idx.map((i) => options[i]);
    if (Array.isArray(answer)) return { options: out, answers: answer.map((a) => idx.indexOf(a)).sort((x, y) => x - y) };
    return { options: out, answer: idx.indexOf(answer) };
  }

  const NAMES = ['Priya', 'Marcus', 'Aaliyah', 'Jordan', 'Darnell', 'Maya', 'Carlos', 'Tasha', 'Devon', 'Elena', 'Noah', 'Zoe', 'Kai', 'Imani', 'Mateo', 'Layla', 'Omar', 'Sofia', 'Jaden', 'Nia', 'Leo', 'Amara', 'Diego', 'Hana', 'Malik', 'Ruby', 'Theo', 'Ivy', 'Andre', 'Sage'];

  Object.assign(RX, { R, gcd, simplify, round, money, fmt, plural, esc, parseNum, near, shuffleOptions, NAMES });

    const py = (y) => h - pad.b - (y / yMax) * (h - pad.t - pad.b);
    let s = `<svg class="viz-graph" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Coordinate graph')}">`;
    for (let x = 0; x <= xMax; x += xs) s += `<line x1="${px(x)}" y1="${py(0)}" x2="${px(x)}" y2="${py(yMax)}" stroke="${COLORS.grid}" stroke-width="1"/>`;
    for (let y = 0; y <= yMax; y += ys) s += `<line x1="${px(0)}" y1="${py(y)}" x2="${px(xMax)}" y2="${py(y)}" stroke="${COLORS.grid}" stroke-width="1"/>`;
    s += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(xMax)}" y2="${py(0)}" stroke="${COLORS.axis}" stroke-width="2"/>`;
    s += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(0)}" y2="${py(yMax)}" stroke="${COLORS.axis}" stroke-width="2"/>`;
    const xl = o.xLabelEvery || xs, yl = o.yLabelEvery || ys;
    for (let x = 0; x <= xMax; x += xl) s += `<text x="${px(x)}" y="${py(0) + 16}" font-size="11" text-anchor="middle" fill="${COLORS.text}">${x}</text>`;
    for (let y = 0; y <= yMax; y += yl) s += `<text x="${px(0) - 6}" y="${py(y) + 4}" font-size="11" text-anchor="end" fill="${COLORS.text}">${y}</text>`;
    if (o.xLabel) s += `<text x="${(px(0) + px(xMax)) / 2}" y="${h - 10}" font-size="12" font-weight="600" text-anchor="middle" fill="${COLORS.text}">${esc(o.xLabel)}</text>`;
    if (o.yLabel) s += `<text transform="translate(14 ${(py(0) + py(yMax)) / 2}) rotate(-90)" font-size="12" font-weight="600" text-anchor="middle" fill="${COLORS.text}">${esc(o.yLabel)}</text>`;
    (o.series || []).forEach((ser) => {
      const col = ser.color || COLORS.a;
      if (ser.line && ser.points.length > 1) {
        const pts = ser.points.slice().sort((p, q) => p[0] - q[0]);
        s += `<polyline fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="${ser.dashed ? '5 4' : '0'}" points="${pts.map((p) => px(p[0]) + ',' + py(p[1])).join(' ')}"/>`;
      }

        const last = ser.points.reduce((m, p) => (p[0] > m[0] ? p : m), ser.points[0]);
        s += `<text x="${Math.min(px(last[0]) + 8, w - 4)}" y="${py(last[1]) - 8}" font-size="12" font-weight="700" fill="${col}" text-anchor="${px(last[0]) > w - 70 ? 'end' : 'start'}">${esc(ser.label)}</text>`;

  function table(rows, o) {

  }

  /** Tape diagram. rows: [{label, boxes, value?, color}]; opts {boxText: fn(rowIdx, boxIdx) -> string} */
  function tape(rows, o) {
    o = o || {};
    const bw = o.boxW || 42, bh = 34, lw = o.labelW || 80, gap = 14;
    const maxBoxes = Math.max(...rows.map((r) => r.boxes));
    const w = lw + maxBoxes * bw + 10, h = rows.length * (bh + gap) + 4;
    let s = `<svg class="viz-tape" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Tape diagram')}">`;
    rows.forEach((r, ri) => {
      const y = 2 + ri * (bh + gap);
      const col = r.color || (ri === 0 ? COLORS.a : COLORS.b);
      s += `<text x="${lw - 10}" y="${y + bh / 2 + 5}" font-size="13" font-weight="700" text-anchor="end" fill="${COLORS.text}">${esc(r.label)}</text>`;
      for (let b = 0; b < r.boxes; b++) {
        const x = lw + b * bw;
        s += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${col}" fill-opacity="0.18" stroke="${col}" stroke-width="2"/>`;

  /** Double number line. top/bottom: {label, values:[...]} where a value may be '?' */
  function dnl(top, bottom, o) {
    o = o || {};
    const n = top.values.length, step = 78, lw = 70, w = lw + (n - 1) * step + 50, h = 112;
    const x = (i) => lw + i * step;

      s += `<text x="${lw - 12}" y="${y + 5}" font-size="12" font-weight="700" text-anchor="end" fill="${COLORS.text}">${esc(row.label)}</text>`;

        s += `<line x1="${x(i)}" y1="${y - 7}" x2="${x(i)}" y2="${y + 7}" stroke="${COLORS.axis}" stroke-width="2"/>`;
        const isQ = v === '?' || v == null;
        s += `<text x="${x(i)}" y="${y + dy}" font-size="13" font-weight="${isQ ? '800' : '600'}" text-anchor="middle" fill="${isQ ? COLORS.d : COLORS.text}">${isQ ? '?' : esc(v)}</text>`;

  }

  /** Row of simple icon shapes for counting. kind: 'circle'|'square'|'tri'|'diamond' */
  function icons(count, kind, color, label) {
    const sz = 22, gap = 6, perRow = 10;
    const rows = Math.ceil(count / perRow);
    const w = Math.min(count, perRow) * (sz + gap), h = rows * (sz + gap);

      const x = (i % perRow) * (sz + gap), y = Math.floor(i / perRow) * (sz + gap);

      else if (kind === 'tri') s += `<polygon points="${x + sz / 2},${y + 1} ${x + sz - 1},${y + sz - 1} ${x + 1},${y + sz - 1}" fill="${color}"/>`;
      else if (kind === 'diamond') s += `<polygon points="${x + sz / 2},${y + 1} ${x + sz - 1},${y + sz / 2} ${x + sz / 2},${y + sz - 1} ${x + 1},${y + sz / 2}" fill="${color}"/>`;

  RX.V = { COLORS, graph, table, tape, dnl, icons, hl, unit, frac };

  /** Box plot(s) over one number line. o: {plots:[{min,q1,med,q3,max,label,color}], lineMin, lineMax, step, labelEvery, title} */

  /** Rectangular prism in oblique view. o: {l,w,h, labels:{l,w,h}, hidden:boolean(draw hidden edges)} */

    const lb = o.labels || {};
    s += `<text x="${(f[0][0] + f[1][0]) / 2}" y="${f[0][1] + 18}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lb.l || fmtN(L))}</text>`;
    s += `<text x="${(f[1][0] + b[1][0]) / 2 + 10}" y="${(f[1][1] + b[1][1]) / 2 + 14}" font-size="13" font-weight="700" fill="${C.text}">${esc(lb.w || fmtN(Wd))}</text>`;
    s += `<text x="${f[0][0] - 10}" y="${(f[0][1] + f[3][1]) / 2}" font-size="13" font-weight="700" text-anchor="end" fill="${C.text}">${esc(lb.h || fmtN(H))}</text>`;
    return s + '</svg>';
  }

  /** Net of a rectangular prism (cross layout). o: {l,w,h, labels:{l,w,h}, faceLabels:boolean} */
  function prismNet(o) {
    const L = o.l,
      Wd = o.w,
      H = o.h,
      W = o.width || 340;
    const totalW = 2 * L + 2 * Wd,
      totalH = 2 * Wd + H;
    const sc = Math.min((W - 40) / totalW, 200 / totalH),
      Ht = totalH * sc + 50;
    const ox = (W - totalW * sc) / 2,
      oy = 20;
    const R = (x, y, w, h, fill, lab) =>
      `<rect x="${ox + x * sc}" y="${oy + y * sc}" width="${w * sc}" height="${h * sc}" fill="${fill}" fill-opacity=".25" stroke="${C.axis}" stroke-width="1.8"/>` +
      (lab ? `<text x="${ox + (x + w / 2) * sc}" y="${oy + (y + h / 2) * sc + 4}" font-size="11" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lab)}</text>` : '');
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(o.aria || 'Net of a rectangular prism')}">`;
    const fl = o.faceLabels;
    s +=
      R(Wd, 0, L, Wd, C.b, fl && 'top') +
      R(0, Wd, Wd, H, C.c, fl && 'side') +
      R(Wd, Wd, L, H, C.a, fl && 'front') +
      R(Wd + L, Wd, Wd, H, C.c, fl && 'side') +
      R(2 * Wd + L, Wd, L, H, C.a, fl && 'back') +
      R(Wd, Wd + H, L, Wd, C.b, fl && 'bottom');
    const lb = o.labels || {};
    s += `<text x="${ox + (Wd + L / 2) * sc}" y="${oy + (2 * Wd + H) * sc + 16}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lb.l || fmtN(L))}</text>`;
    s += `<text x="${ox - 6}" y="${oy + (Wd + H / 2) * sc + 4}" font-size="12" font-weight="700" text-anchor="end" fill="${C.text}">${esc(lb.h || fmtN(H))}</text>`;
    s += `<text x="${ox + (Wd / 2) * sc}" y="${oy + Wd * sc - 6}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lb.w || fmtN(Wd))}</text>`;
    return s + '</svg>';
  }

  /** Square pyramid (oblique) with base edge b and slant height l labelled. */
  function pyramid(o) {
    const W = o.width || 280,
      Ht = o.height || 230,
      b = o.b,
      sh = o.slant;
    const sc = Math.min((W - 80) / (b * 1.45), (Ht - 70) / (sh * 1.1 + b * 0.3));
    const ox = 40,
      oy = Ht - 30,
      dx = 0.45,
      dy = 0.3;
    const P = (x, y, z) => [ox + (x + z * dx) * sc, oy - (y + z * dy) * sc];
    const base = [P(0, 0, 0), P(b, 0, 0), P(b, 0, b), P(0, 0, b)],
      apex = P(b / 2, sh * 0.95, b / 2);
    const poly = (pts, fill) => `<polygon points="${pts.map((p) => p.join(',')).join(' ')}" fill="${fill}" fill-opacity=".22" stroke="${C.axis}" stroke-width="2" stroke-linejoin="round"/>`;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(o.aria || 'Square pyramid')}">`;
    s += `<path d="M${base[2]} L${base[3]} M${base[3]} L${apex} M${base[3]} L${base[0]}" stroke="${C.axis}" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>`;
    s += poly([base[1], base[2], apex], C.c) + poly([base[0], base[1], apex], C.a);
    const mid = [(base[0][0] + base[1][0]) / 2, (base[0][1] + base[1][1]) / 2];
    s += `<line x1="${mid[0]}" y1="${mid[1]}" x2="${apex[0]}" y2="${apex[1]}" stroke="${C.d}" stroke-width="2" stroke-dasharray="6 4"/>`;
    s += `<text x="${mid[0]}" y="${mid[1] + 18}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(o.baseLabel || fmtN(b))}</text>`;
    s += `<text x="${(mid[0] + apex[0]) / 2 + 10}" y="${(mid[1] + apex[1]) / 2}" font-size="13" font-weight="700" fill="${C.d}">${esc(o.slantLabel || fmtN(sh))}</text>`;
    return s + '</svg>';
  }

  /** Net of a square pyramid: square base with four triangles. */
  function pyramidNet(o) {
    const b = o.b,
      sh = o.slant,
      W = o.width || 300,
      tot = b + 2 * sh,
      sc = (W - 40) / tot,
      Ht = tot * sc + 40,
      ox = 20,
      oy = 20;
    const X = (x) => ox + x * sc,
      Y = (y) => oy + y * sc;
    const sq = [
      [sh, sh],
      [sh + b, sh],
      [sh + b, sh + b],
      [sh, sh + b],
    ];
    const tri = (p1, p2, apex) => `<polygon points="${[p1, p2, apex].map((p) => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="${C.c}" fill-opacity=".22" stroke="${C.axis}" stroke-width="1.8"/>`;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(o.aria || 'Net of a square pyramid')}">`;
    s += `<polygon points="${sq.map((p) => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="${C.a}" fill-opacity=".25" stroke="${C.axis}" stroke-width="1.8"/>`;
    s += tri(sq[0], sq[1], [sh + b / 2, 0]) + tri(sq[1], sq[2], [tot, sh + b / 2]) + tri(sq[2], sq[3], [sh + b / 2, tot]) + tri(sq[3], sq[0], [0, sh + b / 2]);
    s += `<text x="${X(sh + b / 2)}" y="${Y(sh + b / 2) + 4}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(o.baseLabel || fmtN(b))}</text>`;
    s += `<line x1="${X(sh + b / 2)}" y1="${Y(sh)}" x2="${X(sh + b / 2)}" y2="${Y(0)}" stroke="${C.d}" stroke-width="2" stroke-dasharray="6 4"/><text x="${X(sh + b / 2) + 8}" y="${Y(sh / 2)}" font-size="12" font-weight="700" fill="${C.d}">${esc(o.slantLabel || fmtN(sh))}</text>`;
    return s + '</svg>';
  }

  /** Triangular prism (oblique) — right-triangle or isosceles cross-section. o:{b,h,len, labels:{b,h,len,s1,s2}} */
  function triPrism(o) {
    const b = o.b,
      h = o.h,
      L = o.len,
      W = o.width || 320,
      Ht = o.height || 230;
    const dx = 0.5,
      dy = 0.28;
    const sc = Math.min((W - 90) / (b + L * dx), (Ht - 70) / (h + L * dy));
    const ox = 40,
      oy = Ht - 34;
    const P = (x, y, z) => [ox + (x + z * dx) * sc, oy - (y + z * dy) * sc];
    const apexX = o.right ? 0 : b / 2;
    const f = [P(0, 0, 0), P(b, 0, 0), P(apexX, h, 0)],
      bk = [P(0, 0, L), P(b, 0, L), P(apexX, h, L)];
    const poly = (pts, fill) => `<polygon points="${pts.map((p) => p.join(',')).join(' ')}" fill="${fill}" fill-opacity=".25" stroke="${C.axis}" stroke-width="2" stroke-linejoin="round"/>`;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(o.aria || 'Triangular prism')}">`;
    s += `<path d="M${bk[0]} L${bk[1]} M${bk[0]} L${bk[2]} M${bk[0]} L${f[0]}" stroke="${C.axis}" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>`;
    s += poly([f[1], f[2], bk[2], bk[1]], C.c) + poly([f[0], f[1], bk[1], bk[0]], C.b) + poly(f, C.a);
    if (!o.right) s += `<line x1="${f[2][0]}" y1="${f[2][1]}" x2="${f[2][0]}" y2="${f[0][1]}" stroke="${C.d}" stroke-width="2" stroke-dasharray="6 4"/>`;
    const lb = o.labels || {};
    s += `<text x="${(f[0][0] + f[1][0]) / 2}" y="${f[0][1] + 18}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lb.b || fmtN(b))}</text>`;
    s += `<text x="${f[2][0] + (o.right ? -8 : 8)}" y="${(f[2][1] + f[0][1]) / 2}" font-size="13" font-weight="700" text-anchor="${o.right ? 'end' : 'start'}" fill="${C.d}">${esc(lb.h || fmtN(h))}</text>`;
    s += `<text x="${(f[1][0] + bk[1][0]) / 2 + 10}" y="${(f[1][1] + bk[1][1]) / 2 + 14}" font-size="13" font-weight="700" fill="${C.text}">${esc(lb.len || fmtN(L))}</text>`;
    if (lb.s1) s += `<text x="${(f[1][0] + f[2][0]) / 2 + 10}" y="${(f[1][1] + f[2][1]) / 2 - 6}" font-size="12" font-weight="700" fill="${C.text}">${esc(lb.s1)}</text>`;
    if (lb.s2) s += `<text x="${(f[0][0] + f[2][0]) / 2 - 10}" y="${(f[0][1] + f[2][1]) / 2 - 6}" font-size="12" font-weight="700" text-anchor="end" fill="${C.text}">${esc(lb.s2)}</text>`;
    return s + '</svg>';
  }

  /** Pan balance for equations. o: {left:[labels], right:[labels], tilt: -1|0|1} */
  function balance(o) {
    const W = 340,
      H = 170,
      tilt = (o.tilt || 0) * 7;
    const chip = (t, x, y, i) =>
      `<rect x="${x - 26}" y="${y - 30}" width="52" height="26" rx="6" fill="${/^[a-z]$/i.test(t) ? C.d : C.c}" fill-opacity=".9"/><text x="${x}" y="${y - 12}" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">${esc(t)}</text>`;
    const pan = (items, cx, cy) => {
      let out = `<path d="M${cx - 60},${cy} Q${cx},${cy + 26} ${cx + 60},${cy}" fill="none" stroke="${C.axis}" stroke-width="3"/><line x1="${cx - 60}" y1="${cy}" x2="${cx}" y2="${cy - 36}" stroke="${C.axis}" stroke-width="1.5"/><line x1="${cx + 60}" y1="${cy}" x2="${cx}" y2="${cy - 36}" stroke="${C.axis}" stroke-width="1.5"/>`;
      const n = items.length;
      items.forEach((t, i) => {
        out += chip(t, cx + (i - (n - 1) / 2) * 56, cy - 2, i);
      });
      return out;
    };
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || 'Pan balance')}">`;
    s += `<path d="M${W / 2 - 30},${H - 10} h60 l-30,-40 z" fill="${C.axis}"/><line x1="${W / 2}" y1="${H - 50}" x2="${W / 2}" y2="${H - 110}" stroke="${C.axis}" stroke-width="4"/>`;
    s += `<g transform="rotate(${tilt} ${W / 2} ${H - 110})"><line x1="${W / 2 - 120}" y1="${H - 110}" x2="${W / 2 + 120}" y2="${H - 110}" stroke="${C.axis}" stroke-width="4" stroke-linecap="round"/>${pan(o.left, W / 2 - 120, H - 74)}${pan(o.right, W / 2 + 120, H - 74)}</g>`;
    return s + '</svg>';
  }

  /** Algebra-tile style area model for expressions like 3(x + 2). o: {rows:[labels], cols:[labels]} */
  function areaModel(o) {
    const rows = o.rows,
      cols = o.cols,
      cw = 70,
      ch = 48,
      W = 40 + cols.length * cw,
      H = 30 + rows.length * ch;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || 'Area model')}">`;
    cols.forEach((c, j) => {
      s += `<text x="${40 + j * cw + cw / 2}" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(c)}</text>`;
    });
    rows.forEach((r, i) => {
      s += `<text x="32" y="${30 + i * ch + ch / 2 + 4}" font-size="13" font-weight="700" text-anchor="end" fill="${C.text}">${esc(r)}</text>`;
      cols.forEach((c, j) => {
        const t = o.cells ? o.cells[i][j] : '';
        s += `<rect x="${40 + j * cw}" y="${30 + i * ch}" width="${cw}" height="${ch}" fill="${/x|y|n|m|a|b/.test(c + r) ? C.a : C.b}" fill-opacity=".2" stroke="${C.axis}" stroke-width="1.6"/>`;
        if (t) s += `<text x="${40 + j * cw + cw / 2}" y="${30 + i * ch + ch / 2 + 5}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(t)}</text>`;
      });
    });
    return s + '</svg>';
  }

  Object.assign(V, {
    numberLine,
    verticalLine,
    dotPlot,
    histogram,
    boxPlot,
    grid100,
    bar,
    figure,
    parallelogram,
    triangle,
    trapezoid,
    rectangle,
    prism,
    prismNet,
    pyramid,
    pyramidNet,
    triPrism,
    balance,
    areaModel,
  });

  // ---------- Extend the coordinate graph to four quadrants (xMin/yMin) ----------
  const graph0 = V.graph;
  V.graph = function (o) {
    if (!o.xMin && !o.yMin) return graph0(o);
    const size = o.size || 320,
      pad = { l: 30, r: 18, t: 18, b: 30 };
    const w = size,
      h = size,
      xMin = o.xMin || 0,
      yMin = o.yMin || 0,
      xMax = o.xMax,
      yMax = o.yMax,
      xs = o.xStep || 1,
      ys = o.yStep || 1;
    const px = (x) => pad.l + ((x - xMin) / (xMax - xMin)) * (w - pad.l - pad.r);
    const py = (y) => h - pad.b - ((y - yMin) / (yMax - yMin)) * (h - pad.t - pad.b);
    let s = `<svg class="viz-graph" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Coordinate plane')}">`;
    for (let x = xMin; x <= xMax; x += xs) s += `<line x1="${px(x)}" y1="${py(yMin)}" x2="${px(x)}" y2="${py(yMax)}" stroke="${C.grid}" stroke-width="1"/>`;
    for (let y = yMin; y <= yMax; y += ys) s += `<line x1="${px(xMin)}" y1="${py(y)}" x2="${px(xMax)}" y2="${py(y)}" stroke="${C.grid}" stroke-width="1"/>`;
    s += `<line x1="${px(xMin)}" y1="${py(0)}" x2="${px(xMax)}" y2="${py(0)}" stroke="${C.axis}" stroke-width="2"/><line x1="${px(0)}" y1="${py(yMin)}" x2="${px(0)}" y2="${py(yMax)}" stroke="${C.axis}" stroke-width="2"/>`;
    const xl = o.xLabelEvery || xs,
      yl = o.yLabelEvery || ys;
    for (let x = xMin; x <= xMax; x += xl) if (x !== 0) s += `<text x="${px(x)}" y="${py(0) + 14}" font-size="10" text-anchor="middle" fill="${C.text}">${x}</text>`;
    for (let y = yMin; y <= yMax; y += yl) if (y !== 0) s += `<text x="${px(0) - 5}" y="${py(y) + 3.5}" font-size="10" text-anchor="end" fill="${C.text}">${y}</text>`;
    s += `<text x="${px(0) - 5}" y="${py(0) + 13}" font-size="10" text-anchor="end" fill="${C.text}">0</text>`;
    s += `<text x="${px(xMax) - 2}" y="${py(0) - 6}" font-size="12" font-weight="700" text-anchor="end" fill="${C.text}">${esc(o.xLabel || 'x')}</text><text x="${px(0) + 6}" y="${py(yMax) + 10}" font-size="12" font-weight="700" fill="${C.text}">${esc(o.yLabel || 'y')}</text>`;
    (o.series || []).forEach((ser) => {
      const col = ser.color || C.a;
      if (ser.line && ser.points.length > 1)
        s += `<polyline fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="${ser.dashed ? '5 4' : '0'}" points="${ser.points.map((p) => px(p[0]) + ',' + py(p[1])).join(' ')}"/>`;
      if (ser.polygon && ser.points.length > 2)
        s += `<polygon fill="${col}" fill-opacity=".15" stroke="${col}" stroke-width="2" points="${ser.points.map((p) => px(p[0]) + ',' + py(p[1])).join(' ')}"/>`;
      ser.points.forEach((p, i) => {
        s += `<circle cx="${px(p[0])}" cy="${py(p[1])}" r="5" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
        if (ser.labels && ser.labels[i]) s += `<text x="${px(p[0]) + 7}" y="${py(p[1]) - 6}" font-size="11" font-weight="700" fill="${col}">${esc(ser.labels[i])}</text>`;
      });
    });
    return s + '</svg>';
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Grade 6 Review Expeditions — pure answer checkers. check(q, answer) -> { correct, detail }. */
(function (root) {
  'use strict';
  const RX = root.RX || (root.RX = {});
  const { parseNum, near } = RX;

  function numOk(input, expected, tol) {
    const v = parseNum(input);
    if (v == null) return false;
    return near(v, expected, tol == null ? 0.001 : tol);
  }
  const sameSet = (a, b) => a.length === b.length && a.slice().sort((x, y) => x - y).every((v, i) => v === b.slice().sort((x, y) => x - y)[i]);

  const C = {
    mc(q, a) { return { correct: a === q.answer }; },
    who(q, a) { return C.mc(q, a); },
    rep(q, a) { return C.mc(q, a); },
    ms(q, a) {
      a = Array.isArray(a) ? a : [];
      const missing = q.answers.filter((i) => !a.includes(i));
      const extra = a.filter((i) => !q.answers.includes(i));
      return { correct: missing.length === 0 && extra.length === 0, detail: { missing, extra } };
    },
    num(q, a) { return { correct: numOk(a, q.answer, q.tolerance), detail: { value: parseNum(a) } }; },
    blanks(q, a) {
      a = Array.isArray(a) ? a : [];
      const wrong = q.fields.map((f, i) => (numOk(a[i], f.answer, f.tolerance) ? null : i)).filter((i) => i !== null);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    cloze(q, a) {
      a = Array.isArray(a) ? a : [];
      const wrong = q.answers.map((ans, i) => (a[i] === ans ? null : i)).filter((i) => i !== null);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    table(q, a) {
      a = a || {};
      const wrong = q.inputs.filter((inp) => !numOk(a[inp.id], inp.answer, inp.tolerance)).map((inp) => inp.id);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    match(q, a) {
      a = Array.isArray(a) ? a : [];
      const wrong = q.pairs.filter(([l, r]) => !a.some(([al, ar]) => al === l && ar === r)).map(([l]) => l);
      return { correct: wrong.length === 0 && a.length === q.pairs.length, detail: { wrong } };
    },
    sort(q, a) {
      a = a || {};
      const wrong = q.items.map((it, i) => (a[i] === it.bin ? null : i)).filter((i) => i !== null);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    seq(q, a) {
      a = Array.isArray(a) ? a : [];
      const correct = a.length === q.order.length && a.every((v, i) => v === q.order[i]);
      return { correct };
    },
    plot(q, a) {
      a = Array.isArray(a) ? a : [];
      const key = (p) => p[0] + ',' + p[1];
      const want = new Set(q.points.map(key)), got = new Set(a.map(key));
      const missing = q.points.filter((p) => !got.has(key(p)));
      const extra = a.filter((p) => !want.has(key(p)));
      return { correct: missing.length === 0 && extra.length === 0, detail: { missing, extra } };
    },
    dnl(q, a) {
      a = Array.isArray(a) ? a : [];
      const wrong = q.blanks.map((b, i) => (numOk(a[i], b.answer, b.tolerance) ? null : i)).filter((i) => i !== null);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    tape(q, a) {
      a = a || {};
      const wrong = q.fields.filter((f) => !numOk(a[f.key], f.answer, f.tolerance)).map((f) => f.key);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    tf(q, a) {
      a = a || {};
      const valueOk = a.value === q.answer;
      const reasonOk = q.reasons[a.reason] ? !!q.reasons[a.reason].correct : false;
      return { correct: valueOk && reasonOk, detail: { valueOk, reasonOk } };
    },
    error(q, a) {
      a = a || {};
      const mistakeOk = a.mistake === q.answer;
      const fixOk = q.fix ? numOk(a.fix, q.fix.answer, q.fix.tolerance) : true;
      return { correct: mistakeOk && fixOk, detail: { mistakeOk, fixOk } };
    },
    cr(q, a) {
      a = a || {};
      const words = String(a.text || '').trim().split(/\s+/).filter(Boolean).length;
      const wroteEnough = words >= (q.minWords || 8);
      const checkOk = a.check === q.check.answer;
      return { correct: wroteEnough && checkOk, detail: { wroteEnough, checkOk, words } };
    },
  };

  RX.check = function (q, answer) {
    const fn = C[q.type];
    if (!fn) throw new Error('No checker for type ' + q.type);
    return fn(q, answer);
  };
  RX.checkers = C;
  RX.numOk = numOk;
  RX.sameSet = sameSet;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — inline SVG icon set (stroke-based, currentColor). */
(function (root) {
  'use strict';
  const RX = root.RX;

<script>
/* Zone 1 — Base Camp. Lesson 3-1 Understand Ratios. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { G, V, gcd, shuffleOptions, NAMES } = RX;
  const hl = V.hl;
  const why = (opts, i) => (opts[i] && opts[i].why) || null;

  const PAIRS = [
    ['tents', 'lanterns', 'square', 'tri', '#1FA6A2', '#F2A33A'],
    ['canoes', 'paddles', 'diamond', 'square', '#3B6FB6', '#1FA6A2'],
    ['flags', 'ropes', 'tri', 'circle', '#C8553D', '#17324D'],
    ['compasses', 'maps', 'circle', 'square', '#17324D', '#F2A33A'],
  ];
  const THIRD = [
    ['shovels', 'diamond', '#6B7F3A'],
    ['buckets', 'circle', '#8A5A2B'],
    ['whistles', 'tri', '#2F4858'],
  ];

  // ---------- Reading a ratio from a picture (MC) ----------
  G.define('r1_picture', (r, o) => {
    const hard = !!o.hard;
    const [n1, n2, k1, k2, c1, c2] = r.pick(PAIRS);
    if (!hard) {
      let a = r.int(2, 7),
        b = r.int(2, 9);
      if (b === a) b = a + 1;
      const opts = [
        { html: `${a} : ${b}`, ok: true },
        { html: `${b} : ${a}`, why: `Order matters. The question asks for ${n1} to ${n2}, so the number of ${n1} comes first.` },
        { html: `${a} : ${a + b}`, why: `${a + b} is the total of both items. That would be a part-to-whole ratio. This question compares two parts.` },
        { html: `${b} : ${a + b}`, why: `${a + b} is the total. The question compares ${n1} to ${n2}, not ${n2} to everything.` },
      ];
      const sh = shuffleOptions(r, opts, 0);
      return {
        type: 'mc',
        skill: 'ratio-language',
        lesson: '3-1',
        title: 'Read the ratio',
        prompt: `<p>The supply crate holds the items shown.</p>
        <div class="viz-row"><div><div class="viz-cap">${n1}</div>${V.icons(a, k1, c1, n1)}</div><div><div class="viz-cap">${n2}</div>${V.icons(b, k2, c2, n2)}</div></div>
        <p>What is the ratio of ${hl(n1)} to ${hl(n2)}?</p>`,
        options: sh.options,
        answer: sh.answer,
        hints: [
          'Count each kind of item. Which item does the question name first?',
          `Point to each of the ${n1} as you count them, then do the same for the ${n2}. The question names ${n1} first, so that count goes first.`,
          `Write the count of ${n1}, then a colon, then the count of ${n2}. Read it as "${n1} for every ${n2}."`,
        ],
        hintEs: 'Cuenta cada tipo de objeto. ¿Qué objeto nombra primero la pregunta? Ese número va primero en la razón.',
        solution: `<p>Count: ${a} ${n1}, ${b} ${n2}. The question says <b>${n1} to ${n2}</b>, so the ratio is <b>${a} : ${b}</b>. The order of the words tells you the order of the numbers.</p>`,
        feedback: {
          correct: `Correct. ${a} ${n1} to ${b} ${n2} is written ${a} : ${b}, in the same order as the words.`,
          wrong: (ans) => why(sh.options, ans) || `Count the ${n1} and the ${n2}, then write them in the order the question names them.`,
        },
      };
    }
    // hard: three kinds of items; the question skips the middle one or compares one part to the whole crate
    const [n3, k3, c3] = r.pick(THIRD);
    const [a, b, c] = r.pickN([2, 3, 4, 5, 6, 7], 3);
    const T = a + b + c;
    const mode = r.pick(['skip', 'whole']);
    let opts, ask, ansText, steps, stepHint;
    if (mode === 'skip') {
      ask = `${hl(n3)} to ${hl(n1)}`;
      ansText = `${c} : ${a}`;
      steps = `There are ${c} ${n3} and ${a} ${n1}. The ${n2} are not part of this comparison.`;
      stepHint = `Count only the ${n3} and the ${n1}. The ${n2} are not part of this comparison.`;
      opts = [
        { html: `${c} : ${a}`, ok: true },
        { html: `${a} : ${c}`, why: `Order matters. The question names ${n3} first, so the ${c} ${n3} come first.` },
        { html: `${c} : ${T}`, why: `${T} is every item in the crate. That is a part-to-whole ratio, but the question compares ${n3} to ${n1} only.` },
        { html: `${c} : ${b}`, why: `${b} is the number of ${n2}. The question compares ${n3} to ${n1}, so use the ${n1} count.` },
      ];
    } else {
      ask = `${hl(n2)} to <b>all the items</b> in the crate`;
      ansText = `${b} : ${T}`;
      steps = `There are ${b} ${n2}. All the items together: ${a} + ${b} + ${c}.`;
      stepHint = `Count the ${n2}. Then count every item in the crate, all three kinds together, to get the whole.`;
      opts = [
        { html: `${b} : ${T}`, ok: true },
        { html: `${b} : ${a + c}`, why: `${a + c} counts only the other items. "All the items" includes the ${n2} too, so the whole is ${T}.` },
        { html: `${T} : ${b}`, why: `Order matters. The question names ${n2} first, so ${b} comes first and the total comes second.` },
        { html: `${b} : ${a}`, why: `${a} is only the ${n1}. The question compares ${n2} to every item in the crate.` },
      ];
    }
    const sh = shuffleOptions(r, opts, 0);
    return {
      type: 'mc',
      skill: 'ratio-language',
      lesson: '3-1',
      title: 'Read the ratio',
      prompt: `<p>The supply crate holds three kinds of items.</p>
        <div class="viz-row"><div><div class="viz-cap">${n1}</div>${V.icons(a, k1, c1, n1)}</div><div><div class="viz-cap">${n2}</div>${V.icons(b, k2, c2, n2)}</div><div><div class="viz-cap">${n3}</div>${V.icons(c, k3, c3, n3)}</div></div>
        <p>What is the ratio of ${ask}?</p>`,
      options: sh.options,
      answer: sh.answer,
      hints: [
        'Decide which two amounts the question compares. Is it one part to another part, or one part to the whole crate?',
        stepHint,
        'Write the amount the question names first, then a colon, then the second amount.',
      ],
      hintEs: 'Decide qué dos cantidades compara la pregunta. ¿Es una parte con otra parte, o una parte con el total de la caja?',
      solution: `<p>${steps} The ratio of ${mode === 'skip' ? `${n3} to ${n1}` : `${n2} to all items`} is <b>${ansText}</b>. ${mode === 'skip' ? 'This is part-to-part: the third item is left out.' : `This is part-to-whole: the whole is ${a} + ${b} + ${c} = ${T}.`}</p>`,
      feedback: {
        correct: `Correct. ${ansText} compares exactly the two amounts the question names, in that order.`,
        wrong: (ans) => why(sh.options, ans) || 'Find the two amounts the question names, then write them in that order.',
      },
    };
  });

  // ---------- Sort statements: part-to-part vs part-to-whole ----------
  G.define('r1_sortLanguage', (r, o) => {
    const hard = !!o.hard;
    const a = r.int(2, 5),
      b = r.int(a + 1, 8);
    const c = hard ? r.pick([2, 3, 4, 5, 6, 7].filter((x) => x !== a && x !== b)) : 0;
    const t = a + b + c;
    const pool = hard
      ? [
          { html: `red : white = ${a} : ${c}`, bin: 0, note: 'compares red to white, two parts' },
          { html: `${a + b} red and blue beads for every ${c} white beads`, bin: 0, note: 'compares the red and blue beads to the white beads. Two groups of parts, no total' },
          { html: `For every ${2 * b} blue beads there are ${2 * c} white beads`, bin: 0, note: 'compares blue to white, two parts (scaled up)' },
          { html: `The ratio of white to red is ${c} to ${a}`, bin: 0, note: 'compares white to red, two parts' },
          { html: `${a} out of every ${t} beads are red`, bin: 1, note: `uses ${t}, the total` },
          { html: `white : all beads = ${c} : ${t}`, bin: 1, note: 'compares white to all the beads' },
          { html: `${V.frac(a + b, t)} of the beads are not white`, bin: 1, note: `uses ${t}, the total` },
          { html: `The ratio of blue beads to all beads is ${2 * b} : ${2 * t}`, bin: 1, note: 'compares blue to all the beads (scaled up)' },
        ]
      : [
          { html: `${a} red beads for every ${b} blue beads`, bin: 0, note: 'compares red to blue, two parts' },
          { html: `The ratio of blue to red is ${b} to ${a}`, bin: 0, note: 'compares blue to red, two parts' },
          { html: `For every ${b} blue beads there are ${a} red beads`, bin: 0, note: 'compares blue to red, two parts' },
          { html: `red : blue = ${a} : ${b}`, bin: 0, note: 'compares red to blue, two parts' },
          { html: `${a} of the ${t} beads are red`, bin: 1, note: `uses ${t}, the total` },
          { html: `${b} out of every ${t} beads are blue`, bin: 1, note: `uses ${t}, the total` },
          { html: `red : total = ${a} : ${t}`, bin: 1, note: 'compares red to the total' },
          { html: `${V.frac(b, t)} of the beads are blue`, bin: 1, note: `uses ${t}, the total` },
        ];
    const items = r.shuffle(
      r
        .pickN(
          pool.filter((p) => p.bin === 0),
          3,
        )
        .concat(
          r.pickN(
            pool.filter((p) => p.bin === 1),
            3,
          ),
        ),
    );
    const strip = (s) => String(s).replace(/<[^>]+>/g, '');
    return {
      type: 'sort',
      skill: 'part-whole',
      lesson: '3-1',
      title: 'Sort the ratio language',
      prompt: hard
        ? `<p>A bracelet has ${hl(a + ' red')}, ${hl(b + ' blue')}, and ${hl(c + ' white')} beads. Sort each statement.</p>
        <p class="muted">Careful: a statement can combine two colors and still compare parts.</p>`
        : `<p>A bracelet has ${hl(a + ' red')} beads and ${hl(b + ' blue')} beads (${t} beads total). Sort each statement.</p>
        <p class="muted">A <b>part-to-part</b> ratio compares two parts. A <b>part-to-whole</b> ratio compares one part to the total.</p>`,
      bins: ['Part-to-Part', 'Part-to-Whole'],
      items: items.map((it) => ({ html: it.html, bin: it.bin })),
      hints: hard
        ? [
            'Ask: does the second amount count every bead on the bracelet? Only then is it part-to-whole.',
            `The total is ${a} + ${b} + ${c} = ${t}. A statement that uses ${t} beads (or a scaled copy of it), or says "all beads", compares to the whole.`,
            `"${a + b} red and blue beads for every ${c} white beads" leaves no bead out, but it still compares one group to another group, not to the total.`,
          ]
        : [
            'Ask: does this statement compare red to blue (two parts), or one color to all the beads?',
            `The total is ${t}. Any statement that uses ${t} (or says "of the beads") is comparing to the whole.`,
            `"For every" with two colors is part-to-part. "Out of" or "of the beads" is part-to-whole.`,
          ],
      hintEs: hard
        ? 'Pregúntate: ¿la segunda cantidad cuenta todas las cuentas de la pulsera? Solo así es una razón de parte a total.'
        : 'Pregúntate: ¿esta oración compara rojo con azul (dos partes), o un color con todas las cuentas (el total)?',
      solution: hard
        ? `<p>The total is ${t} beads. Part-to-whole statements compare a part to all ${t} beads (or an equivalent, like ${2 * t}). Part-to-part statements compare one part to another part, even when a part is two colors together, such as ${a + b} red and blue beads to ${c} white beads.</p>`
        : `<p>Part-to-part statements compare red and blue directly (${a} : ${b} or ${b} : ${a}). Part-to-whole statements compare one color to all ${t} beads (${a} : ${t} or ${b} : ${t}).</p>`,
      feedback: {
        correct: 'Correct. Statements that use the total are part-to-whole; statements that compare one group of beads to another are part-to-part.',
        wrong(ans, d) {
          const it = items[(d.wrong || [])[0]];
          if (!it) return 'Check each statement: does the second amount count every bead?';
          return `Look again at "${strip(it.html)}". It ${it.note}, so it is <b>${it.bin === 0 ? 'part-to-part' : 'part-to-whole'}</b>.`;
        },
      },
    };
  });

  // ---------- Ratio from a table, simplest form (two blanks) ----------
  G.define('r1_simplest', (r, o) => {
    const hard = !!o.hard;
    const groups = r.shuffle(['Soccer Team', 'Art Club', 'Robotics Club', 'Debate Team', 'Chess Club', 'Drama Club', 'Band', 'Yearbook']).slice(0, 4);
    const basePairs = hard
      ? [
          [5, 7],
          [4, 9],
          [7, 9],
          [5, 12],
          [7, 8],

      skill: 'equivalent',
      lesson: '3-1',
      title: 'Find every equivalent ratio',
      prompt: `<p>Select <b>all</b> ratios that are equivalent to ${hl(start)}.</p>`,
      options: sh.options,
      answers: sh.answers,
      hints,
      hintEs,
      solution,
      feedback: {
        correct: 'Correct. Every equivalent ratio multiplies or divides both parts by the same factor.',
        wrong(ans, d) {
          if (d.extra.length) return sh.options[d.extra[0]].why || 'One of your selections is not equivalent.';
          if (hard && d.missing.some((i) => sh.options[i].html === `${a} : ${b}`))
            return `You missed the simplest form. Dividing both parts of ${start} by the same number also makes an equivalent ratio.`;
          return 'You missed at least one equivalent ratio. Look for options where both parts were multiplied by the same number.';
        },
      },
    };
  });

  // ---------- Error analysis: additive thinking (error) ----------
  G.define('r1_errorAdditive', (r, o) => {
    const hard = !!o.hard;
    const name = r.pick(NAMES);
    const [a, b] = r.pick([
      [2, 5],
      [3, 4],
      [1, 3],
      [3, 7],
      [2, 3],
    ]);
    const g = hard ? r.pick([2, 3]) : 1;
    const A = a * g,
      B = b * g;
    const c = r.int(2, 4);
    const k = hard ? r.pick([4, 5, 7].filter((x) => x % g !== 0)) : r.int(3, 6);
    const opts = [
      { html: `Adding ${c} to both parts changes the relationship. To make an equivalent ratio, multiply or divide both parts by the <b>same</b> number.`, ok: true },
      {
        html: `${name} should have added ${c} only to the second number.`,
        why: 'Adding to only one part makes the ratio even more unbalanced. Adding is not the operation that keeps ratios equivalent.',
      },
      {
        html: `${name} should have subtracted ${c} from both parts instead.`,
        why: 'Subtracting the same number from both parts also changes the relationship. Multiplying or dividing keeps it the same.',
      },
      { html: `The ratio ${A} : ${B} cannot have any equivalent ratios.`, why: `Every ratio has equivalent ratios. For example, ${A * 2} : ${B * 2} is equivalent to ${A} : ${B}.` },
    ];
    const sh = shuffleOptions(r, opts, 0);
    const added = B + (a * k - A);
    return {
      type: 'error',
      skill: 'equivalent',
      lesson: '3-1',
      title: 'Find the mistake',
      prompt: `<p>${name} says: "${hl(A + ' : ' + B)} is equivalent to ${hl(A + c + ' : ' + (B + c))} because I added ${c} to both numbers."</p><p>Why is this reasoning incorrect?${hard ? ` Then fix it: find an equivalent ratio whose first number is ${a * k}.` : ''}</p>`,
      work: `${A} + ${c} = ${A + c}, &nbsp; ${B} + ${c} = ${B + c} &nbsp; so &nbsp; ${A} : ${B} = ${A + c} : ${B + c}`,
      options: sh.options,
      answer: sh.answer,
      fix: { label: `Complete an equivalent ratio: ${a * k} : `, answer: b * k },
      hints: hard
        ? [
            `Test the claim with a simple case: is 1 : 2 the same as 2 : 3? For the fix, ${a * k} is not a whole-number multiple of ${A}, so simplify ${A} : ${B} first.`,
            `${A} : ${B} = ${a} : ${b} (divide both by ${g}). Now scale ${a} : ${b} up to a first number of ${a * k}.`,
            `${a} × ${k} = ${a * k}, so multiply ${b} by ${k} as well.`,
          ]
        : [
            'Test the claim with a simple case: is 1 : 2 the same as 2 : 3? (Hint: 1 : 2 is "half"; 2 : 3 is not.)',
            `To make an equivalent ratio from ${a} : ${b}, multiply both parts by the same factor.`,
            `${a} × ${k} = ${a * k}, so multiply ${b} by ${k} as well.`,
          ],
      hintEs: hard
        ? `Prueba la idea con un caso sencillo: ¿1 : 2 es igual que 2 : 3? Para corregirlo, ${a * k} no es un múltiplo entero de ${A}, así que primero simplifica ${A} : ${B}.`
        : 'Prueba la idea con un caso sencillo: ¿1 : 2 es igual que 2 : 3? (1 : 2 es "la mitad"; 2 : 3 no lo es.)',
      solution: `<p>Adding changes the relationship: ${A} : ${B} and ${A + c} : ${B + c} do not simplify to the same ratio. Equivalent ratios come from multiplying or dividing both parts by the same factor.${hard ? ` ${A} : ${B} = ${a} : ${b} (÷ ${g}).` : ''} ${a} × ${k} = ${a * k} and ${b} × ${k} = <b>${b * k}</b>, so ${a * k} : ${b * k} is equivalent.</p>`,
      feedback: {
        correct: `Correct. Only multiplying or dividing both parts by the same number keeps a ratio equivalent. ${a * k} : ${b * k} works because ${a} : ${b} was multiplied by ${k}.`,
        wrong(ans, d) {
          if (!d.mistakeOk) return why(sh.options, ans.mistake) || 'Think about which operation keeps a ratio equivalent.';
          const f = RX.parseNum(ans.fix);
          if (f === added) return `You found the mistake, but your fix makes it again: you added ${a * k - A} to both parts. Multiply instead.`;
          if (hard && f === B * k) return `You multiplied ${B} by ${k}, but ${A} × ${k} is not ${a * k}. Simplify ${A} : ${B} to ${a} : ${b} first, then scale by ${k}.`;
          return hard
            ? `You found the mistake. For the fix, simplify ${A} : ${B} first, then find what ${a} was multiplied by to get ${a * k}.`
            : `You found the mistake. For the fix, ${a} was multiplied by ${k} to get ${a * k}, so multiply ${b} by ${k} too.`;
        },
      },
    };
  });
})(typeof window !== 'undefined' ? window : globalThis);
