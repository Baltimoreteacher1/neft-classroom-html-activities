<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Math Academy — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f6f1;
        color: #17324d;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: #ffffff;
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 4px 16px rgba(23, 50, 77, 0.08);
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.5;
        color: #4a6278;
      }
      button {
        margin-top: 18px;
        padding: 12px 20px;
        border-radius: 10px;
        border: none;
        background: #1fa6a2;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #178a86;
      }
      .emoji {
        font-size: 2.4rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji" aria-hidden="true">🦖📡</div>
      <h1>You're offline</h1>
      <p>
        No connection right now — but if you've opened Monster Math Academy
        on this device before, your progress is already saved locally and
        keeps working. Anything you save while offline will sync
        automatically once you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try Again</button>
    </div>
  </body>
</html>
