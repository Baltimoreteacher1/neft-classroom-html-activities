<script>
/* Grade 6 Review Expeditions — extra widgets + checkers: nl (number-line placement), ineq (graph an inequality),
   shade (shade a grid), and a four-quadrant upgrade of plot. Checkers are pure and shared with the Node verifier. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const C = RX.checkers;
  const { parseNum, near } = RX;

  // ---------- Checkers ----------
  /** q: {min,max,step,points:[v...],count, tolerance} ; answer: [v...] */
  C.nl = function (q, a) {
    a = Array.isArray(a) ? a : [];
    const tol = q.tolerance == null ? (q.step || 1) / 4 : q.tolerance;
    const missing = q.points.filter((p) => !a.some((v) => near(v, p, tol)));
    const extra = a.filter((v) => !q.points.some((p) => near(v, p, tol)));
    return { correct: missing.length === 0 && extra.length === 0 && a.length === q.points.length, detail: { missing, extra } };
  };
  /** q: {min,max,step,point,open:boolean,dir:'left'|'right'} ; answer: {point, open, dir} */
  C.ineq = function (q, a) {
    a = a || {};
    const pointOk = a.point != null && near(a.point, q.point, (q.step || 1) / 4);
    const openOk = a.open === q.open;
    const dirOk = a.dir === q.dir;
    return { correct: pointOk && openOk && dirOk, detail: { pointOk, openOk, dirOk } };
  };
  /** q: {cells, count} ; answer: number of shaded cells */
  C.shade = function (q, a) {
    const n = Number(a);
    return { correct: n === q.count, detail: { value: n } };
  };

  if (typeof document === 'undefined') return; // Node verifier stops here

  const W = RX.Widgets;
  const { h, disableAll } = RX.WUtil;
  const ns = 'http://www.w3.org/2000/svg';
  const fmtN = (n) => (Number.isInteger(n) ? String(n) : String(Math.round(n * 1000) / 1000));

  /** Shared interactive number line. Returns {svg, x(v), ticks:[v], layer, hits, lock(on)} */
  function buildLine(host, q, onTick) {
    const w = 560,
      padL = 30,
      padR = 30,
      y = 56,
      hgt = 100;
    const x = (v) => padL + ((v - q.min) / (q.max - q.min)) * (w - padL - padR);
    const stage = h(`<div class="nl-stage">${RX.V.numberLine({ min: q.min, max: q.max, step: q.step, labelEvery: q.labelEvery, width: w, ticksOnly: !!q.ticksOnly })}</div>`);
    host.appendChild(stage);
    const svg = stage.querySelector('svg');
    svg.classList.add('nl-svg');
    svg.setAttribute('role', 'group');
    svg.setAttribute('aria-label', `Number line from ${q.min} to ${q.max}. Each tick is ${q.step}. Choose a tick to place a point.`);
    svg.setAttribute('width', '100%');
    svg.removeAttribute('height');
    svg.setAttribute('viewBox', `0 0 ${w} ${hgt}`);
    const layer = document.createElementNS(ns, 'g');
    svg.appendChild(layer);
    const hits = document.createElementNS(ns, 'g');
    svg.appendChild(hits);
    const ticks = [];
    const n = Math.round((q.max - q.min) / q.step);
    let locked = false;
    for (let i = 0; i <= n; i++) {
      const v = Math.round((q.min + i * q.step) * 1000) / 1000;
      ticks.push(v);
      const c = document.createElementNS(ns, 'rect');
      c.setAttribute('x', x(v) - 11);
      c.setAttribute('y', y - 22);
      c.setAttribute('width', 22);
      c.setAttribute('height', 44);
      c.setAttribute('rx', 6);
      c.setAttribute('class', 'nl-hit');
      c.setAttribute('tabindex', '0');
      c.setAttribute('role', 'button');
      c.setAttribute('aria-label', `Point at ${fmtN(v)}`);
      const go = () => {
        if (!locked) onTick(v);
      };
      c.addEventListener('click', go);
      c.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          go();
        }
      });
      hits.appendChild(c);
    }
    return {
      svg,
      x,
      y,
      ticks,
      layer,
      hits,
      lock(on) {
        locked = on;
        svg.classList.toggle('is-locked', on);
      },
    };
  }
  const circle = (cx, cy, r, cls) => {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', cx);
    c.setAttribute('cy', cy);
    c.setAttribute('r', r);
    c.setAttribute('class', cls);
    return c;
  };
  const text = (x, y, t, cls) => {
    const e = document.createElementNS(ns, 'text');
    e.setAttribute('x', x);
    e.setAttribute('y', y);
    e.setAttribute('class', cls);
    e.setAttribute('text-anchor', 'middle');
    e.textContent = t;
    return e;
  };

  /** Place `count` points on a number line. q: {min,max,step,labelEvery,count,points,labels?:[...]} */
  W.nl = function (host, q) {
    const pts = [];
    const wrap = h('<div class="nl-w"></div>');
    host.appendChild(wrap);
    const status = h('<div class="plot-status" aria-live="polite"></div>');
    const L = buildLine(wrap, q, (v) => {
      const i = pts.indexOf(v);
      if (i >= 0) pts.splice(i, 1);
      else {
        if (pts.length >= q.count) {
          status.textContent = `You already placed ${q.count} point${q.count > 1 ? 's' : ''}. Click a point to remove it first.`;
          return;
        }
        pts.push(v);
      }
      refresh();
    });
    wrap.appendChild(status);
    const refresh = () => {
      L.layer.innerHTML = '';
      pts.forEach((v, i) => {
        L.layer.appendChild(circle(L.x(v), L.y, 8, 'nl-pt'));
        L.layer.appendChild(text(L.x(v), L.y - 16, q.labels && q.labels[i] != null ? q.labels[i] : fmtN(v), 'nl-lbl'));
      });
      status.textContent = `${pts.length} of ${q.count} point${q.count > 1 ? 's' : ''} placed`;
    };
    refresh();
    return {
      getAnswer: () => pts.slice(),
      canSubmit: () => pts.length === q.count,
      setDisabled: (on) => L.lock(on),
      markResult: (res) => {
        if (res.final && !res.correct) {
          pts.length = 0;
          q.points.forEach((p) => pts.push(p));
          refresh();
          L.layer.querySelectorAll('.nl-pt').forEach((c) => c.classList.add('is-correct'));
        } else if (!res.correct) {
          L.layer.querySelectorAll('.nl-pt').forEach((c, i) => {
            if (res.detail.extra.includes(pts[i])) c.classList.add('is-incorrect');
          });
        }
      },
      focus: () => L.hits.firstChild.focus(),
    };
  };

  /** Graph an inequality: pick the boundary point, open/closed, and the direction. q: {min,max,step,labelEvery,point,open,dir,variable} */
  W.ineq = function (host, q) {
    const st = { point: null, open: null, dir: null };
    const wrap = h(
      `<div class="ineq-w"><div class="ineq-ctl" role="group" aria-label="Circle type"><span class="ineq-k">Circle</span><button type="button" class="tf-btn" data-open="false">● Closed (includes the number)</button><button type="button" class="tf-btn" data-open="true">○ Open (does not include it)</button></div><div class="ineq-ctl" role="group" aria-label="Direction"><span class="ineq-k">Shade</span><button type="button" class="tf-btn" data-dir="left">◀ To the left (less than)</button><button type="button" class="tf-btn" data-dir="right">To the right (greater than) ▶</button></div><p class="hint-line">Click the number line where the boundary point goes.</p></div>`,
    );
    host.appendChild(wrap);
    const status = h('<div class="plot-status" aria-live="polite"></div>');
    const L = buildLine(wrap, q, (v) => {
      st.point = st.point === v ? null : v;
      refresh();
    });
    wrap.appendChild(status);
    const refresh = () => {
      L.layer.innerHTML = '';
      if (st.point != null) {
        if (st.dir) {
          const ln = document.createElementNS(ns, 'line');
          ln.setAttribute('x1', L.x(st.point));
          ln.setAttribute('x2', st.dir === 'right' ? 560 - 16 : 16);
          ln.setAttribute('y1', L.y);
          ln.setAttribute('y2', L.y);
          ln.setAttribute('class', 'ineq-ray');
          L.layer.appendChild(ln);
        }
        const c = circle(L.x(st.point), L.y, 9, 'ineq-pt' + (st.open ? ' is-open' : ''));
        L.layer.appendChild(c);
        L.layer.appendChild(text(L.x(st.point), L.y - 18, fmtN(st.point), 'nl-lbl'));
      }
      wrap.querySelectorAll('[data-open]').forEach((b) => {
        const on = st.open != null && String(st.open) === b.dataset.open;
        b.classList.toggle('is-selected', on);
        b.setAttribute('aria-pressed', String(on));
      });
      wrap.querySelectorAll('[data-dir]').forEach((b) => {
        const on = st.dir === b.dataset.dir;
        b.classList.toggle('is-selected', on);
        b.setAttribute('aria-pressed', String(on));
      });
      status.textContent =
        st.point == null
          ? 'No boundary point yet.'
          : `Boundary at ${fmtN(st.point)}${st.open == null ? '' : st.open ? ', open circle' : ', closed circle'}${st.dir ? ', shaded to the ' + st.dir : ''}.`;
    };
    wrap.querySelectorAll('[data-open]').forEach((b) =>
      b.addEventListener('click', () => {
        if (b.disabled) return;
        st.open = b.dataset.open === 'true';
        refresh();
      }),
    );
    wrap.querySelectorAll('[data-dir]').forEach((b) =>
      b.addEventListener('click', () => {
        if (b.disabled) return;
        st.dir = b.dataset.dir;
        refresh();
      }),
    );
    refresh();
    return {
      getAnswer: () => Object.assign({}, st),
      canSubmit: () => st.point != null && st.open != null && !!st.dir,
      setDisabled: (on) => {
        L.lock(on);
        disableAll(wrap, on);
      },
      markResult: (res) => {
        wrap.querySelectorAll('[data-open]').forEach((b) => b.classList.toggle('is-incorrect', !res.detail.openOk && b.classList.contains('is-selected')));
        wrap.querySelectorAll('[data-dir]').forEach((b) => b.classList.toggle('is-incorrect', !res.detail.dirOk && b.classList.contains('is-selected')));
        if (res.final && !res.correct) {
          st.point = q.point;
          st.open = q.open;
          st.dir = q.dir;
          refresh();
          L.layer.querySelectorAll('.ineq-pt, .ineq-ray').forEach((c) => c.classList.add('is-correct'));
          wrap.querySelectorAll('.tf-btn').forEach((b) => b.classList.remove('is-incorrect'));
        } else if (!res.detail.pointOk) L.layer.querySelectorAll('.ineq-pt').forEach((c) => c.classList.add('is-incorrect'));
      },
      focus: () => wrap.querySelector('.tf-btn').focus(),
    };
  };

  /** Shade cells of a grid. q: {cells:100|10|..., cols, count, label} */
  W.shade = function (host, q) {
    const cells = q.cells || 100,
      cols = q.cols || 10,
      size = 240,
      cw = size / cols,
      rows = Math.ceil(cells / cols);
    const wrap = h(
      `<div class="shade-w"><svg class="shade-svg" viewBox="0 0 ${size} ${(size / cols) * rows}" role="group" aria-label="Grid of ${cells} squares"></svg><div class="plot-status" aria-live="polite"></div><div class="shade-tools"><button type="button" class="btn btn-ghost btn-sm" data-fill="row">Shade a full row</button><button type="button" class="btn btn-ghost btn-sm" data-fill="clear">Clear</button></div></div>`,
    );
    host.appendChild(wrap);
    const svg = wrap.querySelector('svg'),
      status = wrap.querySelector('.plot-status');
    const on = new Set();
    let locked = false;
    const rects = [];
    for (let i = 0; i < cells; i++) {
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', (i % cols) * cw);
      r.setAttribute('y', Math.floor(i / cols) * cw);
      r.setAttribute('width', cw);
      r.setAttribute('height', cw);
      r.setAttribute('class', 'shade-cell');
      r.setAttribute('tabindex', '0');
      r.setAttribute('role', 'checkbox');
      r.setAttribute('aria-checked', 'false');
      r.setAttribute('aria-label', `Square ${i + 1}`);
      const t = () => {
        if (locked) return;
        if (on.has(i)) on.delete(i);
        else on.add(i);
        refresh();
      };
      r.addEventListener('click', t);
      r.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          t();
        }
      });
      svg.appendChild(r);
      rects.push(r);
    }
    const refresh = () => {
      rects.forEach((r, i) => {
        r.classList.toggle('is-on', on.has(i));
        r.setAttribute('aria-checked', String(on.has(i)));
      });
      status.textContent = `${on.size} of ${cells} squares shaded${q.label ? ' · ' + q.label : ''}`;
    };
    wrap.querySelector('[data-fill="row"]').addEventListener('click', () => {
      if (locked) return;
      for (let r = 0; r < rows; r++) {
        const rowIdx = Array.from({ length: cols }, (_, k) => r * cols + k).filter((i) => i < cells);
        if (rowIdx.some((i) => !on.has(i))) {
          rowIdx.forEach((i) => on.add(i));
          break;
        }
      }
      refresh();
    });
    wrap.querySelector('[data-fill="clear"]').addEventListener('click', () => {
      if (locked) return;
      on.clear();
      refresh();
    });
    refresh();
    return {
      getAnswer: () => on.size,
      canSubmit: () => on.size > 0,
      setDisabled: (o) => {
        locked = o;
        disableAll(wrap, o);
        svg.classList.toggle('is-locked', o);
      },
      markResult: (res) => {
        if (res.final && !res.correct) {
          on.clear();
          for (let i = 0; i < q.count; i++) on.add(i);
          refresh();
          svg.classList.add('is-shown');
        }
      },
      focus: () => rects[0].focus(),
    };
  };

  // ---------- Four-quadrant plot (upgrade of W.plot: honors q.xMin / q.yMin) ----------
  const plot0 = W.plot;
  W.plot = function (host, q) {
    if (!q.xMin && !q.yMin) return plot0(host, q);
    const size = 360,
      pad = { l: 30, r: 18, t: 18, b: 30 };
    const px = (x) => pad.l + ((x - q.xMin) / (q.xMax - q.xMin)) * (size - pad.l - pad.r),
      py = (y) => size - pad.b - ((y - q.yMin) / (q.yMax - q.yMin)) * (size - pad.t - pad.b);
    const base = RX.V.graph({
      xLabel: q.xLabel,
      yLabel: q.yLabel,
      xMin: q.xMin,
      xMax: q.xMax,
      yMin: q.yMin,
      yMax: q.yMax,
      size,
      series: q.given ? [{ points: q.given, color: '#5B6B7A', labels: q.givenLabels }] : [],
    });
    const wrap = h(`<div class="plot"><div class="plot-stage">${base}</div><div class="plot-status" aria-live="polite"></div></div>`);
    host.appendChild(wrap);
    const svg = wrap.querySelector('svg');
    svg.classList.add('plot-svg');
    svg.setAttribute('role', 'group');
    svg.setAttribute('aria-label', 'Coordinate grid. Choose grid points to place them.');
    svg.setAttribute('width', '100%');
    svg.removeAttribute('height');
    const pts = new Map();
    const key = (x, y) => x + ',' + y;
    const layer = document.createElementNS(ns, 'g');
    svg.appendChild(layer);
    const hits = document.createElementNS(ns, 'g');
    svg.appendChild(hits);
    const status = wrap.querySelector('.plot-status');
    const refresh = () => {
      layer.innerHTML = '';
      pts.forEach((p) => {
        layer.appendChild(circle(px(p[0]), py(p[1]), 6.5, 'plot-pt'));
        const t = text(px(p[0]) + 18, py(p[1]) - 8, `(${p[0]}, ${p[1]})`, 'plot-lbl');
        layer.appendChild(t);
      });
      status.textContent = `${pts.size} of ${q.count} points placed`;
    };
    let locked = false;
    for (let x = q.xMin; x <= q.xMax; x++)
      for (let y = q.yMin; y <= q.yMax; y++) {
        const c = circle(px(x), py(y), Math.max(5, Math.min(10, (size - pad.t - pad.b) / (q.yMax - q.yMin) / 2.1)), 'plot-hit');
        c.setAttribute('tabindex', '0');
        c.setAttribute('role', 'button');
        c.setAttribute('aria-label', `Point (${x}, ${y})`);
        const toggle = () => {
          if (locked) return;
          const k = key(x, y);
          if (pts.has(k)) pts.delete(k);
          else {
            if (pts.size >= q.count) {
              status.textContent = `You already placed ${q.count} points. Remove one first.`;
              return;
            }
            pts.set(k, [x, y]);
          }
          refresh();
        };
        c.addEventListener('click', toggle);
        c.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggle();
          }
        });
        hits.appendChild(c);
      }
    refresh();
    return {
      getAnswer: () => Array.from(pts.values()),
      canSubmit: () => pts.size === q.count,
      setDisabled: (on) => {
        locked = on;
        svg.classList.toggle('is-locked', on);
      },
      markResult: (res) => {
        if (res.final && !res.correct) {
          pts.clear();
          q.points.forEach((p) => pts.set(key(p[0], p[1]), p));
          refresh();
          layer.querySelectorAll('.plot-pt').forEach((c) => c.classList.add('is-correct'));
        } else if (!res.correct) {
          const arr = Array.from(pts.values());
          layer.querySelectorAll('.plot-pt').forEach((c, i) => {
            const p = arr[i];
            if (res.detail.extra.some((e) => e[0] === p[0] && e[1] === p[1])) c.classList.add('is-incorrect');
          });
        }
      },
      focus: () => hits.firstChild.focus(),
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — screens, HUD, map, modals, toasts. No game logic here. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { esc, icon } = RX;
  const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  let refs = {};
  let modalStack = [];

  function mount() { refs = { hud: document.getElementById('hud'), screen: document.getElementById('screen'), modal: document.getElementById('modal-root'), toast: document.getElementById('toast-root') }; document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1].close(); }); }

  function screen(name, html) {
    const s = refs.screen; s.classList.remove('enter'); void s.offsetWidth; s.dataset.screen = name; s.innerHTML = html; s.classList.add('enter'); root.scrollTo(0, 0);
    const first = s.querySelector('[autofocus]'); if (first) first.focus();
    return s;
  }

  function hud(o) {
    if (!o) { refs.hud.innerHTML = ''; refs.hud.hidden = true; return; }
    refs.hud.hidden = false;
    refs.hud.innerHTML = `<div class="hud-inner"><button type="button" class="hud-brand" data-act="map" aria-label="Back to the map">${icon('map')}<span>${esc(RX.UNIT.brand)}</span></button>${RX.UNIT.hubUrl ? `<a class="hud-atlas" href="${esc(RX.UNIT.hubUrl)}" aria-label="Back to the Expedition Atlas">${icon('atlas')}<span>Atlas</span></a>` : ''}
      <div class="hud-mid">${o.title ? `<span class="hud-zone">${esc(o.title)}</span>` : ''}${o.sub ? `<span class="hud-sub">${esc(o.sub)}</span>` : ''}${o.dots ? `<div class="hud-dots" role="img" aria-label="Question ${Math.max(1, o.dots.indexOf('now') + 1)} of ${o.dots.length}: ${o.dots.filter((d) => d === 'done').length} correct so far">${o.dots.map((d) => `<span class="dot ${d}"></span>`).join('')}</div>` : ''}</div>
      <div class="hud-right"><span class="hud-stat" title="Experience points">${icon('xp')}<b>${o.xp}</b> XP</span><span class="hud-stat ${o.streak >= 3 ? 'hot' : ''}" title="Streak">${icon('flame')}<b>${o.streak}</b></span>
      <button type="button" class="hud-btn" data-act="guide" aria-label="Field Guide">${icon('book')}<span>Field Guide</span></button><button type="button" class="hud-btn" data-act="settings" aria-label="Settings">${icon('settings')}</button></div></div>`;
  }

  function modal(o) {
    const back = h(`<div class="modal-back" role="presentation"><div class="modal ${o.wide ? 'modal-wide' : ''} ${o.cls || ''}" role="dialog" aria-modal="true" aria-labelledby="m-title-${modalStack.length}"><div class="modal-head"><h2 id="m-title-${modalStack.length}">${o.title}</h2>${o.noClose ? '' : `<button type="button" class="modal-x" aria-label="Close">${icon('x')}</button>`}</div><div class="modal-body">${o.body || ''}</div>${o.actions && o.actions.length ? `<div class="modal-actions">${o.actions.map((a, i) => `<button type="button" class="btn ${a.cls || 'btn-ghost'}" data-i="${i}">${a.label}</button>`).join('')}</div>` : ''}</div></div>`);
    const prevFocus = document.activeElement;
    const entry = { close() { back.classList.add('leaving'); setTimeout(() => back.remove(), 160); modalStack = modalStack.filter((m) => m !== entry); if (o.onClose) o.onClose(); if (prevFocus && prevFocus.focus) prevFocus.focus(); } };
    modalStack.push(entry);
    back.addEventListener('click', (e) => { if (e.target === back && !o.noClose) entry.close(); });
    const x = back.querySelector('.modal-x'); if (x) x.addEventListener('click', entry.close);
    (o.actions || []).forEach((a, i) => back.querySelector(`.modal-actions [data-i="${i}"]`).addEventListener('click', () => { const r = a.onClick ? a.onClick(entry) : null; if (r !== false && !a.keep) entry.close(); }));
    refs.modal.appendChild(back);
    const f = back.querySelector('.modal-actions .btn-primary, .modal-actions .btn, .modal-x, [tabindex], input, button'); if (f) setTimeout(() => f.focus(), 30);
    // focus trap
    back.addEventListener('keydown', (e) => { if (e.key !== 'Tab') return; const items = Array.from(back.querySelectorAll('button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])')); if (!items.length) return; const first = items[0], last = items[items.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } });
    entry.el = back;
    return entry;
  }
  function confirm(title, body, okLabel) { return new Promise((res) => { modal({ title, body, actions: [{ label: 'Cancel', onClick: () => res(false) }, { label: okLabel || 'Yes', cls: 'btn-danger', onClick: () => res(true) }], onClose: () => res(false) }); }); }
  function toast(msg, kind) { const t = h(`<div class="toast ${kind || ''}" role="status">${msg}</div>`); refs.toast.appendChild(t); setTimeout(() => t.classList.add('show'), 10); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2800); }

  /** Read text aloud. lang 'es' picks a Spanish voice when the device has one. */
  function speak(text, lang) {
    try {
      if (!root.speechSynthesis) return;
      root.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g, ' ').trim());
      u.rate = 0.95;
      if (lang === 'es') {
        u.lang = 'es-US';
        const v = root.speechSynthesis.getVoices().find((x) => /^es(-|_)/i.test(x.lang));
        if (v) u.voice = v;
      }
      root.speechSynthesis.speak(u);
    } catch (e) { /* unsupported */ }
  }

  // ---------- Map ----------
  /** Node positions (percent of the map canvas). A pack may supply RX.UNIT.mapPositions; otherwise a serpentine route is generated. */
  function nodePositions() {
    if (RX.UNIT.mapPositions) return RX.UNIT.mapPositions;
    const core = RX.ZONES.filter((z) => !z.optional);
    const pos = {};
    const n = core.length;
    const ys = [78, 46, 70, 36, 62, 30, 58, 26, 52, 22, 48, 18];
    core.forEach((z, i) => {
      const x = n === 1 ? 50 : 7 + (86 * i) / (n - 1);
      pos[z.id] = [Math.round(x), z.final ? 12 : ys[i % ys.length]];
    });
    RX.ZONES.filter((z) => z.optional).forEach((z, k) => {
      const anchor = pos[z.unlockAfter] || [50, 50];
      pos[z.id] = [Math.min(92, anchor[0] + 6 + k * 10), Math.min(94, anchor[1] + 22)];
    });
    return pos;
  }
  const curve = (pts) => pts.map((p, i) => (i === 0 ? `M${p[0] * 10},${p[1] * 5}` : `C${pts[i - 1][0] * 10 + 60},${pts[i - 1][1] * 5} ${p[0] * 10 - 60},${p[1] * 5} ${p[0] * 10},${p[1] * 5}`)).join(' ');
  function mapSvg(s) {
    const NODE_POS = nodePositions();
    const core = RX.ZONES.filter((z) => !z.optional);
    const pts = core.map((z) => NODE_POS[z.id]);
    const path = curve(pts);
    let doneUpTo = 0; core.forEach((z, i) => { if (RX.Rules.isZoneComplete(s, z.id)) doneUpTo = i + 1; });
    const donePath = curve(pts.slice(0, Math.max(1, doneUpTo + 1)));
    const side = RX.ZONES.filter((z) => z.optional).map((z) => { const a = NODE_POS[z.unlockAfter], b = NODE_POS[z.id]; return `<path d="M${a[0] * 10},${a[1] * 5} C${a[0] * 10 + 20},${a[1] * 5 + 60} ${b[0] * 10 - 20},${b[1] * 5 - 40} ${b[0] * 10},${b[1] * 5}" class="map-path map-path-side"/>`; }).join('');
    return `<svg class="map-svg" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="topo" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M0 60c30-20 60 20 120 0M0 90c30-20 60 20 120 0M0 30c30-20 60 20 120 0" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1.5"/></pattern></defs>
      <rect width="1000" height="500" fill="url(#topo)"/>
      <path d="M0 420 L120 300 L220 360 L340 250 L470 300 L600 180 L720 240 L860 120 L1000 160 L1000 500 L0 500Z" fill="rgba(255,255,255,.035)"/>
      <path d="${path}" class="map-path" /><path d="${donePath}" class="map-path-done" style="${doneUpTo === 0 ? 'display:none' : ''}"/>${side}</svg>`;
  }
  function mapNodes(s) {
    const NODE_POS = nodePositions();
    return RX.ZONES.map((z) => {
      const [x, y] = NODE_POS[z.id];
      const unlocked = RX.Rules.isUnlocked(s, z.id), done = RX.Rules.isZoneComplete(s, z.id), p = RX.Rules.zoneProgress(s, z.id);
      const next = RX.Rules.nextZone(s); const isCurrent = next && next.id === z.id;
      const cls = ['map-node', done ? 'is-done' : '', unlocked ? '' : 'is-locked', isCurrent ? 'is-current' : '', z.optional ? 'is-optional' : '', z.final ? 'is-final' : ''].join(' ');
      return `<button type="button" class="${cls}" style="left:${x}%;top:${y}%;--accent:${z.accent}" data-zone="${z.id}" ${unlocked ? '' : 'aria-disabled="true"'} aria-label="${esc(z.name)}: ${done ? 'completed' : unlocked ? (p.done ? p.done + ' of ' + p.total + ' missions done' : 'unlocked') : 'locked'}">
        <span class="node-emblem">${icon(done ? 'check' : unlocked ? z.emblem : 'lock')}</span><span class="node-label">${esc(z.name)}</span>${p.done && !done ? `<span class="node-prog">${p.done}/${p.total}</span>` : ''}${isCurrent ? '<span class="node-pulse" aria-hidden="true"></span>' : ''}</button>`;
    }).join('');
  }
  function mapList(s) {
    return RX.ZONES.map((z) => { const unlocked = RX.Rules.isUnlocked(s, z.id), done = RX.Rules.isZoneComplete(s, z.id), p = RX.Rules.zoneProgress(s, z.id); return `<button type="button" class="zone-card ${done ? 'is-done' : ''} ${unlocked ? '' : 'is-locked'}" data-zone="${z.id}" style="--accent:${z.accent}" ${unlocked ? '' : 'aria-disabled="true"'}><span class="zc-emblem">${icon(done ? 'check' : unlocked ? z.emblem : 'lock')}</span><span class="zc-body"><span class="zc-name">${esc(z.name)}</span><span class="zc-lesson">Lesson ${esc(z.lesson)} · ${esc(z.lessonName)}</span><span class="zc-blurb">${z.blurb}</span></span><span class="zc-status">${done ? 'Complete' : unlocked ? `${p.done}/${p.total}` : 'Locked'}</span></button>`; }).join('');
  }

  RX.UI = { mount, screen, hud, modal, confirm, toast, speak, mapSvg, mapNodes, mapList, nodePositions, h, refs: () => refs };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — support layer: student levels, Key Words screen, inline first hint (with Spanish),
   worked examples, and the portable progress code used by the teacher's Class Snapshot. No game flow lives here. */
(function (root) {
  'use strict';
  const RX = root.RX;

  const LEVELS = [
    { id: 0, label: 'Level 0 · Most Support', short: 'Level 0', desc: 'Key words first, a hint on every question, read-aloud on, Spanish help.' },
    { id: 1, label: 'Level 1 · Support', short: 'Level 1', desc: 'Key words first. A hint appears after a wrong try.' },
    { id: 2, label: 'Level 2 · Enrichment', short: 'Level 2', desc: 'Harder versions of every challenge. Hints only when you ask. More XP.' },
  ];
  const levelOf = (s) => (s && s.settings && [0, 1, 2].includes(s.settings.level) ? s.settings.level : 1);
  const levelInfo = (id) => LEVELS.find((l) => l.id === id) || LEVELS[1];
  const LEVEL2_XP = 1.25;

  /** Level picker markup: radio cards. Bind with bindLevelPicker(container, onChange). */
  function levelPicker(current, name) {
    return `<div class="lvl-pick" role="radiogroup" aria-label="Choose your level">${LEVELS.map((l) => `<label class="lvl-card ${l.id === current ? 'is-on' : ''}"><input type="radio" name="${name || 'rx-level'}" value="${l.id}" ${l.id === current ? 'checked' : ''}><span class="lvl-k">${RX.esc(l.label)}</span><span class="lvl-d">${RX.esc(l.desc)}</span></label>`).join('')}</div>`;
  }
  function bindLevelPicker(el, onChange) {
    el.querySelectorAll('.lvl-card input').forEach((inp) =>
      inp.addEventListener('change', () => {
        el.querySelectorAll('.lvl-card').forEach((c) => c.classList.toggle('is-on', c.contains(inp) && inp.checked));
        onChange(Number(inp.value));
      }),
    );
  }

  // ---------- Key Words ----------
  const lessonIds = (z) =>
    String(z.lesson || '')
      .split(/\s*\/\s*/)
      .filter(Boolean);
  function keyWordsFor(z) {
    if (!z || z.final || z.optional) return [];
    const ids = lessonIds(z);
    return (RX.VOCAB || []).filter((v) => Array.isArray(v.lessons) && v.lessons.some((l) => ids.includes(l)));
  }
  function keyWordCard(v, i, showEs) {
    const vis = v.visual ? `<div class="kw-viz">${v.visual()}</div>` : '';
    return `<article class="kw-card" style="--d:${i}"><div class="kw-text"><h3 class="kw-term">${RX.esc(v.term)}</h3>${v.es ? `<p class="kw-es" ${showEs ? '' : 'hidden'}><span class="kw-flag">ES</span> ${RX.esc(v.es)}</p>` : ''}<p class="kw-def">${v.def}</p>${v.esDef ? `<p class="kw-esdef" ${showEs ? '' : 'hidden'}>${RX.esc(v.esDef)}</p>` : ''}${v.ex ? `<p class="kw-ex"><b>Example:</b> ${RX.esc(v.ex)}</p>` : ''}</div>${vis}</article>`;
  }
  /** Full-screen Key Words step before a zone's first mission. opts: { level, onStart, onBack } */
  function showKeyWords(z, opts) {
    const words = keyWordsFor(z);
    const showEs = opts.level === 0;
    RX.UI.hud({ xp: opts.xp, streak: opts.streak, title: z.name, sub: 'Key words' });
    RX.UI.screen(
      'keywords',
      `<section class="keywords" style="--accent:${z.accent}"><div class="kw-head"><p class="eyebrow">Lesson ${RX.esc(z.lesson)} · ${RX.esc(z.lessonName)}</p><h2>Key words for ${RX.esc(z.name)}</h2><p class="lede">Read each word, its meaning, and the picture. You will use these words in the challenges.</p>
      <div class="kw-tools"><button type="button" class="btn btn-ghost btn-sm" id="kw-es" aria-pressed="${showEs}">${RX.icon('book')} <span>${showEs ? 'Hide Español' : 'Español'}</span></button><button type="button" class="btn btn-ghost btn-sm" id="kw-speak">${RX.icon('speaker')} Read aloud</button></div></div>
      <div class="kw-grid" style="--kw-cols:${words.length === 4 || words.length === 2 ? 2 : 3}">${words.map((v, i) => keyWordCard(v, i, showEs)).join('')}</div>
      <div class="title-actions"><button type="button" class="btn btn-primary btn-lg" id="kw-go">I know these words. Start ${RX.icon('arrow')}</button><button type="button" class="btn btn-ghost" id="kw-back">Back to the map</button></div></section>`,
    );
    const tog = document.getElementById('kw-es');
    tog.addEventListener('click', () => {
      const on = tog.getAttribute('aria-pressed') !== 'true';
      tog.setAttribute('aria-pressed', String(on));
      tog.querySelector('span').textContent = on ? 'Hide Español' : 'Español';
      document.querySelectorAll('.kw-es, .kw-esdef').forEach((el) => {
        el.hidden = !on;
      });
    });
    document.getElementById('kw-speak').addEventListener('click', () => RX.UI.speak(words.map((v) => `${v.term}. ${String(v.def).replace(/<[^>]+>/g, '')}`).join(' ')));
    document.getElementById('kw-go').addEventListener('click', opts.onStart);
    document.getElementById('kw-back').addEventListener('click', opts.onBack);
  }

  // ---------- Inline first hint ----------
  function inlineHintHtml(q, visible) {
    if (!q.hints || !q.hints[0]) return '';
    return `<div class="q-inline" id="q-inline" ${visible ? '' : 'hidden'}><div class="qi-head"><span class="qi-k">${RX.icon('bulb')} Hint</span><span class="qi-tools"><button type="button" class="qi-lang qi-say" id="qi-say" aria-label="Read the hint aloud">${RX.icon('speaker')}</button>${q.hintEs ? '<button type="button" class="qi-lang" id="qi-lang" aria-pressed="false">Español</button>' : ''}</span></div><div class="qi-en">${q.hints[0]}</div>${q.hintEs ? `<div class="qi-es" hidden lang="es">${q.hintEs}</div>` : ''}</div>`;
  }
  function bindInlineHint() {
    const say = document.getElementById('qi-say');
    if (say) say.addEventListener('click', () => { const es = document.querySelector('#q-inline .qi-es'); const useEs = es && !es.hidden; RX.UI.speak((useEs ? es : document.querySelector('#q-inline .qi-en')).innerText, useEs ? 'es' : 'en'); });
    const b = document.getElementById('qi-lang');
    if (!b) return;
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      b.textContent = on ? 'English' : 'Español';
      document.querySelector('#q-inline .qi-en').hidden = on;
      document.querySelector('#q-inline .qi-es').hidden = !on;
    });
  }
  function revealInlineHint() {
    const el = document.getElementById('q-inline');
    if (el && el.hidden) {
      el.hidden = false;
      el.classList.add('is-new');
    }
  }

  // ---------- Worked example: same generator, different numbers ----------
  function workedExample(q, seed, level) {
    try {
      const ex = RX.G.make(q.gen, RX.R.make((seed ^ 0x5bd1e995) >>> 0), level === 2 ? { hard: true } : {});
      if (RX.stripTags ? RX.stripTags(ex.prompt) === RX.stripTags(q.prompt) : ex.prompt === q.prompt) return null;
      return `<div class="worked"><span class="worked-k">${RX.icon('book')} Worked example · different numbers</span><div class="worked-q">${ex.prompt}</div><div class="worked-s">${ex.solution}</div><p class="worked-foot">Now use the same steps on your own question.</p></div>`;
    } catch (e) {
      return null;
    }
  }

  // ---------- Portable progress code (student report → teacher Class Snapshot) ----------
  const b64e = (str) =>
    root
      .btoa(unescape(encodeURIComponent(str)))
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/, '');
  const b64d = (str) => decodeURIComponent(escape(root.atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4))));
  function progressPayload(s, unitKey, name) {
    const k = {};
    Object.keys(s.skills || {}).forEach((id) => {
      const sk = s.skills[id];
      if (sk.seen) k[id] = [sk.seen, sk.first];
    });
    const zonesDone = Object.keys(s.zones || {}).filter((z) => s.zones[z].completed).length;
    const d = new Date();
    return {
      v: 1,
      u: unitKey,
      n: String(name || '').slice(0, 40),
      d: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
      l: levelOf(s),
      x: s.xp || 0,
      a: (s.stats && s.stats.answered) || 0,
      f: (s.stats && s.stats.firstTry) || 0,
      z: zonesDone,
      k,
    };
  }
  const encodeProgress = (p) => 'RX1.' + b64e(JSON.stringify(p));
  /** Find every RX1 code in pasted text. Returns [{...payload}] (invalid codes are skipped and counted). */
  function decodeAll(text) {
    const out = [];
    let bad = 0;
    String(text || '').replace(/RX1\.([A-Za-z0-9_-]{8,})/g, (m, body) => {
      try {
        const p = JSON.parse(b64d(body));
        if (p && p.v === 1 && p.u && p.k) out.push(p);
        else bad++;
      } catch (e) {
        bad++;
      }
      return m;
    });
    return { codes: out, bad };
  }

  RX.Support = {
    LEVELS,
    LEVEL2_XP,
    levelOf,
    levelInfo,
    levelPicker,
    bindLevelPicker,
    keyWordsFor,
    showKeyWords,
    inlineHintHtml,
    bindInlineHint,
    revealInlineHint,
    workedExample,
    progressPayload,
    encodeProgress,
    decodeAll,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — Mission Report screen, the copyable teacher report, and the name prompt.
   Split out of game.js; the controller passes its live state and navigation through ctx. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { UI, State, Rules, esc, icon } = RX;
  const Sup = () => RX.Support;
  let s, ctx;
  const levelNow = () => Sup().levelOf(s);
  const story = () => RX.STORY;
  const zoneById = (id) => RX.ZONES.find((z) => z.id === id);
  const exitTo = () => ctx.exitTo();
  const openZone = (z) => ctx.openZone(z);
  function skillReport() {
    return Object.keys(RX.SKILLS).map((k) => {
      const sk = s.skills[k] || { seen: 0, first: 0 };
      const rate = sk.seen ? sk.first / sk.seen : null;
      return {
        k,
        label: RX.SKILLS[k].label,
        lesson: RX.SKILLS[k].lesson,
        zone: RX.SKILLS[k].zone,
        rate,
        seen: sk.seen,
        band: rate == null ? 'Not yet seen' : Rules.skillBand(rate),
      };
    });
  }
  /** Plain-text report a student can paste into Canvas, email, or show a teacher. */
  function reportText() {
    const skills = skillReport();
    const acc = s.stats.answered ? Math.round((100 * s.stats.firstTry) / s.stats.answered) : 0;
    const zonesDone = RX.ZONES.filter((z) => Rules.isZoneComplete(s, z.id)).length;
    const lines = [
      `${RX.UNIT.brand} — Mission Report${s.settings.studentName ? ' — ' + s.settings.studentName : ''}`,
      `${RX.UNIT.unitLabel}`,
      `Date: ${new Date().toLocaleDateString()}`,
      '',
      `First-try accuracy: ${acc}%  ·  XP: ${s.xp}  ·  Zones cleared: ${zonesDone}/${RX.ZONES.length}  ·  Challenges answered: ${s.stats.answered}`,
      '',
      'Skills:',
    ];
    skills.forEach((x) =>
      lines.push(
        `  ${x.band === 'Strong' ? '✔' : x.band === 'Almost There' ? '~' : x.band === 'Not yet seen' ? '·' : '✘'} ${x.label} (Lesson ${x.lesson}): ${x.band}${x.seen ? ` — ${x.seen} seen` : ''}`,
      ),
    );
    lines.push('', `Achievements: ${Object.keys(s.achievements).length}/${RX.ACHIEVEMENTS.length}`);
    lines.push(`Level: ${Sup().levelInfo(levelNow()).label}`);
    lines.push('', `Teacher code: ${Sup().encodeProgress(Sup().progressPayload(s, RX.UNIT.id, s.settings.studentName))}`);
    return lines.join('\n');
  }
  /** Ask once for a name or initials so the teacher's Class Snapshot can tell reports apart. */
  function askName(then) {
    if (s.settings.studentName) return then();
    const m = UI.modal({
      title: `${icon('ref')} Your name for the report`,
      body: '<p>Type your first name or initials so your teacher knows whose report this is. It stays on this device.</p><label class="fld"><span class="fld-label">Name or initials</span><input type="text" id="rx-name" maxlength="40" autocomplete="off"></label>',
      actions: [
        { label: 'Cancel' },
        {
          label: 'Save and copy',
          cls: 'btn-primary',
          onClick: () => {
            const v = (m.el.querySelector('#rx-name').value || '').trim();
            if (!v) { UI.toast('Type a name or initials first.', 'warn'); return false; }
            s.settings.studentName = v;
            State.save();
            setTimeout(then, 50);
          },
        },
      ],
    });
  }
  function showResults() {
    s = State.load();
    const skills = skillReport();
    const seen = skills.filter((x) => x.rate != null);
    const strong = seen.filter((x) => x.band === 'Strong'),
      practice = seen.filter((x) => x.band !== 'Strong');
    const acc = s.stats.answered ? Math.round((100 * s.stats.firstTry) / s.stats.answered) : 0;
    const zonesDone = RX.ZONES.filter((z) => Rules.isZoneComplete(s, z.id));
    const finished = Rules.isZoneComplete(s, Rules.finalZone().id);
    const opt = Rules.optionalZones()[0];
    UI.hud({ xp: s.xp, streak: s.streak, title: 'Mission Report' });
    UI.screen(
      'results',
      `<section class="results"><div class="results-card"><p class="eyebrow">${esc(RX.UNIT.brand)} · ${esc(RX.UNIT.unitLabel)}</p><h2>${finished ? 'Mission Complete' : 'Progress Report'}</h2><p class="lede">${finished ? story().resultsLede : 'Here is how the expedition is going so far. Keep clearing zones to finish the route.'}</p>
      <div class="stat-row"><div class="stat"><b>${acc}%</b><span>first-try accuracy</span></div><div class="stat"><b>${s.xp}</b><span>XP earned</span></div><div class="stat"><b>${zonesDone.length}/${RX.ZONES.length}</b><span>zones cleared</span></div><div class="stat"><b>${Object.keys(s.achievements).length}/${RX.ACHIEVEMENTS.length}</b><span>achievements</span></div></div>
      <div class="results-cols"><div><h3>Strongest skills</h3>${strong.length ? strong.map((x) => `<div class="skill-row"><span>${esc(x.label)}</span><span class="band band-strong">Strong</span></div>`).join('') : '<p class="muted">Keep practicing to build strong skills.</p>'}</div>
      <div><h3>Keep practicing</h3>${practice.length ? practice.map((x) => `<div class="skill-row"><span>${esc(x.label)}</span><span class="band band-${x.band.replace(/\s/g, '').toLowerCase()}">${x.band}</span></div>`).join('') : `<p class="muted">Every skill you have met is strong.${opt ? ` Try ${esc(opt.name)} for a challenge.` : ''}</p>`}</div></div>
      ${
        practice.length
          ? `<div class="recommend"><h3>Recommended replays</h3><div class="rec-list">${[...new Set(practice.map((x) => x.zone))]
              .filter((zid) => zoneById(zid))
              .map((zid) => {
                const z = zoneById(zid);
                return `<button type="button" class="btn btn-ghost" data-zone="${z.id}">${icon(z.emblem)} ${esc(z.name)}</button>`;
              })
              .join('')}</div></div>`
          : ''
      }
      <div class="ach-reveal">${RX.ACHIEVEMENTS.filter((a) => s.achievements[a.id])
        .map((a) => `<span class="ach-chip">${icon(a.icon)} ${esc(a.name)}</span>`)
        .join('')}</div>
      <div class="title-actions"><button type="button" class="btn btn-primary btn-lg" id="btn-map" autofocus>${RX.UNIT.onExit ? 'Back to the Atlas' : 'Back to the map'} ${icon('arrow')}</button><button type="button" class="btn btn-ghost" id="btn-copy">${icon('ref')} Copy report for my teacher</button><button type="button" class="btn btn-ghost" id="btn-print">${icon('print')} Print report</button></div></div></section>`,
    );
    document.getElementById('btn-map').addEventListener('click', exitTo);
    document.getElementById('btn-copy').addEventListener('click', () => askName(copyReport));
    async function copyReport() {
      const t = reportText();
      try {
        await navigator.clipboard.writeText(t);
        UI.toast('Report copied. Paste it anywhere.', 'ok');
      } catch (e) {
        UI.modal({
          title: 'Your report',
          body: `<pre class="report-pre">${esc(t)}</pre>`,
        });
      }
    }
    document.getElementById('btn-print').addEventListener('click', () => root.print());
    document.querySelectorAll('.rec-list [data-zone]').forEach((b) => b.addEventListener('click', () => openZone(zoneById(b.dataset.zone))));
  }


  RX.Report = {
    bind(c) { ctx = c; },
    showResults() { s = ctx.state(); showResults(); s = ctx.state(); },
    reportText() { s = ctx.state(); return reportText(); },
    skillReport() { s = ctx.state(); return skillReport(); },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — game controller: flow, scoring, feedback, hints, achievements.
   Everything unit-specific comes from the pack: RX.UNIT (ids, brand, save key), RX.STORY (text), RX.ZONES, RX.SKILLS, RX.VOCAB,
   RX.ACHIEVEMENTS, and optionally RX.REFERENCE_SHEET. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { UI, State, Rules, esc, icon } = RX;
  let s, widget, q, attempts, hintLevel, helpUsed, solutionShown;

  const XP_SECOND = 0.6,
    XP_AFTER_SOLUTION = 0.3;
  const zoneById = (id) => RX.ZONES.find((z) => z.id === id);
  const missionDef = (zid, mid) => zoneById(zid).missions.find((m) => m.id === mid);
  const story = () => RX.STORY;
  const Sup = () => RX.Support;
  const levelNow = () => Sup().levelOf(s);
  /** The challenge list of the running mission: an ad-hoc retry list, or the mission's own generators. */
  const specsOf = (cur) => cur.gens || missionDef(cur.zone, cur.mission).gens;
  const missionName = (cur) => (cur.retry ? 'Practice what you missed' : missionDef(cur.zone, cur.mission).name);
  const exitTo = () => (RX.UNIT.onExit ? RX.UNIT.onExit() : showMap());

  // ---------- Boot / title ----------
  function bindReport() {
    RX.Report.bind({ state: () => s, exitTo: () => exitTo(), openZone: (z) => openZone(z) });
  }
  function boot() {
    s = State.load();
    bindReport();
    applySettings();
    UI.mount();
    document.body.addEventListener('click', onGlobalClick);
    showTitle();
  }
  /** Boot straight into one mission (used by the Atlas for the Daily Trek). */
  let bootedOnce = false;
  function bootMission(zid, mid) {
    State.unload();
    s = State.load();
    bindReport();
    applySettings();
    UI.mount();
    if (!bootedOnce) {
      document.body.addEventListener('click', onGlobalClick);
      bootedOnce = true;
    }
    startMission(zid, mid);
  }
  function applySettings() {
    const st = s.settings;
    document.documentElement.classList.toggle('large-text', !!st.largeText);
    document.documentElement.classList.toggle('reduce-motion', !!st.reduceMotion);
    document.documentElement.classList.toggle('dyslexic', !!st.dyslexic);
    [0, 1, 2].forEach((l) => document.documentElement.classList.toggle('level-' + l, levelNow() === l));
  }
  function onGlobalClick(e) {
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    if (a === 'map') {
      if (s.current && document.getElementById('screen').dataset.screen === 'mission') {
        UI.confirm('Leave this mission?', '<p>Your zone progress is saved. This mission will restart from its first question next time.</p>', 'Leave').then((ok) => {
          if (ok) {
            s.current = null;
            State.save();
            exitTo();
          }
        });
      } else exitTo();
    } else if (a === 'guide') openFieldGuide();
    else if (a === 'settings') openSettings();
    else if (a === 'reference') openReference();
    else if (a === 'speak') {
      const el = document.querySelector('.q-prompt');
      if (el) UI.speak(el.innerText);
    }
  }

  function showTitle() {
    UI.hud(null);
    const has = State.hasProgress();
    const st = story();
    UI.screen(
      'title',
      `<section class="title"><div class="title-art ${esc(RX.UNIT.theme || '')}" aria-hidden="true"><div class="peak p1"></div><div class="peak p2"></div><div class="peak p3"></div><div class="beacon"></div></div>
      <div class="title-card"><p class="eyebrow">${esc(st.eyebrow)}</p><h1>${esc(st.titleA)} <span>${esc(st.titleB)}</span></h1><p class="lede">${st.lede}</p>
      <div class="title-actions">${has ? `<button type="button" class="btn btn-primary btn-lg" id="btn-continue" autofocus>${icon('arrow')} Continue Adventure</button><button type="button" class="btn btn-ghost btn-lg" id="btn-new">Start New Adventure</button>` : `<button type="button" class="btn btn-primary btn-lg" id="btn-new" autofocus>${icon('arrow')} ${esc(st.beginLabel || 'Begin the Expedition')}</button>`}${RX.UNIT.hubUrl ? `<a class="btn btn-ghost btn-lg" href="${esc(RX.UNIT.hubUrl)}">${icon('atlas')} Expedition Atlas</a>` : ''}</div>
      ${has ? `<p class="title-meta">${s.xp} XP · ${Rules.overallProgress(s).pct}% of the route mapped</p>` : ''}</div></section>`,
    );
    const c = document.getElementById('btn-continue');
    if (c)
      c.addEventListener('click', () => {
        if (s.current) {
          try {
            renderQuestion();
            return;
          } catch (e) {
            s.current = null;
            State.save();
          }
        }
        showMap();
      });
    document.getElementById('btn-new').addEventListener('click', async () => {
      if (has) {
        const ok = await UI.confirm('Start a new adventure?', '<p>This erases all saved progress, XP, and collectibles for this expedition on this device.</p>', 'Erase and restart');
        if (!ok) return;
        State.reset();
        s = State.load();
      }
      s.startedAt = Date.now();
      State.save();
      showIntro();
    });
  }

  function showIntro() {
    UI.hud(null);
    const st = story();
    UI.screen(
      'intro',
      `<section class="intro"><div class="intro-card"><p class="eyebrow">Mission Briefing</p><h2>${esc(st.briefingTitle)}</h2>${st.intro.map((p) => `<p>${p}</p>`).join('')}
      <div class="brief-grid"><div><span class="brief-k">Your role</span><span>${esc(st.role)}</span></div><div><span class="brief-k">Objective</span><span>${esc(st.objective)}</span></div><div><span class="brief-k">Tools</span><span>${esc(st.tools)}</span></div></div>
      <h3 class="lvl-h">Choose how you want to play</h3><p class="muted">You can change this any time in Settings.</p>${Sup().levelPicker(levelNow(), 'intro-level')}
      <div class="title-actions"><button type="button" class="btn btn-primary btn-lg" id="btn-go" autofocus>Open the Map ${icon('arrow')}</button></div></div></section>`,
    );
    Sup().bindLevelPicker(document.querySelector('.intro .lvl-pick'), setLevel);
    document.getElementById('btn-go').addEventListener('click', showMap);
  }

  // ---------- Map ----------
  function showMap() {
    s = State.load();
    const prog = Rules.overallProgress(s),
      next = Rules.nextZone(s),
      fin = Rules.finalZone();
    UI.hud({
      xp: s.xp,
      streak: s.streak,
      title: 'Expedition Map',
      sub: next ? `Next: ${next.name}` : 'Route complete',
    });
    const arts = RX.ZONES.map(
      (z) =>
        `<span class="art ${s.collectibles.includes(z.artifact.id) ? 'is-got' : ''}" title="${esc(z.artifact.name)}${s.collectibles.includes(z.artifact.id) ? '' : ' (not yet found)'}">${icon(z.artifact.icon)}<span>${esc(z.artifact.name)}</span></span>`,
    ).join('');
    UI.screen(
      'map',
      `<section class="map-screen"><div class="map-top"><div><p class="eyebrow">${esc(story().mapEyebrow)}</p><h2>Expedition Map</h2></div><div class="map-progress" aria-label="Overall progress ${prog.pct}%"><div class="bar"><div class="bar-fill" style="width:${prog.pct}%"></div></div><span>${prog.done} of ${prog.total} missions · ${prog.pct}%</span></div></div>
      <div class="map-wrap"><div class="map-canvas">${UI.mapSvg(s)}${UI.mapNodes(s)}</div><div class="map-list">${UI.mapList(s)}</div></div>
      <div class="map-bottom"><div class="satchel"><span class="satchel-title">${icon('satchel')} ${esc(story().satchel || 'Satchel')}</span><div class="arts">${arts}</div></div>
        <div class="map-actions">${Rules.isZoneComplete(s, fin.id) ? `<button type="button" class="btn btn-primary" id="btn-results">${icon('chart')} View Mission Report</button>` : `<button type="button" class="btn btn-ghost" id="btn-results">${icon('chart')} Progress Report</button>`}<button type="button" class="btn btn-ghost" id="btn-ach">${icon('medal')} Achievements (${Object.keys(s.achievements).length}/${RX.ACHIEVEMENTS.length})</button></div></div></section>`,
    );
    document.querySelectorAll('[data-zone]').forEach((b) =>
      b.addEventListener('click', () => {
        const z = zoneById(b.dataset.zone);
        if (!Rules.isUnlocked(s, z.id)) {
          UI.toast(`${z.name} is locked. Finish ${lockReason(z)} first.`, 'warn');
          return;
        }
        openZone(z);
      }),
    );
    document.getElementById('btn-results').addEventListener('click', showResults);
    document.getElementById('btn-ach').addEventListener('click', openAchievements);
  }
  function lockReason(z) {
    if (z.optional) return zoneById(z.unlockAfter).name;
    const core = RX.ZONES.filter((x) => !x.optional);
    const i = core.findIndex((x) => x.id === z.id);
    if (z.final) {
      const left = core.slice(0, i).filter((x) => !Rules.isZoneComplete(s, x.id));
      return left.length === 1 ? left[0].name : 'every zone';
    }
    return core[i - 1].name;
  }

  function openZone(z) {
    if (z.optional) {
      const got = Rules.evaluate(s, { event: 'enter', zone: z.id });
      State.save();
      announce(got);
    }
    const body = `<p class="zone-story">${z.story}</p><p class="zone-lesson">${icon('book')} Lesson ${esc(z.lesson)} · ${esc(z.lessonName)}</p><div class="mission-list">${z.missions
      .map((m, i) => {
        const md = s.zones[z.id] && s.zones[z.id].missions[m.id];
        const done = md && md.completed;
        const prev = i === 0 || (s.zones[z.id] && s.zones[z.id].missions[z.missions[i - 1].id] && s.zones[z.id].missions[z.missions[i - 1].id].completed);
        const open = z.final ? prev : true;
        return `<button type="button" class="mission-row ${done ? 'is-done' : ''} ${open ? '' : 'is-locked'}" data-m="${m.id}" ${open ? '' : 'disabled'}><span class="mr-num">${done ? icon('check') : open ? i + 1 : icon('lock')}</span><span class="mr-body"><span class="mr-name">${esc(m.name)}</span><span class="mr-meta">${m.gens.length} challenges${done ? ` · best ${md.best.first}/${md.best.total} first try` : ''}</span></span><span class="mr-cta">${done ? 'Replay' : 'Start'} ${icon('arrow')}</span></button>`;
      })
      .join('')}</div>`;
    const words = Sup().keyWordsFor(z);
    const m = UI.modal({
      title: `<span class="zone-title" style="--accent:${z.accent}">${icon(z.emblem)} ${esc(z.name)}</span>`,
      body: body + (words.length ? `<div class="zone-kw"><span>${icon('book')} Key words: ${words.map((v) => esc(v.term)).join(' · ')}</span><button type="button" class="btn btn-ghost btn-sm" id="zone-kw-open">Review key words</button></div>` : ''),
      cls: 'modal-zone',
    });
    const go = (mid) => {
      s.kwSeen = s.kwSeen || {};
      const gate = words.length && levelNow() <= 1 && !s.kwSeen[z.id];
      if (!gate) return startMission(z.id, mid);
      showKeyWordsFor(z, () => startMission(z.id, mid));
    };
    m.el.querySelectorAll('.mission-row').forEach((b) =>
      b.addEventListener('click', () => {
        m.close();
        go(b.dataset.m);
      }),
    );
    const kwb = m.el.querySelector('#zone-kw-open');
    if (kwb) kwb.addEventListener('click', () => { m.close(); showKeyWordsFor(z, () => openZone(z)); });
  }

  function showKeyWordsFor(z, then) {
    Sup().showKeyWords(z, {
      level: levelNow(),
      xp: s.xp,
      streak: s.streak,
      onStart: () => { s.kwSeen = s.kwSeen || {}; s.kwSeen[z.id] = Date.now(); State.save(); then(); },
      onBack: showMap,
    });
  }
  function setLevel(l) {
    s.settings.level = l;
    if (l === 0) s.settings.readAloud = true;
    State.save();
    applySettings();
    UI.toast(`${Sup().levelInfo(l).label} is on.`, 'ok');
  }

  // ---------- Mission flow ----------
  function startMission(zid, mid, extra) {
    const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
    s.current = Object.assign({ zone: zid, mission: mid, seed, qIndex: 0, results: [], level: levelNow() }, extra || {});
    State.save();
    renderQuestion();
  }
  function buildQuestions(cur) {
    const r = RX.R.make(cur.seed);
    const hard = cur.level === 2;
    return specsOf(cur).map((g) => {
      const [key, opts] = Array.isArray(g) ? g : [g, {}];
      return RX.G.make(key, r, hard ? Object.assign({}, opts, { hard: true }) : opts);
    });
  }
  function dotsFor(cur, qs) {
    return qs.map((_, i) => (i < cur.qIndex ? (cur.results[i] && cur.results[i].correct ? 'done' : 'miss') : i === cur.qIndex ? 'now' : ''));
  }
  function renderQuestion() {
    const cur = s.current;
    const z = zoneById(cur.zone),
      m = { name: missionName(cur) };
    const qs = buildQuestions(cur);
    q = qs[cur.qIndex];
    attempts = 0;
    hintLevel = 0;
    helpUsed = false;
    solutionShown = false;
    UI.hud({
      xp: s.xp,
      streak: s.streak,
      title: z.name,
      sub: m.name,
      dots: dotsFor(cur, qs),
    });
    const skill = RX.SKILLS[q.skill];
    const glyphWord = story().glyphWord || 'glyph';
    UI.screen(
      'mission',
      `<section class="mission" style="--accent:${z.accent}"><div class="q-card"><div class="q-head"><span class="q-skill">${icon('star')} Skill: ${esc(skill.label)}</span><span class="q-num">Challenge ${cur.qIndex + 1} of ${qs.length}${z.final ? ' · ' + esc(glyphWord.charAt(0).toUpperCase() + glyphWord.slice(1)) : ''}</span></div>
      ${z.final ? `<div class="glyphs" aria-label="Chamber ${esc(glyphWord)}s">${qs.map((_, i) => `<span class="glyph ${i < cur.qIndex ? 'is-lit' : i === cur.qIndex ? 'is-now' : ''}">${icon('star')}</span>`).join('')}<span class="glyph-label">${cur.qIndex} of ${qs.length} ${esc(glyphWord)}s lit</span></div>` : ''}<h2 class="q-title">${esc(q.title)}</h2><div class="q-prompt">${q.prompt}</div>${Sup().inlineHintHtml(q, cur.level === 0)}<div class="q-body" id="q-body"></div>
      <div class="q-actions"><div class="q-actions-left"><button type="button" class="btn btn-ghost" id="btn-help">${icon('help')} Need help?</button>${q.reference && RX.REFERENCE_SHEET ? `<button type="button" class="btn btn-ghost" data-act="reference">${icon('ref')} Reference sheet</button>` : ''}${s.settings.readAloud ? `<button type="button" class="btn btn-ghost btn-icon" data-act="speak" aria-label="Read aloud">${icon('speaker')}</button>` : ''}</div><button type="button" class="btn btn-primary" id="btn-check">Check answer</button></div>
      <div class="q-feedback" id="q-feedback" aria-live="polite" hidden></div></div></section>`,
    );
    widget = RX.Widgets[q.type](document.getElementById('q-body'), q, {
      submit,
    });
    document.getElementById('btn-check').addEventListener('click', submit);
    document.getElementById('btn-help').addEventListener('click', openHelp);
    Sup().bindInlineHint();
    setTimeout(() => {
      const first = document.querySelector('#q-body input, #q-body .choice, #q-body button');
      if (first && root.innerWidth > 700) first.focus({ preventScroll: true });
    }, 60);
  }

  function submit() {
    if (!widget || document.getElementById('btn-check').disabled) return;
    if (!widget.canSubmit()) {
      UI.toast('Finish answering before checking.', 'warn');
      const fb = document.getElementById('q-body');
      fb.classList.remove('shake');
      void fb.offsetWidth;
      fb.classList.add('shake');
      return;
    }
    const ans = widget.getAnswer();
    const res = RX.check(q, ans);
    attempts++;
    const cur = s.current;
    if (res.correct) {
      const first = attempts === 1 && !solutionShown;
      const mult = (solutionShown ? XP_AFTER_SOLUTION : attempts === 1 ? 1 : XP_SECOND) * (cur.level === 2 ? Sup().LEVEL2_XP : 1);
      const xp = Math.round(q.xp * mult);
      const missRunBefore = s.stats.missRun;
      s.xp += xp;
      s.streak += 1;
      s.bestStreak = Math.max(s.bestStreak, s.streak);
      s.stats.missRun = 0;
      recordResult({ correct: true, firstTry: first, attempts });
      if (first) {
        s.stats.skillFirst = s.stats.skillFirst || {};
        s.stats.skillFirst[q.skill] = (s.stats.skillFirst[q.skill] || 0) + 1;
        s.stats.typeFirst = s.stats.typeFirst || {};
        s.stats.typeFirst[q.type] = (s.stats.typeFirst[q.type] || 0) + 1;
      }
      if (q.type === 'error') s.stats.errorsSolved++;
      widget.markResult(Object.assign({ final: true }, res));
      widget.setDisabled(true);
      showFeedback(true, `${q.feedback.correct || 'Correct.'}`, xp, first);
      const got = Rules.evaluate(s, {
        event: 'answer',
        correct: true,
        missRunBefore,
      });
      State.save();
      announce(got);
    } else {
      s.streak = 0;
      if (attempts >= 2 || solutionShown) {
        s.stats.missRun++;
        recordResult({ correct: false, firstTry: false, attempts });
        widget.markResult(Object.assign({ final: true }, res));
        widget.setDisabled(true);
        showFeedback(false, `${wrongText(ans, res)}<div class="fb-solution"><span class="fb-label">${icon('bulb')} Here is how it works</span>${q.solution}</div>`, 0, false, true);
        State.save();
      } else {
        widget.markResult(Object.assign({ final: false }, res));
        if (cur.level <= 1) Sup().revealInlineHint();
        showFeedback(false, `${wrongText(ans, res)} <span class="fb-again">${cur.level <= 1 ? 'Read the hint above the answer area, then try once more.' : 'Try once more. You can also open <b>Need help?</b> for a hint.'}</span>`, 0, false, false);
        State.save();
      }
    }
    UI.hud({
      xp: s.xp,
      streak: s.streak,
      title: zoneById(cur.zone).name,
      sub: missionName(cur),
      dots: dotsFor(cur, buildQuestions(cur)),
    });
  }
  function wrongText(ans, res) {
    const w = q.feedback.wrong;
    let t;
    try {
      t = typeof w === 'function' ? w(ans, res.detail || {}) : w;
    } catch (e) {
      t = null; // a feedback function must never block the student; fall back below
    }
    if (!t && q.options && typeof ans === 'number' && q.options[ans] && q.options[ans].why) t = q.options[ans].why;
    if (!t) t = q.hints[0] || 'Not quite. Look at the question again.';
    return `<span class="fb-text">${t}</span>`;
  }
  function recordResult(r) {
    const cur = s.current;
    cur.results[cur.qIndex] = Object.assign({ gen: q.gen, skill: q.skill, help: helpUsed }, r);
    const sk = State.skill(q.skill);
    sk.seen++;
    sk.attempts += r.attempts;
    if (r.correct) sk.correct++;
    if (r.firstTry) sk.first++;
    s.stats.answered++;
    if (r.correct) s.stats.correct++;
    if (r.firstTry) s.stats.firstTry++;
  }
  function showFeedback(ok, html, xp, first, final) {
    const fb = document.getElementById('q-feedback');
    fb.hidden = false;
    fb.className = 'q-feedback ' + (ok ? 'is-ok' : final ? 'is-final' : 'is-retry');
    const done = ok || final;
    fb.innerHTML = `<div class="fb-head">${icon(ok ? 'check' : 'x')}<b>${ok ? (first ? 'Correct!' : 'Correct') : final ? "Let's look at the solution" : 'Not yet'}</b>${ok ? `<span class="fb-xp">+${xp} XP${first ? '' : ' (retry)'}</span>` : ''}</div><div class="fb-body">${html}</div>${done ? `<div class="fb-actions"><button type="button" class="btn btn-primary" id="btn-next">${s.current.qIndex + 1 < specsOf(s.current).length ? 'Next challenge' : s.current.retry ? 'Finish practice' : 'Finish mission'} ${icon('arrow')}</button></div>` : ''}`;
    const check = document.getElementById('btn-check');
    if (done) {
      check.disabled = true;
      document.getElementById('btn-next').addEventListener('click', next);
      setTimeout(() => {
        const b = document.getElementById('btn-next');
        if (b) b.focus();
      }, 50);
    } else {
      check.textContent = 'Check again';
    }
    fb.scrollIntoView({
      behavior: s.settings.reduceMotion ? 'auto' : 'smooth',
      block: 'nearest',
    });
  }
  function next() {
    const cur = s.current;
    cur.qIndex++;
    if (cur.qIndex >= specsOf(cur).length) return cur.retry ? completeRetry() : completeMission();
    State.save();
    renderQuestion();
  }

  function completeMission() {
    const cur = s.current,
      z = zoneById(cur.zone),
      m = missionDef(cur.zone, cur.mission);
    const total = cur.results.length,
      first = cur.results.filter((r) => r.firstTry).length,
      correct = cur.results.filter((r) => r.correct).length;
    const md = State.mission(z.id, m.id);
    md.plays++;
    md.completed = true;
    if (!md.best || first > md.best.first) md.best = { first, total };
    s.stats.missions++;
    const zoneState = State.zone(z.id);
    const zoneNowDone = z.missions.every((mm) => zoneState.missions[mm.id] && zoneState.missions[mm.id].completed);
    let newArtifact = null;
    if (zoneNowDone && !zoneState.completed) {
      zoneState.completed = true;
      zoneState.completedAt = Date.now();
      if (!s.collectibles.includes(z.artifact.id)) {
        s.collectibles.push(z.artifact.id);
        newArtifact = z.artifact;
      }
    }
    const firstRate = zoneNowDone ? zoneFirstRate(z) : 0;
    const got = [].concat(Rules.evaluate(s, { event: 'mission', first, total }), zoneNowDone ? Rules.evaluate(s, { event: 'zone', zone: z.id, firstRate }) : []);
    s.current = null;
    State.save();
    const skillRows = summarizeSkills(cur.results);
    UI.hud({
      xp: s.xp,
      streak: s.streak,
      title: z.name,
      sub: 'Mission complete',
    });
    UI.screen(
      'complete',
      `<section class="complete" style="--accent:${z.accent}"><div class="complete-card"><div class="confetti" aria-hidden="true">${Array.from({ length: 18 }, (_, i) => `<i style="--i:${i}"></i>`).join('')}</div>
      <p class="eyebrow">${esc(z.name)} · ${esc(m.name)}</p><h2>${zoneNowDone && z.final ? esc(story().finalHeading) : zoneNowDone ? `${esc(z.name)} Cleared` : 'Mission Complete'}</h2>
      <div class="stat-row"><div class="stat"><b>${correct}/${total}</b><span>correct</span></div><div class="stat"><b>${first}/${total}</b><span>first try</span></div><div class="stat"><b>${s.xp}</b><span>total XP</span></div></div>
      ${newArtifact ? `<div class="artifact-reveal">${icon(newArtifact.icon)}<div><span class="ar-k">${esc(story().artifactWord || 'Instrument')} recovered</span><b>${esc(newArtifact.name)}</b></div></div>` : ''}
      ${
        got.length
          ? `<div class="ach-reveal">${got
              .map((id) => {
                const a = RX.ACHIEVEMENTS.find((x) => x.id === id);
                return `<span class="ach-chip">${icon(a.icon)} ${esc(a.name)}</span>`;
              })
              .join('')}</div>`
          : ''
      }
      <div class="skill-rows">${skillRows}</div>
      <div class="title-actions">${zoneNowDone && z.final ? `<button type="button" class="btn btn-primary btn-lg" id="btn-results" autofocus>${icon('chart')} See your Mission Report</button>` : `<button type="button" class="btn btn-primary btn-lg" id="btn-map" autofocus>${RX.UNIT.onExit ? 'Back to the Atlas' : 'Back to the map'} ${icon('arrow')}</button>`}${missedSpecs(cur, m).length ? `<button type="button" class="btn btn-ghost" id="btn-missed">${icon('bulb')} Practice the ${missedSpecs(cur, m).length} I missed (new numbers)</button>` : ''}<button type="button" class="btn btn-ghost" id="btn-replay">${icon('replay')} Replay this mission</button></div></div></section>`,
    );
    const bmiss = document.getElementById('btn-missed');
    if (bmiss) bmiss.addEventListener('click', () => startMission(z.id, m.id, { retry: true, gens: missedSpecs(cur, m) }));
    const bm = document.getElementById('btn-map');
    if (bm) bm.addEventListener('click', exitTo);
    const br = document.getElementById('btn-results');
    if (br) br.addEventListener('click', showResults);
    document.getElementById('btn-replay').addEventListener('click', () => startMission(z.id, m.id));
  }
  /** Generator specs a student did not get right on the first try in this run. */
  function missedSpecs(cur, m) {
    const specs = cur.gens || m.gens;
    return specs.filter((g, i) => cur.results[i] && !cur.results[i].firstTry);
  }
  function completeRetry() {
    const cur = s.current,
      z = zoneById(cur.zone);
    const total = cur.results.length,
      first = cur.results.filter((r) => r.firstTry).length;
    s.current = null;
    State.save();
    const still = cur.gens.filter((g, i) => cur.results[i] && !cur.results[i].firstTry);
    UI.hud({ xp: s.xp, streak: s.streak, title: z.name, sub: 'Practice complete' });
    UI.screen(
      'complete',
      `<section class="complete" style="--accent:${z.accent}"><div class="complete-card"><p class="eyebrow">${esc(z.name)} · Practice what you missed</p><h2>${first === total ? 'All fixed' : 'Practice complete'}</h2>
      <div class="stat-row"><div class="stat"><b>${first}/${total}</b><span>right on the first try</span></div><div class="stat"><b>${s.xp}</b><span>total XP</span></div></div>
      <p class="lede">${first === total ? 'You got every one of them this time. Those skills are stronger now.' : 'Each try with new numbers makes the skill stronger. Practice the rest again, or move on.'}</p>
      <div class="skill-rows">${summarizeSkills(cur.results)}</div>
      <div class="title-actions"><button type="button" class="btn btn-primary btn-lg" id="btn-map" autofocus>${RX.UNIT.onExit ? 'Back to the Atlas' : 'Back to the map'} ${icon('arrow')}</button>${still.length ? `<button type="button" class="btn btn-ghost" id="btn-again">${icon('replay')} Practice the ${still.length} again</button>` : ''}</div></div></section>`,
    );
    document.getElementById('btn-map').addEventListener('click', exitTo);
    const again = document.getElementById('btn-again');
    if (again) again.addEventListener('click', () => startMission(z.id, cur.mission, { retry: true, gens: still }));
  }
  function zoneFirstRate(z) {
    let f = 0,
      t = 0;
    z.missions.forEach((m) => {
      const md = s.zones[z.id].missions[m.id];
      if (md && md.best) {
        f += md.best.first;
        t += md.best.total;
      }
    });
    return t ? f / t : 0;
  }
  function summarizeSkills(results) {
    const by = {};
    results.forEach((r) => {
      const b = by[r.skill] || (by[r.skill] = { n: 0, first: 0 });
      b.n++;
      if (r.firstTry) b.first++;
    });
    return Object.keys(by)
      .map((k) => {
        const b = by[k],
          band = Rules.skillBand(b.first / b.n);
        return `<div class="skill-row"><span>${esc(RX.SKILLS[k].label)}</span><span class="band band-${band.replace(/\s/g, '').toLowerCase()}">${band}</span></div>`;
      })
      .join('');
  }

  // ---------- Help ----------
  function openHelp() {
    s.stats.helpOpened++;
    helpUsed = true;
    const got = Rules.evaluate(s, { event: 'help' });
    State.save();
    announce(got);
    let example = null;
    const render = () =>
      `${hintLevel >= 1 || levelNow() === 0 ? `<div class="help-ex">${example || '<button type="button" class="btn btn-ghost btn-sm" id="btn-example">' + icon('book') + ' See a worked example with different numbers</button>'}</div>` : ''}<div class="help-steps">${q.hints
        .slice(0, hintLevel)
        .map((t, i) => `<div class="help-step"><span class="hs-k">Hint ${i + 1}</span><div>${t}</div></div>`)
        .join(
          '',
        )}${solutionShown ? `<div class="help-step help-solution"><span class="hs-k">${icon('bulb')} Show me how</span><div>${q.solution}</div></div>` : ''}</div><p class="help-foot">${solutionShown ? 'Close this and enter the answer to finish the challenge.' : hintLevel < q.hints.length ? 'Try the problem after each hint. Open the next hint only if you are still stuck.' : 'The last step shows the full solution. Use it if you need it.'}</p>`;
    const m = UI.modal({
      title: `${icon('help')} Need help?`,
      body: render(),
      wide: true,
      actions: [
        { label: 'Close and try it', cls: 'btn-primary' },
        {
          label: hintLevel < q.hints.length ? 'Next hint' : 'Show me how',
          cls: 'btn-ghost',
          keep: true,
          onClick: (entry) => {
            if (hintLevel < q.hints.length) hintLevel++;
            else solutionShown = true;
            entry.el.querySelector('.modal-body').innerHTML = render();
            const b = entry.el.querySelector('.modal-actions [data-i="1"]');
            if (solutionShown) b.disabled = true;
            else if (hintLevel >= q.hints.length) b.textContent = 'Show me how';
            return false;
          },
        },
      ],
    });
    const body = m.el.querySelector('.modal-body');
    body.addEventListener('click', (e) => {
      if (!e.target.closest('#btn-example')) return;
      example = Sup().workedExample(q, (s.current.seed + s.current.qIndex * 7919) >>> 0, s.current.level) || '<p class="muted">No worked example is available for this one. Try the hints.</p>';
      body.innerHTML = render();
    });
    if (hintLevel === 0 && !solutionShown) {
      hintLevel = 1;
      body.innerHTML = render();
    }
  }

  // ---------- Modals: field guide, reference, settings, achievements ----------
  function openFieldGuide() {
    s.stats.helpOpened++;
    const got = Rules.evaluate(s, { event: 'help' });
    State.save();
    announce(got);
    UI.modal({
      title: `${icon('book')} Field Guide`,
      wide: true,
      body: `<p class="muted">Tap a term to see its meaning and an example.</p><div class="vocab">${RX.VOCAB.map((v) => `<details class="vocab-item"><summary>${esc(v.term)}${v.es ? ` <span class="vocab-es" lang="es">${esc(v.es)}</span>` : ''}</summary><div class="vocab-body"><p>${v.def}</p>${v.esDef ? `<p class="vocab-esdef" lang="es">${esc(v.esDef)}</p>` : ''}${v.ex ? `<p class="vocab-ex"><b>Example:</b> ${esc(v.ex)}</p>` : ''}${v.visual ? `<div class="vocab-viz">${v.visual()}</div>` : ''}</div></details>`).join('')}</div>${RX.REFERENCE_SHEET ? `<h3 class="ref-h">Reference sheet</h3>${RX.REFERENCE_SHEET}` : ''}`,
    });
  }
  function openReference() {
    if (RX.REFERENCE_SHEET)
      UI.modal({
        title: `${icon('ref')} ${esc(RX.REFERENCE_TITLE || 'Reference sheet')}`,
        body: RX.REFERENCE_SHEET,
      });
  }
  function openSettings() {
    const st = s.settings;
    const row = (k, label, desc) =>
      `<label class="setting"><span><b>${label}</b><small>${desc}</small></span><input type="checkbox" data-k="${k}" ${st[k] ? 'checked' : ''}><span class="switch" aria-hidden="true"></span></label>`;
    const m = UI.modal({
      title: `${icon('settings')} Settings`,
      body: `<h3 class="lvl-h">Level</h3>${Sup().levelPicker(levelNow(), 'set-level')}<p class="muted lvl-note">A new level starts with your next mission.</p><div class="settings">${row('readAloud', 'Read-aloud button', 'Adds a speaker button to each challenge.')}${row('largeText', 'Larger text', 'Increases text size across the game.')}${row('dyslexic', 'Extra letter spacing', 'Wider spacing between letters and lines.')}${row('reduceMotion', 'Reduce motion', 'Turns off animations and transitions.')}</div><div class="settings-reset"><button type="button" class="btn btn-ghost btn-sm" id="btn-reset">Reset Adventure</button><small>Teacher option. Erases all saved progress for this expedition on this device.</small></div>`,
    });
    Sup().bindLevelPicker(m.el.querySelector('.lvl-pick'), (l) => {
      setLevel(l);
      const ra = m.el.querySelector('input[data-k="readAloud"]');
      if (ra) ra.checked = !!s.settings.readAloud;
    });
    m.el.querySelectorAll('input[type="checkbox"]').forEach((c) =>
      c.addEventListener('change', () => {
        st[c.dataset.k] = c.checked;
        State.save();
        applySettings();
        if (c.dataset.k === 'readAloud' && document.getElementById('screen').dataset.screen === 'mission') {
          const left = document.querySelector('.q-actions-left');
          const ex = left.querySelector('[data-act="speak"]');
          if (c.checked && !ex) left.insertAdjacentHTML('beforeend', `<button type="button" class="btn btn-ghost btn-icon" data-act="speak" aria-label="Read aloud">${icon('speaker')}</button>`);
          if (!c.checked && ex) ex.remove();
        }
      }),
    );
    m.el.querySelector('#btn-reset').addEventListener('click', async () => {
      const ok = await UI.confirm('Reset the adventure?', '<p>This permanently erases progress, XP, achievements, and collectibles saved for this expedition on this device.</p>', 'Erase everything');
      if (!ok) return;
      State.reset();
      s = State.load();
      m.close();
      UI.toast('Adventure reset.', 'ok');
      showTitle();
    });
  }
  function openAchievements() {
    UI.modal({
      title: `${icon('medal')} Achievements`,
      wide: true,
      body: `<div class="ach-grid">${RX.ACHIEVEMENTS.map((a) => `<div class="ach ${s.achievements[a.id] ? 'is-got' : ''}"><span class="ach-ic">${icon(a.icon)}</span><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></div>`).join('')}</div>`,
    });
  }
  function announce(ids) {
    (ids || []).forEach((id, i) => {
      const a = RX.ACHIEVEMENTS.find((x) => x.id === id);
      setTimeout(() => UI.toast(`${icon('medal')} Achievement: <b>${esc(a.name)}</b>`, 'ach'), 300 + i * 900);
    });
  }

  // ---------- Results / report (js/engine/report.js) ----------
  function showResults() {
    RX.Report.showResults();
    s = State.load();
  }
  const reportText = () => RX.Report.reportText();
  const skillReport = () => RX.Report.skillReport();

  RX.Game = {
    boot,
    bootMission,
    showMap,
    startMission,
    showResults,
    reportText,
    skillReport,
    _debug: () => ({ q, widget, s }),
    resumeIfNeeded() {
      if (s.current) {
        try {
          renderQuestion();
          return true;
        } catch (e) {
          s.current = null;
          State.save();
        }
      }
      return false;
    },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — boot. Reads window.RX_CONFIG written by the page builder. */
(function () {
  'use strict';
  document.addEventListener('DOMContentLoaded', function () {
    const cfg = window.RX_CONFIG || {};
    if (cfg.hubUrl) window.RX.UNIT.hubUrl = cfg.hubUrl;
    window.RX.Game.boot();
  });
})();

</script>
</body>
