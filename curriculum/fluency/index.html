<!doctype html>
<html lang="en" data-student="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Grade 6 fluency practice with worked solutions, retries, and printable worksheets.">
<title>Fluency Practice · EduWonderLab</title>
<style>/* ==========================================================================
   Reveal Math · Grade 6 Fluency & Diagnostic Guide
   Design system — tokens, light/dark themes, components, print
   ========================================================================== */

:root {
  color-scheme: light;

  --canvas:        #f6f8fb;
  --surface:       #ffffff;
  --surface-sunk:  #f1f5f9;
  --surface-raised:#ffffff;

  --line:          #e2e8f0;
  --line-strong:   #cbd5e1;

  --ink:           #0f172a;
  --ink-2:         #334155;
  --ink-3:         #526278;
  --ink-4:         #94a3b8;
  --ink-inv:       #ffffff;

  --accent:        #1a56c4;
  --accent-hover:  #143f92;
  --accent-soft:   #e8f0fe;
  --accent-ink:    #143f92;

  --ok:            #047857;
  --ok-soft:       #ecfdf5;
  --ok-line:       #a7f3d0;

  --warn:          #b45309;
  --warn-soft:     #fffbeb;
  --warn-line:     #fde68a;

  --alert:         #be123c;
  --alert-soft:    #fff1f2;

  --violet:        #6d28d9;
  --violet-soft:   #f5f3ff;

  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;

  --shadow-1: 0 1px 2px rgba(15, 23, 42, .06);
  --shadow-2: 0 4px 10px -2px rgba(15, 23, 42, .09), 0 2px 4px -2px rgba(15, 23, 42, .05);
  --shadow-3: 0 18px 32px -12px rgba(15, 23, 42, .22);

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-pill: 999px;

  --gutter: 24px;
  --measure: 1320px;
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --canvas:        #0b1220;
  --surface:       #131c2e;
  --surface-sunk:  #0f1727;
  --surface-raised:#182338;

  --line:          #24314b;
  --line-strong:   #35466a;

  --ink:           #eef3fb;
  --ink-2:         #c6d2e6;
  --ink-3:         #93a3bf;
  --ink-4:         #6f819f;
  --ink-inv:       #0b1220;

  --accent:        #7aa9ff;
  --accent-hover:  #a3c3ff;
  --accent-soft:   #1b2b4d;
  --accent-ink:    #bed3ff;

  --ok:            #4ade80;
  --ok-soft:       #10281f;
  --ok-line:       #1f5340;

  --warn:          #fbbf24;
  --warn-soft:     #2a2210;
  --warn-line:     #5c4712;

  --alert:         #fb7185;
  --alert-soft:    #2c1220;

  --violet:        #c4b5fd;
  --violet-soft:   #221c3a;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 4px 10px -2px rgba(0, 0, 0, .5);
  --shadow-3: 0 18px 32px -12px rgba(0, 0, 0, .65);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

body {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 96px;
}

.wrap { max-width: var(--measure); margin: 0 auto; padding: 0 var(--gutter); }
.narrow { max-width: 900px; }

a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.skip-link {
  position: absolute; left: 8px; top: -60px; z-index: 200;
  background: var(--accent); color: #fff; padding: 10px 16px;
  border-radius: var(--r-sm); font-weight: 600; text-decoration: none;
}
.skip-link:focus { top: 8px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  font: inherit; font-weight: 600; font-size: 13.5px;
  padding: 9px 15px; border-radius: var(--r-sm);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
  cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-sunk); border-color: var(--ink-4); color: var(--ink); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn-ok:hover { filter: brightness(1.08); color: #fff; }
.btn-sm { padding: 6px 11px; font-size: 12.5px; }
.btn-lg { padding: 12px 22px; font-size: 15px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.btn svg { flex: none; }

/* ---------- header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 60;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-inner { display: flex; align-items: center; gap: 16px; min-height: 64px; flex-wrap: wrap; padding: 8px 0; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; margin-right: auto; }
.brand-badge {
  width: 38px; height: 38px; border-radius: var(--r-md);
  background: var(--accent); color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 15px; letter-spacing: -.02em;
}
.brand-series { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 700; }
.brand-title { display: block; font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------- view tabs ---------- */
.viewbar { border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: var(--header-h, 64px); z-index: 55; }
.viewbar-inner { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.viewtab {
  appearance: none; border: 0; background: none; font: inherit; font-weight: 600; font-size: 13.5px;
  color: var(--ink-3); padding: 13px 16px; cursor: pointer; white-space: nowrap;
  border-bottom: 3px solid transparent; display: inline-flex; align-items: center; gap: 7px;
}
.viewtab:hover { color: var(--ink); }
.viewtab[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }
.viewtab .count { font-size: 11px; font-weight: 700; background: var(--surface-sunk); color: var(--ink-3); padding: 1px 7px; border-radius: var(--r-pill); }

@media (max-width: 760px) {
  .site-header { position: static; }
  .viewbar { top: 0; }
}

/* ---------- hero ---------- */
.hero { background: var(--surface); border-bottom: 1px solid var(--line); padding: 40px 0 34px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent-ink); background: var(--accent-soft);
  padding: 5px 11px; border-radius: var(--r-pill); margin-bottom: 16px;
}
.hero h1 {
  font-family: var(--font-display); font-weight: 700; letter-spacing: -.02em;
  font-size: clamp(30px, 4.6vw, 46px); line-height: 1.1; margin-bottom: 14px;
}
.hero-lead { font-size: 17px; color: var(--ink-2); max-width: 74ch; }
.hero-lead strong { color: var(--ink); }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 28px; }
.kpi {
  background: var(--surface-sunk); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 15px 17px;
}
.kpi-value { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.kpi-label { display: block; font-size: 12.5px; font-weight: 700; margin-top: 7px; }
.kpi-sub { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

/* ---------- generic section ---------- */
.section { padding: 36px 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 20px; }
.section-title { font-family: var(--font-display); font-size: 25px; font-weight: 700; letter-spacing: -.015em; }
.section-sub { color: var(--ink-3); font-size: 14px; margin-top: 4px; max-width: 76ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }

/* ---------- protocol ---------- */
.protocol { padding: 26px; }
.protocol-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.protocol h2 { font-family: var(--font-display); font-size: 21px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.tag {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  padding: 4px 10px; border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent-ink);
}
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.step { background: var(--surface-sunk); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; }
.step-n {
  width: 26px; height: 26px; border-radius: var(--r-pill); background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 12.5px; font-weight: 800; margin-bottom: 10px;
}
.step h3 { font-size: 14px; font-weight: 700; margin-bottom: 5px; }
.step p { font-size: 13px; color: var(--ink-2); }
.callout {
  margin-top: 18px; padding: 14px 16px; border-left: 3px solid var(--accent);
  background: var(--accent-soft); border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 13.5px; color: var(--ink-2);
}
.callout strong { color: var(--ink); }

/* ---------- origin bar ---------- */
.origin { margin-top: 20px; }
.origin-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; font-weight: 600; color: var(--ink-3); margin-bottom: 8px; }
.bar { display: flex; height: 13px; border-radius: var(--r-pill); overflow: hidden; border: 1px solid var(--line); }
.seg-g2 { background: #bfdbfe; } .seg-g3 { background: #7dd3fc; }
.seg-g4 { background: #38bdf8; } .seg-g5 { background: #0ea5e9; }
.seg-g6 { background: #f59e0b; } .seg-spiral { background: #c084fc; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 9px; font-size: 11.5px; color: var(--ink-3); }
.legend span.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; }
.legend > div { display: flex; align-items: center; }

/* ---------- toolbar ---------- */
.toolbar { position: sticky; top: var(--stack-h, 115px); z-index: 50; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 0; box-shadow: var(--shadow-1); }
.toolbar-grid { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { position: relative; flex: 1 1 320px; min-width: 240px; }
.search input {
  width: 100%; font: inherit; font-size: 14px; padding: 10px 36px 10px 38px;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface-sunk); color: var(--ink);
}
.search input::placeholder { color: var(--ink-4); }
.search .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-4); pointer-events: none; }
.search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--ink-3); font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 6px; }
.kbd {
  font-family: var(--font-mono); font-size: 10.5px; border: 1px solid var(--line-strong);
  border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--ink-3); background: var(--surface);
}
select.select {
  font: inherit; font-size: 13px; font-weight: 600; padding: 9px 11px;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink-2); max-width: 260px;
}
.results { font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin-left: auto; }
.pills { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
.pill {
  font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 13px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
  border-radius: var(--r-pill); cursor: pointer;
}
.pill:hover { border-color: var(--ink-4); }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- unit blocks ---------- */
.unit { margin-bottom: 34px; scroll-margin-top: calc(var(--stack-h, 115px) + 86px); }
.unit-banner {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
  color: #fff; border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 20px 24px;
}
.unit-banner-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.unit-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; opacity: .85; }
.unit-count { font-size: 11.5px; font-weight: 700; background: rgba(255,255,255,.18); padding: 3px 10px; border-radius: var(--r-pill); }
.unit-banner h2 { font-family: var(--font-display); font-size: 23px; font-weight: 700; letter-spacing: -.015em; }
.unit-premise { margin-top: 10px; font-size: 13.5px; line-height: 1.55; opacity: .93; max-width: 90ch; border-left: 2px solid rgba(255,255,255,.4); padding-left: 12px; }
.lesson-cards { display: grid; gap: 14px; padding: 16px; background: var(--surface-sunk); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--r-lg) var(--r-lg); }

/* ---------- lesson card ---------- */
.lesson {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: var(--shadow-1); overflow: hidden; scroll-margin-top: calc(var(--stack-h, 115px) + 96px);
}
.lesson-head { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.lesson-id {
  display: inline-block; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
  background: var(--ink); color: var(--ink-inv); padding: 2px 9px; border-radius: 4px; margin-bottom: 7px;
}
.lesson h3 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
.lesson-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.lesson-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; }
.std-chip {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  background: var(--violet-soft); color: var(--violet); border: 1px solid transparent;
  padding: 3px 8px; border-radius: 4px; cursor: help;
}
.spine-chip {
  font-size: 11px; font-weight: 700; background: var(--warn-soft); color: var(--warn);
  border: 1px solid var(--warn-line); padding: 3px 8px; border-radius: 4px; cursor: pointer;
}
.spine-chip:hover { filter: brightness(.96); }

.lesson-body { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 0; }
@media (max-width: 880px) { .lesson-body { grid-template-columns: 1fr; } }
.col { padding: 16px 18px; }
.col + .col { border-left: 1px solid var(--line); background: var(--surface-sunk); }
@media (max-width: 880px) { .col + .col { border-left: 0; border-top: 1px solid var(--line); } }

.col-title {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-3); margin-bottom: 11px;
}
.skill-row { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.skill-row:last-child { border-bottom: 0; }
.skill-n {
  flex: none; width: 19px; height: 19px; border-radius: 4px; background: var(--surface-sunk);
  border: 1px solid var(--line); color: var(--ink-3);
  display: grid; place-items: center; font-size: 10.5px; font-weight: 800; margin-top: 1px;
}
.col + .col .skill-n { background: var(--surface); }
.skill-text { flex: 1; color: var(--ink-2); }
.src {
  flex: none; font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: var(--r-pill);
  white-space: nowrap; margin-top: 1px;
}
.src-elem { background: var(--accent-soft); color: var(--accent-ink); }
.src-spiral { background: var(--warn-soft); color: var(--warn); }

.qc-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
  background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line);
  padding: 3px 9px; border-radius: var(--r-pill);
}
.qc-prompt {
  font-size: 15px; font-weight: 600; line-height: 1.5; color: var(--ink);
  margin: 10px 0 12px; padding: 12px 14px; background: var(--surface);
  border: 1px solid var(--line); border-left: 3px solid var(--ok); border-radius: 0 var(--r-sm) var(--r-sm) 0;
}
.col + .col .qc-prompt { background: var(--surface); }
.form-switch { display: inline-flex; gap: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px; }
.form-switch button {
  font: inherit; font-size: 11.5px; font-weight: 700; border: 0; background: none; color: var(--ink-3);
  padding: 3px 10px; border-radius: 4px; cursor: pointer;
}
.form-switch button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- answer drawer ---------- */
.drawer { display: none; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.drawer.open { display: block; }
.answer {
  font-size: 13.5px; line-height: 1.6; background: var(--ok-soft); border: 1px solid var(--ok-line);
  border-radius: var(--r-sm); padding: 11px 13px; color: var(--ink);
}
.sub-head {
  font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-3); margin: 14px 0 7px;
}
.diag { font-size: 13px; line-height: 1.6; color: var(--ink-2); }
.err-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.err-table th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-3); padding: 5px 8px; border-bottom: 1px solid var(--line-strong);
}
.err-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
.err-table td:first-child { font-family: var(--font-mono); color: var(--alert); font-weight: 600; width: 22%; }
.reteach { background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: var(--r-sm); padding: 11px 13px; }
.reteach ol { margin: 6px 0 0 18px; font-size: 13px; line-height: 1.65; color: var(--ink-2); }
.reteach ol li { margin-bottom: 3px; }
.reteach-time { font-size: 11px; font-weight: 800; color: var(--warn); text-transform: uppercase; letter-spacing: .06em; }
.frame-box {
  font-size: 13.5px; background: var(--violet-soft); border: 1px solid transparent; border-left: 3px solid var(--violet);
  border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 10px 13px; color: var(--ink-2); font-style: italic;
}
.vocab { display: flex; flex-wrap: wrap; gap: 7px; }
.vocab-item {
  font-size: 12px; background: var(--surface-sunk); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 6px 10px; color: var(--ink-2);
}
.vocab-item b { color: var(--ink); }
.ext { font-size: 13px; color: var(--ink-2); background: var(--surface-sunk); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 13px; }

/* ---------- check tracker ---------- */
.tracker { margin-top: 12px; border: 1px dashed var(--line-strong); border-radius: var(--r-sm); padding: 10px 12px; background: var(--surface); }
.tracker-title { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin-bottom: 8px; }
.tracker-row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.tally { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; }
.tally button { font: inherit; font-size: 13px; font-weight: 700; border: 0; background: var(--surface); color: var(--ink-2); padding: 4px 10px; cursor: pointer; }
.tally button:hover { background: var(--surface-sunk); }
.tally .val { font-family: var(--font-mono); font-size: 13px; font-weight: 700; padding: 4px 10px; min-width: 38px; text-align: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.tally-label { font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
.tally.secure .val { color: var(--ok); } .tally.dev .val { color: var(--warn); } .tally.not .val { color: var(--alert); }

/* ---------- table view ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
table.matrix { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 1050px; }
table.matrix thead th {
  position: sticky; top: 0; background: var(--ink); color: var(--ink-inv);
  font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
  text-align: left; padding: 11px 12px; z-index: 2;
}
table.matrix td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
table.matrix tbody tr:hover { background: var(--surface-sunk); }
.mx-id { font-family: var(--font-mono); font-weight: 700; color: var(--ink); }
.mx-title { font-weight: 700; color: var(--ink); margin-bottom: 2px; }
.mx-sub { font-size: 11.5px; color: var(--ink-3); }
.mx-skill { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
.mx-fallback { font-size: 11px; font-weight: 700; color: var(--warn); margin-top: 5px; }

/* ---------- spine ---------- */
.spine-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
.spine-card { display: flex; flex-direction: column; padding: 18px; }
.spine-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.spine-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 10px; }
.spine-rank { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-ink); background: var(--accent-soft); padding: 3px 9px; border-radius: var(--r-pill); }
.spine-serves { font-size: 11px; font-weight: 700; color: var(--ink-3); }
.spine-card h3 { font-size: 15.5px; font-weight: 700; line-height: 1.35; margin-bottom: 7px; }
.spine-why { font-size: 13px; color: var(--ink-2); margin-bottom: 11px; }
.spine-lessons { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.lchip {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 2px 7px;
  border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface-sunk);
  color: var(--ink-2); cursor: pointer;
}
.lchip:hover { border-color: var(--accent); color: var(--accent-ink); }
.spine-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: auto; }
.drill-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 7px; margin-top: 7px; }
.drill-item { font-size: 12.5px; background: var(--surface-sunk); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px; }
.drill-item b { display: block; font-family: var(--font-mono); color: var(--ink); }
.drill-item span { color: var(--ok); font-weight: 600; }

/* ---------- heatmap ---------- */
.heat-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); margin-top: 24px; }
table.heat { border-collapse: collapse; font-size: 12px; width: 100%; min-width: 760px; }
table.heat th { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 9px 8px; text-align: center; border-bottom: 1px solid var(--line-strong); }
table.heat th.row-head { text-align: left; min-width: 260px; }
table.heat td { text-align: center; padding: 7px 8px; border-bottom: 1px solid var(--line); font-weight: 700; font-family: var(--font-mono); }
table.heat td.row-head { text-align: left; font-family: var(--font-body); font-weight: 600; color: var(--ink-2); font-size: 12.5px; }
.h0 { color: var(--ink-4); } .h1 { background: var(--accent-soft); color: var(--accent-ink); }
.h2 { background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--ink); }
.h3 { background: color-mix(in srgb, var(--accent) 52%, transparent); color: #fff; }

/* ---------- planner ---------- */
.planner-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
@media (max-width: 1000px) { .planner-grid { grid-template-columns: 1fr; } }
.slot-list { display: grid; gap: 10px; }
.slot { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.slot-day { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); width: 76px; flex: none; }
.slot select { flex: 1; min-width: 0; max-width: none; }
.plan-preview { padding: 18px; position: sticky; top: calc(var(--stack-h, 115px) + 24px); }
.plan-preview h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.plan-preview p { font-size: 12.5px; color: var(--ink-3); margin-bottom: 14px; }
.plan-skill-tally { font-size: 12.5px; }
.plan-skill-tally li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); list-style: none; color: var(--ink-2); }
.plan-skill-tally li b { color: var(--ink); font-family: var(--font-mono); }

/* ---------- reference ---------- */
.ref-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.std-group { padding: 16px 18px; }
.std-group h3 { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--accent-ink); margin-bottom: 3px; }
.std-group p { font-size: 12.5px; color: var(--ink-3); margin-bottom: 10px; }
.glossary { columns: 2 300px; column-gap: 26px; }
.gloss-item { break-inside: avoid; margin-bottom: 11px; font-size: 13px; color: var(--ink-2); }
.gloss-item b { display: block; color: var(--ink); }
.gloss-item em { font-style: normal; font-size: 11px; color: var(--ink-4); }

/* ---------- modal ---------- */
.backdrop {
  position: fixed; inset: 0; background: rgba(8, 14, 26, .72); backdrop-filter: blur(3px);
  display: none; align-items: center; justify-content: center; padding: 22px; z-index: 100;
}
.backdrop.open { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-3);
  width: min(1060px, 100%); max-height: 92vh; display: flex; flex-direction: column; overflow: hidden;
}
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.modal-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 3px 9px; border-radius: 4px; }
.modal-head h2 { font-size: 19px; font-weight: 700; margin-top: 7px; }
.modal-nav { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-3);
  width: 34px; height: 34px; border-radius: var(--r-sm); font-size: 18px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}
.icon-btn:hover { background: var(--surface-sunk); color: var(--ink); }
.modal-body { padding: 22px; overflow-y: auto; }
.projector {
  background: var(--surface-sunk); border: 2px solid var(--line-strong); border-radius: var(--r-md);
  padding: 30px; text-align: center; margin-bottom: 18px;
}
.projector .label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); margin-bottom: 14px; }
.projector .prompt { font-size: clamp(22px, 3.6vw, 38px); font-weight: 700; line-height: 1.35; letter-spacing: -.01em; color: var(--ink); }
.timer-box { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: var(--surface-sunk); border: 1px solid var(--line); border-radius: var(--r-md); padding: 15px 18px; }
.timer-digits { font-family: var(--font-mono); font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.timer-digits.warning { color: var(--alert); }
.timer-meta { font-size: 11px; color: var(--ink-4); }
.timer-meta b { display: block; font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; }
.timer-track { width: 100%; height: 5px; background: var(--line); border-radius: var(--r-pill); overflow: hidden; margin-top: 12px; }
.timer-fill { height: 100%; background: var(--accent); width: 100%; transition: width .25s linear; }
.modal-answer { display: none; margin-top: 18px; }
.modal-answer.open { display: block; }

/* ---------- toast + misc ---------- */
.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 300; }
.toast {
  display: flex; align-items: center; gap: 9px; background: var(--ink); color: var(--ink-inv);
  padding: 11px 17px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-3);
}
.empty { text-align: center; padding: 56px 20px; color: var(--ink-3); }
.empty h3 { font-size: 18px; color: var(--ink); margin-bottom: 7px; }
.empty p { margin-bottom: 16px; }

.help-list { display: grid; gap: 8px; }
.help-list div { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--ink-2); padding: 6px 0; border-bottom: 1px dashed var(--line); }

.site-footer { border-top: 1px solid var(--line); margin-top: 44px; padding: 26px 0; font-size: 12.5px; color: var(--ink-3); }
.site-footer strong { color: var(--ink-2); }

/* ---------- print ---------- */
.print-only { display: none; }

<script>window.FluencyData = {"spine":[],"units":[{"number":2,"title":"Statistics and Data Displays","lessons":[{"id":"2-1","title":"Understand Statistical Questions","standard":{"code":"6.SP.A.1","text":"Recognize a statistical question as one that anticipates variability in the answers."},"skills":[{"text":"Order a list of up to 10 whole numbers least to greatest","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Read a scaled number line and say what one tick mark is worth","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Tally and count a set of up to 30 responses without losing place","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Compare two whole numbers and say which is greater","source":"Gr 2","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Order 18, 7, 12, 7, 25 from least to greatest.","answer":"7, 7, 12, 18, 25","explanation":"Keep both 7s; repeated values still count.","mode":"review"},{"skill":2,"prompt":"A number line goes from 0 to 30 in 6 equal jumps. How much is one jump?","answer":"5","explanation":"Divide the total distance by the number of equal jumps: 30 ÷ 6 = 5.","mode":"number"},{"skill":3,"prompt":"A survey records 4 yes responses, then 5 yes responses, then 3 yes responses. How many yes responses?","answer":"12","explanation":"Add each group once: 4 + 5 + 3 = 12.","mode":"number"},{"skill":4,"prompt":"Which is greater: 47 or 74?","answer":"74","explanation":"Compare the tens digits: 7 tens is greater than 4 tens.","mode":"number"}],"quick_check":"Order 7, 3, 12, 5, 9. On a line from 0 to 10 split into 5 equal jumps, what is one jump worth?","solution":"<strong>Ordered list:</strong> 3, 5, 7, 9, 12.<br><strong>Line jump value:</strong> 10 ÷ 5 = 2 units per jump.","variants":[{"form":"B","prompt":"Order 15, 8, 22, 11, 4. On a line from 0 to 40 split into 4 equal jumps, what is one jump worth?","answer":"Ordered: 4, 8, 11, 15, 22. One jump = 40 ÷ 4 = 10."},{"form":"C","prompt":"Order 6, 1, 9, 3, 7. On a line from 0 to 100 split into 10 equal jumps, what is one jump worth?","answer":"Ordered: 1, 3, 6, 7, 9. One jump = 100 ÷ 10 = 10."}],"extension":{"prompt":"A line runs from 0 to 30 with 6 equal jumps. Where does 25 sit — on a tick mark or between two?","answer":"One jump = 30 ÷ 6 = 5, so ticks are 0, 5, 10, 15, 20, 25, 30. The value 25 lands exactly on a tick mark."},"vocabulary":[{"term":"statistical question","def":"A question you expect different answers to, such as \"How tall are the students in this class?\""},{"term":"dot plot","def":"A number line with one dot stacked above a value for each time it appears in the data."},{"term":"scale","def":"What one equal step on a number line is worth."}],"frame":"One jump is worth ___ because the distance from ___ to ___ is split into ___ equal parts."},{"id":"2-2","title":"Represent and Describe Data in a Histogram","standard":{"code":"6.SP.B.4","text":"Display numerical data in plots on a number line, including dot plots, histograms, and box plots."},"skills":[{"text":"Decide which interval a value belongs to (is 19 in 10–19 or 20–29?)","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Sort up to 20 values into given intervals and count each bin","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Add a column of one- and two-digit numbers to a total","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Read a graph scale that skip-counts by 2, 5, or 10","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Which interval contains 29: 10–19, 20–29, or 30–39?","answer":"20–29","explanation":"The endpoints are included, so 29 belongs in 20–29.","mode":"review"},{"skill":2,"prompt":"Sort 2, 8, 11, 14, 19, 22 into intervals 0–9, 10–19, 20–29. Give the three frequencies in order.","answer":"2, 3, 1","explanation":"The bins contain (2, 8), (11, 14, 19), and (22). The frequencies sum to 6.","mode":"review"},{"skill":3,"prompt":"Find the total frequency: 8 + 12 + 7 + 3.","answer":"30","explanation":"Pair 8 + 12 = 20 and 7 + 3 = 10; total 30.","mode":"number"},{"skill":4,"prompt":"A frequency axis is labeled 0, 5, 10, 15. What value is two labeled steps above 0?","answer":"10","explanation":"Each labeled step adds 5, so two steps give 10.","mode":"number"}],"quick_check":"Which interval holds 29: 20–29 or 30–39? How many of 4, 11, 19, 21, 25 land in 10–19?","solution":"<strong>Interval assignment:</strong> 29 belongs in the 20–29 interval.<br><strong>Bin count:</strong> Values in 10–19 are 11 and 19 (Total = 2 values).","variants":[{"form":"B","prompt":"Which interval holds 40: 30–39 or 40–49? How many of 12, 35, 41, 44, 58 land in 40–49?","answer":"40 belongs in 40–49. Values in 40–49: 41 and 44 — a frequency of 2."},{"form":"C","prompt":"Which interval holds 60: 50–59 or 60–69? How many of 51, 60, 64, 70, 72 land in 60–69?","answer":"60 belongs in 60–69. Values in 60–69: 60 and 64 — a frequency of 2."}],"extension":{"prompt":"A data set has 24 values sorted into bins with frequencies 5, 8, 6, and ___. What is the missing frequency?","answer":"5 + 8 + 6 = 19, so the missing frequency is 24 − 19 = 5."},"vocabulary":[{"term":"histogram","def":"A graph of how many data values fall inside each equal-width interval."},{"term":"interval (bin)","def":"A range of values, such as 10–19, that collects data into one bar."},{"term":"frequency","def":"How many values land in one interval."}],"frame":"The value ___ belongs in the interval ___ because it is at least ___ and at most ___."},{"id":"2-3","title":"Describe the Data Using the Median","standard":{"code":"6.SP.B.5.c","text":"Report the median and describe what it says about the data set."},"skills":[{"text":"Order up to 12 numbers least to greatest","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Find the middle position of an odd-length list by counting in from both ends","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Find the number halfway between two numbers","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Divide a two-digit sum by 2","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Order 15, 8, 12, 8, 17, 10.","answer":"8, 8, 10, 12, 15, 17","explanation":"Include both 8s and arrange all six values.","mode":"review"},{"skill":2,"prompt":"Find the median of 3, 5, 8, 11, 14.","answer":"8","explanation":"The third value has two values on each side.","mode":"number"},{"skill":3,"prompt":"What number is halfway between 18 and 26?","answer":"22","explanation":"The gap is 8; move half the gap, 4, from 18.","mode":"number"},{"skill":4,"prompt":"Compute 46 ÷ 2.","answer":"23","explanation":"Split 46 into 40 + 6, then halve each part: 20 + 3.","mode":"number"}],"quick_check":"Put in order: 9, 4, 15, 6, 11. What number is halfway between 12 and 17?","solution":"<strong>Ordered list:</strong> 4, 6, 9, 11, 15 (Middle value = 9).<br><strong>Halfway point:</strong> (12 + 17) ÷ 2 = 29 ÷ 2 = 14.5 (or 14 1/2).","variants":[{"form":"B","prompt":"Put in order: 14, 6, 21, 9, 17. What number is halfway between 20 and 25?","answer":"Ordered: 6, 9, 14, 17, 21 (median 14). Halfway: (20 + 25) ÷ 2 = 45 ÷ 2 = 22.5."},{"form":"C","prompt":"Put in order: 30, 12, 25, 18, 21. What number is halfway between 8 and 15?","answer":"Ordered: 12, 18, 21, 25, 30 (median 21). Halfway: (8 + 15) ÷ 2 = 23 ÷ 2 = 11.5."}],"extension":{"prompt":"A set of six values has median 10. The four values 4, 8, 12, 16 are known. Give one possible pair for the other two.","answer":"Many answers. The two middle values must average 10 — for example, adding 2 and 20 gives ordered 2, 4, 8, 12, 16, 20 with median (8 + 12) ÷ 2 = 10."},"vocabulary":[{"term":"median","def":"The middle value once the data are in order."},{"term":"midpoint","def":"The number halfway between two values; add them and divide by 2."},{"term":"even-sized set","def":"A data set with no single middle value, so the two middle values are averaged."}],"frame":"The median is ___ because after ordering, ___ values sit below it and ___ sit above it."},{"id":"2-4","title":"Represent and Describe Data in a Box Plot","standard":{"code":"6.SP.B.4","text":"Display numerical data in plots on a number line, including box plots."},"skills":[{"text":"Order a data set and find its median","source":"2-3","is_elementary":false,"is_prior_g6":true},{"text":"Split an ordered list into a lower half and an upper half","source":"2-3","is_elementary":false,"is_prior_g6":true},{"text":"Subtract two-digit whole numbers","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Plot a point at the right place on a scaled number line","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Find the median of 12, 4, 8, 6, 10.","answer":"8","explanation":"Order the list as 4, 6, 8, 10, 12; the middle value is 8.","mode":"number"},{"skill":2,"prompt":"Split 2, 4, 6, 8, 10, 12 into equal lower and upper halves.","answer":"Lower: 2, 4, 6; upper: 8, 10, 12","explanation":"There are six values, so put three in each half.","mode":"review"},{"skill":3,"prompt":"Compute 73 − 28.","answer":"45","explanation":"Regroup one ten: 13 − 8 = 5 and 6 tens − 2 tens = 4 tens.","mode":"number"},{"skill":4,"prompt":"A line has ticks at 0, 4, 8, 12, 16. Which value is halfway between 8 and 12?","answer":"10","explanation":"Half of the interval of 4 is 2; 8 + 2 = 10.","mode":"number"}],"quick_check":"Ordered: 3, 5, 8, 10, 12, 14, 18, 20. Find the median of the lower half.","solution":"<strong>Ordered list split:</strong> [3, 5, 8, 10] | [12, 14, 18, 20].<br><strong>Lower half:</strong> 3, 5, 8, 10.<br><strong>Median of lower half (Q1):</strong> (5 + 8) ÷ 2 = 13 ÷ 2 = 6.5.","variants":[{"form":"B","prompt":"Ordered: 2, 6, 9, 11, 15, 19, 22, 28. Find the median of the lower half.","answer":"Lower half: 2, 6, 9, 11. Q1 = (6 + 9) ÷ 2 = 15 ÷ 2 = 7.5."},{"form":"C","prompt":"Ordered: 4, 7, 10, 13, 18, 20. Find the median of the upper half.","answer":"Upper half: 13, 18, 20. Q3 = 18."}],"extension":{"prompt":"A box plot has min 3, Q1 7, median 12, Q3 18, max 25. Between which two values do the middle half of the data sit?","answer":"Between Q1 = 7 and Q3 = 18. That middle 50% spans 18 − 7 = 11 units."},"vocabulary":[{"term":"box plot","def":"A five-number picture of a data set: minimum, Q1, median, Q3, maximum."},{"term":"quartile","def":"The median of the lower half (Q1) or the upper half (Q3) of an ordered set."},{"term":"five-number summary","def":"The minimum, Q1, median, Q3, and maximum together."}],"frame":"Q1 is ___ because it is the median of the lower half, which contains ___ ."},{"id":"2-5","title":"Describe Data by Range and Interquartile Range","standard":{"code":"6.SP.B.5.c","text":"Report measures of variability, including range and interquartile range."},"skills":[{"text":"Find the maximum and minimum of a data set","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Subtract whole numbers, including across zeros","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Locate Q1 and Q3 in an ordered set","source":"2-4","is_elementary":false,"is_prior_g6":true},{"text":"Compare two differences to say which spread is larger","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Give the minimum and maximum of 18, 7, 24, 11, 16.","answer":"Minimum 7; maximum 24","explanation":"The minimum is the least value and the maximum is the greatest.","mode":"review"},{"skill":2,"prompt":"Compute 100 − 37.","answer":"63","explanation":"Count up from 37: 3 to 40 and 60 to 100, giving 63.","mode":"number"},{"skill":3,"prompt":"For 2, 4, 6, 8, 10, 12, 14, 16, find Q1 and Q3 using the medians of the two halves.","answer":"Q1 = 5; Q3 = 13","explanation":"Lower half median is (4 + 6) ÷ 2 = 5; upper half median is (12 + 14) ÷ 2 = 13.","mode":"review"},{"skill":4,"prompt":"Set A ranges from 12 to 30. Set B ranges from 8 to 31. Which has the larger range?","answer":"Set B","explanation":"A has range 18; B has range 23, which is larger.","mode":"review"}],"quick_check":"Range of 12, 7, 19, 4, 15? If Q1 = 6 and Q3 = 17, what is Q3 − Q1?","solution":"<strong>Range:</strong> Maximum − Minimum = 19 − 4 = 15.<br><strong>IQR:</strong> Q3 − Q1 = 17 − 6 = 11.","variants":[{"form":"B","prompt":"Range of 23, 8, 41, 16, 30? If Q1 = 12 and Q3 = 35, what is Q3 − Q1?","answer":"Range = 41 − 8 = 33. IQR = 35 − 12 = 23."},{"form":"C","prompt":"Range of 100, 62, 85, 71, 94? If Q1 = 68 and Q3 = 92, what is Q3 − Q1?","answer":"Range = 100 − 62 = 38. IQR = 92 − 68 = 24."}],"extension":{"prompt":"Two classes both have range 20, but Class A has IQR 4 and Class B has IQR 16. What does that tell you?","answer":"Class A's values cluster tightly with one or two far-out values stretching the range; Class B's values are genuinely spread throughout."},"vocabulary":[{"term":"range","def":"Maximum minus minimum — the full spread."},{"term":"interquartile range (IQR)","def":"Q3 minus Q1 — the spread of the middle half."},{"term":"variability","def":"How spread out the values are."}],"frame":"The range is ___ because the largest value is ___ and the smallest is ___ ."},{"id":"2-6","title":"Divide Multi-Digit Numbers Using an Algorithm","standard":{"code":"6.NS.B.2","text":"Fluently divide multi-digit numbers using the standard algorithm."},"skills":[{"text":"Recall multiplication and division facts through 12 × 12","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Use place value to divide hundreds, tens, and ones","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Subtract multi-digit whole numbers with regrouping","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Estimate a quotient and check with multiplication","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 84 ÷ 7.","answer":"12","explanation":"7 × 12 = 84, so the quotient is 12.","mode":"number"},{"skill":2,"prompt":"Compute 248 ÷ 4.","answer":"62","explanation":"24 tens ÷ 4 = 6 tens; 8 ones ÷ 4 = 2 ones. Combine to get 62.","mode":"number"},{"skill":3,"prompt":"Compute 302 − 178.","answer":"124","explanation":"Regroup across the zero or count up: 178 + 22 = 200 and 200 + 102 = 302; total 124.","mode":"number"},{"skill":4,"prompt":"Estimate 238 ÷ 6 using the nearby compatible dividend 240.","answer":"40","explanation":"240 ÷ 6 = 40. Since 238 is slightly less than 240, the exact quotient will be slightly less than 40.","mode":"number"}],"quick_check":"Compute 156 ÷ 6. Explain how multiplication checks your quotient.","solution":"<strong>156 ÷ 6 = 26.</strong><br>Divide 15 tens by 6: 2 tens with 3 tens remaining. Combine those 3 tens with 6 ones to get 36 ones. Divide 36 by 6 to get 6 ones.<br>Check: 26 × 6 = 156.","variants":[{"form":"B","prompt":"Compute 252 ÷ 7. Check with multiplication.","answer":"252 ÷ 7 = 36. Divide 25 tens by 7 to get 3 tens with 4 tens remaining; 42 ones ÷ 7 = 6 ones. Check: 36 × 7 = 252."},{"form":"C","prompt":"Compute 325 ÷ 5. Check with multiplication.","answer":"325 ÷ 5 = 65. Divide 32 tens by 5 to get 6 tens with 2 tens remaining; 25 ones ÷ 5 = 5 ones. Check: 65 × 5 = 325."}],"extension":{"prompt":"There are 347 students. Each bus seats at most 24 students. What is the fewest buses needed? Explain how the remainder affects your answer.","answer":"347 ÷ 24 = 14 remainder 11, because 24 × 14 = 336. The 11 remaining students need another bus, so 15 buses are needed."},"vocabulary":[{"term":"dividend","def":"The amount being divided."},{"term":"divisor","def":"The number you divide by."},{"term":"quotient","def":"The result of a division."},{"term":"remainder","def":"The amount left after making equal whole-number groups; it must be less than the divisor."}],"frame":"I divided ___ by ___ and got ___. I checked by multiplying ___ by ___ and adding any remainder."},{"id":"2-7","title":"Divide Decimals Using an Algorithm","standard":{"code":"6.NS.B.3","text":"Fluently add, subtract, multiply, and divide multi-digit decimals using the standard algorithm."},"skills":[{"text":"Recall division facts through 12 × 12","source":"Gr 3–4","is_elementary":true,"is_prior_g6":false},{"text":"Divide multi-digit whole numbers with the standard algorithm","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Multiply and divide by 10, 100, 1000 by shifting the decimal point","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Line up decimal places and annex zeros to keep dividing","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 96 ÷ 8.","answer":"12","explanation":"Use the related multiplication fact: 8 × 12 = 96.","mode":"number"},{"skill":2,"prompt":"Compute 156 ÷ 6.","answer":"26","explanation":"120 ÷ 6 = 20 and 36 ÷ 6 = 6; add 20 + 6.","mode":"number"},{"skill":3,"prompt":"Compute 4.8 × 100.","answer":"480","explanation":"Every digit becomes worth 100 times as much.","mode":"number"},{"skill":4,"prompt":"Compute 7.5 ÷ 2.","answer":"3.75","explanation":"Write 7.50; divide 750 hundredths by 2 to get 375 hundredths.","mode":"number"}],"quick_check":"84 ÷ 4? 4.8 ÷ 2? 0.6 × 100?","solution":"84 ÷ 4 = 21<br>4.8 ÷ 2 = 2.4<br>0.6 × 100 = 60 (shift decimal 2 places right and annex zero).","variants":[{"form":"B","prompt":"96 ÷ 3? 6.9 ÷ 3? 0.8 × 100?","answer":"96 ÷ 3 = 32. 6.9 ÷ 3 = 2.3. 0.8 × 100 = 80."},{"form":"C","prompt":"72 ÷ 6? 8.4 ÷ 4? 0.05 × 1000?","answer":"72 ÷ 6 = 12. 8.4 ÷ 4 = 2.1. 0.05 × 1000 = 50."}],"extension":{"prompt":"Why does 4.8 ÷ 0.2 give the same answer as 48 ÷ 2?","answer":"Multiplying both the dividend and the divisor by 10 does not change the quotient; it only rewrites the problem with a whole-number divisor. Both equal 24."},"vocabulary":[{"term":"dividend","def":"The number being divided."},{"term":"divisor","def":"The number you are dividing by."},{"term":"annex a zero","def":"Write a zero at the end of a decimal so the division can continue."}],"frame":"Multiplying by 100 moves each digit ___ places to the ___, so ___ becomes ___ ."},{"id":"2-8","title":"Describe Data Using the Mean","standard":{"code":"6.SP.B.5.c","text":"Report the mean and describe what it says about the data set."},"skills":[{"text":"Add a list of 5–10 two-digit numbers accurately","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Divide a three-digit number by a one-digit number","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Count how many values are in a data set","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Find a missing addend that reaches a given total","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Add 12 + 18 + 15 + 25 + 10.","answer":"80","explanation":"Pair 12 + 18 = 30 and 15 + 25 = 40, then add 10.","mode":"number"},{"skill":2,"prompt":"Compute 144 ÷ 6.","answer":"24","explanation":"6 × 24 = 144; use multiplication to check division.","mode":"number"},{"skill":3,"prompt":"How many values are in 4, 4, 7, 9, 9, 9?","answer":"6","explanation":"Count every entry, including repeated values.","mode":"number"},{"skill":4,"prompt":"Find the missing addend: 18 + 22 + __ = 65.","answer":"25","explanation":"The known addends total 40; 65 − 40 = 25.","mode":"number"}],"quick_check":"Mean of 10, 14, 8, 12, 16? What must be added to 48 to reach 60?","solution":"<strong>Sum:</strong> 10 + 14 + 8 + 12 + 16 = 60.<br><strong>Count:</strong> 5 values.<br><strong>Mean:</strong> 60 ÷ 5 = 12.<br><strong>Missing addend:</strong> 60 − 48 = 12.","variants":[{"form":"B","prompt":"Mean of 20, 18, 25, 17? What must be added to 72 to reach 100?","answer":"Sum = 80, count = 4, mean = 80 ÷ 4 = 20. Missing addend: 100 − 72 = 28."},{"form":"C","prompt":"Mean of 9, 15, 6, 12, 18? What must be added to 55 to reach 90?","answer":"Sum = 60, count = 5, mean = 60 ÷ 5 = 12. Missing addend: 90 − 55 = 35."}],"extension":{"prompt":"Four scores have a mean of 85. Three of them are 80, 90, and 88. What is the fourth?","answer":"Total must be 4 × 85 = 340. The known three sum to 258, so the fourth is 340 − 258 = 82."},"vocabulary":[{"term":"mean","def":"The sum of the values divided by how many values there are."},{"term":"fair share","def":"Another way to read the mean: the amount each value would get if the total were shared evenly."},{"term":"missing addend","def":"The amount still needed to reach a target total."}],"frame":"The mean is ___ because the total ___ is shared evenly among ___ values."},{"id":"2-9","title":"Describe Data by Mean Absolute Deviation","standard":{"code":"6.SP.B.5.c","text":"Report the mean absolute deviation and describe variability."},"skills":[{"text":"Find the mean of a data set","source":"2-8","is_elementary":false,"is_prior_g6":true},{"text":"Subtract to find the distance between two numbers and keep it positive","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Add a list of distances","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Divide a total by the number of values","source":"2-8","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Find the mean of 4, 6, 8, 10.","answer":"7","explanation":"The total is 28 and there are 4 values; 28 ÷ 4 = 7.","mode":"number"},{"skill":2,"prompt":"What is the distance between 3 and 11 on a number line?","answer":"8","explanation":"Distance is nonnegative: 11 − 3 = 8.","mode":"number"},{"skill":3,"prompt":"Add the distances 3, 1, 1, 3.","answer":"8","explanation":"3 + 1 + 1 + 3 = 8.","mode":"number"},{"skill":4,"prompt":"Eight units of total deviation are shared across four values. What is 8 ÷ 4?","answer":"2","explanation":"Divide total deviation by the number of values.","mode":"number"}],"quick_check":"The mean is 20. How far is 26 from the mean? How far is 14?","solution":"<strong>Distance of 26:</strong> |26 − 20| = 6.<br><strong>Distance of 14:</strong> |14 − 20| = 6.<br><em>(Both distances are strictly 6 units).</em>","variants":[{"form":"B","prompt":"The mean is 30. How far is 37 from the mean? How far is 22?","answer":"|37 − 30| = 7. |22 − 30| = 8."},{"form":"C","prompt":"The mean is 50. How far is 50 from the mean? How far is 43?","answer":"|50 − 50| = 0. |43 − 50| = 7."}],"extension":{"prompt":"A set has mean 10 and MAD 0. What must be true of the data?","answer":"Every value equals 10. A MAD of zero means no value deviates from the mean at all."},"vocabulary":[{"term":"mean absolute deviation (MAD)","def":"The average distance of the values from the mean."},{"term":"deviation","def":"How far one value sits from the mean."},{"term":"absolute distance","def":"A distance reported as a positive number, no matter the direction."}],"frame":"The distance from ___ to the mean is ___ because distance counts jumps, not direction."},{"id":"2-10","title":"Choose Appropriate Measures","standard":{"code":"6.SP.B.5.d","text":"Relate the choice of measures of center and variability to the shape of the distribution."},"skills":[{"text":"Compute mean, median, range, IQR, and MAD on demand","source":"2-3, 2-5, 2-8, 2-9","is_elementary":false,"is_prior_g6":true},{"text":"Spot an outlier in a short list","source":"2-1, 2-2","is_elementary":false,"is_prior_g6":true},{"text":"Read a dot plot or histogram as symmetric or skewed","source":"2-1, 2-2","is_elementary":false,"is_prior_g6":true},{"text":"Compare two measures and say which is pulled by an extreme value","source":"2-8","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"For 2, 4, 6, 8, find mean, median, range, IQR, and MAD. Use medians of the two halves for quartiles.","answer":"Mean 5; median 5; range 6; IQR 4; MAD 2","explanation":"Mean: 20 ÷ 4. Median: (4 + 6) ÷ 2. Range: 8 − 2. Q1 = 3, Q3 = 7. Distances from 5 are 3, 1, 1, 3; their mean is 2.","mode":"review"},{"skill":2,"prompt":"Which value is a likely outlier: 8, 9, 10, 11, 52?","answer":"52","explanation":"Four values are close together; 52 is far from that cluster.","mode":"number"},{"skill":3,"prompt":"A dot plot has 1 dot at 1, 2 dots at 2, 3 dots at 3, 2 dots at 4, and 1 dot at 5. Is it symmetric or skewed?","answer":"Symmetric","explanation":"Frequencies mirror each other around 3.","mode":"review"},{"skill":4,"prompt":"Replace 6 with 60 in 2, 4, 6. Which changes more: mean or median?","answer":"Mean","explanation":"The median stays 4. The mean changes from 4 to 22.","mode":"review"}],"quick_check":"Which measure of center fits 2, 3, 3, 4, 50 — mean or median? Why?","solution":"<strong>Best Measure:</strong> Median (3).<br><strong>Why:</strong> 50 is an extreme outlier that skews the data. The mean is 62 ÷ 5 = 12.4, which is higher than 4 out of the 5 data values and does not represent the center. The median (3) accurately reflects the typical value.","variants":[{"form":"B","prompt":"Which measure of center fits 5, 6, 6, 7, 80 — mean or median? Why?","answer":"Median (6). The mean is 104 ÷ 5 = 20.8, which is larger than four of the five values because 80 pulls it up."},{"form":"C","prompt":"Which measure of center fits 41, 44, 45, 46, 49 — mean or median? Why?","answer":"Either works. The data are symmetric with no outlier; the mean (45) and median (45) agree."}],"extension":{"prompt":"Give a data set of five values where mean and median are equal but the range is 40.","answer":"Many answers. For example 10, 25, 30, 35, 50: mean = 150 ÷ 5 = 30, median = 30, range = 50 − 10 = 40."},"vocabulary":[{"term":"skewed","def":"A distribution stretched further on one side than the other."},{"term":"symmetric","def":"A distribution that looks about the same on both sides of the center."},{"term":"typical value","def":"The number that best represents the middle of the data."}],"frame":"I would report the ___ because the data are ___, and the ___ is pulled by ___ ."}]},{"number":3,"title":"Ratios and Rates","lessons":[{"id":"3-1","title":"Understand Ratios","standard":{"code":"6.RP.A.1","text":"Understand the concept of a ratio and use ratio language to describe a relationship between two quantities."},"skills":[{"text":"Recall multiplication facts through 12 × 12","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Skip-count by any one-digit number","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Count each part of a part-whole picture, then add the parts for the total","source":"Gr 2–4","is_elementary":true,"is_prior_g6":false},{"text":"Write a fraction naming a part of a whole","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 8 × 7.","answer":"56","explanation":"Use 8 × (5 + 2) = 40 + 16.","mode":"number"},{"skill":2,"prompt":"Continue the pattern: 6, 12, 18, __.","answer":"24","explanation":"Each step adds 6.","mode":"number"},{"skill":3,"prompt":"There are 5 blue counters and 7 red counters. How many counters in all?","answer":"12","explanation":"Add both parts: 5 + 7 = 12.","mode":"number"},{"skill":4,"prompt":"Three of eight equal slices are shaded. Write the shaded fraction.","answer":"3/8","explanation":"The numerator counts shaded slices; the denominator counts all equal slices.","mode":"number"}],"quick_check":"6 × 4? There are 3 dogs and 5 cats — how many animals in all?","solution":"6 × 4 = 24.<br><strong>Total animals:</strong> 3 dogs + 5 cats = 8 animals total.<br><em>(Part-to-part ratio is 3 : 5; part-to-whole ratio of dogs is 3 : 8).</em>","variants":[{"form":"B","prompt":"7 × 3? There are 4 red marbles and 6 blue — how many marbles in all?","answer":"7 × 3 = 21. Total: 4 + 6 = 10 marbles. Part-to-part is 4 : 6; red to total is 4 : 10."},{"form":"C","prompt":"8 × 5? A team has 5 guards and 7 forwards — how many players in all?","answer":"8 × 5 = 40. Total: 5 + 7 = 12 players. Guards to forwards is 5 : 7; guards to total is 5 : 12."}],"extension":{"prompt":"In a class the ratio of students wearing sneakers to boots is 5 : 2. There are 28 students. How many wear sneakers?","answer":"5 + 2 = 7 parts, and 28 ÷ 7 = 4 students per part, so sneakers = 5 × 4 = 20."},"vocabulary":[{"term":"ratio","def":"A comparison of two quantities, written 3 : 5 or 3 to 5."},{"term":"part-to-part","def":"A ratio comparing one group to another group, such as dogs to cats."},{"term":"part-to-whole","def":"A ratio comparing one group to the total, such as dogs to all animals."}],"frame":"The ratio of ___ to ___ is ___ : ___ because there are ___ of the first and ___ of the second."},{"id":"3-2","title":"Rates and Unit Rates","standard":{"code":"6.RP.A.2","text":"Understand the concept of a unit rate associated with a ratio and use rate language."},"skills":[{"text":"Divide a multi-digit number by a one- or two-digit number","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Divide to find the amount for one, and read “per” as “for each one”","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Keep a repeating pattern going in a table","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Attach the correct unit label to a computed number","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 168 ÷ 12.","answer":"14","explanation":"12 × 10 = 120 and 12 × 4 = 48; together they make 168.","mode":"number"},{"skill":2,"prompt":"Five notebooks cost $15. What is the cost in dollars for one notebook?","answer":"3","explanation":"Divide cost by the number of notebooks: 15 ÷ 5 = 3 dollars per notebook.","mode":"number"},{"skill":3,"prompt":"A table gives 1 bag → 4 marbles, 2 bags → 8, 3 bags → 12. How many marbles for 5 bags?","answer":"20","explanation":"Each bag adds 4 marbles; 5 × 4 = 20.","mode":"number"},{"skill":4,"prompt":"A cyclist rides 24 miles in 2 hours. State the unit rate with its unit.","answer":"12 miles per hour","explanation":"Divide miles by hours: 24 ÷ 2 = 12 miles per hour.","mode":"review"}],"quick_check":"60 ÷ 4? If 4 pencils cost $2, what does 1 pencil cost?","solution":"60 ÷ 4 = 15.<br><strong>Unit price:</strong> 1 pencil costs $2.00 ÷ 4 = $0.50 (50 cents).","variants":[{"form":"B","prompt":"72 ÷ 6? If 6 notebooks cost $9, what does 1 notebook cost?","answer":"72 ÷ 6 = 12. Unit price: $9 ÷ 6 = $1.50 per notebook."},{"form":"C","prompt":"150 ÷ 5? If a car travels 150 miles in 5 hours, what is the speed per hour?","answer":"150 ÷ 5 = 30. Speed: 30 miles per hour."}],"extension":{"prompt":"Brand A is 12 oz for $3.00. Brand B is 20 oz for $4.60. Which is the better buy?","answer":"A: $3.00 ÷ 12 = $0.25 per oz. B: $4.60 ÷ 20 = $0.23 per oz. Brand B is the better buy."},"vocabulary":[{"term":"rate","def":"A ratio comparing two quantities with different units, such as miles per hour."},{"term":"unit rate","def":"The amount for exactly one of something."},{"term":"per","def":"\"For each one\" — a signal to divide."}],"frame":"One ___ costs ___ because ___ divided by ___ gives the amount for each one."},{"id":"3-3","title":"Equivalent Ratios Using Tables","standard":{"code":"6.RP.A.3.a","text":"Make tables of equivalent ratios and use them to solve real-world and mathematical problems."},"skills":[{"text":"Multiply both numbers of a pair by the same factor","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Recall multiplication facts through 12 × 12","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Write equivalent fractions by multiplying numerator and denominator","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Fill the next row of a growing pattern table","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Scale the pair 3 : 5 by a factor of 4.","answer":"12 : 20","explanation":"Multiply both terms by 4: 3 × 4 = 12 and 5 × 4 = 20.","mode":"review"},{"skill":2,"prompt":"Compute 9 × 8.","answer":"72","explanation":"10 × 8 − 8 = 80 − 8 = 72.","mode":"number"},{"skill":3,"prompt":"Fill in the numerator: 2/3 = __/15.","answer":"10","explanation":"The denominator is multiplied by 5, so multiply the numerator by 5 too.","mode":"number"},{"skill":4,"prompt":"A table lists (2, 6), (4, 12), (6, 18). What pair comes next if the same step continues?","answer":"(8, 24)","explanation":"Add 2 to the first coordinate and 6 to the second.","mode":"review"}],"quick_check":"2 × 5 and 3 × 5? Complete: 2 : 3 = 8 : ___","solution":"2 × 5 = 10 and 3 × 5 = 15.<br><strong>Complete ratio:</strong> Since 2 × 4 = 8, scale 3 by 4: 3 × 4 = 12 (2 : 3 = 8 : 12).","variants":[{"form":"B","prompt":"4 × 6 and 5 × 6? Complete: 4 : 5 = 24 : ___","answer":"4 × 6 = 24 and 5 × 6 = 30. Since 4 × 6 = 24, scale 5 by 6: 4 : 5 = 24 : 30."},{"form":"C","prompt":"3 × 7 and 8 × 7? Complete: 3 : 8 = 21 : ___","answer":"3 × 7 = 21 and 8 × 7 = 56. So 3 : 8 = 21 : 56."}],"extension":{"prompt":"A recipe uses 3 cups flour to 2 cups water. You have 8 cups of water. How much flour?","answer":"Water scaled by 4 (2 × 4 = 8), so flour is 3 × 4 = 12 cups."},"vocabulary":[{"term":"equivalent ratios","def":"Ratios that describe the same relationship, such as 2 : 3 and 8 : 12."},{"term":"scale factor","def":"The number both quantities are multiplied by."},{"term":"ratio table","def":"A table whose rows are all equivalent ratios."}],"frame":"The missing value is ___ because both numbers were multiplied by ___ ."},{"id":"3-4","title":"Equivalent Ratios Using Graphs","standard":{"code":"6.RP.A.3.a","text":"Plot pairs of values from a ratio table on the coordinate plane."},"skills":[{"text":"Plot a point in Quadrant I from an ordered pair","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Read the scale on each axis before plotting","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Count right from the origin, then up","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Build a ratio table to generate the pairs","source":"3-3","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Describe how to plot (3, 5) from the origin.","answer":"Move 3 units right and 5 units up","explanation":"The first coordinate is horizontal; the second is vertical.","mode":"review"},{"skill":2,"prompt":"The x-axis ticks are 0, 2, 4, 6, 8. What x-value is at the third tick to the right of 0?","answer":"6","explanation":"Three intervals of 2 give 6.","mode":"number"},{"skill":3,"prompt":"A point is 4 units right and 7 units up from the origin. Give its ordered pair.","answer":"(4, 7)","explanation":"Write horizontal position first, then vertical position.","mode":"review"},{"skill":4,"prompt":"The rule is y = 3x. Give y when x = 4.","answer":"12","explanation":"Substitute 4 for x: 3 × 4 = 12.","mode":"number"}],"quick_check":"Start at (0, 0), move 3 right and 2 up — write the ordered pair. If each gridline is 5, where is 15?","solution":"<strong>Ordered pair:</strong> (3, 2) — move 3 units right on x-axis, then 2 units up on y-axis.<br><strong>Grid position:</strong> If each grid line is 5, 15 is at line 3 (15 ÷ 5 = 3).","variants":[{"form":"B","prompt":"Start at (0, 0), move 5 right and 4 up — write the ordered pair. If each gridline is 2, where is 12?","answer":"Ordered pair (5, 4). With gridlines worth 2, the value 12 sits at line 6 (12 ÷ 2 = 6)."},{"form":"C","prompt":"Start at (0, 0), move 2 right and 7 up — write the ordered pair. If each gridline is 10, where is 50?","answer":"Ordered pair (2, 7). With gridlines worth 10, the value 50 sits at line 5 (50 ÷ 10 = 5)."}],"extension":{"prompt":"A ratio graph passes through (0, 0), (2, 6), and (4, 12). What is the unit rate, and where is x = 5?","answer":"Unit rate = 6 ÷ 2 = 3, so y = 3x. At x = 5, y = 15 — the point (5, 15)."},"vocabulary":[{"term":"ordered pair","def":"A point written (x, y) — across first, then up."},{"term":"origin","def":"The point (0, 0) where the axes meet."},{"term":"axis scale","def":"What one grid line is worth on that axis."}],"frame":"The point ___ is at ___ across and ___ up because each gridline is worth ___ ."},{"id":"3-5","title":"Comparing Ratio Relationships","standard":{"code":"6.RP.A.3.b","text":"Solve unit rate problems, including comparing rates."},"skills":[{"text":"Compare two whole numbers","source":"Gr 2","is_elementary":true,"is_prior_g6":false},{"text":"Scale both parts of a ratio to hit a target value","source":"3-3","is_elementary":false,"is_prior_g6":true},{"text":"Find a common multiple of two numbers","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Divide to find a unit rate for a fair comparison","source":"3-2","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Which is greater: 35 or 53?","answer":"53","explanation":"Compare tens: 5 tens is greater than 3 tens.","mode":"number"},{"skill":2,"prompt":"Scale 4 : 7 to an equivalent ratio with first term 20.","answer":"20 : 35","explanation":"Multiply both terms by 5.","mode":"review"},{"skill":3,"prompt":"What is the least common multiple of 6 and 8?","answer":"24","explanation":"Multiples of 6 are 6, 12, 18, 24; multiples of 8 are 8, 16, 24.","mode":"number"},{"skill":4,"prompt":"Pack A costs $12 for 4 pens. Pack B costs $14 for 7 pens. Which has the lower price per pen?","answer":"Pack B","explanation":"A costs $3 per pen; B costs $2 per pen.","mode":"review"}],"quick_check":"Which is greater, 12 or 9? Scale 3 : 4 so the first number is 12.","solution":"12 is greater than 9.<br><strong>Scale 3 : 4:</strong> Since 3 × 4 = 12, multiply 4 by 4 to get 16. Scaled ratio: 12 : 16.","variants":[{"form":"B","prompt":"Which is greater, 18 or 15? Scale 2 : 5 so the first number is 18.","answer":"18 is greater. Since 2 × 9 = 18, multiply 5 by 9: 2 : 5 = 18 : 45."},{"form":"C","prompt":"Which is greater, 24 or 30? Scale 4 : 7 so the first number is 24.","answer":"30 is greater. Since 4 × 6 = 24, multiply 7 by 6: 4 : 7 = 24 : 42."}],"extension":{"prompt":"Runner A covers 3 miles in 24 minutes; Runner B covers 5 miles in 45 minutes. Who is faster?","answer":"A: 24 ÷ 3 = 8 minutes per mile. B: 45 ÷ 5 = 9 minutes per mile. Runner A is faster (fewer minutes per mile)."},"vocabulary":[{"term":"common term","def":"A shared value in both ratios that makes a fair comparison possible."},{"term":"benchmark","def":"A convenient value, often 1 or 100, used for comparing."},{"term":"common multiple","def":"A number both values divide into evenly."}],"frame":"I scaled ___ to ___ so both ratios share ___, which makes the comparison fair."},{"id":"3-6","title":"Converting Within One System","standard":{"code":"6.RP.A.3.d","text":"Use ratio reasoning to convert measurement units; manipulate and transform units appropriately."},"skills":[{"text":"Recall multiplication and division facts","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Recall customary facts: 1 ft = 12 in, 1 lb = 16 oz, 1 gal = 4 qt","source":"Gr 4–5","is_elementary":true,"is_prior_g6":false},{"text":"Multiply and divide by 10, 100, 1000 for metric steps","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Decide whether a conversion calls for multiplying or dividing","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 72 ÷ 9.","answer":"8","explanation":"Check with 9 × 8 = 72.","mode":"number"},{"skill":2,"prompt":"Use 1 foot = 12 inches. How many inches are in 3 feet?","answer":"36","explanation":"Multiply 3 × 12 = 36 inches.","mode":"number"},{"skill":3,"prompt":"How many meters are in 2.4 kilometers? Use 1 km = 1000 m.","answer":"2400","explanation":"Multiply 2.4 by 1000 because each kilometer contains 1000 meters.","mode":"number"},{"skill":4,"prompt":"Convert 48 inches to feet using 12 inches = 1 foot.","answer":"4","explanation":"Divide by 12 because 12 inches form one foot.","mode":"number"}],"quick_check":"12 × 4? 1 foot = ___ inches? 2.5 m = ___ cm?","solution":"12 × 4 = 48.<br>1 foot = 12 inches.<br>2.5 m = 250 cm (2.5 × 100 = 250).","variants":[{"form":"B","prompt":"11 × 4? 1 pound = ___ ounces? 3.5 m = ___ cm?","answer":"11 × 4 = 44. 1 pound = 16 ounces. 3.5 m = 350 cm (3.5 × 100)."},{"form":"C","prompt":"9 × 6? 1 gallon = ___ quarts? 0.75 km = ___ m?","answer":"9 × 6 = 54. 1 gallon = 4 quarts. 0.75 km = 750 m (0.75 × 1000)."}],"extension":{"prompt":"A tank holds 3 gallons. How many cups is that? (1 gal = 4 qt, 1 qt = 4 cups)","answer":"3 gal × 4 = 12 qt, and 12 qt × 4 = 48 cups."},"vocabulary":[{"term":"conversion factor","def":"The ratio between two units, such as 12 in : 1 ft."},{"term":"customary units","def":"Inches, feet, pounds, ounces, cups, quarts, gallons."},{"term":"metric units","def":"Millimeters, centimeters, meters, kilometers, grams, liters — related by powers of 10."}],"frame":"___ becomes ___ because I am going from a ___ unit to a ___ unit, so the number gets ___ ."},{"id":"3-7","title":"Converting Between Systems","standard":{"code":"6.RP.A.3.d","text":"Convert between measurement systems using ratio reasoning."},"skills":[{"text":"Multiply a whole number by a decimal","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Round a decimal to the nearest tenth or hundredth","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Multiply by a conversion factor and keep the unit label","source":"3-6","is_elementary":false,"is_prior_g6":true},{"text":"Chain two conversions in order without losing a step","source":"3-6","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Compute 6 × 2.5.","answer":"15","explanation":"6 × 2 + 6 × 0.5 = 12 + 3.","mode":"number"},{"skill":2,"prompt":"Round 7.846 to the nearest hundredth.","answer":"7.85","explanation":"The thousandths digit is 6, so round the hundredths digit up.","mode":"number"},{"skill":3,"prompt":"Use 1 inch = 2.54 centimeters. Convert 5 inches to centimeters.","answer":"12.7","explanation":"5 × 2.54 = 12.70 centimeters.","mode":"number"},{"skill":4,"prompt":"Use 1 yard = 3 feet and 1 foot = 12 inches. Convert 2 yards to inches.","answer":"72","explanation":"First 2 × 3 = 6 feet, then 6 × 12 = 72 inches.","mode":"number"}],"quick_check":"4 × 1.6? 10 × 0.45? Round 6.44 to the nearest tenth.","solution":"4 × 1.6 = 6.4.<br>10 × 0.45 = 4.5.<br>Round 6.44 to nearest tenth = 6.4 (since the hundredths digit 4 is less than 5).","variants":[{"form":"B","prompt":"5 × 2.54? 8 × 0.45? Round 12.7 to the nearest tenth.","answer":"5 × 2.54 = 12.7. 8 × 0.45 = 3.6. 12.7 is already to the nearest tenth: 12.7."},{"form":"C","prompt":"3 × 1.6? 20 × 0.45? Round 9.08 to the nearest tenth.","answer":"3 × 1.6 = 4.8. 20 × 0.45 = 9.0. Rounding 9.08 to the nearest tenth gives 9.1."}],"extension":{"prompt":"A race is 5 kilometers. About how many miles is that, if 1 km ≈ 0.62 mi? Round to the nearest tenth.","answer":"5 × 0.62 = 3.1 miles."},"vocabulary":[{"term":"cross-system conversion","def":"Changing between customary and metric, such as inches to centimeters."},{"term":"rounding","def":"Replacing a number with a nearby simpler one to a stated place."},{"term":"multi-step conversion","def":"Two conversions chained, each with its own factor."}],"frame":"___ units equal about ___ because each one is worth ___, and I rounded to the nearest ___ ."}]},{"number":4,"title":"Percent","lessons":[{"id":"4-1","title":"Understand Percent","standard":{"code":"6.RP.A.3.c","text":"Find a percent of a quantity as a rate per 100; solve problems involving finding the whole given a part and the percent."},"skills":[{"text":"Read and write a fraction with denominator 100","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Count shaded squares on a 100-square grid","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Write hundredths as a decimal","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Simplify a fraction over 100","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Write thirty-seven hundredths as a fraction.","answer":"37/100","explanation":"Hundredths means 100 equal parts; 37 are selected.","mode":"number"},{"skill":2,"prompt":"A 10-by-10 grid has 4 complete rows shaded. How many squares are shaded?","answer":"40","explanation":"Each row contains 10 squares; 4 × 10 = 40.","mode":"number"},{"skill":3,"prompt":"Write 68/100 as a decimal.","answer":"0.68","explanation":"Put 68 in the hundredths places.","mode":"number"},{"skill":4,"prompt":"Simplify 45/100.","answer":"9/20","explanation":"Divide the numerator and denominator by their common factor 5.","mode":"number"}],"quick_check":"37 of 100 squares are shaded — write it as a fraction, a decimal, and a percent.","solution":"<strong>Fraction:</strong> 37/100.<br><strong>Decimal:</strong> 0.37.<br><strong>Percent:</strong> 37%.","variants":[{"form":"B","prompt":"62 of 100 squares are shaded — write it as a fraction, a decimal, and a percent.","answer":"Fraction 62/100 (or 31/50). Decimal 0.62. Percent 62%."},{"form":"C","prompt":"8 of 100 squares are shaded — write it as a fraction, a decimal, and a percent.","answer":"Fraction 8/100 (or 2/25). Decimal 0.08. Percent 8%."}],"extension":{"prompt":"What does 150% look like on hundredths grids, and what decimal is it?","answer":"One fully shaded grid plus 50 squares of a second grid — 150/100 = 1.5."},"vocabulary":[{"term":"percent","def":"A rate per 100. The symbol % means \"out of 100.\""},{"term":"hundredths grid","def":"A 10 × 10 grid where each small square is 1%."},{"term":"simplest form","def":"A fraction whose numerator and denominator share no factor but 1."}],"frame":"___ percent means ___ out of 100, which is the fraction ___ and the decimal ___ ."},{"id":"4-2","title":"Relate Fractions, Decimals, and Percentages","standard":{"code":"6.RP.A.3.c","text":"Relate fractions, decimals, and percents and compare them."},"skills":[{"text":"Multiply and divide by 100 by shifting the decimal point","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Write a fraction as a decimal by dividing","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Recall benchmark equivalents for 1/2, 1/4, 1/5, 3/4, 1/10","source":"Gr 4–5","is_elementary":true,"is_prior_g6":false},{"text":"Compare decimals to the hundredths place","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 0.36 × 100.","answer":"36","explanation":"Multiplying by 100 makes each digit worth 100 times as much.","mode":"number"},{"skill":2,"prompt":"Write 3/8 as a decimal.","answer":"0.375","explanation":"Divide 3 by 8; check 0.375 × 8 = 3.","mode":"number"},{"skill":3,"prompt":"Write 3/4 as a percent.","answer":"75%","explanation":"Multiply numerator and denominator by 25 to get 75/100.","mode":"number"},{"skill":4,"prompt":"Which is greater: 0.6 or 0.56?","answer":"0.6","explanation":"Write 0.6 as 0.60; 60 hundredths is greater than 56 hundredths.","mode":"number"}],"quick_check":"0.45 as a percent? 25% as a fraction in simplest form? Which is greater, 0.6 or 55%?","solution":"0.45 = 45%.<br><strong>25% in simplest form:</strong> 25/100 = 1/4.<br><strong>Comparison:</strong> 0.6 = 60%, so 0.6 is greater than 55%.","variants":[{"form":"B","prompt":"0.08 as a percent? 40% as a fraction in simplest form? Which is greater, 0.7 or 65%?","answer":"0.08 = 8%. 40% = 40/100 = 2/5. 0.7 = 70%, so 0.7 is greater than 65%."},{"form":"C","prompt":"0.9 as a percent? 75% as a fraction in simplest form? Which is greater, 0.3 or 35%?","answer":"0.9 = 90%. 75% = 75/100 = 3/4. 35% = 0.35, so 35% is greater than 0.3."}],"extension":{"prompt":"Order least to greatest: 0.45, 2/5, 48%, 1/2.","answer":"As percents: 45%, 40%, 48%, 50%. Order: 2/5, 0.45, 48%, 1/2."},"vocabulary":[{"term":"benchmark","def":"A common value worth memorizing, such as 1/4 = 0.25 = 25%."},{"term":"equivalen
