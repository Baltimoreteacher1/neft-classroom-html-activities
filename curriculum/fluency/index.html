I checked by ___.","modelCaption":"Reference model from the worked example; use it to explain the idea."}]}},{"id":"2-8","title":"Describe Data Using the Mean","standard":{"code":"6.SP.B.5.c","text":"Report the mean and describe what it says about the data set."},"skills":[{"text":"Add a list of 5–10 two-digit numbers accurately","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Divide a three-digit number by a one-digit number","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Count how many values are in a data set","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Find a missing addend that reaches a given total","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Add 12 + 18 + 15 + 25 + 10.","answer":"80","explanation":"Pair 12 + 18 = 30 and 15 + 25 = 40, then add 10.","mode":"number"},{"skill":2,"prompt":"Compute 144 ÷ 6.","answer":"24","explanation":"6 × 24 = 144; use multiplication to check division.","mode":"number"},{"skill":3,"prompt":"How many values are in 4, 4, 7, 9, 9, 9?","answer":"6","explanation":"Count every entry, including repeated values.","mode":"number"},{"skill":4,"prompt":"Find the missing addend: 18 + 22 + __ = 65.","answer":"25","explanation":"The known addends total 40; 65 − 40 = 25.","mode":"number"}],"quick_check":"Mean of 10, 14, 8, 12, 16? What must be added to 48 to reach 60?","solution":"<strong>Sum:</strong> 10 + 14 + 8 + 12 + 16 = 60.<br><strong>Count:</strong> 5 values.<br><strong>Mean:</strong> 60 ÷ 5 = 12.<br><strong>Missing addend:</strong> 60 − 48 = 12.","variants":[{"form":"B","prompt":"Mean of 20, 18, 25, 17? What must be added to 72 to reach 100?","answer":"Sum = 80, count = 4, mean = 80 ÷ 4 = 20. Missing addend: 100 − 72 = 28."},{"form":"C","prompt":"Mean of 9, 15, 6, 12, 18? What must be added to 55 to reach 90?","answer":"Sum = 60, count = 5, mean = 60 ÷ 5 = 12. Missing addend: 90 − 55 = 35."}],"extension":{"prompt":"Four scores have a mean of 85. Three of them are 80, 90, and 88. What is the fourth?","answer":"Total must be 4 × 85 = 340. The known three sum to 258, so the fourth is 340 − 258 = 82."},"vocabulary":[{"term":"mean","def":"The sum of the values divided by how many values there are."},{"term":"fair share","def":"Another way to read the mean: the amount each value would get if the total were shared evenly."},{"term":"missing addend","def":"The amount still needed to reach a target total."}],"frame":"The mean is ___ because the total ___ is shared evenly among ___ values.","workshop":{"goal":"I can find the mean and explain it as a fair share.","strategy":["Add every data value, including repeated values.","Count how many observations there are.","Divide the total by the count; interpret the result as a fair share."],"example":{"prompt":"Find the mean of 4, 6, 8.","answer":"6","explanation":"Add: 4 + 6 + 8 = 18. | Count three observations. | Share equally: 18 ÷ 3 = 6. The mean is 6.","model":{"kind":"data","values":[4,6,8]},"mode":"number","steps":["Add: 4 + 6 + 8 = 18.","Count three observations.","Share equally: 18 ÷ 3 = 6. The mean is 6."]},"model":{"kind":"data","values":[4,6,8]},"misconception":{"claim":"The mean is found by dividing the total by the greatest value.","repair":"Divide by the number of observations, not by a data value. For 4, 6, 8 the total is 18 and there are 3 observations, so the mean is 6."},"tasks":[{"prompt":"Find the mean of 2, 4, 6.","answer":"4","explanation":"Total 12 ÷ 3 values = 4.","model":{"kind":"data","values":[2,4,6]},"mode":"number","label":"Guided practice 1","guidance":["Add every data value, including repeated values.","Count how many observations there are.","Divide the total by the count; interpret the result as a fair share."],"hints":["Add every data value, including repeated values.","Count how many observations there are."],"steps":["Add every data value, including repeated values.","Count how many observations there are.","Divide the total by the count; interpret the result as a fair share.","Total 12 ÷ 3 values = 4."],"frame":"I used ___ because ___. I checked my answer by ___.","modelCaption":"Model for this problem. Read its labels before calculating."},{"prompt":"Find the mean of 3, 5, 7, 9.","answer":"6","explanation":"Total 24 ÷ 4 values = 6.","model":{"kind":"data","values":[3,5,7,9]},"mode":"number","label":"Guided practice 2","guidance":["Add every data value, including repeated values.","Count how many observations there are.","Divide the total by the count; interpret the result as a fair share."],"hints":["Add every data value, including repeated values.","Count how many observations there are."],"steps":["Add every data value, including repeated values.","Count how many observations there are.","Divide the total by the count; interpret the result as a fair share.","Total 24 ÷ 4 values = 6."],"frame":"I used ___ because ___. I checked my answer by ___.","modelCaption":"Model for this problem. Read its labels before calculating."},{"prompt":"Find the mean of 4, 4, 8, 8.","answer":"6","explanation":"Total 24 ÷ 4 values = 6.","model":{"kind":"data","values":[4,4,8,8]},"mode":"number","label":"Practice 1","guidance":[],"hints":["Add every data value, including repeated values.","Count how many observations there are."],"steps":["Add every data value, including repeated values.","Count how many observations there are.","Divide the total by the count; interpret the result as a fair share.","Total 24 ÷ 4 values = 6."],"frame":"I used ___ because ___. I checked my answer by ___.","modelCaption":"Model for this problem. Read its labels before calculating."},{"prompt":"Find the mean of 10, 12, 14.","answer":"12","explanation":"Total 36 ÷ 3 values = 12.","model":{"kind":"data","values":[10,12,14]},"mode":"number","label":"Practice 2","guidance":[],"hints":["Add every data value, including repeated values.","Count how many observations there are."],"steps":["Add every data value, including repea es":[4,6,8]},"mode":"review","label":"Find & repair an error","guidance":[],"hints":["Add every data value, including repeated values.","Count how many observations there are."],"steps":["Add every data value, including repeated values.","Count how many observations there are.","Divide the total by the count; interpret the result as a fair share.","Compare the claim, the calculation, and the units. Explain the evidence that supports your conclusion."],"frame":"The step I would change is ___ because ___. The correct reasoning is ___.","modelCaption":"Reference model from the worked example; use it to explain the idea."},{"prompt":"Four students collected 3, 5, 8, and 8 cans. Explain how to redistribute them so everyone has the mean number without changing the total.","answer":"The total is 24 and the mean is 6. Give 3 cans to the first student and 1 to the second, taking 2 from each student with 8. Everyone has 6.","explanation":"Compare the claim, the calculation, and the units. Explain the evidence that supports your conclusion.","model":{"kind":"data","values":[4,6,8]},"mode":"review","label":"Apply & explain","guidance":[],"hints":["Add every data value, including repeated values.","Count how many observations there are."],"steps":["Add every data value, including repeated values.","Count how many observations there are.","Divide the total by the count; interpret the result as a fair share.","Compare the claim, the calculation, and the units. Explain the evidence that supports your conclusion."],"frame":"I represented ___ with ___. My result means ___. I checked by ___.","modelCaption":"Reference model from the worked example; use it to explain the idea."}]}},{"id":"2-9","title":"Describe Data by Mean Absolute Deviation","standard":{"code":"6.SP.B.5.c","text":"Report the mean absolute deviation and describe variability."},"skills":[{"text":"Find the mean of a data set","source":"2-8","is_elementary":false,"is_prior_g6":true},{"text":"Subtract to find the distance tios and use them to solve real-world and mathematical problems."},"skills":[{"text":"Multiply both numbers of a pair by the same factor","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Recall multiplication facts through 12 × 12","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Write equivalent fractions by multiplying numerator and denominator","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Fill the next row of a growing pattern table","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Scale the pair 3 : 5 by a factor of 4.","answer":"12 : 20","explanation":"Multiply both terms by 4: 3 × 4 = 12 and 5 × 4 = 20.","mode":"review"},{"skill":2,"prompt":"Compute 9 × 8.","answer":"72","explanation":"10 × 8 − 8 = 80 − 8 = 72.","mode":"number"},{"skill":3,"prompt":"Fill in the numerator: 2/3 = __/15.","answer":"10","explanation":"The denominator is multiplied by 5, so multiply the numerator by 5 too.","mode":"number"},{"skill":4,"prompt":"A table lists (2, 6), (4, 12), (6, 18). What pair comes next if the same step continues?","answer":"(8, 24)","explanation":"Add 2 to the first coordinate and 6 to the second.","mode":"review"}],"quick_check":"2 × 5 and 3 × 5? Complete: 2 : 3 = 8 : ___","solution":"2 × 5 = 10 and 3 × 5 = 15.<br><strong>Complete ratio:</strong> Since 2 × 4 = 8, scale 3 by 4: 3 × 4 = 12 (2 : 3 = 8 : 12).","variants":[{"form":"B","prompt":"4 × 6 and 5 × 6? Complete: 4 : 5 = 24 : ___","answer":"4 × 6 = 24 and 5 × 6 = 30. Since 4 × 6 = 24, scale 5 by 6: 4 : 5 = 24 : 30."},{"form":"C","prompt":"3 × 7 and 8 × 7? Complete: 3 : 8 = 21 : ___","answer":"3 × 7 = 21 and 8 × 7 = 56. So 3 : 8 = 21 : 56."}],"extension":{"prompt":"A recipe uses 3 cups flour to 2 cups water. You have 8 cups of water. How much flour?","answer":"Water scaled by 4 (2 × 4 = 8), so flour is 3 × 4 = 12 cups."},"vocabulary":[{"term":"equivalent ratios","def":"Ratios that describe the same relationship pe batches: use Flour values 3, 6, 12. Complete both columns; then use the table to answer the question."}],"ratioTables":[{"title":"Equivalent quantities","headers":["Concentrate (cups)","Water (cups)"],"rows":[[2,5],[4,10],[6,15]]}]}},{"id":"3-4","title":"Equivalent Ratios Using Graphs","standard":{"code":"6.RP.A.3.a","text":"Plot pairs of values from a ratio table on the coordinate plane."},"skills":[{"text":"Plot a point in Quadrant I from an ordered pair","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Read the scale on each axis before plotting","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Count right from the origin, then up","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Build a ratio table to generate the pairs","source":"3-3","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Describe how to plot (3, 5) from the origin.","answer":"Move 3 units right and 5 units up","explanation":"The first coordinate is horizontal; the second is vertical.","mode":"review"},{"skill":2,"prompt":"The x-axis ticks are 0, 2, 4, 6, 8. What x-value is at the third tick to the right of 0?","answer":"6","explanation":"Three intervals of 2 give 6.","mode":"number"},{"skill":3,"prompt":"A point is 4 units right and 7 units up from the origin. Give its ordered pair.","answer":"(4, 7)","explanation":"Write horizontal position first, then vertical position.","mode":"review"},{"skill":4,"prompt":"The rule is y = 3x. Give y when x = 4.","answer":"12","explanation":"Substitute 4 for x: 3 × 4 = 12.","mode":"number"}],"quick_check":"Start at (0, 0), move 3 units right and 2 units up — write the ordered pair. A horizontal axis has grid lines every 5 units, starting at 0. How many intervals right of 0 is the value 15?","solution":"<strong>Ordered pair:</strong> (3, 2) — move 3 units right on x-axis, then 2 units up on y-axis.<br><strong>Grid position:</strong> If each grid line is 5, 15 is at line 3 (15 ÷ 5 = 3).","variants":[{"form":"B","prompt":"Start at (0, 0), move 5 units right and 4 units up — write the ordered pair. A horizontal axis has grid lines every 2 units, starting at 0. How many intervals right of 0 is the value 12?","answer":"Ordered pair (5, 4). With gridlines worth 2, the value 12 sits at line 6 (12 ÷ 2 = 6)."},{"form":"C","prompt":"Start at (0, 0), move 2 units right and 7 units up — write the ordered pair. A horizontal axis has grid lines every 10 units, starting at 0. How many intervals right of 0 is the value 50?","answer":"Ordered pair (2, 7). With gridlines worth 10, the value 50 sits at line 5 (50 ÷ 10 = 5)."}],"extension":{"prompt":"A ratio graph passes through (0, 0), (2, 6), and (4, 12). What is the unit rate, and where is x = 5?","answer":"Unit rate = 6 ÷ 2 = 3, so y = 3x. At x = 5, y = 15 — the point (5, 15)."},"vocabulary":[{"term":"ordered pair","def":"A point written (x, y) — across first, then up."},{"term":"origin","def":"The point (0, 0) where the axes meet."},{"term":"axis scale","def":"What one grid line is worth on that axis."}],"frame":"The point ___ is at ___ across and ___ up because each gridline is worth ___ .","workshop":{"goal":"I can connect equivalent ratios to points on a graph with a ratio table.","strategy":["Label the two quantities and their units. Record a known pair in the first row.","Build equivalent rows by multiplying or dividing BOTH quantities by the same factor.","Use a row of your table to answer. Explain the scale factor and check the units."],"example":{"prompt":"A proportional graph represents y = 2x. What is the y-coordinate when x = 3?","answer":"6","explanation":"The points (1,2) and (2,4) show y/x = 2. | At x = 3, calculate y = 2 × 3. | Plot (3,6): three units across, six up.","model":{"kind":"coordinates","points":[[1,2],[2,4]],"xMax":4,"yMax":8,"xLabel":"x","yLabel":"y"},"mode":"number","steps":["Label the columns. Enter the known pair: Points to plot: 1 x (horizontal) and 2 y (vertical).","Points t itle":"Percent","lessons":[{"id":"4-1","title":"Understand Percent","standard":{"code":"6.RP.A.3.c","text":"Find a percent of a quantity as a rate per 100; solve problems involving finding the whole given a part and the percent."},"skills":[{"text":"Read and write a fraction with denominator 100","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Count shaded squares on a 100-square grid","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Write hundredths as a decimal","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Simplify a fraction over 100","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Write thirty-seven hundredths as a fraction.","answer":"37/100","explanation":"Hundredths means 100 equal parts; 37 are selected.","mode":"number"},{"skill":2,"prompt":"A 10-by-10 grid has 4 complete rows shaded. How many squares are shaded?","answer":"40","explanation":"Each row contains 10 squares; 4 × 10 = 40.","mode":"number"},{"skill":3,"prompt":"Write 68/100 as a decimal.","answer":"0.68","explanation":"Put 68 in the hundredths places.","mode":"number"},{"skill":4,"prompt":"Simplify 45/100.","answer":"9/20","explanation":"Divide the numerator and denominator by their common factor 5.","mode":"number"}],"quick_check":"37 of 100 squares are shaded — write it as a fraction, a decimal, and a percent.","solution":"<strong>Fraction:</strong> 37/100.<br><strong>Decimal:</strong> 0.37.<br><strong>Percent:</strong> 37%.","variants":[{"form":"B","prompt":"62 of 100 squares are shaded — write it as a fraction, a decimal, and a percent.","answer":"Fraction 62/100 (or 31/50). Decimal 0.62. Percent 62%."},{"form":"C","prompt":"8 of 100 squares are shaded — write it as a fraction, a decimal, and a percent.","answer":"Fraction 8/100 (or 2/25). Decimal 0.08. Percent 8%."}],"extension":{"prompt":"What does 150% look like on hundredths grids, and what decimal is it?","answer":"One fully shaded gri he total.","Rewrite any mixed number as an improper fraction.","Multiply by the reciprocal of the divisor; check by multiplying quotient and divisor."],"example":{"prompt":"Compute 1/2 ÷ 1/4. Give a number or equivalent fraction.","answer":"2","explanation":"The total is 1/2 and each group is 1/4. | (1/2) ÷ (1/4) = (1/2) × 4. | There are 2 quarter-sized groups; 2 × 1/4 = 1/2.","model":{"kind":"fractionDivision","a":1,"b":2,"c":1,"d":4},"mode":"number","steps":["The total is 1/2 and each group is 1/4.","(1/2) ÷ (1/4) = (1/2) × 4.","There are 2 quarter-sized groups; 2 × 1/4 = 1/2."]},"model":{"kind":"fractionDivision","a":1,"b":2,"c":1,"d":4},"misconception":{"claim":"Dividing by a fraction always makes the result smaller.","repair":"Dividing by a positive fraction less than 1 can make the result larger. There are six quarter-sized groups in 1 1/2."},"tasks":[{"prompt":"Compute 3/4 ÷ 1/4. Give a number or equivalent fraction.","answer":"3","explanation":"3/4 × 4 = 3. Multiply this result by 1/4 to recover 3/4.","model":{"kind":"fractionDivision","a":3,"b":4,"c":1,"d":4},"mode":"number","label":"Guided practice 1","guidance":["Interpret division as the number of divisor-sized groups in the total.","Rewrite any mixed number as an improper fraction.","Multiply by the reciprocal of the divisor; check by multiplying quotient and divisor."],"hints":["Interpret division as the number of divisor-sized groups in the total.","Rewrite any mixed number as an improper fraction."],"steps":["Interpret division as the number of divisor-sized groups in the total.","Rewrite any mixed number as an improper fraction.","Multiply by the reciprocal of the divisor; check by multiplying quotient and divisor.","3/4 × 4 = 3. Multiply this result by 1/4 to recover 3/4."],"frame":"I used ___ because ___. I checked my answer by ___.","modelCaption":"Model for this problem. Read its labels before calculating."},{"prompt":"Compute 2/3 ÷ 1/6. Give a number or equivalent fraction.","answer":"4","expla s the numerator: 12 ÷ 3 = 4.","mode":"number"},{"skill":4,"prompt":"Write an expression for 7 less than the product of 3 and 5.","answer":"3 × 5 − 7","explanation":"Start with the product, then subtract 7. Its value is 8.","mode":"review"}],"quick_check":"4 + 6 ÷ 2? 3 + 2² × 5? Which operation comes first?","solution":"4 + 6 ÷ 2: Divide first (6 ÷ 2 = 3), then add: 4 + 3 = 7.<br>3 + 2² × 5: Exponent first (2² = 4), then multiply (4 × 5 = 20), then add: 3 + 20 = 23.<br>Exponent comes first, then multiplication, then addition.","variants":[{"form":"B","prompt":"8 + 12 ÷ 4? 5 + 3² × 2? Which operation comes first?","answer":"8 + 12 ÷ 4: divide first (3), then add: 11. 5 + 3² × 2: exponent (9), then multiply (18), then add: 23. The exponent comes first."},{"form":"C","prompt":"20 − 6 × 2? 4 + 2³ ÷ 4? Which operation comes first?","answer":"20 − 6 × 2: multiply first (12), then subtract: 8. 4 + 2³ ÷ 4: exponent (8), then divide (2), then add: 6. The exponent comes first."}],"extension":{"prompt":"Evaluate 2 × (3 + 4)² − 10.","answer":"Parentheses: 7. Exponent: 49. Multiply: 98. Subtract: 88."},"vocabulary":[{"term":"order of operations","def":"Grouping symbols, then exponents, then multiply/divide left to right, then add/subtract left to right."},{"term":"grouping symbol","def":"Parentheses, brackets, or a fraction bar that says \"do this first.\""},{"term":"evaluate","def":"Find the single value of an expression."}],"frame":"I do ___ first because ___ comes before ___ in the order of operations.","workshop":{"goal":"I can evaluate numerical expressions in the correct order.","strategy":["Evaluate parentheses first, then exponents.","Multiply and divide from left to right.","Add and subtract from left to right; record intermediate values."],"example":{"prompt":"Evaluate 5 + 3^2 × 2.","answer":"23","explanation":"Exponent first: 3² = 9. | Multiply: 9 × 2 = 18. | Add: 5 + 18 = 23.","model":{"kind":"expression","tokens":["5","3²","2"],"operator":"mixed","expression":"5 + 3² nce of the variable, using parentheses where needed.","Evaluate operations in order and interpret any units.","Compare the claim, the calculation, and the units. Explain the evidence that supports your conclusion."],"frame":"The step I would change is ___ because ___. The correct reasoning is ___.","modelCaption":"Reference model from the worked example; use it to explain the idea."},{"prompt":"A club charges $5 to join and $3 per meeting. Write the cost for m meetings, then evaluate for 4 meetings.","answer":"C = 5 + 3m. At m = 4, C = 5 + 12 = $17.","explanation":"Compare the claim, the calculation, and the units. Explain the evidence that supports your conclusion.","model":{"kind":"expression","tokens":["3x","4"],"operator":"+","expression":"3x + 4; x = 5"},"mode":"review","label":"Apply & explain","guidance":[],"hints":["Identify each variable and its supplied value.","Replace every occurrence of the variable, using parentheses where needed."],"steps":["Identify each variable and its supplied value.","Replace every occurrence of the variable, using parentheses where needed.","Evaluate operations in order and interpret any units.","Compare the claim, the calculation, and the units. Explain the evidence that supports your conclusion."],"frame":"I represented ___ with ___. My result means ___. I checked by ___.","modelCaption":"Reference model from the worked example; use it to explain the idea."}]}},{"id":"6-6","title":"Identify Equivalent Algebraic Expressions","standard":{"code":"6.EE.A.4","text":"Identify when two expressions are equivalent."},"skills":[{"text":"Combine like terms such as 5x + 2x","source":"Gr 6","is_elementary":true,"is_prior_g6":false},{"text":"Evaluate an expression at a chosen value","source":"6-5","is_elementary":false,"is_prior_g6":true},{"text":"Apply the distributive property with numbers, e.g. 3(4 + 5)","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Compare two results to decide whether expressions match","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Simplify 5x + 2x.","answer":"7x","explanation":"Both terms count x units; combine coefficients 5 + 2.","mode":"review"},{"skill":2,"prompt":"Evaluate 3x + 4 when x = 2.","answer":"10","explanation":"Substitute 2, then compute 6 + 4.","mode":"number"},{"skill":3,"prompt":"Evaluate 3(4 + 5) using distribution.","answer":"27","explanation":"3 × 4 + 3 × 5 = 12 + 15.","mode":"number"},{"skill":4,"prompt":"Compare 2(x + 3) and 2x + 6 at x = 4. Give both values.","answer":"14 and 14","explanation":"2(4 + 3) = 14 and 2 × 4 + 6 = 14. Matching at one value alone does not prove equivalence for all values.","mode":"review"}],"quick_check":"5x + 2x = ? Evaluate 2(x + 3) and 2x + 6 at x = 4 — are they the same?","solution":"5x + 2x = 7x.<br>At x = 4: 2(4 + 3) = 2(7) = 14; and 2(4) + 6 = 8 + 6 = 14.<br>Yes, both equal 14 at x = 4. The distributive property, 2(x + 3) = 2x + 6, shows they are equivalent for every x.","variants":[{"form":"B","prompt":"8y + 3y = ? Evaluate 3(x + 2) and 3x + 6 at x = 5 — are they the same?","answer":"8y + 3y = 11y. At x = 5: 3(7) = 21 and 15 + 6 = 21. Yes — the distributive property shows they match for every x."},{"form":"C","prompt":"9a − 4a = ? Evaluate 4(x + 1) and 4x + 4 at x = 3 — are they the same?","answer":"9a − 4a = 5a. At x = 3: 4(4) = 16 and 12 + 4 = 16. Yes — equivalent for every x."}],"extension":{"prompt":"Are 3(2x + 4) and 6x + 7 equivalent? Justify.","answer":"No. Distributing gives 6x + 12, not 6x + 7. At x = 0 they give 12 and 7 — different."},"vocabulary":[{"term":"like terms","def":"Terms with the same variable raised to the same power, such as 5x and 2x."},{"term":"equivalent expressions","def":"Expressions that give the same value for every value of the variable."},{"term":"distributive property","def":"a(b + c) = ab + ac."}],"frame":"___ and ___ are equivalent because ___, which holds for every value of ___ .","workshop":{"goal":"I can justify expression equivalence using properties.","strategy":["Use a property of operations to rewrite the expressions.","Check whether the rewritten structures match for every variable value.","A match at one input alone does not prove equivalence."],"example":{"prompt":"Are 3(x + 2) and 3x + 6 equivalent for every x?","answer":"yes","explanation":"Distribute 3 to both terms. | 3(x + 2) = 3x + 6. | The distributive property establishes equality for every x.","model":{"kind":"expression","expression":"3(x + 2)","tokens":["x + 2","x + 2","x + 2"],"operator":"+"},"mode":"choice","options":["yes","no"],"steps":["Distribute 3 to both terms.","3(x + 2) = 3x + 6.","The distributive property establishes equality for every x."]},"model":{"kind":"expression","expression":"3(x + 2)","tokens":["x + 2","x + 2","x + 2"],"operator":"+"},"misconception":{"claim":"If two expressions match at x = 0, they are equivalent for every x.","repair":"One input checks only one case. For example, 2x and 3x both equal 0 at x = 0 but differ at x = 1. Use properties to prove equivalence."},"tasks":[{"prompt":"Are 2(x + 4) and 2x + 8 equivalent for every x?","answer":"yes","explanation":"Distributing gives 2x + 8. That matches the second expression.","model":{"kind":"expression","expression":"2(x + 4)","tokens":["x + 4","x + 4"],"operator":"+"},"mode":"choice","options":["yes","no"],"label":"Guided practice 1","guidance":["Use a property of operations to rewrite the expressions.","Check whether the rewritten structures match for every variable value.","A match at one input alone does not prove equivalence."],"hints":["Use a property of operations to rewrite the expressions.","Check whether the rewritten structures match for every variable value."],"steps":["Use a property of operations to rewrite the expressions.","Check whether the rewritten structures match for every variable value.","A match at one input alone does not prove equivalence.","Distributing gives 2x + 8. That matches the second expression."],"f nal table gives (3, 12), (5, 20), (8, 32). Write its equation and predict y when x = 11.","answer":"y ÷ x = 4 for every row, so y = 4x. At x = 11, y = 44."},"vocabulary":[{"term":"constant of proportionality","def":"The fixed number k in y = kx; the unit rate."},{"term":"rule","def":"The relationship that produces y from x."},{"term":"in terms of","def":"Written so one variable is expressed using the other."}],"frame":"The equation is y = ___x because every y divided by its x equals ___ .","workshop":{"goal":"I can write an equation from a proportional relationship.","strategy":["For a proportional table, divide y by x at every nonzero input.","Verify that the quotient is constant across all supplied rows.","Write y = kx and test it in each row, including (0,0) when supplied."],"example":{"prompt":"A proportional table contains (2, 8), (3, 12), and (4, 16). Find k in y = kx.","answer":"4","explanation":"Calculate 8/2 = 4, 12/3 = 4, and 16/4 = 4. | The same quotient holds in every row. | The equation is y = 4x.","model":{"kind":"table","headers":["x","y"],"rows":[[2,8],[3,12],[4,16]]},"mode":"number","steps":["Calculate 8/2 = 4, 12/3 = 4, and 16/4 = 4.","The same quotient holds in every row.","The equation is y = 4x."]},"model":{"kind":"table","headers":["x","y"],"rows":[[2,8],[3,12],[4,16]]},"misconception":{"claim":"A single matching row proves y = 4x fits the whole table.","repair":"Check every supplied row. A different row can violate the rule; for example, (2,8) fits but (3,13) does not."},"tasks":[{"prompt":"A proportional table contains (1, 3), (2, 6), and (3, 9). Find k in y = kx.","answer":"3","explanation":"Each y/x equals 3; the equation is y = 3x.","model":{"kind":"table","headers":["x","y"],"rows":[[1,3],[2,6],[3,9]]},"mode":"number","label":"Guided practice 1","guidance":["For a proportional table, divide y by x at every nonzero input.","Verify that the quotient is constant across all supplied rows.","Write y = kx and test it in each row, including (0,0 <script id="fluency-models">/* Deterministic, local mathematical diagrams with equivalent text. */
window.FluencyModels = (() => {
  "use strict";
  let serial = 0;
  const esc = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );
  const text = (x, y, s, extra = "") => `<text x="${x}" y="${y}" ${extra}>${esc(s)}</text>`;
  const line = (x1, y1, x2, y2, cls = "") =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}"/>`;
  const rect = (x, y, w, h, cls = "") =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${cls}"/>`;
  const svg = (body, description, height = 250) => {
    const id = `flm-${++serial}`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 ${height}" width="600" height="${height}" role="img" aria-labelledby="${id}-title ${id}-desc"><title id="${id}-title">Mathematical model</title><desc id="${id}-desc">${esc(description)}</desc>${body}</svg>`;
  };
  function numberline(m) {
    const lo = m.min,
      hi = m.max,
      px = (n) => 55 + ((n - lo) / (hi - lo)) * 490;
    let body = line(55, 130, 545, 130);
    const step = Math.max(1, Math.ceil((hi - lo) / 6));
    for (let n = Math.ceil(lo / step) * step; n <= hi; n += step)
      body += line(px(n), 124, px(n), 136) + text(px(n), 166, n, 'text-anchor="middle"');
    [...new Set(m.values)].forEach((n, i) => {
      body +=
        `<circle cx="${px(n)}" cy="130" r="7" class="flm-dot"/>` +
        line(px(n), 119, px(n), 76 - i * 23, "flm-dashed") +
        text(px(n), 65 - i * 23, n, 'text-anchor="middle"');
    });
    return {
      html: svg(
        body,
        `Number line from ${lo} to ${hi} in steps of ${step}. Marked values: ${m.values.join(", ")}.`,
      ),
      description: `Equal intervals of ${step} unit${step === 1 ? "" : "s"}. Values: ${m.values.join(", ")}. Values increase from left to right.`,
    };
  }
  function dataset(m) {
    const a = [...m.values].sort((a, b) => a - b),
      lo = Math.min(0, a[0]),
      hi = Math.max(a[a.length - 1], lo + 1),
      px = (n) => 55 + ((n - lo) / (hi - lo)) * 490;
    let body = line(55, 175, 545, 175),
      counts = new Map();
    a.forEach((n) => {
      const count = (counts.get(n) || 0) + 1;
      counts.set(n, count);
      body += `<circle cx="${px(n)}" cy="${155 - (count - 1) * 24}" r="8" class="flm-dot"/>`;
    });
    const step = Math.max(1, Math.ceil((hi - lo) / 6));
    for (let n = lo; n <= hi; n += step)
      body += line(px(n), 170, px(n), 181) + text(px(n), 207, n, 'text-anchor="middle"');
    return {
      html: svg(body, `Dot plot of ${m.values.join(", ")}. Each dot is one observation.`),
      description: `${m.label ? m.label + ". " : ""}Data values: ${m.values.join(", ")}. One dot represents one observation; repeated values stack. Positions use a numerical scale.`,
    };
  }
  function histogram(m) {
    const frequencies = m.bins.map(([a, b]) => m.values.filter((x) => x >= a && x <= b).length),
      max = Math.max(...frequencies, 1),
      px = (i) => 95 + i * 140,
      py = (n) => 185 - (n / max) * 125;
    let body = line(75, 185, 530, 185) + line(75, 50, 75, 185) + text(28, 30, "Count");
    for (let n = 0; n <= max; n++)
      body += text(60, py(n) + 5, n, 'text-anchor="end"') + line(70, py(n), 75, py(n));
    m.bins.forEach(([a, b], i) => {
      body +=

        text(px(i) + 69, 214, `${a}–${b}`, 'text-anchor="middle"');
    });
    const description = `Whole-number bins: ${m.bins.map(([a, b], i) => `${a}–${b}: ${frequencies[i]} observations`).join("; ")}. Each stated endpoint is included. Data: ${m.values.join(", ")}.`;
    return { html: svg(body, description), description };
  }
  function box(m) {
    const [a, q1, med, q3, b] = m.values,
      span = Math.max(b - a, 1),
      px = (n) => 65 + ((n - a) / span) * 470;
    let body =
      line(px(a), 120, px(b), 120) +
      rect(px(q1), 87, px(q3) - px(q1), 66, "flm-fill") +
      line(px(med), 87, px(med), 153) +
      line(px(a), 98, px(a), 142) +
      line(px(b), 98, px(b), 142);
    m.values.forEach(
      (n, i) =>
        (body +=
          line(px(n), 153, px(n), 175) +
          text(px(n), 196, n, 'text-anchor="middle"') +
          text(
            60 + i * 120,
            35,
            ["Min", "Q1", "Median", "Q3", "Max"][i] + ": " + n,
            'text-anchor="middle"',
          )),
    );
    const description = `Five-number summary: minimum ${a}, Q1 ${q1}, median ${med}, Q3 ${q3}, maximum ${b}. The box spans Q1 to Q3 on a numerical scale.`;
    return { html: svg(body, description), description };
  }
  function ratio(m) {
    const r = (n, y, cls, label) => {
      let b = text(30, y + 5, label);
      for (let i = 0; i < n; i++)
        b += `<circle cx="${140 + i * 32}" cy="${y}" r="11" class="${cls}"/>`;
      return b;
    };
    const description = `${m.a} blue counters and ${m.b} gold counters. The groups use different labels and fill patterns. Total ${m.a + m.b} counters.`;
    return {
      html: svg(r(m.a, 85, "flm-dot", "Blue") + r(m.b, 145, "flm-gold", "Gold"), description, 210),
      description,
    };
  }
  function fraction(m) {
    const { n, d } = m,
      wholeCount = Math.ceil(n / d),
      width = 480 / d;
    let body = "";
    for (let w = 0; w < wholeCount; w++) {
      const y = 40 + w * 85;
      body += text(55, y - 12, `Whole ${w + 1}`);
      for (let i = 0; i < d; i++)
        body += rect(55 + i * width, y, width, 48, w * d + i < n ? "flm-fill" : "flm-empty");
    }
    const description = `${n} shaded parts, each of size 1/${d}. Each outlined complete strip is one whole divided into ${d} equal parts.`;
    return { html: svg(body, description, Math.max(180, wholeCount * 85 + 55)), description };
  }
  function percent(m) {
    const p = m.part;
    let body = "";
    for (let i = 0; i < 100; i++) {
      const fill = Math.max(0, Math.min(1, p - i)),
        x = 95 + (i % 10) * 29,
        y = 25 + Math.floor(i / 10) * 22;
      body += rect(x, y, 29, 22, "flm-empty");
      if (fill) body += rect(x, y, 29 * fill, 22, "flm-fill");
    }
    body +=
      text(420, 85, `${p}%`) +
      text(420, 120, m.whole !== undefined ? `Whole: ${m.whole}` : "Whole: ?") +
      text(420, 155, m.knownPart !== undefined ? `Part: ${m.knownPart}` : "Part: ?");
    const description = `Hundred grid: ${p} of 100 equal cells shaded. ${m.whole !== undefined ? `The whole represents ${m.whole}.` : `The known ${p}% part is ${m.knownPart}; the whole is unknown.`}`;
    return { html: svg(body, description, 270), description };
  }
  function division(m) {
    const description = `Count groups of size ${m.groups} within a total of ${m.total}. The number of groups is unknown. The small bar represents one group on the same scale as the total bar.`;
    const body =
      rect(60, 55, 480, 55, "flm-fill") +
      text(300, 90, `Total: ${m.total}`, 'text-anchor="middle"') +
      line(300, 115, 300, 140) +
      rect(60, 150, (480 * m.groups) / m.total, 35, "flm-empty") +
      text(60, 218, `One group has size ${m.groups}`) +
      text(300, 255, "How many groups fit in the total?", 'text-anchor="middle"');
    return { html: svg(body, description, 285), description };
  }
  function area(m) {
    const { shape, b, h, t } = m,
      scale = Math.min(350 / b, 145 / h),
      left = 100,
      bottom = 195,
      top = bottom - h * scale,
      right = left + b * scale,
      offset = shape === "triangle" ? (b * scale) / 3 : 45;
    const points =
      shape === "triangle"
        ? `${left},${bottom} ${right},${bottom} ${left + offset},${top}`
        : shape === "trapezoid"
          ? `${left},${bottom} ${right},${bottom} ${left + ((b + t) * scale) / 2},${top} ${left + ((b - t) * scale) / 2},${top}`
          : `${left},${bottom} ${right},${bottom} ${right + offset},${top} ${left + offset},${top}`;
    const foot = shape === "trapezoid" ? left + ((b - t) * scale) / 2 : left + offset;
    let body =
      `<polygon points="${points}" class="flm-fill"/>` +
      line(foot, top, foot, bottom, "flm-dashed") +
      `<path d="M${foot} ${bottom - 12}h12v12"/>` +
      text(foot + 12, (top + bottom) / 2, `h = ${h}`) +
      text((left + right) / 2, 224, `base = ${b} cm`, 'text-anchor="middle"');
    if (shape === "trapezoid")
      body += text(left + (b * scale) / 2, top - 15, `top base = ${t} cm`, 'text-anchor="middle"');
    const description = `${shape}: base ${b} cm, perpendicular height ${h} cm${shape === "trapezoid" ? `, other parallel base ${t} cm` : ""}. A right-angle mark identifies the height. Diagram dimensions are proportional.`;
    return { html: svg(body, description), description };
  }
  function composite(m) {
    const { w, h, cw, ch } = m,
      s = Math.min(430 / w, 160 / h),
      x = 70,
      y = 40;
    const body =
      `<path d="M${x} ${y}H${x + (w - cw) * s}V${y + ch * s}H${x + w * s}V${y + h * s}H${x}Z" class="flm-fill"/>` +
      rect(x + (w - cw) * s, y, cw * s, ch * s, "flm-cutout") +
      text(x + (w * s) / 2, y + h * s + 30, `${w} cm outer width`, 'text-anchor="middle"') +
      text(x + w * s + 12, y + (h * s) / 2, `${h} cm`) +
      text(x + (w - cw / 2) * s, y - 12, `${cw} cm`, 'text-anchor="middle"') +
      text(x + (w - cw) * s - 10, y + (ch * s) / 2, `${ch} cm`, 'text-anchor="end"');
    const description = `L-shaped region: an outer ${w} by ${h} cm rectangle with a ${cw} by ${ch} cm upper-right corner removed. The removed region has a dashed outline.`;
    return { html: svg(body, description, 280), description };
  }
  function prism(m) {
    const { l, w, h } = m,
      s = Math.min(300 / l, 100 / h, 90 / w),
      x = 100,
      y = 180,
      dx = w * s * 0.65,
      dy = -w * s * 0.55;
    const body =
      `<polygon points="${x},${y} ${x + l * s},${y} ${x + l * s},${y - h * s} ${x},${y - h * s}" class="flm-fill"/><polygon points="${x},${y - h * s} ${x + dx},${y - h * s + dy} ${x + l * s + dx},${y - h * s + dy} ${x + l * s},${y - h * s}" class="flm-empty"/><polygon points="${x + l * s},${y} ${x + l * s + dx},${y + dy} ${x + l * s + dx},${y - h * s + dy} ${x + l * s},${y - h * s}" class="flm-gold"/>` +
      text(x + (l * s) / 2, y + 30, `length ${l} cm`, 'text-anchor="middle"') +
      text(x + l * s + dx + 12, y - (h * s) / 2, `h = ${h}`) +
      text(x + l * s + dx / 2, y + dy + 28, `w = ${w}`);
    const description = `Rectangular prism: length ${l} cm, width ${w} cm, height ${h} cm. Perspective sketch; use labels for measurements.`;
    return { html: svg(body, description), description };
  }
  function net(m) {
    const { l, w, h } = m,
      s = Math.min(480 / (2 * l + 2 * w), 210 / (h + 2 * w)),
      x = 60;
    let body = "";

      [0, w, w, h, "wh"],
      [w, w, l, h, "lh"],
      [w + l, w, w, h, "wh"],
      [2 * w + l, w, l, h, "lh"],
      [w, 0, l, w, "lw"],
      [w, w + h, l, w, "lw"],
    ].forEach(([rx, ry, rw, rh, label]) => {
      body +=
        rect(x + rx * s, 45 + ry * s, rw * s, rh * s, label === "lw" ? "flm-gold" : "flm-fill") +
        text(x + (rx + rw / 2) * s, 45 + (ry + rh / 2) * s + 5, label, 'text-anchor="middle"');
    });
    body += text(300, 295, `l = ${l} cm; w = ${w} cm; h = ${h} cm`, 'text-anchor="middle"');
    const description = `A foldable cross net of a ${l} by ${w} by ${h} cm rectangular prism. Four rectangles form a belt, and the two length-by-width faces attach above and below the length-by-height face. Two faces each: lw, lh, wh. Diagram uses proportional dimensions.`;
    return { html: svg(body, description, 325), description };
  }
  function pyramid(m) {
    const { b, s } = m,
      k = Math.min(200 / (b + 2 * s), 70 / b),
      left = 300 - (b * k) / 2,
      top = 135 - (b * k) / 2,
      right = left + b * k,
      bottom = top + b * k;
    const body =
      rect(left, top, b * k, b * k, "flm-gold") +
      `<polygon points="${left},${top} ${right},${top} 300,${top - s * k}" class="flm-fill"/><polygon points="${right},${top} ${right},${bottom} ${right + s * k},135" class="flm-fill"/><polygon points="${left},${bottom} ${right},${bottom} 300,${bottom + s * k}" class="flm-fill"/><polygon points="${left},${top} ${left},${bottom} ${left - s * k},135" class="flm-fill"/>` +
      line(300, top - s * k, 300, top, "flm-dashed") +
      `<path d="M300 ${top - 9}h9v9"/>` +
      text(300, 140, `${b} × ${b}`, 'text-anchor="middle"') +
      text(310, top - (s * k) / 2, `s = ${s}`) +
      text(300, 273, `Base side ${b} cm; face slant height ${s} cm`, 'text-anchor="middle"');
    const description = `Square-pyramid net with one ${b} by ${b} cm base and four triangles. Each triangle has base ${b} cm and perpendicular face slant height ${s} cm. The dashed height belongs to a triangular face, not the vertical height of the solid.`;
    return { html: svg(body, description, 300), description };
  }
  function coordinates(m) {
    const xMax = m.xMax,
      yMax = m.yMax,
      xMin = m.signed ? -xMax : 0,
      yMin = m.signed ? -yMax : 0,
      px = (x) => 70 + ((x - xMin) / (xMax - xMin)) * 430,
      py = (y) => 205 - ((y - yMin) / (yMax - yMin)) * 155;
    const sx = m.signed ? 2 : Math.max(1, Math.ceil(xMax / 6)),
      sy = m.signed ? 2 : Math.max(1, Math.ceil(yMax / 5));
    let body = "";
    for (let x = xMin; x <= xMax; x += sx)
      body += line(px(x), 50, px(x), 205, "flm-grid") + text(px(x), 228, x, 'text-anchor="middle"');
    for (let y = yMin; y <= yMax; y += sy)
      body += line(70, py(y), 500, py(y), "flm-grid") + text(55, py(y) + 5, y, 'text-anchor="end"');
    body +=
      line(70, py(0), 500, py(0)) +
      line(px(0), 50, px(0), 205) +
      text(300, 275, m.xLabel, 'text-anchor="middle"') +
      text(70, 24, m.yLabel);
    if (m.polygon)
      body += `<polygon points="${m.points.map(([x, y]) => `${px(x)},${py(y)}`).join(" ")}" class="flm-fill"/>`;
    m.points.forEach(
      ([x, y], i) =>
        (body +=
          `<circle cx="${px(x)}" cy="${py(y)}" r="6" class="flm-dot"/>` +
          text(px(x) + 9, py(y) + (i % 2 ? -12 : 22), `(${x}, ${y})`)),
    );
    const description = `Coordinate plane: horizontal ${m.xLabel} from ${xMin} to ${xMax}; vertical ${m.yLabel} from ${yMin} to ${yMax}. Marked points ${m.points.map((p) => `(${p.join(", ")})`).join("; ")}${m.polygon ? ", connected in order to form a polygon" : ""}. Horizontal labeled intervals ${sx}; vertical labeled intervals ${sy}.`;
    return { html: svg(body, description, 300), description };
  }
  function inequality(m) {
    const lo = m.b - 4,
      hi = m.b + 4,
      px = (n) => 70 + ((n - lo) / 8) * 460,
      right = [">", "≥"].includes(m.symbol),
      closed = ["≤", "≥"].includes(m.symbol);
    let body = line(70, 125, 530, 125);
    for (let n = lo; n <= hi; n++)
      body += line(px(n), 120, px(n), 132) + text(px(n), 162, n, 'text-anchor="middle"');
    body +=
      line(300, 125, right ? 530 : 70, 125, "flm-solution") +
      `<path d="${right ? "M515 116l15 9-15 9" : "M85 116l-15 9 15 9"}" class="flm-solution"/><circle cx="300" cy="125" r="9" class="${closed ? "flm-dot" : "flm-empty"}"/>` +
      text(300, 60, `x ${m.symbol} ${m.b}`, 'text-anchor="middle"');
    const description = `Number line for x ${m.symbol} ${m.b}. ${closed ? "Closed" : "Open"} endpoint at ${m.b}; arrow ${right ? "right toward greater" : "left toward smaller"} values. The endpoint is ${closed ? "included" : "excluded"}.`;
    return { html: svg(body, description, 210), description };
  }

    numberline,
    data: dataset,
    histogram,
    box,
    ratio,
    fraction,
    percent,
    division,
    area,
    composite,
    prism,
    net,
    pyramid,
    coordinates,
    inequality,
    fractionDivision: (m) => {
      const gcd = (a, b) => (b ? gcd(b, a % b) : a);
      const denominator = (m.b * m.d) / gcd(m.b, m.d);
      const f = fraction({ n: (m.a * denominator) / m.b, d: denominator });
      const group = fraction({ n: (m.c * denominator) / m.d, d: denominator });
      return {
        ...f,
        html: `<p class="flm-division-label"><strong>Total amount: ${m.a}/${m.b}</strong></p>${f.html}<p class="flm-division-label"><strong>One group: ${m.c}/${m.d}</strong></p>${group.html}`,
        description: `Total ${m.a}/${m.b}; each group has size ${m.c}/${m.d}. ${f.description}`,
      };
    },
    expression: (m) => {
      const description = m.expression || m.tokens.join(` ${m.operator} `);
      return {
        html: `<div class="flm-expression">${esc(description)}</div>${m.tokens ? `<div class="flm-tokens">${m.tokens.map((t) => `<span>${esc(t)}</span>`).join("")}</div>` : ""}`,
        description: `Expression model: ${description}. Adjacent number and variable mean multiplication. The symbol ^ indicates an exponent.`,
      };
    },
    balance: (m) => ({
      html: svg(
        rect(65, 60, 180, 65, "flm-fill") +
          text(155, 100, m.left, 'text-anchor="middle"') +
          text(300, 102, "=", 'text-anchor="middle"') +
          rect(355, 60, 180, 65, "flm-gold") +
          text(445, 100, m.right, 'text-anchor="middle"') +
          line(65, 145, 535, 145) +
          `<path d="M300 145l-24 34h48Z"/>`,
        `Equality: ${m.left} = ${m.right}. Both sides must retain equal values.`,
      ),
      description: `Equality: ${m.left} = ${m.right}. Apply the same operation to both sides to keep the equation balanced.`,
    }),
    table: (m) => ({
      html: `<table><caption>Quantities in this problem</caption><thead><tr>${m.headers.map((h) => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead><tbody>${m.rows.map((r) => `<tr>${r.map((v, i) => (i ? `<td>${esc(v)}</td>` : `<th scope="row">${esc(v)}</th>`)).join("")}</tr>`).join("")}</tbody></table>`,
      description: `${m.headers.join("; ")}. Rows: ${m.rows.map((r) => r.join(", ")).join("; ")}. A question mark marks an unknown.`,
    }),
  };
  function render(model, caption = "Read the model") {
    const make = builders[model?.kind];
    if (!make) throw new Error(`Unsupported fluency model: ${model?.kind}`);
    const result = make(model);
    return `<figure class="flm-model"><figcaption>${esc(caption)}</figcaption><div class="flm-graphic">${result.html}</div><p class="flm-description">${esc(result.description)}</p></figure>`;
  }
  return { render, kinds: Object.keys(builders) };
})();
</script>
<script id="fluency-studio">/* Grade 6 Fluency Studio. Self-contained; no network or external dependencies. */
window.FluencyStudio = (() => {
  "use strict";
  const DATA = window.FluencyData;
  const e = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );
  const plain = (s) =>
    String(s ?? "")
      .replace(/<br\s*\/?>/gi, " ")
      .replace(/<\/?(?:b|strong|em|i|span|sup|sub)\b[^>]*>/gi, "")
      .replace(/&lt;/g, "<")
      .replace(/&gt;/g, ">")
      .replace(/&amp;/g, "&");
  const lessons = DATA.units.flatMap((u) => u.lessons.map((l) => ({ ...l, unitNumber: u.number })));
  const byId = Object.assign(
    Object.create(null),
    Object.fromEntries(lessons.map((l) => [l.id, l])),
  );
  const levels = Object.assign(Object.create(null), {
    workshop: "Lesson workshop · 8 tasks",
    foundation: "Build foundations · 4 tasks",
    core: "Connect & apply · 8 tasks",
    stretch: "Extend & explain · 4 tasks",
  });
  const modes = Object.assign(Object.create(null), {
    practice: "Focused practice",
    labs: "Math investigations",
    worksheet: "Worksheets",
    activity: "Partner activity",
    spine: "Core-skill drills",
  });
  const storageKey = "fluency.v4.practice";
  let lessonId = lessons[0].id,
    level = "foundation",
    mode = "practice",
    spineRank = 1;
  let isStudent =
    document.documentElement.dataset.student === "true" ||
    document.body.classList.contains("mode-student");
  if (isStudent) level = "workshop";
  const session = new Map();
  const storageLimit = 3500000;
  let storageAvailable = true,
    storageHeld = false,
    saveTimer = null,
    sketchCleanup = null;
  let storageMessage = "";
  const saveStatusText = () =>
    storageAvailable
      ? "Work saved in this browser tab."
      : storageMessage || "Saving is unavailable. Keep this page open or download your work.";
  const host = () => document.getElementById("view-studio");
  const button = (action, label, extra = "") =>
    `<button type="button" class="btn" data-studio="${action}" ${extra}>${label}</button>`;
  const currentKey = () => `${lessonId}-${level}`;
  function blankAnswer() {
    return {
      text: "",
      reasoning: "",
      ratioCells: {},
      ratioVersion: 0,
      reflection: "",
      attempts: 0,
      hints: 0,
      exposed: false,
      revealed: false,
      status: "unstarted",
      message: "",
      tone: "",
      confidence: "",
      strokes: [],
      scratchOpen: false,
    };
  }
  function restore() {
    try {
      const raw = sessionStorage.getItem(storageKey);
      if (!raw) return;
      if (raw.length > storageLimit) {
        storageHeld = true;
        storageAvailable = false;
        storageMessage =
          "The previous saved session is too large to restore. It has been kept unchanged. Download new work before leaving this page.";
        return;
      }
      const saved = JSON.parse(raw);
      if (saved.version !== 4 || !saved.sets || typeof saved.sets !== "object") return;
      for (const [key, set] of Object.entries(saved.sets).slice(0, 216)) {
        const parts = key.split("-"),
          tier = parts.pop(),
          id = parts.join("-");
        if (
          !byId[id] ||
          !levels[tier] ||
          !set ||
          typeof set !== "object" ||
          !Array.isArray(set.answers)
        )
          continue;
        const answers = set.answers.slice(0, 8).map((x) => {
          const a = blankAnswer();
          if (!x || typeof x !== "object") return a;
          for (const field of ["text", "reasoning", "reflection", "message"])
            a[field] = typeof x[field] === "string" ? x[field].slice(0, 1500) : "";
          if (x.ratioCells && typeof x.ratioCells === "object")
            for (const [cell, value] of Object.entries(x.ratioCells).slice(0, 24))
              if (/^\d-\d-\d$/.test(cell) && typeof value === "string")
                a.ratioCells[cell] = value.slice(0, 120);
          a.ratioVersion = x.ratioVersion === 1 ? 1 : 0;
          a.attempts = Number.isInteger(x.attempts) ? Math.max(0, Math.min(x.attempts, 10000)) : 0;
          a.hints = [0, 1, 2].includes(x.hints) ? x.hints : 0;
          for (const field of ["exposed", "revealed", "scratchOpen"]) a[field] = x[field] === true;
          a.status = ["unstarted", "draft", "retry", "checked", "supported", "reviewed"].includes(
            x.status,
          )
            ? x.status
            : "draft";
          a.tone = ["success", "retry", "review"].includes(x.tone) ? x.tone : "";
          a.confidence = ["ready", "practice", "help"].includes(x.confidence) ? x.confidence : "";
          if (Array.isArray(x.strokes))
            a.strokes = x.strokes
              .slice(-40)
              .filter((st) => st && ["pen", "eraser"].includes(st.tool) && Array.isArray(st.points))
              .map((st) => ({
                tool: st.tool,
                points: st.points
                  .slice(0, 200)
                  .filter(
                    (pt) =>
                      Array.isArray(pt) &&
                      pt.length === 2 &&
                      pt.every((n) => Number.isFinite(n) && n >= 0 && n <= 1),
                  ),
              }));
          return a;
        });
        session.set(key, {
          active: Number.isInteger(set.active)
            ? Math.max(0, Math.min(set.active, answers.length - 1))
            : 0,
          answers,
        });
      }
      if (byId[saved.lesson]) lessonId = saved.lesson;
      if (levels[saved.level]) level = saved.level;
      if (modes[saved.mode]) mode = saved.mode;
    } catch (_) {
      storageAvailable = false;

  /* -------------------------------------------------------- advanced math parser */

  // Strict value parsing. No eval, executable expressions, arbitrary unit suffixes,
  // or punctuation stripping: mathematical signs and operators retain their meaning.
  function parseMath(raw) {
    if (raw == null) return NaN;
    let s = String(raw).trim().replace(/[−–—]/g, "-");
    if (!s || s.length > 120) return NaN;
    const units =
      /\s+(?:miles?|meters?|metres?|centimeters?|centimetres?|kilometers?|kilometres?|feet|foot|inches|inch|yards?|hours?|hrs?|minutes?|seconds?|dollars?|cm|mm|km|m|ft|in|yd|mi)(?:[²³]|\^[23])?$/i;
    s = s.replace(units, "").trim();
    if (s.startsWith("$")) s = s.slice(1).trim();
    if (s.includes(",")) {
      if (!/^[+-]?\d{1,3}(?:,\d{3})+(?:\.\d+)?$/.test(s)) return NaN;
      s = s.replace(/,/g, "");
    }
    let m;
    if ((m = s.match(/^([+-]?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/))) {
      const den = Number(m[4]);
      return den > 0 && Number(m[3]) < den
        ? (m[1] === "-" ? -1 : 1) * (Number(m[2]) + Number(m[3]) / den)
        : NaN;
    }
    if ((m = s.match(/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/)))
      return Number(m[2]) ? Number(m[1]) / Number(m[2]) : NaN;
    if (
      (m = s.match(
        /^([+]?(?:\d+(?:\.\d+)?|\.\d+))\s*(?::|\s+to\s+)\s*([+]?(?:\d+(?:\.\d+)?|\.\d+))$/i,
      ))
    )
      return Number(m[2]) ? Number(m[1]) / Number(m[2]) : NaN;
    if (/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)\s*%$/.test(s))
      return Number(s.replace("%", "").trim()) / 100;
    if (/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)) {
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }
    return NaN;
  }
  const close = (a, b) =>
    Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(b));
  const normalize = (s) =>
    String(s).trim().toLowerCase().replace(/[−–—]/g, "-").replace(/\s+/g, " ");

  function sequence(raw) {
    const original = String(raw).trim();
    if (original.startsWith("(") !== original.endsWith(")")) return null;
    const s = original.replace(/^\(/, "").replace(/\)$/, "");
    const values = s.split(/\s*,\s*/).map(parseMath);
    return values.length > 1 && values.every(Number.isFinite) ? values : null;
  }

          .split(",")
          .map((value) => (/^\s*\d+\s*$/.test(value) ? Number(value) : NaN)),

  function flCheck() {

      attempt.feedback =
        "Enter your prediction first. A hint is available if you need a starting point.";
    else {
      const values =
        Array.isArray(challenge.answer) && flValuesOnly(answer) ? sequence(answer) : null;
      const valid = Array.isArray(challenge.answer)

        valid &&
        (Array.isArray(challenge.answer)
          ? values.every((v, i) => close(v, challenge.answer[i]))

        attempt.feedback = Array.isArray(challenge.answer)

  function initLabs() {

      const { attempt } = flCurrent();

      const { lab, state } = flCurrent(),
        model = flReadModel(event.target, lab.id),

          /* Models still work if history is unavailable. */
        }

        { lab, state, challenge, attempt } = flCurrent();

        attempt.reveal = !attempt.reveal;
        attempt.supported = true;
      } else if (action === "measure") {
        state.measured = !state.measured;

        state.model = flCopy(challenge.model);

  // Normalized vector strokes survive task changes, resizing and refresh.
  function initScratchpad() {
    const canvas = document.getElementById("fl-canvas");
    if (!canvas) return;
    const a = currentSet().answers[currentSet().active],
      ctx = canvas.getContext("2d");
    if (!ctx) return;
    let tool = "pen",
      current = null,
      pointer = null,
      width = 1,
      height = 240;
    function draw() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2),
        rect = canvas.getBoundingClientRect();
      width = rect.width || 600;
      height = rect.height || 240;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (const stroke of [...a.strokes, ...(current ? [current] : [])]) {
        if (!stroke.points.length) continue;
        ctx.globalCompositeOperation = stroke.tool === "eraser" ? "destination-out" : "source-over";
        ctx.strokeStyle = "#075e60";
        ctx.fillStyle = "#075e60";
        ctx.lineWidth = stroke.tool === "eraser" ? 22 : 3;
        ctx.beginPath();
        stroke.points.forEach((p, i) =>
          i ? ctx.lineTo(p[0] * width, p[1] * height) : ctx.moveTo(p[0] * width, p[1] * height),
        );
        if (stroke.points.length === 1) {
          const p = stroke.points[0];
          ctx.arc(p[0] * width, p[1] * height, stroke.tool === "eraser" ? 11 : 1.5, 0, Math.PI * 2);
          ctx.fill();
        } else ctx.stroke();
      }
    }
    const coords = (event) => {
      const r = canvas.getBoundingClientRect();
      return [
        Math.max(0, Math.min(1, (event.clientX - r.left) / r.width)),
        Math.max(0, Math.min(1, (event.clientY - r.top) / r.height)),
      ];
    };
    canvas.onpointerdown = (event) => {
      if (event.button !== 0 || pointer !== null) return;
      event.preventDefault();
      pointer = event.pointerId;
      canvas.setPointerCapture(pointer);
      current = { tool, points: [coords(event)] };
      draw();
    };
    canvas.onpointermove = (event) => {
      if (event.pointerId !== pointer || !current) return;
      if (current.points.length >= 200)
        current.points = current.points.filter((_, i) => i % 2 === 0);
      current.points.push(coords(event));
      draw();
    };
    const finish = () => {
      if (current) {
        if (a.strokes.length >= 40) a.strokes.shift();
        a.strokes.push(current);
        current = null;
        saveSoon();
      }
      pointer = null;
      draw();
    };
    canvas.onpointerup = finish;
    canvas.onpointercancel = finish;
    canvas.onlostpointercapture = () => {
      if (current) finish();
    };
    const observer = new ResizeObserver(draw);
    observer.observe(canvas);
    draw();
    const tools = canvas.closest(".fl-sketch").querySelector(".fl-sketch-tools");
    tools.onclick = (event) => {
      const action = event.target.closest("[data-studio]")?.dataset.studio;
      if (action === "pen" || action === "eraser") {
        tool = action;
        tools
          .querySelectorAll("[aria-pressed]")
          .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.studio === tool)));
      }
      if (action === "undo") {
        a.strokes.pop();
        draw();
        saveSoon();
      }
      if (action === "clear-sketch") {
        a.strokes = [];
        draw();
        saveSoon();
      }
    };
    sketchCleanup = () => {
      if (current) finish();
      observer.disconnect();
    };
  }

          : event.target.dataset.ratioCell
            ? "ratioCells"
            : fields[event.target.id];
    if (!field) return;
    const a = currentSet().answers[currentSet().active];
    if (field === "ratioCells") {
      a.ratioCells[event.target.dataset.ratioCell] = event.target.value.slice(0, 120);
      a.ratioVersion = 0;
    } else a[field] = event.target.value.slice(0, 1500);
    if (
      field === "text" ||
      field === "ratioCells" ||
      (field === "reflection" && a.status === "reviewed")
    ) {
      a.status = a.text.trim() ? "draft" : "unstarted";
      a.message = "";
      a.tone = "";
      document.getElementById("fl-response")?.removeAttribute("aria-invalid");
      const fb = document.getElementById("fl-feedback");
      if (fb) {
        fb.textContent = "";
        fb.className = "fl-feedback";
      }
      const progress = document.getElementById("fl-progress-area");
      if (progress) progress.innerHTML = progressMarkup(currentSet());
      const badge = host().querySelector(".fl-task-meta .fl-status");
      if (badge) {
        badge.textContent = statusLabel[a.status];
        badge.className = `fl-status fl-status-${a.status}`;
      }
      const current = host().querySelector('[aria-current="step"] small');
      if (current) current.textContent = statusLabel[a.status];
    }
    const status = document.getElementById("fl-save-status");
    if (status) status.textContent = "Saving work in this tab…";
    saveSoon();
  });
  document.addEventListener("change", (event) => {
    const t = event.target;
    if (t.id === "studio-lesson" && byId[t.value]) {
      lessonId = t.value;
      update("studio-lesson");
    } else if (t.id === "studio-level" && levels[t.value]) {
      level = t.value;
      update("studio-level");
    } else if (t.id === "studio-drill") {
      spineRank = Number(t.value);
      update("studio-drill");
    } else if (mode === "practice" && t.name === "confidence" && host()?.contains(t)) {
      currentSet().answers[currentSet().active].confidence = t.value;
      save();
    }
  });
  document.addEventListener("submit", (event) => {
    if (
      mode !== "practice" ||
      event.target.closest("#fluency-labs") ||
      event.target.id !== "fl-answer-form"
    )
      return;
    event.preventDefault();
    const set = currentSet(),
      i = set.active,
      a = set.answers[i],
      p = problems(byId[lessonId])[i];
    if (!a.text.trim()) {
      a.message = "Enter your answer or an initial idea first. A hint can help you start.";
      a.tone = "retry";
      renderTask("fl-response");
      return;
    }
    const invalid = checkRatioTables(p, a);
    if (invalid) {
      renderTask(invalid);
      return;
    }
    const result = checkAnswerMatch(a.text, p.answer, p);
    a.attempts++;
    if (result.review) {
      a.exposed = true;
      a.revealed = true;
      a.message = result.message;
      a.tone = "review";
      a.status = "draft";
      renderTask("fl-reflection");
      return;
    }
    a.message = result.message;
    if (result.match) {
      a.status =
        a.status === "checked"
          ? "checked"
          : a.hints > 0 || a.exposed || p.guidance?.length
            ? "supported"
            : "checked";
      a.tone = "success";
    } else {
      a.status = "retry";
      a.tone = "retry";
      if (!result.form && !result.invalid) {
        const cue = findMisconception(a.text, p);
        if (cue) a.message += " " + cue.do;
      }
    }
    renderTask("fl-feedback");
  });
  window.addEventListener("pagehide", save);
  window.addEventListener("afterprint", () => {
    document.body.classList.remove("print-studio");
    const target = document.getElementById("studio-print");
    if (target) target.innerHTML = "";
  });

  // Projector-compatible renderers use the same constraints as the student models.
  function fractionInfo(num, den) {
    const n = Number(num),
      d = Number(den);
    if (
      String(num).trim() === "" ||
      String(den).trim() === "" ||
      !Number.isInteger(n) ||
      !Number.isInteger(d) ||
      d < 1 ||
      d > 16 ||
      n < 0 ||
      n > 4 * d
    )
      return null;
    const value = n / d,
      decimal = Number(value.toFixed(4)),
      percent = Number((value * 100).toFixed(2));
    return {
      n,
      d,
      value,
      decimal,
      percent,
      decimalApprox: !close(decimal, value),
      percentApprox: !close(percent, value * 100),
    };
  }
  function renderFractionStrip(container, num, den) {
    if (!container) return;
    const f = fractionInfo(num, den);
    if (!f) {
      container.innerHTML =
        '<p role="status">Use a whole-number denominator from 1 to 16 and a numerator from 0 to four times the denominator.</p>';
      return;
    }
    container.innerHTML = `<p><strong>${f.n}/${f.d}</strong> ${f.decimalApprox ? "≈" : "="} ${f.decimal} ${f.percentApprox ? "≈" : "="} ${f.percent}%</p>${Array.from({ length: Math.max(1, Math.ceil(f.n / f.d)) }, (_, w) => `<div class="fl-fraction-strip" role="img" aria-label="Whole ${w + 1}: ${Math.max(0, Math.min(f.d, f.n - w * f.d))} of ${f.d} parts shaded">${Array.from({ length: f.d }, (_, i) => `<span class="${w * f.d + i < f.n ? "filled" : ""}">${f.d <= 8 ? "1/" + f.d : ""}</span>`).join("")}</div>`).join("")}`;
  }
  function renderRatioTable(container, a, b) {
    if (!container) return;
    const x = Number(a),
      y = Number(b);
    if (
      String(a).trim() === "" ||
      String(b).trim() === "" ||
      !Number.isFinite(x) ||
      !Number.isFinite(y) ||
      x <= 0 ||
      y < 0 ||
      x > 10000 ||
      y > 10000
    ) {
      container.innerHTML =
        '<p role="status">Enter quantity A greater than 0 and quantity B at least 0; each must be no more than 10,000.</p>';
      return;
    }
    const fmt = (n) => Number(n.toFixed(4));
    const rate = y / x;
    container.innerHTML = `<div class="fl-table-scroll"><table class="ratio-table-display"><caption>Equivalent ratios: scale both quantities by the same factor</caption><thead><tr><th scope="col">Factor</th>${[0, 1, 2, 3, 4, 5].map((n) => `<th scope="col">×${n}</th>`).join("")}</tr></thead><tbody><tr><th scope="row">A</th>${[0, 1, 2, 3, 4, 5].map((n) => `<td>${fmt(n * x)}</td>`).join("")}</tr><tr><th scope="row">B</th>${[0, 1, 2, 3, 4, 5].map((n) => `<td>${fmt(n * y)}</td>`).join("")}</tr></tbody></table></div><p>B per 1 A: ${close(fmt(rate), rate) ? "" : "approximately "}${fmt(rate)}.</p>`;
  }
  function renderCoordinatePlaneSVG(container, ptX = null, ptY = null) {
    if (!container) return;
    const hasPoint = ptX !== null && ptY !== null,
      x = Number(ptX),
      y = Number(ptY);
    if (
      hasPoint &&
      (String(ptX).trim() === "" ||
        String(ptY).trim() === "" ||
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        Math.abs(x) > 8 ||
        Math.abs(y) > 8)
    ) {
      container.innerHTML = '<p role="status">Enter x and y between −8 and 8.</p>';
      return;
    }
    let grid = "";
    for (let i = -8; i <= 8; i++) {
      const pos = 180 + i * 18;
      grid += `<path d="M${pos} 36V324 M36 ${pos}H324" stroke="${i === 0 ? "#152c40" : "#c5d4da"}" stroke-width="${i === 0 ? 2 : 1}"/>`;
      if (i && i % 2 === 0)
        grid += `<text x="${pos}" y="197" text-anchor="middle">${i}</text><text x="166" y="${180 - i * 18 + 4}" text-anchor="end">${i}</text>`;
    }
    container.innerHTML = `<svg viewBox="0 0 360 360" style="max-width:100%;width:360px;background:white;font:12px system-ui;fill:#152c40" role="img" aria-label="Coordinate plane from negative 8 to 8${hasPoint ? `, point at (${x}, ${y})` : ""}">${grid}<text x="337" y="184">x</text><text x="176" y="22">y</text>${hasPoint ? `<circle cx="${180 + x * 18}" cy="${180 - y * 18}" r="6" fill="#075e60"/><text x="180" y="346" text-anchor="middle">(${x}, ${y})</text>` : ""}</svg>`;
  }
  restore();
  route();
  return {
    render() {
      route();
      render();
    },
    hash,
    open(id) {
      if (byId[id]) lessonId = id;
      mode = "practice";
      history.replaceState(null, "", hash());
    },
    setStudentMode(value) {
      isStudent = Boolean(value);
      route();
      if (isStudent && !["practice", "labs"].includes(mode)) mode = "practice";
      update();
    },
    isStudent: () => isStudent,
    print() {
      printMarkup(currentSheet(false));
    },
    printKey() {
      if (!isStudent) printMarkup(currentSheet(true));
    },
    printWorksheet(id, key = false, tier = null) {
      const previous = level;
      if (tier && levels[tier]) level = tier;
      const markup = worksheet(byId[id] || byId[lessonId], key);
      level = previous;
      printMarkup(markup);
    },
    printUnitPack(unitNum, key = false) {
      printMarkup(
        lessons
          .filter((l) => l.unitNumber === Number(unitNum))
          .map((l) => worksheet(l, key))
          .join(""),
      );
    },
    printDrill(rank, key = false) {
      const drill = DATA.spine.find((s) => s.rank === Number(rank)) || DATA.spine[0];
      if (drill) printMarkup(drillSheet(drill, key));
    },
    printAllDrills(key = false) {
      printMarkup(DATA.spine.map((s) => drillSheet(s, key)).join(""));
    },
    printActivity(id, key = false) {
      printMarkup(activity(byId[id] || byId[lessonId], key));
    },
    parseNumber: parseMath,
    checkAnswerMatch,
    findMisconception,
    renderFractionStrip,
    renderRatioTable,
    renderCoordinatePlaneSVG,
    initStudentWorkbench() {
      if (mode === "labs") initLabs();
    },
    audit() {
      return {
        lessons: lessons.length,
        workshopTasks: lessons.reduce((n, l) => n + l.workshop.tasks.length, 0),
        foundationTasks: lessons.reduce((n, l) => n + l.practice.length, 0),
        automatic: lessons.flatMap((l) => l.practice).filter((p) => answerKind(p) !== "review")
          .length,
        version: 4,
      };
    },
  };
})();
</script>
<script>
  // Theme management for student edition
  const themeBtn = document.getElementById('themeBtn');
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    if (themeBtn) {
      themeBtn.querySelector('.label').textContent = t === 'dark' ? 'Light' : 'Dark';
      themeBtn.setAttribute('aria-pressed', String(t === 'dark'));
    }
    try { localStorage.setItem('rmg6.theme.v3', JSON.stringify(t)); } catch(_) {}
  }
  let savedTheme = 'light';
  try { savedTheme = JSON.parse(localStorage.getItem('rmg6.theme.v3')) || 'light'; } catch(_) {}
  setTheme(savedTheme);
  if (themeBtn) {
    themeBtn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(cur === 'dark' ? 'light' : 'dark');
    });
  }

  FluencyStudio.render();
  window.addEventListener('hashchange', () => FluencyStudio.render());
</script>
