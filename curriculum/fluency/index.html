t forms","def":"Different ways to write the same number."},{"term":"common form","def":"The one form — all decimals or all percents — you convert to before comparing."}],"frame":"___ is greater than ___ because written as percents they are ___ and ___ ."},{"id":"4-3","title":"Estimate the Percent of a Number","standard":{"code":"6.RP.A.3.c","text":"Estimate the percent of a number using benchmark percents."},"skills":[{"text":"Find 10% of a number by shifting the decimal one place left","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Find 1% of a number by shifting two places left","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Halve and double a number mentally","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Round to a compatible number that is easy to take a percent of","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Find 10% of 350.","answer":"35","explanation":"Ten percent is one tenth; 350 ÷ 10 = 35.","mode":"number"},{"skill":2,"prompt":"Find 1% of 800.","answer":"8","explanation":"One percent is one hundredth; 800 ÷ 100 = 8.","mode":"number"},{"skill":3,"prompt":"Find half of 86.","answer":"43","explanation":"Halve 80 and 6 separately: 40 + 3 = 43.","mode":"number"},{"skill":4,"prompt":"Estimate 25% of 198 by using 200 as a compatible number.","answer":"50","explanation":"25% is one fourth; 200 ÷ 4 = 50.","mode":"number"}],"quick_check":"10% of 320? 1% of 320? Half of 32?","solution":"10% of 320 = 32 (shift decimal 1 place left).<br>1% of 320 = 3.2 (shift decimal 2 places left).<br>Half of 32 = 16 (which represents 5% of 320).","variants":[{"form":"B","prompt":"10% of 480? 1% of 480? Half of 48?","answer":"10% of 480 = 48. 1% of 480 = 4.8. Half of 48 = 24, which is 5% of 480."},{"form":"C","prompt":"10% of 250? 1% of 250? Half of 25?","answer":"10% of 250 = 25. 1% of 250 = 2.5. Half of 25 = 12.5, which is 5% of 250."}],"extension":{"prompt":"Estimate a 15% tip on a $42.80 bill using benchmarks.","answer":"Round to $42. 10% ≈ $4.20, 5% ≈ $2.10, so 15% ≈ $6.30."},"vocabulary":[{"term":"benchmark percent","def":"An easy percent — 1%, 10%, 25%, 50% — used to build others."},{"term":"compatible number","def":"A nearby number that is easy to take a percent of."},{"term":"estimate","def":"A close-enough answer found quickly, on purpose."}],"frame":"___% of ___ is about ___ because 10% is ___ and I needed ___ of those."},{"id":"4-4","title":"Find and Compare with Percentages","standard":{"code":"6.RP.A.3.c","text":"Find a percent of a quantity as a rate per 100."},"skills":[{"text":"Write a percent as a decimal","source":"4-2","is_elementary":false,"is_prior_g6":true},{"text":"Multiply a whole number by a decimal","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Multiply a whole number by a fraction","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Compare two products to decide which is larger","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Write 18% as a decimal.","answer":"0.18","explanation":"Percent means per hundred; 18 ÷ 100 = 0.18.","mode":"number"},{"skill":2,"prompt":"Compute 60 × 0.35.","answer":"21","explanation":"60 × 35 ÷ 100 = 2100 ÷ 100 = 21.","mode":"number"},{"skill":3,"prompt":"Find 3/4 of 28.","answer":"21","explanation":"Divide 28 by 4, then multiply by 3: 7 × 3 = 21.","mode":"number"},{"skill":4,"prompt":"Which is greater: 20% of 90 or 30% of 70?","answer":"30% of 70","explanation":"The products are 18 and 21; 21 is greater.","mode":"review"}],"quick_check":"0.25 × 80? 3/4 of 80? Which is more: 20% of 50 or 30% of 40?","solution":"0.25 × 80 = 20.<br>3/4 of 80 = 60.<br><strong>Comparison:</strong> 20% of 50 = 10; 30% of 40 = 12.<br>30% of 40 is more (12 > 10).","variants":[{"form":"B","prompt":"0.4 × 90? 2/5 of 90? Which is more: 30% of 60 or 25% of 80?","answer":"0.4 × 90 = 36. 2/5 of 90 = 36. 30% of 60 = 18; 25% of 80 = 20. So 25% of 80 is more."},{"form":"C","prompt":"0.6 × 50? 3/5 of 50? Which is more: 40% of 70 or 50% of 60?","answer":"0.6 × 50 = 30. 3/5 of 50 = 30. 40% of 70 = 28; 50% of 60 = 30. So 50% of 60 is more."}],"extension":{"prompt":"A $60 jacket is 30% off. What is the sale price?","answer":"Discount: 0.30 × 60 = $18. Sale price: 60 − 18 = $42 (or 70% of 60 = $42)."},"vocabulary":[{"term":"percent of a number","def":"The part you get when a percent is applied to a whole."},{"term":"of","def":"In percent problems, a signal to multiply."},{"term":"part","def":"The amount the percent describes."}],"frame":"___% of ___ is ___ because I multiplied the whole by ___ ."},{"id":"4-5","title":"Determine the Whole Given the Part and Percent","standard":{"code":"6.RP.A.3.c","text":"Solve problems involving finding the whole, given a part and the percent."},"skills":[{"text":"Divide a whole number by a decimal","source":"2-7","is_elementary":false,"is_prior_g6":true},{"text":"Tell which number is the part and which is the whole","source":"4-4","is_elementary":false,"is_prior_g6":true},{"text":"Divide by a benchmark fraction such as 1/4 or 1/2","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Check an answer by multiplying back","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 18 ÷ 0.3.","answer":"60","explanation":"Scale dividend and divisor by 10: 180 ÷ 3 = 60.","mode":"number"},{"skill":2,"prompt":"Twelve students out of a class of 30 walk to school. Identify the part and the whole.","answer":"Part 12; whole 30","explanation":"The part counts walkers; the whole counts everyone in the class.","mode":"review"},{"skill":3,"prompt":"Compute 9 ÷ 1/4.","answer":"36","explanation":"There are 4 fourths in each whole, so 9 × 4 = 36 fourths.","mode":"number"},{"skill":4,"prompt":"A student says the whole is 80 when 25% is 20. Check by finding 25% of 80.","answer":"20","explanation":"0.25 × 80 = 20, so the proposed whole checks.","mode":"number"}],"quick_check":"12 ÷ 0.25? 12 is 25% of what number? Now check: 25% of your answer.","solution":"12 ÷ 0.25 = 48.<br>The whole is 48 (12 is 25% of 48).<br><strong>Check:</strong> 25% of 48 = 0.25 × 48 = 12 (balances!).","variants":[{"form":"B","prompt":"15 ÷ 0.5? 15 is 50% of what number? Now check: 50% of your answer.","answer":"15 ÷ 0.5 = 30. The whole is 30. Check: 0.5 × 30 = 15. ✓"},{"form":"C","prompt":"9 ÷ 0.2? 9 is 20% of what number? Now check: 20% of your answer.","answer":"9 ÷ 0.2 = 45. The whole is 45. Check: 0.2 × 45 = 9. ✓"}],"extension":{"prompt":"A team won 18 games, which was 75% of the games played. How many games were played?","answer":"18 ÷ 0.75 = 24 games. Check: 0.75 × 24 = 18. ✓"},"vocabulary":[{"term":"the whole","def":"The full amount the percent is taken from — often the unknown."},{"term":"inverse operation","def":"The operation that undoes another; division undoes multiplication."},{"term":"check by substituting","def":"Putting your answer back into the problem to confirm it works."}],"frame":"The whole is ___ because ___ is ___% of it, and ___ ÷ ___ undoes the multiplication."}]},{"number":5,"title":"Area, Volume, and Surface Area","lessons":[{"id":"5-1","title":"Determine the Area of Parallelograms and Rhombuses","standard":{"code":"6.G.A.1","text":"Find the area of right triangles, other triangles, special quadrilaterals, and polygons."},"skills":[{"text":"Multiply two- and three-digit numbers","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Find the area of a rectangle by multiplying length by width","source":"Gr 3–4","is_elementary":true,"is_prior_g6":false},{"text":"Tell a base from a slanted side and identify the perpendicular height","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Label an area answer in square units","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 24 × 13.","answer":"312","explanation":"24 × 10 + 24 × 3 = 240 + 72.","mode":"number"},{"skill":2,"prompt":"A rectangle is 8 cm long and 6 cm wide. Find its area in square centimeters.","answer":"48","explanation":"Multiply length by width: 8 × 6 = 48.","mode":"number"},{"skill":3,"prompt":"A parallelogram has base 10 cm, slanted side 7 cm, and perpendicular height 4 cm. Which number is the height?","answer":"4","explanation":"Height meets the base at a right angle; the slanted side is not the height.","mode":"number"},{"skill":4,"prompt":"A rectangle measures 3 meters by 5 meters. State its area with units.","answer":"15 square meters","explanation":"3 × 5 = 15; area counts square units.","mode":"review"}],"quick_check":"Area of an 8 cm by 5 cm rectangle? In a parallelogram, is the height the slanted side?","solution":"Rectangle area = 8 cm × 5 cm = 40 cm².<br><strong>Height question:</strong> No! The height must be perpendicular to the base, never the slanted side.","variants":[{"form":"B","prompt":"Area of a 9 cm by 7 cm rectangle? In a parallelogram, is the height the slanted side?","answer":"9 × 7 = 63 cm². No — the height must meet the base at a right angle; the slanted side is longer than the height."},{"form":"C","prompt":"Area of a 12 m by 4 m rectangle? A parallelogram has base 12 m, slant side 5 m, height 4 m. What is its area?","answer":"Rectangle: 12 × 4 = 48 m². Parallelogram: 12 × 4 = 48 m² — use the height 4, not the slant 5."}],"extension":{"prompt":"Two parallelograms both have base 10 cm and height 6 cm but different slant sides. Compare their areas.","answer":"Both are 60 cm². The slant side does not affect area — only base and perpendicular height do."},"vocabulary":[{"term":"base","def":"The side of a figure you measure the height against."},{"term":"perpendicular height","def":"The straight-up distance from the base to the opposite side, meeting the base at a right angle."},{"term":"square units","def":"The label on every area answer, such as cm²."}],"frame":"The area is ___ square units because the base is ___ and the perpendicular height is ___ ."},{"id":"5-2","title":"Determine the Area of Triangles","standard":{"code":"6.G.A.1","text":"Find the area of right triangles and other triangles."},"skills":[{"text":"Multiply, then halve — or halve, then multiply","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Multiply a whole number by 1/2","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Find the area of a rectangle or parallelogram","source":"5-1","is_elementary":false,"is_prior_g6":true},{"text":"Identify the height drawn perpendicular to the chosen base","source":"5-1","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Compute (14 × 9) ÷ 2.","answer":"63","explanation":"Halve 14 first to get 7, then multiply 7 × 9.","mode":"number"},{"skill":2,"prompt":"Compute 1/2 × 38.","answer":"19","explanation":"Multiplying by one half is the same as dividing by 2.","mode":"number"},{"skill":3,"prompt":"A parallelogram has base 12 cm and height 5 cm. Find its area in square centimeters.","answer":"60","explanation":"Area is base × perpendicular height: 12 × 5.","mode":"number"},{"skill":4,"prompt":"A triangle has base 8 cm, perpendicular height 6 cm, and slanted side 10 cm. Which length belongs in the height part of its area formula?","answer":"6","explanation":"Use the length perpendicular to the chosen base.","mode":"number"}],"quick_check":"7 × 4, then half? Area of a triangle with base 7 m and height 4 m?","solution":"7 × 4 = 28, then half = 14.<br><strong>Triangle area:</strong> A = 1/2 × base × height = 1/2 × 7 m × 4 m = 14 m².","variants":[{"form":"B","prompt":"9 × 6, then half? Area of a triangle with base 9 cm and height 6 cm?","answer":"9 × 6 = 54, half is 27. Area = ½ × 9 × 6 = 27 cm²."},{"form":"C","prompt":"12 × 5, then half? Area of a triangle with base 12 in and height 5 in?","answer":"12 × 5 = 60, half is 30. Area = ½ × 12 × 5 = 30 in²."}],"extension":{"prompt":"A triangle has area 36 cm² and base 12 cm. What is its height?","answer":"36 = ½ × 12 × h, so 36 = 6h and h = 6 cm."},"vocabulary":[{"term":"triangle area formula","def":"A = ½ × base × height."},{"term":"half of a parallelogram","def":"Any triangle is exactly half of a parallelogram with the same base and height."},{"term":"missing measure","def":"An unknown base or height found by working the formula backward."}],"frame":"The triangle's area is ___ because ___ × ___ gives the whole parallelogram, and a triangle is half of it."},{"id":"5-3","title":"Determine the Area of Trapezoids","standard":{"code":"6.G.A.1","text":"Find the area of special quadrilaterals, including trapezoids, by composing and decomposing."},"skills":[{"text":"Add the two numbers inside parentheses before multiplying","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Multiply by 1/2","source":"5-2","is_elementary":false,"is_prior_g6":true},{"text":"Follow order of operations inside a formula","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Split a figure into a rectangle plus triangles","source":"5-2","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Compute (7 + 11) × 4.","answer":"72","explanation":"Add inside parentheses first: 18 × 4 = 72.","mode":"number"},{"skill":2,"prompt":"Compute 1/2 × 54.","answer":"27","explanation":"Half of 54 is 27.","mode":"number"},{"skill":3,"prompt":"Evaluate 1/2 × (6 + 10) × 5.","answer":"40","explanation":"First 6 + 10 = 16, then half of 16 is 8, then 8 × 5 = 40.","mode":"number"},{"skill":4,"prompt":"A shape is made of a rectangle of area 24 and two triangles of area 6 each, without overlap. Find the total area.","answer":"36","explanation":"Add the three nonoverlapping areas: 24 + 6 + 6.","mode":"number"}],"quick_check":"1/2 × (6 + 10) × 4 = ? Do the parentheses first.","solution":"Parentheses first: (6 + 10) = 16.<br>Area = 1/2 × 16 × 4 = 8 × 4 = 32 square units.","variants":[{"form":"B","prompt":"½ × (8 + 12) × 5 = ? Do the parentheses first.","answer":"(8 + 12) = 20. Then ½ × 20 × 5 = 10 × 5 = 50 square units."},{"form":"C","prompt":"½ × (7 + 9) × 6 = ? Do the parentheses first.","answer":"(7 + 9) = 16. Then ½ × 16 × 6 = 8 × 6 = 48 square units."}],"extension":{"prompt":"A trapezoid has bases 6 and 10 and area 48. What is its height?","answer":"48 = ½(6 + 10)h = 8h, so h = 6 units."},"vocabulary":[{"term":"trapezoid","def":"A quadrilateral with one pair of parallel sides."},{"term":"bases b₁ and b₂","def":"The two parallel sides of a trapezoid."},{"term":"decompose","def":"Break a figure into simpler shapes whose areas you can already find."}],"frame":"The area is ___ because I added the bases to get ___, halved it, then multiplied by the height ___ ."},{"id":"5-4","title":"Apply Area Concepts to Solve Problems","standard":{"code":"6.G.A.1","text":"Apply area techniques to solve real-world and mathematical problems, including composite figures."},"skills":[{"text":"Find the area of rectangles, triangles, and trapezoids on demand","source":"5-1, 5-2, 5-3","is_elementary":false,"is_prior_g6":true},{"text":"Add and subtract areas","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Find a missing side length from the other labeled sides","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Multiply one part's area by the number of identical parts","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Find the area of a triangle with base 10 cm and height 8 cm, in square centimeters.","answer":"40","explanation":"Half of 10 × 8 is 40.","mode":"number"},{"skill":2,"prompt":"A rectangle has area 72 square meters. A 15-square-meter section is removed. What area remains?","answer":"57","explanation":"Subtract the removed area: 72 − 15 = 57.","mode":"number"},{"skill":3,"prompt":"A total side length is 14 cm. One part is 9 cm. How long is the other part?","answer":"5","explanation":"Subtract known part from total: 14 − 9 = 5.","mode":"number"},{"skill":4,"prompt":"Six identical tiles each cover 12 square centimeters. What is the total area?","answer":"72","explanation":"Multiply area per tile by number of tiles: 12 × 6.","mode":"number"}],"quick_check":"A 10 by 6 rectangle has a 3 by 2 rectangle cut out. What area is left?","solution":"Large rectangle area: 10 × 6 = 60.<br>Cutout rectangle area: 3 × 2 = 6.<br>Area remaining: 60 − 6 = 54 square units.","variants":[{"form":"B","prompt":"A 12 by 8 rectangle has a 4 by 3 rectangle cut out. What area is left?","answer":"12 × 8 = 96. Cut-out: 4 × 3 = 12. Remaining: 96 − 12 = 84 square units."},{"form":"C","prompt":"A 9 by 9 square has a triangle of base 6 and height 4 cut out. What area is left?","answer":"Square: 81. Triangle: ½ × 6 × 4 = 12. Remaining: 81 − 12 = 69 square units."}],"extension":{"prompt":"A rectangular garden 15 m by 10 m has a 3 m by 3 m square shed inside. How much garden is left to plant?","answer":"150 − 9 = 141 m²."},"vocabulary":[{"term":"composite figure","def":"A shape built from two or more simpler shapes."},{"term":"additive area","def":"Total area found by adding the parts."},{"term":"subtractive area","def":"Total area found by removing a cut-out piece from a larger shape."}],"frame":"The area is ___ because I found ___ and ___, then ___ them."},{"id":"5-5","title":"Determine the Volume of Rectangular Prisms","standard":{"code":"6.G.A.2","text":"Find the volume of a right rectangular prism with fractional edge lengths."},"skills":[{"text":"Multiply three factors in any order","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Multiply fractions and mixed numbers","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Find the area of a rectangular base","source":"5-1","is_elementary":false,"is_prior_g6":true},{"text":"Label a volume answer in cubic units","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 4 × 7 × 5.","answer":"140","explanation":"Group 4 × 5 = 20, then 20 × 7 = 140.","mode":"number"},{"skill":2,"prompt":"Compute 1 1/2 × 2/3.","answer":"1","explanation":"Convert to 3/2, then multiply 3/2 × 2/3 = 6/6.","mode":"number"},{"skill":3,"prompt":"A rectangular base is 9 cm by 4 cm. Find its area in square centimeters.","answer":"36","explanation":"Multiply 9 × 4 = 36 square centimeters.","mode":"number"},{"skill":4,"prompt":"A prism measures 2 cm by 3 cm by 5 cm. State its volume with units.","answer":"30 cubic centimeters","explanation":"Multiply 2 × 3 × 5 = 30; volume counts cubic units.","mode":"review"}],"quick_check":"4 × 3 × 2? 1/2 × 1/3? Volume of a 4 by 3 by 2 prism?","solution":"4 × 3 × 2 = 24.<br>1/2 × 1/3 = 1/6.<br>Volume = 4 × 3 × 2 = 24 cubic units.","variants":[{"form":"B","prompt":"5 × 4 × 3? 1/2 × 1/4? Volume of a 5 by 4 by 3 prism?","answer":"5 × 4 × 3 = 60. 1/2 × 1/4 = 1/8. Volume = 60 cubic units."},{"form":"C","prompt":"6 × 2 × 4? 2/3 × 1/2? Volume of a 6 by 2 by 4 prism?","answer":"6 × 2 × 4 = 48. 2/3 × 1/2 = 2/6 = 1/3. Volume = 48 cubic units."}],"extension":{"prompt":"A box is 3 1/2 in by 2 in by 4 in. What is its volume?","answer":"3.5 × 2 = 7, and 7 × 4 = 28 in³."},"vocabulary":[{"term":"volume","def":"The amount of space a solid fills, measured in cubic units."},{"term":"cubic units","def":"The label on every volume answer, such as cm³."},{"term":"base area","def":"The area of the bottom face; volume = base area × height."}],"frame":"The volume is ___ cubic units because the base holds ___ cubes and there are ___ layers."},{"id":"5-6","title":"Represent Three-Dimensional Figures in Two Dimensions","standard":{"code":"6.G.A.4","text":"Represent three-dimensional figures using nets made up of rectangles and triangles."},"skills":[{"text":"Name the faces, edges, and vertices of a prism and a pyramid","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Count the faces of a solid","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Find the area of each rectangle and triangle inside a net","source":"5-1, 5-2","is_elementary":false,"is_prior_g6":true},{"text":"Match congruent faces in pairs","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"How many faces, edges, and vertices does a rectangular prism have?","answer":"6 faces, 12 edges, 8 vertices","explanation":"Count the six flat surfaces, twelve joining segments, and eight corners.","mode":"review"},{"skill":2,"prompt":"How many faces does a square pyramid have, including its base?","answer":"5","explanation":"One square base plus four triangular faces gives five faces.","mode":"number"},{"skill":3,"prompt":"A net has a rectangular face 3 cm by 7 cm. Find that face's area in square centimeters.","answer":"21","explanation":"Multiply 3 × 7; count this face once.","mode":"number"},{"skill":4,"prompt":"A prism has face pairs sized 3 by 4, 3 by 5, and 4 by 5. How many faces are 3 by 4?","answer":"2","explanation":"Each rectangular face has a congruent opposite face.","mode":"number"}],"quick_check":"How many faces does a rectangular prism have? How many matching pairs is that?","solution":"A rectangular prism has 6 faces.<br>That forms 3 matching pairs of congruent opposite faces (top/bottom, front/back, left/right).","variants":[{"form":"B","prompt":"How many faces does a triangular prism have? How many are triangles?","answer":"5 faces — 2 triangular bases and 3 rectangular sides."},{"form":"C","prompt":"How many faces does a square pyramid have? How many are triangles?","answer":"5 faces — 1 square base and 4 triangles."}],"extension":{"prompt":"A net has 2 triangles with base 6 and height 4, and 3 rectangles each 6 by 10. What solid is it, and what is its surface area?","answer":"A triangular prism. Triangles: 2 × 12 = 24. Rectangles: 3 × 60 = 180. Surface area = 204 square units."},"vocabulary":[{"term":"net","def":"A flat pattern that folds up into a solid."},{"term":"face","def":"One flat surface of a solid."},{"term":"congruent","def":"Identical in size and shape."}],"frame":"The solid has ___ faces, which form ___ matching pairs, because opposite faces are congruent."},{"id":"5-7","title":"Determine Surface Area of Prisms","standard":{"code":"6.G.A.4","text":"Use nets to find the surface area of three-dimensional figures."},"skills":[{"text":"Add a list of five or six areas","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Find the area of rectangles and triangles quickly","source":"5-1, 5-2","is_elementary":false,"is_prior_g6":true},{"text":"Read a net and pair up matching faces","source":"5-6","is_elementary":false,"is_prior_g6":true},{"text":"Double one face's area to cover a matching pair","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Add the face areas 12 + 12 + 15 + 15 + 20 + 20.","answer":"94","explanation":"Double each pair: 24 + 30 + 40 = 94.","mode":"number"},{"skill":2,"prompt":"Find the area of a triangle with base 6 cm and height 9 cm, in square centimeters.","answer":"27","explanation":"Half of 6 × 9 is 27.","mode":"number"},{"skill":3,"prompt":"In a rectangular prism with dimensions 2, 3, 5, list the three different face areas.","answer":"6, 10, 15","explanation":"Compute 2 × 3, 2 × 5, and 3 × 5; each appears twice.","mode":"review"},{"skill":4,"prompt":"One face has area 18 square centimeters. What is the combined area of it and its matching opposite face?","answer":"36","explanation":"Double the face area: 2 × 18.","mode":"number"}],"quick_check":"Faces measure 12, 12, 20, 20, 15, 15 square units — what is the surface area?","solution":"Surface Area = 12 + 12 + 20 + 20 + 15 + 15 = 24 + 40 + 30 = 94 square units.","variants":[{"form":"B","prompt":"Faces measure 18, 18, 24, 24, 30, 30 square units — what is the surface area?","answer":"36 + 48 + 60 = 144 square units."},{"form":"C","prompt":"A prism has faces 10, 10, 14, 14, 35, 35 square units — what is the surface area?","answer":"20 + 28 + 70 = 118 square units."}],"extension":{"prompt":"A cube has surface area 150 cm². What is the length of one edge?","answer":"Each of 6 faces is 150 ÷ 6 = 25 cm², so an edge is 5 cm."},"vocabulary":[{"term":"surface area","def":"The total area of every face of a solid."},{"term":"lateral faces","def":"The side faces of a prism, not counting the two bases."},{"term":"running total","def":"A sum kept as you go, one face at a time."}],"frame":"The surface area is ___ because there are ___ pairs of congruent faces measuring ___ ."},{"id":"5-8","title":"Determine Surface Area of Pyramids","standard":{"code":"6.G.A.4","text":"Use nets to find the surface area of pyramids."},"skills":[{"text":"Find the area of a triangle","source":"5-2","is_elementary":false,"is_prior_g6":true},{"text":"Find the area of a square or rectangular base","source":"5-1","is_elementary":false,"is_prior_g6":true},{"text":"Multiply one triangular face's area by the number of identical faces","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Tell slant height from vertical height on a net or drawing","source":"5-6","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Find the area of a triangle with base 8 cm and perpendicular height 7 cm, in square centimeters.","answer":"28","explanation":"Half of 8 × 7 = 56 is 28.","mode":"number"},{"skill":2,"prompt":"Find the area of a square base with side 6 cm, in square centimeters.","answer":"36","explanation":"A square has equal length and width: 6 × 6.","mode":"number"},{"skill":3,"prompt":"Four congruent triangular faces each have area 21 square centimeters. Find their combined area.","answer":"84","explanation":"Multiply one face area by four: 21 × 4.","mode":"number"},{"skill":4,"prompt":"A pyramid's vertical height is 9 cm. The altitude drawn within a triangular face is 10 cm. Which height finds that face's area?","answer":"10","explanation":"Use the altitude lying in the triangular face, called the slant height.","mode":"number"}],"quick_check":"One triangular face is 24 square inches. With four identical faces, what is the lateral area?","solution":"Lateral area = 4 × 24 = 96 square inches.","variants":[{"form":"B","prompt":"One triangular face is 30 square inches. With four identical faces, what is the lateral area?","answer":"4 × 30 = 120 in²."},{"form":"C","prompt":"One triangular face is 18 cm² and the square base is 36 cm². What is the total surface area of the 4-face pyramid?","answer":"Lateral: 4 × 18 = 72. Plus base: 72 + 36 = 108 cm²."}],"extension":{"prompt":"A square pyramid has base edge 10 cm and slant height 12 cm. Find the total surface area.","answer":"One triangle: ½ × 10 × 12 = 60. Four triangles: 240. Base: 10 × 10 = 100. Total: 340 cm²."},"vocabulary":[{"term":"pyramid","def":"A solid with one base and triangular faces meeting at a point."},{"term":"lateral area","def":"The area of the triangular side faces only, without the base."},{"term":"slant height","def":"The height of a triangular face, measured along the slanted surface — not the vertical height of the pyramid."}],"frame":"The lateral area is ___ because there are ___ identical triangles, each measuring ___ ."}]},{"number":6,"title":"Expressions","lessons":[{"id":"6-1","title":"Division Expressions with Fractions and Whole Numbers","standard":{"code":"6.NS.A.1","text":"Interpret and compute quotients of fractions to solve problems involving division of fractions by fractions."},"skills":[{"text":"Divide decimals and whole numbers","source":"2-7","is_elementary":false,"is_prior_g6":true},{"text":"Name the reciprocal of a whole number and of a unit fraction","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Multiply a whole number by a fraction","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Read a fraction bar as “divided by”","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 8.4 ÷ 4.","answer":"2.1","explanation":"84 tenths divided by 4 is 21 tenths.","mode":"number"},{"skill":2,"prompt":"What is the reciprocal of 5?","answer":"1/5","explanation":"Write 5 as 5/1, then exchange numerator and denominator.","mode":"number"},{"skill":3,"prompt":"Compute 12 × 2/3.","answer":"8","explanation":"Divide 12 by 3, then multiply by 2.","mode":"number"},{"skill":4,"prompt":"Write 15/3 as a division expression and evaluate it.","answer":"15 ÷ 3 = 5","explanation":"A fraction bar means divide the numerator by the denominator.","mode":"review"}],"quick_check":"4.8 ÷ 2? How many fourths are in 3? Reciprocal of 5?","solution":"4.8 ÷ 2 = 2.4.<br>There are 12 fourths in 3 (since 3 ÷ 1/4 = 3 × 4 = 12).<br>Reciprocal of 5 is 1/5.","variants":[{"form":"B","prompt":"6.4 ÷ 2? How many thirds are in 4? Reciprocal of 8?","answer":"6.4 ÷ 2 = 3.2. There are 12 thirds in 4 (4 ÷ 1/3 = 4 × 3). Reciprocal of 8 is 1/8."},{"form":"C","prompt":"9.6 ÷ 4? How many halves are in 5? Reciprocal of 1/6?","answer":"9.6 ÷ 4 = 2.4. There are 10 halves in 5. Reciprocal of 1/6 is 6."}],"extension":{"prompt":"A ribbon is 6 feet long. How many 3/4-foot pieces can be cut from it?","answer":"6 ÷ 3/4 = 6 × 4/3 = 24/3 = 8 pieces."},"vocabulary":[{"term":"reciprocal","def":"The number you multiply by to get 1; the reciprocal of 5 is 1/5."},{"term":"unit fraction","def":"A fraction with numerator 1, such as 1/4."},{"term":"quotient","def":"The result of a division."}],"frame":"There are ___ ___ in ___ because dividing by ___ is the same as multiplying by ___ ."},{"id":"6-2","title":"Division Expressions with Fractions and Mixed Numbers","standard":{"code":"6.NS.A.1","text":"Compute quotients of fractions, including mixed numbers."},"skills":[{"text":"Rewrite a mixed number as an improper fraction","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Multiply two fractions","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Find the reciprocal of any fraction","source":"6-1","is_elementary":false,"is_prior_g6":true},{"text":"Simplify a fraction to lowest terms","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Write 2 3/4 as an improper fraction.","answer":"11/4","explanation":"Two wholes contain 8 fourths; add 3 fourths to get 11 fourths.","mode":"number"},{"skill":2,"prompt":"Compute 2/3 × 3/5.","answer":"2/5","explanation":"Multiply to get 6/15, then simplify by dividing both parts by 3.","mode":"number"},{"skill":3,"prompt":"Find the reciprocal of 4/7.","answer":"7/4","explanation":"Exchange numerator and denominator; their product will be 1.","mode":"number"},{"skill":4,"prompt":"Simplify 18/24.","answer":"3/4","explanation":"Divide numerator and denominator by their greatest common factor, 6.","mode":"number"}],"quick_check":"2 3/4 as an improper fraction? Reciprocal of 3/5? 2/3 × 5/4?","solution":"2 3/4 as improper fraction: (2 × 4 + 3) / 4 = 11/4.<br>Reciprocal of 3/5 is 5/3.<br>Product: 2/3 × 5/4 = 10/12 = 5/6.","variants":[{"form":"B","prompt":"3 2/5 as an improper fraction? Reciprocal of 4/7? 3/4 × 2/5?","answer":"3 2/5 = (3 × 5 + 2)/5 = 17/5. Reciprocal of 4/7 is 7/4. 3/4 × 2/5 = 6/20 = 3/10."},{"form":"C","prompt":"1 5/6 as an improper fraction? Reciprocal of 9/2? 5/6 × 3/10?","answer":"1 5/6 = 11/6. Reciprocal of 9/2 is 2/9. 5/6 × 3/10 = 15/60 = 1/4."}],"extension":{"prompt":"How many 1 1/2-cup servings are in 6 cups?","answer":"6 ÷ 3/2 = 6 × 2/3 = 4 servings."},"vocabulary":[{"term":"improper fraction","def":"A fraction whose numerator is at least as large as its denominator, such as 11/4."},{"term":"mixed number","def":"A whole number and a fraction together, such as 2 3/4."},{"term":"simplify","def":"Rewrite a fraction in lowest terms."}],"frame":"___ ÷ ___ becomes ___ × ___ because dividing by a fraction means multiplying by its reciprocal."},{"id":"6-3","title":"Explore Numerical Expressions with Exponents","standard":{"code":"6.EE.A.1","text":"Write and evaluate numerical expressions involving whole-number exponents."},"skills":[{"text":"Multiply the same factor repeatedly","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Recall 2², 3², 4², 5², 2³, and 3³","source":"Gr 5–6","is_elementary":true,"is_prior_g6":false},{"text":"Multiply by 10 repeatedly to build powers of 10","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Count how many factors are written","source":"Gr 3","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 3 × 3 × 3 × 3.","answer":"81","explanation":"Successive products are 9, 27, and 81.","mode":"number"},{"skill":2,"prompt":"Evaluate 5².","answer":"25","explanation":"5² means 5 × 5.","mode":"number"},{"skill":3,"prompt":"Evaluate 10 × 10 × 10.","answer":"1000","explanation":"Three factors of 10 give one thousand.","mode":"number"},{"skill":4,"prompt":"How many factors of 2 appear in 2 × 2 × 2 × 2 × 2?","answer":"5","explanation":"Count each repeated factor, not the multiplication signs.","mode":"number"}],"quick_check":"6²? Write 2 × 2 × 2 × 2 as a power. 10³?","solution":"6² = 6 × 6 = 36.<br>2 × 2 × 2 × 2 as a power = 2⁴.<br>10³ = 10 × 10 × 10 = 1,000.","variants":[{"form":"B","prompt":"7²? Write 3 × 3 × 3 × 3 × 3 as a power. 10⁴?","answer":"7² = 49. 3 × 3 × 3 × 3 × 3 = 3⁵. 10⁴ = 10,000."},{"form":"C","prompt":"4³? Write 5 × 5 × 5 as a power. 10²?","answer":"4³ = 64. 5 × 5 × 5 = 5³. 10² = 100."}],"extension":{"prompt":"Which is greater, 3⁴ or 4³?","answer":"3⁴ = 81 and 4³ = 64, so 3⁴ is greater."},"vocabulary":[{"term":"base","def":"The number being multiplied repeatedly."},{"term":"exponent","def":"How many times the base is used as a factor."},{"term":"power","def":"The whole expression, such as 2⁴, and also its value."}],"frame":"___ to the ___ power means ___ used as a factor ___ times, which equals ___ ."},{"id":"6-4","title":"Write and Evaluate Numerical Expressions with Exponents","standard":{"code":"6.EE.A.2.c","text":"Evaluate expressions, applying the order of operations, including those with exponents."},"skills":[{"text":"Evaluate a power","source":"6-3","is_elementary":false,"is_prior_g6":true},{"text":"Follow order of operations with parentheses and exponents","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Read a fraction bar as a grouping symbol","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Translate “sum,” “product,” and “less than” into symbols","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Evaluate 4³.","answer":"64","explanation":"4 × 4 × 4 = 16 × 4 = 64.","mode":"number"},{"skill":2,"prompt":"Evaluate 2 + 3² × 4.","answer":"38","explanation":"Exponent first gives 9; multiplication gives 36; then add 2.","mode":"number"},{"skill":3,"prompt":"Evaluate (8 + 4)/3.","answer":"4","explanation":"The fraction bar groups the numerator: 12 ÷ 3 = 4.","mode":"number"},{"skill":4,"prompt":"Write an expression for 7 less than the product of 3 and 5.","answer":"3 × 5 − 7","explanation":"Start with the product, then subtract 7. Its value is 8.","mode":"review"}],"quick_check":"4 + 6 ÷ 2? 3 + 2² × 5? Which operation comes first?","solution":"4 + 6 ÷ 2: Divide first (6 ÷ 2 = 3), then add: 4 + 3 = 7.<br>3 + 2² × 5: Exponent first (2² = 4), then multiply (4 × 5 = 20), then add: 3 + 20 = 23.<br>Exponent comes first, then multiplication, then addition.","variants":[{"form":"B","prompt":"8 + 12 ÷ 4? 5 + 3² × 2? Which operation comes first?","answer":"8 + 12 ÷ 4: divide first (3), then add: 11. 5 + 3² × 2: exponent (9), then multiply (18), then add: 23. The exponent comes first."},{"form":"C","prompt":"20 − 6 × 2? 4 + 2³ ÷ 4? Which operation comes first?","answer":"20 − 6 × 2: multiply first (12), then subtract: 8. 4 + 2³ ÷ 4: exponent (8), then divide (2), then add: 6. The exponent comes first."}],"extension":{"prompt":"Evaluate 2 × (3 + 4)² − 10.","answer":"Parentheses: 7. Exponent: 49. Multiply: 98. Subtract: 88."},"vocabulary":[{"term":"order of operations","def":"Grouping symbols, then exponents, then multiply/divide left to right, then add/subtract left to right."},{"term":"grouping symbol","def":"Parentheses, brackets, or a fraction bar that says \"do this first.\""},{"term":"evaluate","def":"Find the single value of an expression."}],"frame":"I do ___ first because ___ comes before ___ in the order of operations."},{"id":"6-5","title":"Write and Evaluate Algebraic Expressions","standard":{"code":"6.EE.A.2","text":"Write, read, and evaluate expressions in which letters stand for numbers."},"skills":[{"text":"Substitute a number for a letter, then compute","source":"Gr 6","is_elementary":true,"is_prior_g6":false},{"text":"Follow order of operations after substituting","source":"6-4","is_elementary":false,"is_prior_g6":true},{"text":"Read 4n as 4 × n","source":"Gr 6","is_elementary":true,"is_prior_g6":false},{"text":"Translate a word phrase into an expression","source":"6-4","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Evaluate n + 8 when n = 6.","answer":"14","explanation":"Replace n with 6: 6 + 8 = 14.","mode":"number"},{"skill":2,"prompt":"Evaluate 2x + 3 when x = 5.","answer":"13","explanation":"Substitute, then multiply before adding: 2 × 5 + 3.","mode":"number"},{"skill":3,"prompt":"Evaluate 4n when n = 7.","answer":"28","explanation":"A number next to a variable means multiplication: 4 × 7.","mode":"number"},{"skill":4,"prompt":"Write an expression for 9 more than a number n.","answer":"n + 9","explanation":"More than indicates adding 9 to the starting number.","mode":"review"}],"quick_check":"Evaluate 4n + 3 when n = 5. Write an expression for “7 more than a number.”","solution":"When n = 5: 4(5) + 3 = 20 + 3 = 23.<br>Expression for '7 more than a number': n + 7 (or x + 7).","variants":[{"form":"B","prompt":"Evaluate 3n + 8 when n = 6. Write an expression for \"5 less than a number.\"","answer":"3(6) + 8 = 18 + 8 = 26. Expression: n − 5."},{"form":"C","prompt":"Evaluate 2n − 7 when n = 10. Write an expression for \"the product of 6 and a number.\"","answer":"2(10) − 7 = 20 − 7 = 13. Expression: 6n."}],"extension":{"prompt":"Write an expression for the cost of n tickets at $12 each plus a $5 fee, then find the cost for 4 tickets.","answer":"12n + 5. At n = 4: 12(4) + 5 = 53 dollars."},"vocabulary":[{"term":"variable","def":"A letter that stands for a number."},{"term":"coefficient","def":"The number multiplied by a variable; in 4n the coefficient is 4."},{"term":"substitute","def":"Replace a variable with a given value."}],"frame":"When n = ___, the expression equals ___ because ___ means ___ × ___ ."},{"id":"6-6","title":"Identify Equivalent Algebraic Expressions","standard":{"code":"6.EE.A.4","text":"Identify when two expressions are equivalent."},"skills":[{"text":"Combine like terms such as 5x + 2x","source":"Gr 6","is_elementary":true,"is_prior_g6":false},{"text":"Evaluate an expression at a chosen value","source":"6-5","is_elementary":false,"is_prior_g6":true},{"text":"Apply the distributive property with numbers, e.g. 3(4 + 5)","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Compare two results to decide whether expressions match","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Simplify 5x + 2x.","answer":"7x","explanation":"Both terms count x units; combine coefficients 5 + 2.","mode":"review"},{"skill":2,"prompt":"Evaluate 3x + 4 when x = 2.","answer":"10","explanation":"Substitute 2, then compute 6 + 4.","mode":"number"},{"skill":3,"prompt":"Evaluate 3(4 + 5) using distribution.","answer":"27","explanation":"3 × 4 + 3 × 5 = 12 + 15.","mode":"number"},{"skill":4,"prompt":"Compare 2(x + 3) and 2x + 6 at x = 4. Give both values.","answer":"14 and 14","explanation":"2(4 + 3) = 14 and 2 × 4 + 6 = 14. Matching at one value alone does not prove equivalence for all values.","mode":"review"}],"quick_check":"5x + 2x = ? Evaluate 2(x + 3) and 2x + 6 at x = 4 — are they the same?","solution":"5x + 2x = 7x.<br>At x = 4: 2(4 + 3) = 2(7) = 14; and 2(4) + 6 = 8 + 6 = 14.<br>Yes, both equal 14 at x = 4. The distributive property, 2(x + 3) = 2x + 6, shows they are equivalent for every x.","variants":[{"form":"B","prompt":"8y + 3y = ? Evaluate 3(x + 2) and 3x + 6 at x = 5 — are they the same?","answer":"8y + 3y = 11y. At x = 5: 3(7) = 21 and 15 + 6 = 21. Yes — the distributive property shows they match for every x."},{"form":"C","prompt":"9a − 4a = ? Evaluate 4(x + 1) and 4x + 4 at x = 3 — are they the same?","answer":"9a − 4a = 5a. At x = 3: 4(4) = 16 and 12 + 4 = 16. Yes — equivalent for every x."}],"extension":{"prompt":"Are 3(2x + 4) and 6x + 7 equivalent? Justify.","answer":"No. Distributing gives 6x + 12, not 6x + 7. At x = 0 they give 12 and 7 — different."},"vocabulary":[{"term":"like terms","def":"Terms with the same variable raised to the same power, such as 5x and 2x."},{"term":"equivalent expressions","def":"Expressions that give the same value for every value of the variable."},{"term":"distributive property","def":"a(b + c) = ab + ac."}],"frame":"___ and ___ are equivalent because ___, which holds for every value of ___ ."},{"id":"6-7","title":"Find Factors and Multiples","standard":{"code":"6.NS.B.4","text":"Find the greatest common factor of two whole numbers and the least common multiple of two whole numbers."},"skills":[{"text":"Recall multiplication and division facts","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"List every factor pair of a number up to 100","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"List the first several multiples of a number","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Test divisibility by 2, 3, 5, 9, and 10","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Compute 84 ÷ 7.","answer":"12","explanation":"The related fact is 7 × 12 = 84.","mode":"number"},{"skill":2,"prompt":"List every positive factor of 18.","answer":"1, 2, 3, 6, 9, 18","explanation":"Use factor pairs 1 × 18, 2 × 9, and 3 × 6.","mode":"review"},{"skill":3,"prompt":"List the first four positive multiples of 7.","answer":"7, 14, 21, 28","explanation":"Multiply 7 by 1, 2, 3, and 4.","mode":"review"},{"skill":4,"prompt":"Which of 2, 3, 5, 9, and 10 divide 135 evenly?","answer":"3, 5, 9","explanation":"Digit sum 9 makes it divisible by 3 and 9; final digit 5 makes it divisible by 5. It is not even and does not end in 0.","mode":"review"}],"quick_check":"All the factors of 18? First five multiples of 6? GCF of 18 and 24?","solution":"Factors of 18: 1, 2, 3, 6, 9, 18.<br>First five multiples of 6: 6, 12, 18, 24, 30.<br>GCF of 18 and 24: Common factors are 1, 2, 3, 6; Greatest is 6.","variants":[{"form":"B","prompt":"All the factors of 24? First five multiples of 8? GCF of 24 and 36?","answer":"Factors of 24: 1, 2, 3, 4, 6, 8, 12, 24. Multiples of 8: 8, 16, 24, 32, 40. GCF(24, 36) = 12."},{"form":"C","prompt":"All the factors of 20? First five multiples of 5? GCF of 20 and 30?","answer":"Factors of 20: 1, 2, 4, 5, 10, 20. Multiples of 5: 5, 10, 15, 20, 25. GCF(20, 30) = 10."}],"extension":{"prompt":"You have 24 pencils and 36 erasers to split into identical kits with nothing left over. What is the largest number of kits?","answer":"GCF(24, 36) = 12 kits, each with 2 pencils and 3 erasers."},"vocabulary":[{"term":"factor","def":"A number that divides into another with no remainder."},{"term":"multiple","def":"The result of multiplying a number by a whole number."},{"term":"greatest common factor (GCF)","def":"The largest factor two numbers share."}],"frame":"The GCF of ___ and ___ is ___ because it is the largest number that divides both."},{"id":"6-8","title":"Generate Equivalent Expressions","standard":{"code":"6.EE.A.3","text":"Apply the properties of operations to generate equivalent expressions."},"skills":[{"text":"Find the GCF of two numbers","source":"6-7","is_elementary":false,"is_prior_g6":true},{"text":"Apply the distributive property forward and backward","source":"6-6","is_elementary":false,"is_prior_g6":true},{"text":"Combine like terms","source":"6-6","is_elementary":false,"is_prior_g6":true},{"text":"Multiply a number by a sum","source":"Gr 5","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Find the greatest common factor of 18 and 30.","answer":"6","explanation":"Their common factors are 1, 2, 3, and 6; choose the greatest.","mode":"number"},{"skill":2,"prompt":"Factor 12x + 20 using the greatest common factor.","answer":"4(3x + 5)","explanation":"Both terms share 4; divide each term by 4 inside the parentheses.","mode":"review"},{"skill":3,"prompt":"Simplify 4a + 3a + 2.","answer":"7a + 2","explanation":"Combine the a terms; the constant 2 is a different kind of term.","mode":"review"},{"skill":4,"prompt":"Compute 6(10 + 4).","answer":"84","explanation":"Distribute: 60 + 24 = 84.","mode":"number"}],"quick_check":"GCF of 18 and 24? Expand 3(x + 5). Factor 4x + 12.","solution":"GCF(18, 24) = 6.<br>Expand: 3(x + 5) = 3x + 15.<br>Factor: 4x + 12 = 4(x + 3).","variants":[{"form":"B","prompt":"GCF of 20 and 30? Expand 5(x + 4). Factor 6x + 18.","answer":"GCF(20, 30) = 10. 5(x + 4) = 5x + 20. 6x + 18 = 6(x + 3)."},{"form":"C","prompt":"GCF of 12 and 16? Expand 4(x + 7). Factor 9x + 15.","answer":"GCF(12, 16) = 4. 4(x + 7) = 4x + 28. 9x + 15 = 3(3x + 5)."}],"extension":{"prompt":"Factor 24x + 36 completely, then check by expanding.","answer":"GCF(24, 36) = 12, so 24x + 36 = 12(2x + 3). Check: 12(2x) + 12(3) = 24x + 36. ✓"},"vocabulary":[{"term":"expand","def":"Use the distributive property to remove parentheses."},{"term":"factor","def":"Pull out a common factor to create parentheses."},{"term":"common factor","def":"A number that divides every term in an expression."}],"frame":"___ factors to ___ because ___ divides both ___ and ___ ."}]},{"number":7,"title":"Integers, Rational Numbers, and the Coordinate Plane","lessons":[{"id":"7-1","title":"Explore Integers and Their Opposites","standard":{"code":"6.NS.C.5","text":"Understand that positive and negative numbers describe quantities with opposite directions or values."},"skills":[{"text":"Place whole numbers on a number line","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Count forward and backward through zero","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Read a negative sign as “below zero” or “the opposite of”","source":"Gr 6","is_elementary":true,"is_prior_g6":false},{"text":"Simplify an algebraic expression carried in from Unit 6","source":"6-6","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"On a number line marked in ones, what number is three steps right of 2?","answer":"5","explanation":"Count 3, 4, 5 to the right.","mode":"number"},{"skill":2,"prompt":"Start at 2 and move backward 5 steps. Where do you land?","answer":"-3","explanation":"Count 1, 0, -1, -2, -3.","mode":"number"},{"skill":3,"prompt":"Write the integer for 7 degrees below zero.","answer":"-7","explanation":"The negative sign indicates a value below zero.","mode":"number"},{"skill":4,"prompt":"Simplify 3x + 4x.","answer":"7x","explanation":"Add the coefficients of the like terms.","mode":"review"}],"quick_check":"What is the opposite of −6? Where does −3 sit compared with 0?","solution":"Opposite of −6 is +6 (or 6).<br>Position of −3: sits 3 units to the left of 0 (or 3 units below 0).","variants":[{"form":"B","prompt":"What is the opposite of −9? Where does −5 sit compared with 0?","answer":"The opposite of −9 is 9. The number −5 sits 5 units to the left of 0."},{"form":"C","prompt":"What is the opposite of 12? Where does −1 sit compared with 0?","answer":"The opposite of 12 is −12. The number −1 sits 1 unit to the left of 0."}],"extension":{"prompt":"A diver is at −18 feet and a bird is at the opposite elevation. How far apart are they?","answer":"The bird is at +18 feet. The distance is 18 + 18 = 36 feet."},"vocabulary":[{"term":"integer","def":"A whole number and its opposite: … −2, −1, 0, 1, 2 …"},{"term":"opposite","def":"The number the same distance from 0 on the other side."},{"term":"negative","def":"Less than zero; to the left of 0 on a number line."}],"frame":"The opposite of ___ is ___ because both sit ___ units from zero, on opposite sides."},{"id":"7-2","title":"Represent Rational Numbers and Their Opposites on the Number Line","standard":{"code":"6.NS.C.6.c","text":"Find and position integers and other rational numbers on a horizontal or vertical number line diagram."},"skills":[{"text":"Place fractions and decimals between whole numbers","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Name the two consecutive integers a number falls between","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Convert between a fraction and a decimal","source":"4-2","is_elementary":false,"is_prior_g6":true},{"text":"Partition a number-line interval into equal parts","source":"Gr 4","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Write the decimal halfway between 1 and 2.","answer":"1.5","explanation":"Half of a unit is 0.5; add it to 1.","mode":"number"},{"skill":2,"prompt":"Between which two consecutive integers is -2.6?","answer":"-3 and -2","explanation":"-2.6 lies to the right of -3 and to the left of -2.","mode":"review"},{"skill":3,"prompt":"Write 3/5 as a decimal.","answer":"0.6","explanation":"Convert 3/5 to 6/10, or divide 3 by 5.","mode":"number"},{"skill":4,"prompt":"An interval from 0 to 1 is split into 4 equal parts. What is the length of one part?","answer":"1/4","explanation":"Divide the unit length into four equal shares.","mode":"number"}],"quick_check":"Which two integers does 2.7 fall between? Where does −11/2 go?","solution":"2.7 falls between integers 2 and 3.<br>−11/2 = −5.5, which falls between −6 and −5 (exactly halfway between them).","variants":[{"form":"B","prompt":"Which two integers does 3.4 fall between? Where does −7/2 go?","answer":"3.4 falls between 3 and 4. −7/2 = −3.5, which sits halfway between −4 and −3."},{"form":"C","prompt":"Which two integers does −1.2 fall between? Where does 9/4 go?","answer":"−1.2 falls between −2 and −1. 9/4 = 2.25, which sits between 2 and 3, a quarter of the way up."}],"extension":{"prompt":"Place −2 1/4, −2.5, and −2.75 in order from least to greatest.","answer":"−2.75, −2.5, −2 1/4 (which is −2.25). Further left means less."},"vocabulary":[{"term":"rational number","def":"Any number that can be written as a fraction of integers, including decimals and negatives."},{"term":"consecutive integers","def":"Whole numbers in a row, such as 2 and 3."},{"term":"partition","def":"Split an interval into equal parts."}],"frame":"___ falls between ___ and ___ because it is ___ than one and ___ than the other."},{"id":"7-3","title":"Understand Absolute Value of Rational Numbers","standard":{"code":"6.NS.C.7.c","text":"Understand the absolute value of a rational number as its distance from 0 on the number line."},"skills":[{"text":"Count the distance between two points on a number line","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Name the opposite of a number","source":"7-1","is_elementary":false,"is_prior_g6":true},{"text":"Report a distance as a positive number","source":"Gr 6","is_elementary":true,"is_prior_g6":false},{"text":"Add two distances to find a total","source":"Gr 3","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"What is the distance from -4 to 0?","answer":"4","explanation":"Count four unit intervals to zero.","mode":"number"},{"skill":2,"prompt":"What is the opposite of -7?","answer":"7","explanation":"Opposites are equally far from zero on opposite sides.","mode":"number"},{"skill":3,"prompt":"Evaluate the absolute value of -9.","answer":"9","explanation":"Absolute value measures distance from zero, which is 9.","mode":"number"},{"skill":4,"prompt":"A path goes 3 units to zero, then 5 more units. What total distance is traveled?","answer":"8","explanation":"Add the two nonnegative distances: 3 + 5.","mode":"number"}],"quick_check":"|−9|? How far is −4 from 0? How far from −4 to 3?","solution":"|−9| = 9.<br>Distance from −4 to 0 is 4 units.<br>Distance from −4 to 3: 4 units (to zero) + 3 units (to 3) = 7 units total.","variants":[{"form":"B","prompt":"|−12|? How far is −7 from 0? How far from −7 to 2?","answer":"|−12| = 12. Distance from −7 to 0 is 7. From −7 to 2: 7 + 2 = 9 units."},{"form":"C","prompt":"|−3.5|? How far is −6 from 0? How far from −2 to 8?","answer":"|−3.5| = 3.5. Distance from −6 to 0 is 6. From −2 to 8: 2 + 8 = 10 units."}],"extension":{"prompt":"Two numbers both have absolute value 6.5. What are they, and how far apart are they?","answer":"6.5 and −6.5. They are 13 units apart."},"vocabulary":[{"term":"absolute value","def":"The distance of a number from 0, written |x|; never negative."},{"term":"distance","def":"How far apart two points are, counted in units."},{"term":"magnitude","def":"The size of a quantity, ignoring its direction."}],"frame":"The distance from ___ to ___ is ___ because I counted ___ units to zero and ___ more beyond it."},{"id":"7-4","title":"Compare and Order Integers and Rational Numbers","standard":{"code":"6.NS.C.7.a","text":"Interpret statements of inequality as statements about the relative position of two numbers on a number line."},"skills":[{"text":"Use < and > correctly","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Place numbers on a number line","source":"7-2","is_elementary":false,"is_prior_g6":true},{"text":"Compare decimals and fractions","source":"4-2","is_elementary":false,"is_prior_g6":true},{"text":"Read left-is-less, right-is-greater on a number line","source":"7-1","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Fill the blank with < or >: -8 __ -3.","answer":"<","explanation":"-8 is farther left on the number line, so it is less.","mode":"review"},{"skill":2,"prompt":"Order -1, 3, -4, 0 from least to greatest.","answer":"-4, -1, 0, 3","explanation":"Read positions on the number line from left to right.","mode":"review"},{"skill":3,"prompt":"Which is greater: 3/4 or 0.7?","answer":"3/4","explanation":"Convert 3/4 to 0.75; 0.75 is greater than 0.70.","mode":"number"},{"skill":4,"prompt":"Point A is at -5 and point B is at -2. Which point is farther right?","answer":"B","explanation":"-2 is to the right of -5 and is therefore greater.","mode":"review"}],"quick_check":"−6 ___ −2. Order these: −3, 1.5, −1/2, 0.","solution":"−6 < −2 (since −6 is further to the left on the number line).<br>Ordered least to greatest: −3, −1/2, 0, 1.5.","variants":[{"form":"B","prompt":"−8 ___ −3. Order these: −5, 2.5, −1/2, 0.","answer":"−8 < −3. Order: −5, −1/2, 0, 2.5."},{"form":"C","prompt":"−1 ___ −7. Order these: −2, 0.75, −3/4, 3.","answer":"−1 > −7. Order: −2, −3/4, 0.75, 3."}],"extension":{"prompt":"A temperature of −4°F rises 6 degrees. Is it now warmer or colder than −1°F?","answer":"−4 + 6 = 2°F, which is warmer than −1°F because 2 sits to the right of −1."},"vocabulary":[{"term":"inequality symbol","def":"< means less than, > means greater than."},{"term":"relative position","def":"Where one number sits compared with another on the line."},{"term":"least to greatest","def":"Ordered left to right along the number line."}],"frame":"___ is less than ___ because it sits further to the ___ on the number line."},{"id":"7-5","title":"Represent Rational Numbers on the Coordinate Plane","standard":{"code":"6.NS.C.6.b","text":"Understand signs of numbers in ordered pairs as indicating locations in quadrants of the coordinate plane."},"skills":[{"text":"Plot ordered pairs in Quadrant I","source":"3-4","is_elementary":false,"is_prior_g6":true},{"text":"Read the sign of each coordinate to name a quadrant","source":"Gr 6","is_elementary":true,"is_prior_g6":false},{"text":"Move left or right first, then up or down from the origin","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Read a scaled axis before plotting","source":"3-4","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"From the origin, move 2 right and 6 up. Give the ordered pair.","answer":"(2, 6)","explanation":"The x-coordinate records horizontal movement; y records vertical movement.","mode":"review"},{"skill":2,"prompt":"Which quadrant contains (-3, 4)?","answer":"Quadrant II","explanation":"Negative x is left and positive y is up.","mode":"review"},{"skill":3,"prompt":"Describe the moves from the origin to (-4, -2).","answer":"4 left, 2 down","explanation":"Move horizontally first; both signs are negative.","mode":"review"},{"skill":4,"prompt":"An axis counts by 5. What value is two tick intervals left of zero?","answer":"-10","explanation":"Two intervals total 10 units; left of zero is negative.","mode":"number"}],"quick_check":"Which quadrant holds (−4, 5)? Plot (3, −2).","solution":"(−4, 5) has negative x and positive y, which is Quadrant II.<br>Plot (3, −2): Move 3 units right on x-axis, then 2 units down on y-axis (Quadrant IV).","variants":[{"form":"B","prompt":"Which quadrant holds (−3, −6)? Plot (5, −1).","answer":"(−3, −6) has both coordinates negative — Quadrant III. (5, −1): 5 right, 1 down — Quadrant IV."},{"form":"C","prompt":"Which quadrant holds (7, 2)? Plot (−2, 4).","answer":"(7, 2) has both coordinates positive — Quadrant I. (−2, 4): 2 left, 4 up — Quadrant II."}],"extension":{"prompt":"Reflect (−3, 4) across the y-axis, then across the x-axis. Where does it end up?","answer":"Across the y-axis: (3, 4). Then across the x-axis: (3, −4)."},"vocabulary":[{"term":"quadrant","def":"One of four regions of the coordinate plane, numbered I–IV counterclockwise from the upper right."},{"term":"reflection","def":"A flip across an axis that changes the sign of one coordinate."},{"term":"x-coordinate","def":"The first number in an ordered pair — how far across."}],"frame":"The point ___ is in Quadrant ___ because its x is ___ and its y is ___ ."},{"id":"7-6","title":"Determine Distance on the Coordinate Plane","standard":{"code":"6.NS.C.8","text":"Solve problems by graphing points in all four quadrants; use absolute value to find distances between points with the same first or second coordinate."},"skills":[{"text":"Subtract integers on a number line","source":"7-4","is_elementary":false,"is_prior_g6":true},{"text":"Use absolute value to report a distance","source":"7-3","is_elementary":false,"is_prior_g6":true},{"text":"Read the coordinates off a plotted point","source":"7-5","is_elementary":false,"is_prior_g6":true},{"text":"Add two distances when a segment crosses an axis","source":"7-3","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Compute 6 − (-2).","answer":"8","explanation":"The distance from -2 to 6 is 2 + 6 = 8.","mode":"number"},{"skill":2,"prompt":"Evaluate the absolute value of -12.","answer":"12","explanation":"Distance from zero is nonnegative.","mode":"number"},{"skill":3,"prompt":"A plotted point is 3 units left and 5 units up from the origin. Give its coordinates.","answer":"(-3, 5)","explanation":"Left gives negative x; up gives positive y.","mode":"review"},{"skill":4,"prompt":"Find the horizontal distance from (-4, 2) to (7, 2).","answer":"11","explanation":"The segment crosses the y-axis: 4 units to zero plus 7 more units.","mode":"number"}],"quick_check":"Distance from (−5, 2) to (3, 2)? What is |−5 − 3|?","solution":"Distance from (−5, 2) to (3, 2): Segment is horizontal (y=2). Distance = |−5 − 3| = |−8| = 8 units (or 5 units to y-axis + 3 units to right = 8).","variants":[{"form":"B","prompt":"Distance from (−6, 3) to (2, 3)? What is |−6 − 2|?","answer":"The segment is horizontal (y = 3). Distance = |−6 − 2| = |−8| = 8 units."},{"form":"C","prompt":"Distance from (4, −5) to (4, 7)? What is |−5 − 7|?","answer":"The segment is vertical (x = 4). Distance = |−5 − 7| = |−12| = 12 units."}],"extension":{"prompt":"Points A(−3, 5) and B(−3, −2). Find AB, then find a point C so that BC = 4 horizontally.","answer":"AB = |5 − (−2)| = 7 units. C could be (1, −2) or (−7, −2)."},"vocabulary":[{"term":"horizontal segment","def":"A segment joining two points with the same y-coordinate."},{"term":"vertical segment","def":"A segment joining two points with the same x-coordinate."},{"term":"coordinate distance","def":"The absolute value of the difference of the coordinates that change."}],"frame":"The distance is ___ because the ___-coordinates stay the same and the ___-coordinates differ by ___ ."},{"id":"7-7","title":"Represent Polygons on the Coordinate Plane","standard":{"code":"6.G.A.3","text":"Draw polygons in the coordinate plane given coordinates for the vertices; find side lengths."},"skills":[{"text":"Plot several points and connect them in order","source":"7-5","is_elementary":false,"is_prior_g6":true},{"text":"Find horizontal and vertical distances between vertices","source":"7-6","is_elementary":false,"is_prior_g6":true},{"text":"Add side lengths to find perimeter","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Find the area of a rectangle or triangle","source":"5-1, 5-2","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Plot (0, 0), (4, 0), (4, 3), (0, 3) and connect in order. Name the shape.","answer":"Rectangle","explanation":"Opposite sides are parallel and all four corners are right angles.","mode":"review"},{"skill":2,"prompt":"Find the vertical distance from (2, -3) to (2, 5).","answer":"8","explanation":"The x-coordinates match; distance is 3 + 5 = 8.","mode":"number"},{"skill":3,"prompt":"Find the perimeter of a rectangle with side lengths 4 and 3.","answer":"14","explanation":"Add all four sides: 4 + 3 + 4 + 3.","mode":"number"},{"skill":4,"prompt":"Find the area of a triangle with base 8 and height 5.","answer":"20","explanation":"Half of the product 8 × 5 is 20.","mode":"number"}],"quick_check":"Plot (1,1), (5,1), (5,4), (1,4). What is the perimeter? The area?","solution":"Vertices form a rectangle:<br>Horizontal length: 5 − 1 = 4 units.<br>Vertical height: 4 − 1 = 3 units.<br>Perimeter: 2(4 + 3) = 14 units.<br>Area: 4 × 3 = 12 square units.","variants":[{"form":"B","prompt":"Plot (2, 2), (8, 2), (8, 6), (2, 6). What is the perimeter? The area?","answer":"Length 8 − 2 = 6, height 6 − 2 = 4. Perimeter = 2(6 + 4) = 20 units. Area = 6 × 4 = 24 square units."},{"form":"C","prompt":"Plot (−3, 1), (3, 1), (3, 5), (−3, 5). What is the perimeter? The area?","answer":"Length 3 − (−3) = 6, height 5 − 1 = 4. Perimeter = 20 units. Area = 24 square units."}],"extension":{"prompt":"Three vertices of a rectangle are (1, 2), (7, 2), and (7, 9). Give the fourth vertex and the perimeter.","answer":"Fourth vertex (1, 9). Sides 6 and 7, so perimeter = 2(6 + 7) = 26 units."},"vocabulary":[{"term":"vertex","def":"A corner point of a polygon."},{"term":"perimeter","def":"The distance all the way around a figure, in linear units."},{"term":"polygon","def":"A closed figure made of straight sides."}],"frame":"The perimeter is ___ units and the area is ___ square units because the sides measure ___ and ___ ."}]},{"number":8,"title":"Equations and Inequalities","lessons":[{"id":"8-1","title":"Understand Equations and Their Solutions","standard":{"code":"6.EE.B.5","text":"Understand solving an equation as a process of answering which values make the equation true."},"skills":[{"text":"Substitute a value into an expression and evaluate","source":"6-5","is_elementary":false,"is_prior_g6":true},{"text":"Read an equals sign as a balance, not as “the answer is”","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Translate a sentence into an equation","source":"6-5","is_elementary":false,"is_prior_g6":true},{"text":"Compare two sides to decide whether they match","source":"6-6","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Evaluate 3x + 2 when x = 4.","answer":"14","explanation":"Substitute and multiply first: 3 × 4 + 2 = 14.","mode":"number"},{"skill":2,"prompt":"Find the missing number: 7 + 5 = __ + 4.","answer":"8","explanation":"Both sides must equal 12; 8 + 4 = 12.","mode":"number"},{"skill":3,"prompt":"Write an equation for a number n plus 6 is 15.","answer":"n + 6 = 15","explanation":"Is connects two equal quantities, so use an equals sign.","mode":"review"},{"skill":4,"prompt":"Does x = 5 make 2x + 1 = 11 true? Explain.","answer":"Yes; 2 × 5 + 1 = 11","explanation":"Substitution gives 11 on the left, matching the right side.","mode":"review"}],"quick_check":"Is x = 4 a solution of 3x = 12? Write an equation for “three times a number is 15.”","solution":"Substitute x = 4: 3(4) = 12 is true, so YES, x = 4 is a solution.<br>Equation: 3n = 15 (or 3x = 15).","variants":[{"form":"B","prompt":"Is x = 5 a solution of 4x = 20? Write an equation for \"five times a number is 35.\"","answer":"4(5) = 20 is true, so yes. Equation: 5n = 35."},{"form":"C","prompt":"Is x = 3 a solution of 2x + 1 = 8? Write an equation for \"a number increased by 9 is 21.\"","answer":"2(3) + 1 = 7, not 8, so no. Equation: n + 9 = 21."}],"extension":{"prompt":"Which of 2, 4, or 6 is a solution of 3x − 2 = 10?","answer":"x = 4: 3(4) − 2 = 10. ✓ The others give 4 and 16."},"vocabulary":[{"term":"equation","def":"A statement that two expressions are equal."},{"term":"solution","def":"A value that makes the equation true."},{"term":"balance","def":"The idea that both sides of an equation must stay equal."}],"frame":"___ is a solution because substituting gives ___ = ___, which is true."},{"id":"8-2","title":"Write and Solve Equations Using Addition or Subtraction","standard":{"code":"6.EE.B.7","text":"Solve real-world and mathematical problems by writing and solving equations of the form x + p = q."},"skills":[{"text":"Recall addition and subtraction facts and their inverses","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Add and subtract multi-digit numbers, decimals, and fractions","source":"Gr 5","is_elementary":true,"is_prior_g6":false},{"text":"Name the inverse of adding or subtracting a number","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Substitute the answer back in to check","source":"8-1","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Find the missing number: __ + 7 = 19.","answer":"12","explanation":"Undo adding 7 by subtracting: 19 − 7 = 12.","mode":"number"},{"skill":2,"prompt":"Compute 5.2 − 1.85.","answer":"3.35","explanation":"Write 5.20 and line up decimal places before subtracting.","mode":"number"},{"skill":3,"prompt":"Which operation undoes subtracting 8?","answer":"Adding 8","explanation":"Adding 8 and subtracting 8 are inverse operations.","mode":"review"},{"skill":4,"prompt":"Check x = 9 in x + 6 = 15. State the left-side value.","answer":"15","explanation":"Substitute 9: 9 + 6 = 15, matching the right side.","mode":"number"}],"quick_check":"m − 11 = 25, so m = ? What undoes “+ 8”?","solution":"m − 11 = 25 → m = 25 + 11 = 36.<br>What undoes '+ 8': Subtracting 8 (or '− 8').","variants":[{"form":"B","prompt":"m − 14 = 31, so m = ? What undoes \"+ 12\"?","answer":"m = 31 + 14 = 45. Subtracting 12 undoes adding 12."},{"form":"C","prompt":"y + 18 = 40, so y = ? What undoes \"− 7\"?","answer":"y = 40 − 18 = 22. Adding 7 undoes subtracting 7."}],"extension":{"prompt":"A jar lost 17 marbles and now holds 48. Write and solve an equation for the original count.","answer":"m − 17 = 48, so m = 65. Check: 65 − 17 = 48. ✓"},"vocabulary":[{"term":"inverse operation","def":"The operation that undoes another; subtraction undoes addition."},{"term":"isolate the variable","def":"Get the letter alone on one side of the equation."},{"term":"both sides","def":"Whatever you do to one side, you must do to the other."}],"frame":"I ___ ___ on both sides because ___ undoes ___, which leaves the variable alone."},{"id":"8-3","title":"Write and Solve Equations Using Multiplication or Division","standard":{"code":"6.EE.B.7","text":"Solve real-world and mathematical problems by writing and solving equations of the form px = q."},"skills":[{"text":"Recall multiplication and division facts","source":"Gr 3","is_elementary":true,"is_prior_g6":false},{"text":"Divide multi-digit numbers and decimals","source":"2-7","is_elementary":false,"is_prior_g6":true},{"text":"Name the inverse of multiplying or dividing by a number","source":"Gr 4","is_elementary":true,"is_prior_g6":false},{"text":"Divide by a fraction to undo multiplying by one","source":"6-2","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Compute 9 × 7.","answer":"63","explanation":"Use 10 × 7 − 7 = 63.","mode":"number"},{"skill":2,"prompt":"Compute 12.6 ÷ 3.","answer":"4.2","explanation":"126 tenths divided by 3 is 42 tenths.","mode":"number"},{"skill":3,"prompt":"Which operation undoes multiplying by 6?","answer":"Dividing by 6","explanation":"Division by the same nonzero factor reverses multiplication.","mode":"review"},{"skill":4,"prompt":"Compute 12 ÷ 3/4.","answer":"16","explanation":"Multiply by the reciprocal: 12 × 4/3 = 16.","mode":"number"}],"quick_check":"6x = 42, so x = ? x ÷ 5 = 9, so x = ? What undoes “× 4”?","solution":"6x = 42 → x = 42 ÷ 6 = 7.<br>x ÷ 5 = 9 → x = 9 × 5 = 45.<br>What undoes '× 4': Dividing by 4 (or '÷ 4').","variants":[{"form":"B","prompt":"8x = 56, so x = ? x ÷ 4 = 7, so x = ? What undoes \"× 9\"?","answer":"x = 56 ÷ 8 = 7. x = 7 × 4 = 28. Dividing by 9 undoes multiplying by 9."},{"form":"C","prompt":"5x = 45, so x = ? x ÷ 3 = 12, so x = ? What undoes \"÷ 6\"?","answer":"x = 45 ÷ 5 = 9. x = 12 × 3 = 36. Multiplying by 6 undoes dividing by 6."}],"extension":{"prompt":"Tickets cost the same amount. Nine tickets cost $63. Write and solve an equation for one ticket.","answer":"9t = 63, so t = $7. Check: 9(7) = 63. ✓"},"vocabulary":[{"term":"coefficient","def":"The number multiplying the variable."},{"term":"division as the inverse","def":"Dividing undoes multiplying."},{"term":"check by substituting","def":"Put the answer back in to confirm the equation is true."}],"frame":"x = ___ because ___ undoes ___, and substituting gives ___ = ___ ."},{"id":"8-4","title":"Write and Represent Inequalities","standard":{"code":"6.EE.B.8","text":"Write an inequality of the form x > c or x < c to represent a constraint in a real-world problem."},"skills":[{"text":"Use <, >, ≤, and ≥ correctly","source":"7-4","is_elementary":false,"is_prior_g6":true},{"text":"Translate “at least,” “at most,” “no more than,” “more than”","source":"Gr 6","is_elementary":true,"is_prior_g6":false},{"text":"Place a number on a number line","source":"7-2","is_elementary":false,"is_prior_g6":true},{"text":"Decide whether a given value makes a comparison true","source":"8-1","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Which symbol means greater than or equal to?","answer":"≥","explanation":"The line under > includes equality at the boundary.","mode":"review"},{"skill":2,"prompt":"Write an inequality for a number n that is at least 12.","answer":"n ≥ 12","explanation":"At least includes 12 and every larger value.","mode":"review"},{"skill":3,"prompt":"On a number line marked in ones, what number is two steps left of 1?","answer":"-1","explanation":"Move from 1 to 0, then to -1.","mode":"number"},{"skill":4,"prompt":"Does 7 satisfy n < 5? Explain.","answer":"No; 7 is greater than 5","explanation":"Substituting 7 gives 7 < 5, which is false.","mode":"review"}],"quick_check":"Write an inequality for “you must be at least 48 inches tall.” Is 50 a solution?","solution":"Inequality: h ≥ 48.<br>Is 50 a solution? Yes, because 50 ≥ 48 is true.","variants":[{"form":"B","prompt":"Write an inequality for \"you may bring at most 3 guests.\" Is 3 a solution?","answer":"g ≤ 3. Yes — 3 ≤ 3 is true."},{"form":"C","prompt":"Write an inequality for \"the ride requires more than 40 inches.\" Is 40 a solution?","answer":"h > 40. No — 40 > 40 is false."}],"extension":{"prompt":"A bus holds no more than 44 riders and already has 31. Write an inequality for how many more can board.","answer":"31 + r ≤ 44, so r ≤ 13."},"vocabulary":[{"term":"inequality","def":"A statement that one quantity is greater than, less than, or equal to another."},{"term":"at least","def":"Greater than or equal to (≥)."},{"term":"at most","def":"Less than or equal to (≤)."}],"frame":"The inequality is ___ because \"___\" means the boundary value ___ allowed."},{"id":"8-5","title":"Understand Inequalities and Their Solutions","standard":{"code":"6.EE.B.5","text":"Use substitution to determine whether a given number makes an inequality true."},"skills":[{"text":"Mark a boundary point on a number line and shade one direction","source":"8-4","is_elementary":false,"is_prior_g6":true},{"text":"Choose an open or closed circle from the symbol","source":"8-4","is_elementary":false,"is_prior_g6":true},{"text":"Substitute and test several candidate values","source":"8-1","is_elementary":false,"is_prior_g6":true},{"text":"Compare a value against the boundary number","source":"7-4","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"Describe the graph of x > 3 on a number line.","answer":"Open circle at 3; shade right","explanation":"Exclude 3 because the symbol is strict; values greater than 3 lie right.","mode":"review"},{"skill":2,"prompt":"For x ≤ 4, is the circle at 4 open or closed?","answer":"Closed","explanation":"The equality part includes the boundary value 4.","mode":"review"},{"skill":3,"prompt":"Which of 2, 5, 8 satisfy x ≥ 5?","answer":"5 and 8","explanation":"Both are at least 5; 2 is below the boundary.","mode":"review"},{"skill":4,"prompt":"Which is greater: -2 or -6?","answer":"-2","explanation":"-2 is farther right on the number line.","mode":"number"}],"quick_check":"Graph x ≥ 3. Open circle or closed? Is 3 itself a solution?","solution":"Graph x ≥ 3: Draw a solid closed circle at 3 and shade an arrow pointing to the right.<br>Circle type: Closed circle.<br>Is 3 a solution? Yes, because 3 ≥ 3 is true.","variants":[{"form":"B","prompt":"Graph x > 5. Open circle or closed? Is 5 itself a solution?","answer":"Open circle at 5, shade to the right. No — 5 > 5 is false."},{"form":"C","prompt":"Graph x ≤ −2. Open circle or closed? Is −2 itself a solution?","answer":"Closed circle at −2, shade to the left. Yes — −2 ≤ −2 is true."}],"extension":{"prompt":"Which of −1, 0, 4, and 4.5 satisfy x ≥ 4?","answer":"4 and 4.5. The values −1 and 0 are to the left of the boundary."},"vocabulary":[{"term":"boundary point","def":"The number named in the inequality, where the shading starts."},{"term":"open circle","def":"Marks a boundary that is not included (> or <)."},{"term":"closed circle","def":"Marks a boundary that is included (≥ or ≤)."}],"frame":"I used a ___ circle at ___ and shaded ___ because ___ makes the inequality ___ ."}]},{"number":9,"title":"Relationships Between Two Variables","lessons":[{"id":"9-1","title":"Explore Relationships Between Two Variables","standard":{"code":"6.EE.C.9","text":"Use variables to represent two quantities that change in relationship to one another."},"skills":[{"text":"Evaluate an expression for several input values","source":"6-5","is_elementary":false,"is_prior_g6":true},{"text":"Build a table of values from a rule","source":"3-3","is_elementary":false,"is_prior_g6":true},{"text":"Multiply a unit rate by a quantity","source":"3-2","is_elementary":false,"is_prior_g6":true},{"text":"Tell which quantity is chosen and which one responds","source":"Gr 6","is_elementary":true,"is_prior_g6":false}],"practice":[{"skill":1,"prompt":"Evaluate 4x + 1 when x = 3.","answer":"13","explanation":"Substitute 3: 4 × 3 + 1 = 13.","mode":"number"},{"skill":2,"prompt":"For y = 2x + 1, give y for x = 0, 1, 2 in that order.","answer":"1, 3, 5","explanation":"Substitute each input; the output grows by 2 per step.","mode":"review"},{"skill":3,"prompt":"Tickets cost $6 each. What is the cost in dollars of 7 tickets?","answer":"42","explanation":"Multiply the unit rate by the quantity: 6 × 7.","mode":"number"},{"skill":4,"prompt":"You choose how many notebooks to buy. The total cost changes with that number. Which quantity is independent?","answer":"Number of notebooks","explanation":"It is the input you choose; total cost depends on it.","mode":"review"}],"quick_check":"Songs cost $2 each. Which quantity is independent? Complete the table for 1, 2, and 3 songs.","solution":"Independent variable: Number of songs purchased (x).<br>Dependent variable: Total cost (y).<br>Table of values: (1 song, $2), (2 songs, $4), (3 songs, $6).","variants":[{"form":"B","prompt":"Stickers cost $4 each. Which quantity is independent? Complete the table for 1, 2, and 3 stickers.","answer":"Independent: number of stickers (x). Dependent: total cost (y). Table: (1, $4), (2, $8), (3, $12)."},{"form":"C","prompt":"A plant grows 5 cm per week. Which quantity is independent? Complete the table for 1, 2, and 3 weeks.","answer":"Independent: number of weeks (x). Dependent: height gained (y). Table: (1, 5), (2, 10), (3, 15)."}],"extension":{"prompt":"A gym charges a $20 join fee plus $15 per month. Is the total still a simple per-month rate? Explain.","answer":"No. The table does not start at (0, 0) — at 0 months the cost is $20. The rule is y = 15x + 20, not y = 15x."},"vocabulary":[{"term":"independent variable","def":"The quantity you choose; it goes on the x-axis."},{"term":"dependent variable","def":"The quantity that responds; it goes on the y-axis."},{"term":"table of values","def":"Paired inputs and outputs generated by a rule."}],"frame":"___ is independent because I choose it, and ___ depends on it because it changes when ___ changes."},{"id":"9-2","title":"Analyze Graphs of Relationships Between Two Variables","standard":{"code":"6.EE.C.9","text":"Analyze the relationship between the dependent and independent variables using graphs and tables."},"skills":[{"text":"Plot ordered pairs taken from a table","source":"3-4, 7-5","is_elementary":false,"is_prior_g6":true},{"text":"Read a point's coordinates off a graph","source":"7-5","is_elementary":false,"is_prior_g6":true},{"text":"Read the scale on each axis","source":"3-4","is_elementary":false,"is_prior_g6":true},{"text":"Extend a pattern to predict the next point","source":"3-3","is_elementary":false,"is_prior_g6":true}],"practice":[{"skill":1,"prompt":"A table has x = 3 and y = 12 in one row. Write its ordered pair.","answer":"(3, 12)","explanation":"Pair the x and y from the same row, with x first.","mode":"review"},{"skill":2,"prompt":"A graph point is 5 units right and 20 units up. Give its coordinates.","answer":"(5, 20)","explanation":"Coordinates report units, not a count of drawn tick marks.","mode":"review"},{"skill":3,"prompt":"A y-axis is labeled 0, 10, 20, 30. What value lies halfway between 10 and 20?","answer":"15","explanation":"Half of a 10-unit interval is 5; 10 + 5 = 15.","mode":"number"},{"skill":4,"prompt":"Continue the points (1, 4), (2, 8), (3, 12) using y = 4x. Give the point for x = 4.","answer":"(4, 16)","explanation":"Substitute x = 4 in the rule: y = 16.","mode":"review"}],"quick_check":"In (x, y), which value comes first? Read the point at 4 across and 12 up.","solution":"In (x, y), the x-value (horizontal coordinate) always comes first, followed by y (vertical coordinate).<br>Point coordinates: (4, 12).","variants":[{"form":"B","prompt":"In (x, y), which value comes first? Read the point at 3 across and 15 up.","answer":"The x-value comes first. The point is (3, 15)."},{"form":"C","prompt":"In (x, y), which axis is the independent variable on? Read the point at 6 across and 24 up.","answer":"The independent variable is on the horizontal x-axis. The point is (6, 24)."}],"extension":{"prompt":"A graph
