<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17406b" />
    <meta
      name="description"
      content="Optional Grade 6 math family practice tracker. Check off nights you practice together — online or printed. No grades."
    />
    <title>Weekly Family Practice — Neft Teacher</title>
    <link rel="stylesheet" href="./sheet.css" />
    <link rel="stylesheet" href="./weekly-sheet.css" />
  </head>
  <body>
    <a class="skip-link" href="#sheet">Skip to the sheet</a>

    <header class="wp-bar wp-screen">
      <a class="wp-back" href="/curriculum/family-connections/" id="wp-back">
        <span aria-hidden="true">←</span> <span data-t="back">Family Connections</span>
      </a>
      <div class="wp-lang" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="es" aria-pressed="false">Español</button>
      </div>
    </header>

    <main class="wp-main">
      <section class="wp-screen wp-controls" aria-labelledby="wp-heading">
        <h1 id="wp-heading" data-t="heading">Weekly Family Practice</h1>
        <p data-t="intro">
          Optional practice. No grades. A few minutes together helps.
        </p>
        <div class="wp-row">
          <label for="wp-week" data-t="weekLabel">Week</label>
          <select id="wp-week"></select>
        </div>
        <div class="wp-progress" id="wp-progress" role="status" aria-live="polite"></div>
        <section class="wp-replay" id="wp-replay" aria-labelledby="wp-replay-title" hidden></section>
        <div class="wp-actions">
          <a class="wp-btn wp-primary" id="wp-pdf" href="#" download data-t="pdf">Download this week (PDF)</a>
          <button type="button" class="wp-btn" id="wp-print" data-t="print">Print this week</button>
          <a class="wp-btn" id="wp-all" href="#" download data-t="all">Download every week (PDF)</a>
        </div>
        <p class="wp-privacy" data-t="privacy">
          Your checkmarks stay on this device. Nothing is sent to the school.
        </p>
      </section>

      <div id="sheet" class="wp-sheetwrap" tabindex="-1"></div>
    </main>

    <script type="module" src="./weekly-sheet.js"></script>
  </body>
</html>
