    <script type="application/json" id="tp-config">{"key":"challenge","title":{"en":"Unit 4 Test Practice · Challenge","es":"Práctica para el examen de la Unidad 4 · Desafío"},"pitch":{"en":"The same Unit 4 test skills with harder numbers: percents over 100%, percents under 1%, decimals in the answer, and multi-step claims.","es":"Las mismas destrezas del examen de la Unidad 4 con números más difíciles: porcentajes mayores que 100%, menores que 1%, decimales en la respuesta y afirmaciones de varios pasos."},"strands":{"tape":{"en":"Read a percent tape diagram","es":"Lee un diagrama de cinta de porcentajes","icon":"▭"},"combine":{"en":"Add fractions, decimals and percents","es":"Suma fracciones, decimales y porcentajes","icon":"➕"},"part":{"en":"Turn a part out of a whole into a percent","es":"Convierte una parte de un total en porcentaje","icon":"½"},"equiv":{"en":"Match equivalent values","es":"Relaciona valores equivalentes","icon":"＝"},"of":{"en":"Find a percent of a number","es":"Halla el porcentaje de un número","icon":"%"},"whole":{"en":"Find the whole","es":"Halla el total","icon":"▣"},"combine2":{"en":"Combine two parts of a whole","es":"Combina dos partes de un total","icon":"∑"},"estimate":{"en":"Estimate with benchmark percents","es":"Estima con porcentajes de referencia","icon":"≈"},"cr":{"en":"Show your thinking","es":"Muestra tu razonamiento","icon":"✎"}},"toolbox":[{"en":"Percent means “out of 100.” 100% is the whole.","es":"Porcentaje significa «de cada 100». El 100% es el total."},{"en":"10% → divide by 10. 1% → divide by 100. Build other percents from these.","es":"10% → divide entre 10. 1% → divide entre 100. Construye otros porcentajes a partir de estos."},{"en":"Benchmarks: 25% = [[1/4]], 50% = [[1/2]], 75% = [[3/4]], 100% = the whole.","es":"Referencias: 25% = [[1/4]], 50% = [[1/2]], 75% = [[3/4]], 100% = el total."},{"en":"Part = percent × whole. To find the whole, undo it: whole = part ÷ percent.","es":"Parte = porcentaje × total. Para hallar el total, deshaz la operación: total = parte ÷ porcentaje."},{"en":"Two groups? Add the parts and add the wholes first. Do not average the percents.","es":"¿Dos grupos? Primero suma las partes y suma los totales. No promedies los porcentajes."},{"en":"Check: is your answer more or less than the whole? Does that match the percent?","es":"Comprueba: ¿tu respuesta es mayor o menor que el total? ¿Coincide con el porcentaje?"}],"items":[{"id":"c-tape-1","strand":"tape","type":"tape","tape":{"whole":4,"shown":9},"q":{"en":"The top bar is 100%. What percent does the bottom bar show? The bottom bar is longer than the top bar.","es":"La barra de arriba es el 100%. ¿Qué porcentaje muestra la barra de abajo? La barra de abajo es más larga que la de arriba."},"unit":"%","answer":225,"traps":[{"value":9,"en":"9 is the number of boxes. Each box is worth 25%.","es":"9 es la cantidad de cuadros. Cada cuadro vale 25%."},{"value":25,"en":"25% is ONE box. Count all 9.","es":"25% es UN cuadro. Cuenta los 9."}],"hint":{"en":"One box = 100% ÷ 4. Count every box in the bottom bar, even the ones past the top bar.","es":"Un cuadro = 100% ÷ 4. Cuenta todos los cuadros de la barra de abajo, incluso los que pasan de la barra de arriba."},"why":{"en":"One box = 25%. 9 boxes = 9 × 25% = 225%. The bottom bar is more than the whole, so it is more than 100%.","es":"Un cuadro = 25%. 9 cuadros = 9 × 25% = 225%. La barra de abajo es mayor que el total, así que es más del 100%."}},{"id":"c-tape-2","strand":"tape","type":"tape","tape":{"whole":8,"shown":1,"tiny":true},"q":{"en":"The top bar is 100%. The bottom bar is one box that is the same size as one box of the top bar. What percent does it show? Your answer can be a decimal.","es":"La barra de arriba es el 100%. La barra de abajo es un cuadro del mismo tamaño que un cuadro de la barra de arriba. ¿Qué porcentaje muestra? Tu respuesta puede ser un decimal."},"unit":"%","answer":12.5,"traps":[{"value":1,"en":"1 is the number of boxes. How much is ONE box of 8 worth?","es":"1 es la cantidad de cuadros. ¿Cuánto vale UN cuadro de 8?"},{"value":8,"en":"8 is how many boxes are in the whole. One box is 100% ÷ 8.","es":"8 es la cantidad de cuadros del total. Un cuadro es 100% ÷ 8."}],"hint":{"en":"Share 100% equally among 8 boxes.","es":"Reparte el 100% en partes iguales entre 8 cuadros."},"why":{"en":"100% ÷ 8 = 12.5%.","es":"100% ÷ 8 = 12.5%."}},{"id":"c-tape-3","strand":"tape","type":"tape","tape":{"whole":5,"shown":7},"q":{"en":"The top bar is 100%. What percent does the bottom bar show? Enter the answer.","es":"La barra de arriba es el 100%. ¿Qué porcentaje muestra la barra de abajo? Escribe la respuesta."},"unit":"%","answer":140,"traps":[{"value":35,"en":"35% is 7 × 5. One box is 100% ÷ 5 = 20%, not 5%.","es":"35% es 7 × 5. Un cuadro es 100% ÷ 5 = 20%, no 5%."},{"value":7,"en":"7 is the number of boxes, not the percent.","es":"7 es la cantidad de cuadros, no el porcentaje."}],"hint":{"en":"One box = 100% ÷ 5. Multiply by the number of boxes in the bottom bar.","es":"Un cuadro = 100% ÷ 5. Multiplica por la cantidad de cuadros de la barra de abajo."},"why":{"en":"One box = 20%. 7 × 20% = 140%.","es":"Un cuadro = 20%. 7 × 20% = 140%."}},{"id":"c-combine-1","strand":"combine","type":"num","q":{"en":"A class collected 0.85 of its book goal in week 1, [[3/5]] of its goal in week 2, and 0.25 of its goal in week 3. What percent of the goal did the class collect in all? Enter the answer.","es":"Una clase reunió 0.85 de su meta de libros en la semana 1, [[3/5]] de su meta en la semana 2 y 0.25 de su meta en la semana 3. ¿Qué porcentaje de la meta reunió la clase en total? Escribe la respuesta."},"unit":"%","answer":170,"traps":[{"value":1.7,"en":"1.7 is the decimal form. The question asks for a percent: multiply by 100.","es":"1.7 es la forma decimal. La pregunta pide un porcentaje: multiplica por 100."}],"hint":{"en":"Convert all three to percents: 0.85 = 85%, [[3/5]] = 60%, 0.25 = 25%. The total can be more than 100%.","es":"Convierte los tres a porcentajes: 0.85 = 85%, [[3/5]] = 60%, 0.25 = 25%. El total puede ser más del 100%."},"why":{"en":"85% + 60% + 25% = 170%. The class went past its goal.","es":"85% + 60% + 25% = 170%. La clase superó su meta."}},{"id":"c-combine-2","strand":"combine","type":"num","q":{"en":"In a library, [[1/8]] of the books are poetry, 0.045 are comics, and [[2/5]] are mysteries. What percent of the books are one of these three kinds? Your answer can be a decimal.","es":"En una biblioteca, [[1/8]] de los libros son de poesía, 0.045 son cómics y [[2/5]] son de misterio. ¿Qué porcentaje de los libros es de uno de estos tres tipos? Tu respuesta puede ser un decimal."},"unit":"%","answer":57,"traps":[{"value":52.5,"en":"0.045 is 4.5%, not 0.045 percent. Move the decimal point two places to the right.","es":"0.045 es 4.5%, no 0.045 por ciento. Mueve el punto decimal dos lugares a la derecha."}],"hint":{"en":"[[1/8]] = 0.125 = 12.5%. 0.045 = 4.5%. [[2/5]] = 40%.","es":"[[1/8]] = 0.125 = 12.5%. 0.045 = 4.5%. [[2/5]] = 40%."},"why":{"en":"12.5% + 4.5% + 40% = 57%.","es":"12.5% + 4.5% + 40% = 57%."}},{"id":"c-part-1","strand":"part","type":"num","q":{"en":"In a poll, 3 out of 8 students chose soccer as their favorite sport. What percent of the students chose soccer? Enter the answer.","es":"En una encuesta, 3 de 8 estudiantes eligieron el fútbol como su deporte favorito. ¿Qué porcentaje de los estudiantes eligió el fútbol? Escribe la respuesta."},"unit":"%","answer":37.5,"traps":[{"value":37,"en":"Close. 3 ÷ 8 = 0.375, so the percent is 37.5%.","es":"Casi. 3 ÷ 8 = 0.375, así que el porcentaje es 37.5%."}],"hint":{"en":"[[1/8]] = 12.5%. Or divide 3 ÷ 8 and move the decimal two places.","es":"[[1/8]] = 12.5%. O divide 3 ÷ 8 y mueve el decimal dos lugares."},"why":{"en":"[[3/8]] = 3 × 12.5% = 37.5%.","es":"[[3/8]] = 3 × 12.5% = 37.5%."}},{"id":"c-part-2","strand":"part","type":"num","q":{"en":"A video has been played 7 times out of every 40 views in a class. 7 out of 40 views is what percent? Your answer can be a decimal.","es":"En una clase, un video se reprodujo 7 veces de cada 40 visitas. ¿7 de 40 visitas es qué porcentaje? Tu respuesta puede ser un decimal."},"unit":"%","answer":17.5,"traps":[{"value":17,"en":"Close. 7 ÷ 40 = 0.175, so the percent is 17.5%.","es":"Casi. 7 ÷ 40 = 0.175, así que el porcentaje es 17.5%."}],"hint":{"en":"[[1/40]] = 2.5%. Multiply by 7.","es":"[[1/40]] = 2.5%. Multiplica por 7."},"why":{"en":"100% ÷ 40 = 2.5%, and 7 × 2.5% = 17.5%.","es":"100% ÷ 40 = 2.5% y 7 × 2.5% = 17.5%."}},{"id":"c-part-3","strand":"part","type":"num","q":{"en":"A bakery planned to bake 6 trays of bread and baked 9 trays. The trays baked are what percent of the trays planned? Enter the answer.","es":"Una panadería planeó hornear 6 bandejas de pan e hizo 9 bandejas. ¿Las bandejas horneadas son qué porcentaje de las bandejas planeadas? Escribe la respuesta."},"unit":"%","answer":150,"traps":[{"value":67,"en":"67% is [[6/9]]. The whole is the PLANNED amount, 6, so divide 9 by 6.","es":"67% es [[6/9]]. El total es lo PLANEADO, 6, así que divide 9 entre 6."},{"value":66.67,"en":"That is [[6/9]]. The whole is the PLANNED amount, 6.","es":"Eso es [[6/9]]. El total es lo PLANEADO, 6."}],"hint":{"en":"Which number is the whole? The part can be bigger than the whole.","es":"¿Cuál número es el total? La parte puede ser mayor que el total."},"why":{"en":"[[9/6]] = 1.5 = 150%.","es":"[[9/6]] = 1.5 = 150%."}},{"id":"c-equiv-1","strand":"equiv","type":"multi","q":{"en":"Which show equivalent values? Choose all that apply.","es":"¿Cuáles muestran valores equivalentes? Elige todas las que correspondan."},"options":[{"text":"0.5% and 0.005","ok":true,"note":{"en":"0.5% = 0.5 ÷ 100 = 0.005.","es":"0.5% = 0.5 ÷ 100 = 0.005."}},{"text":"0.5% and [[1/2]]","ok":false,"note":{"en":"[[1/2]] = 50%. Half of one percent is 0.5%.","es":"[[1/2]] = 50%. La mitad de un por ciento es 0.5%."}},{"text":"450% and 4.5","ok":true,"note":{"en":"450% = 450 ÷ 100 = 4.5.","es":"450% = 450 ÷ 100 = 4.5."}},{"text":"[[7/8]] and 87.5%","ok":true,"note":{"en":"[[7/8]] = 7 × 12.5% = 87.5%.","es":"[[7/8]] = 7 × 12.5% = 87.5%."}},{"text":"6% and 0.6","ok":false,"note":{"en":"6% = 0.06. The decimal 0.6 is 60%.","es":"6% = 0.06. El decimal 0.6 es 60%."}},{"text":"1.25 and 125%","ok":true,"note":{"en":"1.25 × 100 = 125%.","es":"1.25 × 100 = 125%."}}],"hint":{"en":"Turn every value into a decimal and compare.","es":"Convierte cada valor en decimal y compara."},"why":{"en":"Equivalent pairs: 0.5% and 0.005; 450% and 4.5; [[7/8]] and 87.5%; 1.25 and 125%.","es":"Pares equivalentes: 0.5% y 0.005; 450% y 4.5; [[7/8]] y 87.5%; 1.25 y 125%."}},{"id":"c-equiv-2","strand":"equiv","type":"multi","q":{"en":"Which show equivalent values? Choose all that apply.","es":"¿Cuáles muestran valores equivalentes? Elige todas las que correspondan."},"options":[{"text":"0.04% and 0.0004","ok":true,"note":{"en":"0.04% = 0.04 ÷ 100 = 0.0004.","es":"0.04% = 0.04 ÷ 100 = 0.0004."}},{"text":"0.04% and 0.04","ok":false,"note":{"en":"0.04 is 4%. 0.04% is 0.0004.","es":"0.04 es 4%. 0.04% es 0.0004."}},{"text":"330% and 3.3","ok":true,"note":{"en":"330% = 3.30.","es":"330% = 3.30."}},{"text":"[[5/40]] and 12.5%","ok":true,"note":{"en":"[[5/40]] = [[1/8]] = 12.5%.","es":"[[5/40]] = [[1/8]] = 12.5%."}},{"text":"0.2 and 2%","ok":false,"note":{"en":"0.2 = 20%. The decimal for 2% is 0.02.","es":"0.2 = 20%. El decimal de 2% es 0.02."}},{"text":"8% and [[2/25]]","ok":true,"note":{"en":"[[2/25]] = [[8/100]] = 8%.","es":"[[2/25]] = [[8/100]] = 8%."}}],"hint":{"en":"Write each value as hundredths, or as a decimal, before you compare.","es":"Escribe cada valor en centésimos, o como decimal, antes de comparar."},"why":{"en":"Equivalent pairs: 0.04% and 0.0004; 330% and 3.3; [[5/40]] and 12.5%; 8% and [[2/25]].","es":"Pares equivalentes: 0.04% y 0.0004; 330% y 3.3; [[5/40]] y 12.5%; 8% y [[2/25]]."}},{"id":"c-of-1","strand":"of","type":"num","q":{"en":"A fundraiser has a goal of $360. In the first hour it raises 12.5% of the goal. How many dollars is that? Enter the answer.","es":"Una colecta tiene una meta de $360. En la primera hora reúne el 12.5% de la meta. ¿Cuántos dólares es eso? Escribe la respuesta."},"unit":"$","answer":45,"traps":[{"value":4500,"en":"Use 12.5% as 0.125, not 12.5.","es":"Usa 12.5% como 0.125, no como 12.5."}],"hint":{"en":"12.5% = [[1/8]]. Find one eighth of 360.","es":"12.5% = [[1/8]]. Halla un octavo de 360."},"why":{"en":"360 ÷ 8 = 45. 12.5% of $360 is $45.","es":"360 ÷ 8 = 45. El 12.5% de $360 es $45."}},{"id":"c-of-2","strand":"of","type":"num","q":{"en":"A recipe calls for 48 grams of flour. A bigger batch uses 175% of that amount. How many grams of flour does the bigger batch use? Enter the answer.","es":"Una receta lleva 48 gramos de harina. Una tanda más grande usa el 175% de esa cantidad. ¿Cuántos gramos de harina usa la tanda más grande? Escribe la respuesta."},"unit":"","answer":84,"traps":[{"value":36,"en":"36 is 75% of 48. 175% is more than 100%, so the answer is more than 48.","es":"36 es el 75% de 48. El 175% es más del 100%, así que la respuesta es mayor que 48."}],"hint":{"en":"175% = 100% + 75%. 75% is [[3/4]].","es":"175% = 100% + 75%. El 75% es [[3/4]]."},"why":{"en":"100% of 48 = 48 and 75% of 48 = 36. 48 + 36 = 84 grams.","es":"100% de 48 = 48 y 75% de 48 = 36. 48 + 36 = 84 gramos."}},{"id":"c-of-3","strand":"of","type":"num","q":{"en":"A school has 800 students. 0.5% of the students are absent today. How many students are absent? Enter the answer.","es":"Una escuela tiene 800 estudiantes. El 0.5% de los estudiantes está ausente hoy. ¿Cuántos estudiantes están ausentes? Escribe la respuesta."},"unit":"","answer":4,"traps":[{"value":400,"en":"400 is 50% of 800. 0.5% is much smaller: half of ONE percent.","es":"400 es el 50% de 800. El 0.5% es mucho menor: la mitad de UN por ciento."}],"hint":{"en":"1% of 800 = 8. 0.5% is half of that.","es":"El 1% de 800 = 8. El 0.5% es la mitad de eso."},"why":{"en":"1% of 800 = 8, so 0.5% = 4 students.","es":"1% de 800 = 8, así que 0.5% = 4 estudiantes."}},{"id":"c-whole-1","strand":"whole","type":"num","q":{"en":"250% of what number is 90? Enter the answer.","es":"¿El 250% de qué número es 90? Escribe la respuesta."},"unit":"","answer":36,"traps":[{"value":225,"en":"225 is 250% OF 90. The question asks for the number whose 250% is 90.","es":"225 es el 250% DE 90. La pregunta pide el número cuyo 250% es 90."}],"hint":{"en":"250% = 2.5 times the number. Divide 90 by 2.5.","es":"250% = 2.5 veces el número. Divide 90 entre 2.5."},"why":{"en":"2.5 × (the number) = 90, so the number is 90 ÷ 2.5 = 36.","es":"2.5 × (el número) = 90, así que el número es 90 ÷ 2.5 = 36."}},{"id":"c-whole-2","strand":"whole","type":"num","q":{"en":"0.5% of what number is 6? Enter the answer.","es":"¿El 0.5% de qué número es 6? Escribe la respuesta."},"unit":"","answer":1200,"traps":[{"value":0.03,"en":"0.03 is 0.5% OF 6. Here 6 is the small part, so the whole is large.","es":"0.03 es el 0.5% DE 6. Aquí 6 es la parte pequeña, así que el total es grande."}],"hint":{"en":"If 0.5% is 6, then 1% is 12. How much is 100%?","es":"Si el 0.5% es 6, el 1% es 12. ¿Cuánto es el 100%?"},"why":{"en":"0.5% = 6, so 1% = 12 and 100% = 12 × 100 = 1,200.","es":"0.5% = 6, así que 1% = 12 y 100% = 12 × 100 = 1,200."}},{"id":"c-whole-3","strand":"whole","type":"num","q":{"en":"A hoodie is on sale for 20% off. The sale price is $64. What was the original price of the hoodie? Enter the answer.","es":"Una sudadera está en oferta con 20% de descuento. El precio de oferta es $64. ¿Cuál era el precio original de la sudadera? Escribe la respuesta."},"unit":"$","answer":80,"traps":[{"value":76.8,"en":"That adds 20% to $64. But the $64 is already 80% of the original, not 100%.","es":"Eso suma 20% a $64. Pero los $64 ya son el 80% del original, no el 100%."},{"value":84,"en":"That adds $20 to $64. Percents are not dollars.","es":"Eso suma $20 a $64. Los porcentajes no son dólares."}],"hint":{"en":"After 20% off, you pay what percent of the original? $64 is that percent.","es":"Después de 20% de descuento, ¿qué porcentaje del original pagas? $64 es ese porcentaje."},"why":{"en":"$64 is 80% of the original. 10% = $8, so 100% = $80.","es":"$64 es el 80% del original. El 10% = $8, así que el 100% = $80."}},{"id":"c-whole-4","strand":"whole","type":"mc","q":{"en":"A theater sold 52 tickets for tonight. 35% of the tickets are still unsold. How many tickets are there in all? Choose the correct answer.","es":"Un teatro vendió 52 boletos para esta noche. El 35% de los boletos sigue sin venderse. ¿Cuántos boletos hay en total? Elige la respuesta correcta."},"options":[{"text":"18","ok":false,"note":{"en":"18 is about 35% OF 52. 52 is not the whole.","es":"18 es aproximadamente el 35% DE 52. 52 no es el total."}},{"text":"87","ok":false,"note":{"en":"87 = 52 + 35. Do not add a percent to a count.","es":"87 = 52 + 35. No sumes un porcentaje a una cantidad."}},{"text":"80","ok":true,"note":{"en":"52 is 65% of 80. ✓","es":"52 es el 65% de 80. ✓"}},{"text":"149","ok":false,"note":{"en":"149 treats 52 as the 35%. 52 tickets are the 65% that sold.","es":"149 trata 52 como el 35%. Los 52 boletos son el 65% que se vendió."}}],"hint":{"en":"If 35% are unsold, 52 is what percent of all the tickets?","es":"Si el 35% no se vendió, ¿52 es qué porcentaje de todos los boletos?"},"why":{"en":"Sold = 100% − 35% = 65%. 65% = 52, so 5% = 4 and 100% = 80 tickets.","es":"Vendidos = 100% − 35% = 65%. 65% = 52, así que 5% = 4 y 100% = 80 boletos."}},{"id":"c-combine2-1","strand":"combine2","type":"num","q":{"en":"A team made 11 of 20 shots in Game 1, 19 of 30 shots in Game 2, and 14 of 50 shots in Game 3. What percent of all its shots did the team make? Enter the answer.","es":"Un equipo encestó 11 de 20 tiros en el Juego 1, 19 de 30 tiros en el Juego 2 y 14 de 50 tiros en el Juego 3. ¿Qué porcentaje de todos sus tiros encestó el equipo? Escribe la respuesta."},"unit":"%","answer":44,"traps":[{"value":4877.777767,"en":"That averages the three game percents. The games had different numbers of shots, so add the makes and the shots first.","es":"Eso promedia los porcentajes de los tres juegos. Los juegos tuvieron distinta cantidad de tiros, así que suma primero los encestes y los tiros."}],"hint":{"en":"Add all the made shots. Add all the shots taken. Then make a percent.","es":"Suma todos los tiros encestados. Suma todos los tiros intentados. Luego calcula el porcentaje."},"why":{"en":"Made: 11 + 19 + 14 = 44. Taken: 20 + 30 + 50 = 100. [[44/100]] = 44%.","es":"Encestados: 11 + 19 + 14 = 44. Intentados: 20 + 30 + 50 = 100. [[44/100]] = 44%."}},{"id":"c-combine2-2","strand":"combine2","type":"num","q":{"en":"On Quiz 1, Mateo got 18 of 24 points. On Quiz 2, he got 12 of 36 points. What percent of all the possible points did Mateo earn? Your answer can be a decimal.","es":"En el Examen 1, Mateo obtuvo 18 de 24 puntos. En el Examen 2, obtuvo 12 de 36 puntos. ¿Qué porcentaje de todos los puntos posibles obtuvo Mateo? Tu respuesta puede ser un decimal."},"unit":"%","answer":50,"traps":[{"value":54.166667,"en":"That averages 75% and 33.3…%. The quizzes are worth different points, so add the points first.","es":"Eso promedia 75% y 33.3…%. Los exámenes valen distintos puntos, así que suma primero los puntos."}],"hint":{"en":"Points earned ÷ points possible, across both quizzes.","es":"Puntos obtenidos ÷ puntos posibles, en los dos exámenes."},"why":{"en":"Earned: 18 + 12 = 30. Possible: 24 + 36 = 60. [[30/60]] = 50%.","es":"Obtenidos: 18 + 12 = 30. Posibles: 24 + 36 = 60. [[30/60]] = 50%."}},{"id":"c-estimate-1","strand":"estimate","type":"mc","q":{"en":"Of 603 voters, 148 chose Option A. Which benchmark percent is closest to the share who chose Option A?","es":"De 603 votantes, 148 eligieron la Opción A. ¿Qué porcentaje de referencia está más cerca de la parte que eligió la Opción A?"},"options":[{"text":"10%","ok":false,"note":{"en":"10% of 603 is about 60. 148 is more than double that.","es":"El 10% de 603 es aproximadamente 60. 148 es más del doble."}},{"text":"25%","ok":true,"note":{"en":"603 ≈ 600 and 25% of 600 is 150, close to 148. ✓","es":"603 ≈ 600 y el 25% de 600 es 150, cerca de 148. ✓"}},{"text":"50%","ok":false,"note":{"en":"50% of 603 is about 300. That is double 148.","es":"El 50% de 603 es aproximadamente 300. Eso es el doble de 148."}},{"text":"75%","ok":false,"note":{"en":"75% of 603 is about 450. Far too large.","es":"El 75% de 603 es aproximadamente 450. Es demasiado."}}],"hint":{"en":"Round 603 to 600. What is [[1/4]] of 600?","es":"Redondea 603 a 600. ¿Cuánto es [[1/4]] de 600?"},"why":{"en":"603 ≈ 600. [[1/4]] of 600 = 150 ≈ 148. About 25%.","es":"603 ≈ 600. [[1/4]] de 600 = 150 ≈ 148. Aproximadamente 25%."}},{"id":"c-estimate-2","strand":"estimate","type":"mc","q":{"en":"A meal costs $59.75. About how much is a 20% tip? Choose the best estimate.","es":"Una comida cuesta $59.75. ¿Aproximadamente cuánto es una propina del 20%? Elige la mejor estimación."},"options":[{"text":"$6","ok":false,"note":{"en":"$6 is about 10%. 20% is double that.","es":"$6 es aproximadamente el 10%. El 20% es el doble."}},{"text":"$12","ok":true,"note":{"en":"$59.75 ≈ $60. 10% = $6, so 20% = $12. ✓","es":"$59.75 ≈ $60. El 10% = $6, así que el 20% = $12. ✓"}},{"text":"$15","ok":false,"note":{"en":"$15 is 25% of $60.","es":"$15 es el 25% de $60."}},{"text":"$20","ok":false,"note":{"en":"$20 is about one third of $60.","es":"$20 es aproximadamente un tercio de $60."}}],"hint":{"en":"Round to $60. Find 10%, then double it.","es":"Redondea a $60. Halla el 10% y luego duplícalo."},"why":{"en":"$59.75 ≈ $60. 10% of $60 = $6. 20% = 2 × $6 = $12.","es":"$59.75 ≈ $60. El 10% de $60 = $6. El 20% = 2 × $6 = $12."}},{"id":"c-cr-1","strand":"cr","type":"cr","story":{"en":"Three schools reported their enrollment last year. Since then, two of them changed.","es":"Tres escuelas informaron su matrícula del año pasado. Desde entonces, dos cambiaron."},"table":{"head":[{"en":"School","es":"Escuela"},{"en":"Students last year","es":"Estudiantes el año pasado"}],"rows":[["Birch","140"],["Cedar","360"],["Elm","200"]]},"q":{"en":"This year, Birch enrollment went up 25% and Cedar enrollment went down 20%. A reporter claims that Cedar now has at least 100 more students than Birch. Determine whether the reporter's claim is correct.","es":"Este año, la matrícula de Birch subió 25% y la de Cedar bajó 20%. Un reportero afirma que Cedar ahora tiene al menos 100 estudiantes más que Birch. Determina si la afirmación del reportero es correcta."},"steps":[{"label":{"en":"How many students does Birch have this year?","es":"¿Cuántos estudiantes tiene Birch este año?"},"answer":175,"unit":""},{"label":{"en":"How many students does Cedar have this year?","es":"¿Cuántos estudiantes tiene Cedar este año?"},"answer":288,"unit":""},{"label":{"en":"How many MORE students does Cedar have than Birch?","es":"¿Cuántos estudiantes MÁS tiene Cedar que Birch?"},"answer":113,"unit":""}],"claim":{"en":"The reporter says: “Cedar has at least 100 more students than Birch.” Is the claim correct?","es":"El reportero dice: «Cedar tiene al menos 100 estudiantes más que Birch». ¿Es correcta la afirmación?","truth":true},"rubric":[{"en":"I used 125% for the increase and 80% for the decrease.","es":"Usé 125% para el aumento y 80% para la disminución."},{"en":"I showed the percent relationships in a table, tape diagram, or double number line.","es":"Mostré las relaciones de porcentaje en una tabla, un diagrama de cinta o una recta numérica doble."},{"en":"I found 175 and 288 and the difference, 113.","es":"Hallé 175 y 288 y la diferencia, 113."},{"en":"I said the claim is correct because 113 is at least 100.","es":"Dije que la afirmación es correcta porque 113 es al menos 100."}],"model":{"en":"Birch: 125% of 140 = 175. Cedar: 80% of 360 = 288. 288 − 175 = 113. The claim is correct, because 113 is at least 100.","es":"Birch: 125% de 140 = 175. Cedar: 80% de 360 = 288. 288 − 175 = 113. La afirmación es correcta, porque 113 es al menos 100."},"hint":{"en":"Up 25% means 125% of last year. Down 20% means 80% of last year. Elm did not change.","es":"Subir 25% significa 125% del año pasado. Bajar 20% significa 80% del año pasado. Elm no cambió."},"why":{"en":"125% of 140 = 175. 80% of 360 = 288. 288 − 175 = 113 ≥ 100.","es":"125% de 140 = 175. 80% de 360 = 288. 288 − 175 = 113 ≥ 100."}},{"id":"c-cr-2","strand":"cr","type":"cr","story":{"en":"Lena needs $480 for a trip. She has saved $290.","es":"Lena necesita $480 para un viaje. Ha ahorrado $290."},"q":{"en":"Lena says she has saved about 75% of the money she needs. Determine whether Lena's estimate is reasonable. Use benchmark percents, fractions, a table, a tape diagram, or a double number line to support your conclusion.","es":"Lena dice que ha ahorrado aproximadamente el 75% del dinero que necesita. Determina si la estimación de Lena es razonable. Usa porcentajes de referencia, fracciones, una tabla, un diagrama de cinta o una recta numérica doble para apoyar tu conclusión."},"steps":[{"label":{"en":"What is 75% of $480?","es":"¿Cuánto es el 75% de $480?"},"answer":360,"unit":"$"},{"label":{"en":"What is 50% of $480?","es":"¿Cuánto es el 50% de $480?"},"answer":240,"unit":"$"}],"claim":{"en":"Is Lena's estimate of “about 75%” reasonable?","es":"¿Es razonable la estimación de Lena de «aproximadamente 75%»?","truth":false},"rubric":[{"en":"I found benchmark amounts: 75% of $480 = $360 and 50% of $480 = $240.","es":"Hallé cantidades de referencia: 75% de $480 = $360 y 50% de $480 = $240."},{"en":"I compared $290 to both and saw it is closer to $240 than to $360.","es":"Comparé $290 con ambas y vi que está más cerca de $240 que de $360."},{"en":"I said the estimate is not reasonable and gave a better estimate (about 60%).","es":"Dije que la estimación no es razonable y di una mejor (aproximadamente 60%)."}],"model":{"en":"75% of $480 = $360, but Lena has only $290. 50% of $480 = $240, and $290 is closer to $240 than to $360. About 60% is a better estimate, so “about 75%” is not reasonable.","es":"El 75% de $480 = $360, pero Lena solo tiene $290. El 50% de $480 = $240 y $290 está más cerca de $240 que de $360. Aproximadamente 60% es una mejor estimación, así que «aproximadamente 75%» no es razonable."},"hint":{"en":"Find 75% of $480 and compare it with $290.","es":"Halla el 75% de $480 y compáralo con $290."},"why":{"en":"75% of $480 = $360, which is $70 more than $290. The estimate is too high.","es":"El 75% de $480 = $360, que es $70 más que $290. La estimación es demasiado alta."}}],"links":"\u003ca href=\"/curriculum/unit-4-test-practice/\">Practice version · Versión de práctica\u003c/a> · \u003ca href=\"/curriculum/units/?u=4#unit-4\">Unit 4 · Unidad 4\u003c/a> · \u003ca href=\"/curriculum/unit-4-test-review/\">Family Test Review\u003c/a> · \u003ca href=\"/curriculum/unit-4-adventure-review/\">The Hundred Lanterns\u003c/a>"}</script>
