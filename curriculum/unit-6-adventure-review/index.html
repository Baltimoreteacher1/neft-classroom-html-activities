<style>
/* Grade 6 Review Expeditions — tokens, base, buttons, inputs, modals, toasts */
:root {
  --navy: #17324D; --navy-deep: #0F2238; --navy-2: #274A6A; --teal: #1FA6A2; --teal-deep: #15807D; --teal-soft: #DFF2EE;

  --ok: #1E8E5A; --ok-soft: #E3F5EA; --bad: #C8553D; --bad-soft: #FBE9E4; --warn-soft: #FFF4D6;
  --radius: 14px; --radius-sm: 9px; --shadow: 0 10px 30px rgba(15, 34, 56, .18), 0 2px 6px rgba(15, 34, 56, .08); --shadow-sm: 0 2px 8px rgba(15, 34, 56, .10);
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;

}
html.large-text { --fs: 19px; }
html.dyslexic body { letter-spacing: .03em; word-spacing: .08em; line-height: 1.7; }
html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; } }

*, *::before, *::after { box-sizing: border-box; }
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); line-height: 1.5; background: var(--navy-deep); background-image: radial-gradient(1200px 600px at 80% -10%, rgba(31, 166, 162, .22), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(59, 111, 182, .25), transparent 60%); min-height: 100vh; overflow-x: hidden; }

.muted { color: var(--ink-soft); }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; font-weight: 700; color: var(--teal-deep); margin-bottom: .5em; }

.skip:focus { left: 8px; }
.noscript { color: #fff; padding: 2rem; text-align: center; }
:focus-visible { outline: none; box-shadow: var(--focus); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; font: inherit; font-weight: 700; font-size: .95rem; padding: .7em 1.2em; border-radius: 999px; border: 2px solid transparent; cursor: pointer; min-height: 44px; transition: transform .12s ease, box-shadow .12s ease, background .12s ease; user-select: none; white-space: nowrap; }

.modal-wide { width: min(820px, 100%); }

.modal-head .ic { width: 1.2em; height: 1.2em; color: var(--teal-deep); }
.modal-x { background: none; border: 0; cursor: pointer; padding: 8px; border-radius: 50%; color: var(--ink-soft); display: inline-flex; min-width: 40px; min-height: 40px; align-items: center; justify-content: center; }
.modal-x:hover { background: var(--paper-2); color: var(--ink); } .modal-x .ic { width: 20px; height: 20px; }

.modal-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 22px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }

/* Toast */
#toast-root { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--navy); color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: all .25s ease; font-weight: 600; font-size: .95rem; display: flex; align-items: center; gap: .5em; }
.toast.show { opacity: 1; transform: none; }
.toast.warn { background: var(--amber-deep); color: var(--navy); } .toast.ok { background: var(--ok); } .toast.ach { background: var(--amber); color: var(--navy); }
.toast .ic { width: 1.2em; height: 1.2em; }

@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } } @keyframes fadeOut { to { opacity: 0 } }
@keyframes popIn { from { transform: translateY(12px) scale(.98); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes shake { 10%, 90% { transform: translateX(-2px) } 30%, 70% { transform: translateX(3px) } 50% { transform: translateX(-3px) } }
.shake { animation: shake .4s ease; }

</style>
<style>

/* Grade 6 Review Expeditions — shared utilities (pure, usable in browser and Node). */
(function (root) {
  'use strict';

  /** Mulberry32 seeded PRNG. Returns function () -> [0,1). */
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const R = {
    make(seed) {
      const next = rng(seed);
      const api = {
        next,
        int(lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
        pick(arr) { return arr[Math.floor(next() * arr.length)]; },
        pickN(arr, n) { return api.shuffle(arr).slice(0, n); },
        shuffle(arr) {
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(next() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];

        chance(p) { return next() < p; },
      };
      return api;
    },
  };

    return String(round(n, 3));
  }
  function plural(n, one, many) { return n === 1 ? one : (many || one + 's'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  /** Parse a student-typed number. Accepts "1,200", "$5.65", "3/4", " 7 ". Returns null if invalid. */
  function parseNum(s) {
    if (s == null) return null;
    let t = String(s).trim().replace(/[$,\s]/g, '');
    if (!t) return null;

    if (Array.isArray(answer)) return { options: out, answers: answer.map((a) => idx.indexOf(a)).sort((x, y) => x - y) };
    return { options: out, answer: idx.indexOf(answer) };

    let s = `<svg class="viz-dot" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Dot plot')}">`;
    s += `<line x1="${padL - 10}" y1="${baseY}" x2="${w - padR + 10}" y2="${baseY}" stroke="${C.axis}" stroke-width="2.5"/>`;
    const n = Math.round((max - min) / step);
    for (let i = 0; i <= n; i++) {
      const v = min + i * step;
      s += `<line x1="${x(v)}" y1="${baseY - 5}" x2="${x(v)}" y2="${baseY + 5}" stroke="${C.axis}" stroke-width="1.5"/><text x="${x(v)}" y="${baseY + 20}" font-size="12" text-anchor="middle" fill="${C.text}">${fmtN(v)}</text>`;
    }
    Object.keys(counts).forEach((k) => {
      const v = Number(k);
      for (let i = 0; i < counts[k]; i++) s += `<circle cx="${x(v)}" cy="${baseY - 12 - i * rowH}" r="${r}" fill="${o.color || C.a}" stroke="#fff" stroke-width="1.5"/>`;
    });
    if (o.label) s += `<text x="${w / 2}" y="${h - 6}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(o.label)}</text>`;
    return s + '</svg>';
  }

  /** Histogram. o: {bins:[{label,count}], yMax, yStep, xLabel, yLabel, color, size} */
  function histogram(o) {
    const bins = o.bins,
      yMax = o.yMax || Math.max(...bins.map((b) => b.count)) + 1,
      ys = o.yStep || 1;
    const w = o.width || 420,
      h = o.height || 260,
      pad = { l: 46, r: 14, t: 14, b: 58 };
    const bw = (w - pad.l - pad.r) / bins.length;
    const y = (v) => h - pad.b - (v / yMax) * (h - pad.t - pad.b);
    let s = `<svg class="viz-hist" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Histogram')}">`;
    for (let v = 0; v <= yMax; v += ys)
      s += `<line x1="${pad.l}" y1="${y(v)}" x2="${w - pad.r}" y2="${y(v)}" stroke="${C.grid}"/><text x="${pad.l - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="${C.text}">${v}</text>`;
    bins.forEach((b, i) => {
      const x0 = pad.l + i * bw;
      s += `<rect x="${x0 + 1}" y="${y(b.count)}" width="${bw - 2}" height="${y(0) - y(b.count)}" fill="${b.color || o.color || C.c}" stroke="#fff" stroke-width="1.5"/>`;
      if (b.count && o.showCounts !== false) s += `<text x="${x0 + bw / 2}" y="${y(b.count) - 4}" font-size="11" font-weight="700" text-anchor="middle" fill="${C.text}">${b.count}</text>`;
      s += `<text x="${x0 + bw / 2}" y="${y(0) + 16}" font-size="11" text-anchor="middle" fill="${C.text}">${esc(b.label)}</text>`;
    });
    s += `<line x1="${pad.l}" y1="${y(0)}" x2="${w - pad.r}" y2="${y(0)}" stroke="${C.axis}" stroke-width="2"/><line x1="${pad.l}" y1="${y(0)}" x2="${pad.l}" y2="${y(yMax)}" stroke="${C.axis}" stroke-width="2"/>`;
    if (o.xLabel) s += `<text x="${(pad.l + w - pad.r) / 2}" y="${h - 8}" font-size="12" font-weight="600" text-anchor="middle" fill="${C.text}">${esc(o.xLabel)}</text>`;
    if (o.yLabel) s += `<text transform="translate(12 ${(y(0) + y(yMax)) / 2}) rotate(-90)" font-size="12" font-weight="600" text-anchor="middle" fill="${C.text}">${esc(o.yLabel)}</text>`;
    return s + '</svg>';
  }

  /** Box plot(s) over one number line. o: {plots:[{min,q1,med,q3,max,label,color}], lineMin, lineMax, step, labelEvery, title} */
  function boxPlot(o) {
    const plots = o.plots || [o];
    const lineMin = o.lineMin,
      lineMax = o.lineMax,
      step = o.step || 1,
      le = o.labelEvery || step;
    const w = o.width || 500,
      padL = 70,
      padR = 24,
      rowH = 54,
      baseY = 20 + plots.length * rowH,
      h = baseY + 44;
    const x = (v) => padL + ((v - lineMin) / (lineMax - lineMin)) * (w - padL - padR);
    let s = `<svg class="viz-box" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Box plot')}">`;
    plots.forEach((p, i) => {
      const cy = 20 + i * rowH + 22,
        bh = 26,
        col = p.color || [C.a, C.b, C.c][i % 3];
      s += `<line x1="${x(p.min)}" y1="${cy}" x2="${x(p.q1)}" y2="${cy}" stroke="${col}" stroke-width="2.5"/><line x1="${x(p.q3)}" y1="${cy}" x2="${x(p.max)}" y2="${cy}" stroke="${col}" stroke-width="2.5"/>`;
      s += `<line x1="${x(p.min)}" y1="${cy - 9}" x2="${x(p.min)}" y2="${cy + 9}" stroke="${col}" stroke-width="2.5"/><line x1="${x(p.max)}" y1="${cy - 9}" x2="${x(p.max)}" y2="${cy + 9}" stroke="${col}" stroke-width="2.5"/>`;
      s += `<rect x="${x(p.q1)}" y="${cy - bh / 2}" width="${x(p.q3) - x(p.q1)}" height="${bh}" fill="${col}" fill-opacity=".2" stroke="${col}" stroke-width="2.5"/><line x1="${x(p.med)}" y1="${cy - bh / 2}" x2="${x(p.med)}" y2="${cy + bh / 2}" stroke="${col}" stroke-width="3.5"/>`;
      if (p.label) s += `<text x="${padL - 12}" y="${cy + 4}" font-size="12" font-weight="700" text-anchor="end" fill="${C.text}">${esc(p.label)}</text>`;
      if (p.showValues)
        [p.min, p.q1, p.med, p.q3, p.max].forEach((v) => {
          s += `<text x="${x(v)}" y="${cy - bh / 2 - 5}" font-size="10" font-weight="700" text-anchor="middle" fill="${col}">${fmtN(v)}</text>`;
        });
    });
    s += `<line x1="${padL - 10}" y1="${baseY}" x2="${w - padR + 10}" y2="${baseY}" stroke="${C.axis}" stroke-width="2.5"/>`;
    const n = Math.round((lineMax - lineMin) / step);
    for (let i = 0; i <= n; i++) {
      const v = lineMin + i * step,
        major = Math.abs(((v - lineMin) / le) % 1) < 1e-9;
      s += `<line x1="${x(v)}" y1="${baseY - (major ? 6 : 3)}" x2="${x(v)}" y2="${baseY + (major ? 6 : 3)}" stroke="${C.axis}" stroke-width="1.5"/>`;
      if (major) s += `<text x="${x(v)}" y="${baseY + 20}" font-size="11" text-anchor="middle" fill="${C.text}">${fmtN(v)}</text>`;
    }
    if (o.title) s += `<text x="${w / 2}" y="${h - 4}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(o.title)}</text>`;
    return s + '</svg>';
  }

  /** 10 × 10 percent grid. o: {shaded, color, size, shadedColor2, shaded2} */
  function grid100(o) {
    const n = o.cells || 100,
      cols = 10,
      size = o.size || 200,
      cw = size / cols;
    let s = `<svg class="viz-grid100" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(o.aria || o.shaded + ' of 100 squares shaded')}">`;
    for (let i = 0; i < n; i++) {
      const cx = (i % cols) * cw,
        cy = Math.floor(i / cols) * cw;
      const fill = i < (o.shaded || 0) ? o.color || C.a : i < (o.shaded || 0) + (o.shaded2 || 0) ? o.color2 || C.b : '#fff';
      s += `<rect x="${cx}" y="${cy}" width="${cw}" height="${cw}" fill="${fill}" stroke="${C.grid}" stroke-width="1"/>`;
    }
    s += `<rect x=".5" y=".5" width="${size - 1}" height="${size - 1}" fill="none" stroke="${C.axis}" stroke-width="1.5"/>`;
    return s + '</svg>';
  }

  /** Percent / fraction bar. o: {parts, shaded, labels:[top...], color, width} */
  function bar(o) {
    const parts = o.parts,
      w = o.width || 420,
      h = 44,
      pw = w / parts;
    let s = `<svg class="viz-bar" viewBox="0 0 ${w} ${h + (o.labels ? 22 : 0)}" width="${w}" height="${h + (o.labels ? 22 : 0)}" role="img" aria-label="${esc(o.aria || 'Bar model')}">`;
    for (let i = 0; i < parts; i++)
      s += `<rect x="${i * pw}" y="${o.labels ? 20 : 0}" width="${pw}" height="${h - 4}" fill="${i < (o.shaded || 0) ? o.color || C.a : '#fff'}" stroke="${C.axis}" stroke-width="1.5"/>`;
    (o.labels || []).forEach((t, i) => {
      s += `<text x="${i * pw}" y="12" font-size="11" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(t)}</text>`;
    });
    return s + '</svg>';
  }

  /** Generic labeled polygon figure. o: {pts:[[x,y]], w, h, labels:[{x,y,text,anchor}], dashes:[[x1,y1,x2,y2]], rightAngles:[[x,y,dx,dy]], fill} in abstract units; scale fits into box. */
  function figure(o) {
    const W = o.width || 300,
      H = o.height || 220,
      pad = 34;
    const xs = o.pts.map((p) => p[0]).concat((o.extraPts || []).map((p) => p[0])),
      ys = o.pts.map((p) => p[1]).concat((o.extraPts || []).map((p) => p[1]));
    const minX = Math.min(...xs),
      maxX = Math.max(...xs),
      minY = Math.min(...ys),
      maxY = Math.max(...ys);
    const sc = Math.min((W - 2 * pad) / (maxX - minX || 1), (H - 2 * pad) / (maxY - minY || 1));
    const ox = (W - (maxX - minX) * sc) / 2,
      oy = (H - (maxY - minY) * sc) / 2;
    const X = (x) => ox + (x - minX) * sc,
      Y = (y) => H - oy - (y - minY) * sc;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || 'Figure')}">`;
    (o.polys || [o.pts]).forEach((poly, i) => {
      s += `<polygon points="${poly.map((p) => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="${(o.fills && o.fills[i]) || o.fill || C.a}" fill-opacity=".18" stroke="${(o.strokes && o.strokes[i]) || o.stroke || C.axis}" stroke-width="2.2" stroke-linejoin="round"/>`;
    });
    (o.dashes || []).forEach((d) => {
      s += `<line x1="${X(d[0])}" y1="${Y(d[1])}" x2="${X(d[2])}" y2="${Y(d[3])}" stroke="${d[4] || C.d}" stroke-width="2" stroke-dasharray="6 4"/>`;
    });
    (o.rightAngles || []).forEach((ra) => {
      const [x, y, dx, dy] = ra,
        k = 10 / sc;
      s += `<path d="M${X(x + dx * k)},${Y(y)} L${X(x + dx * k)},${Y(y + dy * k)} L${X(x)},${Y(y + dy * k)}" fill="none" stroke="${C.axis}" stroke-width="1.6"/>`;
    });
    (o.labels || []).forEach((l) => {
      s += `<text x="${X(l.x) + (l.dx || 0)}" y="${Y(l.y) + (l.dy || 0)}" font-size="${l.size || 13}" font-weight="700" text-anchor="${l.anchor || 'middle'}" fill="${l.color || C.text}">${esc(l.text)}</text>`;
    });
    return s + '</svg>';
  }
  /** Convenience shapes (abstract units; labels are strings so the caller controls units). */
  function parallelogram(b, h, o) {
    o = o || {};
    const off = o.offset == null ? b * 0.3 : o.offset;
    const hx = off + b * 0.55;
    const sideLabel = o.side ? [{ x: off / 2, y: h / 2, text: o.side, anchor: 'end', dx: -8 }] : [];
    return figure({
      pts: [
        [0, 0],
        [b, 0],
        [b + off, h],
        [off, h],
      ],
      dashes: o.noHeight ? [] : [[hx, 0, hx, h]],
      rightAngles: o.noHeight ? [] : [[hx, 0, 1, 1]],
      labels: [{ x: b / 2, y: 0, text: o.base || fmtN(b), dy: 20 }].concat(o.noHeight ? [] : [{ x: hx, y: h / 2, text: o.height || fmtN(h), anchor: 'start', dx: 8, color: C.d }]).concat(sideLabel),
      width: o.width,
      height: o.height2,
      aria: o.aria || 'Parallelogram',
      fill: o.fill,
    });
  }
  function triangle(b, h, o) {
    o = o || {};
    const apex = o.apex == null ? b * 0.35 : o.apex;
    const outside = apex < 0 || apex > b;
    const pts = [
      [0, 0],
      [b, 0],
      [apex, h],
    ];
    const extra = outside ? [[apex, 0]] : [];
    const dashes = o.noHeight ? [] : [[apex, 0, apex, h]].concat(outside ? [[Math.min(0, apex), 0, Math.max(b, apex), 0, C.axis]] : []);
    return figure({
      pts,
      extraPts: extra,
      dashes,
      rightAngles: o.noHeight ? [] : [[apex, 0, apex < b / 2 ? 1 : -1, 1]],
      labels: [{ x: b / 2, y: 0, text: o.base || fmtN(b), dy: 20 }]
        .concat(
          o.noHeight
            ? []
            : [
                {
                  x: apex,
                  y: h / 2,
                  text: o.height || fmtN(h),
                  anchor: apex < b / 2 ? 'end' : 'start',
                  dx: apex < b / 2 ? -8 : 8,
                  color: C.d,
                },
              ],
        )
        .concat(o.sides || []),
      width: o.width,
      aria: o.aria || 'Triangle',
      fill: o.fill,
    });
  }
  function trapezoid(b1, b2, h, o) {
    o = o || {};
    const off = (b1 - b2) / 2;
    const hx = off + b2 * 0.5;
    return figure({
      pts: [
        [0, 0],
        [b1, 0],
        [b1 - off, h],
        [off, h],
      ],
      dashes: o.noHeight ? [] : [[hx, 0, hx, h]],
      rightAngles: o.noHeight ? [] : [[hx, 0, 1, 1]],
      labels: [
        { x: b1 / 2, y: 0, text: o.b1 || fmtN(b1), dy: 20 },
        { x: b1 / 2, y: h, text: o.b2 || fmtN(b2), dy: -8 },
      ]
        .concat(
          o.noHeight
            ? []
            : [
                {
                  x: hx,
                  y: h / 2,
                  text: o.height || fmtN(h),
                  anchor: 'start',
                  dx: 8,
                  color: C.d,
                },
              ],
        )
        .concat(o.sides || []),
      width: o.width,
      aria: o.aria || 'Trapezoid',
      fill: o.fill,
    });
  }
  function rectangle(w, h, o) {
    o = o || {};
    return figure({
      pts: [
        [0, 0],
        [w, 0],
        [w, h],
        [0, h],
      ],
      labels: [
        { x: w / 2, y: 0, text: o.w || fmtN(w), dy: 20 },
        { x: w, y: h / 2, text: o.h || fmtN(h), anchor: 'start', dx: 8 },
      ],
      width: o.width,
      height: o.height,
      aria: o.aria || 'Rectangle',
      fill: o.fill,
    });
  }

  /** Rectangular prism in oblique view. o: {l,w,h, labels:{l,w,h}, hidden:boolean(draw hidden edges)} */
  function prism(o) {
    const L = o.l,
      Wd = o.w,
      H = o.h,
      W = o.width || 300,
      Ht = o.height || 230;
    const dx = 0.45,
      dy = 0.3; // oblique projection of depth
    const sc = Math.min((W - 80) / (L + Wd * dx), (Ht - 70) / (H + Wd * dy));
    const ox = 40,
      oy = Ht - 30;
    const P = (x, y, z) => [ox + (x + z * dx) * sc, oy - (y + z * dy) * sc];
    const f = [P(0, 0, 0), P(L, 0, 0), P(L, H, 0), P(0, H, 0)],
      b = [P(0, 0, Wd), P(L, 0, Wd), P(L, H, Wd), P(0, H, Wd)];
    const poly = (pts, fill) => `<polygon points="${pts.map((p) => p.join(',')).join(' ')}" fill="${fill}" fill-opacity=".25" stroke="${C.axis}" stroke-width="2" stroke-linejoin="round"/>`;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(o.aria || 'Rectangular prism')}">`;
    if (o.hidden !== false) s += `<path d="M${b[0]} L${b[1]} M${b[0]} L${b[3]} M${b[0]} L${f[0]}" stroke="${C.axis}" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>`;
    s += poly([f[2], f[3], b[3], b[2]], C.b) + poly([f[1], f[2], b[2], b[1]], C.c) + poly(f, C.a);
    const lb = o.labels || {};
    s += `<text x="${(f[0][0] + f[1][0]) / 2}" y="${f[0][1] + 18}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lb.l || fmtN(L))}</text>`;
    s += `<text x="${(f[1][0] + b[1][0]) / 2 + 10}" y="${(f[1][1] + b[1][1]) / 2 + 14}" font-size="13" font-weight="700" fill="${C.text}">${esc(lb.w || fmtN(Wd))}</text>`;
    s += `<text x="${f[0][0] - 10}" y="${(f[0][1] + f[3][1]) / 2}" font-size="13" font-weight="700" text-anchor="end" fill="${C.text}">${esc(lb.h || fmtN(H))}</text>`;
    return s + '</svg>';
  }

  /** Net of a rectangular prism (cross layout). o: {l,w,h, labels:{l,w,h}, faceLabels:boolean} */
  function prismNet(o) {
    const L = o.l,
      Wd = o.w,
      H = o.h,
      W = o.width || 340;
    const totalW = 2 * L + 2 * Wd,
      totalH = 2 * Wd + H;
    const sc = Math.min((W - 40) / totalW, 200 / totalH),
      Ht = totalH * sc + 50;
    const ox = (W - totalW * sc) / 2,
      oy = 20;
    const R = (x, y, w, h, fill, lab) =>
      `<rect x="${ox + x * sc}" y="${oy + y * sc}" width="${w * sc}" height="${h * sc}" fill="${fill}" fill-opacity=".25" stroke="${C.axis}" stroke-width="1.8"/>` +
      (lab ? `<text x="${ox + (x + w / 2) * sc}" y="${oy + (y + h / 2) * sc + 4}" font-size="11" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lab)}</text>` : '');
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(o.aria || 'Net of a rectangular prism')}">`;
    const fl = o.faceLabels;
    s +=
      R(Wd, 0, L, Wd, C.b, fl && 'top') +
      R(0, Wd, Wd, H, C.c, fl && 'side') +
      R(Wd, Wd, L, H, C.a, fl && 'front') +
      R(Wd + L, Wd, Wd, H, C.c, fl && 'side') +
      R(2 * Wd + L, Wd, L, H, C.a, fl && 'back') +
      R(Wd, Wd + H, L, Wd, C.b, fl && 'bottom');
    const lb = o.labels || {};
    s += `<text x="${ox + (Wd + L / 2) * sc}" y="${oy + (2 * Wd + H) * sc + 16}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lb.l || fmtN(L))}</text>`;
    s += `<text x="${ox - 6}" y="${oy + (Wd + H / 2) * sc + 4}" font-size="12" font-weight="700" text-anchor="end" fill="${C.text}">${esc(lb.h || fmtN(H))}</text>`;
    s += `<text x="${ox + (Wd / 2) * sc}" y="${oy + Wd * sc - 6}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lb.w || fmtN(Wd))}</text>`;
    return s + '</svg>';
  }

  /** Square pyramid (oblique) with base edge b and slant height l labelled. */
  function pyramid(o) {
    const W = o.width || 280,
      Ht = o.height || 230,
      b = o.b,
      sh = o.slant;
    const sc = Math.min((W - 80) / (b * 1.45), (Ht - 70) / (sh * 1.1 + b * 0.3));
    const ox = 40,
      oy = Ht - 30,
      dx = 0.45,
      dy = 0.3;
    const P = (x, y, z) => [ox + (x + z * dx) * sc, oy - (y + z * dy) * sc];
    const base = [P(0, 0, 0), P(b, 0, 0), P(b, 0, b), P(0, 0, b)],
      apex = P(b / 2, sh * 0.95, b / 2);
    const poly = (pts, fill) => `<polygon points="${pts.map((p) => p.join(',')).join(' ')}" fill="${fill}" fill-opacity=".22" stroke="${C.axis}" stroke-width="2" stroke-linejoin="round"/>`;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(o.aria || 'Square pyramid')}">`;
    s += `<path d="M${base[2]} L${base[3]} M${base[3]} L${apex} M${base[3]} L${base[0]}" stroke="${C.axis}" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>`;
    s += poly([base[1], base[2], apex], C.c) + poly([base[0], base[1], apex], C.a);
    const mid = [(base[0][0] + base[1][0]) / 2, (base[0][1] + base[1][1]) / 2];
    s += `<line x1="${mid[0]}" y1="${mid[1]}" x2="${apex[0]}" y2="${apex[1]}" stroke="${C.d}" stroke-width="2" stroke-dasharray="6 4"/>`;
    s += `<text x="${mid[0]}" y="${mid[1] + 18}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(o.baseLabel || fmtN(b))}</text>`;
    s += `<text x="${(mid[0] + apex[0]) / 2 + 10}" y="${(mid[1] + apex[1]) / 2}" font-size="13" font-weight="700" fill="${C.d}">${esc(o.slantLabel || fmtN(sh))}</text>`;
    return s + '</svg>';
  }

  /** Net of a square pyramid: square base with four triangles. */
  function pyramidNet(o) {
    const b = o.b,
      sh = o.slant,
      W = o.width || 300,
      tot = b + 2 * sh,
      sc = (W - 40) / tot,
      Ht = tot * sc + 40,
      ox = 20,
      oy = 20;
    const X = (x) => ox + x * sc,
      Y = (y) => oy + y * sc;
    const sq = [
      [sh, sh],
      [sh + b, sh],
      [sh + b, sh + b],
      [sh, sh + b],
    ];
    const tri = (p1, p2, apex) => `<polygon points="${[p1, p2, apex].map((p) => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="${C.c}" fill-opacity=".22" stroke="${C.axis}" stroke-width="1.8"/>`;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(o.aria || 'Net of a square pyramid')}">`;
    s += `<polygon points="${sq.map((p) => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="${C.a}" fill-opacity=".25" stroke="${C.axis}" stroke-width="1.8"/>`;
    s += tri(sq[0], sq[1], [sh + b / 2, 0]) + tri(sq[1], sq[2], [tot, sh + b / 2]) + tri(sq[2], sq[3], [sh + b / 2, tot]) + tri(sq[3], sq[0], [0, sh + b / 2]);
    s += `<text x="${X(sh + b / 2)}" y="${Y(sh + b / 2) + 4}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(o.baseLabel || fmtN(b))}</text>`;
    s += `<line x1="${X(sh + b / 2)}" y1="${Y(sh)}" x2="${X(sh + b / 2)}" y2="${Y(0)}" stroke="${C.d}" stroke-width="2" stroke-dasharray="6 4"/><text x="${X(sh + b / 2) + 8}" y="${Y(sh / 2)}" font-size="12" font-weight="700" fill="${C.d}">${esc(o.slantLabel || fmtN(sh))}</text>`;
    return s + '</svg>';
  }

  /** Triangular prism (oblique) — right-triangle or isosceles cross-section. o:{b,h,len, labels:{b,h,len,s1,s2}} */
  function triPrism(o) {
    const b = o.b,
      h = o.h,
      L = o.len,
      W = o.width || 320,
      Ht = o.height || 230;
    const dx = 0.5,
      dy = 0.28;
    const sc = Math.min((W - 90) / (b + L * dx), (Ht - 70) / (h + L * dy));
    const ox = 40,
      oy = Ht - 34;
    const P = (x, y, z) => [ox + (x + z * dx) * sc, oy - (y + z * dy) * sc];
    const apexX = o.right ? 0 : b / 2;
    const f = [P(0, 0, 0), P(b, 0, 0), P(apexX, h, 0)],
      bk = [P(0, 0, L), P(b, 0, L), P(apexX, h, L)];
    const poly = (pts, fill) => `<polygon points="${pts.map((p) => p.join(',')).join(' ')}" fill="${fill}" fill-opacity=".25" stroke="${C.axis}" stroke-width="2" stroke-linejoin="round"/>`;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(o.aria || 'Triangular prism')}">`;
    s += `<path d="M${bk[0]} L${bk[1]} M${bk[0]} L${bk[2]} M${bk[0]} L${f[0]}" stroke="${C.axis}" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>`;
    s += poly([f[1], f[2], bk[2], bk[1]], C.c) + poly([f[0], f[1], bk[1], bk[0]], C.b) + poly(f, C.a);
    if (!o.right) s += `<line x1="${f[2][0]}" y1="${f[2][1]}" x2="${f[2][0]}" y2="${f[0][1]}" stroke="${C.d}" stroke-width="2" stroke-dasharray="6 4"/>`;
    const lb = o.labels || {};
    s += `<text x="${(f[0][0] + f[1][0]) / 2}" y="${f[0][1] + 18}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lb.b || fmtN(b))}</text>`;
    s += `<text x="${f[2][0] + (o.right ? -8 : 8)}" y="${(f[2][1] + f[0][1]) / 2}" font-size="13" font-weight="700" text-anchor="${o.right ? 'end' : 'start'}" fill="${C.d}">${esc(lb.h || fmtN(h))}</text>`;
    s += `<text x="${(f[1][0] + bk[1][0]) / 2 + 10}" y="${(f[1][1] + bk[1][1]) / 2 + 14}" font-size="13" font-weight="700" fill="${C.text}">${esc(lb.len || fmtN(L))}</text>`;
    if (lb.s1) s += `<text x="${(f[1][0] + f[2][0]) / 2 + 10}" y="${(f[1][1] + f[2][1]) / 2 - 6}" font-size="12" font-weight="700" fill="${C.text}">${esc(lb.s1)}</text>`;
    if (lb.s2) s += `<text x="${(f[0][0] + f[2][0]) / 2 - 10}" y="${(f[0][1] + f[2][1]) / 2 - 6}" font-size="12" font-weight="700" text-anchor="end" fill="${C.text}">${esc(lb.s2)}</text>`;

  /** Pan balance for equations. o: {left:[labels], right:[labels], tilt: -1|0|1} */
  function balance(o) {

      H = 170,

    const chip = (t, x, y, i) =>
      `<rect x="${x - 26}" y="${y - 30}" width="52" height="26" rx="6" fill="${/^[a-z]$/i.test(t) ? C.d : C.c}" fill-opacity=".9"/><text x="${x}" y="${y - 12}" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">${esc(t)}</text>`;

      const n = items.length;
      items.forEach((t, i) => {
        out += chip(t, cx + (i - (n - 1) / 2) * 56, cy - 2, i);
      });
      return out;
    };
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || 'Pan balance')}">`;
    s += `<path d="M${W / 2 - 30},${H - 10} h60 l-30,-40 z" fill="${C.axis}"/><line x1="${W / 2}" y1="${H - 50}" x2="${W / 2}" y2="${H - 110}" stroke="${C.axis}" stroke-width="4"/>`;
    s += `<g transform="rotate(${tilt} ${W / 2} ${H - 110})"><line x1="${W / 2 - 120}" y1="${H - 110}" x2="${W / 2 + 120}" y2="${H - 110}" stroke="${C.axis}" stroke-width="4" stroke-linecap="round"/>${pan(o.left, W / 2 - 120, H - 74)}${pan(o.right, W / 2 + 120, H - 74)}</g>`;
    return s + '</svg>';
  }

  /** Algebra-tile style area model for expressions like 3(x + 2). o: {rows:[labels], cols:[labels]} */
  function areaModel(o) {
    const rows = o.rows,
      cols = o.cols,
      cw = 70,
      ch = 48,
      W = 40 + cols.length * cw,
      H = 30 + rows.length * ch;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || 'Area model')}">`;
    cols.forEach((c, j) => {
      s += `<text x="${40 + j * cw + cw / 2}" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(c)}</text>`;
    });
    rows.forEach((r, i) => {
      s += `<text x="32" y="${30 + i * ch + ch / 2 + 4}" font-size="13" font-weight="700" text-anchor="end" fill="${C.text}">${esc(r)}</text>`;
      cols.forEach((c, j) => {
        const t = o.cells ? o.cells[i][j] : '';
        s += `<rect x="${40 + j * cw}" y="${30 + i * ch}" width="${cw}" height="${ch}" fill="${/x|y|n|m|a|b/.test(c + r) ? C.a : C.b}" fill-opacity=".2" stroke="${C.axis}" stroke-width="1.6"/>`;
        if (t) s += `<text x="${40 + j * cw + cw / 2}" y="${30 + i * ch + ch / 2 + 5}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(t)}</text>`;
      });

  Object.assign(V, {
    numberLine,
    verticalLine,
    dotPlot,
    histogram,
    boxPlot,
    grid100,
    bar,
    figure,
    parallelogram,
    triangle,
    trapezoid,
    rectangle,
    prism,
    prismNet,
    pyramid,
    pyramidNet,
    triPrism,
    balance,
    areaModel,
  });

  // ---------- Extend the coordinate graph to four quadrants (xMin/yMin) ----------
  const graph0 = V.graph;
  V.graph = function (o) {
    if (!o.xMin && !o.yMin) return graph0(o);
    const size = o.size || 320,
      pad = { l: 30, r: 18, t: 18, b: 30 };
    const w = size,
      h = size,
      xMin = o.xMin || 0,
      yMin = o.yMin || 0,
      xMax = o.xMax,
      yMax = o.yMax,
      xs = o.xStep || 1,
      ys = o.yStep || 1;
    const px = (x) => pad.l + ((x - xMin) / (xMax - xMin)) * (w - pad.l - pad.r);
    const py = (y) => h - pad.b - ((y - yMin) / (yMax - yMin)) * (h - pad.t - pad.b);
    let s = `<svg class="viz-graph" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Coordinate plane')}">`;
    for (let x = xMin; x <= xMax; x += xs) s += `<line x1="${px(x)}" y1="${py(yMin)}" x2="${px(x)}" y2="${py(yMax)}" stroke="${C.grid}" stroke-width="1"/>`;
    for (let y = yMin; y <= yMax; y += ys) s += `<line x1="${px(xMin)}" y1="${py(y)}" x2="${px(xMax)}" y2="${py(y)}" stroke="${C.grid}" stroke-width="1"/>`;
    s += `<line x1="${px(xMin)}" y1="${py(0)}" x2="${px(xMax)}" y2="${py(0)}" stroke="${C.axis}" stroke-width="2"/><line x1="${px(0)}" y1="${py(yMin)}" x2="${px(0)}" y2="${py(yMax)}" stroke="${C.axis}" stroke-width="2"/>`;
    const xl = o.xLabelEvery || xs,
      yl = o.yLabelEvery || ys;
    for (let x = xMin; x <= xMax; x += xl) if (x !== 0) s += `<text x="${px(x)}" y="${py(0) + 14}" font-size="10" text-anchor="middle" fill="${C.text}">${x}</text>`;
    for (let y = yMin; y <= yMax; y += yl) if (y !== 0) s += `<text x="${px(0) - 5}" y="${py(y) + 3.5}" font-size="10" text-anchor="end" fill="${C.text}">${y}</text>`;
    s += `<text x="${px(0) - 5}" y="${py(0) + 13}" font-size="10" text-anchor="end" fill="${C.text}">0</text>`;
    s += `<text x="${px(xMax) - 2}" y="${py(0) - 6}" font-size="12" font-weight="700" text-anchor="end" fill="${C.text}">${esc(o.xLabel || 'x')}</text><text x="${px(0) + 6}" y="${py(yMax) + 10}" font-size="12" font-weight="700" fill="${C.text}">${esc(o.yLabel || 'y')}</text>`;
    (o.series || []).forEach((ser) => {
      const col = ser.color || C.a;
      if (ser.line && ser.points.length > 1)
        s += `<polyline fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="${ser.dashed ? '5 4' : '0'}" points="${ser.points.map((p) => px(p[0]) + ',' + py(p[1])).join(' ')}"/>`;
      if (ser.polygon && ser.points.length > 2)

<script>
/* Grade 6 Review Expeditions — pure answer checkers. check(q, answer) -> { correct, detail }. */
(function (root) {
  'use strict';
  const RX = root.RX || (root.RX = {});
  const { parseNum, near } = RX;

  function numOk(input, expected, tol) {
    const v = parseNum(input);
    if (v == null) return false;
    return near(v, expected, tol == null ? 0.001 : tol);
  }
  const sameSet = (a, b) => a.length === b.length && a.slice().sort((x, y) => x - y).every((v, i) => v === b.slice().sort((x, y) => x - y)[i]);

  const C = {
    mc(q, a) { return { correct: a === q.answer }; },
    who(q, a) { return C.mc(q, a); },
    rep(q, a) { return C.mc(q, a); },
    ms(q, a) {
      a = Array.isArray(a) ? a : [];
      const missing = q.answers.filter((i) => !a.includes(i));
      const extra = a.filter((i) => !q.answers.includes(i));
      return { correct: missing.length === 0 && extra.length === 0, detail: { missing, extra } };
    },
    num(q, a) { return { correct: numOk(a, q.answer, q.tolerance), detail: { value: parseNum(a) } }; },
    blanks(q, a) {
      a = Array.isArray(a) ? a : [];
      const wrong = q.fields.map((f, i) => (numOk(a[i], f.answer, f.tolerance) ? null : i)).filter((i) => i !== null);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    cloze(q, a) {
      a = Array.isArray(a) ? a : [];
      const wrong = q.answers.map((ans, i) => (a[i] === ans ? null : i)).filter((i) => i !== null);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    table(q, a) {
      a = a || {};
      const wrong = q.inputs.filter((inp) => !numOk(a[inp.id], inp.answer, inp.tolerance)).map((inp) => inp.id);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    match(q, a) {
      a = Array.isArray(a) ? a : [];
      const wrong = q.pairs.filter(([l, r]) => !a.some(([al, ar]) => al === l && ar === r)).map(([l]) => l);
      return { correct: wrong.length === 0 && a.length === q.pairs.length, detail: { wrong } };
    },
    sort(q, a) {
      a = a || {};
      const wrong = q.items.map((it, i) => (a[i] === it.bin ? null : i)).filter((i) => i !== null);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    seq(q, a) {
      a = Array.isArray(a) ? a : [];
      const correct = a.length === q.order.length && a.every((v, i) => v === q.order[i]);
      return { correct };
    },
    plot(q, a) {
      a = Array.isArray(a) ? a : [];
      const key = (p) => p[0] + ',' + p[1];
      const want = new Set(q.points.map(key)), got = new Set(a.map(key));
      const missing = q.points.filter((p) => !got.has(key(p)));
      const extra = a.filter((p) => !want.has(key(p)));
      return { correct: missing.length === 0 && extra.length === 0, detail: { missing, extra } };
    },
    dnl(q, a) {
      a = Array.isArray(a) ? a : [];
      const wrong = q.blanks.map((b, i) => (numOk(a[i], b.answer, b.tolerance) ? null : i)).filter((i) => i !== null);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    tape(q, a) {
      a = a || {};
      const wrong = q.fields.filter((f) => !numOk(a[f.key], f.answer, f.tolerance)).map((f) => f.key);
      return { correct: wrong.length === 0, detail: { wrong } };
    },
    tf(q, a) {
      a = a || {};
      const valueOk = a.value === q.answer;
      const reasonOk = q.reasons[a.reason] ? !!q.reasons[a.reason].correct : false;
      return { correct: valueOk && reasonOk, detail: { valueOk, reasonOk } };
    },
    error(q, a) {
      a = a || {};
      const mistakeOk = a.mistake === q.answer;
      const fixOk = q.fix ? numOk(a.fix, q.fix.answer, q.fix.tolerance) : true;
      return { correct: mistakeOk && fixOk, detail: { mistakeOk, fixOk } };
    },
    cr(q, a) {
      a = a || {};
      const words = String(a.text || '').trim().split(/\s+/).filter(Boolean).length;
      const wroteEnough = words >= (q.minWords || 8);
      const checkOk = a.check === q.check.answer;
      return { correct: wroteEnough && checkOk, detail: { wroteEnough, checkOk, words } };
    },
  };

  RX.check = function (q, answer) {
    const fn = C[q.type];
    if (!fn) throw new Error('No checker for type ' + q.type);
    return fn(q, answer);
  };
  RX.checkers = C;
  RX.numOk = numOk;
  RX.sameSet = sameSet;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

      visual: () => V.frac(3, 4) + ' <span class="muted">→ flip →</span> ' + V.frac(4, 3),
    },
    {
      term: 'Keep, Change, Flip',
      def: 'The way to divide fractions: keep the first fraction, change ÷ to ×, flip the second fraction (use its reciprocal). Write a whole number over 1 first.',
      ex: '3 ÷ 1/4 → 3/1 × 4/1 = 12',
      visual: () =>
        V.table(
          [
            ['Keep', 'Change', 'Flip'],
            [V.frac(3, 1), '×', V.frac(4, 1)],
          ],
          { header: true, cls: 'mini' },
        ),
    },
    {
      term: 'power',
      def: 'A short way to write repeated multiplication of the same factor.',
      ex: '4 × 4 × 4 = 4³ (read "4 to the third power" or "4 cubed")',
      visual: () => '<span style="font-size:1.6em"><b>4</b><sup>3</sup></span> <span class="muted">= 4 × 4 × 4 = 64</span>',
    },
    { term: 'base', def: 'The number being multiplied in a power.', ex: 'In 4³, the base is 4.' },
    {
      term: 'exponent',
      def: 'The small raised number that tells how many times the base is used as a factor. It does NOT multiply the base.',
      ex: 'In 4³, the exponent is 3, so 4³ = 4 × 4 × 4 = 64, not 4 × 3 = 12.',
    },
    {
      term: 'order of operations',
      def: 'The agreed order for evaluating: grouping symbols first, then exponents, then multiply and divide left to right, then add and subtract left to right.',
      ex: '3 + 2² × 5 → 3 + 4 × 5 → 3 + 20 → 23',
      visual: () =>
        V.table(
          [
            ['1', 'Grouping symbols ( )'],
            ['2', 'Exponents'],
            ['3', 'Multiply / Divide, left to right'],
            ['4', 'Add / Subtract, left to right'],
          ],
          { header: false, rowHeader: true, cls: 'mini' },

    { term: 'coefficient', def: 'The number multiplied by a variable in a term.', ex: 'In 4n + 3, the coefficient of n is 4.' },
    { term: 'constant', def: 'A term that is just a number. It does not change.', ex: 'In 4n + 3, the constant is 3.' },
    { term: 'like terms', def: 'Terms that have exactly the same variable part. Only like terms can be combined.', ex: '3x and 2x are like terms: 3x + 2x = 5x. 3x and 5 are not like terms.' },
    {
      term: 'equivalent expressions',
      def: 'Expressions that have the same value for every value of the variable.',
      ex: '3(x + 2) and 3x + 6 are equivalent. Test x = 4: 3(6) = 18 and 12 + 6 = 18.',
      visual: () => V.balance({ left: ['3(x+2)'], right: ['3x+6'], tilt: 0 }),
    },
    {
      term: 'distributive property',
      def: 'Multiplying a sum by a number is the same as multiplying each addend and adding. It works forward (expand) and backward (factor).',
      ex: '3(x + 4) = 3x + 12 and 12x + 18 = 6(2x + 3)',
      visual: () => V.areaModel({ rows: ['3'], cols: ['x', '4'], cells: [['3x', '12']] }),
    },
    { term: 'commutative property', def: 'You can add or multiply in any order.', ex: 'x + 5 = 5 + x and 4 · n = n · 4' },
    { term: 'associative property', def: 'You can group addends or factors differently.', ex: '(2 + x) + 5 = 2 + (x + 5) and 4 · (3 · n) = (4 · 3) · n' },
    {
      term: 'greatest common factor (GCF)',
      def: 'The largest number that divides two numbers with no remainder. Use it for sharing or packaging into identical groups.',
      ex: 'Factors of 18: 1, 2, 3, 6, 9, 18. Factors of 24: 1, 2, 3, 4, 6, 8, 12, 24. GCF = 6.',
    },
    {
      term: 'least common multiple (LCM)',
      def: 'The smallest number that is a multiple of both numbers. Use it for events that repeat and line up again.',
      ex: 'Multiples of 6: 6, 12, 18, 24 … Multiples of 8: 8, 16, 24 … LCM = 24.',

  ];
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Zone 1 — The Intake Gears. Lesson 6-1 Division Expressions with Fractions and Whole Numbers. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { G, V, simplify, gcd, shuffleOptions, NAMES, parseNum } = RX;
  const U = RX.U6;
  const hl = V.hl;
  const F = (a, b) => V.frac(a, b);
  const FRACTION_WORDS = { 2: 'halves', 3: 'thirds', 4: 'fourths', 5: 'fifths', 6: 'sixths', 8: 'eighths', 10: 'tenths', 12: 'twelfths' };

  const STOCK = [
    ['brass rod', 'feet', 'rods'],
    ['copper wire', 'meters', 'spools'],
    ['steel ribbon', 'yards', 'coils'],
    ['oak plank', 'feet', 'planks'],
    ['leather belt', 'meters', 'belts'],
  ];

  // ---------- Whole ÷ unit fraction with a bar model (num) ----------
  G.define('e1_barModel', (r, o) => {
    const hard = !!o.hard;
    const w = hard ? r.int(5, 9) : r.int(2, 4);
    const d = hard ? r.pick([3, 4, 5, 6, 8]) : r.pick([2, 3, 4, 5, 6]);
    const ans = w * d;
    const [item, unit] = r.pick(STOCK);
    const bars = Array.from(
      { length: w },
      (_, i) => `<div><div class="viz-cap">${unit.slice(0, -1)} ${i + 1}</div>${V.bar({ parts: d, shaded: d, width: 180, aria: `One whole cut into ${d} equal parts` })}</div>`,
    ).join('');
    return {
      type: 'num',
      skill: 'divide-whole',
      lesson: '6-1',
      title: hard ? 'How many pieces?' : 'How many fit inside?',
      prompt: `<p>The intake gears cut ${hl(w + ' ' + unit)} of ${item} into pieces that are each ${hl(U.fracText(1, d) + ' ' + unit.slice(0, -1))} long.</p>${
        hard ? '' : `<div class="viz-row">${bars}</div><p class="muted">Each whole ${unit.slice(0, -1)} is split into ${FRACTION_WORDS[d]}.</p>`
      }<p>How many pieces does the machine make? Write and evaluate ${w} ÷ ${F(1, d)}.</p>`,
      unit: 'pieces',
      answer: ans,
      hints: [
        `The question asks how many ${FRACTION_WORDS[d]} are in ${w} wholes. Dividing by a fraction asks "how many of these fit inside?"`,
        `Put a 1 under the whole number so both are fractions: ${w}/1 ÷ 1/${d}. Then Keep, Change, Flip: ${w}/1 × ${d}/1.`,
        `Multiply across: ${w} × ${d}. Each whole holds ${d} pieces, and there are ${w} wholes.`,
      ],
      solution: `<p>${w} ÷ ${F(1, d)} asks how many ${FRACTION_WORDS[d]} fit in ${w}. Write ${w} as ${F(w, 1)}, then Keep, Change, Flip: ${F(w, 1)} × ${F(d, 1)} = ${F(w * d, 1)} = <b>${ans}</b>. Each whole holds ${d} ${FRACTION_WORDS[d]}, so ${w} wholes hold ${w} × ${d} = ${ans} pieces. The quotient is bigger than ${w} because each piece is smaller than 1.</p>`,
      feedback: {
        correct: `Correct. ${w} wholes, ${d} ${FRACTION_WORDS[d]} in each, make ${ans} pieces. Dividing by a unit fraction gives a bigger number.`,
        wrong(ans0, dt) {
          const v = dt.value;
          if (v != null && Math.abs(v - w / d) < 1e-6) return `You multiplied ${w} by 1/${d}. In Keep, Change, Flip, the divisor 1/${d} flips to ${d}/1 before you multiply.`;
          if (v === w + d) return `Adding ${w} and ${d} does not answer "how many pieces." Count the ${FRACTION_WORDS[d]}: each whole holds ${d} of them.`;
          if (v === d) return `${d} is the number of pieces in ONE whole. There are ${w} wholes, so multiply.`;
          return `Think: how many ${FRACTION_WORDS[d]} are in 1 whole? Then multiply by ${w} wholes.`;
        },
      },
    };
  });

  // ---------- Keep, Change, Flip steps (cloze) ----------
  G.define('e1_kcfSteps', (r) => {
    const w = r.int(2, 9);
    const d = r.pick([2, 3, 4, 5, 6, 8]);
    const flipped = `${d}/1`;
    const stepOne = [`${w}/1`, `1/${w}`, `${w}/${d}`];
    const stepTwo = r.shuffle([flipped, `1/${d}`, `${d}/${w}`]);
    const results = r.shuffle([String(w * d), String(w + d), U.fracText(w, d)]);
    return {
      type: 'cloze',
      skill: 'divide-whole',
      lesson: '6-1',
      title: 'Set the three steps',
      prompt: `<p>The intake plate shows ${hl(w + ' ÷ ' + U.fracText(1, d))}. Complete the three steps of the Foundry's method.</p>`,
      template: `Step 1: Put a 1 under the whole number: {0} ÷ 1/${d}.  Step 2: Keep, Change, Flip: ${w}/1 × {1}.  Step 3: Multiply across: {2}.`,
      choices: [stepOne, stepTwo, results],
      answers: [0, stepTwo.indexOf(flipped), results.indexOf(String(w * d))],
      hints: [
        'A whole number becomes a fraction when you write it over 1. Its value does not change.',
        `Keep ${w}/1. Change ÷ to ×. Flip only the second fraction: 1/${d} becomes ${d}/1.`,
        `${w}/1 × ${d}/1 = (${w} × ${d})/(1 × 1). Multiply the tops, multiply the bottoms.`,
      ],
      solution: `<p>Step 1: ${w} = ${F(w, 1)}. Step 2: Keep ${F(w, 1)}, change ÷ to ×, flip ${F(1, d)} to ${F(d, 1)}. Step 3: ${F(w, 1)} × ${F(d, 1)} = ${F(w * d, 1)} = <b>${w * d}</b>. Only the divisor is flipped, because dividing by a number is the same as multiplying by its reciprocal.</p>`,
      feedback: {
        correct: `Correct. Write the whole number over 1, flip only the divisor, then multiply across: ${w * d}.`,
        wrong(ans, dt) {
          if (dt.wrong.includes(0)) return `Step 1: writing ${w} over 1 keeps its value. ${w}/1 is still ${w}.`;
          if (dt.wrong.includes(1)) return `Step 2: only the second fraction flips. 1/${d} flipped is ${d}/1, not 1/${d}.`;
          return `Step 3: multiply straight across. ${w} × ${d} on top and 1 × 1 on the bottom.`;
        },
      },
    };
  });

  // ---------- Story: whole ÷ unit fraction (mc) ----------
  G.define('e1_storyDivide', (r) => {
    const name = r.pick(NAMES);
    const w = r.int(2, 8);
    const d = r.pick([3, 4, 5, 6, 8].filter((x) => w % x !== 0));
    const ctx = r.pick([
      [`${name} has ${w} cups of oil for the gears. Each oil can holds ${U.fracText(1, d)} cup.`, 'How many cans can be filled?', 'cans'],
      [`${w === 8 ? 'An' : 'A'} ${w}-pound sack of iron filings is split into bags that each hold ${U.fracText(1, d)} pound.`, 'How many bags are filled?', 'bags'],
      [`${name} has ${w} hours to inspect dials. Each inspection takes ${U.fracText(1, d)} hour.`, 'How many inspections can ${name} finish?', 'inspections'],
      [`${w === 8 ? 'An' : 'A'} ${w}-meter chain is cut into links that are each ${U.fracText(1, d)} meter long.`, 'How many links are made?', 'links'],
    ]);
    const [a, b] = simplify(w, d);
    const opts = [
      { html: `${w * d} ${ctx[2]}`, ok: true },
      {
        html: `${a === w && b === d ? '' : ''}${F(a, b)} ${ctx[2].slice(0, -1)}`,
        why: `${U.fracText(a, b)} comes from multiplying ${w} × 1/${d}. Dividing by 1/${d} means flipping it to ${d}/1 first. The answer must be bigger than ${w}, because each piece is smaller than one whole.`,
      },
      { html: `${w + d} ${ctx[2]}`, why: `Adding ${w} and ${d} does not model "how many 1/${d} fit in ${w}." Each whole holds ${d} of them, so multiply.` },
      { html: `${d} ${ctx[2]}`, why: `${d} is how many ${FRACTION_WORDS[d]} fit in just ONE whole. There are ${w} wholes.` },
    ];
    const sh = shuffleOptions(r, opts, 0);
    return {
      type: 'mc',
      skill: 'divide-whole',
      lesson: '6-1',
      title: 'Divide to solve the story',
      prompt: `<p>${ctx[0]}</p><p>${ctx[1].replace('${name}', name)}</p>`,
      options: sh.options,
      answer: sh.answer,
      hints: [
        `This is a division story: ${w} ÷ 1/${d}. It asks how many ${FRACTION_WORDS[d]} are in ${w} wholes.`,
        `Write ${w} as ${w}/1, then Keep, Change, Flip: ${w}/1 × ${d}/1.`,
        `${w} × ${d} = ? The quotient should be larger than ${w}.`,
      ],
      solution: `<p>${w} ÷ ${F(1, d)} = ${F(w, 1)} × ${F(d, 1)} = <b>${w * d} ${ctx[2]}</b>. Each whole holds ${d} ${FRACTION_WORDS[d]}, and there are ${w} wholes. Dividing by a fraction less than 1 always gives a quotient bigger than the starting amount.</p>`,
      feedback: { correct: `Correct. ${w} ÷ 1/${d} = ${w} × ${d} = ${w * d}.` },
    };
  });

  // ---------- Error: multiplied by the divisor instead of flipping (error) ----------
  G.define('e1_errorMultiply', (r) => {
    const name = r.pick(NAMES);
    const w = r.int(2, 9);
    const d = r.pick([2, 3, 4, 5, 6, 8]);
    const [a, b] = simplify(w, d);
    const opts = [
      { html: `${name} changed ÷ to × but did not flip the divisor. 1/${d} must become ${d}/1 before multiplying.`, ok: true },
      { html: `${name} should have flipped ${w}/1 to 1/${w} instead.`, why: `Only the divisor (the second fraction) flips. ${w}/1 is the dividend and stays as it is.` },
      { html: `${name} should have added ${w} + ${d}.`, why: `Division by a fraction is never solved by adding. The method is Keep, Change, Flip.` },
      { html: `The answer is correct. Dividing by a fraction makes the number smaller.`, why: `Dividing by a fraction less than 1 makes the quotient BIGGER. ${w} ÷ 1/${d} must be more than ${w}.` },
    ];
    const sh = shuffleOptions(r, opts, 0);
    return {
      type: 'error',
      skill: 'divide-whole',
      lesson: '6-1',
      title: 'Find the mistake',
      prompt: `<p>${name} divided ${hl(w + ' ÷ ' + U.fracText(1, d))} on the intake plate. The gears jammed.</p><p>What went wrong?</p>`,
      work: `${w} ÷ ${F(1, d)} = ${F(w, 1)} × ${F(1, d)} = ${F(w, d)}${a !== w ? ` = ${F(a, b)}` : ''}`,
      options: sh.options,
      answer: sh.answer,
      fix: { label: `The correct quotient is`, answer: w * d },
      hints: [
        `Check the size of the answer first. ${w} ÷ 1/${d} asks how many ${FRACTION_WORDS[d]} fit in ${w}. Should that be more or less than ${w}?`,
        `Keep ${w}/1. Change ÷ to ×. Flip 1/${d}. Compare with ${name}'s second step.`,
        `${w}/1 × ${d}/1 = ${w} × ${d}.`,
      ],
      solution: `<p>${name} changed the sign but kept 1/${d} instead of flipping it. The correct work is ${F(w, 1)} × ${F(d, 1)} = <b>${w * d}</b>. A quick check: ${w} wholes hold ${d} ${FRACTION_WORDS[d]} each, so the answer must be bigger than ${w}.</p>`,
      feedback: {
        correct: `Correct. Change AND flip go together. ${w} ÷ 1/${d} = ${w} × ${d} = ${w * d}.`,
        wrong(ans, dt) {
          if (!dt.mistakeOk) return (sh.options[ans.mistake] && sh.options[ans.mistake].why) || 'Look at the second step. Was the divisor flipped?';
          return `You found the mistake. For the fix: ${w}/1 × ${d}/1 = ${w} × ${d}.`;
        },
      },
    };
  });

  // ---------- Unit fraction ÷ whole (blanks, fraction layout) ----------
  G.define('e1_unitByWhole', (r) => {
    const d = r.pick([2, 3, 4, 5, 6, 8]);
    const w = r.int(2, 6);
    const name = r.pick(NAMES);
    const ctx = r.pick([
      `${name} has ${U.fracText(1, d)} of a jar of grease and shares it equally among ${w} gearboxes.`,
      `A strip of copper ${U.fracText(1, d)} meter long is cut into ${w} equal pieces.`,
      `${name} splits ${U.fracText(1, d)} of a pan of foundry bread into ${w} equal servings.`,
    ]);
    return {
      type: 'blanks',
      skill: 'divide-whole',
      lesson: '6-1',
      title: 'Divide a unit fraction by a whole number',
      prompt: `<p>${ctx}</p><p>What fraction does each ${ctx.includes('gearbox') ? 'gearbox' : ctx.includes('piece') ? 'piece' : 'serving'} get? Write and evaluate ${hl(U.fracText(1, d) + ' ÷ ' + w)} as a fraction in simplest form.</p>`,
      fields: [
        { label: 'numerator (top)', answer: 1, width: 'sm' },
        { label: 'denominator (bottom)', answer: d * w, width: 'sm' },
      ],
      layout: 'fraction',
      hints: [
        `Write the whole number over 1: 1/${d} ÷ ${w}/1. Sharing among ${w} makes each share smaller.`,
        `Keep 1/${d}. Change ÷ to ×. Flip ${w}/1 to 1/${w}.`,
        `1/${d} × 1/${w}: multiply the tops (1 × 1) and the bottoms (${d} × ${w}).`,
      ],
      solution: `<p>${F(1, d)} ÷ ${w} = ${F(1, d)} ÷ ${F(w, 1)} = ${F(1, d)} × ${F(1, w)} = <b>${F(1, d * w)}</b>. Splitting a ${FRACTION_WORDS[d].slice(0, -1)} into ${w} equal parts makes pieces that are ${d} × ${w} = ${d * w} to a whole, so each share is 1/${d * w}.</p>`,
      feedback: {
        correct: `Correct. 1/${d} × 1/${w} = 1/${d * w}. Dividing by a whole number makes the fraction smaller.`,
        wrong(ans) {
          const n = parseNum(ans[0]),
            m = parseNum(ans[1]);
          if (n != null && m && Math.abs(n / m - w / d) < 1e-9) return `${w}/${d} comes from flipping the FIRST fraction. Only the divisor flips: ${w}/1 becomes 1/${w}.`;
          if (n != null && m && Math.abs(n / m - 1 / (d * w)) < 1e-9)
            return 'Your fraction is equivalent to the answer, but it is not in simplest form. Divide top and bottom by their greatest common factor.';
          if (n === 1 && m === d + w) return `Do not add the denominators. Multiply: 1/${d} × 1/${w} has a denominator of ${d} × ${w}.`;
          return `Write ${w} as ${w}/1, flip it to 1/${w}, then multiply 1/${d} × 1/${w}.`;
        },
      },
    };
  });

  // ---------- Fraction ÷ whole (blanks, fraction layout) ----------
  G.define('e1_fracByWhole', (r) => {
    const pairs = [
      [3, 4],
      [2, 3],
      [3, 5],
      [5, 6],
      [2, 5],
      [4, 5],
      [5, 8],
      [3, 8],
    ];
    const [a, b] = r.pick(pairs);
    const w = r.int(2, 5);
    const [sn, sd] = simplify(a, b * w);
    const name = r.pick(NAMES);
    const ctx = r.pick([
      `A gear belt is ${U.fracText(a, b)} yard long. ${name} cuts it into ${w} equal pieces.`,
      `${name} pours ${U.fracText(a, b)} liter of oil equally into ${w} reservoirs.`,
      `A ${U.fracText(a, b)}-acre scrap yard is divided into ${w} equal lots.`,
    ]);
    return {
      type: 'blanks',
      skill: 'divide-whole',
      lesson: '6-1',
      title: 'Divide a fraction by a whole number',
      prompt: `<p>${ctx}</p><p>How much is each part? Evaluate ${hl(U.fracText(a, b) + ' ÷ ' + w)}. Write the answer as a fraction in simplest form.</p>`,
      fields: [
        { label: 'numerator (top)', answer: sn, width: 'sm' },
        { label: 'denominator (bottom)', answer: sd, width: 'sm' },
      ],
      layout: 'fraction',
      hints: [
        `Write ${w} as ${w}/1. Then use Keep, Change, Flip.`,
        `${a}/${b} × 1/${w}. Multiply the numerators and the denominators.`,
        `${a}/${b * w}${sn !== a ? `. Both ${a} and ${b * w} can be divided by ${gcd(a, b * w)}.` : ' is already in simplest form.'}`,
      ],
      solution: `<p>${F(a, b)} ÷ ${w} = ${F(a, b)} × ${F(1, w)} = ${F(a, b * w)}${sn !== a ? ` = <b>${F(sn, sd)}</b> after dividing top and bottom by ${gcd(a, b * w)}` : ` = <b>${F(sn, sd)}</b>`}. Each of the ${w} parts is one ${w}th of ${U.fracText(a, b)}, so the answer is smaller than ${U.fracText(a, b)}.</p>`,
      feedback: {
        correct: `Correct. ${a}/${b} × 1/${w} = ${a}/${b * w}${sn !== a ? ` = ${sn}/${sd}` : ''}. Dividing by ${w} made the fraction ${w} times smaller.`,
        wrong(ans) {
          const n = parseNum(ans[0]),
            m = parseNum(ans[1]);
          if (n != null && m && Math.abs(n / m - sn / sd) < 1e-9)
            return 'Your fraction is equivalent to the answer but not in simplest form. Divide the top and bottom by their greatest common factor.';
          if (n != null && m && Math.abs(n / m - (a * w) / b) < 1e-9) return `${a * w}/${b} is ${a}/${b} × ${w}. Dividing by ${w} should make the fraction smaller, so flip ${w}/1 to 1/${w}.`;
          if (n != null && m && Math.abs(n / m - (b * w) / a) < 1e-9) return `You flipped the first fraction. Only the divisor ${w}/1 flips.`;
          return `Keep ${a}/${b}, change to ×, flip ${w}/1 to 1/${w}. Then multiply across and simplify.`;
        },
      },
    };
  });

  // ---------- Match numbers to reciprocals (match) ----------
  G.define('e1_reciprocalMatch', (r) => {
    const whole = r.int(2, 9);
    const unitD = r.pick([2, 3, 4, 5, 6, 7, 8].filter((x) => x !== whole));
    const fracs = r.pickN(
      [
        [2, 3],
        [3, 4],
        [2, 5],
        [3, 5],
        [4, 7],
        [5, 6],
        [3, 8],
        [5, 9],
      ],
      2,
    );
    const items = [
      { left: String(whole), right: F(1, whole) },
      { left: F(1, unitD), right: String(unitD) },
      { left: F(fracs[0][0], fracs[0][1]), right: F(fracs[0][1], fracs[0][0]) },
      { left: F(fracs[1][0], fracs[1][1]), right: F(fracs[1][1], fracs[1][0]) },
    ];
    const order = r.shuffle([0, 1, 2, 3]);
    const left = items.map((it) => it.left);
    const right = order.map((i) => items[i].right);
    const pairs = items.map((it, i) => [i, order.indexOf(i)]);
    return {
      type: 'match',
      skill: 'divide-whole',
      lesson: '6-1',
      title: 'Match each number to its reciprocal',
      prompt: `<p>Before a plate can flip, the Foundry needs the <b>reciprocal</b> of each number. Match each number on the left to its reciprocal on the right.</p><p class="muted">A number times its reciprocal equals 1.</p>`,
      left,
      right,
      pairs,
      hints: [
        'To find a reciprocal, swap the numerator and denominator.',
        `A whole number sits over 1: ${whole} = ${whole}/1, so its reciprocal is 1/${whole}.`,
        `Check with multiplication: ${fracs[0][0]}/${fracs[0][1]} × ${fracs[0][1]}/${fracs[0][0]} = 1.`,
      ],
      solution: `<p>Flip each fraction: ${whole} → ${F(1, whole)}; ${U.fracText(1, unitD)} → ${unitD}; ${U.fracText(fracs[0][0], fracs[0][1])} → ${U.fracText(fracs[0][1], fracs[0][0])}; ${U.fracText(fracs[1][0], fracs[1][1])} → ${U.fracText(fracs[1][1], fracs[1][0])}. Each pair multiplies to <b>1</b>.</p>`,
      feedback: {
        correct: 'Correct. Reciprocals swap top and bottom, and their product is always 1.',
        wrong(ans, dt) {
          const i = dt.wrong[0];
          if (i === 0) return `${whole} is ${whole}/1. Swap to get 1/${whole}, not another whole number.`;
          return 'Swap the numerator and denominator. The reciprocal of a fraction less than 1 is greater than 1.';
        },
      },
    };
  });

  // ---------- Who shared correctly? (who) ----------
  G.define('e1_whoShare', (r) => {
    const [n1, n2, n3] = r.pickN(NAMES, 3);
    const [a, b] = r.pick([
      [2, 3],
      [3, 4],
      [3, 5],
      [4, 5],
      [5, 6],
      [2, 5],
    ]);
    const w = r.int(2, 4);
    const [sn, sd] = simplify(a, b * w);
    const thing = r.pick(['pan of brownies', 'tin of polish', 'sheet of gold leaf', 'roll of tape']);
    const opts = [
      { html: `<b>${n1}:</b> ${F(a, b)} ÷ ${w} = ${F(a, b)} × ${F(1, w)} = ${F(a, b * w)}${sn !== a ? ` = ${F(sn, sd)}` : ''}`, ok: true },
      {
        html: `<b>${n2}:</b> ${F(a, b)} ÷ ${w} = ${F(a, b)} × ${F(w, 1)} = ${F(a * w, b)}`,
        why: `${n2} multiplied by ${w} instead of dividing. Sharing among ${w} people makes each share smaller, so flip ${w}/1 to 1/${w}.`,
      },
      { html: `<b>${n3}:</b> ${F(a, b)} ÷ ${w} = ${F(b, a)} × ${F(1, w)} = ${F(b, a * w)}`, why: `${n3} flipped the first fraction. Only the divisor (${w}/1) is flipped in Keep, Change, Flip.` },
    ];
    const sh = shuffleOptions(r, opts, 0);
    return {
      type: 'who',
      skill: 'divide-whole',
      lesson: '6-1',
      title: 'Who shared it correctly?',
      prompt: `<p>Three apprentices share ${hl(U.fracText(a, b))} of a ${thing} equally among ${hl(w + ' people')}. Each one wrote the division differently.</p><p>Who is correct?</p>`,
      options: sh.options,
      answer: sh.answer,
      layout: 'cards',
      hints: [`Each person gets a part of ${a}/${b}, so the answer must be smaller than ${a}/${b}.`, `Keep ${a}/${b}, change ÷ to ×, flip ${w}/1 to 1/${w}.`, `${a}/${b} × 1/${w} = ${a}/${b * w}.`],
      solution: `<p>${n1} is correct: ${F(a, b)} ÷ ${w} = ${F(a, b)} × ${F(1, w)} = <b>${F(sn, sd)}</b>. ${n2} multiplied instead of dividing, which made the share bigger. ${n3} flipped the wrong fraction.</p>`,
      feedback: { correct: `Correct. ${n1} kept ${a}/${b}, changed to ×, and flipped only the divisor.` },
    };
  });
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Zone 2 — The Cutting Floor. Lesson 6-2 Division Expressions with Fractions and Mixed Numbers. */
(function (root) {
  'use strict';
  const DEN = { 2: 'halves', 3: 'thirds', 4: 'fourths', 5: 'fifths', 6: 'sixths', 8: 'eighths', 10: 'tenths', 12: 'twelfths' };
  const den = (b) => DEN[b] || b + 'ths';
  const RX = root.RX;
  const { G, V, simplify, gcd, shuffleOptions, NAMES, parseNum } = RX;
  const U = RX.U6;
  const hl = V.hl;
  const F = (a, b) => V.frac(a, b);
  const T = U.fracText;

  /** Draw a proper fraction a/b in lowest terms with denominator from the pool. */
  function properFrac(r, pool) {
    const b = r.pick(pool);
    const choices = [];
    for (let a = 1; a < b; a++) if (gcd(a, b) === 1) choices.push(a);
    return [r.pick(choices), b];
  }

  // ---------- Fraction ÷ fraction, proper result (blanks, fraction layout) ----------
  G.define('e2_fracByFrac', (r) => {
    // dividend a/b smaller than divisor c/d so the quotient is a proper fraction
    let a, b, c, d;
    for (let tries = 0; tries < 50; tries++) {
      [a, b] = properFrac(r, [3, 4, 5, 6, 8]);
      [c, d] = properFrac(r, [2, 3, 4, 5, 6, 8]);
      if (a / b < c / d && !(a === 1 && c === 1)) break;
    }
    if (a / b >= c / d) {
      [a, b, c, d] = [1, 4, 2, 3];
    }
    const [sn, sd] = simplify(a * d, b * c);
    const name = r.pick(NAMES);
    return {
      type: 'blanks',
      skill: 'divide-fractions',
      lesson: '6-2',
      title: 'Divide a fraction by a fraction',
      prompt: `<p>${name} sets the cutting plate to ${hl(T(a, b) + ' ÷ ' + T(c, d))}.</p><p>Evaluate. Write the quotient as a fraction in simplest form.</p>`,
      fields: [
        { label: 'numerator (top)', answer: sn, width: 'sm' },
        { label: 'denominator (bottom)', answer: sd, width: 'sm' },
      ],
      layout: 'fraction',
      hints: [
        `Keep ${a}/${b}. Change ÷ to ×. Flip ${c}/${d} to its reciprocal.`,
        `${a}/${b} × ${d}/${c}. Multiply numerators, then denominators.`,
        `${a * d}/${b * c}${sn !== a * d ? `. Divide top and bottom by ${gcd(a * d, b * c)} to simplify.` : ' is already in simplest form.'}`,
      ],
      solution: `<p>${F(a, b)} ÷ ${F(c, d)} = ${F(a, b)} × ${F(d, c)} = ${F(a * d, b * c)}${sn !== a * d ? ` = <b>${F(sn, sd)}</b> (divide top and bottom by ${gcd(a * d, b * c)})` : ` = <b>${F(sn, sd)}</b>`}. Dividing by ${T(c, d)} is the same as multiplying by its reciprocal ${T(d, c)}.</p>`,
      feedback: {
        correct: `Correct. ${a}/${b} × ${d}/${c} = ${a * d}/${b * c}${sn !== a * d ? ` = ${sn}/${sd}` : ''}.`,
        wrong(ans) {
          const n = parseNum(ans[0]),
            m = parseNum(ans[1]);
          if (n != null && m && Math.abs(n / m - sn / sd) < 1e-9) return 'Your fraction is equivalent to the answer but not simplified. Divide top and bottom by their greatest common factor.';
          if (n != null && m && Math.abs(n / m - (a * c) / (b * d)) < 1e-9) return `${a * c}/${b * d} is ${a}/${b} × ${c}/${d}. You changed ÷ to × but did not flip ${c}/${d}.`;
          if (n != null && m && Math.abs(n / m - (b * d) / (a * c)) < 1e-9) return `You flipped the first fraction. Keep ${a}/${b}; flip only the divisor ${c}/${d}.`;
          if (n != null && m && Math.abs(n / m - (b * c) / (a * d)) < 1e-9) return `That is the reciprocal of the answer. Flip ${c}/${d}, not ${a}/${b}.`;
          return `Keep ${a}/${b}, change to ×, flip ${c}/${d} to ${d}/${c}, multiply across, then simplify.`;
        },
      },
    };
  });

  // ---------- Keep, Change, Flip with two fractions (cloze) ----------
  G.define('e2_kcfCloze', (r) => {
    const [a, b] = properFrac(r, [3, 4, 5, 6, 8]);
    let [c, d] = properFrac(r, [3, 4, 5, 6, 8]);
    if (c === a && d === b) [c, d] = b === 4 ? [2, 3] : [3, 4];
    const [sn, sd] = simplify(a * d, b * c);
    const recips = r.shuffle([T(d, c), T(c, d), T(b, a)]);
    const results = r.shuffle([T(sn, sd), T(...simplify(a * c, b * d)), T(...simplify(b * c, a * d))].filter((v, i, arr) => arr.indexOf(v) === i));
    while (results.length < 3) results.push(T(a + c, b + d));
    return {
      type: 'cloze',
      skill: 'divide-fractions',
      lesson: '6-2',
      title: 'Complete the method',
      prompt: `<p>Complete the steps to evaluate ${hl(T(a, b) + ' ÷ ' + T(c, d))}.</p>`,
      template: `Keep ${T(a, b)}, change ÷ to ×, and flip the divisor to {0}.  Then multiply across and simplify. The quotient is {1}.`,
      choices: [recips, results],
      answers: [recips.indexOf(T(d, c)), results.indexOf(T(sn, sd))],
      hints: [
        'The reciprocal of a fraction swaps its numerator and denominator.',
        `Only the second fraction, ${c}/${d}, is flipped. It becomes ${d}/${c}.`,
        `${a}/${b} × ${d}/${c} = ${a * d}/${b * c}. Simplify if you can.`,
      ],
      solution: `<p>Flip the divisor: ${F(c, d)} → ${F(d, c)}. Then ${F(a, b)} × ${F(d, c)} = ${F(a * d, b * c)}${sn !== a * d ? ` = <b>${F(sn, sd)}</b>` : ` = <b>${F(sn, sd)}</b>`}. The first fraction is kept exactly as it is.</p>`,
      feedback: {
        correct: `Correct. Flip only the divisor, then multiply across: ${T(sn, sd)}.`,
        wrong(ans, dt) {
          if (dt.wrong.includes(0)) return `The reciprocal of ${c}/${d} swaps top and bottom: ${d}/${c}. The first fraction does not flip.`;
          return `Multiply ${a}/${b} × ${d}/${c}: tops ${a} × ${d}, bottoms ${b} × ${c}. Then simplify.`;
        },
      },
    };
  });

  // ---------- Error: flipped the dividend instead of the divisor (error) ----------
  G.define('e2_errorFlip', (r) => {
    const name = r.pick(NAMES);
    // whole-number quotients so the fix is a whole number
    const sets = [
      [3, 4, 1, 8, 6],
      [2, 3, 1, 6, 4],
      [5, 6, 1, 12, 10],
      [3, 5, 3, 10, 2],
      [4, 5, 2, 15, 6],
      [1, 2, 1, 8, 4],
      [3, 4, 3, 8, 2],
      [2, 3, 2, 9, 3],
      [5, 8, 5, 16, 2],
    ];
    const [a, b, c, d, q] = r.pick(sets);
    const [wn, wd] = simplify(b * c, a * d);
    const opts = [
      { html: `${name} flipped the first fraction. Only the divisor ${T(c, d)} should be flipped, to ${T(d, c)}.`, ok: true },
      { html: `${name} should have flipped both fractions.`, why: `Flipping both fractions gives the reciprocal of the right answer. Only the divisor flips.` },
      { html: `${name} should not have changed ÷ to ×.`, why: `Changing ÷ to × is correct. The error is which fraction was flipped.` },
      {
        html: `The work is correct. Dividing fractions always gives a smaller answer.`,
        why: `Dividing by a fraction less than 1 gives a LARGER answer. ${T(a, b)} ÷ ${T(c, d)} should be more than ${T(a, b)}.`,
      },
    ];
    const sh = shuffleOptions(r, opts, 0);
    return {
      type: 'error',
      skill: 'divide-fractions',
      lesson: '6-2',
      title: 'Find the mistake',
      prompt: `<p>${name} evaluated ${hl(T(a, b) + ' ÷ ' + T(c, d))} on the cutting floor.</p><p>What is the mistake?</p>`,
      work: `${F(a, b)} ÷ ${F(c, d)} = ${F(b, a)} × ${F(c, d)} = ${F(b * c, a * d)}${wn !== b * c ? ` = ${F(wn, wd)}` : ''}`,
      options: sh.options,
      answer: sh.answer,
      fix: { label: 'The correct quotient is', answer: q },
      hints: [
        `Keep, Change, Flip: which fraction stays, and which one flips?`,
        `The first fraction ${a}/${b} is kept. The divisor ${c}/${d} flips to ${d}/${c}.`,
        `${a}/${b} × ${d}/${c} = ${a * d}/${b * c}. Simplify to a whole number.`,
      ],
      solution: `<p>${name} flipped ${T(a, b)}, the dividend. The correct work is ${F(a, b)} × ${F(d, c)} = ${F(a * d, b * c)} = <b>${q}</b>. In other words, ${T(c, d)} fits into ${T(a, b)} exactly ${q} times.</p>`,
      feedback: {
        correct: `Correct. Keep the first fraction, flip only the divisor: ${T(a, b)} ÷ ${T(c, d)} = ${q}.`,
        wrong(ans, dt) {
          if (!dt.mistakeOk) return (sh.options[ans.mistake] && sh.options[ans.mistake].why) || `Look at which fraction ${name} flipped.`;
          return `You found the mistake. For the fix: ${a}/${b} × ${d}/${c} = ${a * d}/${b * c}, which simplifies to a whole number.`;
        },
      },
    };
  });

  // ---------- Story: fraction ÷ fraction with a whole-number answer (num) ----------
  G.define('e2_storyFrac', (r) => {
    const name = r.pick(NAMES);
    const sets = [
      [3, 4, 1, 8, 6],
      [2, 3, 1, 6, 4],
      [5, 6, 1, 12, 10],
      [3, 5, 3, 10, 2],
      [4, 5, 2, 15, 6],
      [1, 2, 1, 8, 4],
      [3, 4, 3, 8, 2],
      [2, 3, 2, 9, 3],
      [5, 8, 5, 16, 2],
      [3, 4, 1, 4, 3],
      [5, 6, 1, 6, 5],
    ];
    const [a, b, c, d, q] = r.pick(sets);
    const ctx = r.pick([
      [`${name} has ${T(a, b)} gallon of lamp oil. Each lamp holds ${T(c, d)} gallon.`, 'How many lamps can be filled?', 'lamps'],
      [`A strip of tin ${T(a, b)} meter long is cut into pieces each ${T(c, d)} meter long.`, 'How many pieces are cut?', 'pieces'],
      [`A machine runs for ${T(a, b)} hour. Each cycle takes ${T(c, d)} hour.`, 'How many cycles does it complete?', 'cycles'],
      [`${name} has ${T(a, b)} pound of solder and uses ${T(c, d)} pound per joint.`, 'How many joints can be made?', 'joints'],
    ]);
    return {
      type: 'num',
      skill: 'divide-fractions',
      lesson: '6-2',
      title: 'Divide to solve the story',
      prompt: `<p>${ctx[0]}</p><p>${ctx[1]}</p>`,
      unit: ctx[2],
      answer: q,
      hints: [
        `The question asks how many ${T(c, d)}s fit in ${T(a, b)}. Write the division: ${a}/${b} ÷ ${c}/${d}.`,
        `Keep ${a}/${b}, change to ×, flip ${c}/${d} to ${d}/${c}.`,
        `${a}/${b} × ${d}/${c} = ${a * d}/${b * c}. Simplify.`,
      ],
      solution: `<p>${F(a, b)} ÷ ${F(c, d)} = ${F(a, b)} × ${F(d, c)} = ${F(a * d, b * c)} = <b>${q} ${ctx[2]}</b>. Check by multiplying: ${q} × ${T(c, d)} = ${T(a, b)}.</p>`,
      feedback: {
        correct: `Correct. ${T(c, d)} fits into ${T(a, b)} exactly ${q} times.`,
        wrong(ans, dt) {
          const v = dt.value;
          if (v != null && Math.abs(v - (a * c) / (b * d)) < 1e-6) return `You multiplied ${a}/${b} × ${c}/${d}. "How many fit" is division: flip ${c}/${d} first.`;
          if (v != null && Math.abs(v - 1 / q) < 1e-6) return `That is the reciprocal of the answer. You flipped the wrong fraction. Keep ${a}/${b} and flip ${c}/${d}.`;
          return `Write ${a}/${b} ÷ ${c}/${d}, then Keep, Change, Flip. The answer is a whole number.`;
        },
      },
    };
  });

  // ---------- Mixed number → improper fraction (blanks, fraction layout) ----------
  G.define('e2_toImproper', (r) => {
    const w = r.int(1, 5);
    const [a, b] = properFrac(r, [2, 3, 4, 5, 6, 8]);
    const n = w * b + a;
    const name = r.pick(NAMES);
    return {
      type: 'blanks',
      skill: 'divide-mixed',
      lesson: '6-2',
      title: 'Rewrite the mixed number',
      prompt: `<p>Before the blade can flip anything, every mixed number must be rewritten as a single fraction.</p><p>${name} reads ${hl(U.mixedText(w, a, b))} on the plate. Write it as an improper fraction.</p>`,
      fields: [
        { label: 'numerator (top)', answer: n, width: 'sm' },
        { label: 'denominator (bottom)', answer: b, width: 'sm' },
      ],
      layout: 'fraction',
      hints: [
        `The denominator stays ${b}. Each whole is ${b}/${b}.`,
        `${w} wholes = ${w} × ${b} = ${w * b} ${den(b)}. Then add the ${a} extra ${den(b)}.`,
        `${w} × ${b} + ${a} = ? That goes on top, over ${b}.`,
      ],
      solution: `<p>${U.mixed(w, a, b)} = ${F(w * b, b)} + ${F(a, b)} = <b>${F(n, b)}</b>. Multiply the whole number by the denominator (${w} × ${b} = ${w * b}), add the numerator (${w * b} + ${a} = ${n}), and keep the denominator.</p>`,
      feedback: {
        correct: `Correct. ${w} × ${b} + ${a} = ${n}, so ${U.mixedText(w, a, b)} = ${n}/${b}.`,
        wrong(ans) {
          const t = parseNum(ans[0]),
            m = parseNum(ans[1]);
          if (t === w + a && m === b) return `You added ${w} + ${a}. The whole number ${w} is worth ${w} × ${b} = ${w * b} ${den(b)}, not ${w} ${den(b)}.`;
          if (t === w * a && m === b) return `You multiplied ${w} × ${a}. Multiply the whole number by the DENOMINATOR (${b}), then add the numerator ${a}.`;
          if (t === n && m !== b) return `The numerator is right. The denominator stays ${b}, because the pieces are still ${den(b)}.`;
          return `Multiply ${w} × ${b}, add ${a}, and write that over ${b}.`;
        },
      },
    };
  });

  // ---------- Mixed ÷ fraction with a mixed-number answer (blanks, template) ----------
  G.define('e2_mixedDivide', (r, o) => {
    const hard = !!o.hard;
    // Ensure quotient is a non-whole mixed number.
    let w, a, b, c, d, qn, qd, mix;
    for (let tries = 0; tries < 200; tries++) {
      w = hard ? r.int(2, 6) : r.int(1, 4);
      [a, b] = properFrac(r, hard ? [3, 4, 5, 6, 8] : [2, 3, 4]);
      [c, d] = properFrac(r, hard ? [3, 4, 5, 6, 8] : [2, 3, 4]);
      const n = w * b + a;
      [qn, qd] = simplify(n * d, b * c);
      mix = U.toMixed(n * d, b * c);
      if (qd !== 1 && mix[0] >= 1 && mix[0] <= 12 && qd <= 12) break;
    }
    const n = w * b + a;
    const [W, N, D] = mix;
    const name = r.pick(NAMES);
    const ctx = hard
      ? `<p>${name} must evaluate ${hl(U.mixedText(w, a, b) + ' ÷ ' + T(c, d))} with no plate to guide the steps.</p>`
      : `<p>${name} has ${hl(U.mixedText(w, a, b) + ' feet')} of brass ribbon. Each gear tag needs ${hl(T(c, d) + ' foot')}.</p><p>Evaluate ${U.mixedText(w, a, b)} ÷ ${T(c, d)} to find how many tags can be cut.</p>`;
    return {
      type: 'blanks',
      skill: 'divide-mixed',
      lesson: '6-2',
      title: hard ? 'Divide with a mixed number' : 'Divide the ribbon',
      prompt: `${ctx}<p>Write the quotient as a mixed number in simplest form.</p>`,
      fields: [
        { label: 'whole number', answer: W, width: 'xs' },
        { label: 'numerator', answer: N, width: 'xs' },
        { label: 'denominator', answer: D, width: 'xs' },
      ],
      template: `Quotient = {0} and {1}/{2}`,
      hints: [
        `First rewrite ${U.mixedText(w, a, b)} as an improper fraction: ${w} × ${b} + ${a} = ${n}, so ${n}/${b}.`,
        `Keep ${n}/${b}, change ÷ to ×, flip ${c}/${d} to ${d}/${c}: ${n}/${b} × ${d}/${c} = ${n * d}/${b * c}.`,
        `${n * d}/${b * c}${qn !== n * d ? ` simplifies to ${qn}/${qd}` : ''}. ${qd} goes into ${qn} ${W} times with ${N} left over.`,
      ],
      solution: `<p>Rewrite: ${U.mixed(w, a, b)} = ${F(n, b)}. Keep, Change, Flip: ${F(n, b)} × ${F(d, c)} = ${F(n * d, b * c)}${qn !== n * d ? ` = ${F(qn, qd)}` : ''} = <b>${U.mixed(W, N, D)}</b>. ${hard ? 'The mixed number is rewritten first so that only a single fraction is flipped and multiplied.' : `${name} can cut ${W} full tags, with ${T(N, D)} of a tag's length left over.`}</p>`,
      feedback: {
        correct: `Correct. Rewrite, flip the divisor, multiply, then convert back: ${U.mixedText(W, N, D)}.`,
        wrong(ans) {
          const x = parseNum(ans[0]),
            y = parseNum(ans[1]),
            z = parseNum(ans[2]);
          if (x === W && y != null && z && Math.abs(y / z - N / D) < 1e-9) return 'Your mixed number is equivalent to the answer, but the fraction part is not in simplest form.';
          const wrongFlip = (w * d) / c + (a * d) / (b * c);
          if (x != null && y != null && z && Math.abs(x + y / z - (w + a / b) * (c / d)) < 1e-6) return `You multiplied by ${c}/${d} instead of dividing. Flip the divisor to ${d}/${c} first.`;
          if (x != null && y != null && z && Math.abs(x + y / z - wrongFlip) < 1e-6)
            return `You flipped and multiplied the whole number and the fraction separately. Rewrite ${U.mixedText(w, a, b)} as ${n}/${b} first, then flip only the divisor.`;
          return `Rewrite ${U.mixedText(w, a, b)} as ${n}/${b}. Then ${n}/${b} × ${d}/${c}. Convert the result back to a mixed number.`;
        },
      },
    };
  });

  // ---------- Sort quotients: greater than 1 or less than 1 (sort) ----------
  G.define('e2_sortQuotient', (r) => {
    const pool = [];
    const fr = [
      [1, 2],
      [2, 3],
      [3, 4],
      [1, 3],
      [3, 5],
      [5, 6],
      [1, 4],
      [4, 5],
      [2, 5],
      [5, 8],
    ];
    const seen = new Set();
    const want = [0, 0, 0, 1, 1, 1];
    for (const bin of want) {
      for (let tries = 0; tries < 100; tries++) {
        const [a, b] = r.pick(fr);
        const [c, d] = r.pick(fr);
        const wn = bin === 0 && r.chance(0.5) ? r.int(1, 3) : 0;
        const dividend = wn + a / b;
        if (dividend === c / d) continue;
        if ((dividend > c / d ? 0 : 1) !== bin) continue;
        const key = `${wn}-${a}/${b}-${c}/${d}`;
        if (seen.has(key)) continue;
        seen.add(key);
        pool.push({ html: `${wn ? U.mixed(wn, a, b) : F(a, b)} ÷ ${F(c, d)}`, bin });
        break;
      }
    }
    const items = r.shuffle(pool);
    return {
      type: 'sort',
      skill: 'divide-fractions',
      lesson: '6-2',
      title: 'Estimate before you cut',
      prompt: `<p>A good engineer estimates first. Sort each division expression by the size of its quotient. Do not compute exactly: compare the dividend (first number) with the divisor (second number).</p>`,
      bins: ['Quotient is greater than 1', 'Quotient is less than 1'],
      items,
      hints: [
        'Ask: does the divisor fit into the dividend at least once?',
        'If the first number is bigger than the second, the second fits in more than once, so the quotient is greater than 1.',
        'If the first number is smaller than the second, it fits in less than one time, so the quotient is less than 1.',
      ],
      solution: `<p>When the dividend is larger than the divisor, the quotient is greater than 1. When the dividend is smaller, the quotient is less than 1. For example, ${F(3, 4)} ÷ ${F(1, 2)} is greater than 1 because ${T(1, 2)} fits into ${T(3, 4)} one and a half times, but ${F(1, 4)} ÷ ${F(1, 2)} is less than 1 because ${T(1, 4)} is only half of ${T(1, 2)}.</p>`,
      feedback: {
        correct: 'Correct. Comparing the dividend to the divisor tells you whether the quotient is more or less than 1.',
        wrong(ans, dt) {
          const i = dt.wrong[0];
          const it = items[i];
          return it.bin === 0
            ? 'Look again: in this expression the first number is bigger than the second, so the divisor fits more than once. The quotient is greater than 1.'
            : 'Look again: the first number is smaller than the second, so the divisor fits less than once. The quotient is less than 1.';
        },
      },
    };
  });

  // ---------- Story with mixed numbers, whole-number quotient (mc) ----------
  G.define('e2_storyMixed', (r) => {
    const name = r.pick(NAMES);
    // [w, a, b, c, d, q]: (w a/b) ÷ (c/d) = q whole
    const sets = [
      [4, 1, 2, 3, 4, 6],
      [2, 1, 4, 3, 4, 3],
      [3, 1, 3, 2, 3, 5],
      [1, 1, 2, 3, 8, 4],
      [5, 1, 4, 3, 4, 7],
      [2, 2, 3, 2, 3, 4],
      [1, 3, 4, 1, 4, 7],
      [3, 3, 4, 3, 8, 10],
