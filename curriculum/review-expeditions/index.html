/* Grade 6 Review Expeditions — shared utilities (pure, usable in browser and Node). */
(function (root) {
  'use strict';
  const RX = root.RX || (root.RX = {});

  /** Mulberry32 seeded PRNG. Returns function () -> [0,1). */
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const R = {
    make(seed) {
      const next = rng(seed);
      const api = {
        next,
        int(lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
        pick(arr) { return arr[Math.floor(next() * arr.length)]; },
        pickN(arr, n) { return api.shuffle(arr).slice(0, n); },
        shuffle(arr) {
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(next() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        },
        chance(p) { return next() < p; },
      };
      return api;
    },
  };

  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
  function simplify(a, b) { const g = gcd(a, b) || 1; return [a / g, b / g]; }
  function round(n, places) { const f = Math.pow(10, places); return Math.round((n + Number.EPSILON) * f) / f; }
  function money(n) { return '$' + n.toFixed(2); }
  function fmt(n) {
    if (Number.isInteger(n)) return n.toLocaleString('en-US');
    return String(round(n, 3));
  }
  function plural(n, one, many) { return n === 1 ? one : (many || one + 's'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  /** Parse a student-typed number. Accepts "1,200", "$5.65", "3/4", " 7 ". Returns null if invalid. */
  function parseNum(s) {
    if (s == null) return null;
    let t = String(s).trim().replace(/[$,\s]/g, '');
    if (!t) return null;
    const frac = t.match(/^(-?\d+)\/(\d+)$/);
    if (frac) { const d = Number(frac[2]); if (!d) return null; return Number(frac[1]) / d; }
    if (!/^-?\d*\.?\d+$/.test(t)) return null;
    return Number(t);
  }
  function near(a, b, tol) { return Math.abs(a - b) <= (tol == null ? 1e-9 : tol); }

  /** Shuffle options and return {options, answer} with answer index remapped (single) or indexes (array). */
  function shuffleOptions(r, options, answer) {
    const idx = r.shuffle(options.map((_, i) => i));
    const out = idx.map((i) => options[i]);
    if (Array.isArray(answer)) return { options: out, answers: answer.map((a) => idx.indexOf(a)).sort((x, y) => x - y) };
    return { options: out, answer: idx.indexOf(answer) };
  }

  const NAMES = ['Priya', 'Marcus', 'Aaliyah', 'Jordan', 'Darnell', 'Maya', 'Carlos', 'Tasha', 'Devon', 'Elena', 'Noah', 'Zoe', 'Kai', 'Imani', 'Mateo', 'Layla', 'Omar', 'Sofia', 'Jaden', 'Nia', 'Leo', 'Amara', 'Diego', 'Hana', 'Malik', 'Ruby', 'Theo', 'Ivy', 'Andre', 'Sage'];

  Object.assign(RX, { R, gcd, simplify, round, money, fmt, plural, esc, parseNum, near, shuffleOptions, NAMES });
})(typeof window !== 'undefined' ? window : globalThis);

/* Grade 6 Review Expeditions — pure HTML/SVG builders for math representations. No DOM access. */
(function (root) {
  'use strict';
  const RX = root.RX || (root.RX = {});
  const esc = RX.esc;

  const COLORS = { a: '#1FA6A2', b: '#F2A33A', c: '#3B6FB6', d: '#C8553D', grid: '#D5DEE6', axis: '#24323F', text: '#24323F' };

  /** Coordinate graph. opts: {xLabel,yLabel,xMax,yMax,xStep,yStep,series:[{points:[[x,y]],color,label,line:bool}], size} */
  function graph(o) {
    const size = o.size || 320, pad = { l: 54, r: 18, t: 18, b: 50 };
    const w = size, h = size;
    const xMax = o.xMax, yMax = o.yMax, xs = o.xStep || 1, ys = o.yStep || 1;
    const px = (x) => pad.l + (x / xMax) * (w - pad.l - pad.r);
    const py = (y) => h - pad.b - (y / yMax) * (h - pad.t - pad.b);
    let s = `<svg class="viz-graph" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Coordinate graph')}">`;
    for (let x = 0; x <= xMax; x += xs) s += `<line x1="${px(x)}" y1="${py(0)}" x2="${px(x)}" y2="${py(yMax)}" stroke="${COLORS.grid}" stroke-width="1"/>`;
    for (let y = 0; y <= yMax; y += ys) s += `<line x1="${px(0)}" y1="${py(y)}" x2="${px(xMax)}" y2="${py(y)}" stroke="${COLORS.grid}" stroke-width="1"/>`;
    s += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(xMax)}" y2="${py(0)}" stroke="${COLORS.axis}" stroke-width="2"/>`;
    s += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(0)}" y2="${py(yMax)}" stroke="${COLORS.axis}" stroke-width="2"/>`;
    const xl = o.xLabelEvery || xs, yl = o.yLabelEvery || ys;
    for (let x = 0; x <= xMax; x += xl) s += `<text x="${px(x)}" y="${py(0) + 16}" font-size="11" text-anchor="middle" fill="${COLORS.text}">${x}</text>`;
    for (let y = 0; y <= yMax; y += yl) s += `<text x="${px(0) - 6}" y="${py(y) + 4}" font-size="11" text-anchor="end" fill="${COLORS.text}">${y}</text>`;
    if (o.xLabel) s += `<text x="${(px(0) + px(xMax)) / 2}" y="${h - 10}" font-size="12" font-weight="600" text-anchor="middle" fill="${COLORS.text}">${esc(o.xLabel)}</text>`;
    if (o.yLabel) s += `<text transform="translate(14 ${(py(0) + py(yMax)) / 2}) rotate(-90)" font-size="12" font-weight="600" text-anchor="middle" fill="${COLORS.text}">${esc(o.yLabel)}</text>`;
    (o.series || []).forEach((ser) => {
      const col = ser.color || COLORS.a;
      if (ser.line && ser.points.length > 1) {
        const pts = ser.points.slice().sort((p, q) => p[0] - q[0]);
        s += `<polyline fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="${ser.dashed ? '5 4' : '0'}" points="${pts.map((p) => px(p[0]) + ',' + py(p[1])).join(' ')}"/>`;
      }
      ser.points.forEach((p) => { s += `<circle cx="${px(p[0])}" cy="${py(p[1])}" r="5.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>`; });
      if (ser.label) {
        const last = ser.points.reduce((m, p) => (p[0] > m[0] ? p : m), ser.points[0]);
        s += `<text x="${Math.min(px(last[0]) + 8, w - 4)}" y="${py(last[1]) - 8}" font-size="12" font-weight="700" fill="${col}" text-anchor="${px(last[0]) > w - 70 ? 'end' : 'start'}">${esc(ser.label)}</text>`;
      }
    });
    s += '</svg>';
    return s;
  }

  /** Simple data table. rows: [[cell,...],...]; first row is header if opts.header !== false. */
  function table(rows, o) {
    o = o || {};

    if (o.caption) s += `<caption>${o.caption}</caption>`;
    rows.forEach((r, i) => {
      const tag = (i === 0 && o.header !== false) || (o.rowHeader && true) ? null : null;
      s += '<tr>' + r.map((c, j) => {
        const isHead = (i === 0 && o.header !== false) || (o.rowHeader && j === 0);
        return isHead ? `<th scope="${i === 0 && o.header !== false ? 'col' : 'row'}">${c}</th>` : `<td>${c}</td>`;
      }).join('') + '</tr>';
    });
    return s + '</table>';
  }

  /** Tape diagram. rows: [{label, boxes, value?, color}]; opts {boxText: fn(rowIdx, boxIdx) -> string} */
  function tape(rows, o) {
    o = o || {};
    const bw = o.boxW || 42, bh = 34, lw = o.labelW || 80, gap = 14;
    const maxBoxes = Math.max(...rows.map((r) => r.boxes));
    const w = lw + maxBoxes * bw + 10, h = rows.length * (bh + gap) + 4;
    let s = `<svg class="viz-tape" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Tape diagram')}">`;
    rows.forEach((r, ri) => {
      const y = 2 + ri * (bh + gap);
      const col = r.color || (ri === 0 ? COLORS.a : COLORS.b);
      s += `<text x="${lw - 10}" y="${y + bh / 2 + 5}" font-size="13" font-weight="700" text-anchor="end" fill="${COLORS.text}">${esc(r.label)}</text>`;
      for (let b = 0; b < r.boxes; b++) {
        const x = lw + b * bw;
        s += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${col}" fill-opacity="0.18" stroke="${col}" stroke-width="2"/>`;
        const t = o.boxText ? o.boxText(ri, b) : (r.value != null ? r.value : '');
        if (t !== '' && t != null) s += `<text x="${x + bw / 2}" y="${y + bh / 2 + 5}" font-size="13" font-weight="600" text-anchor="middle" fill="${COLORS.text}">${esc(t)}</text>`;
      }
      if (r.total != null) s += `<text x="${lw + r.boxes * bw + 8}" y="${y + bh / 2 + 5}" font-size="13" font-weight="700" fill="${col}">${esc(r.total)}</text>`;
    });
    return s + '</svg>';
  }

  /** Double number line. top/bottom: {label, values:[...]} where a value may be '?' */
  function dnl(top, bottom, o) {
    o = o || {};
    const n = top.values.length, step = 78, lw = 70, w = lw + (n - 1) * step + 50, h = 112;
    const x = (i) => lw + i * step;
    let s = `<svg class="viz-dnl" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Double number line')}">`;
    [[top, 42, -10], [bottom, 70, 24]].forEach(([row, y, dy], ri) => {
      s += `<text x="${lw - 12}" y="${y + 5}" font-size="12" font-weight="700" text-anchor="end" fill="${COLORS.text}">${esc(row.label)}</text>`;
      s += `<line x1="${x(0)}" y1="${y}" x2="${x(n - 1) + 28}" y2="${y}" stroke="${COLORS.axis}" stroke-width="2" marker-end="url(#arr${ri})"/>`;
      s += `<defs><marker id="arr${ri}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${COLORS.axis}"/></marker></defs>`;
      row.values.forEach((v, i) => {
        s += `<line x1="${x(i)}" y1="${y - 7}" x2="${x(i)}" y2="${y + 7}" stroke="${COLORS.axis}" stroke-width="2"/>`;
        const isQ = v === '?' || v == null;
        s += `<text x="${x(i)}" y="${y + dy}" font-size="13" font-weight="${isQ ? '800' : '600'}" text-anchor="middle" fill="${isQ ? COLORS.d : COLORS.text}">${isQ ? '?' : esc(v)}</text>`;
      });
    });
    return s + '</svg>';
  }

  /** Row of simple icon shapes for counting. kind: 'circle'|'square'|'tri'|'diamond' */
  function icons(count, kind, color, label) {
    const sz = 22, gap = 6, perRow = 10;
    const rows = Math.ceil(count / perRow);
    const w = Math.min(count, perRow) * (sz + gap), h = rows * (sz + gap);
    let s = `<svg class="viz-icons" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${count} ${esc(label || kind)}">`;
    for (let i = 0; i < count; i++) {
      const x = (i % perRow) * (sz + gap), y = Math.floor(i / perRow) * (sz + gap);
      if (kind === 'circle') s += `<circle cx="${x + sz / 2}" cy="${y + sz / 2}" r="${sz / 2 - 1}" fill="${color}"/>`;
      else if (kind === 'tri') s += `<polygon points="${x + sz / 2},${y + 1} ${x + sz - 1},${y + sz - 1} ${x + 1},${y + sz - 1}" fill="${color}"/>`;
      else if (kind === 'diamond') s += `<polygon points="${x + sz / 2},${y + 1} ${x + sz - 1},${y + sz / 2} ${x + sz / 2},${y + sz - 1} ${x + 1},${y + sz / 2}" fill="${color}"/>`;
      else s += `<rect x="${x + 1}" y="${y + 1}" width="${sz - 2}" height="${sz - 2}" rx="4" fill="${color}"/>`;
    }
    return s + '</svg>';
  }

  /** Highlighted number/unit span used in prompts. */
  function hl(v) { return `<mark class="num">${esc(v)}</mark>`; }
  function unit(v) { return `<span class="unit">${esc(v)}</span>`; }
  function frac(a, b) { return `<span class="frac"><span class="num-top">${esc(a)}</span><span class="num-bot">${esc(b)}</span></span>`; }

  RX.V = { COLORS, graph, table, tape, dnl, icons, hl, unit, frac };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Grade 6 Review Expeditions — additional pure SVG builders: number lines, data displays, percent models,
   geometry figures, nets, a pan balance. No DOM access; usable in Node for verification. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const V = RX.V;
  const esc = RX.esc;
  const C = V.COLORS;
  const fmtN = (n) => (Number.isInteger(n) ? String(n) : String(Math.round(n * 1000) / 1000));

  /** Horizontal number line. o: {min,max,step,labelEvery,points:[{v,label,color,open,above}],segments:[{from,to,color}],arrow:{from,to,color,label},size,width,aria,ticksOnly} */
  function numberLine(o) {
    const min = o.min,
      max = o.max,
      step = o.step || 1,
      le = o.labelEvery || step;
    const w = o.width || 520,
      padL = 28,
      padR = 28,
      y = 48,
      h = o.arrow || (o.points || []).some((p) => p.above) ? 100 : 86;
    const x = (v) => padL + ((v - min) / (max - min)) * (w - padL - padR);
    let s = `<svg class="viz-nl" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Number line from ' + min + ' to ' + max)}">`;
    (o.segments || []).forEach((sg) => {
      s += `<line x1="${x(sg.from)}" y1="${y}" x2="${x(sg.to)}" y2="${y}" stroke="${sg.color || C.a}" stroke-width="7" stroke-linecap="round" opacity=".85"/>`;
    });
    s += `<line x1="${padL - 14}" y1="${y}" x2="${w - padR + 14}" y2="${y}" stroke="${C.axis}" stroke-width="2.5"/>`;
    s += `<path d="M${padL - 20},${y} l8,-5 v10 z M${w - padR + 20},${y} l-8,-5 v10 z" fill="${C.axis}"/>`;
    const n = Math.round((max - min) / step);
    for (let i = 0; i <= n; i++) {
      const v = min + i * step,
        major = Math.abs(((v - min) / le) % 1) < 1e-9 || Math.abs((((v - min) / le) % 1) - 1) < 1e-9;
      s += `<line x1="${x(v)}" y1="${y - (major ? 9 : 5)}" x2="${x(v)}" y2="${y + (major ? 9 : 5)}" stroke="${C.axis}" stroke-width="${major ? 2 : 1.4}"/>`;
      if (major && !o.ticksOnly) s += `<text x="${x(v)}" y="${y + 26}" font-size="12" text-anchor="middle" fill="${C.text}" font-weight="${v === 0 ? '800' : '500'}">${fmtN(v)}</text>`;
    }
    if (o.arrow) {
      const a = o.arrow,
        dir = a.to >= a.from ? 1 : -1;
      const ay = y - 22;
      s += `<path d="M${x(a.from)},${ay} L${x(a.to) - dir * 8},${ay}" stroke="${a.color || C.d}" stroke-width="2.5" fill="none"/><path d="M${x(a.to)},${ay} l${-dir * 9},-5 v10 z" fill="${a.color || C.d}"/>`;
      if (a.label) s += `<text x="${(x(a.from) + x(a.to)) / 2}" y="${ay - 8}" font-size="12" font-weight="700" text-anchor="middle" fill="${a.color || C.d}">${esc(a.label)}</text>`;
    }
    (o.points || []).forEach((p) => {
      const col = p.color || C.d;
      s += `<circle cx="${x(p.v)}" cy="${y}" r="7" fill="${p.open ? '#fff' : col}" stroke="${col}" stroke-width="3"/>`;
      if (p.label != null) s += `<text x="${x(p.v)}" y="${p.above ? y - 16 : y + 44}" font-size="13" font-weight="800" text-anchor="middle" fill="${col}">${esc(p.label)}</text>`;
    });
    if (o.ray) {
      const r = o.ray,
        dir = r.dir === 'left' ? -1 : 1;
      const end = dir > 0 ? w - padR + 14 : padL - 14;
      s += `<line x1="${x(r.v)}" y1="${y}" x2="${end}" y2="${y}" stroke="${r.color || C.a}" stroke-width="6" stroke-linecap="round" opacity=".9"/><circle cx="${x(r.v)}" cy="${y}" r="8" fill="${r.open ? '#fff' : r.color || C.a}" stroke="${r.color || C.a}" stroke-width="3"/>`;
    }
    return s + '</svg>';
  }

  /** Vertical number line (thermometer / elevation). o: {min,max,step,labelEvery,points:[{v,label,color}],height} */
  function verticalLine(o) {
    const min = o.min,
      max = o.max,
      step = o.step || 1,
      le = o.labelEvery || step;
    const h = o.height || 300,
      w = 150,
      x = 60,
      padT = 18,
      padB = 18;
    const y = (v) => h - padB - ((v - min) / (max - min)) * (h - padT - padB);
    let s = `<svg class="viz-vl" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Vertical number line')}">`;
    s += `<line x1="${x}" y1="${padT - 8}" x2="${x}" y2="${h - padB + 8}" stroke="${C.axis}" stroke-width="2.5"/>`;
    const n = Math.round((max - min) / step);
    for (let i = 0; i <= n; i++) {
      const v = min + i * step,
        major = Math.abs(((v - min) / le) % 1) < 1e-9;
      s += `<line x1="${x - (major ? 9 : 5)}" y1="${y(v)}" x2="${x + (major ? 9 : 5)}" y2="${y(v)}" stroke="${C.axis}" stroke-width="${major ? 2 : 1.4}"/>`;
      if (major) s += `<text x="${x - 14}" y="${y(v) + 4}" font-size="12" text-anchor="end" fill="${C.text}" font-weight="${v === 0 ? '800' : '500'}">${fmtN(v)}</text>`;
    }
    (o.points || []).forEach((p) => {
      const col = p.color || C.d;
      s += `<circle cx="${x}" cy="${y(p.v)}" r="7" fill="${col}" stroke="#fff" stroke-width="2"/>`;
      if (p.label) s += `<text x="${x + 16}" y="${y(p.v) + 4}" font-size="12" font-weight="700" fill="${col}">${esc(p.label)}</text>`;
    });
    return s + '</svg>';
  }

  /** Dot plot. o: {values:[...], min, max, label, step, size} */
  function dotPlot(o) {
    const vals = o.values.slice().sort((a, b) => a - b);
    const min = o.min != null ? o.min : vals[0],
      max = o.max != null ? o.max : vals[vals.length - 1],
      step = o.step || 1;
    const counts = {};
    vals.forEach((v) => {
      counts[v] = (counts[v] || 0) + 1;
    });
    const maxC = Math.max(...Object.values(counts), 1);
    const w = o.width || 480,
      padL = 24,
      padR = 24,
      r = 7,
      rowH = 17,
      baseY = 30 + maxC * rowH,
      h = baseY + 44;
    const x = (v) => padL + ((v - min) / (max - min || 1)) * (w - padL - padR);
    let s = `<svg class="viz-dot" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Dot plot')}">`;
    s += `<line x1="${padL - 10}" y1="${baseY}" x2="${w - padR + 10}" y2="${baseY}" stroke="${C.axis}" stroke-width="2.5"/>`;
    const n = Math.round((max - min) / step);
    for (let i = 0; i <= n; i++) {
      const v = min + i * step;
      s += `<line x1="${x(v)}" y1="${baseY - 5}" x2="${x(v)}" y2="${baseY + 5}" stroke="${C.axis}" stroke-width="1.5"/><text x="${x(v)}" y="${baseY + 20}" font-size="12" text-anchor="middle" fill="${C.text}">${fmtN(v)}</text>`;
    }
    Object.keys(counts).forEach((k) => {
      const v = Number(k);
      for (let i = 0; i < counts[k]; i++) s += `<circle cx="${x(v)}" cy="${baseY - 12 - i * rowH}" r="${r}" fill="${o.color || C.a}" stroke="#fff" stroke-width="1.5"/>`;
    });
    if (o.label) s += `<text x="${w / 2}" y="${h - 6}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(o.label)}</text>`;
    return s + '</svg>';
  }

  /** Histogram. o: {bins:[{label,count}], yMax, yStep, xLabel, yLabel, color, size} */
  function histogram(o) {
    const bins = o.bins,
      yMax = o.yMax || Math.max(...bins.map((b) => b.count)) + 1,
      ys = o.yStep || 1;
    const w = o.width || 420,
      h = o.height || 260,
      pad = { l: 46, r: 14, t: 14, b: 58 };
    const bw = (w - pad.l - pad.r) / bins.length;
    const y = (v) => h - pad.b - (v / yMax) * (h - pad.t - pad.b);
    let s = `<svg class="viz-hist" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Histogram')}">`;
    for (let v = 0; v <= yMax; v += ys)
      s += `<line x1="${pad.l}" y1="${y(v)}" x2="${w - pad.r}" y2="${y(v)}" stroke="${C.grid}"/><text x="${pad.l - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="${C.text}">${v}</text>`;
    bins.forEach((b, i) => {
      const x0 = pad.l + i * bw;
      s += `<rect x="${x0 + 1}" y="${y(b.count)}" width="${bw - 2}" height="${y(0) - y(b.count)}" fill="${b.color || o.color || C.c}" stroke="#fff" stroke-width="1.5"/>`;
      if (b.count && o.showCounts !== false) s += `<text x="${x0 + bw / 2}" y="${y(b.count) - 4}" font-size="11" font-weight="700" text-anchor="middle" fill="${C.text}">${b.count}</text>`;
      s += `<text x="${x0 + bw / 2}" y="${y(0) + 16}" font-size="11" text-anchor="middle" fill="${C.text}">${esc(b.label)}</text>`;
    });
    s += `<line x1="${pad.l}" y1="${y(0)}" x2="${w - pad.r}" y2="${y(0)}" stroke="${C.axis}" stroke-width="2"/><line x1="${pad.l}" y1="${y(0)}" x2="${pad.l}" y2="${y(yMax)}" stroke="${C.axis}" stroke-width="2"/>`;
    if (o.xLabel) s += `<text x="${(pad.l + w - pad.r) / 2}" y="${h - 8}" font-size="12" font-weight="600" text-anchor="middle" fill="${C.text}">${esc(o.xLabel)}</text>`;
    if (o.yLabel) s += `<text transform="translate(12 ${(y(0) + y(yMax)) / 2}) rotate(-90)" font-size="12" font-weight="600" text-anchor="middle" fill="${C.text}">${esc(o.yLabel)}</text>`;
    return s + '</svg>';
  }

  /** Box plot(s) over one number line. o: {plots:[{min,q1,med,q3,max,label,color}], lineMin, lineMax, step, labelEvery, title} */
  function boxPlot(o) {
    const plots = o.plots || [o];
    const lineMin = o.lineMin,
      lineMax = o.lineMax,
      step = o.step || 1,
      le = o.labelEvery || step;
    const w = o.width || 500,
      padL = 70,
      padR = 24,
      rowH = 54,
      baseY = 20 + plots.length * rowH,
      h = baseY + 44;
    const x = (v) => padL + ((v - lineMin) / (lineMax - lineMin)) * (w - padL - padR);
    let s = `<svg class="viz-box" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Box plot')}">`;
    plots.forEach((p, i) => {
      const cy = 20 + i * rowH + 22,
        bh = 26,
        col = p.color || [C.a, C.b, C.c][i % 3];
      s += `<line x1="${x(p.min)}" y1="${cy}" x2="${x(p.q1)}" y2="${cy}" stroke="${col}" stroke-width="2.5"/><line x1="${x(p.q3)}" y1="${cy}" x2="${x(p.max)}" y2="${cy}" stroke="${col}" stroke-width="2.5"/>`;
      s += `<line x1="${x(p.min)}" y1="${cy - 9}" x2="${x(p.min)}" y2="${cy + 9}" stroke="${col}" stroke-width="2.5"/><line x1="${x(p.max)}" y1="${cy - 9}" x2="${x(p.max)}" y2="${cy + 9}" stroke="${col}" stroke-width="2.5"/>`;
      s += `<rect x="${x(p.q1)}" y="${cy - bh / 2}" width="${x(p.q3) - x(p.q1)}" height="${bh}" fill="${col}" fill-opacity=".2" stroke="${col}" stroke-width="2.5"/><line x1="${x(p.med)}" y1="${cy - bh / 2}" x2="${x(p.med)}" y2="${cy + bh / 2}" stroke="${col}" stroke-width="3.5"/>`;
      if (p.label) s += `<text x="${padL - 12}" y="${cy + 4}" font-size="12" font-weight="700" text-anchor="end" fill="${C.text}">${esc(p.label)}</text>`;
      if (p.showValues)
        [p.min, p.q1, p.med, p.q3, p.max].forEach((v) => {
          s += `<text x="${x(v)}" y="${cy - bh / 2 - 5}" font-size="10" font-weight="700" text-anchor="middle" fill="${col}">${fmtN(v)}</text>`;
        });
    });
    s += `<line x1="${padL - 10}" y1="${baseY}" x2="${w - padR + 10}" y2="${baseY}" stroke="${C.axis}" stroke-width="2.5"/>`;
    const n = Math.round((lineMax - lineMin) / step);
    for (let i = 0; i <= n; i++) {
      const v = lineMin + i * step,
        major = Math.abs(((v - lineMin) / le) % 1) < 1e-9;
      s += `<line x1="${x(v)}" y1="${baseY - (major ? 6 : 3)}" x2="${x(v)}" y2="${baseY + (major ? 6 : 3)}" stroke="${C.axis}" stroke-width="1.5"/>`;
      if (major) s += `<text x="${x(v)}" y="${baseY + 20}" font-size="11" text-anchor="middle" fill="${C.text}">${fmtN(v)}</text>`;
    }
    if (o.title) s += `<text x="${w / 2}" y="${h - 4}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(o.title)}</text>`;
    return s + '</svg>';
  }

  /** 10 × 10 percent grid. o: {shaded, color, size, shadedColor2, shaded2} */
  function grid100(o) {
    const n = o.cells || 100,
      cols = 10,
      size = o.size || 200,
      cw = size / cols;
    let s = `<svg class="viz-grid100" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(o.aria || o.shaded + ' of 100 squares shaded')}">`;
    for (let i = 0; i < n; i++) {
      const cx = (i % cols) * cw,
        cy = Math.floor(i / cols) * cw;
      const fill = i < (o.shaded || 0) ? o.color || C.a : i < (o.shaded || 0) + (o.shaded2 || 0) ? o.color2 || C.b : '#fff';
      s += `<rect x="${cx}" y="${cy}" width="${cw}" height="${cw}" fill="${fill}" stroke="${C.grid}" stroke-width="1"/>`;
    }
    s += `<rect x=".5" y=".5" width="${size - 1}" height="${size - 1}" fill="none" stroke="${C.axis}" stroke-width="1.5"/>`;
    return s + '</svg>';
  }

  /** Percent / fraction bar. o: {parts, shaded, labels:[top...], color, width} */
  function bar(o) {
    const parts = o.parts,
      w = o.width || 420,
      h = 44,
      pw = w / parts;
    let s = `<svg class="viz-bar" viewBox="0 0 ${w} ${h + (o.labels ? 22 : 0)}" width="${w}" height="${h + (o.labels ? 22 : 0)}" role="img" aria-label="${esc(o.aria || 'Bar model')}">`;
    for (let i = 0; i < parts; i++)
      s += `<rect x="${i * pw}" y="${o.labels ? 20 : 0}" width="${pw}" height="${h - 4}" fill="${i < (o.shaded || 0) ? o.color || C.a : '#fff'}" stroke="${C.axis}" stroke-width="1.5"/>`;
    (o.labels || []).forEach((t, i) => {
      s += `<text x="${i * pw}" y="12" font-size="11" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(t)}</text>`;
    });
    return s + '</svg>';
  }

  /** Generic labeled polygon figure. o: {pts:[[x,y]], w, h, labels:[{x,y,text,anchor}], dashes:[[x1,y1,x2,y2]], rightAngles:[[x,y,dx,dy]], fill} in abstract units; scale fits into box. */
  function figure(o) {
    const W = o.width || 300,
      H = o.height || 220,
      pad = 34;
    const xs = o.pts.map((p) => p[0]).concat((o.extraPts || []).map((p) => p[0])),
      ys = o.pts.map((p) => p[1]).concat((o.extraPts || []).map((p) => p[1]));
    const minX = Math.min(...xs),
      maxX = Math.max(...xs),
      minY = Math.min(...ys),
      maxY = Math.max(...ys);
    const sc = Math.min((W - 2 * pad) / (maxX - minX || 1), (H - 2 * pad) / (maxY - minY || 1));
    const ox = (W - (maxX - minX) * sc) / 2,
      oy = (H - (maxY - minY) * sc) / 2;
    const X = (x) => ox + (x - minX) * sc,
      Y = (y) => H - oy - (y - minY) * sc;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || 'Figure')}">`;
    (o.polys || [o.pts]).forEach((poly, i) => {
      s += `<polygon points="${poly.map((p) => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="${(o.fills && o.fills[i]) || o.fill || C.a}" fill-opacity=".18" stroke="${(o.strokes && o.strokes[i]) || o.stroke || C.axis}" stroke-width="2.2" stroke-linejoin="round"/>`;
    });
    (o.dashes || []).forEach((d) => {
      s += `<line x1="${X(d[0])}" y1="${Y(d[1])}" x2="${X(d[2])}" y2="${Y(d[3])}" stroke="${d[4] || C.d}" stroke-width="2" stroke-dasharray="6 4"/>`;

      s += `<text x="${X(l.x) + (l.dx || 0)}" y="${Y(l.y) + (l.dy || 0)}" font-size="${l.size || 13}" font-weight="700" text-anchor="${l.anchor || 'middle'}" fill="${l.color || C.text}">${esc(l.text)}</text>`;

  /** Convenience shapes (abstract units; labels are strings so the caller controls units). */

    const sideLabel = o.side ? [{ x: off / 2, y: h / 2, text: o.side, anchor: 'end', dx: -8 }] : [];
    return figure({
      pts: [
        [0, 0],
        [b, 0],
        [b + off, h],
        [off, h],
      ],
      dashes: o.noHeight ? [] : [[hx, 0, hx, h]],
      rightAngles: o.noHeight ? [] : [[hx, 0, 1, 1]],
      labels: [{ x: b / 2, y: 0, text: o.base || fmtN(b), dy: 20 }].concat(o.noHeight ? [] : [{ x: hx, y: h / 2, text: o.height || fmtN(h), anchor: 'start', dx: 8, color: C.d }]).concat(sideLabel),
      width: o.width,
      height: o.height2,
      aria: o.aria || 'Parallelogram',
      fill: o.fill,
    });
  }
  function triangle(b, h, o) {
    o = o || {};
    const apex = o.apex == null ? b * 0.35 : o.apex;
    const outside = apex < 0 || apex > b;

      [0, 0],
      [b, 0],
      [apex, h],
    ];
    const extra = outside ? [[apex, 0]] : [];
    const dashes = o.noHeight ? [] : [[apex, 0, apex, h]].concat(outside ? [[Math.min(0, apex), 0, Math.max(b, apex), 0, C.axis]] : []);
    return figure({
      pts,
      extraPts: extra,
      dashes,
      rightAngles: o.noHeight ? [] : [[apex, 0, apex < b / 2 ? 1 : -1, 1]],
      labels: [{ x: b / 2, y: 0, text: o.base || fmtN(b), dy: 20 }]
        .concat(
          o.noHeight
            ? []
            : [
                {
                  x: apex,
                  y: h / 2,
                  text: o.height || fmtN(h),
                  anchor: apex < b / 2 ? 'end' : 'start',
                  dx: apex < b / 2 ? -8 : 8,
                  color: C.d,

              ],

        .concat(o.sides || []),

  }
  function trapezoid(b1, b2, h, o) {
    o = o || {};
    const off = (b1 - b2) / 2;
    const hx = off + b2 * 0.5;
    return figure({
      pts: [
        [0, 0],
        [b1, 0],
        [b1 - off, h],
        [off, h],
      ],
      dashes: o.noHeight ? [] : [[hx, 0, hx, h]],
      rightAngles: o.noHeight ? [] : [[hx, 0, 1, 1]],
      labels: [
        { x: b1 / 2, y: 0, text: o.b1 || fmtN(b1), dy: 20 },
        { x: b1 / 2, y: h, text: o.b2 || fmtN(b2), dy: -8 },
      ]
        .concat(
          o.noHeight
            ? []
            : [
                {
                  x: hx,
                  y: h / 2,
                  text: o.height || fmtN(h),
                  anchor: 'start',
                  dx: 8,
                  color: C.d,
                },
              ],
        )

      aria: o.aria || 'Trapezoid',

  }
  function rectangle(w, h, o) {
    o = o || {};
    return figure({
      pts: [
        [0, 0],
        [w, 0],
        [w, h],
        [0, h],
      ],
      labels: [
        { x: w / 2, y: 0, text: o.w || fmtN(w), dy: 20 },
        { x: w, y: h / 2, text: o.h || fmtN(h), anchor: 'start', dx: 8 },

      height: o.height,
      aria: o.aria || 'Rectangle',

  /** Rectangular prism in oblique view. o: {l,w,h, labels:{l,w,h}, hidden:boolean(draw hidden edges)} */
  function prism(o) {
    const L = o.l,
      Wd = o.w,
      H = o.h,
      W = o.width || 300,
      Ht = o.height || 230;
    const dx = 0.45,
      dy = 0.3; // oblique projection of depth
    const sc = Math.min((W - 80) / (L + Wd * dx), (Ht - 70) / (H + Wd * dy));
    const ox = 40,
      oy = Ht - 30;
    const P = (x, y, z) => [ox + (x + z * dx) * sc, oy - (y + z * dy) * sc];
    const f = [P(0, 0, 0), P(L, 0, 0), P(L, H, 0), P(0, H, 0)],
      b = [P(0, 0, Wd), P(L, 0, Wd), P(L, H, Wd), P(0, H, Wd)];
    const poly = (pts, fill) => `<polygon points="${pts.map((p) => p.join(',')).join(' ')}" fill="${fill}" fill-opacity=".25" stroke="${C.axis}" stroke-width="2" stroke-linejoin="round"/>`;
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(o.aria || 'Rectangular prism')}">`;
    if (o.hidden !== false) s += `<path d="M${b[0]} L${b[1]} M${b[0]} L${b[3]} M${b[0]} L${f[0]}" stroke="${C.axis}" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>`;
    s += poly([f[2], f[3], b[3], b[2]], C.b) + poly([f[1], f[2], b[2], b[1]], C.c) + poly(f, C.a);
    const lb = o.labels || {};
    s += `<text x="${(f[0][0] + f[1][0]) / 2}" y="${f[0][1] + 18}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lb.l || fmtN(L))}</text>`;
    s += `<text x="${(f[1][0] + b[1][0]) / 2 + 10}" y="${(f[1][1] + b[1][1]) / 2 + 14}" font-size="13" font-weight="700" fill="${C.text}">${esc(lb.w || fmtN(Wd))}</text>`;
    s += `<text x="${f[0][0] - 10}" y="${(f[0][1] + f[3][1]) / 2}" font-size="13" font-weight="700" text-anchor="end" fill="${C.text}">${esc(lb.h || fmtN(H))}</text>`;
    return s + '</svg>';
  }

  /** Net of a rectangular prism (cross layout). o: {l,w,h, labels:{l,w,h}, faceLabels:boolean} */
  function prismNet(o) {
    const L = o.l,
      Wd = o.w,
      H = o.h,
      W = o.width || 340;
    const totalW = 2 * L + 2 * Wd,
      totalH = 2 * Wd + H;
    const sc = Math.min((W - 40) / totalW, 200 / totalH),
      Ht = totalH * sc + 50;
    const ox = (W - totalW * sc) / 2,
      oy = 20;
    const R = (x, y, w, h, fill, lab) =>
      `<rect x="${ox + x * sc}" y="${oy + y * sc}" width="${w * sc}" height="${h * sc}" fill="${fill}" fill-opacity=".25" stroke="${C.axis}" stroke-width="1.8"/>` +
      (lab ? `<text x="${ox + (x + w / 2) * sc}" y="${oy + (y + h / 2) * sc + 4}" font-size="11" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lab)}</text>` : '');
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="${esc(o.aria || 'Net of a rectangular prism')}">`;
    const fl = o.faceLabels;
    s +=
      R(Wd, 0, L, Wd, C.b, fl && 'top') +
      R(0, Wd, Wd, H, C.c, fl && 'side') +
      R(Wd, Wd, L, H, C.a, fl && 'front') +
      R(Wd + L, Wd, Wd, H, C.c, fl && 'side') +
      R(2 * Wd + L, Wd, L, H, C.a, fl && 'back') +
      R(Wd, Wd + H, L, Wd, C.b, fl && 'bottom');
    const lb = o.labels || {};
    s += `<text x="${ox + (Wd + L / 2) * sc}" y="${oy + (2 * Wd + H) * sc + 16}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lb.l || fmtN(L))}</text>`;
    s += `<text x="${ox - 6}" y="${oy + (Wd + H / 2) * sc + 4}" font-size="12" font-weight="700" text-anchor="end" fill="${C.text}">${esc(lb.h || fmtN(H))}</text>`;
    s += `<text x="${ox + (Wd / 2) * sc}" y="${oy + Wd * sc - 6}" font-size="12" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(lb.w || fmtN(Wd))}</text>`;
    return s + '</svg>';
  }

  /** Square pyramid (oblique) with base edge b and slant height l labelled. */
  function pyramid(o) {
    const W = o.width || 280,
      Ht = o.height || 230,
      b = o.b,
      sh = o.slant;
    const sc = Math.min((W - 80) / (b * 1.45), (Ht - 70) / (sh * 1.1 + b * 0.3));
    const ox = 40,
      oy = Ht - 30,
      dx = 0.45,
      dy = 0.3;
    const P = (x, y, z) => [ox + (x + z * dx) * sc, oy - (y + z * dy) * sc];
    const base = [P(0, 0, 0), P(b, 0, 0), P(b, 0, b), P(0, 0, b)],
      apex = P(b / 2, sh * 0.95, b / 2);

    s += `<text x="${mid[0]}" y="${mid[1] + 18}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(o.baseLabel || fmtN(b))}</text>`;

  /** Net of a square pyramid: square base with four triangles. */

      Y = (y) => oy + y * sc;

  /** Triangular prism (oblique) — right-triangle or isosceles cross-section. o:{b,h,len, labels:{b,h,len,s1,s2}} */
  function triPrism(o) {

    s += `<text x="${f[2][0] + (o.right ? -8 : 8)}" y="${(f[2][1] + f[0][1]) / 2}" font-size="13" font-weight="700" text-anchor="${o.right ? 'end' : 'start'}" fill="${C.d}">${esc(lb.h || fmtN(h))}</text>`;
    s += `<text x="${(f[1][0] + bk[1][0]) / 2 + 10}" y="${(f[1][1] + bk[1][1]) / 2 + 14}" font-size="13" font-weight="700" fill="${C.text}">${esc(lb.len || fmtN(L))}</text>`;
    if (lb.s1) s += `<text x="${(f[1][0] + f[2][0]) / 2 + 10}" y="${(f[1][1] + f[2][1]) / 2 - 6}" font-size="12" font-weight="700" fill="${C.text}">${esc(lb.s1)}</text>`;

  /** Pan balance for equations. o: {left:[labels], right:[labels], tilt: -1|0|1} */
  function balance(o) {
    const W = 340,
      H = 170,
      tilt = (o.tilt || 0) * 7;
    const chip = (t, x, y, i) =>
      `<rect x="${x - 26}" y="${y - 30}" width="52" height="26" rx="6" fill="${/^[a-z]$/i.test(t) ? C.d : C.c}" fill-opacity=".9"/><text x="${x}" y="${y - 12}" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">${esc(t)}</text>`;
    const pan = (items, cx, cy) => {
      let out = `<path d="M${cx - 60},${cy} Q${cx},${cy + 26} ${cx + 60},${cy}" fill="none" stroke="${C.axis}" stroke-width="3"/><line x1="${cx - 60}" y1="${cy}" x2="${cx}" y2="${cy - 36}" stroke="${C.axis}" stroke-width="1.5"/><line x1="${cx + 60}" y1="${cy}" x2="${cx}" y2="${cy - 36}" stroke="${C.axis}" stroke-width="1.5"/>`;
      const n = items.length;
      items.forEach((t, i) => {
        out += chip(t, cx + (i - (n - 1) / 2) * 56, cy - 2, i);
      });
      return out;
    };
    let s = `<svg class="viz-fig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || 'Pan balance')}">`;
    s += `<path d="M${W / 2 - 30},${H - 10} h60 l-30,-40 z" fill="${C.axis}"/><line x1="${W / 2}" y1="${H - 50}" x2="${W / 2}" y2="${H - 110}" stroke="${C.axis}" stroke-width="4"/>`;
    s += `<g transform="rotate(${tilt} ${W / 2} ${H - 110})"><line x1="${W / 2 - 120}" y1="${H - 110}" x2="${W / 2 + 120}" y2="${H - 110}" stroke="${C.axis}" stroke-width="4" stroke-linecap="round"/>${pan(o.left, W / 2 - 120, H - 74)}${pan(o.right, W / 2 + 120, H - 74)}</g>`;
    return s + '</svg>';
  }

  /** Algebra-tile style area model for expressions like 3(x + 2). o: {rows:[labels], cols:[labels]} */
  function areaModel(o) {
    const rows = o.rows,
      cols = o.cols,
      cw = 70,
      ch = 48,
      W = 40 + cols.length * cw,
      H = 30 + rows.length * ch;

    cols.forEach((c, j) => {
      s += `<text x="${40 + j * cw + cw / 2}" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(c)}</text>`;
    });
    rows.forEach((r, i) => {
      s += `<text x="32" y="${30 + i * ch + ch / 2 + 4}" font-size="13" font-weight="700" text-anchor="end" fill="${C.text}">${esc(r)}</text>`;
      cols.forEach((c, j) => {
        const t = o.cells ? o.cells[i][j] : '';
        s += `<rect x="${40 + j * cw}" y="${30 + i * ch}" width="${cw}" height="${ch}" fill="${/x|y|n|m|a|b/.test(c + r) ? C.a : C.b}" fill-opacity=".2" stroke="${C.axis}" stroke-width="1.6"/>`;
        if (t) s += `<text x="${40 + j * cw + cw / 2}" y="${30 + i * ch + ch / 2 + 5}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.text}">${esc(t)}</text>`;
      });
    });
    return s + '</svg>';
  }

  Object.assign(V, {
    numberLine,
    verticalLine,
    dotPlot,
    histogram,
    boxPlot,
    grid100,
    bar,
    figure,
    parallelogram,
    triangle,
    trapezoid,
    rectangle,
    prism,
    prismNet,
    pyramid,
    pyramidNet,
    triPrism,
    balance,
    areaModel,
  });

  // ---------- Extend the coordinate graph to four quadrants (xMin/yMin) ----------
  const graph0 = V.graph;
  V.graph = function (o) {
    if (!o.xMin && !o.yMin) return graph0(o);
    const size = o.size || 320,
      pad = { l: 30, r: 18, t: 18, b: 30 };
    const w = size,
      h = size,
      xMin = o.xMin || 0,
      yMin = o.yMin || 0,
      xMax = o.xMax,
      yMax = o.yMax,
      xs = o.xStep || 1,
      ys = o.yStep || 1;
    const px = (x) => pad.l + ((x - xMin) / (xMax - xMin)) * (w - pad.l - pad.r);
    const py = (y) => h - pad.b - ((y - yMin) / (yMax - yMin)) * (h - pad.t - pad.b);
    let s = `<svg class="viz-graph" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(o.aria || 'Coordinate plane')}">`;
    for (let x = xMin; x <= xMax; x += xs) s += `<line x1="${px(x)}" y1="${py(yMin)}" x2="${px(x)}" y2="${py(yMax)}" stroke="${C.grid}" stroke-width="1"/>`;
    for (let y = yMin; y <= yMax; y += ys) s += `<line x1="${px(xMin)}" y1="${py(y)}" x2="${px(xMax)}" y2="${py(y)}" stroke="${C.grid}" stroke-width="1"/>`;
    s += `<line x1="${px(xMin)}" y1="${py(0)}" x2="${px(xMax)}" y2="${py(0)}" stroke="${C.axis}" stroke-width="2"/><line x1="${px(0)}" y1="${py(yMin)}" x2="${px(0)}" y2="${py(yMax)}" stroke="${C.axis}" stroke-width="2"/>`;
    const xl = o.xLabelEvery || xs,
      yl = o.yLabelEvery || ys;
    for (let x = xMin; x <= xMax; x += xl) if (x !== 0) s += `<text x="${px(x)}" y="${py(0) + 14}" font-size="10" text-anchor="middle" fill="${C.text}">${x}</text>`;

  /** Same as withMean but the MAD has at most one decimal place. */
  function withMeanCleanMad(r, n, m, spread) {
    for (let t = 0; t < 300; t++) {
      const v = withMean(r, n, m, spread);
      const d = mad(v) * 10;
      if (Math.abs(d - Math.round(d)) < 1e-9 && mad(v) > 0) return v;
    }
    return withMean(r, n, m, spread);
  }
  /** Shape helper: returns 'symmetric' | 'skewed right' | 'skewed left' for a set of values on a short scale. */
  function shapeOf(vals) {
    const m = mean(vals),
      md = median(vals);
    if (Math.abs(m - md) < 0.35) return 'symmetric';
    return m > md ? 'skewed right' : 'skewed left';
  }
  /** Build values with a chosen shape on [lo, hi]. */
  function shaped(r, kind, lo, hi, n) {
    const span = hi - lo;
    const vals = [];
    for (let i = 0; i < n; i++) {
      let u;
      if (kind === 'symmetric') u = (r.int(0, span) + r.int(0, span)) / 2;
      else if (kind === 'skewed right') u = Math.min(r.int(0, span), r.int(0, span), r.int(0, span));
      else u = Math.max(r.int(0, span), r.int(0, span), r.int(0, span));
      vals.push(lo + Math.round(u));
    }
    return vals;
  }

    },

  const VULGAR = { 0.5: '½', 0.25: '¼', 0.75: '¾' };
  const U5 = {
    UNITS: ['cm', 'in', 'ft', 'm'],
    sq: (u) => u + '²',
    cu: (u) => u + '³',
    /** 4.5 → "4½", 0.75 → "¾", 7 → "7", 1.2 → "1.2" */
    mixed(x) {
      const w = Math.floor(x),
        f = round(x - w, 2);
      if (f === 0) return fmt(x);
      if (!VULGAR[f]) return fmt(x);
      return (w ? String(w) : '') + VULGAR[f];
    },
    /** Regular n-gon with side s, decomposed into n triangles from the center; one triangle height labelled. */
    regularPolygon(n, o) {
      o = o || {};
      const R = 1 / (2 * Math.sin(Math.PI / n)),
        a = R * Math.cos(Math.PI / n);
      const pts = [];
      for (let k = 0; k < n; k++) {
        const th = -Math.PI / 2 + Math.PI / n + (2 * Math.PI * k) / n;
        pts.push([R * Math.cos(th), R * Math.sin(th)]);
      }
      const dashes = o.noDecompose ? [] : pts.map((p) => [0, 0, p[0], p[1], C.axis]);
      if (!o.noHeight) dashes.push([0, 0, 0, -a, C.d]);
      return V.figure({
        pts,
        dashes,
        rightAngles: o.noHeight ? [] : [[0, -a, 1, 1]],
        labels: [{ x: 0, y: -a, text: o.side || '', dy: 20 }].concat(o.noHeight ? [] : [{ x: 0, y: -a / 2, text: o.height || '', anchor: 'start', dx: 8, color: C.d }]),

        aria: o.aria || `Regular ${n}-sided polygon divided into ${n} triangles`,

    /** L-shaped composite figure: outer W × H with the top-right corner removed. labels: all six edges unless o.hard. */
    lshape(W, H, w1, h1, o) {
      o = o || {};
      const u = o.u || '';

        { x: W / 2, y: 0, text: fmt(W) + u, dy: 20 },

      const dashes = o.dash === 'v' ? [[w1, 0, w1, h1]] : o.dash === 'h' ? [[0, h1, w1, h1]] : [];

    triNet(b, h, s1, s2, L, o) {

          [b, 0],
          [b / 2, -h],

  // ---------- Shared Unit 7 formatting helpers (pack.js loads first, so every generator can use RX.N7) ----------
  const clean = (v) => String(Math.round(v * 1000) / 1000);
  /** Display a number with a true minus sign: -1.5 -> "−1.5" */
  const dec = (v) => clean(v).replace('-', '−');
  const fracParts = (v) => {
    const a = Math.abs(v),
      w = Math.floor(a + 1e-9),
      f = a - w;
    if (f < 1e-9) return { w, n: 0, d: 1 };
    for (const d of [2, 4, 5, 8, 10]) {
      const n = f * d;
      if (Math.abs(n - Math.round(n)) < 1e-9) return { w, n: Math.round(n), d };
    }
    return null;
  };
  /** HTML mixed-number display: -2.25 -> "−2¼" using V.frac; integers and non-terminating values fall back to decimals. */
  const mixedHtml = (v) => {
    const p = fracParts(v);
    if (!p || p.n === 0) return dec(v);
    return (v < 0 ? '−' : '') + (p.w ? p.w : '') + V.frac(p.n, p.d);
  };
  /** Plain-text mixed number: -2.25 -> "−2 1/4" */
  const mixedText = (v) => {
    const p = fracParts(v);
    if (!p || p.n === 0) return dec(v);
    return (v < 0 ? '−' : '') + (p.w ? p.w + ' ' : '') + p.n + '/' + p.d;
  };
  /** Ordered pair text with true minus signs. */
  const pair = (x, y) => `(${dec(x)}, ${dec(y)})`;
  /** Quadrant name for a point: 'I'..'IV', or 'x-axis' / 'y-axis' / 'origin'. */
  const quad = (x, y) => {
    if (x === 0 && y === 0) return 'origin';
    if (y === 0) return 'x-axis';
    if (x === 0) return 'y-axis';
    if (x > 0) return y > 0 ? 'I' : 'IV';
    return y > 0 ? 'II' : 'III';
  };
  /** Sign word for a value in a real-world context. */
  const signWord = (v) => (v > 0 ? 'positive' : v < 0 ? 'negative' : 'zero');
  /** Improper-fraction parts of a terminating value: -2.75 -> { n: 11, d: 4 }; null for integers. */
  const improperParts = (v) => {
    const p = fracParts(v);
    if (!p || p.n === 0) return null;
    return { n: p.w * p.d + p.n, d: p.d };
  };
  /** Improper fraction as plain text: -2.75 -> "−11/4" (integers fall back to decimals). */
  const improperText = (v) => {
    const q = improperParts(v);
    return q ? (v < 0 ? '−' : '') + q.n + '/' + q.d : dec(v);
  };
  /** Improper fraction as HTML: -2.75 -> "−" + V.frac(11, 4). */
  const improperHtml = (v) => {
    const q = improperParts(v);
    return q ? (v < 0 ? '−' : '') + V.frac(q.n, q.d) : dec(v);
  };
  /** What the shared number parser reads when a student types a mixed number with a space ("-2 3/4" -> -23/4). */
  const typedMixed = (v) => {
    const p = fracParts(v);
    if (!p || !p.n || !p.w) return null;
    return (v < 0 ? -1 : 1) * (Number(String(p.w) + String(p.n)) / p.d);
  };

/* Grade 6 Review Expeditions — save state (localStorage). */
(function (root) {
  'use strict';
  const RX = root.RX;
  const KEY = () => (RX.UNIT && RX.UNIT.saveKey) || 'rx-expedition-v1';

  function defaults() {
    return {
      version: 1, startedAt: null, updatedAt: null,
      xp: 0, streak: 0, bestStreak: 0,
      zones: {},            // zoneId -> { missions: { missionId -> {completed, best:{first,total}, plays} }, completed, completedAt }
      current: null,        // { zone, mission, seed, qIndex, results: [{gen, skill, firstTry, attempts, correct, help}] }
      skills: {},           // skillId -> { attempts, first, correct, seen }
      achievements: {},     // id -> timestamp
      collectibles: [],     // artifact ids
      settings: { readAloud: false, largeText: false, reduceMotion: false, sound: false, dyslexic: false },
      stats: { answered: 0, firstTry: 0, correct: 0, errorsSolved: 0, helpOpened: 0, missRun: 0, plotFirstTry: 0, unitRateFirst: 0, missions: 0 },
    };
  }

  let state = null;
  function load() {
    if (state) return state;
    try { const raw = root.localStorage && root.localStorage.getItem(KEY()); state = raw ? Object.assign(defaults(), JSON.parse(raw)) : defaults(); }
    catch (e) { state = defaults(); }
    state.settings = Object.assign(defaults().settings, state.settings || {});
    state.stats = Object.assign(defaults().stats, state.stats || {});
    return state;
  }
  function save() {
    state.updatedAt = Date.now();
    try { root.localStorage && root.localStorage.setItem(KEY(), JSON.stringify(state)); } catch (e) { /* storage unavailable: play continues in memory */ }
    return state;
  }
  function reset() { const settings = state ? state.settings : null; state = defaults(); if (settings) state.settings = settings; save(); return state; }
  function hasProgress() { const s = load(); return !!s.startedAt; }
  function zone(id) { const s = load(); if (!s.zones[id]) s.zones[id] = { missions: {}, completed: false }; return s.zones[id]; }
  function mission(zoneId, mId) { const z = zone(zoneId); if (!z.missions[mId]) z.missions[mId] = { completed: false, best: null, plays: 0 }; return z.missions[mId]; }
  function skill(id) { const s = load(); if (!s.skills[id]) s.skills[id] = { attempts: 0, first: 0, correct: 0, seen: 0 }; return s.skills[id]; }

  RX.State = { load, save, reset, hasProgress, zone, mission, skill, defaults, KEY, unload() { state = null; } };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Grade 6 Review Expeditions — unlock + achievement rules. Pure functions over state.
   Achievements are declarative: each unit pack lists { id, name, desc, icon, when } and this file evaluates `when`.
   Supported `when` shapes:
     { missions: n }                      — total missions completed >= n
     { zoneComplete: zoneId }             — zone cleared
     { zoneFirstRate: zoneId, gte: 0.8 }  — zone cleared with first-try rate >= gte (checked on the zone event)
     { streak: n }                        — current streak >= n
     { stat: name, gte: n }               — s.stats[name] >= n (errorsSolved, helpOpened, missions, answered …)
     { skillFirst: skillId, gte: n }      — first-try correct answers on a skill >= n
     { typeFirst: widgetType, gte: n }    — first-try correct answers on a question type >= n
     { event: 'comeback' }                — a correct answer right after missing two in a row
     { event: 'perfect-mission' }         — mission finished with every answer right first try
     { event: 'enter', zone: zoneId }     — zone opened (used for optional zones)
*/
(function (root) {
  'use strict';
  const RX = root.RX;

  function zoneIndex(id) {
    return RX.ZONES.findIndex((z) => z.id === id);
  }
  function zoneDef(id) {
    return RX.ZONES[zoneIndex(id)];
  }
  function isZoneComplete(s, id) {
    const z = s.zones[id];
    return !!(z && z.completed);
  }
  function isUnlocked(s, id) {
    const z = zoneDef(id);
    if (z.optional) return isZoneComplete(s, z.unlockAfter);
    const i = zoneIndex(id);
    if (i === 0) return true;
    const core = RX.ZONES.filter((x) => !x.optional);
    const ci = core.findIndex((x) => x.id === id);
    // the final zone requires every core zone before it; other zones require the previous core zone
    if (z.final) return core.slice(0, ci).every((x) => isZoneComplete(s, x.id));
    return isZoneComplete(s, core[ci - 1].id);
  }
  function missionDone(s, zoneId, mId) {
    const z = s.zones[zoneId];
    return !!(z && z.missions[mId] && z.missions[mId].completed);
  }
  function zoneProgress(s, id) {
    const z = zoneDef(id);
    const done = z.missions.filter((m) => missionDone(s, id, m.id)).length;
    return { done, total: z.missions.length };
  }
  function overallProgress(s) {
    const core = RX.ZONES.filter((z) => !z.optional);
    let d = 0,
      t = 0;
    core.forEach((z) => {
      const p = zoneProgress(s, z.id);
      d += p.done;
      t += p.total;
    });
    return { done: d, total: t, pct: t ? Math.round((100 * d) / t) : 0 };
  }
  function nextZone(s) {
    return RX.ZONES.find((z) => !z.optional && !isZoneComplete(s, z.id)) || null;
  }
  function finalZone() {
    return RX.ZONES.find((z) => z.final) || RX.ZONES[RX.ZONES.length - 1];
  }
  function optionalZones() {
    return RX.ZONES.filter((z) => z.optional);
  }

  function ruleMet(s, w, ctx) {
    const st = s.stats;
    if (w.missions != null) return st.missions >= w.missions;
    if (w.zoneComplete) return isZoneComplete(s, w.zoneComplete);
    if (w.zoneFirstRate) return ctx.event === 'zone' && ctx.zone === w.zoneFirstRate && ctx.firstRate >= (w.gte == null ? 0.8 : w.gte);
    if (w.streak != null) return s.streak >= w.streak;
    if (w.stat) return (st[w.stat] || 0) >= w.gte;
    if (w.skillFirst) return ((st.skillFirst || {})[w.skillFirst] || 0) >= w.gte;
    if (w.typeFirst) return ((st.typeFirst || {})[w.typeFirst] || 0) >= w.gte;
    if (w.event === 'comeback') return ctx.event === 'answer' && ctx.correct && ctx.missRunBefore >= 2;
    if (w.event === 'perfect-mission') return ctx.event === 'mission' && ctx.first === ctx.total && ctx.total > 0;
    if (w.event === 'enter') return ctx.event === 'enter' && ctx.zone === w.zone;
    return false;
  }

  /** Evaluate every achievement rule against state + the triggering event. Returns newly unlocked ids. */
  function evaluate(s, ctx) {
    const unlocked = [];
    (RX.ACHIEVEMENTS || []).forEach((a) => {
      if (s.achievements[a.id]) return;

<script>
/* Grade 6 Review Expeditions — model widgets: table, match, sort, seq, plot, dnl, tape. */
(function (root) {
  'use strict';
  const RX = root.RX;

  W.table = function (host, q, ctx) {
    const t = h('<table class="viz-table input-table"></table>');

    q.rows.forEach((row, ri) => {
      const tr = document.createElement('tr');

        const isHead = (q.rowHeader && ci === 0) || (q.header && ri === 0);
        const td = document.createElement(isHead ? 'th' : 'td');

        if (m) { const inp = numInput({ aria: `Table value, row ${ri + 1}, column ${ci}`, width: 'xs' }); td.appendChild(inp); inputs[m[1]] = inp.querySelector('input'); td.classList.add('cell-input'); }
        else td.innerHTML = cell;

      });
      t.appendChild(tr);
    });
    host.appendChild(h('<div class="table-scroll"></div>')).appendChild(t);

    return { getAnswer: () => { const o = {}; ids.forEach((id) => (o[id] = inputs[id].value)); return o; }, canSubmit: () => ids.every((id) => RX.parseNum(inputs[id].value) != null), setDisabled: (on) => disableAll(host, on), markResult: (res) => { ids.forEach((id) => { const bad = !res.correct && res.detail.wrong.includes(id); inputs[id].classList.toggle('is-wrong', bad); inputs[id].classList.toggle('is-right', !bad); if (res.final && bad) inputs[id].value = String(q.inputs.find((x) => x.id === id).answer); }); }, focus: () => inputs[ids[0]].focus() };
  };

  W.match = function (host, q) {

    const L = wrap.querySelector('.match-left'), R = wrap.querySelector('.match-right');
    const pairs = new Map(); // leftIdx -> rightIdx
    let pendingL = null;
    const COLORS = ['#1FA6A2', '#F2A33A', '#3B6FB6', '#C8553D', '#6B7F3A', '#17324D'];
    const render = () => {
      L.querySelectorAll('.match-item').forEach((b) => { const i = Number(b.dataset.i); const r = pairs.get(i); b.classList.toggle('is-pending', pendingL === i); b.classList.toggle('is-paired', r != null); b.style.setProperty('--pair', r != null ? COLORS[i % COLORS.length] : 'transparent'); b.querySelector('.badge').textContent = r != null ? String(i + 1) : ''; });
      R.querySelectorAll('.match-item').forEach((b) => { const j = Number(b.dataset.i); let li = null; pairs.forEach((rv, lk) => { if (rv === j) li = lk; }); b.classList.toggle('is-paired', li != null); b.style.setProperty('--pair', li != null ? COLORS[li % COLORS.length] : 'transparent'); b.querySelector('.badge').textContent = li != null ? String(li + 1) : ''; });
    };
    q.left.forEach((txt, i) => { const b = h(`<button type="button" class="match-item" data-i="${i}"><span class="badge" aria-hidden="true"></span><span>${txt}</span></button>`); b.addEventListener('click', () => { if (b.disabled) return; if (pairs.has(i)) { pairs.delete(i); pendingL = i; } else pendingL = pendingL === i ? null : i; render(); }); L.appendChild(b); });

  W.sort = function (host, q) {

    host.appendChild(h('<p class="hint-line">Click an item, then click a category. Or drag it. Click a sorted item to send it back.</p>'));

    const pool = wrap.querySelector('.sort-pool'); pool.addEventListener('dragover', (e) => e.preventDefault()); pool.addEventListener('drop', (e) => { e.preventDefault(); const i = Number(e.dataTransfer.getData('text/plain')); if (!Number.isNaN(i)) { delete place[i]; pending = null; render(); } });
    render();

  };

  W.seq = function (host, q) {
    let order = q.items.map((_, i) => i);
    if (order.every((v, i) => v === q.order[i])) order.reverse();
    if (order.every((v, i) => v === q.order[i])) order = [order[1], order[0]].concat(order.slice(2));
    const list = h('<ol class="seq" aria-label="Ordered list"></ol>');
    host.appendChild(h('<p class="hint-line">Use the arrows (or drag) to reorder. Top = first.</p>'));
    host.appendChild(list);
    let dragFrom = null;
    const render = () => {
      list.innerHTML = '';
      order.forEach((idx, pos) => {
        const li = h(`<li class="seq-item" draggable="true" data-pos="${pos}"><span class="seq-num">${pos + 1}</span><div class="seq-body">${q.items[idx].html}</div><div class="seq-ctl"><button type="button" class="seq-up" aria-label="Move up" ${pos === 0 ? 'disabled' : ''}>▲</button><button type="button" class="seq-down" aria-label="Move down" ${pos === order.length - 1 ? 'disabled' : ''}>▼</button></div></li>`);

        li.addEventListener('dragover', (e) => { e.preventDefault(); li.classList.add('is-over'); });

    };
    render();
    return { getAnswer: () => order.slice(), canSubmit: () => true, setDisabled: (on) => { disableAll(host, on); list.querySelectorAll('.seq-item').forEach((li) => { li.draggable = !on; }); }, markResult: (res) => { if (res.final && !res.correct) { order = q.order.slice(); render(); list.querySelectorAll('.seq-item').forEach((li) => li.classList.add('is-correct')); } else list.querySelectorAll('.seq-item').forEach((li, pos) => li.classList.toggle('is-incorrect', !res.correct && order[pos] !== q.order[pos])); }, focus: () => list.querySelector('button:not([disabled])').focus() };
  };

  W.plot = function (host, q) {
    const size = 340, pad = { l: 54, r: 18, t: 18, b: 50 };
    const px = (x) => pad.l + (x / q.xMax) * (size - pad.l - pad.r), py = (y) => size - pad.b - (y / q.yMax) * (size - pad.t - pad.b);
    const ys = q.yStep || 1;
    const base = RX.V.graph({ xLabel: q.xLabel, yLabel: q.yLabel, xMax: q.xMax, yMax: q.yMax, yStep: ys, size, series: [] });
    const wrap = h(`<div class="plot"><div class="plot-stage">${base}</div><div class="plot-status" aria-live="polite"></div></div>`);
    host.appendChild(wrap);
    const svg = wrap.querySelector('svg'); svg.classList.add('plot-svg'); svg.setAttribute('role', 'group'); svg.setAttribute('aria-label', 'Coordinate grid. Choose grid points to place them.'); svg.setAttribute('width', '100%'); svg.removeAttribute('height');
    const ns = 'http://www.w3.org/2000/svg';
    const pts = new Map();
    const layer = document.createElementNS(ns, 'g'); svg.appendChild(layer);
    const hits = document.createElementNS(ns, 'g'); svg.appendChild(hits);
    const key = (x, y) => x + ',' + y;
    const status = wrap.querySelector('.plot-status');
    const refresh = () => { layer.innerHTML = ''; pts.forEach((p) => { const c = document.createElementNS(ns, 'circle'); c.setAttribute('cx', px(p[0])); c.setAttribute('cy', py(p[1])); c.setAttribute('r', 7); c.setAttribute('class', 'plot-pt'); layer.appendChild(c); const t = document.createElementNS(ns, 'text'); t.setAttribute('x', px(p[0]) + 9); t.setAttribute('y', py(p[1]) - 8); t.setAttribute('class', 'plot-lbl'); t.textContent = `(${p[0]}, ${p[1]})`; layer.appendChild(t); }); status.textContent = `${pts.size} of ${q.count} points placed`; };
    let locked = false;
    for (let x = 0; x <= q.xMax; x++) for (let y = 0; y <= q.yMax; y += 1) {
      const c = document.createElementNS(ns, 'circle'); c.setAttribute('cx', px(x)); c.setAttribute('cy', py(y)); c.setAttribute('r', Math.max(5, Math.min(11, (size - pad.t - pad.b) / q.yMax / 2.1))); c.setAttribute('class', 'plot-hit'); c.setAttribute('tabindex', '0'); c.setAttribute('role', 'button'); c.setAttribute('aria-label', `Point (${x}, ${y})`);
      const toggle = () => { if (locked) return; const k = key(x, y); if (pts.has(k)) pts.delete(k); else { if (pts.size >= q.count) { status.textContent = `You already placed ${q.count} points. Remove one first.`; return; } pts.set(k, [x, y]); } refresh(); };
      c.addEventListener('click', toggle); c.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
      hits.appendChild(c);
    }
    refresh();
    return { getAnswer: () => Array.from(pts.values()), canSubmit: () => pts.size === q.count, setDisabled: (on) => { locked = on; svg.classList.toggle('is-locked', on); }, markResult: (res) => { if (res.final && !res.correct) { pts.clear(); q.points.forEach((p) => pts.set(key(p[0], p[1]), p)); refresh(); layer.querySelectorAll('.plot-pt').forEach((c) => c.classList.add('is-correct')); } else if (!res.correct) { layer.querySelectorAll('.plot-pt').forEach((c, i) => { const p = Array.from(pts.values())[i]; if (res.detail.extra.some((e) => e[0] === p[0] && e[1] === p[1])) c.classList.add('is-incorrect'); }); } }, focus: () => hits.firstChild.focus() };
  };

  W.dnl = function (host, q, ctx) {
    const n = q.top.values.length;
    const wrap = h(`<div class="dnl-w" role="group" aria-label="Double number line"><div class="dnl-labels"><span>${esc(q.top.label)}</span><span>${esc(q.bottom.label)}</span></div><div class="dnl-ticks"></div></div>`);
    const ticks = wrap.querySelector('.dnl-ticks');
    const inputs = [];
    for (let i = 0; i < n; i++) {
      const t = h('<div class="dnl-tick"><div class="dnl-top"></div><div class="dnl-mark" aria-hidden="true"></div><div class="dnl-bot"></div></div>');
      const topV = q.top.values[i], botV = q.bottom.values[i];
      t.querySelector('.dnl-top').textContent = String(topV);
      const bot = t.querySelector('.dnl-bot');
      const bi = q.blanks.findIndex((b) => b.i === i);
      if (bi >= 0) { const inp = numInput({ aria: `${q.bottom.label} at ${topV} ${q.top.label}`, width: 'xs' }); bot.appendChild(inp); inputs[bi] = inp.querySelector('input'); }
      else bot.textContent = String(botV);
      ticks.appendChild(t);
    }
    host.appendChild(wrap);
    bindEnter(host, ctx);
    return { getAnswer: () => inputs.map((i) => i.value), canSubmit: () => inputs.every((i) => RX.parseNum(i.value) != null), setDisabled: (on) => disableAll(host, on), markResult: (res) => { markInputs(host, inputs, res.correct ? [] : res.detail.wrong); if (res.final && !res.correct) inputs.forEach((inp, i) => { inp.value = String(q.blanks[i].answer); }); }, focus: () => inputs[0].focus() };
  };

  W.tape = function (host, q, ctx) {
    const given = q.given || {};
    const wrap = h('<div class="tape-w"><div class="tape-viz"></div><div class="tape-fields"></div></div>');
    host.appendChild(wrap);
    const viz = wrap.querySelector('.tape-viz'), fieldsEl = wrap.querySelector('.tape-fields');
    const inputs = {};
    const draw = () => { const box = inputs.box ? RX.parseNum(inputs.box.value) : null; viz.innerHTML = RX.V.tape(q.rows.map((r, ri) => ({ label: r.label, boxes: r.boxes, value: box != null ? box : '?', total: ri === 0 && given.rowA != null ? given.rowA : null })), { boxW: 46, labelW: 110 }) + (q.total != null ? `<div class="tape-total">Total: <b>${q.total}</b></div>` : ''); };
    q.fields.forEach((f) => { const n = numInput({ label: f.label, width: 'sm' }); fieldsEl.appendChild(n); inputs[f.key] = n.querySelector('input'); if (f.key === 'box') inputs.box.addEventListener('input', draw); });
    draw();
    bindEnter(host, ctx);
    return { getAnswer: () => { const o = {}; q.fields.forEach((f) => (o[f.key] = inputs[f.key].value)); return o; }, canSubmit: () => q.fields.every((f) => RX.parseNum(inputs[f.key].value) != null), setDisabled: (on) => disableAll(host, on), markResult: (res) => { q.fields.forEach((f) => { const bad = !res.correct && res.detail.wrong.includes(f.key); inputs[f.key].classList.toggle('is-wrong', bad); inputs[f.key].classList.toggle('is-right', !bad); if (res.final && bad) inputs[f.key].value = String(f.answer); }); if (res.final) draw(); }, focus: () => inputs[q.fields[0].key].focus() };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — extra widgets + checkers: nl (number-line placement), ineq (graph an inequality),
   shade (shade a grid), and a four-quadrant upgrade of plot. Checkers are pure and shared with the Node verifier. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const C = RX.checkers;
  const { parseNum, near } = RX;

  // ---------- Checkers ----------
  /** q: {min,max,step,points:[v...],count, tolerance} ; answer: [v...] */
  C.nl = function (q, a) {
    a = Array.isArray(a) ? a : [];
    const tol = q.tolerance == null ? (q.step || 1) / 4 : q.tolerance;
    const missing = q.points.filter((p) => !a.some((v) => near(v, p, tol)));
    const extra = a.filter((v) => !q.points.some((p) => near(v, p, tol)));
    return { correct: missing.length === 0 && extra.length === 0 && a.length === q.points.length, detail: { missing, extra } };
  };
  /** q: {min,max,step,point,open:boolean,dir:'left'|'right'} ; answer: {point, open, dir} */
  C.ineq = function (q, a) {
    a = a || {};
    const pointOk = a.point != null && near(a.point, q.point, (q.step || 1) / 4);
    const openOk = a.open === q.open;
    const dirOk = a.dir === q.dir;
    return { correct: pointOk && openOk && dirOk, detail: { pointOk, openOk, dirOk } };
  };
  /** q: {cells, count} ; answer: number of shaded cells */
  C.shade = function (q, a) {
    const n = Number(a);
    return { correct: n === q.count, detail: { value: n } };
  };

  if (typeof document === 'undefined') return; // Node verifier stops here

  const W = RX.Widgets;
  const { h, disableAll } = RX.WUtil;
  const ns = 'http://www.w3.org/2000/svg';
  const fmtN = (n) => (Number.isInteger(n) ? String(n) : String(Math.round(n * 1000) / 1000));

  /** Shared interactive number line. Returns {svg, x(v), ticks:[v], layer, hits, lock(on)} */
  function buildLine(host, q, onTick) {
    const w = 560,
      padL = 30,
      padR = 30,
      y = 56,
      hgt = 100;
    const x = (v) => padL + ((v - q.min) / (q.max - q.min)) * (w - padL - padR);
    const stage = h(`<div class="nl-stage">${RX.V.numberLine({ min: q.min, max: q.max, step: q.step, labelEvery: q.labelEvery, width: w, ticksOnly: !!q.ticksOnly })}</div>`);
    host.appendChild(stage);
    const svg = stage.querySelector('svg');
    svg.classList.add('nl-svg');
    svg.setAttribute('role', 'group');
    svg.setAttribute('aria-label', `Number line from ${q.min} to ${q.max}. Each tick is ${q.step}. Choose a tick to place a point.`);
    svg.setAttribute('width', '100%');
    svg.removeAttribute('height');
    svg.setAttribute('viewBox', `0 0 ${w} ${hgt}`);
    const layer = document.createElementNS(ns, 'g');
    svg.appendChild(layer);
    const hits = document.createElementNS(ns, 'g');
    svg.appendChild(hits);
    const ticks = [];
    const n = Math.round((q.max - q.min) / q.step);
    let locked = false;
    for (let i = 0; i <= n; i++) {
      const v = Math.round((q.min + i * q.step) * 1000) / 1000;
      ticks.push(v);
      const c = document.createElementNS(ns, 'rect');
      c.setAttribute('x', x(v) - 11);
      c.setAttribute('y', y - 22);
      c.setAttribute('width', 22);
      c.setAttribute('height', 44);
      c.setAttribute('rx', 6);
      c.setAttribute('class', 'nl-hit');
      c.setAttribute('tabindex', '0');
      c.setAttribute('role', 'button');
      c.setAttribute('aria-label', `Point at ${fmtN(v)}`);
      const go = () => {
        if (!locked) onTick(v);
      };
      c.addEventListener('click', go);
      c.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          go();
        }
      });
      hits.appendChild(c);
    }
    return {
      svg,
      x,
      y,
      ticks,
      layer,
      hits,
      lock(on) {
        locked = on;
        svg.classList.toggle('is-locked', on);
      },
    };
  }
  const circle = (cx, cy, r, cls) => {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', cx);
    c.setAttribute('cy', cy);
    c.setAttribute('r', r);
    c.setAttribute('class', cls);
    return c;
  };
  const text = (x, y, t, cls) => {
    const e = document.createElementNS(ns, 'text');
    e.setAttribute('x', x);
    e.setAttribute('y', y);
    e.setAttribute('class', cls);
    e.setAttribute('text-anchor', 'middle');
    e.textContent = t;
    return e;
  };

  /** Place `count` points on a number line. q: {min,max,step,labelEvery,count,points,labels?:[...]} */
  W.nl = function (host, q) {
    const pts = [];
    const wrap = h('<div class="nl-w"></div>');
    host.appendChild(wrap);
    const status = h('<div class="plot-status" aria-live="polite"></div>');
    const L = buildLine(wrap, q, (v) => {
      const i = pts.indexOf(v);
      if (i >= 0) pts.splice(i, 1);
      else {
        if (pts.length >= q.count) {
          status.textContent = `You already placed ${q.count} point${q.count > 1 ? 's' : ''}. Click a point to remove it first.`;
          return;
        }
        pts.push(v);
      }
      refresh();
    });
    wrap.appendChild(status);
    const refresh = () => {
      L.layer.innerHTML = '';
      pts.forEach((v, i) => {
        L.layer.appendChild(circle(L.x(v), L.y, 8, 'nl-pt'));
        L.layer.appendChild(text(L.x(v), L.y - 16, q.labels && q.labels[i] != null ? q.labels[i] : fmtN(v), 'nl-lbl'));
      });
      status.textContent = `${pts.length} of ${q.count} point${q.count > 1 ? 's' : ''} placed`;
    };
    refresh();
    return {
      getAnswer: () => pts.slice(),
      canSubmit: () => pts.length === q.count,
      setDisabled: (on) => L.lock(on),
      markResult: (res) => {
        if (res.final && !res.correct) {
          pts.length = 0;
          q.points.forEach((p) => pts.push(p));
          refresh();
          L.layer.querySelectorAll('.nl-pt').forEach((c) => c.classList.add('is-correct'));
        } else if (!res.correct) {
          L.layer.querySelectorAll('.nl-pt').forEach((c, i) => {
            if (res.detail.extra.includes(pts[i])) c.classList.add('is-incorrect');
          });
        }
      },
      focus: () => L.hits.firstChild.focus(),
    };
  };

  /** Graph an inequality: pick the boundary point, open/closed, and the direction. q: {min,max,step,labelEvery,point,open,dir,variable} */
  W.ineq = function (host, q) {
    const st = { point: null, open: null, dir: null };
    const wrap = h(
      `<div class="ineq-w"><div class="ineq-ctl" role="group" aria-label="Circle type"><span class="ineq-k">Circle</span><button type="button" class="tf-btn" data-open="false">● Closed (includes the number)</button><button type="button" class="tf-btn" data-open="true">○ Open (does not include it)</button></div><div class="ineq-ctl" role="group" aria-label="Direction"><span class="ineq-k">Shade</span><button type="button" class="tf-btn" data-dir="left">◀ To the left (less than)</button><button type="button" class="tf-btn" data-dir="right">To the right (greater than) ▶</button></div><p class="hint-line">Click the number line where the boundary point goes.</p></div>`,
    );
    host.appendChild(wrap);
    const status = h('<div class="plot-status" aria-live="polite"></div>');
    const L = buildLine(wrap, q, (v) => {
      st.point = st.point === v ? null : v;
      refresh();
    });
    wrap.appendChild(status);
    const refresh = () => {
      L.layer.innerHTML = '';
      if (st.point != null) {
        if (st.dir) {
          const ln = document.createElementNS(ns, 'line');
          ln.setAttribute('x1', L.x(st.point));
          ln.setAttribute('x2', st.dir === 'right' ? 560 - 16 : 16);
          ln.setAttribute('y1', L.y);
          ln.setAttribute('y2', L.y);
          ln.setAttribute('class', 'ineq-ray');
          L.layer.appendChild(ln);
        }
        const c = circle(L.x(st.point), L.y, 9, 'ineq-pt' + (st.open ? ' is-open' : ''));
        L.layer.appendChild(c);
        L.layer.appendChild(text(L.x(st.point), L.y - 18, fmtN(st.point), 'nl-lbl'));
      }
      wrap.querySelectorAll('[data-open]').forEach((b) => {
        const on = st.open != null && String(st.open) === b.dataset.open;
        b.classList.toggle('is-selected', on);
        b.setAttribute('aria-pressed', String(on));
      });
      wrap.querySelectorAll('[data-dir]').forEach((b) => {
        const on = st.dir === b.dataset.dir;
        b.classList.toggle('is-selected', on);
        b.setAttribute('aria-pressed', String(on));
      });
      status.textContent =
        st.point == null
          ? 'No boundary point yet.'
          : `Boundary at ${fmtN(st.point)}${st.open == null ? '' : st.open ? ', open circle' : ', closed circle'}${st.dir ? ', shaded to the ' + st.dir : ''}.`;
    };
    wrap.querySelectorAll('[data-open]').forEach((b) =>
      b.addEventListener('click', () => {
        if (b.disabled) return;
        st.open = b.dataset.open === 'true';
        refresh();
      }),
    );
    wrap.querySelectorAll('[data-dir]').forEach((b) =>
      b.addEventListener('click', () => {
        if (b.disabled) return;
        st.dir = b.dataset.dir;
        refresh();
      }),
    );
    refresh();
    return {
      getAnswer: () => Object.assign({}, st),
      canSubmit: () => st.point != null && st.open != null && !!st.dir,
      setDisabled: (on) => {
        L.lock(on);
        disableAll(wrap, on);
      },
      markResult: (res) => {
        wrap.querySelectorAll('[data-open]').forEach((b) => b.classList.toggle('is-incorrect', !res.detail.openOk && b.classList.contains('is-selected')));
        wrap.querySelectorAll('[data-dir]').forEach((b) => b.classList.toggle('is-incorrect', !res.detail.dirOk && b.classList.contains('is-selected')));
        if (res.final && !res.correct) {
          st.point = q.point;
          st.open = q.open;
          st.dir = q.dir;
          refresh();
          L.layer.querySelectorAll('.ineq-pt, .ineq-ray').forEach((c) => c.classList.add('is-correct'));
          wrap.querySelectorAll('.tf-btn').forEach((b) => b.classList.remove('is-incorrect'));
        } else if (!res.detail.pointOk) L.layer.querySelectorAll('.ineq-pt').forEach((c) => c.classList.add('is-incorrect'));
      },
      focus: () => wrap.querySelector('.tf-btn').focus(),
    };
  };

  /** Shade cells of a grid. q: {cells:100|10|..., cols, count, label} */
  W.shade = function (host, q) {
    const cells = q.cells || 100,
      cols = q.cols || 10,
      size = 240,
      cw = size / cols,
      rows = Math.ceil(cells / cols);
    const wrap = h(
      `<div class="shade-w"><svg class="shade-svg" viewBox="0 0 ${size} ${(size / cols) * rows}" role="group" aria-label="Grid of ${cells} squares"></svg><div class="plot-status" aria-live="polite"></div><div class="shade-tools"><button type="button" class="btn btn-ghost btn-sm" data-fill="row">Shade a full row</button><button type="button" class="btn btn-ghost btn-sm" data-fill="clear">Clear</button></div></div>`,
    );
    host.appendChild(wrap);
    const svg = wrap.querySelector('svg'),
      status = wrap.querySelector('.plot-status');
    const on = new Set();
    let locked = false;
    const rects = [];
    for (let i = 0; i < cells; i++) {
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', (i % cols) * cw);
      r.setAttribute('y', Math.floor(i / cols) * cw);
      r.setAttribute('width', cw);
      r.setAttribute('height', cw);
      r.setAttribute('class', 'shade-cell');
      r.setAttribute('tabindex', '0');
      r.setAttribute('role', 'checkbox');
      r.setAttribute('aria-checked', 'false');
      r.setAttribute('aria-label', `Square ${i + 1}`);
      const t = () => {
        if (locked) return;
        if (on.has(i)) on.delete(i);
        else on.add(i);
        refresh();
      };
      r.addEventListener('click', t);
      r.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          t();
        }
      });
      svg.appendChild(r);
      rects.push(r);
    }
    const refresh = () => {
      rects.forEach((r, i) => {
        r.classList.toggle('is-on', on.has(i));
        r.setAttribute('aria-checked', String(on.has(i)));
      });
      status.textContent = `${on.size} of ${cells} squares shaded${q.label ? ' · ' + q.label : ''}`;
    };
    wrap.querySelector('[data-fill="row"]').addEventListener('click', () => {
      if (locked) return;
      for (let r = 0; r < rows; r++) {
        const rowIdx = Array.from({ length: cols }, (_, k) => r * cols + k).filter((i) => i < cells);
        if (rowIdx.some((i) => !on.has(i))) {
          rowIdx.forEach((i) => on.add(i));
          break;
        }
      }
      refresh();
    });
    wrap.querySelector('[data-fill="clear"]').addEventListener('click', () => {
      if (locked) return;
      on.clear();
      refresh();
    });
    refresh();
    return {
      getAnswer: () => on.size,
      canSubmit: () => on.size > 0,
      setDisabled: (o) => {
        locked = o;
        disableAll(wrap, o);
        svg.classList.toggle('is-locked', o);
      },
      markResult: (res) => {
        if (res.final && !res.correct) {
          on.clear();
          for (let i = 0; i < q.count; i++) on.add(i);
          refresh();
          svg.classList.add('is-shown');
        }
      },
      focus: () => rects[0].focus(),
    };
  };

  // ---------- Four-quadrant plot (upgrade of W.plot: honors q.xMin / q.yMin) ----------
  const plot0 = W.plot;
  W.plot = function (host, q) {
    if (!q.xMin && !q.yMin) return plot0(host, q);
    const size = 360,
      pad = { l: 30, r: 18, t: 18, b: 30 };
    const px = (x) => pad.l + ((x - q.xMin) / (q.xMax - q.xMin)) * (size - pad.l - pad.r),
      py = (y) => size - pad.b - ((y - q.yMin) / (q.yMax - q.yMin)) * (size - pad.t - pad.b);
    const base = RX.V.graph({
      xLabel: q.xLabel,
      yLabel: q.yLabel,
      xMin: q.xMin,
      xMax: q.xMax,
      yMin: q.yMin,
      yMax: q.yMax,
      size,
      series: q.given ? [{ points: q.given, color: '#5B6B7A', labels: q.givenLabels }] : [],
    });
    const wrap = h(`<div class="plot"><div class="plot-stage">${base}</div><div class="plot-status" aria-live="polite"></div></div>`);
    host.appendChild(wrap);
    const svg = wrap.querySelector('svg');
    svg.classList.add('plot-svg');
    svg.setAttribute('role', 'group');
    svg.setAttribute('aria-label', 'Coordinate grid. Choose grid points to place them.');
    svg.setAttribute('width', '100%');
    svg.removeAttribute('height');
    const pts = new Map();
    const key = (x, y) => x + ',' + y;
    const layer = document.createElementNS(ns, 'g');
    svg.appendChild(layer);
    const hits = document.createElementNS(ns, 'g');
    svg.appendChild(hits);
    const status = wrap.querySelector('.plot-status');
    const refresh = () => {
      layer.innerHTML = '';
      pts.forEach((p) => {
        layer.appendChild(circle(px(p[0]), py(p[1]), 6.5, 'plot-pt'));
        const t = text(px(p[0]) + 18, py(p[1]) - 8, `(${p[0]}, ${p[1]})`, 'plot-lbl');
        layer.appendChild(t);
      });
      status.textContent = `${pts.size} of ${q.count} points placed`;
    };
    let locked = false;
    for (let x = q.xMin; x <= q.xMax; x++)
      for (let y = q.yMin; y <= q.yMax; y++) {
        const c = circle(px(x), py(y), Math.max(5, Math.min(10, (size - pad.t - pad.b) / (q.yMax - q.yMin) / 2.1)), 'plot-hit');
        c.setAttribute('tabindex', '0');
        c.setAttribute('role', 'button');
        c.setAttribute('aria-label', `Point (${x}, ${y})`);
        const toggle = () => {
          if (locked) return;
          const k = key(x, y);
          if (pts.has(k)) pts.delete(k);
          else {
            if (pts.size >= q.count) {
              status.textContent = `You already placed ${q.count} points. Remove one first.`;
              return;
            }
            pts.set(k, [x, y]);
          }
          refresh();
        };
        c.addEventListener('click', toggle);
        c.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggle();
          }
        });
        hits.appendChild(c);
      }
    refresh();
    return {
      getAnswer: () => Array.from(pts.values()),
      canSubmit: () => pts.size === q.count,
      setDisabled: (on) => {
        locked = on;
        svg.classList.toggle('is-locked', on);
      },
      markResult: (res) => {
        if (res.final && !res.correct) {
          pts.clear();
          q.points.forEach((p) => pts.set(key(p[0], p[1]), p));
          refresh();
          layer.querySelectorAll('.plot-pt').forEach((c) => c.classList.add('is-correct'));
        } else if (!res.correct) {
          const arr = Array.from(pts.values());
          layer.querySelectorAll('.plot-pt').forEach((c, i) => {
            const p = arr[i];
            if (res.detail.extra.some((e) => e[0] === p[0] && e[1] === p[1])) c.classList.add('is-incorrect');
          });
        }
      },
      focus: () => hits.firstChild.focus(),
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Grade 6 Review Expeditions — screens, HUD, map, modals, toasts. No game logic here. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { esc, icon } = RX;
  const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  let refs = {};
  let modalStack = [];
