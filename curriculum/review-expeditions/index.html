        return `<section class="sk-unit" style="--accent:${p.UNIT.accent || '#1FA6A2'}"><div class="sk-head"><h3>Unit ${p.UNIT.unit} · ${esc(p.UNIT.brand)}</h3><span class="muted">${seen.length}/${sk.length} skills seen${pr.acc != null ? ` · ${pr.acc}% first try` : ''}</span><a class="btn btn-ghost btn-sm" href="${unitUrl(k)}">Open</a></div>
      <div class="sk-grid">${sk.map((x) => `<div class="sk-cell ${bandCls(x.band)}" title="${esc(x.label)} — ${x.band}${x.seen ? ` (${x.seen} seen)` : ''}"><span class="sk-lesson">${esc(x.lesson)}</span><span class="sk-label">${esc(x.label)}</span><span class="sk-band">${x.band}</span></div>`).join('')}</div></section>`;
      })
      .join('');
    main().innerHTML = `<section class="at-page"><p class="eyebrow">Skill Atlas</p><h1>Every skill, every unit</h1><p class="lede">Bands come from first-try accuracy on this device: <span class="band band-strong">Strong</span> 80% and up · <span class="band band-almostthere">Almost There</span> 50–79% · <span class="band band-practiceagain">Practice Again</span> below 50%. Replay a zone to move a skill up.</p>
      <div class="sk-actions"><button type="button" class="btn btn-ghost" id="sk-copy">${icon('ref')} Copy skill report</button><button type="button" class="btn btn-ghost" id="sk-print">${icon('print')} Print</button></div>${sections}</section>`;
    document.getElementById('sk-copy').addEventListener('click', async () => {
      const t = skillReportText();
      try {
        await navigator.clipboard.writeText(t);
        RX.UI.toast('Skill report copied.', 'ok');
      } catch (e) {
        RX.UI.modal({ title: 'Skill report', body: `<pre class="report-pre">${esc(t)}</pre>` });
      }
    });
    document.getElementById('sk-print').addEventListener('click', () => root.print());
  }
  function skillReportText() {
    const codes = [];
    const lines = [`Grade 6 Review Expeditions — Skill Atlas${studentName() ? ' — ' + studentName() : ''}`, `Date: ${new Date().toLocaleDateString()}`, ''];
    keys().forEach((k) => {
      const p = pack(k),
        pr = progressOf(k);
      lines.push(`Unit ${p.UNIT.unit} · ${p.UNIT.brand} — ${pr.done}/${pr.total} missions, ${pr.xp} XP${pr.acc != null ? `, ${pr.acc}% first try` : ''}`);
      const save = saveOf(k);
      if (save && save.stats && save.stats.answered) codes.push(`Teacher code (Unit ${p.UNIT.unit}): ${RX.Support.encodeProgress(RX.Support.progressPayload(save, k, studentName()))}`);
      skillsOf(k).forEach((x) => {
        if (x.seen) lines.push(`  ${x.band === 'Strong' ? '✔' : x.band === 'Almost There' ? '~' : '✘'} ${x.label} (Lesson ${x.lesson}): ${x.band}`);
      });
      lines.push('');
    });
    return lines.concat(codes).join('\n');
  }
  /** The name a student typed on any unit's report (most recently updated save wins). */
  function studentName() {
    let best = null;
    keys().forEach((k) => { const sv = saveOf(k); if (sv && sv.settings && sv.settings.studentName && (!best || (sv.updatedAt || 0) > best.t)) best = { n: sv.settings.studentName, t: sv.updatedAt || 0 }; });
    return best ? best.n : '';
  }

  function teacherView() {
    main().innerHTML = `<section class="at-page"><p class="eyebrow">Teacher Tools</p><h1>Run the expeditions in your classroom</h1>
      <div class="tt-grid">
        <article class="tt-card"><h3>${icon('print')} Quiz Printer</h3><p>Build a printable quiz, warm-up, or exit ticket from any zone of any unit, with an answer key on the last page. Same generators as the game, so the paper matches the practice.</p><a class="btn btn-primary" href="#print">${icon('arrow')} Open the Quiz Printer</a></article>
        <article class="tt-card tt-feature"><h3>${icon('chart')} Class Snapshot</h3><p>Students press <b>Copy report for my teacher</b> on any Mission Report and paste it into Canvas, a form, or an email. Paste all of the reports here at once to see every student's skills in one table per unit, with suggested small groups.</p><a class="btn btn-primary" href="#snapshot">${icon('arrow')} Open the Class Snapshot</a><p class="muted">Bands: Strong ≥ 80% first try · Almost There 50–79% · Practice Again &lt; 50%.</p></article>
        <article class="tt-card"><h3>${icon('trek')} Levels for every student</h3><p>Each student picks a level when they start, and can change it in Settings.</p><ul><li><b>Level 0 · Most Support:</b> key words with Spanish first, a hint on every question, read-aloud on.</li><li><b>Level 1 · Support:</b> key words first; a hint appears after a wrong try.</li><li><b>Level 2 · Enrichment:</b> harder versions of every challenge, more XP.</li></ul><p class="muted">The level shows on each student's report.</p></article>
        <article class="tt-card"><h3>${icon('book')} Suggested routines</h3><ul><li><b>Unit review week:</b> one zone per day in order, final mission on the last day.</li><li><b>Warm-up:</b> the Daily Trek (8 mixed challenges, about 10 minutes).</li><li><b>Small group:</b> replay the zones the Skill Atlas marks Practice Again.</li><li><b>Printable:</b> Quiz Printer, 6 questions from one zone, as an exit ticket.</li></ul></article>
        <article class="tt-card"><h3>${icon('settings')} Device reset</h3><p>Progress is saved per browser on this device (no accounts). On a shared computer, reset between students.</p><button type="button" class="btn btn-danger btn-sm" id="tt-reset">Erase every expedition on this device</button></article>
      </div></section>`;
    document.getElementById('tt-reset').addEventListener('click', async () => {
      const ok = await RX.UI.confirm('Erase everything?', '<p>This erases progress, XP and achievements for all eight expeditions and the Daily Trek saved in this browser.</p>', 'Erase all');
      if (!ok) return;
      keys().forEach((k) => {
        try {
          root.localStorage.removeItem(pack(k).UNIT.saveKey);
        } catch (e) {
          /* ignore */
        }
      });
      RX.Trek.reset();
      RX.UI.toast('All expedition progress erased.', 'ok');
      show('home');
    });
  }

  // ---------- Router ----------
  function route() {
    const v = (location.hash || '#home').slice(1).split('/')[0];
    show(['home', 'trek', 'skills', 'teacher', 'print', 'snapshot'].includes(v) ? v : 'home');
  }
  function boot() {
    RX.UI.mount();
    root.addEventListener('hashchange', route);
    route();
  }

  RX.Atlas = { keys, pack, meta, use, saveOf, progressOf, skillsOf, unitUrl, show, boot, h, loadPacks, packsLoaded };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
    <script>
/* Daily Trek — eight mixed challenges drawn from the skills a student most needs, across every expedition they have started.
   Runs the normal mission engine on a synthetic one-zone pack; results land in a trek history for a day streak. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { esc, icon } = RX;
  const A = () => RX.Atlas;
  const HKEY = 'rx-trek-history-v1';
  const TREK_SAVE = 'rx-trek-save-v1';
  const N = 8;

  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  const daySeed = (date) => Number(date.replace(/-/g, '')) >>> 0;
  function history() {
    try {
      const raw = root.localStorage.getItem(HKEY);
      return raw ? JSON.parse(raw) : { days: {} };
    } catch (e) {
      return { days: {} };
    }
  }
  function saveHistory(hs) {
    try {
      root.localStorage.setItem(HKEY, JSON.stringify(hs));
    } catch (e) {
      /* ignore */
    }
  }
  function trekLevel() {
    try { const raw = root.localStorage.getItem(TREK_SAVE); const sv = raw ? JSON.parse(raw) : null; return RX.Support.levelOf(sv); } catch (e) { return 1; }
  }
  function setTrekLevel(l) {
    try {
      const raw = root.localStorage.getItem(TREK_SAVE);
      const sv = raw ? JSON.parse(raw) : RX.State.defaults();
      sv.settings = Object.assign({}, sv.settings, { level: l });
      if (l === 0) sv.settings.readAloud = true;
      root.localStorage.setItem(TREK_SAVE, JSON.stringify(sv));
    } catch (e) { /* storage blocked: level stays at the default */ }
  }
  function reset() {
    try {
      root.localStorage.removeItem(HKEY);
      root.localStorage.removeItem(TREK_SAVE);
    } catch (e) {
      /* ignore */
    }
  }
  function streak(hs) {
    let n = 0;
    const d = new Date();
    for (;;) {
      const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (hs.days[k] && hs.days[k].done) {
        n++;
        d.setDate(d.getDate() - 1);
      } else if (n === 0 && k === today()) {
        d.setDate(d.getDate() - 1);
      } else break;
    }
    return n;
  }
  function summary() {
    const hs = history();
    const t = hs.days[today()];
    return {
      streak: streak(hs),
      todayDone: !!(t && t.done),
      todayFirst: t ? t.first : 0,
      todayTotal: t ? t.total : 0,
      anyProgress: A()
        .keys()
        .some((k) => A().progressOf(k).started),
      days: hs.days,
    };
  }

  // ---------- Candidate pool ----------
  const skillCache = {};
  function genSkill(k, gen) {
    const ck = k + ':' + gen;
    if (skillCache[ck]) return skillCache[ck];
    try {
      const q = RX.G.make(gen, RX.R.make(99), {});
      skillCache[ck] = q.skill;
    } catch (e) {
      skillCache[ck] = null;
    }
    return skillCache[ck];
  }
  /** Build the weighted candidate list: [{unit, gen, skill, weight}] */
  function candidates(mode) {
    const ks = A().keys();
    const started = ks.filter((k) => A().progressOf(k).started);
    const pool = mode === 'all' || !started.length ? ks : started;
    const out = [];
    pool.forEach((k) => {
      const p = A().pack(k),
        skills = A().skillsOf(k);
      const byId = {};
      skills.forEach((s) => (byId[s.id] = s));
      p.ZONES.filter((z) => !z.final && !z.optional).forEach((z) =>
        z.missions.forEach((m) =>
          m.gens.forEach((g) => {
            const gen = Array.isArray(g) ? g[0] : g;
            const sk = genSkill(k, gen);
            if (!sk) return;
            const info = byId[sk];
            const rate = info && info.rate;
            const weight = rate == null ? 1 : 0.4 + (1 - rate) * 1.6; // unseen 1.0, strong ≈0.4–0.7, weak → 2.0
            out.push({ unit: k, gen, skill: sk, weight, zone: z.id });
          }),
        ),
      );
    });
    return out;
  }
  /** Pick N generators: weighted, distinct skills where possible, spread across units. */
  function pickSet(seed, mode) {
    const r = RX.R.make(seed);
    let cands = candidates(mode);
    const picked = [];
    const usedSkills = new Set(),
      unitCount = {};
    for (let i = 0; i < N && cands.length; i++) {
      const weighted = cands.map((c) => ({ c, w: c.weight * (usedSkills.has(c.unit + ':' + c.skill) ? 0.15 : 1) * (unitCount[c.unit] >= 3 ? 0.3 : 1) }));
      const total = weighted.reduce((a, x) => a + x.w, 0);
      let t = r.next() * total,
        chosen = weighted[weighted.length - 1].c;
      for (const x of weighted) {
        t -= x.w;
        if (t <= 0) {
          chosen = x.c;
          break;
        }
      }
      picked.push(chosen);
      usedSkills.add(chosen.unit + ':' + chosen.skill);
      unitCount[chosen.unit] = (unitCount[chosen.unit] || 0) + 1;
      cands = cands.filter((c) => c.gen !== chosen.gen);
    }
    return picked;
  }

  // ---------- Synthetic pack ----------
  let wrapped = new Set();
  function wrap(k, gen) {
    const key = `trek:${k}:${gen}`;
    if (!wrapped.has(key)) {
      RX.G.define(key, (r, o) => {
        const q = RX.G.make(gen, r, o);
        q.skill = `${k}:${q.skill}`;
        q.unitKey = k;
        return q;
      });
      wrapped.add(key);
    }
    return key;
  }
  function mountPack(set, label, date) {
    const skills = {},
      vocab = [];
    A()
      .keys()
      .forEach((k) => {
        const p = A().pack(k);
        Object.keys(p.SKILLS).forEach((id) => {
          skills[`${k}:${id}`] = { label: `Unit ${p.UNIT.unit} · ${p.SKILLS[id].label}`, lesson: p.SKILLS[id].lesson, zone: 'trek' };
        });
        vocab.push(...p.VOCAB.map((v) => Object.assign({}, v, { term: `${v.term} (Unit ${p.UNIT.unit})` })));
      });
    RX.UNIT = { id: 'trek', unit: 0, brand: 'Daily Trek', unitLabel: label, saveKey: TREK_SAVE, accent: '#0F7C6B', hubUrl: null, onExit: () => finish(date, label) };
    RX.STORY = {
      eyebrow: 'Daily Trek',
      titleA: 'Daily',
      titleB: 'Trek',
      lede: '',
      briefingTitle: '',
      intro: [],
      role: 'Trekker',
      objective: 'Eight mixed challenges',
      tools: 'Everything so far',
      mapEyebrow: 'Daily Trek',
      satchel: 'Pack',
      artifactWord: 'Badge',
      glyphWord: 'marker',
      finalHeading: 'Trek Complete',
      resultsLede: '',
    };
    RX.SKILLS = skills;
    RX.ZONES = [
      {
        id: 'trek',
        name: 'Daily Trek',
        lesson: 'Mixed',
        lessonName: label,
        emblem: 'trek',
        accent: '#0F7C6B',
        artifact: { id: 'trek-' + date, name: 'Trek Badge', icon: 'medal' },
        final: false,
        blurb: 'Eight mixed challenges.',
        story: 'A trek across every expedition.',
        missions: [{ id: 't1', name: label, gens: set.map((c) => wrap(c.unit, c.gen)) }],
      },
    ];
    RX.ACHIEVEMENTS = [];
    RX.VOCAB = vocab;
    RX.REFERENCE_SHEET = A()
      .keys()
      .map((k) => A().pack(k).REFERENCE_SHEET)
      .filter(Boolean)
      .join('');
    RX.REFERENCE_TITLE = 'Reference sheets';
  }

  let current = null; // { date, label, set, bonus }
  function start(mode, bonus) {
    if (!A().packsLoaded()) {
      A()
        .loadPacks()
        .then(() => start(mode, bonus))
        .catch((e) => RX.UI.toast(e.message, 'warn'));
      return;
    }
    const date = today();
    const seed = bonus ? (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0 : daySeed(date);
    const set = pickSet(seed, mode);
    if (!set.length) {
      RX.UI.toast('No expeditions are loaded yet.', 'warn');
      return;
    }
    const label = bonus ? 'Bonus Trek' : `Trek for ${new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
    current = { date, label, set, bonus };
    mountPack(set, label, date);
    document.getElementById('atlas').hidden = true;
    const app = document.getElementById('app');
    app.hidden = false;
    document.body.classList.add('in-trek');
    RX.Game.bootMission('trek', 't1');
    root.scrollTo(0, 0);
  }
  function finish(date, label) {
    // record the just-finished mission (if any) into the day history
    try {
      const s = RX.State.load();
      const md = s.zones.trek && s.zones.trek.missions.t1;
      if (md && md.best && current && !current.bonus) {
        const hs = history();
        const prev = hs.days[date] || { done: false, first: 0, total: 0, runs: 0 };
        hs.days[date] = { done: true, first: Math.max(prev.first, md.best.first), total: md.best.total, runs: (prev.runs || 0) + 1, skills: current.set.map((c) => c.unit + ':' + c.skill) };
        saveHistory(hs);
      } else if (md && md.best && current && current.bonus) {
        const hs = history();
        const prev = hs.days[date] || { done: false, first: 0, total: 0, runs: 0 };
        hs.days[date] = Object.assign(prev, { bonus: (prev.bonus || 0) + 1 });
        saveHistory(hs);
      }
      // fold the trek skill results back into each unit's own save so the Skill Atlas and unit reports reflect them
      if (s.current == null && current) foldSkills(s);
      s.zones = {};
      s.current = null;
      RX.State.save();
    } catch (e) {
      /* ignore */
    }
    current = null;
    location.hash = '#trek';
    A().show('trek');
  }
  function foldSkills(s) {
    Object.keys(s.skills || {}).forEach((composite) => {
      const [k, id] = composite.split(':');
      const p = A().pack(k);
      if (!p) return;
      try {
        const raw = root.localStorage.getItem(p.UNIT.saveKey);
        const save = raw ? JSON.parse(raw) : RX.State.defaults();
        const sk = save.skills[id] || (save.skills[id] = { attempts: 0, first: 0, correct: 0, seen: 0 });
        const src = s.skills[composite];
        sk.attempts += src.attempts;
        sk.first += src.first;
        sk.correct += src.correct;
        sk.seen += src.seen;
        save.stats.answered += src.seen;
        save.stats.firstTry += src.first;
        save.stats.correct += src.correct;
        root.localStorage.setItem(p.UNIT.saveKey, JSON.stringify(save));
      } catch (e) {
        /* ignore */
      }
    });
    s.skills = {};
  }

  // ---------- View ----------
  function view() {
    if (!A().packsLoaded()) {
      document.getElementById('atlas').innerHTML = `<section class="at-page"><p class="eyebrow">${icon('trek')} Daily Trek</p><h1>Today's trek</h1><p class="lede">Loading the challenge packs…</p></section>`;
      A()
        .loadPacks()
        .then(() => { if ((location.hash || '#home').slice(1) === 'trek') view(); })
        .catch((e) => { document.getElementById('atlas').innerHTML = `<section class="at-page"><p class="eyebrow">${icon('trek')} Daily Trek</p><h1>Today's trek</h1><p class="lede">${esc(e.message)}. Check the connection and reload.</p></section>`; });
      return;
    }
    const sm = summary(),
      hs = history();
    const days = [];
    const d = new Date();
    for (let i = 13; i >= 0; i--) {
      const x = new Date(d);
      x.setDate(d.getDate() - i);
      const k = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
      days.push({ k, label: x.toLocaleDateString(undefined, { weekday: 'narrow' }), day: x.getDate(), rec: hs.days[k], today: k === today() });
    }
    const preview = pickSet(daySeed(today()), sm.anyProgress ? 'started' : 'all');
    const byUnit = {};
    preview.forEach((c) => {
      byUnit[c.unit] = (byUnit[c.unit] || 0) + 1;
    });
    const unitsLine = Object.keys(byUnit)
      .map((k) => `Unit ${A().pack(k).UNIT.unit} ×${byUnit[k]}`)
      .join(' · ');
    const skillLines = preview
      .map((c) => {
        const p = A().pack(c.unit);
        const sk = A()
          .skillsOf(c.unit)
          .find((x) => x.id === c.skill);
        return `<li><span class="tk-unit" style="--accent:${p.UNIT.accent || '#1FA6A2'}">U${p.UNIT.unit}</span> ${esc(p.SKILLS[c.skill].label)} <span class="band band-${(sk ? sk.band : 'Not yet seen').replace(/\s/g, '').toLowerCase()}">${sk ? sk.band : 'Not yet seen'}</span></li>`;
      })
      .join('');
    document.getElementById('atlas').innerHTML = `<section class="at-page"><p class="eyebrow">${icon('trek')} Daily Trek</p><h1>Today's trek</h1>
      <p class="lede">Eight challenges chosen from the skills marked <b>Practice Again</b> or <b>Almost There</b> across the expeditions you have started, plus a little spiral review. Same trek all day; a <b>bonus trek</b> is always new.</p>
      <div class="tk-days" aria-label="Last 14 days">${days.map((x) => `<div class="tk-day ${x.rec && x.rec.done ? 'is-done' : ''} ${x.today ? 'is-today' : ''}" title="${x.k}${x.rec && x.rec.done ? ` — ${x.rec.first}/${x.rec.total} first try` : ''}"><span>${x.label}</span><b>${x.day}</b></div>`).join('')}</div>
      <div class="tk-grid"><div class="tk-card"><h3>${sm.todayDone ? 'Today is done' : 'Ready when you are'}</h3>
          ${sm.todayDone ? `<p class="tk-score"><b>${sm.todayFirst}/${sm.todayTotal}</b> first try today · streak <b>${sm.streak}</b> day${sm.streak === 1 ? '' : 's'}</p>` : `<p class="muted">${sm.anyProgress ? `Drawn from ${unitsLine}.` : 'You have not started an expedition yet, so this trek samples every unit.'}</p>`}
          <h4 class="tk-lvl-h">Level for the trek</h4>${RX.Support.levelPicker(trekLevel(), 'trek-level')}
          <div class="title-actions"><button type="button" class="btn btn-primary btn-lg" id="tk-start">${icon('arrow')} ${sm.todayDone ? "Replay today's trek" : "Start today's trek"}</button><button type="button" class="btn btn-ghost" id="tk-bonus">${icon('replay')} Bonus trek (new mix)</button><button type="button" class="btn btn-ghost" id="tk-all">${icon('atlas')} Trek across all units</button></div></div>
        <div class="tk-card"><h3>What's in today's trek</h3><ol class="tk-list">${skillLines}</ol></div></div></section>`;
    RX.Support.bindLevelPicker(document.querySelector('.tk-card .lvl-pick'), setTrekLevel);
    document.getElementById('tk-start').addEventListener('click', () => start(sm.anyProgress ? 'started' : 'all', false));
    document.getElementById('tk-bonus').addEventListener('click', () => start(sm.anyProgress ? 'started' : 'all', true));
    document.getElementById('tk-all').addEventListener('click', () => start('all', true));
  }

  RX.Trek = { view, start, summary, reset, pickSet, candidates };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
    <script>
/* Quiz Printer — builds a printable quiz / exit ticket from any zones of any unit, with an answer key, from the same generators. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { esc, icon } = RX;
  const V = RX.V;
  const A = () => RX.Atlas;
  const L = 'ABCDEFGH';
  const strip = (s) => String(s).replace(/<[^>]+>/g, '');
  const fmtN = (n) => (Number.isInteger(n) ? String(n) : String(Math.round(n * 1000) / 1000));
  const line = (w) => `<span class="pr-line" style="width:${w || 120}px"></span>`;

  // ---------- Static (paper) rendering of each question type ----------
  const S = {
    mc: (q) => `<ol class="pr-opts">${q.options.map((o, i) => `<li><span class="pr-key">${L[i]}</span><span>${o.html}</span></li>`).join('')}</ol>`,
    ms: (q) => `<p class="pr-note">Select every answer that applies.</p>${S.mc(q)}`,
    num: (q) => `<p class="pr-ans">Answer: ${line(140)} ${q.unit ? esc(q.unit) : ''}</p>`,
    blanks: (q) => {
      if (q.layout === 'fraction') return `<p class="pr-ans">Answer (simplest form): ${line(70)} / ${line(70)}</p>`;
      if (q.template) return (Array.isArray(q.template) ? q.template : [q.template]).map((t) => `<p class="pr-sent">${esc(t).replace(/\{(\d+)\}/g, () => line(90))}</p>`).join('');
      return `<div class="pr-fields">${q.fields.map((f) => `<p>${f.label ? esc(strip(f.label)) + ': ' : ''}${line(110)} ${f.suffix ? esc(f.suffix) : ''}</p>`).join('')}</div>`;
    },
    cloze: (q) => `<p class="pr-sent">${esc(q.template).replace(/\{(\d+)\}/g, () => line(110))}</p><p class="pr-note">Word bank: ${q.choices.map((c) => c.map(esc).join(' · ')).join('  |  ')}</p>`,
    table: (q) =>
      `<table class="viz-table compact pr-table">${q.rows
        .map(
          (row, ri) =>
            `<tr>${row
              .map((c, ci) => {
                const isHead = (q.rowHeader && ci === 0) || (q.header && ri === 0);
                const m = String(c).match(/^__IN:(.+)__$/);
                return isHead ? `<th>${c}</th>` : `<td>${m ? '' : c}</td>`;
              })
              .join('')}</tr>`,
        )
        .join('')}</table>`,
    match: (q) =>
      `<div class="pr-match"><ol class="pr-col">${q.left.map((t) => `<li>${t} ${line(40)}</li>`).join('')}</ol><ol class="pr-col pr-col-letters">${q.right.map((t, i) => `<li><span class="pr-key">${L[i]}</span>${t}</li>`).join('')}</ol></div><p class="pr-note">Write the letter of the matching meaning next to each term.</p>`,
    sort: (q) =>
      `<p class="pr-note">Write each item in the correct column.</p><ul class="pr-items">${q.items.map((it, i) => `<li>${i + 1}. ${it.html}</li>`).join('')}</ul><table class="viz-table compact pr-bins"><tr>${q.bins.map((b) => `<th>${esc(b)}</th>`).join('')}</tr><tr>${q.bins.map(() => '<td class="pr-bin"></td>').join('')}</tr></table>`,
    seq: (q) => `<p class="pr-note">Number the items in order (1 = first).</p><ul class="pr-items">${q.items.map((it) => `<li>${line(36)} ${it.html}</li>`).join('')}</ul>`,
    plot: (q) =>
      `<div class="pr-viz">${V.graph({ xLabel: q.xLabel, yLabel: q.yLabel, xMin: q.xMin, yMin: q.yMin, xMax: q.xMax, yMax: q.yMax, xStep: q.xStep, yStep: q.yStep, size: 260, series: q.given ? [{ points: q.given, color: '#5B6B7A', labels: q.givenLabels }] : [] })}</div><p class="pr-note">Plot ${q.count} point${q.count > 1 ? 's' : ''}.</p>`,
    dnl: (q) =>
      `<div class="pr-viz">${V.dnl(q.top, { label: q.bottom.label, values: q.bottom.values.map((v) => (v == null ? '?' : v)) })}</div><p class="pr-ans">Missing values: ${q.blanks.map(() => line(80)).join(' ')}</p>`,
    tape: (q) =>
      `<div class="pr-viz">${V.tape(
        q.rows.map((r) => ({ label: r.label, boxes: r.boxes, value: '?' })),
        { boxW: 46, labelW: 110 },
      )}${q.total != null ? `<p>Total: <b>${q.total}</b></p>` : ''}</div><div class="pr-fields">${q.fields.map((f) => `<p>${esc(f.label)}: ${line(90)}</p>`).join('')}</div>`,
    tf: (q) =>
      `<p class="pr-ans">Circle one: &nbsp; <b>${esc((q.labels || ['True', 'False'])[0])}</b> &nbsp;&nbsp; <b>${esc((q.labels || ['True', 'False'])[1])}</b></p><p class="pr-note">Then choose the best reason:</p><ol class="pr-opts">${q.reasons.map((o, i) => `<li><span class="pr-key">${L[i]}</span><span>${o.html}</span></li>`).join('')}</ol>`,
    error: (q) =>
      `${q.work ? `<div class="student-work pr-work"><span class="work-label">Student's work</span><div class="work-body">${q.work}</div></div>` : ''}<ol class="pr-opts">${q.options.map((o, i) => `<li><span class="pr-key">${L[i]}</span><span>${o.html}</span></li>`).join('')}</ol>${q.fix ? `<p class="pr-ans">${esc(strip(q.fix.label))} ${line(100)}</p>` : ''}`,
    cr: (q) =>
      `<p class="pr-note">Sentence starters: ${q.starters.map(esc).join(' · ')}</p><div class="pr-lines"><div></div><div></div><div></div></div><p><b>${esc(q.check.prompt)}</b></p><ol class="pr-opts">${q.check.options.map((o, i) => `<li><span class="pr-key">${L[i]}</span><span>${o.html}</span></li>`).join('')}</ol>`,
    nl: (q) =>
      `<div class="pr-viz">${V.numberLine({ min: q.min, max: q.max, step: q.step, labelEvery: q.labelEvery })}</div><p class="pr-note">Mark and label ${q.count} point${q.count > 1 ? 's' : ''} on the number line.</p>`,
    ineq: (q) =>
      `<div class="pr-viz">${V.numberLine({ min: q.min, max: q.max, step: q.step, labelEvery: q.labelEvery })}</div><p class="pr-note">Graph the inequality on the number line. Use an open or closed circle and shade the solutions.</p>`,
    shade: (q) => `<div class="pr-viz">${V.grid100({ shaded: 0, cells: q.cells || 100 })}</div><p class="pr-note">Shade the grid to show the amount.</p>`,
  };
  S.who = S.mc;
  S.rep = S.mc;

  // ---------- Answer key text per type ----------
  const K = {
    mc: (q) => L[q.answer],
    who: (q) => L[q.answer],
    rep: (q) => L[q.answer],
    ms: (q) => q.answers.map((i) => L[i]).join(', '),
    num: (q) => `${fmtN(q.answer)}${q.unit ? ' ' + esc(q.unit) : ''}`,
    blanks: (q) =>
      q.layout === 'fraction'
        ? `${fmtN(q.fields[0].answer)}/${fmtN(q.fields[1].answer)}`
        : q.fields.map((f, i) => `${f.label ? esc(strip(f.label)) + ' = ' : i + 1 + ') '}${fmtN(f.answer)}${f.suffix ? ' ' + esc(f.suffix) : ''}`).join('; '),
    cloze: (q) => q.answers.map((a, i) => esc(q.choices[i][a])).join(', '),
    table: (q) => q.inputs.map((i) => `${i.id}: ${fmtN(i.answer)}`).join('; '),
    match: (q) => q.pairs.map(([l, r]) => `${l + 1} → ${L[r]}`).join(', '),
    sort: (q) =>
      q.bins
        .map(
          (b, bi) =>
            `<b>${esc(b)}:</b> ${q.items
              .map((it, i) => (it.bin === bi ? i + 1 : null))
              .filter((x) => x)
              .join(', ')}`,
        )
        .join(' · '),
    seq: (q) => q.order.map((idx) => strip(q.items[idx].html).trim().slice(0, 40)).join(' → '),
    plot: (q) => q.points.map((p) => `(${p[0]}, ${p[1]})`).join(', '),
    dnl: (q) => q.blanks.map((b) => fmtN(b.answer)).join(', '),
    tape: (q) => q.fields.map((f) => `${esc(f.label)} = ${fmtN(f.answer)}`).join('; '),
    tf: (q) => `${(q.labels || ['True', 'False'])[q.answer ? 0 : 1]}, reason ${L[q.reasons.findIndex((x) => x.correct)]}`,
    error: (q) => `${L[q.answer]}${q.fix ? `; ${esc(strip(q.fix.label))} ${fmtN(q.fix.answer)}` : ''}`,
    cr: (q) => `Check: ${L[q.check.answer]}. Sample: ${q.solution}`,
    nl: (q) => q.points.map(fmtN).join(', '),
    ineq: (q) => `${q.open ? 'Open' : 'Closed'} circle at ${fmtN(q.point)}, shaded to the ${q.dir}`,
    shade: (q) => `${q.count} of ${q.cells || 100} squares`,
  };

  /** Generate the question list for a spec: { unit, zones:[ids], count, seed } */
  function build(spec) {
    const p = A().use(spec.unit);
    const zones = p.ZONES.filter((z) => spec.zones.includes(z.id));
    const gens = [];
    zones.forEach((z) => z.missions.forEach((m) => m.gens.forEach((g) => gens.push(Array.isArray(g) ? g : [g, {}]))));
    const r = RX.R.make(spec.seed);
    const order = r.shuffle(gens);
    const out = [];
    for (let i = 0; i < spec.count && order.length; i++) {
      const [g, o] = order[i % order.length];
      out.push(RX.G.make(g, r, Object.assign({}, o, spec.hard ? { hard: true } : {})));
    }
    return { pack: p, zones, questions: out };
  }

  function render(spec) {
    const { pack: p, zones, questions } = build(spec);
    const title = spec.title || `${p.UNIT.brand} — ${zones.length === 1 ? `Lesson ${zones[0].lesson}: ${zones[0].lessonName}` : zones.map((z) => z.lesson).join(', ')}`;
    const header = `<header class="pr-head"><div><p class="pr-eyebrow">Reveal Math Grade 6 · ${esc(p.UNIT.unitLabel)}</p><h1>${esc(title)}</h1><p class="pr-sub">${esc(spec.kind || 'Practice')} · ${questions.length} questions · Quiz code ${spec.seed}</p></div><div class="pr-name">Name ${line(220)}<br>Date ${line(120)} &nbsp; Period ${line(50)}</div></header>`;
    const body = questions
      .map(
        (q, i) =>
          `<section class="pr-q"><div class="pr-qhead"><span class="pr-num">${i + 1}</span><span class="pr-skill">${esc(p.SKILLS[q.skill] ? p.SKILLS[q.skill].label : q.skill)}</span></div><div class="pr-prompt">${q.prompt}</div>${hintBox(q, spec.hintMode)}<div class="pr-body">${(S[q.type] || (() => ''))(q)}</div></section>`,
      )
      .join('');
    const key = `<section class="pr-key-page"><header class="pr-head"><div><p class="pr-eyebrow">Answer key</p><h1>${esc(title)}</h1><p class="pr-sub">Quiz code ${spec.seed} · regenerate this exact quiz by entering the code</p></div></header><ol class="pr-keys">${questions.map((q) => `<li><div class="pr-key-ans">${(K[q.type] || (() => '—'))(q)}</div><div class="pr-key-sol">${q.type === 'cr' ? '' : q.solution}</div></li>`).join('')}</ol></section>`;
    return `<article class="pr-doc">${spec.keyWords ? keyWordsPage(p, zones, title) : ''}${header}<div class="pr-body-all">${body}</div>${spec.noKey ? '' : key}</article>`;
  }
  function hintBox(q, mode) {
    if (!mode || mode === 'none' || !q.hints || !q.hints[0]) return '';
    return `<div class="pr-hint"><b>Hint:</b> ${q.hints[0]}${mode === 'both' && q.hintEs ? `<div class="pr-hint-es" lang="es"><b>Pista:</b> ${q.hintEs}</div>` : ''}</div>`;
  }
  /** A printable word-wall page: every key word for the chosen lessons, English and Spanish, with its picture. */
  function keyWordsPage(p, zones, title) {
    const ids = new Set(zones.flatMap((z) => String(z.lesson).split(/\s*\/\s*/)));
    const words = (p.VOCAB || []).filter((v) => (v.lessons || []).some((l) => ids.has(l)));
    if (!words.length) return '';
    return `<section class="pr-kw-page"><header class="pr-head"><div><p class="pr-eyebrow">Key words · Palabras clave</p><h1>${esc(title)}</h1><p class="pr-sub">Read each word before the questions.</p></div></header><div class="pr-kw-grid">${words.map((v) => `<div class="pr-kw"><div class="pr-kw-t"><b>${esc(v.term)}</b>${v.es ? `<span lang="es">${esc(v.es)}</span>` : ''}</div><p>${v.def}</p>${v.esDef ? `<p class="pr-kw-es" lang="es">${esc(v.esDef)}</p>` : ''}${v.visual ? `<div class="pr-kw-v">${v.visual()}</div>` : ''}</div>`).join('')}</div></section>`;
  }

  // ---------- View ----------
  function view() {
    const ks = A().keys();
    const main = document.getElementById('atlas');
    const sel = (k) => A().pack(k);
    const zoneBoxes = (k) =>
      sel(k)
        .ZONES.filter((z) => !z.final && !z.optional)
        .map((z) => `<label class="pr-zone"><input type="checkbox" name="zone" value="${z.id}" checked> <span><b>${esc(z.lesson)}</b> ${esc(z.lessonName)}</span></label>`)
        .join('');
    main.innerHTML = `<section class="at-page pr-page"><p class="eyebrow">${icon('print')} Quiz Printer</p><h1>Build a quiz or exit ticket</h1>
      <p class="lede">Choose a unit and the lessons to draw from. Each quiz has a <b>code</b>: the same code always rebuilds the same quiz, so you can hand out matching copies or make a second version by changing the code.</p>
      <form class="pr-form" id="pr-form">
        <div class="pr-row"><label>Unit <select id="pr-unit">${ks.map((k) => `<option value="${k}">Unit ${sel(k).UNIT.unit} · ${esc(sel(k).UNIT.brand)}</option>`).join('')}</select></label>
          <label>Questions <input type="number" id="pr-count" min="3" max="30" value="8"></label>
          <label>Quiz code <input type="number" id="pr-seed" min="1" max="999999" value="${Math.floor(1000 + Math.random() * 9000)}"></label>
          <label>Type <select id="pr-kind"><option>Exit Ticket</option><option>Warm-Up</option><option>Practice</option><option>Quiz</option><option>Unit Review</option></select></label>
          <label>Level <select id="pr-level"><option value="1">Level 0–1 · standard questions</option><option value="2">Level 2 · Enrichment versions</option></select></label>
          <label>Printed hint <select id="pr-hintmode"><option value="none">No hint</option><option value="en">Hint 1 under each question</option><option value="both">Hint 1 in English and Spanish</option></select></label>
          <label class="pr-check"><input type="checkbox" id="pr-kw"> Key Words page first (English + Spanish)</label>
          <label class="pr-check"><input type="checkbox" id="pr-nokey"> No answer key</label></div>
        <div class="pr-row"><span class="pr-k">Lessons</span><div class="pr-zones" id="pr-zones">${zoneBoxes(ks[0])}</div><div class="pr-zone-tools"><button type="button" class="btn btn-ghost btn-sm" id="pr-all">All</button><button type="button" class="btn btn-ghost btn-sm" id="pr-none">None</button></div></div>
        <div class="pr-row pr-actions"><button type="submit" class="btn btn-primary">${icon('arrow')} Build quiz</button><button type="button" class="btn btn-ghost" id="pr-print" disabled>${icon('print')} Print</button><span class="muted" id="pr-hint">Build first, then print or save as PDF from the print dialog.</span></div>
      </form>
      <div id="pr-out" class="pr-out"></div></section>`;
    const unitSel = document.getElementById('pr-unit'),
      zonesEl = document.getElementById('pr-zones');
    unitSel.addEventListener('change', () => {
      zonesEl.innerHTML = zoneBoxes(unitSel.value);
    });
    document.getElementById('pr-all').addEventListener('click', () => zonesEl.querySelectorAll('input').forEach((c) => (c.checked = true)));
    document.getElementById('pr-none').addEventListener('click', () => zonesEl.querySelectorAll('input').forEach((c) => (c.checked = false)));
    document.getElementById('pr-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const zones = Array.from(zonesEl.querySelectorAll('input:checked')).map((c) => c.value);
      if (!zones.length) {
        RX.UI.toast('Pick at least one lesson.', 'warn');
        return;
      }
      const spec = {
        unit: unitSel.value,
        zones,
        count: Math.max(3, Math.min(30, Number(document.getElementById('pr-count').value) || 8)),
        seed: Number(document.getElementById('pr-seed').value) || 1,
        kind: document.getElementById('pr-kind').value,
        hard: document.getElementById('pr-level').value === '2',
        hintMode: document.getElementById('pr-hintmode').value,
        keyWords: document.getElementById('pr-kw').checked,
        noKey: document.getElementById('pr-nokey').checked,
      };
      const out = document.getElementById('pr-out');
      out.innerHTML = '<p class="muted">Building the quiz…</p>';
      A()
        .loadPacks([spec.unit])
        .then(() => {
          out.innerHTML = render(spec);
          document.getElementById('pr-print').disabled = false;
          out.scrollIntoView({ behavior: 'smooth' });
        })
        .catch((err) => {
          out.innerHTML = '';
          RX.UI.toast('Could not build that quiz: ' + err.message, 'warn');
        });
    });
    document.getElementById('pr-print').addEventListener('click', () => root.print());
  }

  RX.Printer = { view, build, render, S, K };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

/* Class Snapshot — the teacher pastes students' copied reports; the page decodes their teacher codes and shows a class
   skill table per unit plus suggested small groups. Nothing leaves the browser. */
(function (root) {
  'use strict';
  const RX = root.RX;
  const { esc, icon } = RX;
  const A = () => RX.Atlas;
  const KEY = 'rx-snapshot-draft-v1';

  const band = (seen, first) => (!seen ? null : first / seen >= 0.8 ? 'Strong' : first / seen >= 0.5 ? 'Almost There' : 'Practice Again');
  const bandCls = (b) => (b ? 'band-' + b.replace(/\s/g, '').toLowerCase() : 'band-none');

  /** Keep one code per student per unit: the one with the most answered questions (ties: the newest). */
  function dedupe(codes) {
    const by = {};
    codes.forEach((c) => {
      const k = (c.n || '(no name)').toLowerCase() + '|' + c.u;
      const prev = by[k];
      if (!prev || c.a > prev.a || (c.a === prev.a && c.d > prev.d)) by[k] = c;
    });
    return Object.values(by);
  }

  function unitSection(unitKey, rows) {
    const pack = A().pack(unitKey);
    if (!pack) return `<section class="snap-unit"><h3>Unknown unit ${esc(unitKey)}</h3></section>`;
    const skills = Object.keys(pack.SKILLS);
    const students = rows.slice().sort((a, b) => (a.n || '').localeCompare(b.n || ''));
    const head = `<tr><th scope="col">Student</th><th scope="col">Level</th><th scope="col">First try</th>${skills.map((id) => `<th scope="col" class="snap-skill" title="${esc(pack.SKILLS[id].label)}"><span>${esc(pack.SKILLS[id].lesson)}</span>${esc(pack.SKILLS[id].label)}</th>`).join('')}</tr>`;
    const body = students
      .map((c) => {
        const acc = c.a ? Math.round((100 * c.f) / c.a) : 0;
        return `<tr><th scope="row">${esc(c.n || '(no name)')}<small>${esc(c.d)}</small></th><td>${c.l}</td><td class="num">${c.a ? acc + '%' : '—'}</td>${skills
          .map((id) => {
            const v = c.k[id];
            const b = v ? band(v[0], v[1]) : null;
            return `<td class="snap-cell ${bandCls(b)}" title="${esc(pack.SKILLS[id].label)}: ${b || 'not yet seen'}${v ? ` (${v[1]}/${v[0]} first try)` : ''}">${v ? `${v[1]}/${v[0]}` : ''}</td>`;
          })
          .join('')}</tr>`;
      })
      .join('');
    // suggested groups: skills where 2+ students are below Strong (seen at least twice)
    const groups = skills
      .map((id) => {
        const need = students.filter((c) => {
          const v = c.k[id];
          return v && v[0] >= 2 && v[1] / v[0] < 0.8;
        });
        return { id, need, worst: need.filter((c) => c.k[id][1] / c.k[id][0] < 0.5).length };
      })
      .filter((g) => g.need.length >= 2)
      .sort((a, b) => b.worst - a.worst || b.need.length - a.need.length);
    const groupHtml = groups.length
      ? `<div class="snap-groups"><h4>${icon('help')} Suggested small groups</h4>${groups
          .slice(0, 6)
          .map(
            (g) =>
              `<div class="snap-group"><b>${esc(pack.SKILLS[g.id].label)}</b> <span class="muted">Lesson ${esc(pack.SKILLS[g.id].lesson)}</span><div>${g.need.map((c) => `<span class="snap-chip ${bandCls(band(c.k[g.id][0], c.k[g.id][1]))}">${esc(c.n || '(no name)')}</span>`).join('')}</div></div>`,
          )
          .join('')}</div>`
      : '<p class="muted">No skill has two or more students below Strong yet.</p>';
    return `<section class="snap-unit" style="--accent:${pack.UNIT.accent || '#1FA6A2'}"><div class="snap-unit-head"><h3>Unit ${pack.UNIT.unit} · ${esc(pack.UNIT.brand)}</h3><span class="muted">${students.length} student${students.length === 1 ? '' : 's'}</span></div><div class="snap-scroll"><table class="snap-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>${groupHtml}</section>`;
  }

  function groupsText(codes) {
    const lines = ['Suggested small groups — ' + new Date().toLocaleDateString(), ''];
    const byUnit = {};
    codes.forEach((c) => (byUnit[c.u] = byUnit[c.u] || []).push(c));
    Object.keys(byUnit)
      .sort()
      .forEach((u) => {
        const pack = A().pack(u);
        if (!pack) return;
        lines.push(`Unit ${pack.UNIT.unit} · ${pack.UNIT.brand}`);
        Object.keys(pack.SKILLS).forEach((id) => {
          const need = byUnit[u].filter((c) => {
            const v = c.k[id];
            return v && v[0] >= 2 && v[1] / v[0] < 0.8;
          });
          if (need.length >= 2) lines.push(`  ${pack.SKILLS[id].label} (Lesson ${pack.SKILLS[id].lesson}): ${need.map((c) => c.n || '(no name)').join(', ')}`);
        });
        lines.push('');
      });
    return lines.join('\n');
  }

  function render(text) {
    const out = document.getElementById('snap-out');
    const { codes, bad } = RX.Support.decodeAll(text);
    if (!codes.length) {
      out.innerHTML = `<p class="snap-empty">${bad ? `${bad} code${bad === 1 ? ' was' : 's were'} damaged. Ask the student to copy the report again.` : 'No teacher codes found yet. Each copied report ends with a line that starts with "Teacher code: RX1."'}</p>`;
      return;
    }
    const list = dedupe(codes);
    const byUnit = {};
    list.forEach((c) => (byUnit[c.u] = byUnit[c.u] || []).push(c));
    const names = new Set(list.map((c) => (c.n || '').toLowerCase()));
    out.innerHTML = `<div class="snap-sum"><div class="stat"><b>${names.size}</b><span>students</span></div><div class="stat"><b>${Object.keys(byUnit).length}</b><span>units</span></div><div class="stat"><b>${list.length}</b><span>reports</span></div>${bad ? `<div class="stat"><b>${bad}</b><span>damaged codes skipped</span></div>` : ''}<button type="button" class="btn btn-ghost" id="snap-copy">${icon('ref')} Copy small groups</button></div>
      <p class="snap-legend"><span class="snap-chip band-strong">Strong 80%+</span><span class="snap-chip band-almostthere">Almost There 50–79%</span><span class="snap-chip band-practiceagain">Practice Again &lt;50%</span> Cells show first-try correct / questions seen.</p>
      ${Object.keys(byUnit)
        .sort()
        .map((u) => unitSection(u, byUnit[u]))
        .join('')}`;
    document.getElementById('snap-copy').addEventListener('click', async () => {
      const t = groupsText(list);
      try {
        await navigator.clipboard.writeText(t);
        RX.UI.toast('Small groups copied.', 'ok');
      } catch (e) {
        RX.UI.modal({ title: 'Small groups', body: `<pre class="report-pre">${esc(t)}</pre>` });
      }
    });
  }

  /** Three made-up reports so the page can show what it does before real ones are pasted. */
  function sampleText() {
    const mk = (n, l, x, a, f, k) => RX.Support.encodeProgress({ v: 1, u: 'u3', n, d: '2026-10-01', l, x, a, f, z: 3, k });
    return [
      'Example only — three made-up students:',
      'Teacher code: ' + mk('Example A', 1, 420, 30, 24, { 'ratio-language': [6, 6], 'unit-rate': [6, 5], tables: [4, 2], graphs: [4, 1] }),
      'Teacher code: ' + mk('Example B', 0, 260, 26, 12, { 'ratio-language': [6, 4], 'unit-rate': [6, 2], tables: [4, 1], graphs: [3, 1] }),
      'Teacher code: ' + mk('Example C', 2, 610, 34, 30, { 'ratio-language': [6, 6], 'unit-rate': [6, 6], tables: [4, 3], graphs: [4, 2] }),
    ].join('\n');
  }

  function view() {
    let draft = '';
    try {
      draft = root.localStorage.getItem(KEY) || '';
    } catch (e) {
      /* storage blocked */
    }
    document.getElementById('atlas').innerHTML = `<section class="at-page"><p class="eyebrow">${icon('chart')} Class Snapshot</p><h1>See the whole class at once</h1>
      <p class="lede">Students press <b>Copy report for my teacher</b> on any Mission Report and paste it into Canvas, a form, or an email. Paste as many reports as you like below, all at once. The page reads the teacher code at the end of each report and builds a skill table for each unit, with suggested small groups. Nothing leaves this browser.</p>
      <label class="fld snap-fld" for="snap-in"><span class="fld-label">Paste reports</span><textarea id="snap-in" rows="7" placeholder="Paste copied reports here…">${esc(draft)}</textarea></label>
      <div class="snap-actions"><button type="button" class="btn btn-primary" id="snap-go">${icon('arrow')} Build snapshot</button><button type="button" class="btn btn-ghost" id="snap-sample">Try with example reports</button><button type="button" class="btn btn-ghost" id="snap-clear">Clear</button></div>
      <div id="snap-out" class="snap-out"></div></section>`;
    const ta = document.getElementById('snap-in');
    const save = () => {
      try {
        root.localStorage.setItem(KEY, ta.value);
      } catch (e) {
        /* storage blocked */
      }
    };
    document.getElementById('snap-go').addEventListener('click', () => {
      save();
      render(ta.value);
    });
    document.getElementById('snap-sample').addEventListener('click', () => {
      ta.value = sampleText();
      render(ta.value);
    });
    document.getElementById('snap-clear').addEventListener('click', () => {
      ta.value = '';
      save();
      document.getElementById('snap-out').innerHTML = '';
    });
    if (draft) render(draft);
  }

  RX.Snapshot = { view, render, dedupe, groupsText, sampleText };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
    <script>
/* Expedition Atlas — boot. */
(function () {
  'use strict';
  document.addEventListener('DOMContentLoaded', function () {
    window.RX.Atlas.boot();
  });
})();

</script>
  </body>
</html>
