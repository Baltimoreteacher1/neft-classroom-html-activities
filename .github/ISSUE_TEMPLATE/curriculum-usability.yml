name: Curriculum usability pilot
description: Record an anonymous, aggregate teacher/student pilot result.
title: "[Curriculum pilot] YYYY-MM-DD"
labels:
  - usability
body:
  - type: markdown
    attributes:
      value: |
        Do not include names, IDs, grades, disability information, student work, recordings, or screenshots containing participants.
  - type: dropdown
    id: role
    attributes:
      label: Participant role
      options:
        - Student
        - Teacher
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Chromebook or laptop
        - Tablet
        - Phone
    validations:
      required: true
  - type: input
    id: completed
    attributes:
      label: Tasks completed
      description: Example: 3 of 3. Do not include participant details.
    validations:
      required: true
  - type: input
    id: help
    attributes:
      label: Tasks requiring facilitator help
      description: A number only.
    validations:
      required: true
  - type: input
    id: ease
    attributes:
      label: Median ease rating
      description: 1 (hard) through 5 (easy).
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: Anonymous usability pattern
      description: Describe navigation or comprehension patterns, not the person.
    validations:
      required: true
