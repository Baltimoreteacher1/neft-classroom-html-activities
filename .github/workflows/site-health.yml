name: Site Health
# Scheduled early-warning system for the unwatched stretches (summer/breaks).
# Runs the full read-only audit battery on a cadence + on demand. If anything
# regresses (broken links, missing lesson resources, save/resume drift, a
# clobbered curriculum hub), the run fails and GitHub emails the repo owner.
# This does NOT build, deploy, commit, or modify anything.
on:
  schedule:
    # Mondays 11:00 UTC (~7am ET) — weekly heartbeat.
    - cron: "0 11 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # `npm run validate` includes sweeps that shell out to ripgrep, which the
      # ubuntu-24.04 runner image no longer ships. See predeploy-verify.yml.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # validate:notebook-render launches Playwright. This job never installed a
      # browser (its playwright install lives in a different job), so that check
      # could only ever fail here. See predeploy-verify.yml.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate (static + reveal-math + hub lock)
        run: npm run validate
      - name: Internal link audit
        run: npm run audit:links
      - name: Curriculum structural audit
        run: npm run audit
      - name: Curriculum resource completeness
        run: npm run audit:curriculum
      - name: Save/Resume integration audit
        run: node tools/audit-save-resume-integration.js

  lesson-visuals:
    # Renders lessons in a real browser and asserts every interactive visual
    # actually drew something. Source gates cannot see this: mountInteractiveVisuals
    # flags a host BEFORE running its factory and swallows the throw, so a dead
    # manipulative still parses, still lints, and still serves 200. Weekly rather
    # than per-push because it drives ~220 lessons through 8 phases each.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the built site
        run: npx vite preview --port 4499 &
      - name: Wait for the preview server
        run: |
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:4499/ && exit 0
            sleep 1
          done
          echo "preview server never came up on :4499" >&2
          exit 1
      - name: Interactive visuals render
        run: npm run validate:lesson-visuals -- --concurrency 4

  visual-drift:
    # WEEKLY SCREENSHOT DIFF of the canonical lesson surfaces (lesson 2-7).
    #
    # Every other check in this repo asks a question somebody already knew to
    # ask. This one asks only "does it still look like it looked", which is the
    # one form of coverage that needs no theory of what will break next — and
    # the class of failure whose current detection mechanism is Joel opening the
    # lesson in front of a class.
    #
    # REPORT, NOT GATE, and `continue-on-error` says so in the one place that
    # decides: a pixel diff cannot tell a broken layout from an intended
    # redesign, and a weekly red X for "the deck was restyled on purpose" is how
    # a check stops being read. The report is uploaded either way; drift pages a
    # human through the artifact, it does not fail the run.
    #
    # Blessing a new baseline is a human judgement (it declares the current
    # appearance CORRECT), so nothing here regenerates it — same posture as
    # refresh-visual-baseline.yml. Run `npm run visual:baseline:update` and
    # review the images in the PR.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Capture and diff the canonical lesson surfaces
        continue-on-error: true
        run: npm run visual:baseline
      - name: Upload the drift report and side-by-side images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-drift
          path: |
            reports/visual-drift.md
            reports/visual-diff/
          if-no-files-found: warn
          retention-days: 30

  live-smoke:
    # Checks the DEPLOYED site (catches a broken Cloudflare deploy that source
    # audits would miss). Runs independently of the source-audit job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # scripts/smoke-live.mjs supersedes the former tools/smoke-live-site.mjs:
      # same status contracts, plus content markers, live-bundle parsing (the
      # game-fx truncation class of failure) and the build stamp. No deps, so
      # this job still needs no `npm ci`.
      - name: Live-site smoke test
        run: node scripts/smoke-live.mjs
