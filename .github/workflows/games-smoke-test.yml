name: Games smoke test

# Headless-browser smoke test for the Grade 6 math games. Uses the repo's
# Playwright harness (playwright.config.ts builds the site and serves dist/),
# boots each game in Chromium, and checks it renders a canvas with no uncaught
# errors or broken same-origin assets. Runs on PRs that touch the games and on
# demand. Informative — it does not gate the Cloudflare deploy (which builds
# from main independently).

on:
  pull_request:
    paths:
      - "math/**"
      - "games/vendor/**"
      - "assets/**"
      - "shared/save-resume/**"
      - "tests/games-smoke.spec.ts"
      - "playwright.config.ts"
      - ".github/workflows/games-smoke-test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, like the repo's other ten workflows. This was the last one left
          # on 20, and on 2026-08-15 that stopped being survivable: the build
          # this job's webServer runs reaches generate-download-manifest.mjs,
          # which imports jsdom, and the pinned jsdom (30.x) declares
          # `engines: node ^22.22.2 || ^24.15.0 || >=26` while its undici (8.x)
          # needs >=22.19. On Node 20 undici throws
          # `webidl.util.markAsUncloneable is not a function` at import time, so
          # the web server never starts and every browser check in this job is
          # reported as a failure of the pages rather than of the runtime.
          #
          # It went unnoticed because this workflow only runs on pull_request
          # and no PR had opened between jsdom entering the build path and now.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run games smoke test
        run: npx playwright test tests/games-smoke.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
