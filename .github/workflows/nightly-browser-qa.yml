name: Nightly Browser QA

# The pull-request gate intentionally exercises only the highest-risk journeys.
# This scheduled run covers every Playwright test with one worker, matching the
# resource-safe configuration used for release qualification.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-browser-qa
  cancel-in-progress: true

jobs:
  full-browser-suite:
    name: Full Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run every browser journey
        run: npm run e2e -- --workers=1
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: |
            playwright-report/
            playwright-results.json
            test-results/
          retention-days: 14
