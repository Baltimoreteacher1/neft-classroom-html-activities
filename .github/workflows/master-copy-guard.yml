name: master-copy-guard

# Protects the hand-maintained "master copy" of the curriculum hub.
# The live curriculum/index.html (dropdown + Teacher Tools + Google Slides links +
# /teacher-tools/post-forms Forms links) is the SOURCE OF TRUTH. A `generate-curriculum
# --force` regen has repeatedly STRIPPED it back to a ~999-line no-dropdown page and
# re-introduced the retired Vercel Forms launcher. This job turns either regression
# into a red build so the master copy can only be ADDED to, never clobbered.

# Scoped to the ONE file this job inspects. It only greps curriculum/index.html,
# but it used to run on every push to main — and with the frequent auto-commit
# automation only ~54 of 482 commits in a sample window actually touched that
# file. Since GitHub bills each job rounded up to a full minute, ~89% of these
# runs were a paid minute spent re-checking a file that had not changed.
on:
  push:
    branches: [main]
    paths: ["curriculum/index.html", "assets/curriculum-hub*.js", "assets/curriculum-hub.css"]
  pull_request:
    branches: [main]
    paths: ["curriculum/index.html", "assets/curriculum-hub*.js", "assets/curriculum-hub.css"]

# Cancel a superseded run when the frequent auto-commit automation pushes again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  master-copy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard the curriculum master copy
        run: |
          f=curriculum/index.html
          fail=0

          # The hub's three biggest inline <script> blocks were extracted to
          # /assets/curriculum-hub-*.js so they could be linted, cached and
          # tested. They are still the same shipped page, so BEHAVIOURAL
          # landmarks below are matched against the hub PLUS those assets,
          # while STRUCTURAL landmarks (cards, links, panels) stay matched
          # against the HTML alone.
          #
          # This is what broke on 2026-07-31: the dropdown is BUILT by the
          # extracted search script, so grepping only the HTML reported it
          # missing on a page that renders it correctly.
          behaviour=$(mktemp)
          cat "$f" assets/curriculum-hub-search.js assets/curriculum-hub-pacing.js \
              assets/curriculum-hub-options.js > "$behaviour"

          # Each extracted asset must exist AND still be referenced by the hub,
          # so "the code is somewhere" cannot satisfy this guard while the page
          # has stopped loading it.
          for asset in curriculum-hub-search.js curriculum-hub-pacing.js curriculum-hub-options.js curriculum-hub.css; do
            if [ ! -f "assets/$asset" ]; then
              echo "::error file=assets/$asset::Extracted hub asset is missing."
              fail=1
            elif ! grep -q "/assets/$asset?v=" "$f"; then
              echo "::error file=$f::Hub no longer loads /assets/$asset — the extracted asset is orphaned."
              fail=1
            fi
          done

          # 1) Retired Vercel Google-Forms launcher must never come back.
          if grep -q "eduwonderlab.vercel.app/google-forms" "$behaviour"; then
            echo "::error file=$f::Links to the retired Vercel Google-Forms launcher. Use /teacher-tools/post-forms/?lesson=ID."
            fail=1
          fi

          # 2) The activity dropdown must be present (generator --force strips it).
          if ! grep -q "select-control" "$behaviour"; then
            echo "::error file=$f::Missing the activity dropdown (select-control) — a generator regen likely stripped the hand-maintained hub."
            fail=1
          fi

          # 3) The Teacher Tools panel must be present.
          if ! grep -qi "Teacher Tools" "$f"; then
            echo "::error file=$f::Missing the Teacher Tools panel."
            fail=1
          fi

          # 4) Google Slides links must be present (added 2026-06-05).
          slides=$(grep -c ">Google Slides</a" "$f" || true)
          if [ "${slides:-0}" -lt 1 ]; then
            echo "::error file=$f::No Google Slides links found — the slides wiring was lost."
            fail=1
          fi

          # 5) Size tripwire: the stripped generator output is ~999 lines. The
          # healthy master was ~13,900 until the inline script/style extraction
          # of 2026-07-31 moved ~250 KB into /assets/curriculum-hub-*, leaving
          # ~9,000. The floor stays at 3,000: far above the stripped version,
          # far below anything healthy.
          lines=$(wc -l < "$f")
          if [ "$lines" -lt 3000 ]; then
            echo "::error file=$f::Only $lines lines — this looks like the stripped no-dropdown version (healthy master is ~9,000)."
            fail=1
          fi

          if [ "$fail" -eq 1 ]; then
            echo ""
            echo "Master-copy guard FAILED. The curriculum hub is hand-maintained: ADD to it, do not"
            echo "regenerate it. Never run 'npm run generate-curriculum -- --force'. See MASTER_COPY.md."
            exit 1
          fi
          echo "Master-copy guard passed: $lines lines, $slides slides, dropdown + Teacher Tools present, no Vercel Forms."
