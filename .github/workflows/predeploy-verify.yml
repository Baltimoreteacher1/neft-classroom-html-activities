name: Pre-Deploy Gate

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT GATE
#
# Production deploys are performed by Cloudflare Pages' Git integration: when a
# commit lands on `main`, Cloudflare builds (`npm run build`) and promotes it.
# GitHub Actions does NOT run the deploy itself (doing so would race Cloudflare
# and has historically reverted production — see CLAUDE.md). Instead, this
# workflow GATES what is allowed to reach `main`, in strict order:
#
#   1. validate-and-build — dependency audit, Biome, unit tests, repository
#      validation, production build, and focused real-browser journeys
#   2. claude-predeploy-verify — read-only Claude deploy-readiness review
#
# Claude `needs` the validate-and-build job, so the strict order between the two
# holds — but since 2026-08-30 it runs even when that job went RED, because the
# ordering was doing double duty as a filter and the filter had a hole. See the
# comment on `claude-predeploy-verify` below. The gate only goes green if every
# stage passes. Kept to two jobs on purpose — GitHub bills each job rounded up to
# a whole minute, so extra jobs cost real allowance.
#
# Inside validate-and-build the steps deliberately do NOT abort each other. They
# used to: a failing step skipped everything after it, so one run reported one
# problem and you learned about the next only after fixing the first. That went
# badly wrong when the dependency audit sat at the front of the chain — it
# failed on advisories against an unchanged lockfile and skipped Biome, the
# tests, validation, the build and the browser journeys, for as long as the
# advisories stood. The gate looked like it was gating and was checking nothing.
#
# So the independent checks each carry `if: !cancelled()` and all report in one
# run. Two things are still hard gates, because past them the rest is noise:
#   - `npm ci`, since nothing can run without node_modules;
#   - the Vite build, for the browser journeys only — with no dist/ there is
#     nothing to serve, and the chain would cascade-fail for a reason already
#     reported one line above.
# Every failure still fails the job. This buys information, not leniency; the
# cost is that a broken run does more work than it used to before going red.
#
# Wire these as REQUIRED
# status checks on `main` (branch protection) so a failing gate blocks the merge
# that would otherwise trigger the Cloudflare deploy. Deployment therefore runs
# last, and only when every prior check passes.
#
# This workflow never deploys, never runs wrangler, and never edits files.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  # Push to main IS a trigger, since 2026-08-30.
  #
  # It used to be excluded, on the reasoning that "the pre-push hook runs this
  # same QA loop locally before every push, and Cloudflare rebuilds on deploy".
  # The second half holds. The first half does not, in exactly the place it
  # matters most: the local loop SKIPS the real-browser journeys whenever
  # Chromium is not installed, and says so rather than failing —
  #
  #   SKIPPED: Chromium could not be launched — nothing was verified by this check.
  #
  # — so a contributor without browsers pushes a green-looking loop that checked
  # none of the browser contracts. The hooks are also only wired by `npm ci`
  # (the `prepare` script sets core.hooksPath), and .githooks/pre-commit records
  # that they "had never been wired, so nobody had paid it".
  #
  # The result was not hypothetical. `main` carried TEN failing browser journeys
  # — six stale specs and one real defect that stopped a teacher from starting
  # a small-group presentation — and nothing reported it, because this gate only
  # ever ran on pull requests and Cloudflare's own build does not run it. The
  # branch that actually ships was the one branch never checked.
  #
  # This costs a run per push to main. That is the price of the deploying branch
  # telling the truth about itself, and it is far below the cost of finding out
  # from a classroom.
  push:
    branches: [main]
  workflow_dispatch:

# Default to read-only for the whole workflow; individual jobs widen only as needed.
permissions:
  contents: read

concurrency:
  group: predeploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stages 1+2: validation then build, in ONE job ───────────────────────────
  # These were two jobs, each repeating checkout + setup-node + `npm ci`. GitHub
  # bills every job rounded up to a full minute, so the split cost a guaranteed
  # extra minute per run (plus a second dependency install) to buy nothing:
  # steps within a job already run in order, and a failing step aborts the job,
  # so "build only runs if validate passed" still holds exactly as before.
  validate-and-build:
    name: Required quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # HARD GATE. Nothing below can mean anything without node_modules, so this
      # one is deliberately still allowed to abort the rest.
      - name: Install dependencies
        id: install
        run: npm ci

      # Several repo sweeps shell out to ripgrep (validate:self-hosted-fonts,
      # validate:level-labels, audit:dead-code, self-host-fonts). The runner
      # image used to ship `rg`; ubuntu-latest moved to 24.04 and no longer
      # does, so every one of them died with a bare `spawnSync rg ENOENT` and
      # took the whole required gate red — on every PR, for a reason that had
      # nothing to do with the PR. Install it explicitly rather than depending
      # on what the image happens to include.
      - name: Install ripgrep
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # ── Independent checks — each reports even if an earlier one failed ──────
      # `steps.install.outcome` guards them all: !cancelled() alone would run
      # them with no node_modules and bury the real error under module-not-found.
      - name: Biome check
        id: biome
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check
      - name: Unit and contract tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      # BEFORE validation, not after it. `npm run validate` includes
      # validate:notebook-render, which launches Playwright — with the install
      # sitting further down (it was gated on the build), that check died with
      # "Executable doesn't exist" and took the whole required gate red. The
      # browser journeys below need the same browser, so this is the same
      # install moved earlier, not an extra one.
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: Static + reveal-math + hub-lock validation
        id: validate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run validate
      - name: Vite production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # ── Browser journeys — gated on the build, not on the checks above ───────
      # With no dist/ there is nothing to serve, so this chain would cascade-fail
      # for a reason already reported one line up. That is noise, not a finding.
      - name: Serve the verified production build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx vite preview --host 127.0.0.1 --port 4178 --strictPort &
      - name: Wait for preview
        id: preview
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:4178/ && exit 0
            sleep 1
          done
          echo "preview server never came up on :4178" >&2
          exit 1
      - name: Focused browser journeys
        id: journeys
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4178
        run: npm run e2e:pr

      # Runs last on purpose. It used to run FIRST, and when new advisories
      # landed against an unchanged lockfile it failed in ~20s and skipped
      # everything below — so for as long as that lasted, no PR was getting
      # Biome, tests, validation, the build, or the browser journeys, and the
      # gate's red only ever meant "a dependency has an advisory".
      #
      # Still fails the job: not a downgrade to a warning. It just no longer
      # decides whether the functional checks are allowed to run.
      # Was `npm audit --audit-level=high`, which is binary. Two image-size
      # advisories have NO fixed version — the whole published range is affected
      # and npm's "fix" is a three-major downgrade of pptxgenjs — so that form
      # could not go green by any action available, and a required check that
      # cannot pass stops being read.
      #
      # tools/audit-allowlist.mjs still fails on everything not written down.
      # Accepted advisories carry a reason and a reviewBy date, and the run fails
      # if a real fix appears, if the date passes, or if an entry goes stale.
      - name: Dependency audit (high severity)
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run audit:deps

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: predeploy-playwright-report
          path: playwright-report/
          retention-days: 7

      # One table beats reading seven collapsed step logs to find which failed.
      - name: Gate summary
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: |
            Biome check|${{ steps.biome.outcome }}
            Unit and contract tests|${{ steps.tests.outcome }}
            Repository validation|${{ steps.validate.outcome }}
            Vite production build|${{ steps.build.outcome }}
            Browser journeys|${{ steps.journeys.outcome }}
            Dependency audit|${{ steps.audit.outcome }}
        run: |
          {
            echo "### Pre-deploy gate"
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            printf '%s\n' "$OUTCOMES" | while IFS='|' read -r name outcome; do
              [ -z "$name" ] && continue
              case "$outcome" in
                success) icon="✅ pass" ;;
                failure) icon="❌ fail" ;;
                skipped|"") icon="⏭️ skipped" ;;
                *) icon="$outcome" ;;
              esac
              echo "| $name | $icon |"
            done
            echo
            echo "Steps run independently, so this is every problem in the change, not just the first."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Stage 2: Claude deploy-readiness review (only after validate + build) ────
  # Deliberately still its own job: it needs `id-token: write` and
  # `pull-requests: read`, and folding it in would widen those onto the build
  # steps for no saving beyond the one minute already recovered above.
  claude-predeploy-verify:
    name: Claude pre-deploy verification
    needs: validate-and-build
    # claude-code-action only supports PR / comment contexts ("Unsupported event
    # type: push"), and PRs are where this gate blocks a merge to main anyway.
    # On direct pushes to main, validate-and-build still runs; this stage is skipped.
    #
    # `!cancelled()` since 2026-08-30. `needs:` alone also SKIPS this job whenever
    # validate-and-build goes red, and the reasoning for that — "a red PR cannot
    # merge anyway, so reviewing it is wasted minutes" — holds only while nobody
    # merges a red PR. On 2026-08-30 three were: #204 and #205 were merged with
    # the quality gate failing, and #200's earlier head sat in the same state.
    # Every one of them shows this job as "skipped", which reads like a pass in
    # the checks list and is not one. So the deploy-readiness review never
    # examined the changes on the one day it most needed to.
    #
    # The failure mode is specific: skipping is safe exactly until someone
    # overrides, and an override is when a second opinion is worth most. This
    # review is also independent of the build — answer keys, exposed teacher
    # surfaces and broken routes are readable in the diff whether or not
    # Playwright passed — so there is no ordering reason to withhold it.
    #
    # The cost is real and small: one extra billed job-minute per red PR.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # Read-only: Claude inspects the change but must not write, commit, or deploy.
    permissions:
      contents: read
      pull-requests: read
      id-token: write # required by claude-code-action (OIDC)
      actions: read # lets Claude read prior CI results for this ref
    steps:
      - name: Checkout (full history for diffing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude pre-deploy verification (read-only)
        id: predeploy
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Print the verifier's reasoning into the job log.
          #
          # Without this the action logs "full output hidden for security" and
          # leaves the execution JSON in the runner's _temp, which dies with the
          # runner — no artifact, nothing to read. A FAIL then reaches a human as
          # one line:
          #
          #   ::error::Claude pre-deploy verification returned FAIL
          #
          # and the enforce step below blocks the merge without anyone being able
          # to see what was objected to. A blocking gate whose objection cannot be
          # read cannot be answered: the only responses left are to override it
          # unread, or to guess at a reason and reshape the change to fit the
          # guess. Both look like diligence and neither is.
          #
          # That is not hypothetical. On PR #200 this gate returned FAIL after 15
          # turns with 5 denied tool calls, and its prompt ends with "if you are
          # uncertain whether something is safe, FAIL (fail closed)" — so an
          # inspection it could not finish and a defect it genuinely found emit
          # the identical line. #200 was merged on an owner decision with the
          # objection still unknown. That should not be the normal case.
          #
          # The tradeoff being reversed: job logs are readable by anyone with
          # Actions access. What becomes readable is a review of a diff already
          # in the PR, written by an agent holding read-only tools (no Edit or
          # Write, no wrangler, no deploy), with secret-typed env values redacted
          # by the action either way. If that is ever judged too much for this
          # repo, revert this line — but then also stop treating the gate as
          # something a contributor can act on.
          show_full_output: true
          additional_permissions: |
            actions: read
          # Deny-by-default tool allowlist: read/inspect only. No Edit/Write,
          # no wrangler, no deploy, no npm scripts that mutate or publish.
          claude_args: >-
            --max-turns 25
            --allowed-tools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(rg:*),Bash(find:*)"
            --disallowed-tools "Edit,Write,NotebookEdit,Bash(wrangler:*),Bash(npm run deploy:*),Bash(npm run build:*),Bash(git push:*),Bash(git commit:*)"
          prompt: |
            You are the PRE-DEPLOY VERIFIER for a public, student-facing classroom
            website (ESOL / Reading / Writing / Math). Cloudflare auto-deploys any
            commit that reaches `main`, so your job is the last human-readable gate
            before student-facing content goes live.

            HARD RULES (non-negotiable):
            - You are READ-ONLY. Do NOT edit, create, or delete any file.
            - Do NOT deploy. Do NOT run `npm run deploy`, `wrangler deploy`, or any
              publish/build/commit/push command.
            - Do NOT modify Cloudflare or any deployment settings.
            - Only inspect the change with read-only git/grep/read tools.

            WHAT TO INSPECT:
            - On a pull request: review the PR diff against its base branch
              (`git diff origin/${{ github.base_ref }}...HEAD`).
            - On a push to main: review the pushed commit(s) (`git show HEAD`,
              `git diff HEAD~1...HEAD` when a parent exists).

            BLOCK the deploy (decision FAIL) if the change introduces ANY of:
            - Answer-key / solution leaks exposed to students.
            - Teacher-only content exposed to students.
            - Hidden dashboard / admin / teacher controls exposed to students.
            - Student privacy risks (PII, tracking, unsafe data collection).
            - Broken routes or broken internal links.
            - Broken imports / references to missing assets or scripts.
            - Accessibility regressions (contrast, alt text, keyboard, font size).
            - Unclear or missing student-facing directions.
            - ESOL / SPED usability regressions (reading level, clarity, recovery).
            - Removal or weakening of any deploy guard (e.g. master-copy-guard,
              ALLOW_DEPLOY/env gating, validation/audit steps).
            - Cloudflare / deployment setting changes (_headers, _redirects,
              wrangler.toml, vite.config output, 404.html, deploy workflows).
            - Broad redesigns or page-structure changes not clearly requested.
            - Build or validation risks (Save/Resume wiring, shared asset paths).

            If you are uncertain whether something is safe, FAIL (fail closed).
            Do NOT approve if answer keys, secrets, or teacher-only content are
            exposed, if any deploy guard is removed/weakened, or if page structure
            changed without a clear reason.

            OUTPUT:
            1. A short summary of what the change does.
            2. A bullet list of every blocker found, or "No blockers found."
            3. As the VERY LAST line of your response, output exactly ONE of:
               CLAUDE_PREDEPLOY_DECISION: PASS
               CLAUDE_PREDEPLOY_DECISION: FAIL

      # Fail the gate (fail-closed) on FAIL, missing output, or no clear decision.
      - name: Enforce Claude pre-deploy decision
        env:
          EXEC_FILE: ${{ steps.predeploy.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ -z "${EXEC_FILE:-}" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::No Claude execution output found — failing closed (deployment blocked)."
            exit 1
          fi
          if grep -q "CLAUDE_PREDEPLOY_DECISION: FAIL" "$EXEC_FILE"; then
            echo "::error::Claude pre-deploy verification returned FAIL — deployment blocked."
            exit 1
          fi
          if ! grep -q "CLAUDE_PREDEPLOY_DECISION: PASS" "$EXEC_FILE"; then
            echo "::error::Claude did not emit a clear PASS decision — failing closed (deployment blocked)."
            exit 1
          fi
          echo "Claude pre-deploy verification: PASS — deploy-readiness gate satisfied."
