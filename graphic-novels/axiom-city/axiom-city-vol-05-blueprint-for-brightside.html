<script type="application/json" id="gn-vocab">[{"term":"Area of Parallelograms","termEs":"Área de paralelogramos","definition":"The space inside a parallelogram. Formula: A = b × h, using the perpendicular height.","definitionEs":"El espacio dentro de un paralelogramo. Fórmula: A = b × h, usando la altura perpendicular.","visual":"A = b × h; if b = 10 cm and h = 6 cm, A = 60 cm².","role":"concept","img":"/assets/vocab-images/area-of-parallelograms.svg","lesson":"5-1"},{"term":"Slanted side","termEs":"Lado inclinado","definition":"A side that leans instead of going straight up and down. It is not the perpendicular height.","definitionEs":"Un lado que está inclinado en vez de subir y bajar verticalmente. No es la altura perpendicular.","visual":"In a leaning parallelogram, use the dashed 90° height—not the slanted side—in A = b × h.","img":"/assets/vocab-images/slanted-side.svg","lesson":"5-1"},{"term":"Parallelogram","termEs":"Paralelogramo","definition":"A four-sided shape with two pairs of parallel sides.","definitionEs":"Una figura de cuatro lados con dos pares de lados paralelos.","visual":"Think of a leaning door — the top and bottom are parallel, and the two sides are parallel, like a slanted rectangle","img":"/assets/vocab-images/parallelogram.svg","lesson":"5-1"},{"term":"Parallel","termEs":"Paralelas","definition":"Two lines or sides that stay the same distance apart and never meet.","definitionEs":"Dos líneas o lados que se mantienen a la misma distancia y nunca se cruzan.","visual":"The top and bottom of a parallelogram never get closer together — matching arrowheads (›) mark one parallel pair, double arrowheads (››) mark the other.","img":"/assets/vocab-images/parallel.svg","lesson":"5-1"},{"term":"Base","termEs":"Base","definition":"Any side of a parallelogram can be the base. Once you pick a base, the height must be measured perpendicular (at a 90° angle) to it.","definitionEs":"Cualquier lado de un paralelogramo puede ser la base. Una vez que eliges la base, la altura debe medirse perpendicular (en un ángulo de 90°) a ella.","visual":"Any side can be the base: choose the 10 cm side and b = 10 cm, then draw the height at 90° to that side in A = b × h","img":"/assets/vocab-images/base-parallelogram.svg","lesson":"5-1"},{"term":"Height","termEs":"Altura","definition":"The straight-up distance from the base to the top.","definitionEs":"La distancia recta hacia arriba desde la base hasta la parte de arriba.","visual":"A dashed vertical line from the top side straight down to the base, forming a 90° angle — NOT the slanted side","img":"/assets/vocab-images/height-parallelogram.svg","lesson":"5-1"},{"term":"Perpendicular","termEs":"Perpendicular","definition":"Two lines that meet to make a square corner (90 degrees).","definitionEs":"Dos líneas que se cruzan formando una esquina cuadrada (90 grados).","visual":"The dashed height meets the base at a square corner — the small 90° box is what makes it perpendicular, not slanted.","img":"/assets/vocab-images/perpendicular.svg","lesson":"5-1"},{"term":"Area","termEs":"Área","definition":"How much space is inside a flat shape.","definitionEs":"Cuánto espacio hay dentro de una figura plana.","visual":"A 3 cm × 4 cm rectangle covers 12 square centimeters — imagine 12 tiny 1×1 squares inside it","img":"/assets/vocab-images/area.svg","lesson":"5-1"},{"term":"Composite figure","termEs":"Figura compuesta","definition":"A shape made by putting two or more simple shapes together.","definitionEs":"Una figura formada al juntar dos o más figuras simples.","visual":"An L-shaped room = a 10×8 rectangle joined to a 4×5 rectangle; total area = 80 + 20 = 100 sq ft","img":"/assets/vocab-images/composite-figure.svg","lesson":"5-1"},{"term":"Formula","termEs":"Fórmula","definition":"A math rule written with symbols.","definitionEs":"Una regla matemática escrita con símbolos.","visual":"A = b × h means Area equals base times height; for a parallelogram with b = 6 and h = 4, A = 24","img":"/assets/vocab-images/area-of-parallelograms.svg","lesson":"5-1"},{"term":"Rhombus","termEs":"Rombo","definition":"A parallelogram with four sides of the same length.","definitionEs":"Un paralelogramo con cuatro lados de la misma longitud.","visual":"All 4 sides equal, with two diagonals that cross at right angles.","img":"/assets/vocab-images/rhombus.svg","lesson":"5-1"},{"term":"Diagonal","termEs":"Diagonal","definition":"A segment that joins two corners that are not next to each other.","definitionEs":"Un segmento que une dos esquinas que no están una junto a la otra.","visual":"Corner to opposite corner.","img":"/assets/vocab-images/rhombus.svg","lesson":"5-1"},{"term":"Area of a Triangle","termEs":"Área de un triángulo","definition":"The space inside a triangle. A triangle is half of a rectangle with the same base and height, so A = ½ × b × h.","definitionEs":"El espacio dentro de un triángulo. Un triángulo es la mitad de un rectángulo con la misma base y altura, por eso A = ½ × b × h.","visual":"A = ½ × b × h; if b = 8 and h = 5, then A = ½ × 8 × 5 = 20 square units","role":"concept","img":"/assets/vocab-images/area-of-triangles.svg","lesson":"5-2"},{"term":"Substitute","termEs":"Sustituir","definition":"Put the numbers you know into a formula.","definitionEs":"Poner los números que conoces en una fórmula.","visual":"A = ½bh → 30 = ½ × b × 5","img":"/assets/vocab-images/substitute.svg","lesson":"5-2"},{"term":"Area of Trapezoids","termEs":"Área de trapecios","definition":"The space inside a trapezoid. Formula: A = 1/2(b₁ + b₂)h.","definitionEs":"El espacio dentro de un trapecio. Fórmula: A = 1/2(b₁ + b₂)h.","visual":"A = 1/2(b₁ + b₂)h","role":"concept","img":"/assets/vocab-images/area-of-trapezoids.svg","lesson":"5-3"},{"term":"Trapezoid","termEs":"Trapecio","definition":"A four-sided shape with just one pair of parallel sides.","definitionEs":"Una figura de cuatro lados con solo un par de lados paralelos.","visual":"A table top wider than the bottom shelf — the top and bottom edges are parallel, the two sides slant inward","img":"/assets/vocab-images/trapezoid.svg","lesson":"5-3"},{"term":"Base 1 (b1)","termEs":"Base 1 (b1)","definition":"One of the two parallel sides of a trapezoid.","definitionEs":"Uno de los dos lados paralelos de un trapecio.","visual":"If the bottom of the trapezoid is 10 ft, then b₁ = 10 ft in the formula A = ½(b₁ + b₂) × h","img":"/assets/vocab-images/base-1-trapezoid.svg","lesson":"5-3"},{"term":"Base 2 (b2)","termEs":"Base 2 (b2)","definition":"The other parallel side of a trapezoid.","definitionEs":"El otro lado paralelo de un trapecio.","visual":"If the top of the trapezoid is 6 ft, then b₂ = 6 ft; both bases are parallel to each other","img":"/assets/vocab-images/base-2-trapezoid.svg","lesson":"5-3"},{"term":"Decompose","termEs":"Descomponer","definition":"Break a figure into simpler shapes.","definitionEs":"Separar una figura en formas más simples.","visual":"A trapezoid = a rectangle + 2 triangles.","img":"/assets/vocab-images/decompose.svg","lesson":"5-3"},{"term":"Right trapezoid","termEs":"Trapecio rectángulo","definition":"A trapezoid with two square corners.","definitionEs":"Un trapecio con dos esquinas cuadradas.","visual":"One side stands straight up from the base.","img":"/assets/vocab-images/trapezoid.svg","lesson":"5-3"},{"term":"Area of Composite Figures","termEs":"Área de figuras compuestas","definition":"The total space inside a figure made of basic shapes. Formula: A = A₁ + A₂ — add the parts (or subtract a missing piece).","definitionEs":"El espacio total dentro de una figura formada por figuras básicas. Fórmula: A = A₁ + A₂ — suma las partes (o resta la pieza que falta).","visual":"Total area = area of rectangle 1 + area of rectangle 2.","role":"concept","img":"/assets/vocab-images/area-of-composite-figures.svg","lesson":"5-4"},{"term":"Add","termEs":"Sumar","definition":"Add up the areas of the smaller shapes to get the total.","definitionEs":"Sumar las áreas de las figuras pequeñas para obtener el total.","visual":"T-shaped hallway: top rectangle = 30 sq ft, bottom rectangle = 28 sq ft → total = 30 + 28 = 58 sq ft","img":"/assets/vocab-images/add.svg","lesson":"5-4"},{"term":"Subtract","termEs":"Restar","definition":"Take away the area of a missing piece from a bigger shape.","definitionEs":"Quitar el área de una parte que falta de una figura más grande.","visual":"A 14×10 pool with a 6×4 cutout: 140 − 24 = 116 sq ft of water surface","img":"/assets/vocab-images/subtract.svg","lesson":"5-4"},{"term":"Regular polygon","termEs":"Polígono regular","definition":"A shape whose sides are all the same length and whose angles are all the same size.","definitionEs":"Una figura cuyos lados tienen la misma longitud y cuyos ángulos tienen la misma medida.","visual":"A stop sign is a regular octagon.","img":"/assets/vocab-images/regular-polygon.svg","lesson":"5-4"},{"term":"Congruent","termEs":"Congruente","definition":"Exactly the same size and shape.","definitionEs":"Exactamente del mismo tamaño y forma.","visual":"The 8 center triangles of a regular octagon all match.","img":"/assets/vocab-images/regular-polygon.svg","lesson":"5-4"},{"term":"Volume with Whole-Number Edges","termEs":"Volumen con aristas de números enteros","definition":"The number of unit cubes inside a rectangular prism. Formula: V = l × w × h.","definitionEs":"La cantidad de cubos unitarios dentro de un prisma rectangular. Fórmula: V = l × w × h.","visual":"V = l × w × h; 3 × 4 × 5 = 60 cubic units.","role":"concept","img":"/assets/vocab-images/volume-of-rectangular-prisms.svg","lesson":"5-5"},{"term":"Volume","termEs":"Volumen","definition":"How much space is inside a solid shape.","definitionEs":"Cuánto espacio hay dentro de una figura sólida.","visual":"A box 3 × 2 × 4 holds 24 unit cubes, so V = 24 cubic units","img":"/assets/vocab-images/volume.svg","lesson":"5-5"},{"term":"Rectangular prism","termEs":"Prisma rectangular","definition":"A solid box shape with six flat rectangle sides.","definitionEs":"Una figura sólida en forma de caja con seis lados rectangulares.","visual":"A cereal box or shoe box — it has length, width, and height","img":"/assets/vocab-images/rectangular-prism.svg","lesson":"5-5"},{"term":"Cubic units","termEs":"Unidades cúbicas","definition":"The units used to measure space inside, like cubic inches.","definitionEs":"Las unidades para medir el espacio interior, como pulgadas cúbicas.","visual":"A tiny cube that is 1 in × 1 in × 1 in = 1 in³ (one cubic inch)","img":"/assets/vocab-images/cubic-units.svg","lesson":"5-5"},{"term":"Length, width, height","termEs":"Largo, ancho, altura","definition":"How long, how wide, and how tall a box is.","definitionEs":"Qué tan largo, ancho y alto es una caja.","visual":"V = l × w × h: for a box 5 × 3 × 2, volume = 30 cubic units","img":"/assets/vocab-images/dimensions.svg","lesson":"5-5"},{"term":"Net","termEs":"Plantilla (desarrollo plano)","definition":"A flat shape that folds up into a solid.","definitionEs":"Una figura plana que se dobla y forma un sólido.","visual":"A cross-shaped pattern of 6 rectangles folds into a rectangular box","img":"/assets/vocab-images/net.svg","lesson":"5-5"},{"term":"Edge","termEs":"Arista","definition":"The line where two flat sides of a solid meet.","definitionEs":"La línea donde se unen dos lados planos de un sólido.","visual":"A cube has 12 edges — 4 along the top, 4 along the bottom, 4 vertical","img":"/assets/vocab-images/edge.svg","lesson":"5-5"},{"term":"Unit cube","termEs":"Cubo unitario","definition":"A cube that measures one unit on every edge.","definitionEs":"Un cubo que mide una unidad en cada arista.","visual":"Unit cubes fill a prism with no gaps.","img":"/assets/vocab-images/cubic-units.svg","lesson":"5-5"},{"term":"Base area","termEs":"Área de la base","definition":"The area of the bottom face of a prism.","definitionEs":"El área de la cara inferior de un prisma.","visual":"B = length × width","img":"/assets/vocab-images/base-area-prism.svg","lesson":"5-5"},{"term":"Surface Area Using Nets","termEs":"Área de superficie usando redes","definition":"The total area of all the faces of a solid. A net unfolds the solid flat so you can see every face and add their areas.","definitionEs":"El área total de todas las caras de un cuerpo. Una plantilla lo despliega para ver cada cara y sumar sus áreas.","visual":"A box with 6 faces: 2(8×5) + 2(8×3) + 2(5×3) = 158 square units","role":"concept","img":"/assets/vocab-images/surface-area-of-prisms.svg","lesson":"5-6"},{"term":"Surface area","termEs":"Área de superficie","definition":"The total area of all the flat sides of a solid.","definitionEs":"El área total de todos los lados planos de un sólido.","visual":"A box 6 × 4 × 2: SA = 2(24) + 2(12) + 2(8) = 88 in² — like wrapping paper needed","img":"/assets/vocab-images/surface-area.svg","lesson":"5-6"},{"term":"Face","termEs":"Cara","definition":"One flat side of a solid shape.","definitionEs":"Un lado plano de una figura sólida.","visual":"A rectangular prism has 6 faces: top, bottom, front, back, left, right","img":"/assets/vocab-images/rectangular-prism.svg","lesson":"5-6"},{"term":"Two-dimensional","termEs":"Bidimensional","definition":"A flat shape with length and width, but no thickness.","definitionEs":"Una figura plana con largo y ancho, pero sin grosor.","visual":"A rectangle drawn on paper is 2D — it has length and width but no depth","img":"/assets/vocab-images/square-unit.svg","lesson":"5-6"},{"term":"Pyramid","termEs":"Pirámide","definition":"A solid with one base and triangular sides that meet at a point.","definitionEs":"Un sólido con una base y lados triangulares que se unen en un punto.","visual":"A square base with 4 triangles.","img":"/assets/vocab-images/pyramid.svg","lesson":"5-6"},{"term":"Vertex","termEs":"Vértice","definition":"A corner point where edges meet.","definitionEs":"Un punto de esquina donde se unen las aristas.","visual":"A cube has 8 vertices.","img":"/assets/vocab-images/ordered-pair.svg","lesson":"5-6"},{"term":"Surface Area of Prisms","termEs":"Área de superficie de prismas","definition":"The total area of all bases and lateral faces of a prism. Formula: SA = 2B + lateral area.","definitionEs":"El área total de las bases y caras laterales de un prisma. Fórmula: SA = 2B + área lateral.","visual":"SA = 2B + lateral area","role":"concept","img":"/assets/vocab-images/surface-area-of-prisms.svg","lesson":"5-7"},{"term":"Triangular prism","termEs":"Prisma triangular","definition":"A solid with two triangle ends and three flat rectangle sides.","definitionEs":"Un sólido con dos extremos triangulares y tres lados rectangulares.","visual":"Shaped like a tent or a wedge of cheese — 2 triangle ends + 3 rectangle sides","img":"/assets/vocab-images/rectangular-prism.svg","lesson":"5-7"},{"term":"Lateral face","termEs":"Cara lateral","definition":"The side faces of a solid, not the top or bottom.","definitionEs":"Los lados de un sólido, no la parte de arriba ni la de abajo.","visual":"On a triangular prism, the 3 rectangles that wrap around the sides are lateral faces","img":"/assets/vocab-images/surface-area.svg","lesson":"5-7"},{"term":"Surface Area of Pyramids","termEs":"Área de superficie de pirámides","definition":"The total area of a pyramid's base and triangular faces. Formula: SA = B + lateral area.","definitionEs":"El área total de la base y las caras triangulares de una pirámide. Fórmula: SA = B + área lateral.","visual":"Square base 6×6 with 4 triangles of ½ × 6 × 5: 36 + 60 = 96 square units","role":"concept","img":"/assets/vocab-images/surface-area-of-pyramids.svg","lesson":"5-8"},{"term":"Slant height","termEs":"Altura inclinada (apotema)","definition":"The height of a side triangle, measured along its slanted face.","definitionEs":"La altura de un triángulo lateral, medida por su cara inclinada.","visual":"If you slide your finger from the bottom edge up the triangle face to the top point — that distance is the slant height","img":"/assets/vocab-images/slant-height-pyramid.svg","lesson":"5-8"},{"term":"Apex","termEs":"Ápice","definition":"The point at the top of a pyramid where the sides meet.","definitionEs":"El punto en la parte de arriba de una pirámide donde se unen los lados.","visual":"The pointy top of a pyramid — all the slanted edges connect here","img":"/assets/vocab-images/pyramid.svg","lesson":"5-8"},{"term":"Lateral area","termEs":"Área lateral","definition":"The total area of just the side triangles, not the bottom.","definitionEs":"El área total solo de los triángulos laterales, sin el fondo.","visual":"For a square pyramid: lateral area = 4 × (½ × base edge × slant height)","img":"/assets/vocab-images/surface-area.svg","lesson":"5-8"},{"term":"Area of Regular Polygons","termEs":"Área de polígonos regulares","definition":"The space a regular polygon covers. Split it from the center into identical triangles, find one triangle's area, then multiply by how many there are.","definitionEs":"El espacio que cubre un polígono regular. Divídelo desde el centro en triángulos idénticos, halla el área de uno y multiplícala por cuántos hay.","visual":"A hexagon splits into 6 identical triangles: (½ × 4 × 3.5) × 6 = 42 square units","role":"concept","img":"/assets/vocab-images/area-of-regular-polygons.svg","lesson":"5-9"},{"term":"Triangle","termEs":"Triángulo","definition":"A shape with three sides.","definitionEs":"Una figura de tres lados.","visual":"Each triangle inside a decomposed hexagon has a base = one side of the hexagon and height = distance from center to side","img":"/assets/vocab-images/triangle.svg","lesson":"5-9"},{"term":"Composite","termEs":"Compuesto","definition":"Made by putting two or more simple shapes together.","definitionEs":"Formada al juntar dos o más figuras simples.","visual":"6 triangles, each with area 15 sq ft, combine to form a hexagon with total area = 6 × 15 = 90 sq ft","img":"/assets/vocab-images/composite-figure.svg","lesson":"5-9"},{"term":"Volume of Rectangular Prisms","termEs":"Volumen de prismas rectangulares","definition":"The space inside a rectangular prism. Formula: V = Bh = l × w × h.","definitionEs":"El espacio dentro de un prisma rectangular. Fórmula: V = Bh = l × w × h.","visual":"V = Bh = l × w × h","role":"concept","img":"/assets/vocab-images/volume-of-rectangular-prisms.svg","lesson":"5-10"},{"term":"Dimensions","termEs":"Dimensiones","definition":"How long, how wide, and how tall a shape is.","definitionEs":"Qué tan largo, ancho y alto es una figura.","visual":"A box with dimensions 4 × 3 × 2 means l = 4, w = 3, h = 2","img":"/assets/vocab-images/dimensions.svg","lesson":"5-10"}]</script>
<script type="application/json" id="gn-easy">{"v":1,"map":{"An area, surface area & volume adventure in five chapters — featuring six reader gates. Solve the math to move the story.":"This story is about area, surface area &amp; volume. It has five chapters and six reader gates. Solve the math to move the story.","Pattern distortion detected in a set of blueprints. Reader: bring a pencil.":"Bad patterns found in some blueprints. Reader: get a pencil.","Previously: a night-market stall yelled \"50% OFF EVERYTHING\" — and lied with every percent. The crew worked backwards from the parts, exposed the scam, and the pier fund hit 100%. The whole city was watching.":"Last time: a night stall yelled \"50% OFF EVERYTHING\" and lied. It lied with each percent. The crew found the truth. The pier fund hit 100%. The whole city saw.","The city picked OUR design. Skate ramp, stage, garden beds, storage shed — Brightside comes back.":"The city picked OUR plan. A skate ramp, a stage, garden beds, a shed. Brightside comes back.","The storm flattened this lot. Your blueprint un-flattens it, Mina. Lead the build.":"The storm wrecked this lot. Your blueprint fixes it, Mina. You lead the build.","We beat one other bidder: Hargrove & Sons. Their bid was suspiciously cheap.":"We beat one other team: \u003cb>Hargrove &amp; Sons\u003c/b>. Their price was too low.","Warning: Hargrove's blueprints hum with distortion. Their measurements are… bent.":"Look out. Hargrove's blueprints are bent. Their numbers are wrong.","The Brightside lot, day one. Mud, sawhorses, and one very loud contractor.":"The Brightside lot, day one. Mud, tools, and one loud builder.","That slanted stage floor? It's half a rectangle, kid. I'd charge you half. You're welcome.":"That stage floor is half a rectangle, kid. I'd charge you half. \u003ci>You're welcome.\u003c/i>","It's a parallelogram. Slice a triangle off one end, slide it to the other — it IS a rectangle. Whole, not half.":"It's a parallelogram. Cut a triangle off one end. Slide it to the other end. Now it IS a rectangle. It is whole, not half.","Vocabulary upload. The base is the side you stand on. The height is the straight-up distance to the opposite side — never the slanted edge. Area = base × height.":"New words. The \u003cb>base\u003c/b> is the side it sits on. The \u003cb>height\u003c/b> goes straight up to the top side. It is not the slant edge. Area = base × height.","To decompose a shape means to cut it into pieces you already know. Mina's slice-and-slide turns a parallelogram into a rectangle with the same base, height, and area.":"To \u003cb>decompose\u003c/b> a shape: cut it into parts you know. Mina cut and slid the parallelogram. It made a rectangle. The base, height, and area stay the same.","Reader — you're our fifth crew member. Size the stage floor before Hargrove \"helps.\"":"Reader, you are on our crew. Find the size of the stage floor. Beat Hargrove to it.","The blueprint shows the stage floor: a parallelogram with base 12 ft and height 7 ft. Hargrove says \"charge for half.\" Find the TRUE area in square feet.":"The stage floor is a parallelogram. It has \u003cb>base 12 ft\u003c/b> and \u003cb>height 7 ft\u003c/b>. Hargrove says to \"charge for half\". Find the TRUE area in square feet.","Conceptual: a parallelogram is a pushed-over rectangle — slice a triangle off one end and slide it to the other. Nothing gets cut in half.":"Conceptual: a parallelogram is a rectangle that got pushed. Cut a triangle off one end. Slide it to the other end. No part gets cut in half.","Procedural: multiply base × height. Do NOT divide by 2 — that move belongs to triangles.":"Procedural: multiply base × height. Do NOT divide by 2. That step is for triangles.","Shade sail over the stage. It's literally a parallelogram folded in half — triangle class, level one.":"This is a shade sail for the stage. It is a parallelogram cut in half. That makes a triangle.","So same move as the floor… then take half. The fabric bill depends on it.":"So do the same as the floor. Then take half. The cloth bill needs it.","Confirmed. Two copies of any triangle snap together into a parallelogram. So a triangle's area = base × height ÷ 2.":"Yes. Two of the same triangle make a parallelogram. So a triangle's area = base × height ÷ 2.","Noah tested it on scrap fabric: a little triangle with base 6 and height 8 came out to 24 square units — half of 48. The ÷ 2 is not optional.":"Noah tried it on cloth. His triangle had base 6 and height 8. It came out to 24 square units. That is half of 48. You must do the ÷ 2.","Order the sail fabric, reader. Too little = sunburn. Too much = broke.":"Get the sail cloth, reader. Too little = sunburn. Too much = broke.","The triangular shade sail has base 10 ft and height 6 ft. How many square feet of fabric does it take?":"The shade sail is a triangle. It has \u003cb>base 10 ft\u003c/b> and \u003cb>height 6 ft\u003c/b>. How many square feet of cloth does it need?","Conceptual: two copies of this sail would snap together into a parallelogram. You only need ONE of them.":"Conceptual: two of this sail would make a parallelogram. You need just ONE of them.","Procedural: multiply base × height, then take half of the result.":"Procedural: multiply base × height. Then take half of that.","East corner of the lot. The beds taper so wheelbarrows can pass.":"The east side of the lot. The beds get thin. Carts can pass.","Trapezoid bed: two parallel sides — a short base and a long base — and the height runs straight between them.":"Trapezoid bed: two parallel sides. One base is short. One base is long. The height goes straight between them.","Hargrove's flyer says beds like ours need \"double\" the liner. VEX is glitching just looking at it.":"Hargrove's sign says our beds need \"double\" the liner. VEX does not like it.","Trapezoid trick: it's an in-between rectangle. Average the two bases — add them, divide by 2 — then multiply by the height.":"Trapezoid trick: think of a rectangle in between. Find the mean of the bases. Add them, divide by 2. Then multiply by the height.","Mina proved it on the whiteboard with bases 6 and 10 and height 4: the average base is 8, so the area is 32. Decompose it into a rectangle plus two triangles — same answer.":"Mina showed it on the board. Bases 6 and 10, height 4. The mean base is 8. So the area is 32. Decompose it into a rectangle and two triangles. You get the same answer.","Liner fabric is cut to the square foot. Measure the bed, reader — exactly.":"Liner is cut by the square foot. Find the size of the bed, reader. Be exact.","The trapezoid garden bed has parallel bases of 8 ft and 12 ft, and a height of 5 ft. How many square feet of liner does it need?":"The garden bed is a trapezoid. Its parallel bases are \u003cb>8 ft\u003c/b> and \u003cb>12 ft\u003c/b>. It has a \u003cb>height of 5 ft\u003c/b>. How many square feet of liner does it need?","Conceptual: a trapezoid acts like an in-between rectangle — its true width is the AVERAGE of the short base and the long base.":"Conceptual: a trapezoid is like a rectangle in between. Its true width is the mean of the bases. Use the short base and the long base.","Procedural: add the two bases, divide by 2, then multiply by the height.":"Procedural: add the two bases. Divide by 2. Then multiply by the height.","Planter boxes for the herbs. Volume tells us how much soil fits inside — we measure it in cubic feet, like stacking blocks.":"Plant boxes for the herbs. \u003cb>Volume\u003c/b> tells how much soil fits inside. We use cubic feet. Think of stacked blocks.","Except our edges aren't whole numbers. The blocks come in halves now.":"But our edges are not whole numbers. Now the blocks come in halves.","Formula holds anyway: volume = length × width × height — even with fractional edge lengths. Noah's test box, 3 × 1.5 × 2, packs exactly 9 cubic feet.":"The formula still works. Volume = length × width × height. It works with fraction edges too. Noah's test box is 3 × 1.5 × 2. It holds 9 cubic feet.","Half-blocks still count. A layer of half-foot cubes is just a thinner layer — multiply it in like any other number.":"Half-blocks still count. A half-foot layer is just a thin layer. Multiply it like any number.","The soil truck is idling, reader. How many cubic feet does one planter hold?":"The soil truck is here, reader. How many cubic feet does one box hold?","One planter box measures 4 ft × 2.5 ft × 1.5 ft. How many cubic feet of soil fill it to the brim?":"One plant box is \u003cb>4 ft × 2.5 ft × 1.5 ft\u003c/b>. How many cubic feet of soil fill it up?","Conceptual: volume is length × width × height — and fractional edges multiply in just like whole numbers. A half-foot layer is simply a thinner layer.":"Conceptual: volume is length × width × height. Fraction edges multiply just like whole numbers. A half-foot layer is just a thin layer.","Procedural: multiply 4 × 2.5 first, then multiply that result by 1.5.":"Procedural: multiply 4 × 2.5 first. Then multiply that by 1.5.","Storage crates for the tools — 4 by 3 by 2 feet, plywood on every face. Watch this.":"Tool boxes, 4 by 3 by 2 feet. Wood on each face. Watch this.","She just flattened a whole box. Six faces, one flat shape.":"She made the box flat. Six faces, one flat shape.","That flat shape is a net. Fold it back up and you get the box. Add the areas of all six faces and you get the surface area — the box's whole skin.":"That flat shape is a \u003cb>net\u003c/b>. Fold it up and you get the box. Add the areas of all six faces. That is the \u003cb>surface area\u003c/b>. It is the whole skin of the box.","Shortcut: a box has three different faces, each appearing twice. Find the three, add them, double the total.":"Quick way: a box has three kinds of faces. Each kind comes twice. Find the three. Add them. Then double it.","Two jobs, reader: pick the net that really folds into our crate, then price its skin.":"Two jobs, reader. Pick the net that folds into our box. Then find the cost of its skin.","The storage crate is 4 ft × 3 ft × 2 ft. Step 1: tap the net that actually folds into this crate. Step 2: enter its surface area — the plywood for ALL the faces.":"The tool box is \u003cb>4 ft × 3 ft × 2 ft\u003c/b>. \u003cb>Step 1:\u003c/b> tap the net that folds into this box. \u003cb>Step 2:\u003c/b> type its surface area. That is the wood for ALL the faces.","Conceptual: a closed box needs 6 faces, and opposite faces are twins — same size, in pairs. A true net has exactly the right 6.":"Conceptual: a closed box needs 6 faces. Faces across from each other are twins. They come in pairs. A true net has just the right 6.","Procedural: the three different faces are 4×3, 4×2, and 3×2. Find each area, add the three, then double the total.":"Procedural: the three kinds of faces are 4×3, 4×2, and 3×2. Find each area. Add the three. Then double it.","City Hall, 6 PM. The council will fund whichever bid \"adds up.\" Hargrove smiles like a crocodile.":"City Hall, 6 PM. The city pays for the bid that adds up. Hargrove grins.","Distortion source located: that bid. The shed is 5 × 4 × 3 feet. The garden bed is 6 × 2 × 1.5. Verify everything.":"I found the bad part: that bid. The shed is 5 × 4 × 3 feet. The garden bed is 6 × 2 × 1.5. Check it all.","Reader — paint covers faces, soil fills space. Run our honest numbers. Then we call the vote.":"Reader, paint covers faces. Soil fills space. Check our true numbers. Then we vote.","Boss Gate: surface area for the paint, volume for the soil, and one final judgment call. Everything from this volume, all at once.":"Boss Gate: surface area for the paint. Volume for the soil. Then one last choice. It is all from this volume, at once.","BOSS GATE. Three locks. One lot. The council is literally holding pens.":"BOSS GATE. Three locks. One lot. The city is ready to vote.","The council votes tonight. Hargrove's bid claims 54 sq ft of paint for the shed and 12 cu ft of soil per bed. The real shed is 5 × 4 × 3 ft; the real bed is 6 × 2 × 1.5 ft. Three locks:":"The city votes tonight. Hargrove's bid: \u003cb>54 sq ft of paint\u003c/b> for the shed. And \u003cb>12 cu ft of soil\u003c/b> for each bed. The real shed is \u003cb>5 × 4 × 3 ft\u003c/b>. The real bed is \u003cb>6 × 2 × 1.5 ft\u003c/b>. Three locks:","Honest paint for the 5 × 4 × 3 shed (every face):":"True paint for the 5 × 4 × 3 shed (each face):","Honest soil for the 6 × 2 × 1.5 bed:":"True soil for the 6 × 2 × 1.5 bed:","Which bid should the council fund — and why?":"Which bid should the city pick? Why?","Conceptual: paint covers FACES — that's surface area, all six of them. Soil fills SPACE — that's volume. Two different questions about the same boxes.":"Conceptual: paint covers FACES. That is surface area, all six. Soil fills SPACE. That is volume. These are two different questions about the same boxes.","Procedural: Lock 1: SA = 2 × (5·4 + 5·3 + 4·3). Lock 2: volume = 6 × 2 × 1.5. Lock 3: compare each crew number with Hargrove's claim — what did he leave out?":"Procedural: Lock 1: SA = 2 × (5·4 + 5·3 + 4·3). Lock 2: volume = 6 × 2 × 1.5. Lock 3: check each crew number with Hargrove's. What did he leave out?","Built from an honest blueprint: 84 for the stage, 30 for the sail, 50 per bed — and every face of that shed painted.":"Built from a true blueprint. 84 for the stage, 30 for the sail, 50 for each bed. And each face of the shed is painted.","The council audited Hargrove's \"54.\" Two missing faces. He's banned from city bids for a year.":"The city checked Hargrove's \"54.\" Two faces were missing. He can't bid for a year.","New distortion. A vault door under Vexhall… covered in symbols. To be continued…":"A new bad pattern. A vault door under Vexhall has signs on it. To be continued…","Builder, artist, this volume's crew lead. Drew the winning blueprint and sliced a parallelogram into a rectangle in front of a live contractor.":"Builder and artist. She leads the crew in this volume. She drew the plan that won. She cut a parallelogram into a rectangle. A builder saw it.","Crew captain. Kept the build on schedule and the measurements in the notebook — every base, every height.":"Crew boss. Kept the build on time. Kept each base and each height in the notebook.","Evidence officer. Audited Hargrove's bid down to the last missing face. \"Trust us\" is not a unit.":"Proof finder. Found each face Hargrove's bid left out. \"Trust us\" is not a unit.","Pattern hunter. Treats volume like block-stacking in a video game — and is, annoyingly, correct.":"Pattern finder. Thinks of volume like stacking blocks in a game. And he is right.","Fragment of Ada Vex's Pattern Engine. Senses distortions; cannot compute. That's your job.":"A piece of Ada Vex's Pattern Engine. It can sense bad patterns. It can't do math. That's your job.","Base & height.The base is a side; the height is the straight-up distance to the opposite side — never the slant.":"\u003cb>Base &amp; height.\u003c/b>\u003cspan>The base is a side. The height goes straight up to the top side. It is not the slant.\u003c/span>","Parallelogram.Slice and slide: it becomes a rectangle. Area = base × height. The stage floor: 12 × 7 = 84 sq ft.":"\u003cb>Parallelogram.\u003c/b>\u003cspan>Cut and slide. It turns into a rectangle. Area = base × height. The stage floor: 12 × 7 = 84 sq ft.\u003c/span>","Triangle.Half a parallelogram. Area = base × height ÷ 2. The sail: 10 × 6 ÷ 2 = 30 sq ft.":"\u003cb>Triangle.\u003c/b>\u003cspan>Half a parallelogram. Area = base × height ÷ 2. The sail: 10 × 6 ÷ 2 = 30 sq ft.\u003c/span>","Trapezoid.Average the bases, then multiply by height. The bed: (8 + 12) ÷ 2 × 5 = 50 sq ft.":"\u003cb>Trapezoid.\u003c/b>\u003cspan>Find the mean of the bases. Then multiply by height. The bed: (8 + 12) ÷ 2 × 5 = 50 sq ft.\u003c/span>","Volume.Space inside, in cubic units: length × width × height — fractions welcome. Planter: 4 × 2.5 × 1.5 = 15 cu ft.":"\u003cb>Volume.\u003c/b>\u003cspan>Space inside, in cubic units. Length × width × height. Fractions are fine. Box: 4 × 2.5 × 1.5 = 15 cu ft.\u003c/span>","Net & surface area.Unfold the box into a net; add all six faces. Crate: 2(12 + 8 + 6) = 52 sq ft of skin.":"\u003cb>Net &amp; surface area.\u003c/b>\u003cspan>Lay the box flat as a net. Add all six faces. Box: 2(12 + 8 + 6) = 52 sq ft of skin.\u003c/span>","\"A shape never lies about its area. Only the person measuring it can.\" — A.V.":"\"A shape does not lie about its area. Only the one who checks it can.\" — A.V.","completed Volume 5: Blueprint for Brightside and proved mastery over areas of parallelograms, triangles, and trapezoids, volume with fractional edges, nets, and surface area.":"finished \u003cb>Volume 5: Blueprint for Brightside\u003c/b>. You know area of a parallelogram and a triangle. And a trapezoid. You know volume with fraction edges. And nets and surface area.","Thank you for building with the crew. Volume 6 is waiting behind a vault door covered in symbols.":"Thank you for building with the crew. Volume 6 waits behind a vault door. It has signs on it.","A different ramp deck is a parallelogram: base 9 ft, height 4 ft.":"\u003cspan>A new ramp is a parallelogram. Base 9 ft, height 4 ft.\u003c/span>","Area = base × height = 9 × 4 = 36 sq ft.":"\u003cspan>Area = base × height = 9 × 4 = 36 sq ft.\u003c/span>","Check by decomposing: slice the slanted end off, slide it across — a 9 × 4 rectangle. Same 36.":"\u003cspan>Check by cutting. Cut the slant end off. Slide it over. Now it is a 9 × 4 rectangle. Same 36.\u003c/span>","Your turn — same idea, different numbers:":"Your turn. Same idea, new numbers:","Noah's scrap-fabric test triangle: base 6, height 8.":"\u003cspan>Noah's test triangle: base 6, height 8.\u003c/span>","Whole parallelogram would be 6 × 8 = 48.":"\u003cspan>The whole parallelogram would be 6 × 8 = 48.\u003c/span>","The triangle is half of that: 48 ÷ 2 = 24 square units.":"\u003cspan>The triangle is half of that: 48 ÷ 2 = 24 square units.\u003c/span>","Mina's whiteboard bed: bases 6 and 10, height 4.":"\u003cspan>Mina's bed on the board: bases 6 and 10, height 4.\u003c/span>","Area = 8 × 4 = 32 square units. Decomposing into a rectangle + two triangles gives the same 32.":"\u003cspan>Area = 8 × 4 = 32 square units. Cut it into a rectangle + two triangles. You get the same 32.\u003c/span>","Noah's test box: 3 ft × 1.5 ft × 2 ft.":"\u003cspan>Noah's test box: 3 ft × 1.5 ft × 2 ft.\u003c/span>","4.5 × 2 = 9 cubic feet. The half-blocks counted, just like whole ones.":"\u003cspan>4.5 × 2 = 9 cubic feet. The half-blocks count, just like whole ones.\u003c/span>","A smaller chest: 2 ft × 2 ft × 3 ft.":"\u003cspan>A small chest: 2 ft × 2 ft × 3 ft.\u003c/span>","Three different faces: 2×2 = 4, 2×3 = 6, 2×3 = 6. Sum: 4 + 6 + 6 = 16.":"\u003cspan>Three kinds of faces: 2×2 = 4, 2×3 = 6, 2×3 = 6. Add: 4 + 6 + 6 = 16.\u003c/span>","Double it for the twin faces: 16 × 2 = 32 sq ft of skin.":"\u003cspan>Double it for the twin faces: 16 × 2 = 32 sq ft of skin.\u003c/span>","A different job: paint a 4 × 3 × 3 cabinet, fill a 3 × 2 × 0.5 trough.":"\u003cspan>A new job. Paint a 4 × 3 × 3 box. Fill a 3 × 2 × 0.5 bin.\u003c/span>","Paint = surface area: 2 × (4·3 + 4·3 + 3·3) = 2 × 33 = 66 sq ft.":"\u003cspan>Paint = surface area: 2 × (4·3 + 4·3 + 3·3) = 2 × 33 = 66 sq ft.\u003c/span>","Soil = volume: 3 × 2 × 0.5 = 3 cubic ft. Faces for paint, space for soil.":"\u003cspan>Soil = volume: 3 × 2 × 0.5 = 3 cubic ft. Faces for paint. Space for soil.\u003c/span>","12 × 7 = 84 sq ft — the whole floor, no Hargrove haircut. Stage: funded!":"12 × 7 = 84 sq ft. The whole floor, not half. The stage is paid for!","You charged for half the stage! The ÷ 2 belongs to triangles — slice-and-slide keeps a parallelogram whole.":"You charged for half the stage! The ÷ 2 is for triangles. Cut and slide keeps a parallelogram whole.","Use base × height — the dashed 7 ft, not any slanted edge.":"Use base × height. Use the 7 ft dashed line, not a slant edge.","10 × 6 ÷ 2 = 30 sq ft. The sail goes up and the stage gets shade!":"10 × 6 ÷ 2 = 30 sq ft. The sail goes up. The stage gets shade!","That buys a whole parallelogram of fabric. The sail is HALF of it — one more step.":"That is cloth for a whole parallelogram. The sail is HALF of it. Do one more step.","Base × height first… then remember what a triangle is half of.":"Do base × height first. Then think: a triangle is half of what?","(8 + 12) ÷ 2 × 5 = 50 sq ft. Liner cut, bed built — Hargrove's 'double it' flyer goes in the recycling.":"(8 + 12) ÷ 2 × 5 = 50 sq ft. The liner is cut. The bed is built. Hargrove's \"double it\" sign goes in the trash.","That's Hargrove's 'double' — you added the bases but skipped the ÷ 2. Average them first.":"That is Hargrove's \"double\". You added the bases but did not do the ÷ 2. Find the mean first.","Average the two bases (add, then halve), THEN multiply by the height.":"Find the mean of the bases. Add, then halve. THEN multiply by the height.","4 × 2.5 × 1.5 = 15 cubic feet. The soil truck dumps exactly enough. Herbs incoming!":"4 × 2.5 × 1.5 = 15 cubic feet. The truck drops just enough soil. Herbs are next!","Someone rounded the edges down to whole numbers. The 2.5 and the 1.5 count — halves and all.":"You made the edges whole numbers. The 2.5 and the 1.5 count. Halves too.","Good start — that's 4 × 2.5. Now multiply by the height, 1.5.":"Good start. That is 4 × 2.5. Now multiply by the height, 1.5.","Length × width × height. Multiply all three edges — fractions ride along.":"Length × width × height. Multiply all three edges. Fractions too.","Step 1 first — tap the net that folds into the crate.":"Do Step 1 first. Tap the net that folds into the box.","Count the faces on that net. A closed crate needs 6 — tools would fall out of this one.":"Count the faces on that net. A closed box needs 6. Tools would fall out of this one.","Check the end flaps: square 3 × 3 ends can't close a crate that's 3 ft by 2 ft deep.":"Look at the end flaps. The square 3 × 3 ends can't close this box. It is 3 ft by 2 ft deep.","Net A folds tight, and 2(12 + 8 + 6) = 52 sq ft of plywood. Crates: conquered.":"Net A folds tight. 2(12 + 8 + 6) = 52 sq ft of wood. The boxes are done.","You found the three different faces — but every face has a twin. Double it.":"You found the three kinds of faces. But each face has a twin. Double it.","That's how much the crate HOLDS (volume). Surface area is the skin, not the filling.":"That is how much the box HOLDS (volume). Surface area is the skin, not what is inside.","Add the three different face areas, then double the total for the twin faces.":"Add the three face areas. Then double it for the twin faces.","Lock 1 holds. That's Hargrove's number — he skipped two faces. 2 × (lw + lh + wh) counts all six.":"Lock 1 is shut. That is Hargrove's number. He left out two faces. 2 × (lw + lh + wh) counts all six.","Lock 1 holds. Three face pairs: 5·4, 5·3, 4·3 — add them, then double.":"Lock 1 is shut. Three face pairs: 5·4, 5·3, 4·3. Add them. Then double it.","Lock 2 holds. Someone flattened the 1.5 into a 1. The half-foot of depth is real soil.":"Lock 2 is shut. You made the 1.5 a 1. The half foot is real soil.","Lock 2 holds. Volume = length × width × height: 6 × 2 × 1.5.":"Lock 2 is shut. Volume = length × width × height: 6 × 2 × 1.5.","ALL LOCKS OPEN. 94 honest square feet, 18 true cubic feet — the council tears up Hargrove's bid. Brightside gets built RIGHT!":"ALL LOCKS OPEN. 94 true square feet. 18 true cubic feet. The city rips up Hargrove's bid. Brightside gets built RIGHT!","Yes! Now head back and open that gate.":"Yes! Now go back and open that gate.","Walk the steps above again — you've got this.":"Go through the steps above again. You can do it."}}</script>
