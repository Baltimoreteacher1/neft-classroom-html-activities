  if(i==null||i<0||i>=PAGES.length) return `<div class="page-inner" style="align-items:center;justify-content:center"><div class="kicker" style="opacity:.4">AXIOM CITY</div></div><div class="pagefoot"><span></span><span></span></div>`;
  const p=PAGES[i];
  const gateHTML=p.gate?`<div class="gatemount" data-gate="${p.gate}"></div>`:"";
  const lock=p.gate?gateLockIcon(solved.has(p.gate)):"";
  return `${lock}<div class="chapterband">${p.ch.replace("·","· <em>").concat(p.ch.includes("·")?"</em>":"")}</div><div class="page-inner">${p.html}${gateHTML}</div><div class="pagefoot"><span>${VOLUME.unit}</span><span>PAGE ${i+1} / ${PAGES.length}</span></div>`;
}

/* ---------- gate framework ---------- */
function mountGates(scope){
  scope.querySelectorAll(".gatemount").forEach(m=>{
    const id=m.dataset.gate,G=GATES[id];
    if(!G)return;
    if(solved.has(id)){m.innerHTML=`<div class="gatesolved"><span class="stamp">SOLVED</span> ${G.title} — badge earned.</div>`;return}
    m.innerHTML=`<div class="gatebox"><header><svg class="gicon" viewBox="0 0 100 100"><use href="${G.icon}"/></svg><h3>${G.title}</h3></header>
      <div class="gatebody"><div class="gateprompt">${G.prompt}</div><div class="gwidget"></div>
      <div class="gatehint" hidden></div>
      <button class="gatecheck">CHECK</button>
      <div class="gatefeedback" aria-live="polite"></div></div></div>`;
    const box=m.querySelector(".gatebox"),body=m.querySelector(".gwidget"),fb=m.querySelector(".gatefeedback"),hint=m.querySelector(".gatehint"),btn=m.querySelector(".gatecheck");
    let checker=null;
    const api={
      sound:n=>SND[n]&&SND[n](),
      onCheck(fn){checker=fn},
      fail(msg){
        attempts[id]=(attempts[id]||0)+1;SND.thud();mkfeed(fb,msg,false);
        const n=attempts[id];
        if(n===1){hint.hidden=false;hint.innerHTML="💡 <b>Hint:</b> "+G.hints[0]}
        else if(n===2){hint.hidden=false;hint.innerHTML="🧭 <b>Hint 2:</b> "+G.hints[1]}
        else if(n>=3&&!hint.querySelector(".askvex")){
          const b=document.createElement("button");b.className="gatecheck askvex";b.style.marginTop="8px";b.textContent="ASK VEX — WORKED EXAMPLE";
          b.addEventListener("click",()=>openWorked(G));hint.appendChild(b);
        }
        live("Not yet. "+msg);
      },
      pass(msg){
        solved.add(id);storage.set(K("gates"),[...solved]);SND.win();
        m.innerHTML=`<div class="gatesolved unlockflash"><span class="stamp">SOLVED</span> ${msg}</div>`;
        const corner=m.closest(".page,#pageL,#pageR")?.querySelector(".gatelockcorner");
        if(corner){corner.classList.add("open");corner.innerHTML=`<svg viewBox="0 0 100 100" style="color:#fff"><use href="#sig-open"/></svg>`}
        earnBadge(id);updateNav();live("Gate solved! "+msg);
      }
    };
    G.render(body,api);
    btn.addEventListener("click",()=>{ac();checker&&checker()});
  });
}
function openWorked(G){
  $("#workedBody").innerHTML=`<div class="workedsteps">${G.worked.steps.map((s,i)=>`<div class="st"><b class="n">${i+1}</b><span>${s}</span></div>`).join("")}</div>
    <div class="caption">Your turn — same idea, different numbers:</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font:600 .92rem 'Segoe UI'">${G.worked.q}</span>
    <input class="numin" id="wkin" aria-label="worked example answer"><button class="gatecheck" id="wkgo">CHECK</button></div>
    <div class="gatefeedback" id="wkfb" aria-live="polite"></div>`;
  $("#workedModal").classList.add("open");
  $("#wkgo").addEventListener("click",()=>{
    const v=($("#wkin").value||"").trim().replace(/\s+/g,"");
    if(v===G.worked.a||parseFloat(v)===parseFloat(G.worked.a)){
      mkfeed($("#wkfb"),"Yes! Now head back and open that gate.",true);SND.win();
      setTimeout(()=>$("#workedModal").classList.remove("open"),1100);
    }else{mkfeed($("#wkfb"),"Walk the steps above again — you've got this.",false);SND.thud()}
  });
}

/* ---------- badges ---------- */
function buildBadges(){
  $("#badges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"earned":""}" id="badge-${b.id}" title="${b.label}" role="img" aria-label="${b.label}${solved.has(b.id)?" — earned":" — locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
}
function earnBadge(id){buildBadges();const el=$("#badge-"+id);if(el){el.classList.remove("earned");void el.offsetWidth;el.classList.add("earned")}const b=BADGES.find(x=>x.id===id);if(b)live("Badge earned: "+b.label)}

/* ---------- progress ---------- */
function buildProgress(){$("#progress").innerHTML=PAGES.map((_,i)=>`<span class="dot ${i<=page?"on":""}"></span>`).join("")}

/* ---------- navigation & rendering ---------- */
const isMobile=()=>mobileMQ.matches;
function leftIndex(){return isMobile()?page:page-(page%2)}
function visiblePages(){return isMobile()?[page]:[leftIndex(),leftIndex()+1].filter(i=>i<PAGES.length)}
function blockedBy(){return null/* locks removed: gates still teach via hints + Ask VEX worked examples, but never block turning the page (Neft 2026-06-11) */}

function renderSpread(){
  const L=$("#pageL"),R=$("#pageR");
  if(isMobile()){L.innerHTML=pageInnerHTML(page);L.classList.remove("offscreen");R.classList.add("offscreen");R.innerHTML="";mountGates(L)}
  else{const li=leftIndex();L.innerHTML=pageInnerHTML(li);R.innerHTML=pageInnerHTML(li+1<PAGES.length?li+1:null);L.classList.remove("offscreen");R.classList.remove("offscreen");mountGates(L);mountGates(R)}
  buildProgress();updateNav();updateEdges();
  if(PAGES[page])live(`Page ${page+1} of ${PAGES.length}. ${PAGES[page].ch}.`);
  storage.set(K("page"),page);
  if($("#certName")){$("#certName").value=storage.get(K("name"))||"";$("#certName").addEventListener("input",e=>storage.set(K("name"),e.target.value));
    $("#certBadges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"":"locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
    $("#printCert").addEventListener("click",()=>{document.body.classList.add("print-cert");window.print();setTimeout(()=>document.body.classList.remove("print-cert"),400)});}
}
function updateEdges(){const f=page/Math.max(1,PAGES.length-1);$("#edgesL").style.width=(4+f*12)+"px";$("#edgesR").style.width=(16-f*12)+"px"}
function updateNav(){
  $("#prevBtn").disabled=page<=0||turning;
  const lastVisible=Math.max(...visiblePages());
  const end=lastVisible>=PAGES.length-1;
  const blocked=blockedBy();
  $("#nextBtn").disabled=end||turning;
  $("#nextBtn").classList.toggle("locked",!!blocked&&!end);
  $("#nextBtn").innerHTML=blocked&&!end?"🔒":"›";
  $("#nextBtn").setAttribute("aria-label",blocked?"Locked — solve the gate on this page to continue":"Next page");
}
function step(dir){
  if(turning)return;
  if(dir>0){
    const blocked=blockedBy();
    if(blocked){const G=GATES[blocked];SND.thud();$("#nextBtn").classList.add("shake");setTimeout(()=>$("#nextBtn").classList.remove("shake"),700);
      live("This page is gated. Solve "+G.title+" to continue.");
      const gb=document.querySelector(".gatebox");if(gb){gb.classList.add("unlockflash");setTimeout(()=>gb.classList.remove("unlockflash"),1000)}
      return}
    const lastVisible=Math.max(...visiblePages());
    if(lastVisible>=PAGES.length-1)return;
    const target=isMobile()?page+1:leftIndex()+2;
    animTurn(1,target);
  }else{
    if(page<=0)return;
    const target=isMobile()?page-1:Math.max(0,leftIndex()-2);
    animTurn(-1,target);
  }
}
function animTurn(dir,target){
  if(isMobile()||reducedMQ.matches||!prefs.motion){page=target;renderSpread();SND.flip();return}
  turning=true;SND.flip();
  const sheet=$("#turnSheet"),front=sheet.querySelector(".ts.front"),back=sheet.querySelector(".ts.back");
  const oldL=leftIndex();
  if(dir>0){
    front.innerHTML=pageInnerHTML(oldL+1<PAGES.length?oldL+1:null);
    back.innerHTML=pageInnerHTML(target<PAGES.length?target:null);
    page=target;
    /* underneath: left stays old-left, right becomes new-right */
    $("#pageR").innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    sheet.className="";sheet.classList.add("show","fwd");
  }else{
    front.innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    back.innerHTML=pageInnerHTML(oldL);
    page=target;
    $("#pageL").innerHTML=pageInnerHTML(target);
    sheet.className="";sheet.classList.add("show","back");
  }
  const done=()=>{sheet.classList.remove("show","fwd","back");sheet.removeEventListener("animationend",done);turning=false;renderSpread()};
  sheet.addEventListener("animationend",done);
  setTimeout(()=>{if(turning){done()}},1000);
}

/* ---------- parallax ---------- */
let rafPending=false,px=0,py=0;
function applyParallax(){
  rafPending=false;
  if(!prefs.motion||reducedMQ.matches)return;
  document.querySelectorAll("#spreadWrap .panel3d").forEach(p=>{
    p.style.transform=`rotateY(${px*4}deg) rotateX(${-py*3}deg)`;
    p.querySelectorAll("[data-depth]").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d*.6}px,${py*d*.35}px)`});
  });
}
addEventListener("pointermove",e=>{
  px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2;
  if(!rafPending){rafPending=true;requestAnimationFrame(applyParallax)}
  const cc=$("#coverCard");
  if(cc&&!$("#cover").hidden&&prefs.motion&&!reducedMQ.matches){
    cc.style.transform=`rotateY(${px*9}deg) rotateX(${-py*7}deg)`;
    cc.querySelectorAll(".cov-layer").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d}px,${py*d*.6}px)`});
  }
},{passive:true});

/* note: SVG <g data-depth> transform via style works in modern browsers (SVG2). Wrapped above for safety. */

/* ---------- HUD toggles ---------- */
function syncToggles(){
  $("#sndBtn").setAttribute("aria-pressed",prefs.sound);$("#sndBtn").textContent=prefs.sound?"🔊 Sound":"🔇 Sound";
  $("#motBtn").setAttribute("aria-pressed",prefs.motion);$("#motBtn").textContent=prefs.motion?"3D On":"3D Off";
  $("#txtBtn").setAttribute("aria-pressed",prefs.bigtext);document.documentElement.dataset.textsize=prefs.bigtext?"lg":"md";
  $("#hcBtn").setAttribute("aria-pressed",prefs.hc);document.body.classList.toggle("hc",prefs.hc);
  if(!prefs.motion)document.querySelectorAll(".panel3d").forEach(p=>p.style.transform="");
  storage.set(K("prefs"),prefs);
}
$("#sndBtn").addEventListener("click",()=>{prefs.sound=!prefs.sound;ac();syncToggles();SND.blip()});
$("#motBtn").addEventListener("click",()=>{prefs.motion=!prefs.motion;syncToggles()});
$("#txtBtn").addEventListener("click",()=>{prefs.bigtext=!prefs.bigtext;syncToggles()});
$("#hcBtn").addEventListener("click",()=>{prefs.hc=!prefs.hc;syncToggles()});

/* ---------- teacher panel ---------- */
function buildTeacher(){
  $("#teacherBody").innerHTML=`
    <p style="font:600 .9rem/1.45 'Segoe UI'">${VOLUME.unit} — interactive graphic novel. Story pauses at six <b>reader gates</b>; students must solve grade-level math problems to continue. Progress, badges, and settings persist per device.</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">SUGGESTED USE</h3>
    <p style="font:600 .88rem/1.45 'Segoe UI'">${TEACHER.suggested}</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">STANDARDS ALIGNMENT (CCSS)</h3>
    <table class="tt"><tr><th>Standard</th><th>Description</th><th>Where</th></tr>
    ${TEACHER.standards.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">ANSWER KEY</h3>
    <table class="tt"><tr><th>Gate</th><th>Answer &amp; notes</th></tr>
    ${TEACHER.answers.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</table>
    <p style="font:600 .8rem/1.4 'Segoe UI';color:#666">Hints escalate: conceptual → procedural → VEX worked example (parallel problem; never reveals the gate answer). Sound is off by default. 3D motion can be disabled (auto-disabled for reduced-motion users). © EduWonderLab — single-file, offline-safe, no data leaves the device.</p>`;
}
$("#teacherBtn").addEventListener("click",()=>{buildTeacher();$("#teacherModal").classList.add("open")});
$("#printTeacher").addEventListener("click",()=>{document.body.classList.add("print-teacher");window.print();setTimeout(()=>document.body.classList.remove("print-teacher"),400)});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest(".modal").classList.remove("open")));

/* ---------- input ---------- */
$("#nextBtn").addEventListener("click",()=>{ac();step(1)});
$("#prevBtn").addEventListener("click",()=>{ac();step(-1)});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){$("#teacherModal").classList.remove("open");return}
  if($(".modal.open"))return;
  if(["ArrowRight","PageDown"].includes(e.key))step(1);
  if(["ArrowLeft","PageUp"].includes(e.key))step(-1);
});
let tx=null;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60&&!$(".modal.open"))step(dx<0?1:-1);tx=null},{passive:true});
mobileMQ.addEventListener("change",()=>renderSpread());

/* ---------- boot ---------- */
function openBook(){
  $("#cover").hidden=true;$("#hud").hidden=false;$("#stage").hidden=false;
  $("#prevBtn").hidden=false;$("#nextBtn").hidden=false;
  renderSpread();
}
$("#startBtn").addEventListener("click",()=>{ac();page=0;openBook()});
$("#resumeBtn").addEventListener("click",()=>{ac();openBook()});
if((storage.get(K("page"))||0)>0||solved.size>0){$("#resumeBtn").hidden=false}
if(reducedMQ.matches){prefs.motion=false}
document.body.classList.toggle("reduced",reducedMQ.matches);
buildBadges();syncToggles();buildProgress();
</script>

      var stage = document.getElementById("hpSvgStage");
      var ro = document.getElementById("hpReadout");
      var k = Math.max(1, Math.abs(c));
      var w1 = Math.min(280, a * 11), w2 = Math.min(280, b * 11);
      stage.innerHTML =
        '<svg viewBox="0 0 640 110" style="width:100%;height:auto;background:#fff;border:2px solid #0f172a;border-radius:8px">' +
          '<rect x="20" y="18" width="' + w1 + '" height="28" rx="4" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>' +
          '<text x="' + (28 + w1) + '" y="37" font-size="13" font-weight="900" fill="#0f172a">A = ' + a + ' (Scaled ×' + k + ' = ' + (a*k) + ')</text>' +
          '<rect x="20" y="62" width="' + w2 + '" height="28" rx="4" fill="#f2b705" stroke="#0f172a" stroke-width="2"/>' +
          '<text x="' + (28 + w2) + '" y="81" font-size="13" font-weight="900" fill="#0f172a">B = ' + b + ' (Scaled ×' + k + ' = ' + (b*k) + ')</text>' +
        '</svg>';
      var ratioTxt = "Ratio A:B = " + a + ":" + b + " · Unit Rate (A/B) = " + (a/b).toFixed(2);
      var algTxt = "Linear Rule y = A·x + B at x=" + c + " → y = " + (a*c + b);
      var geomTxt = "Rect Area = " + (a*b) + " · Tri Area = " + (0.5*a*b) + " · Prism Vol (×" + k + ") = " + (a*b*k);
      ro.innerHTML =
        '<span><b>Proportional / Fraction:</b> <code>' + ratioTxt + '</code></span>' +
        '<span><b>Algebraic / Linear:</b> <code>' + algTxt + '</code></span>' +
        '<span><b>Geometric:</b> <code>' + geomTxt + '</code></span>';
    }
    ["a","b","c"].forEach(function(k){
      host.querySelector("[data-hp" + k + "]").addEventListener("input", function(e){
        if(k==="a") a = +e.target.value;
        if(k==="b") b = +e.target.value;
        if(k==="c") c = +e.target.value;
        host.querySelector("[data-hp" + k + "-v]").textContent = e.target.value;
        update();
      });
    });
    update();
  }

  function initCanvas(){
    var cv = document.getElementById("hpCanvas");
    if(!cv || cv.dataset.wired) return;
    cv.dataset.wired = "1";
    var ctx = cv.getContext("2d");
    var ink = "#0f172a", drawing = false, lx = 0, ly = 0;
    function bg(mode){
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.save();
      ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 1;
      for(var x=0;x<cv.width;x+=20){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cv.height); ctx.stroke(); }
      for(var y=0;y<cv.height;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cv.width,y); ctx.stroke(); }
      if(mode==="axes"){
        ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cv.width/2,0); ctx.lineTo(cv.width/2,cv.height);
        ctx.moveTo(0,cv.height/2); ctx.lineTo(cv.width,cv.height/2); ctx.stroke();
      }
      ctx.restore();
    }
    bg("grid");
    function pos(e){
      var r = cv.getBoundingClientRect();
      var cx = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
      var cy = e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY;
      return { x: ((cx - r.left)/(r.width||1))*cv.width, y: ((cy - r.top)/(r.height||1))*cv.height };
    }
    cv.addEventListener("mousedown", function(e){ drawing=true; var p=pos(e); lx=p.x; ly=p.y; });
    cv.addEventListener("mousemove", function(e){
      if(!drawing) return;
      var p=pos(e); ctx.strokeStyle=ink; ctx.lineWidth=2.8; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke();
      lx=p.x; ly=p.y;
    });
    window.addEventListener("mouseup", function(){ drawing=false; });
    Array.prototype.slice.call(modal.querySelectorAll("[data-hp-ink]")).forEach(function(b){
      b.addEventListener("click", function(){ ink = b.dataset.hpInk; });
    });
    Array.prototype.slice.call(modal.querySelectorAll("[data-hp-bg]")).forEach(function(b){
      b.addEventListener("click", function(){ bg(b.dataset.hpBg); });
    });
  }
})();

<script type="application/json" id="gn-vocab">[{"term":"Compare and Order Integers","termEs":"Comparar y ordenar enteros","definition":"Use a number line to decide which integers are greater or less and place them in order.","definitionEs":"Usar una recta numérica para decidir cuáles enteros son mayores o menores y colocarlos en orden.","visual":"−5 \u003c −2 \u003c 0 \u003c 3","role":"concept","img":"/assets/vocab-images/concept-compare-and-order-integers.svg","lesson":"7-4"},{"term":"Number line","termEs":"Recta numérica","definition":"A straight line where numbers are placed in order; numbers get smaller to the left and larger to the right.","definitionEs":"Una recta donde los números se colocan en orden; los números son menores a la izquierda y mayores a la derecha.","visual":"←  -3  -2  -1   0   1   2   3  →","img":"/assets/vocab-images/number-line.svg","lesson":"7-4"},{"term":"Compare","termEs":"Comparar","definition":"To see if a number is bigger, smaller, or equal to another.","definitionEs":"Ver si un número es mayor, menor o igual que otro.","visual":"-3 \u003c 2 because -3 is farther left on the number line than 2","img":"/assets/vocab-images/inequality.svg","lesson":"7-4"},{"term":"Order","termEs":"Ordenar","definition":"To arrange numbers by size, from least to greatest or greatest to least.","definitionEs":"Acomodar números por tamaño, de menor a mayor o de mayor a menor.","visual":"Least to greatest: -5, -2, 0, 3, 7 (left to right on the number line)","img":"/assets/vocab-images/number-line.svg","lesson":"7-4"},{"term":"Greater than","termEs":"Mayor que","definition":"The > sign, showing one number is bigger.","definitionEs":"El signo >, que muestra que un número es mayor.","visual":"4 > -1 because 4 is to the right of -1 on the number line","img":"/assets/vocab-images/greater-than.svg","lesson":"7-4"},{"term":"Less than","termEs":"Menor que","definition":"The \u003c sign, showing one number is smaller.","definitionEs":"El signo \u003c, que muestra que un número es menor.","visual":"-6 \u003c -2 because -6 is farther left — it is farther from zero","img":"/assets/vocab-images/less-than.svg","lesson":"7-4"},{"term":"Negative integer","termEs":"Entero negativo","definition":"A whole number smaller than zero, like -5.","definitionEs":"Un número entero menor que cero, como -5.","visual":"-4 is 4 units to the LEFT of zero on the number line","img":"/assets/vocab-images/negative.svg","lesson":"7-4"},{"term":"Integer","termEs":"Número entero","definition":"Whole numbers and their opposites, like -2, -1, 0, 1, 2.","definitionEs":"Números enteros y sus opuestos, como -2, -1, 0, 1, 2.","visual":"..., -3, -2, -1, 0, 1, 2, 3, ...","img":"/assets/vocab-images/integer.svg","lesson":"7-4"},{"term":"Inequality","termEs":"Desigualdad","definition":"A statement that uses \u003c or > to compare two numbers.","definitionEs":"Un enunciado que usa \u003c o > para comparar dos números.","visual":"−9 \u003c −2 \u003c 0","img":"/assets/vocab-images/inequality.svg","lesson":"7-4"},{"term":"Graph on the Coordinate Plane","termEs":"Representar en el plano de coordenadas","definition":"Plot a point by moving horizontally to its x-coordinate and vertically to its y-coordinate.","definitionEs":"Ubicar un punto moviéndose horizontalmente hasta su coordenada x y verticalmente hasta su coordenada y.","visual":"For (3, −2), move right 3 and down 2.","role":"concept","img":"/assets/vocab-images/concept-graph-on-the-coordinate-plane.svg","lesson":"7-5"},{"term":"Coordinate plane","termEs":"Plano cartesiano","definition":"A grid with a line going across and a line going up to plot points.","definitionEs":"Una cuadrícula con una línea horizontal y una vertical para marcar puntos.","visual":"A grid with a horizontal line (x-axis) crossing a vertical line (y-axis), making four sections","img":"/assets/vocab-images/coordinate-plane.svg","lesson":"7-5"},{"term":"Ordered pair","termEs":"Par ordenado","definition":"Two numbers (x, y) that tell where a point is on a grid.","definitionEs":"Dos números (x, y) que dicen dónde está un punto en una cuadrícula.","visual":"(3, 5) means move right 3 from the origin, then up 5","img":"/assets/vocab-images/ordered-pair.svg","lesson":"7-5"},{"term":"Origin","termEs":"Origen","definition":"The point (0, 0) where the two grid lines cross.","definitionEs":"El punto (0, 0) donde se cruzan las dos líneas de la cuadrícula.","visual":"The starting point at the center where both axes cross — (0, 0)","img":"/assets/vocab-images/origin.svg","lesson":"7-5"},{"term":"Quadrant","termEs":"Cuadrante","definition":"One of the four parts of a coordinate grid, numbered I to IV.","definitionEs":"Una de las cuatro partes de una cuadrícula de coordenadas, numeradas I a IV.","visual":"I (+,+) top-right, II (-,+) top-left, III (-,-) bottom-left, IV (+,-) bottom-right","img":"/assets/vocab-images/quadrant.svg","lesson":"7-5"},{"term":"Reflection","termEs":"Reflexión","definition":"A flipped, mirror image across a line.","definitionEs":"Una imagen reflejada al otro lado de una línea.","visual":"(3, 2) reflected over the x-axis becomes (3, -2) — same x, opposite y","img":"/assets/vocab-images/reflection.svg","lesson":"7-5"},{"term":"x-coordinate","termEs":"Coordenada x","definition":"The first number in an ordered pair; how far right or left.","definitionEs":"El primer número de un par ordenado; cuánto hacia la derecha o la izquierda.","visual":"In (−3, 4), the x-coordinate is −3.","img":"/assets/vocab-images/ordered-pair.svg","lesson":"7-5"},{"term":"x-axis","termEs":"Eje x","definition":"The horizontal number line through the origin.","definitionEs":"La recta numérica horizontal que pasa por el origen.","visual":"Runs left and right.","img":"/assets/vocab-images/axis.svg","lesson":"7-5"},{"term":"y-axis","termEs":"Eje y","definition":"The vertical number line through the origin.","definitionEs":"La recta numérica vertical que pasa por el origen.","visual":"Runs up and down.","img":"/assets/vocab-images/axis.svg","lesson":"7-5"},{"term":"Distance on the Coordinate Plane","termEs":"Distancia en el plano de coordenadas","definition":"The nonnegative distance between points, found from the absolute difference of coordinates on a horizontal or vertical line.","definitionEs":"La distancia no negativa entre puntos, que se halla con la diferencia absoluta de las coordenadas en una línea horizontal o vertical.","visual":"From (−2, 3) to (5, 3): |5 − (−2)| = 7 units.","role":"concept","img":"/assets/vocab-images/concept-distance-on-the-coordinate-plane.svg","lesson":"7-6"},{"term":"Distance","termEs":"Distancia","definition":"How far apart two points are. It is never negative.","definitionEs":"Qué tan separados están dos puntos. Nunca es negativo.","visual":"The distance from -3 to 4 on a number line is |-3| + |4| = 3 + 4 = 7 units","img":"/assets/vocab-images/distance.svg","lesson":"7-6"},{"term":"Absolute value","termEs":"Valor absoluto","definition":"How far a number is from zero. It is never negative.","definitionEs":"Qué tan lejos está un número de cero. Nunca es negativo.","visual":"|-3| = 3 and |4| = 4; to find distance: |4 - (-3)| = 7","img":"/assets/vocab-images/absolute-value.svg","lesson":"7-6"},{"term":"Horizontal distance","termEs":"Distancia horizontal","definition":"How far apart two points are going left or right.","definitionEs":"Qué tan separados están dos puntos yendo a la izquierda o a la derecha.","visual":"From (-2, 3) to (5, 3): count from -2 to 5 = 7 units across","img":"/assets/vocab-images/distance.svg","lesson":"7-6"},{"term":"Vertical distance","termEs":"Distancia vertical","definition":"How far apart two points are going up or down.","definitionEs":"Qué tan separados están dos puntos yendo hacia arriba o hacia abajo.","visual":"From (4, -1) to (4, 6): count from -1 to 6 = 7 units up","img":"/assets/vocab-images/distance.svg","lesson":"7-6"}]</script>
<script type="application/json" id="gn-easy">{"v":1,"map":{"Lessons 7-4, 7-5 & 7-6 — part of the Below Zero arc. four quadrants · distance · polygons · 6.NOS.C.6/8 · 6.GR.A.3. Read straight through: each reader gate coaches you with hints and a worked example, but never blocks the page.":"Lessons 7-4, 7-5 &amp; 7-6. Part of the \u003cb>Below Zero\u003c/b> arc. four quadrants · distance · polygons · 6.NOS.C.6/8 · 6.GR.A.3. Read it all the way. Each gate gives hints and a worked example. It does not stop you.","Episode 3. Same crew, same city — one focused stretch of the case. Turn the page when you're ready.":"Episode 3. Same crew. Same city. One part of the case. Turn the page when you are set.","Ada's map cuts the city into four quadrants — counterclockwise from the upper right: I, II, III, IV.":"Ada's map cuts the city into four \u003cb>quadrants\u003c/b>. Start at the upper right. Go counterclockwise: I, II, III, IV.","Every station is an ordered pair (x, y): blocks east–west first, then north–south. (2, 5) is NOT (5, 2).":"Each station is an \u003cb>ordered pair\u003c/b> (x, y). East–west goes first. Then north–south. (2, 5) is NOT (5, 2).","Two relays must light next: (−3, 2) and (4, −1). But the blackout scrambled my map — five dots flicker, and only two are real.":"Two relays must light next: (−3, 2) and (4, −1). But the blackout mixed up my map. Five dots blink. Just two are real.","An ordered pair (x, y) locates a point: x first (left–right), then y (up–down).":"An \u003cb>ordered pair\u003c/b> (x, y) finds a point. x is first (left–right). Then y (up–down).","Read the pairs carefully, reader. Light the wrong relay and we waste the power we have.":"Read the pairs with care, reader. Light the wrong relay and we waste our power.","Five dots flicker on Ada's map, but only the relays at (−3, 2) and (4, −1) are real. Tap to light exactly those two (tap again to switch off). Then name their quadrants.":"Five dots blink on Ada's map. Just the relays at \u003cb>(−3, 2)\u003c/b> and \u003cb>(4, −1)\u003c/b> are real. Tap to light \u003cb>exactly those two\u003c/b>. Tap again to turn one off. Then name their quadrants.","Conceptual: an ordered pair is (x, y). The first number moves you left (negative) or right (positive) from the origin; the second moves you down (negative) or up (positive).":"Conceptual: an ordered pair is (x, y). Start at the origin. The first number goes left (negative) or right (positive). The second goes down (negative) or up (positive).","Procedural: walk each pair: for (−1, 4) you'd go 1 block left, then 4 blocks up. Quadrants count counterclockwise from the upper right: I, then II, then III, then IV.":"Procedural: walk each pair. For (−1, 4), go 1 block left. Then go 4 blocks up. Quadrants go counterclockwise from the upper right: I, then II, then III, then IV.","Cable time. Even elevation runs below zero down here — the old platform sits at −6 meters.":"Cable time. Down here, the ground is below zero too. The old platform is at −6 meters.","And cable doesn't stretch. We count exact blocks between stations. No guessing.":"And cable does not stretch. We count the exact blocks. No guessing.","Two runs tonight: across Fourth Street from (−3, 4) to (5, 4), and down Second Avenue from (2, −1) to (2, −6).":"Two runs tonight. Across Fourth Street, from (−3, 4) to (5, 4). Down Second Avenue, from (2, −1) to (2, −6).","When two points share a coordinate, the path between them is straight — measure it with absolute values.":"Two points can share a coordinate. Then the path between them is straight. Measure it with absolute values.","Measure both cable runs in blocks. Cable A: (−3, 4) to (5, 4). Cable B: (2, −1) to (2, −6). Count exactly — Priya cuts once.":"Measure both cable runs in blocks. \u003cb>Cable A\u003c/b>: (−3, 4) to (5, 4). \u003cb>Cable B\u003c/b>: (2, −1) to (2, −6). Count with care. Priya cuts just once.","Conceptual: when two points share a coordinate, the cable runs straight. If the changing numbers sit on OPPOSITE sides of zero, ADD their absolute values. Same side of zero? SUBTRACT them.":"Conceptual: the two points share a coordinate. So the cable runs straight. Look at the numbers that change. Are they on OPPOSITE sides of zero? ADD their absolute values. Same side of zero? SUBTRACT them.","Procedural: like (−4, 1) to (2, 1): x crosses zero, so |−4| + |2| = 6 blocks. Like (7, −2) to (7, −9): same side, so 9 − 2 = 7 blocks.":"Procedural: take (−4, 1) to (2, 1). x crosses zero, so |−4| + |2| = 6 blocks. Take (7, −2) to (7, −9). Same side, so 9 − 2 = 7 blocks.","Midnight. One move left: ring the engine district with cable, and the whole grid relights.":"Midnight. One move left. Ring the engine's part of town with cable. Then the whole grid lights up.","The Light Ring: a rectangle of cable through four corner relays. I can sense its shape. You must measure it.":"The Light Ring is a rectangle of cable. It goes through four corner relays. I sense its shape. You must measure it.","Width, height, then total cable. Three locks, one ring. Reader — bring us home.":"Width, height, then all the cable. Three locks, one ring. Reader, get us home.","Boss Gate: distances on the plane, plus the perimeter of a polygon drawn on the grid.":"Boss Gate: find distances on the plane. Then find the perimeter of a grid polygon.","BOSS GATE. Three locks. The city is watching. (The city is also freezing.)":"BOSS GATE. Three locks. The city is watching. (The city is cold, too.)","The ring's corner relays: (−4, −2), (3, −2), (3, 3), (−4, 3). Open all three locks to close the circuit:":"The ring's corner relays: \u003cb>(−4, −2), (3, −2), (3, 3), (−4, 3)\u003c/b>. Open all three locks to close the ring:","Total cable to close the ring (perimeter):":"All the cable to close the ring (perimeter):","Conceptual: a side's length is the distance between the coordinates that CHANGE. If they sit on opposite sides of zero, add the two distances. The perimeter is the full trip around all four sides.":"Conceptual: look at the coordinates that CHANGE. A side's length is the distance between them. Are they on opposite sides of zero? Then add the two distances. The perimeter is the trip around all four sides.","Procedural: a side from x = −2 to x = 6 crosses zero: 2 + 6 = 8 blocks. Perimeter shortcut: 2 × (width + height).":"Procedural: a side from x = −2 to x = 6 crosses zero. So 2 + 6 = 8 blocks. Perimeter short cut: 2 × (width + height).","Quadrant by quadrant — look at it glow!":"Quadrant by quadrant. Look at it glow!","Twenty-four blocks of cable, zero slack. Co-led, counted, confirmed.":"Twenty-four blocks of cable. Not one extra. We led, counted, and checked.","Achievement unlocked: city un-frozen. Hot cocoa speedrun starts now.":"The city is warm again! Hot cocoa race starts now.","New distortion below city hall. A door shaped like a balance scale. It wants things EQUAL. To be continued…":"A new distortion! It is under city hall. Its door is like a balance scale. It wants things EQUAL. To be continued…","The full story — Below Zero — is glowing at the city gate. — A.V.":"The full story is \u003cb>Below Zero\u003c/b>. It waits at the gate. — A.V.","completed Unit 7 · Episode 3: The Grid Map in the Below Zero arc, and proved mastery over four quadrants · distance · polygons · 6.NOS.C.6/8 · 6.GR.A.3.":"finished \u003cb>Unit 7 · Episode 3: The Grid Map\u003c/b>. It is part of the Below Zero arc. They know four quadrants, distance, and polygons. 6.NOS.C.6/8 · 6.GR.A.3.","Next up: the full anchor volume — Below Zero.":"Next up: the full book. Below Zero.","Plot (−2, −5): start at the origin (0, 0).":"\u003cspan>Plot (−2, −5). Start at the origin (0, 0).\u003c/span>","x = −2 → walk two blocks LEFT. y = −5 → walk five blocks DOWN.":"\u003cspan>x = −2 → walk two blocks LEFT. y = −5 → walk five blocks DOWN.\u003c/span>","Left and down lands in Quadrant III — that's where both signs are negative.":"\u003cspan>Left and down is Quadrant III. There, both signs are negative.\u003c/span>","Your turn — same idea, different numbers:":"Your turn. Same idea, new numbers:","A point has positive x and negative y. Which quadrant number, 1–4?":"A point has positive x and negative y. Which quadrant is it in, 1–4?","Measure (−6, 3) to (3, 3): the y-values match, so the run is sideways.":"\u003cspan>Measure (−6, 3) to (3, 3). The y-values match. So the run goes side to side.\u003c/span>","x goes from −6 to 3 — opposite sides of zero — so add the distances: |−6| + |3| = 9 blocks.":"\u003cspan>x goes from −6 to 3. Those are opposite sides of zero. So add the distances: |−6| + |3| = 9 blocks.\u003c/span>","Now (4, −1) to (4, −7): both y-values are below zero — same side — so subtract: 7 − 1 = 6 blocks.":"\u003cspan>Now (4, −1) to (4, −7). Both y-values are below zero. Same side. So subtract: 7 − 1 = 6 blocks.\u003c/span>","How far is (−2, 0) from (7, 0)?":"How far is (−2, 0) from (7, 0)?","A smaller ring has corners (−1, −2), (3, −2), (3, 1), (−1, 1).":"\u003cspan>A small ring has corners (−1, −2), (3, −2), (3, 1), (−1, 1).\u003c/span>","Width: x runs from −1 to 3, crossing zero → 1 + 3 = 4. Height: y runs from −2 to 1 → 2 + 1 = 3.":"\u003cspan>Width: x goes from −1 to 3. It crosses zero → 1 + 3 = 4. Height: y goes from −2 to 1 → 2 + 1 = 3.\u003c/span>","Cable needed = perimeter = 2 × (4 + 3) = 14 blocks.":"\u003cspan>Cable we need = perimeter = 2 × (4 + 3) = 14 blocks.\u003c/span>","A grid rectangle is 6 wide and 3 tall. How much cable rings it?":"A grid rectangle is 6 wide and 3 tall. How much cable goes around it?","Check the signs: in (−3, 2), the −3 means 3 blocks LEFT of the engine, not right.":"Check the signs. In (−3, 2), the −3 means 3 blocks LEFT of the engine. Not right.","The second number is the up–down move: (−3, 2) climbs UP 2 — it doesn't drop down.":"The second number is the up–down move. (−3, 2) goes UP 2. It does not go down.","Re-walk each pair from the origin: left–right first, then up–down.":"Walk each pair again from the origin. Left–right first. Then up–down.","Relays lit! Now the quadrants — count counterclockwise from the upper right: I, II, III, IV.":"Relays lit! Now the quadrants. Go counterclockwise from the upper right: I, II, III, IV.","(−3, 2) glows in Quadrant II and (4, −1) in Quadrant IV — relays linked across the city!":"(−3, 2) glows in Quadrant II. (4, −1) glows in Quadrant IV. The relays link across the city!","Cable A crosses x = 0 — don't subtract straight across zero. Add each end's distance from the y-axis.":"Cable A crosses x = 0. Do not subtract across zero. Add each end's distance from the y-axis.","Cable A runs sideways: only the x-numbers change. Count the blocks between them.":"Cable A runs side to side. Just the x-numbers change. Count the blocks between them.","Both y-values sit on the SAME side of zero — subtract the smaller distance from the bigger one.":"Both y-values: SAME side of zero. Subtract the smaller distance from the bigger one.","Cable B runs up–down: only the y-numbers change. Count carefully below zero.":"Cable B runs up–down. Just the y-numbers change. Count with care below zero.","8 blocks across, 5 blocks down — both cables measured with zero slack!":"8 blocks across, 5 blocks down. Both cables fit just right!","Lock 1 holds. Width: x runs from −4 to 3 — opposite sides of zero, so ADD each end's distance from the y-axis.":"Lock 1 holds. Width: x goes from −4 to 3. Those are opposite sides of zero. So ADD each end's distance from the y-axis.","Lock 2 holds. Height: y runs from −2 up to 3 — opposite sides again. Add the distances.":"Lock 2 holds. Height: y goes from −2 up to 3. Opposite sides again. Add the distances.","Lock 3 holds. 35 is the AREA inside the ring — the cable runs around the EDGE. Add all four sides.":"Lock 3 holds. 35 is the AREA inside the ring. The cable goes around the EDGE. Add all four sides.","Lock 3 holds. That's one width plus one height — the ring needs BOTH widths and BOTH heights.":"Lock 3 holds. That is one width plus one height. The ring needs BOTH widths and BOTH heights.","Lock 3 holds. Perimeter is the whole trip around: width + height + width + height.":"Lock 3 holds. Perimeter is the whole trip around: width + height + width + height.","ALL LOCKS OPEN. 24 blocks of cable close the ring — the Light Ring blazes and Axiom City relights, quadrant by quadrant!":"ALL LOCKS OPEN. 24 blocks of cable close the ring. The Light Ring blazes! Axiom City lights up, quadrant by quadrant!","Yes! Now head back and open that gate.":"Yes! Now go back and open that gate.","Walk the steps above again — you've got this.":"Read the steps above again. You can do this."}}</script>
