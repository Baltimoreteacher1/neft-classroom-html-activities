g1:{ title:"Gate 1 · The Splitting Floor", icon:"#sig-table",
  prompt:`Share each pile into equal stacks with long division. Watch the middle digit — if the divisor won't go, the quotient needs a <b>0</b>. <b>618 ÷ 6</b> and <b>824 ÷ 4</b>.`,

          "Procedural: 618 ÷ 6 → 6 into 6 is 1; 6 into 1 is 0 (write it!), bring down 8; 6 into 18 is 3 → 103. 824 ÷ 4 → 4 into 8 is 2; 4 into 2 is 0, bring down 4; 4 into 24 is 6 → 206." ],
  worked:{ steps:[ "Different pile: 728 ÷ 7.",
    "7 into 7 is 1. 7 into 2 is 0 — write the 0 and bring down the 8.",
    "7 into 28 is 4. Quotient: 728 ÷ 7 = 104. The middle 0 keeps every digit in its place." ],
    q:"Divide: 624 ÷ 6 = ?", a:"104" },
  render(body,api){
    body.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font:700 .9rem 'Segoe UI'">618 ÷ 6 = </span><input class="numin" id="dA" inputmode="numeric" aria-label="618 divided by 6"></div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font:700 .9rem 'Segoe UI'">824 ÷ 4 = </span><input class="numin" id="dB" inputmode="numeric" aria-label="824 divided by 4"></div></div>`;
    api.onCheck(()=>{const g=id=>parseFloat(body.querySelector(id).value);
      const a=g("#dA"),b=g("#dB");const ok1=a===103,ok2=b===206;
      body.querySelector("#dA").className="numin "+(ok1?"ok":"no");
      body.querySelector("#dB").className="numin "+(ok2?"ok":"no");
      if(ok1&&ok2)return api.pass("103 coins per stack and 206 — every digit in its place, zeros and all. The floor is split fair.");
      if(a===13)return api.fail("13 drops the middle zero. 6 goes into the first 6 once; the next digit (1) is too small for 6, so write a 0 before bringing down the 8. 618 ÷ 6 = 103.");
      if(b===26)return api.fail("26 drops the middle zero. 4 goes into 8 twice; the next digit (2) is too small for 4, so write a 0, then bring down the 4. 824 ÷ 4 = 206.");
      if(!ok1)return api.fail("First pile: check by multiplying back — your answer times 6 must give 618. Mind the tens place; it needs a 0.");
      return api.fail("Second pile: your answer times 4 must give 824. Don't skip the 0 in the tens place.");});
  }},
g2:{ title:"Gate 2 · The Price Tags", icon:"#sig-tag",
  prompt:`Ring up each price. Multiply the digits, then count the decimal places in BOTH factors. <b>0.4 × 0.7</b> and <b>0.25 × 0.3</b>.`,

    q:"Multiply: 0.2 × 0.4 = ?", a:"0.08" },

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font:700 .9rem 'Segoe UI'">0.25 × 0.3 = </span><input class="numin" id="mB" inputmode="decimal" aria-label="0.25 times 0.3"></div></div>`;

boss:{ title:"BOSS GATE · Close the Books", icon:"#sig-boss",
  prompt:`Audit the night in three lines. <b>LOCK 1</b> split the take; <b>LOCK 2</b> price the bag for real; <b>LOCK 3</b> divide to expose Bram's $16.00.`,

      const ok2=b===1.6;
      body.querySelector("#bB").className="numin "+(ok2?"ok":"no");
      if(b===16)return api.fail("Lock 2 holds — and $16 is exactly the lie we're chasing! 3.20 is 3.2, so 3.2 × 0.5: 32 × 5 = 160, then place 1 + 1 = 2 decimals → $1.60, not $16.00.");
      if(b===160)return api.fail("Lock 2 holds. 32 × 5 = 160, but you skipped placing the decimal — two places → $1.60.");
      if(!ok2)return api.fail("Lock 2 holds. 0.5 × 3.2 (3.20 is 3.2): multiply 5 × 32 = 160, then place 1 + 1 = 2 decimals → 1.60.");
      const ok3=c===5;
      body.querySelector("#bC").className="numin "+(ok3?"ok":"no");
      if(c===0.5)return api.fail("0.5 kg is what the bag SHOULD weigh — but Lock 3 asks what he BILLED. Divide his charge: 16.00 ÷ 3.20 → 160 ÷ 32 = 5 kg.");
      if(c===50)return api.fail("50 is ten times too big — slide both decimals ONE place, not two: 160 ÷ 32 = 5.");
      if(!ok3)return api.fail("Lock 3 holds. Make 3.20 whole: 16.00 ÷ 3.20 → 160 ÷ 32 = 5 kg billed.");
      api.pass("ALL LOCKS OPEN. $86 a seller, a $1.60 bag — but Bram BILLED 5 kg of caramel, not 0.5. One slipped decimal overcharged the whole market ten-fold. Books balanced.");});
  }}
};

<script>

"use strict";
/* ---------- storage (exact wrapper, ewl_ prefix) ---------- */
const storage={_m:{},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){this._m[k]=v}},get(k,d=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return this._m[k]??d}}};
const K=s=>`ewl_axiom_${VOLUME.slug}_${s}`;

const $=s=>document.querySelector(s);
const live=msg=>{$("#live").textContent=msg};
const reducedMQ=matchMedia("(prefers-reduced-motion: reduce)");
const mobileMQ=matchMedia("(max-width: 820px)");

const prefs=Object.assign({sound:false,motion:true,bigtext:false,hc:false},storage.get(K("prefs"))||{});
let solved=new Set(storage.get(K("gates"))||[]);
let page=storage.get(K("page"))||0;            // index of left/visible page
let turning=false;
const attempts={};

/* ---------- audio (Web Audio oscillators only, muted default) ---------- */
let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return actx}
function tone(f,t,dur,type="square",vol=.04){const c=ac();if(!c||!prefs.sound)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+dur+.02)}
const SND={blip(){tone(660,0,.07)},flip(){tone(220,0,.09,"triangle",.05);tone(330,.05,.08,"triangle",.04)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.09,.14,"triangle",.05))},thud(){tone(110,0,.18,"sawtooth",.05)}};

/* ---------- helpers ---------- */
function gateLockIcon(open){return `<div class="gatelockcorner ${open?"open":""}" aria-hidden="true"><svg viewBox="0 0 100 100" style="color:#fff"><use href="${open?"#sig-open":"#sig-lock"}"/></svg></div>`}

function pageInnerHTML(i){
  if(i==null||i<0||i>=PAGES.length) return `<div class="page-inner" style="align-items:center;justify-content:center"><div class="kicker" style="opacity:.4">AXIOM CITY</div></div><div class="pagefoot"><span></span><span></span></div>`;
  const p=PAGES[i];
  const gateHTML=p.gate?`<div class="gatemount" data-gate="${p.gate}"></div>`:"";
  const lock=p.gate?gateLockIcon(solved.has(p.gate)):"";
  return `${lock}<div class="chapterband">${p.ch.replace("·","· <em>").concat(p.ch.includes("·")?"</em>":"")}</div><div class="page-inner">${p.html}${gateHTML}</div><div class="pagefoot"><span>${VOLUME.unit}</span><span>PAGE ${i+1} / ${PAGES.length}</span></div>`;
}

/* ---------- gate framework ---------- */
function mountGates(scope){
  scope.querySelectorAll(".gatemount").forEach(m=>{
    const id=m.dataset.gate,G=GATES[id];
    if(!G)return;
    if(solved.has(id)){m.innerHTML=`<div class="gatesolved"><span class="stamp">SOLVED</span> ${G.title} — badge earned.</div>`;return}
    m.innerHTML=`<div class="gatebox"><header><svg class="gicon" viewBox="0 0 100 100"><use href="${G.icon}"/></svg><h3>${G.title}</h3></header>
      <div class="gatebody"><div class="gateprompt">${G.prompt}</div><div class="gwidget"></div>
      <div class="gatehint" hidden></div>
      <button class="gatecheck">CHECK</button>
      <div class="gatefeedback" aria-live="polite"></div></div></div>`;
    const box=m.querySelector(".gatebox"),body=m.querySelector(".gwidget"),fb=m.querySelector(".gatefeedback"),hint=m.querySelector(".gatehint"),btn=m.querySelector(".gatecheck");
    let checker=null;
    const api={
      sound:n=>SND[n]&&SND[n](),
      onCheck(fn){checker=fn},
      fail(msg){
        attempts[id]=(attempts[id]||0)+1;SND.thud();mkfeed(fb,msg,false);
        const n=attempts[id];
        if(n===1){hint.hidden=false;hint.innerHTML="💡 <b>Hint:</b> "+G.hints[0]}
        else if(n===2){hint.hidden=false;hint.innerHTML="🧭 <b>Hint 2:</b> "+G.hints[1]}
        else if(n>=3&&!hint.querySelector(".askvex")){
          const b=document.createElement("button");b.className="gatecheck askvex";b.style.marginTop="8px";b.textContent="ASK VEX — WORKED EXAMPLE";
          b.addEventListener("click",()=>openWorked(G));hint.appendChild(b);
        }
        live("Not yet. "+msg);
      },
      pass(msg){
        solved.add(id);storage.set(K("gates"),[...solved]);SND.win();
        m.innerHTML=`<div class="gatesolved unlockflash"><span class="stamp">SOLVED</span> ${msg}</div>`;
        const corner=m.closest(".page,#pageL,#pageR")?.querySelector(".gatelockcorner");
        if(corner){corner.classList.add("open");corner.innerHTML=`<svg viewBox="0 0 100 100" style="color:#fff"><use href="#sig-open"/></svg>`}
        earnBadge(id);updateNav();live("Gate solved! "+msg);
      }
    };
    G.render(body,api);
    btn.addEventListener("click",()=>{ac();checker&&checker()});
  });
}
function openWorked(G){
  $("#workedBody").innerHTML=`<div class="workedsteps">${G.worked.steps.map((s,i)=>`<div class="st"><b class="n">${i+1}</b><span>${s}</span></div>`).join("")}</div>
    <div class="caption">Your turn — same idea, different numbers:</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font:600 .92rem 'Segoe UI'">${G.worked.q}</span>
    <input class="numin" id="wkin" aria-label="worked example answer"><button class="gatecheck" id="wkgo">CHECK</button></div>
    <div class="gatefeedback" id="wkfb" aria-live="polite"></div>`;
  $("#workedModal").classList.add("open");
  $("#wkgo").addEventListener("click",()=>{
    const v=($("#wkin").value||"").trim().replace(/\s+/g,"");
    if(v===G.worked.a||parseFloat(v)===parseFloat(G.worked.a)){
      mkfeed($("#wkfb"),"Yes! Now head back and open that gate.",true);SND.win();
      setTimeout(()=>$("#workedModal").classList.remove("open"),1100);
    }else{mkfeed($("#wkfb"),"Walk the steps above again — you've got this.",false);SND.thud()}
  });
}

/* ---------- badges ---------- */
function buildBadges(){
  $("#badges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"earned":""}" id="badge-${b.id}" title="${b.label}" role="img" aria-label="${b.label}${solved.has(b.id)?" — earned":" — locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
}
function earnBadge(id){buildBadges();const el=$("#badge-"+id);if(el){el.classList.remove("earned");void el.offsetWidth;el.classList.add("earned")}const b=BADGES.find(x=>x.id===id);if(b)live("Badge earned: "+b.label)}

/* ---------- progress ---------- */
function buildProgress(){$("#progress").innerHTML=PAGES.map((_,i)=>`<span class="dot ${i<=page?"on":""}"></span>`).join("")}

/* ---------- navigation & rendering ---------- */
const isMobile=()=>mobileMQ.matches;
function leftIndex(){return isMobile()?page:page-(page%2)}
function visiblePages(){return isMobile()?[page]:[leftIndex(),leftIndex()+1].filter(i=>i<PAGES.length)}
function blockedBy(){return null/* locks removed: gates still teach via hints + Ask VEX worked examples, but never block turning the page (Neft 2026-06-11) */}

function renderSpread(){
  const L=$("#pageL"),R=$("#pageR");
  if(isMobile()){L.innerHTML=pageInnerHTML(page);L.classList.remove("offscreen");R.classList.add("offscreen");R.innerHTML="";mountGates(L)}
  else{const li=leftIndex();L.innerHTML=pageInnerHTML(li);R.innerHTML=pageInnerHTML(li+1<PAGES.length?li+1:null);L.classList.remove("offscreen");R.classList.remove("offscreen");mountGates(L);mountGates(R)}
  buildProgress();updateNav();updateEdges();
  if(PAGES[page])live(`Page ${page+1} of ${PAGES.length}. ${PAGES[page].ch}.`);
  storage.set(K("page"),page);
  if($("#certName")){$("#certName").value=storage.get(K("name"))||"";$("#certName").addEventListener("input",e=>storage.set(K("name"),e.target.value));
    $("#certBadges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"":"locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
    $("#printCert").addEventListener("click",()=>{document.body.classList.add("print-cert");window.print();setTimeout(()=>document.body.classList.remove("print-cert"),400)});}
}
function updateEdges(){const f=page/Math.max(1,PAGES.length-1);$("#edgesL").style.width=(4+f*12)+"px";$("#edgesR").style.width=(16-f*12)+"px"}
function updateNav(){
  $("#prevBtn").disabled=page<=0||turning;
  const lastVisible=Math.max(...visiblePages());
  const end=lastVisible>=PAGES.length-1;
  const blocked=blockedBy();
  $("#nextBtn").disabled=end||turning;
  $("#nextBtn").classList.toggle("locked",!!blocked&&!end);
  $("#nextBtn").innerHTML=blocked&&!end?"🔒":"›";
  $("#nextBtn").setAttribute("aria-label",blocked?"Locked — solve the gate on this page to continue":"Next page");
}
function step(dir){
  if(turning)return;
  if(dir>0){
    const blocked=blockedBy();
    if(blocked){const G=GATES[blocked];SND.thud();$("#nextBtn").classList.add("shake");setTimeout(()=>$("#nextBtn").classList.remove("shake"),700);
      live("This page is gated. Solve "+G.title+" to continue.");
      const gb=document.querySelector(".gatebox");if(gb){gb.classList.add("unlockflash");setTimeout(()=>gb.classList.remove("unlockflash"),1000)}
      return}
    const lastVisible=Math.max(...visiblePages());
    if(lastVisible>=PAGES.length-1)return;
    const target=isMobile()?page+1:leftIndex()+2;
    animTurn(1,target);
  }else{
    if(page<=0)return;
    const target=isMobile()?page-1:Math.max(0,leftIndex()-2);
    animTurn(-1,target);
  }
}
function animTurn(dir,target){
  if(isMobile()||reducedMQ.matches||!prefs.motion){page=target;renderSpread();SND.flip();return}
  turning=true;SND.flip();
  const sheet=$("#turnSheet"),front=sheet.querySelector(".ts.front"),back=sheet.querySelector(".ts.back");
  const oldL=leftIndex();
  if(dir>0){
    front.innerHTML=pageInnerHTML(oldL+1<PAGES.length?oldL+1:null);
    back.innerHTML=pageInnerHTML(target<PAGES.length?target:null);
    page=target;
    /* underneath: left stays old-left, right becomes new-right */
    $("#pageR").innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    sheet.className="";sheet.classList.add("show","fwd");
  }else{
    front.innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    back.innerHTML=pageInnerHTML(oldL);
    page=target;
    $("#pageL").innerHTML=pageInnerHTML(target);
    sheet.className="";sheet.classList.add("show","back");
  }
  const done=()=>{sheet.classList.remove("show","fwd","back");sheet.removeEventListener("animationend",done);turning=false;renderSpread()};
  sheet.addEventListener("animationend",done);
  setTimeout(()=>{if(turning){done()}},1000);
}

/* ---------- parallax ---------- */
let rafPending=false,px=0,py=0;
function applyParallax(){
  rafPending=false;
  if(!prefs.motion||reducedMQ.matches)return;
  document.querySelectorAll("#spreadWrap .panel3d").forEach(p=>{
    p.style.transform=`rotateY(${px*4}deg) rotateX(${-py*3}deg)`;
    p.querySelectorAll("[data-depth]").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d*.6}px,${py*d*.35}px)`});
  });
}
addEventListener("pointermove",e=>{
  px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2;
  if(!rafPending){rafPending=true;requestAnimationFrame(applyParallax)}
  const cc=$("#coverCard");
  if(cc&&!$("#cover").hidden&&prefs.motion&&!reducedMQ.matches){
    cc.style.transform=`rotateY(${px*9}deg) rotateX(${-py*7}deg)`;
    cc.querySelectorAll(".cov-layer").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d}px,${py*d*.6}px)`});
  }
},{passive:true});

/* note: SVG <g data-depth> transform via style works in modern browsers (SVG2). Wrapped above for safety. */

/* ---------- HUD toggles ---------- */
function syncToggles(){
  $("#sndBtn").setAttribute("aria-pressed",prefs.sound);$("#sndBtn").textContent=prefs.sound?"🔊 Sound":"🔇 Sound";
  $("#motBtn").setAttribute("aria-pressed",prefs.motion);$("#motBtn").textContent=prefs.motion?"3D On":"3D Off";

  $("#hcBtn").setAttribute("aria-pressed",prefs.hc);document.body.classList.toggle("hc",prefs.hc);
  if(!prefs.motion)document.querySelectorAll(".panel3d").forEach(p=>p.style.transform="");

}

$("#txtBtn").addEventListener("click",()=>{prefs.bigtext=!prefs.bigtext;syncToggles()});

/* ---------- teacher panel ---------- */
function buildTeacher(){
  $("#teacherBody").innerHTML=`
    <p style="font:600 .9rem/1.45 'Segoe UI'">${VOLUME.unit} — interactive graphic novel. Story pauses at six <b>reader gates</b>; students must solve grade-level math problems to continue. Progress, badges, and settings persist per device.</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">SUGGESTED USE</h3>
    <p style="font:600 .88rem/1.45 'Segoe UI'">${TEACHER.suggested}</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">STANDARDS ALIGNMENT (CCSS)</h3>
    <table class="tt"><tr><th>Standard</th><th>Description</th><th>Where</th></tr>
    ${TEACHER.standards.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">ANSWER KEY</h3>
    <table class="tt"><tr><th>Gate</th><th>Answer &amp; notes</th></tr>
    ${TEACHER.answers.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</table>
    <p style="font:600 .8rem/1.4 'Segoe UI';color:#666">Hints escalate: conceptual → procedural → VEX worked example (parallel problem; never reveals the gate answer). Sound is off by default. 3D motion can be disabled (auto-disabled for reduced-motion users). © EduWonderLab — single-file, offline-safe, no data leaves the device.</p>`;
}
$("#teacherBtn").addEventListener("click",()=>{buildTeacher();$("#teacherModal").classList.add("open")});
$("#printTeacher").addEventListener("click",()=>{document.body.classList.add("print-teacher");window.print();setTimeout(()=>document.body.classList.remove("print-teacher"),400)});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest(".modal").classList.remove("open")));

/* ---------- input ---------- */
$("#nextBtn").addEventListener("click",()=>{ac();step(1)});
$("#prevBtn").addEventListener("click",()=>{ac();step(-1)});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){$("#teacherModal").classList.remove("open");return}
  if($(".modal.open"))return;
  if(["ArrowRight","PageDown"].includes(e.key))step(1);
  if(["ArrowLeft","PageUp"].includes(e.key))step(-1);
});
let tx=null;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60&&!$(".modal.open"))step(dx<0?1:-1);tx=null},{passive:true});
mobileMQ.addEventListener("change",()=>renderSpread());

/* ---------- boot ---------- */
function openBook(){
  $("#cover").hidden=true;$("#hud").hidden=false;$("#stage").hidden=false;
  $("#prevBtn").hidden=false;$("#nextBtn").hidden=false;
  renderSpread();
}
$("#startBtn").addEventListener("click",()=>{ac();page=0;openBook()});
$("#resumeBtn").addEventListener("click",()=>{ac();openBook()});
if((storage.get(K("page"))||0)>0||solved.size>0){$("#resumeBtn").hidden=false}
if(reducedMQ.matches){prefs.motion=false}
document.body.classList.toggle("reduced",reducedMQ.matches);
buildBadges();syncToggles();buildProgress();
</script>

<script type="application/json" id="gn-vocab">[{"term":"Algorithm","termEs":"Algoritmo","definition":"A step-by-step set of rules or instructions to solve a math problem.","definitionEs":"Un conjunto de pasos o instrucciones para resolver un problema de matemáticas.","img":"/assets/vocab-images/concept-long-division.svg","lesson":"2-6"},{"term":"Dividend","termEs":"Dividendo","definition":"The total number being divided into equal groups (the number inside the division bracket).","definitionEs":"El número total que se divide en grupos iguales (el número dentro de la galera de división).","visual":"In 1,344 ÷ 12 = 112, the dividend is 1,344 — the total amount being divided","img":"/assets/vocab-images/dividend.svg","lesson":"2-6"},{"term":"Divisor","termEs":"Divisor","definition":"The number of equal groups you are dividing into (the number outside the division bracket).","definitionEs":"El número de grupos iguales en que divides (el número fuera de la galera de división).","visual":"In 1,344 ÷ 12 = 112, the divisor is 12 — the number of equal groups","img":"/assets/vocab-images/divisor.svg","lesson":"2-6"},{"term":"Quotient","termEs":"Cociente","definition":"The answer when you divide.","definitionEs":"La respuesta cuando divides.","visual":"In 156 ÷ 12 = 13, the quotient is 13 — there are 13 groups","img":"/assets/vocab-images/quotient.svg","lesson":"2-6"},{"term":"Remainder","termEs":"Residuo","definition":"What is left over when a number does not divide evenly.","definitionEs":"Lo que sobra cuando un número no se divide de forma exacta.","visual":"17 ÷ 5 = 3 R 2 means 3 groups of 5 with 2 left over","img":"/assets/vocab-images/remainder.svg","lesson":"2-6"},{"term":"Divide Multi-Digit Numbers","termEs":"Dividir números de varias cifras","definition":"Separate a multi-digit number into equal groups to find a quotient.","definitionEs":"Separar un número de varias cifras en grupos iguales para hallar un cociente.","visual":"1,344 ÷ 12 = 112","img":"/assets/vocab-images/concept-divide-multi-digit-numbers.svg","lesson":"2-6"},{"term":"Long division","termEs":"División larga","definition":"A method that repeats four steps — divide, multiply, subtract, bring down — until there are no digits left to bring down.","definitionEs":"Un método que repite cuatro pasos — divide, multiplica, resta, baja — hasta que no quedan dígitos por bajar.","visual":"1,344 ÷ 12 → divide, multiply, subtract, bring down, repeat","img":"/assets/vocab-images/concept-long-division.svg","lesson":"2-6"},{"term":"Bring down","termEs":"Bajar el dígito","definition":"The fourth step of long division: move the next digit of the dividend down next to what is left, then start the cycle again.","definitionEs":"El cuarto paso de la división larga: baja el siguiente dígito del dividendo junto a lo que sobró y vuelve a empezar el ciclo.","visual":"13 − 12 = 1, then bring down the 4 to make 14","img":"/assets/vocab-images/concept-bring-down.svg","lesson":"2-6"},{"term":"Multiply Decimals","termEs":"Multiplicar decimales","definition":"Find the product of decimals, then use place value to place the decimal point.","definitionEs":"Hallar el producto de decimales y luego usar el valor posicional para colocar el punto decimal.","visual":"3.4 × 2.6 = 8.84","role":"concept","img":"/assets/vocab-images/concept-multiply-decimals.svg","lesson":"2-12"},{"term":"Product","termEs":"Producto","definition":"The answer when you multiply.","definitionEs":"La respuesta cuando multiplicas.","visual":"4 × 7 = 28, so the product is 28","img":"/assets/vocab-images/product.svg","lesson":"2-12"},{"term":"Decimal point","termEs":"Punto decimal","definition":"The dot that splits the whole number from the part after it.","definitionEs":"El punto que separa el número entero de la parte que sigue.","visual":"In 3.25, the decimal point separates 3 (ones) from 25 (tenths and hundredths)","img":"/assets/vocab-images/decimal-point.svg","lesson":"2-12"},{"term":"Estimate","termEs":"Estimar","definition":"A close answer you get by rounding first.","definitionEs":"Una respuesta cercana que obtienes al redondear primero.","visual":"3.7 × 4.2: round to 4 × 4 = 16, so the exact answer should be near 16","img":"/assets/vocab-images/estimate.svg","lesson":"2-12"},{"term":"Place value","termEs":"Valor posicional","definition":"What a digit is worth based on where it sits in a number.","definitionEs":"Lo que vale un dígito según el lugar que ocupa en el número.","visual":"In 0.36: the 3 is in the tenths place (0.3) and the 6 is in the hundredths place (0.06)","img":"/assets/vocab-images/place-value.svg","lesson":"2-12"},{"term":"Decimal places","termEs":"Cifras decimales","definition":"How many digits come after the decimal point.","definitionEs":"Cuántos dígitos hay después del punto decimal.","visual":"3.4 (1 place) × 2.6 (1 place) = 8.84 (2 places total)","img":"/assets/vocab-images/decimal.svg","lesson":"2-12"},{"term":"Divide Decimals","termEs":"Dividir decimales","definition":"Find a quotient with decimals by sliding both decimal points right until the divisor is a whole number.","definitionEs":"Hallar un cociente con decimales deslizando ambos puntos decimales a la derecha hasta que el divisor sea un número entero.","visual":"8.4 ÷ 2.1 = 84 ÷ 21 = 4","role":"concept","img":"/assets/vocab-images/concept-divide-decimals.svg","lesson":"2-7"},{"term":"Decimal Division Algorithm","termEs":"Algoritmo de división decimal","definition":"The steps for dividing decimals: slide the divisor's decimal point right until the divisor is a whole number, slide the dividend's point right the same number of places, then divide.","definitionEs":"Los pasos para dividir decimales: desliza el punto decimal del divisor a la derecha hasta que sea un número entero, desliza el punto del dividendo a la derecha el mismo número de lugares y luego divide.","visual":"8.4 ÷ 2.1 → move the point in both → 84 ÷ 21 → divide, multiply, subtract, bring down → 4","img":"/assets/vocab-images/decimal-division-algorithm.svg","lesson":"2-7"},{"term":"Equivalent division","termEs":"División equivalente","definition":"Multiplying both numbers by 10 or 100 gives the same answer.","definitionEs":"Multiplicar ambos números por 10 o 100 da la misma respuesta.","visual":"7.56 ÷ 0.12 = 756 ÷ 12 = 63 (both multiplied by 100)","img":"/assets/vocab-images/divide.svg","lesson":"2-7"},{"term":"Annex a zero","termEs":"Agregar un cero","definition":"Write a zero after the last decimal digit without changing the value.","definitionEs":"Escribir un cero después del último dígito decimal sin cambiar el valor.","visual":"7.2 → 7.20","img":"/assets/vocab-images/decimal-division-algorithm.svg","lesson":"2-7"},{"term":"Power of ten","termEs":"Potencia de diez","definition":"Ten, one hundred, one thousand, and so on.","definitionEs":"Diez, cien, mil, y así sucesivamente.","visual":"Multiplying by 10 slides every digit one place.","img":"/assets/vocab-images/place-value.svg","lesson":"2-7"}]</script>
<script type="application/json" id="gn-easy">{"v":1,"map":{"Lessons 2-6, 2-12 & 2-7 — divide multi-digit numbers the long way, multiply decimals, then divide them. Four reader gates stand between a market full of receipts and the truth about Bram's.":"Lessons 2-6, 2-12 &amp; 2-7. Divide multi-digit numbers the long way. Multiply decimals. Then divide them. Four gates stand in the way. The market is full of receipts. Find the truth about Bram's.","Previously: you restarted the Pattern Engine with whole gears. But Axiom City doesn't pay in whole numbers — it pays in coins and decimals. And tonight, the market's receipts don't add up.":"Before: you made the Pattern Engine run. You used whole gears. But Axiom City does not pay in whole numbers. It pays in coins and decimals. And tonight, the market's receipts don't add up.","Previously, in Episode 3: the core gears meshed and the Engine roared back to life. Now the city's money has to balance to the penny — and someone's been rounding in their own favor.":"Before, in Episode 3: the main gears fit. The Engine roared back to life. Now the money must add up to the penny. And someone has been rounding to help himself.","Every coin the festival raised lands here to be counted and split — exactly. No \"about,\" no rounding. The Ledger Hall balances to the penny.":"Each coin from the fair comes here. We count it and split it. Exactly. No \"about.\" No rounding. The Ledger Hall is right to the penny.","Penny-counting! Just split it roughly, kid — close enough is good enough!":"Count pennies? Just split it, kid. Close is good enough!","\"Close enough\" is how money goes missing. We split it the exact way — long division, every digit in its place. Then we check the decimals.":"\"Close enough\" is how money gets lost. We split it the exact way. Long division, each digit in its place. Then we check the decimals.","The splitting floor — where the night's coins are shared into equal stacks, digit by digit.":"The floor where we split. Coins go in equal stacks. Digit by digit.","618 coins, 6 equal stacks. 6 into 6 is 1. Then 6 into 1? Zero — so I write a 0 and bring down the 8. 6 into 18 is 3. Answer: 103.":"618 coins, 6 equal stacks. 6 into 6 is 1. Then 6 into 1? Zero. So I write a 0. I bring down the 8. 6 into 18 is 3. Answer: 103.","Names, keepers: the dividend is the number being split (618), the divisor is how many groups (6), the quotient is the answer. If a digit is too small to divide, write a 0 in the quotient — never skip it.":"Names, keepers: the \u003cb>dividend\u003c/b> is the number we split (618). The \u003cb>divisor\u003c/b> is how many groups (6). The \u003cb>quotient\u003c/b> is the answer. Is a digit too small to divide? Write a \u003cb>0\u003c/b> in the quotient. Never skip it.","To divide with the standard algorithm, work left to right through the dividend. When the divisor won't go into a digit, put a 0 in the quotient and bring down the next digit. 618 ÷ 6 = 103, not 13.":"Use the standard algorithm to divide. Go left to right in the \u003cb>dividend\u003c/b>. Does the \u003cb>divisor\u003c/b> not go into a digit? Put a \u003cb>0\u003c/b> in the \u003cb>quotient\u003c/b>. Bring down the next digit. 618 ÷ 6 = 103, not 13.","Your turn, reader — split each pile into equal stacks. Watch the middle: a missing zero loses money.":"Your turn, reader. Split each pile in equal stacks. Watch the middle. A lost zero costs cash.","Share each pile into equal stacks with long division. Watch the middle digit — if the divisor won't go, the quotient needs a 0. 618 ÷ 6 and 824 ÷ 4.":"Split each pile into equal stacks. Use long division. Watch the middle digit. If the divisor won't go, the quotient needs a \u003cb>0\u003c/b>. \u003cb>618 ÷ 6\u003c/b> and \u003cb>824 ÷ 4\u003c/b>.","Conceptual: work left to right. If the divisor won't divide a digit, that place gets a 0 in the quotient — you can't just skip it.":" Conceptual: go left to right. Can the divisor not divide a digit? Then that place gets a 0 in the quotient. You can't just skip it.","Procedural: 618 ÷ 6 → 6 into 6 is 1; 6 into 1 is 0 (write it!), bring down 8; 6 into 18 is 3 → 103. 824 ÷ 4 → 4 into 8 is 2; 4 into 2 is 0, bring down 4; 4 into 24 is 6 → 206.":" Procedural: 618 ÷ 6 → 6 into 6 is 1. 6 into 1 is 0 (write it!). Bring down 8. 6 into 18 is 3 → 103. 824 ÷ 4 → 4 into 8 is 2. 4 into 2 is 0. Bring down 4. 4 into 24 is 6 → 206.","0.4 kg of caramel at $0.70 a kg. Multiply — but where does the decimal land?":"0.4 kg of caramel at $0.70 a kg. Multiply. But where does the decimal go?","…then count the decimal places in BOTH factors and place that many.":"…then count the decimal places in BOTH factors. Put in that many.","To multiply decimals, multiply as whole numbers, then count the total decimal places in the two factors and put that many in the answer. 0.4 × 0.7: 4×7 = 28, and 1 + 1 = 2 places → 0.28.":"To \u003cb>multiply decimals\u003c/b>, multiply as whole numbers. Then add up the \u003cb>decimal places\u003c/b> in both factors. Put that many in the answer. 0.4 × 0.7: 4×7 = 28, and 1 + 1 = 2 places → 0.28.","Reader — ring up each price. Same digits, but the decimal point decides everything.":"Reader, ring up each price. Same digits. But the decimal point changes it all.","Ring up each price. Multiply the digits, then count the decimal places in BOTH factors. 0.4 × 0.7 and 0.25 × 0.3.":"Ring up each price. Multiply the digits. Then count the decimal places in BOTH factors. \u003cb>0.4 × 0.7\u003c/b> and \u003cb>0.25 × 0.3\u003c/b>.","Conceptual: the digits don't change when you ignore the dots — only WHERE the decimal lands does. Count the decimal places in both factors and use that many.":" Conceptual: skip the dots. The digits stay the same. Only WHERE the decimal goes is new. Count the decimal places in both factors. Use that many.","Procedural: 0.4 × 0.7 → 4 × 7 = 28, and 1 + 1 = 2 places → 0.28. 0.25 × 0.3 → 25 × 3 = 75, and 2 + 1 = 3 places → 0.075.":" Procedural: 0.4 × 0.7 → 4 × 7 = 28. And 1 + 1 = 2 places → 0.28. 0.25 × 0.3 → 25 × 3 = 75. And 2 + 1 = 3 places → 0.075.","Restock count. The total weight is known — but how many bags came out of it?":"Time to restock. We know the total weight. How many bags came out of it?","4.8 kg of caramel, bagged 0.6 kg at a time. How many bags? Dividing BY a decimal needs a trick.":"4.8 kg of caramel. Each bag holds 0.6 kg. How many bags? Dividing BY a decimal needs a trick.","Rule: a divisor with a decimal is hard to divide by. Slide its decimal until it's a whole number — then slide the dividend's decimal the SAME number of places. 4.8 ÷ 0.6 becomes 48 ÷ 6 = 8.":"Rule: a decimal \u003cb>divisor\u003c/b> is hard to divide by. Slide its decimal until it is a whole number. Move the \u003cb>dividend\u003c/b>'s decimal too. Move it the SAME number of places. 4.8 ÷ 0.6 becomes 48 ÷ 6 = 8.","To divide by a decimal, move the decimal in the divisor to make it a whole number, and move the dividend's decimal the same number of places. 4.8 ÷ 0.6 → 48 ÷ 6 = 8.":"To \u003cb>divide by a decimal\u003c/b>, start with the \u003cb>divisor\u003c/b>. Move its decimal to make a whole number. Move the \u003cb>dividend\u003c/b>'s decimal too. Move it the same number of places. 4.8 ÷ 0.6 → 48 ÷ 6 = 8.","Count the bags, reader — make each divisor a whole number first, then divide.":"Count the bags, reader. Make each divisor a whole number first. Then divide.","Count the bags by dividing. First make each divisor a whole number, then move the dividend's decimal the same way. 4.8 ÷ 0.6 and 2.4 ÷ 0.08.":"Divide to count the bags. First make each divisor a whole number. Then move the dividend's decimal the same way. \u003cb>4.8 ÷ 0.6\u003c/b> and \u003cb>2.4 ÷ 0.08\u003c/b>.","Conceptual: you can't easily divide by a decimal. Slide the divisor's decimal until it's whole — and slide the dividend's decimal the SAME number of places.":" Conceptual: it is hard to divide by a decimal. Slide the divisor's decimal until it is whole. Slide the dividend's decimal the SAME number of places.","Closing count. Bram slaps a receipt on the counter — and the totals don't sit right.":"The last count of the night. Bram slaps a receipt down. The totals look wrong.","Half a kilo of caramel — SIXTEEN DOLLARS! Pay up, the receipt says so!":"Half a kilo of caramel. SIXTEEN DOLLARS! Pay up! The bill says so!","Sixteen dollars for half a kilo at $3.20? That decimal jumped a whole place. Let me run it for real.":"Sixteen dollars for half a kilo at $3.20? That decimal jumped a whole place. Let me work it out for real.","Distortion spike. $3.20 × 0.5 is barely over a dollar — $16.00 is ten times too much. A single misplaced decimal overcharges the whole market. Audit it before he collects.":"Big glitch. $3.20 × 0.5 is just over a dollar. $16.00 is ten times too much. One wrong decimal costs the whole market. Check it before he takes the money.","Three locks to close the books: the fair split, the real price, and how much caramel Bram actually billed for.":"Three locks to close the books. The fair split. The real price. And how much caramel Bram charged for.","The math is honest. The receipt isn't. Reader — take the boss.":"The math is true. The receipt is not. Reader, take the boss.","Boss Gate: divide the take fairly, price the bag for real, then divide to expose what Bram's $16.00 truly billed.":"Boss Gate: divide the money fairly. Find the real bag price. Then divide to show what Bram's $16.00 really charged for.","BOSS GATE. Three locks. Split it fair, price it true, and divide out Bram's decimal lie.":"BOSS GATE. Three locks. Split it fair. Price it true. Divide out Bram's decimal lie.","Audit the night in three lines. LOCK 1 split the take; LOCK 2 price the bag for real; LOCK 3 divide to expose Bram's $16.00.":"Check the night in three lines. \u003cb>LOCK 1\u003c/b> split the money. \u003cb>LOCK 2\u003c/b> find the real bag price. \u003cb>LOCK 3\u003c/b> divide to expose Bram's $16.00.","Conceptual: Lock 1 is whole-number long division. Lock 2 multiplies decimals (place the decimal!). Lock 3 divides money by a price to find a weight.":" Conceptual: Lock 1 is whole-number long division. Lock 2 multiplies decimals (place the decimal!). Lock 3 divides money by a price. That finds a weight.","Procedural: Lock 1: 946 ÷ 11 = 86. Lock 2: 3.20 × 0.5 → 32 × 5 = 160, two places → $1.60. Lock 3: 16.00 ÷ 3.20 → 160 ÷ 32 = 5 kg.":" Procedural: Lock 1: 946 ÷ 11 = 86. Lock 2: 3.20 × 0.5 → 32 × 5 = 160. Two places → $1.60. Lock 3: 16.00 ÷ 3.20 → 160 ÷ 32 = 5 kg.","$86 to each seller, a $1.60 bag, and Bram's \"16 dollars\" was really five kilos billed for half a kilo sold. Books balanced — to the penny.":"$86 to each seller. A $1.60 bag. Bram's \"16 dollars\" was for five kilos. But he sold half a kilo. The books are right to the penny.","One dollar sixty?! …Fine. I'll keep my decimals where they belong from now on.":"One dollar sixty?! …Fine. My decimals stay in the right place now.","Whole numbers, decimals — mastered. Next, the city starts asking about ratios. To be continued…":"Whole numbers: got it. Decimals: got it. Next, the city asks about ratios. To be continued…","Split it exactly.Long division goes left to right. When the divisor won't fit a digit, write a 0 in the quotient and bring down the next — 618 ÷ 6 = 103, not 13.":"\u003cb>Split it exactly.\u003c/b>\u003cspan>Long division goes left to right. Does the divisor not fit a digit? Write a 0 in the quotient. Bring down the next. 618 ÷ 6 = 103, not 13.\u003c/span>","Multiply, then place.Multiply decimals like whole numbers, then count the decimal places in both factors. 0.4 × 0.7 → 28 with two places → 0.28.":"\u003cb>Multiply, then place.\u003c/b>\u003cspan>Multiply decimals like whole numbers. Then count the decimal places in both factors. 0.4 × 0.7 → 28 with two places → 0.28.\u003c/span>","Make the divisor whole.To divide by a decimal, shift its decimal to a whole number and shift the dividend the same way. 4.8 ÷ 0.6 → 48 ÷ 6 = 8.":"\u003cb>Make the divisor whole.\u003c/b>\u003cspan>To divide by a decimal, shift its decimal. Make a whole number. Shift the dividend the same way. 4.8 ÷ 0.6 → 48 ÷ 6 = 8.\u003c/span>","The receipt that lied.One misplaced decimal turned a $1.60 bag into a $16.00 charge — ten times too much. We caught it by dividing: $16.00 ÷ $3.20 = 5 kg billed for 0.5 kg sold.":"\u003cb>The receipt that lied.\u003c/b>\u003cspan>One wrong decimal made a $1.60 bag into a $16.00 charge. That is ten times too much. We caught it when we divided: $16.00 ÷ $3.20 = 5 kg charged. But 0.5 kg was sold.\u003c/span>","\"Money tells the truth only when every decimal sits in its place. Move one dot, and a fair price becomes a swindle.\" — A.V.":"\"Is each decimal in its place? Only then does money tell the truth. Move one dot. A fair price turns into a trick.\" — A.V.","completed Unit 1 · Episode 4: Exact Change and proved mastery of multi-digit division, multiplying decimals, and dividing decimals.":"completed \u003cb>Unit 1 · Episode 4: Exact Change\u003c/b>. Now they know multi-digit division. They can multiply and divide decimals.","Unit 1 complete. Unit 2 — The Question Machine — is powering up.":"Unit 1 is done. Unit 2 starts up now: The Question Machine.","7 into 7 is 1. 7 into 2 is 0 — write the 0 and bring down the 8.":"\u003cspan>7 into 7 is 1. 7 into 2 is 0. Write the 0. Bring down the 8.\u003c/span>","7 into 28 is 4. Quotient: 728 ÷ 7 = 104. The middle 0 keeps every digit in its place.":"\u003cspan>7 into 28 is 4. Quotient: 728 ÷ 7 = 104. The middle 0 keeps each digit in its place.\u003c/span>","Your turn — same idea, different numbers:":"Your turn. Same idea, new numbers:","Ignore the dots: 6 × 5 = 30.":"\u003cspan>Skip the dots: 6 × 5 = 30.\u003c/span>","Count decimal places: 0.6 has one, 0.5 has one — that's 1 + 1 = 2. Place two: 30 → 0.30. So 0.6 × 0.5 = 0.30.":"\u003cspan>Count decimal places: 0.6 has one. 0.5 has one. That is 1 + 1 = 2. Place two: 30 → 0.30. So 0.6 × 0.5 = 0.30.\u003c/span>","The divisor 0.4 needs the decimal moved ONE place to become 4. Move the dividend's decimal one place too: 3.6 → 36.":"\u003cspan>The divisor 0.4 needs its decimal moved ONE place. Then it is 4. Move the dividend's decimal one place too: 3.6 → 36.\u003c/span>","Different night: $735 split by 7 sellers = $105 each.":"\u003cspan>A new night: $735 split by 7 sellers = $105 each.\u003c/span>","Audit: a $24.00 charge at $4.00 / kg means 24 ÷ 4 = 6 kg billed. Divide the charge by the price to find the weight.":"\u003cspan>Check: a $24.00 charge at $4.00 / kg means 24 ÷ 4 = 6 kg charged. Divide the charge by the price. That finds the weight.\u003c/span>","A $24.00 charge at $4.00 per kg means how many kg billed?":"A $24.00 charge at $4.00 per kg. How many kg is that?","103 coins per stack and 206 — every digit in its place, zeros and all. The floor is split fair.":" 103 coins per stack, and 206. Each digit is in its place, zeros and all. The floor is split fair.","13 drops the middle zero. 6 goes into the first 6 once; the next digit (1) is too small for 6, so write a 0 before bringing down the 8. 618 ÷ 6 = 103.":"13 drops the middle zero. 6 goes into the first 6 once. The next digit (1) is too small for 6. So write a 0. Then bring down the 8. 618 ÷ 6 = 103.","26 drops the middle zero. 4 goes into 8 twice; the next digit (2) is too small for 4, so write a 0, then bring down the 4. 824 ÷ 4 = 206.":"26 drops the middle zero. 4 goes into 8 two times. The next digit (2) is too small for 4. So write a 0. Then bring down the 4. 824 ÷ 4 = 206.","First pile: check by multiplying back — your answer times 6 must give 618. Mind the tens place; it needs a 0.":"First pile: multiply back to check. Your answer times 6 must give 618. Look at the tens place. It needs a 0.","Second pile: your answer times 4 must give 824. Don't skip the 0 in the tens place.":"Second pile: your answer times 4 must give 824. Don't skip the 0 in the tens place.","$0.28 and 0.075 — digits right, decimal placed right. The tags ring true.":" $0.28 and 0.075. Right digits. Right decimal place. The tags are true.","2.8 forgets a decimal place. 4 × 7 = 28, and the factors have 1 + 1 = 2 decimal places, so 0.28.":"2.8 is missing a decimal place. 4 × 7 = 28. The factors have 1 + 1 = 2 decimal places. So 0.28.","28 is just 4 × 7 — you never placed the decimal. Two decimal places total → 0.28.":"28 is just 4 × 7. You did not place the decimal. Two decimal places in all → 0.28.","0.75 counts only two decimal places. 0.25 has two and 0.3 has one: 2 + 1 = 3 places. 25 × 3 = 75 → 0.075.":"0.75 has only two decimal places. 0.25 has two. 0.3 has one: 2 + 1 = 3 places. 25 × 3 = 75 → 0.075.","75 is just 25 × 3 with no decimal placed. Count 2 + 1 = 3 places → 0.075.":"75 is just 25 × 3. No decimal is placed. Count 2 + 1 = 3 places → 0.075.","First tag: 4 × 7 = 28, then place 1 + 1 = 2 decimals → 0.28.":"First tag: 4 × 7 = 28. Then place 1 + 1 = 2 decimals → 0.28.","Second tag: 25 × 3 = 75, then place 2 + 1 = 3 decimals → 0.075.":"Second tag: 25 × 3 = 75. Then place 2 + 1 = 3 decimals → 0.075.","8 bags and 30 bags — divisors made whole, decimals slid in step. Restock confirmed.":" 8 bags and 30 bags. Each divisor is whole. The decimals moved in step. The count is right.","0.8 divides by a whole 6, but the divisor is 0.6. Slide BOTH decimals one place right: 48 ÷ 6 = 8.":"0.8 divides by a whole 6. But the divisor is 0.6. Slide BOTH decimals one place right: 48 ÷ 6 = 8.","80 is ten times too big — the decimals slid the wrong way. 4.8 ÷ 0.6 = 48 ÷ 6 = 8.":"80 is ten times too big. The decimals moved the wrong way. 4.8 ÷ 0.6 = 48 ÷ 6 = 8.","3 slid the decimal only ONE place. 0.08 needs TWO places: multiply both by 100 → 240 ÷ 8 = 30.":"3 moved the decimal only ONE place. 0.08 needs TWO places. Multiply both by 100 → 240 ÷ 8 = 30.","0.3 divides by a whole 8, but the divisor is 0.08. Move both decimals two places: 240 ÷ 8 = 30.":"0.3 divides by a whole 8. But the divisor is 0.08. Move both decimals two places: 240 ÷ 8 = 30.","First count: make 0.6 into 6 (one place), do the same to 4.8 → 48 ÷ 6 = 8.":"First count: make 0.6 into 6 (one place). Do the same to 4.8 → 48 ÷ 6 = 8.","Second count: make 0.08 into 8 (two places), do the same to 2.4 → 240 ÷ 8 = 30.":"Second count: make 0.08 into 8 (two places). Do the same to 2.4 → 240 ÷ 8 = 30.","Lock 1 holds. 11 × 86 = 946 — check by multiplying back. 11 into 94 is 8, into 66 is 6.":"Lock 1 holds. 11 × 86 = 946. Multiply back to check. 11 into 94 is 8, into 66 is 6.","Lock 2 holds — and $16 is exactly the lie we're chasing! 3.20 is 3.2, so 3.2 × 0.5: 32 × 5 = 160, then place 1 + 1 = 2 decimals → $1.60, not $16.00.":"Lock 2 holds. And $16 is just the lie we want to catch! 3.20 is 3.2. So 3.2 × 0.5: 32 × 5 = 160. Then place 1 + 1 = 2 decimals → $1.60, not $16.00.","Lock 2 holds. 32 × 5 = 160, but you skipped placing the decimal — two places → $1.60.":"Lock 2 holds. 32 × 5 = 160. But you did not place the decimal. Two places → $1.60.","Lock 2 holds. 0.5 × 3.2 (3.20 is 3.2): multiply 5 × 32 = 160, then place 1 + 1 = 2 decimals → 1.60.":"Lock 2 holds. 0.5 × 3.2 (3.20 is 3.2): multiply 5 × 32 = 160. Then place 1 + 1 = 2 decimals → 1.60.","0.5 kg is what the bag SHOULD weigh — but Lock 3 asks what he BILLED. Divide his charge: 16.00 ÷ 3.20 → 160 ÷ 32 = 5 kg.":"0.5 kg is what the bag SHOULD weigh. But Lock 3 asks what he BILLED. Divide his charge: 16.00 ÷ 3.20 → 160 ÷ 32 = 5 kg.","50 is ten times too big — slide both decimals ONE place, not two: 160 ÷ 32 = 5.":"50 is ten times too big. Slide both decimals ONE place, not two: 160 ÷ 32 = 5.","ALL LOCKS OPEN. $86 a seller, a $1.60 bag — but Bram BILLED 5 kg of caramel, not 0.5. One slipped decimal overcharged the whole market ten-fold. Books balanced.":" ALL LOCKS OPEN. $86 a seller. A $1.60 bag. But Bram BILLED 5 kg of caramel, not 0.5. One wrong decimal: the market paid ten times too much. The books are right.","Yes! Now head back and open that gate.":"
