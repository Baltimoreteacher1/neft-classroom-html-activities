function mkfeed(el,msg,ok){el.textContent=msg;el.className="gatefeedback "+(ok?"good":"bad");}
const GATES = {
g1:{ title:"Gate 1 · Fix the Signs", icon:"#sig-stairs",
  prompt:`Two signs still lie. Sign A marks the finish chute as <b>5.5 m</b>, but the stencil wants <b>centimeters</b>. Sign B marks the ice supply as <b>4500 g</b>, but the marshal's sheet wants <b>kilograms</b>. Re-label both.`,
  hints:[ "Conceptual: a conversion never changes the chute or the ice — only the counting unit. Trading DOWN to a smaller unit means MORE of them (multiply); trading UP to a bigger unit means FEWER (divide).",
          "Procedural: centi- is the ×100 step (1 m = 100 cm) and kilo- is the ×1000 jump (1 kg = 1000 g). Sign A: multiply by 100. Sign B: divide by 1000." ],
  worked:{ steps:[ "A banner crew re-labels a 3.2 m banner in centimeters. Smaller unit, bigger count: 3.2 × 100 = 320 cm.",
    "A water crate weighs 7000 g and the sheet wants kilograms. Bigger unit, smaller count: 7000 ÷ 1000 = 7 kg.",
    "Direction check both times: the number GREW going m → cm and SHRANK going g → kg. The banner and the water never changed." ],
    q:"Re-label 2500 g in kilograms.", a:"2.5" },
  render(body,api){
    body.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font:900 .75rem 'Arial Black'">SIGN A</b><span style="font:600 .88rem 'Segoe UI'">Finish chute: 5.5 m =</span><input class="numin" id="s_cm" inputmode="decimal" aria-label="finish chute length in centimeters"><span style="font:600 .88rem 'Segoe UI'">cm</span></div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font:900 .75rem 'Arial Black'">SIGN B</b><span style="font:600 .88rem 'Segoe UI'">Ice supply: 4500 g =</span><input class="numin" id="s_kg" inputmode="decimal" aria-label="ice supply mass in kilograms"><span style="font:600 .88rem 'Segoe UI'">kg</span></div></div>`;
    body.querySelectorAll(".numin").forEach(i=>i.addEventListener("input",()=>api.sound("blip")));
    api.onCheck(()=>{
      const a=parseFloat(body.querySelector("#s_cm").value),b=parseFloat(body.querySelector("#s_kg").value);
      const okA=Math.abs(a-550)<.005,okB=Math.abs(b-4.5)<.005;
      body.querySelector("#s_cm").className="numin "+(okA?"ok":"no");
      body.querySelector("#s_kg").className="numin "+(okB?"ok":"no");
      if(!okA){
        if(Math.abs(a-5500)<.005)return api.fail("Sign A holds. ×1000 is the KILO jump (km ↔ m, kg ↔ g). Meters to CENTImeters is the ×100 step.");
        if(a<5.5)return api.fail("Sign A holds. Direction check: a centimeter is SMALLER than a meter, so the count must get BIGGER — multiply.");
        return api.fail("Sign A holds. How many centimeters make one meter? Scale 5.5 by exactly that.");}
      if(!okB){
        if(Math.abs(b-45)<.005)return api.fail("Sign B holds. ÷100 belongs to the meter–centimeter step. Grams to KILOgrams is the ÷1000 jump.");
        if(b>=4500)return api.fail("Sign B holds. Direction check: a kilogram is the BIGGER unit, so the count must get SMALLER — divide.");
        return api.fail("Sign B holds. 'Kilo' means 1000 — how many grams make one kilogram?");}
      api.pass("550 cm and 4.5 kg — 5.5 × 100 and 4500 ÷ 1000. Same chute, same ice, honest labels. Chloe's stencil hisses approvingly.");});
  }},
g2:{ title:"Gate 2 · Cross the Bridge", icon:"#sig-swap",
  prompt:`The marshal's chart: <b>1 mi &#8776; 1.6 km · 1 in = 2.54 cm</b>. Two route cards left: the <b>12 km</b> loop in <b>miles</b>, and a <b>5-inch</b> sticker strip in <b>centimeters</b>.`,
  hints:[ "Conceptual: between systems you need a bridge ratio — a fact that names ONE unit in terms of the other. Then it's the same direction game: longer unit, fewer of them; shorter unit, more of them.",
          "Procedural: km → miles crosses the 1.6 bridge by DIVISION (each mile swallows 1.6 km of road). Inches → centimeters crosses the 2.54 bridge by MULTIPLICATION (each inch is worth 2.54 cm)." ],
  worked:{ steps:[ "The 8 km river leg in miles: 8 ÷ 1.6 = 80 ÷ 16 = 5 miles. Fewer miles than kilometers — direction checks out.",
    "A 3-inch decal in centimeters: 3 × 2.54 = 7.62 cm. More centimeters than inches — checks out again.",
    "Two bridges, one rule: write the ratio, pick the direction, then multiply or divide." ],
    q:"A 10-inch pennant is how many centimeters?", a:"25.4" },
  render(body,api){
    body.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font:900 .75rem 'Arial Black'">CARD 1</b><span style="font:600 .88rem 'Segoe UI'">The loop: 12 km =</span><input class="numin" id="c_mi" inputmode="decimal" aria-label="the loop in miles"><span style="font:600 .88rem 'Segoe UI'">miles</span></div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font:900 .75rem 'Arial Black'">CARD 2</b><span style="font:600 .88rem 'Segoe UI'">Sticker strip: 5 in =</span><input class="numin" id="c_cm" inputmode="decimal" aria-label="the sticker strip in centimeters"><span style="font:600 .88rem 'Segoe UI'">cm</span></div></div>`;
    body.querySelectorAll(".numin").forEach(i=>i.addEventListener("input",()=>api.sound("blip")));
    api.onCheck(()=>{
      const m=parseFloat(body.querySelector("#c_mi").value),c=parseFloat(body.querySelector("#c_cm").value);
      const okM=Math.abs(m-7.5)<.005,okC=Math.abs(c-12.7)<.005;
      body.querySelector("#c_mi").className="numin "+(okM?"ok":"no");
      body.querySelector("#c_cm").className="numin "+(okC?"ok":"no");
      if(!okM){
        if(Math.abs(m-19.2)<.05||m>12)return api.fail("Card 1 holds. You went the long way — a mile is LONGER than a kilometer, so the loop holds FEWER miles. Divide by 1.6.");
        return api.fail("Card 1 holds. How many groups of 1.6 km fit inside the 12 km loop?");}
      if(!okC){
        if(c<5)return api.fail("Card 2 holds. Wrong direction — a centimeter is SHORTER than an inch, so the strip holds MORE centimeters. Multiply by 2.54.");
        return api.fail("Card 2 holds. Each of the 5 inches is worth exactly 2.54 cm. Scale it.");}
      api.pass("12 ÷ 1.6 = 7.5 miles, and 5 × 2.54 = 12.7 cm. The riders' cards now match the city's signs. Bridge crossed.");});
  }},
boss:{ title:"BOSS GATE · Certify the Course", icon:"#sig-boss",
  prompt:`The certification form. The course = a <b>2-mile</b> harbor leg plus a <b>3.2 km</b> hillside leg (chart: 1 mi &#8776; 1.6 km). Three locks:`,
  hints:[ "Conceptual: you can only ADD lengths that wear the SAME unit — convert first, add second. Then kilometers to meters is a within-system step: the ×1000 jump.",
          "Procedural: Lock 1 — turn the 2-mile leg into kilometers (each mile &#8776; 1.6 km), then add the 3.2. Lock 2 — push your Lock 1 total down the km → m staircase. Lock 3 — read the bridge fact again: if 1 mile &#8776; 1.6 km, which unit is longer?" ],
  worked:{ steps:[ "A practice course: a 3-mile flat leg plus a 1.2 km bridge leg.",
    "Same units first: 3 × 1.6 = 4.8 km. Now add: 4.8 + 1.2 = 6 km.",
    "The form wants meters too: 6 × 1000 = 6000 m. Convert, add, then step within the system." ],
    q:"A 1-mile leg plus a 2.4 km leg — total in kilometers?", a:"4" },
  render(body,api){
    body.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font:900 .75rem 'Arial Black'">LOCK 1</b><span style="font:600 .88rem 'Segoe UI'">Total course, in kilometers:</span><input class="numin" id="b1" inputmode="decimal" aria-label="total course in kilometers"><span style="font:600 .88rem 'Segoe UI'">km</span></div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font:900 .75rem 'Arial Black'">LOCK 2</b><span style="font:600 .88rem 'Segoe UI'">That same total, in meters:</span><input class="numin" id="b2" inputmode="decimal" aria-label="total course in meters"><span style="font:600 .88rem 'Segoe UI'">m</span></div>
      <div><b style="font:900 .75rem 'Arial Black'">LOCK 3</b><div style="font:600 .88rem 'Segoe UI';margin:4px 0">The Torque captain's claim — "1 kilometer is longer than 1 mile." True or false?</div>
        <div class="choicebtns" role="group" aria-label="Is the claim true or false?"><button class="choicebtn" data-w="true" aria-pressed="false">TRUE — the kilometer is longer</button>
        <button class="choicebtn" data-w="false" aria-pressed="false">FALSE — the mile is longer</button></div></div></div>`;
    let p3=null;
    body.querySelectorAll("[data-w]").forEach(x=>x.addEventListener("click",()=>{body.querySelectorAll("[data-w]").forEach(y=>y.setAttribute("aria-pressed","false"));x.setAttribute("aria-pressed","true");p3=x.dataset.w;api.sound("blip");}));
    body.querySelectorAll(".numin").forEach(i=>i.addEventListener("input",()=>api.sound("blip")));
    api.onCheck(()=>{
      const t=parseFloat(body.querySelector("#b1").value),mm=parseFloat(body.querySelector("#b2").value);
      const ok1=Math.abs(t-6.4)<.005;
      body.querySelector("#b1").className="numin "+(ok1?"ok":"no");
      if(!ok1){body.querySelector("#b2").className="numin";
        if(Math.abs(t-5.2)<.005)return api.fail("Lock 1 holds. 2 + 3.2 adds miles straight to kilometers — units that disagree can't be added. Convert the 2-mile leg to km FIRST.");
        return api.fail("Lock 1 holds. Each mile of the harbor leg is about 1.6 km. Convert it, THEN add the 3.2 km climb.");}
      const ok2=Math.abs(mm-6400)<.5;
      body.querySelector("#b2").className="numin "+(ok2?"ok":"no");
      if(!ok2){
        if(Math.abs(mm-640)<.5)return api.fail("Lock 2 holds. That's the ×100 step — but 'kilo' means 1000. 1 km = 1000 m.");
        return api.fail("Lock 2 holds. Sanity check: meters are smaller than kilometers, so the count must GROW. Take your Lock 1 total ×1000.");}
      if(p3!=="false")return api.fail("Lock 3 holds. Sanity-check it against the chart: it takes 1.6 km — more than a whole kilometer — to make ONE mile. So which unit is longer?");
      api.pass("CERTIFIED. 2 × 1.6 + 3.2 = 6.4 km = 6400 m — and the mile keeps its crown as the longer unit. The marshal stamps the form. ACROSS THE LINE!");});
  }}
};

  ],
  answers:[
    ["Gate 1","Sign A: 5.5 m × 100 = 550 cm. Sign B: 4500 g ÷ 1000 = 4.5 kg. Traps with targeted feedback: 5500 (used ×1000 instead of ×100), 45 (used ÷100 instead of ÷1000), and wrong-direction answers (bigger unit = smaller number)."],
    ["Gate 2","Card 1: 12 ÷ 1.6 = 7.5 miles. Card 2: 5 × 2.54 = 12.7 cm. Traps: 19.2 (multiplied instead of divided — caught by the 'longer unit, fewer of them' check) and dividing the inches by 2.54."],
    ["Boss","Lock 1: 2 × 1.6 + 3.2 = 6.4 km (trap: 5.2 from adding mixed units without converting). Lock 2: 6.4 × 1000 = 6400 m (trap: 640, the ×100 step). Lock 3: FALSE — 1 mi &#8776; 1.6 km, so a mile is longer than a kilometer."]

<script>
/* ================================================================
   ===== AXIOM CITY ENGINE v1.0 — identical in every volume =======
   ================================================================ */
"use strict";
/* ---------- storage (exact wrapper, ewl_ prefix) ---------- */
const storage={_m:{},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){this._m[k]=v}},get(k,d=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return this._m[k]??d}}};
const K=s=>`ewl_axiom_${VOLUME.slug}_${s}`;

const $=s=>document.querySelector(s);
const live=msg=>{$("#live").textContent=msg};
const reducedMQ=matchMedia("(prefers-reduced-motion: reduce)");
const mobileMQ=matchMedia("(max-width: 820px)");

const prefs=Object.assign({sound:false,motion:true,bigtext:false,hc:false},storage.get(K("prefs"))||{});
let solved=new Set(storage.get(K("gates"))||[]);
let page=storage.get(K("page"))||0;            // index of left/visible page
let turning=false;
const attempts={};

/* ---------- audio (Web Audio oscillators only, muted default) ---------- */
let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return actx}
function tone(f,t,dur,type="square",vol=.04){const c=ac();if(!c||!prefs.sound)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+dur+.02)}
const SND={blip(){tone(660,0,.07)},flip(){tone(220,0,.09,"triangle",.05);tone(330,.05,.08,"triangle",.04)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.09,.14,"triangle",.05))},thud(){tone(110,0,.18,"sawtooth",.05)}};

/* ---------- helpers ---------- */
function gateLockIcon(open){return `<div class="gatelockcorner ${open?"open":""}" aria-hidden="true"><svg viewBox="0 0 100 100" style="color:#fff"><use href="${open?"#sig-open":"#sig-lock"}"/></svg></div>`}

function pageInnerHTML(i){
  if(i==null||i<0||i>=PAGES.length) return `<div class="page-inner" style="align-items:center;justify-content:center"><div class="kicker" style="opacity:.4">AXIOM CITY</div></div><div class="pagefoot"><span></span><span></span></div>`;
  const p=PAGES[i];
  const gateHTML=p.gate?`<div class="gatemount" data-gate="${p.gate}"></div>`:"";
  const lock=p.gate?gateLockIcon(solved.has(p.gate)):"";
  return `${lock}<div class="chapterband">${p.ch.replace("·","· <em>").concat(p.ch.includes("·")?"</em>":"")}</div><div class="page-inner">${p.html}${gateHTML}</div><div class="pagefoot"><span>${VOLUME.unit}</span><span>PAGE ${i+1} / ${PAGES.length}</span></div>`;
}

/* ---------- gate framework ---------- */
function mountGates(scope){
  scope.querySelectorAll(".gatemount").forEach(m=>{
    const id=m.dataset.gate,G=GATES[id];
    if(!G)return;
    if(solved.has(id)){m.innerHTML=`<div class="gatesolved"><span class="stamp">SOLVED</span> ${G.title} — badge earned.</div>`;return}
    m.innerHTML=`<div class="gatebox"><header><svg class="gicon" viewBox="0 0 100 100"><use href="${G.icon}"/></svg><h3>${G.title}</h3></header>
      <div class="gatebody"><div class="gateprompt">${G.prompt}</div><div class="gwidget"></div>
      <div class="gatehint" hidden></div>
      <button class="gatecheck">CHECK</button>
      <div class="gatefeedback" aria-live="polite"></div></div></div>`;
    const box=m.querySelector(".gatebox"),body=m.querySelector(".gwidget"),fb=m.querySelector(".gatefeedback"),hint=m.querySelector(".gatehint"),btn=m.querySelector(".gatecheck");
    let checker=null;
    const api={
      sound:n=>SND[n]&&SND[n](),
      onCheck(fn){checker=fn},
      fail(msg){
        attempts[id]=(attempts[id]||0)+1;SND.thud();mkfeed(fb,msg,false);
        const n=attempts[id];
        if(n===1){hint.hidden=false;hint.innerHTML="💡 <b>Hint:</b> "+G.hints[0]}
        else if(n===2){hint.hidden=false;hint.innerHTML="🧭 <b>Hint 2:</b> "+G.hints[1]}
        else if(n>=3&&!hint.querySelector(".askvex")){
          const b=document.createElement("button");b.className="gatecheck askvex";b.style.marginTop="8px";b.textContent="ASK VEX — WORKED EXAMPLE";
          b.addEventListener("click",()=>openWorked(G));hint.appendChild(b);
        }
        live("Not yet. "+msg);
      },
      pass(msg){
        solved.add(id);storage.set(K("gates"),[...solved]);SND.win();
        m.innerHTML=`<div class="gatesolved unlockflash"><span class="stamp">SOLVED</span> ${msg}</div>`;
        const corner=m.closest(".page,#pageL,#pageR")?.querySelector(".gatelockcorner");
        if(corner){corner.classList.add("open");corner.innerHTML=`<svg viewBox="0 0 100 100" style="color:#fff"><use href="#sig-open"/></svg>`}
        earnBadge(id);updateNav();live("Gate solved! "+msg);
      }
    };
    G.render(body,api);
    btn.addEventListener("click",()=>{ac();checker&&checker()});
  });
}
function openWorked(G){
  $("#workedBody").innerHTML=`<div class="workedsteps">${G.worked.steps.map((s,i)=>`<div class="st"><b class="n">${i+1}</b><span>${s}</span></div>`).join("")}</div>
    <div class="caption">Your turn — same idea, different numbers:</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font:600 .92rem 'Segoe UI'">${G.worked.q}</span>
    <input class="numin" id="wkin" aria-label="worked example answer"><button class="gatecheck" id="wkgo">CHECK</button></div>
    <div class="gatefeedback" id="wkfb" aria-live="polite"></div>`;
  $("#workedModal").classList.add("open");
  $("#wkgo").addEventListener("click",()=>{
    const v=($("#wkin").value||"").trim().replace(/\s+/g,"");
    if(v===G.worked.a||parseFloat(v)===parseFloat(G.worked.a)){
      mkfeed($("#wkfb"),"Yes! Now head back and open that gate.",true);SND.win();
      setTimeout(()=>$("#workedModal").classList.remove("open"),1100);
    }else{mkfeed($("#wkfb"),"Walk the steps above again — you've got this.",false);SND.thud()}
  });
}

/* ---------- badges ---------- */
function buildBadges(){
  $("#badges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"earned":""}" id="badge-${b.id}" title="${b.label}" role="img" aria-label="${b.label}${solved.has(b.id)?" — earned":" — locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
}
function earnBadge(id){buildBadges();const el=$("#badge-"+id);if(el){el.classList.remove("earned");void el.offsetWidth;el.classList.add("earned")}const b=BADGES.find(x=>x.id===id);if(b)live("Badge earned: "+b.label)}

/* ---------- progress ---------- */
function buildProgress(){$("#progress").innerHTML=PAGES.map((_,i)=>`<span class="dot ${i<=page?"on":""}"></span>`).join("")}

/* ---------- navigation & rendering ---------- */
const isMobile=()=>mobileMQ.matches;
function leftIndex(){return isMobile()?page:page-(page%2)}
function visiblePages(){return isMobile()?[page]:[leftIndex(),leftIndex()+1].filter(i=>i<PAGES.length)}
function blockedBy(){return null/* locks removed: gates still teach via hints + Ask VEX worked examples, but never block turning the page (Neft 2026-06-11) */}

function renderSpread(){
  const L=$("#pageL"),R=$("#pageR");
  if(isMobile()){L.innerHTML=pageInnerHTML(page);L.classList.remove("offscreen");R.classList.add("offscreen");R.innerHTML="";mountGates(L)}
  else{const li=leftIndex();L.innerHTML=pageInnerHTML(li);R.innerHTML=pageInnerHTML(li+1<PAGES.length?li+1:null);L.classList.remove("offscreen");R.classList.remove("offscreen");mountGates(L);mountGates(R)}
  buildProgress();updateNav();updateEdges();
  if(PAGES[page])live(`Page ${page+1} of ${PAGES.length}. ${PAGES[page].ch}.`);
  storage.set(K("page"),page);
  if($("#certName")){$("#certName").value=storage.get(K("name"))||"";$("#certName").addEventListener("input",e=>storage.set(K("name"),e.target.value));
    $("#certBadges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"":"locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
    $("#printCert").addEventListener("click",()=>{document.body.classList.add("print-cert");window.print();setTimeout(()=>document.body.classList.remove("print-cert"),400)});}
}
function updateEdges(){const f=page/Math.max(1,PAGES.length-1);$("#edgesL").style.width=(4+f*12)+"px";$("#edgesR").style.width=(16-f*12)+"px"}
function updateNav(){
  $("#prevBtn").disabled=page<=0||turning;
  const lastVisible=Math.max(...visiblePages());
  const end=lastVisible>=PAGES.length-1;
  const blocked=blockedBy();
  $("#nextBtn").disabled=end||turning;
  $("#nextBtn").classList.toggle("locked",!!blocked&&!end);
  $("#nextBtn").innerHTML=blocked&&!end?"🔒":"›";
  $("#nextBtn").setAttribute("aria-label",blocked?"Locked — solve the gate on this page to continue":"Next page");
}
function step(dir){
  if(turning)return;
  if(dir>0){
    const blocked=blockedBy();
    if(blocked){const G=GATES[blocked];SND.thud();$("#nextBtn").classList.add("shake");setTimeout(()=>$("#nextBtn").classList.remove("shake"),700);
      live("This page is gated. Solve "+G.title+" to continue.");
      const gb=document.querySelector(".gatebox");if(gb){gb.classList.add("unlockflash");setTimeout(()=>gb.classList.remove("unlockflash"),1000)}
      return}
    const lastVisible=Math.max(...visiblePages());
    if(lastVisible>=PAGES.length-1)return;
    const target=isMobile()?page+1:leftIndex()+2;
    animTurn(1,target);
  }else{
    if(page<=0)return;
    const target=isMobile()?page-1:Math.max(0,leftIndex()-2);
    animTurn(-1,target);
  }
}
function animTurn(dir,target){
  if(isMobile()||reducedMQ.matches||!prefs.motion){page=target;renderSpread();SND.flip();return}
  turning=true;SND.flip();
  const sheet=$("#turnSheet"),front=sheet.querySelector(".ts.front"),back=sheet.querySelector(".ts.back");
  const oldL=leftIndex();
  if(dir>0){
    front.innerHTML=pageInnerHTML(oldL+1<PAGES.length?oldL+1:null);
    back.innerHTML=pageInnerHTML(target<PAGES.length?target:null);
    page=target;
    /* underneath: left stays old-left, right becomes new-right */
    $("#pageR").innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    sheet.className="";sheet.classList.add("show","fwd");
  }else{
    front.innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    back.innerHTML=pageInnerHTML(oldL);
    page=target;
    $("#pageL").innerHTML=pageInnerHTML(target);
    sheet.className="";sheet.classList.add("show","back");
  }
  const done=()=>{sheet.classList.remove("show","fwd","back");sheet.removeEventListener("animationend",done);turning=false;renderSpread()};
  sheet.addEventListener("animationend",done);
  setTimeout(()=>{if(turning){done()}},1000);
}

/* ---------- parallax ---------- */
let rafPending=false,px=0,py=0;
function applyParallax(){
  rafPending=false;
  if(!prefs.motion||reducedMQ.matches)return;
  document.querySelectorAll("#spreadWrap .panel3d").forEach(p=>{
    p.style.transform=`rotateY(${px*4}deg) rotateX(${-py*3}deg)`;
    p.querySelectorAll("[data-depth]").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d*.6}px,${py*d*.35}px)`});
  });
}
addEventListener("pointermove",e=>{
  px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2;
  if(!rafPending){rafPending=true;requestAnimationFrame(applyParallax)}
  const cc=$("#coverCard");
  if(cc&&!$("#cover").hidden&&prefs.motion&&!reducedMQ.matches){
    cc.style.transform=`rotateY(${px*9}deg) rotateX(${-py*7}deg)`;
    cc.querySelectorAll(".cov-layer").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d}px,${py*d*.6}px)`});
  }
},{passive:true});

/* note: SVG <g data-depth> transform via style works in modern browsers (SVG2). Wrapped above for safety. */

/* ---------- HUD toggles ---------- */
function syncToggles(){
  $("#sndBtn").setAttribute("aria-pressed",prefs.sound);$("#sndBtn").textContent=prefs.sound?"🔊 Sound":"🔇 Sound";
  $("#motBtn").setAttribute("aria-pressed",prefs.motion);$("#motBtn").textContent=prefs.motion?"3D On":"3D Off";
  $("#txtBtn").setAttribute("aria-pressed",prefs.bigtext);document.documentElement.dataset.textsize=prefs.bigtext?"lg":"md";
  $("#hcBtn").setAttribute("aria-pressed",prefs.hc);document.body.classList.toggle("hc",prefs.hc);
  if(!prefs.motion)document.querySelectorAll(".panel3d").forEach(p=>p.style.transform="");
  storage.set(K("prefs"),prefs);
}
$("#sndBtn").addEventListener("click",()=>{prefs.sound=!prefs.sound;ac();syncToggles();SND.blip()});
$("#motBtn").addEventListener("click",()=>{prefs.motion=!prefs.motion;syncToggles()});
$("#txtBtn").addEventListener("click",()=>{prefs.bigtext=!prefs.bigtext;syncToggles()});
$("#hcBtn").addEventListener("click",()=>{prefs.hc=!prefs.hc;syncToggles()});

/* ---------- teacher panel ---------- */
function buildTeacher(){
  $("#teacherBody").innerHTML=`
    <p style="font:600 .9rem/1.45 'Segoe UI'">${VOLUME.unit} — interactive graphic novel. Story pauses at six <b>reader gates</b>; students must solve grade-level math problems to continue. Progress, badges, and settings persist per device.</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">SUGGESTED USE</h3>
    <p style="font:600 .88rem/1.45 'Segoe UI'">${TEACHER.suggested}</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">STANDARDS ALIGNMENT (CCSS)</h3>
    <table class="tt"><tr><th>Standard</th><th>Description</th><th>Where</th></tr>
    ${TEACHER.standards.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">ANSWER KEY</h3>
    <table class="tt"><tr><th>Gate</th><th>Answer &amp; notes</th></tr>
    ${TEACHER.answers.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</table>
    <p style="font:600 .8rem/1.4 'Segoe UI';color:#666">Hints escalate: conceptual → procedural → VEX worked example (parallel problem; never reveals the gate answer). Sound is off by default. 3D motion can be disabled (auto-disabled for reduced-motion users). © EduWonderLab — single-file, offline-safe, no data leaves the device.</p>`;
}
$("#teacherBtn").addEventListener("click",()=>{buildTeacher();$("#teacherModal").classList.add("open")});
$("#printTeacher").addEventListener("click",()=>{document.body.classList.add("print-teacher");window.print();setTimeout(()=>document.body.classList.remove("print-teacher"),400)});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest(".modal").classList.remove("open")));

/* ---------- input ---------- */
$("#nextBtn").addEventListener("click",()=>{ac();step(1)});
$("#prevBtn").addEventListener("click",()=>{ac();step(-1)});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){$("#teacherModal").classList.remove("open");return}
  if($(".modal.open"))return;
  if(["ArrowRight","PageDown"].includes(e.key))step(1);
  if(["ArrowLeft","PageUp"].includes(e.key))step(-1);
});
let tx=null;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60&&!$(".modal.open"))step(dx<0?1:-1);tx=null},{passive:true});
mobileMQ.addEventListener("change",()=>renderSpread());

/* ---------- boot ---------- */
function openBook(){
  $("#cover").hidden=true;$("#hud").hidden=false;$("#stage").hidden=false;
  $("#prevBtn").hidden=false;$("#nextBtn").hidden=false;
  renderSpread();
}
$("#startBtn").addEventListener("click",()=>{ac();page=0;openBook()});
$("#resumeBtn").addEventListener("click",()=>{ac();openBook()});
if((storage.get(K("page"))||0)>0||solved.size>0){$("#resumeBtn").hidden=false}
if(reducedMQ.matches){prefs.motion=false}
document.body.classList.toggle("reduced",reducedMQ.matches);
buildBadges();syncToggles();buildProgress();
</script>

        '<canvas class="hp-canvas" id="hpCanvas" width="700" height="190"></canvas>' +
      '</div>' +
      '<div class="hp-pane" data-hp-pane="crew" id="hpCrewHost"></div>' +
    '</div>';
  document.body.appendChild(modal);

  function openHolopad(){ modal.classList.add("open"); renderLab(); renderCrew(); initCanvas(); }
  if(document.getElementById("holopadBtn")){
    document.getElementById("holopadBtn").addEventListener("click", openHolopad);
  }
  modal.querySelector("[data-hp-close]").addEventListener("click", function(){ modal.classList.remove("open"); });
  modal.addEventListener("click", function(e){
    if(e.target === modal) modal.classList.remove("open");
    var tb = e.target.closest("[data-hp-tab]");
    if(tb){
      Array.prototype.slice.call(modal.querySelectorAll("[data-hp-tab]")).forEach(function(b){ b.classList.toggle("active", b===tb); });
      Array.prototype.slice.call(modal.querySelectorAll("[data-hp-pane]")).forEach(function(p){ p.classList.toggle("active", p.dataset.hpPane===tb.dataset.hpTab); });
    }
  });

  function renderCrew(){
    var host = document.getElementById("hpCrewHost");
    if(!host || host.dataset.built) return;
    host.dataset.built = "1";
    var castObj = (typeof CAST !== "undefined") ? CAST : {};
    var syms = { maya:"#sym-maya", theo:"#sym-theo", zara:"#sym-zara", dev:"#sym-dev" };
    var roles = {
      maya: "Lead Field Investigator · Models problems visually before computing",
      theo: "Systems Engineer · Verifies unit rates, alignment, and table rules",
      zara: "Tactical Specialist · Tests edge cases and inverse operations",
      dev: "Companion Synthesis Unit · Flags classic math traps before lock-in"
    };
    var html = '<div class="hp-crew-grid">';
    ["maya","theo","zara","dev"].forEach(function(k){
      var c = castObj[k] || { name: k.toUpperCase(), color: "#1d4ed8" };
      html += '<div class="hp-crew-card">' +
        '<div class="hp-crew-av"><svg viewBox="0 0 120 140"><use href="' + syms[k] + '"/></svg></div>' +
        '<div style="font:900 .9rem \'Arial Black\',sans-serif;color:#0f172a">' + c.name + '</div>' +
        '<div style="font:700 .76rem/1.35 \'Segoe UI\',sans-serif;color:#475569;margin-top:4px">' + roles[k] + '</div>' +
      '</div>';
    });
    html += '</div>';
    host.innerHTML = html;
  }

  function renderLab(){
    var host = document.getElementById("hpLabHost");
    if(!host || host.dataset.built) return;
    host.dataset.built = "1";
    var a = 6, b = 4, c = 2;
    host.innerHTML =
      '<div style="font:800 .86rem \'Segoe UI\',sans-serif;color:#0f172a;margin-bottom:6px">' +
        'Adjust quantities <b>A</b>, <b>B</b>, and <b>Scale / Input X</b> below to test Unit ' + unitNum + ' relationships live:' +
      '</div>' +
      '<div id="hpSvgStage"></div>' +
      '<div class="hp-ctrl-row">' +
        '<label>Value A: <input type="range" min="1" max="24" value="6" data-hpa/> <b data-hpa-v>6</b></label>' +
        '<label>Value B: <input type="range" min="1" max="24" value="4" data-hpb/> <b data-hpb-v>4</b></label>' +
        '<label>Multiplier / X: <input type="range" min="-8" max="12" value="2" data-hpc/> <b data-hpc-v>2</b></label>' +
      '</div>' +
      '<div class="hp-readout" id="hpReadout"></div>';

    function update(){
      var stage = document.getElementById("hpSvgStage");
      var ro = document.getElementById("hpReadout");
      var k = Math.max(1, Math.abs(c));
      var w1 = Math.min(280, a * 11), w2 = Math.min(280, b * 11);
      stage.innerHTML =
        '<svg viewBox="0 0 640 110" style="width:100%;height:auto;background:#fff;border:2px solid #0f172a;border-radius:8px">' +
          '<rect x="20" y="18" width="' + w1 + '" height="28" rx="4" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>' +
          '<text x="' + (28 + w1) + '" y="37" font-size="13" font-weight="900" fill="#0f172a">A = ' + a + ' (Scaled ×' + k + ' = ' + (a*k) + ')</text>' +
          '<rect x="20" y="62" width="' + w2 + '" height="28" rx="4" fill="#f2b705" stroke="#0f172a" stroke-width="2"/>' +
          '<text x="' + (28 + w2) + '" y="81" font-size="13" font-weight="900" fill="#0f172a">B = ' + b + ' (Scaled ×' + k + ' = ' + (b*k) + ')</text>' +
        '</svg>';
      var ratioTxt = "Ratio A:B = " + a + ":" + b + " · Unit Rate (A/B) = " + (a/b).toFixed(2);
      var algTxt = "Linear Rule y = A·x + B at x=" + c + " → y = " + (a*c + b);
      var geomTxt = "Rect Area = " + (a*b) + " · Tri Area = " + (0.5*a*b) + " · Prism Vol (×" + k + ") = " + (a*b*k);
      ro.innerHTML =
        '<span><b>Proportional / Fraction:</b> <code>' + ratioTxt + '</code></span>' +
        '<span><b>Algebraic / Linear:</b> <code>' + algTxt + '</code></span>' +
        '<span><b>Geometric:</b> <code>' + geomTxt + '</code></span>';
    }
    ["a","b","c"].forEach(function(k){
      host.querySelector("[data-hp" + k + "]").addEventListener("input", function(e){
        if(k==="a") a = +e.target.value;
        if(k==="b") b = +e.target.value;
        if(k==="c") c = +e.target.value;
        host.querySelector("[data-hp" + k + "-v]").textContent = e.target.value;
        update();
      });
    });
    update();
  }

  function initCanvas(){
    var cv = document.getElementById("hpCanvas");
    if(!cv || cv.dataset.wired) return;
    cv.dataset.wired = "1";
    var ctx = cv.getContext("2d");
    var ink = "#0f172a", drawing = false, lx = 0, ly = 0;
    function bg(mode){
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.save();
      ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 1;
      for(var x=0;x<cv.width;x+=20){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cv.height); ctx.stroke(); }
      for(var y=0;y<cv.height;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cv.width,y); ctx.stroke(); }
      if(mode==="axes"){
        ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cv.width/2,0); ctx.lineTo(cv.width/2,cv.height);
        ctx.moveTo(0,cv.height/2); ctx.lineTo(cv.width,cv.height/2); ctx.stroke();
      }
      ctx.restore();
    }
    bg("grid");
    function pos(e){
      var r = cv.getBoundingClientRect();
      var cx = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
      var cy = e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY;
      return { x: ((cx - r.left)/(r.width||1))*cv.width, y: ((cy - r.top)/(r.height||1))*cv.height };
    }
    cv.addEventListener("mousedown", function(e){ drawing=true; var p=pos(e); lx=p.x; ly=p.y; });
    cv.addEventListener("mousemove", function(e){
      if(!drawing) return;
      var p=pos(e); ctx.strokeStyle=ink; ctx.lineWidth=2.8; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke();
      lx=p.x; ly=p.y;
    });
    window.addEventListener("mouseup", function(){ drawing=false; });
    Array.prototype.slice.call(modal.querySelectorAll("[data-hp-ink]")).forEach(function(b){
      b.addEventListener("click", function(){ ink = b.dataset.hpInk; });
    });
    Array.prototype.slice.call(modal.querySelectorAll("[data-hp-bg]")).forEach(function(b){
      b.addEventListener("click", function(){ bg(b.dataset.hpBg); });
    });
  }
})();
</script>

<script type="application/json" id="gn-vocab">[{"term":"Convert Measurements within the Same System","termEs":"Convertir medidas dentro del mismo sistema","definition":"Rewriting a measurement in a different unit of the SAME system, such as feet into inches or liters into milliliters.","definitionEs":"Reescribir una medida en otra unidad del MISMO sistema, como pies a pulgadas o litros a mililitros.","visual":"4 feet = 48 inches; 4 liters = 4,000 milliliters","role":"concept","img":"/assets/vocab-images/concept-convert-measurements-within-the-same-system.svg","lesson":"3-6"},{"term":"Conversion factor","termEs":"Factor de conversión","definition":"The ratio that links two units in the same measurement system, such as 12 inches to 1 foot. Within one system it is exact.","definitionEs":"La razón que relaciona dos unidades del mismo sistema de medición, como 12 pulgadas a 1 pie. Dentro de un mismo sistema es exacta.","visual":"1 ft = 12 in. · 1 L = 1,000 mL · 1 lb = 16 oz","img":"/assets/vocab-images/measurement.svg","lesson":"3-6"},{"term":"Unit ratio","termEs":"Razón unitaria","definition":"A ratio that compares an amount to exactly 1 unit of another quantity, like 12 inches to 1 foot.","definitionEs":"Una razón que compara una cantidad con exactamente 1 unidad de otra cantidad, como 12 pulgadas por 1 pie.","visual":"12 : 1 — twelve inches for every one foot","img":"/assets/vocab-images/unit-rate.svg","lesson":"3-6"},{"term":"Convert","termEs":"Convertir","definition":"To change a measurement from one unit to another without changing how much it is.","definitionEs":"Cambiar una medida de una unidad a otra sin cambiar la cantidad que representa.","visual":"4 ft and 48 in are the same height, written two ways","img":"/assets/vocab-images/measurement.svg","lesson":"3-6"},{"term":"Measurement system","termEs":"Sistema de medidas","definition":"A family of units that go together — customary units like inches and feet, or metric units like milliliters and liters.","definitionEs":"Una familia de unidades que van juntas: unidades usuales como pulgadas y pies, o métricas como mililitros y litros.","visual":"Customary: 12 in = 1 ft · Metric: 1,000 mL = 1 L","img":"/assets/vocab-images/concept-measurement-system.svg","lesson":"3-6"},{"term":"Double number line","termEs":"Recta numérica doble","definition":"Two number lines lined up so matching tick marks show two units for the same amount.","definitionEs":"Dos rectas numéricas alineadas para que las marcas correspondientes muestren dos unidades de la misma cantidad.","visual":"Liters 0, 1, 2, 3, 4 above milliliters 0, 1,000, 2,000, 3,000, 4,000","img":"/assets/vocab-images/number-line.svg","lesson":"3-6"},{"term":"Ratio table","termEs":"Tabla de razones","definition":"A table of equal ratios that lets you scale a conversion up or down one row at a time.","definitionEs":"Una tabla de razones iguales que permite escalar una conversión hacia arriba o hacia abajo fila por fila.","visual":"1 ft : 12 in, 2 ft : 24 in, 4 ft : 48 in","img":"/assets/vocab-images/ratio-table.svg","lesson":"3-6"},{"term":"Customary units","termEs":"Unidades del sistema usual","definition":"The U.S. system of units: inch, foot, yard, mile, ounce, pound, cup, quart, gallon.","definitionEs":"El sistema de unidades de EE. UU.: pulgada, pie, yarda, milla, onza, libra, taza, cuarto, galón.","visual":"12 in = 1 ft","img":"/assets/vocab-images/measurement.svg","lesson":"3-6"},{"term":"Metric units","termEs":"Unidades métricas","definition":"The base-10 system of units: meter, gram, liter.","definitionEs":"El sistema de unidades en base 10: metro, gramo, litro.","visual":"1 km = 1,000 m","img":"/assets/vocab-images/measurement.svg","lesson":"3-6"},{"term":"Convert Measurements Between Systems","termEs":"Convertir medidas entre sistemas","definition":"Rewriting a customary measurement as a metric one, or the reverse, so two amounts can be compared.","definitionEs":"Reescribir una medida usual como métrica, o al revés, para poder comparar dos cantidades.","visual":"100 kilometers ≈ 60 miles","role":"concept","img":"/assets/vocab-images/concept-convert-measurements-between-systems.svg","lesson":"3-7"},{"term":"Customary system","termEs":"Sistema usual","definition":"The measurement system used in the United States: inches, feet, miles, ounces, pounds, cups, quarts, gallons.","definitionEs":"El sistema de medidas que se usa en Estados Unidos: pulgadas, pies, millas, onzas, libras, tazas, cuartos y galones.","visual":"in · ft · mi · oz · lb · qt · gal","img":"/assets/vocab-images/concept-customary-system.svg","lesson":"3-7"},{"term":"Metric system","termEs":"Sistema métrico","definition":"The measurement system used in most of the world, built on tens: centimeters, meters, kilometers, grams, kilograms, liters.","definitionEs":"El sistema de medidas que se usa en casi todo el mundo, basado en decenas: centímetros, metros, kilómetros, gramos, kilogramos y litros.","visual":"cm · m · km · g · kg · mL · L","img":"/assets/vocab-images/concept-metric-system.svg","lesson":"3-7"},{"term":"Approximately","termEs":"Aproximadamente","definition":"Close to, but not exactly equal. A rounded conversion factor gives an approximate result, written with ≈; an exact conversion uses =.","definitionEs":"Cercano, pero no exactamente igual. Un factor de conversión redondeado da un resultado aproximado, escrito con ≈; una conversión exacta usa =.","visual":"1 km ≈ 0.6 mi, not exactly 0.6","img":"/assets/vocab-images/estimate.svg","lesson":"3-7"},{"term":"Reasonableness","termEs":"Sentido lógico","definition":"Checking that the size of an answer makes sense for the situation.","definitionEs":"Comprobar que el tamaño de una respuesta tiene sentido para la situación.","visual":"A bigger unit should give a smaller number.","img":"/assets/vocab-images/reasonableness.svg","lesson":"3-7"},{"term":"Multi-step problem","termEs":"Problema de varios pasos","definition":"A problem that needs two or more operations done in order.","definitionEs":"Un problema que necesita dos o más operaciones hechas en orden.","visual":"Convert the unit, then multiply.","img":"/assets/vocab-images/strategy.svg","lesson":"3-7"}]</script>
<script type="application/json" id="gn-easy">{"v":1,"map":{"Unit 3 · Episode 3 — the international qualifier. Three reader gates stand between the Courier Cup and a certified course. Solve the math to move the story.":"Unit 3 · Episode 3 — the world qualifier race. The Courier Cup needs an OK course. Three gates stand in the way. Solve the math to move the story.","Distortion reading: the qualifier route. The units are… arguing. Reader — suit up.":"Glitch check: the qualifier route. The units are… fighting. Reader, get set.","Previously, in Episode 2: ratio tables scaled the aid stations for every heat, and one honest graph debunked Team Torque's \"record\" stats — their points bent right off the line. Now the international qualifier rolls into Axiom City… and its route signs speak five different units.":"Last time, in Episode 2: ratio tables scaled the aid stops for each heat. One honest graph broke Team Torque's \"record\" stats. Their points bent off the line. Now the world qualifier comes to Axiom City. Its route signs use five different units.","Riders from four countries land at noon. Their route cards are in miles and inches. Half my signs are metric. Reconcile everything by nine — or the qualifier is OFF.":"Riders from four lands come at noon. Their route cards use \u003cb>miles\u003c/b> and \u003cb>inches\u003c/b>. Half my signs are metric. Make it all match by nine. If not, the qualifier is OFF.","A unit side quest before the main race. Kofi — co-op mode?":"A unit side quest before the main race. Kofi, team up?","Co-op. First fact for the record: the course never changes. Only its labels do.":"Team up. First fact: the course never changes. Only its \u003ci>labels\u003c/i> do.","Confirmed. A conversion is just a ratio in a trench coat.":"Yes. A conversion is just a ratio in a coat.","The staging tent, 6:40 a.m. Chloe stencils blank signboards. Rohan rolls the surveyor wheel in circles. It clicks. He loves it.":"The tent, 6:40 a.m. Chloe paints blank signs. Rohan rolls the wheel in circles. It clicks. He loves it.","Watch one: the connector sign says 0.8 km. Meters are smaller, so the count grows — 0.8 × 1000 = 800 m. Same path, new name.":"Watch this one. The sign says \u003cb>0.8 km\u003c/b>. Meters are smaller, so the count grows: 0.8 × 1000 = \u003cb>800 m\u003c/b>. Same path, new name.","The wheel agrees. One click per meter. Eight hundred clicks of pure joy.":"The wheel agrees. One click per meter. Eight hundred clicks of pure joy.","Metric rule, archived: every step is a power of ten. 1 m = 100 cm. 1 kg = 1000 g. And always — bigger unit, smaller number.":"Metric rule: each step is a power of ten. 1 m = 100 cm. 1 kg = 1000 g. And always: bigger unit, smaller number.","Converting within a system means trading one unit for another in the SAME family — multiply or divide by 10, 100, or 1000.":"\u003cb>Converting within a system\u003c/b>: you swap one unit for a new one. Both are in the SAME group. Multiply or divide by 10, 100, or 1000.","Reader — two crooked signs left. Re-label them before the marshal melts.":"Reader, two wrong signs are left. Fix their labels before the marshal melts.","Two signs still lie. Sign A marks the finish chute as 5.5 m, but the stencil wants centimeters. Sign B marks the ice supply as 4500 g, but the marshal's sheet wants kilograms. Re-label both.":"Two signs are still wrong. Sign A says the finish chute is \u003cb>5.5 m\u003c/b>. But it should be in \u003cb>centimeters\u003c/b>. Sign B says the ice is \u003cb>4500 g\u003c/b>. But the sheet wants \u003cb>kilograms\u003c/b>. Fix both labels.","Conceptual: a conversion never changes the chute or the ice — only the counting unit. Trading DOWN to a smaller unit means MORE of them (multiply); trading UP to a bigger unit means FEWER (divide).":"Conceptual: a conversion never changes the chute or the ice. Only the unit changes. Go DOWN to a smaller unit? Then you get MORE of them (multiply). Go UP to a bigger unit? Then you get FEWER (divide).","Procedural: centi- is the ×100 step (1 m = 100 cm) and kilo- is the ×1000 jump (1 kg = 1000 g). Sign A: multiply by 100. Sign B: divide by 1000.":"Procedural: centi- is the ×100 step (1 m = 100 cm). Kilo- is the ×1000 jump (1 kg = 1000 g). Sign A: multiply by 100. Sign B: divide by 1000.","My bridge chart. Two facts. Guard them with your lives.":"My bridge chart. Two facts. Guard them well.","Watch one more: the 4 km connector in miles — 4 ÷ 1.6 = 2.5 mi. Fewer miles than kilometers, because each mile is longer.":"Watch one more. The 4 km path in miles: 4 ÷ 1.6 = \u003cb>2.5 mi\u003c/b>. Fewer miles than kilometers. Each mile is \u003ci>longer\u003c/i>.","And tiny stuff works the same: a 2-inch number plate is 2 × 2.54 = 5.08 cm. Centimeters are shorter, so the count grows. Direction check on everything.":"Small things work the same. A 2-inch number plate is 2 × 2.54 = \u003cb>5.08 cm\u003c/b>. Centimeters are shorter, so the count grows. Check the way you go each time.","Converting between systems uses a bridge ratio — a fact like 1 mi ≈ 1.6 km that names one unit in terms of the other. Then multiply or divide, and sanity-check the direction.":"\u003cb>Converting between systems\u003c/b> uses a bridge ratio. It is a fact like 1 mi ≈ 1.6 km. It names one unit with the other. Then multiply or divide. Check which way you go.","Reader, take the chart. The big loop and the sticker strip — call them across the bridge.":"Reader, take the chart. Take the big loop and the sticker strip across.","The marshal's chart: 1 mi ≈ 1.6 km · 1 in = 2.54 cm. Two route cards left: the 12 km loop in miles, and a 5-inch sticker strip in centimeters.":"The marshal's chart: \u003cb>1 mi ≈ 1.6 km · 1 in = 2.54 cm\u003c/b>. Two route cards are left. Put the \u003cb>12 km\u003c/b> loop in \u003cb>miles\u003c/b>. Put a \u003cb>5-inch\u003c/b> sticker strip in \u003cb>centimeters\u003c/b>.","Conceptual: between systems you need a bridge ratio — a fact that names ONE unit in terms of the other. Then it's the same direction game: longer unit, fewer of them; shorter unit, more of them.":"Conceptual: between systems, you need a bridge ratio. It names ONE unit with the other. Then it is the same game. Longer unit, fewer of them. Shorter unit, more of them.","Procedural: km → miles crosses the 1.6 bridge by DIVISION (each mile swallows 1.6 km of road). Inches → centimeters crosses the 2.54 bridge by MULTIPLICATION (each inch is worth 2.54 cm).":"Procedural: km → miles: cross the 1.6 bridge by DIVISION. Each mile holds 1.6 km of road. Inches → centimeters: cross the 2.54 bridge by MULTIPLICATION. Each inch is worth 2.54 cm.","8:15 a.m. Forty signboards, one stencil, two systems, zero mistakes allowed.":"8:15 a.m. Forty signs. One stencil. Two systems. No room to slip.","Every sign gets BOTH labels now. Could I have painted them churro-scented? Yes. Did the marshal let me? No.":"Each sign gets BOTH labels now. Could I make them smell like churros? Yes. Did the marshal let me? No.","Rohan and Kofi run the numbers, Chloe paints, I check the checklist. Crew at full velocity.":"Rohan and Kofi do the numbers. Chloe paints. I check the list. The crew is at full speed.","Distortion fading… except at the marshal's desk. Something on a clipboard is about to go wrong on purpose.":"The glitch fades. But not at the marshal's desk. Something on a clipboard will go wrong on purpose.","8:40 a.m. The marshal's desk. Team Torque arrives with matching jackets and a complaint.":"8:40 a.m. The marshal's desk. Team Torque shows up. Same jackets. One complaint.","Your \"total course\" is a scramble of miles and kilometers. I say it doesn't add up — and if it doesn't add up by nine, nobody races.":"Your \"total course\" mixes miles and kilometers. I say it does not add up. If not by nine, \u003cb>nobody\u003c/b> races.","It adds up fine. You just have to put every leg in the same units before you add. That's the whole rule.":"It adds up fine. Put each leg in the \u003cb>same units\u003c/b>. Then add. That is the whole rule.","Final boss just announced itself. Certification form, two blanks, one trap question.":"The last boss is here. A form with two blanks and one trick question.","Adding 2 and 3.2 while their units disagree would be… a distortion. Convert first. Add second.":"Adding 2 and 3.2 when the units are not the same? That would be… a glitch. Convert first. Add second.","8:55 a.m. The form that decides everything. The marshal uncaps the official pen.":"8:55 a.m. This form decides it all. The marshal opens the pen.","Easy out for you all: everyone knows 1 kilometer is longer than 1 mile. Write that down, see what happens.":"Here is an easy way out. All know \u003cb>1 kilometer is longer than 1 mile\u003c/b>. Write that down. See what happens.","The form takes true statements only. Crew — and reader — finish it.":"The form takes \u003ci>true\u003c/i> facts only. Crew and reader, finish it.","BOSS GATE. Three locks. The qualifier — and Torque's smug face — hang on your conversions.":"BOSS GATE. Three locks. The qualifier rides on your conversions. So does Torque's smug face.","Boss fight, reader. You carry the chart, I'll carry the pens.":"Boss fight, reader. You carry the chart. I will carry the pens.","The certification form. The course = a 2-mile harbor leg plus a 3.2 km hillside leg (chart: 1 mi ≈ 1.6 km). Three locks:":"The form. The course = a \u003cb>2-mile\u003c/b> leg plus a \u003cb>3.2 km\u003c/b> leg. Chart: 1 mi ≈ 1.6 km. Three locks:","The Torque captain's claim — \"1 kilometer is longer than 1 mile.\" True or false?":"The Torque captain says: \"1 kilometer is longer than 1 mile\". True or false?","Conceptual: you can only ADD lengths that wear the SAME unit — convert first, add second. Then kilometers to meters is a within-system step: the ×1000 jump.":"Conceptual: you can only ADD lengths with the SAME unit. Convert first. Add second. Then kilometers to meters is a within-system step: the ×1000 jump.","Procedural: Lock 1 — turn the 2-mile leg into kilometers (each mile ≈ 1.6 km), then add the 3.2. Lock 2 — push your Lock 1 total down the km → m staircase. Lock 3 — read the bridge fact again: if 1 mile ≈ 1.6 km, which unit is longer?":"Procedural: Lock 1: make the 2-mile leg into kilometers (each mile ≈ 1.6 km). Then add the 3.2. Lock 2: take your Lock 1 total from km → m. Lock 3: read the bridge fact again. If 1 mile ≈ 1.6 km, which unit is longer?","Certified — every sign, both systems, one honest course. Protest dismissed. The heats run at noon.":"Approved. Each sign, both systems, one honest course. Complaint thrown out. The heats run at noon.","For the record: the captain's \"easy out\" was 0.6 kilometers short of true.":"And note: the captain's \"easy out\" was 0.6 kilometers off.","Side quest complete. Main quest: the Courier Cup itself. Loot: one library.":"Side quest done. Main quest: the Courier Cup. Prize: one library.","New distortion at the start line. It's fast. To be continued…":"A new glitch is at the start line. It is fast. To be continued…","Within a system.Trade units in the same family by powers of ten: 1 m = 100 cm, 1 kg = 1000 g. Bigger unit, smaller number — and the other way around.":"\u003cb>Within a system.\u003c/b>\u003cspan>Trade units in one group by powers of ten: 1 m = 100 cm, 1 kg = 1000 g. Big unit, small count. Small unit, big count.\u003c/span>","Between systems.Cross on a bridge ratio: 1 mi ≈ 1.6 km, 1 in = 2.54 cm. Multiply or divide by the bridge number.":"\u003cb>Between systems.\u003c/b>\u003cspan>Cross on a bridge ratio: 1 mi ≈ 1.6 km, 1 in = 2.54 cm. Multiply or divide by the bridge number.\u003c/span>","The direction check.Before you accept an answer, ask: should the count get bigger or smaller? Longer unit, fewer of them.":"\u003cb>The direction check.\u003c/b>\u003cspan>Look at your answer. Should the count get big or get small? Longer unit, fewer of them.\u003c/span>","Across the line.A distance never changes when its name does. Units are ratios — convert first, add second.":"\u003cb>Across the line.\u003c/b>\u003cspan>A distance does not change when its name does. Units are ratios. Convert first. Add second.\u003c/span>","completed Unit 3 · Episode 3: Across the Line and proved mastery over converting measurement units within a system and between systems.":"beat \u003cb>Unit 3 · Episode 3: Across the Line\u003c/b>. They can convert units. They can do it in one system. And they can do it between two.","A banner crew re-labels a 3.2 m banner in centimeters. Smaller unit, bigger count: 3.2 × 100 = 320 cm.":"\u003cspan>A crew puts a 3.2 m banner in centimeters. Smaller unit, bigger count: 3.2 × 100 = 320 cm.\u003c/span>","A water crate weighs 7000 g and the sheet wants kilograms. Bigger unit, smaller count: 7000 ÷ 1000 = 7 kg.":"\u003cspan>A crate of water is 7000 g. The sheet wants kilograms. Bigger unit, smaller count: 7000 ÷ 1000 = 7 kg.\u003c/span>","Direction check both times: the number GREW going m → cm and SHRANK going g → kg. The banner and the water never changed.":"\u003cspan>Check the way it went: the number GREW going m → cm. It SHRANK going g → kg. The banner and the water did not change.\u003c/span>","Your turn — same idea, different numbers:":"Your turn. Same idea, new numbers:","Re-label 2500 g in kilograms.":"Put 2500 g in kilograms.","The 8 km river leg in miles: 8 ÷ 1.6 = 80 ÷ 16 = 5 miles. Fewer miles than kilometers — direction checks out.":"\u003cspan>The 8 km river leg in miles: 8 ÷ 1.6 = 80 ÷ 16 = 5 miles. Fewer miles than kilometers. That is the right way.\u003c/span>","A 3-inch decal in centimeters: 3 × 2.54 = 7.62 cm. More centimeters than inches — checks out again.":"\u003cspan>A 3-inch sticker in centimeters: 3 × 2.54 = 7.62 cm. More centimeters than inches. Right again.\u003c/span>","Two bridges, one rule: write the ratio, pick the direction, then multiply or divide.":"\u003cspan>Two bridges, one rule. Write the ratio. Pick the way to go. Then multiply or divide.\u003c/span>","A 10-inch pennant is how many centimeters?":"A 10-inch flag is how many centimeters?","A practice course: a 3-mile flat leg plus a 1.2 km bridge leg.":"\u003cspan>A test course: a 3-mile flat leg plus a 1.2 km bridge leg.\u003c/span>","Same units first: 3 × 1.6 = 4.8 km. Now add: 4.8 + 1.2 = 6 km.":"\u003cspan>Same units first: 3 × 1.6 = 4.8 km. Now add: 4.8 + 1.2 = 6 km.\u003c/span>","The form wants meters too: 6 × 1000 = 6000 m. Convert, add, then step within the system.":"\u003cspan>The form wants meters too: 6 × 1000 = 6000 m. Convert, add, then step within the system.\u003c/span>","A 1-mile leg plus a 2.4 km leg — total in kilometers?":"A 1-mile leg plus a 2.4 km leg. Total in kilometers?","Sign A holds. ×1000 is the KILO jump (km ↔ m, kg ↔ g). Meters to CENTImeters is the ×100 step.":"Sign A is wrong. ×1000 is the KILO jump (km ↔ m, kg ↔ g). Meters to CENTImeters is the ×100 step.","Sign A holds. Direction check: a centimeter is SMALLER than a meter, so the count must get BIGGER — multiply.":"Sign A is wrong. Check the way: a centimeter is SMALLER than a meter. So the count must get BIGGER. Multiply.","Sign A holds. How many centimeters make one meter? Scale 5.5 by exactly that.":"Sign A is wrong. How many centimeters make one meter? Scale 5.5 by just that.","Sign B holds. ÷100 belongs to the meter–centimeter step. Grams to KILOgrams is the ÷1000 jump.":"Sign B is wrong. ÷100 goes with the meter–centimeter step. Grams to KILOgrams is the ÷1000 jump.","Sign B holds. Direction check: a kilogram is the BIGGER unit, so the count must get SMALLER — divide.":"Sign B is wrong. Check the way: a kilogram is the BIGGER unit. So the count must get SMALLER. Divide.","Sign B holds. 'Kilo' means 1000 — how many grams make one kilogram?":"Sign B is wrong. 'Kilo' means 1000. How many grams make one kilogram?","550 cm and 4.5 kg — 5.5 × 100 and 4500 ÷ 1000. Same chute, same ice, honest labels. Chloe's stencil hisses approvingly.":"550 cm and 4.5 kg: 5.5 × 100 and 4500 ÷ 1000. Same chute, same ice, honest labels. Chloe's stencil hisses. It is glad.","Card 1 holds. You went the long way — a mile is LONGER than a kilometer, so the loop holds FEWER miles. Divide by 1.6.":"Card 1 is wrong. You went the wrong way. A mile is LONGER than a kilometer. So the loop has FEWER miles. Divide by 1.6.","Card 1 holds. How many groups of 1.6 km fit inside the 12 km loop?":"Card 1 is wrong. How many 1.6 km groups fit in the 12 km loop?","Card 2 holds. Wrong direction — a centimeter is SHORTER than an inch, so the strip holds MORE centimeters. Multiply by 2.54.":"Card 2 is wrong. Wrong way. A centimeter is SHORTER than an inch. So the strip has MORE centimeters. Multiply by 2.54.","Card 2 holds. Each of the 5 inches is worth exactly 2.54 cm. Scale it.":"Card 2 is wrong. Each of the 5 inches is worth just 2.54 cm. Scale it.","12 ÷ 1.6 = 7.5 miles, and 5 × 2.54 = 12.7 cm. The riders' cards now match the city's signs. Bridge crossed.":"12 ÷ 1.6 = 7.5 miles, and 5 × 2.54 = 12.7 cm. The riders' cards now match the city's signs. Bridge crossed.","Lock 1 holds. 2 + 3.2 adds miles straight to kilometers — units that disagree can't be added. Convert the 2-mile leg to km FIRST.":"Lock 1 is shut. 2 + 3.2 adds miles right to kilometers. Units that do not match can't be added. Convert the 2-mile leg to km FIRST.","Lock 1 holds. Each mile of the harbor leg is about 1.6 km. Convert it, THEN add the 3.2 km climb.":"Lock 1 is shut. Each mile of the harbor leg is about 1.6 km. Convert it. THEN add the 3.2 km climb.","Lock 2 holds. That's the ×100 step — but 'kilo' means 1000. 1 km = 1000 m.":"Lock 2 is shut. That is the ×100 step. But 'kilo' means 1000. 1 km = 1000 m.","Lock 2 holds. Sanity check: meters are smaller than kilometers, so the count must GROW. Take your Lock 1 total ×1000.":"Lock 2 is shut. Check: meters are smaller than kilometers. So the count must GROW. Take your Lock 1 total ×1000.","Lock 3 holds. Sanity-check it against the chart: it takes 1.6 km — more than a whole kilometer — to make ONE mile. So which unit is longer?":"Lock 3 is shut. Check the chart. It takes 1.6 km to make ONE mile. That is more than a whole kilometer. So which unit is longer?","CERTIFIED. 2 × 1.6 + 3.2 = 6.4 km = 6400 m — and the mile keeps its crown as the longer unit. The marshal stamps the form. ACROSS THE LINE!":"CERTIFIED. 2 × 1.6 + 3.2 = 6.4 km = 6400 m. And the mile is still the longer unit. The marshal stamps the form. ACROSS THE LINE!","Yes! Now head back and open that gate.":"Yes! Now go back and open that gate.","Walk the steps above again — you've got this.":"Read the steps above again. You can do this."}}</script>
