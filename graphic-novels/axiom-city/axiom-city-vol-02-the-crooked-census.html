<script type="application/json" id="gn-vocab">[{"term":"Statistical Questions and Data","termEs":"Preguntas estadísticas y datos","definition":"A statistical question expects varied answers that can be collected as data.","definitionEs":"Una pregunta estadística espera respuestas variadas que se pueden recopilar como datos.","visual":"How many minutes do students in our class read each night?","role":"concept","img":"/assets/vocab-images/concept-statistical-questions-and-data.svg","lesson":"2-1"},{"term":"Statistical Question","termEs":"Pregunta estadística","definition":"A question answered with data that are expected to vary.","definitionEs":"Una pregunta que se responde con datos que se espera que varíen.","visual":"“How tall are the players on the team?” → answers vary: 60 in, 63 in, 58 in, 65 in","img":"/assets/vocab-images/data.svg","lesson":"2-1"},{"term":"Non-statistical Question","termEs":"Pregunta no estadística","definition":"A question that does not anticipate variability in the data used to answer it. It may ask for one fact or measurement.","definitionEs":"Una pregunta que no anticipa variabilidad en los datos usados para responderla. Puede pedir un solo dato o una medición.","visual":"“How tall am I?” → one answer: 60 in. Everyone who measures gets the same number.","img":"/assets/vocab-images/concept-non-statistical-question.svg","lesson":"2-1"},{"term":"Data","termEs":"Datos","definition":"Facts and numbers you collect, like answers to a survey.","definitionEs":"Datos y números que recoges, como respuestas a una encuesta.","visual":"Player heights: 60 in, 63 in, 58 in, 65 in — four different measurements","img":"/assets/vocab-images/data.svg","lesson":"2-1"},{"term":"Variability","termEs":"Variabilidad","definition":"How spread out the numbers are.","definitionEs":"Qué tan separados están los números.","visual":"Scores 10, 12, 11 are close together (low variability); scores 2, 15, 30 are far apart (high variability)","img":"/assets/vocab-images/spread.svg","lesson":"2-1"},{"term":"Survey","termEs":"Encuesta","definition":"Collecting facts by asking people questions.","definitionEs":"Recoger datos haciendo preguntas a las personas.","visual":"Asking 50 students 'What is your favorite sport?' and recording the answers","img":"/assets/vocab-images/data.svg","lesson":"2-1"},{"term":"Data distribution","termEs":"Distribución de datos","definition":"How the data looks: where it sits and how spread out it is.","definitionEs":"Cómo se ven los datos: dónde están y qué tan separados están.","visual":"A distribution is symmetric when its left and right sides have approximately matching shapes around the center.","img":"/assets/vocab-images/distribution.svg","lesson":"2-1"},{"term":"Dot plot","termEs":"Diagrama de puntos","definition":"A number line with one dot for each data value.","definitionEs":"Una recta numérica con un punto por cada valor de los datos.","visual":"One dot for each answer, stacked above its value on the line.","img":"/assets/vocab-images/data.svg","lesson":"2-1"},{"term":"Display Data with Histograms","termEs":"Representar datos con histogramas","definition":"Group numerical data into intervals and show each interval's frequency with a bar.","definitionEs":"Agrupar datos numéricos en intervalos y mostrar la frecuencia de cada intervalo con una barra.","visual":"Each touching bar shows how many values fall in one interval.","role":"concept","img":"/assets/vocab-images/concept-display-data-with-histograms.svg","lesson":"2-2"},{"term":"Histogram","termEs":"Histograma","definition":"A bar graph that groups data into equal ranges. The bars touch.","definitionEs":"Una gráfica de barras que agrupa datos en rangos iguales. Las barras se tocan.","visual":"Bars side by side: 0-9 pts (3 players), 10-19 pts (8 players), 20-29 pts (4 players)","img":"/assets/vocab-images/histogram.svg","lesson":"2-2"},{"term":"Frequency","termEs":"Frecuencia","definition":"How many times a value shows up.","definitionEs":"Cuántas veces aparece un valor.","visual":"If 5 players scored 10-19 points, the frequency for that interval is 5","img":"/assets/vocab-images/frequency.svg","lesson":"2-2"},{"term":"Interval","termEs":"Intervalo","definition":"A range of numbers used to group data.","definitionEs":"Un rango de números para agrupar datos.","visual":"0-9, 10-19, 20-29 are intervals of width 10 — each covers 10 values","img":"/assets/vocab-images/histogram.svg","lesson":"2-2"},{"term":"Distribution","termEs":"Distribución","definition":"How the data is spread out.","definitionEs":"Cómo están repartidos los datos.","visual":"Most data in the middle with fewer at the ends = bell-shaped; most on one side with a tail = skewed","img":"/assets/vocab-images/distribution.svg","lesson":"2-2"},{"term":"Frequency table","termEs":"Tabla de frecuencias","definition":"A table that lists each interval and how many values fall in it.","definitionEs":"Una tabla que muestra cada intervalo y cuántos valores caen en él.","visual":"10–19 . . . 3 means three values are between 10 and 19.","img":"/assets/vocab-images/frequency.svg","lesson":"2-2"},{"term":"Shape of the data","termEs":"Forma de los datos","definition":"The pattern the bars or dots make across the intervals.","definitionEs":"El patrón que forman las barras o los puntos a lo largo de los intervalos.","visual":"Tall in the middle and short on both sides is one shape.","img":"/assets/vocab-images/distribution.svg","lesson":"2-2"},{"term":"Peak","termEs":"Pico","definition":"The tallest bar or stack in a data display.","definitionEs":"La barra o pila más alta en una representación de datos.","visual":"The tallest bar of the histogram is the peak.","img":"/assets/vocab-images/mode.svg","lesson":"2-2"},{"term":"Describe the Data Using the Median","termEs":"Describir los datos con la mediana","definition":"Using the middle value of the ordered data to say what is typical for the whole set.","definitionEs":"Usar el valor del medio de los datos ordenados para decir qué es típico en todo el conjunto.","visual":"2, 4, 4, 6, 9 → median 4","role":"concept","img":"/assets/vocab-images/median.svg","lesson":"2-3"},{"term":"Median","termEs":"Mediana","definition":"The middle number when you put them in order.","definitionEs":"El número del medio cuando los pones en orden.","visual":"Data: 1, 3, 5, 7, 9 → the middle (3rd) value is 5, so median = 5","img":"/assets/vocab-images/median.svg","lesson":"2-3"},{"term":"Mode","termEs":"Moda","definition":"The number that shows up most often.","definitionEs":"El número que aparece más veces.","visual":"Data: 2, 3, 3, 5, 7 → 3 appears twice (most often), so mode = 3","img":"/assets/vocab-images/mode.svg","lesson":"2-3"},{"term":"Outlier","termEs":"Valor atípico","definition":"A number that is much bigger or smaller than the rest.","definitionEs":"Un número mucho mayor o menor que los demás.","visual":"Data: 10, 12, 11, 13, 50 → 50 is far from the others, so 50 is an outlier","img":"/assets/vocab-images/outlier.svg","lesson":"2-3"},{"term":"Measure of center","termEs":"Medida de tendencia central","definition":"One number that describes a typical value in a data set.","definitionEs":"Un número que describe un valor típico de un conjunto de datos.","visual":"The median is one measure of center.","img":"/assets/vocab-images/mean.svg","lesson":"2-3"},{"term":"Halfway value","termEs":"Valor intermedio","definition":"The number exactly between the two middle values of an even-count data set.","definitionEs":"El número que está exactamente entre los dos valores centrales de un conjunto con una cantidad par de datos.","visual":"Between 18 and 22, the halfway value is 20.","img":"/assets/vocab-images/median.svg","lesson":"2-3"},{"term":"Display Data with Box Plots","termEs":"Representar datos con diagramas de caja","definition":"Show a data set's five-number summary in a box-and-whisker display.","definitionEs":"Mostrar el resumen de cinco números de un conjunto de datos en un diagrama de caja y bigotes.","visual":"minimum | Q1 [ median ] Q3 | maximum","role":"concept","img":"/assets/vocab-images/concept-display-data-with-box-plots.svg","lesson":"2-4"},{"term":"Box Plot","termEs":"Diagrama de caja","definition":"A graph that shows how data is spread using five key numbers.","definitionEs":"Una gráfica que muestra cómo se reparten los datos con cinco números clave.","visual":"A box from Q1 to Q3 with a line at the median, and whiskers from min to max","img":"/assets/vocab-images/box-plot.svg","lesson":"2-4"},{"term":"Quartile","termEs":"Cuartil","definition":"Numbers that split the data into four equal parts.","definitionEs":"Números que dividen los datos en cuatro partes iguales.","visual":"Data: 2, 4, 6, 8, 10, 12, 14 → Q1 = 4 (median of lower half), Q3 = 12 (median of upper half)","img":"/assets/vocab-images/quartile.svg","lesson":"2-4"},{"term":"Interquartile Range","termEs":"Rango intercuartílico","definition":"The spread of the middle half of the data (Q3 − Q1).","definitionEs":"La extensión de la mitad central de los datos (Q3 − Q1).","visual":"If Q1 = 12 and Q3 = 20, then IQR = 20 − 12 = 8 — the middle 50% spans 8 units","img":"/assets/vocab-images/interquartile-range.svg","lesson":"2-4"},{"term":"Five-number summary","termEs":"Resumen de cinco números","definition":"The minimum, first quartile, median, third quartile, and maximum of a data set.","definitionEs":"El mínimo, el primer cuartil, la mediana, el tercer cuartil y el máximo de un conjunto de datos.","visual":"6, 8, 14, 19, 22 — the five values a box plot is built from.","img":"/assets/vocab-images/box-plot.svg","lesson":"2-4"},{"term":"Whisker","termEs":"Bigote","definition":"A line on a box plot that reaches from the box out to the least or greatest value.","definitionEs":"Una línea en un diagrama de caja que va desde la caja hasta el valor menor o mayor.","visual":"The left whisker reaches the minimum; the right whisker reaches the maximum.","img":"/assets/vocab-images/box-plot.svg","lesson":"2-4"},{"term":"Middle half","termEs":"Mitad central","definition":"The values from the first quartile to the third quartile, which the box covers.","definitionEs":"Los valores desde el primer cuartil hasta el tercer cuartil, que la caja cubre.","visual":"The box holds half of the data.","img":"/assets/vocab-images/interquartile-range.svg","lesson":"2-4"},{"term":"Range and Interquartile Range","termEs":"Rango y rango intercuartílico","definition":"Two numbers that describe spread: the range covers all the data, and the interquartile range covers only the middle half.","definitionEs":"Dos números que describen la dispersión: el rango cubre todos los datos y el rango intercuartílico solo la mitad central.","visual":"Range 26 covers 68 to 94; IQR 12.5 covers only 75.5 to 88","img":"/assets/vocab-images/interquartile-range.svg","lesson":"2-5"},{"term":"Range","termEs":"Rango","definition":"The distance from the least value to the greatest value, found by subtracting: greatest − least.","definitionEs":"La distancia del valor menor al mayor, que se halla restando: mayor − menor.","visual":"94 − 68 = 26","img":"/assets/vocab-images/range.svg","lesson":"2-5"},{"term":"Measure of variation","termEs":"Medida de variación","definition":"A single number that describes the spread of a whole data set. The range and the IQR are both measures of variation.","definitionEs":"Un solo número que describe la dispersión de todo un conjunto de datos. El rango y el RIC son medidas de variación.","visual":"One number stands in for the spread of all 20 scores","img":"/assets/vocab-images/spread.svg","lesson":"2-5"},{"term":"Extreme value","termEs":"Valor extremo","definition":"The least or greatest value in a data set, far from the rest.","definitionEs":"El valor menor o mayor de un conjunto de datos, lejos del resto.","visual":"An extreme value stretches the range.","img":"/assets/vocab-images/range.svg","lesson":"2-5"},{"term":"Algorithm","termEs":"Algoritmo","definition":"A step-by-step set of rules or instructions to solve a math problem.","definitionEs":"Un conjunto de pasos o instrucciones para resolver un problema de matemáticas.","img":"/assets/vocab-images/concept-long-division.svg","lesson":"2-6"},{"term":"Dividend","termEs":"Dividendo","definition":"The total number being divided into equal groups (the number inside the division bracket).","definitionEs":"El número total que se divide en grupos iguales (el número dentro de la galera de división).","visual":"In 1,344 ÷ 12 = 112, the dividend is 1,344 — the total amount being divided","img":"/assets/vocab-images/dividend.svg","lesson":"2-6"},{"term":"Divisor","termEs":"Divisor","definition":"The number of equal groups you are dividing into (the number outside the division bracket).","definitionEs":"El número de grupos iguales en que divides (el número fuera de la galera de división).","visual":"In 1,344 ÷ 12 = 112, the divisor is 12 — the number of equal groups","img":"/assets/vocab-images/divisor.svg","lesson":"2-6"},{"term":"Quotient","termEs":"Cociente","definition":"The answer when you divide.","definitionEs":"La respuesta cuando divides.","visual":"In 156 ÷ 12 = 13, the quotient is 13 — there are 13 groups","img":"/assets/vocab-images/quotient.svg","lesson":"2-6"},{"term":"Remainder","termEs":"Residuo","definition":"What is left over when a number does not divide evenly.","definitionEs":"Lo que sobra cuando un número no se divide de forma exacta.","visual":"17 ÷ 5 = 3 R 2 means 3 groups of 5 with 2 left over","img":"/assets/vocab-images/remainder.svg","lesson":"2-6"},{"term":"Divide Multi-Digit Numbers","termEs":"Dividir números de varias cifras","definition":"Separate a multi-digit number into equal groups to find a quotient.","definitionEs":"Separar un número de varias cifras en grupos iguales para hallar un cociente.","visual":"1,344 ÷ 12 = 112","img":"/assets/vocab-images/concept-divide-multi-digit-numbers.svg","lesson":"2-6"},{"term":"Long division","termEs":"División larga","definition":"A method that repeats four steps — divide, multiply, subtract, bring down — until there are no digits left to bring down.","definitionEs":"Un método que repite cuatro pasos — divide, multiplica, resta, baja — hasta que no quedan dígitos por bajar.","visual":"1,344 ÷ 12 → divide, multiply, subtract, bring down, repeat","img":"/assets/vocab-images/concept-long-division.svg","lesson":"2-6"},{"term":"Bring down","termEs":"Bajar el dígito","definition":"The fourth step of long division: move the next digit of the dividend down next to what is left, then start the cycle again.","definitionEs":"El cuarto paso de la división larga: baja el siguiente dígito del dividendo junto a lo que sobró y vuelve a empezar el ciclo.","visual":"13 − 12 = 1, then bring down the 4 to make 14","img":"/assets/vocab-images/concept-bring-down.svg","lesson":"2-6"},{"term":"Divide Decimals","termEs":"Dividir decimales","definition":"Find a quotient with decimals by sliding both decimal points right until the divisor is a whole number.","definitionEs":"Hallar un cociente con decimales deslizando ambos puntos decimales a la derecha hasta que el divisor sea un número entero.","visual":"8.4 ÷ 2.1 = 84 ÷ 21 = 4","role":"concept","img":"/assets/vocab-images/concept-divide-decimals.svg","lesson":"2-7"},{"term":"Decimal Division Algorithm","termEs":"Algoritmo de división decimal","definition":"The steps for dividing decimals: slide the divisor's decimal point right until the divisor is a whole number, slide the dividend's point right the same number of places, then divide.","definitionEs":"Los pasos para dividir decimales: desliza el punto decimal del divisor a la derecha hasta que sea un número entero, desliza el punto del dividendo a la derecha el mismo número de lugares y luego divide.","visual":"8.4 ÷ 2.1 → move the point in both → 84 ÷ 21 → divide, multiply, subtract, bring down → 4","img":"/assets/vocab-images/decimal-division-algorithm.svg","lesson":"2-7"},{"term":"Equivalent division","termEs":"División equivalente","definition":"Multiplying both numbers by 10 or 100 gives the same answer.","definitionEs":"Multiplicar ambos números por 10 o 100 da la misma respuesta.","visual":"7.56 ÷ 0.12 = 756 ÷ 12 = 63 (both multiplied by 100)","img":"/assets/vocab-images/divide.svg","lesson":"2-7"},{"term":"Annex a zero","termEs":"Agregar un cero","definition":"Write a zero after the last decimal digit without changing the value.","definitionEs":"Escribir un cero después del último dígito decimal sin cambiar el valor.","visual":"7.2 → 7.20","img":"/assets/vocab-images/decimal-division-algorithm.svg","lesson":"2-7"},{"term":"Power of ten","termEs":"Potencia de diez","definition":"Ten, one hundred, one thousand, and so on.","definitionEs":"Diez, cien, mil, y así sucesivamente.","visual":"Multiplying by 10 slides every digit one place.","img":"/assets/vocab-images/place-value.svg","lesson":"2-7"},{"term":"Mean","termEs":"Media","definition":"The average of a data set. Add all the values, then divide by how many values there are.","definitionEs":"El promedio de un conjunto de datos. Suma todos los valores y divide entre cuántos valores hay.","visual":"Miguel earned $60 in 4 days: 60 ÷ 4 = 15, so the mean is $15 per day.","img":"/assets/vocab-images/mean.svg","lesson":"2-8"},{"term":"Average","termEs":"Promedio","definition":"Another word for the mean — the amount each value would be if the total were shared equally.","definitionEs":"Otra palabra para la media: la cantidad que tendría cada valor si el total se repartiera en partes iguales.","visual":"A player averages 15 points per game, so over 10 games she scores 15 × 10 = 150 points in all.","img":"/assets/vocab-images/mean.svg","lesson":"2-8"},{"term":"Balance point","termEs":"Punto de equilibrio","definition":"The value where the total distance of the data above it equals the total distance below it. The mean is the balance point.","definitionEs":"El valor donde la distancia total de los datos por encima es igual a la distancia total por debajo. La media es el punto de equilibrio.","visual":"With a target mean of 15, points totaling 13 below must be matched by points totaling 13 above.","img":"/assets/vocab-images/mean.svg","lesson":"2-8"},{"term":"Data set","termEs":"Conjunto de datos","definition":"The whole collection of values that were gathered or measured.","definitionEs":"Toda la colección de valores que se recopilaron o midieron.","visual":"Sofia's points in games 1–9 — 12, 20, 16, 11, 17, 14, 15, 10, 18 — form one data set.","img":"/assets/vocab-images/data.svg","lesson":"2-8"},{"term":"Target mean","termEs":"Media objetivo","definition":"The mean a person is trying to reach.","definitionEs":"La media que una persona intenta alcanzar.","visual":"A goal average of 29 points.","img":"/assets/vocab-images/mean.svg","lesson":"2-8"},{"term":"Target total","termEs":"Total objetivo","definition":"The target mean times the number of values.","definitionEs":"La media objetivo multiplicada por la cantidad de valores.","visual":"mean × count = total","img":"/assets/vocab-images/sum.svg","lesson":"2-8"},{"term":"Mean Absolute Deviation","termEs":"Desviación media absoluta","definition":"The average distance of data values from the mean; it describes spread.","definitionEs":"La distancia promedio de los valores de datos respecto a la media; describe la dispersión.","visual":"MAD = sum of absolute distances from the mean ÷ number of values.","img":"/assets/vocab-images/mean-absolute-deviation.svg","lesson":"2-9"},{"term":"Deviation","termEs":"Desviación","definition":"How far a number is from the mean.","definitionEs":"Qué tan lejos está un número de la media.","visual":"If mean = 20 and value = 17, deviation = 17 − 20 = −3 (3 below the mean)","img":"/assets/vocab-images/mean-absolute-deviation.svg","lesson":"2-9"},{"term":"Absolute Value","termEs":"Valor absoluto","definition":"How far a number is from zero. It is never negative.","definitionEs":"Qué tan lejos está un número de cero. Nunca es negativo.","visual":"|−3| = 3 and |3| = 3 — both are 3 units from zero","img":"/assets/vocab-images/absolute-value.svg","lesson":"2-9"},{"term":"Spread","termEs":"Dispersión","definition":"How far apart the numbers are.","definitionEs":"Qué tan separados están los números.","visual":"Low spread: 8, 9, 10, 11 (close together). High spread: 2, 9, 10, 25 (far apart)","img":"/assets/vocab-images/spread.svg","lesson":"2-9"},{"term":"Variation","termEs":"Variación","definition":"How much the values in a data set differ from one another.","definitionEs":"Cuánto difieren entre sí los valores de un conjunto de datos.","visual":"A larger MAD means more variation.","img":"/assets/vocab-images/spread.svg","lesson":"2-9"},{"term":"Appropriate Measures of Center","termEs":"Medidas de centro apropiadas","definition":"A mean, median, or mode chosen because it describes a data set fairly.","definitionEs":"Una media, mediana o moda elegida porque describe un conjunto de datos de manera justa.","visual":"Use the median when an outlier would pull the mean too far.","role":"concept","img":"/assets/vocab-images/concept-appropriate-measures-of-center.svg","lesson":"2-10"},{"term":"Skewed","termEs":"Sesgado","definition":"When most data sits on one side with a tail on the other.","definitionEs":"Cuando la mayoría de los datos está de un lado con una cola del otro.","visual":"Scores: 5, 6, 7, 8, 8, 35 → most scores are low, but 35 creates a tail to the right (skewed right)","img":"/assets/vocab-images/skewed.svg","lesson":"2-10"},{"term":"Cluster","termEs":"Grupo","definition":"Values bunched close together in one part of a display.","definitionEs":"Valores agrupados muy cerca en una parte de la representación.","visual":"Values packed near 3 on the dot plot.","img":"/assets/vocab-images/cluster.svg","lesson":"2-10"},{"term":"Gap","termEs":"Brecha","definition":"A space on a display where no data values fall.","definitionEs":"Un espacio en la representación donde no cae ningún valor de los datos.","visual":"Nothing between 11 and 32 on the number line.","img":"/assets/vocab-images/histogram.svg","lesson":"2-10"},{"term":"Add and Subtract Decimals","termEs":"Sumar y restar decimales","definition":"Combine or find the difference between decimals by lining up equal place values.","definitionEs":"Combinar o hallar la diferencia entre decimales alineando valores posicionales iguales.","visual":"15.70 − 8.36 = 7.34; line up the decimal points.","role":"concept","img":"/assets/vocab-images/concept-add-and-subtract-decimals.svg","lesson":"2-11"},{"term":"Decimal","termEs":"Decimal","definition":"A number with a dot, like 0.5, that shows a part less than one.","definitionEs":"Un número con un punto, como 0.5, que muestra una parte menor que uno.","visual":"3.75 means 3 ones + 7 tenths + 5 hundredths — it is between 3 and 4","img":"/assets/vocab-images/decimal.svg","lesson":"2-11"},{"term":"Place value","termEs":"Valor posicional","definition":"What a digit is worth based on where it sits in a number.","definitionEs":"Lo que vale un dígito según el lugar que ocupa en el número.","visual":"In 4.38: the 4 = 4 ones, the 3 = 3 tenths (0.3), the 8 = 8 hundredths (0.08)","img":"/assets/vocab-images/place-value.svg","lesson":"2-11"},{"term":"Tenths","termEs":"Décimas","definition":"The first spot after the decimal point. It shows parts out of 10.","definitionEs":"El primer lugar después del punto decimal. Muestra partes de 10.","visual":"0.7 = 7/10 — like 7 slices of a pizza cut into 10 equal slices","img":"/assets/vocab-images/tenths.svg","lesson":"2-11"},{"term":"Hundredths","termEs":"Centésimas","definition":"The second spot after the decimal point. It shows parts out of 100.","definitionEs":"El segundo lugar después del punto decimal. Muestra partes de 100.","visual":"0.05 = 5/100 — like 5 pennies out of a dollar (100 pennies)","img":"/assets/vocab-images/hundredths.svg","lesson":"2-11"},{"term":"Annex zeros","termEs":"Agregar ceros","definition":"Adding zeros at the end of a decimal so numbers line up evenly.","definitionEs":"Agregar ceros al final de un decimal para que los números se alineen.","visual":"15.7 becomes 15.70 so you can subtract 15.70 − 8.36 with aligned place values","img":"/assets/vocab-images/decimal.svg","lesson":"2-11"},{"term":"Multiply Decimals","termEs":"Multiplicar decimales","definition":"Find the product of decimals, then use place value to place the decimal point.","definitionEs":"Hallar el producto de decimales y luego usar el valor posicional para colocar el punto decimal.","visual":"3.4 × 2.6 = 8.84","role":"concept","img":"/assets/vocab-images/concept-multiply-decimals.svg","lesson":"2-12"},{"term":"Product","termEs":"Producto","definition":"The answer when you multiply.","definitionEs":"La respuesta cuando multiplicas.","visual":"4 × 7 = 28, so the product is 28","img":"/assets/vocab-images/product.svg","lesson":"2-12"},{"term":"Decimal point","termEs":"Punto decimal","definition":"The dot that splits the whole number from the part after it.","definitionEs":"El punto que separa el número entero de la parte que sigue.","visual":"In 3.25, the decimal point separates 3 (ones) from 25 (tenths and hundredths)","img":"/assets/vocab-images/decimal-point.svg","lesson":"2-12"},{"term":"Estimate","termEs":"Estimar","definition":"A close answer you get by rounding first.","definitionEs":"Una respuesta cercana que obtienes al redondear primero.","visual":"3.7 × 4.2: round to 4 × 4 = 16, so the exact answer should be near 16","img":"/assets/vocab-images/estimate.svg","lesson":"2-12"},{"term":"Decimal places","termEs":"Cifras decimales","definition":"How many digits come after the decimal point.","definitionEs":"Cuántos dígitos hay después del punto decimal.","visual":"3.4 (1 place) × 2.6 (1 place) = 8.84 (2 places total)","img":"/assets/vocab-images/decimal.svg","lesson":"2-12"}]</script>
<script type="application/json" id="gn-easy">{"v":1,"map":{"A data & statistics mystery in five chapters — featuring six reader gates. Solve the math to move the story.":"A data &amp; statistics case. Five parts. Six gates for you. Do the math to move the story.","Pattern distortion detected, crew. This one smells like… paperwork.":"Pattern problem found, crew. This one smells like… paper work.","Previously: on a rained-out field day, four sixth graders cracked Ada Vex's sealed journal in the old Vexhall Observatory — and woke VEX, a fragment of her Pattern Engine. Now the city's patterns are their problem.":"Before: it was a rainy field day. Four sixth graders opened Ada Vex's locked journal. It was in the old Vexhall star tower. They woke VEX, a piece of her Pattern Engine. Now the city's patterns are their job.","Founders Festival, day six. Rosa's churros are the best thing in Axiom City—":"It is day six of the Founders Festival. Rosa's churros are the best in Axiom City—","—and the census office says nobody visits my stall. Nobody? Look at this line!":"—and the census says no one comes here. \u003ci>No one?\u003c/i> Look at this line!","Distortion source located: the festival census report. The data has been… bent. Crew — audit it.":"Problem found: the fair census report. The data has been… bent. Crew, check it.","The census office window. A very tall clipboard. A very smug clerk.":"The census window. A tall clipboard. A proud clerk.","The census is official. Data is data, children. Numbers don't lie.":"The census is the real one. Data is data, kids. Numbers don't lie.","Data starts with questions, Mr. Pimm. Bad questions make bent data. What did yours ask?":"Data starts with \u003cb>questions\u003c/b>, Mr. Pimm. Bad questions make bent data. What did yours \u003ci>ask\u003c/i>?","Definition loaded: a statistical question expects answers that VARY — different people, different answers. A one-answer question is just a fact lookup.":"Got it: a \u003cb>statistical question\u003c/b> has answers that VARY. Each person may give a new answer. A one-answer question is just a fact.","A statistical question anticipates variety: \"How many minutes do visitors stay?\" has many answers. \"What time does the festival open?\" has exactly one.":"A \u003cb>statistical question\u003c/b> has many answers. Ask: how many minutes do visitors stay? Lots of answers. Ask: what time does the fair open? Just one.","Reader — you're our fifth crew member. Tag Pimm's census questions!":"Reader, you are our fifth crew mate. Tag Pimm's questions!","Pimm's census form, four questions. Tag each one: STATISTICAL (answers vary) or ONE ANSWER (a single fact).":"Pimm's form has four questions. Tag each one. Pick \u003cb>STATISTICAL\u003c/b> (answers vary). Or pick \u003cb>ONE ANSWER\u003c/b> (one fact).","1. How many minutes do visitors stay at the festival?":"1. How long do people stay at the fair? (In minutes.)","2. What time does the festival open?":"2. What time does the fair open?","3. How much does each visitor spend at Rosa's stall?":"3. How much does each person spend at Rosa's stall?","Conceptual: a statistical question anticipates VARIETY — ask it to 100 visitors and you'd collect many different answers. A fact question has one fixed answer no matter who you ask.":"Conceptual: a statistical question gets VARIETY. Ask 100 visitors. You get lots of answers. A fact question has one answer. It is the same for all.","Procedural: test each question — 'Would two different visitors give two different answers?' Minutes stayed and money spent change person to person. Opening time and stall count do not.":"Procedural: test each question. Ask: would two people give two different answers? Minutes stayed and money spent change for each person. Opening time and stall count do not.","Behind Rosa's stall. The logbook smells like cinnamon.":"Behind Rosa's stall. The log book smells like spice.","\"Nobody,\" huh? Line these up smallest to largest and the median — the middle value — tells Rosa's typical day.":"\"No one,\" huh? Put these in order, small to big. The \u003cb>median\u003c/b> is the middle value. It shows Rosa's normal day.","Median protocol: ORDER the data first. Odd count → one exact middle. Even count → average the two middle values. Wild days barely move it.":"Median plan: put the data in ORDER first. Odd count: take the one middle. Even count: average the two middle values. Wild days do not move it much.","The median is the middle value of an ordered data set — a measure of center that resists extreme values.":"Put the data set in order. The \u003cb>median\u003c/b> is the middle. It is a measure of center. An extreme value barely moves it.","Order Rosa's five days and find her real \"typical day,\" reader.":"Put Rosa's five days in order. Then find her real \"typical day.\"","Rosa's logbook, five festival days: 51, 38, 60, 45, 42 visitors. Find the median — her typical day.":"Rosa's log book, five fair days: \u003cb>51, 38, 60, 45, 42\u003c/b> visitors. Find the \u003cb>median\u003c/b>. It is her typical day.","Conceptual: the median is the middle of the ORDERED list — half the days sit below it, half above. (If the count were even, you'd average the TWO middle values.)":"Conceptual: the median is the middle of the list. The list must be IN ORDER. Half the days are below it. Half are above. (Even count? Then average the TWO middle values.)","Procedural: write the five numbers smallest to largest: 38, 42, …, …, 60. Cross off one number from each end, twice. The survivor is the median.":"Procedural: write the five numbers from smallest to largest: 38, 42, …, …, 60. Cross off one number from each end, twice. The one left is the median.","Side quest complete: I tallied Rosa's visitors in every half-hour block, all day. Sixteen data points. Raw loot.":"Side quest done. I counted Rosa's visitors each half-hour, all day. Sixteen data points. Raw loot.","Raw numbers are mush. I could build that — stack them into bars. A histogram.":"Raw numbers are a mess. I could \u003ci>build\u003c/i> that. Stack them into bars. A \u003cb>histogram\u003c/b>.","Histogram schema: sort data into equal intervals (bins). Each bar's height = the frequency — how many values land in that bin. Bars touch. No gaps.":"Histogram plan: sort data into equal \u003cb>intervals\u003c/b> (bins). Each bar's height = the \u003cb>frequency\u003c/b>. That is how many values land in that bin. Bars touch. No gaps.","A histogram shows how often data falls in each interval. Height = frequency, and the bars share edges because the intervals do.":"In a \u003cb>histogram\u003c/b>, each bar is an interval. It shows how often data falls there. Height = frequency. The bars touch, like the intervals.","Hand me the bar heights, reader — let's stack Dev's tally into truth!":"Give me the bar heights, reader. Let's stack Dev's tally into the truth!","Dev's tally — visitors in each of 16 half-hour blocks: 12 · 3 · 25 · 14 · 7 · 18 · 22 · 11 · 9 · 27 · 16 · 5 · 13 · 21 · 19 · 20 Count how many blocks land in each bin, then set the three bar heights.":"Dev's tally: visitors in each of 16 half-hour blocks:\u003cbr>\u003cb>12 · 3 · 25 · 14 · 7 · 18 · 22 · 11 · 9 · 27 · 16 · 5 · 13 · 21 · 19 · 20\u003c/b>\u003cbr>Count how many blocks land in each bin. Then set the three bar heights.","Conceptual: each bar's height is a FREQUENCY — how many of the 16 numbers fall inside that interval. Every number lands in exactly one bin.":"Conceptual: each bar's height is a FREQUENCY. How many of the 16 numbers fall in that interval? Each number lands in just one bin.","Procedural: go number by number and tick a bin: 12→(10–19), 3→(0–9), 25→(20–29)… Your three counts must add up to 16.":"Procedural: go number by number and tick a bin: 12→(10–19), 3→(0–9), 25→(20–29)… Your three counts must add up to 16.","City Hall, Hall of Charts. The official festival box plot hangs… crooked.":"City Hall, Hall of Charts. The fair's box plot hangs… crooked.","A box plot with no numbers is a lock with no key. Lucky for us, we logged seven checkpoint counts ourselves: 12, 15, 18, 21, 24, 30, 35.":"No numbers on a box plot? It is a lock with no key. Good thing we logged seven counts: \u003cb>12, 15, 18, 21, 24, 30, 35\u003c/b>.","Boss-key time: min, Q1, median, Q3, max. The five-number summary.":"Boss-key time: min, Q1, median, Q3, max. The five-number summary.","A box plot draws the five-number summary: the box runs Q1 → Q3 with the median inside; whiskers reach min and max. IQR = Q3 − Q1 — the spread of the middle half.":"A \u003cb>box plot\u003c/b> draws the five-number summary. The box runs Q1 → Q3 with the median inside. Whiskers reach min and max. \u003cb>IQR = Q3 − Q1\u003c/b>. It is the spread of the middle half.","Quartiles split ordered data into four equal parts. The interquartile range (IQR) measures how spread out the middle half is.":"\u003cb>Quartiles\u003c/b> split data in order into four equal parts. The \u003cb>interquartile range (IQR)\u003c/b> shows the spread. It is the spread of the middle half.","Cut the five-number key, reader — then we can read any box plot they hang.":"Cut the five-number key, reader. Then we can read any box plot they hang.","The crew's seven checkpoint counts, already in order: 12, 15, 18, 21, 24, 30, 35. Cut the key: find Q1, the median, Q3, and the IQR. (Min = 12 and max = 35 are free.)":"The crew's seven checkpoint counts, already in order: \u003cb>12, 15, 18, 21, 24, 30, 35\u003c/b>. Cut the key: find \u003cb>Q1\u003c/b>, the \u003cb>median\u003c/b>, \u003cb>Q3\u003c/b>, and the \u003cb>IQR\u003c/b>. (Min = 12 and max = 35 are free.)","Conceptual: the median splits the data in half; Q1 is the median of the LOWER half, Q3 the median of the UPPER half. IQR = Q3 − Q1, the width of the box.":"Conceptual: the median splits the data in half. Q1 is the median of the LOWER half. Q3 is the median of the UPPER half. IQR = Q3 − Q1, the width of the box.","Procedural: median = 4th of 7 values. Lower half is the three values below it — take their middle. Upper half is the three above it — take their middle. Then subtract.":"Procedural: median = 4th of 7 values. The lower half is the three values below it. Find their middle. The upper half is the three above it. Find their middle. Then subtract.","Rosa's storeroom, dawn. The hearing is at noon.":"Rosa's back room, dawn. The hearing is at noon.","Five days of churro batches: 14, 9, 16, 13, 8. If every day got a fair share, how tall is each stack?":"Five days of churro batches: 14, 9, 16, 13, 8. Give each day a \u003cb>fair share\u003c/b>. How tall is each stack?","That fair share has a name: the mean. Total everything, divide by the number of days.":"That fair share has a name: the \u003cb>mean\u003c/b>. Add them all up. Divide by the number of days.","Decimals incoming. Long division: equip it.":"Decimals coming. Long division: ready.","The mean = sum ÷ count. It levels every stack to the same height — the \"fair share\" measure of center.":"The \u003cb>mean\u003c/b> = sum ÷ count. It levels every stack to the same height. It is the \"fair share\" measure of center.","Level the stacks, reader — the hearing won't wait!":"Level the stacks, reader. The hearing won't wait!","Two levelings before the hearing: ① Churro batches over 5 days: 14, 9, 16, 13, 8 — find the mean. ② The cider barrel poured 94.5 L over 7 days — mean liters per day (decimal division!).":"Two fair shares before the hearing:\u003cbr>① Churro batches over 5 days: \u003cb>14, 9, 16, 13, 8\u003c/b>. Find the \u003cb>mean\u003c/b>.\u003cbr>② The cider barrel poured \u003cb>94.5 L over 7 days\u003c/b>. Find the mean liters per day (decimal division!).","Conceptual: the mean is the fair share — pour every day's count into one pot, then split the pot equally among the days.":"Conceptual: the mean is the fair share. Pour every day's count into one pot. Then split the pot equally among the days.","Procedural: ① add the five numbers, divide by 5. ② divide 94.5 by 7 — or split it: 94.5 = 70 + 24.5, and each part divides by 7 evenly.":"Procedural: ① add the five numbers, divide by 5. ② divide 94.5 by 7. Or split it: 94.5 = 70 + 24.5, and each part divides by 7 evenly.","City Hall hearing room, 12:00 sharp. Clerk Pimm has a very large folder.":"City Hall hearing room, 12:00 sharp. Clerk Pimm has a very big folder.","Her log \"averages\" 65.4 visitors — yet I never counted more than 50 at her stall! The log is crooked. Permit DENIED.":"Her log \"averages\" 65.4 visitors. But I never counted more than 50 at her stall! The log is crooked. Permit DENIED.","Or your summary is crooked, Mr. Pimm. One number in that week is screaming. Reader — run both measures.":"Or your \u003ci>summary\u003c/i> is crooked, Mr. Pimm. One number in that week is screaming. Reader, run both measures.","An outlier is a value far from the rest of the data. It drags the mean toward it — but the median barely moves. Boss Gate: compute both, then choose the honest one.":"An \u003cb>outlier\u003c/b> is a value. It is far from the rest of the data. It pulls the \u003cb>mean\u003c/b> toward it. But the \u003cb>median\u003c/b> barely moves. Boss Gate: find both. Then choose the honest one.","BOSS GATE. Four locks. One outlier. Rosa's permit on the line. (No pressure. Some pressure.)":"BOSS GATE. Four locks. One outlier. Rosa's permit is at stake. (No pressure. Some pressure.)","Rosa's full week: 41, 44, 45, 47, 150 (150 = parade day, when every stall spiked). Pimm waves the \"average.\" Four locks to save the permit:":"Rosa's full week: \u003cb>41, 44, 45, 47, 150\u003c/b> (150 = parade day, all stalls spiked). Pimm waves the \"average\". Four locks to save the permit:","Which measure honestly represents Rosa's typical day?":"Which one is true to her \u003ci>typical\u003c/i> day?","Tell the council WHY:":"Tell the council WHY:","Conceptual: an outlier drags the MEAN toward it like a magnet, but the MEDIAN only cares about position — it barely moves. The honest 'typical day' is the measure the outlier can't bend.":"Conceptual: an outlier pulls the MEAN to it. It is like a magnet. But the MEDIAN only cares about spot in line. It barely moves. Pick the one the outlier can't bend. That is the honest 'typical day'.","Procedural: Lock 1: add all five (watch the 150) and divide by 5. Lock 2: the data is already ordered — take the 3rd value. Locks 3–4: compare your two numbers to the days Rosa actually had.":"Procedural: Lock 1: add all five (watch the 150). Divide by 5. Lock 2: the data is already in order. Take the 3rd value. Locks 3–4: compare your two numbers. Which is like the days Rosa had?","Free batch for the audit crew! The median saved my stall — 45 honest visitors a day.":"Free batch for the audit crew! The median saved my stall: 45 honest visitors a day.","Pimm's \"crooked log\" was honest data plus the wrong summary. The council made him re-issue the whole census.":"Pimm's \"crooked log\" had true data. But the summary was wrong. So the council made him redo the census.","New distortion. This one moves fast. To be continued…":"New problem. This one moves fast. To be continued…","Crew captain. Keeps the notebook, asks the next question. This volume: cracked the five-number key on the crooked chart.":"Crew captain. Keeps the notebook, asks the next question. This volume: cracked the five-number key on the crooked chart.","Evidence officer. Allergic to \"data is data.\" This volume: out-argued a clerk with a median.":"Proof keeper. Hates \"data is data.\" This volume: beat a clerk with a median.","Builder and artist. This volume: stacked sixteen tallies into one unbendable histogram.":"Builder and artist. This volume: she stacked sixteen tallies. They made one strong histogram.","Pattern hunter. This volume: a full-day stakeout tally and one spotted outlier.":"Pattern hunter. This volume: a full-day tally and one outlier spotted.","Churro artist of Founders Festival. Counts her visitors by hand, every day. Honest to the last data point.":"She makes churros at the Founders Festival. She counts each one who comes, by hand. True to the last data point.","Fragment of Ada Vex's Pattern Engine. Senses distortions; cannot compute. That's your job.":"A part of Ada Vex's Pattern Engine. Senses problems. Cannot do math. That's your job.","Statistical question.Expects answers that vary: \"How many minutes do visitors stay?\" — not \"What time do we open?\"":"\u003cb>Statistical question.\u003c/b>\u003cspan>Its answers vary. Ask: how many minutes do people stay? Not: what time do we open?\u003c/span>","Median.Order the data; take the middle (or average the two middles). 38 42 45 51 60 → 45.":"\u003cb>Median.\u003c/b>\u003cspan>Put data in order. Take the middle. Two in the middle? Average them. 38 42 \u003cb>45\u003c/b> 51 60 → 45.\u003c/span>","Histogram.Equal intervals, bar height = frequency, bars touch. 16 blocks → bins of 4, 7, 5.":"\u003cb>Histogram.\u003c/b>\u003cspan>Equal intervals, bar height = frequency, bars touch. 16 blocks → bins of 4, 7, 5.\u003c/span>","Box plot & IQR.Five-number summary: min, Q1, median, Q3, max. IQR = Q3 − Q1 = the middle half's spread.":"\u003cb>Box plot &amp; IQR.\u003c/b>\u003cspan>Five-number summary: min, Q1, median, Q3, max. IQR = Q3 − Q1 = the spread of the middle half.\u003c/span>","Mean.Sum ÷ count = the fair share. 60 churro batches ÷ 5 days = 12; 94.5 L ÷ 7 = 13.5.":"\u003cb>Mean.\u003c/b>\u003cspan>Sum ÷ count = the fair share. 60 churro batches ÷ 5 days = 12; 94.5 L ÷ 7 = 13.5.\u003c/span>","Outlier.A far-off value. It drags the mean (45 → 65.4!) but barely moves the median. Choose your measure honestly.":"\u003cb>Outlier.\u003c/b>\u003cspan>A value far from the rest. It pulls the mean (45 → 65.4!). It barely moves the median. Pick the honest measure.\u003c/span>","\"A single number can hide a whole story. Ask the data what varies — then choose the number that tells the truth.\" — A.V.":"\"One number can hide a whole story. Ask the data what varies. Then pick the number that tells the truth.\" — A.V.","completed Volume 2: The Crooked Census and proved mastery over statistical questions, median, histograms, box plots, IQR, mean, and outliers.":"finished \u003cb>Volume 2: The Crooked Census\u003c/b>. Can do statistical questions, median, histograms. Can do box plots, IQR, mean, and outliers.","Thank you for auditing with the crew. Volume 3 is waiting at the starting line.":"Thank you for checking the data. Volume 3 is waiting at the starting line.","Different form: 'How tall are Vexhall sixth graders?' — heights vary student to student → statistical.":"\u003cspan>New question: how tall are Vexhall sixth graders? Heights vary for each kid → statistical.\u003c/span>","'How many doors does the observatory have?' — one fixed count → NOT statistical.":"\u003cspan>How many doors does the star tower have? One fixed count → NOT statistical.\u003c/span>","The test is variability, not whether the answer is a number. Both answers are numbers; only one varies.":"\u003cspan>The test is variability. It is not if the answer is a number. Both answers are numbers. Only one varies.\u003c/span>","Your turn — same idea, different numbers:":"Your turn. Same idea, new numbers:","A survey asks 4 questions; 3 of them have answers that vary. How many are statistical?":"A survey asks 4 questions. 3 of them have answers that vary. How many are statistical?","Different log: 9, 4, 12, 7, 10. Order it → 4, 7, 9, 10, 12.":"A new log: 9, 4, 12, 7, 10. Put it in order → 4, 7, 9, 10, 12.","Cross off ends in pairs: (4,12) gone, (7,10) gone → middle is 9.":"Cross off ends in pairs: (4,12) gone, (7,10) gone. Middle is 9.","Even-count twist: for 4, 7, 9, 10 there's no single middle — average the two middles: (7+9) ÷ 2 = 8.":"\u003cspan>Even count? Look at 4, 7, 9, 10. There is no one middle. So average the two in the middle: (7+9) ÷ 2 = 8.\u003c/span>","Find the median of 3, 8, 5, 11, 6.":"Find the median of 3, 8, 5, 11, 6.","Different tally — books read: 2, 7, 11, 4, 13, 6, 12, 1. Bins: 0–4, 5–9, 10–14.":"A new tally, books read: 2, 7, 11, 4, 13, 6, 12, 1. Bins: 0–4, 5–9, 10–14.","Tick each value: 0–4 gets 2, 4, 1 → height 3. 5–9 gets 7, 6 → height 2. 10–14 gets 11, 13, 12 → height 3.":"Tick each value: 0–4 gets 2, 4, 1 → height 3. 5–9 gets 7, 6 → height 2. 10–14 gets 11, 13, 12 → height 3.","Check the total: 3 + 2 + 3 = 8 values. All data accounted for, no gaps between bars.":"Check the total: 3 + 2 + 3 = 8 values. All the data is counted. No gaps between bars.","In that worked tally, how tall is the 10–14 bar?":"In that worked tally, how tall is the 10–14 bar?","Different data: 2, 4, 6, 8, 10, 12, 14. Median = the 4th value = 8.":"New data: 2, 4, 6, 8, 10, 12, 14. Median = the 4th value = 8.","Lower half 2, 4, 6 → Q1 = 4. Upper half 10, 12, 14 → Q3 = 12.":"Lower half 2, 4, 6 → Q1 = 4. Upper half 10, 12, 14 → Q3 = 12.","IQR = Q3 − Q1 = 12 − 4 = 8. The box would stretch from 4 to 12 with a line at 8.":"\u003cspan>IQR = Q3 − Q1 = 12 − 4 = 8. The box would go from 4 to 12. It has a line at 8.\u003c/span>","For that worked data, what is the IQR?":"For that worked data, what is the IQR?","Different stand: 5, 9, 7, 3 trays over 4 days. Total = 5+9+7+3 = 24.":"A new stand: 5, 9, 7, 3 trays over 4 days. Total = 5+9+7+3 = 24.","Mean = 24 ÷ 4 = 6 trays — level stacks of 6.":"Mean = 24 ÷ 4 = 6 trays. Level stacks of 6.","Decimal version: 25.5 L ÷ 3 days. 25.5 = 24 + 1.5 → 8 + 0.5 = 8.5 L per day.":"Decimal version: 25.5 L ÷ 3 days. 25.5 = 24 + 1.5 → 8 + 0.5 = 8.5 L per day.","Find the mean of 11, 5, 8.":"Find the mean of 11, 5, 8.","Different stall's week: 10, 12, 14, 100. Mean = 136 ÷ 4 = 34 — yet NO day was anywhere near 34.":"A new stall's week: 10, 12, 14, 100. Mean = 136 ÷ 4 = 34. But NO day was near 34.","Median: even count, so average the two middles: (12 + 14) ÷ 2 = 13. That matches the real days.":"Median: even count, so average the two middles: (12 + 14) ÷ 2 = 13. That fits the real days.","The 100 dragged the mean to 34; the median stayed home at 13. With an outlier, report the median.":"The 100 pulled the mean up to 34. The median stayed at 13. With an outlier, use the median.","For that week (10, 12, 14, 100), what is the median?":"For that week (10, 12, 14, 100), what is the median?","Tag all four questions first — every line on the form.":"Tag all four questions first. Every line on the form.","Sorted! Two statistical (stay time, spending) and two facts. Pimm's census never asked a single statistical question — no wonder it's bent.":"Sorted! Two statistical (stay time, spending) and two facts. Pimm's census never asked one statistical question. No wonder it's bent.","Ordered: 38, 42, 45, 51, 60 — the middle is 45. Rosa's typical day is 45 visitors, not 'nobody.'":"In order: 38, 42, 45, 51, 60. The middle is 45. On a normal day, Rosa gets 45 visitors. Not 'no one.'","4 + 7 + 5 = all 16 blocks stacked. The histogram shows a busy middle — 'low numbers,' Pimm? Really?":"4 + 7 + 5 = all 16 blocks stacked. The histogram shows a busy middle. 'Low numbers,' Pimm? Really?","Min 12, Q1 15, median 21, Q3 30, max 35 — IQR 15. The official chart's box was drawn nowhere near this. Crooked confirmed.":"Min 12, Q1 15, median 21, Q3 30, max 35. IQR 15. The official chart's box was nowhere near this. Crooked confirmed.","Three cuts true — now the IQR: subtract Q1 from Q3.":"Three cuts are right. Now the IQR: subtract Q1 from Q3.","At least one cut missed. Median first (the 4th value), then the middles of each half.":"At least one cut missed. Median first (the 4th value). Then the middle of each half.","60 ÷ 5 = 12 batches, 94.5 ÷ 7 = 13.5 L. Every stack level, every share fair. To the hearing!":"60 ÷ 5 = 12 batches. 94.5 ÷ 7 = 13.5 L. Each stack level. Each share fair. To the hearing!","Leveling ① first: total all five days, then split equally among 5.":"Do ① first. Add all five days. Then split it the same among 5.","Leveling ② holds: 94.5 ÷ 7. Try splitting 94.5 into 70 + 24.5.":"Leveling ② holds: 94.5 ÷ 7. Try splitting 94.5 into 70 + 24.5.","Lock 1 holds. Sum all five days — the total ends in 7 — then divide by 5.":"Lock 1 holds. Add all five days. The total ends in 7. Then divide by 5.","Lock 2 holds. Five ordered values — the median is the 3rd one.":"Lock 2 holds. Five values in order. The median is the 3rd one.","Lock 3 holds. Which number is close to the days Rosa ACTUALLY had — 65.4 or your median?":"Lock 3 holds. Look at the days Rosa REALLY had. Which number is close? 65.4 or your median?","Lock 4 holds. The reason must mention what the outlier DOES to the mean — not which number is bigger or a rule that 'always' works.":"Lock 4 holds. Say what the outlier DOES to the mean. Not which number is bigger. Not a rule that 'always' works.","ALL LOCKS OPEN. Mean 65.4 was parade-day glitter; median 45 is the truth. Permit RESTORED — the census stands uncrooked!":"ALL LOCKS OPEN. Mean 65.4 was parade-day glitter. Median 45 is the truth. Permit back! The census is honest again!","Yes! Now head back and open that gate.":"Yes! Now go back and open that gate.","Walk the steps above again — you've got this.":"Walk the steps above again. You can do it."}}</script>
