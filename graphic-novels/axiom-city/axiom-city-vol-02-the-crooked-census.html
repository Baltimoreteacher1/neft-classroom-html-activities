<!DOCTYPE html>
<html lang="en" data-textsize="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiom City Vol. 2 — The Crooked Census | Interactive Graphic Novel | Data &amp; Statistics</title>
<meta name="description" content="An interactive 3D graphic novel teaching Grade 6 statistics: statistical questions, median, histograms, box plots, IQR, mean, and outliers. EduWonderLab.">
<style>
/* ================= AXIOM CITY ENGINE CSS v1.0 — DO NOT FORK ================= */
:root{
  --paper:#F7F4EC; --ink:#24323F; --navy:#17324D; --teal:#1FA6A2; --amber:#F2C15B;
  --coral:#E2674A; --accent:var(--teal);
  --panelborder:3px solid var(--navy);
  --balloonfont:600 1rem/1.32 'Segoe UI',system-ui,-apple-system,sans-serif;
  --capfont:italic 500 .92rem/1.35 Georgia,'Times New Roman',serif;
  --pagew:560px;
}
html[data-textsize="lg"]{font-size:18px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 120% at 50% 0%,#23425f 0%,#101e2e 55%,#0a1420 100%);color:var(--ink);font:400 16px/1.45 'Segoe UI',system-ui,sans-serif;overflow:hidden}
body.hc{--ink:#000;--paper:#fff}
button{font:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}

/* ---------- COVER SCREEN ---------- */
#cover{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:18px;background:radial-gradient(110% 110% at 50% 10%,#1c3a57 0%,#0a1420 100%);perspective:1400px;overflow:auto}
#coverCard{position:relative;width:min(88vw,520px,calc((100vh - 200px)*0.714));aspect-ratio:5/7;border-radius:10px 18px 18px 10px;box-shadow:0 40px 80px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.5);transform-style:preserve-3d;transition:transform .18s ease-out;background:var(--navy);overflow:hidden}
#coverCard .spine{position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,#0d1f33,#17324D 60%,#244a6e);z-index:5}
#coverCard .spine span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;color:var(--amber);font:900 .72rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.28em}
.cov-layer{position:absolute;inset:0;will-change:transform}
#coverTitle{position:absolute;left:34px;right:18px;top:26px;z-index:6;color:#fff}
#coverTitle .series{font:900 .9rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.4em;color:var(--amber)}
#coverTitle h1{font:900 clamp(2rem,7vw,3.1rem)/0.95 'Arial Black',Arial,sans-serif;text-transform:uppercase;margin-top:8px;text-shadow:4px 4px 0 rgba(0,0,0,.35);color:#fff}
#coverTitle h1 em{font-style:normal;color:var(--accent)}
#coverTitle .vol{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;font:900 .8rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.18em;padding:7px 12px;border-radius:4px;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
#coverBottom{position:absolute;left:34px;right:18px;bottom:18px;z-index:6;display:flex;justify-content:space-between;align-items:flex-end;color:#cfe3ea;font:700 .72rem/1.3 'Segoe UI',sans-serif;letter-spacing:.12em}
#coverActions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.bigbtn{background:var(--amber);color:var(--navy);border:none;border-radius:999px;font:900 1rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.1em;padding:18px 34px;box-shadow:0 6px 0 #b78a2e,0 14px 30px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s}
.bigbtn:hover{transform:translateY(-2px)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b78a2e}
.bigbtn.alt{background:#274a6a;color:#fff;box-shadow:0 6px 0 #122a42,0 14px 30px rgba(0,0,0,.5)}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,rgba(7,14,22,.92),rgba(7,14,22,.65) 70%,transparent);color:#dfe9ef}
#hud .brand{font:900 .78rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.22em;color:var(--amber);white-space:nowrap}
#hud .brand small{display:block;font:700 .56rem/1.4 'Segoe UI',sans-serif;letter-spacing:.18em;color:#9fb7c6}
#progress{display:flex;gap:5px;margin-left:8px;flex-wrap:wrap}
#progress .dot{width:9px;height:9px;border-radius:50%;background:#3a576f;border:1px solid #5b7d99}
#progress .dot.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px var(--accent)}
#badges{display:flex;gap:6px;margin-left:auto}
.badge{width:34px;height:34px;border-radius:50%;background:#1c3a52;border:2px solid #35587a;display:flex;align-items:center;justify-content:center;filter:grayscale(1) brightness(.6);transition:filter .4s,transform .4s}
.badge.earned{filter:none;border-color:var(--amber);background:#234d6b;animation:badgepop .6s cubic-bezier(.2,2,.4,1)}
.badge svg{width:20px;height:20px}
@keyframes badgepop{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.hudbtns{display:flex;gap:6px;margin-left:10px}
.hudbtn{background:#1c3a52;border:1px solid #35587a;color:#dfe9ef;border-radius:8px;min-width:48px;min-height:38px;padding:4px 10px;font:700 .72rem/1.1 'Segoe UI',sans-serif}
.hudbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06222b}
.hudbtn.teacher{background:var(--navy);border-color:#1FA6A2;color:#fff}

/* ---------- BOOK STAGE ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:2200px;padding:64px 12px 56px}
#book{position:relative;width:min(96vw,1180px);height:min(calc(100vh - 130px),780px);transform-style:preserve-3d}
#bookcase{position:absolute;inset:0;border-radius:8px 14px 14px 8px;background:#0e2233;box-shadow:0 50px 90px rgba(0,0,0,.65),0 10px 26px rgba(0,0,0,.5);transform:translateZ(-30px)}
.edges{position:absolute;top:6px;bottom:6px;width:14px;background:repeating-linear-gradient(90deg,#e8e2d2 0 2px,#cfc7b2 2px 3px);border-radius:3px;transition:width .5s}
#edgesL{left:-6px;border-right:1px solid #b8ae97}
#edgesR{right:-6px;border-left:1px solid #b8ae97}
#spreadWrap{position:absolute;inset:0;display:flex;border-radius:6px;overflow:visible}
.page{position:relative;width:50%;height:100%;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.page.left{border-radius:8px 0 0 8px;box-shadow:inset -22px 0 28px -22px rgba(36,50,63,.45)}
.page.right{border-radius:0 8px 8px 0;box-shadow:inset 22px 0 28px -22px rgba(36,50,63,.45)}
#spine3d{position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,.45),rgba(0,0,0,.25));z-index:3}
.page-inner{flex:1;overflow:auto;padding:18px 20px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.pagefoot{flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px;font:700 .66rem/1 'Segoe UI',sans-serif;letter-spacing:.18em;color:#7d8a8f;text-transform:uppercase}
.page .chapterband{flex:none;background:var(--navy);color:#fff;font:900 .72rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.24em;padding:8px 20px;text-transform:uppercase}
.page .chapterband em{color:var(--accent);font-style:normal}
.gatelockcorner{position:absolute;top:8px;right:10px;z-index:5;width:34px;height:34px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.gatelockcorner.open{background:var(--teal)}
.gatelockcorner svg{width:18px;height:18px}

/* turning sheet */
#turnSheet{position:absolute;top:0;bottom:0;right:0;width:50%;z-index:20;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;display:none}
#turnSheet.show{display:block}
#turnSheet .ts{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:var(--paper)}
#turnSheet .ts.front{border-radius:0 8px 8px 0}
#turnSheet .ts.back{transform:rotateY(180deg);border-radius:8px 0 0 8px}
#turnSheet .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.0),rgba(0,0,0,.28));opacity:0;pointer-events:none}
@keyframes turnFwd{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
@keyframes turnBack{0%{transform:rotateY(-180deg)}100%{transform:rotateY(0)}}
#turnSheet.fwd{animation:turnFwd .8s cubic-bezier(.45,.05,.3,1) forwards}
#turnSheet.back{animation:turnBack .8s cubic-bezier(.45,.05,.3,1) forwards}
body.reduced #turnSheet{display:none!important}

/* nav arrows */
.navarrow{position:fixed;top:50%;transform:translateY(-50%);z-index:40;width:54px;height:88px;border:none;border-radius:12px;background:rgba(20,42,62,.8);color:#fff;font-size:1.6rem;display:flex;align-items:center;justify-content:center;transition:background .2s,opacity .2s}
.navarrow:hover{background:var(--accent)}
.navarrow[disabled]{opacity:.25;cursor:not-allowed}
#prevBtn{left:8px}#nextBtn{right:8px}
.navarrow.locked{background:var(--coral)}
@keyframes shake{0%,100%{transform:translateY(-50%)}25%{transform:translateY(-50%) translateX(-6px)}75%{transform:translateY(-50%) translateX(6px)}}
.navarrow.shake{animation:shake .3s 2}

/* ---------- COMIC ART ---------- */
.panelrow{display:flex;gap:10px}
.panelrow>.panel{flex:1}
.panel{position:relative;border:var(--panelborder);border-radius:6px 10px 7px 9px;background:#fff;overflow:hidden;box-shadow:3px 3px 0 rgba(23,50,77,.18)}
.panel.tall{min-height:200px}
.panel svg.scene{display:block;width:100%;height:auto}
.panel3d{transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.panel3d [data-depth]{will-change:transform}
.balloon{position:absolute;max-width:62%;background:#fff;border:3px solid var(--navy);border-radius:14px;padding:8px 12px;font:var(--balloonfont);color:var(--ink);box-shadow:2px 2px 0 rgba(23,50,77,.25);z-index:4}
.balloon .who{display:block;font:900 .58rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:3px}
.balloon::after{content:"";position:absolute;bottom:-14px;left:28px;width:0;height:0;border:9px solid transparent;border-top:14px solid var(--navy)}
.balloon::before{content:"";position:absolute;bottom:-9px;left:31px;width:0;height:0;border:7px solid transparent;border-top:11px solid #fff;z-index:1}
.balloon.tail-r::after{left:auto;right:28px}
.balloon.tail-r::before{left:auto;right:31px}
.balloon.vex{background:#062e33;border-color:var(--teal);color:#c8f5f1;border-radius:10px;font-family:'Consolas','Courier New',monospace;font-weight:500;box-shadow:0 0 12px rgba(31,166,162,.5)}
.balloon.vex .who{color:var(--amber)}
.balloon.vex::after{border-top-color:var(--teal)}
.balloon.vex::before{border-top-color:#062e33}
.balloon.thought{border-radius:30px;border-style:dashed}
.caption{background:#FFF3D8;border:2px solid var(--amber);border-left-width:8px;padding:7px 12px;font:var(--capfont);color:#5a4a22;border-radius:3px}
.caption.loc{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-style:normal;font-family:'Segoe UI',sans-serif;font-size:.74rem}
.sfx{position:absolute;z-index:5;font:900 1.7rem/1 'Arial Black',Arial,sans-serif;color:var(--coral);-webkit-text-stroke:2px var(--navy);text-stroke:2px var(--navy);transform:rotate(-7deg);text-shadow:3px 3px 0 var(--amber);letter-spacing:.04em;pointer-events:none}
.splashtitle{font:900 clamp(1.5rem,3.2vw,2.4rem)/1 'Arial Black',Arial,sans-serif;text-transform:uppercase;color:var(--navy)}
.splashtitle em{color:var(--accent);font-style:normal}
.kicker{font:900 .68rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.3em;color:var(--coral);text-transform:uppercase}

/* ---------- GATES ---------- */
.gatebox{border:4px solid var(--accent);border-radius:12px;background:linear-gradient(180deg,#ffffff,#eef7f6);box-shadow:0 6px 0 rgba(23,50,77,.15);overflow:hidden}
.gatebox header{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;padding:9px 14px}
.gatebox header .gicon{width:30px;height:30px;flex:none}
.gatebox header h3{font:900 .85rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.gatebody{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.gateprompt{font:600 .95rem/1.4 'Segoe UI',sans-serif}
.gatecheck{align-self:flex-start;background:var(--navy);color:#fff;border:none;border-radius:999px;font:900 .82rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.1em;padding:13px 26px;min-height:48px;box-shadow:0 4px 0 #0c1d30}
.gatecheck:active{transform:translateY(2px);box-shadow:0 2px 0 #0c1d30}
.gatefeedback{min-height:1.3em;font:700 .88rem/1.35 'Segoe UI',sans-serif}
.gatefeedback.bad{color:var(--coral)}
.gatefeedback.good{color:#0d7a4f}
.gatehint{background:#FFF3D8;border:2px dashed var(--amber);border-radius:8px;padding:9px 12px;font:600 .86rem/1.4 'Segoe UI',sans-serif;color:#5a4a22}
.gatesolved{display:flex;align-items:center;gap:10px;background:#e2f4ee;border:3px solid #0d7a4f;border-radius:10px;padding:10px 14px;font:900 .8rem/1.3 'Arial Black',Arial,sans-serif;color:#0d7a4f;letter-spacing:.08em}
.stamp{display:inline-block;transform:rotate(-6deg);border:3px solid #0d7a4f;border-radius:6px;padding:3px 8px}
/* gate widgets */
.tokenbank,.beakers{display:flex;gap:8px;flex-wrap:wrap}
.token{width:48px;height:48px;border-radius:50%;border:3px solid var(--navy);background:var(--amber);font:900 .7rem/1 'Arial Black',Arial,sans-serif;color:var(--navy);display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
.token:hover{transform:scale(1.1)}
.token.inA{background:var(--teal);color:#fff}
.token.inB{background:#7db8e8;color:var(--navy)}
.beaker{flex:1;min-width:120px;border:3px solid var(--navy);border-radius:0 0 14px 14px;border-top-style:dashed;padding:8px;min-height:74px;background:rgba(31,166,162,.08)}
.beaker h4{font:900 .62rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.12em;color:var(--navy);text-transform:uppercase;margin-bottom:6px}
.beaker .cnt{font:900 1.2rem/1 'Arial Black',Arial,sans-serif;color:var(--accent)}
.numin{width:96px;min-height:48px;border:3px solid var(--navy);border-radius:8px;font:900 1.05rem/1 'Arial Black',Arial,sans-serif;text-align:center;color:var(--navy);background:#fff;padding:6px}
.numin:focus{border-color:var(--accent)}
.numin.ok{border-color:#0d7a4f;background:#e2f4ee}
.numin.no{border-color:var(--coral);background:#fdebe6}
.rt-table{border-collapse:collapse;width:100%}
.rt-table th,.rt-table td{border:2px solid var(--navy);padding:7px 9px;text-align:center;font:700 .92rem/1.2 'Segoe UI',sans-serif}
.rt-table th{background:var(--navy);color:#fff;font:900 .7rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.08em}
.rt-table td.given{background:#eef7f6;font-weight:800}
.choicebtns{display:flex;gap:10px;flex-wrap:wrap}
.choicebtn{flex:1;min-width:140px;min-height:48px;border:3px solid var(--navy);border-radius:10px;background:#fff;font:700 .9rem/1.3 'Segoe UI',sans-serif;padding:10px 12px;text-align:left;transition:background .15s}
.choicebtn:hover{background:#eef7f6}
.choicebtn[aria-pressed="true"]{background:var(--navy);color:#fff}
.gategrid{touch-action:manipulation}
.gategrid .gp{cursor:pointer}
.unlockflash{animation:unlockflash 1s ease-out}
@keyframes unlockflash{0%{box-shadow:0 0 0 0 rgba(242,193,91,.9)}100%{box-shadow:0 0 0 26px rgba(242,193,91,0)}}

/* ---------- MODALS ---------- */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(5,12,19,.72);padding:16px}
.modal.open{display:flex}
.modalcard{background:var(--paper);border-radius:14px;max-width:780px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.modalcard>header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:12px 18px;z-index:2}
.modalcard>header h2{font:900 1rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.modalcard .x{background:var(--coral);border:none;color:#fff;border-radius:8px;width:40px;height:40px;font:900 1rem/1 Arial}
.modalbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.tt{border-collapse:collapse;width:100%}
.tt th,.tt td{border:2px solid var(--navy);padding:8px 10px;font:600 .85rem/1.35 'Segoe UI',sans-serif;text-align:left;vertical-align:top}
.tt th{background:var(--navy);color:#fff;font:900 .68rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.tt tr:nth-child(even) td{background:#fff}
.workedsteps{display:flex;flex-direction:column;gap:8px}
.workedsteps .st{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--navy);border-radius:8px;padding:9px 12px;font:600 .9rem/1.4 'Segoe UI',sans-serif}
.workedsteps .st b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font:900 .8rem/1 Arial}

/* ---------- END MATTER ---------- */
.castcard{display:flex;gap:12px;align-items:center;border:3px solid var(--navy);border-radius:10px;background:#fff;padding:8px 12px}
.castcard svg{width:64px;height:76px;flex:none}
.castcard h4{font:900 .8rem/1.2 'Arial Black',Arial,sans-serif;color:var(--navy);letter-spacing:.06em}
.castcard p{font:600 .8rem/1.35 'Segoe UI',sans-serif;color:#4c5a66}
.journal{border:3px solid var(--amber);background:#FFFDF4;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.journal h4{font:900 .8rem/1.2 'Arial Black',Arial,sans-serif;color:#8a6a1c;letter-spacing:.14em;text-transform:uppercase}
.journal .jrow{display:flex;gap:10px;align-items:flex-start;font:600 .88rem/1.4 Georgia,serif;color:#4a3d18}
.journal .jrow b{color:var(--navy)}
#certificate{border:6px double var(--navy);border-radius:8px;background:#fff;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px}
#certificate h3{font:900 1.2rem/1.1 'Arial Black',Arial,sans-serif;color:var(--navy);letter-spacing:.1em}
#certName{border:none;border-bottom:3px solid var(--navy);font:900 1.3rem/1.2 Georgia,serif;text-align:center;background:transparent;min-height:48px;width:80%;align-self:center;color:var(--ink)}
.certbadges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.certbadges .badge{filter:none;border-color:var(--amber);background:#fdf6e7}
.certbadges .badge.locked{filter:grayscale(1) opacity(.35)}

/* ---------- MOBILE ---------- */
@media (max-width:820px){
  #book{height:min(calc(100vh - 120px),760px)}
  #spreadWrap .page{width:100%}
  #spreadWrap .page.offscreen{display:none}
  #spine3d,#edgesL{display:none}
  .navarrow{width:44px;height:72px}
  .balloon{max-width:78%}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
/* ---------- PRINT ---------- */
@media print{
  body{overflow:visible;background:#fff}
  body *{visibility:hidden}
  body.print-teacher #teacherModal,body.print-teacher #teacherModal *{visibility:visible}
  body.print-teacher #teacherModal{position:static;display:block;background:#fff;padding:0}
  body.print-teacher #teacherModal .modalcard{max-height:none;box-shadow:none}
  body.print-cert #certificate,body.print-cert #certificate *{visibility:visible}
  body.print-cert #certificate{position:fixed;inset:5% 8%;background:#fff}
  .x,.gatecheck{display:none!important}
}
/* ================= VOL 2 OVERRIDES ================= */
:root{--accent:#3D74A8} /* brightened navy-blue accent (navy itself is too dark for accent UI) */
.hudbtn[aria-pressed="true"]{color:#fff} /* contrast fix: dark teal text fails AA on the blue accent */
.gatebox{background:linear-gradient(180deg,#ffffff,#edf3f9)} /* blue-tinted gate paper */
.beaker{background:rgba(61,116,168,.08)}

function ART(id) {
  const a = GN_ART.f[id];
  if (!a) throw new Error("gn-art: no frame " + id);
  const [x, y, w, h, alt, faces] = a;
  const at = (v, total, size) => (total === size ? 0 : (v / (total - size)) * 100);
  const faceHtml = faces.map(([l, t, fw, fh]) => `<i class="gn-face" style="left:${l}%;top:${t}%;width:${fw}%;height:${fh}%"></i>`).join("");
  return `<div class="gn-art" role="img" aria-label="${alt}" style="aspect-ratio:${w}/${h};background-image:url(${GN_ART.src});background-size:${(GN_ART.w / w) * 100}% ${(GN_ART.h / h) * 100}%;background-position:${at(x, GN_ART.w, w)}% ${at(y, GN_ART.h, h)}%">${faceHtml}</div>`;
}
for (const el of document.querySelectorAll("[data-gn-art]")) el.outerHTML = ART(el.dataset.gnArt);

/* ================= GATES ================= */
function mkfeed(el,msg,ok){el.textContent=msg;el.className="gatefeedback "+(ok?"good":"bad");}
const GATES = {
g1:{ title:"Gate 1 · Tag the Questions", icon:"#sig-quest",
  prompt:`Pimm's census form, four questions. Tag each one: <b>STATISTICAL</b> (answers vary) or <b>ONE ANSWER</b> (a single fact).`,
  hints:[ "Conceptual: a statistical question anticipates VARIETY — ask it to 100 visitors and you'd collect many different answers. A fact question has one fixed answer no matter who you ask.",
          "Procedural: test each question — 'Would two different visitors give two different answers?' Minutes stayed and money spent change person to person. Opening time and stall count do not." ],
  worked:{ steps:[ "Different form: 'How tall are Vexhall sixth graders?' — heights vary student to student → statistical.",
    "'How many doors does the observatory have?' — one fixed count → NOT statistical.",
    "The test is variability, not whether the answer is a number. Both answers are numbers; only one varies." ],
    q:"A survey asks 4 questions; 3 of them have answers that vary. How many are statistical?", a:"3" },
  render(body,api){
    const QS=[["How many minutes do visitors stay at the festival?","stat"],
              ["What time does the festival open?","one"],
              ["How much does each visitor spend at Rosa's stall?","stat"],
              ["How many stalls stand in Harbor Row?","one"]];
    body.innerHTML=QS.map((q,i)=>`<div style="border:2px solid var(--navy);border-radius:8px;padding:8px 10px;background:#fff">
      <div style="font:700 .88rem 'Segoe UI';margin-bottom:6px">${i+1}. ${q[0]}</div>
      <div class="choicebtns" role="group" aria-label="Tag question ${i+1}">
        <button class="choicebtn" data-q="${i}" data-v="stat" aria-pressed="false">📊 Statistical — varies</button>
        <button class="choicebtn" data-q="${i}" data-v="one" aria-pressed="false">📌 One answer — a fact</button>
      </div></div>`).join("");
    const picks=[null,null,null,null];
    body.querySelectorAll(".choicebtn").forEach(b=>b.addEventListener("click",()=>{
      body.querySelectorAll(`.choicebtn[data-q="${b.dataset.q}"]`).forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");picks[+b.dataset.q]=b.dataset.v;api.sound("blip");}));
    api.onCheck(()=>{
      if(picks.some(p=>p===null))return api.fail("Tag all four questions first — every line on the form.");
      const wrong=QS.reduce((n,q,i)=>n+(picks[i]!==q[1]?1:0),0);
      if(wrong===0)api.pass("Sorted! Two statistical (stay time, spending) and two facts. Pimm's census never asked a single statistical question — no wonder it's bent.");
      else api.fail(wrong+" tag"+(wrong>1?"s look":" looks")+" off. Ask each question to two imaginary visitors — do you hear two different answers?");});
  }},
g2:{ title:"Gate 2 · The Middle Finder", icon:"#sig-median",
  prompt:`Rosa's logbook, five festival days: <b>51, 38, 60, 45, 42</b> visitors. Find the <b>median</b> — her typical day.`,
  hints:[ "Conceptual: the median is the middle of the ORDERED list — half the days sit below it, half above. (If the count were even, you'd average the TWO middle values.)",
          "Procedural: write the five numbers smallest to largest: 38, 42, …, …, 60. Cross off one number from each end, twice. The survivor is the median." ],
  worked:{ steps:[ "Different log: 9, 4, 12, 7, 10. Order it → 4, 7, 9, 10, 12.",
    "Cross off ends in pairs: (4,12) gone, (7,10) gone → middle is 9.",
    "Even-count twist: for 4, 7, 9, 10 there's no single middle — average the two middles: (7+9) ÷ 2 = 8." ],
    q:"Find the median of 3, 8, 5, 11, 6.", a:"6" },
  render(body,api){
    body.innerHTML=`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span style="font:900 1.1rem 'Arial Black',Arial;color:var(--navy)">Median =</span>
      <input class="numin" id="med" inputmode="numeric" aria-label="median number of visitors">
      <span style="font:900 1.1rem 'Arial Black',Arial;color:var(--navy)">visitors</span></div>`;
    api.onCheck(()=>{const v=parseFloat(body.querySelector("#med").value);
      if(v===45){body.querySelector("#med").className="numin ok";api.pass("Ordered: 38, 42, 45, 51, 60 — the middle is 45. Rosa's typical day is 45 visitors, not 'nobody.'");}
      else{body.querySelector("#med").className="numin no";
        api.fail(v===60?"60 is the middle of the UNORDERED list. Order the numbers first!":(isNaN(v)?"Type a number — the middle of the ordered list.":"Not the middle. Order all five values, then cross off the ends in pairs."));}});
  }},
g3:{ title:"Gate 3 · Stack the Truth", icon:"#sig-hist",
  prompt:`Dev's tally — visitors in each of 16 half-hour blocks:<br><b>12 · 3 · 25 · 14 · 7 · 18 · 22 · 11 · 9 · 27 · 16 · 5 · 13 · 21 · 19 · 20</b><br>Count how many blocks land in each bin, then set the three bar heights.`,
  hints:[ "Conceptual: each bar's height is a FREQUENCY — how many of the 16 numbers fall inside that interval. Every number lands in exactly one bin.",
          "Procedural: go number by number and tick a bin: 12→(10–19), 3→(0–9), 25→(20–29)… Your three counts must add up to 16." ],
  worked:{ steps:[ "Different tally — books read: 2, 7, 11, 4, 13, 6, 12, 1. Bins: 0–4, 5–9, 10–14.",
    "Tick each value: 0–4 gets 2, 4, 1 → height 3. 5–9 gets 7, 6 → height 2. 10–14 gets 11, 13, 12 → height 3.",
    "Check the total: 3 + 2 + 3 = 8 values. All data accounted for, no gaps between bars." ],
    q:"In that worked tally, how tall is the 10–14 bar?", a:"3" },
  render(body,api){
    body.innerHTML=`<svg viewBox="0 0 320 175" style="width:100%;max-width:400px;border:3px solid var(--navy);border-radius:8px;background:#fff" aria-hidden="true">
      <line x1="42" y1="140" x2="300" y2="140" stroke="#17324D" stroke-width="3"/>
      <line x1="42" y1="140" x2="42" y2="10" stroke="#17324D" stroke-width="3"/>
      ${[0,2,4,6,8].map(v=>`<g><line x1="38" y1="${140-v*14}" x2="46" y2="${140-v*14}" stroke="#17324D" stroke-width="2"/><text x="32" y="${144-v*14}" text-anchor="end" font-size="10" font-family="Arial" fill="#17324D">${v}</text></g>`).join("")}
      <rect id="bar1" x="56" y="140" width="72" height="0" fill="#3D74A8" stroke="#17324D" stroke-width="2"/>
      <rect id="bar2" x="128" y="140" width="72" height="0" fill="#F2C15B" stroke="#17324D" stroke-width="2"/>
      <rect id="bar3" x="200" y="140" width="72" height="0" fill="#E2674A" stroke="#17324D" stroke-width="2"/>
      <text x="92" y="156" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#17324D">0–9</text>
      <text x="164" y="156" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#17324D">10–19</text>
      <text x="236" y="156" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#17324D">20–29</text>
      <text x="170" y="171" text-anchor="middle" font-size="10" font-family="Arial" fill="#5a4a22">visitors per half-hour block</text></svg>
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <label style="font:700 .85rem 'Segoe UI'">0–9: <input class="numin" id="h1" style="width:72px" inputmode="numeric" aria-label="bar height for bin 0 to 9"></label>
        <label style="font:700 .85rem 'Segoe UI'">10–19: <input class="numin" id="h2" style="width:72px" inputmode="numeric" aria-label="bar height for bin 10 to 19"></label>
        <label style="font:700 .85rem 'Segoe UI'">20–29: <input class="numin" id="h3" style="width:72px" inputmode="numeric" aria-label="bar height for bin 20 to 29"></label></div>`;
    const upd=()=>{[1,2,3].forEach(i=>{const v=Math.max(0,Math.min(9,parseFloat(body.querySelector("#h"+i).value)||0));
      const r=body.querySelector("#bar"+i);r.setAttribute("height",v*14);r.setAttribute("y",140-v*14);});};
    [1,2,3].forEach(i=>body.querySelector("#h"+i).addEventListener("input",()=>{upd();api.sound("blip");}));
    api.onCheck(()=>{const v=id=>parseFloat(body.querySelector(id).value);
      const ok1=v("#h1")===4,ok2=v("#h2")===7,ok3=v("#h3")===5;
      body.querySelector("#h1").className="numin "+(ok1?"ok":"no");
      body.querySelector("#h2").className="numin "+(ok2?"ok":"no");
      body.querySelector("#h3").className="numin "+(ok3?"ok":"no");
      if(ok1&&ok2&&ok3)api.pass("4 + 7 + 5 = all 16 blocks stacked. The histogram shows a busy middle — 'low numbers,' Pimm? Really?");
      else api.fail((v("#h1")||0)+(v("#h2")||0)+(v("#h3")||0)===16?"Right total, wrong bins — re-sort the borderline values like 9, 11 and 20.":"Tick off each of the 16 numbers into a bin — the three heights must total 16.");});
  }},
g4:{ title:"Gate 4 · The Five-Number Key", icon:"#sig-box",
  prompt:`The crew's seven checkpoint counts, already in order: <b>12, 15, 18, 21, 24, 30, 35</b>. Cut the key: find <b>Q1</b>, the <b>median</b>, <b>Q3</b>, and the <b>IQR</b>. (Min = 12 and max = 35 are free.)`,
  hints:[ "Conceptual: the median splits the data in half; Q1 is the median of the LOWER half, Q3 the median of the UPPER half. IQR = Q3 − Q1, the width of the box.",
          "Procedural: median = 4th of 7 values. Lower half is the three values below it — take their middle. Upper half is the three above it — take their middle. Then subtract." ],
  worked:{ steps:[ "Different data: 2, 4, 6, 8, 10, 12, 14. Median = the 4th value = 8.",
    "Lower half 2, 4, 6 → Q1 = 4. Upper half 10, 12, 14 → Q3 = 12.",
    "IQR = Q3 − Q1 = 12 − 4 = 8. The box would stretch from 4 to 12 with a line at 8." ],
    q:"For that worked data, what is the IQR?", a:"8" },
  render(body,api){
    body.innerHTML=`<svg viewBox="0 0 360 90" style="width:100%;max-width:420px" aria-hidden="true">
      <line x1="20" y1="55" x2="340" y2="55" stroke="#17324D" stroke-width="2"/>
      ${[12,15,18,21,24,30,35].map(v=>`<g><line x1="${20+(v-10)*12}" y1="50" x2="${20+(v-10)*12}" y2="60" stroke="#17324D" stroke-width="2"/><text x="${20+(v-10)*12}" y="76" text-anchor="middle" font-size="10" font-family="Arial" fill="#17324D">${v}</text></g>`).join("")}
      <line x1="44" y1="30" x2="80" y2="30" stroke="#17324D" stroke-width="3"/><line x1="44" y1="22" x2="44" y2="38" stroke="#17324D" stroke-width="3"/>
      <rect x="80" y="14" width="220" height="32" fill="rgba(242,193,91,.45)" stroke="#17324D" stroke-width="3"/>
      <line x1="152" y1="14" x2="152" y2="46" stroke="#E2674A" stroke-width="4"/>
      <line x1="300" y1="30" x2="320" y2="30" stroke="#17324D" stroke-width="3"/><line x1="320" y1="22" x2="320" y2="38" stroke="#17324D" stroke-width="3"/>
      <text x="80" y="10" text-anchor="middle" font-size="10" font-family="Arial" font-weight="700" fill="#3D74A8">Q1?</text>
      <text x="152" y="10" text-anchor="middle" font-size="10" font-family="Arial" font-weight="700" fill="#E2674A">median?</text>
      <text x="300" y="10" text-anchor="middle" font-size="10" font-family="Arial" font-weight="700" fill="#3D74A8">Q3?</text></svg>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <label style="font:700 .85rem 'Segoe UI'">Q1: <input class="numin" id="q1" style="width:70px" inputmode="numeric" aria-label="first quartile"></label>
        <label style="font:700 .85rem 'Segoe UI'">Median: <input class="numin" id="q2" style="width:70px" inputmode="numeric" aria-label="median"></label>
        <label style="font:700 .85rem 'Segoe UI'">Q3: <input class="numin" id="q3" style="width:70px" inputmode="numeric" aria-label="third quartile"></label>
        <label style="font:700 .85rem 'Segoe UI'">IQR: <input class="numin" id="iqr" style="width:70px" inputmode="numeric" aria-label="interquartile range"></label></div>`;
    api.onCheck(()=>{const v=id=>parseFloat(body.querySelector(id).value);
      const ok1=v("#q1")===15,ok2=v("#q2")===21,ok3=v("#q3")===30,ok4=v("#iqr")===15;
      body.querySelector("#q1").className="numin "+(ok1?"ok":"no");
      body.querySelector("#q2").className="numin "+(ok2?"ok":"no");
      body.querySelector("#q3").className="numin "+(ok3?"ok":"no");
      body.querySelector("#iqr").className="numin "+(ok4?"ok":"no");
      if(ok1&&ok2&&ok3&&ok4)api.pass("Min 12, Q1 15, median 21, Q3 30, max 35 — IQR 15. The official chart's box was drawn nowhere near this. Crooked confirmed.");
      else if(ok1&&ok2&&ok3)api.fail("Three cuts true — now the IQR: subtract Q1 from Q3.");
      else api.fail("At least one cut missed. Median first (the 4th value), then the middles of each half.");});
  }},
g5:{ title:"Gate 5 · Fair Share", icon:"#sig-fair",
  prompt:`Two levelings before the hearing:<br>① Churro batches over 5 days: <b>14, 9, 16, 13, 8</b> — find the <b>mean</b>.<br>② The cider barrel poured <b>94.5 L over 7 days</b> — mean liters per day (decimal division!).`,
  hints:[ "Conceptual: the mean is the fair share — pour every day's count into one pot, then split the pot equally among the days.",
          "Procedural: ① add the five numbers, divide by 5. ② divide 94.5 by 7 — or split it: 94.5 = 70 + 24.5, and each part divides by 7 evenly." ],
  worked:{ steps:[ "Different stand: 5, 9, 7, 3 trays over 4 days. Total = 5+9+7+3 = 24.",
    "Mean = 24 ÷ 4 = 6 trays — level stacks of 6.",
    "Decimal version: 25.5 L ÷ 3 days. 25.5 = 24 + 1.5 → 8 + 0.5 = 8.5 L per day." ],
    q:"Find the mean of 11, 5, 8.", a:"8" },
  render(body,api){
    body.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b style="font:900 .75rem 'Arial Black'">①</b><span style="font:600 .88rem 'Segoe UI'">Mean batches per day:</span><input class="numin" id="mean" inputmode="numeric" aria-label="mean churro batches per day"></div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b style="font:900 .75rem 'Arial Black'">②</b><span style="font:600 .88rem 'Segoe UI'">Mean cider per day:</span><input class="numin" id="avg" inputmode="decimal" aria-label="mean liters of cider per day"> <span style="font:600 .88rem 'Segoe UI'">L</span></div></div>`;
    api.onCheck(()=>{const m=parseFloat(body.querySelector("#mean").value),a=parseFloat(body.querySelector("#avg").value);
      const ok1=m===12,ok2=Math.abs(a-13.5)<.01;
      body.querySelector("#mean").className="numin "+(ok1?"ok":"no");
      body.querySelector("#avg").className="numin "+(ok2?"ok":"no");
      if(ok1&&ok2)api.pass("60 ÷ 5 = 12 batches, 94.5 ÷ 7 = 13.5 L. Every stack level, every share fair. To the hearing!");
      else if(!ok1)api.fail("Leveling ① first: total all five days, then split equally among 5.");
      else api.fail("Leveling ② holds: 94.5 ÷ 7. Try splitting 94.5 into 70 + 24.5.");});
  }},
boss:{ title:"BOSS GATE · Outlier Showdown", icon:"#sig-boss",
  prompt:`Rosa's full week: <b>41, 44, 45, 47, 150</b> (150 = parade day, when every stall spiked). Pimm waves the "average." Four locks to save the permit:`,
  hints:[ "Conceptual: an outlier drags the MEAN toward it like a magnet, but the MEDIAN only cares about position — it barely moves. The honest 'typical day' is the measure the outlier can't bend.",
          "Procedural: Lock 1: add all five (watch the 150) and divide by 5. Lock 2: the data is already ordered — take the 3rd value. Locks 3–4: compare your two numbers to the days Rosa actually had." ],
  worked:{ steps:[ "Different stall's week: 10, 12, 14, 100. Mean = 136 ÷ 4 = 34 — yet NO day was anywhere near 34.",
    "Median: even count, so average the two middles: (12 + 14) ÷ 2 = 13. That matches the real days.",
    "The 100 dragged the mean to 34; the median stayed home at 13. With an outlier, report the median." ],
    q:"For that week (10, 12, 14, 100), what is the median?", a:"13" },
  render(body,api){
    body.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b style="font:900 .75rem 'Arial Black'">LOCK 1</b><span style="font:600 .88rem 'Segoe UI'">Mean of the week:</span><input class="numin" id="bmean" inputmode="decimal" aria-label="mean visitors"> <span style="font:600 .88rem 'Segoe UI'">visitors</span></div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b style="font:900 .75rem 'Arial Black'">LOCK 2</b><span style="font:600 .88rem 'Segoe UI'">Median of the week:</span><input class="numin" id="bmed" inputmode="numeric" aria-label="median visitors"> <span style="font:600 .88rem 'Segoe UI'">visitors</span></div>
      <div><b style="font:900 .75rem 'Arial Black'">LOCK 3</b><div style="font:600 .88rem 'Segoe UI';margin:4px 0">Which measure honestly represents Rosa's <i>typical</i> day?</div>
        <div class="choicebtns"><button class="choicebtn" data-v="mean" aria-pressed="false">The mean</button><button class="choicebtn" data-v="median" aria-pressed="false">The median</button></div></div>
      <div><b style="font:900 .75rem 'Arial Black'">LOCK 4</b><div style="font:600 .88rem 'Segoe UI';margin:4px 0">Tell the council WHY:</div>
        <div class="choicebtns">
        <button class="choicebtn" data-w="a" aria-pressed="false">The bigger number always looks better for Rosa.</button>
        <button class="choicebtn" data-w="b" aria-pressed="false">The parade-day outlier drags the mean up; the median stays with her ordinary days.</button>
        <button class="choicebtn" data-w="c" aria-pressed="false">The median is always correct for every data set, no reason needed.</button></div></div></div>`;
    let p3=null,p4=null;
    body.querySelectorAll("[data-v]").forEach(b=>b.addEventListener("click",()=>{body.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");p3=b.dataset.v;api.sound("blip");}));
    body.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{body.querySelectorAll("[data-w]").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");p4=b.dataset.w;api.sound("blip");}));
    api.onCheck(()=>{const m=parseFloat(body.querySelector("#bmean").value),md=parseFloat(body.querySelector("#bmed").value);
      const ok1=Math.abs(m-65.4)<.05,ok2=md===45;
      body.querySelector("#bmean").className="numin "+(ok1?"ok":"no");
      body.querySelector("#bmed").className="numin "+(ok2?"ok":"no");
      if(!ok1)return api.fail("Lock 1 holds. Sum all five days — the total ends in 7 — then divide by 5.");
      if(!ok2)return api.fail("Lock 2 holds. Five ordered values — the median is the 3rd one.");
      if(p3!=="median")return api.fail("Lock 3 holds. Which number is close to the days Rosa ACTUALLY had — 65.4 or your median?");
      if(p4!=="b")return api.fail("Lock 4 holds. The reason must mention what the outlier DOES to the mean — not which number is bigger or a rule that 'always' works.");
      api.pass("ALL LOCKS OPEN. Mean 65.4 was parade-day glitter; median 45 is the truth. Permit RESTORED — the census stands uncrooked!");});
  }}
};

<script>
/* ================================================================
   ===== AXIOM CITY ENGINE v1.0 — identical in every volume =======
   ================================================================ */
"use strict";
/* ---------- storage (exact wrapper, ewl_ prefix) ---------- */
const storage={_m:{},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){this._m[k]=v}},get(k,d=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return this._m[k]??d}}};
const K=s=>`ewl_axiom_${VOLUME.slug}_${s}`;

const $=s=>document.querySelector(s);
const live=msg=>{$("#live").textContent=msg};
const reducedMQ=matchMedia("(prefers-reduced-motion: reduce)");
const mobileMQ=matchMedia("(max-width: 820px)");

const prefs=Object.assign({sound:false,motion:true,bigtext:false,hc:false},storage.get(K("prefs"))||{});
let solved=new Set(storage.get(K("gates"))||[]);
let page=storage.get(K("page"))||0;            // index of left/visible page
let turning=false;
const attempts={};

/* ---------- audio (Web Audio oscillators only, muted default) ---------- */
let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return actx}
function tone(f,t,dur,type="square",vol=.04){const c=ac();if(!c||!prefs.sound)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+dur+.02)}
const SND={blip(){tone(660,0,.07)},flip(){tone(220,0,.09,"triangle",.05);tone(330,.05,.08,"triangle",.04)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.09,.14,"triangle",.05))},thud(){tone(110,0,.18,"sawtooth",.05)}};

/* ---------- helpers ---------- */
function gateLockIcon(open){return `<div class="gatelockcorner ${open?"open":""}" aria-hidden="true"><svg viewBox="0 0 100 100" style="color:#fff"><use href="${open?"#sig-open":"#sig-lock"}"/></svg></div>`}

function pageInnerHTML(i){
  if(i==null||i<0||i>=PAGES.length) return `<div class="page-inner" style="align-items:center;justify-content:center"><div class="kicker" style="opacity:.4">AXIOM CITY</div></div><div class="pagefoot"><span></span><span></span></div>`;
  const p=PAGES[i];
  const gateHTML=p.gate?`<div class="gatemount" data-gate="${p.gate}"></div>`:"";
  const lock=p.gate?gateLockIcon(solved.has(p.gate)):"";
  return `${lock}<div class="chapterband">${p.ch.replace("·","· <em>").concat(p.ch.includes("·")?"</em>":"")}</div><div class="page-inner">${p.html}${gateHTML}</div><div class="pagefoot"><span>${VOLUME.unit}</span><span>PAGE ${i+1} / ${PAGES.length}</span></div>`;
}

/* ---------- gate framework ---------- */
function mountGates(scope){
  scope.querySelectorAll(".gatemount").forEach(m=>{
    const id=m.dataset.gate,G=GATES[id];
    if(!G)return;
    if(solved.has(id)){m.innerHTML=`<div class="gatesolved"><span class="stamp">SOLVED</span> ${G.title} — badge earned.</div>`;return}
    m.innerHTML=`<div class="gatebox"><header><svg class="gicon" viewBox="0 0 100 100"><use href="${G.icon}"/></svg><h3>${G.title}</h3></header>
      <div class="gatebody"><div class="gateprompt">${G.prompt}</div><div class="gwidget"></div>
      <div class="gatehint" hidden></div>
      <button class="gatecheck">CHECK</button>
      <div class="gatefeedback" aria-live="polite"></div></div></div>`;
    const box=m.querySelector(".gatebox"),body=m.querySelector(".gwidget"),fb=m.querySelector(".gatefeedback"),hint=m.querySelector(".gatehint"),btn=m.querySelector(".gatecheck");
    let checker=null;
    const api={
      sound:n=>SND[n]&&SND[n](),
      onCheck(fn){checker=fn},
      fail(msg){
        attempts[id]=(attempts[id]||0)+1;SND.thud();mkfeed(fb,msg,false);
        const n=attempts[id];
        if(n===1){hint.hidden=false;hint.innerHTML="💡 <b>Hint:</b> "+G.hints[0]}
        else if(n===2){hint.hidden=false;hint.innerHTML="🧭 <b>Hint 2:</b> "+G.hints[1]}
        else if(n>=3&&!hint.querySelector(".askvex")){
          const b=document.createElement("button");b.className="gatecheck askvex";b.style.marginTop="8px";b.textContent="ASK VEX — WORKED EXAMPLE";
          b.addEventListener("click",()=>openWorked(G));hint.appendChild(b);
        }
        live("Not yet. "+msg);
      },
      pass(msg){
        solved.add(id);storage.set(K("gates"),[...solved]);SND.win();
        m.innerHTML=`<div class="gatesolved unlockflash"><span class="stamp">SOLVED</span> ${msg}</div>`;
        const corner=m.closest(".page,#pageL,#pageR")?.querySelector(".gatelockcorner");
        if(corner){corner.classList.add("open");corner.innerHTML=`<svg viewBox="0 0 100 100" style="color:#fff"><use href="#sig-open"/></svg>`}
        earnBadge(id);updateNav();live("Gate solved! "+msg);
      }
    };
    G.render(body,api);
    btn.addEventListener("click",()=>{ac();checker&&checker()});
  });
}
function openWorked(G){
  $("#workedBody").innerHTML=`<div class="workedsteps">${G.worked.steps.map((s,i)=>`<div class="st"><b class="n">${i+1}</b><span>${s}</span></div>`).join("")}</div>
    <div class="caption">Your turn — same idea, different numbers:</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font:600 .92rem 'Segoe UI'">${G.worked.q}</span>
    <input class="numin" id="wkin" aria-label="worked example answer"><button class="gatecheck" id="wkgo">CHECK</button></div>
    <div class="gatefeedback" id="wkfb" aria-live="polite"></div>`;
  $("#workedModal").classList.add("open");
  $("#wkgo").addEventListener("click",()=>{
    const v=($("#wkin").value||"").trim().replace(/\s+/g,"");
    if(v===G.worked.a||parseFloat(v)===parseFloat(G.worked.a)){
      mkfeed($("#wkfb"),"Yes! Now head back and open that gate.",true);SND.win();
      setTimeout(()=>$("#workedModal").classList.remove("open"),1100);
    }else{mkfeed($("#wkfb"),"Walk the steps above again — you've got this.",false);SND.thud()}
  });
}

/* ---------- badges ---------- */
function buildBadges(){
  $("#badges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"earned":""}" id="badge-${b.id}" title="${b.label}" role="img" aria-label="${b.label}${solved.has(b.id)?" — earned":" — locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
}
function earnBadge(id){buildBadges();const el=$("#badge-"+id);if(el){el.classList.remove("earned");void el.offsetWidth;el.classList.add("earned")}const b=BADGES.find(x=>x.id===id);if(b)live("Badge earned: "+b.label)}

/* ---------- progress ---------- */
function buildProgress(){$("#progress").innerHTML=PAGES.map((_,i)=>`<span class="dot ${i<=page?"on":""}"></span>`).join("")}

/* ---------- navigation & rendering ---------- */
const isMobile=()=>mobileMQ.matches;
function leftIndex(){return isMobile()?page:page-(page%2)}
function visiblePages(){return isMobile()?[page]:[leftIndex(),leftIndex()+1].filter(i=>i<PAGES.length)}
function blockedBy(){return null/* locks removed: gates still teach via hints + Ask VEX worked examples, but never block turning the page (Neft 2026-06-11) */}

function renderSpread(){
  const L=$("#pageL"),R=$("#pageR");
  if(isMobile()){L.innerHTML=pageInnerHTML(page);L.classList.remove("offscreen");R.classList.add("offscreen");R.innerHTML="";mountGates(L)}
  else{const li=leftIndex();L.innerHTML=pageInnerHTML(li);R.innerHTML=pageInnerHTML(li+1<PAGES.length?li+1:null);L.classList.remove("offscreen");R.classList.remove("offscreen");mountGates(L);mountGates(R)}
  buildProgress();updateNav();updateEdges();
  if(PAGES[page])live(`Page ${page+1} of ${PAGES.length}. ${PAGES[page].ch}.`);
  storage.set(K("page"),page);
  if($("#certName")){$("#certName").value=storage.get(K("name"))||"";$("#certName").addEventListener("input",e=>storage.set(K("name"),e.target.value));
    $("#certBadges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"":"locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
    $("#printCert").addEventListener("click",()=>{document.body.classList.add("print-cert");window.print();setTimeout(()=>document.body.classList.remove("print-cert"),400)});}
}
function updateEdges(){const f=page/Math.max(1,PAGES.length-1);$("#edgesL").style.width=(4+f*12)+"px";$("#edgesR").style.width=(16-f*12)+"px"}
function updateNav(){
  $("#prevBtn").disabled=page<=0||turning;
  const lastVisible=Math.max(...visiblePages());
  const end=lastVisible>=PAGES.length-1;
  const blocked=blockedBy();
  $("#nextBtn").disabled=end||turning;
  $("#nextBtn").classList.toggle("locked",!!blocked&&!end);
  $("#nextBtn").innerHTML=blocked&&!end?"🔒":"›";
  $("#nextBtn").setAttribute("aria-label",blocked?"Locked — solve the gate on this page to continue":"Next page");
}
function step(dir){
  if(turning)return;
  if(dir>0){
    const blocked=blockedBy();
    if(blocked){const G=GATES[blocked];SND.thud();$("#nextBtn").classList.add("shake");setTimeout(()=>$("#nextBtn").classList.remove("shake"),700);
      live("This page is gated. Solve "+G.title+" to continue.");
      const gb=document.querySelector(".gatebox");if(gb){gb.classList.add("unlockflash");setTimeout(()=>gb.classList.remove("unlockflash"),1000)}
      return}
    const lastVisible=Math.max(...visiblePages());
    if(lastVisible>=PAGES.length-1)return;
    const target=isMobile()?page+1:leftIndex()+2;
    animTurn(1,target);
  }else{
    if(page<=0)return;
    const target=isMobile()?page-1:Math.max(0,leftIndex()-2);
    animTurn(-1,target);
  }
}
function animTurn(dir,target){
  if(isMobile()||reducedMQ.matches||!prefs.motion){page=target;renderSpread();SND.flip();return}
  turning=true;SND.flip();
  const sheet=$("#turnSheet"),front=sheet.querySelector(".ts.front"),back=sheet.querySelector(".ts.back");
  const oldL=leftIndex();
  if(dir>0){
    front.innerHTML=pageInnerHTML(oldL+1<PAGES.length?oldL+1:null);
    back.innerHTML=pageInnerHTML(target<PAGES.length?target:null);
    page=target;
    /* underneath: left stays old-left, right becomes new-right */
    $("#pageR").innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    sheet.className="";sheet.classList.add("show","fwd");
  }else{
    front.innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    back.innerHTML=pageInnerHTML(oldL);
    page=target;
    $("#pageL").innerHTML=pageInnerHTML(target);
    sheet.className="";sheet.classList.add("show","back");
  }
  const done=()=>{sheet.classList.remove("show","fwd","back");sheet.removeEventListener("animationend",done);turning=false;renderSpread()};
  sheet.addEventListener("animationend",done);
  setTimeout(()=>{if(turning){done()}},1000);
}

/* ---------- parallax ---------- */
let rafPending=false,px=0,py=0;
function applyParallax(){
  rafPending=false;
  if(!prefs.motion||reducedMQ.matches)return;
  document.querySelectorAll("#spreadWrap .panel3d").forEach(p=>{
    p.style.transform=`rotateY(${px*4}deg) rotateX(${-py*3}deg)`;
    p.querySelectorAll("[data-depth]").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d*.6}px,${py*d*.35}px)`});
  });
}
addEventListener("pointermove",e=>{
  px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2;
  if(!rafPending){rafPending=true;requestAnimationFrame(applyParallax)}
  const cc=$("#coverCard");
  if(cc&&!$("#cover").hidden&&prefs.motion&&!reducedMQ.matches){
    cc.style.transform=`rotateY(${px*9}deg) rotateX(${-py*7}deg)`;
    cc.querySelectorAll(".cov-layer").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d}px,${py*d*.6}px)`});
  }
},{passive:true});

/* note: SVG <g data-depth> transform via style works in modern browsers (SVG2). Wrapped above for safety. */

/* ---------- HUD toggles ---------- */
function syncToggles(){
  $("#sndBtn").setAttribute("aria-pressed",prefs.sound);$("#sndBtn").textContent=prefs.sound?"🔊 Sound":"🔇 Sound";
  $("#motBtn").setAttribute("aria-pressed",prefs.motion);$("#motBtn").textContent=prefs.motion?"3D On":"3D Off";
  $("#txtBtn").setAttribute("aria-pressed",prefs.bigtext);document.documentElement.dataset.textsize=prefs.bigtext?"lg":"md";
  $("#hcBtn").setAttribute("aria-pressed",prefs.hc);document.body.classList.toggle("hc",prefs.hc);
  if(!prefs.motion)document.querySelectorAll(".panel3d").forEach(p=>p.style.transform="");
  storage.set(K("prefs"),prefs);
}
$("#sndBtn").addEventListener("click",()=>{prefs.sound=!prefs.sound;ac();syncToggles();SND.blip()});
$("#motBtn").addEventListener("click",()=>{prefs.motion=!prefs.motion;syncToggles()});
$("#txtBtn").addEventListener("click",()=>{prefs.bigtext=!prefs.bigtext;syncToggles()});
$("#hcBtn").addEventListener("click",()=>{prefs.hc=!prefs.hc;syncToggles()});

/* ---------- teacher panel ---------- */
function buildTeacher(){
  $("#teacherBody").innerHTML=`
    <p style="font:600 .9rem/1.45 'Segoe UI'">${VOLUME.unit} — interactive graphic novel. Story pauses at six <b>reader gates</b>; students must solve grade-level math problems to continue. Progress, badges, and settings persist per device.</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">SUGGESTED USE</h3>
    <p style="font:600 .88rem/1.45 'Segoe UI'">${TEACHER.suggested}</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">STANDARDS ALIGNMENT (CCSS)</h3>
    <table class="tt"><tr><th>Standard</th><th>Description</th><th>Where</th></tr>
    ${TEACHER.standards.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">ANSWER KEY</h3>
    <table class="tt"><tr><th>Gate</th><th>Answer &amp; notes</th></tr>
    ${TEACHER.answers.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</table>
    <p style="font:600 .8rem/1.4 'Segoe UI';color:#666">Hints escalate: conceptual → procedural → VEX worked example (parallel problem; never reveals the gate answer). Sound is off by default. 3D motion can be disabled (auto-disabled for reduced-motion users). © EduWonderLab — single-file, offline-safe, no data leaves the device.</p>`;
}
$("#teacherBtn").addEventListener("click",()=>{buildTeacher();$("#teacherModal").classList.add("open")});
$("#printTeacher").addEventListener("click",()=>{document.body.classList.add("print-teacher");window.print();setTimeout(()=>document.body.classList.remove("print-teacher"),400)});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest(".modal").classList.remove("open")));

/* ---------- input ---------- */
$("#nextBtn").addEventListener("click",()=>{ac();step(1)});
$("#prevBtn").addEventListener("click",()=>{ac();step(-1)});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){$("#teacherModal").classList.remove("open");return}
  if($(".modal.open"))return;
  if(["ArrowRight","PageDown"].includes(e.key))step(1);
  if(["ArrowLeft","PageUp"].includes(e.key))step(-1);
});
let tx=null;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60&&!$(".modal.open"))step(dx<0?1:-1);tx=null},{passive:true});
mobileMQ.addEventListener("change",()=>renderSpread());

/* ---------- boot ---------- */
function openBook(){
  $("#cover").hidden=true;$("#hud").hidden=false;$("#stage").hidden=false;
  $("#prevBtn").hidden=false;$("#nextBtn").hidden=false;
  renderSpread();
}
$("#startBtn").addEventListener("click",()=>{ac();page=0;openBook()});
$("#resumeBtn").addEventListener("click",()=>{ac();openBook()});
if((storage.get(K("page"))||0)>0||solved.size>0){$("#resumeBtn").hidden=false}
if(reducedMQ.matches){prefs.motion=false}
document.body.classList.toggle("reduced",reducedMQ.matches);
buildBadges();syncToggles();buildProgress();
</script>

<style>

</style>
<script>

  var volUnit = (typeof VOLUME !== "undefined" && VOLUME.unit) ? String(VOLUME.unit) : document.title;
  var m = volUnit.match(/Unit\s*(\d+)/i) || location.pathname.match(/(?:vol-0|u)(\d)/i);
  var unitNum = m ? +m[1] : 2;

  var ctrls = document.querySelector("#hud .ctrls");
  if(ctrls){
    var btn = document.createElement("button");
    btn.id = "holopadBtn";
    btn.type = "button";
    btn.innerHTML = "&#129517; Math Holopad";
    btn.title = "Open Interactive District Math Sandbox, Scratchpad & Crew Dossiers";
    ctrls.insertBefore(btn, ctrls.firstChild);
  }

  var modal = document.createElement("div");
  modal.id = "holopadModal";
  modal.className = "modal";
  modal.setAttribute("role","dialog");
  modal.setAttribute("aria-modal","true");
  modal.setAttribute("aria-label","District Math Holopad");
  modal.innerHTML =
    '<div class="sheet" style="max-width:780px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:3px solid #0f172a;padding-bottom:8px">' +
        '<h2 style="margin:0;font:900 1.15rem \'Arial Black\',sans-serif;letter-spacing:.04em">&#129517; AXIOM DISTRICT HOLOPAD // UNIT ' + unitNum + ' LAB &amp; CREW</h2>' +
        '<button type="button" class="btn" data-hp-close style="padding:5px 12px">Close &#10005;</button>' +
      '</div>' +
      '<div class="hp-tabs">' +
        '<button type="button" class="hp-tab active" data-hp-tab="lab">&#129514; Interactive Topic Math Lab</button>' +
        '<button type="button" class="hp-tab" data-hp-tab="pad">&#127912; Holographic Scratchpad</button>' +
        '<button type="button" class="hp-tab" data-hp-tab="crew">&#127917; District Crew Dossiers</button>' +
      '</div>' +
      '<div class="hp-pane active" data-hp-pane="lab" id="hpLabHost"></div>' +
      '<div class="hp-pane" data-hp-pane="pad">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">' +
          '<div style="display:flex;gap:6px;align-items:center;font:800 .78rem \'Segoe UI\',sans-serif">Ink: ' +
            '<button type="button" data-hp-ink="#0f172a" style="width:26px;height:26px;border-radius:50%;background:#0f172a;border:2px solid #0f172a;cursor:pointer"></button>' +
            '<button type="button" data-hp-ink="#1d4ed8" style="width:26px;height:26px;border-radius:50%;background:#1d4ed8;border:2px solid #0f172a;cursor:pointer"></button>' +
            '<button type="button" data-hp-ink="#b42318" style="width:26px;height:26px;border-radius:50%;background:#b42318;border:2px solid #0f172a;cursor:pointer"></button>' +
            '<button type="button" data-hp-ink="#047857" style="width:26px;height:26px;border-radius:50%;background:#047857;border:2px solid #0f172a;cursor:pointer"></button>' +
          '</div>' +
          '<div style="display:flex;gap:6px">' +
            '<button type="button" class="hp-tab" data-hp-bg="grid">&#128208; Grid</button>' +
            '<button type="button" class="hp-tab" data-hp-bg="axes">&#129517; 4-Quad Axes</button>' +
            '<button type="button" class="hp-tab" data-hp-bg="clear">&#129529; Clear</button>' +
          '</div>' +
        '</div>' +
        '<canvas class="hp-canvas" id="hpCanvas" width="700" height="190"></canvas>' +
      '</div>' +
      '<div class="hp-pane" data-hp-pane="crew" id="hpCrewHost"></div>' +
    '</div>';
  document.body.appendChild(modal);

  function openHolopad(){ modal.classList.add("open"); renderLab(); renderCrew(); initCanvas(); }
  if(document.getElementById("holopadBtn")){
    document.getElementById("holopadBtn").addEventListener("click", openHolopad);
  }
  modal.querySelector("[data-hp-close]").addEventListener("click", function(){ modal.classList.remove("open"); });
  modal.addEventListener("click", function(e){
    if(e.target === modal) modal.classList.remove("open");
    var tb = e.target.closest("[data-hp-tab]");
    if(tb){
      Array.prototype.slice.call(modal.querySelectorAll("[data-hp-tab]")).forEach(function(b){ b.classList.toggle("active", b===tb); });
      Array.prototype.slice.call(modal.querySelectorAll("[data-hp-pane]")).forEach(function(p){ p.classList.toggle("active", p.dataset.hpPane===tb.dataset.hpTab); });
    }
  });

  function renderCrew(){
    var host = document.getElementById("hpCrewHost");
    if(!host || host.dataset.built) return;
    host.dataset.built = "1";
    var castObj = (typeof CAST !== "undefined") ? CAST : {};
    var syms = { maya:"#sym-maya", theo:"#sym-theo", zara:"#sym-zara", dev:"#sym-dev" };
    var roles = {
      maya: "Lead Field Investigator · Models problems visually before computing",
      theo: "Systems Engineer · Verifies unit rates, alignment, and table rules",
      zara: "Tactical Specialist · Tests edge cases and inverse operations",
      dev: "Companion Synthesis Unit · Flags classic math traps before lock-in"
    };
    var html = '<div class="hp-crew-grid">';
    ["maya","theo","zara","dev"].forEach(function(k){
      var c = castObj[k] || { name: k.toUpperCase(), color: "#1d4ed8" };
      html += '<div class="hp-crew-card">' +
        '<div class="hp-crew-av"><svg viewBox="0 0 120 140"><use href="' + syms[k] + '"/></svg></div>' +
        '<div style="font:900 .9rem \'Arial Black\',sans-serif;color:#0f172a">' + c.name + '</div>' +
        '<div style="font:700 .76rem/1.35 \'Segoe UI\',sans-serif;color:#475569;margin-top:4px">' + roles[k] + '</div>' +
      '</div>';
    });
    html += '</div>';
    host.innerHTML = html;
  }

  function renderLab(){
    var host = document.getElementById("hpLabHost");
    if(!host || host.dataset.built) return;
    host.dataset.built = "1";
    var a = 6, b = 4, c = 2;
    host.innerHTML =
      '<div style="font:800 .86rem \'Segoe UI\',sans-serif;color:#0f172a;margin-bottom:6px">' +
        'Adjust quantities <b>A</b>, <b>B</b>, and <b>Scale / Input X</b> below to test Unit ' + unitNum + ' relationships live:' +
      '</div>' +
      '<div id="hpSvgStage"></div>' +
      '<div class="hp-ctrl-row">' +
        '<label>Value A: <input type="range" min="1" max="24" value="6" data-hpa/> <b data-hpa-v>6</b></label>' +
        '<label>Value B: <input type="range" min="1" max="24" value="4" data-hpb/> <b data-hpb-v>4</b></label>' +
        '<label>Multiplier / X: <input type="range" min="-8" max="12" value="2" data-hpc/> <b data-hpc-v>2</b></label>' +
      '</div>' +
      '<div class="hp-readout" id="hpReadout"></div>';

    function update(){
      var stage = document.getElementById("hpSvgStage");
      var ro = document.getElementById("hpReadout");
      var k = Math.max(1, Math.abs(c));
      var w1 = Math.min(280, a * 11), w2 = Math.min(280, b * 11);
      stage.innerHTML =
        '<svg viewBox="0 0 640 110" style="width:100%;height:auto;background:#fff;border:2px solid #0f172a;border-radius:8px">' +
          '<rect x="20" y="18" width="' + w1 + '" height="28" rx="4" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>' +
          '<text x="' + (28 + w1) + '" y="37" font-size="13" font-weight="900" fill="#0f172a">A = ' + a + ' (Scaled ×' + k + ' = ' + (a*k) + ')</text>' +
          '<rect x="20" y="62" width="' + w2 + '" height="28" rx="4" fill="#f2b705" stroke="#0f172a" stroke-width="2"/>' +
          '<text x="' + (28 + w2) + '" y="81" font-size="13" font-weight="900" fill="#0f172a">B = ' + b + ' (Scaled ×' + k + ' = ' + (b*k) + ')</text>' +
        '</svg>';
      var ratioTxt = "Ratio A:B = " + a + ":" + b + " · Unit Rate (A/B) = " + (a/b).toFixed(2);
      var algTxt = "Linear Rule y = A·x + B at x=" + c + " → y = " + (a*c + b);
      var geomTxt = "Rect Area = " + (a*b) + " · Tri Area = " + (0.5*a*b) + " · Prism Vol (×" + k + ") = " + (a*b*k);
      ro.innerHTML =
        '<span><b>Proportional / Fraction:</b> <code>' + ratioTxt + '</code></span>' +
        '<span><b>Algebraic / Linear:</b> <code>' + algTxt + '</code></span>' +
        '<span><b>Geometric:</b> <code>' + geomTxt + '</code></span>';
    }
    ["a","b","c"].forEach(function(k){
      host.querySelector("[data-hp" + k + "]").addEventListener("input", function(e){
        if(k==="a") a = +e.target.value;
        if(k==="b") b = +e.target.value;
        if(k==="c") c = +e.target.value;
        host.querySelector("[data-hp" + k + "-v]").textContent = e.target.value;
        update();
      });
    });
    update();
  }

  function initCanvas(){
    var cv = document.getElementById("hpCanvas");
    if(!cv || cv.dataset.wired) return;
    cv.dataset.wired = "1";
    var ctx = cv.getContext("2d");
    var ink = "#0f172a", drawing = false, lx = 0, ly = 0;
    function bg(mode){
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.save();
      ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 1;
      for(var x=0;x<cv.width;x+=20){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cv.height); ctx.stroke(); }
      for(var y=0;y<cv.height;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cv.width,y); ctx.stroke(); }
      if(mode==="axes"){
        ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cv.width/2,0); ctx.lineTo(cv.width/2,cv.height);
        ctx.moveTo(0,cv.height/2); ctx.lineTo(cv.width,cv.height/2); ctx.stroke();
      }
      ctx.restore();
    }
    bg("grid");
    function pos(e){
      var r = cv.getBoundingClientRect();
      var cx = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
      var cy = e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY;
      return { x: ((cx - r.left)/(r.width||1))*cv.width, y: ((cy - r.top)/(r.height||1))*cv.height };
    }
    cv.addEventListener("mousedown", function(e){ drawing=true; var p=pos(e); lx=p.x; ly=p.y; });
    cv.addEventListener("mousemove", function(e){
      if(!drawing) return;
      var p=pos(e); ctx.strokeStyle=ink; ctx.lineWidth=2.8; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke();
      lx=p.x; ly=p.y;
    });
    window.addEventListener("mouseup", function(){ drawing=false; });
    Array.prototype.slice.call(modal.querySelectorAll("[data-hp-ink]")).forEach(function(b){
      b.addEventListener("click", function(){ ink = b.dataset.hpInk; });
    });
    Array.prototype.slice.call(modal.querySelectorAll("[data-hp-bg]")).forEach(function(b){
      b.addEventListener("click", function(){ bg(b.dataset.hpBg); });
    });
  }
})();
</script>
