<!DOCTYPE html>
<html lang="en" data-textsize="md">
<head>
<meta charset="UTF-8">

<style>
/* ================= AXIOM CITY ENGINE CSS v1.0 — DO NOT FORK ================= */
:root{
  --paper:#F7F4EC; --ink:#24323F; --navy:#17324D; --teal:#1FA6A2; --amber:#F2C15B;
  --coral:#E2674A; --accent:var(--teal);
  --panelborder:3px solid var(--navy);
  --balloonfont:600 1rem/1.32 'Segoe UI',system-ui,-apple-system,sans-serif;
  --capfont:italic 500 .92rem/1.35 Georgia,'Times New Roman',serif;
  --pagew:560px;
}
:root{--accent:var(--amber)} /* VOL 1: amber accent */
html[data-textsize="lg"]{font-size:18px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 120% at 50% 0%,#23425f 0%,#101e2e 55%,#0a1420 100%);color:var(--ink);font:400 16px/1.45 'Segoe UI',system-ui,sans-serif;overflow:hidden}
body.hc{--ink:#000;--paper:#fff}
button{font:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}

/* ---------- COVER SCREEN ---------- */
#cover{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:18px;background:radial-gradient(110% 110% at 50% 10%,#1c3a57 0%,#0a1420 100%);perspective:1400px;overflow:auto}
#coverCard{position:relative;width:min(88vw,520px,calc((100vh - 200px)*0.714));aspect-ratio:5/7;border-radius:10px 18px 18px 10px;box-shadow:0 40px 80px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.5);transform-style:preserve-3d;transition:transform .18s ease-out;background:var(--navy);overflow:hidden}
#coverCard .spine{position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,#0d1f33,#17324D 60%,#244a6e);z-index:5}
#coverCard .spine span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;color:var(--amber);font:900 .72rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.28em}
.cov-layer{position:absolute;inset:0;will-change:transform}
#coverTitle{position:absolute;left:34px;right:18px;top:26px;z-index:6;color:#fff}
#coverTitle .series{font:900 .9rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.4em;color:var(--amber)}
#coverTitle h1{font:900 clamp(2rem,7vw,3.1rem)/0.95 'Arial Black',Arial,sans-serif;text-transform:uppercase;margin-top:8px;text-shadow:4px 4px 0 rgba(0,0,0,.35);color:#fff}
#coverTitle h1 em{font-style:normal;color:var(--accent)}
#coverTitle .vol{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;font:900 .8rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.18em;padding:7px 12px;border-radius:4px;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
#coverBottom{position:absolute;left:34px;right:18px;bottom:18px;z-index:6;display:flex;justify-content:space-between;align-items:flex-end;color:#cfe3ea;font:700 .72rem/1.3 'Segoe UI',sans-serif;letter-spacing:.12em}
#coverActions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.bigbtn{background:var(--amber);color:var(--navy);border:none;border-radius:999px;font:900 1rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.1em;padding:18px 34px;box-shadow:0 6px 0 #b78a2e,0 14px 30px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s}
.bigbtn:hover{transform:translateY(-2px)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b78a2e}
.bigbtn.alt{background:#274a6a;color:#fff;box-shadow:0 6px 0 #122a42,0 14px 30px rgba(0,0,0,.5)}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,rgba(7,14,22,.92),rgba(7,14,22,.65) 70%,transparent);color:#dfe9ef}
#hud .brand{font:900 .78rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.22em;color:var(--amber);white-space:nowrap}
#hud .brand small{display:block;font:700 .56rem/1.4 'Segoe UI',sans-serif;letter-spacing:.18em;color:#9fb7c6}
#progress{display:flex;gap:5px;margin-left:8px;flex-wrap:wrap}
#progress .dot{width:9px;height:9px;border-radius:50%;background:#3a576f;border:1px solid #5b7d99}
#progress .dot.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px var(--accent)}
#badges{display:flex;gap:6px;margin-left:auto}
.badge{width:34px;height:34px;border-radius:50%;background:#1c3a52;border:2px solid #35587a;display:flex;align-items:center;justify-content:center;filter:grayscale(1) brightness(.6);transition:filter .4s,transform .4s}
.badge.earned{filter:none;border-color:var(--amber);background:#234d6b;animation:badgepop .6s cubic-bezier(.2,2,.4,1)}
.badge svg{width:20px;height:20px}
@keyframes badgepop{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.hudbtns{display:flex;gap:6px;margin-left:10px}
.hudbtn{background:#1c3a52;border:1px solid #35587a;color:#dfe9ef;border-radius:8px;min-width:48px;min-height:38px;padding:4px 10px;font:700 .72rem/1.1 'Segoe UI',sans-serif}
.hudbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06222b}
.hudbtn.teacher{background:var(--navy);border-color:#1FA6A2;color:#fff}

/* ---------- BOOK STAGE ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:2200px;padding:64px 12px 56px}
#book{position:relative;width:min(96vw,1180px);height:min(calc(100vh - 130px),780px);transform-style:preserve-3d}
#bookcase{position:absolute;inset:0;border-radius:8px 14px 14px 8px;background:#0e2233;box-shadow:0 50px 90px rgba(0,0,0,.65),0 10px 26px rgba(0,0,0,.5);transform:translateZ(-30px)}
.edges{position:absolute;top:6px;bottom:6px;width:14px;background:repeating-linear-gradient(90deg,#e8e2d2 0 2px,#cfc7b2 2px 3px);border-radius:3px;transition:width .5s}
#edgesL{left:-6px;border-right:1px solid #b8ae97}
#edgesR{right:-6px;border-left:1px solid #b8ae97}
#spreadWrap{position:absolute;inset:0;display:flex;border-radius:6px;overflow:visible}
.page{position:relative;width:50%;height:100%;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.page.left{border-radius:8px 0 0 8px;box-shadow:inset -22px 0 28px -22px rgba(36,50,63,.45)}
.page.right{border-radius:0 8px 8px 0;box-shadow:inset 22px 0 28px -22px rgba(36,50,63,.45)}
#spine3d{position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,.45),rgba(0,0,0,.25));z-index:3}
.page-inner{flex:1;overflow:auto;padding:18px 20px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.pagefoot{flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px;font:700 .66rem/1 'Segoe UI',sans-serif;letter-spacing:.18em;color:#7d8a8f;text-transform:uppercase}
.page .chapterband{flex:none;background:var(--navy);color:#fff;font:900 .72rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.24em;padding:8px 20px;text-transform:uppercase}
.page .chapterband em{color:var(--accent);font-style:normal}
.gatelockcorner{position:absolute;top:8px;right:10px;z-index:5;width:34px;height:34px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.gatelockcorner.open{background:var(--teal)}
.gatelockcorner svg{width:18px;height:18px}

/* turning sheet */
#turnSheet{position:absolute;top:0;bottom:0;right:0;width:50%;z-index:20;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;display:none}
#turnSheet.show{display:block}
#turnSheet .ts{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:var(--paper)}
#turnSheet .ts.front{border-radius:0 8px 8px 0}
#turnSheet .ts.back{transform:rotateY(180deg);border-radius:8px 0 0 8px}
#turnSheet .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.0),rgba(0,0,0,.28));opacity:0;pointer-events:none}
@keyframes turnFwd{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
@keyframes turnBack{0%{transform:rotateY(-180deg)}100%{transform:rotateY(0)}}
#turnSheet.fwd{animation:turnFwd .8s cubic-bezier(.45,.05,.3,1) forwards}
#turnSheet.back{animation:turnBack .8s cubic-bezier(.45,.05,.3,1) forwards}
body.reduced #turnSheet{display:none!important}

/* nav arrows */
.navarrow{position:fixed;top:50%;transform:translateY(-50%);z-index:40;width:54px;height:88px;border:none;border-radius:12px;background:rgba(20,42,62,.8);color:#fff;font-size:1.6rem;display:flex;align-items:center;justify-content:center;transition:background .2s,opacity .2s}
.navarrow:hover{background:var(--accent)}
.navarrow[disabled]{opacity:.25;cursor:not-allowed}
#prevBtn{left:8px}#nextBtn{right:8px}
.navarrow.locked{background:var(--coral)}
@keyframes shake{0%,100%{transform:translateY(-50%)}25%{transform:translateY(-50%) translateX(-6px)}75%{transform:translateY(-50%) translateX(6px)}}
.navarrow.shake{animation:shake .3s 2}

/* ---------- COMIC ART ---------- */
.panelrow{display:flex;gap:10px}
.panelrow>.panel{flex:1}
.panel{position:relative;border:var(--panelborder);border-radius:6px 10px 7px 9px;background:#fff;overflow:hidden;box-shadow:3px 3px 0 rgba(23,50,77,.18)}
.panel.tall{min-height:200px}
.panel svg.scene{display:block;width:100%;height:auto}
.panel3d{transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.panel3d [data-depth]{will-change:transform}
.balloon{position:absolute;max-width:62%;background:#fff;border:3px solid var(--navy);border-radius:14px;padding:8px 12px;font:var(--balloonfont);color:var(--ink);box-shadow:2px 2px 0 rgba(23,50,77,.25);z-index:4}
.balloon .who{display:block;font:900 .58rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:3px}
.balloon::after{content:"";position:absolute;bottom:-14px;left:28px;width:0;height:0;border:9px solid transparent;border-top:14px solid var(--navy)}
.balloon::before{content:"";position:absolute;bottom:-9px;left:31px;width:0;height:0;border:7px solid transparent;border-top:11px solid #fff;z-index:1}
.balloon.tail-r::after{left:auto;right:28px}
.balloon.tail-r::before{left:auto;right:31px}
.balloon.vex{background:#062e33;border-color:var(--teal);color:#c8f5f1;border-radius:10px;font-family:'Consolas','Courier New',monospace;font-weight:500;box-shadow:0 0 12px rgba(31,166,162,.5)}
.balloon.vex .who{color:var(--amber)}
.balloon.vex::after{border-top-color:var(--teal)}
.balloon.vex::before{border-top-color:#062e33}
.balloon.thought{border-radius:30px;border-style:dashed}
.caption{background:#FFF3D8;border:2px solid var(--amber);border-left-width:8px;padding:7px 12px;font:var(--capfont);color:#5a4a22;border-radius:3px}
.caption.loc{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-style:normal;font-family:'Segoe UI',sans-serif;font-size:.74rem}
.sfx{position:absolute;z-index:5;font:900 1.7rem/1 'Arial Black',Arial,sans-serif;color:var(--coral);-webkit-text-stroke:2px var(--navy);text-stroke:2px var(--navy);transform:rotate(-7deg);text-shadow:3px 3px 0 var(--amber);letter-spacing:.04em;pointer-events:none}
.splashtitle{font:900 clamp(1.5rem,3.2vw,2.4rem)/1 'Arial Black',Arial,sans-serif;text-transform:uppercase;color:var(--navy)}
.splashtitle em{color:var(--accent);font-style:normal}
.kicker{font:900 .68rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.3em;color:var(--coral);text-transform:uppercase}

/* ---------- GATES ---------- */
.gatebox{border:4px solid var(--accent);border-radius:12px;background:linear-gradient(180deg,#ffffff,#eef7f6);box-shadow:0 6px 0 rgba(23,50,77,.15);overflow:hidden}
.gatebox header{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;padding:9px 14px}
.gatebox header .gicon{width:30px;height:30px;flex:none}
.gatebox header h3{font:900 .85rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.gatebody{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.gateprompt{font:600 .95rem/1.4 'Segoe UI',sans-serif}
.gatecheck{align-self:flex-start;background:var(--navy);color:#fff;border:none;border-radius:999px;font:900 .82rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.1em;padding:13px 26px;min-height:48px;box-shadow:0 4px 0 #0c1d30}
.gatecheck:active{transform:translateY(2px);box-shadow:0 2px 0 #0c1d30}
.gatefeedback{min-height:1.3em;font:700 .88rem/1.35 'Segoe UI',sans-serif}
.gatefeedback.bad{color:var(--coral)}
.gatefeedback.good{color:#0d7a4f}
.gatehint{background:#FFF3D8;border:2px dashed var(--amber);border-radius:8px;padding:9px 12px;font:600 .86rem/1.4 'Segoe UI',sans-serif;color:#5a4a22}
.gatesolved{display:flex;align-items:center;gap:10px;background:#e2f4ee;border:3px solid #0d7a4f;border-radius:10px;padding:10px 14px;font:900 .8rem/1.3 'Arial Black',Arial,sans-serif;color:#0d7a4f;letter-spacing:.08em}
.stamp{display:inline-block;transform:rotate(-6deg);border:3px solid #0d7a4f;border-radius:6px;padding:3px 8px}
/* gate widgets */
.tokenbank,.beakers{display:flex;gap:8px;flex-wrap:wrap}
.token{width:48px;height:48px;border-radius:50%;border:3px solid var(--navy);background:var(--amber);font:900 .7rem/1 'Arial Black',Arial,sans-serif;color:var(--navy);display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
.token:hover{transform:scale(1.1)}
.token.inA{background:var(--teal);color:#fff}
.token.inB{background:#7db8e8;color:var(--navy)}
.beaker{flex:1;min-width:120px;border:3px solid var(--navy);border-radius:0 0 14px 14px;border-top-style:dashed;padding:8px;min-height:74px;background:rgba(31,166,162,.08)}
.beaker h4{font:900 .62rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.12em;color:var(--navy);text-transform:uppercase;margin-bottom:6px}
.beaker .cnt{font:900 1.2rem/1 'Arial Black',Arial,sans-serif;color:var(--accent)}
.numin{width:96px;min-height:48px;border:3px solid var(--navy);border-radius:8px;font:900 1.05rem/1 'Arial Black',Arial,sans-serif;text-align:center;color:var(--navy);background:#fff;padding:6px}
.numin:focus{border-color:var(--accent)}
.numin.ok{border-color:#0d7a4f;background:#e2f4ee}
.numin.no{border-color:var(--coral);background:#fdebe6}
.rt-table{border-collapse:collapse;width:100%}
.rt-table th,.rt-table td{border:2px solid var(--navy);padding:7px 9px;text-align:center;font:700 .92rem/1.2 'Segoe UI',sans-serif}
.rt-table th{background:var(--navy);color:#fff;font:900 .7rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.08em}
.rt-table td.given{background:#eef7f6;font-weight:800}
.choicebtns{display:flex;gap:10px;flex-wrap:wrap}
.choicebtn{flex:1;min-width:140px;min-height:48px;border:3px solid var(--navy);border-radius:10px;background:#fff;font:700 .9rem/1.3 'Segoe UI',sans-serif;padding:10px 12px;text-align:left;transition:background .15s}
.choicebtn:hover{background:#eef7f6}
.choicebtn[aria-pressed="true"]{background:var(--navy);color:#fff}
.gategrid{touch-action:manipulation}
.gategrid .gp{cursor:pointer}
.unlockflash{animation:unlockflash 1s ease-out}
@keyframes unlockflash{0%{box-shadow:0 0 0 0 rgba(242,193,91,.9)}100%{box-shadow:0 0 0 26px rgba(242,193,91,0)}}

/* ---------- MODALS ---------- */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(5,12,19,.72);padding:16px}
.modal.open{display:flex}
.modalcard{background:var(--paper);border-radius:14px;max-width:780px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.modalcard>header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:12px 18px;z-index:2}
.modalcard>header h2{font:900 1rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.modalcard .x{background:var(--coral);border:none;color:#fff;border-radius:8px;width:40px;height:40px;font:900 1rem/1 Arial}
.modalbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.tt{border-collapse:collapse;width:100%}
.tt th,.tt td{border:2px solid var(--navy);padding:8px 10px;font:600 .85rem/1.35 'Segoe UI',sans-serif;text-align:left;vertical-align:top}
.tt th{background:var(--navy);color:#fff;font:900 .68rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.tt tr:nth-child(even) td{background:#fff}
.workedsteps{display:flex;flex-direction:column;gap:8px}
.workedsteps .st{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--navy);border-radius:8px;padding:9px 12px;font:600 .9rem/1.4 'Segoe UI',sans-serif}
.workedsteps .st b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font:900 .8rem/1 Arial}

/* ---------- END MATTER ---------- */
.castcard{display:flex;gap:12px;align-items:center;border:3px solid var(--navy);border-radius:10px;background:#fff;padding:8px 12px}
.castcard svg{width:64px;height:76px;flex:none}
.castcard h4{font:900 .8rem/1.2 'Arial Black',Arial,sans-serif;color:var(--navy);letter-spacing:.06em}
.castcard p{font:600 .8rem/1.35 'Segoe UI',sans-serif;color:#4c5a66}
.journal{border:3px solid var(--amber);background:#FFFDF4;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.journal h4{font:900 .8rem/1.2 'Arial Black',Arial,sans-serif;color:#8a6a1c;letter-spacing:.14em;text-transform:uppercase}
.journal .jrow{display:flex;gap:10px;align-items:flex-start;font:600 .88rem/1.4 Georgia,serif;color:#4a3d18}
.journal .jrow b{color:var(--navy)}
#certificate{border:6px double var(--navy);border-radius:8px;background:#fff;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px}
#certificate h3{font:900 1.2rem/1.1 'Arial Black',Arial,sans-serif;color:var(--navy);letter-spacing:.1em}
#certName{border:none;border-bottom:3px solid var(--navy);font:900 1.3rem/1.2 Georgia,serif;text-align:center;background:transparent;min-height:48px;width:80%;align-self:center;color:var(--ink)}
.certbadges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.certbadges .badge{filter:none;border-color:var(--amber);background:#fdf6e7}
.certbadges .badge.locked{filter:grayscale(1) opacity(.35)}

/* ---------- MOBILE ---------- */
@media (max-width:820px){
  #book{height:min(calc(100vh - 120px),760px)}
  #spreadWrap .page{width:100%}
  #spreadWrap .page.offscreen{display:none}
  #spine3d,#edgesL{display:none}
  .navarrow{width:44px;height:72px}
  .balloon{max-width:78%}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
/* ---------- PRINT ---------- */
@media print{
  body{overflow:visible;background:#fff}
  body *{visibility:hidden}
  body.print-teacher #teacherModal,body.print-teacher #teacherModal *{visibility:visible}
  body.print-teacher #teacherModal{position:static;display:block;background:#fff;padding:0}
  body.print-teacher #teacherModal .modalcard{max-height:none;box-shadow:none}
  body.print-cert #certificate,body.print-cert #certificate *{visibility:visible}
  body.print-cert #certificate{position:fixed;inset:5% 8%;background:#fff}
  .x,.gatecheck{display:none!important}
}
/* ================= VOL OVERRIDES (Vol 1 · amber accent — contrast fixes) ================= */
.gatebox header{color:var(--navy)}
#coverTitle .vol{color:var(--navy)}
.workedsteps .st b.n{color:var(--navy)}
.balloon .who{color:#8a6a1c}
.balloon.vex .who{color:var(--amber)}
.splashtitle em{color:#b78a2e}
.beaker .cnt{color:#8a6a1c}
.navarrow:hover{color:var(--navy)}
</style>

/* ---------- storage (exact wrapper, ewl_ prefix) ---------- */
const storage={_m:{},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){this._m[k]=v}},get(k,d=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return this._m[k]??d}}};
const K=s=>`ewl_axiom_${VOLUME.slug}_${s}`;

const $=s=>document.querySelector(s);
const live=msg=>{$("#live").textContent=msg};

const prefs=Object.assign({sound:false,motion:true,bigtext:false,hc:false},storage.get(K("prefs"))||{});
let solved=new Set(storage.get(K("gates"))||[]);
let page=storage.get(K("page"))||0;            // index of left/visible page

/* ---------- audio (Web Audio oscillators only, muted default) ---------- */
let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return actx}
function tone(f,t,dur,type="square",vol=.04){const c=ac();if(!c||!prefs.sound)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+dur+.02)}
const SND={blip(){tone(660,0,.07)},flip(){tone(220,0,.09,"triangle",.05);tone(330,.05,.08,"triangle",.04)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.09,.14,"triangle",.05))},thud(){tone(110,0,.18,"sawtooth",.05)}};

/* ---------- helpers ---------- */
function gateLockIcon(open){return `<div class="gatelockcorner ${open?"open":""}" aria-hidden="true"><svg viewBox="0 0 100 100" style="color:#fff"><use href="${open?"#sig-open":"#sig-lock"}"/></svg></div>`}

function pageInnerHTML(i){
  if(i==null||i<0||i>=PAGES.length) return `<div class="page-inner" style="align-items:center;justify-content:center"><div class="kicker" style="opacity:.4">AXIOM CITY</div></div><div class="pagefoot"><span></span><span></span></div>`;
  const p=PAGES[i];
  const gateHTML=p.gate?`<div class="gatemount" data-gate="${p.gate}"></div>`:"";
  const lock=p.gate?gateLockIcon(solved.has(p.gate)):"";
  return `${lock}<div class="chapterband">${p.ch.replace("·","· <em>").concat(p.ch.includes("·")?"</em>":"")}</div><div class="page-inner">${p.html}${gateHTML}</div><div class="pagefoot"><span>${VOLUME.unit}</span><span>PAGE ${i+1} / ${PAGES.length}</span></div>`;
}

/* ---------- gate framework ---------- */
function mountGates(scope){
  scope.querySelectorAll(".gatemount").forEach(m=>{
    const id=m.dataset.gate,G=GATES[id];
    if(!G)return;
    if(solved.has(id)){m.innerHTML=`<div class="gatesolved"><span class="stamp">SOLVED</span> ${G.title} — badge earned.</div>`;return}
    m.innerHTML=`<div class="gatebox"><header><svg class="gicon" viewBox="0 0 100 100"><use href="${G.icon}"/></svg><h3>${G.title}</h3></header>
      <div class="gatebody"><div class="gateprompt">${G.prompt}</div><div class="gwidget"></div>
      <div class="gatehint" hidden></div>
      <button class="gatecheck">CHECK</button>
      <div class="gatefeedback" aria-live="polite"></div></div></div>`;
    const box=m.querySelector(".gatebox"),body=m.querySelector(".gwidget"),fb=m.querySelector(".gatefeedback"),hint=m.querySelector(".gatehint"),btn=m.querySelector(".gatecheck");
    let checker=null;
    const api={
      sound:n=>SND[n]&&SND[n](),
      onCheck(fn){checker=fn},
      fail(msg){
        attempts[id]=(attempts[id]||0)+1;SND.thud();mkfeed(fb,msg,false);
        const n=attempts[id];
        if(n===1){hint.hidden=false;hint.innerHTML="💡 <b>Hint:</b> "+G.hints[0]}
        else if(n===2){hint.hidden=false;hint.innerHTML="🧭 <b>Hint 2:</b> "+G.hints[1]}
        else if(n>=3&&!hint.querySelector(".askvex")){
          const b=document.createElement("button");b.className="gatecheck askvex";b.style.marginTop="8px";b.textContent="ASK VEX — WORKED EXAMPLE";
          b.addEventListener("click",()=>openWorked(G));hint.appendChild(b);
        }
        live("Not yet. "+msg);
      },
      pass(msg){
        solved.add(id);storage.set(K("gates"),[...solved]);SND.win();
        m.innerHTML=`<div class="gatesolved unlockflash"><span class="stamp">SOLVED</span> ${msg}</div>`;
        const corner=m.closest(".page,#pageL,#pageR")?.querySelector(".gatelockcorner");
        if(corner){corner.classList.add("open");corner.innerHTML=`<svg viewBox="0 0 100 100" style="color:#fff"><use href="#sig-open"/></svg>`}
        earnBadge(id);updateNav();live("Gate solved! "+msg);
      }
    };
    G.render(body,api);
    btn.addEventListener("click",()=>{ac();checker&&checker()});
  });
}
function openWorked(G){
  $("#workedBody").innerHTML=`<div class="workedsteps">${G.worked.steps.map((s,i)=>`<div class="st"><b class="n">${i+1}</b><span>${s}</span></div>`).join("")}</div>
    <div class="caption">Your turn — same idea, different numbers:</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font:600 .92rem 'Segoe UI'">${G.worked.q}</span>
    <input class="numin" id="wkin" aria-label="worked example answer"><button class="gatecheck" id="wkgo">CHECK</button></div>
    <div class="gatefeedback" id="wkfb" aria-live="polite"></div>`;
  $("#workedModal").classList.add("open");
  $("#wkgo").addEventListener("click",()=>{
    const v=($("#wkin").value||"").trim().replace(/\s+/g,"");
    if(v===G.worked.a||parseFloat(v)===parseFloat(G.worked.a)){
      mkfeed($("#wkfb"),"Yes! Now head back and open that gate.",true);SND.win();
      setTimeout(()=>$("#workedModal").classList.remove("open"),1100);
    }else{mkfeed($("#wkfb"),"Walk the steps above again — you've got this.",false);SND.thud()}
  });
}

/* ---------- badges ---------- */
function buildBadges(){
  $("#badges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"earned":""}" id="badge-${b.id}" title="${b.label}" role="img" aria-label="${b.label}${solved.has(b.id)?" — earned":" — locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
}
function earnBadge(id){buildBadges();const el=$("#badge-"+id);if(el){el.classList.remove("earned");void el.offsetWidth;el.classList.add("earned")}const b=BADGES.find(x=>x.id===id);if(b)live("Badge earned: "+b.label)}

/* ---------- progress ---------- */
function buildProgress(){$("#progress").innerHTML=PAGES.map((_,i)=>`<span class="dot ${i<=page?"on":""}"></span>`).join("")}

/* ---------- navigation & rendering ---------- */
const isMobile=()=>mobileMQ.matches;
function leftIndex(){return isMobile()?page:page-(page%2)}
function visiblePages(){return isMobile()?[page]:[leftIndex(),leftIndex()+1].filter(i=>i<PAGES.length)}
function blockedBy(){return null/* locks removed: gates still teach via hints + Ask VEX worked examples, but never block turning the page (Neft 2026-06-11) */}

function renderSpread(){
  const L=$("#pageL"),R=$("#pageR");
  if(isMobile()){L.innerHTML=pageInnerHTML(page);L.classList.remove("offscreen");R.classList.add("offscreen");R.innerHTML="";mountGates(L)}
  else{const li=leftIndex();L.innerHTML=pageInnerHTML(li);R.innerHTML=pageInnerHTML(li+1<PAGES.length?li+1:null);L.classList.remove("offscreen");R.classList.remove("offscreen");mountGates(L);mountGates(R)}
  buildProgress();updateNav();updateEdges();
  if(PAGES[page])live(`Page ${page+1} of ${PAGES.length}. ${PAGES[page].ch}.`);
  storage.set(K("page"),page);
  if($("#certName")){$("#certName").value=storage.get(K("name"))||"";$("#certName").addEventListener("input",e=>storage.set(K("name"),e.target.value));
    $("#certBadges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"":"locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
    $("#printCert").addEventListener("click",()=>{document.body.classList.add("print-cert");window.print();setTimeout(()=>document.body.classList.remove("print-cert"),400)});}
}
function updateEdges(){const f=page/Math.max(1,PAGES.length-1);$("#edgesL").style.width=(4+f*12)+"px";$("#edgesR").style.width=(16-f*12)+"px"}
function updateNav(){
  $("#prevBtn").disabled=page<=0||turning;
  const lastVisible=Math.max(...visiblePages());
  const end=lastVisible>=PAGES.length-1;
  const blocked=blockedBy();
  $("#nextBtn").disabled=end||turning;
  $("#nextBtn").classList.toggle("locked",!!blocked&&!end);
  $("#nextBtn").innerHTML=blocked&&!end?"🔒":"›";
  $("#nextBtn").setAttribute("aria-label",blocked?"Locked — solve the gate on this page to continue":"Next page");
}
function step(dir){
  if(turning)return;
  if(dir>0){
    const blocked=blockedBy();
    if(blocked){const G=GATES[blocked];SND.thud();$("#nextBtn").classList.add("shake");setTimeout(()=>$("#nextBtn").classList.remove("shake"),700);
      live("This page is gated. Solve "+G.title+" to continue.");
      const gb=document.querySelector(".gatebox");if(gb){gb.classList.add("unlockflash");setTimeout(()=>gb.classList.remove("unlockflash"),1000)}
      return}
    const lastVisible=Math.max(...visiblePages());
    if(lastVisible>=PAGES.length-1)return;
    const target=isMobile()?page+1:leftIndex()+2;
    animTurn(1,target);
  }else{
    if(page<=0)return;
    const target=isMobile()?page-1:Math.max(0,leftIndex()-2);
    animTurn(-1,target);
  }
}
function animTurn(dir,target){
  if(isMobile()||reducedMQ.matches||!prefs.motion){page=target;renderSpread();SND.flip();return}
  turning=true;SND.flip();
  const sheet=$("#turnSheet"),front=sheet.querySelector(".ts.front"),back=sheet.querySelector(".ts.back");
  const oldL=leftIndex();
  if(dir>0){
    front.innerHTML=pageInnerHTML(oldL+1<PAGES.length?oldL+1:null);
    back.innerHTML=pageInnerHTML(target<PAGES.length?target:null);
    page=target;
    /* underneath: left stays old-left, right becomes new-right */
    $("#pageR").innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    sheet.className="";sheet.classList.add("show","fwd");
  }else{
    front.innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    back.innerHTML=pageInnerHTML(oldL);
    page=target;
    $("#pageL").innerHTML=pageInnerHTML(target);
    sheet.className="";sheet.classList.add("show","back");
  }
  const done=()=>{sheet.classList.remove("show","fwd","back");sheet.removeEventListener("animationend",done);turning=false;renderSpread()};
  sheet.addEventListener("animationend",done);
  setTimeout(()=>{if(turning){done()}},1000);
}

/* ---------- parallax ---------- */
let rafPending=false,px=0,py=0;
function applyParallax(){
  rafPending=false;
  if(!prefs.motion||reducedMQ.matches)return;
  document.querySelectorAll("#spreadWrap .panel3d").forEach(p=>{
    p.style.transform=`rotateY(${px*4}deg) rotateX(${-py*3}deg)`;
    p.querySelectorAll("[data-depth]").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d*.6}px,${py*d*.35}px)`});
  });
}
addEventListener("pointermove",e=>{
  px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2;
  if(!rafPending){rafPending=true;requestAnimationFrame(applyParallax)}
  const cc=$("#coverCard");
  if(cc&&!$("#cover").hidden&&prefs.motion&&!reducedMQ.matches){
    cc.style.transform=`rotateY(${px*9}deg) rotateX(${-py*7}deg)`;
    cc.querySelectorAll(".cov-layer").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d}px,${py*d*.6}px)`});
  }
},{passive:true});

/* note: SVG <g data-depth> transform via style works in modern browsers (SVG2). Wrapped above for safety. */

/* ---------- HUD toggles ---------- */
function syncToggles(){
  $("#sndBtn").setAttribute("aria-pressed",prefs.sound);$("#sndBtn").textContent=prefs.sound?"🔊 Sound":"🔇 Sound";
  $("#motBtn").setAttribute("aria-pressed",prefs.motion);$("#motBtn").textContent=prefs.motion?"3D On":"3D Off";
  $("#txtBtn").setAttribute("aria-pressed",prefs.bigtext);document.documentElement.dataset.textsize=prefs.bigtext?"lg":"md";
  $("#hcBtn").setAttribute("aria-pressed",prefs.hc);document.body.classList.toggle("hc",prefs.hc);
  if(!prefs.motion)document.querySelectorAll(".panel3d").forEach(p=>p.style.transform="");
  storage.set(K("prefs"),prefs);
}
$("#sndBtn").addEventListener("click",()=>{prefs.sound=!prefs.sound;ac();syncToggles();SND.blip()});
$("#motBtn").addEventListener("click",()=>{prefs.motion=!prefs.motion;syncToggles()});
$("#txtBtn").addEventListener("click",()=>{prefs.bigtext=!prefs.bigtext;syncToggles()});
$("#hcBtn").addEventListener("click",()=>{prefs.hc=!prefs.hc;syncToggles()});

/* ---------- teacher panel ---------- */
function buildTeacher(){
  $("#teacherBody").innerHTML=`
    <p style="font:600 .9rem/1.45 'Segoe UI'">${VOLUME.unit} — interactive graphic novel. Story pauses at six <b>reader gates</b>; students must solve grade-level math problems to continue. Progress, badges, and settings persist per device.</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">SUGGESTED USE</h3>
    <p style="font:600 .88rem/1.45 'Segoe UI'">${TEACHER.suggested}</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">STANDARDS ALIGNMENT (CCSS)</h3>
    <table class="tt"><tr><th>Standard</th><th>Description</th><th>Where</th></tr>
    ${TEACHER.standards.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">ANSWER KEY</h3>
    <table class="tt"><tr><th>Gate</th><th>Answer &amp; notes</th></tr>
    ${TEACHER.answers.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</table>
    <p style="font:600 .8rem/1.4 'Segoe UI';color:#666">Hints escalate: conceptual → procedural → VEX worked example (parallel problem; never reveals the gate answer). Sound is off by default. 3D motion can be disabled (auto-disabled for reduced-motion users). © EduWonderLab — single-file, offline-safe, no data leaves the device.</p>`;
}
$("#teacherBtn").addEventListener("click",()=>{buildTeacher();$("#teacherModal").classList.add("open")});
$("#printTeacher").addEventListener("click",()=>{document.body.classList.add("print-teacher");window.print();setTimeout(()=>document.body.classList.remove("print-teacher"),400)});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest(".modal").classList.remove("open")));

/* ---------- input ---------- */
$("#nextBtn").addEventListener("click",()=>{ac();step(1)});
$("#prevBtn").addEventListener("click",()=>{ac();step(-1)});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){$("#teacherModal").classList.remove("open");return}
  if($(".modal.open"))return;
  if(["ArrowRight","PageDown"].includes(e.key))step(1);
  if(["ArrowLeft","PageUp"].includes(e.key))step(-1);
});
let tx=null;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60&&!$(".modal.open"))step(dx<0?1:-1);tx=null},{passive:true});
mobileMQ.addEventListener("change",()=>renderSpread());

/* ---------- boot ---------- */
function openBook(){
  $("#cover").hidden=true;$("#hud").hidden=false;$("#stage").hidden=false;
  $("#prevBtn").hidden=false;$("#nextBtn").hidden=false;
  renderSpread();
}
$("#startBtn").addEventListener("click",()=>{ac();page=0;openBook()});
$("#resumeBtn").addEventListener("click",()=>{ac();openBook()});
if((storage.get(K("page"))||0)>0||solved.size>0){$("#resumeBtn").hidden=false}
if(reducedMQ.matches){prefs.motion=false}
document.body.classList.toggle("reduced",reducedMQ.matches);
buildBadges();syncToggles();buildProgress();
</script>

problema: un número con un significado, como 540 metros.","visual":"540 meters — the number 540 AND what it measures.","img":"/assets/vocab-images/quantity.svg","lesson":"1-2"},{"term":"relationship","termEs":"relación","definition":"How two quantities compare or connect to each other.","definitionEs":"Cómo se comparan o se conectan dos cantidades entre sí.","visual":"1 hour → 48 km, 2 hours → 96 km: as one grows, so does the other.","img":"/assets/vocab-images/relationship.svg","lesson":"1-2"},{"term":"strategy","termEs":"estrategia","definition":"A plan for how to solve a problem before you start computing.","definitionEs":"Un plan para resolver un problema antes de empezar a calcular.","visual":"“I will draw a tape diagram first, then divide” — chosen before computing.","img":"/assets/vocab-images/strategy.svg","lesson":"1-2"},{"term":"reasonable","termEs":"razonable","definition":"A solution that makes sense in the context of the problem.","definitionEs":"Una solución que tiene sentido en el contexto del problema.","visual":"5/6 of 540 must be under 540, so 450 is reasonable and 650 is not.","img":"/assets/vocab-images/reasonable.svg","lesson":"1-2"},{"term":"persevere","termEs":"perseverar","definition":"To keep working on a problem, checking your progress and adjusting your plan when you get stuck.","definitionEs":"Seguir trabajando en un problema, revisando tu progreso y ajustando tu plan cuando te atascas.","visual":"Stuck on the tram problem → try a tape diagram instead → keep going.","img":"/assets/vocab-images/persevere.svg","lesson":"1-2"},{"term":"representation","termEs":"representación","definition":"A picture, diagram, table, or equation that shows the mathematics in a situation.","definitionEs":"Un dibujo, diagrama, tabla o ecuación que muestra las matemáticas de una situación.","visual":"The same 12 shown three ways: a tape diagram, a table, and 3 × 4.","img":"/assets/vocab-images/representation.svg","lesson":"1-3"},{"term":"tape diagram","termEs":"diagrama de cintas","definition":"A rectangle cut into equal parts that helps you visualize how a total breaks apart.","definitionEs":"Un rectángulo dividido en partes iguales que te ayuda a visualizar cómo se separa un total.","visual":"One bar of 4,000 passengers cut into equal groups of 80.","img":"/assets/vocab-images/bar-model.svg","lesson":"1-3"},{"term":"tool","termEs":"herramienta","definition":"Anything you choose to help you see relationships and solve a problem — a table, a diagram, a graph.","definitionEs":"Cualquier cosa que eliges para ver relaciones y resolver un problema: una tabla, un diagrama, una gráfica.","visual":"A table, a number line, or a tape diagram — whichever shows the relationship.","img":"/assets/vocab-images/tool.svg","lesson":"1-3"},{"term":"ordered pair","termEs":"par ordenado","definition":"Two numbers that go together, like a time and a number of trips, that you can plot as a point.","definitionEs":"Dos números que van juntos, como un tiempo y un número de viajes, que puedes graficar como un punto.","visual":"(4, 60): 4 hours costs $60 — the hours always come first.","img":"/assets/vocab-images/ordered-pair.svg","lesson":"1-3"},{"term":"round trip","termEs":"viaje de ida y vuelta","definition":"A complete journey from the start, to the destination, and back to the start.","definitionEs":"Un recorrido completo desde el inicio hasta el destino y de regreso al inicio.","visual":"5 miles out plus 5 miles back = 10 miles in all.","img":"/assets/vocab-images/round-trip.svg","lesson":"1-3"},{"term":"argument","termEs":"argumento","definition":"A chain of reasons — equations, drawings, or words — used to defend your thinking.","definitionEs":"Una cadena de razones — ecuaciones, dibujos o palabras — que usas para defender tu pensamiento.","visual":"“Two jumbo boxes hold more, because 400 × 2 = 800 > 720.”","img":"/assets/vocab-images/argument.svg","lesson":"1-4"},{"term":"conjecture","termEs":"conjetura","definition":"A mathematical statement you believe is true but have not yet proven.","definitionEs":"Una afirmación matemática que crees verdadera pero que aún no has probado.","visual":"“A bigger box ALWAYS holds more cereal” — believed, not yet proven.","img":"/assets/vocab-images/conjecture.svg","lesson":"1-4"},{"term":"counterexample","termEs":"contraejemplo","definition":"A single example that shows a statement is not always true.","definitionEs":"Un solo ejemplo que muestra que una afirmación no siempre es verdadera.","visual":"One jumbo box sold half full of air breaks “bigger always holds more”.","img":"/assets/vocab-images/counterexample.svg","lesson":"1-4"},{"term":"volume","termEs":"volumen","definition":"The amount of space a solid figure takes up, measured in cubic units.","definitionEs":"La cantidad de espacio que ocupa una figura sólida, medida en unidades cúbicas.","visual":"8 in × 3 in × 10 in = 240 cubic inches of cereal space.","img":"/assets/vocab-images/volume.svg","lesson":"1-4"},{"term":"cubic unit","termEs":"unidad cúbica","definition":"A cube with edges 1 unit long — the unit used to measure volume.","definitionEs":"Un cubo cuyas aristas miden 1 unidad — la unidad que se usa para medir el volumen.","visual":"One cube, 1 unit on every edge — the block volume is counted in.","img":"/assets/vocab-images/cubic-units.svg","lesson":"1-4"},{"term":"pattern","termEs":"patrón","definition":"Something that repeats or changes in a predictable way.","definitionEs":"Algo que se repite o cambia de una manera predecible.","visual":"1, 3, 7, 15, 31 — each tower's steps follow a predictable jump.","img":"/assets/vocab-images/pattern.svg","lesson":"1-5"},{"term":"pattern rule","termEs":"regla del patrón","definition":"The instruction that tells how to get from one number in a pattern to the next.","definitionEs":"La instrucción que dice cómo pasar de un número del patrón al siguiente.","visual":"2, 4, 6, 8 … the rule is “+ 2 every time”.","img":"/assets/vocab-images/pattern-rule.svg","lesson":"1-5"},{"term":"generalization","termEs":"generalización","definition":"A statement that is true for a whole pattern, made by noticing repeated calculations.","definitionEs":"Una afirmación verdadera para todo un patrón, hecha al notar cálculos repetidos.","visual":"1 → 3, 2 → 5, 3 → 7 … so n → 2n + 1, for ANY n.","img":"/assets/vocab-images/generalization.svg","lesson":"1-5"},{"term":"table of values","termEs":"tabla de valores","definition":"A table that lists each step of a pattern so you can check that a solution is reasonable.","definitionEs":"Una tabla que muestra cada paso de un patrón para comprobar que una solución es razonable.","visual":"discs 1, 2, 3 beside steps 1, 3, 7 — one row per step.","img":"/assets/vocab-images/table-of-values.svg","lesson":"1-5"},{"term":"reasonableness","termEs":"sensatez del resultado","definition":"Whether an answer makes sense — checked as you work, with adjustments made when needed.","definitionEs":"Si una respuesta tiene sentido — se comprueba mientras trabajas y se ajusta cuando es necesario.","visual":"5/6 of 540 should land BELOW 540, so 650 fails the check.","img":"/assets/vocab-images/reasonableness.svg","lesson":"1-5"},{"term":"make sense of a problem","termEs":"comprender un problema","definition":"To figure out what a problem is asking — what you know, and what you don't know yet.","definitionEs":"Descubrir qué pide un problema: qué sabes y qué no sabes todavía.","visual":"KNOW: 16 wheels, 6 times as many. DON'T KNOW: how many bikes.","role":"concept","img":"/assets/vocab-images/make-sense-of-a-problem.svg","lesson":"1-6"},{"term":"critique","termEs":"criticar constructivamente","definition":"To examine an idea and say what is convincing or not — about the idea, never about the person.","definitionEs":"Examinar una idea y decir qué es convincente o no — sobre la idea, nunca sobre la persona.","visual":"“That step assumes the boxes are full — how do we know?”","img":"/assets/vocab-images/critique.svg","lesson":"1-6"},{"term":"community agreement","termEs":"acuerdo comunitario","definition":"A rule the whole class agrees to so that everyone can learn together.","definitionEs":"Una norma que toda la clase acepta para que todos puedan aprender juntos.","visual":"“We take turns sharing, and we critique ideas, not people.”","img":"/assets/vocab-images/community-agreement.svg","lesson":"1-6"}]</script>
<script type="application/json" id="gn-easy">{"v":1,"map":{"Where it all begins — five chapters, six reader gates. Solve the math to move the story.":"Where it all begins. Five chapters, six reader gates. Solve the math to move the story.","Field day: cancelled. Crew: soaked. My notebook: still dry. Priorities.":"Field day: off. Crew: wet. My notebook: still dry. Good.","I'm Theo. I said it would rain. I had charts.":"I'm Theo. I said it would rain. I had \u003cb>charts\u003c/b>.","Axiom City — a coastal city built on math by a vanished genius named Ada Vex. Meet Maya, Theo, Zara, and Dev. You're the fifth.":"Axiom City is a city by the sea. A genius named Ada Vex built it with math. She is gone. Meet Maya, Theo, Zara, and Dev. You're the fifth.","That dome! The door's propped open — GO GO GO!":"That dome! The door is open. GO GO GO!","Vexhall Observatory? Sealed since forever. Five stars for spooky.":"Vexhall's star tower? Shut for ages. Five stars for spooky.","I'm Maya — that's Theo, Zara, and Dev. We come in peace. And puddles.":"I'm Maya. That's Theo, Zara, and Dev. We come in peace. And puddles.","I know. Librarians know everything. Ms. Ortiz — welcome to Vexhall.":"I know. Book keepers know it all. Ms. Ortiz. Welcome to Vexhall.","Vexhall Observatory — built by Ada Vex, the mathematician-architect who designed half of Axiom City. Then she vanished.":"Vexhall's star tower. \u003cb>Ada Vex\u003c/b> built it. She was a math builder. She planned half of Axiom City. Then she was gone.","Inside: brass, dust, and ten thousand books.":"Inside: brass, dust, and ten thousand books.","Ada Vex's last journal. Sealed sixty years. The clasp only opens for the right fraction.":"Ada Vex's last journal. Shut for sixty years. The clasp only opens for the right fraction.","Three engravings — and one instruction: \"FEED ME THE ONE BELOW ONE-HALF.\"":"Three carvings. One order: \u003cb>\"FEED ME THE ONE BELOW ONE-HALF.\"\u003c/b>","Use a benchmark — test each fraction against 1/2: is the top number more or less than half the bottom?":"Use a \u003cb>benchmark\u003c/b>. Test each fraction against 1/2. Is the top under half the bottom? Or over?","Uh… did the lamps just blink three times, then nine, then twenty-seven?":"Uh… did the lamps just blink? Three times. Then nine. Then twenty-seven?","A benchmark is a friendly reference number — like 1/2 — that you measure other numbers against.":"A \u003cb>benchmark\u003c/b> is a nice round number, like 1/2. Test other numbers on it.","Reader — you're the fifth crew member now. Feed the clasp the right fraction.":"Reader, you're the fifth crew member now. Feed the clasp the right fraction.","The clasp offers 3/8, 5/9, 7/12 and demands the one below one-half. Then it double-checks your reasoning. Tap one answer in each row.":"The clasp shows \u003cb>3/8, 5/9, 7/12\u003c/b>. It wants \u003cb>the one below one-half\u003c/b>. Then it checks your thinking. Tap one answer in each row.","Conceptual: compare each fraction to the benchmark 1/2. A fraction is less than 1/2 when its numerator is smaller than HALF its denominator.":"Conceptual: compare each fraction to the benchmark 1/2. Is its numerator smaller than HALF its denominator? Then the fraction is less than 1/2.","Procedural: half of 8 is 4. Half of 9 is 4.5. Half of 12 is 6. Compare each numerator to that half. For Clasp B, find how far 5/9 is from 1/2 and from 1.":"Procedural: half of 8 is 4. Half of 9 is 4.5. Half of 12 is 6. Compare each numerator to that half. For Clasp B, how far is 5/9 from 1/2? How far from 1?","Beneath the reading room. The journal's map points DOWN.":"Under the reading room. The journal's map points DOWN.","A door with a combination. Ada didn't trust keys, I guess.":"A door with a code lock. I guess Ada didn't trust keys.","Decimal dials. Easy to wreck if you don't respect place value.":"Decimal dials. Easy to wreck if you ignore place value.","Write 3.6 as 3.60 — give it a hundredths digit. Tenths add with tenths, hundredths with hundredths.":"Write 3.6 as 3.60. Give it a hundredths digit. Tenths add with tenths. Hundredths add with hundredths.","The door is humming. Doors should NOT hum.":"The door is humming. Doors should NOT hum.","A decimal names part of a whole by place value: 3.6 means 3 ones and 6 tenths — the same value as 3.60.":"A \u003cb>decimal\u003c/b> names part of a whole. It uses place value. 3.6 means 3 ones and 6 tenths. It equals 3.60.","Dial carefully, reader. This door has opinions.":"Dial with care, reader. This door has opinions.","Two decimal dials, one rule: \"Sum, then difference.\" Compute 3.6 + 2.85 and 12.5 − 4.75 to open the door.":"Two decimal dials, one rule: \u003cb>\"Sum, then difference.\"\u003c/b> Find \u003cb>3.6 + 2.85\u003c/b> and \u003cb>12.5 − 4.75\u003c/b> to open the door.","Conceptual: decimals add and subtract like whole numbers IF every digit sits in its place-value column. Give 3.6 a hundredths digit: 3.60.":"Conceptual: add and subtract decimals like whole numbers. Each digit must sit in its place-value column. Give 3.6 a hundredths digit: 3.60.","Procedural: Dial 1: 3.60 + 2.85 — add hundredths, then tenths, then ones. Dial 2: 12.50 − 4.75 — you'll need to regroup.":"Procedural: Dial 1: 3.60 + 2.85. Add hundredths, then tenths, then ones. Dial 2: 12.50 − 4.75. You will need to regroup.","Past the brass door: a corridor of glowing floor tiles.":"Past the brass door: a hall of glowing floor tiles.","It's a level select! Every path is a sequence — an ordered list with a RULE.":"It's a level select! Each path is a \u003cb>sequence\u003c/b>. It is a list in order. It has a RULE.","And the ceiling counts in squares. Ada hid math in the architecture.":"And the ceiling counts in squares. Ada hid math in the building.","2 to 6 could be +4… but 6 to 18 isn't +4. When adding fails, test multiplying.":"2 to 6 could be +4. But 6 to 18 isn't +4. When adding fails, try \u003cb>multiplying\u003c/b>.","A sequence follows a rule from term to term. Test your rule on EVERY pair of neighbors — one miss means wrong rule. From somewhere below, a static whisper: \"…w-wake…\"":"A \u003cb>sequence\u003c/b> follows a rule from term to term. Test your rule on EVERY pair side by side. One miss means the rule is wrong. \u003ci>From down below, a soft voice: \"…w-wake…\"\u003c/i>","Reader, call the next numbers — wrong step, glitter trap. Probably.":"Reader, call the next numbers. A wrong step is a glitter trap. Probably.","Two paths, two rules. Light the next number in each sequence: the floor tiles read 2, 6, 18, 54, __ and the ceiling stars read 1, 4, 9, 16, __.":"Two paths, two rules. Light the next number in each sequence. The floor tiles read \u003cb>2, 6, 18, 54, __\u003c/b>. The ceiling stars read \u003cb>1, 4, 9, 16, __\u003c/b>.","Conceptual: a rule can multiply, not just add. Whatever move you choose must work between EVERY pair of neighbors.":"Conceptual: a rule can multiply, not just add. Your move must work between EVERY pair of neighbors.","Procedural: Tiles — 6 ÷ 2 = 3 and 18 ÷ 6 = 3, so apply that same multiplier after 54. Stars — 1 = 1×1, 4 = 2×2, 9 = 3×3, 16 = 4×4… what's 5th?":"Procedural: Tiles: 6 ÷ 2 = 3 and 18 ÷ 6 = 3. So use that same multiplier after 54. Stars: 1 = 1×1, 4 = 2×2, 9 = 3×3, 16 = 4×4… what is the 5th?","h-hello. crew detected. i am VEX — fragment of the P-Pattern Engine. power: low. manners: loading.":"Hello. Crew found. I am VEX. I am part of the Pattern Engine. Power: low. Manners: loading.","It's a sealed puzzle box — built from unit cubes. 4 long, 3 wide, 2 tall.":"It's a sealed puzzle box made of unit cubes. 4 long, 3 wide, 2 tall.","Builder's shortcut: count one full layer of cubes, then stack the layers.":"Builder's shortcut: count one full layer of cubes. Then stack the layers.","Ada's journal says her key sleeps inside that box. Sixty years — and tonight it blinks awake.":"Ada's notes say her key sleeps in that box. Sixty years. And tonight it blinks awake.","Volume is the space inside a solid, measured in cubic units — cubes 1 unit long on every edge.":"\u003cb>Volume\u003c/b> is the space inside a solid. We count it in \u003cb>cubic units\u003c/b>. Each cube is 1 unit on each edge.","Reader — how many cubes fill the box? Crack it open.":"Reader, how many cubes fill the box? Crack it open.","The sealed box is built from unit cubes: 4 long, 3 wide, 2 tall. Count its volume the builder's way — one layer, then the stack.":"The sealed box is made of unit cubes: \u003cb>4 long, 3 wide, 2 tall\u003c/b>. Find its volume the builder's way: one layer, then the stack.","Cubes in ONE layer (4 × 3):":"Cubes in ONE layer (4 × 3):","Conceptual: volume counts the unit cubes that FILL the box. Find how many cubes make one full layer, then how many layers stack up.":"Conceptual: volume counts the unit cubes that FILL the box. Find how many cubes make one full layer. Then find how many layers stack up.","Procedural: the bottom layer is 4 rows of 3 cubes — multiply. The box is 2 layers tall — multiply again.":"Procedural: the bottom layer is 4 rows of 3 cubes. Multiply. The box is 2 layers tall. Multiply again.","Inside the box: a brass key. Below the observatory: a door that was waiting for it.":"Inside the box: a brass key. Under the star tower: a door. It was waiting for the key.","the engine ring counts in TWO rules. ada's favorite: add five… then d-double.":"The ring counts with TWO rules. Ada's best one: add five… then double.","3, 8, 16, 21, 42, 47 — and the ring stops where the next numbers should glow.":"3, 8, 16, 21, 42, 47. Then the ring stops. The next numbers should glow there.","Two-rule patterns. Sneaky. I respect it.":"Two-rule patterns. Sneaky. I like it.","Key fits. The ring's waiting on you, reader.":"Key fits. The ring waits for you, reader.","Some patterns alternate two rules. Keep the order: +5, then ×2, then +5 again…":"Some patterns use \u003cb>two rules\u003c/b> in turns. Keep the order: +5, then ×2, then +5 again…","Light the last two numbers on the ring, reader!":"Light the last two numbers on the ring, reader!","The ring alternates TWO rules — +5, then ×2 — and reads 3, 8, 16, 21, 42, 47, __, __. Light the next two numbers.":"The ring uses TWO rules in turns: \u003cb>+5, then ×2\u003c/b>. It reads \u003cb>3, 8, 16, 21, 42, 47, __, __\u003c/b>. Light the next two numbers.","Conceptual: two rules take turns. Track which rule was used LAST — the other one goes next.":"Conceptual: two rules take turns. Find which rule was used LAST. The other one goes next.","Procedural: 3→8 is +5. 8→16 is ×2. 16→21 is +5 again. The step into 47 was +5… so which rule takes the next turn, and which one after that?":"Procedural: 3→8 is +5. 8→16 is ×2. 16→21 is +5 again. The step into 47 was +5. So which rule goes next? And which one after that?","The engine core. Three locks. Power at two percent.":"The engine core. Three locks. Power at two percent.","three locks: one p-pattern, one decimal, one fraction. solve all three and i can finally W-WAKE.":"Three locks: one pattern, one decimal, one fraction. Solve all three and I can finally WAKE.","Everyone takes their strength. Reader — you take the math.":"Everyone use your strength. Reader, you take the math.","Pattern lock: my kind of level.":"Pattern lock: my kind of level.","Boss Gate: use everything from this volume — patterns, decimals, and the 1/2 benchmark.":"Boss Gate: use all you learned in this volume. Patterns, decimals, and the 1/2 benchmark.","BOSS GATE. three locks. p-power at one percent. accuracy over speed, reader.":"BOSS GATE. Three locks. Power at one percent. Be right, not fast, reader.","Three locks stand between the crew and VEX. Lock 1: the engine ring runs 4, 12, 36, 108, __. Lock 2: the power feed needs 5.75 + 3.5. Lock 3: pick the fraction greater than 1/2.":"Three locks stand between the crew and VEX. \u003cb>Lock 1\u003c/b>: the engine ring runs \u003cb>4, 12, 36, 108, __\u003c/b>. \u003cb>Lock 2\u003c/b>: the power feed needs \u003cb>5.75 + 3.5\u003c/b>. \u003cb>Lock 3\u003c/b>: pick the fraction \u003cb>greater than 1/2\u003c/b>.","Conceptual: three skills, one console — find the multiplying rule; line up decimal place values; test each fraction against the 1/2 benchmark.":"Conceptual: three skills, one console. Find the multiplying rule. Line up decimal place values. Test each fraction against the 1/2 benchmark.","Procedural: Lock 1: 12 ÷ 4 = 3, so multiply 108 by that same factor. Lock 2: write 3.5 as 3.50, then add by place. Lock 3: half of each denominator is 4.5, 6, and 5 — compare numerators.":"Procedural: Lock 1: 12 ÷ 4 = 3, so multiply 108 by that same factor. Lock 2: write 3.5 as 3.50, then add by place. Lock 3: half of each denominator is 4.5, 6, and 5. Compare numerators.","Systems ONLINE. Hello, crew. I am VEX. Ada Vex left me listening for minds like yours.":"Systems ONLINE. Hello, crew. I am VEX. Ada Vex left me listening for minds like yours.","Minds like ours?":"Minds like \u003ci>ours\u003c/i>?","A question-asker. An evidence-checker. A builder. A pattern-hunter. And a reader who does the math — I sense distortions, but I cannot compute. That part is you.":"One asks questions. One checks proof. One builds. One hunts patterns. And a reader who does the math. I sense problems, but I cannot do math. That part is you.","new distortion already. it smells like… crooked data. to be continued…":"A new problem now. It smells like… bad data. To be continued…","Crew captain. Keeps the notebook, asks the next question. This volume: benchmarked the clasp fractions against 1/2.":"Crew captain. Keeps the notebook, asks the next question. This volume: tested the clasp fractions against 1/2.","Evidence officer. Charts for every occasion. This volume: dialed open the decimal door, place value intact.":"Proof keeper. Charts for each job. This volume: opened the decimal door. Place value kept.","Builder and fixer. This volume: unpacked the puzzle box layer by layer — 24 cubic units of patience.":"Builder and fixer. This volume: opened the box one layer at a time. 24 cubic units of hard work.","Pattern hunter with a gamer brain. This volume: beat the Hall of Sequences without a single glitter trap.":"Pattern hunter with a gamer brain. This volume: beat the Hall of Sequences with no glitter traps.","Fragment of Ada Vex's Pattern Engine — newly awake. Senses distortions; cannot compute. That's your job.":"A part of Ada Vex's Pattern Engine. Now awake. It senses problems. It cannot do math. That's your job.","Vexhall's librarian and caretaker. Keeper of Ada's journals — and now of four loud kids and one glowing polyhedron.":"Vexhall's book keeper. She keeps Ada's notes. Now she keeps four loud kids too. And one glowing shape.","Benchmark.Compare a fraction to a friendly number like 1/2: test the numerator against half the denominator. 3/8 sits below 1/2; 5/9 floats just above it.":"\u003cb>Benchmark.\u003c/b>\u003cspan>Compare a fraction to an easy number like 1/2. Test the numerator against half the denominator. 3/8 is below 1/2. 5/9 is just above it.\u003c/span>","Decimals.Line up place values, not end digits: 3.6 + 2.85 = 6.45 and 12.5 − 4.75 = 7.75.":"\u003cb>Decimals.\u003c/b>\u003cspan>Line up place values, not the last digits: 3.6 + 2.85 = 6.45 and 12.5 − 4.75 = 7.75.\u003c/span>","Sequence.An ordered list with a rule — test it on every pair. 2, 6, 18, 54 multiplies by 3 → 162. 1, 4, 9, 16 are the squares → 25.":"\u003cb>Sequence.\u003c/b>\u003cspan>A list in order with a rule. Test it on every pair. 2, 6, 18, 54 multiplies by 3 → 162. 1, 4, 9, 16 are the squares → 25.\u003c/span>","Volume.Cubes that fill a box: one layer (4 × 3 = 12) times the layers (× 2) = 24 cubic units.":"\u003cb>Volume.\u003c/b>\u003cspan>Cubes that fill a box: one layer (4 × 3 = 12) times the layers (× 2) = 24 cubic units.\u003c/span>","Two-rule pattern.Rules can take turns. With +5 then ×2, the ring runs 3, 8, 16, 21, 42, 47, 94, 99.":"\u003cb>Two-rule pattern.\u003c/b>\u003cspan>Rules can take turns. With +5 then ×2, the ring runs 3, 8, 16, 21, 42, 47, 94, 99.\u003c/span>","\"Patterns are the city's heartbeat. Learn to count it, and the city will talk to you.\" — A.V.":"\"Patterns are the city's heartbeat. Learn to count it. Then the city will talk to you.\" — A.V.","completed Volume 1: The Pattern Engine and proved mastery over benchmark fractions, decimal computation, number patterns, two-rule sequences, and volume.":"finished \u003cb>Volume 1: The Pattern Engine\u003c/b>. Can do benchmark fractions. Can do decimal math. Can do number patterns. Can do two-rule sequences. Can do volume.","Thank you for waking VEX. Volume 2 is waiting at the festival gates.":"Thank you for waking VEX. Volume 2 waits at the fair gates.","A practice clasp offers 2/5 and 4/7, asking for the one below 1/2.":"A practice clasp shows 2/5 and 4/7. It wants the one below 1/2.","Half of 5 is 2.5 — and 2 \u003c 2.5, so 2/5 sits below the benchmark.":"Half of 5 is 2.5. And 2 &lt; 2.5, so 2/5 is below the benchmark.","Half of 7 is 3.5 — and 4 > 3.5, so 4/7 sits above. Feed it 2/5.":"Half of 7 is 3.5. And 4 &gt; 3.5, so 4/7 is above. Feed it 2/5.","Your turn — same idea, different numbers:":"Your turn. Same idea, new numbers:","What numerator makes ?/8 land exactly ON the 1/2 benchmark?":"What numerator puts ?/8 right ON the 1/2 benchmark?","A practice door wants 2.4 + 1.35.":"A practice door wants 2.4 + 1.35.","Write 2.4 as 2.40 so the hundredths line up: 2.40 + 1.35.":"Write 2.4 as 2.40 so the hundredths line up: 2.40 + 1.35.","Add by place: 0+5 hundredths, 4+3 tenths, 2+1 ones → 3.75. The dial turns.":"Add by place: 0+5 hundredths, 4+3 tenths, 2+1 ones → 3.75. The dial turns.","Same practice door, dial 2: 5.2 − 1.45 = ?":"Same practice door, dial 2: 5.2 − 1.45 = ?","A practice corridor glows 3, 6, 12, 24.":"A practice hall glows 3, 6, 12, 24.","Test +3: 6 + 3 = 9, but the tile says 12 — adding fails. Test ×2: 3×2=6 ✓, 6×2=12 ✓, 12×2=24 ✓.":"Test +3: 6 + 3 = 9, but the tile says 12. Adding fails. Test ×2: 3×2=6 ✓, 6×2=12 ✓, 12×2=24 ✓.","Rule found: ×2. So the next tile is 24 × 2 = 48.":"Rule found: ×2. So the next tile is 24 × 2 = 48.","Practice corridor 5, 10, 20, 40 — what's the next tile?":"Practice hall 5, 10, 20, 40. What is the next tile?","A practice box: 5 long, 2 wide, 3 tall.":"A practice box: 5 long, 2 wide, 3 tall.","One layer: 5 × 2 = 10 cubes. The box stacks 3 layers high.":"One layer: 5 × 2 = 10 cubes. The box stacks 3 layers high.","Volume = 10 × 3 = 30 cubic units. Length × width × height — always.":"\u003cspan>Volume = 10 × 3 = 30 cubic units. Length × width × height. Each time.\u003c/span>","Volume of a practice box 2 long, 2 wide, 5 tall?":"Volume of a practice box 2 long, 2 wide, 5 tall?","A practice ring alternates +3, then ×2: it reads 2, 5, 10, 13, 26.":"A practice ring uses +3, then ×2. It reads 2, 5, 10, 13, 26.","Check the turns: 2→5 (+3), 5→10 (×2), 10→13 (+3), 13→26 (×2).":"Check the turns: 2→5 (+3), 5→10 (×2), 10→13 (+3), 13→26 (×2).","The last move was ×2, so +3 goes next: 26 + 3 = 29.":"The last move was ×2, so +3 goes next: 26 + 3 = 29.","That practice ring again — what comes after 29?":"That test ring again. What comes after 29?","Practice console — ring 7, 14, 28: each term doubles, so the next is 56.":"\u003cspan>Test ring: 7, 14, 28. Each term doubles. So the next is 56.\u003c/span>","Power feed 1.2 + 3.45 → line up places: 1.20 + 3.45 = 4.65.":"Power feed 1.2 + 3.45. Line up places: 1.20 + 3.45 = 4.65.","Fraction check 5/8 vs 1/2: half of 8 is 4, and 5 > 4 — so 5/8 is above the benchmark.":"Fraction check 5/8 vs 1/2: half of 8 is 4, and 5 &gt; 4. So 5/8 is above the benchmark.","Practice ring once more: what comes after 56 (rule ×2)?":"Practice ring once more: what comes after 56 (rule ×2)?","Both clasps need a choice — tap one button in each row.":"Both clasps need a choice. Tap one button in each row.","Clasp A stays shut. Test your pick: is its numerator more or less than half its denominator?":"Clasp A stays shut. Test your pick. Is its numerator under half its denominator? Or over?","Clasp B stays shut. 5/9 is only a sliver above 1/2 — measure both distances before you decide.":"Clasp B stays shut. 5/9 is just a bit above 1/2. Check both distances first.","3/8 \u003c 1/2 (3 is less than 4), and 5/9 hugs the 1/2 benchmark. The clasp springs open!":"3/8 &lt; 1/2 (3 is less than 4), and 5/9 is close to the 1/2 benchmark. The clasp opens!","6.45 and 7.75 — the dials clack, the brass door rolls aside!":"6.45 and 7.75. The dials clack. The brass door rolls aside!","A dial sticks. Line up the decimal points — tenths under tenths — then work place by place.":"A dial sticks. Line up the decimal points, tenths under tenths. Then work place by place.","×3 marches on to 162, and the stars are squares: 5 × 5 = 25. The corridor lights your path!":"×3 goes on to 162, and the stars are squares: 5 × 5 = 25. The hall lights your path!","A number stays dark. Test your rule on EVERY pair of neighbors — does it survive all of them?":"A number stays dark. Test your rule on EVERY pair of neighbors. Does it work for all of them?","12 cubes a layer, 2 layers — 24 cubic units. CLICK. The box unfolds like a flower!":"12 cubes in a layer. 2 layers. So 24 cubic units. CLICK. The box opens like a flower!","The box stays shut. Build it in order: count one 4-by-3 layer first, then stack.":"The box stays shut. Build it in order: count one 4-by-3 layer first, then stack.","47 doubles to 94, then +5 makes 99. The ring spins — the engine door grinds open!":"47 doubles to 94, then +5 makes 99. The ring spins. The engine door grinds open!","The ring jams. Trace the moves: which rule carried you INTO 47, and which takes the next turn?":"The ring jams. Trace the moves. Which rule took you INTO 47? Which goes next?","Lock 1 holds. The ring multiplies by the same factor every time — find it with 12 ÷ 4.":"Lock 1 holds. The ring multiplies by the same factor every time. Find it with 12 ÷ 4.","Lock 2 holds. Write 3.5 as 3.50, line up the decimal points, then add.":"Lock 2 holds. Write 3.5 as 3.50, line up the decimal points, then add.","Lock 3 holds. Take half of each denominator — which numerator actually beats it?":"Lock 3 holds. Take half of each denominator. Which numerator is bigger than it?","ALL LOCKS OPEN. Gears catch, rings sing, amber light floods the hall — VEX IS WAKING. Turn the page!":"ALL LOCKS OPEN. Gears catch, rings sing, amber light fills the hall. VEX IS WAKING. Turn the page!","Yes! Now head back and open that gate.":"Yes! Now go back and open that gate.","Walk the steps above again — you've got this.":"Walk the steps above again. You can do it."}}</script>
