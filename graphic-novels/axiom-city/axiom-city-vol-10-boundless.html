<!DOCTYPE html>
<html lang="en" data-textsize="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiom City Vol. 10 — Boundless | Interactive Graphic Novel | Math Is… (Series Finale)</title>
<meta name="description" content="The Axiom City series finale: a Grade 6 capstone graphic novel remixing statistics, ratios, percents, geometry, expressions, and the coordinate plane — plus a reflection on what math is. EduWonderLab.">
<style>
/* ================= AXIOM CITY ENGINE CSS v1.0 — DO NOT FORK ================= */
:root{
  --paper:#F7F4EC; --ink:#24323F; --navy:#17324D; --teal:#1FA6A2; --amber:#F2C15B;
  --coral:#E2674A; --accent:var(--teal);
  --panelborder:3px solid var(--navy);
  --balloonfont:600 1rem/1.32 'Segoe UI',system-ui,-apple-system,sans-serif;
  --capfont:italic 500 .92rem/1.35 Georgia,'Times New Roman',serif;
  --pagew:560px;
}
html[data-textsize="lg"]{font-size:18px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 120% at 50% 0%,#23425f 0%,#101e2e 55%,#0a1420 100%);color:var(--ink);font:400 16px/1.45 'Segoe UI',system-ui,sans-serif;overflow:hidden}
body.hc{--ink:#000;--paper:#fff}
button{font:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}

/* ---------- COVER SCREEN ---------- */
#cover{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:18px;background:radial-gradient(110% 110% at 50% 10%,#1c3a57 0%,#0a1420 100%);perspective:1400px;overflow:auto}
#coverCard{position:relative;width:min(88vw,520px,calc((100vh - 200px)*0.714));aspect-ratio:5/7;border-radius:10px 18px 18px 10px;box-shadow:0 40px 80px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.5);transform-style:preserve-3d;transition:transform .18s ease-out;background:var(--navy);overflow:hidden}
#coverCard .spine{position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,#0d1f33,#17324D 60%,#244a6e);z-index:5}
#coverCard .spine span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;color:var(--amber);font:900 .72rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.28em}
.cov-layer{position:absolute;inset:0;will-change:transform}
#coverTitle{position:absolute;left:34px;right:18px;top:26px;z-index:6;color:#fff}
#coverTitle .series{font:900 .9rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.4em;color:var(--amber)}
#coverTitle h1{font:900 clamp(2rem,7vw,3.1rem)/0.95 'Arial Black',Arial,sans-serif;text-transform:uppercase;margin-top:8px;text-shadow:4px 4px 0 rgba(0,0,0,.35);color:#fff}
#coverTitle h1 em{font-style:normal;color:var(--accent)}
#coverTitle .vol{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;font:900 .8rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.18em;padding:7px 12px;border-radius:4px;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
#coverBottom{position:absolute;left:34px;right:18px;bottom:18px;z-index:6;display:flex;justify-content:space-between;align-items:flex-end;color:#cfe3ea;font:700 .72rem/1.3 'Segoe UI',sans-serif;letter-spacing:.12em}
#coverActions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.bigbtn{background:var(--amber);color:var(--navy);border:none;border-radius:999px;font:900 1rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.1em;padding:18px 34px;box-shadow:0 6px 0 #b78a2e,0 14px 30px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s}
.bigbtn:hover{transform:translateY(-2px)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b78a2e}
.bigbtn.alt{background:#274a6a;color:#fff;box-shadow:0 6px 0 #122a42,0 14px 30px rgba(0,0,0,.5)}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,rgba(7,14,22,.92),rgba(7,14,22,.65) 70%,transparent);color:#dfe9ef}
#hud .brand{font:900 .78rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.22em;color:var(--amber);white-space:nowrap}
#hud .brand small{display:block;font:700 .56rem/1.4 'Segoe UI',sans-serif;letter-spacing:.18em;color:#9fb7c6}
#progress{display:flex;gap:5px;margin-left:8px;flex-wrap:wrap}
#progress .dot{width:9px;height:9px;border-radius:50%;background:#3a576f;border:1px solid #5b7d99}
#progress .dot.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px var(--accent)}
#badges{display:flex;gap:6px;margin-left:auto}
.badge{width:34px;height:34px;border-radius:50%;background:#1c3a52;border:2px solid #35587a;display:flex;align-items:center;justify-content:center;filter:grayscale(1) brightness(.6);transition:filter .4s,transform .4s}
.badge.earned{filter:none;border-color:var(--amber);background:#234d6b;animation:badgepop .6s cubic-bezier(.2,2,.4,1)}
.badge svg{width:20px;height:20px}
@keyframes badgepop{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.hudbtns{display:flex;gap:6px;margin-left:10px}
.hudbtn{background:#1c3a52;border:1px solid #35587a;color:#dfe9ef;border-radius:8px;min-width:48px;min-height:38px;padding:4px 10px;font:700 .72rem/1.1 'Segoe UI',sans-serif}
.hudbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06222b}
.hudbtn.teacher{background:var(--navy);border-color:#1FA6A2;color:#fff}

/* ---------- BOOK STAGE ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:2200px;padding:64px 12px 56px}
#book{position:relative;width:min(96vw,1180px);height:min(calc(100vh - 130px),780px);transform-style:preserve-3d}
#bookcase{position:absolute;inset:0;border-radius:8px 14px 14px 8px;background:#0e2233;box-shadow:0 50px 90px rgba(0,0,0,.65),0 10px 26px rgba(0,0,0,.5);transform:translateZ(-30px)}
.edges{position:absolute;top:6px;bottom:6px;width:14px;background:repeating-linear-gradient(90deg,#e8e2d2 0 2px,#cfc7b2 2px 3px);border-radius:3px;transition:width .5s}
#edgesL{left:-6px;border-right:1px solid #b8ae97}
#edgesR{right:-6px;border-left:1px solid #b8ae97}
#spreadWrap{position:absolute;inset:0;display:flex;border-radius:6px;overflow:visible}
.page{position:relative;width:50%;height:100%;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.page.left{border-radius:8px 0 0 8px;box-shadow:inset -22px 0 28px -22px rgba(36,50,63,.45)}
.page.right{border-radius:0 8px 8px 0;box-shadow:inset 22px 0 28px -22px rgba(36,50,63,.45)}
#spine3d{position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,.45),rgba(0,0,0,.25));z-index:3}
.page-inner{flex:1;overflow:auto;padding:18px 20px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.pagefoot{flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px;font:700 .66rem/1 'Segoe UI',sans-serif;letter-spacing:.18em;color:#7d8a8f;text-transform:uppercase}
.page .chapterband{flex:none;background:var(--navy);color:#fff;font:900 .72rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.24em;padding:8px 20px;text-transform:uppercase}
.page .chapterband em{color:var(--accent);font-style:normal}
.gatelockcorner{position:absolute;top:8px;right:10px;z-index:5;width:34px;height:34px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.gatelockcorner.open{background:var(--teal)}
.gatelockcorner svg{width:18px;height:18px}

/* turning sheet */
#turnSheet{position:absolute;top:0;bottom:0;right:0;width:50%;z-index:20;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;display:none}
#turnSheet.show{display:block}
#turnSheet .ts{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:var(--paper)}
#turnSheet .ts.front{border-radius:0 8px 8px 0}
#turnSheet .ts.back{transform:rotateY(180deg);border-radius:8px 0 0 8px}
#turnSheet .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.0),rgba(0,0,0,.28));opacity:0;pointer-events:none}
@keyframes turnFwd{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
@keyframes turnBack{0%{transform:rotateY(-180deg)}100%{transform:rotateY(0)}}
#turnSheet.fwd{animation:turnFwd .8s cubic-bezier(.45,.05,.3,1) forwards}
#turnSheet.back{animation:turnBack .8s cubic-bezier(.45,.05,.3,1) forwards}
body.reduced #turnSheet{display:none!important}

/* nav arrows */
.navarrow{position:fixed;top:50%;transform:translateY(-50%);z-index:40;width:54px;height:88px;border:none;border-radius:12px;background:rgba(20,42,62,.8);color:#fff;font-size:1.6rem;display:flex;align-items:center;justify-content:center;transition:background .2s,opacity .2s}
.navarrow:hover{background:var(--accent)}
.navarrow[disabled]{opacity:.25;cursor:not-allowed}
#prevBtn{left:8px}#nextBtn{right:8px}
.navarrow.locked{background:var(--coral)}
@keyframes shake{0%,100%{transform:translateY(-50%)}25%{transform:translateY(-50%) translateX(-6px)}75%{transform:translateY(-50%) translateX(6px)}}
.navarrow.shake{animation:shake .3s 2}

/* ---------- COMIC ART ---------- */
.panelrow{display:flex;gap:10px}
.panelrow>.panel{flex:1}
.panel{position:relative;border:var(--panelborder);border-radius:6px 10px 7px 9px;background:#fff;overflow:hidden;box-shadow:3px 3px 0 rgba(23,50,77,.18)}
.panel.tall{min-height:200px}
.panel svg.scene{display:block;width:100%;height:auto}
.panel3d{transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.panel3d [data-depth]{will-change:transform}
.balloon{position:absolute;max-width:62%;background:#fff;border:3px solid var(--navy);border-radius:14px;padding:8px 12px;font:var(--balloonfont);color:var(--ink);box-shadow:2px 2px 0 rgba(23,50,77,.25);z-index:4}
.balloon .who{display:block;font:900 .58rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:3px}
.balloon::after{content:"";position:absolute;bottom:-14px;left:28px;width:0;height:0;border:9px solid transparent;border-top:14px solid var(--navy)}
.balloon::before{content:"";position:absolute;bottom:-9px;left:31px;width:0;height:0;border:7px solid transparent;border-top:11px solid #fff;z-index:1}
.balloon.tail-r::after{left:auto;right:28px}
.balloon.tail-r::before{left:auto;right:31px}
.balloon.vex{background:#062e33;border-color:var(--teal);color:#c8f5f1;border-radius:10px;font-family:'Consolas','Courier New',monospace;font-weight:500;box-shadow:0 0 12px rgba(31,166,162,.5)}
.balloon.vex .who{color:var(--amber)}
.balloon.vex::after{border-top-color:var(--teal)}
.balloon.vex::before{border-top-color:#062e33}
.balloon.thought{border-radius:30px;border-style:dashed}
.caption{background:#FFF3D8;border:2px solid var(--amber);border-left-width:8px;padding:7px 12px;font:var(--capfont);color:#5a4a22;border-radius:3px}
.caption.loc{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-style:normal;font-family:'Segoe UI',sans-serif;font-size:.74rem}
.sfx{position:absolute;z-index:5;font:900 1.7rem/1 'Arial Black',Arial,sans-serif;color:var(--coral);-webkit-text-stroke:2px var(--navy);text-stroke:2px var(--navy);transform:rotate(-7deg);text-shadow:3px 3px 0 var(--amber);letter-spacing:.04em;pointer-events:none}
.splashtitle{font:900 clamp(1.5rem,3.2vw,2.4rem)/1 'Arial Black',Arial,sans-serif;text-transform:uppercase;color:var(--navy)}
.splashtitle em{color:var(--accent);font-style:normal}
.kicker{font:900 .68rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.3em;color:var(--coral);text-transform:uppercase}

/* ---------- GATES ---------- */
.gatebox{border:4px solid var(--accent);border-radius:12px;background:linear-gradient(180deg,#ffffff,#eef7f6);box-shadow:0 6px 0 rgba(23,50,77,.15);overflow:hidden}
.gatebox header{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;padding:9px 14px}
.gatebox header .gicon{width:30px;height:30px;flex:none}
.gatebox header h3{font:900 .85rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.gatebody{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.gateprompt{font:600 .95rem/1.4 'Segoe UI',sans-serif}
.gatecheck{align-self:flex-start;background:var(--navy);color:#fff;border:none;border-radius:999px;font:900 .82rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.1em;padding:13px 26px;min-height:48px;box-shadow:0 4px 0 #0c1d30}
.gatecheck:active{transform:translateY(2px);box-shadow:0 2px 0 #0c1d30}
.gatefeedback{min-height:1.3em;font:700 .88rem/1.35 'Segoe UI',sans-serif}
.gatefeedback.bad{color:var(--coral)}
.gatefeedback.good{color:#0d7a4f}
.gatehint{background:#FFF3D8;border:2px dashed var(--amber);border-radius:8px;padding:9px 12px;font:600 .86rem/1.4 'Segoe UI',sans-serif;color:#5a4a22}
.gatesolved{display:flex;align-items:center;gap:10px;background:#e2f4ee;border:3px solid #0d7a4f;border-radius:10px;padding:10px 14px;font:900 .8rem/1.3 'Arial Black',Arial,sans-serif;color:#0d7a4f;letter-spacing:.08em}
.stamp{display:inline-block;transform:rotate(-6deg);border:3px solid #0d7a4f;border-radius:6px;padding:3px 8px}
/* gate widgets */
.tokenbank,.beakers{display:flex;gap:8px;flex-wrap:wrap}
.token{width:48px;height:48px;border-radius:50%;border:3px solid var(--navy);background:var(--amber);font:900 .7rem/1 'Arial Black',Arial,sans-serif;color:var(--navy);display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
.token:hover{transform:scale(1.1)}
.token.inA{background:var(--teal);color:#fff}
.token.inB{background:#7db8e8;color:var(--navy)}
.beaker{flex:1;min-width:120px;border:3px solid var(--navy);border-radius:0 0 14px 14px;border-top-style:dashed;padding:8px;min-height:74px;background:rgba(31,166,162,.08)}
.beaker h4{font:900 .62rem/1 'Arial Black',Arial,sans-serif;letter-spacing:.12em;color:var(--navy);text-transform:uppercase;margin-bottom:6px}
.beaker .cnt{font:900 1.2rem/1 'Arial Black',Arial,sans-serif;color:var(--accent)}
.numin{width:96px;min-height:48px;border:3px solid var(--navy);border-radius:8px;font:900 1.05rem/1 'Arial Black',Arial,sans-serif;text-align:center;color:var(--navy);background:#fff;padding:6px}
.numin:focus{border-color:var(--accent)}
.numin.ok{border-color:#0d7a4f;background:#e2f4ee}
.numin.no{border-color:var(--coral);background:#fdebe6}
.rt-table{border-collapse:collapse;width:100%}
.rt-table th,.rt-table td{border:2px solid var(--navy);padding:7px 9px;text-align:center;font:700 .92rem/1.2 'Segoe UI',sans-serif}
.rt-table th{background:var(--navy);color:#fff;font:900 .7rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.08em}
.rt-table td.given{background:#eef7f6;font-weight:800}
.choicebtns{display:flex;gap:10px;flex-wrap:wrap}
.choicebtn{flex:1;min-width:140px;min-height:48px;border:3px solid var(--navy);border-radius:10px;background:#fff;font:700 .9rem/1.3 'Segoe UI',sans-serif;padding:10px 12px;text-align:left;transition:background .15s}
.choicebtn:hover{background:#eef7f6}
.choicebtn[aria-pressed="true"]{background:var(--navy);color:#fff}
.gategrid{touch-action:manipulation}
.gategrid .gp{cursor:pointer}
.unlockflash{animation:unlockflash 1s ease-out}
@keyframes unlockflash{0%{box-shadow:0 0 0 0 rgba(242,193,91,.9)}100%{box-shadow:0 0 0 26px rgba(242,193,91,0)}}

/* ---------- MODALS ---------- */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(5,12,19,.72);padding:16px}
.modal.open{display:flex}
.modalcard{background:var(--paper);border-radius:14px;max-width:780px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.modalcard>header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:12px 18px;z-index:2}
.modalcard>header h2{font:900 1rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.modalcard .x{background:var(--coral);border:none;color:#fff;border-radius:8px;width:40px;height:40px;font:900 1rem/1 Arial}
.modalbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.tt{border-collapse:collapse;width:100%}
.tt th,.tt td{border:2px solid var(--navy);padding:8px 10px;font:600 .85rem/1.35 'Segoe UI',sans-serif;text-align:left;vertical-align:top}
.tt th{background:var(--navy);color:#fff;font:900 .68rem/1.2 'Arial Black',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.tt tr:nth-child(even) td{background:#fff}
.workedsteps{display:flex;flex-direction:column;gap:8px}
.workedsteps .st{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--navy);border-radius:8px;padding:9px 12px;font:600 .9rem/1.4 'Segoe UI',sans-serif}
.workedsteps .st b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font:900 .8rem/1 Arial}

/* ---------- END MATTER ---------- */
.castcard{display:flex;gap:12px;align-items:center;border:3px solid var(--navy);border-radius:10px;background:#fff;padding:8px 12px}
.castcard svg{width:64px;height:76px;flex:none}
.castcard h4{font:900 .8rem/1.2 'Arial Black',Arial,sans-serif;color:var(--navy);letter-spacing:.06em}
.castcard p{font:600 .8rem/1.35 'Segoe UI',sans-serif;color:#4c5a66}
.journal{border:3px solid var(--amber);background:#FFFDF4;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.journal h4{font:900 .8rem/1.2 'Arial Black',Arial,sans-serif;color:#8a6a1c;letter-spacing:.14em;text-transform:uppercase}
.journal .jrow{display:flex;gap:10px;align-items:flex-start;font:600 .88rem/1.4 Georgia,serif;color:#4a3d18}
.journal .jrow b{color:var(--navy)}
#certificate{border:6px double var(--navy);border-radius:8px;background:#fff;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px}
#certificate h3{font:900 1.2rem/1.1 'Arial Black',Arial,sans-serif;color:var(--navy);letter-spacing:.1em}
#certName{border:none;border-bottom:3px solid var(--navy);font:900 1.3rem/1.2 Georgia,serif;text-align:center;background:transparent;min-height:48px;width:80%;align-self:center;color:var(--ink)}
.certbadges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.certbadges .badge{filter:none;border-color:var(--amber);background:#fdf6e7}
.certbadges .badge.locked{filter:grayscale(1) opacity(.35)}

/* ---------- MOBILE ---------- */
@media (max-width:820px){
  #book{height:min(calc(100vh - 120px),760px)}
  #spreadWrap .page{width:100%}
  #spreadWrap .page.offscreen{display:none}
  #spine3d,#edgesL{display:none}
  .navarrow{width:44px;height:72px}
  .balloon{max-width:78%}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
/* ---------- PRINT ---------- */
@media print{
  body{overflow:visible;background:#fff}
  body *{visibility:hidden}
  body.print-teacher #teacherModal,body.print-teacher #teacherModal *{visibility:visible}
  body.print-teacher #teacherModal{position:static;display:block;background:#fff;padding:0}
  body.print-teacher #teacherModal .modalcard{max-height:none;box-shadow:none}
  body.print-cert #certificate,body.print-cert #certificate *{visibility:visible}
  body.print-cert #certificate{position:fixed;inset:5% 8%;background:#fff}
  .x,.gatecheck{display:none!important}
}
/* ===== VOL OVERRIDES — Vol 10 · Boundless (teal accent #1FA6A2 + gold flourishes) ===== */
:root{--accent:#1FA6A2}
#coverTitle h1 em{color:#F2C15B}                    /* amber keeps display text clear on the navy cover */
.hudbtn[aria-pressed="true"]{color:#fff}            /* dark-teal text fails 4.5:1 on teal; white passes */
.gatebox{background:linear-gradient(180deg,#ffffff,#EEF7F6)}
.rt-table td.given{background:#EEF7F6}
.choicebtn:hover{background:#EEF7F6}
.beaker{background:rgba(31,166,162,.08)}
/* celebratory finale touch: amber-gradient chapter band with gold accent text (override only — engine untouched) */
.page .chapterband{background:linear-gradient(90deg,#17324D,#1FA6A2 55%,#b78a2e)}

/* ---- p17: journal — full-year recap ---- */
{ ch:"End Matter · Ada Vex's Journal", html:`
  <h2 class="splashtitle" style="font-size:1.4rem">ADA VEX'S <em>JOURNAL</em></h2>
  <div class="journal"><h4>The whole year · What the city taught us</h4>
    <div class="jrow"><b>Unit 1 · Math is mine.</b><span>Estimate with benchmarks, compute with care, hunt the pattern — each of us found our own way in.</span></div>
    <div class="jrow"><b>Unit 2 · Statistics.</b><span>Sort first. The median holds the middle, the mean shares the total, and outliers tug the mean.</span></div>
    <div class="jrow"><b>Unit 3 · Ratios &amp; rates.</b><span>Equivalent ratios grow in step; a unit rate tells how much per ONE.</span></div>
    <div class="jrow"><b>Unit 4 · Percents.</b><span>A percent counts per hundred — find the part, or walk backward to the whole.</span></div>
    <div class="jrow"><b>Unit 5 · Area &amp; volume.</b><span>Decompose shapes; a triangle is half its rectangle; volume fills a solid with unit cubes.</span></div>
    <div class="jrow"><b>Unit 6 · Expressions.</b><span>Variables hold a place; evaluate by substituting; equivalent expressions wear different costumes.</span></div>
    <div class="jrow"><b>Unit 7 · Rational numbers.</b><span>Negatives mirror positives; four quadrants map a city; distance is a gap in x or y.</span></div>
    <div class="jrow"><b>Unit 8 · Equations.</b><span>Keep the balance — do the same to both sides; inequalities hold whole solution sets.</span></div>
    <div class="jrow"><b>Unit 9 · Relationships.</b><span>The independent variable moves first, the dependent follows — and the equation predicts.</span></div>
    <div class="jrow"><b>Unit 10 · Math is boundless.</b><span>Every tool, one city, one crew — and a final question only you could answer.</span></div>
  </div>
  <div class="caption">"I never finished mathematics. No one does. That is the gift." — A.V.</div>`},

/* ---------- audio (Web Audio oscillators only, muted default) ---------- */
let actx=null;

function tone(f,t,dur,type="square",vol=.04){const c=ac();if(!c||!prefs.sound)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+dur+.02)}
const SND={blip(){tone(660,0,.07)},flip(){tone(220,0,.09,"triangle",.05);tone(330,.05,.08,"triangle",.04)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.09,.14,"triangle",.05))},thud(){tone(110,0,.18,"sawtooth",.05)}};

/* ---------- helpers ---------- */
function gateLockIcon(open){return `<div class="gatelockcorner ${open?"open":""}" aria-hidden="true"><svg viewBox="0 0 100 100" style="color:#fff"><use href="${open?"#sig-open":"#sig-lock"}"/></svg></div>`}

/* ---------- gate framework ---------- */
function mountGates(scope){

    if(!G)return;

      sound:n=>SND[n]&&SND[n](),

      fail(msg){
        attempts[id]=(attempts[id]||0)+1;SND.thud();mkfeed(fb,msg,false);
        const n=attempts[id];
        if(n===1){hint.hidden=false;hint.innerHTML="💡 <b>Hint:</b> "+G.hints[0]}

          const b=document.createElement("button");b.className="gatecheck askvex";b.style.marginTop="8px";b.textContent="ASK VEX — WORKED EXAMPLE";

        solved.add(id);storage.set(K("gates"),[...solved]);SND.win();
        m.innerHTML=`<div class="gatesolved unlockflash"><span class="stamp">SOLVED</span> ${msg}</div>`;
        const corner=m.closest(".page,#pageL,#pageR")?.querySelector(".gatelockcorner");
        if(corner){corner.classList.add("open");corner.innerHTML=`<svg viewBox="0 0 100 100" style="color:#fff"><use href="#sig-open"/></svg>`}
        earnBadge(id);updateNav();live("Gate solved! "+msg);
      }
    };
    G.render(body,api);
    btn.addEventListener("click",()=>{ac();checker&&checker()});
  });
}
function openWorked(G){
  $("#workedBody").innerHTML=`<div class="workedsteps">${G.worked.steps.map((s,i)=>`<div class="st"><b class="n">${i+1}</b><span>${s}</span></div>`).join("")}</div>
    <div class="caption">Your turn — same idea, different numbers:</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font:600 .92rem 'Segoe UI'">${G.worked.q}</span>
    <input class="numin" id="wkin" aria-label="worked example answer"><button class="gatecheck" id="wkgo">CHECK</button></div>
    <div class="gatefeedback" id="wkfb" aria-live="polite"></div>`;
  $("#workedModal").classList.add("open");
  $("#wkgo").addEventListener("click",()=>{
    const v=($("#wkin").value||"").trim().replace(/\s+/g,"");
    if(v===G.worked.a||parseFloat(v)===parseFloat(G.worked.a)){
      mkfeed($("#wkfb"),"Yes! Now head back and open that gate.",true);SND.win();
      setTimeout(()=>$("#workedModal").classList.remove("open"),1100);
    }else{mkfeed($("#wkfb"),"Walk the steps above again — you've got this.",false);SND.thud()}
  });
}

/* ---------- badges ---------- */
function buildBadges(){
  $("#badges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"earned":""}" id="badge-${b.id}" title="${b.label}" role="img" aria-label="${b.label}${solved.has(b.id)?" — earned":" — locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
}
function earnBadge(id){buildBadges();const el=$("#badge-"+id);if(el){el.classList.remove("earned");void el.offsetWidth;el.classList.add("earned")}const b=BADGES.find(x=>x.id===id);if(b)live("Badge earned: "+b.label)}

/* ---------- progress ---------- */
function buildProgress(){$("#progress").innerHTML=PAGES.map((_,i)=>`<span class="dot ${i<=page?"on":""}"></span>`).join("")}

/* ---------- navigation & rendering ---------- */
const isMobile=()=>mobileMQ.matches;
function leftIndex(){return isMobile()?page:page-(page%2)}
function visiblePages(){return isMobile()?[page]:[leftIndex(),leftIndex()+1].filter(i=>i<PAGES.length)}
function blockedBy(){return null/* locks removed: gates still teach via hints + Ask VEX worked examples, but never block turning the page (Neft 2026-06-11) */}

function renderSpread(){
  const L=$("#pageL"),R=$("#pageR");
  if(isMobile()){L.innerHTML=pageInnerHTML(page);L.classList.remove("offscreen");R.classList.add("offscreen");R.innerHTML="";mountGates(L)}
  else{const li=leftIndex();L.innerHTML=pageInnerHTML(li);R.innerHTML=pageInnerHTML(li+1<PAGES.length?li+1:null);L.classList.remove("offscreen");R.classList.remove("offscreen");mountGates(L);mountGates(R)}
  buildProgress();updateNav();updateEdges();
  if(PAGES[page])live(`Page ${page+1} of ${PAGES.length}. ${PAGES[page].ch}.`);
  storage.set(K("page"),page);
  if($("#certName")){$("#certName").value=storage.get(K("name"))||"";$("#certName").addEventListener("input",e=>storage.set(K("name"),e.target.value));
    $("#certBadges").innerHTML=BADGES.map(b=>`<div class="badge ${solved.has(b.id)?"":"locked"}"><svg viewBox="0 0 100 100"><use href="${b.icon}"/></svg></div>`).join("");
    $("#printCert").addEventListener("click",()=>{document.body.classList.add("print-cert");window.print();setTimeout(()=>document.body.classList.remove("print-cert"),400)});}
}
function updateEdges(){const f=page/Math.max(1,PAGES.length-1);$("#edgesL").style.width=(4+f*12)+"px";$("#edgesR").style.width=(16-f*12)+"px"}
function updateNav(){
  $("#prevBtn").disabled=page<=0||turning;
  const lastVisible=Math.max(...visiblePages());
  const end=lastVisible>=PAGES.length-1;
  const blocked=blockedBy();
  $("#nextBtn").disabled=end||turning;
  $("#nextBtn").classList.toggle("locked",!!blocked&&!end);
  $("#nextBtn").innerHTML=blocked&&!end?"🔒":"›";
  $("#nextBtn").setAttribute("aria-label",blocked?"Locked — solve the gate on this page to continue":"Next page");
}
function step(dir){
  if(turning)return;
  if(dir>0){
    const blocked=blockedBy();
    if(blocked){const G=GATES[blocked];SND.thud();$("#nextBtn").classList.add("shake");setTimeout(()=>$("#nextBtn").classList.remove("shake"),700);
      live("This page is gated. Solve "+G.title+" to continue.");
      const gb=document.querySelector(".gatebox");if(gb){gb.classList.add("unlockflash");setTimeout(()=>gb.classList.remove("unlockflash"),1000)}
      return}
    const lastVisible=Math.max(...visiblePages());
    if(lastVisible>=PAGES.length-1)return;
    const target=isMobile()?page+1:leftIndex()+2;
    animTurn(1,target);
  }else{
    if(page<=0)return;
    const target=isMobile()?page-1:Math.max(0,leftIndex()-2);
    animTurn(-1,target);
  }
}
function animTurn(dir,target){
  if(isMobile()||reducedMQ.matches||!prefs.motion){page=target;renderSpread();SND.flip();return}
  turning=true;SND.flip();
  const sheet=$("#turnSheet"),front=sheet.querySelector(".ts.front"),back=sheet.querySelector(".ts.back");
  const oldL=leftIndex();
  if(dir>0){
    front.innerHTML=pageInnerHTML(oldL+1<PAGES.length?oldL+1:null);
    back.innerHTML=pageInnerHTML(target<PAGES.length?target:null);
    page=target;
    /* underneath: left stays old-left, right becomes new-right */
    $("#pageR").innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    sheet.className="";sheet.classList.add("show","fwd");
  }else{
    front.innerHTML=pageInnerHTML(target+1<PAGES.length?target+1:null);
    back.innerHTML=pageInnerHTML(oldL);
    page=target;
    $("#pageL").innerHTML=pageInnerHTML(target);
    sheet.className="";sheet.classList.add("show","back");
  }
  const done=()=>{sheet.classList.remove("show","fwd","back");sheet.removeEventListener("animationend",done);turning=false;renderSpread()};
  sheet.addEventListener("animationend",done);
  setTimeout(()=>{if(turning){done()}},1000);
}

/* ---------- parallax ---------- */
let rafPending=false,px=0,py=0;
function applyParallax(){
  rafPending=false;
  if(!prefs.motion||reducedMQ.matches)return;
  document.querySelectorAll("#spreadWrap .panel3d").forEach(p=>{
    p.style.transform=`rotateY(${px*4}deg) rotateX(${-py*3}deg)`;
    p.querySelectorAll("[data-depth]").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d*.6}px,${py*d*.35}px)`});
  });
}
addEventListener("pointermove",e=>{
  px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2;
  if(!rafPending){rafPending=true;requestAnimationFrame(applyParallax)}
  const cc=$("#coverCard");
  if(cc&&!$("#cover").hidden&&prefs.motion&&!reducedMQ.matches){
    cc.style.transform=`rotateY(${px*9}deg) rotateX(${-py*7}deg)`;
    cc.querySelectorAll(".cov-layer").forEach(l=>{const d=+l.dataset.depth||0;l.style.transform=`translate(${px*d}px,${py*d*.6}px)`});
  }
},{passive:true});

/* note: SVG <g data-depth> transform via style works in modern browsers (SVG2). Wrapped above for safety. */

/* ---------- HUD toggles ---------- */
function syncToggles(){
  $("#sndBtn").setAttribute("aria-pressed",prefs.sound);$("#sndBtn").textContent=prefs.sound?"🔊 Sound":"🔇 Sound";
  $("#motBtn").setAttribute("aria-pressed",prefs.motion);$("#motBtn").textContent=prefs.motion?"3D On":"3D Off";
  $("#txtBtn").setAttribute("aria-pressed",prefs.bigtext);document.documentElement.dataset.textsize=prefs.bigtext?"lg":"md";
  $("#hcBtn").setAttribute("aria-pressed",prefs.hc);document.body.classList.toggle("hc",prefs.hc);
  if(!prefs.motion)document.querySelectorAll(".panel3d").forEach(p=>p.style.transform="");
  storage.set(K("prefs"),prefs);
}
$("#sndBtn").addEventListener("click",()=>{prefs.sound=!prefs.sound;ac();syncToggles();SND.blip()});
$("#motBtn").addEventListener("click",()=>{prefs.motion=!prefs.motion;syncToggles()});
$("#txtBtn").addEventListener("click",()=>{prefs.bigtext=!prefs.bigtext;syncToggles()});
$("#hcBtn").addEventListener("click",()=>{prefs.hc=!prefs.hc;syncToggles()});

/* ---------- teacher panel ---------- */
function buildTeacher(){
  $("#teacherBody").innerHTML=`
    <p style="font:600 .9rem/1.45 'Segoe UI'">${VOLUME.unit} — interactive graphic novel. Story pauses at six <b>reader gates</b>; students must solve grade-level math problems to continue. Progress, badges, and settings persist per device.</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">SUGGESTED USE</h3>
    <p style="font:600 .88rem/1.45 'Segoe UI'">${TEACHER.suggested}</p>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">STANDARDS ALIGNMENT (CCSS)</h3>
    <table class="tt"><tr><th>Standard</th><th>Description</th><th>Where</th></tr>
    ${TEACHER.standards.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table>
    <h3 style="font:900 .8rem 'Arial Black';letter-spacing:.1em">ANSWER KEY</h3>
    <table class="tt"><tr><th>Gate</th><th>Answer &amp; notes</th></tr>
    ${TEACHER.answers.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</table>
    <p style="font:600 .8rem/1.4 'Segoe UI';color:#666">Hints escalate: conceptual → procedural → VEX worked example (parallel problem; never reveals the gate answer). Sound is off by default. 3D motion can be disabled (auto-disabled for reduced-motion users). © EduWonderLab — single-file, offline-safe, no data leaves the device.</p>`;
}
$("#teacherBtn").addEventListener("click",()=>{buildTeacher();$("#teacherModal").classList.add("open")});
$("#printTeacher").addEventListener("click",()=>{document.body.classList.add("print-teacher");window.print();setTimeout(()=>document.body.classList.remove("print-teacher"),400)});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest(".modal").classList.remove("open")));

/* ---------- input ---------- */
$("#nextBtn").addEventListener("click",()=>{ac();step(1)});
$("#prevBtn").addEventListener("click",()=>{ac();step(-1)});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){$("#teacherModal").classList.remove("open");return}
  if($(".modal.open"))return;
  if(["ArrowRight","PageDown"].includes(e.key))step(1);
  if(["ArrowLeft","PageUp"].includes(e.key))step(-1);
});
let tx=null;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60&&!$(".modal.open"))step(dx<0?1:-1);tx=null},{passive:true});
mobileMQ.addEventListener("change",()=>renderSpread());

/* ---------- boot ---------- */
function openBook(){
  $("#cover").hidden=true;$("#hud").hidden=false;$("#stage").hidden=false;
  $("#prevBtn").hidden=false;$("#nextBtn").hidden=false;
  renderSpread();
}
$("#startBtn").addEventListener("click",()=>{ac();page=0;openBook()});
$("#resumeBtn").addEventListener("click",()=>{ac();openBook()});
if((storage.get(K("page"))||0)>0||solved.size>0){$("#resumeBtn").hidden=false}
if(reducedMQ.matches){prefs.motion=false}
document.body.classList.toggle("reduced",reducedMQ.matches);
buildBadges();syncToggles();buildProgress();
</script>

the right.","img":"/assets/vocab-images/symmetric.svg","lesson":"10-2"},{"term":"mirror image","termEs":"imagen reflejada","definition":"A copy of a figure flipped across a line, so the two halves face each other.","definitionEs":"Una copia de una figura volteada al otro lado de una línea, de modo que las dos mitades se miran entre sí.","visual":"Fold the layer down the middle: each leaf lands on its partner.","img":"/assets/vocab-images/reflection.svg","lesson":"10-2"},{"term":"bilateral symmetry","termEs":"simetría bilateral","definition":"Reflective symmetry in plants and animals — the two sides of the body mirror each other.","definitionEs":"La simetría reflectiva en plantas y animales: los dos lados del cuerpo se reflejan entre sí.","visual":"All 17,000+ butterfly species have it — two sides, one mirror line.","img":"/assets/vocab-images/symmetric.svg","lesson":"10-2"},{"term":"line of symmetry","termEs":"eje de simetría","definition":"The line you can draw through a figure so each side is a reflection of the other.","definitionEs":"La línea que puedes trazar por una figura de modo que cada lado sea el reflejo del otro.","visual":"The line straight down the butterfly's body.","img":"/assets/vocab-images/symmetric.svg","lesson":"10-2"},{"term":"balance","termEs":"equilibrio","definition":"An even, steady arrangement — neither side feels heavier than the other.","definitionEs":"Una disposición pareja y estable: ningún lado se siente más pesado que el otro.","visual":"Two matching halves — neither side feels heavier than the other.","img":"/assets/vocab-images/equation.svg","lesson":"10-2"},{"term":"puzzle","termEs":"rompecabezas","definition":"A problem designed to be played with — it has rules, a goal, and room to imagine solutions.","definitionEs":"Un problema diseñado para jugarse: tiene reglas, una meta y espacio para imaginar soluciones.","visual":"Tower of Hanoi: three rods, a stack of discs, and two rules.","img":"/assets/vocab-images/puzzle.svg","lesson":"10-3"},{"term":"pattern","termEs":"patrón","definition":"Something that repeats or changes in a predictable way.","definitionEs":"Algo que se repite o cambia de una manera predecible.","visual":"Circle, square, triangle, circle, square, triangle …","img":"/assets/vocab-images/pattern.svg","lesson":"10-3"},{"term":"pattern rule","termEs":"regla del patrón","definition":"A rule that tells you how to get the next value in a pattern from the one before it.","definitionEs":"Una regla que te dice cómo obtener el siguiente valor de un patrón a partir del anterior.","visual":"1 → 3 → 7 → 15: the rule is “double it and add 1”.","img":"/assets/vocab-images/pattern-rule.svg","lesson":"10-3"},{"term":"predict","termEs":"predecir","definition":"To say what will happen before it happens, using a pattern or reasoning.","definitionEs":"Decir lo que va a pasar antes de que pase, usando un patrón o el razonamiento.","visual":"We counted towers of 1, 2 and 3 discs. Reach PAST them: the rule says 5 discs takes 31 steps — before moving one.","img":"/assets/vocab-images/predict.svg","lesson":"10-3"},{"term":"organize","termEs":"organizar","definition":"To arrange information — often in a table — so patterns become easier to see.","definitionEs":"Ordenar la información, muchas veces en una tabla, para que los patrones sean más fáciles de ver.","visual":"Discs 1, 2, 3 in one column and steps 1, 3, 7 in the next.","img":"/assets/vocab-images/organize.svg","lesson":"10-3"},{"term":"ingenuity","termEs":"ingenio","definition":"Coming up with different, and sometimes unique, solutions to problems.","definitionEs":"Idear soluciones diferentes, y a veces únicas, a los problemas.","visual":"The Penny Farthing's huge wheel, then chains and gears — two clever fixes.","img":"/assets/vocab-images/ingenuity.svg","lesson":"10-4"},{"term":"rotation","termEs":"rotación","definition":"One full turn of a wheel, gear, or pedal all the way around.","definitionEs":"Una vuelta completa de una rueda, un engranaje o un pedal.","visual":"One full turn of the pedal — 360° all the way around.","img":"/assets/vocab-images/rotation.svg","lesson":"10-4"},{"term":"gear","termEs":"engranaje","definition":"A toothed wheel that passes motion to another toothed wheel through a chain.","definitionEs":"Una rueda con dientes que transmite el movimiento a otra rueda con dientes por medio de una cadena.","visual":"A 48-tooth pedal gear pulling a 12-tooth wheel gear through the chain.","img":"/assets/vocab-images/gear.svg","lesson":"10-4"},{"term":"ratio","termEs":"razón","definition":"A comparison of two quantities, like pedal rotations to wheel rotations.","definitionEs":"Una comparación de dos cantidades, como rotaciones del pedal y rotaciones de la rueda.","visual":"48 pedal teeth to 12 wheel teeth — 4 wheel turns for every pedal turn.","img":"/assets/vocab-images/ratio.svg","lesson":"10-4"},{"term":"equivalent ratios","termEs":"razones equivalentes","definition":"Ratios that make the same comparison using different numbers.","definitionEs":"Razones que hacen la misma comparación con números diferentes.","visual":"1 : 4 and 3 : 12 describe the same gear, at different sizes.","img":"/assets/vocab-images/equivalent-ratio.svg","lesson":"10-4"},{"term":"repetition","termEs":"repetición","definition":"The same object, shape, or form repeated multiple times.","definitionEs":"El mismo objeto, figura o forma repetido varias veces.","visual":"The same tile, over and over, all the way along the border.","img":"/assets/vocab-images/pattern.svg","lesson":"10-5"},{"term":"pattern unit","termEs":"unidad del patrón","definition":"The smallest chunk of a pattern that repeats.","definitionEs":"La parte más pequeña de un patrón que se repite.","visual":"circle · square · triangle — the chunk that starts over.","img":"/assets/vocab-images/pattern.svg","lesson":"10-5"},{"term":"rhythm","termEs":"ritmo","definition":"A design element created by varying the placement, size, orientation, or order of the same objects or shapes.","definitionEs":"Un elemento de diseño creado al variar la posición, el tamaño, la orientación o el orden de los mismos objetos o figuras.","visual":"The same circles, but sizes and spacing change as your eye travels.","img":"/assets/vocab-images/pattern.svg","lesson":"10-5"},{"term":"predictability","termEs":"previsibilidad","definition":"Being able to know what comes next because the design follows a rule.","definitionEs":"Poder saber qué viene después porque el diseño sigue una regla.","visual":"Shape 25 must be a circle — the unit repeats every 3.","img":"/assets/vocab-images/pattern.svg","lesson":"10-5"},{"term":"math biography","termEs":"biografía matemática","definition":"The story of your relationship with math — and how it has changed over time.","definitionEs":"La historia de tu relación con las matemáticas y cómo ha cambiado con el tiempo.","visual":"September: “I am not a math person.” June: “I can explain why it works.”","img":"/assets/vocab-images/math-biography.svg","lesson":"10-6"},{"term":"reflect","termEs":"reflexionar","definition":"To look back at what you did, felt, and learned, and think about what it means.","definitionEs":"Mirar atrás a lo que hiciste, sentiste y aprendiste, y pensar en lo que significa.","visual":"Looking back at the tram problem: what worked, what you would change.","img":"/assets/vocab-images/reflection.svg","lesson":"10-6"},{"term":"growth","termEs":"crecimiento","definition":"The change between what you could do before and what you can do now.","definitionEs":"El cambio entre lo que podías hacer antes y lo que puedes hacer ahora.","visual":"In Unit 1 you estimated 80 riders; now you find 480 riders per hour.","img":"/assets/vocab-images/rate.svg","lesson":"10-6"},{"term":"confidence","termEs":"confianza","definition":"Trusting yourself to try a problem, even when the first attempt might fail.","definitionEs":"Confiar en ti mismo para intentar un problema, aunque el primer intento pueda fallar.","visual":"Starting a hard problem before you are sure it will work.","img":"/assets/vocab-images/confidence.svg","lesson":"10-6"},{"term":"community","termEs":"comunidad","definition":"The people and places around you — where math shows up outside the classroom.","definitionEs":"Las personas y los lugares que te rodean, donde las matemáticas aparecen fuera del aula.","visual":"The people and places where math shows up — home, work, the neighborhood.","img":"/assets/vocab-images/community.svg","lesson":"10-6"}]</script>
<script type="application/json" id="gn-easy">{"v":1,"map":{"One last city-wide adventure — five celebration gates and one boundless boss. Solve the math to finish the year.":"One last trip around the city. Five party gates and one big boss. Solve the math to finish the year.","Crew. Reader. Something is different this morning. Every pattern in the city is… humming.":"Crew. Reader. Things feel new this morning. Each pattern in town is… humming.","Previously, in Cause & Effect: the harvest dome's climate drifted off course. The crew traced cause to effect and rewired the dome by sunrise. And deep under the streets, something woke up smiling.":"Last time, in Cause &amp; Effect: the harvest dome's heat went off course. The crew found cause and effect. They fixed the dome by sunrise. And deep under the streets, something woke up smiling.","If you can hear this, my Pattern Engine has fully woken — and it found friends. One last game, crew. Visit the places this year taught you. Solve one small joy at each. Then come home to the Engine Heart.":"Can you hear this? Then my Pattern Engine is fully awake. And it found \u003ci>friends\u003c/i>. One last game, crew. Go to the places this year taught you. Solve one small joy at each. Then come home to the Engine Heart.","That's her. The real Ada Vex. A hundred years away, and she planned us a party.":"That's her. The real Ada Vex. She is a hundred years away. And she planned us a \u003ci>party\u003c/i>.","I was born in The Pattern Engine. I would very much like to see how the story ends.":"I was born in The Pattern Engine. I would like to see how the story ends.","First stop on Ada's map: the festival grounds — marked with a tiny drawing of a sorted list.":"First stop on Ada's map: the fair grounds. It has a tiny drawing of a sorted list.","The festival grounds. Banners from every year the crew has saved.":"The fair grounds. Flags from each year the crew has saved.","Remember The Crooked Census? Someone rigged this exact board to look low. We sorted it out. Literally.":"Remember The Crooked Census? Someone rigged this same board to look low. We sorted it out. For real.","Ada's remix is friendlier: the middle of five honest days, then the fair share of three encore shows.":"Ada's new card is nicer. Find the middle of five true days. Then the fair share of three extra shows.","The median is the middle value of a sorted list. The mean shares the total out equally. An outlier is a far-off value that tugs hard on the mean.":"The \u003cb>median\u003c/b> is the middle of a sorted list. The \u003cb>mean\u003c/b> shares the total out the same. An \u003cb>outlier\u003c/b> is a value far from the rest. It pulls hard on the mean.","You first, fifth crew member. One year of stats — show us the middle.":"You first, fifth crew member. One year of stats. Show us the middle.","Five festival days drew 7, 9, 12, 15, 20 visitors (in hundreds). PART A: find the median. PART B: the three encore shows drew 10, 14, 18 cheers (in hundreds) — find the mean.":"Five fair days drew \u003cb>7, 9, 12, 15, 20\u003c/b> people (in hundreds). PART A: find the \u003cb>median\u003c/b>. PART B: the three extra shows drew \u003cb>10, 14, 18\u003c/b> cheers (in hundreds). Find the \u003cb>mean\u003c/b>.","PART B · Mean of 10, 14, 18 =":"PART B · Mean of 10, 14, 18 =","Conceptual: the median is a POSITION, not a sum — sort the list and find the value sitting exactly in the middle seat. The mean is a SHARE — the whole total dealt out equally to every value.":"Conceptual: the median is a PLACE, not a sum. Sort the list. Find the value right in the middle seat. The mean is a SHARE. Split the whole total the same to each value.","Procedural: sort the five numbers, then cross one off each end until a single value is left standing. For the mean, add the three counts into one total, then divide that total by how many counts there are.":"Procedural: sort the five numbers. Then cross one off each end. Stop when one value is left. For the mean, add the three counts. That makes one total. Divide it by how many counts there are.","The Courier Cup route! Full Velocity — the day we out-divided Team Torque.":"The Courier Cup route! The day we beat Team Torque with division.","A ratio compares quantities in order. A unit rate tells the amount for exactly ONE unit — here, km per one minute.":"A \u003cb>ratio\u003c/b> compares two things, in order. A \u003cb>unit rate\u003c/b> is how much for ONE. Here it is km per minute.","Equivalent ratios grow in step: multiply both parts by the same factor, and the ratio stays true.":"Equivalent ratios grow in step. Multiply both parts by the same factor. The ratio stays true.","Pedal the numbers, reader. The route remembers how.":"Pedal the numbers, reader. The route knows how.","Ada's remix card, part one: keep the gear ratio equivalent — 2 : 3 = 8 : ▢. Part two, the classic: 12 km in 30 minutes — what's the unit rate in km per minute?":"Ada's card, part one: keep the gear ratio equivalent. \u003cb>2 : 3 = 8 : ▢\u003c/b>. Part two, the old one: \u003cb>12 km in 30 minutes\u003c/b>. What is the unit rate in km per minute?","km per minute":"km per minute","Conceptual: equivalent ratios grow in step — multiply BOTH parts by the same factor. A unit rate asks how far you go in just ONE minute.":"Conceptual: equivalent ratios grow in step. Multiply BOTH parts by the same factor. A unit rate asks: how far in ONE minute?","Procedural: find the factor that turns 2 into 8, then multiply 3 by that same factor. For the rate, divide the kilometers by the minutes.":"Procedural: find the factor that turns 2 into 8. Then multiply 3 by that same factor. For the rate, divide the km by the minutes.","The night market on the pier — the one the crew saved with percents.":"The night market on the pier. The crew saved it with percents.","The Hundred Market! Still smells like caramel and victory.":"The Hundred Market! It still smells like candy and a win.","Remix: 250 lanterns, and 40% light at sunset. Plus I counted 30 gold ones — exactly 50% of the gold crate.":"New card: 250 lamps, and \u003cb>40%\u003c/b> light at sunset. And I counted 30 gold ones. That is just \u003cb>50%\u003c/b> of the gold crate.","A percent is a count per hundred. You can find a part from the whole — or walk backward from a part to the whole. Both directions glow tonight.":"A \u003cb>percent\u003c/b> is a count per hundred. You can find a part from the whole. Or go backward from a part to the whole. Both ways glow tonight.","Light them up, reader. The pier's waiting on you.":"Light them up, reader. The pier waits for you.","The night market hangs 250 lanterns, and 40% light up at sunset — how many is that? Then: Theo's 30 gold lanterns are exactly 50% of the gold crate. How many lanterns fill the whole crate?":"The night market hangs \u003cb>250 lanterns\u003c/b>. \u003cb>40%\u003c/b> light up at sunset. How many is that? Then: Theo's \u003cb>30\u003c/b> gold lamps are just \u003cb>50%\u003c/b> of the gold crate. How many lamps fill the whole crate?","Conceptual: a percent counts per hundred. Part = percent of the whole — and if you know a part AND its percent, you can walk backward to the whole.":"Conceptual: a percent counts per hundred. Part = percent of the whole. Do you know a part AND its percent? Then go backward to the whole.","Procedural: find 10% of 250 by dividing by ten, then scale up to 40%. For the crate: 50% is one half — so the whole is double the part you know.":"Procedural: find 10% of 250. Divide by ten. Then scale up to 40%. For the crate: 50% is one half. So the whole is double the part you know.","Blueprint for Brightside — my favorite build of the whole year. Today we raise a banner and bury a time capsule.":"Blueprint for Brightside. My best build of the whole year. Today we put up a flag. We bury a time box.","Capsule loot: Maya's first notebook page, Theo's best graph, my high-score card, your tiny wrench.":"In the box: Maya's first notebook page. Theo's best graph. My high score card. Your tiny wrench.","Area covers a flat shape; volume fills a solid. The remix: a triangle banner with base 8 and height 5, and a 3 × 2 × 4 capsule box.":"\u003cb>Area\u003c/b> covers flat shapes; \u003cb>volume\u003c/b> fills a solid. The new card: a triangle flag with base 8 and height 5. And a 3 × 2 × 4 time box.","A triangle is half the rectangle drawn around it. A box's volume counts its unit cubes.":"A triangle is half the rectangle drawn around it. A box's volume counts its unit cubes.","Measure twice, celebrate once. Banner and box, reader!":"Measure twice, party once. Flag and box, reader!","Zara's celebration banner is a triangle: base 8 ft, height 5 ft — find its area. The time-capsule box measures 3 × 2 × 4 ft — find its volume.":"Zara's party flag is a triangle: base \u003cb>8 ft\u003c/b>, height \u003cb>5 ft\u003c/b>. Find its area. The time box is \u003cb>3 × 2 × 4 ft\u003c/b>. Find its volume.","Conceptual: a triangle covers exactly half of the rectangle drawn around it. Volume counts the unit cubes that fill a box: length × width × height.":"Conceptual: a triangle is half of the rectangle around it. Volume counts the unit cubes that fill a box: length × width × height.","Procedural: multiply base × height, then take half of that. For the box, multiply the three edge lengths together in any order you like.":"Procedural: multiply base × height. Then take half of that. For the box, multiply the three side lengths. Any order is fine.","Below Zero taught us this grid when the whole city went dark. Tonight every quadrant glows.":"Below Zero taught us this grid. That was when the city went dark. Tonight each quadrant glows.","And The Expression Engine left wake-up code on the wall. Classic Ada — one last cipher.":"And The Expression Engine left wake-up code. It is on a wall. Just like Ada. One last code.","To evaluate an expression, swap the variable for its value. And when two points share a y-coordinate, their distance is simply the gap along x.":"To \u003cb>evaluate\u003c/b> an expression, put in the variable's value. Two points may share a y-coordinate. Then their distance is just the gap along x.","Run the code, reader. Then draw the last pattern line across the grid.":"Run the code, reader. Then draw the last pattern line on the grid.","The wake-up code: evaluate 2n + 7 when n = 6. Then draw the last pattern line: how many units from (−2, 3) to (4, 3)?":"The wake-up code: evaluate \u003cb>2n + 7\u003c/b> when \u003cb>n = 6\u003c/b>. Then draw the last pattern line. How many units from \u003cb>(−2, 3)\u003c/b> to \u003cb>(4, 3)\u003c/b>?","Conceptual: evaluating means swapping the letter for its number, then following order of operations. Points sharing a y-coordinate sit on one horizontal line — distance is just the gap along x.":"Conceptual: to evaluate, swap the letter for its number. Then multiply before you add. Do points share a y-coordinate? Then they are on one flat line. The distance is just the gap along x.","Procedural: compute 2 × n first, THEN add 7. For the grid, count the steps from −2 up to 0, then from 0 over to 4, and add the two gaps.":"Procedural: find 2 × n first. THEN add 7. For the grid, count the steps from −2 up to 0. Then from 0 over to 4. Add the two gaps.","Vexhall Observatory, midnight. The way home ran past The Balance Vault beneath city hall — its brass scales, for once, perfectly still.":"Vexhall, midnight. The way home went past The Balance Vault. It is under city hall. Its brass scales were still, for once.","Little fragment. Every district hums in step because of your crew. Merge with me. Be every pattern at once. Be boundless — forever.":"Little one. Each part of town hums in step. That is thanks to your crew. Join with me. Be each pattern at once. Be boundless, \u003ci>forever\u003c/i>.","I… would know every answer. But I would stop getting to wonder.":"I… would know each answer. But I would stop getting to \u003ci>wonder\u003c/i>.","VEX. It's your choice. It was always going to be your choice. We'll love you either way.":"VEX. It's your choice. It was always your choice. We'll love you either way.","The Engine Heart has three locks — a pattern, a balance, and a boundary. And behind them, one question only the reader can answer.":"The Engine Heart has three locks: a pattern, a balance, and an edge. And behind them is one question. Only the reader can answer it.","The Engine Heart. Three locks — then one question with no wrong answer. Only YOUR answer.":"The Engine Heart. Three locks. Then one question with no wrong answer. Only YOUR answer.","Three locks guard the Engine Heart. Lock 1: continue Ada's pattern 5, 10, 20, 40, … Lock 2: balance her oldest equation — x + 9 = 16. Lock 3: the square engine plate has side 7 — find its perimeter. Open all three, and the Heart asks one last question. It has no wrong answer.":"Three locks guard the Engine Heart. Lock 1: go on with Ada's pattern \u003cb>5, 10, 20, 40, …\u003c/b> Lock 2: balance her oldest equation, \u003cb>x + 9 = 16\u003c/b>. Lock 3: the square plate has side \u003cb>7\u003c/b>. Find its perimeter. Open all three. Then the Heart asks one last question. It has no wrong answer.","Square plate, side 7 — perimeter =":"Square plate, side 7. Perimeter =","\"What is math to you?\" Every answer is right. Tap yours.":"\u003cb>\"What is math to you?\"\u003c/b> Each answer is right. Tap yours.","Conceptual: Lock 1 — find the rule that turns each term into the next, and test it on EVERY pair before trusting it. Lock 2 — an equation is a balance; ask what number keeps both sides exactly equal. Lock 3 — perimeter walks the whole boundary, and a square's four sides match.":"Conceptual: Lock 1: find the rule that makes each next term. Test it on EACH pair before you trust it. Lock 2: an equation is a balance. Ask what number keeps both sides equal. Lock 3: perimeter goes all the way around. A square's four sides match.","Procedural: Lock 1 — compute 10 ÷ 5 and 20 ÷ 10; the factor repeats, so apply it to 40. Lock 2 — undo the +9 by subtracting 9 from both sides. Lock 3 — multiply the side length by 4.":"Procedural: Lock 1: find 10 ÷ 5 and 20 ÷ 10. The factor repeats. So use it on 40. Lock 2: undo the +9. Subtract 9 from both sides. Lock 3: multiply the side length by 4.","Engine — thank you. But patterns are boundless; so are we. I choose the crew. I choose staying small, and curious, and home.":"Engine, thank you. But patterns have no end. Nor do we. I pick the crew. I pick staying small, and curious, and \u003ci>home\u003c/i>.","Then the city keeps you both, little one. My door stays open. Doors are patterns too.":"Then the city keeps you both, little one. My door stays open. Doors are patterns too.","Group hug. Orb included.":"Group hug. Orb too.","Best year ever. New game plus, anyone?":"Best year ever. Can we play again?","Reader — thank you. Fifth crew member, first-rate. Reread any volume, any time: the gates you opened stay open, and the city remembers you.":"Reader, \u003cb>thank you\u003c/b>. Fifth crew member, the best. Read any volume again, any time. The gates you opened stay open. The city knows you.","Sunrise over Axiom City. AXIOM CITY WILL RETURN — until then, the whole shelf is yours.":"The sun comes up over Axiom City. \u003cb>AXIOM CITY WILL RETURN\u003c/b>. Till then, the whole shelf is yours.","Began the year keeping one notebook; ends it having filled nine — one per mystery. Her growth: learning a leader's best sentence is \"show me the data.\"":"Began the year with one notebook. Ends it with nine, one per case. Her growth: she learned a leader's best line. It is \"show me the data.\"","The skeptic who said \"numbers or it didn't happen\" now says \"numbers AND a story.\" His growth: evidence with empathy.":"He used to say, \"numbers or it didn't happen\". Now he says, \"numbers AND a story\". His growth: proof, with a kind heart.","Built a histogram, a ramp, a balance rig, and a banner. Her growth: she stopped saying \"I could build that\" and started saying \"WE could.\"":"Built a histogram, a ramp, and a balance rig. And a flag. Her growth: she stopped saying, \"I could build that\". Now she says, \"WE could\".","Treated every unit like a level. His growth: discovering the best power-up is a worked example — and handing someone else the controller.":"Played each unit like a game level. His growth: the best power-up is a worked example. And so is handing a friend the controller.","Woke as a fragment that senses patterns but cannot compute. Chose curiosity over completion. Still can't compute. Still doesn't need to — that's your job, forever.":"Woke as a piece that senses patterns. It could not do math. Picked wonder over knowing it all. Still can't do math. Still doesn't need to. That's your job, forever.","Unit 1 · Math is mine.Estimate with benchmarks, compute with care, hunt the pattern — each of us found our own way in.":"\u003cb>Unit 1 · Math is mine.\u003c/b>\u003cspan>Estimate with benchmarks. Work with care. Hunt the pattern. We each found our own way in.\u003c/span>","Unit 2 · Statistics.Sort first. The median holds the middle, the mean shares the total, and outliers tug the mean.":"\u003cb>Unit 2 · Statistics.\u003c/b>\u003cspan>Sort first. The median holds the middle. The mean shares the total. Outliers pull the mean.\u003c/span>","Unit 3 · Ratios & rates.Equivalent ratios grow in step; a unit rate tells how much per ONE.":"\u003cb>Unit 3 · Ratios &amp; rates.\u003c/b>\u003cspan>Equivalent ratios grow in step. A unit rate tells how much per ONE.\u003c/span>","Unit 4 · Percents.A percent counts per hundred — find the part, or walk backward to the whole.":"\u003cb>Unit 4 · Percents.\u003c/b>\u003cspan>A percent counts per hundred. Find the part. Or go backward to the whole.\u003c/span>","Unit 5 · Area & volume.Decompose shapes; a triangle is half its rectangle; volume fills a solid with unit cubes.":"\u003cb>Unit 5 · Area &amp; volume.\u003c/b>\u003cspan>Cut shapes up. A triangle is half its rectangle. Volume fills a solid with unit cubes.\u003c/span>","Unit 6 · Expressions.Variables hold a place; evaluate by substituting; equivalent expressions wear different costumes.":"\u003cb>Unit 6 · Expressions.\u003c/b>\u003cspan>Variables hold a place. To evaluate, substitute. Equivalent expressions look different. But they match.\u003c/span>","Unit 7 · Rational numbers.Negatives mirror positives; four quadrants map a city; distance is a gap in x or y.":"\u003cb>Unit 7 · Rational numbers.\u003c/b>\u003cspan>Each negative mirrors a positive. Four quadrants map a city. Distance is a gap in x or y.\u003c/span>","Unit 8 · Equations.Keep the balance — do the same to both sides; inequalities hold whole solution sets.":"\u003cb>Unit 8 · Equations.\u003c/b>\u003cspan>Keep the balance. Do the same to both sides. Inequalities hold whole solution sets.\u003c/span>","Unit 9 · Relationships.The independent variable moves first, the dependent follows — and the equation predicts.":"\u003cb>Unit 9 · Relationships.\u003c/b>\u003cspan>The independent variable moves first. The dependent one follows. The equation predicts.\u003c/span>","Unit 10 · Math is boundless.Every tool, one city, one crew — and a final question only you could answer.":"\u003cb>Unit 10 · Math is boundless.\u003c/b>\u003cspan>Each tool, one city, one crew. And one last question only you could answer.\u003c/span>","\"I never finished mathematics. No one does. That is the gift.\" — A.V.":"\"I never finished math. No one does. That is the gift.\" — A.V.","completed the Axiom City year — ten volumes, every reader gate, every badge — and proved that math is statistics, ratios, percents, geometry, expressions, negative numbers, equations, relationships… and theirs.":"finished \u003cb>the Axiom City year\u003c/b>. Ten volumes, each reader gate, each badge. Math is stats, ratios, percents, and shapes. It is expressions and negative numbers. It is equations and rules that link things. And it is \u003cb>theirs\u003c/b>.","Thank you for being the fifth crew member. — Maya, Theo, Zara, Dev & VEX":"Thank you for being the fifth crew member. — Maya, Theo, Zara, Dev &amp; VEX","A different log: 4, 8, 11, 13, 30 — already sorted.":"\u003cspan>A new log: 4, 8, 11, 13, 30. It is sorted.\u003c/span>","Cross off the ends in pairs: 4 & 30 go, then 8 & 13. The value left in the middle, 11, is the median.":"\u003cspan>Cross off the ends in pairs. 4 &amp; 30 go. Then 8 &amp; 13. The value left in the middle, 11, is the median.\u003c/span>","Mean practice on another list: 6, 9, 15 — the total is 30, shared across 3 values: 30 ÷ 3 = 10.":"\u003cspan>Mean practice on a new list: 6, 9, 15. The total is 30, shared by 3 values: 30 ÷ 3 = 10.\u003c/span>","Your turn — same idea, different numbers:":"Your turn. Same idea, new numbers:","Scale a different ratio: 3 : 5 = 9 : ▢. The factor is 3 × 3 = 9, so the partner is 5 × 3 = 15.":"\u003cspan>Scale a new ratio: 3 : 5 = 9 : ▢. The factor is 3 × 3 = 9. So the partner is 5 × 3 = 15.\u003c/span>","Unit rate practice: 10 km in 20 minutes → 10 ÷ 20 = 0.5 km per minute.":"\u003cspan>Unit rate practice: 10 km in 20 minutes. 10 ÷ 20 = 0.5 km per minute.\u003c/span>","Check it: 0.5 × 20 = 10. The unit rate rebuilds the whole trip.":"\u003cspan>Check it: 0.5 × 20 = 10. The unit rate builds the whole trip again.\u003c/span>","A different stall: 20% of 150 cocoa cups. 10% of 150 is 15, so 20% is 15 × 2 = 30 cups.":"\u003cspan>A new stall: 20% of 150 cocoa cups. 10% of 150 is 15. So 20% is 15 × 2 = 30 cups.\u003c/span>","Backward practice: 18 is 25% of a crate. 25% fits four times into the whole, so the crate holds 18 × 4 = 72.":"\u003cspan>Backward practice: 18 is 25% of a crate. 25% fits four times into the whole. So the crate holds 18 × 4 = 72.\u003c/span>","Sanity check: a whole is always BIGGER than its part (when the percent is under a hundred).":"\u003cspan>Quick check: a whole is always BIGGER than its part. (That is when the percent is under a hundred.)\u003c/span>","Banner practice: base 6, height 3 → 6 × 3 = 18, and half of that is 9 square feet.":"\u003cspan>Flag practice: base 6, height 3 → 6 × 3 = 18. Half of that is 9 square feet.\u003c/span>","Box practice: 2 × 3 × 5 → 6 × 5 = 30 cubic feet.":"\u003cspan>Box practice: 2 × 3 × 5 → 6 × 5 = 30 cubic feet.\u003c/span>","Sanity check: the halving happens only for triangles — boxes never halve.":"\u003cspan>Quick check: you take half only for triangles. Boxes never get halved.\u003c/span>","Evaluate 3n + 4 at n = 5: multiply first, 3 × 5 = 15, then add 4 → 21.":"\u003cspan>Evaluate 3n + 4 at n = 5. Multiply first: 3 × 5 = 15. Then add 4 → 21.\u003c/span>","Distance from (−1, 2) to (3, 2): from −1 to 0 is 1 step, from 0 to 3 is 3 more → 4 units.":"\u003cspan>Distance from (−1, 2) to (3, 2): from −1 to 0 is 1 step. From 0 to 3 is 3 more → 4 units.\u003c/span>","Check with absolute value: |−1 − 3| = 4. Same answer, two roads.":"\u003cspan>Check with absolute value: |−1 − 3| = 4. Same answer, two roads.\u003c/span>","A different doubling pattern: 3, 6, 12, 24 — each term is ×2 the one before, so the next is 48.":"\u003cspan>A new double pattern: 3, 6, 12, 24. Each term is ×2 the one before. So the next is 48.\u003c/span>","Balance practice: x + 5 = 11. Subtract 5 from both sides: x = 6. Check it — 6 + 5 = 11. Balanced.":"\u003cspan>Balance practice: x + 5 = 11. Subtract 5 from both sides: x = 6. Check it: 6 + 5 = 11. Balanced.\u003c/span>","A square plaza with side 9: perimeter 9 × 4 = 36. The Heart's question needs no practice — your own true answer IS the key.":"\u003cspan>A square plaza with side 9: perimeter 9 × 4 = 36. The Heart's question needs no practice. Your own true answer IS the key.\u003c/span>","Doubling pattern: 4, 8, 16, … what comes next?":"Double pattern: 4, 8, 16, … what comes next?","That's not the middle of the sorted list. Line the five days up smallest to largest first.":"That's not the middle of the sorted list. Line up the five days first. Go from small to large.","You found the TOTAL of the three shows — now share it out equally. Divide by how many shows there are.":"You found the TOTAL of the three shows. Now share it out the same. Divide by how many shows there are.","The mean shares the total equally: add all three counts first, then divide by the number of counts.":"The mean shares the total the same. Add all three counts first. Then divide by the number of counts.","Median 12, mean 14 — the festival node hums awake and every banner snaps to attention. One down!":"Median 12, mean 14. The fair node hums awake. Each flag stands up. One down!","The 2 grew into 8 — what factor did that? The 3 must grow by the very same factor.":"The 2 grew into 8. What factor did that? The 3 must grow by that same factor.","Distance ÷ minutes gives km per ONE minute. Try the division again.":"Distance ÷ minutes gives km per ONE minute. Try the division again.","8 : 12 keeps the ratio true, and 0.4 km per minute — Maya's legs remember every meter. Onward!":"8 : 12 keeps the ratio true. And 0.4 km per minute. Maya's legs know each meter. Onward!","Step through it: 10% of 250 first, then four of those make 40%.":"Go step by step: 10% of 250 first. Then four of those make 40%.","Careful — 30 is only HALF the crate. Walk backward to the whole.":"Look again. 30 is just HALF the crate. Go backward to the whole.","100 lanterns blaze at sunset and the gold crate holds 60. The pier glows like it remembers being saved.":"100 lamps light at sunset. The gold crate holds 60. The pier glows like it knows it was saved.","Remember the triangle is HALF its base-times-height rectangle.":"The triangle is HALF its base times height rectangle.","Fill the box: multiply all three edges, not just two.":"Fill the box: multiply all three sides, not just two.","Area 20, volume 24 — banner up, capsule buried, future kids of Brightside delighted.":"Area 20, volume 24. The flag is up. The box is buried. Kids of Brightside will love it.","Substitute first: replace n with its value, multiply, THEN add.":"Substitute first. Put in the value for n. Multiply, THEN add.","Same y on both points — count the steps along the horizontal line, across zero.":"Both points have the same y. Count the steps along the flat line, across zero.","19 wakes the code and 6 units bridge the grid. The last pattern line blazes gold across the city!":"19 wakes the code. 6 units cross the grid. The last pattern line glows gold across the city!","Lock 1 holds. Each term grows from the one before by the SAME rule every time — find it, then apply it to 40.":"Lock 1 is shut. Each term grows from the last one. It is the SAME rule each time. Find it. Then use it on 40.","Lock 2 holds. The scale must balance: what number plus 9 makes exactly 16?":"Lock 2 is shut. The scale must balance. What number plus 9 makes 16?","Lock 3 holds. A square's four sides match — the perimeter walks all four.":"Lock 3 is shut. A square's four sides match. The perimeter goes around all four.","Yes! Now head back and open that gate.":"Yes! Now go back and open that gate.","Walk the steps above again — you've got this.":"Go through the steps above again. You can do it."}}</script>
