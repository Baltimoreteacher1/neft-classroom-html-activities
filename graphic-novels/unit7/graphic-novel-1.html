  /* Wire an interactive HTML5 canvas sketchpad + coordinate/number-line stamp */
  function wireSketchpad(wrap, sketchId) {
    var box = wrap.querySelector("#" + sketchId);
    if (!box) return;
    var canvas = box.querySelector("canvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var color = "#0f172a";
    var drawing = false;
    var lastX = 0,
      lastY = 0;

    function drawBg(mode) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      if (mode === "grid") {
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 1;
        for (var x = 0; x < canvas.width; x += 20) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (var y = 0; y < canvas.height; y += 20) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      } else if (mode === "numline") {
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 2;
        var midY = Math.round(canvas.height / 2);
        ctx.beginPath();
        ctx.moveTo(24, midY);
        ctx.lineTo(canvas.width - 24, midY);
        ctx.stroke();
        for (var i = 0; i <= 10; i++) {
          var tx = 24 + ((canvas.width - 48) * i) / 10;
          ctx.beginPath();
          ctx.moveTo(tx, midY - 8);
          ctx.lineTo(tx, midY + 8);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
    drawBg("grid");

    function pt(ev) {
      var r = canvas.getBoundingClientRect();
      var cx = ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX;
      var cy = ev.touches && ev.touches[0] ? ev.touches[0].clientY : ev.clientY;
      return {
        x: ((cx - r.left) / (r.width || 1)) * canvas.width,
        y: ((cy - r.top) / (r.height || 1)) * canvas.height,
      };
    }
    function start(ev) {
      drawing = true;
      var p = pt(ev);
      lastX = p.x;
      lastY = p.y;
    }
    function move(ev) {
      if (!drawing) return;
      if (ev.cancelable) ev.preventDefault();
      var p = pt(ev);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x;
      lastY = p.y;
    }
    function stop() {
      drawing = false;
    }
    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", stop);
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", move, { passive: false });
    canvas.addEventListener("touchend", stop);

    Array.prototype.slice
      .call(box.querySelectorAll("[data-ink]"))
      .forEach(function (sw) {
        sw.addEventListener("click", function () {
          Array.prototype.slice
            .call(box.querySelectorAll("[data-ink]"))
            .forEach(function (b) {
              b.classList.remove("active");
            });
          sw.classList.add("active");
          color = sw.dataset.ink;
        });
      });
    Array.prototype.slice
      .call(box.querySelectorAll("[data-stamp]"))
      .forEach(function (st) {
        st.addEventListener("click", function () {
          drawBg(st.dataset.stamp);
          SFX_AUDIO.play("pop");
        });
      });
  }

  /* =========================================================================
     ACT RUNNER — plays an act's ordered steps:
       { type:"beats", art, alt, beats:[...] }   → panel + sequential bubbles
       { type:"challenge", ... }                 → voiced math, reply choices
     ========================================================================= */
  function runAct(act) {
    var stepIdx = 0;
    var imgEl = $("art-" + act.id);
    var speechEl = $("speech-" + act.id);
    var dotsEl = $("dots-" + act.id);
    var nextBtn = $("next-" + act.id);
    var stripEl = $("strip-" + act.id);
    var trapEl = $("trap-" + act.id);
    var chalHost = $("chal-" + act.id);
    var advBtn = $("adv-" + act.id);
    chalHost.innerHTML = "";
    if (stripEl) stripEl.innerHTML = "";
    if (trapEl) trapEl.innerHTML = "";

    function clearCallouts() {
      Array.prototype.slice
        .call($("panel-" + act.id).querySelectorAll(".callout"))
        .forEach(function (c) {
          c.remove();
        });
    }
    function setArt(file, alt) {
      if (file) {
        imgEl.src = art(file);
        imgEl.alt = txt(alt);
      }
    }

    function playStep() {
      var step = act.steps[stepIdx];
      if (!step) {
        advBtn.classList.add("show");
        return;
      }
      if (step.type === "beats") playBeats(step);
      else if (step.optional) playOptional(step);
      else playChallenge(step);
    }

    /* ---- beats ---- */
    function playBeats(step) {
      setArt(step.art, step.alt);
      clearCallouts();
      nextBtn.style.display = "";
      var bi = 0;
      var beats = tierBeats(step); // Level 0 → fewer beats
      dotsEl.innerHTML = "";
      beats.forEach(function (b, idx) {
        var dot = el("i");
        dot.style.cursor = "pointer";
        dot.title = "Jump to Beat " + (idx + 1);
        dot.addEventListener("click", function () {
          bi = idx;
          renderBeat();
        });
        dotsEl.appendChild(dot);
      });

      function renderStripAndTrap() {
        if (stripEl) {
          stripEl.innerHTML = "";
          beats.forEach(function (b, idx) {
            var spk = speaker(b.who);
            var cell = el(
              "button",
              "strip-cell" +
                (idx === bi ? " current" : "") +
                (b.misconception ? " misc-cell" : ""),
            );
            cell.type = "button";
            var avSvg =
              spk.role === "narrator"
                ? '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:16px">&#128225;</div>'
                : renderPortraitSVG(b.who, b.misconception ? "oops" : "hero");
            var shortTxt = stripTags(b.en || "");
            if (shortTxt.length > 68) shortTxt = shortTxt.slice(0, 65) + "...";
            cell.innerHTML =
              '<span class="strip-av" aria-hidden="true">' +
              avSvg +
              "</span>" +
              '<span class="strip-txt"><b>Panel ' +
              (idx + 1) +
              " &middot; " +
              stripTags(spk.name || "Narrator") +
              (b.misconception ? " &#9889;" : "") +
              "</b>" +
              shortTxt +
              "</span>";
            cell.addEventListener("click", function () {
              bi = idx;
              SFX_AUDIO.play("pop");
              renderBeat();
            });
            stripEl.appendChild(cell);
          });
        }

        if (trapEl) {
          trapEl.innerHTML = "";
          var curBeat = beats[bi];
          if (curBeat && curBeat.misconception) {
            var nextMath = null;
            (act.steps || []).forEach(function (st) {
              if (!nextMath && st.type !== "beats" && !isComprehension(st)) {
                nextMath = st;
              }
            });
            var trapExplain =
              (nextMath &&
                nextMath.help &&
                nextMath.help.conceptual &&
                nextMath.help.conceptual.en) ||
              (curBeat.callout && curBeat.callout.en) ||
              "Look closely at the operation and units in this panel—shortcuts that skip the mathematical structure lead to a classic trap!";
            var bar = el("div", "trap-buster-bar");
            bar.innerHTML =
              '<div class="trap-buster-head">' +
              '<span class="trap-badge">&#9995; HOLD IT! Math Trap Detected in Panel ' +
              (bi + 1) +
              "</span>" +
              '<button type="button" class="trap-reveal-btn" data-trap-btn>&#128269; Inspect Why This Shortcut Fails (+20 XP)</button>' +
              "</div>" +
              '<div class="trap-card-body" data-trap-body><b>&#9889; Trap Analysis:</b> ' +
              trapExplain +
              "</div>";
            bar
              .querySelector("[data-trap-btn]")
              .addEventListener("click", function () {
                var body = bar.querySelector("[data-trap-body]");
                body.classList.toggle("open");
                addXP(20, "trap-" + act.id + "-" + bi);
                SFX_AUDIO.play("zap");
              });
            trapEl.appendChild(bar);
          }
        }
      }

      function renderBeat() {
        var beat = beats[bi];
        speechEl.innerHTML = "";
        speechEl.appendChild(bubble(beat));
        clearCallouts();
        if (beat.callout) {
          addCallout(beat.callout);
        } else if (beat.misconception) {
          addCallout({
            x: 78,
            y: 22,
            icon: "⚡",
            title: "Misconception Alert!",
            en: "Watch closely! A character just made a classic math slip—get ready to spot and fix it in the challenge!",
            es: "¡Atención! Un personaje acaba de cometer un error clásico de matemáticas.",
          });
        }
        Array.prototype.slice.call(dotsEl.children).forEach(function (d, k) {
          d.classList.toggle("on", k <= bi);
        });
        var last = bi === beats.length - 1;
        nextBtn.innerHTML = last
          ? step.lastLabel || "Continue &#9654;"
          : "Next &#9654;";
        renderStripAndTrap();
      }
      nextBtn.onclick = function () {
        SFX_AUDIO.play("pop");
        if (bi < beats.length - 1) {
          bi++;
          renderBeat();
        } else {
          stepIdx++;
          playStep();
        }
      };
      renderBeat();
    }
    function addCallout(co) {
      var c = el("button", "callout", co.icon || "!");
      c.style.left = (co.x || 50) + "%";
      c.style.top = (co.y || 50) + "%";
      c.setAttribute("aria-label", "Callout: " + stripTags(co.en));
      c.addEventListener("click", function () {
        openPop(c, co.title || "", co.en, co.es);
      });
      $("panel-" + act.id).appendChild(c);
    }

    /* ---- challenge: gating (must solve to advance) ---- */
    function playChallenge(step) {
      renderCard(step, false);
      var onSolve = function () {
        fire("onSolve", step);
        if (step.solveArt) setArt(step.solveArt, step.solveAlt);
        if (step.solveBeat) {
          speechEl.innerHTML = "";
          speechEl.appendChild(bubble(step.solveBeat));
        }
        stepIdx++;
        // small beat so the success feedback is read before the next panel
        setTimeout(playStep, 400);
      };
      var grp = "choices-" + act.id + "-" + step.id;
      if (
        step.interaction &&
        step.interaction !== "mc" &&
        INTERACTIONS[step.interaction]
      ) {
        // render interaction FIRST so any .choice it creates exists for wireChoices
        INTERACTIONS[step.interaction].render(step, $(grp), onSolve);
      }
      wireChoices(step, act, onSolve);
    }

    /* ---- challenge: optional bonus (does NOT gate; still scored) ----
       Renders this and any consecutive optional steps, then reveals advance. */
    function playOptional(step) {
      renderCard(step, true);
      var onSolve = function () {
        fire("onSolve", step);
        if (step.solveBeat) {
          speechEl.innerHTML = "";
          speechEl.appendChild(bubble(step.solveBeat));
        }
      };
      var grp = "choices-" + act.id + "-" + step.id;
      if (
        step.interaction &&
        step.interaction !== "mc" &&
        INTERACTIONS[step.interaction]
      ) {
        // render interaction FIRST so any .choice it creates exists for wireChoices
        INTERACTIONS[step.interaction].render(step, $(grp), onSolve);
      }
      wireChoices(step, act, onSolve);
      stepIdx++;
      var nxt = act.steps[stepIdx];
      if (nxt && nxt.optional) playOptional(nxt);
      else advBtn.classList.add("show");
    }

    /* ---- shared challenge-card renderer ---- */
    function renderCard(step, optional) {
      if (step.art) setArt(step.art, step.alt);
      clearCallouts();
      nextBtn.style.display = "none";
      dotsEl.innerHTML = "";
      if (stripEl) stripEl.innerHTML = "";
      if (trapEl) trapEl.innerHTML = "";
      // the question is VOICED by a character, over the panel
      if (step.ask) {
        speechEl.innerHTML = "";
        speechEl.appendChild(
          bubble({
            who: step.ask.who,
            en: step.ask.en,
            es: step.ask.es,
            vocab: step.ask.vocab,
            misconception: step.ask.misconception,
            pos: step.ask.pos,
          }),
        );
        if (step.ask.callout) addCallout(step.ask.callout);
      }
      var wrap = el("div", "challenge" + (optional ? " bonus" : ""));
      wrap.id = "chal-" + act.id + "-" + step.id;

      var bonusHeader = "";
      if (optional) {
        bonusHeader =
          '<span class="bonus-tag">' +
          (step.bonusTag || "&#11088; Bonus Challenge") +
          "</span>" +
          '<p class="prompt" style="font-size:0.82rem;color:var(--muted);' +
          'margin:6px 0 12px">Optional — try it or press the button to move on.</p>';
      }

      var qText = "";
      if (step.ask) {
        var whoName = "";
        if (step.ask.who && S.cast && S.cast[step.ask.who]) {
          whoName = S.cast[step.ask.who].name;
        }
        qText =
          '<div class="chal-question-text">' +
          (whoName
            ? '<span class="chal-speaker">' + whoName + ":</span> "
            : "") +
          injectVocab(txt(step.ask.en), step.ask.vocab) +
          (step.ask.es
            ? '<div class="es" style="margin-top:6px;font-style:italic;color:var(--muted)">' +
              step.ask.es +
              "</div>"
            : "") +
          "</div>";
      }

      var comp = isComprehension(step);
      var sketchId = "sketch-" + act.id + "-" + step.id;
      var tools = '<div class="chal-tools">';
      if (step.hint) {
        tools +=
          '<button type="button" class="toolbtn" data-fold="hint-' +
          step.id +
          '" aria-expanded="false">&#128161; Need a hint?</button>';
      }
      if (step.frame) {
        // Level 0: the sentence frame is always visible (button pre-expanded).
        tools +=
          '<button type="button" class="toolbtn" data-fold="coach-' +
          step.id +
          '" aria-expanded="' +
          (IS_L0 ? "true" : "false") +
          '">&#9997;&#65039; Writing coach</button>';
      }
      if (!comp) {
        tools +=
          '<button type="button" class="toolbtn" data-fold="' +
          sketchId +
          '" aria-expanded="false">&#127912; Margin Sketchpad</button>';
      }
      tools += "</div>";
      var folds = "";
      if (step.hint) {
        folds +=
          '<div class="foldout" id="hint-' +
          step.id +
          '"><b>Hint:</b> ' +
          step.hint.en +
          (step.hint.es
            ? '<div class="es" style="margin-top:6px;' +
              'font-style:italic;color:#cdb89a">' +
              step.hint.es +
              "</div>"
            : "") +
          "</div>";
      }
      if (step.frame) {
        folds +=
          '<div class="foldout coach' +
          (IS_L0 ? " show" : "") +
          '" id="coach-' +
          step.id +
          '"><b>Sentence frame:</b> ' +
          step.frame.en +
          (step.frame.es
            ? '<div class="es" style="margin-top:6px;font-style:' +
              'italic;color:#9fc0ef">' +
              step.frame.es +
              "</div>"
            : "") +
          "</div>";
      }
      if (!comp) {
        folds +=
          '<div class="gn-sketch-wrap" id="' +
          sketchId +
          '">' +
          '<div class="gn-sketch-toolbar">' +
          '<div style="display:flex;gap:6px;align-items:center">' +
          '<button type="button" class="swatch-btn active" data-ink="#0f172a" style="background:#0f172a" aria-label="Black ink"></button>' +
          '<button type="button" class="swatch-btn" data-ink="#1d4ed8" style="background:#1d4ed8" aria-label="Blue ink"></button>' +
          '<button type="button" class="swatch-btn" data-ink="#b42318" style="background:#b42318" aria-label="Red ink"></button>' +
          '<button type="button" class="swatch-btn" data-ink="#047857" style="background:#047857" aria-label="Green ink"></button>' +
          "</div>" +
          '<div style="display:flex;gap:6px">' +
          '<button type="button" class="gn-lab-btn" data-stamp="grid">&#128208; Grid</button>' +
          '<button type="button" class="gn-lab-btn" data-stamp="numline">&#128207; Number Line</button>' +
          '<button type="button" class="gn-lab-btn" data-stamp="clear">&#129529; Clear</button>' +
          "</div>" +
          "</div>" +
          '<canvas class="gn-sketch-canvas" width="460" height="150"></canvas>' +
          "</div>";
      }

      var roleplayHtml = "";
      if (!comp) {
        var mentorKey = null;
        Object.keys(S.cast || {}).forEach(function (k) {
          if (S.cast[k].role === "specialist" || S.cast[k].role === "companion") {
            if (!mentorKey || S.cast[k].role === "specialist") mentorKey = k;
          }
        });
        var mentor = mentorKey ? S.cast[mentorKey] : { name: "Field Coach" };
        var mentorSvg = mentorKey ? renderPortraitSVG(mentorKey, "think") : "";
        var move1 =
          (step.help && step.help.conceptual && step.help.conceptual.en) ||
          "Model the problem visually first using the Interactive Math Lab on the left!";
        var move2 =
          (step.help && step.help.procedural && step.help.procedural.en) ||
          (step.hint && step.hint.en) ||
          "Set up the mathematical rule or inverse operation step-by-step before picking your reply.";
        var move3 =
          (step.help && step.help.example && step.help.example.en) ||
          "Test your answer with a quick benchmark estimate to eliminate distractor traps.";
        roleplayHtml =
          '<div class="hero-move-bar" data-roleplay>' +
          '<div class="hero-move-title">&#127917; Choose Your Hero&rsquo;s Opening Strategy (+10 XP)</div>' +
          '<div class="hero-move-btns">' +
          '<button type="button" class="hero-move-btn" data-move="0">&#128269; Model Visually</button>' +
          '<button type="button" class="hero-move-btn" data-move="1">&#128208; Set Up Rule / Operation</button>' +
          '<button type="button" class="hero-move-btn" data-move="2">&#9889; Benchmark &amp; Trap Check</button>' +
          "</div>" +
          '<div class="hero-move-reply" data-move-reply>' +
          '<span class="mini-av" aria-hidden="true">' +
          mentorSvg +
          "</span>" +
          '<div data-move-text></div>' +
          "</div>" +
          "</div>";
      }

      var groupAttr = comp
        ? ' data-score-group="reading" data-standard="' +
          (step.standard || "") +
          '"'
        : "";
      var label = comp
        ? '<div class="reading-tag"><span class="rt-skill">' +
          SKILL_LABEL(step.skill) +
          "</span>" +
          '<span class="rt-std">' +
          (step.standard || "") +
          "</span>" +
          (step.dok ? '<span class="rt-dok">DOK ' + step.dok + "</span>" : "") +
          "</div>"
        : "";
      var choices =
        label +
        roleplayHtml +
        '<div class="reply-label">' +
        (comp ? "Choose the best answer" : "Choose your reply") +
        "</div>" +
        '<div class="choices" id="choices-' +
        act.id +
        "-" +
        step.id +
        '"' +
        groupAttr +
        ">";
      if (
        !step.interaction ||
        step.interaction === "mc" ||
        !INTERACTIONS[step.interaction]
      ) {
        tierChoices(step).forEach(function (c, ci) {
          choices +=
            '<button class="choice" data-correct="' +
            !!c.correct +
            '" data-cidx="' +
            ci +
            '">' +
            c.en +
            (c.tree ? '<span class="tree">' + c.tree + "</span>" : "") +
            (c.es ? '<span class="es">' + c.es + "</span>" : "") +
            "</button>";
        });
      }
      choices += "</div>";

      wrap.innerHTML =
        bonusHeader +
        '<div class="chal-grid">' +
        '<div class="chal-left">' +
        qText +
        '<div data-lab-slot></div>' +
        tools +
        folds +
        "</div>" +
        '<div class="chal-right">' +
        choices +
        '<div class="feedback" id="fb-' +
        act.id +
        "-" +
        step.id +
        '"></div>' +
        "</div>" +
        "</div>";
      if (!comp) {
        var labSlot = wrap.querySelector("[data-lab-slot]");
        if (labSlot) {
          var labEl = attachLabFooter(buildMathLab(step, act), step, act);
          labSlot.appendChild(labEl);
        }
        wireSketchpad(wrap, sketchId);
        var rp = wrap.querySelector("[data-roleplay]");
        if (rp) {
          var moveTips = [move1, move2, move3];
          rp.addEventListener("click", function (ev) {
            var mb = ev.target.closest("[data-move]");
            if (!mb) return;
            Array.prototype.slice
              .call(rp.querySelectorAll("[data-move]"))
              .forEach(function (b) {
                b.classList.remove("active");
              });
            mb.classList.add("active");
            var rep = rp.querySelector("[data-move-reply]");
            var rtxt = rp.querySelector("[data-move-text]");
            rep.classList.add("open");
            rtxt.innerHTML =
              "<b>" +
              stripTags(mentor.name) +
              ":</b> " +
              moveTips[+mb.dataset.move];
            addXP(10, "roleplay-" + act.id + "-" + step.id);
            SFX_AUDIO.play("pop");
          });
        }
      }
      chalHost.appendChild(wrap);
      wrap.scrollIntoView({ behavior: "smooth", block: "center" });
      wireFolds(wrap);
    }

    playStep();

    /* advance button → unlock next chapter / finish */
    advBtn.onclick = function () {
      state[act.id] = true;
      updateProgress();
      refreshLocks();
      var i = S.acts.indexOf(act);
      if (i < S.acts.length - 1) showScene(S.acts[i + 1].id);
      else showComplete();
    };
  }

  function wireFolds(root) {
    Array.prototype.slice
      .call(root.querySelectorAll(".toolbtn"))
      .forEach(function (b) {
        b.addEventListener("click", function () {
          var f = $(b.dataset.fold);
          var open = f.classList.toggle("show");
          b.setAttribute("aria-expanded", open ? "true" : "false");
        });
      });
  }

  /* ---- escalating, misconception-targeted feedback ----
     Mirrors Axiom City's "Ask VEX" ladder. Each wrong attempt shows MORE help,
     never the answer:
       1st miss  → conceptual nudge (the per-choice `why`, or step.help.conceptual)
       2nd miss  → procedural hint  (step.help.procedural, or the existing step.hint)
       3rd+ miss → worked example with DIFFERENT numbers (step.help.example)
     A choice may carry its own `why` so each distractor is remediated to ITS
     misconception. Falls back to step.badEn so legacy stories are unchanged. */
  function escalatingFeedback(step, choice, attempts) {
    var help = step.help || {};
    var parts = [];
    // Tier 1: this distractor's own "why", else a conceptual reframe.
    if (choice && choice.why) {
      parts.push({ en: choice.why.en || choice.why, es: choice.why.es });
    } else if (help.conceptual) {
      parts.push(help.conceptual);
    }
    // Tier 2: procedural steps (reuse the hint if no dedicated procedural help).
    if (attempts >= 2) {
      var proc = help.procedural || step.hint;
      if (proc) parts.push(proc);
    }
    // Tier 3: a worked example with DIFFERENT numbers (never the answer).
    if (attempts >= 3 && help.example) {
      parts.push(help.example);
    }
    if (!parts.length) {
      // No tiered data authored → preserve the legacy single message.
      return {
        en: step.badEn || "Not quite — look back at the panel.",
        es: step.badEs || "",
      };
    }
    var en = parts
      .map(function (p) {
        return p.en || p;
      })
      .join(" ");
    var es = parts
      .map(function (p) {
        return p.es || "";
      })
      .filter(Boolean)
      .join(" ");
    return { en: en, es: es };
  }

  function wireChoices(step, act, onSolve) {
    var groupId = "choices-" + act.id + "-" + step.id;
    var fbId = "fb-" + act.id + "-" + step.id;
    var solved = false;
    var attempts = 0; // wrong-answer counter for this group (escalating help)
    Array.prototype.slice
      .call($(groupId).querySelectorAll(".choice"))
      .forEach(function (btn, idx) {
        btn.addEventListener("click", function () {
          if (solved) return;
          var correct = btn.dataset.correct === "true";
          var fb = $(fbId);
          if (correct) {
            solved = true;
            btn.classList.add("correct");
            addXP(50, "solve-" + act.id + "-" + step.id);
            SFX_AUDIO.play("fanfare");
            fb.className = "feedback show good";
            fb.innerHTML =
              (step.goodEn || "✓ Correct.") +
              (step.goodEs
                ? '<span class="es">' + step.goodEs + "</span>"
                : "");
            Array.prototype.slice
              .call($(groupId).querySelectorAll(".choice"))
              .forEach(function (b) {
                b.disabled = true;
              });
            if (onSolve) onSolve();
          } else {
            attempts++;
            SFX_AUDIO.play("warn");
            btn.classList.add("wrong");
            btn.disabled = true;
            var rendered = tierChoices(step);
            var choice = rendered && rendered[+btn.dataset.cidx];
            var msg = escalatingFeedback(step, choice, attempts);
            fb.className = "feedback show bad";
            fb.innerHTML =
              msg.en + (msg.es ? '<span class="es">' + msg.es + "</span>" : "");
          }
        });
      });
  }

  /* ---- master-rank challenge on the complete scene ---- */
  function wireMaster() {
    var group = $("choicesComplete");
    if (!group || group.dataset.wired) return;
    group.dataset.wired = "1";
    var fb = $("fbComplete");
    var solved = false;
    var m = S.complete.master || {};
    Array.prototype.slice
      .call(group.querySelectorAll(".choice"))
      .forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (solved) return;
          var correct = btn.dataset.correct === "true";
          if (correct) {
            solved = true;
            btn.classList.add("correct");
            addXP(75, "solve-master");
            SFX_AUDIO.play("fanfare");
            renderTradingDeck();
            fb.className = "feedback show good";
            fb.style.display = "block";
            fb.innerHTML =
              m.goodEn ||
              "&#127942; <b>Master Rank Certified!</b> Perfect work! &#127775;";
            Array.prototype.slice
              .call(group.querySelectorAll(".choice"))
              .forEach(function (b) {
                b.disabled = true;
              });
            var h2 = document.querySelector("#scene-complete h2");
            if (h2 && m.certifyTitle) h2.innerHTML = m.certifyTitle;
          } else {
            SFX_AUDIO.play("warn");
            btn.classList.add("wrong");
            btn.disabled = true;
            fb.className = "feedback show bad";
            fb.style.display = "block";
            fb.innerHTML =
              m.badEn || "&#10060; Not quite. Review and try another option!";
          }
        });
      });
  }

  /* ---------- go ---------- */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", build);
  } else {
    build();
  }
})();

  <script src="/assets/nt-results.js"></script>
  <script>
  /* Graphic-novel completion tracking -> NTResults (Neft Teacher). Unchanged. */
  (function () {
    "use strict";
    var FIRED = false;
    var complete = document.getElementById("scene-complete");
    if (!complete || typeof NTResults === "undefined") return;
    function studentName() {
      try {
        var k = "nt_gn_student";
        var n = localStorage.getItem(k);
        if (n && n.trim()) return n.trim();
        n = window.prompt("Type your name so your teacher can see you finished:", "");
        n = (n || "").trim();
        if (n) { try { localStorage.setItem(k, n); } catch (e) {} }
        return n || "Student";
      } catch (e) { return "Student"; }
    }
    function score() {
      var groups = Array.prototype.slice
        .call(document.querySelectorAll(".choices"))
        .filter(function (g) { return g.id !== "choicesComplete"; });
      function tally(list) {
        var total = list.length;
        var correct = list.filter(function (g) { return g.querySelector(".choice.correct"); }).length;
        return { correct: correct, total: total };
      }
      var reading = groups.filter(function (g) { return g.getAttribute("data-score-group") === "reading"; });
      var math = groups.filter(function (g) { return g.getAttribute("data-score-group") !== "reading"; });
      return { math: tally(math), reading: tally(reading) };
    }
    function savedNote() {
      if (document.getElementById("nt-saved-note")) return;
      var p = document.createElement("p");
      p.id = "nt-saved-note";
      p.setAttribute("role", "status");
      p.style.cssText = "margin-top:14px;font-size:0.9rem;color:#7bdcb5;font-weight:600;";
      p.textContent = "✓ Results saved for your teacher.";
      complete.insertBefore(p, complete.querySelector(".restart") || null);
    }
    function record() {
      if (FIRED) return; FIRED = true;
      var s = score();
      var sections = [{ name: "Math", correct: s.math.correct, total: s.math.total }];
      var readingStd = window.GN_STORY.meta.readingStandard || null;
      if (s.reading.total > 0)
        sections.push({ name: "Reading Comprehension", correct: s.reading.correct, total: s.reading.total, standard: readingStd });
      try {
        NTResults.finish({
          student: studentName(),
          assessment: window.GN_STORY.meta.assessment,
          standard: window.GN_STORY.meta.standard,
          level: String(window.GN_STORY.meta.version),
          sections: sections,
          correct: s.math.correct + s.reading.correct,
          total: s.math.total + s.reading.total,
          download: false,
        });
      } catch (e) {}
      savedNote();
    }
    function visible() {
      return complete.classList.contains("show") || complete.classList.contains("active");
    }
    if (visible()) record();
    var mo = new MutationObserver(function () { if (visible()) record(); });
    mo.observe(complete, { attributes: true, attributeFilter: ["class"] });
  })();
  </script>
