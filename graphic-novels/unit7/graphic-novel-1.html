<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphic Novel #1 · Graphic Novel</title>
    <style>
/* ===========================================================================
   Neft Teacher · Graphic-Novel Engine  ·  gn-engine.css
   COMIC-BOOK theme: bright cream "paper", thick near-black borders, hard offset
   shadows, gold uppercase tags, white name-tag speech bubbles, bold sans.
   Matches the Data Detectives / Prism City curriculum comics. One restyle here
   re-skins every engine novel (units 1-10 + lessons) at once.
   Accessibility: WCAG-AA, resizable text, 48px targets, gold focus rings,
   reduced-motion, functional at 320px.
   =========================================================================== */
:root {
  --ink: #121826;
  --paper: #fff9ef;
  --panel: #fffdf8;
  --line: #0f172a; /* comic outline (near-black) */
  --gold: #f2b705;
  --blue: #1d4ed8;
  --red: #b42318;
  --green: #047857;
  --muted: #475569;
  --bubble: #ffffff;
  --bubble-ink: #121826;
  --accent: #1d4ed8; /* per-unit signature (stories may override) */
  --accent2: #b42318;
  --ok: #047857;
  --bad: #b42318;
  --sh: 4px 4px 0 rgba(15, 23, 42, 0.18); /* hard comic shadow */
  --sh-sm: 3px 3px 0 var(--line);
  --font: Arial, Helvetica, "Segoe UI", system-ui, sans-serif;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  scroll-behavior: smooth;
}
html,
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.5;
}
/* cream comic "paper" grid */
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    linear-gradient(90deg, rgba(17, 24, 39, 0.045) 1px, transparent 1px),
    linear-gradient(rgba(17, 24, 39, 0.045) 1px, transparent 1px), var(--paper);
  background-size: 28px 28px;
}
img {
  max-width: 100%;
  display: block;
}
a {
  color: inherit;
}
:focus-visible {
  outline: 4px solid var(--gold);
  outline-offset: 3px;
}

/* ---- Top bar ---- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--paper);
  border-bottom: 4px solid var(--line);
}
.topbar-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.home {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  text-decoration: none;
  color: var(--ink);
  font-size: 0.85rem;
  font-weight: 800;
  border: 3px solid var(--line);
  border-radius: 6px;
  padding: 0 12px;
  background: #fff;
  box-shadow: var(--sh-sm);
}
.home:hover {
  background: var(--gold);
}
.title {
  font-size: 1.05rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.01em;
}
.title .v {
  color: var(--red);
}
.progress-wrap {
  flex: 1;
  min-width: 160px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.progress {
  flex: 1;
  height: 14px;
  background: #fff;
  border: 3px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.progress > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--gold);
  border-right: 3px solid var(--line);
  transition: width 0.4s ease;
}
.progress-label {
  font-size: 0.8rem;
  color: var(--ink);
  font-weight: 900;
  white-space: nowrap;
}
.txtsize {
  min-height: 44px;
  min-width: 44px;
  border: 3px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 6px;
  box-shadow: var(--sh-sm);
  font-weight: 900;
  cursor: pointer;
  padding: 0 10px;
}
.txtsize:hover {
  background: var(--gold);
}
body[data-text="lg"] {
  font-size: 1.12rem;
}
body[data-text="xl"] {
  font-size: 1.26rem;
}

/* ---- Tabs (chapter chips) ---- */
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 14px;
  max-width: 1080px;
  margin: 0 auto;
  width: 100%;
  scrollbar-width: thin;
}
.tab {
  flex: 0 0 auto;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  border: 3px solid var(--line);
  color: var(--ink);
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 0.9rem;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--font);
  box-shadow: var(--sh-sm);
}
.tab[aria-selected="true"] {
  background: var(--accent);
  color: #fff;
}
.tab.locked {
  opacity: 0.55;
  cursor: not-allowed;
  box-shadow: none;
}
.tab .lk {
  font-size: 0.8rem;
}

/* ---- Stage ---- */
main {
  flex: 1;
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 16px 14px;
}
.scene {
  display: none;
}
.scene.active {
  display: block;
  animation: fade 0.3s ease;
}
@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  .scene.active {
    animation: none !important;
    transition: none !important;
  }
  html {
    scroll-behavior: auto;
  }
}

.scene-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.scene-head h2 {
  font-size: clamp(1.4rem, 4vw, 2rem);
  text-transform: uppercase;
  line-height: 1;
}
.scene-head .act {
  display: inline-block;
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--gold);
  border: 3px solid var(--line);
  border-radius: 6px;
  padding: 5px 9px;
}

/* ===========================================================================
   PANEL — framed comic panel (photo art inside a thick black border)
   =========================================================================== */
.panel {
  position: relative;
  border: 4px solid var(--line);
  background: #fff;
  border-radius: 4px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  box-shadow: 8px 8px 0 var(--line);
}
.panel > img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.panel::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgba(8, 12, 28, 0) 40%,
    rgba(8, 12, 28, 0.45) 100%
  );
}
.speech {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 8px;
  padding: 14px;
}
.speech > * {
  pointer-events: auto;
}

/* ---- Speaking character "stage" figure pinned to the panel ---- */
.speaker-fig {
  position: absolute;
  bottom: 0;
  z-index: 1;
  height: 86%;
  width: auto;
  max-width: 46%;
  object-fit: contain;
  object-position: bottom center;
  pointer-events: none;
  filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.5));
  animation: figrise 0.35s ease;
}
.speaker-fig.left {
  left: 6px;
}
.speaker-fig.right {
  right: 6px;
}
@keyframes figrise {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ---- Speech bubble (white, name tag, hard shadow) ---- */
.bubble {
  background: var(--bubble);
  color: var(--bubble-ink);
  border: 3px solid var(--line);
  border-radius: 10px;
  padding: 11px 13px;
  position: relative;
  z-index: 2;
  max-width: min(520px, 80%);
  font-weight: 700;
  box-shadow: var(--sh);
}
.bubble.left {
  align-self: flex-start;
}
.bubble.right {
  align-self: flex-end;
}
.bubble.center {
  align-self: center;
}
.bubble::before {
  content: "";
  position: absolute;
  bottom: -13px;
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 13px solid var(--line);
}
.bubble::after {
  content: "";
  position: absolute;
  bottom: -8px;
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 9px solid var(--bubble);
}
.bubble.left::before {
  left: 24px;
}
.bubble.left::after {
  left: 28px;
}
.bubble.right::before {
  right: 24px;
}
.bubble.right::after {
  right: 28px;
}
.bubble.center::before {
  left: 50%;
  transform: translateX(-50%);
}
.bubble.center::after {
  left: 50%;
  transform: translateX(-50%);
}
.bubble .who {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-weight: 900;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 5px;
  color: var(--muted);
}
.bubble .who .av {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  flex: 0 0 auto;
  border: 2px solid var(--line);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
  font-weight: 900;
  color: #fff;
  overflow: hidden;
  background: var(--spk, var(--blue));
}
.bubble .who .av img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.bubble .who .me {
  font-size: 0.62rem;
  color: var(--red);
  letter-spacing: 0.06em;
}
.bubble .en {
  font-size: 1.04rem;
}
.bubble .es {
  font-size: 0.9rem;
  color: var(--muted);
  margin-top: 6px;
  font-style: italic;
  font-weight: 700;
}
.bubble.caption {
  background: var(--ink);
  color: #fff;
  border-color: var(--line);
  max-width: min(640px, 94%);
}
.bubble.caption::after {
  border-top-color: var(--ink);
}
.bubble.caption .who {
  color: var(--gold);
}
.bubble.caption .es {
  color: #cbd5e1;
}
.bubble.misc {
  box-shadow:
    0 0 0 3px var(--gold),
    var(--sh);
}

/* ---- Inline vocab tag (pill) ---- */
.vocab-tag {
  font: inherit;
  font-weight: 900;
  color: var(--blue);
  cursor: pointer;
  background: #eff6ff;
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 0 8px;
  -webkit-tap-highlight-color: transparent;
}
.vocab-tag:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 1px;
}

/* ---- Popover ---- */
.gn-pop {
  position: fixed;
  z-index: 60;
  max-width: 300px;
  background: #fff;
  color: var(--ink);
  border: 3px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  box-shadow: 8px 8px 0 var(--line);
}
.gn-pop h4 {
  font-size: 1.05rem;
  margin-bottom: 4px;
  color: var(--red);
  text-transform: uppercase;
}
.gn-pop .es {
  font-style: italic;
  color: var(--muted);
  font-size: 0.9rem;
  margin-top: 6px;
  font-weight: 700;
}
.gn-pop .x {
  position: absolute;
  top: 4px;
  right: 6px;
  border: none;
  background: none;
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
  color: var(--ink);
  min-width: 36px;
  min-height: 36px;
}
.gn-pop-back {
  position: fixed;
  inset: 0;
  z-index: 55;
  background: rgba(15, 23, 42, 0.25);
}

/* ---- Callout dot ---- */
.callout {
  position: absolute;
  z-index: 4;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--gold);
  color: var(--ink);
  border: 3px solid var(--line);
  font-weight: 900;
  cursor: pointer;
  transform: translate(-50%, -50%);
  box-shadow: var(--sh-sm);
}
.callout:focus-visible {
  outline: 3px solid var(--line);
  outline-offset: 2px;
}

/* ---- Beat controls ---- */
.dlg-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
  gap: 10px;
  flex-wrap: wrap;
}
.dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.dots i {
  width: 12px;
  height: 12px;
  border: 2px solid var(--line);
  border-radius: 50%;
  background: #fff;
}
.dots i.on {
  background: var(--gold);
}
.next {
  min-height: 48px;
  background: var(--accent);
  color: #fff;
  border: 3px solid var(--line);
  border-radius: 6px;
  padding: 10px 18px;
  font-weight: 900;
  font-size: 1rem;
  cursor: pointer;
  font-family: var(--font);
  text-transform: uppercase;
  box-shadow: var(--sh-sm);
}
.next:hover {
  transform: translate(-1px, -1px);
  box-shadow: 4px 4px 0 var(--line);
}
.next[disabled] {
  opacity: 0.4;
  cursor: default;
  box-shadow: none;
}

/* ===========================================================================
   CHALLENGE — math voiced by a character; choices = protagonist replies
   =========================================================================== */
.challenge {
  margin-top: 16px;
  background: #fff7ed;
  border: 3px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  box-shadow: var(--sh);
}
.chal-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.chal-question-text {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.45;
  margin-bottom: 12px;
}
.chal-speaker {
  color: var(--red);
  text-transform: uppercase;
  font-weight: 900;
  letter-spacing: 0.04em;
  margin-right: 4px;
}
@media (min-width: 768px) {
  .chal-grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 24px;
    align-items: start;
  }
  .chal-left {
    border-right: 2px dashed rgba(15, 23, 42, 0.15);
    padding-right: 24px;
  }
}
.chal-tools {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 0 0 12px;
}
.toolbtn {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  border: 3px solid var(--line);
  color: var(--ink);
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 0.9rem;
  font-weight: 800;
  cursor: pointer;
  font-family: var(--font);
  box-shadow: var(--sh-sm);
}
.toolbtn[aria-expanded="true"] {
  background: var(--gold);
}
.foldout {
  font-size: 0.95rem;
  color: var(--ink);
  background: #fffdf8;
  border: 3px solid var(--line);
  border-radius: 6px;
  padding: 11px 14px;
  margin: 0 0 12px;
  display: none;
  font-weight: 700;
}
.foldout.show {
  display: block;
  animation: fade 0.2s ease;
}
.foldout.coach {
  background: #eff6ff;
}
.foldout b {
  color: var(--red);
}
.foldout.coach b {
  color: var(--blue);
}

/* Level 0 (IEP / most-supported) tier: calmer, roomier scaffolding.
   Driven by body[data-tier="0"], set by the engine from meta.tier. The
   sentence-frame coach is rendered already-open; here we make that obvious
   and give the always-visible frame a little more breathing room. */
body[data-tier="0"] .foldout.coach {
  border-color: var(--blue);
  border-style: solid;
}
body[data-tier="0"] .choice {
  font-size: 1.05rem;
}

.reply-label {
  display: inline-block;
  font-size: 0.74rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink);
  background: var(--gold);
  border: 3px solid var(--line);
  border-radius: 6px;
  padding: 4px 9px;
  margin-bottom: 10px;
}
.choices {
  display: grid;
  gap: 10px;
}
.choice {
  position: relative;
  min-height: 48px;
  text-align: left;
  background: #fff;
  border: 3px solid var(--line);
  color: var(--ink);
  border-radius: 8px;
  padding: 12px 14px 12px 30px;
  font-size: 1rem;
  cursor: pointer;
  font-family: var(--font);
  font-weight: 700;
  box-shadow: var(--sh-sm);
}
.choice::before {
  content: "\201C";
  position: absolute;
  left: 9px;
  top: 6px;
  color: var(--blue);
  font-size: 1.2rem;
  font-weight: 900;
}
.choice:hover {
  transform: translate(-1px, -1px);
  box-shadow: 4px 4px 0 var(--line);
  background: #fffdf8;
}
.choice:focus-visible {
  outline: 4px solid var(--gold);
  outline-offset: 2px;
}
.choice.correct {
  border-color: var(--green);
  background: #ecfdf5;
}
.choice.wrong {
  border-color: var(--red);
  background: #fef2f2;
}
.choice .tree {
  font-family: "Courier New", monospace;
  white-space: pre-wrap;
  font-size: 0.92rem;
  line-height: 1.35;
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-weight: 700;
}
.choice .es {
  display: block;
  font-size: 0.85rem;
  color: var(--muted);
  font-style: italic;
  margin-top: 4px;
}
.feedback {
  margin-top: 12px;
  border: 3px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 1rem;
  display: none;
  font-weight: 700;
}
.feedback.show {
  display: block;
  animation: fade 0.2s ease;
}
.feedback.good {
  background: #ecfdf5;
  border-color: var(--green);
  color: #064e3b;
}
.feedback.bad {
  background: #fef2f2;
  border-color: var(--red);
  color: #7f1d1d;
}
.feedback .es {
  display: block;
  font-style: italic;
  margin-top: 4px;
  font-size: 0.9rem;
  opacity: 0.85;
}

.scene-foot {
  margin-top: 18px;
  display: flex;
  justify-content: flex-end;
}
.advance {
  min-height: 50px;
  background: var(--gold);
  color: var(--ink);
  border: 3px solid var(--line);
  border-radius: 6px;
  padding: 12px 22px;
  font-weight: 900;
  font-size: 1.05rem;
  cursor: pointer;
  display: none;
  font-family: var(--font);
  text-transform: uppercase;
  box-shadow: var(--sh);
}
.advance.show {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  animation: fade 0.3s ease;
}
.advance:hover {
  transform: translate(-1px, -1px);
  box-shadow: 5px 5px 0 var(--line);
}

/* ---- Cover ---- */
.cover-card {
  text-align: center;
}
.cover-card .panel {
  aspect-ratio: 16 / 9;
  margin-bottom: 18px;
}
.cover-card h2 {
  font-size: clamp(1.8rem, 6vw, 3rem);
  text-transform: uppercase;
  line-height: 0.98;
}
.cover-card p {
  color: var(--ink);
  max-width: 640px;
  margin: 12px auto;
  font-weight: 700;
}
.start {
  min-height: 54px;
  margin-top: 10px;
  background: var(--accent);
  color: #fff;
  border: 3px solid var(--line);
  border-radius: 8px;
  padding: 14px 30px;
  font-weight: 900;
  font-size: 1.2rem;
  cursor: pointer;
  font-family: var(--font);
  text-transform: uppercase;
  box-shadow: var(--sh);
}
.start:hover {
  transform: translate(-1px, -1px);
  box-shadow: 5px 5px 0 var(--line);
}
.level-pill {
  display: inline-block;
  margin-bottom: 12px;
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--gold);
  border: 3px solid var(--line);
  border-radius: 6px;
  padding: 5px 14px;
  font-weight: 900;
}
.cast-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 16px 0 4px;
}
.cast-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border: 3px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px 6px 6px;
  font-size: 0.85rem;
  font-weight: 800;
  box-shadow: var(--sh-sm);
}
.cast-chip .av {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  border: 2px solid var(--line);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  color: #fff;
  overflow: hidden;
}
.cast-chip .av img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cast-chip span {
  color: var(--muted);
}

/* ---- Glossary ---- */
.gloss {
  display: grid;
  gap: 12px;
}
.term {
  background: #fff;
  border: 3px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  box-shadow: var(--sh-sm);
}
.term .ico {
  font-size: 1.7rem;
  flex: 0 0 auto;
}
.term h3 {
  font-size: 1.1rem;
  text-transform: uppercase;
}
.term .es-term {
  color: var(--blue);
  font-size: 0.9rem;
  font-style: italic;
}
.term p {
  color: var(--ink);
  margin-top: 4px;
  font-weight: 600;
}

/* ---- Mission complete ---- */
.complete {
  text-align: center;
  display: none;
}
.complete.show {
  display: block;
}
.complete .panel {
  margin-bottom: 18px;
}
.complete h2 {
  font-size: clamp(1.8rem, 6vw, 3rem);
  color: var(--ink);
  text-transform: uppercase;
}
.badge-done {
  display: inline-block;
  font-size: 3rem;
  margin: 8px;
}
.restart {
  min-height: 48px;
  margin-top: 14px;
  background: #fff;
  border: 3px solid var(--line);
  color: var(--ink);
  border-radius: 6px;
  padding: 12px 20px;
  font-weight: 800;
  cursor: pointer;
  font-family: var(--font);
  box-shadow: var(--sh-sm);
}
.restart:hover {
  background: var(--gold);
}
.locked-note {
  display: none;
  text-align: center;
  color: var(--muted);
  padding: 30px 10px;
  font-weight: 800;
}
.locked-note.show {
  display: block;
}
.bonus {
  margin-top: 24px;
  text-align: left;
  background: #fffbeb;
  border: 3px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  box-shadow: var(--sh);
}
.bonus-tag {
  background: var(--gold);
  color: var(--ink);
  font-weight: 900;
  font-size: 0.74rem;
  letter-spacing: 0.06em;
  padding: 4px 9px;
  border: 3px solid var(--line);
  border-radius: 6px;
  display: inline-block;
  text-transform: uppercase;
}
.bonus h3 {
  color: var(--ink);
  font-size: 1.15rem;
  margin: 10px 0 6px;
  font-weight: 900;
  text-transform: uppercase;
}
.bonus .prompt {
  font-size: 1.05rem;
  margin-bottom: 12px;
  line-height: 1.5;
  font-weight: 700;
}
.bonus .prompt .es {
  display: block;
  font-size: 0.9rem;
  color: var(--muted);
  font-style: italic;
  margin-top: 4px;
}

/* ---- Small screens (down to 320px) ---- */
@media (max-width: 560px) {
  .panel {
    aspect-ratio: 4 / 3;
    box-shadow: 5px 5px 0 var(--line);
  }
  .bubble {
    max-width: 94%;
  }
  .bubble .en {
    font-size: 1rem;
  }
}
@media (max-width: 380px) {
  main {
    padding: 12px 10px;
  }
  .title {
    font-size: 0.92rem;
    flex: 1 1 100%;
  }
  .panel {
    aspect-ratio: 1 / 1;
  }
  .speech {
    padding: 8px;
  }
  .bubble {
    padding: 10px 12px;
  }
}

/* ============================ Literacy layer ============================ */
.reading-tag {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.rt-skill {
  background: var(--accent);
  color: #fff;
  border: 3px solid var(--line);
  border-radius: 6px;
  padding: 4px 9px;
  font-weight: 900;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.rt-std,
.rt-dok {
  background: #fff;
  border: 3px solid var(--line);
  border-radius: 6px;
  padding: 4px 8px;
  font-weight: 800;
  font-size: 0.72rem;
}

.choices.evidence {
  gap: 8px;
}
.choice.ev {
  font-style: normal;
}

.seq-list {
  list-style: none;
  display: grid;
  gap: 8px;
  padding: 0;
  margin: 0;
}
.seq-card {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border: 3px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  box-shadow: var(--sh-sm);
  cursor: grab;
  font-weight: 700;
}
.seq-card:focus-visible {
  outline: 4px solid var(--gold);
  outline-offset: 2px;
}
.seq-card .seq-h {
  color: var(--muted);
  font-weight: 900;
}
.seq-card .seq-t {
  flex: 1;
}
.seq-card .seq-t .es {
  display: block;
  font-size: 0.85rem;
  color: var(--muted);
  font-style: italic;
}
.seq-ctl {
  display: flex;
  gap: 4px;
}
.seq-up,
.seq-down {
  min-width: 44px;
  min-height: 44px;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-weight: 900;
}
.seq-up:hover,
.seq-down:hover {
  background: var(--gold);
}
.seq-list.solved .seq-card {
  border-color: var(--green);
  background: #ecfdf5;
  cursor: default;
}
.seq-list.nudge {
  animation: figrise 0.25s ease;
}
.seq-check {
  margin-top: 10px;
}

.tts {
  display: inline-flex;
  gap: 4px;
  margin-left: 8px;
  vertical-align: middle;
}
.tts-btn {
  min-width: 36px;
  min-height: 36px;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-weight: 800;
  font-size: 0.8rem;
  line-height: 1;
}
.tts-btn:hover {
  background: var(--gold);
}

.notebook {
  text-align: left;
  border: 3px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  background: #fff;
  margin: 18px auto 0;
  max-width: 640px;
  box-shadow: var(--sh-sm);
}
.notebook h3 {
  margin: 0 0 10px;
  text-transform: uppercase;
}
.nb-row {
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
  font-weight: 600;
}
.nb-row:last-child {
  border-bottom: 0;
}
.nb-frame {
  margin-top: 4px;
  color: var(--muted);
  font-weight: 500;
}
.nb-blank {
  display: inline-block;
  min-width: 160px;
  border-bottom: 2px solid var(--line);
}

/* ===========================================================================
   PUBLISHER-GRADE UPGRADES: Cast Dossiers, SVG Stage Figures, Comic SFX,
   Storyboard Strip, Mission Stamps, and Built-In Interactive Math Labs
   =========================================================================== */

/* ---- Cast Dossier Grid on Cover ---- */
.cast-dossier-section {
  max-width: 920px;
  margin: 18px auto 12px;
  text-align: left;
}
.cast-dossier-heading {
  text-align: center;
  font-size: 0.82rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink);
  margin-bottom: 10px;
}
.cast-dossier-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
}
.cast-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  border: 3px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: var(--sh-sm);
  position: relative;
  transition: transform 0.15s ease;
}
.cast-card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--line);
}
.cast-card-av {
  width: 64px;
  height: 64px;
  border-radius: 10px;
  border: 3px solid var(--line);
  flex: 0 0 64px;
  overflow: hidden;
  background: var(--spk, var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
}
.cast-card-av svg,
.cast-card-av img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}
.cast-card-info {
  flex: 1;
  min-width: 0;
}
.cast-card-role {
  display: inline-block;
  font-size: 0.66rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 7px;
  border-radius: 999px;
  border: 2px solid var(--line);
  background: var(--gold);
  color: var(--ink);
  margin-bottom: 3px;
}
.cast-card-role.you {
  background: var(--accent);
  color: #fff;
}
.cast-card-name {
  font-size: 1rem;
  font-weight: 900;
  color: var(--ink);
  line-height: 1.15;
}
.cast-card-trait {
  font-size: 0.78rem;
  color: var(--muted);
  font-weight: 700;
  margin-top: 2px;
  line-height: 1.3;
}

/* ---- SVG Avatar & Stage Portrait Figure ---- */
.bubble .who .av svg,
.cast-chip .av svg {
  width: 100%;
  height: 100%;
  display: block;
}
.speaker-stage {
  position: absolute;
  bottom: 0;
  z-index: 2;
  width: min(175px, 34%);
  height: min(195px, 76%);
  pointer-events: none;
  filter: drop-shadow(4px 4px 0 rgba(15, 23, 42, 0.85));
  animation: figrise 0.3s ease;
}
.speaker-stage.left {
  left: 8px;
}
.speaker-stage.right {
  right: 8px;
}
.speaker-stage svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* ---- Comic SFX Action Burst ---- */
.comic-sfx {
  position: absolute;
  top: 12px;
  right: 14px;
  z-index: 4;
  background: var(--gold);
  color: var(--ink);
  border: 3px solid var(--line);
  border-radius: 8px;
  padding: 4px 12px;
  font-weight: 900;
  font-size: 0.92rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transform: rotate(-4deg);
  box-shadow: 4px 4px 0 var(--line);
  cursor: pointer;
  user-select: none;
  animation: sfxpop 0.35s cubic-bezier(0.18, 1.4, 0.4, 1);
}
.comic-sfx.left {
  right: auto;
  left: 14px;
  transform: rotate(4deg);
}
.comic-sfx.misc-sfx {
  background: #fef08a;
  color: var(--red);
}
@keyframes sfxpop {
  0% {
    transform: scale(0.4) rotate(-12deg);
    opacity: 0;
  }
  100% {
    transform: scale(1) rotate(-4deg);
    opacity: 1;
  }
}

/* ---- Interactive Storyboard Strip ---- */
.storyboard-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
  padding: 8px 10px;
  background: #fff;
  border: 3px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--sh-sm);
}
.sb-beats {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.sb-chip {
  min-height: 38px;
  padding: 5px 10px;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: #f8fafc;
  color: var(--ink);
  font-size: 0.78rem;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font);
}
.sb-chip.active {
  background: var(--gold);
  color: var(--ink);
  box-shadow: 2px 2px 0 var(--line);
}
.sb-chip.misc {
  border-color: var(--red);
}
.sb-inspect-btn {
  min-height: 38px;
  padding: 5px 11px;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: #eff6ff;
  color: var(--ink);
  font-size: 0.78rem;
  font-weight: 900;
  cursor: pointer;
  font-family: var(--font);
}
.sb-inspect-btn:hover {
  background: var(--gold);
}

/* ---- Interactive Math Lab Widget (.gn-math-lab) ---- */
.gn-math-lab {
  margin: 12px 0 14px;
  background: #ffffff;
  border: 3px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: var(--sh-sm);
}
.gn-lab-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 2px dashed rgba(15, 23, 42, 0.15);
}
.gn-lab-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 9px;
  border-radius: 6px;
  border: 2px solid var(--line);
}
.gn-lab-sub {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--muted);
}
.gn-lab-stage {
  background: #f8fafc;
  border: 2px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
  text-align: center;
  overflow-x: auto;
}
.gn-lab-stage svg {
  width: 100%;
  max-width: 460px;
  height: auto;
  margin: 0 auto;
  display: block;
}
.gn-lab-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
}
.gn-lab-ctrl {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.84rem;
  font-weight: 800;
  color: var(--ink);
  flex: 1 1 180px;
}
.gn-lab-ctrl input[type="range"] {
  flex: 1;
  min-width: 90px;
  height: 28px;
  accent-color: var(--accent);
  cursor: pointer;
}
.gn-lab-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.gn-lab-btn {
  min-height: 40px;
  min-width: 44px;
  padding: 6px 10px;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font-weight: 900;
  font-size: 0.82rem;
  cursor: pointer;
  font-family: var(--font);
  box-shadow: 2px 2px 0 var(--line);
}
.gn-lab-btn:hover,
.gn-lab-btn.active {
  background: var(--gold);
  color: var(--ink);
}
.gn-lab-readout {
  margin-top: 8px;
  padding: 8px 10px;
  border-radius: 6px;
  background: #eff6ff;
  border: 2px solid var(--line);
  font-size: 0.88rem;
  font-weight: 800;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}
.gn-lab-readout code {
  font-family: "Courier New", monospace;
  font-weight: 900;
  color: var(--blue);
  background: #fff;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--line);
}
.gn-lab-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}

/* ---- Topbar XP Rank & SFX Toggle ---- */
.gn-xp-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fef08a;
  color: var(--ink);
  border: 3px solid var(--line);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 0.8rem;
  font-weight: 900;
  box-shadow: var(--sh-sm);
  white-space: nowrap;
}
.gn-sfx-toggle {
  min-height: 44px;
  border: 3px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 6px;
  box-shadow: var(--sh-sm);
  font-weight: 900;
  font-size: 0.82rem;
  cursor: pointer;
  padding: 0 10px;
  font-family: var(--font);
}
.gn-sfx-toggle[aria-pressed="true"] {
  background: var(--gold);
}

/* ---- Panel Math X-Ray / Blueprint Lens Overlay ---- */
.xray-btn {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 5;
  min-height: 40px;
  background: rgba(15, 23, 42, 0.9);
  color: #38bdf8;
  border: 2.5px solid #38bdf8;
  border-radius: 8px;
  padding: 5px 11px;
  font-weight: 900;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 3px 3px 0 #0f172a;
  font-family: var(--font);
}
.xray-btn:hover,
.xray-btn[aria-pressed="true"] {
  background: #38bdf8;
  color: #0f172a;
}
.panel-xray-layer {
  position: absolute;
  inset: 0;
  z-index: 4;
  background: rgba(11, 25, 44, 0.88);
  backdrop-filter: blur(2px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  color: #e0f2fe;
}
.panel-xray-layer.open {
  display: flex;
  animation: fade 0.25s ease;
}
.panel-xray-layer svg {
  width: 100%;
  max-width: 560px;
  max-height: 74%;
  height: auto;
  border: 2px solid #38bdf8;
  border-radius: 8px;
}
.xray-caption {
  margin-top: 8px;
  font-size: 0.86rem;
  font-weight: 800;
  color: #bae6fd;
  text-align: center;
  max-width: 600px;
}

/* ---- Unfolding Multi-Panel Comic Strip Ribbon ---- */
.comic-strip-ribbon {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.strip-cell {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  background: #fff;
  border: 2.5px solid var(--line);
  border-radius: 8px;
  padding: 7px 9px;
  box-shadow: 2px 2px 0 var(--line);
  cursor: pointer;
  text-align: left;
  font-family: var(--font);
  transition: transform 0.12s ease;
}
.strip-cell:hover {
  transform: translateY(-2px);
}
.strip-cell.current {
  background: #fffbeb;
  border-color: var(--accent);
  box-shadow: 3px 3px 0 var(--accent);
}
.strip-cell.misc-cell {
  border-color: var(--red);
  background: #fef2f2;
}
.strip-av {
  width: 34px;
  height: 34px;
  border-radius: 6px;
  border: 2px solid var(--line);
  flex: 0 0 34px;
  overflow: hidden;
  background: #f8fafc;
}
.strip-av svg {
  width: 100%;
  height: 100%;
  display: block;
}
.strip-txt {
  flex: 1;
  min-width: 0;
  font-size: 0.75rem;
  line-height: 1.25;
  color: var(--ink);
  font-weight: 700;
}
.strip-txt b {
  display: block;
  font-size: 0.68rem;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2px;
}

/* ---- "HOLD IT!" Misconception Trap Buster Bar ---- */
.trap-buster-bar {
  margin-top: 10px;
  background: #fef2f2;
  border: 3px solid var(--red);
  border-radius: 8px;
  padding: 10px 12px;
  box-shadow: var(--sh-sm);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.trap-buster-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.trap-badge {
  background: var(--red);
  color: #fff;
  font-weight: 900;
  font-size: 0.74rem;
  padding: 3px 9px;
  border-radius: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.trap-reveal-btn {
  min-height: 40px;
  background: var(--gold);
  color: var(--ink);
  border: 2.5px solid var(--line);
  border-radius: 6px;
  padding: 6px 12px;
  font-weight: 900;
  font-size: 0.82rem;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--line);
  font-family: var(--font);
}
.trap-card-body {
  display: none;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 6px;
  padding: 9px 11px;
  font-size: 0.86rem;
  font-weight: 700;
  color: var(--ink);
}
.trap-card-body.open {
  display: block;
}

/* ---- Hero Strategy Roleplay Picker & Specialist Coach Reply ---- */
.hero-move-bar {
  margin: 0 0 12px;
  background: #f8fafc;
  border: 2.5px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
}
.hero-move-title {
  font-size: 0.74rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  margin-bottom: 6px;
}
.hero-move-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.hero-move-btn {
  min-height: 38px;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 0.78rem;
  font-weight: 800;
  cursor: pointer;
  font-family: var(--font);
  box-shadow: 2px 2px 0 var(--line);
}
.hero-move-btn.active,
.hero-move-btn:hover {
  background: var(--gold);
}
.hero-move-reply {
  display: none;
  margin-top: 8px;
  padding: 8px 10px;
  background: #ecfdf5;
  border: 2px solid var(--green);
  border-radius: 6px;
  font-size: 0.84rem;
  font-weight: 700;
  color: #064e3b;
}
.hero-move-reply.open {
  display: flex;
  align-items: center;
  gap: 10px;
}
.hero-move-reply .mini-av {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  border: 2px solid var(--line);
  flex: 0 0 36px;
  overflow: hidden;
  background: #fff;
}

/* ---- Interactive Margin Sketchpad & Math Stamp Canvas ---- */
.gn-sketch-wrap {
  margin: 0 0 12px;
  background: #fffdf8;
  border: 3px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  display: none;
}
.gn-sketch-wrap.show {
  display: block;
}
.gn-sketch-toolbar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.gn-sketch-canvas {
  width: 100%;
  height: 150px;
  background: #ffffff;
  border: 2px solid var(--line);
  border-radius: 6px;
  touch-action: none;
  cursor: crosshair;
  display: block;
}
.swatch-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2.5px solid var(--line);
  cursor: pointer;
}
.swatch-btn.active {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

/* ---- Collectible Character Trading Cards on Complete Screen ---- */
.trading-deck {
  max-width: 820px;
  margin: 20px auto;
  text-align: left;
}
.trading-deck h3 {
  text-align: center;
  text-transform: uppercase;
  margin-bottom: 10px;
  font-size: 1.05rem;
}
.trading-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.trading-card {
  background: linear-gradient(135deg, #fffbeb 0%, #ffffff 55%, #eff6ff 100%);
  border: 3px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  box-shadow: var(--sh);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
}
.trading-card-av {
  width: 76px;
  height: 76px;
  border-radius: 12px;
  border: 3px solid var(--line);
  overflow: hidden;
  background: #fff;
}
.trading-card-av svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* ===========================================================================

   Renders a STORY object (window.GN_STORY) into a panel-based, dialogue-driven

   STORY shape is documented in story.schema.md. Key contracts preserved for the
   existing Neft results pipeline (do NOT rename):
     • each math choice group is a .choices container holding .choice buttons
     • a solved choice's correct button gets class "correct"
     • the master-rank group has id="choicesComplete" (excluded from scoring)
     • the finish scene is #scene-complete and gets classes show/active when done
   The nt-results.js tracker at the bottom of each file reads exactly those.
   =========================================================================== */
(function () {
  "use strict";
  var S = window.GN_STORY;
  if (!S) {
    console.error("GN: window.GN_STORY missing");
    return;
  }

  /* ---------- tiny helpers ---------- */
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function $(id) {
    return document.getElementById(id);
  }
  function art(file) {
    return (S.meta.artBase || "") + file;
  }
  function txt(v) {
    return v == null ? "" : v;
  }

  /* ---------- tier (Level 0 / 1 / 2) ----------
     meta.tier drives engine-level scaffolding so a single story file can serve
     the most-supported (Level 0 / IEP) tier WITHOUT authoring a third full story:
       tier 0 → fewer beats per act, only 2 choices, sentence-frame always open,
                simplified number set when a step provides choicesL0/beatsL0.
       tier 1/2 (or unset) → full story, unchanged.
     Authors may optionally provide step.choicesL0 / step.beatsL0 / per-choice
     keepL0 to control the simpler set; otherwise the engine auto-reduces. */
  var TIER = S.meta && S.meta.tier != null ? +S.meta.tier : null;
  var IS_L0 = TIER === 0;

  /* Reduce a choices[] to 2 for Level 0: prefer an explicit choicesL0, else keep
     the correct answer plus the first distractor (its mapped misconception). */
  function tierChoices(step) {
    var all = step.choices || [];
    if (!IS_L0) return all;
    if (Array.isArray(step.choicesL0) && step.choicesL0.length) {
      return step.choicesL0;
    }

      return c.keepL0;
    });

    var correct = all.filter(function (c) {
      return c.correct === true;
    });
    var wrong = all.filter(function (c) {
      return c.correct !== true;
    });
    return correct.concat(wrong.slice(0, 1));
  }

     the first/last so the story still reads but is shorter. */
  function tierBeats(step) {

    if (c.avatar) {
      return c.avatar.charAt(0) === "/" || c.avatar.indexOf("../") === 0
        ? c.avatar
        : art(c.avatar);
    }
    return null;
  }
  function whoTag(spkId, isMe) {
    var c = speaker(spkId);
    var svg = renderPortraitSVG(spkId, "hero");
    var src = avatarSrc(spkId);
    var inner = src
      ? '<span class="av"><img src="' + src + '" alt="" loading="lazy" /></span>'
      : svg
        ? '<span class="av" aria-hidden="true">' + svg + "</span>"
        : '<span class="av" aria-hidden="true">' +
          (c.tagIcon || c.name.charAt(0)) +
          "</span>";
    return (
      '<span class="who" style="--spk:' +
      (c.color || "#c2461d") +
      '">' +
      inner +
      "<span>" +
      c.name +
      "</span>" +
      (isMe || c.role === "protagonist"
        ? '<span class="me">&middot; YOU</span>'
        : c.title
          ? '<span class="me">&middot; ' + c.title + "</span>"
          : "") +
      "</span>"
    );
  }

  /* ---------- vocab markup: wrap term occurrences with a tappable tag ----------
     A beat/challenge may carry vocab:[{term,en,es}]. We wrap the FIRST literal
     occurrence of term in the English text. Definitions open in a popover. */
  var VOCAB_STORE = [];
  function injectVocab(htmlEn, vocab) {
    if (!vocab || !vocab.length) return htmlEn;
    vocab.forEach(function (v) {
      var i = VOCAB_STORE.push(v) - 1;
      var re = new RegExp("(" + escapeRe(v.term) + ")", "i");
      htmlEn = htmlEn.replace(
        re,
        '<button type="button" class="vocab-tag" data-vocab="' +
          i +
          '" aria-label="Definition of ' +
          stripTags(v.term) +
          '">$1</button>',
      );
    });
    return htmlEn;
  }
  function escapeRe(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  /* ---------- popover (vocab + callout) ---------- */
  function openPop(anchor, title, en, es) {
    closePop();
    var back = el("div", "gn-pop-back");
    back.id = "gn-pop-back";
    back.addEventListener("click", closePop);
    var p = el("div", "gn-pop");
    p.id = "gn-pop";
    p.setAttribute("role", "dialog");
    p.setAttribute("aria-label", stripTags(title || "Definition"));
    p.innerHTML =
      '<button class="x" aria-label="Close">&times;</button>' +
      (title ? "<h4>" + title + "</h4>" : "") +
      '<div class="en">' +
      en +
      "</div>" +
      (es ? '<div class="es">' + es + "</div>" : "");
    document.body.appendChild(back);
    document.body.appendChild(p);
    p.querySelector(".x").addEventListener("click", closePop);
    var r = anchor.getBoundingClientRect();
    var pw = Math.min(280, window.innerWidth - 20);
    p.style.width = pw + "px";
    var left = Math.min(Math.max(10, r.left), window.innerWidth - pw - 10);
    var top = r.bottom + 8;
    if (top + p.offsetHeight > window.innerHeight - 10) {
      top = Math.max(10, r.top - p.offsetHeight - 8);
    }
    p.style.left = left + "px";
    p.style.top = top + "px";
    p.querySelector(".x").focus();
  }
  function closePop() {
    var a = $("gn-pop"),
      b = $("gn-pop-back");
    if (a) a.remove();
    if (b) b.remove();
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closePop();
  });
  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest(".vocab-tag");
    if (t) {
      var v = VOCAB_STORE[+t.dataset.vocab];
      if (v) openPop(t, v.term, v.en, v.es);
    }
  });

  /* ---------- bubble builder ----------
     Returns a fragment: the speaking character's large SVG stage portrait pinned
     to the panel (for non-narrator beats), a comic SFX burst, + the speech bubble. */
  function bubble(beat) {
    var c = speaker(beat.who);
    var isCap = c.role === "narrator" || beat.caption;
    var pos = beat.pos || (c.role === "protagonist" ? "right" : "left");
    var frag = document.createDocumentFragment();
    var pose = beat.misconception
      ? "oops"
      : beat.pose || (c.role === "protagonist" ? "hero" : "think");

    if (!isCap) {
      var svgStage = renderPortraitSVG(beat.who, pose);
      if (svgStage) {
        var stageWrap = el("div", "speaker-stage " + pos);
        stageWrap.setAttribute("aria-hidden", "true");
        stageWrap.innerHTML = svgStage;
        frag.appendChild(stageWrap);
      }
    }

    var sfxText =
      beat.sfx ||
      (beat.misconception
        ? "HOLD UP! ⚡"
        : isCap
          ? "LOG ENTRY 📡"
          : UNIT_SFX[S.meta.unit] || "POW!");
    var sfxEl = el(
      "button",
      "comic-sfx" +
        (pos === "right" ? " left" : "") +
        (beat.misconception ? " misc-sfx" : ""),
      sfxText,
    );
    sfxEl.type = "button";
    sfxEl.setAttribute("aria-label", "Comic sound effect: " + stripTags(sfxText));
    sfxEl.addEventListener("click", function (e) {
      e.stopPropagation();
      SFX_AUDIO.play(beat.misconception ? "warn" : "pop");
      addXP(5, "sfx-" + stripTags(sfxText));
      sfxEl.style.animation = "none";
      void sfxEl.offsetWidth;
      sfxEl.style.animation = "";
    });
    frag.appendChild(sfxEl);

    var b = el(
      "div",
      "bubble " +
        pos +
        (isCap ? " caption" : "") +
        (beat.misconception ? " misc" : ""),
    );
    var en = injectVocab(txt(beat.en), beat.vocab);
    b.innerHTML =
      whoTag(beat.who) +
      '<div class="en">' +
      en +
      "</div>" +
      (beat.es ? '<div class="es">' + beat.es + "</div>" : "");
    if (TTS.available) {
      var ctl =
        '<span class="tts">' +
        '<button class="tts-btn" type="button" data-tts-en aria-label="Read aloud">&#128266;</button>' +
        (beat.es
          ? '<button class="tts-btn" type="button" data-tts-es aria-label="Leer en voz alta">ES</button>'
          : "") +
        "</span>";
      b.insertAdjacentHTML("beforeend", ctl);
      b.querySelector("[data-tts-en]").addEventListener("click", function (e) {
        e.stopPropagation();
        TTS.speak(beat.en, "en");
      });
      if (beat.es)
        b.querySelector("[data-tts-es]").addEventListener(
          "click",
          function (e) {
            e.stopPropagation();
            TTS.speak(beat.es, "es");
          },
        );
    }
    frag.appendChild(b);
    return frag;
  }

  /* Build a unit-tailored SVG Math X-Ray / Blueprint overlay for an Act panel */
  function buildXRaySVG(act) {
    var mathStep = null;
    (act.steps || []).forEach(function (st) {
      if (!mathStep && st.type !== "beats" && !isComprehension(st)) {
        mathStep = st;
      }
    });
    var q = stripTags((mathStep && mathStep.ask && mathStep.ask.en) || act.title || "");
    var nums = (q.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
    var a = nums[0] != null ? nums[0] : 12;
    var b = nums[1] != null ? nums[1] : 4;
    var c = nums[2] != null ? nums[2] : 3;
    var labType = detectLabType(mathStep || {});
    var gridBg =
      '<defs><pattern id="xrgrid-' +
      act.id +
      '" width="20" height="20" patternUnits="userSpaceOnUse">' +
      '<path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e3a5f" stroke-width="1"/></pattern></defs>' +
      '<rect width="520" height="200" fill="#071324"/>' +
      '<rect width="520" height="200" fill="url(#xrgrid-' +
      act.id +
      ')"/>' +
      '<rect x="8" y="8" width="504" height="184" rx="6" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>' +
      '<text x="20" y="28" font-size="11" font-weight="900" fill="#38bdf8" letter-spacing="1.2">PANEL MATH X-RAY // ' +
      stripTags(S.meta.standard || "GRADE 6 BLUEPRINT").toUpperCase() +
      " // " +
      stripTags(act.tab || act.id).toUpperCase() +
      "</text>";

    var bodySvg = "";
    var caption = "";
    if (labType === "fraction-slicer" || labType === "decimal-lab") {
      bodySvg =
        '<rect x="40" y="54" width="200" height="36" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5"/>' +
        '<line x1="90" y1="54" x2="90" y2="90" stroke="#f2b705" stroke-width="2" stroke-dasharray="4 2"/>' +
        '<line x1="140" y1="54" x2="140" y2="90" stroke="#f2b705" stroke-width="2" stroke-dasharray="4 2"/>' +
        '<line x1="190" y1="54" x2="190" y2="90" stroke="#f2b705" stroke-width="2" stroke-dasharray="4 2"/>' +
        '<text x="140" y="112" font-size="12" font-weight="800" fill="#f2b705" text-anchor="middle">TOTAL QUANTITY (' +
        a +
        ") PARTITIONED INTO EQUAL SCOOPS</text>" +
        '<rect x="280" y="50" width="210" height="96" rx="6" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>' +
        '<text x="385" y="76" font-size="12" font-weight="900" fill="#bae6fd" text-anchor="middle">BLUEPRINT INVARIANT</text>' +
        '<text x="385" y="100" font-size="13" font-weight="900" fill="#f2b705" text-anchor="middle">Total &divide; Scoop Size = Groups</text>' +
        '<text x="385" y="124" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle">Multiply by reciprocal / shift place value</text>';
      caption =
        "X-Ray Scan: Check how many equal fractional or decimal scoops fit inside the total quantity.";
    } else if (labType === "ratio-scaler" || labType === "percent-grid") {
      bodySvg =
        '<line x1="40" y1="74" x2="470" y2="74" stroke="#38bdf8" stroke-width="3"/>' +
        '<line x1="40" y1="134" x2="470" y2="134" stroke="#f2b705" stroke-width="3"/>' +
        [0, 1, 2, 3, 4]
          .map(function (idx) {
            var x = 60 + idx * 95;
            return (
              '<line x1="' +
              x +
              '" y1="62" x2="' +
              x +
              '" y2="146" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="3 2"/>' +
              '<circle cx="' +
              x +

              '<text x="' +
              x +
              '" y="162" font-size="11" font-weight="900" fill="#fef08a" text-anchor="middle">' +
              +(b * idx).toFixed(1) +
              "</text>"
            );
          })
          .join("");
      caption =
        "X-Ray Scan: Proportional quantities scale by the exact same multiplier (never add a constant offset).";
    } else if (labType === "area-composer" || labType === "prism-builder") {
      bodySvg =
        '<polygon points="60,150 220,150 180,66 100,66" fill="#0ea5e9" fill-opacity="0.22" stroke="#38bdf8" stroke-width="2.5"/>' +
        '<line x1="140" y1="66" x2="140" y2="150" stroke="#f2b705" stroke-width="2.5" stroke-dasharray="4 2"/>' +

        '<rect x="286" y="56" width="194" height="96" rx="8" fill="#0f2942" stroke="#f2b705" stroke-width="2.5"/>' +
        '<text x="383" y="84" font-size="12" font-weight="900" fill="#f2b705" text-anchor="middle">RIGHT SIDE / INVARIANT</text>' +

        '<text x="383" y="136" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle">Substitute back to verify</text>';
      caption =

    }
    return {
      svg:
        '<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Panel Math X-Ray Blueprint">' +
        gridBg +
        bodySvg +

  function renderTradingDeck() {
    var host = $("gn-trading-deck");
    if (!host) return;
    var cardsHtml = "";
    Object.keys(S.cast || {}).forEach(function (k) {

  /* =========================================================================
     STATE + NAVIGATION
     ========================================================================= */
  var state = {};
  S.acts.forEach(function (a) {
    state[a.id] = false;
  });

  function updateProgress() {
    var done = 0;
    S.acts.forEach(function (a) {
      if (state[a.id]) done++;
    });
    var pct = Math.round((done / S.acts.length) * 100);
    $("bar").style.width = pct + "%";
    $("plabel").textContent = pct + "%";
    document.querySelector(".progress").setAttribute("aria-valuenow", pct);
  }

  function refreshLocks() {
    S.acts.forEach(function (a, i) {
      if (i === 0) return;
      var prevDone = state[S.acts[i - 1].id];
      setLock("tab-" + a.id, !prevDone, a.tab);
      $("lock-" + a.id).classList.toggle("show", !prevDone);
      $("body-" + a.id).style.display = prevDone ? "" : "none";
    });
  }
  function setLock(tabId, locked, label) {
    var t = $(tabId);
    if (!t) return;
    t.classList.toggle("locked", locked);
    t.innerHTML = (locked ? '<span class="lk">&#128274;</span> ' : "") + label;
  }

  function showScene(name) {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    SCENE_IDS.forEach(function (s) {
      var sc = $("scene-" + s);
      if (sc) sc.classList.toggle("active", s === name);
      var tab = $("tab-" + s);
      if (tab) tab.setAttribute("aria-selected", s === name ? "true" : "false");
    });
    var cmp = $("scene-complete");
    cmp.classList.remove("active", "show");
    // (re)start the act's flow when entered
    var act = findAct(name);
    if (act && state.__started !== name) {
      state.__started = name;
      runAct(act);
    }
    closePop();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function findAct(id) {
    for (var i = 0; i < S.acts.length; i++)
      if (S.acts[i].id === id) return S.acts[i];
    return null;
  }
  function showComplete() {
    SCENE_IDS.forEach(function (s) {
      var sc = $("scene-" + s);
      if (sc) sc.classList.remove("active");
    });
    document.querySelectorAll(".tab").forEach(function (t) {
      t.setAttribute("aria-selected", "false");
    });
    var c = $("scene-complete");
    c.classList.add("active", "show");
    addXP(40, "complete-novel");
    SFX_AUDIO.play("fanfare");
    wireMaster();
    renderTradingDeck();
    renderNotebook();
    var pnb = $("print-nb");
    if (pnb && !pnb.dataset.wired) {
      pnb.dataset.wired = "1";
      pnb.addEventListener("click", function () {
        window.print();
      });
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function wireTabs() {
    var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
    tabs.forEach(function (tab) {
      tab.addEventListener("click", function () {
        if (tab.classList.contains("locked")) return;
        showScene(tab.dataset.scene);
      });
      tab.addEventListener("keydown", function (e) {
        var i = tabs.indexOf(tab);
        if (e.key === "ArrowRight") {
          e.preventDefault();
          (tabs[i + 1] || tabs[0]).focus();
        }
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          (tabs[i - 1] || tabs[tabs.length - 1]).focus();
        }
      });
    });
    $("txtsize").addEventListener("click", cycleTextSize);
    var sfxBtn = $("gn-sfx-btn");
    if (sfxBtn) {
      sfxBtn.addEventListener("click", function () {
        var on = SFX_AUDIO.toggle();
        sfxBtn.setAttribute("aria-pressed", on ? "true" : "false");
        sfxBtn.innerHTML = (on ? "&#128266;" : "&#128263;") + " SFX";
      });
    }
    $("restart-btn") &&
      $("restart-btn").addEventListener("click", function () {
        location.reload();
      });
  }
  function cycleTextSize() {
    var order = ["", "lg", "xl"],
      cur = document.body.dataset.text || "";
    var nxt = order[(order.indexOf(cur) + 1) % order.length];
    if (nxt) document.body.dataset.text = nxt;
    else delete document.body.dataset.text;
    $("txtsize").textContent = nxt === "lg" ? "A++" : nxt === "xl" ? "A" : "A+";
  }

  /* =========================================================================
     INTERACTIVE MATH LABS — Hands-on SVG math manipulatives built into every
     math challenge card across all units and lessons.
     ========================================================================= */
  function detectLabType(step) {
    if (step.lab && step.lab.type) return step.lab.type;
    var q = stripTags((step.ask && step.ask.en) || "").toLowerCase();
    var std = ((S.meta && S.meta.standard) || "").toLowerCase();
    var assess = ((S.meta && S.meta.assessment) || "").toLowerCase();
    var u = S.meta && S.meta.unit;

    if (
      std.indexOf("6.nos.2") >= 0 ||
      std.indexOf("6.nos.3") >= 0 ||
      assess.indexOf("decimal") >= 0
    ) {
      return "decimal-lab";
    }
    if (u === 2 || std.indexOf("6.nos.1") >= 0) return "fraction-slicer";
    if (u === 3) return "ratio-scaler";
    if (u === 4 || std.indexOf("6.nrp.3.c") >= 0) return "percent-grid";
    if (u === 5 || std.indexOf("6.gm.1") >= 0) return "area-composer";
    if (u === 6) return "expression-lab";
    if (u === 7) return "equation-balance";
    if (u === 8) return "data-analyzer";
    if (u === 9) return "coord-navigator";
    if (u === 10) return "prism-builder";
    if (u === 1) return "factor-lab";
    if (/percent|%/.test(q)) return "percent-grid";
    if (/ratio|rate|per /.test(q)) return "ratio-scaler";
    return "fraction-slicer";
  }

  function gcd(a, b) {
    a = Math.abs(Math.round(a)) || 1;
    b = Math.abs(Math.round(b)) || 1;
    while (b) {
      var t = b;
      b = a % b;
      a = t;
    }
    return a;
  }

  function buildMathLab(step, act) {
    var type = detectLabType(step);
    var host = el("div", "gn-math-lab");
    host.setAttribute("role", "region");
    host.setAttribute("aria-label", "Interactive Math Lab");
    var qText = stripTags((step.ask && step.ask.en) || "");
    var nums = (qText.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);

    if (type === "fraction-slicer") {
      var whole = Math.min(6, Math.max(1, Math.round(nums[0] || 3)));
      var denoms = [2, 3, 4, 5, 6, 8];
      var num = 1;
      var den = 4;
      var fracMatch = qText.match(/(\d+)\s*\/\s*(\d+)/);
      if (fracMatch) {
        num = Math.min(5, Math.max(1, +fracMatch[1]));
        den = Math.min(8, Math.max(2, +fracMatch[2]));
      }
      host.innerHTML =
        '<div class="gn-lab-header">' +
        '<span class="gn-lab-badge">&#129514; Interactive Fraction Slicer</span>' +
        '<span class="gn-lab-sub">Slice total bars into fractional scoops</span>' +
        "</div>" +
        '<div class="gn-lab-stage" data-stage></div>' +
        '<div class="gn-lab-controls">' +
        '<label class="gn-lab-ctrl">Total Bars: <input type="range" min="1" max="6" value="' +
        whole +
        '" data-whole /><span data-whole-val>' +
        whole +
        "</span></label>" +
        '<div class="gn-lab-pills" data-fracs>' +
        ["1/2", "1/3", "1/4", "2/3", "3/4", "1/6", "3/8"]
          .map(function (f) {
            return (
              '<button type="button" class="gn-lab-btn' +
              (f === num + "/" + den ? " active" : "") +
              '" data-f="' +
              f +
              '">Scoop ' +
              f +
              "</button>"
            );
          })
          .join("") +
        "</div>" +
        "</div>" +
        '<div class="gn-lab-readout" data-readout></div>';

      var renderFrac = function () {
        var totalParts = whole * den;
        var scoops = (totalParts / num).toFixed(totalParts % num === 0 ? 0 : 2);
        var w = 420,
          h = 74;
        var barW = (w - 24 - (whole - 1) * 8) / whole;
        var rects = "";
        var colors = ["#38bdf8", "#f2b705", "#34d399", "#fb7185", "#a78bfa"];
        for (var b = 0; b < whole; b++) {
          var bx = 12 + b * (barW + 8);
          rects +=
            '<rect x="' +
            bx +
            '" y="14" width="' +
            barW +
            '" height="36" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2.5"/>';
          var partW = barW / den;
          for (var p = 0; p < den; p++) {
            var globalIdx = b * den + p;
            var scoopIdx = Math.floor(globalIdx / num);
            var col = colors[scoopIdx % colors.length];
            rects +=
              '<rect x="' +
              (bx + p * partW + 1) +
              '" y="15" width="' +
              Math.max(2, partW - 2) +
              '" height="34" fill="' +
              col +
              '" opacity="0.72"/>';
            if (p > 0) {
              rects +=
                '<line x1="' +
                (bx + p * partW) +
                '" y1="14" x2="' +
                (bx + p * partW) +
                '" y2="50" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="3 2"/>';
            }
          }
          rects +=
            '<text x="' +
            (bx + barW / 2) +
            '" y="66" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">Whole #' +
            (b + 1) +
            " (" +
            den +
            "/" +
            den +
            ")</text>";
        }
        host.querySelector("[data-stage]").innerHTML =
          '<svg viewBox="0 0 ' +
          w +
          " " +
          h +
          '" style="background:white">' +
          rects +
          "</svg>";
        host.querySelector("[data-readout]").innerHTML =
          "<span><b>Reciprocal Check:</b> <code>" +
          whole +
          " &divide; " +
          num +
          "/" +
          den +
          " = " +
          whole +
          " &times; " +
          den +
          "/" +
          num +
          "</code></span>" +
          "<span><b>Scoops Fitted:</b> <code>" +
          scoops +
          " scoops</code></span>";
      };
      host
        .querySelector("[data-whole]")
        .addEventListener("input", function (e) {
          whole = +e.target.value;
          host.querySelector("[data-whole-val]").textContent = whole;
          renderFrac();
        });
      host.querySelector("[data-fracs]").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-f]");
        if (!btn) return;
        Array.prototype.slice
          .call(host.querySelectorAll("[data-f]"))
          .forEach(function (b) {
            b.classList.remove("active");
          });
        btn.classList.add("active");
        var pts = btn.dataset.f.split("/");
        num = +pts[0];
        den = +pts[1];
        renderFrac();
      });
      renderFrac();
      return host;
    }

    if (type === "ratio-scaler") {
      var baseA = Math.min(25, Math.max(1, Math.round(nums[0] || 3)));
      var baseB = Math.min(60, Math.max(1, Math.round(nums[1] || 5)));
      if (baseA === baseB) baseB = baseA + 2;
      var mult = 2;
      host.innerHTML =
        '<div class="gn-lab-header">' +
        '<span class="gn-lab-badge">&#128207; Double Number Line &amp; Ratio Scaler</span>' +
        '<span class="gn-lab-sub">Slide the multiplier to scale both quantities in lockstep</span>' +
        "</div>" +
        '<div class="gn-lab-stage" data-stage></div>' +
        '<div class="gn-lab-controls">' +
        '<label class="gn-lab-ctrl">Base A: <input type="range" min="1" max="20" value="' +
        baseA +
        '" data-a /><span data-a-val>' +
        baseA +
        "</span></label>" +
        '<label class="gn-lab-ctrl">Base B: <input type="range" min="1" max="30" value="' +
        baseB +
        '" data-b /><span data-b-val>' +
        baseB +
        "</span></label>" +
        '<label class="gn-lab-ctrl">Scale &times;<span data-m-val>' +
        mult +
        '</span>: <input type="range" min="1" max="8" value="' +
        mult +
        '" data-m /></label>' +
        "</div>" +
        '<div class="gn-lab-readout" data-readout></div>';

      var renderRatio = function () {
        var ticks = "";
        for (var k = 1; k <= 6; k++) {
          var x = 45 + (k - 1) * 68;
          var active = k === mult;
          ticks +=
            '<line x1="' +
            x +
            '" y1="22" x2="' +
            x +
            '" y2="66" stroke="' +
            (active ? "#b42318" : "#94a3b8") +
            '" stroke-width="' +
            (active ? 3 : 1.5) +
            '" stroke-dasharray="' +
            (active ? "" : "3 2") +
            '"/>' +
            '<circle cx="' +
            x +
            '" cy="26" r="' +
            (active ? 7 : 4.5) +
            '" fill="' +
            (active ? "#f2b705" : "#0d9488") +
            '" stroke="#0f172a" stroke-width="2"/>' +
            '<text x="' +
            x +
            '" y="15" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">' +
            baseA * k +
            "</text>" +
            '<circle cx="' +
            x +
            '" cy="62" r="' +
            (active ? 7 : 4.5) +
            '" fill="' +
            (active ? "#f2b705" : "#1d4ed8") +
            '" stroke="#0f172a" stroke-width="2"/>' +
            '<text x="' +
            x +
            '" y="82" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">' +
            baseB * k +
            "</text>";
        }
        host.querySelector("[data-stage]").innerHTML =
          '<svg viewBox="0 0 430 92" style="background:white">' +
          '<text x="8" y="30" font-size="11" font-weight="900" fill="#0d9488">Qty A</text>' +
          '<line x1="40" y1="26" x2="400" y2="26" stroke="#0f172a" stroke-width="3"/>' +
          '<text x="8" y="66" font-size="11" font-weight="900" fill="#1d4ed8">Qty B</text>' +
          '<line x1="40" y1="62" x2="400" y2="62" stroke="#0f172a" stroke-width="3"/>' +
          ticks +
          "</svg>";
        var g = gcd(baseA, baseB);
        var unitRate = (baseB / baseA).toFixed(baseB % baseA === 0 ? 0 : 2);
        host.querySelector("[data-readout]").innerHTML =
          "<span><b>Scaled Ratio (&times;" +
          mult +
          "):</b> <code>" +
          baseA * mult +
          " : " +
          baseB * mult +
          "</code></span>" +
          "<span><b>Simplest:</b> <code>" +
          baseA / g +
          " : " +
          baseB / g +
          "</code> &middot; <b>Unit Rate:</b> <code>" +
          unitRate +
          " per 1</code></span>";
      };
      ["a", "b", "m"].forEach(function (key) {
        host
          .querySelector("[data-" + key + "]")
          .addEventListener("input", function (e) {
            if (key === "a") baseA = +e.target.value;
            if (key === "b") baseB = +e.target.value;
            if (key === "m") mult = +e.target.value;
            host.querySelector("[data-" + key + "-val]").textContent =
              e.target.value;
            renderRatio();
          });
      });
      renderRatio();
      return host;
    }

    if (type === "percent-grid") {
      var pct = 25;
      var pctMatch = qText.match(/(\d+)\s*%/);
      if (pctMatch) pct = Math.min(100, Math.max(0, +pctMatch[1]));
      var wholeVal = Math.max(10, Math.min(500, Math.round(nums[1] || nums[0] || 80)));
      if (wholeVal === pct) wholeVal = 120;
      host.innerHTML =
        '<div class="gn-lab-header">' +
        '<span class="gn-lab-badge">&#128178; 10&times;10 Percent Grid &amp; Tape Model</span>' +
        '<span class="gn-lab-sub">Shade squares out of 100 to test Part, Whole &amp; Percent</span>' +
        "</div>" +
        '<div class="gn-lab-stage" data-stage></div>' +
        '<div class="gn-lab-controls">' +
        '<label class="gn-lab-ctrl">Percent: <input type="range" min="0" max="100" step="5" value="' +
        pct +
        '" data-pct /><span data-pct-val>' +
        pct +
        "%</span></label>" +
        '<label class="gn-lab-ctrl">Whole: <input type="range" min="10" max="400" step="10" value="' +
        wholeVal +
        '" data-whole /><span data-whole-val>' +
        wholeVal +
        "</span></label>" +
        '<div class="gn-lab-pills">' +
        [10, 20, 25, 50, 75, 80]
          .map(function (p) {
            return (
              '<button type="button" class="gn-lab-btn" data-p="' +
              p +
              '">' +
              p +
              "%</button>"
            );
          })
          .join("") +
        "</div>" +
        "</div>" +
        '<div class="gn-lab-readout" data-readout></div>';

      var renderPct = function () {
        var cells = "";
        for (var i = 0; i < 100; i++) {
          var r = Math.floor(i / 10),
            c = i % 10;
          var on = i < pct;
          cells +=
            '<rect x="' +
            (14 + c * 11) +
            '" y="' +
            (8 + r * 8) +
            '" width="9.5" height="6.5" rx="1" fill="' +
            (on ? "#f2b705" : "#e2e8f0") +
            '" stroke="#0f172a" stroke-width="0.7"/>';
        }
        var part = +((pct / 100) * wholeVal).toFixed(2);
        var rem = +(wholeVal - part).toFixed(2);
        var barFill = Math.round((pct / 100) * 240);
        var tape =
          '<text x="145" y="22" font-size="11" font-weight="900" fill="#0f172a">Tape Diagram (Whole = ' +
          wholeVal +
          ")</text>" +
          '<rect x="145" y="30" width="240" height="24" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>' +
          '<rect x="145" y="30" width="' +
          barFill +
          '" height="24" rx="4" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>' +
          '<text x="' +
          (145 + Math.max(28, barFill / 2)) +
          '" y="46" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">' +
          pct +
          "% = " +
          part +

            bw +
            '" height="34" rx="6" fill="' +
            (isMed ? "#f2b705" : "#fff") +
            '" stroke="#0f172a" stroke-width="2.5"/>' +
            '<text x="' +
            (x + bw / 2) +
            '" y="36" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">' +
            v +
            "</text>";
          if (showMAD) {
            boxes +=
              '<text x="' +
              (x + bw / 2) +
              '" y="66" font-size="10" font-weight="800" fill="#b42318" text-anchor="middle">|d|=' +
              +Math.abs(v - mean).toFixed(1) +
              "</text>";
          }
        });
        host.querySelector("[data-stage]").innerHTML =
          '<svg viewBox="0 0 420 80" style="background:white">' +
          boxes +

        host.querySelector("[data-readout]").innerHTML =
          "<span><b>" +
          (sorted ? "Sorted (Median highlighted)" : "Unsorted Raw Data") +

          arr.length +

          "<span><b>Mean:</b> <code>" +
          mean +

          median +

    if (type === "coord-navigator") {
      var px = Math.max(-10, Math.min(10, Math.round(nums[0] || -4)));
      var py = Math.max(-10, Math.min(10, Math.round(nums[1] || 3)));
      host.innerHTML =
        '<div class="gn-lab-header">' +
        '<span class="gn-lab-badge">&#129517; 4-Quadrant Coordinate Sonar &amp; Reflection Lab</span>' +
        '<span class="gn-lab-sub">Move (x, y) or reflect across axes to check signs &amp; distances</span>' +
        "</div>" +
        '<div class="gn-lab-stage" data-stage></div>' +
        '<div class="gn-lab-controls">' +
        '<label class="gn-lab-ctrl">x: <input type="range" min="-10" max="10" value="' +
        px +
        '" data-x /><span data-x-val>' +
        px +
        "</span></label>" +
        '<label class="gn-lab-ctrl">y: <input type="range" min="-10" max="10" value="' +

        '<div class="gn-lab-pills">' +
        '<button type="button" class="gn-lab-btn" data-rx>Reflect X-Axis (x, -y)</button>' +

        "</div>" +
        "</div>" +

      var renderCoord = function () {

        var quad =

          '<svg viewBox="0 0 420 150" style="background:white">' +
          '<rect x="140" y="8" width="140" height="134" fill="#f8fafc" stroke="#cbd5e1"/>' +
          '<line x1="140" y1="' +
          cy +
          '" x2="280" y2="' +
          cy +
          '" stroke="#0f172a" stroke-width="2"/>' +
          '<line x1="' +
          cx +
          '" y1="8" x2="' +
          cx +
          '" y2="142" stroke="#0f172a" stroke-width="2"/>' +
          '<line x1="' +
          cx +
          '" y1="' +
          sy +
          '" x2="' +
          sx +
          '" y2="' +
          sy +
          '" stroke="#0d9488" stroke-dasharray="3 2"/>' +
          '<line x1="' +
          sx +
          '" y1="' +
          cy +
          '" x2="' +
          sx +
          '" y2="' +
          sy +

          sx +

          sy +

          quad +

        host.querySelector("[data-readout]").innerHTML =
          "<span><b>Ordered Pair:</b> <code>(" +
          px +
          ", " +
          py +
          ") &rarr; " +
          quad +
          "</code></span>" +
          "<span><b>Opposite of " +
          px +

      host.querySelector("[data-x]").addEventListener("input", function (ev) {

      host.querySelector("[data-ry]").addEventListener("click", function () {

      renderCoord();

    if (type === "decimal-lab") {
      var d1 = +(nums[0] || 4.8).toFixed(2);
      var d2 = +(nums[1] || 0.6).toFixed(2);
      if (d2 === 0) d2 = 0.4;
      var shift = 0;
      host.innerHTML =
        '<div class="gn-lab-header">' +
        '<span class="gn-lab-badge">&#128290; Decimal Place-Value &amp; Power-of-10 Shifter</span>' +
        '<span class="gn-lab-sub">Slide both decimal points together (&times;10, &times;100) to make a whole-number divisor</span>' +
        "</div>" +
        '<div class="gn-lab-stage" data-stage></div>' +
        '<div class="gn-lab-controls">' +
        '<div class="gn-lab-pills">' +
        '<button type="button" class="gn-lab-btn active" data-sh="0">Original (&times;1)</button>' +
        '<button type="button" class="gn-lab-btn" data-sh="1">Shift 1 Place (&times;10)</button>' +
        '<button type="button" class="gn-lab-btn" data-sh="2">Shift 2 Places (&times;100)</button>' +
        "</div>" +
        "</div>" +
        '<div class="gn-lab-readout" data-readout></div>';

      var renderDec = function () {
        var mult = Math.pow(10, shift);
        var s1 = +(d1 * mult).toFixed(3);
        var s2 = +(d2 * mult).toFixed(3);
        host.querySelector("[data-stage]").innerHTML =
          '<svg viewBox="0 0 420 78" style="background:white">' +
          '<rect x="18" y="12" width="175" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>' +
          '<text x="105" y="34" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">Dividend (&times;' +
          mult +
          ")</text>" +
          '<text x="105" y="55" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">' +
          s1 +
          "</text>" +
          '<text x="210" y="46" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">&divide;</text>' +
          '<rect x="227" y="12" width="175" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>' +
          '<text x="314" y="34" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">Divisor (&times;' +
          mult +
          ")</text>" +
          '<text x="314" y="55" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">' +
          s2 +
          (Number.isInteger(s2) ? " (Whole!)" : "") +
          "</text>" +
          "</svg>";
        host.querySelector("[data-readout]").innerHTML =
          "<span><b>Line Up (+ / &minus;):</b> <code>" +
          d1 +
          " + " +
          d2 +
          " = " +
          +(d1 + d2).toFixed(3) +
          "</code></span>" +
          "<span><b>Equivalent Division:</b> <code>" +
          d1 +
          " &divide; " +
          d2 +
          " = " +
          s1 +
          " &divide; " +
          s2 +
          "</code></span>";
      };
      host.addEventListener("click", function (e) {
        var b = e.target.closest("[data-sh]");
        if (!b) return;
        Array.prototype.slice
          .call(host.querySelectorAll("[data-sh]"))
          .forEach(function (el) {
            el.classList.remove("active");
          });
        b.classList.add("active");
        shift = +b.dataset.sh;
        renderDec();
      });
      renderDec();
      return host;
    }

    // Default / factor-lab (Unit 1 Prime Station: GCF, LCM & Prime Factors)
    var numA = Math.min(48, Math.max(4, Math.round(nums[0] || 12)));
    var numB = Math.min(48, Math.max(4, Math.round(nums[1] || 18)));
    if (numA === numB) numB = numA + 6;
    host.innerHTML =
      '<div class="gn-lab-header">' +
      '<span class="gn-lab-badge">&#9881;&#65039; GCF &amp; LCM Factor Sync Lab</span>' +
      '<span class="gn-lab-sub">Slide A and B to compare shared factors (GCF) and sync cycles (LCM)</span>' +
      "</div>" +
      '<div class="gn-lab-stage" data-stage></div>' +
      '<div class="gn-lab-controls">' +
      '<label class="gn-lab-ctrl">Number A: <input type="range" min="2" max="48" value="' +
      numA +
      '" data-a /><span data-a-val>' +
      numA +
      "</span></label>" +
      '<label class="gn-lab-ctrl">Number B: <input type="range" min="2" max="48" value="' +
      numB +
      '" data-b /><span data-b-val>' +
      numB +
      "</span></label>" +
      "</div>" +
      '<div class="gn-lab-readout" data-readout></div>';

    var renderFactors = function () {
      var g = gcd(numA, numB);
      var lcm = (numA * numB) / g;
      var shared = [];
      for (var f = 1; f <= Math.min(numA, numB); f++) {
        if (numA % f === 0 && numB % f === 0) shared.push(f);
      }
      host.querySelector("[data-stage]").innerHTML =
        '<svg viewBox="0 0 420 82" style="background:white">' +
        '<circle cx="155" cy="41" r="34" fill="#38bdf8" fill-opacity="0.28" stroke="#1d4ed8" stroke-width="2.5"/>' +
        '<circle cx="265" cy="41" r="34" fill="#f2b705" fill-opacity="0.28" stroke="#b45309" stroke-width="2.5"/>' +
        '<text x="115" y="45" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">A = ' +
        numA +
        "</text>" +
        '<text x="210" y="36" font-size="11" font-weight="900" fill="#047857" text-anchor="middle">GCF = ' +
        g +
        "</text>" +
        '<text x="210" y="52" font-size="11" font-weight="900" fill="#b42318" text-anchor="middle">LCM = ' +
        lcm +
        "</text>" +
        '<text x="305" y="45" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">B = ' +
        numB +
        "</text>" +
        "</svg>";
      host.querySelector("[data-readout]").innerHTML =
        "<span><b>Shared Factors:</b> <code>" +
        shared.join(", ") +
        " (GCF = " +
        g +
        ")</code></span>" +
        "<span><b>First Sync Multiple (LCM):</b> <code>" +
        lcm +
        "</code></span>";
    };
    host.querySelector("[data-a]").addEventListener("input", function (e) {
      numA = +e.target.value;
      host.querySelector("[data-a-val]").textContent = numA;
      renderFactors();
    });
    host.querySelector("[data-b]").addEventListener("input", function (e) {
      numB = +e.target.value;
      host.querySelector("[data-b-val]").textContent = numB;
      renderFactors();
    });
    renderFactors();
    return host;
  }

  /* Attach "Snap to Mission Numbers" & "Pin Discovery to Log (+10 XP)" to any Math Lab */

      NOTEBOOK.entries.push({
