peaker\":\"jules\",\"text\":\"I am asking how many half-cups sit inside six cups. That is more servings than cups.\",\"supported\":\"Dividing by 1/2 doubles the count.\"},{\"speaker\":\"sera\",\"text\":\"The next pot is 3 1/2 pounds of rice in half-pound bags. The whole and the half both have to be divided.\"}],\"choices\":{\"prompt\":\"The loading rule is an expression, not an answer yet. What do you do?\",\"options\":[{\"id\":\"u6-truck-a\",\"label\":\"Name the variable\",\"consequence\":\"You say what quantity the letter stands for.\",\"next\":\"u6-truck-choice-a\"},{\"id\":\"u6-truck-b\",\"label\":\"Substitute the known count\",\"consequence\":\"You replace the letter with the count from the dock.\",\"next\":\"u6-truck-choice-b\"}]}},{\"id\":\"u6-truck-choice-a\",\"place\":\"Archive kitchen\",\"focus\":\"mara\",\"next\":\"half-cups\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Inez writes 'let n be the number of crates' before anyone substitutes.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u6-truck-choice-b\",\"place\":\"Archive kitchen\",\"focus\":\"jules\",\"next\":\"half-cups\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Sera swaps the letter for the crate count and keeps the operations in order.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"half-cups\",\"place\":\"The broth pot\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"How many mugs does the expression 6 ÷ 1/2 name?\"}],\"challenge\":{\"id\":\"broth\",\"objective\":\"Evaluate a whole number divided by a unit fraction.\",\"supported\":{\"prompt\":\"How many 1/2-cup mugs fit in 6 cups?\",\"visual\":{\"type\":\"expression\",\" it in 3 1/2 pounds?\",\"visual\":{\"type\":\"expression\",\"display\":\"3 1/2 ÷ 1/2\",\"caption\":\"3 1/2 = 7/2\"},\"input\":{\"type\":\"number\",\"label\":\"Bags\",\"model\":{\"op\":\"howManyGroups\",\"total\":3.5,\"group\":0.5},\"hint\":\"3 1/2 is 7 halves. Each bag is 1 half, so the quotient is 7.\",\"traps\":[{\"value\":3,\"feedback\":\"That keeps only the whole pounds and drops the extra half.\",\"misconception\":\"dropped-fraction\"},{\"value\":1.75,\"feedback\":\"3.5 × 0.5 multiplies. You need to divide.\",\"misconception\":\"multiplied-by-fraction\"}]}},\"independent\":{\"prompt\":\"4 1/2 pounds of noodles are portioned into 3/4-pound boxes. How many boxes?\",\"input\":{\"type\":\"number\",\"label\":\"Boxes\",\"model\":{\"op\":\"howManyGroups\",\"total\":4.5,\"group\":0.75},\"hint\":\"4 1/2 = 9/2, and 3/4 = 3/4. 4.5 ÷ 0.75 = 6.\",\"traps\":[{\"value\":4,\"feedback\":\"Dropping the half pound leaves 4 ÷ 0.75, which is not even the right dividend.\",\"misconception\":\"dropped-fraction\"},{\"value\":3.375,\"feedback\":\"That is 4.5 × 0.75, a product of the two amounts.\",\"misconception\":\"multiplied-by-fraction\"}]}},\"success\":{\"supported\":\"Seven bags. The half pound was not a decoration.\",\"independent\":\"Six boxes. 4 1/2 ÷ 3/4 lands evenly.\"},\"consequence\":\"Mixed numbers enter the expression and survive.\"}},{\"id\":\"meaning\",\"place\":\"The serving hatch\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"The hatch will open only if we say what the quotient counts.\"},{\"speaker\":\"rudd\",\"text\":\"It counts food. Open the hatch.\"}]},{\"id\":\"interpret\",\"place\":\"The serving hatch\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Choose the meaning that matches the expression.\"}],\"challenge\":{\"id\":\"quotient-meaning\",\"objective\":\"Interpret a fractional quotient as a number of groups.\",\"supported\":{\"prompt\":\"What does 6 ÷ 1/2 = 12 mean in the kitchen?\",\"input\":{\"type\":\"choice\",\"auditCor nd someone computed 2 times 5.\"},{\"speaker\":\"sera\",\"text\":\"An exponent counts factors. It does not add the base to itself.\"},{\"speaker\":\"narrator\",\"text\":\"Steam from the kitchen followed them down, thinner than a mistake about to get larger very quickly.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Servings at the Night Kitchen · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
