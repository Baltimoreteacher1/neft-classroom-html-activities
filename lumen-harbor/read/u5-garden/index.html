its sides match.\"],\"representations\":[\"Parallelogram\",\"Triangle\",\"Base and height\"],\"use\":[\"during\"],\"scenes\":[{\"id\":\"plot\",\"place\":\"Pavilion garden\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Chalk lines crossed the mud: a leaning parallelogram bed and, inside the same footprint, a triangular planting the donor insisted was 'half, probably.'\"},{\"speaker\":\"theo\",\"text\":\"Base 9 meters. The perpendicular height is 4. The slanted side is 5, and the bid multiplies by 5 because 5 is printed larger.\",\"supported\":\"Area uses the height that meets the base at a right angle.\"},{\"speaker\":\"jules\",\"text\":\"A rhombus with side 9 is still a parallelogram. Equal sides do not replace the height.\"}],\"choices\":{\"prompt\":\"The garden sketch is not to scale. What do you measure first?\",\"options\":[{\"id\":\"u5-garden-a\",\"label\":\"The side lengths you will multiply\",\"consequence\":\"You collect the factors of the area before you draw.\",\"next\":\"u5-garden-choice-a\"},{\"id\":\"u5-garden-b\",\"label\":\"The right angles you are assuming\",\"consequence\":\"You check that the corners are actually right angles.\",\"next\":\"u5-garden-choice-b\"}]}},{\"id\":\"u5-garden-choice-a\",\"place\":\"Pavilion garden\",\"focus\":\"mara\",\"next\":\"para\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Sera lists the lengths that form the area. A pretty sketch is not a measurement.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u5-garden-choice-b\",\"place\":\"Pavilion garden\",\"focus\":\"jules\",\"next\":\"para\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara tests the corners. Area formulas for rectangles do not survive a leaning wall.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"para\",\"place\":\"The leaning bed\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"Find the area the soil actually covers.\"}],\"challenge\":{\"id\":\"para-area\",\"objective\":\"Calculate parallelogram area from base and perpendicular height.\",\"supported\":{\"prompt\":\"The bed is a parallelogram with base 9 m and perpendicular height 4 m. What is the area?\",\"visual\":{\"type\":\"area\",\"shape\":\"parallelogram\",\"a\":9,\"h\":4,\"unit\":\"m\"},\"input\":{\"type\":\"number\",\"label\":\"Square meters\",\"unit\":\"m²\",\"model\":{\"op\":\"areaParallelogram\",\"base\":9,\"height\":4},\"hint\":\"Area = base × perpendicular height. Do not multiply by the slanted side.\",\"traps\":[{\"value\":45,\"feedback\":\"9 × 5 uses the slanted side. That side is not the height.\",\"misconception\":\"slant-as-height\"},{\"value\":18,\"feedback\":\"That halves the product. A parallelogram is the full base times height. The triangle is the half.\",\"misconception\":\"halved-parallelogram\"}]}},\"independent\":{\"prompt\":\"A rhombus panel has all sides 9 m and a perpendicular height of 4 m to the base you are using. What is its area?\",\"visual\":{\"type\":\"area\",\"shape\":\"parallelogram\",\"a\":9,\"h\":4,\"unit\":\"m\"},\"input\":{\"type\":\"number\",\"label\":\"Square meters\",\"unit\":\"m²\",\"model\":{\"op\":\"areaParallelogram\",\"base\":9,\"height\":4},\"hint\":\"A rhombus is a special parallelogram. Equal sides do not change the area rule: base × perpendicular height.\",\"traps\":[{\"value\":81,\"feedback\":\"9 × 9 multiplies two sides. Without a right angle, that product is not the area.\",\"misconception\":\"side-times-side\"},{\"value\":18,\"feedback\":\"18 halves the product. This rhombus uses the full parallelogram rule.\",\"misconception\":\"halved-parallelogram\"}]}},\"success\":{\"supported\":\"Thirty-six square meters of bed. The slanted 5 stays a length, not a height.\",\"independent\":\"The rhombus is also 36 square meters. Matching sides never became a license to skip the height.\"},\"consequence\":\"The garden bed has an area the bid can no longer inflate with a slant.\"}},{\"id\":\"half\",\"place\":\"The triangular planting\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Same base, same perpendicular height. The triangle is half the parallelogram, not a vague half of whatever we feel.\",\"supported\":\"Triangle area = base × height ÷ 2.\"}]},{\"id\":\"tri\",\"place\":\"The triangular planting\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"How much planting is the triangle?\"}],\"challenge\":{\"id\":\"tri-area\",\"objective\":\"Calculate triangle area and relate it to the parallelogram.\",\"supported\":{\"prompt\":\"The triangle has base 9 m and perpendicular height 4 m. What is its area?\",\"visual\":{\"type\":\"area\",\"shape\":\"triangle\",\"a\":9,\"h\":4,\"unit\":\"m\"},\"input\":{\"type\":\"number\",\"label\":\"Square meters\",\"unit\":\"m²\",\"model\":{\"op\":\"areaTriangle\",\"base\":9,\"height\":4},\"hint\":\"Multiply base by height, then divide by 2. The parallelogram was 36, so the triangle should be half of that.\",\"traps\":[{\"value\":36,\"feedback\":\"36 is the parallelogram. The triangle is half of base times height.\",\"misconception\":\"forgot-half\"},{\"value\":22.5,\"feedback\":\"That still uses the slant. Half of the wrong product is still wrong.\",\"misconception\":\"slant-as-height\"}]}},\"independent\":{\"prompt\":\"A second triangle has base 12.5 m and perpendicular height 6 m. The donor wants it called 'about 40.' What is the exact area?\",\"visual\":{\"type\":\"area\",\"shape\":\"triangle\",\"a\":12.5,\"h\":6,\"unit\":\"m\"},\"input\":{\"type\":\"number\",\"label\":\"Square meters\",\"model\":{\"op\":\"areaTriangle\",\"base\":12.5,\"height\":6},\"hint\":\"12.5 × 6 = 75, and half of 75 is 37.5. 'About 40' is a guess, not the area.\",\"traps\":[{\"value\":75,\"feedback\":\"75 is base times height before halving.\",\"misconception\":\"forgot-half\"},{\"value\":40,\"feedback\":\"40 is the donor's estimate. The exact area is half of 75.\",\"misconception\":\"estimate-as-exact\"}]}},\"success\":{\"supported\":\"Eighteen square meters. Exactly half the parallelogram, because the base and height match.\",\"independent\":\"37.5 square meters. The word 'about' does not get to replace the half.\"},\"consequence\":\"The triangle is measured, not shrugged.\"}},{\"id\":\"which-height\",\"place\":\"The bid packet\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"rudd\",\"text\":\"Five is on the drawing. Four is in the grass. Use the ink.\"},{\"speaker\":\"mara\",\"text\":\"Ink can lean. The height cannot.\"}]},{\"id\":\"height-choice\",\"place\":\"The bid packet\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Choose the measurement that is allowed to enter the formula.\"}],\"challenge\":{\"id\":\"which-height\",\"objective\":\"Distinguish perpendicular height from a slanted side.\",\"supported\":{\"prompt\":\"Which measurement is the height for the area formulas in this garden?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"perp\",\"hint\":\"The height meets the base at a right angle. A side that leans is still a side.\",\"options\":[{\"id\":\"slant\",\"label\":\"The 5 m slanted side, because it is longer and printed in the bid.\",\"feedback\":\"Length and printing do not make a height. The slant is not perpendicular to the base.\",\"misconception\":\"slant-as-height\"},{\"id\":\"perp\",\"label\":\"The 4 m segment that meets the base at a right angle.\",\"correct\":true,\"feedback\":\"That is the perpendicular height. Both the parallelogram and the triangle use it.\"},{\"id\":\"either\",\"label\":\"Either, because both touch the shape.\",\"feedback\":\"Touching the shape is not the definition. The formulas name a specific height.\",\"misconception\":\"any-length\"}]}},\"independent\":{\"prompt\":\"The contractor says, 'A rhombus uses side squared, so the height is irrelevant.' What is the repair to that sentence?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"repair\",\"hint\":\"Side squared is the area of a square, which is a rhombus with right angles. This rhombus leans.\",\"options\":[{\"id\":\"agree\",\"label\":\"The contractor is right. All rhombi have area side × side.\",\"feedback\":\"Only the square has that shortcut, because its height equals its side. A leaning rhombus has a shorter perpendicular height.\",\"misconception\":\"side-times-side\"},{\"id\":\"repair\",\"label\":\"Side squared works for a square. This rhombus still needs base × perpendicular height.\",\"correct\":true,\"feedback\":\"Equal sides describe the rhombus. They do not by themselves give the area.\"},{\"id\":\"perimeter\",\"label\":\"Use the perimeter instead of any height.\",\"feedback\":\"Perimeter measures the boundary. The garden bid is about covering, which is area.\",\"misconception\":\"perimeter-as-area\"}]}},\"success\":{\"supported\":\"The 4-meter height stays in the formula. The bid's favorite 5 is crossed out.\",\"independent\":\"The rhombus keeps its height. Side squared goes back to the squares it belongs to.\"},\"consequence\":\"The garden areas are defensible. The floor plan inside the pavilion is next, and it counts a region twice.\"}},{\"id\":\"floor-hook\",\"place\":\"The pavilion threshold\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"The festival floor is a trapezoid pretending to be a rectangle, plus a triangle someone counted in two pieces.\"},{\"speaker\":\"theo\",\"text\":\"If we pay for an overlap, we buy mud twice.\"},{\"speaker\":\"narrator\",\"text\":\"The garden held still at last. The floor, being made of more than one shape, was not finished arguing.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",
