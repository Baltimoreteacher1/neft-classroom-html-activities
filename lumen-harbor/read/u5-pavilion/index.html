ctangular prism\"],\"use\":[\"after\",\"during\"],\"scenes\":[{\"id\":\"well\",\"place\":\"Pavilion well\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"The floor was a regular hexagon in all but the invoice, which called it 'about 30 by 4.' The storage beneath was a box 5 by 4 by 2.\"},{\"speaker\":\"theo\",\"text\":\"Perimeter 30 meters. Apothem 4 meters. The area is half the perimeter times the apothem, because the polygon is six triangles.\",\"supported\":\"Area = (perimeter × apothem) ÷ 2.\"},{\"speaker\":\"jules\",\"text\":\"The box underneath is not another floor. It is a volume.\"}],\"choices\":{\"prompt\":\"The pavilion has a triangle in the roof. What do you find first?\",\"options\":[{\"id\":\"u5-pavilion-a\",\"label\":\"The base and the height of the triangle\",\"consequence\":\"You collect the two measurements area needs.\",\"next\":\"u5-pavilion-choice-a\"},{\"id\":\"u5-pavilion-b\",\"label\":\"Which side is not the height\",\"consequence\":\"You reject a slanted side that only looks like the height.\",\"next\":\"u5-pavilion-choice-b\"}]}},{\"id\":\"u5-pavilion-choice-a\",\"place\":\"Pavilion well\",\"focus\":\"mara\",\"next\":\"poly\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Jules marks a base and the height perpendicular to it.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u5-pavilion-choice-b\",\"place\":\"Pavilion well\",\"focus\":\"jules\",\"next\":\"poly\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara labels the slanted rafter as a side, not the height, unless it is perpendicular to the base.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"poly\",\"place\":\"The oor's square meters into the same blank.\"}]},{\"id\":\"store-volume\",\"place\":\"Under the floor\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"What does the storage hold?\"}],\"challenge\":{\"id\":\"storage-volume\",\"objective\":\"Calculate prism volume and keep the unit distinct from area.\",\"supported\":{\"prompt\":\"What is the volume of the 5 m by 4 m by 2 m storage prism?\",\"visual\":{\"type\":\"prism\",\"l\":5,\"w\":4,\"h\":2,\"unit\":\"m\"},\"input\":{\"type\":\"number\",\"label\":\"Cubic meters\",\"model\":{\"op\":\"volume\",\"l\":5,\"w\":4,\"h\":2},\"hint\":\"5 × 4 × 2. The floor area above is a different question and a different unit.\",\"traps\":[{\"value\":60,\"feedback\":\"60 is the hexagon's area, not this prism's volume.\",\"misconception\":\"copied-area\"},{\"value\":11,\"feedback\":\"11 adds the three edges.\",\"misconception\":\"added-dimensions\"}]}},\"independent\":{\"prompt\":\"A second bay is 3.5 m by 2 m by 2 m. Find its volume, and find the area of its floor (the 3.5 by 2 rectangle). Enter the volume first.\",\"input\":{\"type\":\"fields\",\"hint\":\"Volume multiplies all three dimensions. Floor area multiplies only length and width. The units differ even when you are looking at one bay.\",\"fields\":[{\"id\":\"volume\",\"label\":\"Volume (m³)\",\"model\":{\"op\":\"volume\",\"l\":3.5,\"w\":2,\"h\":2},\"miss\":\"Multiply 3.5 × 2 × 2.\"},{\"id\":\"floor\",\"label\":\"Floor area (m²)\",\"model\":{\"op\":\"product\",\"factors\":[3.5,2]},\"miss\":\"The floor is the rectangle 3.5 by 2, without the height.\"}]}},\"success\":{\"supported\":\"Forty cubic meters. The storage can be ordered without borrowing the floor's number.\",\"independent\":\"Fourteen cubic meters inside, seven square meters of floor. Same bay, two questions.\"},\"consequence\":\"Storage has a volume of its own.\"}},{\"id\":\"invoice\",\"place\":\"The invoice\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"rudd\",\"text\":\"Put 60 in both blanks. The pavilion is one project.\"},{\"speaker\":\"mara\",\"text\":\"One project can still ask two questions.\"}]},{\"id\":\"units-choice\",\"place\":\"The invoice\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Match each question to the measurement that can answer it.\"}],\"challenge\":{\"id\":\"which-unit\",\"objective\":\"Match area and volume to the questions they answer.\",\"supported\":{\"prompt\":\"Which pairing is correct?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"pair\",\"hint\":\"Covering the floor is square units. Filling the storage is cubic units.\",\"options\":[{\"id\":\"swap\",\"label\":\"Floor: 40 cubic meters. Storage: 60 square meters.\",\"feedback\":\"The numbers are attached to the wrong questions, and the units are swapped with them.\",\"misconception\":\"swapped-measures\"},{\"id\":\"pair\",\"label\":\"Floor: 60 square meters. Storage: 40 cubic meters.\",\"correct\":true,\"feedback\":\"Area covers the polygon. Volume fills the prism.\"},{\"id\":\"same\",\"label\":\"Both 60, because the floor is above the storage so they match.\",\"feedback\":\"Being in the same building does not make area equal volume.\",\"misconception\":\"same-building-same-measure\"}]}},\"independent\":{\"prompt\":\"Which revision would you actually send the contractor?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"revision\",\"hint\":\"Name the formula, the unit, and the question in one sentence each.\",\"options\":[{\"id\":\"one-number\",\"label\":\"One blended unit called pavilion-units, so the argument ends.\",\"feedback\":\"A blended unit hides the mistake instead of answering either question.\",\"misconception\":\"invented-unit\"},{\"id\":\"revision\",\"label\":\"Floor area is half the perimeter times the apothem, in square meters. Storage volume is length times width times height, in cubic meters.\",\"correct\":true,\"feedback\":\"The revision keeps the formulas and the units with the questions they serve.\"},{\"id\":\"drop\",\"label\":\"Delete the storage. Floors are easier to explain.\",\"feedback\":\"Avoiding a measurement does not make the stored stone disappear.\",\"misconception\":\"dropped-question\"}]}},\"success\":{\"supported\":\"The invoice splits. Sixty square meters above, forty cubic meters below.\",\"independent\":\"The revision goes out with both formulas visible. The pavilion bid can no longer share one blank.\"},\"consequence\":\"The architectural file closes. Somewhere under the archive, an expression is waiting to be simplified before a door will open.\"}},{\"id\":\"to-code\",\"place\":\"The service stair\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"The Archive door does not want a password. It wants an expression that keeps its value.\"},{\"speaker\":\"sera\",\"text\":\"Fraction bars, exponents, factors. If we treat them as decorations, we stay in the stair.\"},{\"speaker\":\"narrator\",\"text\":\"Above them the pavilion finally measured what it was. Below, the locks began to speak in symbols.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Pavilion's Two Questions · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
