he hidden plate, multiply both sides by 4. Division is undone by multiplication.\"}],\"choices\":{\"prompt\":\"The vault equation has a variable on one side. What is your first move?\",\"options\":[{\"id\":\"u8-vault-a\",\"label\":\"Undo addition or subtraction\",\"consequence\":\"You isolate the variable term before dividing.\",\"next\":\"u8-vault-choice-a\"},{\"id\":\"u8-vault-b\",\"label\":\"Undo multiplication or division\",\"consequence\":\"You scale both sides once the variable term is alone.\",\"next\":\"u8-vault-choice-b\"}]}},{\"id\":\"u8-vault-choice-a\",\"place\":\"Vault drawer\",\"focus\":\"mara\",\"next\":\"times\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Jules adds or subtracts to get the variable term alone.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u8-vault-choice-b\",\"place\":\"Vault drawer\",\"focus\":\"jules\",\"next\":\"times\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara multiplies or divides only after the variable is no longer hiding in a sum.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"times\",\"place\":\"The first plate\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"Solve 6x = 42.\"}],\"challenge\":{\"id\":\"solve-mult\",\"objective\":\"Solve a multiplication equation.\",\"supported\":{\"prompt\":\"What is x if 6x = 42?\",\"visual\":{\"type\":\"balance\",\"left\":\"6x\",\"right\":\"42\"},\"input\":{\"type\":\"number\",\"label\":\"x\",\"model\":{\"op\":\"quotient\",\"a\":42,\"b\":6},\"hint\":\"Divide both sides by 6. Check that 6 times your answer is 42.\",\"traps\":[{\"value\":252,\"feedback\":\"42 × 6 multiplies by the coefficient again.\",\"misconception\":\"wrong-inverse\"},{\"value\":6,\"feedback\":\"6 is the coefficient, not the solution.\",\"misconception\":\"constant-as-solution\"}]}},\"independent\":{\"prompt\":\"Solve 2.5n = 20.\",\"input\":{\"type\":\"number\",\"label\":\"n\",\"model\":{\"op\":\"quotient\",\"a\":20,\"b\":2.5},\"hint\":\"Divide 20 by 2.5. You can think of 2.5 × 8 = 20.\",\"traps\":[{\"value\":50,\"feedback\":\"20 × 2.5 uses the wrong inverse.\",\"misconception\":\"wrong-inverse\"},{\"value\":17.5,\"feedback\":\"20 − 2.5 subtracts the coefficient. The operation in the equation is multiplication.\",\"misconception\":\"wrong-operation\"}]}},\"success\":{\"supported\":\"x is 7. Six times seven returns 42, and the drawer hears it.\",\"independent\":\"n is 8. A decimal coefficient still has an inverse.\"},\"consequence\":\"The multiplication equation is solved.\"}},{\"id\":\"divide\",\"place\":\"The hidden plate\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"x/4 = 8. Four groups of 8 make x. I multiply both sides.\"}]},{\"id\":\"solve-div\",\"place\":\"The hidden plate\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"What is x?\"}],\"challenge\":{\"id\":\"solve-div\",\"objective\":\"Solve a division equation.\",\"supported\":{\"prompt\":\"Solve x ÷ 4 = 8.\",\"visual\":{\"type\":\"balance\",\"left\":\"x ÷ 4\",\"right\":\"8\"},\"input\":{\"type\":\"number\",\"label\":\"x\",\"model\":{\"op\":\"product\",\"factors\":[4,8]},\"hint\":\"Multiply both sides by 4. The check is 32 ÷ 4 = 8.\",\"traps\":[{\"value\":2,\"feedback\":\"8 ÷ 4 divides the right side by 4 again and never builds x.\",\"misconception\":\"wrong-inverse\"},{\"value\":12,\"feedback\":\"8 + 4 adds. The 4 is a divisor, so the inverse is multiplication.\",\"misconception\":\"wrong-operation\"}]}},\"independent\":{\"prompt\":\"Solve n/5 = 6.5 and check by entering n and the value of n/5.\",\"input\":{\"type\":\"fields\",\"hint\":\"Multiply 6.5 by 5 to find n. The check should come back to 6.5.\",\"fields\":[{\"id\":\"n\",\"label\":\"n\",\"model\":{\"op\":\"product\",\"factors\":[5,6.5]},\"miss\":\"Multiply both sides by 5.\"},{\"id\":\"check\",\"label\":\"n ÷ 5\",\"model\":{\"op\":\"quotient\",\"a\":32.5,\"b\":5},\"miss\":\"The check substitutes into the left side and must equal 6.5.\"}]}},\"success\":{\"supported\":\"x is 32. Dividing 32 by 4 lands on 8.\",\"independent\":\"n is 32.5, and 32.5 ÷ 5 is 6.5. The check is part of the key.\"},\"consequence\":\"The division equation is solved and checked.\"}},{\"id\":\"wrong-check\",\"place\":\"The false key\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"A previous visitor left x = 6 for 6x = 42 and checked by adding 6 + 42. I want that check retired.\"},{\"speaker\":\"theo\",\"text\":\"A check uses the original operations.\"}]},{\"id\":\"which-check\",\"place\":\"The false key\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Which check proves x = 7 for 6x = 42?\"}],\"challenge\":{\"id\":\"prove-key\",\"objective\":\"Select a valid substitution check.\",\"supported\":{\"prompt\":\"Which check shows that x = 7 solves 6x = 42?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"product\",\"hint\":\"Put 7 where x is. The original equation multiplies.\",\"options\":[{\"id\":\"sum\",\"label\":\"6 + 7 = 13, which is less than 42, so it is close enough.\",\"feedback\":\"Close is not equal, and addition is not the operation in 6x.\",\"misconception\":\"wrong-operation\"},{\"id\":\"product\",\"label\":\"6 × 7 = 42.\",\"correct\":true,\"feedback\":\"The left side becomes 42, which matches the right side.\"},{\"id\":\"quotient\",\"label\":\"42 × 6 = 252, so x is large and therefore fine.\",\"feedback\":\"That recomputes the wrong inverse and never substitutes 7.\",\"misconception\":\"wrong-inverse\"}]}},\"independent\":{\"prompt\":\"Which pair is a solved equation and a true check?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"pair\",\"hint\":\"Solve 2.5n = 20 first. The check multiplies the coefficient by the solution.\",\"options\":[{\"id\":\"bad\",\"label\":\"n = 50, because 20 + 2.5 is almost 2.5 × 8.\",\"feedback\":\"50 is 20 × 2.5. The check 2.5 × 50 is 125, not 20.\",\"misconception\":\"wrong-inverse\"},{\"id\":\"pair\",\"label\":\"n = 8, and 2.5 × 8 = 20.\",\"correct\":true,\"feedback\":\"The solution and the original operation agree.\"},{\"id\":\"half\",\"label\":\"n = 8, and 20 ÷ 8 = 2.5, which is unrelated and lucky.\",\"feedback\":\"That happens to rearrange the same fact, but the justification 'unrelated and lucky' is not a reason to trust it. The real check is 2.5 × 8 = 20. This option denies the relationship.\",\"misconception\":\"check-without-reason\"}]}},\"success\":{\"supported\":\"The product check closes the drawer. Addition is retired.\",\"independent\":\"n = 8 stands with its multiplication check. The vault keeps the key that returns the original number.\"},\"consequence\":\"The drawer opens. Entry to the repair arcade is not a single number. It is an inequality.\"}},{\"id\":\"gate-hook\",\"place\":\"The arcade gate\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"The sign says riders must be at least 48 inches. That is not h = 48. Forty-eight is allowed, and so is taller.\"},{\"speaker\":\"sera\",\"text\":\"A boundary can be included or not. The symbol is the whole rule.\"},{\"speaker\":\"narrator\",\"text\":\"Behind them the drawer shut on a true equation. Ahead, a rope line had more than one acceptable height.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Vault Key · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 throug
