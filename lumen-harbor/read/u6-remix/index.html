\"place\":\"Lettered gate\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"The gate's plate read 3x + 5, with a slot marked x = 4. A second plate offered 3(x + 5) as if parentheses were manners.\"},{\"speaker\":\"mara\",\"text\":\"Three groups of x, then five more. Not three groups of x plus five.\",\"supported\":\"3x + 5 means multiply x by 3, then add 5.\"},{\"speaker\":\"sera\",\"text\":\"We will evaluate the true plate, then refuse the look-alike.\"}],\"choices\":{\"prompt\":\"Two expressions claim to be the same remix. How do you test them?\",\"options\":[{\"id\":\"u6-remix-a\",\"label\":\"Generate a table of values\",\"consequence\":\"You try several inputs and compare outputs.\",\"next\":\"u6-remix-choice-a\"},{\"id\":\"u6-remix-b\",\"label\":\"Rewrite one expression into the other\",\"consequence\":\"You use properties to transform the form.\",\"next\":\"u6-remix-choice-b\"}]}},{\"id\":\"u6-remix-choice-a\",\"place\":\"Lettered gate\",\"focus\":\"mara\",\"next\":\"eval\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Jules builds a small table. One matching input is not proof, so the table keeps going.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u6-remix-choice-b\",\"place\":\"Lettered gate\",\"focus\":\"jules\",\"next\":\"eval\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Sera applies the distributive property and looks for an identical expression, not a lucky number.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"eval\",\"place\":\"The slot\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Substitute 4 for x. Multiply before you add.\"}],\"challenge\":{\"id\":\"eval-linear\",\"objective\":\"Evaluate 3x + 5 at a given value of x.\",\"supported\":{\"prompt\":\"What is 3x + 5 when x = 4?\",\"visual\":{\"type\":\"expression\",\"display\":\"3x + 5\",\"caption\":\"x = 4\"},\"input\":{\"type\":\"number\",\"label\":\"Value\",\"model\":{\"op\":\"linear\",\"slope\":3,\"x\":4,\"intercept\":5},\"hint\":\"3 × 4 = 12, and 12 + 5 = 17. The 5 is not multiplied by 3.\",\"traps\":[{\"value\":27,\"feedback\":\"3 × (4 + 5) = 27. That is 3(x + 5), a different expression.\",\"misconception\":\"distributed-too-far\"},{\"value\":12,\"feedback\":\"12 is 3x. The expression still adds 5.\",\"misconception\":\"dropped-constant\"}]}},\"independent\":{\"prompt\":\"The night plate is 8 + 2(x − 3) and x = 7. Evaluate it.\",\"input\":{\"type\":\"number\",\"label\":\"Value\",\"model\":{\"op\":\"add\",\"a\":{\"op\":\"n\",\"value\":8},\"b\":{\"op\":\"product\",\"factors\":[2,4]}},\"hint\":\"Inside the parentheses, 7 − 3 = 4. Then 2 × 4 = 8. Then add the leading 8.\",\"traps\":[{\"value\":22,\"feedback\":\"2 × 7 + 8 treats the parentheses as optional and never subtracts 3 before doubling.\",\"misconception\":\"ignored-parentheses\"},{\"value\":8,\"feedback\":\"8 is only the leading term, or only the doubled difference. The expression adds both.\",\"misconception\":\"dropped-constant\"}]}},\"success\":{\"supported\":\"Seventeen. The gate accepts 3(4) + 5.\",\"independent\":\"Sixteen. The parentheses were subtracted before they were doubled.\"},\"consequence\":\"A value gets through the slot. Equivalence is the next test.\"}},{\"id\":\"lookalike\",\"place\":\"The second plate\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"2(x + 3) and 2x + 6 name the same amounts. 2x + 3 does not, even if a tired person skips the parentheses.\",\"supported\":\"The factor outside parentheses applies to every term inside.\"}]},{\"id\":\"which-equivalent\",\"place\":\"The second plate\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Which expression is equivalent to 2(x + 3)?\"}],\"challenge\":{\"id\":\"equivalent\",\"objective\":\"Identify an equivalent algebraic expression.\",\"supported\":{\"prompt\":\"Which expression is equivalent to 2(x + 3)?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"both\",\"hint\":\"Multiply both the x and the 3 by 2. Test with x = 1 if you want a check, then trust the structure.\",\"options\":[{\"id\":\"one-term\",\"label\":\"2x + 3\",\"feedback\":\"Only the x was doubled. At x = 1, 2(1 + 3) = 8, while 2(1) + 3 = 5.\",\"misconception\":\"partial-distribute\"},{\"id\":\"both\",\"label\":\"2x + 6\",\"correct\":true,\"feedback\":\"2 times x and 2 times 3. The expressions match for every x.\"},{\"id\":\"sum\",\"label\":\"2x + 3x\",\"feedback\":\"That combines unlike ideas. 2(x + 3) is not 5x.\",\"misconception\":\"added-terms\"}]}},\"independent\":{\"prompt\":\"Which pair is equivalent for every x, not merely at x = 0?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"always\",\"hint\":\"At x = 0, several wrong rewrites still equal the original. Try x = 1 before you trust them.\",\"options\":[{\"id\":\"lucky\",\"label\":\"5x + 5 and 5(x + 1) are the same only when x = 0, so they are equivalent.\",\"feedback\":\"5x + 5 and 5(x + 1) match for every x, not only at zero. The option's reason is false even though the two expressions are equivalent.\",\"misconception\":\"one-value-test\"},{\"id\":\"always\",\"label\":\"4(x + 2) and 4x + 8\",\"correct\":true,\"feedback\":\"Both terms are multiplied by 4. The equality does not depend on a special x.\"},{\"id\":\"zero\",\"label\":\"4(x + 2) and 4x + 2, because both equal 2 when x = 0.\",\"feedback\":\"At x = 0 both equal 2. At x = 1 they are 12 and 6. One matching input is not equivalence.\",\"misconception\":\"one-value-test\"}]}},\"success\":{\"supported\":\"2x + 6 stays. The gate rejects the plate that doubled only the letter.\",\"independent\":\"4x + 8 matches 4(x + 2) for every x. A single friendly input is no longer enough to fool the lock.\"},\"consequence\":\"Equivalent expressions are identified by structure.\"}},{\"id\":\"check-value\",\"place\":\"The confirmation dial\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"The dial wants the common value of the equivalent pair at a stated x. One more substitution, then we leave.\"},{\"speaker\":\"jules\",\"text\":\"If the two forms disagree here, we picked the wrong pair.\"}]},{\"id\":\"shared-value\",\"place\":\"The confirmation dial\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Evaluate the equivalent form.\"}],\"challenge\":{\"id\":\"shared\",\"objective\":\"Evaluate an equivalent expression at a given value.\",\"supported\":{\"prompt\":\"2(x + 3) is equivalent to 2x + 6. What is the value when x = 5?\",\"input\":{\"type\":\"number\",\"label\":\"Value\",\"model\":{\"op\":\"linear\",\"slope\":2,\"x\":5,\"intercept\":6},\"hint\":\"2 × 5 + 6 = 16. Or 2(5 + 3) = 2 × 8 = 16.\",\"traps\":[{\"value\":13,\"feedback\":\"2 × 5 + 3 drops the factor on the 3. That is the non-equivalent look-alike.\",\"misconception\":\"partial-distribute\"},{\"value\":11,\"feedback\":\"5 + 3 + 2 + 1 adds pieces of the expression instead of using the operations.\",\"misconception\":\"added-terms\"}]}},\"independent\":{\"prompt\":\"Evaluate both 4(x + 2) and 4x + 8 at x = 3. Enter the shared value, then the value of the non-equivalent 4x + 2 at the same x so the dial can show the contrast.\",\"input\":{\"type\":\"fields\",\"hint\":\"The equivalent forms both give 4 × 3 + 8. The look-alike 4x + 2 gives 4 × 3 + 2.\",\"fields\":[{\"id\":\"good\",\"label\":\"Shared value\",\"model\":{\"op\":\"linear\",\"slope\":4,\"x\":3,\"intercept\":8},\"miss\":\"4(3 + 2) = 20, and 4 × 3 + 8 = 20.\"},{\"id\":\"bad\",\"label\":\"Value of 4x + 2\",\"model\":{\"op\":\"linear\",\"slope\":4,\"x\":3,\"intercept\":2},\"miss\":\"Only the x is multiplied by 4. Then add 2, not 8.\"}]}},\"success\":{\"supported\":\"Sixteen on both writings. The dial turns.\",\"i
