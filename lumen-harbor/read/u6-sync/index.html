\"focus\":\"sera\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"At minute 0 both beacons flashed, which did not help anyone arriving later. One cycle was 6 minutes, the other 8.\"},{\"speaker\":\"sera\",\"text\":\"I can list multiples, or I can build the least common multiple from primes. Multiplying 6 by 8 counts their shared 2 twice.\",\"supported\":\"LCM uses the highest power of each prime.\"},{\"speaker\":\"jules\",\"text\":\"The spare gear is stamped 36. I want its prime factorization before I claim it matches the cycle.\"}],\"choices\":{\"prompt\":\"Two crews describe one job with different expressions. What convinces you they match?\",\"options\":[{\"id\":\"u6-sync-a\",\"label\":\"The same value for several inputs\",\"consequence\":\"You test more than one number.\",\"next\":\"u6-sync-choice-a\"},{\"id\":\"u6-sync-b\",\"label\":\"The same structure after rewriting\",\"consequence\":\"You rewrite until the forms match.\",\"next\":\"u6-sync-choice-b\"}]}},{\"id\":\"u6-sync-choice-a\",\"place\":\"Beacon ridge\",\"focus\":\"mara\",\"next\":\"lcm-task\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Inez tries a handful of inputs. Equivalent expressions agree on all of them, not just a favorite.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u6-sync-choice-b\",\"place\":\"Beacon ridge\",\"focus\":\"jules\",\"next\":\"lcm-task\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Theo rewrites both expressions. Matching structure is stronger than one shared output.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"lcm-task\",\"place\":\"The two lights\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"When do they flash together again?\"}],\"challenge\":{\"id\":\"first-meet\",\"objective\":\"Find a least common multiple in a cycle problem.\",\"supported\":{\"prompt\":\"Beacons flash every 6 minutes and every 8 minutes. After minute 0, what is the next minute they flash together?\",\"input\":{\"type\":\"number\",\"label\":\"Minute\",\"model\":{\"op\":\"lcm\",\"a\":6,\"b\":8},\"hint\":\"Multiples of 6: 6, 12, 18, 24. Multiples of 8: 8, 16, 24. The least shared one is 24.\",\"traps\":[{\"value\":48,\"feedback\":\"48 is 6 × 8, a common multiple, but not the least. They share a factor of 2.\",\"misconception\":\"product-as-lcm\"},{\"value\":2,\"feedback\":\"2 is the greatest common factor, not a minute when both flash.\",\"misconception\":\"gcf-as-lcm\"}]}},\"independent\":{\"prompt\":\"A third beacon joins every 12 minutes, and the 8-minute beacon is still running. After minute 0, when do the 12-minute and 8-minute beacons next coincide?\",\"input\":{\"type\":\"number\",\"label\":\"Minute\",\"model\":{\"op\":\"lcm\",\"a\":12,\"b\":8},\"hint\":\"12 = 2² × 3 and 8 = 2³. The LCM takes 2³ × 3 = 24. Their product, 96, repeats a factor.\",\"traps\":[{\"value\":96,\"feedback\":\"96 is the product. The least common multiple is smaller because of shared factors of 2.\",\"misconception\":\"product-as-lcm\"},{\"value\":4,\"feedback\":\"4 is a common factor, not a common multiple large enough to be a full cycle of both.\",\"misconception\":\"gcf-as-lcm\"}]}},\"success\":{\"supported\":\"Minute 24. Both lights, and not a minute sooner.\",\"independent\":\"Also minute 24. Twelve and eight share enough factors that the product was a detour.\"},\"consequence\":\"The beacons have a meeting time.\"}},{\"id\":\"primes\",\"place\":\"The stamped gear\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"36 as a product of primes. One is not prime. Four is not prime. I keep breaking composite factors.\"}]},{\"id\":\"factor-36\",\"place\":\"The stamped gear\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"Which product is the prime factorization of 36?\"}],\"challenge\":{\"id\":\"prime-36\",\"objective\":\"Identify a prime factorization.\",\"supported\":{\"prompt\":\"Which expression is the prime factorization of 36?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"primes\",\"hint\":\"Every factor must be prime. 4 and 6 and 9 and 1 do not qualify.\",\"options\":[{\"id\":\"composite\",\"label\":\"4 × 9\",\"feedback\":\"4 × 9 = 36, but 4 and 9 are not prime. Keep factoring.\",\"misconception\":\"stopped-early\"},{\"id\":\"primes\",\"label\":\"2 × 2 × 3 × 3\",\"correct\":true,\"feedback\":\"2 and 3 are prime, and the product is 36. Exponents can write this as 2² × 3².\"},{\"id\":\"with-one\",\"label\":\"1 × 2 × 2 × 3 × 3\",\"feedback\":\"The product is 36, and 1 is not a prime. Prime factorizations do not include 1.\",\"misconception\":\"one-is-prime\"}]}},\"independent\":{\"prompt\":\"Which factorization of 84 is complete and prime?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"full\",\"hint\":\"84 = 2 × 42, and 42 is not prime. Continue through 7.\",\"options\":[{\"id\":\"early\",\"label\":\"2 × 6 × 7\",\"feedback\":\"6 is 2 × 3, so this stops before every factor is prime.\",\"misconception\":\"stopped-early\"},{\"id\":\"full\",\"label\":\"2 × 2 × 3 × 7\",\"correct\":true,\"feedback\":\"All four factors are prime and the product is 84.\"},{\"id\":\"sum\",\"label\":\"2 + 2 + 3 + 7\",\"feedback\":\"That adds to 14. Factorization is a product.\",\"misconception\":\"added-factors\"}]}},\"success\":{\"supported\":\"Two squared times three squared. The gear's stamp finally reads as primes.\",\"independent\":\"84 is 2² × 3 × 7. No composite factor remains in hiding.\"},\"consequence\":\"The beacon gear has a prime factorization.\"}},{\"id\":\"build-lcm\",\"place\":\"The combined cycle\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Use the primes to build one more LCM, so the method is not only a list we got lucky with.\"},{\"speaker\":\"theo\",\"text\":\"12 and 18. Take the highest power of each prime.\"}]},{\"id\":\"lcm-primes\",\"place\":\"The combined cycle\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"What is the least common multiple of 12 and 18?\"}],\"challenge\":{\"id\":\"lcm-12-18\",\"objective\":\"Compute an LCM from prime factors.\",\"supported\":{\"prompt\":\"12 = 2² × 3 and 18 = 2 × 3². What is the LCM?\",\"input\":{\"type\":\"number\",\"label\":\"LCM\",\"model\":{\"op\":\"lcm\",\"a\":12,\"b\":18},\"hint\":\"Take 2² and 3². That product is 4 × 9 = 36.\",\"traps\":[{\"value\":216,\"feedback\":\"12 × 18 counts the shared 2 and 3 too often.\",\"misconception\":\"product-as-lcm\"},{\"value\":6,\"feedback\":\"6 is the greatest common factor.\",\"misconception\":\"gcf-as-lcm\"}]}},\"independent\":{\"prompt\":\"A maintenance cycle of 18 minutes and a tide cycle of 30 minutes. What is the first shared minute after 0?\",\"input\":{\"type\":\"number\",\"label\":\"Minute\",\"model\":{\"op\":\"lcm\",\"a\":18,\"b\":30},\"hint\":\"18 = 2 × 3² and 30 = 2 × 3 × 5. LCM = 2 × 3² × 5 = 90.\",\"traps\":[{\"value\":540,\"feedback\":\"That is the product 18 × 30.\",\"misconception\":\"product-as-lcm\"},{\"value\":6,\"feedback\":\"6 divides both. It is not a full cycle of either.\",\"misconception\":\"gcf-as-lcm\"}]}},\"success\":{\"supported\":\"Thirty-six. The primes were enough. Listing would have agreed.\",\"independent\":\"Ninety minutes. The tide and the maintenance crew finally share a clock.\"},\"consequence\":\"Cycles meet by least common multiple. The last archive expression still needs the distributive property and a simplification.\"}},{\"id\":\"workshop-hook\",\"place\":\"The workshop door\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"The final key is an expression with parentheses and like terms. Expand it without changing it. Then combine what matches.\"},{\"speaker\":\"mara\",\"text\":\"If the simplified form evaluates differently, we expanded our way into a different door.\"},{\"speaker\":\"narrator\",\"text\":\"The beacons flashed together at the predicted minute, brief and exact, like a common multiple should.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"When the Signals Meet · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
