":[{\"speaker\":\"narrator\",\"text\":\"Boards lay in a trapezoid: parallel bases 7 meters and 13 meters, height 4. A wing stuck out, rectangle married to triangle.\"},{\"speaker\":\"jules\",\"text\":\"Average the bases, then multiply by the height. Adding 7 and 13 and forgetting the half builds a floor we do not have.\",\"supported\":\"Trapezoid area = (base1 + base2) ÷ 2 × height.\"},{\"speaker\":\"sera\",\"text\":\"And the wing must be added once. I have seen this contractor count a triangle as part of the rectangle and then again as itself.\"}],\"choices\":{\"prompt\":\"The floor is a rectangle with a piece removed. How do you find the area?\",\"options\":[{\"id\":\"u5-floor-a\",\"label\":\"Subtract the missing piece\",\"consequence\":\"You take the whole rectangle and remove the cutout.\",\"next\":\"u5-floor-choice-a\"},{\"id\":\"u5-floor-b\",\"label\":\"Split the remaining floor into rectangles\",\"consequence\":\"You add the pieces that are still there.\",\"next\":\"u5-floor-choice-b\"}]}},{\"id\":\"u5-floor-choice-a\",\"place\":\"Festival floor\",\"focus\":\"mara\",\"next\":\"trap\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Theo finds the full floor, then subtracts the missing rectangle.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u5-floor-choice-b\",\"place\":\"Festival floor\",\"focus\":\"jules\",\"next\":\"trap\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Jules cuts the remaining floor into two rectangles and adds those areas.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"trap\",\"place\":\"The main floor\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"The height is the perpendicular distance between the bases, 4 meters.\"}],\"challenge\":{\"id\":\"trap-area\",\"objective\":\"Calculate trapezoid area.\",\"supported\":{\"prompt\":\"Bases 7 m and 13 m, height 4 m. What is the area?\",\"visual\":{\"type\":\"area\",\"shape\":\"trapezoid\",\"a\":13,\"b\":7,\"h\":4,\"unit\":\"m\"},\"input\":{\"type\":\"number\",\"label\":\"Square meters\",\"model\":{\"op\":\"areaTrapezoid\",\"base1\":7,\"base2\":13,\"height\":4},\"hint\":\"Average 7 and 13 to get 10, then multiply by 4.\",\"traps\":[{\"value\":80,\"feedback\":\"7 + 13 = 20, times 4 is 80, but the formula averages the bases first. You missed the division by 2.\",\"misconception\":\"forgot-average\"},{\"value\":20,\"feedback\":\"20 is the sum of the bases, not the area.\",\"misconception\":\"sum-as-area\"}]}},\"independent\":{\"prompt\":\"A stage skirt is a trapezoid with bases 6.5 m and 9.5 m and height 4 m. What is its area?\",\"input\":{\"type\":\"number\",\"label\":\"Square meters\",\"model\":{\"op\":\"areaTrapezoid\",\"base1\":6.5,\"base2\":9.5,\"height\":4},\"hint\":\"The average of 6.5 and 9.5 is 8. Then multiply by the height.\",\"traps\":[{\"value\":64,\"feedback\":\"That multiplies the sum of the bases by the height and skips the average.\",\"misconception\":\"forgot-average\"},{\"value\":16,\"feedback\":\"16 is the sum of the bases. The height still has to be used.\",\"misconception\":\"sum-as-area\"}]}},\"success\":{\"supported\":\"Forty square meters. The average base was 10, and the floor is real.\",\"independent\":\"Thirty-two square meters. The skirt does not get the doubled sum.\"},\"consequence\":\"The trapezoid floor has a single area.\"}},{\"id\":\"wing\",\"place\":\"The side wing\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"Rectangle 8 by 5, and a triangle on one 8-meter side with height 3. Add the pieces. Do not add the shared side as area.\",\"supported\":\"Composite area is a sum of areas, not a sum of shared edges.\"}]},{\"id\":\"composite\",\"place\":\"The side wing\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"What is the wing's area?\"}],\"challenge\":{\"id\":\"wing-area\",\"objective\":\"Add the areas of a rectangle and a triangle without double-counting.\",\"supported\":{\"prompt\":\"A rectangle is 8 m by 5 m. A triangle sharing the 8 m side has height 3 m. What is the total area?\",\"input\":{\"type\":\"number\",\"label\":\"Square meters\",\"model\":{\"op\":\"add\",\"a\":{\"op\":\"product\",\"factors\":[8,5]},\"b\":{\"op\":\"areaTriangle\",\"base\":8,\"height\":3}},\"hint\":\"Rectangle: 8 × 5 = 40. Triangle: 8 × 3 ÷ 2 = 12. Add those areas.\",\"traps\":[{\"value\":40,\"feedback\":\"40 is only the rectangle. The triangle is still part of the wing.\",\"misconception\":\"dropped-piece\"},{\"value\":64,\"feedback\":\"8 × 3 = 24 would be the triangle before halving. Half of 24 is 12, and 40 + 12 = 52.\",\"misconception\":\"forgot-half\"},{\"value\":60,\"feedback\":\"Adding the shared 8-meter side to the areas treats a length as area.\",\"misconception\":\"added-shared-edge\"}]}},\"independent\":{\"prompt\":\"Another wing is a 10 by 4 rectangle plus a triangle with base 10 and height 5, and the contractor also added the 10 m shared side 'for the seam.' What is the true area, seam not included?\",\"input\":{\"type\":\"number\",\"label\":\"Square meters\",\"model\":{\"op\":\"add\",\"a\":{\"op\":\"product\",\"factors\":[10,4]},\"b\":{\"op\":\"areaTriangle\",\"base\":10,\"height\":5}},\"hint\":\"40 + 25 = 65. The seam is a length. It does not join an area sum.\",\"traps\":[{\"value\":75,\"feedback\":\"That is the triangle before it is halved: 10 × 5 = 50, plus 40, plus something extra. Half of 50 is 25.\",\"misconception\":\"forgot-half\"},{\"value\":75.5,\"feedback\":\"Including the seam or another length will not land on a clean area of the two regions.\",\"misconception\":\"added-shared-edge\"}]}},\"success\":{\"supported\":\"Fifty-two square meters. The shared side is a boundary, not a third piece.\",\"independent\":\"Sixty-five square meters. The seam stays a seam.\"},\"consequence\":\"The wing is counted once.\"}},{\"id\":\"overlap\",\"place\":\"The contractor's sketch\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"His sketch shades the triangle, then shades a larger rectangle that already contains it.\"},{\"speaker\":\"inez\",\"text\":\"That is not caution. That is paying twice.\"}]},{\"id\":\"which-decomp\",\"place\":\"The contractor's sketch\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"Which decomposition is safe to add?\"}],\"challenge\":{\"id\":\"safe-decomp\",\"objective\":\"Choose a decomposition that does not double-count area.\",\"supported\":{\"prompt\":\"Which plan finds the wing's area without counting any region twice?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"pieces\",\"hint\":\"The pieces you add must meet at edges and not overlap in their interiors.\",\"options\":[{\"id\":\"both\",\"label\":\"Add the big rectangle that contains the triangle, then add the triangle again.\",\"feedback\":\"The triangle's interior is already inside the big rectangle. Adding it again counts that planting twice.\",\"misconception\":\"double-count\"},{\"id\":\"pieces\",\"label\":\"Add the 8 by 5 rectangle to the triangle that sits outside it.\",\"correct\":true,\"feedback\":\"The pieces share an edge and not an interior. Their areas add to the wing.\"},{\"id\":\"perimeter\",\"label\":\"Add all the outer sides and call that the area.\",\"feedback\":\"That sum is a perimeter, a length. Area is measured in square units.\",\"misconception\":\"perimeter-as-area\"}]}},\"independent\":{\"prompt\":\"The contractor offers a discount if you 'keep his overlapping sketch, since the extra area is only a safety margin.' What is the right refusal?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"refuse\",\"hint\":\"A safety margin should be named as extra material, not hidden inside a double-counted region.\",\"options\":[{\"id\":\"accept\",\"label\":\"Accept. Extra area in a sketch is free caution.\",\"feedback\":\"The extra is not free. It changes the quantity you pay for, and it is not labeled as margin.\",\"misconception\":\"hidden-margin\"},{\"id\":\"refuse\",\"label\":\"Refuse the overlap. Compute the union of the pieces, then add an explicit margin if one is truly wanted.\",\"correct\":true,\"feedback\":\"The area of the floor is the area walked once. Any margin has to be a separate, visible decision.\"},{\"id\":\"average\",\"label\":\"Average the doubled area and the true area so everyone compromises.\",\"feedback\":\"The floor does not average itself. One of those numbers counts space that is not there.\",\"misconception\":\"average-of-errors\"}]}},\"success\":{\"supported\":\"The safe decomposition wins. The sketch loses its second shading.\",\"independent\":\"The overlap is refused. A margin, if they ever want one, will have to introduce itself by name.\"},\"consequence\":\"The floor area is the area of the floor. The next crates ask how much space is inside, not on, a box.\"}},{\"id\":\"crates\",\"place\":\"The loading gap\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Stone for the steps arrives in rectangular prisms. The bid counted faces and called them volume.\"},{\"speaker\":\"sera\",\"text\":\"Volume is what the crate holds. A net is how the cardboard lies down. They are relatives, not synonyms.\"},{\"speaker\":\"narrator\",\"text\":\"Square meters had been defended. Cubic meters were about to be invented by someone in a hurry.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Floor That Counted Twice · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\"
