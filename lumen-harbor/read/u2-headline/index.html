\":[{\"id\":\"press\",\"place\":\"Night desk, harbor newsroom\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Rain stitched the harbor lights to the glass. The brief on Mara's desk had already been reduced to one sentence.\"},{\"speaker\":\"rudd\",\"text\":\"Print it. Most days this week were unsafe. People do not read bins.\",\"supported\":\"Rudd wants one scary sentence. The log is still twelve days, not one sentence.\"},{\"speaker\":\"sera\",\"text\":\"Then the sentence has to survive the question we actually asked. 'Is the air unsafe?' is not even a question with varied answers until we say unsafe for whom, and how we measured.\",\"supported\":\"A statistical question expects many different answers. One yes-or-no with no variability is not enough.\",\"vocab\":\"Statistical question\"}],\"choices\":{\"prompt\":\"The headline is still wet. Where do you start the inquiry?\",\"options\":[{\"id\":\"u2-headline-a\",\"label\":\"Read the full tally before the headline\",\"consequence\":\"You refuse the banner until the distribution is visible.\",\"next\":\"u2-headline-choice-a\"},{\"id\":\"u2-headline-b\",\"label\":\"Interview the dock clerk first\",\"consequence\":\"You collect a witness before you trust the printed numbers.\",\"next\":\"u2-headline-choice-b\"}]}},{\"id\":\"u2-headline-choice-a\",\"place\":\"Night desk, harbor newsroom\",\"focus\":\"mara\",\"next\":\"which-question\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara pins the raw counts above the banner. The headline has to wait for the shape of the data.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u2-headline-choice-b\",\"place\":\"Night desk, harbor newsroom\",\"focus\":\"jules\",\"next\":\"which-question\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Jules finds the clerk who logged the boats. A witness can explain a count, but cannot replace it.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"which-question\",\"place\":\"The pinned log\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Three questions are taped under the lamp. Only one of them would produce a distribution.\"}],\"challenge\":{\"id\":\"statistical-question\",\"objective\":\"Identify the question that anticipates variability.\",\"supported\":{\"prompt\":\"Which question is statistical? It must expect the answers to vary.\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"outside\",\"hint\":\"If a question has one fixed answer, it is not statistical. Look for the question that would be different for different people or days.\",\"options\":[{\"id\":\"class\",\"label\":\"How many students are in this room right now?\",\"feedback\":\"That has one count. You can point at the room and finish. A statistical question leaves room for different results.\",\"misconception\":\"single-answer-as-statistical\"},{\"id\":\"outside\",\"label\":\"How many minutes do sixth graders at this school spend outside on Saturday?\",\"correct\":true,\"feedback\":\"Different students can give different times. That variability is what makes the question statistical.\"},{\"id\":\"clock\",\"label\":\"What time is it on the newsroom clock?\",\"feedback\":\"The clock has one reading. Variability is not part of the question.\",\"misconception\":\"single-answer-as-statistical\"}]}},\"independent\":{\"prompt\":\"Rudd rewrote the brief overnight. Which question can actually support a data display, and why would the others collapse to a single fact?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"minutes\",\"hint\":\"A display of many results needs a question whose answers can differ. Reject questions that name one object and one fact.\",\"options\":[{\"id\":\"unsafe\",\"label\":\"Was Tuesday unsafe?\",\"feedback\":\"Tuesday is one day and 'unsafe' has not even been defined as a measurement. There is no set of varied answers yet.\",\"misconception\":\"vague-claim-as-data\"},{\"id\":\"minutes\",\"label\":\"How many micrograms per cubic meter did the pier sensor record at noon each day this month?\",\"correct\":true,\"feedback\":\"Each day can contribute a different measurement. That is a statistical question with a numerical distribution.\"},{\"id\":\"editor\",\"label\":\"Who is the editor on duty tonight?\",\"feedback\":\"One roster, one name. Nothing varies across a data set.\",\"misconception\":\"single-answer-as-statistical\"}]}},\"success\":{\"supported\":\"Sera circles the question that expects many answers. The headline has to wait for those answers.\",\"independent\":\"Sera keeps the sensor question and sets the one-day slogan aside. A distribution is finally allowed to exist.\"},\"consequence\":\"The brief is reopened. Twelve noon readings stay on the table instead of one slogan.\"}},{\"id\":\"bins\",\"place\":\"The counting rail\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Equal bins. A day of 19 belongs in 10–19, not in two places and not in the next interval.\",\"supported\":\"Each number goes in one bin. 19 is still in 10–19. 20 starts the next bin.\",\"vocab\":\"Bin\"}]},{\"id\":\"build-histogram\",\"place\":\"Drafting table\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Count them before anyone talks about 'most.'\"}],\"challenge\":{\"id\":\"air-bins\",\"objective\":\"Build a histogram by counting each reading into one equal bin.\",\"supported\":{\"prompt\":\"How many of the twelve noon readings fall in each bin? 19 belongs in 10–19.\",\"visual\":{\"type\":\"data\",\"title\":\"Noon readings\",\"values\":[12,15,18,22,24,28,31,33,41,44,46,19],\"unit\":\"index\"},\"input\":{\"type\":\"bins\",\"values\":\"$5:1:props:children:props:chapter:scenes:5:challenge:supported:visual:values\",\"bins\":[{\"label\":\"10–19\",\"min\":10,\"max\":19},{\"label\":\"20–29\",\"min\":20,\"max\":29},{\"label\":\"30–39\",\"min\":30,\"max\":39},{\"label\":\"40–49\",\"min\":40,\"max\":49}],\"hint\":\"Touch each number once. The four bins must add to 12 because there are 12 readings.\"}},\"independent\":{\"prompt\":\"The intern started a histogram and stopped at the boundaries. Finish the counts. Watch 19 and 20.\",\"visual\":{\"type\":\"data\",\"title\":\"Noon readings\",\"values\":[19,46,44,41,33,31,28,24,22,18,15,12],\"unit\":\"index\"},\"input\":{\"type\":\"bins\",\"values\":\"$5:1:props:children:props:chapter:scenes:5:challenge:supported:visual:values\",\"bins\":\"$5:1:props:children:props:chapter:scenes:5:challenge:supported:input:bins\",\"hint\":\"Intervals are inclusive of both ends as labeled, and they do not overlap. Check that the counts sum to the number of readings.\"}},\"success\":{\"supported\":\"The tallest bar is the low bin, not the forties. Jules leaves the pencils in the cups.\",\"independent\":\"The histogram refuses the slogan. Three days in the forties cannot be 'most' of twelve.\"},\"consequence\":\"A finished histogram replaces the handwritten slogan on the rail.\"}},{\"id\":\"claim\",\"place\":\"The window\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"rudd\",\"text\":\"So change the sentence, but do not make me print a picture.\"},{\"speaker\":\"mara\",\"text\":\"Then the sentence can only say what the picture says.\"}]},{\"id\":\"honest-headline\",\"place\":\"The proof\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Read the bars. Do not remember the fear.\"}],\"challenge\":{\"id\":\"headline-choice\",\"objective\":\"Choose the claim the histogram supports.\",\"supported\":{\"prompt\":\"The counts are 4, 3, 2, and 3. Which headline is fair?\",\"visual\":{\"type\":\"histogram\",\"title\":\"Noon readings\",\"bins\":[{\"label\":\"10–19\",\"count\":4},{\"label\":\"20–29\",\"count\":3},{\"label\":\"30–39\",\"count\":2},{\"label\":\"40–49\",\"count\":3}]},\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"low\",\"hint\":\"Compare each count with half of 12, and with the other counts. 'Most' means more than half.\",\"options\":[{\"id\":\"most\",\"label\":\"Most days were in the 40–49 bin.\",\"feedback\":\"Three out of twelve is not most. Most would be more than six.\",\"misconception\":\"tall-or-scary-bin-is-most\"},{\"id\":\"low\",\"label\":\"The 10–19 bin has more days than any other single bin, but it is not most of the days.\",\"correct\":true,\"feedback\":\"Four is the largest count, and four is still less than half of twelve. Both parts of that sentence are earned.\"},{\"id\":\"none\",\"label\":\"No days were below 20.\",\"feedback\":\"The first bin holds four readings, including 19. Below 20 is not empty.\",\"misconception\":\"ignored-first-bin\"}]}},\"independent\":{\"prompt\":\"Write the brief's only permitted claim. Which statement can the histogram defend without a sneak definition of 'unsafe'?\",\"visual\":{\"type\":\"histogram\",\"title\":\"Noon readings\",\"bins\":[{\"label\":\"10–19\",\"count\":4},{\"label\":\"20–29\",\"count\":3},{\"label\":\"30–39\",\"count\":2},{\"label\":\"40–49\",\"count\":3}]},\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"modal\",\"hint\":\"Stay inside the counts. Do not import a cutoff that the graph never states.\",\"options\":[{\"id\":\"unsafe\",\"label\":\"The air was unsafe on most days.\",\"feedback\":\"The histogram has no cutoff labeled unsafe. That claim adds a rule the display does not contain.\",\"misconception\":\"imported-threshold\"},{\"id\":\"modal\",\"label\":\"The modal bin is 10–19, with 4 of 12 days. No bin contains a majority.\",\"correct\":true,\"feedback\":\"Four is greater than three, two, and three, and no count exceeds six. The sentence stays inside the evidence.\"},{\"id\":\"half\",\"label\":\"Exactly half the days were 30 or above.\",\"feedback\":\"30–39 and 40–49 together are 2 + 3 = 5, not 6. Half of 12 is 6.\",\"misconception\":\"almost-half\"}]}},\"success\":{\"supported\":\"Mara pins the fair sentence under the bars. Rudd does not love it. He cannot cross it out.\",\"independent\":\"The modal bin and the missing majority both stay in the brief. The scary sentence does not.\"},\"consequence\":\"The newsroom keeps the histogram. The next file asks what 'middle' should mean.\"}},{\"id\":\"handoff\",\"place\":\"The stair to the archive\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"A tall bin is not a typical day. Tomorrow we find the middle without letting one end shout.\"},{\"speaker\":\"theo\",\"text\":\"The observatory log is already on my map case. Seven nights. No slogan yet.\"},{\"speaker\":\"narrator\",\"text\":\"Outside, the rain eased, as if the harbor were waiting to be described rather than judged.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Question Under the Headline · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
