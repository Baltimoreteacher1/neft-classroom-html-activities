one hoped a number could forget its partner.\"},{\"speaker\":\"theo\",\"text\":\"The archive mix is 3 liters fresh for every 5 liters salt. Not 5 for 3. Order is the whole promise.\",\"supported\":\"3 fresh to 5 salt. The order matters.\",\"vocab\":\"Ratio\"},{\"speaker\":\"jules\",\"text\":\"Rudd told the crew to 'add two more fresh and leave the salt.' That is how a ratio dies.\"}],\"choices\":{\"prompt\":\"The lock ratios disagree. Which comparison do you set up?\",\"options\":[{\"id\":\"u3-locks-a\",\"label\":\"Part to part\",\"consequence\":\"You compare the two metals directly.\",\"next\":\"u3-locks-choice-a\"},{\"id\":\"u3-locks-b\",\"label\":\"Part to whole\",\"consequence\":\"You compare one metal with the whole lock.\",\"next\":\"u3-locks-choice-b\"}]}},{\"id\":\"u3-locks-choice-a\",\"place\":\"Tide gate at dawn\",\"focus\":\"mara\",\"next\":\"order\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Theo writes brass to iron as one ratio and refuses to add the parts yet.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u3-locks-choice-b\",\"place\":\"Tide gate at dawn\",\"focus\":\"jules\",\"next\":\"order\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Jules asks what fraction of the whole lock is brass, not how the metals compare with each other.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"order\",\"place\":\"The engraved wheel\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"Pick the statement that names the same mix as the engraving.\"}],\"challenge\":{\"id\":\"ratio-order\",\"objective\":\"Keep the order of a ratio's quantities.\",\"supported\":{\"prompt\":\"The gate needs 3 liters of fresh water for every 5 liters of salt water. Which statement matches?\",\"visual\":{\"type\":\"tape\",\"title\":\"One batch\",\"parts\":[{\"label\":\"Fresh\",\"amount\":3},{\"label\":\"Salt\",\"amount\":5}]},\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"fresh-salt\",\"hint\":\"Read the ratio in the order the sentence gives. Fresh is first, salt is second.\",\"options\":[{\"id\":\"salt-fresh\",\"label\":\"5 : 3, fresh to salt\",\"feedback\":\"The numbers 5 and 3 are in the story, but this order says 5 fresh for 3 salt. That is the reversed mix.\",\"misconception\":\"reversed-ratio\"},{\"id\":\"fresh-salt\",\"label\":\"3 : 5, fresh to salt\",\"correct\":true,\"feedback\":\"Three parts fresh correspond to five parts salt. The labels and the order agree.\"},{\"id\":\"sum\",\"label\":\"8 : 3, total to fresh\",\"feedback\":\"8 is the batch size, not the ratio the wheel is holding. The relationship is between fresh and salt.\",\"misconception\":\"part-to-whole-swap\"}]}},\"independent\":{\"prompt\":\"A night crew wrote '5 to 3, same recipe' on the wheel. What did they actually change?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"reversed\",\"hint\":\"Same two numbers in the other order is a different relationship, not a synonym.\",\"options\":[{\"id\":\"same\",\"label\":\"Nothing. Ratios can be read from either end.\",\"feedback\":\"You may rewrite 3 : 5 as 5 : 3 only if you also swap the labels. Leaving the labels in place reverses the mix.\",\"misconception\":\"reversed-ratio\"},{\"id\":\"reversed\",\"label\":\"They reversed the mix. 5 fresh to 3 salt is not 3 fresh to 5 salt.\",\"correct\":true,\"feedback\":\"The pair of numbers is not a bag. The order tells which quantity is which.\"},{\"id\":\"unit\",\"label\":\"They found the unit rate and nothing else.\",\"feedback\":\"A unit rate would name an amount per 1 unit. 5 to 3 does not do that by itself.\",\"misconception\":\"ratio-called-unit-rate\"}]}},\"success\":{\"supported\":\"The wheel keeps fresh first. Jules wipes off the reversed chalk.\",\"independent\":\"The night note is marked as a reversal, not as a translation.\"},\"consequence\":\"The gate remembers which stream is which.\"}},{\"id\":\"per-one\",\"place\":\"The measuring lip\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"The replacement gauge wants fresh water per 1 liter of salt. That is a unit rate, and it still needs both units.\",\"supported\":\"Unit rate means per 1. Divide the fresh by the salt.\",\"vocab\":\"Unit rate\"}]},{\"id\":\"unit-rate\",\"place\":\"The measuring lip\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Do not throw away the word liters.\"}],\"challenge\":{\"id\":\"fresh-per-salt\",\"objective\":\"Compute a unit rate from a ratio.\",\"supported\":{\"prompt\":\"The recipe is 3 liters fresh for 5 liters salt. How many liters of fresh water per 1 liter of salt?\",\"input\":{\"type\":\"number\",\"label\":\"Liters of fresh per 1 liter of salt\",\"unit\":\"L\",\"model\":{\"op\":\"unitRate\",\"total\":3,\"units\":5},\"hint\":\"Divide 3 by 5. The unit rate is 0.6 liters fresh per 1 liter salt, not 5 and not 3.\",\"traps\":[{\"value\":5,\"feedback\":\"5 is the salt in the original pair, not the fresh water for one liter of salt.\",\"misconception\":\"part-as-unit-rate\"},{\"value\":1.5,\"feedback\":\"3 ÷ 2 would be a different split. Here you divide the 3 liters of fresh by the 5 liters of salt.\",\"misconception\":\"wrong-divisor\"}]}},\"independent\":{\"prompt\":\"A second gate uses 8 liters fresh for 2.5 liters salt. What is the unit rate in liters of fresh per 1 liter of salt?\",\"input\":{\"type\":\"number\",\"label\":\"Liters fresh per liter salt\",\"model\":{\"op\":\"unitRate\",\"total\":8,\"units\":2.5},\"hint\":\"Divide 8 by 2.5. You can think of 2.5 × 3 = 7.5 and 2.5 × 0.2 = 0.5.\",\"traps\":[{\"value\":2.5,\"feedback\":\"2.5 is the amount of salt in that batch, not the fresh water per liter.\",\"misconception\":\"part-as-unit-rate\"},{\"value\":0.3125,\"feedback\":\"That divides salt by fresh, reversing the requested unit rate.\",\"misconception\":\"reversed-ratio\"}]}},\"success\":{\"supported\":\"The gauge reads 0.6 liters fresh for each liter of salt. Both units stay on the label.\",\"independent\":\"8 ÷ 2.5 is 3.2 liters fresh per liter of salt. The second gate gets a unit, not a slogan.\"},\"consequence\":\"A unit rate is engraved with its units still attached.\"}},{\"id\":\"scale-up\",\"place\":\"The full chamber\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"The chamber wants 10 liters of salt. If I only change the salt, the harbor tastes wrong. Both parts scale.\"},{\"speaker\":\"mara\",\"text\":\"Same multiplier. No favorites.\"}]},{\"id\":\"scale-task\",\"place\":\"The full chamber\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"How much fresh water belongs with that salt?\"}],\"challenge\":{\"id\":\"scale-mix\",\"objective\":\"Scale both parts of a ratio by the same factor.\",\"supported\":{\"prompt\":\"The mix is 3 fresh to 5 salt. The chamber will hold 10 liters of salt. How many liters of fresh water?\",\"visual\":{\"type\":\"ratio-table\",\"title\":\"Fresh to salt\",\"headers\":[\"Fresh (L)\",\"Salt (L)\"],\"rows\":[[\"3\",\"5\"],[\"?\",\"10\"]]},\"input\":{\"type\":\"number\",\"label\":\"Fresh water\",\"unit\":\"L\",\"model\":{\"op\":\"scale\",\"value\":3,\"factor\":2},\"hint\":\"10 is 5 × 2, so multiply the fresh water by the same 2. 3 × 2 = 6.\",\"traps\":[{\"value\":10,\"feedback\":\"10 is the salt, not the fresh water. The fresh amount has to be scaled from 3.\",\"misconception\":\"copied-one-quantity\"},{\"value\":8,\"feedback\":\"Adding 5 to the fresh water is not the same multiplier. Salt doubled, so fresh doubles.\",\"misconception\":\"added-instead-of-scaled\"}]}},\"independent\":{\"prompt\":\"A surge needs 22.5 liters of salt at the second gate's 8 fresh to 2.5 salt. How many liters of fresh water belong with it?\",\"input\":{\"type\":\"number\",\"label\":\"Fresh water\",\"unit\":\"L\",\"model\":{\"op\":\"scale\",\"value\":3.2,\"factor\":22.5},\"hint\":\"Use the unit rate 3.2 liters fresh per 1 liter salt, then multiply by 22.5. Scaling only the salt would abandon the recipe.\",\"traps\":[{\"value\":22.5,\"feedback\":\"That copies the salt. Fresh water is 3.2 times the salt, not equal to it.\",\"misconception\":\"copied-one-quantity\"},{\"value\":8,\"feedback\":\"8 is the fresh water in the small batch, not in the surge.\",\"misconception\":\"unscaled-part\"}]}},\"success\":{\"supported\":\"Six liters of fresh water go in with ten of salt. The wheel turns evenly.\",\"independent\":\"72 liters of fresh water accompany 22.5 of salt. Both streams were scaled.\"},\"consequence\":\"The chamber fills in ratio. The next problem is a railway that must keep the same pair on a graph.\"}},{\"id\":\"to-rail\",\"place\":\"Above the gate\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Tables and graphs are the same promise drawn two ways. The signal railway has started dropping points off the line.\"},{\"speaker\":\"sera\",\"text\":\"If a point is not a scale of the original pair, the train does not get a green lamp.\"},{\"speaker\":\"narrator\",\"text\":\"The lock settled. Downriver, a signal arm waited in the wrong place.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Lock That Lost Its Mix · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\
