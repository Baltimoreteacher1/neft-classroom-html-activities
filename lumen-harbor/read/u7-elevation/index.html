line. A ledge at 8 meters and a culvert at −8 meters had been copied as if both were 'about eight.'\"},{\"speaker\":\"theo\",\"text\":\"Opposite does not mean negative. The opposite of −8 is 8. They are the same distance from zero, on different sides.\",\"supported\":\"Opposites are the same distance from 0.\"},{\"speaker\":\"sera\",\"text\":\"The rational mark at 2.5 meters has an opposite too. The decimal stays. The sign changes.\"}],\"choices\":{\"prompt\":\"The map uses positive and negative heights. Where do you put zero?\",\"options\":[{\"id\":\"u7-elevation-a\",\"label\":\"At sea level\",\"consequence\":\"Zero is the reference, not the bottom of the page.\",\"next\":\"u7-elevation-choice-a\"},{\"id\":\"u7-elevation-b\",\"label\":\"At the lowest dock\",\"consequence\":\"You test what happens if zero is in the wrong place.\",\"next\":\"u7-elevation-choice-b\"}]}},{\"id\":\"u7-elevation-choice-a\",\"place\":\"Sea-level lock\",\"focus\":\"mara\",\"next\":\"opposite-int\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara marks sea level as zero. Above and below are opposite directions from that line.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u7-elevation-choice-b\",\"place\":\"Sea-level lock\",\"focus\":\"jules\",\"next\":\"opposite-int\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Theo tries the lowest dock as zero and sees the sea itself become a positive number. The reference was wrong.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"opposite-int\",\"place\":\"The waterline\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"The culvert is at −8. What elevation is its opposite?\"}],\"challenge\":{\"id\":\"opp-eight\",\"objective\":\"Find the opposite of a negative integer.\",\"supported\":{\"prompt\":\"What is the opposite of −8?\",\"visual\":{\"type\":\"number-line\",\"min\":-10,\"max\":10,\"step\":2,\"points\":[{\"at\":-8,\"label\":\"culvert\"}]},\"input\":{\"type\":\"number\",\"label\":\"Opposite of −8\",\"model\":{\"op\":\"opposite\",\"value\":-8},\"hint\":\"Same distance from zero, other side. The opposite of a negative number is positive.\",\"traps\":[{\"value\":-8,\"feedback\":\"−8 is the culvert itself, not its opposite.\",\"misconception\":\"same-number\"},{\"value\":0,\"feedback\":\"Zero is the reference, not the opposite.\",\"misconception\":\"zero-as-opposite\"}]}},\"independent\":{\"prompt\":\"A crane sits at +15 m and a test weight at −15 m. Enter the opposite of the crane's elevation, then the opposite of the test weight.\",\"input\":{\"type\":\"fields\",\"hint\":\"The opposite of a positive elevation is the same number of meters below zero. The opposite of a negative reading is positive.\",\"fields\":[{\"id\":\"crane\",\"label\":\"Opposite of +15\",\"model\":{\"op\":\"opposite\",\"value\":15},\"miss\":\"Positive 15 and its opposite are on different sides of zero.\"},{\"id\":\"weight\",\"label\":\"Opposite of −15\",\"model\":{\"op\":\"opposite\",\"value\":-15},\"miss\":\"The opposite of −15 is 15, not −15 and not 0.\"}]}},\"success\":{\"supported\":\"Positive 8. The ledge is the culvert's opposite, not its synonym.\",\"independent\":\"−15 and +15. Each reading points at the other across the waterline.\"},\"consequence\":\"Zero is a shared reference, and opposites are paired.\"}},{\"id\":\"rational\",\"place\":\"The decimal mark\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"2.5 meters above the lock. Its opposite is not −2, and it is not −25.\",\"supported\":\"Keep the digits. Change the sign.\"}]},{\"id\":\"opp-decimal\",\"place\":\"The decimal mark\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Name the opposite of 2.5.\"}],\"challenge\":{\"id\":\"opp-decimal\",\"objective\":\"Find the opposite of a positive rational number.\",\"supported\":{\"prompt\":\"A mark is at +2.5 meters. What is its opposite?\",\"visual\":{\"type\":\"number-line\",\"min\":-4,\"max\":4,\"step\":0.5,\"points\":[{\"at\":2.5,\"label\":\"+2.5\"}]},\"input\":{\"type\":\"number\",\"label\":\"Opposite\",\"model\":{\"op\":\"opposite\",\"value\":2.5},\"hint\":\"The opposite is −2.5. The distance from zero stays 2.5.\",\"traps\":[{\"value\":-2,\"feedback\":\"Dropping the tenth moves the point. The opposite keeps the same distance.\",\"misconception\":\"truncated-decimal\"},{\"value\":-25,\"feedback\":\"The decimal point is not a sign. −2.5 is not −25.\",\"misconception\":\"moved-decimal\"}]}},\"independent\":{\"prompt\":\"A sensor drifts to −3.75 m. What is the opposite elevation, the one the same distance above zero?\",\"input\":{\"type\":\"number\",\"label\":\"Opposite of −3.75\",\"model\":{\"op\":\"opposite\",\"value\":-3.75},\"hint\":\"The opposite of a negative number is positive, and the digits do not change.\",\"traps\":[{\"value\":-3.75,\"feedback\":\"That is the sensor, not its opposite.\",\"misconception\":\"same-number\"},{\"value\":3.25,\"feedback\":\"3.25 is a different distance from zero.\",\"misconception\":\"changed-distance\"}]}},\"success\":{\"supported\":\"−2.5 meters. The tenth survived the trip across zero.\",\"independent\":\"Positive 3.75. The drift below zero has a mirror above it.\"},\"consequence\":\"Rational numbers and their opposites share the number line.\"}},{\"id\":\"which-side\",\"place\":\"The survey note\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"rudd\",\"text\":\"Write them all as positive. Negative numbers upset the brief.\"},{\"speaker\":\"mara\",\"text\":\"Then the culvert will be drawn in the sky. No.\"}]},{\"id\":\"sign-choice\",\"place\":\"The survey note\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Which note keeps zero honest?\"}],\"challenge\":{\"id\":\"which-sign\",\"objective\":\"Use signs to show opposite sides of zero.\",\"supported\":{\"prompt\":\"The ledge is 8 m above the lock and the culvert is 8 m below. Which note is correct?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"signed\",\"hint\":\"Above zero is positive in this survey. Below zero is negative. They are opposites.\",\"options\":[{\"id\":\"both-pos\",\"label\":\"Ledge 8 and culvert 8, because distance is what matters.\",\"feedback\":\"Distance from zero matters, and so does direction. Two unsigned 8s erase the opposite.\",\"misconception\":\"dropped-sign\"},{\"id\":\"signed\",\"label\":\"Ledge +8 and culvert −8.\",\"correct\":true,\"feedback\":\"The numbers are opposites. Zero stays the waterline.\"},{\"id\":\"swapped\",\"label\":\"Ledge −8 and culvert +8, because down is the important one.\",\"feedback\":\"That swaps the sides. Below the lock is negative in this survey.\",\"misconception\":\"swapped-sign\"}]}},\"independent\":{\"prompt\":\"A point is plotted at −3.75. Which description matches the point and its opposite?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"pair\",\"hint\":\"The plotted point is below zero. Its opposite is the same distance above zero.\",\"options\":[{\"id\":\"pair\",\"label\":\"The point is 3.75 below zero. Its opposite is 3.75 above zero.\",\"correct\":true,\"feedback\":\"Sign shows direction. Absolute distance is shared by the pair.\"},{\"id\":\"both-below\",\"label\":\"Both the point and its opposite are below zero, so the map stays consistent.\",\"feedback\":\"Opposites are on opposite sides of zero. Two negatives are not opposites of each other unless one is positive.\",\"misconception\":\"same-sign-opposites\"},{\"id\":\"truncate\",\"label\":\"Call the point −4 and its opposite 4, because surveyors round.\",\"feedback\":\"Rounding changes the distance. This mark is 3.75 from zero.\",\"misconception\":\"truncated-decimal\"}]}},\"success\":{\"supported\":\"The note says +8 and −8. Rudd can be upset and still be accurate.\",\"independent\":\"Below and above are named. The decimal distance is shared, the signs are not.\"},\"consequence\":\"The survey keeps its signs. Absolute value is the next distinction, because distance from zero is not the same as greatness.\"}},{\"id\":\"depth-hook\",\"place\":\"The dive ladder\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"A diver at −6.5 is farther from the surface than a gull at +3. The gull's number is greater. Both facts fit.\"},{\"speaker\":\"sera\",\"text\":\"Absolute value for distance. The number line's order for which is greater.\"},{\"speaker\":\"narrator\",\"text\":\"The ladder dropped into green water, each rung a rational number somebody might sort in a hurry.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Above and Below the Lock · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
