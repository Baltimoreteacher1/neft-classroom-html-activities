"text\":\"The diver's tag read −6.5. A buoy read −2. A gull sat at +3. The rescue lead asked which was 'bigger' and pointed at the diver.\"},{\"speaker\":\"jules\",\"text\":\"Bigger distance and greater number are different questions. I will answer the one that was asked.\",\"supported\":\"|−6.5| is 6.5. −2 is still greater than −6.5.\"},{\"speaker\":\"mara\",\"text\":\"If we swim toward the greater number, we go up. If we swim toward the greater absolute value, we may go down.\"}],\"choices\":{\"prompt\":\"A diver's change in depth has a sign. What does the sign mean?\",\"options\":[{\"id\":\"u7-depth-a\",\"label\":\"Direction\",\"consequence\":\"The sign says which way, and the absolute value says how far.\",\"next\":\"u7-depth-choice-a\"},{\"id\":\"u7-depth-b\",\"label\":\"A debt of meters\",\"consequence\":\"You try a money story and notice it does not fit depth.\",\"next\":\"u7-depth-choice-b\"}]}},{\"id\":\"u7-depth-choice-a\",\"place\":\"Dive ladder\",\"focus\":\"mara\",\"next\":\"abs-task\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Inez separates sign from distance. Negative does not mean less diving; it means the other direction.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u7-depth-choice-b\",\"place\":\"Dive ladder\",\"focus\":\"jules\",\"next\":\"abs-task\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Jules tests a debt story. Depth is a direction on a line, so the money metaphor gets set down.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"abs-task\",\"place\":\"The diver's tag\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"How far is the diver from sea level?\"}],\"challenge\":{\"id\":\"abs-diver\",\"objective\":\"Compute an absolute value as distance from zero.\",\"supported\":{\"prompt\":\"The diver is at −6.5 m. What is the absolute value?\",\"visual\":{\"type\":\"number-line\",\"min\":-8,\"max\":8,\"step\":1,\"points\":[{\"at\":-6.5,\"label\":\"diver\"}]},\"input\":{\"type\":\"number\",\"label\":\"Distance from 0 in meters\",\"model\":{\"op\":\"abs\",\"value\":-6.5},\"hint\":\"Distance is positive. Drop the sign, keep the 6.5.\",\"traps\":[{\"value\":-6.5,\"feedback\":\"Absolute value is a distance, so it is not negative.\",\"misconception\":\"signed-absolute-value\"},{\"value\":6,\"feedback\":\"The half meter is part of the distance.\",\"misconception\":\"truncated-decimal\"}]}},\"independent\":{\"prompt\":\"A probe at −0.8 m and a mast at 4.2 m. Enter both distances from zero, probe first.\",\"input\":{\"type\":\"fields\",\"hint\":\"Absolute value removes direction. −0.8 is 0.8 from zero, not 8 and not −0.8.\",\"fields\":[{\"id\":\"probe\",\"label\":\"Probe distance\",\"model\":{\"op\":\"abs\",\"value\":-0.8},\"miss\":\"The probe is 0.8 meters from zero.\"},{\"id\":\"mast\",\"label\":\"Mast distance\",\"model\":{\"op\":\"abs\",\"value\":4.2},\"miss\":\"A positive number's absolute value is the number itself.\"}]}},\"success\":{\"supported\":\"6.5 meters from the surface. The sign told the direction, and it is gone from the distance.\",\"independent\":\"0.8 and 4.2. The mast is farther from zero even though the probe is the one below it.\"},\"consequence\":\"Distances from zero are known.\"}},{\"id\":\"order\",\"place\":\"The comparison\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"On the number line, −2 is to the right of −6.5. Greater means to the right, not farther from zero.\"}]},{\"id\":\"order-task\",\"place\":\"The comparison\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Which statement orders the readings correctly?\"}],\"challenge\":{\"id\":\"order-readings\",\"objective\":\"Order rational numbers that include negatives.\",\"supported\":{\"prompt\":\"Which list is ordered from least to greatest?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"line\",\"hint\":\"Left to right on the number line: the most negative is least.\",\"options\":[{\"id\":\"abs\",\"label\":\"3, −2, −6.5 because the absolute values grow.\",\"feedback\":\"That orders by distance from zero, and it also puts a positive between nothing. It is not least to greatest.\",\"misconception\":\"ordered-by-absolute-value\"},{\"id\":\"line\",\"label\":\"−6.5, −2, 3\",\"correct\":true,\"feedback\":\"−6.5 is farthest left, then −2, then 3. That is least to greatest.\"},{\"id\":\"reverse\",\"label\":\"3, −2, −6.5\",\"feedback\":\"That is greatest to least. The question asked for the other direction.\",\"misconception\":\"reversed-order\"}]}},\"independent\":{\"prompt\":\"Which comparison is true?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"greater\",\"hint\":\"A number farther right is greater. Absolute value is a different comparison.\",\"options\":[{\"id\":\"abs-greater\",\"label\":\"−8 \u003e −3 because 8 \u003e 3.\",\"feedback\":\"8 \u003e 3 is true about the absolute values. On the number line −8 is left of −3, so −8 is less.\",\"misconception\":\"ordered-by-absolute-value\"},{\"id\":\"greater\",\"label\":\"−0.5 \u003e −4.5, and |−4.5| \u003e |−0.5|.\",\"correct\":true,\"feedback\":\"−0.5 is to the right, so it is greater. Its distance from zero is smaller. Both sentences can be true.\"},{\"id\":\"pos\",\"label\":\"−2 \u003e 1 because depth matters more than height.\",\"feedback\":\"The survey's order does not depend on which direction we find dramatic. 1 is to the right of −2.\",\"misconception\":\"preference-as-order\"}]}},\"success\":{\"supported\":\"The readings stand in numerical order. Distance is a separate column.\",\"independent\":\"Greater and farther-from-zero part company, on purpose.\"},\"consequence\":\"Order and absolute value are both on the slate, in different columns.\"}},{\"id\":\"rescue\",\"place\":\"The rescue call\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"rudd\",\"text\":\"Send the boat to the greatest number. That will be the diver, obviously.\"},{\"speaker\":\"mara\",\"text\":\"The diver is the least number and the greatest distance below zero. Say the one you mean.\"}]},{\"id\":\"which-question\",\"place\":\"The rescue call\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"The diver is at −6.5, the buoy at −2, the gull at 3. Which instruction is safe?\"}],\"challenge\":{\"id\":\"which-instruction\",\"objective\":\"Choose absolute value or order to match the question.\",\"supported\":{\"prompt\":\"You need the reading farthest from sea level. Which point is it?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"diver\",\"hint\":\"Compare absolute values: 6.5, 2, and 3.\",\"options\":[{\"id\":\"gull\",\"label\":\"The gull at 3, because 3 is the greatest number.\",\"feedback\":\"3 is greatest. Its distance from zero is 3, which is less than 6.5.\",\"misconception\":\"order-used-for-distance\"},{\"id\":\"diver\",\"label\":\"The diver at −6.5, because the absolute value is 6.5.\",\"correct\":true,\"feedback\":\"Farthest from zero means greatest absolute value, not the greatest number.\"},{\"id\":\"buoy\",\"label\":\"The buoy at −2, because it is negative but not too negative.\",\"feedback\":\"−2 is a moderate depth. Its absolute value is the smallest of the three.\",\"misconception\":\"mild-negative\"}]}},\"independent\":{\"prompt\":\"Two orders go out. Which pair of orders is consistent with the numbers?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"both\",\"hint\":\"One order can seek the greatest number. A different order can seek the greatest absolute value. They will name different points.\",\"options\":[{\"id\":\"same\",\"label\":\"Both 'greatest number' and 'farthest from zero' mean the diver.\",\"feedback\":\"The diver has the greatest absolute value and the least number. The phrases are not synonyms.\",\"misconception\":\"order-used-for-distance\"},{\"id\":\"both\",\"label\":\"Send the altitude check to the gull, the greatest number. Send the deep rescue to the diver, the greatest distance from zero.\",\"correct\":true,\"feedback\":\"Each phrase gets the measure it actually names.\"},{\"id\":\"buoy-both\",\"label\":\"Send both jobs to the buoy, the compromise.\",\"feedback\":\"The buoy is neither the greatest number nor the greatest distance.\",\"misconception\":\"compromise-value\"}]}},\"success\":{\"supported\":\"The deep rescue goes to the diver. Greatest number was a different question.\",\"independent\":\"Gull for the greatest reading, diver for the greatest distance. The boat does not have to guess which English was intended.\"},\"consequence\":\"Absolute value and order each keep a job. The depot itself is a point on a four-quadrant grid.\"}},{\"id\":\"grid-hook\",\"place\":\"The chart table\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"The depot is west and north of the lock: negative x, positive y. Couriers keep plotting it in the wrong quadrant.\"},{\"speaker\":\"sera\",\"text\":\"Then we need the distance along the streets, horizontal or vertical, not a wishful diagonal.\"},{\"speaker\":\"narrator\",\"text\":\"The waterline had been made honest. The map was about to grow a second axis.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Distance from the Surface · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbo
