d\":\"crate\",\"place\":\"Archive loading bay\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Eight hundred sixty-four glass tubes. Twelve field kits. No tube left over, or the histogram never leaves the dock.\"},{\"speaker\":\"jules\",\"text\":\"I can take easy chunks. Twelve times fifty is six hundred. That chunk is not the whole quotient.\",\"supported\":\"A partial quotient is one chunk. Add the chunks at the end.\",\"vocab\":\"Partial quotients\"},{\"speaker\":\"sera\",\"text\":\"If the multiplication check fails, we do not paint the number on the crate.\"}],\"choices\":{\"prompt\":\"A crate count looks impossible. How do you open the case?\",\"options\":[{\"id\":\"u2-shipment-a\",\"label\":\"Estimate with a compatible benchmark\",\"consequence\":\"You get a rough size before the exact quotient.\",\"next\":\"u2-shipment-choice-a\"},{\"id\":\"u2-shipment-b\",\"label\":\"Keep every decimal and divide exactly\",\"consequence\":\"You skip the estimate and compute the precise share.\",\"next\":\"u2-shipment-choice-b\"}]}},{\"id\":\"u2-shipment-choice-a\",\"place\":\"Archive loading bay\",\"focus\":\"mara\",\"next\":\"whole-division\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Jules rounds to a nearby friendly divisor and boxes the estimate in pencil.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u2-shipment-choice-b\",\"place\":\"Archive loading bay\",\"focus\":\"jules\",\"next\":\"whole-division\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Sera refuses the rounded scratch work. The manifest will be checked to the hundredth.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"whole-division\",\"place\":\"The crate stencil\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"How many tubes in each kit?\"}],\"challenge\":{\"id\":\"tubes\",\"objective\":\"Divide 864 by 12.\",\"supported\":{\"prompt\":\"Use the chunks on the slate. What is 864 ÷ 12?\",\"visual\":{\"type\":\"partial-quotients\",\"dividend\":864,\"divisor\":12,\"steps\":[{\"take\":50,\"product\":600},{\"take\":20,\"product\":240},{\"take\":2,\"product\":24}]},\"input\":{\"type\":\"number\",\"label\":\"Tubes in each kit\",\"model\":{\"op\":\"quotient\",\"a\":864,\"b\":12},\"hint\":\"Add the partial quotients: 50, 20, and 2. Then check that 12 times your answer is 864.\",\"traps\":[{\"value\":50,\"feedback\":\"50 is only the first chunk. 12 × 50 = 600, and 864 − 600 is still 264 tubes to place.\",\"misconception\":\"partial-quotient-as-answer\"},{\"value\":72.5,\"feedback\":\"The crate splits evenly. A remainder here would mean a tube without a kit.\",\"misconception\":\"invented-remainder\"}]}},\"independent\":{\"prompt\":\"There is no chunk slate this time. Find 975 ÷ 15, then enter the multiplication check 15 times your quotient.\",\"input\":{\"type\":\"fields\",\"hint\":\"You might take 15 × 60 = 900 and 15 × 5 = 75. The quotient is the sum of the chunks, and the check must return 975.\",\"fields\":[{\"id\":\"q\",\"label\":\"Quotient\",\"model\":{\"op\":\"quotient\",\"a\":975,\"b\":15},\"miss\":\"The quotient is how many times 15 fits into 975.\"},{\"id\":\"check\",\"label\":\"15 × quotient\",\"model\":{\"op\":\"product\",\"factors\":[15,65]},\"miss\":\"The check multiplies the divisor by the quotient and should return the dividend.\"}]}},\"success\":{\"supported\":\"Twelve kits, seventy-two tubes each. Jules multiplies back to 864 before he stencils.\",\"independent\":\"975 ÷ 15 is 65, and 15 × 65 returns 975. The second crate opens.\"},\"consequence\":\"Equal kits are sealed. The fuel drum is the next lock.\"}},{\"id\":\"fuel\",\"place\":\"The fuel drum\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"Fourteen and four tenths liters shared by 1.2 liter cans. If I move the decimal in only one number, I invent a different problem.\",\"supported\":\"Multiply the dividend and the divisor by 10. 14.4 ÷ 1.2 becomes 144 ÷ 12.\",\"vocab\":\"Equivalent division\"}]},{\"id\":\"decimal-division\",\"place\":\"The drum stencil\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"The cans have to come out even. Check by multiplying.\"}],\"challenge\":{\"id\":\"fuel-cans\",\"objective\":\"Divide a decimal by a decimal and keep the quotient the same.\",\"supported\":{\"prompt\":\"14.4 ÷ 1.2 is the same quotient as 144 ÷ 12. How many full cans?\",\"visual\":{\"type\":\"expression\",\"display\":\"14.4 ÷ 1.2 = 144 ÷ 12\",\"caption\":\"Both numbers were multiplied by 10.\"},\"input\":{\"type\":\"number\",\"label\":\"Number of cans\",\"model\":{\"op\":\"quotient\",\"a\":14.4,\"b\":1.2},\"hint\":\"Divide 144 by 12. The quotient does not get an extra decimal place after that equivalent division.\",\"traps\":[{\"value\":1.2,\"feedback\":\"1.2 is the size of one can, not the number of cans.\",\"misconception\":\"divisor-as-quotient\"},{\"value\":120,\"feedback\":\"144 ÷ 12 is not 120. You may have subtracted or dropped a factor of 12.\",\"misconception\":\"wrong-operation\"}]}},\"independent\":{\"prompt\":\"A later drum says 6.75 liters into cans of 0.25 liter. How many cans, and what is 0.25 times that count?\",\"input\":{\"type\":\"fields\",\"hint\":\"Multiply both numbers by 100 first if you want whole numbers: 675 ÷ 25. The multiplication check must return 6.75.\",\"fields\":[{\"id\":\"q\",\"label\":\"Number of cans\",\"model\":{\"op\":\"quotient\",\"a\":6.75,\"b\":0.25},\"miss\":\"The quotient tells how many 0.25-liter cans fit in 6.75 liters.\"},{\"id\":\"check\",\"label\":\"0.25 × cans\",\"model\":{\"op\":\"product\",\"factors\":[0.25,27]},\"miss\":\"Multiplying the can size by the number of cans should return 6.75 liters.\"}]}},\"success\":{\"supported\":\"Twelve cans. Sera multiplies 1.2 × 12 and lands back on 14.4.\",\"independent\":\"Twenty-seven cans. The check 0.25 × 27 closes on 6.75, so the drum is honest.\"},\"consequence\":\"Fuel cans are counted. The survey can leave the bay.\"}},{\"id\":\"check-scene\",\"place\":\"The ramp\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"One more check, because a stencil is harder to unpaint than a mistake is to catch.\"},{\"speaker\":\"jules\",\"text\":\"The product has to be the amount we started with. Not almost.\"}]},{\"id\":\"final-check\",\"place\":\"The ramp ledger\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Show the check that proves the kit count.\"}],\"challenge\":{\"id\":\"prove-kit\",\"objective\":\"Use multiplication to verify a quotient.\",\"supported\":{\"prompt\":\"Each of 12 kits holds 72 tubes. How many tubes is that altogether?\",\"input\":{\"type\":\"number\",\"label\":\"Tubes altogether\",\"model\":{\"op\":\"product\",\"factors\":[12,72]},\"hint\":\"This is the inverse of the division. 12 × 72 should be the original 864.\",\"traps\":[{\"value\":84,\"feedback\":\"84 is 12 + 72. A check of division multiplies.\",\"misconception\":\"added-instead-of-multiplied\"},{\"value\":72,\"feedback\":\"72 is the number in one kit. The check needs all 12 kits.\",\"misconception\":\"one-group-as-total\"}]}},\"independent\":{\"prompt\":\"Which check actually proves that 6.75 ÷ 0.25 = 27?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"product\",\"hint\":\"The inverse of division is multiplication. Adding the quotient to the divisor does not rebuild the dividend.\",\"options\":[{\"id\":\"sum\",\"label\":\"27 + 0.25 = 27.25, which is close to 6.75.\",\"feedback\":\"Close is not a check, and addition is the wrong operation. 27.25 does not equal 6.75 anyway.\",\"misconception\":\"added-instead-of-multiplied\"},{\"id\":\"product\",\"label\":\"0.25 × 27 = 6.75.\",\"correct\":true,\"feedback\":\"Multiplying the divisor by the quotient returns the dividend. That is the proof.\"},{\"id\":\"shift\",\"label\":\"27 × 10 = 270, so the answer is reasonable.\",\"feedback\":\"Scaling only the quotient does not reconnect it to 6.75 and 0.25.\",\"misconception\":\"unrelated-check\"}]}},\"success\":{\"supported\":\"The product is 864. The stencil stays.\",\"independent\":\"The multiplication returns the dividend exactly. Inez lets the ramp chains drop.\"},\"consequence\":\"The shipment is certified by a multiplication check.\"}},{\"id\":\"toward-mean\",\"place\":\"The pier\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"The festival desk wants a fair share of volunteer hours. They keep adding and dividing without saying what the result means.\"},{\"speaker\":\"theo\",\"text\":\"And they want to know who was consistently near that share, not who looked busy once.\"},{\"speaker\":\"narrator\",\"text\":\"The crates rolled. Ahead, a chalkboard waited with four numbers and an argument about fairness.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Split Shipment · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
