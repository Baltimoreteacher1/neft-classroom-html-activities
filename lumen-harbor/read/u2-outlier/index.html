e lamp was the harbor.\"},{\"speaker\":\"theo\",\"text\":\"Ten, twelve, twelve, fourteen, twelve, ten… and a seventy. The seventy never happened to the water.\",\"supported\":\"An outlier is a value far away from the cluster.\",\"vocab\":\"Outlier\"},{\"speaker\":\"rudd\",\"text\":\"Use every number. The machine wrote it, so it is real.\"}],\"choices\":{\"prompt\":\"One measurement sits far from the others. What do you do with it?\",\"options\":[{\"id\":\"u2-outlier-a\",\"label\":\"Hold it aside and say why\",\"consequence\":\"The outlier stays visible, but it does not quietly rewrite the center.\",\"next\":\"u2-outlier-choice-a\"},{\"id\":\"u2-outlier-b\",\"label\":\"Keep it in and show the pull\",\"consequence\":\"You leave the outlier in the set and measure how far the mean moves.\",\"next\":\"u2-outlier-choice-b\"}]}},{\"id\":\"u2-outlier-choice-a\",\"place\":\"Pier sensor cage\",\"focus\":\"mara\",\"next\":\"mean-with\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Inez circles the stray point and writes a reason beside it before anyone averages.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u2-outlier-choice-b\",\"place\":\"Pier sensor cage\",\"focus\":\"jules\",\"next\":\"mean-with\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Jules computes both ways and shows the commissioner the size of the pull.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"mean-with\",\"place\":\"The lamp-struck log\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"I will compute the mean with the lamp still in the list. Then we look at what it claims.\"}],\"challenge\":{\"id\":\"mean-outlier\",\"objective\":\"Compute the mean when an outlier is included.\",\"supported\":{\"prompt\":\"What is the mean of 10, 12, 12, 14, 12, 10, and 70?\",\"visual\":{\"type\":\"data\",\"title\":\"Probe log\",\"values\":[10,12,12,14,12,10,70]},\"input\":{\"type\":\"number\",\"label\":\"Mean\",\"model\":{\"op\":\"mean\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:visual:values\"},\"hint\":\"Add all seven values, including 70, then divide by 7. Notice whether the result sits inside the cluster of tens and twelves.\",\"traps\":[{\"value\":12,\"feedback\":\"12 is near the cluster and is the median. The mean is being pulled by 70.\",\"misconception\":\"median-called-mean\"},{\"value\":140,\"feedback\":\"140 is the total. The mean divides the total by 7 readings.\",\"misconception\":\"sum-as-mean\"}]}},\"independent\":{\"prompt\":\"Find the mean with the 70 included, and the mean of the other six readings only. Enter the inflated mean first.\",\"input\":{\"type\":\"fields\",\"hint\":\"Dividing by 7 with the 70 included is a different question from dividing the remaining total by 6. Report both, and do not pretend they are the same analysis.\",\"fields\":[{\"id\":\"with\",\"label\":\"Mean with 70\",\"model\":{\"op\":\"mean\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:visual:values\"},\"miss\":\"Include all seven readings in the total and divide by 7.\"},{\"id\":\"without\",\"label\":\"Mean of the other six\",\"model\":{\"op\":\"mean\",\"values\":[10,12,12,14,12,10]},\"miss\":\"The six harbor readings total 70. Divide by 6, not by 7.\"}]}},\"success\":{\"supported\":\"The mean jumps to 20, a reading the harbor never had on the six ordinary days.\",\"independent\":\"Twenty with the lamp. About 11.7 without it. The outlier is doing the pulling.\"},\"consequence\":\"The mean now describes a day that did not happen.\"}},{\"id\":\"median-hold\",\"place\":\"The ordered strip\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Order them. The middle of seven values does not care that the last one is absurd, as long as it stays at the end.\",\"supported\":\"The median uses position in the ordered list. One extreme end may not move it.\",\"vocab\":\"Resistant\"}]},{\"id\":\"median-task\",\"place\":\"The ordered strip\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Find the median with the 70 still sitting there. Do not delete it in secret.\"}],\"challenge\":{\"id\":\"median-outlier\",\"objective\":\"Find the median of a set that includes an outlier.\",\"supported\":{\"prompt\":\"What is the median of the seven readings, with 70 included?\",\"visual\":{\"type\":\"data\",\"title\":\"Ordered probe log\",\"values\":[10,10,12,12,12,14,70],\"sorted\":true},\"input\":{\"type\":\"summary\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:visual:values\",\"stats\":[\"median\"],\"hint\":\"Seven ordered values. The median is the fourth. The 70 is last, so it is not the middle.\"}},\"independent\":{\"prompt\":\"Report the median and the maximum. Keeping both shows you did not hide the broken probe.\",\"input\":{\"type\":\"summary\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:visual:values\",\"stats\":[\"median\",\"max\"],\"hint\":\"The median is the fourth ordered value. The maximum is still 70, and it belongs in the report as a flagged reading.\"}},\"success\":{\"supported\":\"The median stays at 12, inside the cluster. The 70 remains visible at the end.\",\"independent\":\"Median 12, maximum 70. The report can hold both truths.\"},\"consequence\":\"The median describes the cluster while the outlier stays on the record.\"}},{\"id\":\"publish\",\"place\":\"The brief\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"rudd\",\"text\":\"So which number do I say out loud?\"},{\"speaker\":\"mara\",\"text\":\"The one that answers 'what was a typical noon,' with the broken probe named beside it.\"}]},{\"id\":\"choose-measure\",\"place\":\"The brief\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Choose the measure. Also choose the sentence that admits what you did.\"}],\"challenge\":{\"id\":\"which-measure\",\"objective\":\"Select the median when an outlier would distort the mean's description of a typical value.\",\"supported\":{\"prompt\":\"The question is: what was a typical noon reading? The mean is 20 and the median is 12. Which measure answers it?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"median\",\"hint\":\"A typical noon should sit with the cluster of real harbor readings. Twenty does not.\",\"options\":[{\"id\":\"mean\",\"label\":\"The mean, because it uses every number, including the lamp.\",\"feedback\":\"Using every number is not the same as answering the question. The lamp reading is not a noon on the water, and it moves the mean to 20.\",\"misconception\":\"mean-always-because-all-data\"},{\"id\":\"median\",\"label\":\"The median, and name the 70 as a broken probe rather than a typical day.\",\"correct\":true,\"feedback\":\"The median stays in the cluster. The outlier is reported as a fault, not erased and not allowed to redefine typical.\"},{\"id\":\"max\",\"label\":\"The maximum, because the most dramatic number is the most important.\",\"feedback\":\"The maximum answers a different question: what was the most extreme logged value? It is a lamp, not a typical noon.\",\"misconception\":\"extreme-as-typical\"}]}},\"independent\":{\"prompt\":\"Which publication choice is statistically honest?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"honest\",\"hint\":\"Honesty is not 'always the mean' and not 'delete whatever is inconvenient.' Match the measure to the question and show the outlier.\",\"options\":[{\"id\":\"delete\",\"label\":\"Delete the 70 and publish the mean of the rest with no note.\",\"feedback\":\"The repaired analysis may be useful, but hiding the deletion makes the brief look cleaner than the log.\",\"misconception\":\"silent-deletion\"},{\"id\":\"honest\",\"label\":\"Publish the median as the typical noon, and footnote the 70 as a disconnected probe with the mean shown for comparison.\",\"correct\":true,\"feedback\":\"The question, the resistant measure, and the outlier are all visible. A reader can disagree without being misled.\"},{\"id\":\"only-mean\",\"label\":\"Publish only the mean of 20, because footnotes scare people.\",\"feedback\":\"A mean of 20 describes neither the cluster nor the fault. Leaving out the context is the scary part.\",\"misconception\":\"mean-always-because-all-data\"}]}},\"success\":{\"supported\":\"The brief says 12, and the lamp is a footnote. Rudd reads both.\",\"independent\":\"Median, mean, and a named fault share the page. The shouted number loses its costume.\"},\"consequence\":\"The typical noon is the median. The broken probe is labeled, not worshiped and not hidden.\"}},{\"id\":\"invoice\",\"place\":\"The print shop door\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"The print shop on Lantern Row will set the brief in type. Their invoice is already wrong by a decimal.\"},{\"speaker\":\"jules\",\"text\":\"If we pay the slid decimal, we fund the next bad headline.\"},{\"speaker\":\"narrator\",\"text\":\"The data files were almost honest. Money, unfortunately, still had a decimal point to defend.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Sensor That Shouted · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-ico
