ne had circled 5.5 as if a hinge could be bought in halves.\"},{\"speaker\":\"jules\",\"text\":\"Divide both sides by 4. The inequality stays ≤ because 4 is positive.\",\"supported\":\"Solving 4p ≤ 20 gives p ≤ 5.\"},{\"speaker\":\"sera\",\"text\":\"Then we still have to buy a whole number of parts. 5 is allowed. 6 is not.\"}],\"choices\":{\"prompt\":\"The budget is an inequality in a story. What do you write first?\",\"options\":[{\"id\":\"u8-budget-a\",\"label\":\"The phrase as symbols\",\"consequence\":\"You translate 'at most' or 'at least' before solving.\",\"next\":\"u8-budget-choice-a\"},{\"id\":\"u8-budget-b\",\"label\":\"A number that should work, and one that should not\",\"consequence\":\"You test the story against two candidates.\",\"next\":\"u8-budget-choice-b\"}]}},{\"id\":\"u8-budget-choice-a\",\"place\":\"Budget slate\",\"focus\":\"mara\",\"next\":\"solve\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Theo writes the words as an inequality. Solving a translation you have not written yet is a guess.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u8-budget-choice-b\",\"place\":\"Budget slate\",\"focus\":\"jules\",\"next\":\"solve\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara picks a number inside the budget and a number outside it, then checks the symbols against both.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"solve\",\"place\":\"The slate\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"Solve the inequality and keep the symbol.\"}],\"challenge\":{\"id\":\"solve-budget\",\"objective\":\"Solve a multiplication inequality.\",\"supported\":{\"prompt\":\"Solve 4p ≤ 20 for the number of parts p.\",\"input\":{\"type\":\"inequality\",\"variable\":\"p\",\"direction\":\"lte\",\"boundary\":{\"op\":\"quotient\",\"a\":20,\"b\":4},\"min\":0,\"max\":8,\"hint\":\"Divide both sides by 4. The symbol stays ≤. The boundary is 5.\"}},\"independent\":{\"prompt\":\"A second bin says 15 + c ≤ 40 for extra coins of a fee. Solve for c.\",\"input\":{\"type\":\"inequality\",\"variable\":\"c\",\"direction\":\"lte\",\"boundary\":{\"op\":\"subtract\",\"a\":{\"op\":\"n\",\"value\":40},\"b\":{\"op\":\"n\",\"value\":15}},\"min\":15,\"max\":35,\"hint\":\"Subtract 15 from both sides. The symbol does not flip when you subtract.\"}},\"success\":{\"supported\":\"p ≤ 5. Five parts are possible. Six are not.\",\"independent\":\"c ≤ 25. The fee's extra coins stop at 25, and 25 is still allowed.\"},\"consequence\":\"The solution set is graphed in the right direction.\"}},{\"id\":\"whole\",\"place\":\"The parts bin\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"The inequality allows 5, 4, 3, and so on. The job needs the most parts we can afford, and parts come in wholes.\"}]},{\"id\":\"how-many\",\"place\":\"The parts bin\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"What is the greatest whole number of parts the budget allows?\"}],\"challenge\":{\"id\":\"greatest-whole\",\"objective\":\"Choose the greatest whole-number solution of an inequality.\",\"supported\":{\"prompt\":\"4p ≤ 20, and p must be a whole number of parts. What is the greatest p you can buy?\",\"input\":{\"type\":\"number\",\"label\":\"Parts\",\"model\":{\"op\":\"quotient\",\"a\":20,\"b\":4},\"hint\":\"p ≤ 5, and 5 is a whole number. It is allowed because the symbol includes the boundary.\",\"traps\":[{\"value\":4,\"feedback\":\"4 is allowed, and it is not the greatest. 4 × 5 = 20, so 5 parts fit exactly.\",\"misconception\":\"stopped-short\"},{\"value\":6,\"feedback\":\"6 × 4 = 24, which is more than 20.\",\"misconception\":\"crossed-boundary\"}]}},\"independent\":{\"prompt\":\"Parts cost $3.50 and you have $20. The inequality is 3.5p ≤ 20. What is the greatest whole number of parts?\",\"input\":{\"type\":\"number\",\"label\":\"Parts\",\"model\":{\"op\":\"completeGroups\",\"total\":20,\"group\":3.5},\"hint\":\"20 ÷ 3.5 is a little more than 5.7. The greatest whole p with 3.5p ≤ 20 is 5, because 6 × 3.5 = 21.\",\"traps\":[{\"value\":6,\"feedback\":\"6 × 3.50 = 21, which is over the budget.\",\"misconception\":\"rounded-up\"},{\"value\":5.7,\"feedback\":\"You cannot buy a fractional part. The inequality allows 5.7 only as a real number, not as a hinge.\",\"misconception\":\"fractional-item\"}]}},\"success\":{\"supported\":\"Five parts. The budget is used exactly and not exceeded.\",\"independent\":\"Five parts again, with $2.50 unspoken change. Six would break the inequality.\"},\"consequence\":\"A whole-number purchase sits inside the solution set.\"}},{\"id\":\"two-rules\",\"place\":\"The final requisition\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"We also promised at least 2 parts, or the repair does not start. The purchase has to satisfy both rules.\"},{\"speaker\":\"rudd\",\"text\":\"Buy 6. Round up. Optimism.\"}]},{\"id\":\"both-rules\",\"place\":\"The final requisition\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Which purchase satisfies 4p ≤ 20 and p ≥ 2, with p a whole number, and spends as much as is useful?\"}],\"challenge\":{\"id\":\"choose-purchase\",\"objective\":\"Satisfy two inequalities with a practical whole-number choice.\",\"supported\":{\"prompt\":\"Which purchase is allowed by both p ≤ 5 and p ≥ 2?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"five\",\"hint\":\"The number has to be at least 2 and no more than 5.\",\"options\":[{\"id\":\"one\",\"label\":\"1 part\",\"feedback\":\"1 is below the promise of at least 2.\",\"misconception\":\"missed-lower-bound\"},{\"id\":\"five\",\"label\":\"5 parts\",\"correct\":true,\"feedback\":\"5 is inside both inequalities, and it is the greatest whole number the budget allows.\"},{\"id\":\"six\",\"label\":\"6 parts\",\"feedback\":\"6 is greater than 5. The budget inequality fails.\",\"misconception\":\"crossed-boundary\"}]}},\"independent\":{\"prompt\":\"You must buy at least 3 parts, each $3.50, with at most $20. Which statement is the best requisition?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"five-note\",\"hint\":\"Check 3, 5, and 6 against both the money and the minimum count.\",\"options\":[{\"id\":\"two\",\"label\":\"Buy 2. It is cheap, so the minimum can bend.\",\"feedback\":\"2 × 3.50 is inside the money and outside the promise of at least 3.\",\"misconception\":\"missed-lower-bound\"},{\"id\":\"five-note\",\"label\":\"Buy 5. It meets the minimum, and 5 × 3.50 = 17.50, which is within $20. Six would be $21.\",\"correct\":true,\"feedback\":\"Both constraints hold, and the choice does not invent a sixth part.\"},{\"id\":\"six\",\"label\":\"Buy 6 and owe a dollar. The inequality is close.\",\"feedback\":\"21 is not less than or equal to 20. Close is how budgets fail.\",\"misconception\":\"crossed-boundary\"}]}},\"success\":{\"supported\":\"Five parts go on the requisition. Both rules are visible beside the number.\",\"independent\":\"Five parts, $17.50, and a minimum that was honored. Optimism does not get a sixth hinge.\"},\"consequence\":\"The vault's last protocol is a purchase that the inequalities can defend. What remains of the city's trouble is a relationship between two changing quantities.\"}},{\"id\":\"to-pattern\",\"place\":\"The hill path\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"The weather station on the hill records hours and rainfall as a pair. Rudd still wants one of them.\"},{\"speaker\":\"sera\",\"text\":\"One column without the other is how this whole harbor got into trouble.\"},{\"speaker\":\"narrator\",\"text\":\"They climbed with a solved budget in the notebook. Above, two needles on one instrument waited to be read together.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Repair Budget · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
