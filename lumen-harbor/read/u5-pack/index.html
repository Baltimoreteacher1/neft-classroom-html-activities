ide it looked convincing until you tried to find two faces of each size.\"},{\"speaker\":\"jules\",\"text\":\"Each layer is 6 by 4 cubes. Three layers. Multiply, do not add the edges.\",\"supported\":\"Volume = length × width × height.\"},{\"speaker\":\"theo\",\"text\":\"The net has to fold without borrowing a face from a different box.\"}],\"choices\":{\"prompt\":\"The crate is a rectangular prism. Which face do you unfold first?\",\"options\":[{\"id\":\"u5-pack-a\",\"label\":\"The front face\",\"consequence\":\"You start the net from the face the dock sees.\",\"next\":\"u5-pack-choice-a\"},{\"id\":\"u5-pack-b\",\"label\":\"The base\",\"consequence\":\"You start the net from the face the crate sits on.\",\"next\":\"u5-pack-choice-b\"}]}},{\"id\":\"u5-pack-choice-a\",\"place\":\"Loading gap\",\"focus\":\"mara\",\"next\":\"volume\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Inez draws the front rectangle and warns that the net still needs the hidden faces.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u5-pack-choice-b\",\"place\":\"Loading gap\",\"focus\":\"jules\",\"next\":\"volume\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara draws the base. Height is still a dimension, even when you cannot see the top.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"volume\",\"place\":\"The crate\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"How many unit cubes fill it?\"}],\"challenge\":{\"id\":\"crate-volume\",\"objective\":\"Calculate the volume of a rectangular prism.\",\"supported\":{\"prompt\":\"The crate is 6 by 4 by 3 units. What is the volume?\",\"visual\":{\"type\":\"prism\",\"l\":6,\"w\":4,\"h\":3,\"unit\":\"units\"},\"input\":{\"type\":\"number\",\"label\":\"Cubic units\",\"model\":{\"op\":\"volume\",\"l\":6,\"w\":4,\"h\":3},\"hint\":\"6 × 4 = 24 cubes in one layer. Three layers make 72.\",\"traps\":[{\"value\":13,\"feedback\":\"13 is 6 + 4 + 3. Volume multiplies the three dimensions.\",\"misconception\":\"added-dimensions\"},{\"value\":24,\"feedback\":\"24 is one layer. The height says there are 3 layers.\",\"misconception\":\"one-layer\"}]}},\"independent\":{\"prompt\":\"A stone step is 2.5 m by 1.2 m by 0.4 m. What is its volume in cubic meters?\",\"input\":{\"type\":\"number\",\"label\":\"Cubic meters\",\"model\":{\"op\":\"volume\",\"l\":2.5,\"w\":1.2,\"h\":0.4},\"hint\":\"2.5 × 1.2 = 3, and 3 × 0.4 = 1.2. Adding 2.5 + 1.2 + 0.4 describes a path around the edges, not the stone.\",\"traps\":[{\"value\":4.1,\"feedback\":\"That is the sum of the dimensions.\",\"misconception\":\"added-dimensions\"},{\"value\":3,\"feedback\":\"3 is the area of the 2.5 by 1.2 face. The thickness is still 0.4.\",\"misconception\":\"face-as-volume\"}]}},\"success\":{\"supported\":\"Seventy-two cubic units. The crate's inside is no longer a rumor.\",\"independent\":\"1.2 cubic meters of step. The decimals had to be multiplied, not lined up and added.\"},\"consequence\":\"The prism has a volume.\"}},{\"id\":\"net-talk\",\"place\":\"The paper shadow\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"A rectangular prism has three pairs of matching faces. A net that offers two 6-by-4 faces, two 6-by-3, and two 4-by-3 can be ours.\",\"supported\":\"Six faces, in three congruent pairs.\"}]},{\"id\":\"net-choice\",\"place\":\"The paper shadow\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"Which description can fold into this crate?\"}],\"challenge\":{\"id\":\"which-net\",\"objective\":\"Identify a net whose faces match a rectangular prism.\",\"supported\":{\"prompt\":\"The prism is 6 by 4 by 3. Which net matches it?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"pairs\",\"hint\":\"List the three face sizes. Each size must appear twice.\",\"options\":[{\"id\":\"pairs\",\"label\":\"Two 6×4 faces, two 6×3 faces, and two 4×3 faces.\",\"correct\":true,\"feedback\":\"Those are exactly the three pairs of a 6 by 4 by 3 prism.\"},{\"id\":\"square\",\"label\":\"Six 6×4 faces.\",\"feedback\":\"That net is all the largest face. It cannot make the 3-unit edges.\",\"misconception\":\"one-face-repeated\"},{\"id\":\"five\",\"label\":\"Two 6×4 faces and three 6×3 faces.\",\"feedback\":\"That is five faces, and the 4×3 pair is missing. A prism net needs six faces.\",\"misconception\":\"missing-face\"}]}},\"independent\":{\"prompt\":\"Someone includes the volume, 72, as 'the seventh face, so the inside is covered.' What is wrong, and which net statement is still right?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"six\",\"hint\":\"Volume is a number of cubes, not a face. A net is a surface.\",\"options\":[{\"id\":\"seven\",\"label\":\"Add a 72-square face. The net should show the inside.\",\"feedback\":\"72 is cubic units of volume, not a rectangular face. The inside is enclosed by the six faces, not drawn as a seventh.\",\"misconception\":\"volume-as-face\"},{\"id\":\"six\",\"label\":\"Keep the six matching faces. The volume is computed from the edges, not printed as another face.\",\"correct\":true,\"feedback\":\"The net represents the surface. The volume is a different measurement of the same prism.\"},{\"id\":\"perimeter\",\"label\":\"Replace the net with the perimeter of the front face.\",\"feedback\":\"The front perimeter does not show the other faces and is not a volume.\",\"misconception\":\"perimeter-as-net\"}]}},\"success\":{\"supported\":\"The true net shows three pairs. Jules can imagine it folding.\",\"independent\":\"Six faces remain six. Seventy-two cubes stay inside them, unpainted as a face.\"},\"consequence\":\"The crate and its net agree about which box they are.\"}},{\"id\":\"face-check\",\"place\":\"The front board\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Before we wrap anything, I want the area of the front face alone, so nobody confuses it with the volume.\"},{\"speaker\":\"inez\",\"text\":\"A face is square units. The inside is cubic. Say both.\"}]},{\"id\":\"front-face\",\"place\":\"The front board\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"The front is 6 by 4. It is one face, not the crate.\"}],\"challenge\":{\"id\":\"front-area\",\"objective\":\"Distinguish the area of a face from the volume of the prism.\",\"supported\":{\"prompt\":\"What is the area of the 6 by 4 front face?\",\"input\":{\"type\":\"number\",\"label\":\"Square units\",\"model\":{\"op\":\"product\",\"factors\":[6,4]},\"hint\":\"One face is a rectangle. 6 × 4 = 24. The volume was 72 because of the third dimension.\",\"traps\":[{\"value\":72,\"feedback\":\"72 is the volume of the whole prism, in cubic units.\",\"misconception\":\"volume-as-area\"},{\"value\":20,\"feedback\":\"20 is the perimeter of the front, 6 + 4 + 6 + 4.\",\"misconception\":\"perimeter-as-area\"}]}},\"independent\":{\"prompt\":\"The step's front face is 2.5 m by 0.4 m. What is that face's area, and how does it differ from the 1.2 m³ volume?\",\"input\":{\"type\":\"fields\",\"hint\":\"Face area is 2.5 × 0.4. The volume multiplies by the remaining 1.2 m. Enter the face area, then the volume you already can defend.\",\"fields\":[{\"id\":\"face\",\"label\":\"Front face area (m²)\",\"model\":{\"op\":\"product\",\"factors\":[2.5,0.4]},\"miss\":\"Multiply the two edges of the face only.\"},{\"id\":\"vol\",\"label\":\"Volume (m³)\",\"model\":{\"op\":\"volume\",\"l\":2.5,\"w\":1.2,\"h\":0.4},\"miss\":\"The volume includes the depth 1.2 as a third factor.\"}]}},\"success\":{\"supported\":\"Twenty-four square units of face. Seventy-two cubic units inside. The units keep them apart.\",\"independent\":\"One square meter of face, 1.2 cubic meters of stone. The shadow is not the crate.\"},\"consequence\":\"Face and volume stay different measurements. Cloth for the scaffold is a surface problem of its own.\"}},{\"id\":\"wrap-hook\",\"place\":\"The scaffold\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"They ordered cloth for a prism and a square pyramid using one careless sum.\"},{\"speaker\":\"theo\",\"text\":\"Surface area counts every face once. Slant height is not the height that stands up straight.\"},{\"speaker\":\"narrator\",\"text\":\"The crate was full and correctly so. The scaffold waited, unwrapped, in a wind that knew every face.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Crate and Its Shadow · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
