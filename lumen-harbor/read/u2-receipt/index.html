ull,{\"fallback\":null,\"children\":\"$Le\"}]}]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"10:I[8620,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"830\",\"static/chunks/app/read/%5BchapterId%5D/page-b181bf46f1df60e3.js\"],\"Reader\"]\n"])</script><script>self.__next_f.push([1,"5:[[\"$\",\"p\",null,{\"className\":\"sr-only\",\"children\":[\"Lessons 2.11–2.12\",\". \",\"The print shop's invoice adds, subtracts, and multiplies decimals as if the point were decoration. One corrected receipt keeps the brief in print.\"]}],[\"$\",\"$d\",null,{\"fallback\":[\"$\",\"main\",null,{\"id\":\"content\",\"className\":\"p-6\",\"children\":\"Opening the chapter…\"}],\"children\":[\"$\",\"$L10\",null,{\"chapter\":{\"id\":\"u2-receipt\",\"unit\":2,\"title\":\"The Sliding Decimal\",\"summary\":\"The print shop's invoice adds, subtracts, and multiplies decimals as if the point were decoration. One corrected receipt keeps the brief in print.\",\"lessonCodes\":[\"2.11\",\"2.12\"],\"minutes\":12,\"objectives\":[\"Add and subtract decimals by aligning place value.\",\"Multiply decimals and place the decimal point using place value, not a guess.\"],\"vocabulary\":[{\"term\":\"Place value\",\"meaning\":\"The value a digit has because of its position relative to the decimal point.\"},{\"term\":\"Align\",\"meaning\":\"Line up decimal points before adding or subtracting.\"},{\"term\":\"Factor\",\"meaning\":\"One of the numbers being multiplied.\"}],\"misconceptions\":[\"Lining up the rightmost digits instead of the decimal points.\",\"Adding the number of decimal places when multiplying.\",\"Dropping a trailing zero and changing the value.\"],\"representations\":[\"Decimal addition\",\"Decimal subtraction\",\"Decimal multiplication\"],\"use\":[\"during\",\"after\"],\"scenes\":[{\"id\":\"shop\",\"place\":\"Lantern Row print shop\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"The shop smelled of ink and warm metal. The invoice smelled like a decimal point that had taken a walk.\"},{\"speaker\":\"sera\",\"text\":\"They added 12.40, 3.75, and 8.15 by lining up the last digits. Tenths fell into the ones place.\",\"supported\":\"Line up the decimal points. Tenths stay under tenths.\",\"vocab\":\"Align\"},{\"speaker\":\"mara\",\"text\":\"We need the sum, what is left of the fifty-dollar float, and the cost of 3.5 reams at 4.20 each. Three different operations.\"}],\"choices\":{\"prompt\":\"The receipt is smudged. Which corner do you reconstruct first?\",\"options\":[{\"id\":\"u2-receipt-a\",\"label\":\"The unit price\",\"consequence\":\"You recover the cost of one before the cost of many.\",\"next\":\"u2-receipt-choice-a\"},{\"id\":\"u2-receipt-b\",\"label\":\"The number of items\",\"consequence\":\"You recover how many were bought before you scale the price.\",\"next\":\"u2-receipt-choice-b\"}]}},{\"id\":\"u2-receipt-choice-a\",\"place\":\"Lantern Row print shop\",\"focus\":\"mara\",\"next\":\"add-task\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Sera isolates the price of a single ream. Multiplication can wait until that price is clean.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u2-receipt-choice-b\",\"place\":\"Lantern Row print shop\",\"focus\":\"jules\",\"next\":\"add-task\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara counts the line items. A wrong factor would scale a correct price into a wrong total.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"add-task\",\"place\":\"The invoice\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Add the three charges before anyone subtracts from the float.\"}],\"challenge\":{\"id\":\"sum-charges\",\"objective\":\"Add decimals with aligned place value.\",\"supported\":{\"prompt\":\"What is 12.40 + 3.75 + 8.15?\",\"visual\":{\"type\":\"expression\",\"display\":\"12.40 + 3.75 + 8.15\",\"caption\":\"Line up the decimal points.\"},\"input\":{\"type\":\"number\",\"label\":\"Total charges in dollars\",\"unit\":\"$$\",\"model\":{\"op\":\"sum\",\"values\":[12.4,3.75,8.15]},\"hint\":\"Add hundredths to hundredths. 40 hundredths plus 75 hundredths is more than one tenth, so regroup.\",\"traps\":[{\"value\":23.2,\"feedback\":\"That drops the regrouping from the hundredths. 0.40 + 0.75 + 0.15 is 1.30, not 0.20.\",\"misconception\":\"no-regroup\"},{\"value\":243,\"feedback\":\"The decimal points were ignored, so tenths were treated as tens.\",\"misconception\":\"ignored-decimal\"}]}},\"independent\":{\"prompt\":\"A second job lists 19.95, 8.40, and 6.05. What is the total?\",\"input\":{\"type\":\"number\",\"label\":\"Second total\",\"unit\":\"$$\",\"model\":{\"op\":\"sum\",\"values\":[19.95,8.4,6.05]},\"hint\":\"Align place values. 19.95 has hundredths, so 8.40 is 8.40, not 8.4 shoved to the right.\",\"traps\":[{\"value\":34.3,\"feedback\":\"Check the hundredths: 95 + 40 + 05 regroups into an extra tenth. The total is not 34.30.\",\"misconception\":\"no-regroup\"},{\"value\":344,\"feedback\":\"Removing the decimal points changes dollars into something else entirely.\",\"misconception\":\"ignored-decimal\"}]}},\"success\":{\"supported\":\"The charges total 24.30. The points sit in one vertical line.\",\"independent\":\"The second job totals 34.40. Sera circles the aligned points.\"},\"consequence\":\"The invoice sum is corrected in ink the shop cannot smudge.\"}},{\"id\":\"float\",\"place\":\"The cash box\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"The newsroom float is fifty dollars. Subtract the real total, not the shop's fantasy total.\",\"supported\":\"Subtract by aligning decimal points. Regroup a dollar into ten tenths when you need to.\"}]},{\"id\":\"subtract-task\",\"place\":\"The cash box\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"What remains has to be able to buy the tram home.\"}],\"challenge\":{\"id\":\"remaining-float\",\"objective\":\"Subtract decimals.\",\"supported\":{\"prompt\":\"The float is $50.00 and the corrected charges are $24.30. How much is left?\",\"input\":{\"type\":\"number\",\"label\":\"Dollars left\",\"unit\":\"$$\",\"model\":{\"op\":\"subtract\",\"a\":{\"op\":\"n\",\"value\":50},\"b\":{\"op\":\"sum\",\"values\":[12.4,3.75,8.15]}},\"hint\":\"50.00 minus 24.30. You will regroup dollars into dimes and dimes into pennies.\",\"traps\":[{\"value\":26.3,\"feedback\":\"50 − 24 is 26, but you still have to subtract the 30 hundredths. That leaves 25.70, not 26.30.\",\"misconception\":\"ignored-decimal-part\"},{\"value\":74.3,\"feedback\":\"That adds the float and the charges. The question asks what is left.\",\"misconception\":\"wrong-operation\"}]}},\"independent\":{\"prompt\":\"A $40.00 float pays the second total, $34.40. What remains?\",\"input\":{\"type\":\"number\",\"label\":\"Dollars left\",\"unit\":\"$$\",\"model\":{\"op\":\"subtract\",\"a\":{\"op\":\"n\",\"value\":40},\"b\":{\"op\":\"sum\",\"values\":[19.95,8.4,6.05]}},\"hint\":\"Align 40.00 and 34.40. Subtract hundredths, then tenths, then ones.\",\"traps\":[{\"value\":6.6,\"feedback\":\"40 − 34 is 6, and 0.40 more has to come off that difference. 6.00 − 0.40 is 5.60.\",\"misconception\":\"ignored-decimal-part\"},{\"value\":74.4,\"feedback\":\"That is a sum. The float is paying the bill, so subtract.\",\"misconception\":\"wrong-operation\"}]}},\"success\":{\"supported\":\"Twenty-five dollars and seventy cents remain. The float survives.\",\"independent\":\"Five dollars and sixty cents remain. Tight, but the subtraction is honest.\"},\"consequence\":\"The cash box matches the corrected invoice.\"}},{\"id\":\"reams\",\"place\":\"The paper stack\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"3.5 reams at $4.20 is not 3.5 plus 4.20, and it is not 35 times 42 with a randomly pasted dot.\",\"supported\":\"Multiply as whole numbers, then give the product as many decimal places as the factors have together.\",\"vocab\":\"Factor\"}]},{\"id\":\"product-task\",\"place\":\"The paper stack\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"Count the decimal places in the factors. The product has to spend them.\"}],\"challenge\":{\"id\":\"ream-cost\",\"objective\":\"Multiply decimals and place the decimal point correctly.\",\"supported\":{\"prompt\":\"What is the cost of 3.5 reams at $4.20 each?\",\"visual\":{\"type\":\"expression\",\"display\":\"3.5 × 4.20\",\"caption\":\"One decimal place and two decimal places.\"},\"input\":{\"type\":\"number\",\"label\":\"Cost in dollars\",\"unit\":\"$$\",\"model\":{\"op\":\"product\",\"factors\":[3.5,4.2]},\"hint\":\"35 × 42 = 1,470. The factors have 1 + 2 = 3 decimal places together, so 1470 thousandths is 1.470.\",\"traps\":[{\"value\":147,\"feedback\":\"147 keeps only one decimal place. The factors contribute three places together: 1.470, which is $1.47.\",\"misconception\":\"decimal-places-added-wrong\"},{\"value\":1.47,\"feedback\":\"You are one decimal place away. 3.5 × 4 = 14, and 3.5 × 0.20 = 0.70, so the product is 14.70.\",\"misconception\":\"one-place-off\"},{\"value\":7.7,\"feedback\":\"That adds 3.5 and 4.2. Cost is a product of reams and price.\",\"misconception\":\"wrong-operation\"}]}},\"independent\":{\"prompt\":\"The shop offers 2.25 kilograms of ink at $6.40 per kilogram. What is the cost?\",\"input\":{\"type\":\"fields\",\"hint\":\"225 × 64 = 14,400. The factors contribute four decimal places together, so the product is 1.4400 dollars.\",\"fields\":[{\"id\":\"cost\",\"label\":\"Cost in dollars\",\"model\":{\"op\":\"product\",\"factors\":[2.25,6.4]},\"miss\":\"Multiply 2.25 by 6.40. Four decimal places in the factors make 1.44.\"}]}},\"success\":{\"supported\":\"The reams cost $14.70. Jules writes the point before he writes the dollars.\",\"independent\":\"Ink would be $14.40, from four decimal places accounted for. The shop's pasted dot has nowhere left to hide.\"},\"consequence\":\"The receipt is reprinted with aligned sums and a justified product. Lantern Row still looks wrong, but the brief will exist.\"}},{\"id\":\"toward-ratios\",\"place\":\"The shop window\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Keep the corrected brief. Tomorrow the locks themselves are out of ratio, and a headline will not move the water.\"},{\"speaker\":\"theo\",\"text\":\"Fresh water and salt water have to stay in a pair. Someone scaled only one of them.\"},{\"speaker\":\"narrator\",\"text\":\"Mara slid the honest invoice into her notebook. Behind the next tide gate, the harbor was keeping two numbers, and only one of them was true.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Sliding Decimal · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
