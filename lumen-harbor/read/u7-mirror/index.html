lf a careful transcription.\"},{\"speaker\":\"sera\",\"text\":\"Same x, opposite y. That is a reflection across the x-axis, not a copy.\",\"supported\":\"Across the x-axis, y changes sign.\"},{\"speaker\":\"theo\",\"text\":\"Distance to the mirror stays the same. The point does not slide toward zero.\"}],\"choices\":{\"prompt\":\"A point is reflected across an axis. Which coordinate do you expect to change?\",\"options\":[{\"id\":\"u7-mirror-a\",\"label\":\"Reflect across the x-axis\",\"consequence\":\"The y-coordinate changes sign.\",\"next\":\"u7-mirror-choice-a\"},{\"id\":\"u7-mirror-b\",\"label\":\"Reflect across the y-axis\",\"consequence\":\"The x-coordinate changes sign.\",\"next\":\"u7-mirror-choice-b\"}]}},{\"id\":\"u7-mirror-choice-a\",\"place\":\"Tracing table\",\"focus\":\"mara\",\"next\":\"reflect-x\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Inez flips the point over the x-axis. The horizontal coordinate stays; the vertical one changes sign.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u7-mirror-choice-b\",\"place\":\"Tracing table\",\"focus\":\"jules\",\"next\":\"reflect-x\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara flips the point over the y-axis. The vertical coordinate stays; the horizontal one changes sign.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"reflect-x\",\"place\":\"The x-axis mirror\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Plot the reflection of (3, −2) across the x-axis.\"}],\"challenge\":{\"id\":\"across-x\",\"objective\":\"Reflect a point across the x-axis.\",\"supported\":{\"prompt\":\"Reflect (3, −2) across the x-axis. Plot the image.\",\"visual\":{\"type\":\"coordinate\",\"xMin\":-6,\"xMax\":6,\"yMin\":-6,\"yMax\":6,\"points\":[{\"x\":3,\"y\":-2,\"label\":\"depot\"}]},\"input\":{\"type\":\"points\",\"targets\":[{\"x\":3,\"y\":2}],\"audit\":{\"kind\":\"reflect\",\"axis\":\"x\",\"source\":{\"x\":3,\"y\":-2}},\"hint\":\"The x-coordinate stays 3. The y-coordinate changes from −2 to 2.\"}},\"independent\":{\"prompt\":\"Reflect (−4, 2.5) across the x-axis.\",\"visual\":{\"type\":\"coordinate\",\"xMin\":-6,\"xMax\":6,\"yMin\":-6,\"yMax\":6,\"points\":[{\"x\":-4,\"y\":2.5,\"label\":\"camp\"}]},\"input\":{\"type\":\"points\",\"targets\":[{\"x\":-4,\"y\":-2.5}],\"audit\":{\"kind\":\"reflect\",\"axis\":\"x\",\"source\":{\"x\":-4,\"y\":2.5}},\"hint\":\"Keep x. Change the sign of y only. The image is not (4, −2.5) and not (4, 2.5).\"}},\"success\":{\"supported\":\"The image is (3, 2). The filed 'copy' was a reflection all along.\",\"independent\":\"(−4, −2.5). The camp's reflection crossed the x-axis without changing its east-west position.\"},\"consequence\":\"Reflection across the x-axis is identified.\"}},{\"id\":\"reflect-y\",\"place\":\"The y-axis mirror\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"A second clerk flipped across the y-axis and called it a correction. That one changes x.\"}]},{\"id\":\"across-y\",\"place\":\"The y-axis mirror\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Where does (3, −2) go across the y-axis?\"}],\"challenge\":{\"id\":\"across-y\",\"objective\":\"Reflect a point across the y-axis.\",\"supported\":{\"prompt\":\"Plot the reflection of (3, −2) across the y-axis.\",\"visual\":{\"type\":\"coordinate\",\"xMin\":-6,\"xMax\":6,\"yMin\":-6,\"yMax\":6,\"points\":[{\"x\":3,\"y\":-2,\"label\":\"depot\"}]},\"input\":{\"type\":\"points\",\"targets\":[{\"x\":-3,\"y\":-2}],\"audit\":{\"kind\":\"reflect\",\"axis\":\"y\",\"source\":{\"x\":3,\"y\":-2}},\"hint\":\"The y-coordinate stays −2. The x-coordinate changes sign.\"}},\"independent\":{\"prompt\":\"Which image is the reflection of (−4, 2.5) across the y-axis?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"yflip\",\"hint\":\"Across the y-axis, left and right swap. Up and down stay.\",\"options\":[{\"id\":\"both\",\"label\":\"(4, −2.5)\",\"feedback\":\"Both signs changed. That is a half-turn around the origin, not a reflection across one axis.\",\"misconception\":\"both-signs\"},{\"id\":\"yflip\",\"label\":\"(4, 2.5)\",\"correct\":true,\"feedback\":\"x changed sign and y stayed 2.5. That is the y-axis reflection.\"},{\"id\":\"xflip\",\"label\":\"(−4, −2.5)\",\"feedback\":\"That changes y and keeps x, which is the x-axis reflection.\",\"misconception\":\"wrong-axis\"}]}},\"success\":{\"supported\":\"(−3, −2). The y-axis mirror moves the point east-west only.\",\"independent\":\"(4, 2.5). One coordinate changed, so one mirror was used.\"},\"consequence\":\"The two mirrors do different jobs.\"}},{\"id\":\"distance-to-axis\",\"place\":\"The margin note\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Distance from (3, −2) to the x-axis is |−2|. The reflection is the same distance on the other side. If a filing changes the distance, it was not a reflection.\"}]},{\"id\":\"axis-distance\",\"place\":\"The margin note\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"How far is (3, −2) from the x-axis?\"}],\"challenge\":{\"id\":\"distance-axis\",\"objective\":\"Use absolute value as the distance from a point to an axis.\",\"supported\":{\"prompt\":\"What is the distance from (3, −2) to the x-axis?\",\"input\":{\"type\":\"number\",\"label\":\"Units\",\"model\":{\"op\":\"abs\",\"value\":-2},\"hint\":\"Distance to the x-axis is the absolute value of the y-coordinate.\",\"traps\":[{\"value\":3,\"feedback\":\"3 is the distance to the y-axis, the absolute value of x.\",\"misconception\":\"wrong-axis\"},{\"value\":-2,\"feedback\":\"Distance is not negative.\",\"misconception\":\"negative-distance\"}]}},\"independent\":{\"prompt\":\"For (−4, 2.5), enter the distance to the y-axis and the distance to the x-axis, in that order.\",\"input\":{\"type\":\"fields\",\"hint\":\"Distance to the y-axis uses |x|. Distance to the x-axis uses |y|.\",\"fields\":[{\"id\":\"yaxis\",\"label\":\"Distance to the y-axis\",\"model\":{\"op\":\"abs\",\"value\":-4},\"miss\":\"Use the absolute value of the x-coordinate.\"},{\"id\":\"xaxis\",\"label\":\"Distance to the x-axis\",\"model\":{\"op\":\"abs\",\"value\":2.5},\"miss\":\"Use the absolute value of the y-coordinate.\"}]}},\"success\":{\"supported\":\"Two units from the x-axis, on both sides of a true reflection.\",\"independent\":\"Four units from the y-axis and 2.5 from the x-axis. Each mirror has its own distance.\"},\"consequence\":\"The mirrored filing is labeled as a reflection. The depot stays at (3, −2). The next locks are equations, and they will not open for a value that only looks close.\"}},{\"id\":\"to-equations\",\"place\":\"The vault stair\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"The map is no longer flipped. The vault under it still wants equations that balance.\"},{\"speaker\":\"inez\",\"text\":\"A number is a solution only if both sides name the same amount. Hope is not a substitution.\"},{\"speaker\":\"narrator\",\"text\":\"They folded the mirrored sheet behind the true one. Below, brass scales waited in a row, one of them already tipped.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Mirror Check · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"hr
