hundred lantern hooks faced the canal. Forty held copper glass. The tag under them had three names, and two were strangers.\"},{\"speaker\":\"rudd\",\"text\":\"Forty out of a hundred is almost half, and the clerk says it is also 4 percent. Print the friendliest one.\"},{\"speaker\":\"sera\",\"text\":\"Friendly is not a form of a number. Forty per hundred is 40 percent, and the decimal has to land in the hundredths.\",\"supported\":\"Percent means per 100.\",\"vocab\":\"Percent\"}],\"choices\":{\"prompt\":\"The lantern glass is a fraction of the panel. How do you see it?\",\"options\":[{\"id\":\"u4-lanterns-a\",\"label\":\"Shade a grid\",\"consequence\":\"You model the fraction as a count of equal parts.\",\"next\":\"u4-lanterns-choice-a\"},{\"id\":\"u4-lanterns-b\",\"label\":\"Place it on a number line\",\"consequence\":\"You model the fraction as a point between whole numbers.\",\"next\":\"u4-lanterns-choice-b\"}]}},{\"id\":\"u4-lanterns-choice-a\",\"place\":\"Lantern Row\",\"focus\":\"mara\",\"next\":\"shade\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Jules sketches a hundred-cell grid and shades only the glass.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u4-lanterns-choice-b\",\"place\":\"Lantern Row\",\"focus\":\"jules\",\"next\":\"shade\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Sera draws a number line from 0 to 1 and marks the glass between the whole panels.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"shade\",\"place\":\"The hundred board\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Shade the copper share. Then name it as a percent.\"}],\"challenge\":{\"id\":\"shade-forty\",\"objective\":\"Represent 40 out of 100 as a percent on a hundred grid.\",\"supported\":{\"prompt\":\"Shade 40 of the 100 squares, or enter 40 if you are using the count. What percent of the board is copper?\",\"visual\":{\"type\":\"percent-grid\",\"total\":100,\"interactive\":true},\"input\":{\"type\":\"shade\",\"total\":100,\"model\":{\"op\":\"percent\",\"part\":40,\"whole\":100},\"hint\":\"Each square is 1 percent. Forty squares are 40 percent, not 4 percent.\"}},\"independent\":{\"prompt\":\"The clerk shaded 4 columns and called them 4 percent. A column is 10 squares. Shade the copper claim of 40 out of 100 and enter the percent.\",\"visual\":{\"type\":\"percent-grid\",\"total\":100,\"shaded\":4,\"interactive\":true},\"input\":{\"type\":\"shade\",\"total\":100,\"model\":{\"op\":\"percent\",\"part\":40,\"whole\":100},\"hint\":\"4 columns of 10 are 40 squares, which is 40 per 100, or 40%. Counting columns and calling each column one percent drops a factor of 10.\"}},\"success\":{\"supported\":\"Forty squares burn copper. The tag can no longer say 4.\",\"independent\":\"The four columns were forty lanterns. The percent catches up to the picture.\"},\"consequence\":\"The hundred board shows 40 copper squares and a true 40%.\"}},{\"id\":\"three-names\",\"place\":\"The tag nail\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"I want the fraction, the decimal, and the percent to be the same shaded amount. Simplifying a fraction does not shrink the lanterns.\"},{\"speaker\":\"jules\",\"text\":\"40/100 is 4/10 is 2/5. Still forty hundredths. Still 0.40.\"}]},{\"id\":\"match-names\",\"place\":\"The tag nail\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Choose the trio that does not change the shading.\"}],\"challenge\":{\"id\":\"equivalent-trio\",\"objective\":\"Match a fraction, a decimal, and a percent for the same hundredth amount.\",\"supported\":{\"prompt\":\"Which trio names the same amount as 40 shaded squares out of 100?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"match\",\"hint\":\"40% is 40 hundredths, written 0.40. The fraction 40/100 can simplify and still be that amount.\",\"options\":[{\"id\":\"shift\",\"label\":\"4/100, 0.40, and 40%\",\"feedback\":\"0.40 and 40% match each other, but 4/100 is 4%, the clerk's other mistake.\",\"misconception\":\"percent-decimal-shift\"},{\"id\":\"match\",\"label\":\"2/5, 0.40, and 40%\",\"correct\":true,\"feedback\":\"2/5 = 40/100 = 0.40 = 40%. The simplified fraction did not change the value.\"},{\"id\":\"four\",\"label\":\"40/100, 0.04, and 4%\",\"feedback\":\"40/100 is 0.40, not 0.04. The decimal moved too far.\",\"misconception\":\"percent-decimal-shift\"}]}},\"independent\":{\"prompt\":\"A replacement crate is seven twentieths full. Which card is safe to hang on it?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"seven\",\"hint\":\"Convert 7/20 to hundredths by multiplying numerator and denominator by 5. Then read the percent and the decimal from those hundredths.\",\"options\":[{\"id\":\"seven\",\"label\":\"7/20, 0.35, and 35%\",\"correct\":true,\"feedback\":\"7/20 = 35/100. That is 35 hundredths, 0.35, and 35%.\"},{\"id\":\"seventy\",\"label\":\"7/20, 0.70, and 70%\",\"feedback\":\"7/10 would be 70%. Twentieths are smaller. 7/20 is half of 7/10.\",\"misconception\":\"wrong-denominator\"},{\"id\":\"decimal-only\",\"label\":\"7/20, 0.035, and 3.5%\",\"feedback\":\"That treats 7/20 as 7/200. Multiplying by 5 gives 35/100, not 3.5/100.\",\"misconception\":\"percent-decimal-shift\"}]}},\"success\":{\"supported\":\"One tag, three agreeing names. The copper lanterns stay lit.\",\"independent\":\"Seven twentieths is 35 percent. The replacement crate gets a card with no private decimal.\"},\"consequence\":\"Fraction, decimal, and percent now name one shading.\"}},{\"id\":\"quarter\",\"place\":\"The unlit quarter\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"The north quarter of the row is reserved glass. I need that share as a percent before the shipment moves.\"},{\"speaker\":\"sera\",\"text\":\"A quarter of a hundred is not a mystery, but the crate that is not a quarter still has to be converted, not guessed.\"}]},{\"id\":\"convert-fraction\",\"place\":\"The unlit quarter\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Convert the fraction into a percent by way of a hundred.\"}],\"challenge\":{\"id\":\"fraction-percent\",\"objective\":\"Convert a fraction to a percent.\",\"supported\":{\"prompt\":\"What percent of the row is the reserved quarter? Use 1/4 of 100.\",\"input\":{\"type\":\"number\",\"label\":\"Percent\",\"unit\":\"%\",\"model\":{\"op\":\"percent\",\"part\":1,\"whole\":4},\"hint\":\"1/4 = 25/100. The percent is 25, not 4 and not 0.25.\",\"traps\":[{\"value\":4,\"feedback\":\"4 is the denominator. A quarter of 100 percent is 25 percent.\",\"misconception\":\"denominator-as-percent\"},{\"value\":0.25,\"feedback\":\"0.25 is the decimal. The percent is 25, because percent already means hundredths.\",\"misconception\":\"decimal-left-as-percent\"}]}},\"independent\":{\"prompt\":\"Another crate is 7/20 glass. What percent is filled?\",\"input\":{\"type\":\"number\",\"label\":\"Percent\",\"unit\":\"%\",\"model\":{\"op\":\"percent\",\"part\":7,\"whole\":20},\"hint\":\"Multiply numerator and denominator by 5 to reach a denominator of 100. 35/100 is 35%.\",\"traps\":[{\"value\":7,\"feedback\":\"7 is the numerator, not a percent. The whole is 20, not 100.\",\"misconception\":\"numerator-as-percent\"},{\"value\":27,\"feedback\":\"7 + 20 is not a conversion. Scale 7/20 to hundredths.\",\"misconception\":\"added-terms\"},{\"value\":0.35,\"feedback\":\"0.35 is the decimal form. As a percent that amount is 35.\",\"misconception\":\"decimal-left-as-percent\"}]}},\"success\":{\"supported\":\"The reserved quarter is 25 percent. Twenty-five hooks get a quieter glass.\",\"independent\":\"Thirty-five percent. 7/20 has nowhere left to hide.\"},\"consequence\":\"The row can be described without the clerk's percents. The sale signs on the next awning are still waiting.\"}},{\"id\":\"sale-hook\",\"place\":\"Under the awning\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Twenty-five percent off, written larger than the price. I want an estimate before I believe the register.\"},{\"speaker\":\"inez\",\"text\":\"Estimate with a benchmark. Then make the register show its exact work.\"},{\"speaker\":\"narrator\",\"text\":\"Copper light lay in honest squares. The red sale cards swung as if they were sure.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Hundred Lanterns · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
