.\"},{\"speaker\":\"jules\",\"text\":\"Crew A never surprises you. Crew B has one disastrous start and one glorious finish. Rudd wants to hand B the cup because their best time is exciting.\",\"supported\":\"Range uses only the smallest and largest. IQR uses the middle half.\",\"vocab\":\"Range\"},{\"speaker\":\"mara\",\"text\":\"Exciting is not steady. The cup says steady.\"}],\"choices\":{\"prompt\":\"The ranges match. What do you inspect next?\",\"options\":[{\"id\":\"u2-consistency-a\",\"label\":\"The spread inside each list\",\"consequence\":\"You look past the range to how tightly the values sit.\",\"next\":\"u2-consistency-choice-a\"},{\"id\":\"u2-consistency-b\",\"label\":\"The typical value of each list\",\"consequence\":\"You compare centers before declaring the crews alike.\",\"next\":\"u2-consistency-choice-b\"}]}},{\"id\":\"u2-consistency-choice-a\",\"place\":\"Canal dock at dusk\",\"focus\":\"mara\",\"next\":\"range-task\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Inez lays both dot plots on one rail. Same range, different clustering.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u2-consistency-choice-b\",\"place\":\"Canal dock at dusk\",\"focus\":\"jules\",\"next\":\"range-task\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara asks which crew is typical, not which crew's extremes match.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"range-task\",\"place\":\"The two slates\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"Compute before you argue. Start with the full span of Crew A.\"}],\"challenge\":{\"id\":\"range-a\",\"objective\":\"Find the range of Crew A's times.\",\"supported\":{\"prompt\":\"Crew A's times are ordered. What is the range?\",\"visual\":{\"type\":\"data\",\"title\":\"Crew A, ordered\",\"values\":[4,5,6,7,8,9,10],\"sorted\":true,\"unit\":\"minutes\"},\"input\":{\"type\":\"summary\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:visual:values\",\"stats\":[\"range\"],\"hint\":\"Range is the greatest value minus the least value. Do not average them.\"}},\"independent\":{\"prompt\":\"Find the range for both crews. Enter Crew A, then Crew B.\",\"visual\":{\"type\":\"data\",\"title\":\"Crew B as rowed\",\"values\":[1,6,7,7,7,8,13],\"unit\":\"minutes\"},\"input\":{\"type\":\"fields\",\"hint\":\"Range is maximum minus minimum for each crew. One extreme time changes it completely.\",\"fields\":[{\"id\":\"a\",\"label\":\"Crew A range\",\"model\":{\"op\":\"range\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:visual:values\"},\"miss\":\"Crew A's range uses only its slowest and fastest times.\"},{\"id\":\"b\",\"label\":\"Crew B range\",\"model\":{\"op\":\"range\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:independent:visual:values\"},\"miss\":\"Crew B's range is pulled apart by a single very low time and a single very high time.\"}]}},\"success\":{\"supported\":\"Crew A's full span is short. That fact is true and still incomplete.\",\"independent\":\"B's range is much larger. Jules does not engrave the cup yet.\"},\"consequence\":\"The range is chalked on the dock, with a question mark beside it.\"}},{\"id\":\"middle-half\",\"place\":\"Beside the oar\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"If I throw out the drama at the ends, B's middle half is actually tight. IQR is Q3 minus Q1.\",\"supported\":\"IQR ignores the single worst and single best. It measures the middle half.\",\"vocab\":\"Interquartile range\"}]},{\"id\":\"iqr-task\",\"place\":\"The middle half\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"Same rule as the observatory. Odd lists. Median stays out of the halves.\"}],\"challenge\":{\"id\":\"iqr-a\",\"objective\":\"Find an interquartile range.\",\"supported\":{\"prompt\":\"What is the IQR of Crew A?\",\"visual\":{\"type\":\"data\",\"title\":\"Crew A, ordered\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:visual:values\",\"sorted\":true},\"input\":{\"type\":\"summary\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:visual:values\",\"stats\":[\"iqr\"],\"hint\":\"Find Q1 and Q3, then subtract Q1 from Q3. For these seven times, each half has three values.\"}},\"independent\":{\"prompt\":\"Compare the IQRs. Enter Crew A and Crew B.\",\"input\":{\"type\":\"fields\",\"hint\":\"Order each crew, exclude the median from both halves, then subtract Q1 from Q3.\",\"fields\":[{\"id\":\"a\",\"label\":\"Crew A IQR\",\"model\":{\"op\":\"iqr\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:visual:values\"},\"miss\":\"Crew A's IQR is Q3 minus Q1, not the range.\"},{\"id\":\"b\",\"label\":\"Crew B IQR\",\"model\":{\"op\":\"iqr\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:independent:visual:values\"},\"miss\":\"Crew B's extreme times are outside the middle half, so they do not belong in the IQR.\"}]}},\"success\":{\"supported\":\"The middle half of A is steady, and the chalk question mark gets heavier.\",\"independent\":\"B's middle half is tighter than A's. The range told the opposite story.\"},\"consequence\":\"Two spreads are now on the dock, and they disagree about the winner.\"}},{\"id\":\"decision\",\"place\":\"The cup\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"rudd\",\"text\":\"Give it to the crew with the exciting finish.\"},{\"speaker\":\"mara\",\"text\":\"The cup is for the crew whose middle half wobbles less. Read the measure that matches the prize.\"}]},{\"id\":\"award\",\"place\":\"The award\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Say which measure, and which crew.\"}],\"challenge\":{\"id\":\"who-is-consistent\",\"objective\":\"Choose IQR over range when extremes distort the comparison.\",\"supported\":{\"prompt\":\"Crew A has range 6 and IQR 4. Crew B has range 12 and IQR 2. Who is more consistent, and by which measure?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"b-iqr\",\"hint\":\"Consistency of the typical races lives in the middle half. A single wild race should not decide the cup.\",\"options\":[{\"id\":\"a-range\",\"label\":\"Crew A, because its range is smaller.\",\"feedback\":\"The smaller range is real, but one wild result at each end of B inflates that comparison. The prize is about the middle half.\",\"misconception\":\"range-always-best-spread\"},{\"id\":\"b-iqr\",\"label\":\"Crew B, because its IQR is smaller.\",\"correct\":true,\"feedback\":\"B's middle half spans only 2 minutes. The huge range comes from two extreme races, not from the crew's usual work.\"},{\"id\":\"tie\",\"label\":\"They are equally consistent because both medians are 7.\",\"feedback\":\"Equal medians say the centers match. Consistency is about spread, and the IQRs do not match.\",\"misconception\":\"center-used-as-spread\"}]}},\"independent\":{\"prompt\":\"A judge argues that range is 'more honest' because it uses every extreme. What is the strongest reply that still awards the cup correctly?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"reply\",\"hint\":\"Honesty includes saying which part of the data a measure uses. The cup's rule is about usual races, not the single most unusual ones.\",\"options\":[{\"id\":\"ignore\",\"label\":\"Ignore B's extreme times and also ignore the IQR, then guess.\",\"feedback\":\"Deleting data in secret is not a measure. IQR already tells you how the middle half behaves, without pretending the extremes never happened.\",\"misconception\":\"discard-without-a-measure\"},{\"id\":\"reply\",\"label\":\"Range is honest about the full span, and it says B was less stable at the extremes. IQR is the right award measure because the cup is about the middle half, which is tighter for B.\",\"correct\":true,\"feedback\":\"Both measures stay visible. The decision uses the one that matches the question.\"},{\"id\":\"mean\",\"label\":\"Award it by the mean. Spread is a distraction.\",\"feedback\":\"The mean is a center. The cup asked about consistency, which is spread.\",\"misconception\":\"center-used-as-spread\"}]}},\"success\":{\"supported\":\"The oar goes to Crew B, with both spreads written on the plaque so nobody can pretend the extremes vanished.\",\"independent\":\"Mara's reply keeps the range in the record and the IQR in the decision. Rudd gets a story with two true numbers.\"},\"consequence\":\"The cup is awarded on the interquartile range. The wild races remain in the log.\"}},{\"id\":\"supplies\",\"place\":\"The supply door\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"The survey cannot launch until a crate of 864 sample tubes is split into equal field kits.\"},{\"speaker\":\"jules\",\"text\":\"And the fuel log is in decimals. If either division is wrong, the middle of the data will never get collected.\"},{\"speaker\":\"narrator\",\"text\":\"The statistical argument paused at a locked crate. The next key was an algorithm.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Consistency Cup · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\
