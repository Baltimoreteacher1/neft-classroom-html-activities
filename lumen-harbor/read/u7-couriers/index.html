ats\":[{\"speaker\":\"narrator\",\"text\":\"The lock was the origin. East was positive x, north positive y. The depot sat 3 blocks west and 2 blocks north.\"},{\"speaker\":\"theo\",\"text\":\"That is (−3, 2), not (2, −3). The first number walks the horizontal street.\",\"supported\":\"x first, then y. Signs tell the quadrant.\"},{\"speaker\":\"jules\",\"text\":\"From the depot to the east gate at (4, 2) the street is horizontal. Distance is the absolute difference of the x-coordinates.\"}],\"choices\":{\"prompt\":\"Two couriers move on the same line. Whose position do you track?\",\"options\":[{\"id\":\"u7-couriers-a\",\"label\":\"The courier who started at zero\",\"consequence\":\"You use a start at the origin and add the change.\",\"next\":\"u7-couriers-choice-a\"},{\"id\":\"u7-couriers-b\",\"label\":\"The courier who started somewhere else\",\"consequence\":\"You add a signed change to a nonzero start.\",\"next\":\"u7-couriers-choice-b\"}]}},{\"id\":\"u7-couriers-choice-a\",\"place\":\"Chart table\",\"focus\":\"mara\",\"next\":\"plot\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Sera starts at zero and adds a signed change. End position is start plus change.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u7-couriers-choice-b\",\"place\":\"Chart table\",\"focus\":\"jules\",\"next\":\"plot\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara starts away from zero. A positive change can still leave you negative if you began below zero.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"plot\",\"place\":\"The city grid\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"Plot the depot.\"}],\"challenge\":{\"id\":\"plot-depot\",\"objective\":\"Plot an ordered pair with a negative x-coordinate and a positive y-coordinate.\",\"supported\":{\"prompt\":\"Plot the depot at x = −3, y = 2. You can click the grid or type the coordinates.\",\"visual\":{\"type\":\"coordinate\",\"xMin\":-6,\"xMax\":6,\"yMin\":-6,\"yMax\":6},\"input\":{\"type\":\"points\",\"targets\":[{\"x\":-3,\"y\":2}],\"audit\":{\"kind\":\"given\",\"reason\":\"The depot is defined as 3 west and 2 north of the origin, so the target is exactly (−3, 2).\"},\"hint\":\"Start at the origin. Move 3 units left, then 2 units up. Left is negative x.\"}},\"independent\":{\"prompt\":\"A second drop is 4.5 blocks east and 3.5 blocks south. Plot that point.\",\"visual\":{\"type\":\"coordinate\",\"xMin\":-6,\"xMax\":6,\"yMin\":-6,\"yMax\":6},\"input\":{\"type\":\"points\",\"targets\":[{\"x\":4.5,\"y\":-3.5}],\"audit\":{\"kind\":\"given\",\"reason\":\"East is positive x and south is negative y, so the drop is (4.5, −3.5).\"},\"hint\":\"Positive x is right. Negative y is down. Do not swap the coordinates to (−3.5, 4.5).\"}},\"success\":{\"supported\":\"The depot sits in quadrant II. West and north, in that written order.\",\"independent\":\"Quadrant IV takes the second drop. The decimals land between the grid lines, not on a rounded excuse.\"},\"consequence\":\"The parcels have coordinates.\"}},{\"id\":\"horizontal\",\"place\":\"The east street\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Same y-coordinate means a horizontal street. Subtract the x-coordinates and keep the distance positive.\"}]},{\"id\":\"distance-h\",\"place\":\"The east street\",\"focus\":\"jules\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"How far is (−3, 2) from (4, 2)?\"}],\"challenge\":{\"id\":\"horizontal-distance\",\"objective\":\"Find a horizontal distance from coordinates.\",\"supported\":{\"prompt\":\"What is the distance from (−3, 2) to (4, 2)?\",\"visual\":{\"type\":\"coordinate\",\"xMin\":-6,\"xMax\":6,\"yMin\":-6,\"yMax\":6,\"points\":[{\"x\":-3,\"y\":2,\"label\":\"depot\"},{\"x\":4,\"y\":2,\"label\":\"gate\"}]},\"input\":{\"type\":\"number\",\"label\":\"Blocks\",\"model\":{\"op\":\"gridDistance\",\"x1\":-3,\"y1\":2,\"x2\":4,\"y2\":2},\"hint\":\"The y-coordinates match. Distance is |4 − (−3)| = 7. A negative answer is a direction, not a distance.\",\"traps\":[{\"value\":1,\"feedback\":\"4 − 3 forgets that −3 is already negative. 4 − (−3) is 4 + 3.\",\"misconception\":\"sign-error-in-difference\"},{\"value\":-7,\"feedback\":\"Distance on the street is not negative.\",\"misconception\":\"negative-distance\"}]}},\"independent\":{\"prompt\":\"A courier goes from (−4.5, −1) to (2.5, −1). What is the distance?\",\"input\":{\"type\":\"number\",\"label\":\"Blocks\",\"model\":{\"op\":\"gridDistance\",\"x1\":-4.5,\"y1\":-1,\"x2\":2.5,\"y2\":-1},\"hint\":\"|2.5 − (−4.5)| = 7. The shared y-coordinate is −1, so the street is horizontal and below the x-axis.\",\"traps\":[{\"value\":2,\"feedback\":\"2.5 − 4.5 ignores the sign on −4.5.\",\"misconception\":\"sign-error-in-difference\"},{\"value\":3.5,\"feedback\":\"That subtracts the absolute values in the wrong way. Add the distances to zero if the points are on opposite sides of the y-axis.\",\"misconception\":\"subtracted-absolute-values\"}]}},\"success\":{\"supported\":\"Seven blocks along the horizontal street. The courier does not cut through buildings.\",\"independent\":\"Seven blocks again, this time below the axis. Opposite sides of zero add when you want distance.\"},\"consequence\":\"Horizontal distance is on the delivery slip.\"}},{\"id\":\"vertical\",\"place\":\"The south stair\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"From the east gate (4, 2) down to the quay (4, −3), the x-coordinate stays put. The distance is vertical.\"}]},{\"id\":\"distance-v\",\"place\":\"The south stair\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"How many blocks down the stair?\"}],\"challenge\":{\"id\":\"vertical-distance\",\"objective\":\"Find a vertical distance from coordinates.\",\"supported\":{\"prompt\":\"What is the distance from (4, 2) to (4, −3)?\",\"input\":{\"type\":\"number\",\"label\":\"Blocks\",\"model\":{\"op\":\"gridDistance\",\"x1\":4,\"y1\":2,\"x2\":4,\"y2\":-3},\"hint\":\"|2 − (−3)| = 5. Same x-coordinate, so only y changes.\",\"traps\":[{\"value\":1,\"feedback\":\"2 − 3 without the sign on −3 gives the wrong difference.\",\"misconception\":\"sign-error-in-difference\"},{\"value\":-5,\"feedback\":\"The stair goes down, and the distance is still 5 blocks.\",\"misconception\":\"negative-distance\"}]}},\"independent\":{\"prompt\":\"Which statement about (4, 2) and (4, −3) is true?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"vertical\",\"hint\":\"Equal x-coordinates mean a vertical segment. Distance is the positive difference of the y-coordinates.\",\"options\":[{\"id\":\"diagonal\",\"label\":\"The distance is the diagonal of a 4 by 5 rectangle, so we need a new formula.\",\"feedback\":\"The points share an x-coordinate. The path is vertical, length 5. There is no horizontal leg in this segment.\",\"misconception\":\"invented-diagonal\"},{\"id\":\"vertical\",\"label\":\"The segment is vertical and its distance is 5.\",\"correct\":true,\"feedback\":\"Same x, different y. |2 − (−3)| = 5.\"},{\"id\":\"same\",\"label\":\"The distance is 0 because both points contain a 4.\",\"feedback\":\"Sharing one coordinate does not put the points in the same place.\",\"misconception\":\"shared-coordinate-as-same-point\"}]}},\"success\":{\"supported\":\"Five blocks down. The quay is reached without inventing a diagonal shortcut.\",\"independent\":\"Vertical, length 5. The grid's distance stays the distance the streets allow.\"},\"consequence\":\"Couriers can plot and measure. The park design asks for a whole polygon, not one parcel.\"}},{\"id\":\"park-hook\",\"place\":\"The park gate\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Four corners. If one is in the wrong quadrant, the park changes shape and the area changes with it.\"},{\"speaker\":\"mara\",\"text\":\"We prove the side lengths from the coordinates before anyone plants a tree.\"},{\"speaker\":\"narrator\",\"text\":\"A courier's bell faded downhill. The park waited as four points and a rumor.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Couriers of the Four Quadrants · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
