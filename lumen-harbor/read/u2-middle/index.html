had a middle the astronomers trusted.\"},{\"speaker\":\"theo\",\"text\":\"Seven clarity scores. If I grab the fourth number before I order them, I am reading the page, not the sky.\",\"supported\":\"Order the numbers first. The median is the middle of the ordered list.\",\"vocab\":\"Median\"},{\"speaker\":\"sera\",\"text\":\"Rudd already told them the middle was 8 because 8 was written in the middle of the notebook.\"}],\"choices\":{\"prompt\":\"Two summaries are on the table. Which one do you carry into the hearing?\",\"options\":[{\"id\":\"u2-middle-a\",\"label\":\"Carry the median\",\"consequence\":\"The middle boat becomes the number you defend.\",\"next\":\"u2-middle-choice-a\"},{\"id\":\"u2-middle-b\",\"label\":\"Carry the mean, and say what pulled it\",\"consequence\":\"You use the balance point and name the extreme.\",\"next\":\"u2-middle-choice-b\"}]}},{\"id\":\"u2-middle-choice-a\",\"place\":\"Observatory stair\",\"focus\":\"mara\",\"next\":\"find-median\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Sera circles the middle value. A single overloaded skiff can no longer drag the story.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u2-middle-choice-b\",\"place\":\"Observatory stair\",\"focus\":\"jules\",\"next\":\"find-median\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Theo keeps the mean and writes the extreme beside it, so the pull is visible.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"find-median\",\"place\":\"The night log\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Seven values. One middle. Make the page earn it.\"}],\"challenge\":{\"id\":\"clarity-median\",\"objective\":\"Find the median from seven clarity scores.\",\"supported\":{\"prompt\":\"The scores are ordered from least to greatest. What is the median?\",\"visual\":{\"type\":\"data\",\"title\":\"Clarity, ordered\",\"values\":[4,5,6,7,8,9,10],\"sorted\":true},\"input\":{\"type\":\"summary\",\"values\":[4,8,6,10,7,5,9],\"stats\":[\"median\"],\"hint\":\"For seven ordered values, the median is the fourth one. Cross off pairs from the ends until one value remains.\"}},\"independent\":{\"prompt\":\"The notebook order is the order they were written, not the order of the sky. Find the median.\",\"visual\":{\"type\":\"data\",\"title\":\"Clarity, as written\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:input:values\"},\"input\":{\"type\":\"summary\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:input:values\",\"stats\":[\"median\"],\"hint\":\"Sort least to greatest. With an odd count, the median is the center value, not the mean and not the middle of the page.\"}},\"success\":{\"supported\":\"The fourth ordered score is the middle of the week. The notebook's lucky 8 was only lucky on the page.\",\"independent\":\"Theo orders the log. The center value is not the number Rudd saw in the center of the handwriting.\"},\"consequence\":\"The dome's lock accepts a median and ignores the unordered page.\"}},{\"id\":\"quarters\",\"place\":\"Under the slit\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"A box plot needs five numbers. For an odd list, the median sits in the line and stays out of both halves.\",\"supported\":\"Do not put the median into Q1 or Q3. Find the middle of each half.\",\"vocab\":\"Quartile\"},{\"speaker\":\"inez\",\"text\":\"The box is the middle half of the nights, not the whole story. The whiskers admit the ends.\"}]},{\"id\":\"five-number\",\"place\":\"The brass plate\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"Engrave only what you can point to in the ordered list.\"}],\"challenge\":{\"id\":\"five-summary\",\"objective\":\"Report the five-number summary using medians of the halves.\",\"supported\":{\"prompt\":\"From the ordered scores, enter the minimum, Q1, median, Q3, and maximum. The median is not part of either half.\",\"visual\":{\"type\":\"data\",\"title\":\"Ordered clarity\",\"values\":[4,5,6,7,8,9,10],\"sorted\":true},\"input\":{\"type\":\"summary\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:input:values\",\"stats\":[\"min\",\"q1\",\"median\",\"q3\",\"max\"],\"hint\":\"Ordered, the lower half is the first three values and the upper half is the last three. Q1 and Q3 are the middles of those halves.\"}},\"independent\":{\"prompt\":\"Build the five-number summary from the raw log. Halves exclude the overall median.\",\"visual\":{\"type\":\"data\",\"title\":\"Clarity log\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:input:values\"},\"input\":{\"type\":\"summary\",\"values\":\"$5:1:props:children:props:chapter:scenes:3:challenge:supported:input:values\",\"stats\":[\"min\",\"q1\",\"median\",\"q3\",\"max\"],\"hint\":\"Sort, locate the median, then find the median of each remaining half. Minimum and maximum are the ends, even if they look lonely.\"}},\"success\":{\"supported\":\"The plate shows a box from Q1 to Q3 with a median line, and whiskers to the true ends.\",\"independent\":\"Five numbers, each defensible. The dome's gears take the plate and turn.\"},\"consequence\":\"A box plot replaces the single circled 8 on the observatory door.\"}},{\"id\":\"read-box\",\"place\":\"The open dome\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"rudd\",\"text\":\"So the box is the good nights?\"},{\"speaker\":\"inez\",\"text\":\"The box is the middle half. Good is a decision we have not made.\"}]},{\"id\":\"box-claim\",\"place\":\"The slit of sky\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"He will try one more sentence. Stop the one the plot cannot hold.\"}],\"challenge\":{\"id\":\"box-reading\",\"objective\":\"Interpret a five-number summary without adding a new claim.\",\"supported\":{\"prompt\":\"Minimum 4, Q1 5, median 7, Q3 9, maximum 10. Which sentence is faithful?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"half\",\"hint\":\"The box runs from Q1 to Q3. That interval contains about the middle half of the data, not everything and not only the median.\",\"options\":[{\"id\":\"all\",\"label\":\"Every night scored between 5 and 9.\",\"feedback\":\"The whiskers reach 4 and 10. Values outside the box still happened.\",\"misconception\":\"box-is-entire-range\"},{\"id\":\"half\",\"label\":\"About the middle half of the nights scored from 5 through 9, and the median was 7.\",\"correct\":true,\"feedback\":\"Q1 to Q3 marks the middle half, and the median is the line inside the box.\"},{\"id\":\"mean\",\"label\":\"The mean clarity was 7.\",\"feedback\":\"This summary does not report the mean. The median can equal 7 while the mean is something else.\",\"misconception\":\"median-called-mean\"}]}},\"independent\":{\"prompt\":\"An editor wants a caption. Which caption respects both the box and the whiskers?\",\"input\":{\"type\":\"choice\",\"auditCorrectId\":\"spread\",\"hint\":\"Name the middle half and the full extent separately. Do not turn a quartile into a rule about safety.\",\"options\":[{\"id\":\"spread\",\"label\":\"The middle half lies from 5 to 9. The full span is 4 to 10, so the nights are tightly grouped.\",\"correct\":true,\"feedback\":\"The box and the whiskers are both in the sentence, and the short whiskers support the description of a tight group.\"},{\"id\":\"typical\",\"label\":\"A typical night was exactly 9, because Q3 is the typical high.\",\"feedback\":\"Q3 is the top of the middle half, not a synonym for typical. The median is the center marker in this summary.\",\"misconception\":\"quartile-as-typical\"},{\"id\":\"empty\",\"label\":\"No night scored above the median.\",\"feedback\":\"Half the nights are at or above the median. Q3 and the maximum both sit above it.\",\"misconception\":\"median-as-maximum\"}]}},\"success\":{\"supported\":\"The caption names the middle half and stops. The dome stays open.\",\"independent\":\"Whiskers and box share the caption. Nobody promotes a quartile into a myth.\"},\"consequence\":\"The observatory publishes a box plot instead of a single circled score.\"}},{\"id\":\"next-spread\",\"place\":\"The cliff path\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"Two rowing crews sent logs that look similar in the middle and wild at the ends.\"},{\"speaker\":\"jules\",\"text\":\"Then the next argument is not the middle. It is how spread out a crew is allowed to be.\"},{\"speaker\":\"narrator\",\"text\":\"Below them, lanterns along the canal flickered in two uneven rhythms.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Middle of the Record · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
