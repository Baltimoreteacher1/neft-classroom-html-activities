xt\":\"Rope was coiled in feet. The trail notes were in yards. Nobody had written the 3.\"},{\"speaker\":\"theo\",\"text\":\"Three feet in a yard is a ratio of equals. I multiply or divide according to which unit is larger.\",\"supported\":\"A yard is longer, so fewer yards than feet.\"},{\"speaker\":\"inez\",\"text\":\"When we cross into centimeters, the factor is 2.54 centimeters to 1 inch. We say so.\"}],\"choices\":{\"prompt\":\"The trail rate is steady. What do you solve for?\",\"options\":[{\"id\":\"u3-expedition-a\",\"label\":\"How far a longer walk goes\",\"consequence\":\"You keep the rate and scale the distance.\",\"next\":\"u3-expedition-choice-a\"},{\"id\":\"u3-expedition-b\",\"label\":\"How long a farther landmark takes\",\"consequence\":\"You keep the rate and scale the time.\",\"next\":\"u3-expedition-choice-b\"}]}},{\"id\":\"u3-expedition-choice-a\",\"place\":\"Outfitter's counter\",\"focus\":\"mara\",\"next\":\"within-customary\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Jules holds the rate and stretches the time. Distance has to grow in the same ratio.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"u3-expedition-choice-b\",\"place\":\"Outfitter's counter\",\"focus\":\"jules\",\"next\":\"within-customary\",\"beats\":[{\"speaker\":\"narrator\",\"text\":\"Mara holds the rate and asks for time. A farther cairn is not a faster pace.\"},{\"speaker\":\"inez\",\"text\":\"The mathematics ahead is the same either way. The path you picked changes the scene, not the standard.\",\"supported\":\"Same math either way. This choice changes the scene.\"}]},{\"id\":\"within-customary\",\"place\":\"The rope coil\",\"focus\":\"theo\",\"beats\":[{\"speaker\":\"jules\",\"text\":\"Change the units without changing the rope.\"}],\"challenge\":{\"id\":\"feet-to-inches\",\"objective\":\"Convert a length within the customary system.\",\"supported\":{\"prompt\":\"The spare coil is 6 feet. How many inches is that? Use 12 inches = 1 foot.\",\"input\":{\"type\":\"number\",\"label\":\"Inches\",\"model\":{\"op\":\"scale\",\"value\":6,\"factor\":12},\"hint\":\"Inches are smaller, so the number gets larger. Multiply 6 by 12.\",\"traps\":[{\"value\":0.5,\"feedback\":\"That divides by 12, which would turn feet into a fraction of a foot, not into inches.\",\"misconception\":\"divided-into-smaller-unit\"},{\"value\":18,\"feedback\":\"18 would be 6 yards if you used 3 the wrong direction, or 6 × 3. The factor here is 12 inches per foot.\",\"misconception\":\"wrong-factor\"}]}},\"independent\":{\"prompt\":\"A tow line is 2.5 yards. How many inches is it? Use 3 feet = 1 yard and 12 inches = 1 foot.\",\"input\":{\"type\":\"number\",\"label\":\"Inches\",\"model\":{\"op\":\"scale\",\"value\":2.5,\"factor\":36},\"hint\":\"One yard is 36 inches. Multiply 2.5 by 36. Dividing would make the number smaller while the unit gets smaller, which cannot be right.\",\"traps\":[{\"value\":7.5,\"feedback\":\"2.5 × 3 = 7.5 feet, not inches. The question asks for inches.\",\"misconception\":\"stopped-mid-conversion\"},{\"value\":30,\"feedback\":\"2.5 × 12 skips the yards-to-feet relationship and treats yards as feet.\",\"misconception\":\"wrong-factor\"}]}},\"success\":{\"supported\":\"Seventy-two inches of the same rope. The coil did not grow.\",\"independent\":\"Ninety inches. Theo writes 2.5 yards = 7.5 feet = 90 inches so the path stays visible.\"},\"consequence\":\"The customary coil has one length and two honest names.\"}},{\"id\":\"metric\",\"place\":\"The metric trunk\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"sera\",\"text\":\"Metric conversions move by 10, 100, or 1,000. The zeros are the ratio, not decoration.\",\"supported\":\"100 centimeters make a meter. Multiply when you split a meter into centimeters.\"}]},{\"id\":\"within-metric\",\"place\":\"The metric trunk\",\"focus\":\"sera\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"The sounding line is marked in meters. The log wants centimeters.\"}],\"challenge\":{\"id\":\"meters-to-cm\",\"objective\":\"Convert a length within the metric system.\",\"supported\":{\"prompt\":\"The line is 3.5 meters. How many centimeters? Use 100 centimeters = 1 meter.\",\"input\":{\"type\":\"number\",\"label\":\"Centimeters\",\"model\":{\"op\":\"scale\",\"value\":3.5,\"factor\":100},\"hint\":\"Multiply by 100. The digits 3 and 5 shift two places, and the zeros are the factor.\",\"traps\":[{\"value\":35,\"feedback\":\"35 would be 3.5 × 10, a conversion to decimeters, not centimeters.\",\"misconception\":\"wrong-power-of-ten\"},{\"value\":0.035,\"feedback\":\"Dividing by 100 turns centimeters into meters. You already have meters.\",\"misconception\":\"divided-into-smaller-unit\"}]}},\"independent\":{\"prompt\":\"A ridge trail is 1.2 kilometers. How many meters? Then how many centimeters is that same length? Enter meters first.\",\"input\":{\"type\":\"fields\",\"hint\":\"1 kilometer = 1,000 meters, and 1 meter = 100 centimeters. Apply the factors in order.\",\"fields\":[{\"id\":\"m\",\"label\":\"Meters\",\"model\":{\"op\":\"scale\",\"value\":1.2,\"factor\":1000},\"miss\":\"Multiply 1.2 by 1,000.\"},{\"id\":\"cm\",\"label\":\"Centimeters\",\"model\":{\"op\":\"scale\",\"value\":1.2,\"factor\":100000},\"miss\":\"1.2 kilometers is 1,200 meters, and each meter is 100 centimeters.\"}]}},\"success\":{\"supported\":\"350 centimeters. The sounding line is the same line.\",\"independent\":\"1,200 meters, which is 120,000 centimeters. The zeros are accounted for.\"},\"consequence\":\"The metric trunk matches the log.\"}},{\"id\":\"border\",\"place\":\"The border stamp\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"inez\",\"text\":\"Between systems I will not pretend the factor is obvious. The archive uses 1 inch = 2.54 centimeters.\"},{\"speaker\":\"rudd\",\"text\":\"Just move the dot.\"}]},{\"id\":\"between\",\"place\":\"The border stamp\",\"focus\":\"inez\",\"beats\":[{\"speaker\":\"theo\",\"text\":\"Use the stated factor. Write it where a traveler can see it.\"}],\"challenge\":{\"id\":\"inches-to-cm\",\"objective\":\"Convert between measurement systems with a given factor.\",\"supported\":{\"prompt\":\"A buckle is 5 inches wide. Using 1 inch = 2.54 centimeters, how many centimeters is it?\",\"input\":{\"type\":\"number\",\"label\":\"Centimeters\",\"model\":{\"op\":\"scale\",\"value\":5,\"factor\":2.54},\"hint\":\"Multiply 5 by 2.54. This factor is exact in our archive, and it has to stay visible.\",\"traps\":[{\"value\":5,\"feedback\":\"5 inches is not 5 centimeters. The units are different.\",\"misconception\":\"ignored-factor\"},{\"value\":2.54,\"feedback\":\"2.54 is the length of one inch in centimeters, not of five inches.\",\"misconception\":\"factor-as-answer\"}]}},\"independent\":{\"prompt\":\"A chart width is 8 inches. Using 1 inch = 2.54 centimeters, how many centimeters wide is the chart?\",\"input\":{\"type\":\"number\",\"label\":\"Centimeters\",\"model\":{\"op\":\"scale\",\"value\":8,\"factor\":2.54},\"hint\":\"Multiply 8 by 2.54. The factor stays visible in the work even though the answer is a single length.\",\"traps\":[{\"value\":8,\"feedback\":\"8 inches is not 8 centimeters.\",\"misconception\":\"ignored-factor\"},{\"value\":2.54,\"feedback\":\"2.54 centimeters is one inch, not eight.\",\"misconception\":\"factor-as-answer\"}]}},\"success\":{\"supported\":\"12.7 centimeters. The buckle did not change. The name of the length did.\",\"independent\":\"20.32 centimeters, stamped beside the factor 2.54. A later reader can audit the crossing.\"},\"consequence\":\"The border stamp shows the measurement and the factor that produced it.\"}},{\"id\":\"shops\",\"place\":\"The market stairs\",\"focus\":\"mara\",\"beats\":[{\"speaker\":\"mara\",\"text\":\"The outfitter also left a buying decision: jars for the night desk, two prices, and a limit on how many we can store.\"},{\"speaker\":\"sera\",\"text\":\"A cheaper unit rate is not always the purchase. Sometimes you cannot use the extra.\"},{\"speaker\":\"narrator\",\"text\":\"They carried one length with three names down toward a street that sold everything in bundles.\"}]}]}}]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"World Expedition Outfitters · Lumen Harbor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive Grade 6 graphic novels for EduWonderLab Units 2 through 9. Two reading pathways, no account required.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/lumen-harbor/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L11\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
