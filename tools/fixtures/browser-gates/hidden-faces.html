<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixture</title>
<style>
body{margin:0;font-family:Nunito,sans-serif;font-size:16px;color:#1a2733;background:#fff}
main{padding:16px}
.flip{perspective:600px;width:240px;height:60px}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden}
.back{transform:rotateY(180deg);background:#12355b;color:#8a5a00}
</style>
</head>
<body>
<main>
<h1>Things nobody can see</h1>
<p>Pale text inside a closed details and on the far face of a card must not be judged.</p>
<div class="flip"><div class="inner"><div class="face front">Front face, readable</div><div class="face back">Far face, pale on navy</div></div></div>
<details><summary>Open me</summary><p style="color:#cccccc">Pale text in a closed details</p></details>
</main>
</body>
</html>
