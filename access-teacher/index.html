<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACCESS Practice Lab — Teacher Hub</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/access-practice-lab/styles.css?v=2026.10.01" />
    <style>
      .hub-filters {
        display: grid;
        grid-template-columns: 2fr repeat(3, 1fr);
        gap: 0.6rem;
        margin: 0.75rem 0;
      }
      .hub-filters input,
      .hub-filters select,
      .pl-title {
        min-height: 2.8rem;
        padding: 0.5rem 0.75rem;
        border-radius: 10px;
        border: 1.5px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        font: 500 1rem var(--font);
      }
      .hub-table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
      }
      .hub-table th,
      .hub-table td {
        text-align: left;
        padding: 0.5rem 0.6rem;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .hub-table th {
        font-size: 0.85rem;
        color: var(--ink-2);
      }
      .hub-table .t-title a {
        font-weight: 700;
      }
      .hub-table .t-meta {
        color: var(--ink-2);
        font-size: 0.88rem;
      }
      .key-row td {
        background: var(--surface-2);
        font-size: 0.95rem;
      }
      .key-row p {
        margin: 0.25rem 0;
      }
      .pl-bar {
        position: sticky;
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        padding: 0.75rem 1rem;
        border-radius: 14px 14px 0 0;
        background: var(--ink);
        color: var(--bg);
        z-index: 5;
      }
      .pl-bar .pl-title {
        flex: 1;
        min-width: 12rem;
      }
      .hub-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 0.6rem;
      }
      .hub-card {
        display: grid;
        gap: 0.3rem;
        padding: 0.9rem;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .hub-card h3 {
        font-size: 1rem;
        margin: 0;
      }
      .hub-card a {
        font-weight: 600;
      }
      @media (max-width: 760px) {
        .hub-filters {
          grid-template-columns: 1fr 1fr;
        }
        .hub-table .col-skill {
          display: none;
        }
      }
    </style>
    <!-- mobile-access-injected:begin (shared mobile a11y — tools/inject-mobile-access.js) -->
    <link rel="stylesheet" href="/assets/mobile-access.css" />
    <!-- mobile-access-injected:end -->
  </head>
  <body>
    <header class="lab-top">
      <a class="lab-brand" href="/access-teacher/"
        ><span class="lab-logo" aria-hidden="true">A</span><span>ACCESS Lab · Teacher Hub</span></a
      >
      <nav class="lab-tools" aria-label="Teacher tools">
        <a class="top-link" href="/access-practice-lab/">Student lab ↗</a>
      </nav>
    </header>
    <main id="hub" class="lab-main" tabindex="-1">
      <div class="boot" role="status">
        <span class="boot-dot" aria-hidden="true"></span> Loading…
      </div>
    </main>
    <div id="labToast" class="toast" hidden></div>
    <div id="labLive" class="visually-hidden" aria-live="polite"></div>
    <script type="module" src="/access-teacher/teacher.js?v=2026.10.01"></script>
    <script src="/assets/nt-usage.js" data-nt-usage="1" defer></script>
    <script src="/assets/math-workbench-launcher.js" defer></script>
    <script src="/assets/formula-popup.js" defer></script>
    <!-- nt-chrome-injected:begin (shared page chrome — tools/inject-nt-chrome.js) -->
    <script src="/assets/nt-chrome.js" defer></script>
    <!-- nt-chrome-injected:end -->
  </body>
</html>
