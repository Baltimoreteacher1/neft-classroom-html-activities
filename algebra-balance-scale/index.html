<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/math-mobile.css" />
    <meta
      name="description"
      content="Balance Builder: solve equations and inequalities on a balance scale by doing the same inverse operation to both sides. You type every number. Build your own puzzles and share them with a short code. English and Spanish."
    />
    <title>Balance Builder | Algebra Balance Scale</title>
    <link href="/assets/fonts/outfit-plus-jakarta-sans-f764d6.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/game-studio.css?v=20261002" />
    <link rel="stylesheet" href="balance.css" />
    <!-- mobile-access-injected:begin (shared mobile a11y — tools/inject-mobile-access.js) -->
    <link rel="stylesheet" href="/assets/mobile-access.css" />
    <!-- mobile-access-injected:end -->

    <!-- uifr-injected:begin -->
    <!-- BCPS Instructional Framework Rubric · TEACH support. Teacher/observer reference — NOT shown to students. Interactive practice activity (algebra-balance-scale): supports Level 4 conditions on T2, T4 (students choose their approach + immediate no-fail feedback with retry). Full evidence: /teacher-tools/teaching-evidence/ · docs/uifr-teach-l4.md. -->
    <!-- uifr-injected:end -->
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
    <link rel="stylesheet" href="/shared/save-resume/save-resume-styles.css?v=20260714-v2" />
    <!-- nsr-injected:end -->
  </head>
  <body>
    <a class="bb-skip" href="#bb-main" id="bb-skip">Skip to the puzzle</a>
    <main id="bb-main" class="bb" tabindex="-1">
      <header class="bb-head">
        <div>
          <h1 id="bb-title">Balance Builder</h1>
          <p class="bb-tagline" id="bb-tagline">
            Do the same thing to both sides. You write every number.
          </p>
        </div>
        <button type="button" id="bb-lang" class="bb-btn bb-ghost" lang="es">Español</button>
      </header>

      <div class="bb-levels" id="bb-levels" role="group" aria-label="Choose a level"></div>

      <section id="bb-play" aria-labelledby="bb-puzzle-title">
        <div class="bb-status">
          <h2 id="bb-puzzle-title"></h2>
          <p id="bb-rating" class="bb-pill"></p>
          <p id="bb-progress" class="bb-progress"></p>
        </div>

        <div class="bb-stage">
          <figure class="bb-scale" id="bb-scale" role="img"></figure>
          <p class="bb-eq" id="bb-eq"></p>
          <div class="bb-history-wrap">
            <h3 id="bb-history-title">Your moves</h3>
            <ol id="bb-history" class="bb-history" aria-labelledby="bb-history-title"></ol>
          </div>
        </div>

        <div class="bb-controls">
          <form id="bb-move" class="bb-card" novalidate>
            <h3 id="bb-move-h"></h3>
            <div class="bb-ops" id="bb-ops" role="radiogroup" aria-labelledby="bb-move-h"></div>
            <label for="bb-amount"
              ><span id="bb-amount-l"></span>
              <input
                id="bb-amount"
                type="text"
                inputmode="text"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                maxlength="12"
                data-nsr-ignore
                aria-describedby="bb-amount-help"
            /></label>
            <p class="bb-help" id="bb-amount-help"></p>
            <button type="submit" id="bb-apply" class="bb-btn bb-primary"></button>
          </form>

          <form id="bb-entry" class="bb-card" hidden novalidate>
            <h3 id="bb-entry-h"></h3>
            <p class="bb-help" id="bb-entry-help"></p>
            <p class="bb-working" id="bb-working"></p>
            <div class="bb-entry-row">
              <label for="bb-left"
                ><span id="bb-left-l"></span>
                <input
                  id="bb-left"
                  type="text"
                  inputmode="text"
                  autocomplete="off"
                  autocapitalize="off"
                  spellcheck="false"
                  maxlength="40"
                  data-nsr-ignore
              /></label>
              <fieldset class="bb-rel" id="bb-rel" hidden>
                <legend id="bb-rel-l"></legend>
                <div id="bb-rel-options" role="radiogroup" aria-labelledby="bb-rel-l"></div>
              </fieldset>
              <label for="bb-right"
                ><span id="bb-right-l"></span>
                <input
                  id="bb-right"
                  type="text"
                  inputmode="text"
                  autocomplete="off"
                  autocapitalize="off"
                  spellcheck="false"
                  maxlength="40"
                  data-nsr-ignore
              /></label>
            </div>
            <button type="submit" id="bb-check" class="bb-btn bb-primary"></button>
          </form>

          <div id="bb-solved" class="bb-card" hidden>
            <p id="bb-solved-msg" class="bb-ok"></p>
            <form id="bb-graph" hidden novalidate>
              <h3 id="bb-graph-h"></h3>
              <div id="bb-numline" class="bb-numline"></div>
              <fieldset>
                <legend id="bb-circle-l"></legend>
                <div id="bb-circle" role="radiogroup" aria-labelledby="bb-circle-l"></div>
              </fieldset>
              <fieldset>
                <legend id="bb-dir-l"></legend>
                <div id="bb-dir" role="radiogroup" aria-labelledby="bb-dir-l"></div>
              </fieldset>
              <button type="submit" id="bb-graph-check" class="bb-btn bb-primary"></button>
            </form>
            <form id="bb-prove" hidden novalidate>
              <h3 id="bb-prove-h"></h3>
              <p class="bb-help" id="bb-prove-help"></p>
              <div class="bb-entry-row">
                <label for="bb-prove-l"
                  ><span id="bb-prove-ll"></span
                  ><input
                    id="bb-prove-l"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    maxlength="12"
                    data-nsr-ignore
                /></label>
                <label for="bb-prove-r"
                  ><span id="bb-prove-rl"></span
                  ><input
                    id="bb-prove-r"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    maxlength="12"
                    data-nsr-ignore
                /></label>
              </div>
              <button type="submit" id="bb-prove-check" class="bb-btn"></button>
            </form>
            <div class="bb-row">
              <button type="button" id="bb-save" class="bb-btn bb-primary" hidden></button>
              <button type="button" id="bb-next" class="bb-btn bb-primary"></button>
            </div>
          </div>

          <form id="bb-test" class="bb-card" hidden novalidate>
            <h3 id="bb-test-h"></h3>
            <p class="bb-help" id="bb-test-help"></p>
            <label for="bb-test-n"
              ><span class="bb-sr" id="bb-test-nl"></span>
              <input
                id="bb-test-n"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                maxlength="6"
                data-nsr-ignore
            /></label>
            <button type="submit" id="bb-test-go" class="bb-btn"></button>
          </form>

          <div class="bb-tools">
            <button type="button" id="bb-hint" class="bb-btn"></button>
            <button type="button" id="bb-undo" class="bb-btn"></button>
            <button type="button" id="bb-reset" class="bb-btn"></button>
          </div>

          <div
            id="bb-feedback"
            class="bb-feedback"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          >
            <p id="bb-chip" class="bb-chip-tag" hidden></p>
            <p id="bb-coach" class="bb-coach"></p>
            <p id="bb-hint-text" class="bb-hint-text"></p>
          </div>
        </div>
      </section>

      <section id="bb-build" hidden></section>
      <div id="bb-live" class="bb-sr" role="status" aria-live="polite"></div>
    </main>

    <script src="/assets/nt-signal.js" defer></script>
    <script src="/assets/game-score.js" defer></script>
    <!-- mwb-injected:begin (Math Workbench launcher — tools/inject-math-workbench.js) -->

    <!-- mwb-injected:end -->
    <!-- canvas-bridge-injected:begin (Canvas grade bridge — tools/inject-canvas-bridge.js) -->
    <script src="/assets/canvas-bridge.js" defer></script>
    <!-- canvas-bridge-injected:end -->
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
    <script src="/shared/save-resume/save-resume-engine.js?v=20260714-v2" defer></script>
    <!-- nsr-injected:end -->
    <!-- Module scripts run in document order with the deferred ones: this must come after the
         save/resume engine so its state provider is registered before the engine restores. -->
    <script type="module" src="game.js"></script>
    <script src="/assets/math-workbench-launcher.js" defer></script>
    <script src="/assets/formula-popup.js" defer></script>
    <script src="/assets/game-studio.js?v=20261016" defer></script>
    <!-- nt-chrome-injected:begin (shared page chrome — tools/inject-nt-chrome.js) -->
    <script src="/assets/nt-chrome.js" defer></script>
    <!-- nt-chrome-injected:end -->
  </body>
</html>
