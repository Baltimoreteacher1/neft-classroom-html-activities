      // --- GAME ---
      class GameScene extends Phaser.Scene {
        constructor() {
          super("Game");
        }
        create() {
          sfx.init();
          this.questions = seasonQuestions();
          this.freshSeason = this.questions.some((q) => q.fresh);
          const studioTier = this.sys.settings.data?.studioTier || 2;
          if (studioTier !== 2) {
            const chosenTier = studioTier === 1 ? 1 : Math.max(...this.questions.map(q => q.tier));
            this.questions = this.questions.filter(q => q.tier === chosenTier);
          }
          this.qIndex = 0;
          this.score = 0;
          this.lives = 3;
          this.streak = 0;
          this.bestStreak = 0;
          this.comboMultiplier = 1;
          this.totalQ = Math.min(15, this.questions.length);
          this.answered = false;
          this.startTime = Date.now();
          this.questionStartTime = Date.now();
          this.selectedIdx = -1;
          this.wins = 0;
          this.losses = 0;
          this.lastPhase = "";
          this.doublePointsActive = false;
          // Power-ups
          this.powerUps = { fiftyFifty: 1, doublePoints: 1 };

          this.cameras.main.setBackgroundColor("#0f172a");
          this.cameras.main.fadeIn(400);

          // Ambient crowd sound
          this.ambientTimer = this.time.addEvent({
            delay: 4000,
            callback: () => sfx.ambientCrowd(),
            loop: true,
          });

          this.buildCourt();
          this.buildHUD();
          this.buildScoreboard();
          this.loadQuestion();
          this.input.keyboard.on("keydown", this.handleKey, this);
          if (this.freshSeason)
            this.showFloatingText(W / 2, 120, "New season — new numbers!", "#60a5fa", "20px");
        }

        // Floating score text popup
        showFloatingText(x, y, text, color, size = "20px") {
          const ft = this.add
            .text(x, y, text, {
              fontSize: size,
              color: color,
              fontStyle: "bold",
              stroke: "#000",
              strokeThickness: 3,
            })
            .setOrigin(0.5)
            .setDepth(25)
            .setAlpha(1);
          this.tweens.add({
            targets: ft,
            y: y - 60,
            alpha: 0,
            scaleX: 1.5,
            scaleY: 1.5,
            duration: 1200,
            ease: "Power2",
            onComplete: () => ft.destroy(),
          });
        }

        // Confetti burst
        spawnConfetti(x, y, count) {
          const colors = [
            0xef4444, 0xfbbf24, 0x22c55e, 0x3b82f6, 0xff6600, 0xa78bfa,
          ];
          const emitter = this.add.particles(x, y, "__WHITE", {
            speed: { min: 100, max: 350 },
            angle: { min: 0, max: 360 },
            scale: { start: 0.5, end: 0 },
            lifespan: { min: 600, max: 1200 },
            tint: colors,
            quantity: count,
            emitting: false,
            blendMode: "ADD",
          });
          emitter.explode(count);
          this.time.delayedCall(1500, () => emitter.destroy());
        }

        // Screen shake scaled to streak
        streakShake() {
          if (RM.on) return;
          const intensity = Math.min(0.003 + this.streak * 0.002, 0.015);
          const dur = Math.min(100 + this.streak * 25, 300);
          this.cameras.main.shake(dur, intensity);
        }

        buildCourt() {
          // --- Parallax court floor layer ---
          // A container holds the floor + markings so it can drift subtly with
          // the pointer (and gently sway under reduced motion = static).
          this.courtLayer = this.add.container(0, 0).setDepth(0);
          const floor = this.add.rectangle(
            W / 2,
            H - 80,
            W + 120,
            160,
            0x8b4513,
            0.08,
          );
          this.courtLayer.add(floor);
          // Receding floorboard lines for depth (procedural)
          for (let i = 0; i < 7; i++) {
            const ly = H - 150 + i * 22;
            const line = this.add
              .rectangle(W / 2, ly, W + 120, 1, 0xfbbf24, 0.05 + i * 0.012)
              .setOrigin(0.5);
            this.courtLayer.add(line);
          }
          // Court markings
          this.courtLayer.add(
            this.add
              .rectangle(W / 2, H - 80, W - 40, 140, 0x000000, 0)
              .setStrokeStyle(1, 0xfbbf24, 0.15),
          );
          this.courtLayer.add(
            this.add
              .circle(W / 2, H - 80, 40, 0x000000, 0)
              .setStrokeStyle(1, 0xfbbf24, 0.15),
          );

          // --- Dynamic arena lighting (procedural spotlight sweep) ---
          // A soft radial-ish glow drawn with graphics that drifts left/right
          // across the court. Purely decorative; frozen under reduced motion.
          this.spotlight = this.add.graphics().setDepth(0);
          this._spotPhase = 0;
          this.drawSpotlight(W / 2);

          // Hoop
          this.add.rectangle(W - 60, H - 180, 6, 60, 0x64748b).setDepth(0);
          this.add.rectangle(W - 60, H - 210, 40, 3, 0xef4444).setDepth(0);
          this.add
            .circle(W - 40, H - 210, 15, 0x000000, 0)
            .setStrokeStyle(2, 0xef4444, 0.5)
            .setDepth(0);

          // Ambient arena particles
          this.add.particles(W / 2, H / 2, "__WHITE", {
            x: { min: 0, max: W },
            y: { min: 100, max: H },
            speed: { min: 2, max: 6 },
            angle: { min: 260, max: 280 },
            scale: { start: 0.08, end: 0 },
            alpha: { start: 0.2, end: 0 },
            lifespan: { min: 4000, max: 8000 },
            tint: [0xfbbf24, 0xef4444],
            quantity: 1,
            frequency: 400,
            blendMode: "ADD",
          });

          // Players (small sprites)
          this.courtPlayers = [];
          for (let i = 0; i < 5; i++) {
            const px = 150 + i * 160,
              py = H - 80 + Phaser.Math.Between(-20, 20);
            const pg = this.add.graphics().setPosition(px, py).setDepth(1);
            pg.fillStyle(i < 3 ? 0x3b82f6 : 0xef4444);
            pg.fillCircle(0, -15, 10);
            pg.fillRoundedRect(-8, -5, 16, 20, 3);
            pg.fillStyle(0x64748b);
            pg.fillRect(-6, 15, 5, 12);
            pg.fillRect(1, 15, 5, 12);
            if (!RM.on) {
              this.tweens.add({
                targets: pg,
                y: py - 5,
                x: px + Phaser.Math.Between(-10, 10),
                duration: 800 + i * 200,
                yoyo: true,
                repeat: -1,
                ease: "Sine.easeInOut",
              });
            }
            this.courtPlayers.push(pg);
          }

          // Pointer parallax for the court layer (bespoke, in-canvas).
          this._parallaxTarget = { x: 0 };
          this.input.on("pointermove", (p) => {
            if (RM.on) return;
            // Drift up to ~14px based on horizontal pointer position.
            this._parallaxTarget.x = ((p.x / W) * 2 - 1) * 14;
          });
        }

        // Draw the procedural court spotlight glow centered at sx.
        drawSpotlight(sx) {
          if (!this.spotlight) return;
          const g = this.spotlight;
          g.clear();
          const cy = H - 80;
          // Layered translucent ellipses fake a soft radial light pool.
          const rings = [
            { rx: 260, ry: 90, a: 0.05 },
            { rx: 190, ry: 66, a: 0.06 },
            { rx: 120, ry: 42, a: 0.07 },
          ];
          rings.forEach((r) => {
            g.fillStyle(0xfde68a, r.a);
            g.fillEllipse(sx, cy, r.rx * 2, r.ry * 2);
          });
        }

        buildHUD() {
          this.hudBg = this.add
            .rectangle(W / 2, 22, W, 44, 0x000000, 0.8)
            .setDepth(10);
          this.hudQ = this.add
            .text(15, 10, "", {
              fontSize: "14px",
              color: "#94a3b8",
              fontStyle: "bold",
            })
            .setDepth(11);
          this.hudScore = this.add
            .text(140, 10, "", {
              fontSize: "14px",
              color: "#fbbf24",
              fontStyle: "bold",
            })
            .setDepth(11);
          this.hudLives = this.add
            .text(290, 10, "", { fontSize: "14px", color: "#ef4444" })
            .setDepth(11);
          this.hudStreak = this.add
            .text(450, 10, "", { fontSize: "14px", color: "#f59e0b" })
            .setDepth(11);
          this.hudMultiplier = this.add
            .text(600, 10, "", { fontSize: "14px", color: "#a78bfa" })
            .setDepth(11);
          this.hudPhase = this.add
            .text(720, 10, "", { fontSize: "14px", color: "#a78bfa" })
            .setDepth(11);
          this.hudTimer = this.add
            .text(W - 100, 10, "", { fontSize: "14px", color: "#94a3b8" })
            .setDepth(11);

          // Progress bar
          this.progBg = this.add
            .rectangle(W / 2, 44, W - 20, 6, 0x334155)
            .setDepth(10);
          this.progFill = this.add
            .rectangle(10, 44, 0, 6, 0xef4444)
            .setOrigin(0, 0.5)
            .setDepth(10);

          // Progress dots
          this.progDots = [];
          const dotSpacing = (W - 40) / this.totalQ;
          for (let i = 0; i < this.totalQ; i++) {
            const dot = this.add
              .circle(20 + i * dotSpacing, 54, 3, 0x334155)
              .setDepth(10);
            this.progDots.push(dot);
          }

          // Speed indicator
          this.speedIndicator = this.add
            .text(W - 50, 55, "", { fontSize: "11px", color: "#22c55e" })
            .setOrigin(0.5)
            .setDepth(11);
        }

        buildScoreboard() {
          this.sbBg = this.add
            .rectangle(W / 2, 70, 300, 30, 0x1e293b, 0.9)
            .setStrokeStyle(1, 0x334155)
            .setDepth(5);
          this.sbText = this.add
            .text(W / 2, 70, "", {
              fontSize: "14px",
              color: "#e2e8f0",
              fontStyle: "bold",
            })
            .setOrigin(0.5)
            .setDepth(6);
        }

        showPhaseTransition(newPhase) {
          const phaseNames = {
            Scout: "SCOUTING",
            Draft: "DRAFT DAY",
            Champ: "CHAMPIONSHIP",
          };
          const phaseColors = {
            Scout: "#22c55e",
            Draft: "#f59e0b",
            Champ: "#ef4444",
          };
          sfx.phaseTransition();

          const overlay = this.add
            .rectangle(W / 2, H / 2, W, H, 0x000000, 0.9)
            .setDepth(50);
          const phaseText = this.add
            .text(W / 2, H / 2 - 20, phaseNames[newPhase] || newPhase, {
              fontSize: "42px",
              color: phaseColors[newPhase] || "#fff",
              fontStyle: "bold",
              stroke: "#000",
              strokeThickness: 4,
            })
            .setOrigin(0.5)
            .setDepth(51)
            .setAlpha(0)
            .setScale(0.5);
          const subText = this.add
            .text(W / 2, H / 2 + 30, "ENTERING NEW PHASE", {
              fontSize: "16px",
              color: "#94a3b8",
            })
            .setOrigin(0.5)
            .setDepth(51)
            .setAlpha(0);

          this.tweens.add({
            targets: phaseText,
            alpha: 1,
            scaleX: 1,
            scaleY: 1,
            duration: 400,
            ease: "Back.easeOut",
          });
          this.tweens.add({
            targets: subText,
            alpha: 1,
            duration: 400,
            delay: 200,
          });
          this.time.delayedCall(1200, () => {
            this.tweens.add({
              targets: [overlay, phaseText, subText],
              alpha: 0,
              duration: 400,
              onComplete: () => {
                overlay.destroy();
                phaseText.destroy();
                subText.destroy();
              },
            });
          });
        }

        loadQuestion() {
          if (this.qIndex >= this.totalQ) {
            this.endGame();
            return;
          }
          this.answered = false;
          this.attempts = 0;
          this.selectedIdx = -1;
          this.questionStartTime = Date.now();
          this.doublePointsActive = false;
          const q = this.questions[this.qIndex];

          // Phase transition
          if (q.phase !== this.lastPhase && this.qIndex > 0) {
            this.showPhaseTransition(q.phase);
          }
          this.lastPhase = q.phase;

          this.updateHUD();

          // Animated progress bar
          this.tweens.add({
            targets: this.progFill,
            width: (this.qIndex / this.totalQ) * (W - 20),
            duration: 300,
            ease: "Power2",
          });

          this.sbText.setText(
            `Season Record: ${this.wins}W - ${this.losses}L | Game ${this.qIndex + 1}`,
          );

          // Clean up old
          if (this.qGroup) this.qGroup.destroy(true);
          this.qGroup = this.add.group();
          if (this.powerUpGroup) this.powerUpGroup.destroy(true);
          this.powerUpGroup = this.add.group();

          // Phase label
          const phaseColors = {
            Scout: 0x22c55e,
            Draft: 0xf59e0b,
            Champ: 0xef4444,
          };
          const phaseNames = {
            Scout: "SCOUTING",
            Draft: "DRAFT DAY",
            Champ: "CHAMPIONSHIP",
          };
          // Question card
          const cardY = 170;
          const cardH = q.data ? 200 : 160;
          const card = this.add
            .rectangle(
              W / 2,
              cardY + cardH / 2 - 20,
              700,
              cardH,
              0x1e293b,
              0.95,
            )
            .setStrokeStyle(2, phaseColors[q.phase] || 0x334155)
            .setDepth(5);
          this.qGroup.add(card);

          // Card enter animation
          card.setAlpha(0).setScale(0.95);
          this.tweens.add({
            targets: card,
            alpha: 1,
            scaleX: 1,
            scaleY: 1,
            duration: 300,
            ease: "Power2",
          });

          // Phase badge
          const badge = this.add
            .text(W / 2 - 320, cardY - 10, phaseNames[q.phase] || q.phase, {
              fontSize: "11px",
              color: "#fff",
              backgroundColor:
                "#" +
                (phaseColors[q.phase] || 0x334155)
                  .toString(16)
                  .padStart(6, "0"),
              padding: { x: 8, y: 3 },
              fontStyle: "bold",
            })
            .setDepth(6);
          this.qGroup.add(badge);

          // Tier
          const tierColors = ["#22c55e", "#f59e0b", "#ef4444"];
          const tierNames = ["Tier 1", "Tier 2", "Tier 3"];
          const tier = this.add
            .text(W / 2 - 320, cardY + 15, tierNames[q.tier - 1], {
              fontSize: "11px",
              color: tierColors[q.tier - 1],
            })
            .setDepth(6);
          this.qGroup.add(tier);

          // Question text
          const qt = this.add
            .text(W / 2, cardY + 50, q.text, {
              fontSize: "18px",
              color: "#e2e8f0",
              fontStyle: "bold",
              align: "center",
              wordWrap: { width: 650 },
            })
            .setOrigin(0.5)
            .setDepth(6)
            .setAlpha(0);
          this.qGroup.add(qt);
          this.tweens.add({ targets: qt, alpha: 1, duration: 300, delay: 100 });

          // Data display
          if (q.data) {
            const dataBox = this.add
              .rectangle(W / 2, cardY + 100, 600, 35, 0x0f172a)
              .setStrokeStyle(1, 0x334155)
              .setDepth(5);
            const dataText = this.add
              .text(W / 2, cardY + 100, q.data, {
                fontSize: "15px",
                color: "#60a5fa",
                fontFamily: "monospace",
                fontStyle: "bold",
              })
              .setOrigin(0.5)
              .setDepth(6);
            this.qGroup.add(dataBox);
            this.qGroup.add(dataText);
            // Mini bar chart visualization
            const vals = q.data
              .split(",")
              .map((v) => parseFloat(v.trim()))
              .filter((v) => !isNaN(v));
            if (vals.length > 0 && vals.length <= 10) {
              const chartX = W / 2 - vals.length * 18,
                chartY = cardY + 145;
              const maxV = Math.max(...vals);
              vals.forEach((v, i) => {
                const barH = Math.max(5, (v / maxV) * 40);
                const bar = this.add
                  .rectangle(
                    chartX + i * 36,
                    chartY - barH / 2,
                    28,
                    barH,
                    phaseColors[q.phase] || 0x3b82f6,
                    0.6,
                  )
                  .setDepth(5);
                // Animate bars growing
                bar.setScale(1, 0);
                this.tweens.add({
                  targets: bar,
                  scaleY: 1,
                  duration: 300,
                  delay: 200 + i * 50,
                  ease: "Back.easeOut",
                });
                this.qGroup.add(bar);
              });
            }
          }

          // Answer options
          this.answerBtns = [];
          const optY = q.data ? cardY + cardH + 30 : cardY + cardH + 10;
          q.options.forEach((opt, i) => {
            const isLong = opt.length > 40;
            const bw = isLong ? 680 : 320;
            const bx = isLong ? W / 2 : i % 2 === 0 ? W / 2 - 175 : W / 2 + 175;
            const by = isLong ? optY + i * 55 : optY + Math.floor(i / 2) * 55;
            const bg = this.add
              .rectangle(bx, by, bw, 45, 0x1e293b)
              .setStrokeStyle(2, 0x475569)
              .setInteractive({ useHandCursor: true })
              .setDepth(6);
            const num = this.add
              .text(bx - bw / 2 + 10, by - 6, String(i + 1), {
                fontSize: "10px",
                color: "#64748b",
              })
              .setDepth(7);
            const txt = this.add
              .text(bx, by, opt, {
                fontSize: "15px",
                color: "#e2e8f0",
                align: "center",
                wordWrap: { width: bw - 30 },
              })
              .setOrigin(0.5)
              .setDepth(7);

            // Enter animation
            bg.setAlpha(0).setScale(0.9);
            txt.setAlpha(0);
            num.setAlpha(0);
            this.tweens.add({
              targets: bg,
              alpha: 1,
              scaleX: 1,
              scaleY: 1,
              duration: 200,
              delay: 150 + i * 60,
              ease: "Back.easeOut",
            });
            this.tweens.add({
              targets: [txt, num],
              alpha: 1,
              duration: 200,
              delay: 200 + i * 60,
            });

            bg.on("pointerover", () => {
              if (!this.answered) {
                bg.setStrokeStyle(3, 0xfbbf24);
                this.tweens.add({
                  targets: bg,
                  scaleX: 1.04,
                  scaleY: 1.04,
                  duration: 80,
                });
                this.tweens.add({
                  targets: txt,
                  scaleX: 1.03,
                  scaleY: 1.03,
                  duration: 80,
                });
                sfx.hover();
              }
            });
            bg.on("pointerout", () => {
              if (!this.answered && this.selectedIdx !== i) {
                bg.setStrokeStyle(2, 0x475569);
                this.tweens.add({
                  targets: bg,
                  scaleX: 1,
                  scaleY: 1,
                  duration: 80,
                });
                this.tweens.add({
                  targets: txt,
                  scaleX: 1,
                  scaleY: 1,
                  duration: 80,
                });
              }
            });
            bg.on("pointerdown", () => {
              if (!this.answered) this.submitAnswer(i);
            });
            this.qGroup.add(bg);
            this.qGroup.add(txt);
            this.qGroup.add(num);
            this.answerBtns.push({ bg, txt, num, optText: opt });
          });

          // Announce the question + options to assistive tech (non-visual).
          try {
            const sr = document.getElementById("sr-status");
            if (sr) {
              const opts = q.options.map((o, i) => `${i + 1}. ${o}`).join(". ");
              sr.textContent = `Question ${this.qIndex + 1} of ${this.totalQ}. ${q.text}${q.data ? " Data: " + q.data + "." : ""} Options: ${opts}.`;
            }
          } catch (e) {}

          // Power-up buttons
          this.buildPowerUpButtons();

          // Feedback
          this.fbObj = this.add
            .text(W / 2, H - 50, "", {
              fontSize: "14px",
              color: "#94a3b8",
              align: "center",
              wordWrap: { width: 700 },
            })
            .setOrigin(0.5)
            .setDepth(8);
          this.qGroup.add(this.fbObj);

          // Shot clock REMOVED — no timed pressure (teacher preference: calm,
          // self-paced games). No countdown, no time-based scoring; students
          // get unlimited time per question.
        }

        drawShotClockRing(pct) {
          if (!this.shotRing) return;
          this.shotRing.clear();
          const cx = W - 50,
            cy = 70,
            r = 18;
          const color = pct > 0.3 ? 0xf59e0b : 0xef4444;
          this.shotRing.lineStyle(3, color, 0.5);
          this.shotRing.beginPath();
          this.shotRing.arc(
            cx,
            cy,
            r,
            Phaser.Math.DegToRad(-90),
            Phaser.Math.DegToRad(-90 + 360 * pct),
            false,
          );
          this.shotRing.strokePath();
        }

        buildPowerUpButtons() {
          const puDefs = [
            { key: "fiftyFifty", label: "50/50", color: 0x3b82f6, hotkey: "F" },
            {
              key: "doublePoints",
              label: "2x PTS",
              color: 0xa78bfa,
              hotkey: "D",
            },
          ];
          puDefs.forEach((pu, i) => {
            if (this.powerUps[pu.key] <= 0) return;
            const px = 30 + i * 100,
              py = H - 30;
            const bg = this.add
              .rectangle(px + 35, py, 80, 26, pu.color, 0.3)
              .setStrokeStyle(1, pu.color)
              .setInteractive({ useHandCursor: true })
              .setDepth(9);
            const txt = this.add
              .text(px + 35, py, `${pu.label} (${pu.hotkey})`, {
                fontSize: "10px",
                color: "#fff",
                fontStyle: "bold",
              })
              .setOrigin(0.5)
              .setDepth(10);
            const countTxt = this.add
              .text(px + 70, py - 11, `x${this.powerUps[pu.key]}`, {
                fontSize: "9px",
                color: "#fbbf24",
              })
              .setDepth(10);
            bg.on("pointerdown", () => this.usePowerUp(pu.key));
            bg.on("pointerover", () => bg.setFillStyle(pu.color, 0.6));
            bg.on("pointerout", () => bg.setFillStyle(pu.color, 0.3));
            this.powerUpGroup.add(bg);
            this.powerUpGroup.add(txt);
            this.powerUpGroup.add(countTxt);
          });
        }

        usePowerUp(key) {
          if (this.answered || this.powerUps[key] <= 0) return;
          const q = this.questions[this.qIndex];
          if (key === "fiftyFifty") {
            this.powerUps.fiftyFifty--;
            sfx.powerup();
            let removed = 0;
            this.answerBtns.forEach((b) => {
              if (b.optText !== q.correct && removed < 2) {
                b.bg.setAlpha(0.3);
                b.txt.setAlpha(0.3);
                b.bg.disableInteractive();
                b.eliminated = true;
                removed++;
              }
            });
            this.showFloatingText(W / 2, H / 2, "50/50!", "#3b82f6", "22px");
          } else if (key === "doublePoints") {
            this.powerUps.doublePoints--;
            this.doublePointsActive = true;
            sfx.powerup();
            this.showFloatingText(
              W / 2,
              H / 2,
              "DOUBLE POINTS!",
              "#a78bfa",
              "22px",
            );
          }
          if (this.powerUpGroup) this.powerUpGroup.destroy(true);
          this.powerUpGroup = this.add.group();
          this.buildPowerUpButtons();
        }

        submitAnswer(idx) {
          if (this.answered) return;
          if (this.answerBtns[idx].eliminated) return;
          this.answered = true;
          if (this.shotTimer) this.shotTimer.remove();
          const q = this.questions[this.qIndex];
          const chosen = this.answerBtns[idx].optText;
          const correct = chosen === q.correct;

          const tries = this.attempts || 0;
          if (correct) {
            // Calculate score (no time-based bonus — calm, self-paced).
            // Full points for an unaided first try; fewer after help.
            const helpFactor = [1, 0.5, 0.25, 0][Math.min(tries, 3)];
            let basePoints = q.tier * 10;
            let streakBonus = tries === 0 ? Math.min(this.streak, 5) * 5 : 0;
            let subtotal = Math.round((basePoints + streakBonus) * helpFactor);
            if (this.doublePointsActive) subtotal *= 2;

            this.score += subtotal;
            window.FlagshipAdventure?.record({ firstTry: tries === 0, kind: q.type || "statistics" });
            if (tries === 0) {
              this.streak++;
              this.wins++;
            } else {
              this.losses++;
            }
            if (this.streak > this.bestStreak) this.bestStreak = this.streak;
            this.comboMultiplier = Math.min(
              1 + Math.floor(this.streak / 2) * 0.5,
              4,
            );

            // Update progress dots
            if (this.progDots[this.qIndex]) {
              this.progDots[this.qIndex].setFillStyle(tries === 0 ? 0x22c55e : 0xf59e0b);
            }

            this.answerBtns[idx].bg.setFillStyle(0x22c55e);
            this.answerBtns[idx].bg.setStrokeStyle(3, 0x22c55e);

            // Floating score text
            const btn = this.answerBtns[idx];
            this.showFloatingText(
              btn.bg.x,
              btn.bg.y - 30,
              `+${subtotal}`,
              "#22c55e",
            );

            if (this.doublePointsActive) {
              this.showFloatingText(W / 2, 120, "DOUBLE!", "#a78bfa", "16px");
            }

            // Streak milestone effects
            if (this.streak === 3) {
              sfx.streak3();
              this.showFloatingText(
                W / 2,
                H / 2 - 60,
                "STREAK x3!",
                "#f59e0b",
                "28px",
              );
              this.spawnConfetti(W / 2, H / 2, 30);
              sfx.crowd();
            } else if (this.streak === 5) {
              sfx.streak5();
              this.showFloatingText(
                W / 2,
                H / 2 - 60,
                "ON FIRE x5!",
                "#ff6600",
                "32px",
              );
              this.spawnConfetti(W / 2, H / 2, 50);
              sfx.crowdRoar();
            } else if (this.streak === 7) {
              sfx.streak7();
              this.showFloatingText(
                W / 2,
                H / 2 - 60,
                "UNSTOPPABLE x7!",
                "#ef4444",
                "36px",
              );
              this.spawnConfetti(W / 2, H / 2, 80);
              sfx.crowdRoar();
              // Bonus power-up
              this.powerUps.fiftyFifty++;
            }

            this.fbObj.setText(
              "SCORE! +" +
                subtotal +
                " pts" +
                (tries > 0 ? " (with help)" : "") +
                (tries === 0 && this.streak >= 3 ? " STREAK x" + this.streak + "!" : "") +
                "  ✔ " + q.explain,
            );
            try {
              const sr = document.getElementById("sr-status");
              if (sr) sr.textContent = "Correct. " + q.explain;
            } catch (e) {}
            this.fbObj.setColor("#22c55e");
            sfx.buzzer();
            if (this.streak < 3) sfx.crowd();

            // Basketball animation (skip the tween under reduced motion,
            // but still reward the make with the hoop particle burst).
            sfx.swoosh();
            const hoopBurst = () => {
              this.add
                .particles(W - 40, H - 210, "__WHITE", {
                  speed: { min: 30, max: 120 },
                  angle: { min: 0, max: 360 },
                  scale: { start: 0.4, end: 0 },
                  lifespan: 500,
                  tint: [0xfbbf24, 0xef4444, 0x22c55e],
                  quantity: 12,
                  emitting: false,
                  blendMode: "ADD",
                })
                .explode(18);
            };
            if (RM.on) {
              hoopBurst();
            } else {
              const ball = this.add
                .circle(W / 2, H - 100, 15, 0xf97316)
                .setDepth(9);
              this.tweens.add({
                targets: ball,
                x: W - 40,
                y: H - 210,
                duration: 600,
                ease: "Quad.easeOut",
                onComplete: () => {
                  hoopBurst();
                  ball.destroy();
                },
              });
            }

            // Screen shake scaled to streak
            this.streakShake();

            // Confetti at answer button
            this.spawnConfetti(btn.bg.x, btn.bg.y, 10 + this.streak * 2);
          } else {
            // Not yet: rule this choice out, give the next rung of help, and
            // let the student try again. Nothing advances on its own.
            this.attempts = tries + 1;
            this.streak = 0;
            this.comboMultiplier = 1;
            const btn = this.answerBtns[idx];
            btn.eliminated = true;
            btn.bg.setFillStyle(0xef4444, 0.45);
            btn.bg.setStrokeStyle(3, 0xef4444);
            if (btn.txt) btn.txt.setAlpha(0.5);
            btn.bg.disableInteractive();
            if (this.progDots[this.qIndex]) {
              this.progDots[this.qIndex].setFillStyle(0xf59e0b);
            }
            sfx.miss();
            this.showFloatingText(btn.bg.x, btn.bg.y - 30, "Not yet", "#f59e0b", "20px");
            const left = this.answerBtns.filter((b) => !b.eliminated).length;
            let msg;
            if (this.attempts === 1) {
              msg = "Not yet — " + chosen + " is not it. Hint: " + methodHint(q);
            } else if (this.attempts === 2 && left > 1) {
              msg = "Try this step: " + workedStep(q);
            } else {
              msg = "Here is the full solution: " + q.explain + " Tap the matching answer to go on.";
            }
            this.fbObj.setText(msg);
            this.fbObj.setColor("#fbbf24");
            // The shared Mission Control panel prints the full explanation on
            // any wrong pick; replace it with this rung of the help ladder.
            try {
              const fm = document.querySelector(".fm-feedback");
              if (fm) fm.textContent = msg;
            } catch (e) {}
            try {
              const sr = document.getElementById("sr-status");
              if (sr) sr.textContent = msg;
            } catch (e) {}
            safeShake(this, 150, 0.004);
            this.answered = false;
            this.updateHUD();
            return;
          }
          this.updateHUD();
          this.time.delayedCall(correct ? 1500 : 2500, () => {
            this.qIndex++;
            this.loadQuestion();
          });
        }

        handleKey(e) {
          if (this.answered) return;
          if (e.key >= "1" && e.key <= "4") {
            const i = parseInt(e.key) - 1;
            if (i < this.answerBtns.length && !this.answerBtns[i].eliminated)
              this.submitAnswer(i);
          }
          if (e.key === "f" || e.key === "F") this.usePowerUp("fiftyFifty");
          if (e.key === "d" || e.key === "D") this.usePowerUp("doublePoints");
          if (e.key === "ArrowRight" || e.key === "ArrowDown") {
            this.selectedIdx = Math.min(
              this.selectedIdx + 1,
              this.answerBtns.length - 1,
            );
            if (this.selectedIdx < 0) this.selectedIdx = 0;
            this.highlightSel();
          }
          if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
            this.selectedIdx = Math.max(this.selectedIdx - 1, 0);
            this.highlightSel();
          }
          if (e.key === "Enter" && this.selectedIdx >= 0)
            this.submitAnswer(this.selectedIdx);
        }

        highlightSel() {
          this.answerBtns.forEach((b, i) => {
            if (b.eliminated) return;
            const sel = i === this.selectedIdx;
            b.bg.setStrokeStyle(sel ? 3 : 2, sel ? 0xfbbf24 : 0x475569);
            if (sel) {
              this.tweens.add({
                targets: b.bg,
                scaleX: 1.04,
                scaleY: 1.04,
                duration: 80,
              });
            } else {
              this.tweens.add({
                targets: b.bg,
                scaleX: 1,
                scaleY: 1,
                duration: 80,
              });
            }
          });
          sfx.click();
        }

        updateHUD() {
          const q = this.questions[this.qIndex];
          const phaseNames = {
            Scout: "SCOUTING",
            Draft: "DRAFT",
            Champ: "FINALS",
          };
          this.hudQ.setText(`Q${this.qIndex + 1}/${this.totalQ}`);
          this.hudScore.setText(`SCORE: ${this.score}`);
          this.hudLives.setText(
            "LIVES: " + "■".repeat(this.lives) + "□".repeat(3 - this.lives),
          );

          // Streak with color scaling
          if (this.streak >= 2) {
            this.hudStreak.setText(`STREAK ${this.streak}x`);
            if (this.streak >= 5) this.hudStreak.setColor("#ef4444");
            else if (this.streak >= 3) this.hudStreak.setColor("#ff6600");
            else this.hudStreak.setColor("#f59e0b");
          } else {
            this.hudStreak.setText("");
          }

          // Multiplier
          if (this.comboMultiplier > 1) {
            this.hudMultiplier.setText(`x${this.comboMultiplier}`);
          } else {
            this.hudMultiplier.setText("");
          }

          this.hudPhase.setText(q ? phaseNames[q.phase] || "" : "");
          // Calm play: no on-screen clock and no answer-speed indicator.
          this.hudTimer.setText("");
          this.speedIndicator.setText("");
        }

        update(time) {
          this.updateHUD();

          // Smoothly ease the court parallax layer toward the pointer target.
          if (this.courtLayer && this._parallaxTarget) {
            const target = RM.on ? 0 : this._parallaxTarget.x;
            this.courtLayer.x += (target - this.courtLayer.x) * 0.08;
          }

          // Animate the dynamic spotlight sweep (frozen under reduced motion).
          if (this.spotlight) {
            if (RM.on) {
              this.drawSpotlight(W / 2);
            } else {
              this._spotPhase = (time || 0) * 0.0004;
              const sx = W / 2 + Math.sin(this._spotPhase) * 220;
              this.drawSpotlight(sx);
            }
          }
        }

        endGame() {
          if (this.shotTimer) this.shotTimer.remove();
          if (this.ambientTimer) this.ambientTimer.remove();
          const elapsed = Math.floor((Date.now() - this.startTime) / 1000);

          // A finished season unlocks fresh numbers for every replay.
          try {
            localStorage.setItem(PLAYS_KEY, String(seasonsPlayed() + 1));
          } catch (e) {}

          // Save high score
          const prevBest = parseInt(localStorage.getItem(LS_KEY) || "0");
          const isNewHighScore = this.score > prevBest;
          if (isNewHighScore) {
            localStorage.setItem(LS_KEY, String(this.score));
          }

          try {
            window.EduPulse &&
              EduPulse.record({
                activityTitle: document.title,
                score: this.wins,
                maxScore: this.totalQ,
                problemsCorrect: this.wins,
                problemsAttempted: this.totalQ,
                percent: this.totalQ
                  ? Math.round((this.wins / this.totalQ) * 100)
                  : 0,
                standard: "6.DS",
              });
          } catch (e) {}

          this.cameras.main.fade(500, 0, 0, 0);
          this.time.delayedCall(500, () => {
            this.scene.start("Results", {
              score: this.score,
              total: this.totalQ,
              correct: this.wins,
              bestStreak: this.bestStreak,
              time: elapsed,
              wins: this.wins,
              losses: this.losses,
              isNewHighScore: isNewHighScore,
              prevBest: prevBest,
            });
          });
        }
      }

      // --- RESULTS ---
      class ResultsScene extends Phaser.Scene {
        constructor() {
          super("Results");
        }
        init(data) {
          this.d = data;
        }
        create() {
          sfx.init();
          const d = this.d,
            cx = W / 2;
          this.cameras.main.setBackgroundColor("#0f172a");
          this.cameras.main.fadeIn(500);

          const pct = d.total > 0 ? Math.round((d.correct / d.total) * 100) : 0;
          const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;

          // Ambient particles
          this.add.particles(W / 2, H / 2, "__WHITE", {
            x: { min: 0, max: W },
            y: { min: 0, max: H },
            speed: { min: 2, max: 8 },
            angle: { min: 250, max: 290 },
            scale: { start: 0.1, end: 0 },
            alpha: { start: 0.3, end: 0 },
            lifespan: { min: 3000, max: 6000 },
            tint: stars >= 2 ? [0xfbbf24, 0xef4444] : [0x4a5568, 0x718096],
            quantity: 1,
            frequency: 200,
            blendMode: "ADD",
          });

          if (stars >= 2) {
            if (stars === 3) sfx.victory3Star();
            else sfx.win();
            // Elaborate confetti
            for (let i = 0; i < 6; i++) {
              this.time.delayedCall(i * 200, () => {
                const px = Phaser.Math.Between(100, W - 100);
                this.add
                  .particles(px, 0, "__WHITE", {
                    speed: { min: 80, max: 300 },
                    angle: { min: 60, max: 120 },
                    scale: { start: 0.5, end: 0 },
                    lifespan: 1500,
                    tint: [0xef4444, 0xfbbf24, 0x22c55e, 0x3b82f6, 0xa78bfa],
                    quantity: 20,
                    emitting: false,
                  })
                  .explode(25);
              });
            }
          } else sfx.lose();

          const titles = [
            "Bench Warmer",
            "Solid Starter",
            "All-Star!",
            "MVP! CHAMPION!",
          ];
          const titleText = this.add
            .text(cx, 55, titles[stars], {
              fontSize: "42px",
              color: stars >= 2 ? "#fbbf24" : "#94a3b8",
              fontStyle: "bold",
            })
            .setOrigin(0.5)
            .setAlpha(0)
            .setScale(0.5);
          this.tweens.add({
            targets: titleText,
            alpha: 1,
            scaleX: 1,
            scaleY: 1,
            duration: 600,
            ease: "Back.easeOut",
          });

          // Animated star fill
          for (let i = 0; i < 3; i++) {
            const filled = i < stars;
            const starText = this.add
              .text(cx - 60 + i * 60, 115, filled ? "★" : "☆", {
                fontSize: "48px",
                color: "#fbbf24",
              })
              .setOrigin(0.5)
              .setAlpha(0)
              .setScale(0);
            this.tweens.add({
              targets: starText,
              alpha: 1,
              scaleX: 1,
              scaleY: 1,
              duration: 400,
              delay: 600 + i * 300,
              ease: "Back.easeOut",
              onStart: () => {
                if (filled) sfx.click();
              },
            });
            if (filled) {
              this.time.delayedCall(700 + i * 300, () => {
                this.add
                  .particles(cx - 60 + i * 60, 115, "__WHITE", {
                    speed: { min: 20, max: 60 },
                    angle: { min: 0, max: 360 },
                    scale: { start: 0.3, end: 0 },
                    lifespan: 400,
                    tint: 0xfbbf24,
                    quantity: 8,
                    emitting: false,
                  })
                  .explode(10);
              });
            }
          }

          // New high score
          if (d.isNewHighScore) {
            const hsText = this.add
              .text(cx, 160, "NEW HIGH SCORE!", {
                fontSize: "24px",
                color: "#ff6600",
                fontStyle: "bold",
                stroke: "#000",
                strokeThickness: 3,
              })
              .setOrigin(0.5)
              .setAlpha(0);
            this.tweens.add({
              targets: hsText,
              alpha: 1,
              duration: 300,
              delay: 1800,
            });
            this.tweens.add({
              targets: hsText,
              scaleX: 1.1,
              scaleY: 1.1,
              duration: 500,
              yoyo: true,
              repeat: -1,
              delay: 1800,
              ease: "Sine.easeInOut",
            });
          }

          // Scoreboard
          this.add
            .rectangle(cx, 200, 300, 60, 0x1e293b)
            .setStrokeStyle(2, 0xef4444);
          // Win/Loss record with animated stat counter (tween 0 -> actual).
          const recordText = this.add
            .text(cx, 190, `0W — 0L`, {
              fontSize: "28px",
              color: "#e2e8f0",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          const setRecord = (w, l) => {
            recordText.setText(`${Math.round(w)}W — ${Math.round(l)}L`);
          };
          if (RM.on) {
            setRecord(d.wins, d.losses);
          } else {
            const rec = { w: 0, l: 0 };
            this.tweens.add({
              targets: rec,
              w: d.wins,
              l: d.losses,
              duration: 900,
              delay: 400,
              ease: "Cubic.easeOut",
              onUpdate: () => setRecord(rec.w, rec.l),
              onComplete: () => setRecord(d.wins, d.losses),
            });
          }
          this.add
            .text(cx, 215, "Season Record", {
              fontSize: "12px",
              color: "#64748b",
            })
            .setOrigin(0.5);

          // Score circle with animated counter
          this.add.circle(cx, 300, 55, 0x1e293b).setStrokeStyle(3, 0xef4444);
          const scoreText = this.add
            .text(cx, 290, "0%", {
              fontSize: "30px",
              color: "#e2e8f0",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          this.add
            .text(cx, 315, "Accuracy", { fontSize: "12px", color: "#64748b" })
            .setOrigin(0.5);

          if (RM.on) {
            scoreText.setText(pct + "%");
          } else {
            let counter = { val: 0 };
            this.tweens.add({
              targets: counter,
              val: pct,
              duration: 1500,
              delay: 500,
              ease: "Power2",
              onUpdate: () => {
                scoreText.setText(Math.round(counter.val) + "%");
              },
            });
          }

          const stats = [
            { l: "Points", v: d.score, c: "#fbbf24" },
            { l: "First Try", v: `${d.correct}/${d.total}`, c: "#22c55e" },
            { l: "Best Streak", v: d.bestStreak, c: "#f59e0b" },
            { l: "Games", v: `${d.total}/${d.total}`, c: "#94a3b8" },
          ];
          stats.forEach((s, i) => {
            const x = cx - 240 + i * 165,
              y = 405;
            const box = this.add
              .rectangle(x, y, 135, 60, 0x1e293b)
              .setStrokeStyle(1, 0x334155)
              .setAlpha(0);
            const val = this.add
              .text(x, y - 8, String(s.v), {
                fontSize: "20px",
                color: s.c,
                fontStyle: "bold",
              })
              .setOrigin(0.5)
              .setAlpha(0);
            const label = this.add
              .text(x, y + 14, s.l, { fontSize: "11px", color: "#64748b" })
              .setOrigin(0.5)
              .setAlpha(0);
            this.tweens.add({
              targets: [box, val, label],
              alpha: 1,
              duration: 300,
              delay: 800 + i * 150,
            });
          });

          // Previous best
          if (d.prevBest > 0 && !d.isNewHighScore) {
            this.add
              .text(cx, 460, `Personal Best: ${d.prevBest}`, {
                fontSize: "13px",
                color: "#64748b",
              })
              .setOrigin(0.5);
          }

          // Buttons with hover effects
          const btn1 = this.add
            .rectangle(cx - 110, 510, 190, 50, 0xef4444)
            .setStrokeStyle(2, 0xf87171)
            .setInteractive({ useHandCursor: true });
          const btn1Text = this.add
            .text(cx - 110, 510, "NEW SEASON", {
              fontSize: "17px",
              color: "#fff",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          btn1.on("pointerdown", () => {
            sfx.click();
            this.cameras.main.fade(400, 0, 0, 0);
            this.time.delayedCall(400, () => this.scene.start("Game"));
          });
          btn1.on("pointerover", () => {
            btn1.setFillStyle(0xdc2626);
            this.tweens.add({
              targets: [btn1, btn1Text],
              scaleX: 1.05,
              scaleY: 1.05,
              duration: 100,
            });
          });
          btn1.on("pointerout", () => {
            btn1.setFillStyle(0xef4444);
            this.tweens.add({
              targets: [btn1, btn1Text],
              scaleX: 1,
              scaleY: 1,
              duration: 100,
            });
          });

          const btn2 = this.add
            .rectangle(cx + 110, 510, 190, 50, 0x334155)
            .setStrokeStyle(2, 0x475569)
            .setInteractive({ useHandCursor: true });
          const btn2Text = this.add
            .text(cx + 110, 510, "MAIN MENU", {
              fontSize: "17px",
              color: "#94a3b8",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          btn2.on("pointerdown", () => {
            sfx.click();
            this.cameras.main.fade(400, 0, 0, 0);
            this.time.delayedCall(400, () => this.scene.start("Title"));
          });
          btn2.on("pointerover", () => {
            btn2.setFillStyle(0x475569);
            this.tweens.add({
              targets: [btn2, btn2Text],
              scaleX: 1.05,
              scaleY: 1.05,
              duration: 100,
            });
          });
          btn2.on("pointerout", () => {
            btn2.setFillStyle(0x334155);
            this.tweens.add({
              targets: [btn2, btn2Text],
              scaleX: 1,
              scaleY: 1,
              duration: 100,
            });
          });

          this.add
            .text(cx, H - 25, "Stats Slam — Neft Teacher — 6.DS.1–6.DS.6", {
              fontSize: "11px",
              color: "#475569",
            })
            .setOrigin(0.5);
          this.input.keyboard.on("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              this.cameras.main.fade(400, 0, 0, 0);
              this.time.delayedCall(400, () => this.scene.start("Game"));
            }
            if (e.key === "Escape") {
              this.cameras.main.fade(400, 0, 0, 0);
              this.time.delayedCall(400, () => this.scene.start("Title"));
            }
          });
        }
      }

      // --- CONFIG ---
      window.__flagshipGame = new Phaser.Game({
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0f172a",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, GameScene, ResultsScene],
        physics: {
          default: "arcade",
          arcade: { gravity: { y: 0 }, debug: false },
        },
        input: { keyboard: true, mouse: true, touch: true },
      });

      // --- Touch control wiring ---
      // Translates on-screen button presses into the SAME synthetic key events
      // the game already listens for (ArrowLeft/Right + Enter), so no game
      // mechanic, scoring, or answer-checking path changes. Additive only.
      (function () {
        const pad = document.getElementById("touch-controls");
        if (!pad) return;
        const isTouch =
          "ontouchstart" in window ||
          (navigator.maxTouchPoints || 0) > 0 ||
          (window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
        if (isTouch) document.body.classList.add("touch-active");

        function fireKey(key) {
          // Phaser's keyboard plugin listens on window; dispatch both down/up.
          const opts = { key: key, bubbles: true, cancelable: true };
          window.dispatchEvent(new KeyboardEvent("keydown", opts));
          window.dispatchEvent(new KeyboardEvent("keyup", opts));
        }

        // Label the Phaser canvas for assistive tech once it mounts.
        const labelCanvas = () => {
          const c = document.querySelector("canvas");
          if (c) {
            c.setAttribute("role", "img");
            c.setAttribute(
              "aria-label",
              "Stats Slam basketball statistics quiz game. Use the on-screen or arrow keys to choose an answer, then Select. Number keys 1 to 4 also answer.",
            );
          } else {
            requestAnimationFrame(labelCanvas);
          }
        };
        labelCanvas();

        pad.querySelectorAll(".tc-btn").forEach((btn) => {
          const key = btn.getAttribute("data-key");
          // pointerdown gives the snappiest, most reliable response on touch.
          btn.addEventListener(
            "pointerdown",
            (e) => {
              e.preventDefault();
              fireKey(key);
              // Leverage the shared FX kit for tactile button feedback.
              try {
                if (window.GameFX && typeof GameFX.pop === "function")
                  GameFX.pop(btn);
              } catch (err) {}
            },
            { passive: false },
          );
          // Keyboard activation of the on-screen buttons themselves.
          btn.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              fireKey(key);
            }
          });
        });
      })();
    </script>
