<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="A short family math session that adapts to real practice and saves progress on this device.">
  <title>Tonight’s Math · Family Math Tonight</title>
  <link rel="stylesheet" href="/assets/fonts/atkinson-hyperlegible-nunito-76729d.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../tutor.css">
  <link rel="stylesheet" href="./family.css">
  <link rel="stylesheet" href="./tonight.css">
  <script type="module" src="./tonight.js"></script>
</head>
<body class="tonight-page">
  <a class="skip-link" href="#main">Skip to tonight’s session</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Family Math Tonight home"><span class="brand-mark" aria-hidden="true">e</span><span>EduWonderLab <small>FAMILY MATH</small></span></a>
    <div class="top-actions">
      <label class="profile-label" for="night-profile">Learner</label>
      <select id="night-profile" aria-label="Choose learner profile"></select>
      <button id="night-language" class="language-toggle" type="button">Español</button>
    </div>
  </header>
  <main id="main" class="night-main">
    <div class="night-intro">
      <a class="back-link" href="./">← Back to family math</a>
      <p class="eyebrow" id="night-kicker">FAMILY MATH · ABOUT 5–10 MINUTES</p>
      <h1 id="night-title">Tonight’s Math</h1>
      <p id="night-description" class="night-description">A short path built from this learner’s saved practice. Pause anytime; this device saves the place.</p>
      <div id="storage-warning" class="storage-warning" role="status" hidden></div>
    </div>
    <nav class="night-progress" aria-label="Session steps" id="night-progress"></nav>
    <section id="night-panel" class="night-panel" aria-labelledby="stage-title"></section>
    <div class="night-footer-actions">
      <a class="text-button" href="./" id="pause-link">Pause and come back later</a>
      <a class="lab-return" href="../">Open the Math Fluency Lab</a>
    </div>
  </main>
</body>
</html>
