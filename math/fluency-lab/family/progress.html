<!doctype html>
<!-- @fm2 FM-024 FM-025 FM-035 FM-036 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f4fb" />
    <meta
      name="description"
      content="Streak, minutes, stars and skills for one learner, kept on this device."
    />
    <title>My Progress · Family Math · EduWonderLab</title>
    <link rel="stylesheet" href="/assets/fonts/atkinson-hyperlegible-nunito-76729d.css" />
    <link rel="stylesheet" href="./fm2/fm2.css" />
    <link rel="stylesheet" href="./fm2/page-kit.css" />
    <link rel="stylesheet" href="./fm2/progress.css" />
    <script type="module" src="./fm2/progress.js"></script>
  <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
  <link rel="stylesheet" href="/shared/save-resume/save-resume-styles.css?v=20260714-v2">
  <!-- nsr-injected:end -->
  </head>
  <body class="fm2-page pk-page progress-page">
    <a class="skip-link" href="#main" data-t="skipProgress">Skip to my progress</a>
    <header class="pk-top">
      <div class="pk-topbar">
        <a
          class="pk-brand"
          id="pk-brand"
          href="./"
          data-t-aria="brandAria"
          aria-label="Family Math home"
          ><span class="pk-brand-mark" aria-hidden="true">e</span
          ><span>EduWonderLab <small data-t="family">FAMILY MATH</small></span></a
        >
        <div class="pk-top-actions">
          <label class="pk-label" for="family-profile" data-t="learner">Learner</label>
          <select id="family-profile" data-testid="profile-select" data-fk="profile">
            <option>Learner 1 · Orbit</option>
          </select>
          <button
            type="button"
            class="pk-link-btn"
            id="add-learner"
            data-testid="add-learner"
            data-fk="add"
            data-t="addLearner"
          >
            Add learner
          </button>
          <button
            type="button"
            class="pk-link-btn"
            id="lang-toggle"
            data-testid="lang-toggle"
            data-fk="lang"
            lang="es"
          >
            Español
          </button>
        </div>
      </div>
    </header>
    <main id="main" class="pk-wrap" tabindex="-1">
      <div
        id="family-storage-warning"
        class="pk-banner"
        role="status"
        data-testid="storage-warning"
        hidden
      ></div>
      <noscript
        ><p class="pk-banner" data-testid="no-js">
          My Progress needs JavaScript to read this device’s record. · Mi progreso necesita
          JavaScript para leer el registro de este dispositivo.
        </p></noscript
      >
      <a class="pg-back" id="back-link" href="./" data-testid="back-home" data-t="back"
        >← Back to family math</a
      >
      <div class="pg-title">
        <p class="pg-eyebrow" id="learner-line" data-testid="learner-name"></p>
        <h1 id="progress-title" data-t="title">My progress</h1>
      </div>
      <div id="pg-body" data-testid="progress-body">
        <p class="pg-loading" data-t="loading">Reading this device’s record…</p>
      </div>
    </main>
    <footer class="pg-footer">
      <span>EduWonderLab · Family Math</span
      ><a href="../" data-t="backLab">Back to the Fluency Lab</a>
    </footer>
<!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
  <script src="/shared/save-resume/save-resume-engine.js?v=20261026-v3" defer></script>
  <!-- nsr-injected:end -->
  </body>
</html>
