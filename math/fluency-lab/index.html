    <script>
      // Links meant for the full lab (assignments, teacher studio, games, writing, tools) leave before paint.
      (function () {
        var p = new URLSearchParams(location.search),
          h = new URLSearchParams(location.hash.slice(1));
        var lab =
          [
            "teacher",
            "games",
            "write",
            "path",
            "notebook",
            "models",
            "practice",
            "progress",
          ].indexOf(p.get("view")) > -1 ||
          ["daily", "mission", "checkup", "realworld"].indexOf(p.get("start")) > -1 ||
          p.get("stage") === "play" ||
          h.has("assignment") ||
          h.has("factplan") ||
          h.has("videos") ||
          h.has("board") ||
          p.has("diagnostics") ||
          p.has("publisher-demo") ||
          p.has("tour") ||
          p.has("profile");
        if (lab) location.replace("lab.html" + location.search + location.hash);
      })();
    </script>
