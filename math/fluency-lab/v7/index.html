<body class="v7" data-band="3-4">
<a class="v7-skip" href="#v7-main">Skip to the lesson</a>
<header class="v7-bar"><div class="v7-wrap">
  <a id="v7-back" class="v7-back" href="../">← Fluency Lab</a>
  <h1 id="v7-title">Math</h1>
  <button id="v7-lang" class="v7-btn" type="button" lang="es">Español</button>
</div></header>
<main id="v7-main" class="v7-wrap">
  <p id="v7-meta" class="v7-meta"></p>
  <div class="v7-stage">
    <section class="v7-card" aria-labelledby="v7-stage-h"><h2 id="v7-stage-h">See it</h2><p id="v7-stage-note" class="v7-meta"></p><div id="v7-model" class="e8ml-workspace"></div>
      <div class="v7-row"><button id="v7-show" class="v7-btn" type="button" hidden>Show my problem in the picture</button></div></section>
    <div style="display:grid;gap:var(--v7-gap);align-content:start">
      <section class="v7-card" aria-labelledby="v7-resp-h">
        <h2 id="v7-resp-h">Try it</h2>
        <p id="v7-q" class="v7-q"></p>
        <div class="v7-row">
          <label id="v7-ask-label" for="v7-answer">What is the answer?</label>
          <input id="v7-answer" class="v7-input" inputmode="text" autocomplete="off">
          <button id="v7-check" class="v7-btn primary" type="button">Check</button>
        </div>
        <div id="v7-feedback" class="v7-feedback" role="status" aria-live="polite"></div>
        <div class="v7-row"><button id="v7-next" class="v7-btn" type="button">Another one</button></div>
      </section>
      <section class="v7-card v7-coach" aria-labelledby="v7-coach-h">
        <h2 id="v7-coach-h">Coach</h2>
        <button id="v7-help" class="v7-btn" type="button">Help me understand</button>
        <ol id="v7-log" class="v7-coach-log" aria-live="polite"></ol>
      </section>
    </div>
  </div>
</main>
<script type="module" src="./workspace.js"></script>
