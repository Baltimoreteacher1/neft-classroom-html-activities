    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='11' fill='%2317324d'/%3E%3Cpath d='m18 5 3.5 9.5L31 18l-9.5 3.5L18 31l-3.5-9.5L5 18l9.5-3.5Z' fill='%23f2c15b'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/fonts/fraunces-87aa83.css" />
    <link rel="stylesheet" href="/assets/fonts/atkinson-hyperlegible-nunito-76729d.css" />
    <link rel="stylesheet" href="./expedition.css" />
    <link rel="stylesheet" href="./models.css" />
    <link rel="stylesheet" href="./stops.css" />
    <script type="module" src="./main.js"></script>

  <body>
    <a class="skip" href="#content">Skip to the expedition · Ir a la expedición</a>
    <header class="top">
      <a class="brand" id="brand" href="../">← Math Fluency Lab</a>
      <div class="top-actions">
        <div class="lang" role="group" aria-label="Language / Idioma" id="lang"></div>

    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    <main id="content" tabindex="-1"></main>
    <footer id="foot" class="foot"></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="printSheet" class="print-sheet"></div>
    <noscript
      ><p class="noscript">
        Turn on JavaScript to use the Family Math Expedition, or go to
