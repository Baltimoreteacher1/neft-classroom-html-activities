    <script>
      // ── Decorative ember-field builder + pointer parallax (gameplay-neutral) ──
      (function () {
        var layer = document.getElementById("ff-bg-layer");
        if (!layer) return;
        var reduce =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var frag = document.createDocumentFragment();
        // soft heat glows near the bottom (the "furnace")
        var glowColors = ["#ff7b1a", "#ffb347", "#e8431f"];
        for (var g = 0; g < 3; g++) {
          var gl = document.createElement("div");
          gl.className = "ff-glow";
          var gs = 180 + Math.random() * 220;
          gl.style.width = gs + "px";
          gl.style.height = gs + "px";
          gl.style.left = 10 + Math.random() * 80 + "%";
          gl.style.bottom = -40 + Math.random() * 30 + "%";
          gl.style.background = glowColors[g % glowColors.length];
          frag.appendChild(gl);
        }
        // rising embers
        var n = reduce ? 18 : 46;
        for (var i = 0; i < n; i++) {
          var s = document.createElement("div");
          s.className = "ff-ember";
          var sz = 1.5 + Math.random() * 3.5;
          s.style.width = sz + "px";
          s.style.height = sz + "px";
          s.style.left = Math.random() * 100 + "%";
          s.style.top = 40 + Math.random() * 60 + "%";
          s.style.background = Math.random() > 0.5 ? "#ffb347" : "#ff7b1a";
          s.style.setProperty("--ff", 4 + Math.random() * 6 + "s");
          s.style.animationDelay = -Math.random() * 6 + "s";
          frag.appendChild(s);
        }
        layer.appendChild(frag);
        if (reduce) return;
        window.addEventListener(
          "pointermove",
          function (e) {
            var tx = (e.clientX / window.innerWidth - 0.5) * -22;
            var ty = (e.clientY / window.innerHeight - 0.5) * -14;
            layer.style.transform = "translate3d(" + tx + "px," + ty + "px,0)";
          },
          { passive: true },
        );
      })();

    <script>
      // ════════════════════════════════════════════════════════════════════
      //  FRACTION FOUNDRY   ·   Unit 2 · 6.NOS.1
      //  Divide whole numbers by unit fractions, fractions by fractions, and
      //  mixed numbers. Bar / area visual models are the core of each problem.
      //  Math engine stress-tested 2000x in Node (0 issues) before shipping.
      // ════════════════════════════════════════════════════════════════════
      const W = 900,
        H = 620;

      const C = {
        bg: 0x1a0f06,
        panel: 0x2a1809,
        panelEdge: 0x6b3d18,
        ink: "#fdeede",
        sub: "#e0b487",
        accent: 0xffb347,
        good: 0x6bd18b,
        bad: 0xff6b6b,
        gold: 0xffcd4d,
        bar: 0xffb347,
        barEmpty: 0x3a2410,
        molten: 0xff7b1a,
      };

      // ── small helpers ──
      const FF_RM_QUERY =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)");
      const reducedMotion = () => !!(FF_RM_QUERY && FF_RM_QUERY.matches);
      const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
      const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
      function gcd(a, b) {
        a = Math.abs(a);
        b = Math.abs(b);
        while (b) {
          [a, b] = [b, a % b];
        }
        return a || 1;
      }
      // Fraction as {n, d}; always reduced with positive denominator.
      function fr(n, d) {
        if (d < 0) {
          n = -n;
          d = -d;
        }
        const g = gcd(n, d);
        return { n: n / g, d: d / g };
      }
      const frVal = (f) => f.n / f.d;
      function frStr(f) {
        const { n, d } = f;
        if (d === 1) return String(n);
        if (Math.abs(n) > d) {
          const whole = Math.trunc(n / d);
          const rem = Math.abs(n % d);
          if (rem === 0) return String(whole);
          return `${whole} ${rem}/${d}`;
        }
        return `${n}/${d}`;
      }

      // ── Question generator (the model IS the interaction) ──
      // Two mechanics, five levels. Every quotient is a whole number so the
      // bar model can literally show "how many fit":
      //   L1 partition: whole ÷ unit fraction — slice each whole, count pieces
      //   L2 partition: same, word problems + bigger numbers
      //   L3 group:     whole ÷ fraction — slice, then bundle divisor groups
      //   L4 group:     fraction ÷ fraction word problems
      //   L5 group:     mixed number ÷ fraction
      function groupCaseOk(level, dividend, divisor) {
        const val = frVal(dividend);
        if (!(val > 0) || val > 4 + 1e-9) return false;
        if (level === 3)
          return divisor.n >= 2 && dividend.d === 1 && dividend.n >= 2;
        if (level === 4) return dividend.d > 1 && val <= 3 + 1e-9;
        // level 5: a true mixed number (greater than 1, not whole)
        return dividend.d > 1 && val > 1;
      }

      function makeQuestion(level) {
        if (level <= 2) {
          // ── partition mode: slice each whole into 1/d, count the pieces ──
          const whole = level === 1 ? randInt(2, 4) : randInt(2, 6);
          const d = level === 1 ? choice([2, 3, 4]) : choice([2, 3, 4, 5]);
          const dividend = fr(whole, 1);
          const divisor = fr(1, d);
          const answer = whole * d;
          let prompt;
          if (level === 1) {
            prompt = `How many 1/${d}-size pieces fit in ${whole} whole${whole > 1 ? "s" : ""}?   ${whole} ÷ 1/${d} = ?`;
          } else {
            const ctx = choice([
              { v: "cups", s: "scoops" },
              { v: "meters", s: "ribbons" },
              { v: "pizzas", s: "slices" },
              { v: "liters", s: "bottles" },
            ]);
            prompt = `How many 1/${d}-${ctx.v.slice(0, -1)} ${ctx.s} fit in ${whole} ${ctx.v}?   ${whole} ÷ 1/${d} = ?`;
          }
          return {
            level,
            mode: "partition",
            dividend,
            divisor,
            whole,
            d,
            wholes: whole,
            answer,
            prompt,
            explain: `${whole} ÷ 1/${d} = ${whole} × ${d} = ${answer}. Each whole holds ${d} pieces of size 1/${d}.`,
          };
        }

        // ── group mode: dividend = k × divisor, so exactly k groups fit ──
        let divisor = fr(2, 3),
          k = 3,
          dividend = fr(2, 1);
        let guard = 0,
          ok = false;
        while (guard++ < 80 && !ok) {
          const d2 = level === 3 ? choice([2, 3, 4, 5, 6]) : choice([2, 3, 4]);
          const n2 = randInt(1, d2 - 1);
          divisor = fr(n2, d2);
          k = randInt(2, 6);
          dividend = fr(divisor.n * k, divisor.d);
          ok = groupCaseOk(level, dividend, divisor);
        }
        if (!ok) {
          // deterministic fallbacks (always valid for their level)
          if (level === 3) {
            divisor = fr(2, 3);
            k = 3;
            dividend = fr(2, 1); // 2 ÷ 2/3 = 3
          } else if (level === 4) {
            divisor = fr(1, 4);
            k = 3;
            dividend = fr(3, 4); // 3/4 ÷ 1/4 = 3
          } else {
            divisor = fr(1, 4);
            k = 6;
            dividend = fr(3, 2); // 1 1/2 ÷ 1/4 = 6
          }
        }
        const answer = k;
        let prompt;
        if (level === 3) {
          prompt = `How many groups of ${frStr(divisor)} fit in ${frStr(dividend)}?   ${frStr(dividend)} ÷ ${frStr(divisor)} = ?`;
        } else if (level === 4) {
          const ctx = choice([
            { one: "cup of flour", many: "cups of flour" },
            { one: "yard of rope", many: "yards of rope" },
            { one: "pan of brownies", many: "pans of brownies" },
            { one: "bottle of paint", many: "bottles of paint" },
          ]);
          const amount =
            frVal(dividend) > 1
              ? `${frStr(dividend)} ${ctx.many}`
              : `${frStr(dividend)} of a ${ctx.one}`;
          prompt = `A batch uses ${frStr(divisor)} of a ${ctx.one}. With ${amount}, how many full batches?   ${frStr(dividend)} ÷ ${frStr(divisor)} = ?`;
        } else {
          prompt = `Divide: ${frStr(dividend)} ÷ ${frStr(divisor)} = ?  (How many ${frStr(divisor)}-groups fit in ${frStr(dividend)}?)`;
        }
        return {
          level,
          mode: "group",
          dividend,
          divisor,
          wholes: Math.max(1, Math.ceil(frVal(dividend) - 1e-9)),
          answer,
          prompt,
          explain: `${frStr(dividend)} ÷ ${frStr(divisor)} = ${answer}. The bar shows ${frStr(dividend)} split into ${answer} full groups of ${frStr(divisor)}.`,
        };
      }

      // ── sound (tiny WebAudio synth; safe no-op if unsupported) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx) {
            try {
              this.ctx = new (
                window.AudioContext || window.webkitAudioContext
              )();
            } catch (e) {}
          }
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        tick() {
          this.play("square", 520, 0.04, 0.06);
        },
        correct() {
          [660, 880].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.14, 0.22), i * 70),
          );
        },
        wrong() {
          this.play("sawtooth", 190, 0.28, 0.16);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.16, 0.22), i * 80),
          );
        },
        win() {
          [523, 659, 784, 880, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.22, 0.26), i * 100),
          );
        },
        lose() {
          [400, 330, 260, 180].forEach((f, i) =>
            setTimeout(() => this.play("sawtooth", f, 0.3, 0.14), i * 170),
          );
        },
      };

      const TOTAL_LEVELS = 5;
      const START_LIVES = 3;
      const LS_KEY = "fraction_foundry_highscore";

      // ════════════════════════════════════════════════════════════════════
      //  BOOT — generate small reusable textures
      // ════════════════════════════════════════════════════════════════════
      class BootScene extends Phaser.Scene {
        constructor() {
          super("Boot");
        }
        create() {
          const g = this.make.graphics({ add: false });
          g.fillStyle(0xffffff).fillCircle(4, 4, 4);
          g.generateTexture("dot", 8, 8);
          g.clear();
          g.fillStyle(0xffffff).fillRect(0, 0, 7, 4);
          g.generateTexture("chip", 7, 4);
          g.clear();
          g.fillStyle(0xffffff, 0.85).fillCircle(10, 10, 10);
          g.generateTexture("glow", 20, 20);
          g.clear();
          g.destroy();
          this.scene.start("Title");
        }
      }

      // ════════════════════════════════════════════════════════════════════
      //  TITLE
      // ════════════════════════════════════════════════════════════════════
      class TitleScene extends Phaser.Scene {
        constructor() {
          super("Title");
        }
        create() {
          this.cameras.main.setBackgroundColor(C.bg);
          const cx = W / 2;

          // floating crucible emblem
          const badge = this.add.container(cx, 148);
          const pot = this.add
            .rectangle(0, 6, 96, 56, 0x3a2410)
            .setStrokeStyle(3, C.accent);
          const molten = this.add
            .rectangle(0, -8, 80, 18, C.molten)
            .setStrokeStyle(2, C.gold);
          const lip1 = this.add.rectangle(-54, -18, 16, 8, 0x3a2410);
          const lip2 = this.add.rectangle(54, -18, 16, 8, 0x3a2410);
          badge.add([pot, molten, lip1, lip2]);
          if (!reducedMotion()) {
            this.tweens.add({
              targets: badge,
              y: 136,
              duration: 1600,
              yoyo: true,
              repeat: -1,
              ease: "Sine.inOut",
            });
            this.tweens.add({
              targets: molten,
              scaleX: { from: 1, to: 1.06 },
              alpha: { from: 1, to: 0.8 },
              duration: 900,
              yoyo: true,
              repeat: -1,
            });
          }

          this.add
            .text(cx, 250, "FRACTION FOUNDRY", {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "52px",
              fontStyle: "900",
              color: "#ffb347",
            })
            .setOrigin(0.5);
          this.add
            .text(cx, 296, "Forge answers by dividing fractions", {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "22px",
              fontStyle: "bold",
              color: "#ffcd4d",
            })
            .setOrigin(0.5);
          this.add
            .text(
              cx,
              348,
              "YOU slice the bar models, then count pieces or bundle groups\nto forge each quotient. Five rising levels, no timer — take your time.",
              {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "17px",
                color: "#e0b487",
                align: "center",
                lineSpacing: 6,
              },
            )
            .setOrigin(0.5);
          this.add
            .text(cx, 402, "Grade 6 · Unit 2 · Standard 6.NOS.1", {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffb347",
            })
            .setOrigin(0.5);

          const hs = localStorage.getItem(LS_KEY);
          if (hs) {
            this.add
              .text(cx, 430, `HIGH SCORE: ${hs}`, {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "14px",
                fontStyle: "bold",
                color: "#ffcd4d",
              })
              .setOrigin(0.5);
          }

          this.makeButton(cx, 478, "▶  START FORGING", 0xc4661a, () => {
            SFX.init();
            SFX.tick();
            this.scene.start("Game", {
              level: 0,
              score: 0,
              lives: START_LIVES,
            });
          });

          this.add
            .text(
              cx,
              542,
              "Slice with + / − (or tap the buttons), tap the bar or use ← → to count, Enter to forge.",
              {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "14px",
                color: "#c79a6f",
              },
            )
            .setOrigin(0.5);
          this.setSR(
            "Fraction Foundry. Slice bar models yourself to divide fractions, standard 6.NOS.1. Press start to play.",
          );
          this.input.keyboard.on("keydown-SPACE", () => {
            SFX.init();
            this.scene.start("Game", {
              level: 0,
              score: 0,
              lives: START_LIVES,
            });
          });
        }
        makeButton(x, y, label, color, cb) {
          const b = this.add
            .rectangle(x, y, 300, 58, color)
            .setStrokeStyle(3, 0xffcd4d, 0.9)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(x, y, label, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "22px",
              fontStyle: "bold",
              color: "#fff",
            })
            .setOrigin(0.5);
          b.on("pointerover", () => b.setScale(1.04));
          b.on("pointerout", () => b.setScale(1));
          b.on("pointerdown", cb);
          return b;
        }
        setSR(msg) {
          const el = document.getElementById("ff-sr");
          if (el) el.textContent = msg;
        }
      }

      // ════════════════════════════════════════════════════════════════════
      //  GAME
      // ════════════════════════════════════════════════════════════════════
      class GameScene extends Phaser.Scene {
        constructor() {
          super("Game");
        }
        init(data) {
          this.levelIndex = data.level || 0;
          this.score = data.score || 0;
          this.lives = data.lives != null ? data.lives : START_LIVES;
          this.streak = 0;
          this.locked = false;
          this.qInLevel = 0;
          this.qPerLevel = 3; // rounds to clear a level (each is hands-on)
          this.correctInLevel = 0;
        }
        create() {
          this.cameras.main.setBackgroundColor(C.bg);
          this.buildHUD();
          this.buildModelArea();
          this.buildControlPanel();
          this.bindKeys();
          this.nextQuestion();
          this.cameras.main.fadeIn(400);
        }

        // Every action has a keyboard path: + / − (or ↑ ↓) re-slice the bar,
        // ← → adjust the piece / group count, Enter forges the answer.
        bindKeys() {
          const kb = this.input.keyboard;
          const cuts = (d) => this.nudgeCuts(d);
          const count = (d) => this.nudgeCount(d);
          ["PLUS", "NUMPAD_ADD", "UP"].forEach((k) =>
            kb.on("keydown-" + k, () => cuts(1)),
          );
          ["MINUS", "NUMPAD_SUBTRACT", "DOWN"].forEach((k) =>
            kb.on("keydown-" + k, () => cuts(-1)),
          );
          kb.on("keydown-RIGHT", () => count(1));
          kb.on("keydown-LEFT", () => count(-1));
          kb.on("keydown-ENTER", () => this.forge());
        }

        // ── HUD ──
        buildHUD() {
          this.add.rectangle(W / 2, 30, W, 60, C.panel).setDepth(1);
          this.add.rectangle(W / 2, 60, W, 2, C.panelEdge).setDepth(1);
          this.add
            .text(20, 18, "🥧 Fraction Foundry", {

        refreshHUD() {
          this.scoreT.setText(String(this.score));
          this.levelT.setText(`${this.levelIndex + 1} / ${TOTAL_LEVELS}`);
          this.streakT.setText(this.streak > 0 ? `×${this.streak}` : "—");

        // ── Visual model area (left): the bar model YOU slice and count ──
        buildModelArea() {
          this.add
            .rectangle(250, 350, 460, 480, C.panel)
            .setStrokeStyle(2, C.panelEdge);
          this.add
            .text(250, 132, "YOUR BAR MODEL — TAP IT", {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "13px",
              fontStyle: "bold",
              color: "#c79a6f",
            })
            .setOrigin(0.5);
          this.modelGfx = this.add.graphics();
          this.modelLabels = []; // text objects to clear on each redraw
          this.modelHits = []; // interactive tap zones (one per whole-bar row)
        }

        clearModel() {
          this.modelGfx.clear();
          this.modelLabels.forEach((t) => t.destroy());
          this.modelLabels = [];
          this.modelHits.forEach((z) => z.destroy());
          this.modelHits = [];
        }

        modelText(x, y, str, color, size, origin) {
          const t = this.add
            .text(x, y, str, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: (size || 13) + "px",
              fontStyle: "bold",
              color: color || "#fdeede",
            })
            .setOrigin(origin == null ? 0.5 : origin, 0.5);
          this.modelLabels.push(t);
          return t;
        }

        // ── Model state helpers ────────────────────────────────────────────
        // At the current slicing, how many pieces make up the dividend and
        // one divisor group? Valid only when both land on whole pieces.
        sliceInfo() {
          const q = this.current;
          const aU = (q.dividend.n * this.cuts) / q.dividend.d;
          const bU = (q.divisor.n * this.cuts) / q.divisor.d;
          return {
            aUnits: aU,
            bUnits: bU,
            valid: Number.isInteger(aU) && Number.isInteger(bU) && bU >= 1,
          };
        }

        nudgeCuts(delta) {
          if (this.locked || !this.current) return;
          const max = this.current.mode === "partition" ? 10 : 12;
          const next = Phaser.Math.Clamp(this.cuts + delta, 1, max);
          if (next === this.cuts) return;
          this.cuts = next;
          // piece size changed, so any count made of old pieces resets
          this.sel = 0;
          this.groups = 0;
          SFX.tick();
          this.renderModel();
        }

        nudgeCount(delta) {
          if (this.locked || !this.current) return;
          const q = this.current;
          if (q.mode === "partition") {
            this.sel = Phaser.Math.Clamp(
              this.sel + delta,
              0,
              q.whole * this.cuts,
            );
          } else {
            const info = this.sliceInfo();
            if (!info.valid) {
              this.say(
                `Slice first: use + / − until ${frStr(q.divisor)} lines up with whole pieces.`,
              );
              return;
            }
            const maxG = Math.floor((q.wholes * this.cuts) / info.bUnits);
            this.groups = Phaser.Math.Clamp(this.groups + delta, 0, maxG);
          }
          SFX.tick();
          this.renderModel();
        }

        // Tap anywhere on a whole-bar row: pick pieces (partition) or bundle
        // runs of pieces into divisor-sized groups (group mode).
        tapRow(row, localX) {
          if (this.locked || !this.current) return;
          const q = this.current;
          const pieceW = 390 / this.cuts;
          const p = Phaser.Math.Clamp(
            Math.floor(localX / pieceW),
            0,
            this.cuts - 1,
          );
          const u = row * this.cuts + p; // global piece index
          if (q.mode === "partition") {
            // prefix-select up to the tapped piece; tap the last one to undo
            this.sel = u + 1 === this.sel ? u : u + 1;
          } else {
            const info = this.sliceInfo();
            if (!info.valid) {
              this.say(
                `Slice first: use + / − until ${frStr(q.divisor)} lines up with whole pieces.`,
              );
              return;
            }
            const gi = Math.floor(u / info.bUnits); // group holding this piece
            const maxG = Math.floor((q.wholes * this.cuts) / info.bUnits);
            const want = gi + 1;
            this.groups = want === this.groups ? gi : Math.min(want, maxG);
          }
          SFX.tick();
          this.renderModel();
        }

        addRowHitZone(x, y, w, h, row) {
          const z = this.add
            .zone(x, y, w, h)
            .setOrigin(0)
            .setInteractive({ useHandCursor: true });
          z.on("pointerdown", (pointer, localX) => this.tapRow(row, localX));
          this.modelHits.push(z);
        }

        say(msg) {
          this.fbText.setColor("#ffcd4d").setText(msg);
          this.setSR(msg);
        }

        // ── Redraw the whole model + readouts from current state ──
        renderModel() {
          this.clearModel();
          const q = this.current;
          this.cutsVal.setText(frStr(fr(1, this.cuts)));
          if (q.mode === "partition") {
            this.countVal.setText(String(this.sel));
            this.drawPartition(q);
          } else {
            this.countVal.setText(String(this.groups));
            this.drawGroups(q);
          }
        }

        // Partition mode: `whole` bars; the student slices each into `cuts`
        // pieces and prefix-selects pieces to count how many 1/d fill them.
        drawPartition(q) {
          const g = this.modelGfx;
          const left = 55,
            fullW = 390,
            top = 170;
          const rows = q.whole;
          const rowH = Math.min(52, (420 - top) / rows - 12);
          const pieceW = fullW / this.cuts;
          for (let r = 0; r < rows; r++) {
            const y = top + r * (rowH + 12);
            for (let p = 0; p < this.cuts; p++) {
              const u = r * this.cuts + p;
              const px = left + p * pieceW;
              const picked = u < this.sel;
              g.fillStyle(picked ? C.molten : C.barEmpty, picked ? 0.95 : 0.9);
              g.fillRect(px + 1.5, y + 1.5, pieceW - 3, rowH - 3);
              if (picked) {
                g.lineStyle(2, C.gold, 1);
                g.strokeRect(px + 1.5, y + 1.5, pieceW - 3, rowH - 3);
              }
              if (this.cuts > 1 && pieceW >= 34)
                this.modelText(
                  px + pieceW / 2,
                  y + rowH / 2,
                  `1/${this.cuts}`,
                  picked ? "#2a1809" : "#8a6a48",
                  Math.min(14, pieceW / 3),
                );
            }
            // slice lines + whole-bar outline on top
            g.lineStyle(1, 0x6b3d18, 0.9);
            for (let p = 1; p < this.cuts; p++) {
              const sx = left + p * pieceW;
              g.lineBetween(sx, y, sx, y + rowH);
            }
            g.lineStyle(2, C.gold, 0.9);
            g.strokeRect(left, y, fullW, rowH);
            this.modelText(left - 10, y + rowH / 2, "1", "#e0b487", 14, 1);
            this.addRowHitZone(left, y, fullW, rowH, r);
          }
          this.modelText(
            250,
            452,
            this.cuts === 1
              ? "Press + to slice every whole into equal pieces."
              : `Each whole = ${this.cuts} pieces of 1/${this.cuts}. Tap pieces to count them.`,
            "#e0b487",
            13,
          );
          this.readout.setText(
            `${q.whole} whole${q.whole > 1 ? "s" : ""} ÷ 1/${q.d} → ${this.sel} piece${this.sel === 1 ? "" : "s"} picked`,
          );
        }

        // Group mode: shade the dividend, slice, then bundle runs of pieces
        // into groups the size of the divisor. Full groups = the quotient.
        drawGroups(q) {
          const g = this.modelGfx;
          const left = 55,
            fullW = 390,
            top = 170;
          const rows = q.wholes;
          const rowH = Math.min(58, (420 - top) / rows - 12);
          const pieceW = fullW / this.cuts;
          const val = frVal(q.dividend);
          const info = this.sliceInfo();
          const grouped = info.valid ? this.groups * info.bUnits : 0;

          for (let r = 0; r < rows; r++) {
            const y = top + r * (rowH + 12);
            // 1) shade the dividend amount continuously (works even when the
            //    current slicing does not line up with it)
            const frac = Phaser.Math.Clamp(val - r, 0, 1);
            if (frac > 0) {
              g.fillStyle(C.bar, 0.55);
              g.fillRect(left + 1.5, y + 1.5, fullW * frac - 3, rowH - 3);
            }
            // 2) bundled pieces: bright molten, alternating per group
            for (let p = 0; p < this.cuts; p++) {
              const u = r * this.cuts + p;
              if (u >= grouped) break;
              const gi = Math.floor(u / info.bUnits);
              const px = left + p * pieceW;
              const inDividend = u < info.aUnits;
              if (inDividend) {
                g.fillStyle(gi % 2 === 0 ? C.molten : 0xe8431f, 0.95);
                g.fillRect(px + 1.5, y + 1.5, pieceW - 3, rowH - 3);
              } else {
                // group ran past the dividend — empty piece inside a group
                g.fillStyle(C.bad, 0.28);
                g.fillRect(px + 1.5, y + 1.5, pieceW - 3, rowH - 3);
                g.lineStyle(2, C.bad, 0.9);
                g.strokeRect(px + 1.5, y + 1.5, pieceW - 3, rowH - 3);
              }
            }
            // 3) slice lines + whole-bar outline
            g.lineStyle(1, 0x6b3d18, 0.9);
            for (let p = 1; p < this.cuts; p++) {
              const sx = left + p * pieceW;
              g.lineBetween(sx, y, sx, y + rowH);
            }
            g.lineStyle(2, C.gold, 0.9);
            g.strokeRect(left, y, fullW, rowH);
            this.modelText(left - 10, y + rowH / 2, "1", "#e0b487", 14, 1);
            this.addRowHitZone(left, y, fullW, rowH, r);
          }

          // 4) thick group boundaries + a number on each bundled group
          if (info.valid && this.groups > 0) {
            g.lineStyle(3, 0x2a1809, 1);
            for (let gi = 0; gi <= this.groups; gi++) {
              const idx = gi * info.bUnits;
              const r = Math.floor(idx / this.cuts);
              const col = idx % this.cuts;
              if (r >= rows && col === 0) continue; // boundary at the very end
              const rr = Math.min(r, rows - 1);
              const bx = left + (r >= rows ? this.cuts : col) * pieceW;
              const by = top + rr * (rowH + 12);
              g.lineBetween(bx, by - 4, bx, by + rowH + 4);
            }
            for (let gi = 0; gi < this.groups; gi++) {
              const mid = gi * info.bUnits + (info.bUnits - 1) / 2;
              const r = Math.floor(mid / this.cuts);
              const col = mid - r * this.cuts;
              this.modelText(
                left + (col + 0.5) * pieceW,
                top + r * (rowH + 12) + rowH / 2,
                String(gi + 1),
                "#2a1809",
                Math.min(16, pieceW / 2 + 6),
              );
            }
          }

          this.modelText(
            250,
            452,
            info.valid
              ? `Shaded bar = ${frStr(q.dividend)}. Tap pieces to bundle groups of ${frStr(q.divisor)}.`
              : `Shaded bar = ${frStr(q.dividend)}. Slice with + until ${frStr(q.divisor)} lines up with whole pieces.`,
            "#e0b487",
            13,
          );
          this.readout.setText(
            info.valid
              ? `${frStr(q.dividend)} ÷ ${frStr(q.divisor)} → ${this.groups} full group${this.groups === 1 ? "" : "s"}`
              : this.cuts === 1
                ? `Press + to slice the bar into equal pieces.`
                : `Pieces of 1/${this.cuts} don't line up with ${frStr(q.divisor)} yet — keep slicing.`,
          );
        }

        // ── Control panel (right): prompt, live readout, steppers, FORGE ──

            })
            .setOrigin(0.5);

          this.mkStepBtn(812, 426, "+", () => this.nudgeCount(1));
          this.countVal = this.add
            .text(700, 426, "0", {

            })
            .setOrigin(0.5);
          const fbtn = this.add

            .setOrigin(0.5);

        // Big calm stepper button (60×52 — comfy tap target, no dragging).
        mkStepBtn(x, y, label, cb) {
          const b = this.add
            .rectangle(x, y, 60, 52, 0x3a2410)
            .setStrokeStyle(2, C.panelEdge)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(x, y, label, {
              fontFamily: "Segoe UI, sans-serif",

              fontStyle: "bold",
              color: "#ffb347",
            })
            .setOrigin(0.5);
          b.on("pointerover", () => b.setFillStyle(0x5a3614));
          b.on("pointerout", () => b.setFillStyle(0x3a2410));
          b.on("pointerdown", cb);
          return b;
        }

        kindLabel(q) {
          if (q.mode === "partition")
            return "WHOLE ÷ UNIT FRACTION · SLICE & COUNT";
          if (q.level === 3) return "WHOLE ÷ FRACTION · SLICE & GROUP";
          if (q.level === 4) return "FRACTION ÷ FRACTION · SLICE & GROUP";
          return "MIXED NUMBER ÷ FRACTION · SLICE & GROUP";
        }

        // ── round lifecycle ──
        nextQuestion() {
          this.locked = false;
          this.missesThisRound = 0;
          const q = makeQuestion(this.levelIndex + 1);
          this.current = q;
          this.cuts = 1;
          this.sel = 0;
          this.groups = 0;
          this.kindChip.setText(this.kindLabel(q));
          this.qText.setText(q.prompt);
          this.fbText.setText("");
          this.caption2.setText(
            q.mode === "partition"
              ? "PIECES PICKED — keys ← →"
              : "FULL GROUPS — keys ← →",
          );
          this.renderModel();
          this.setSR(
            `Level ${this.levelIndex + 1}. ${q.prompt} Slice the bar with plus and minus. ` +
              (q.mode === "partition"
                ? "Tap the bar or use left and right arrows to pick pieces. "
                : "Tap the bar or use left and right arrows to bundle full groups. ") +
              "Press Enter to forge your answer.",
          );
        }

        // Judge the MODEL, not a picked option: the slicing and the count the
        // student built must show the division. Returns { correct, why }.
        judge() {
          const q = this.current;
          if (q.mode === "partition") {
            if (this.cuts !== q.d)
              return {
                correct: false,
                why:
                  this.cuts === 1
                    ? `The wholes aren't sliced yet. Use + to slice each whole into ${q.d} equal pieces of 1/${q.d}.`
                    : `Your pieces are 1/${this.cuts} each, but the problem asks about 1/${q.d}-size pieces. Re-slice each whole into ${q.d} equal pieces.`,
              };
            if (this.sel !== q.answer)
              return {
                correct: false,
                why: `Right piece size (1/${q.d}), but you picked ${this.sel}. Each whole holds ${q.d} pieces of 1/${q.d} — count every piece in all ${q.whole} wholes.`,
              };
            return { correct: true };
          }
          const info = this.sliceInfo();
          if (!info.valid)
            return {
              correct: false,
              why:
                this.cuts === 1
                  ? `The bar isn't sliced yet. Use + to slice until ${frStr(q.divisor)} lines up with whole pieces.`
                  : `Pieces of 1/${this.cuts} don't line up with ${frStr(q.divisor)}. Slice so ${frStr(q.divisor)} is a whole number of pieces.`,
            };
          if (this.groups !== q.answer) {
            if (info.bUnits > 1 && this.groups === info.aUnits)
              return {
                correct: false,
                why: `You made groups of 1/${this.cuts}, but we need groups of ${frStr(q.divisor)} — each group takes ${info.bUnits} pieces of 1/${this.cuts}.`,
              };
            if (this.groups > q.answer)
              return {
                correct: false,
                why: `Group ${this.groups} reaches past the shaded ${frStr(q.dividend)} — it has empty pieces, so it is not a full group of ${frStr(q.divisor)}.`,
              };
            return {
              correct: false,
              why: `You bundled ${this.groups} group${this.groups === 1 ? "" : "s"} of ${frStr(q.divisor)}, but shaded pieces are still left over — more full groups fit.`,
            };
          }
          return { correct: true };
        }

        forge() {
          if (this.locked || !this.current) return;
          SFX.init();
          const q = this.current;
          const res = this.judge();

          if (res.correct) {
            this.locked = true;
            this.streak++;
            this.correctInLevel++;
            this.qInLevel++;
            const gain = 100 + Math.min(this.streak, 5) * 20;
            this.score += gain;
            this.fbText
              .setColor("#6bd18b")
              .setText(`✓ +${gain}   ${q.explain}`);
            SFX.correct();
            this.burst(700, 490, C.good);
            this.setSR(`Correct. ${q.explain}`);
            this.refreshHUD();
            this.time.delayedCall(1500, () => {
              if (this.qInLevel >= this.qPerLevel) return this.completeLevel();
              this.nextQuestion();
            });
            return;
          }

          // Wrong forge: explain WHY from the model state, then let the
          // student adjust the same model and forge again — self-paced.
          this.streak = 0;
          this.lives--;
          this.missesThisRound++;
          this.fbText.setColor("#ff9b9b").setText(`✗ Not yet — ${res.why}`);
          SFX.wrong();
          if (!reducedMotion()) this.cameras.main.shake(170, 0.006);
          this.setSR(`Not yet. ${res.why} Adjust the model and forge again.`);
          if (this.lives <= 0) {
            // No-fail: refill hearts and keep the run going.
            this.lives = START_LIVES;
            const refill = this.add
              .text(W / 2, H / 2, "❤ Refilled — keep going!", {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "26px",
                fontStyle: "bold",
                color: "#6bd18b",
              })
              .setOrigin(0.5)
              .setDepth(15);
            this.tweens.add({
              targets: refill,
              y: refill.y - 50,
              alpha: 0,
              duration: 1400,
              onComplete: () => refill.destroy(),
            });
            this.setSR(
              `Not yet. ${res.why} Hearts refilled — keep going, adjust the model and forge again.`,
            );
          }
          this.refreshHUD();
        }

        burst(x, y, color) {
          const p = this.add.particles(x, y, "dot", {
            speed: { min: 60, max: 180 },
            angle: { min: 0, max: 360 },
            scale: { start: 1, end: 0 },
            lifespan: 500,
            quantity: reducedMotion() ? 5 : 14,
            tint: color,
          });
          this.time.delayedCall(550, () => p.destroy());
        }

        completeLevel() {
          SFX.level();
          this.score += 150; // level clear bonus
          this.refreshHUD();
          const last = this.levelIndex + 1 >= TOTAL_LEVELS;
          const ov = this.add.container(0, 0).setDepth(20);
          ov.add(this.add.rectangle(W / 2, H / 2, W, H, 0x140a03, 0.82));
          ov.add(
            this.add
              .text(W / 2, 215, "LEVEL FORGED!", {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "44px",
                fontStyle: "900",
                color: "#6bd18b",
              })
              .setOrigin(0.5),
          );
          ov.add(
            this.add
              .text(
                W / 2,
                284,
                `${this.correctInLevel} / ${this.qPerLevel} correct this level\n+150 bonus`,
                {
                  fontFamily: "Segoe UI, sans-serif",
                  fontSize: "20px",
                  color: "#fdeede",
                  align: "center",
                  lineSpacing: 6,
                },
              )
              .setOrigin(0.5),
          );
          this.confetti();
          const btn = this.add
            .rectangle(W / 2, 380, 300, 56, 0xc4661a)
            .setStrokeStyle(3, 0xffcd4d, 0.9)
            .setDepth(21)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(W / 2, 380, last ? "🏆  SEE RESULTS" : "▶  NEXT LEVEL", {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "22px",
              fontStyle: "bold",
              color: "#fff",
            })
            .setOrigin(0.5)
            .setDepth(22);
          btn.on("pointerover", () => btn.setScale(1.04));
          btn.on("pointerout", () => btn.setScale(1));
          btn.on("pointerdown", () => {
            if (last) {
              this.scene.start("Result", {
                score: this.score,
                lives: this.lives,
              });
            } else {
              this.scene.start("Game", {
                level: this.levelIndex + 1,
                score: this.score,
                lives: this.lives,
              });
            }
          });
          this.setSR(
            `Level ${this.levelIndex + 1} complete. ${this.correctInLevel} of ${this.qPerLevel} correct. Score ${this.score}.`,
          );
        }

        confetti() {
          if (reducedMotion()) return;
          const p = this.add.particles(W / 2, -10, "chip", {
            x: { min: 0, max: W },
            y: -10,
            speedY: { min: 120, max: 280 },
            speedX: { min: -60, max: 60 },
            angle: { min: 0, max: 360 },
            rotate: { min: 0, max: 360 },
            scale: { min: 0.7, max: 1.4 },
            lifespan: 2600,
            quantity: 3,
            frequency: 40,
            tint: [0xffcd4d, 0xffb347, 0x6bd18b, 0xff7b1a],
          });
          this.time.delayedCall(1800, () => p.stop());
        }

        setSR(msg) {
          const el = document.getElementById("ff-sr");
          if (el) el.textContent = msg;
        }
      }

      // ════════════════════════════════════════════════════════════════════
      //  RESULT
      // ════════════════════════════════════════════════════════════════════
      class ResultScene extends Phaser.Scene {
        constructor() {
          super("Result");
        }
        init(data) {
          this.score = data.score || 0;
        }
        create() {
          this.cameras.main.setBackgroundColor(C.bg);
          const cx = W / 2;
          const stars = this.score >= 2600 ? 3 : this.score >= 1600 ? 2 : 1;

          // High score persist.
          try {
            const prev = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
            if (this.score > prev)
              localStorage.setItem(LS_KEY, String(this.score));
          } catch (e) {}

          // EduPulse classroom dashboard reporting (guarded no-op if absent).
          try {
            window.EduPulse &&
              EduPulse.record({
                activityTitle: document.title,
                score: this.score,
                stars: stars,
              });
          } catch (e) {}

          SFX.win();

          this.add
            .text(cx, 150, "FOUNDRY MASTERED!", {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "46px",
              fontStyle: "900",
              color: "#6bd18b",
            })
            .setOrigin(0.5);

          for (let i = 0; i < 3; i++) {
            const star = this.add
              .text(cx - 80 + i * 80, 240, i < stars ? "★" : "☆", {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "64px",
                color: i < stars ? "#ffcd4d" : "#5a3a1a",
              })
              .setOrigin(0.5);
            if (i < stars && !reducedMotion()) {
              star.setScale(0);
              this.tweens.add({
                targets: star,
                scale: 1,
                duration: 400,
                delay: 200 + i * 180,
                ease: "Back.easeOut",
              });
            }
          }

          this.add
            .text(cx, 326, `Final Score: ${this.score}`, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "30px",
              fontStyle: "bold",
              color: "#fdeede",
            })
            .setOrigin(0.5);
          this.add
            .text(
              cx,
              372,
              "You divided whole numbers, fractions, and mixed numbers — by slicing, counting, and grouping every bar model yourself.",
              {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "16px",
                color: "#e0b487",
                align: "center",
                wordWrap: { width: 580 },
                lineSpacing: 4,
              },
            )
            .setOrigin(0.5);

          this.btn(cx - 150, 462, "↻  PLAY AGAIN", 0xc4661a, () =>
            this.scene.start("Game", {
              level: 0,
              score: 0,
              lives: START_LIVES,
            }),
          );
          this.btn(cx + 150, 462, "🏠  UNIT 2 HUB", 0x6b3d18, () => {
            window.location.href = "/math/unit-2/";
          });

          const el = document.getElementById("ff-sr");
          if (el)
            el.textContent = `Foundry mastered. Final score ${this.score}, ${stars} stars.`;
        }
        btn(x, y, label, color, cb) {
          const b = this.add
            .rectangle(x, y, 270, 56, color)
            .setStrokeStyle(3, 0xffcd4d, 0.9)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(x, y, label, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "20px",
              fontStyle: "bold",
              color: "#fff",
            })
            .setOrigin(0.5);
          b.on("pointerover", () => b.setScale(1.04));
          b.on("pointerout", () => b.setScale(1));
          b.on("pointerdown", cb);
        }
      }

      // ── launch ──
      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#1a0f06",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, GameScene, ResultScene],
      };
      const ffGame = new Phaser.Game(config);

      // ── Canvas accessibility (additive; no gameplay change) ──
      ffGame.events.once("ready", function () {
        try {
          const cv = ffGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Fraction Foundry math game. Divide fractions by slicing bar models " +
              "yourself. Use plus and minus keys to slice, left and right arrow " +
              "keys to count pieces or groups, and Enter to forge your answer.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>
    <script src="/assets/nt-page-enhance.js" defer></script>
    <script src="/assets/edupulse-config.js"></script>
    <script src="/assets/edupulse-bridge.js"></script>
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
    <script src="/shared/save-resume/save-resume-engine.js" defer></script>
    <!-- nsr-injected:end -->
    <!-- gfx-injected:begin (shared game polish — tools/inject-game-fx.js) -->
    <script src="/assets/game-fx.js" defer></script>
    <!-- gfx-injected:end -->
    <!-- mwb-injected:begin (Math Workbench launcher — tools/inject-math-workbench.js) -->
    <script src="/assets/math-workbench-launcher.js" defer></script>
    <!-- mwb-injected:end -->
    <!-- gacc-injected:begin (calm & accessible games — tools/inject-game-access.js) -->
    <script src="/assets/game-access.js" defer></script>
    <!-- gacc-injected:end -->
    <!-- ghl-injected:begin (Socratic hint ladder — tools/inject-game-hint-ladder.js) -->
    <script src="/assets/game-hint-ladder.js" defer></script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        if (window.NeftHintLadder)
          window.NeftHintLadder.watch({
            sourceSelector: "#ff-sr",
            standard: "6.NOS.1",
            staticHints: [
              "Look at one piece after you slice: what fraction of a whole is it? The divisor names the piece size you need.",
              "Division asks 'how many of this size fit?' Slice each whole so the divisor lines up with whole pieces, then count pieces or bundle equal groups.",
              "Set it up: slice using the divisor's denominator, shade or spot the dividend on the bar, then count how many divisor-size pieces or full groups fill it.",
            ],
          });
      });
    </script>
    <!-- ghl-injected:end -->
  </body>
