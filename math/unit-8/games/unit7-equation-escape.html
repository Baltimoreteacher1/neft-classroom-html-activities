    <script>
      // Equation Escape — Dungeon Escape
      // Grade 6 · Unit 8 · Lessons 8-1 to 8-7: 6.AT.8 (one-step equations), 6.AT.9 (inequalities)
      // Neft Teacher

      const W = 1024,
        H = 768;
      const LS_KEY = "equationEscape_highScore";

      // --- ACCESSIBILITY: prefers-reduced-motion (additive, gates new motion only) ---
      const RM_QUERY = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
      // Live check: the shared Player settings "Calm motion" toggle wins,
      // otherwise the OS preference.
      const RM = () =>
        typeof window.__flagshipReduced === "boolean"
          ? window.__flagshipReduced
          : !!(RM_QUERY && RM_QUERY.matches);
      // Off-screen ARIA live region so screen-reader users hear questions/feedback
      // (the game itself is canvas-only and otherwise opaque to assistive tech).
      function announce(msg) {
        try {
          let live = document.getElementById("ee-aria-live");
          if (!live) {
            live = document.createElement("div");
            live.id = "ee-aria-live";
            live.setAttribute("aria-live", "polite");
            live.setAttribute("aria-atomic", "true");
            live.setAttribute("role", "status");
            live.style.cssText =
              "position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;";
            document.body.appendChild(live);
          }
          live.textContent = String(msg);
        } catch (e) {}
      }

      /** 1 star at 3 correct, 2 at a streak of 3 or 8 correct, 3 at 80%+ on a finished round of 4+. */
      function selfPacedStars(correct, total, bestStreak) {
        let stars = 0;
        if (correct >= 3) stars = 1;
        if ((bestStreak || 0) >= 3 || correct >= 8) stars = 2;
        if (total >= 4 && correct / total >= 0.8) stars = 3;
        return stars;
      }

      // --- SOUND ---
      class SFX {
        constructor() {
          this.ctx = null;
        }
        init() {
          if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        }
        tone(f, d, t = "sine", v = 0.1) {
          if (window.__flagshipMuted) return;
          if (!this.ctx) return;
          try {
            const o = this.ctx.createOscillator(),
              g = this.ctx.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start();
            o.stop(this.ctx.currentTime + d);
          } catch (e) {}
        }
        noise(d, v = 0.05) {
          if (window.__flagshipMuted) return;
          if (!this.ctx) return;
          try {
            const bufSize = this.ctx.sampleRate * d;
            const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * v;
            const src = this.ctx.createBufferSource();
            const g = this.ctx.createGain();
            src.buffer = buf;
            g.gain.setValueAtTime(v, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
            src.connect(g);
            g.connect(this.ctx.destination);
            src.start();
          } catch (e) {}
        }
        unlock() {
          this.tone(523, 0.1);
          setTimeout(() => this.tone(659, 0.1), 80);
          setTimeout(() => this.tone(784, 0.15), 160);
          setTimeout(() => this.tone(1047, 0.2), 240);
        }
        trap() {
          this.tone(200, 0.4, "sawtooth", 0.15);
          setTimeout(() => this.tone(150, 0.3, "sawtooth", 0.12), 150);
          this.noise(0.3, 0.08);
        }
        glassBreak() {
          this.noise(0.5, 0.12);
          this.tone(2000, 0.05, "sine", 0.08);
          setTimeout(() => this.noise(0.3, 0.06), 100);
          setTimeout(() => this.tone(1500, 0.04, "sine", 0.05), 150);
        }
        click() {
          this.tone(600, 0.05);
        }
        hover() {
          this.tone(800, 0.03, "sine", 0.04);
        }
        door() {
          this.tone(200, 0.15, "square");
          setTimeout(() => this.tone(300, 0.15, "square"), 100);
          setTimeout(() => this.tone(400, 0.2, "square"), 200);
        }
        step() {
          this.tone(100, 0.05, "triangle", 0.04);
        }
        boss() {
          [523, 659, 784, 880, 1047].forEach((f, i) =>
            setTimeout(() => this.tone(f, 0.12), i * 80),
          );
        }
        fail() {
          [400, 300, 200, 150].forEach((f, i) =>
            setTimeout(() => this.tone(f, 0.2, "sawtooth"), i * 120),
          );
        }
        key() {
          this.tone(880, 0.1);
          setTimeout(() => this.tone(1100, 0.15), 80);
        }
        streak3() {
          [660, 880, 1100].forEach((f, i) =>
            setTimeout(() => this.tone(f, 0.1, "square", 0.08), i * 60),
          );
        }
        streak5() {
          [523, 659, 784, 1047, 1319].forEach((f, i) =>
            setTimeout(() => this.tone(f, 0.12, "square", 0.1), i * 50),
          );
        }
        streak7() {
          [523, 659, 784, 880, 1047, 1319, 1568].forEach((f, i) =>
            setTimeout(() => this.tone(f, 0.15, "sine", 0.12), i * 45),
          );
        }
        powerup() {
          [400, 600, 800, 1200].forEach((f, i) =>
            setTimeout(() => this.tone(f, 0.1, "sine", 0.1), i * 50),
          );
        }
        phaseTransition() {
          [300, 400, 500, 600, 800, 1000].forEach((f, i) =>
            setTimeout(() => this.tone(f, 0.15, "triangle", 0.08), i * 70),
          );
        }
        victory3Star() {
          const melody = [523, 659, 784, 1047, 784, 1047, 1319, 1568];
          melody.forEach((f, i) => setTimeout(() => this.tone(f, 0.2, "sine", 0.12), i * 100));
        }
        timeBonus() {
          this.tone(1200, 0.08, "sine", 0.06);
          setTimeout(() => this.tone(1500, 0.08, "sine", 0.06), 60);
        }
        ambientDungeon() {
          for (let i = 0; i < 3; i++) {
            setTimeout(() => this.tone(80 + Math.random() * 40, 0.8, "sine", 0.015), i * 300);
          }
        }
      }
      const sfx = new SFX();

      // --- LANGUAGE (site-wide key: localStorage["nt-lang"] === "es") ---
      const LANG = (() => {
        try {
          return localStorage.getItem("nt-lang") === "es" ? "es" : "en";
        } catch (e) {
          return "en";
        }
      })();
      const ES = LANG === "es";
      const tr = (en, es) => (ES ? es : en);
      if (ES) document.documentElement.lang = "es";
      function toggleLang() {
        try {
          localStorage.setItem("nt-lang", ES ? "en" : "es");
        } catch (e) {}
        location.reload();
      }
      window.ewlToggleLang = toggleLang;

      // --- QUESTION GENERATION ---
      // Every door is a real equation. Solve doors have two locks: first the
      // KEY (the inverse move that keeps both sides balanced), then the LOCK
      // (the value of x). Each wrong option names its own misconception, and
      // a wrong x is checked by substitution ("12 + 5 = 17, not 15") — that
      // tells the student WHY without giving the answer away.
      // Help ladder (calm, earned): miss 1 = method, miss 2 = concrete step
      // with the last value left blank, miss 3 = the full solution.
      const M = "−"; // true minus for display
      const eqText = (kind, a, b) =>
        kind === "add"
          ? `x + ${a} = ${b}`
          : kind === "sub"
            ? `x ${M} ${a} = ${b}`
            : kind === "mul"
              ? `${a}x = ${b}`
              : `x ÷ ${a} = ${b}`;
      // What the left side becomes when x = v (substitution check).
      function substCheck(kind, a, b, v) {
        if (kind === "add") return `${v} + ${a} = ${v + a}`;
        if (kind === "sub") return `${v} ${M} ${a} = ${v - a}`;
        if (kind === "mul") return `${a} × ${v} = ${a * v}`;
        return v % a === 0 ? `${v} ÷ ${a} = ${v / a}` : `${v} ÷ ${a} ${tr("is not a whole number", "no es un número entero")}`;
      }
      function checkLine(q, v) {
        if (!q.eq) return "";
        const left = substCheck(q.eq.kind, q.eq.a, q.eq.b, v);
        return tr(
          `Check it: if x = ${v}, then ${left} — not ${q.eq.b}.`,
          `Compruébalo: si x = ${v}, entonces ${left}, no ${q.eq.b}.`,
        );
      }

      function genQuestions() {
        const qs = [];
        const R = (a, b) => Phaser.Math.Between(a, b);
        function shuffle(a) {
          const b = [...a];
          for (let i = b.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [b[i], b[j]] = [b[j], b[i]];
          }
          return b;
        }
        // wrongs: [optionText, why] pairs. Options stay distinct: a numeric
        // "x = N" collision is nudged to a nearby unused value (its feedback
        // then falls back to the substitution check).
        function mkQ(text, correct, wrongs, explain, tier, room, extra) {
          const seen = new Set([correct]);
          const why = {};
          const uniqueWrongs = wrongs.map(([wOrig, reason]) => {
            let w = wOrig;
            const m = /^x = (-?\d+)$/.exec(w);
            if (m) {
              const base = parseInt(m[1], 10);
              let n = base,
                k = 1;
              while (seen.has("x = " + n) || n < 0) {
                n = base + (k % 2 === 1 ? Math.ceil(k / 2) : -(k / 2));
                k++;
              }
              w = "x = " + n;
              if (n === base) why[w] = reason;
            } else {
              let suffix = 0;
              while (seen.has(w)) {
                suffix++;
                w = wOrig + " ".repeat(suffix);
              }
              why[w] = reason;
            }
            seen.add(w);
            return w;
          });
          const opts = shuffle([correct, ...uniqueWrongs]);
          return Object.assign(
            { text, correct, options: opts, explain, tier, room, why },
            extra || {},
          );
        }
        // One-step equation with its KEY stage. kind: add | sub | mul | div.
        function solveDoor(kind, a, b, tier, room) {
          const eq = eqText(kind, a, b);
          let ans, wrongs, method, step, explain, key, keyWrongs, after;
          if (kind === "add") {
            ans = b - a;
            wrongs = [
              [`x = ${b + a}`, tr(`you added ${a}. To undo + ${a}, subtract ${a}.`, `sumaste ${a}. Para deshacer + ${a}, resta ${a}.`)],
              [`x = ${a}`, tr(`${a} is the number added to x, not x itself.`, `${a} es el número que se suma a x, no es x.`)],
              [`x = ${ans + 1}`, ""],
            ];
            method = tr(`x has ${a} ADDED to it. Undo adding by subtracting ${a} from BOTH sides.`, `A x se le SUMA ${a}. Deshaz la suma restando ${a} en AMBOS lados.`);
            step = `x = ${b} ${M} ${a} = ?`;
            explain = tr(`Subtract ${a} from both sides: x = ${b} ${M} ${a} = ${ans}.`, `Resta ${a} en ambos lados: x = ${b} ${M} ${a} = ${ans}.`);
            key = tr(`Subtract ${a} from both sides`, `Resta ${a} en ambos lados`);
            keyWrongs = [
              [tr(`Add ${a} to both sides`, `Suma ${a} en ambos lados`), tr(`adding ${a} makes x + ${2 * a}. Do the OPPOSITE of + ${a}.`, `sumar ${a} da x + ${2 * a}. Haz lo CONTRARIO de + ${a}.`)],
              [tr(`Subtract ${a} from the left side only`, `Resta ${a} solo en el lado izquierdo`), tr("changing only one side breaks the balance. Do the same to BOTH sides.", "cambiar un solo lado rompe el equilibrio. Haz lo mismo en AMBOS lados.")],
              [tr(`Divide both sides by ${a}`, `Divide ambos lados entre ${a}`), tr(`x is not multiplied by ${a} — ${a} is added to it.`, `x no está multiplicada por ${a}; se le suma ${a}.`)],
            ];
            after = `x + ${a} ${M} ${a} = ${b} ${M} ${a}`;
          } else if (kind === "sub") {
            ans = b + a;
            wrongs = [
              [`x = ${Math.abs(b - a)}`, tr(`you subtracted ${a} again. To undo ${M} ${a}, add ${a}.`, `restaste ${a} otra vez. Para deshacer ${M} ${a}, suma ${a}.`)],
              [`x = ${a}`, tr(`${a} is the number taken away from x, not x itself.`, `${a} es el número que se le resta a x, no es x.`)],
              [`x = ${ans + 1}`, ""],
            ];
            method = tr(`x has ${a} SUBTRACTED from it. Undo subtracting by adding ${a} to BOTH sides.`, `A x se le RESTA ${a}. Deshaz la resta sumando ${a} en AMBOS lados.`);
            step = `x = ${b} + ${a} = ?`;
            explain = tr(`Add ${a} to both sides: x = ${b} + ${a} = ${ans}.`, `Suma ${a} en ambos lados: x = ${b} + ${a} = ${ans}.`);
            key = tr(`Add ${a} to both sides`, `Suma ${a} en ambos lados`);
            keyWrongs = [
              [tr(`Subtract ${a} from both sides`, `Resta ${a} en ambos lados`), tr(`that makes x ${M} ${2 * a}. Do the OPPOSITE of ${M} ${a}.`, `eso da x ${M} ${2 * a}. Haz lo CONTRARIO de ${M} ${a}.`)],
              [tr(`Add ${a} to the left side only`, `Suma ${a} solo en el lado izquierdo`), tr("changing only one side breaks the balance. Do the same to BOTH sides.", "cambiar un solo lado rompe el equilibrio. Haz lo mismo en AMBOS lados.")],
              [tr(`Multiply both sides by ${a}`, `Multiplica ambos lados por ${a}`), tr(`x is not divided by ${a} — ${a} is subtracted from it.`, `x no está dividida entre ${a}; se le resta ${a}.`)],
            ];
            after = `x ${M} ${a} + ${a} = ${b} + ${a}`;
          } else if (kind === "mul") {
            ans = b / a;
            wrongs = [
              [`x = ${b - a}`, tr(`you subtracted ${a}. ${a}x means ${a} TIMES x, so divide.`, `restaste ${a}. ${a}x significa ${a} POR x, así que divide.`)],
              [`x = ${b * a}`, tr(`you multiplied. Undo × ${a} with ÷ ${a}.`, `multiplicaste. Deshaz × ${a} con ÷ ${a}.`)],
              [`x = ${a}`, tr(`${a} is the number multiplying x, not x itself.`, `${a} es el número que multiplica a x, no es x.`)],
            ];
            method = tr(`x is MULTIPLIED by ${a}. Undo multiplying by dividing BOTH sides by ${a}.`, `x está MULTIPLICADA por ${a}. Deshaz la multiplicación dividiendo AMBOS lados entre ${a}.`);
            step = `x = ${b} ÷ ${a} = ?`;
            explain = tr(`Divide both sides by ${a}: x = ${b} ÷ ${a} = ${ans}.`, `Divide ambos lados entre ${a}: x = ${b} ÷ ${a} = ${ans}.`);
            key = tr(`Divide both sides by ${a}`, `Divide ambos lados entre ${a}`);
            keyWrongs = [
              [tr(`Multiply both sides by ${a}`, `Multiplica ambos lados por ${a}`), tr(`that makes ${a * a}x. Do the OPPOSITE of × ${a}.`, `eso da ${a * a}x. Haz lo CONTRARIO de × ${a}.`)],
              [tr(`Subtract ${a} from both sides`, `Resta ${a} en ambos lados`), tr(`${a}x means ${a} TIMES x. Undo multiplication, not addition.`, `${a}x significa ${a} POR x. Deshaz la multiplicación, no una suma.`)],
              [tr(`Divide the left side only by ${a}`, `Divide solo el lado izquierdo entre ${a}`), tr("changing only one side breaks the balance. Do the same to BOTH sides.", "cambiar un solo lado rompe el equilibrio. Haz lo mismo en AMBOS lados.")],
            ];
            after = `${a}x ÷ ${a} = ${b} ÷ ${a}`;
          } else {
            ans = a * b;
            wrongs = [
              [`x = ${b + a}`, tr(`you added ${a}. Undo ÷ ${a} by multiplying by ${a}.`, `sumaste ${a}. Deshaz ÷ ${a} multiplicando por ${a}.`)],
              [`x = ${b}`, tr(`${b} is x AFTER it was divided by ${a}. Find x before dividing.`, `${b} es x DESPUÉS de dividir entre ${a}. Busca x antes de dividir.`)],
              [`x = ${ans + a}`, ""],
            ];
            method = tr(`x is DIVIDED by ${a}. Undo dividing by multiplying BOTH sides by ${a}.`, `x está DIVIDIDA entre ${a}. Deshaz la división multiplicando AMBOS lados por ${a}.`);
            step = `x = ${b} × ${a} = ?`;
            explain = tr(`Multiply both sides by ${a}: x = ${b} × ${a} = ${ans}.`, `Multiplica ambos lados por ${a}: x = ${b} × ${a} = ${ans}.`);
            key = tr(`Multiply both sides by ${a}`, `Multiplica ambos lados por ${a}`);
            keyWrongs = [
              [tr(`Divide both sides by ${a}`, `Divide ambos lados entre ${a}`), tr(`that divides x again. Do the OPPOSITE of ÷ ${a}.`, `eso vuelve a dividir x. Haz lo CONTRARIO de ÷ ${a}.`)],
              [tr(`Subtract ${a} from both sides`, `Resta ${a} en ambos lados`), tr(`x is DIVIDED by ${a}. Undo division, not addition.`, `x está DIVIDIDA entre ${a}. Deshaz la división, no una suma.`)],
              [tr(`Multiply the left side only by ${a}`, `Multiplica solo el lado izquierdo por ${a}`), tr("changing only one side breaks the balance. Do the same to BOTH sides.", "cambiar un solo lado rompe el equilibrio. Haz lo mismo en AMBOS lados.")],
            ];
            after = `x ÷ ${a} × ${a} = ${b} × ${a}`;
          }
          const lock = mkQ(
            tr(`Now open the lock:  ${eq}\n${after}  →  x = ?`, `Ahora abre el candado:  ${eq}\n${after}  →  x = ?`),
            `x = ${ans}`,
            wrongs,
            explain,
            tier,
            room,
          );
          const keyQ = mkQ(
            tr(`Choose the key for  ${eq}:  which move gets x alone?`, `Elige la llave para  ${eq}:  ¿qué paso deja sola a la x?`),
            key,
            keyWrongs,
            tr(`${key}: both sides change the same way, so the scale stays balanced.`, `${key}: los dos lados cambian igual, así que la balanza sigue equilibrada.`),
            tier,
            room,
          );
          keyQ.method = tr("Look at what is done to x. Pick the OPPOSITE operation, and do it to BOTH sides.", "Mira qué se le hace a x. Elige la operación CONTRARIA y hazla en AMBOS lados.");
          keyQ.step = method;
          lock.method = method;
          lock.step = step;
          // The door starts on the key stage; applyStage() swaps in the lock.
          const door = Object.assign({}, keyQ, {
            kind: "solve",
            eq: { kind, a, b },
            balance: { left: eq.split(" = ")[0], right: String(b) },
            stages: [keyQ, lock],
            stage: 0,
          });
          return door;
        }
        // Tier 1: one-step add/sub (lessons 8-1, 8-2)
        for (let i = 0; i < 4; i++) {
          if (i % 2 === 0) {
            const a = R(2, 12);
            qs.push(solveDoor("add", a, a + R(1, 12), 1, "Lab"));
          } else {
            const a = R(2, 10);
            qs.push(solveDoor("sub", a, R(3, 14), 1, "Lab"));
          }
        }
        // Tier 1: test values by substitution (lesson 8-1)
        for (let i = 0; i < 2; i++) {
          const kind = i === 0 ? "add" : "mul";
          const a = kind === "add" ? R(3, 9) : R(2, 6);
          const x = R(3, 9);
          const b = kind === "add" ? x + a : a * x;
          const eq = eqText(kind, a, b);
          const near = kind === "add" ? [b + a, a, x + 2] : [b - a, a, x + 1];
          qs.push(
            mkQ(
              tr(`Test each value. Which one is a solution of  ${eq}?`, `Prueba cada valor. ¿Cuál es una solución de  ${eq}?`),
              `x = ${x}`,
              near.map((v) => [`x = ${v}`, ""]),
              tr(`Put x = ${x} into the equation: ${substCheck(kind, a, b, x)}. Both sides match.`, `Pon x = ${x} en la ecuación: ${substCheck(kind, a, b, x)}. Los dos lados son iguales.`),
              1,
              "Lab",
              {
                kind: "test",
                eq: { kind, a, b },
                method: tr("A solution makes the equation TRUE. Put each value in for x and see if both sides match.", "Una solución hace VERDADERA la ecuación. Pon cada valor en lugar de x y mira si los dos lados son iguales."),
                step: tr(`Try one: put the value in for x in  ${eq}  and compare with ${b}.`, `Prueba uno: pon el valor en lugar de x en  ${eq}  y compara con ${b}.`),
              },
            ),
          );
        }
        // Tier 2: one-step multiply/divide (lesson 8-3)
        for (let i = 0; i < 5; i++) {
          if (i % 2 === 0) {
            const a = R(2, 9);
            qs.push(solveDoor("mul", a, a * R(2, 12), 2, "Castle"));
          } else {
            qs.push(solveDoor("div", R(2, 6), R(3, 10), 2, "Castle"));
          }
        }
        // Tier 3: inequalities (lessons 8-4 to 8-6)
        for (let i = 0; i < 2; i++) {
          const a = R(3, 8),
            target = a + R(2, 6);
          const boundary = target - a;
          const good = boundary + R(1, 5);
          qs.push(
            mkQ(
              tr(`Which value of x makes  x + ${a} > ${target}  true?`, `¿Qué valor de x hace verdadera  x + ${a} > ${target}?`),
              `x = ${good}`,
              [
                [`x = ${boundary}`, tr(`${boundary} + ${a} = ${target}, which is EQUAL to ${target}, not greater.`, `${boundary} + ${a} = ${target}, que es IGUAL a ${target}, no mayor.`)],
                [`x = ${boundary - 1}`, tr(`${boundary - 1} + ${a} = ${target - 1}, which is LESS than ${target}.`, `${boundary - 1} + ${a} = ${target - 1}, que es MENOR que ${target}.`)],
                [`x = ${boundary - 2}`, tr(`${boundary - 2} + ${a} = ${target - 2}, which is LESS than ${target}.`, `${boundary - 2} + ${a} = ${target - 2}, que es MENOR que ${target}.`)],
              ],
              tr(`x + ${a} > ${target} means x > ${boundary}. x = ${good} works: ${good} + ${a} = ${good + a} > ${target}.`, `x + ${a} > ${target} significa x > ${boundary}. x = ${good} funciona: ${good} + ${a} = ${good + a} > ${target}.`),
              3,
              "Spaceship",
              {
                kind: "ineq",
                ineq: { a, target },
                method: tr("Solve it like an equation to find the boundary number. With >, the boundary itself does NOT work.", "Resuélvela como una ecuación para hallar el número límite. Con >, el límite NO funciona."),
                step: tr(`Boundary: x = ${target} ${M} ${a} = ?  Then pick a value GREATER than it.`, `Límite: x = ${target} ${M} ${a} = ?  Luego elige un valor MAYOR.`),
              },
            ),
          );
        }
        {
          const n = R(2, 9);
          const closed = Math.random() < 0.5;
          const right = Math.random() < 0.5;
          const sym = right ? (closed ? "≥" : ">") : closed ? "≤" : "<";
          const all = [">", "<", "≥", "≤"];
          const circleEn = closed ? "a closed (filled) circle" : "an open circle";
          const circleEs = closed ? "un círculo cerrado (relleno)" : "un círculo abierto";
          const whyFor = (s) => {
            const sClosed = s === "≥" || s === "≤";
            const sRight = s === ">" || s === "≥";
            if (sRight !== right)
              return tr(`check the arrow: it points ${right ? "RIGHT (greater)" : "LEFT (less)"}.`, `mira la flecha: apunta a la ${right ? "DERECHA (mayor)" : "IZQUIERDA (menor)"}.`);
            return sClosed
              ? tr(`a closed circle INCLUDES ${n}; this one is open.`, `un círculo cerrado INCLUYE el ${n}; este es abierto.`)
              : tr(`an open circle leaves ${n} OUT; this one is closed.`, `un círculo abierto deja FUERA el ${n}; este es cerrado.`);
          };
          qs.push(
            mkQ(
              tr(`A number line shows ${circleEn} at ${n} with the arrow pointing ${right ? "right" : "left"}. Which inequality?`, `Una recta numérica muestra ${circleEs} en ${n} con la flecha hacia la ${right ? "derecha" : "izquierda"}. ¿Qué desigualdad es?`),
              `x ${sym} ${n}`,
              all.filter((s) => s !== sym).map((s) => [`x ${s} ${n}`, whyFor(s)]),
              tr(`${closed ? "Closed circle = included" : "Open circle = not included"}; arrow ${right ? "right = greater" : "left = less"}. So x ${sym} ${n}.`, `${closed ? "Círculo cerrado = incluido" : "Círculo abierto = no incluido"}; flecha a la ${right ? "derecha = mayor" : "izquierda = menor"}. Entonces x ${sym} ${n}.`),
              3,
              "Spaceship",
              {
                kind: "line",
                method: tr("Open circle: the number is NOT included. Closed circle: it IS included. Then read which way the arrow points.", "Círculo abierto: el número NO se incluye. Círculo cerrado: SÍ se incluye. Luego mira hacia dónde apunta la flecha."),
                step: tr(`The circle is ${closed ? "closed, so use ≥ or ≤" : "open, so use > or <"}. Which one matches the arrow?`, `El círculo es ${closed ? "cerrado, así que usa ≥ o ≤" : "abierto, así que usa > o <"}. ¿Cuál va con la flecha?`),
              },
            ),
          );
        }
        {
          const rate = R(6, 12),
            hrs = R(4, 9),
            need = rate * hrs;
          qs.push(
            mkQ(
              tr(`Sam earns $${rate} each hour. He needs at least $${need}. Which inequality shows the hours (h) he must work?`, `Sam gana $${rate} por hora. Necesita por lo menos $${need}. ¿Qué desigualdad muestra las horas (h) que debe trabajar?`),
              `${rate}h ≥ ${need}`,
              [
                [`${rate} + h ≥ ${need}`, tr(`he earns $${rate} EACH hour, so multiply rate × hours.`, `gana $${rate} CADA hora, así que multiplica tarifa × horas.`)],
                [`${rate}h < ${need}`, tr(`"at least" means the same or more: ≥, not <.`, `"por lo menos" significa igual o más: ≥, no <.`)],
                [`h ÷ ${rate} ≥ ${need}`, tr("money earned = rate × hours, not hours ÷ rate.", "dinero ganado = tarifa × horas, no horas ÷ tarifa.")],
              ],
              tr(`$${rate} per hour × h hours must be at least $${need}: ${rate}h ≥ ${need}, so h ≥ ${hrs}.`, `$${rate} por hora × h horas debe ser por lo menos $${need}: ${rate}h ≥ ${need}, así que h ≥ ${hrs}.`),
              3,
              "Spaceship",
              {
                kind: "write",
                method: tr("Money earned = rate × hours. \"At least\" means greater than or equal to (≥).", "Dinero ganado = tarifa × horas. \"Por lo menos\" significa mayor o igual que (≥)."),
                step: tr(`Earned: ${rate} × h = ${rate}h. Now compare it with ${need} using "at least".`, `Ganado: ${rate} × h = ${rate}h. Ahora compáralo con ${need} usando "por lo menos".`),
              },
            ),
          );
        }
        // Tier 3: word problems — write the equation, then solve (lesson 8-7)
        {
          const a = R(5, 15),
            b = a + R(6, 20);
          qs.push(
            mkQ(
              tr(`Maya had some stickers. She got ${a} more and now has ${b}. Use x + ${a} = ${b}. How many did she have at first?`, `Maya tenía algunas calcomanías. Recibió ${a} más y ahora tiene ${b}. Usa x + ${a} = ${b}. ¿Cuántas tenía al principio?`),
              `x = ${b - a}`,
              [
                [`x = ${a + b}`, tr(`she ENDED with ${b}, so she started with fewer. Subtract ${a}.`, `TERMINÓ con ${b}, así que empezó con menos. Resta ${a}.`)],
                [`x = ${a}`, tr(`${a} is how many she GOT, not how many she had.`, `${a} es cuántas RECIBIÓ, no cuántas tenía.`)],
                [`x = ${b}`, tr(`${b} is how many she has NOW.`, `${b} es cuántas tiene AHORA.`)],
              ],
              tr(`x + ${a} = ${b}, so x = ${b} ${M} ${a} = ${b - a} stickers.`, `x + ${a} = ${b}, así que x = ${b} ${M} ${a} = ${b - a} calcomanías.`),
              3,
              "Spaceship",
              { kind: "word", eq: { kind: "add", a, b }, method: tr("Undo the + by subtracting from both sides.", "Deshaz la suma restando en ambos lados."), step: `x = ${b} ${M} ${a} = ?` },
            ),
          );
        }
        {
          const c = R(3, 8),
            each = R(4, 12),
            total = c * each;
          qs.push(
            mkQ(
              tr(`${c} friends share ${total} game tokens equally. Use ${c}x = ${total}. How many tokens does each friend get?`, `${c} amigos se reparten ${total} fichas por igual. Usa ${c}x = ${total}. ¿Cuántas fichas recibe cada amigo?`),
              `x = ${each}`,
              [
                [`x = ${total - c}`, tr(`sharing equally means dividing, not subtracting ${c}.`, `repartir por igual significa dividir, no restar ${c}.`)],
                [`x = ${total * c}`, tr("each friend gets LESS than the total. Divide.", "cada amigo recibe MENOS que el total. Divide.")],
                [`x = ${c}`, tr(`${c} is the number of friends.`, `${c} es el número de amigos.`)],
              ],
              tr(`${c}x = ${total}, so x = ${total} ÷ ${c} = ${each} tokens each.`, `${c}x = ${total}, así que x = ${total} ÷ ${c} = ${each} fichas cada uno.`),
              3,
              "Spaceship",
              { kind: "word", eq: { kind: "mul", a: c, b: total }, method: tr("Undo × by dividing both sides.", "Deshaz × dividiendo ambos lados."), step: `x = ${total} ÷ ${c} = ?` },
            ),
          );
        }
        {
          const d = R(3, 6),
            piece = R(2, 9);
          qs.push(
            mkQ(
              tr(`Leo cut a rope into ${d} equal pieces. Each piece is ${piece} m long. Use x ÷ ${d} = ${piece}. How long was the rope?`, `Leo cortó una cuerda en ${d} partes iguales. Cada parte mide ${piece} m. Usa x ÷ ${d} = ${piece}. ¿Cuánto medía la cuerda?`),
              `x = ${d * piece}`,
              [
                [`x = ${d + piece}`, tr(`the rope is ${d} pieces of ${piece} m: multiply, do not add.`, `la cuerda son ${d} partes de ${piece} m: multiplica, no sumes.`)],
                [`x = ${piece}`, tr(`${piece} m is ONE piece. The whole rope is longer.`, `${piece} m es UNA parte. La cuerda entera es más larga.`)],
                [`x = ${d * piece + d}`, ""],
              ],
              tr(`x ÷ ${d} = ${piece}, so x = ${piece} × ${d} = ${d * piece} m.`, `x ÷ ${d} = ${piece}, así que x = ${piece} × ${d} = ${d * piece} m.`),
              3,
              "Spaceship",
              { kind: "word", eq: { kind: "div", a: d, b: piece }, method: tr("Undo ÷ by multiplying both sides.", "Deshaz ÷ multiplicando ambos lados."), step: `x = ${piece} × ${d} = ?` },
            ),
          );
        }
        // Progression: ramp by tier so the rooms read Lab → Castle → Space.
        const byTier = (t) => shuffle(qs.filter((q) => q.tier === t));
        return { 1: byTier(1), 2: byTier(2), 3: byTier(3) };
      }

              "Equation Escape. Each door has two locks: choose the key move, then find x. Press Enter to begin.",
              "Escape de ecuaciones. Cada puerta tiene dos candados: elige el paso llave y luego halla x. Presiona Enter para empezar.",
            ),
          );
        }
      }

      // --- GAME ---
      class GameScene extends Phaser.Scene {
        constructor() {
          super("Game");
        }
        create() {
          sfx.init();
          const pools = genQuestions();
          const studioTier = this.sys.settings.data?.studioTier || 2;
          // Support = one-step add/sub rooms; Challenge = inequality and word
          // rooms; Standard = 5 of each tier, ramping Lab → Castle → Space.
          if (studioTier === 1) this.questions = pools[1];
          else if (studioTier === 3) this.questions = pools[3];
          else
            this.questions = [
              ...pools[1].slice(0, 5),
              ...pools[2].slice(0, 5),
              ...pools[3].slice(0, 5),
            ];
          this.questions.forEach((q) => {
            if (q.stages) applyStage(q, 0);
          });
          this.qIndex = 0;
          this.correctAnswers = 0;
          this.score = 0;
          this.solved = 0;
          this.missedQs = [];
          this.doorMisses = 0;
          this.streak = 0;
          this.bestStreak = 0;
          this.comboMultiplier = 1;
          this.totalQ = Math.min(15, this.questions.length);
          this.questions = this.questions.slice(0, this.totalQ);
          this.answered = false;
          this.startTime = Date.now();
          this.questionStartTime = Date.now();
          this.playerX = 100;
          this.playerY = 500;
          this.doorOpen = false;
          this.lastRoom = "";
          // Power-ups
          this.powerUps = { fiftyFifty: 1, doublePoints: 1, extraTime: 0 };
          this.doublePointsActive = false;
          // Ambient sound interval
          this.ambientTimer = this.time.addEvent({
            delay: 5000,
            callback: () => sfx.ambientDungeon(),
            loop: true,
          });

          // Build room
          this.buildRoom();
          this.buildHUD();
          this.loadQuestion();
          this.input.keyboard.on("keydown", this.handleKey, this);
          // After "Launch mission" the focus is still on that button, so the
          // first Enter would relaunch the run. Hand focus to the game canvas.
          try {
            const ae = document.activeElement;
            if (ae && (ae.id === "fm-start" || ae === document.body) && this.game.canvas) {
              this.game.canvas.setAttribute("tabindex", "0");
              this.game.canvas.focus({ preventScroll: true });
            }
          } catch (e) {}
        }

        getTheme() {
          const q = this.questions[this.qIndex];
          return THEMES[q ? q.room : "Lab"] || THEMES.Lab;
        }

        // Floating score text popup
        showFloatingText(x, y, text, color, size = "20px") {
          const ft = this.add
            .text(x, y, text, {
              fontSize: size,
              color: color,
              fontStyle: "bold",
              stroke: "#000",
              strokeThickness: 3,
            })
            .setOrigin(0.5)
            .setDepth(20)
            .setAlpha(1);
          this.tweens.add({
            targets: ft,
            y: y - 60,
            alpha: 0,
            scaleX: 1.5,
            scaleY: 1.5,
            duration: 1200,
            ease: "Power2",
            onComplete: () => ft.destroy(),
          });
        }

        // Confetti burst for correct answers
        spawnConfetti(x, y, count) {
          const t = this.getTheme();
          const colors = [0xfbbf24, 0x22c55e, 0xe94560, 0x3b82f6, 0xff6600, ...t.particleColor];
          const emitter = this.add.particles(x, y, "__WHITE", {
            speed: { min: 100, max: 350 },
            angle: { min: 0, max: 360 },
            scale: { start: 0.5, end: 0 },
            lifespan: { min: 600, max: 1200 },
            tint: colors,
            quantity: count,
            emitting: false,
            blendMode: "ADD",
          });
          emitter.explode(count);
          this.time.delayedCall(1500, () => emitter.destroy());
        }

        // Screen shake that scales with streak
        // Step-by-step solver hint: reveal the explanation one "step" at a time so
        // students watch the work build (e.g. "Subtract 4 from both sides:" then
        // "x = 12 - 4 = 8"). Content is unchanged from q.explain — only timing.
        revealSolverHint(explain) {
          if (this._hintTimers) {
            this._hintTimers.forEach((ev) => ev.remove(false));
          }
          this._hintTimers = [];
          if (!this.hintObj || !this.hintObj.active) return;
          this.hintObj.setColor("#94a3b8");

          if (RM()) {
            // Show the full hint immediately — no animated reveal.
            this.hintObj.setText("→ " + explain);
            return;
          }

          // Break the explanation into ordered steps. Most explanations are a
          // single sentence with a colon and an arithmetic chain; split on the
          // colon and on " = " so each line of work appears in sequence.
          const parts = explain.split(/(?<=:)\s+/);
          const steps = [];
          parts.forEach((p) => {
            const chain = p.split(/\s+(?==)/);
            chain.forEach((c, i) => steps.push((i > 0 ? "  " : "") + c.trim()));
          });
          let shown = "→ ";
          this.hintObj.setText(shown);
          steps.forEach((step, i) => {
            const ev = this.time.delayedCall(280 + i * 260, () => {
              if (!this.hintObj || !this.hintObj.active) return;
              shown += (shown.length > 2 ? " " : "") + step;
              this.hintObj.setText(shown);
              // Subtle pop on each new step.
              this.tweens.add({
                targets: this.hintObj,
                scaleX: 1.04,
                scaleY: 1.04,
                duration: 90,
                yoyo: true,
              });
              sfx.step();
            });
            this._hintTimers.push(ev);
          });
        }

        streakShake() {
          if (RM()) return;
          const intensity = Math.min(0.003 + this.streak * 0.002, 0.015);
          const dur = Math.min(100 + this.streak * 30, 300);
          this.cameras.main.shake(dur, intensity);
        }

        buildRoom() {
          const t = this.getTheme();
          // Clear previous room elements
          if (this.roomGroup) this.roomGroup.destroy(true);
          if (this.ambientParticles) this.ambientParticles.destroy();
          this.roomGroup = this.add.group();
          // Background
          this.cameras.main.setBackgroundColor(t.bg);

          // Parallax depth layers (distant rooms + near stone columns).
          // Purely decorative; drawn behind everything and drift opposite to the
          // pointer for a sense of dungeon depth. Motion is gated by reduced-motion.
          this.buildParallax(t);

          // Ambient background particles
          this.ambientParticles = this.add.particles(W / 2, H / 2, "__WHITE", {
            x: { min: 0, max: W },
            y: { min: 100, max: H },
            speed: { min: 2, max: 8 },
            angle: { min: 250, max: 290 },
            scale: { start: 0.12, end: 0 },
            alpha: { start: 0.3, end: 0 },
            lifespan: { min: 4000, max: 8000 },
            tint: t.ambientColor,
            quantity: 1,
            frequency: 300,
            blendMode: "ADD",
          });

          // Walls (stone pattern)
          for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 16; c++) {
              const off = (r % 2) * 35;
              const brick = this.add
                .rectangle(off + c * 70 + 35, r * 45 + 80, 66, 41, t.wall)
                .setStrokeStyle(1, t.floor, 0.4);
              this.roomGroup.add(brick);
            }
          }
          // Floor
          for (let c = 0; c < 20; c++) {
            const tile = this.add
              .rectangle(c * 55 + 27, H - 60, 50, 100, t.floor)
              .setStrokeStyle(1, t.wall, 0.3);
            this.roomGroup.add(tile);
          }
          // Torches
          for (let i = 0; i < 3; i++) {
            const tx = 200 + i * 300;
            const torch = this.add.rectangle(tx, 240, 6, 30, 0x8b4513);
            this.roomGroup.add(torch);
            this.add.particles(tx, 225, "__WHITE", {
              speed: { min: 5, max: 25 },
              angle: { min: 255, max: 285 },
              scale: { start: 0.35, end: 0 },
              lifespan: 400,
              tint: [0xff6600, 0xff9900, 0xffcc00],
              quantity: 1,
              frequency: 80,
              blendMode: "ADD",
            });
          }
          // Door (right side)
          this.doorBg = this.add
            .rectangle(W - 80, 430, 80, 130, t.door)
            .setStrokeStyle(3, t.accent);
          this.doorLock = this.add.circle(W - 60, 440, 12, 0x333333).setStrokeStyle(2, t.accent);
          this.doorLabel = this.add
            .text(W - 80, 380, "LOCKED", {
              fontSize: "14px",
              color: "#ef4444",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          this.roomGroup.add(this.doorBg);
          this.roomGroup.add(this.doorLock);
          this.roomGroup.add(this.doorLabel);
          // Player character
          if (this.player) this.player.destroy();
          this.player = this.add.graphics().setPosition(this.playerX, this.playerY).setDepth(5);
          this.drawPlayer(this.player);
          this.tweens.add({
            targets: this.player,
            y: this.playerY - 5,
            duration: 600,
            yoyo: true,
            repeat: -1,
            ease: "Sine.easeInOut",
          });
          // Room label
          this.roomLabel = this.add
            .text(W / 2, 55, t.name.toUpperCase(), {
              fontSize: "16px",
              color: "#" + t.accent.toString(16).padStart(6, "0"),
              fontStyle: "bold",
              letterSpacing: 4,
            })
            .setOrigin(0.5)
            .setDepth(6);
          this.roomGroup.add(this.roomLabel);
        }

        // Build decorative parallax depth layers behind the room. Each layer is a
        // Phaser container of dim shapes; updateParallax() drifts them with the
        // pointer. Lower depth = further away = moves less. No gameplay impact.
        buildParallax(t) {
          if (this.parallaxLayers) {
            this.parallaxLayers.forEach((l) => l.container.destroy());
          }
          this.parallaxLayers = [];

          // Far layer: distant lit doorways / rooms glowing in the dark.
          const far = this.add.container(0, 0).setDepth(-3);
          for (let i = 0; i < 5; i++) {
            const dx = 90 + i * 220;
            const glow = this.add
              .rectangle(dx, 300, 64, 150, t.door, 0.18)
              .setStrokeStyle(2, t.accent, 0.22);
            const inner = this.add.rectangle(dx, 300, 30, 110, t.ambientColor, 0.1);
            far.add(glow);
            far.add(inner);
          }
          this.parallaxLayers.push({ container: far, factor: 6 });

          // Mid layer: receding stone arches.
          const mid = this.add.container(0, 0).setDepth(-2);
          for (let i = 0; i < 6; i++) {
            const ax = 60 + i * 180;
            const arch = this.add
              .rectangle(ax, 360, 110, 260, t.wall, 0.35)
              .setStrokeStyle(2, t.floor, 0.4);
            mid.add(arch);
          }
          this.parallaxLayers.push({ container: mid, factor: 14 });

          // Near layer: foreground stone columns framing the view.
          const near = this.add.container(0, 0).setDepth(-1);
          [40, W - 40].forEach((cx2) => {
            const col = this.add
              .rectangle(cx2, H / 2, 70, H, t.wall, 0.5)
              .setStrokeStyle(3, t.floor, 0.5);
            near.add(col);
          });
          this.parallaxLayers.push({ container: near, factor: 26 });

          this._parallaxX = 0;
          this._parallaxY = 0;
        }

        // Smoothly ease parallax layers toward the pointer-derived offset. Called
        // every frame from update(); a no-op (recentered) under reduced motion.
        updateParallax() {
          if (!this.parallaxLayers) return;
          let nx = 0,
            ny = 0;
          if (!RM()) {
            const p = this.input.activePointer;
            // Range -1..1 from screen centre.
            const rx = Phaser.Math.Clamp((p.x / W - 0.5) * 2, -1, 1) || 0;
            const ry = Phaser.Math.Clamp((p.y / H - 0.5) * 2, -1, 1) || 0;
            nx = rx;
            ny = ry;
          }
          // Ease current toward target (frame-rate-tolerant, no layout thrash).
          this._parallaxX += (nx - this._parallaxX) * 0.08;
          this._parallaxY += (ny - this._parallaxY) * 0.08;
          this.parallaxLayers.forEach((l) => {
            l.container.x = -this._parallaxX * l.factor;
            l.container.y = -this._parallaxY * l.factor * 0.5;
          });
        }

        drawPlayer(g) {
          g.clear();
          g.fillStyle(0x3b82f6);
          g.fillRoundedRect(-16, -30, 32, 42, 5);
          g.fillStyle(0xfcd34d);
          g.fillCircle(0, -38, 15);
          g.fillStyle(0x1e3a5f);
          g.fillCircle(-5, -40, 3);
          g.fillCircle(5, -40, 3);
          g.fillStyle(0xfbbf24);
          g.fillRect(-3, -32, 6, 3);
          g.fillStyle(0x475569);
          g.fillRect(-12, 12, 10, 22);
          g.fillRect(2, 12, 10, 22);
        }

        buildHUD() {
          this.hudBg = this.add.rectangle(W / 2, 22, W, 44, 0x000000, 0.7).setDepth(10);
          this.hudQ = this.add
            .text(15, 10, "", {
              fontSize: "15px",
              color: "#94a3b8",
              fontStyle: "bold",
            })
            .setDepth(11);
          this.hudScore = this.add
            .text(180, 10, "", {
              fontSize: "15px",
              color: "#fbbf24",
              fontStyle: "bold",
            })
            .setDepth(11);
          this.hudLives = this.add
            .text(350, 10, "", { fontSize: "15px", color: "#86efac" })
            .setDepth(11);
          this.hudStreak = this.add
            .text(520, 10, "", { fontSize: "15px", color: "#f59e0b" })
            .setDepth(11);
          this.hudMultiplier = this.add
            .text(680, 10, "", { fontSize: "15px", color: "#a78bfa" })
            .setDepth(11);
          this.hudTimer = this.add
            .text(W - 100, 10, "", { fontSize: "15px", color: "#94a3b8" })
            .setDepth(11);
          // Progress bar
          this.progBg = this.add.rectangle(W / 2, 44, W - 20, 6, 0x334155).setDepth(10);
          this.progFill = this.add.rectangle(10, 44, 0, 6, 0xe94560).setOrigin(0, 0.5).setDepth(10);
          // Question counter dots
          this.progDots = [];
          const dotSpacing = (W - 40) / this.totalQ;
          for (let i = 0; i < this.totalQ; i++) {
            const dot = this.add.circle(20 + i * dotSpacing, 54, 3, 0x334155).setDepth(10);
            this.progDots.push(dot);
          }
          // Speed indicator
          this.speedIndicator = this.add
            .text(W - 50, 55, "", { fontSize: "11px", color: "#22c55e" })
            .setOrigin(0.5)
            .setDepth(11);
        }

        loadQuestion(sameDoor) {
          if (this.qIndex >= this.totalQ) {
            this.endGame();
            return;
          }
          this.answered = false;
          this.attempts = 0;
          this.selectedIdx = -1;
          this.questionStartTime = Date.now();
          // Cancel any pending step-by-step hint reveal from the prior question.
          if (this._hintTimers) {
            this._hintTimers.forEach((ev) => ev.remove(false));
            this._hintTimers = [];
          }

          const q = this.questions[this.qIndex];
          if (!sameDoor) {
            this.doorOpen = false;
            this.doublePointsActive = false;
            this.doorMisses = 0;
            // Rebuild room if theme changed
            const prevRoom = this.lastRoom;
            if (q.room !== prevRoom || this.qIndex === 0) {
              this.playerX = 100;
              if (this.qIndex > 0 && q.room !== prevRoom) this.showPhaseTransition(q.room);
              this.buildRoom();
            }
            this.lastRoom = q.room;
            this.doorLabel.setText(tr("LOCKED", "CERRADA")).setColor("#ef4444");
            this.doorLock.setFillStyle(0x333333);
          } else {
            this.doorLabel.setText(tr("1 LOCK LEFT", "FALTA 1")).setColor("#fbbf24");
            this.doorLock.setFillStyle(0xfbbf24);
          }
          this.updateHUD();

          // Animated progress bar
          this.tweens.add({
            targets: this.progFill,
            width: (this.qIndex / this.totalQ) * (W - 20),
            duration: 300,
            ease: "Power2",
          });

          // Question panel
          if (this.qPanel) this.qPanel.destroy();
          if (this.qTextObj) this.qTextObj.destroy();
          if (this.tierLabel) this.tierLabel.destroy();
          if (this.ansGroup) this.ansGroup.destroy(true);
          if (this.fbObj) this.fbObj.destroy();
          if (this.hintObj) this.hintObj.destroy();
          if (this.powerUpGroup) this.powerUpGroup.destroy(true);

          const t = this.getTheme();
          const twoLine = q.text.includes("\n") || q.text.length > 60;
          this.qPanel = this.add
            .rectangle(W / 2, 318, 760, twoLine ? 92 : 60, 0x000000, 0.85)
            .setStrokeStyle(2, t.accent)
            .setDepth(6);
          const tierColors = ["#22c55e", "#f59e0b", "#ef4444"];
          const tierNames = [
            tr("Patrol", "Patrulla"),
            tr("Detective", "Detective"),
            tr("Chief", "Jefe"),
          ];
          const stageName = q.stages
            ? q.stage === 0
              ? tr(" · KEY", " · LLAVE")
              : tr(" · LOCK", " · CANDADO")
            : "";
          this.tierLabel = this.add
            .text(W / 2 - 372, twoLine ? 278 : 292, tierNames[q.tier - 1] + stageName, {
              fontSize: "12px",
              color: tierColors[q.tier - 1],
              backgroundColor: "#1e293b",
              padding: { x: 6, y: 2 },
            })
            .setDepth(7);
          this.qTextObj = this.add
            .text(W / 2, 318, q.text, {
              fontSize: twoLine ? "18px" : "20px",
              color: "#e2e8f0",
              fontStyle: "bold",
              align: "center",
              wordWrap: { width: 700 },
              lineSpacing: 6,
            })
            .setOrigin(0.5)
            .setDepth(7);

          this.drawBalance(q);

          // Announce the new question + its options for screen-reader users.
          announce(
            `${tr("Room", "Sala")} ${this.qIndex + 1} ${tr("of", "de")} ${this.totalQ}. ${q.text.replace("\n", ". ")}. ${tr("Options", "Opciones")}: ${q.options
              .map((o, i) => `${i + 1}, ${o.trim()}`)
              .join("; ")}.`,
          );

          // Question enter animation
          this.qPanel.setAlpha(0);
          this.qTextObj.setAlpha(0);
          this.tweens.add({
            targets: this.qPanel,
            alpha: 1,
            duration: 300,
            ease: "Power2",
          });
          this.tweens.add({
            targets: this.qTextObj,
            alpha: 1,
            duration: 300,
            delay: 100,
            ease: "Power2",
          });

          // Answer options (as buttons below). Key-stage moves are phrases, so
          // those buttons grow taller and wrap instead of overflowing.
          const longOpts = q.options.some((o) => o.length > 12);
          const bh = longOpts ? 78 : 50;
          this.ansGroup = this.add.group();
          this.answerBtns = [];
          q.options.forEach((opt, i) => {
            const bx = 130 + i * 220,
              by = H - 140;
            const bg = this.add
              .rectangle(bx, by, 204, bh, 0x1e293b, 0.92)
              .setStrokeStyle(2, t.accent)
              .setInteractive({ useHandCursor: true })
              .setDepth(7);
            const num = this.add
              .text(bx - 96, by - bh / 2 + 4, String(i + 1), {
                fontSize: "12px",
                color: "#94a3b8",
              })
              .setDepth(8);
            const txt = this.add
              .text(bx, by, opt.trim(), {
                fontSize: longOpts ? "15px" : "17px",
                color: "#e2e8f0",
                fontStyle: "bold",
                align: "center",
                wordWrap: { width: 180 },
              })
              .setOrigin(0.5)
              .setDepth(8);

            // Enter animation
            bg.setAlpha(0).setScale(0.9);
            txt.setAlpha(0);
            num.setAlpha(0);
            this.tweens.add({
              targets: bg,
              alpha: 1,
              scaleX: 1,
              scaleY: 1,
              duration: 200,
              delay: 150 + i * 50,
              ease: "Back.easeOut",
            });
            this.tweens.add({
              targets: [txt, num],
              alpha: 1,
              duration: 200,
              delay: 200 + i * 50,
            });

            bg.on("pointerover", () => {
              if (!this.answered && !this.answerBtns[i].eliminated) {
                bg.setStrokeStyle(3, 0xfbbf24);
                sfx.hover();
              }
            });
            bg.on("pointerout", () => {
              if (!this.answered && this.selectedIdx !== i && !this.answerBtns[i].eliminated)
                bg.setStrokeStyle(2, t.accent);
            });
            bg.on("pointerdown", () => {
              if (!this.answered) this.submitAnswer(i);
            });
            this.ansGroup.add(bg);
            this.ansGroup.add(txt);
            this.ansGroup.add(num);
            this.answerBtns.push({ bg, txt, num, optText: opt });
          });

          // Power-up buttons
          this.powerUpGroup = this.add.group();
          this.buildPowerUpButtons();

          // Feedback area (readable size; wraps above the floor)
          this.fbObj = this.add
            .text(W / 2, 222, "", {
              fontSize: "16px",
              color: "#e2e8f0",
              align: "center",
              wordWrap: { width: 900 },
              backgroundColor: "#000000aa",
              padding: { x: 8, y: 4 },
            })
            .setOrigin(0.5)
            .setDepth(12);
          this.hintObj = this.add
            .text(W / 2, H - 20, "", {
              fontSize: "13px",
              color: "#94a3b8",
              align: "center",
              wordWrap: { width: 900 },
            })
            .setOrigin(0.5)
            .setDepth(8);
          // Trap sprites (hidden)
          if (this.trapGroup) this.trapGroup.destroy(true);
          this.trapGroup = this.add.group();
        }

        // A balance scale under the equation: both pans show the two sides,
        // and the beam stays level because the equation is balanced. After
        // the right KEY, both pans show the same move being applied.
        drawBalance(q) {
          if (this.balanceGroup) this.balanceGroup.destroy(true);
          this.balanceGroup = this.add.group();
          if (!q.balance) return;
          const cx = W / 2,
            y = 430;
          const g = this.add.graphics().setDepth(4);
          g.fillStyle(0x94a3b8, 0.9);
          g.fillTriangle(cx - 22, y + 70, cx + 22, y + 70, cx, y + 8);
          g.fillRect(cx - 190, y, 380, 7);
          g.lineStyle(2, 0xcbd5e1, 0.8);
          [cx - 170, cx + 170].forEach((px) => {
            g.lineBetween(px, y + 4, px - 46, y + 46);
            g.lineBetween(px, y + 4, px + 46, y + 46);
          });
          g.fillStyle(0x334155, 0.95);
          g.fillRoundedRect(cx - 230, y + 44, 120, 30, 8);
          g.fillRoundedRect(cx + 110, y + 44, 120, 30, 8);
          this.balanceGroup.add(g);
          const keyDone = q.stage === 1;
          const op = keyDone ? q.stages[0].correct : "";
          const sideStyle = { fontSize: "18px", color: "#fde68a", fontStyle: "bold" };
          const left = this.add
            .text(cx - 170, y + 59, q.balance.left, sideStyle)
            .setOrigin(0.5)
            .setDepth(5);
          const right = this.add
            .text(cx + 170, y + 59, q.balance.right, sideStyle)
            .setOrigin(0.5)
            .setDepth(5);
          this.balanceGroup.add(left);
          this.balanceGroup.add(right);
          if (keyDone) {
            const move = this.add
              .text(cx, y - 22, "⚖ " + op, {
                fontSize: "15px",
                color: "#86efac",
                fontStyle: "bold",
                backgroundColor: "#052e16cc",
                padding: { x: 8, y: 3 },
              })
              .setOrigin(0.5)
              .setDepth(5);
            this.balanceGroup.add(move);
          }
        }

        buildPowerUpButtons() {
          const puDefs = [
            { key: "fiftyFifty", label: "50/50", color: 0x3b82f6, hotkey: "F" },
            {
              key: "doublePoints",
              label: "2x PTS",
              color: 0xa78bfa,
              hotkey: "D",
            },
          ];
          puDefs.forEach((pu, i) => {
            if (this.powerUps[pu.key] <= 0) return;
            const px = 30 + i * 100,
              py = H - 195;
            const bg = this.add
              .rectangle(px + 35, py, 80, 28, pu.color, 0.3)
              .setStrokeStyle(1, pu.color)
              .setInteractive({ useHandCursor: true })
              .setDepth(9);
            const txt = this.add
              .text(px + 35, py, `${pu.label === "2x PTS" ? tr("2x PTS", "2x PTS") : pu.label} (${pu.hotkey})`, {
                fontSize: "11px",
                color: "#fff",
                fontStyle: "bold",
              })
              .setOrigin(0.5)
              .setDepth(10);
            const countTxt = this.add
              .text(px + 70, py - 12, `x${this.powerUps[pu.key]}`, {
                fontSize: "9px",
                color: "#fbbf24",
              })
              .setDepth(10);

            bg.on("pointerdown", () => this.usePowerUp(pu.key));
            bg.on("pointerover", () => bg.setFillStyle(pu.color, 0.6));
            bg.on("pointerout", () => bg.setFillStyle(pu.color, 0.3));

            this.powerUpGroup.add(bg);
            this.powerUpGroup.add(txt);
            this.powerUpGroup.add(countTxt);
          });
        }

        usePowerUp(key) {
          if (this.answered || this.powerUps[key] <= 0) return;
          const q = this.questions[this.qIndex];
          if (key === "fiftyFifty") {
            this.powerUps.fiftyFifty--;
            this.doorMisses++; // help used: no longer an unaided first try
            sfx.powerup();
            // Remove 2 wrong answers
            let removed = 0;
            this.answerBtns.forEach((b) => {
              if (b.optText !== q.correct && removed < 2) {
                b.bg.setAlpha(0.3);
                b.txt.setAlpha(0.3);
                b.bg.disableInteractive();
                b.eliminated = true;
                removed++;
              }
            });
            this.showFloatingText(W / 2, H - 220, "50/50!", "#3b82f6", "18px");
          } else if (key === "doublePoints") {
            this.powerUps.doublePoints--;
            this.doublePointsActive = true;
            sfx.powerup();
            this.showFloatingText(W / 2, H - 220, tr("DOUBLE POINTS!", "¡PUNTOS DOBLES!"), "#a78bfa", "18px");
          }
          // Rebuild power-up buttons
          if (this.powerUpGroup) this.powerUpGroup.destroy(true);
          this.powerUpGroup = this.add.group();
          this.buildPowerUpButtons();
        }

        showPhaseTransition(newRoom) {
          const t = THEMES[newRoom] || THEMES.Lab;
          sfx.phaseTransition();

          // Overlay
          const overlay = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.9).setDepth(50);
          const phaseText = this.add
            .text(W / 2, H / 2 - 20, t.name.toUpperCase(), {
              fontSize: "42px",
              color: "#" + t.accent.toString(16).padStart(6, "0"),
              fontStyle: "bold",
              stroke: "#000",
              strokeThickness: 4,
            })
            .setOrigin(0.5)
            .setDepth(51)
            .setAlpha(0)
            .setScale(0.5);
          const subText = this.add
            .text(W / 2, H / 2 + 30, tr("ENTERING NEW AREA", "ENTRANDO A UNA NUEVA ZONA"), {
              fontSize: "16px",
              color: "#94a3b8",
            })
            .setOrigin(0.5)
            .setDepth(51)
            .setAlpha(0);

          this.tweens.add({
            targets: phaseText,
            alpha: 1,
            scaleX: 1,
            scaleY: 1,
            duration: 400,
            ease: "Back.easeOut",
          });
          this.tweens.add({
            targets: subText,
            alpha: 1,
            duration: 400,
            delay: 200,
          });
          this.time.delayedCall(1200, () => {
            this.tweens.add({
              targets: [overlay, phaseText, subText],
              alpha: 0,
              duration: 400,
              onComplete: () => {
                overlay.destroy();
                phaseText.destroy();
                subText.destroy();
              },
            });
          });
        }

        submitAnswer(idx) {
          if (this.answered) return;
          if (!this.answerBtns[idx] || this.answerBtns[idx].eliminated) return;
          this.answered = true;
          const q = this.questions[this.qIndex];
          const chosen = this.answerBtns[idx].optText;
          const correct = chosen === q.correct;
          const tries = this.attempts || 0;

          if (correct && q.stages && q.stage === 0) {
            // The KEY fits: the balance shows the move, then the lock appears.
            this.answerBtns[idx].bg.setFillStyle(0x22c55e).setStrokeStyle(3, 0x22c55e);
            sfx.key();
            const msg = tr("The key fits! ", "¡La llave sirve! ") + q.explain;
            this.fbObj.setText(msg).setColor("#86efac");
            announce(msg);
            this.showFloatingText(130 + idx * 220, H - 190, tr("KEY!", "¡LLAVE!"), "#fbbf24", "20px");
            this.time.delayedCall(RM() ? 700 : 1100, () => {
              applyStage(q, 1);
              this.loadQuestion(true);
            });
            return;
          }

          if (correct) {
            // Full points only for an unaided first try at every lock.
            const misses = this.doorMisses + tries;
            if (misses === 0) this.correctAnswers++;
            const helpFactor = [1, 0.5, 0.25, 0.25][Math.min(misses, 3)];
            const basePoints = q.tier * 15;
            const streakBonus = misses === 0 ? Math.min(this.streak, 5) * 5 : 0;
            let subtotal = Math.round((basePoints + streakBonus) * helpFactor);
            if (this.doublePointsActive) subtotal *= 2;

            this.score += subtotal;
            window.FlagshipAdventure?.record({ firstTry: misses === 0, kind: q.room });
            this.solved++;
            if (misses === 0) this.streak++;
            else {
              this.streak = 0;
              if (!this.missedQs.includes(q)) this.missedQs.push(q);
            }
            if (this.streak > this.bestStreak) this.bestStreak = this.streak;
            this.comboMultiplier = Math.min(1 + Math.floor(this.streak / 2) * 0.5, 4);

            if (this.progDots[this.qIndex]) {
              this.progDots[this.qIndex].setFillStyle(misses === 0 ? 0x22c55e : 0xf59e0b);
            }

            // Door opens!
            this.doorOpen = true;
            this.doorLabel.setText(tr("UNLOCKED!", "¡ABIERTA!")).setColor("#22c55e");
            this.doorLock.setFillStyle(0x22c55e);
            this.answerBtns[idx].bg.setFillStyle(0x22c55e);
            this.answerBtns[idx].bg.setStrokeStyle(3, 0x22c55e);
            sfx.unlock();
            this.showFloatingText(130 + idx * 220, H - 190, `+${subtotal}`, "#22c55e");
            if (this.doublePointsActive) {
              this.showFloatingText(W / 2, H - 220, tr("DOUBLE!", "¡DOBLE!"), "#a78bfa", "16px");
            }

            // Streak milestone effects
            if (this.streak === 3) {
              sfx.streak3();
              this.showFloatingText(W / 2, 250, tr("STREAK x3!", "¡RACHA x3!"), "#f59e0b", "28px");
              this.spawnConfetti(W / 2, 300, 30);
            } else if (this.streak === 5) {
              sfx.streak5();
              this.showFloatingText(W / 2, 250, tr("STREAK x5!", "¡RACHA x5!"), "#ff6600", "32px");
              this.spawnConfetti(W / 2, 300, 50);
            } else if (this.streak === 7) {
              sfx.streak7();
              this.showFloatingText(W / 2, 250, tr("UNSTOPPABLE x7!", "¡IMPARABLE x7!"), "#ef4444", "36px");
              this.spawnConfetti(W / 2, 300, 80);
              this.powerUps.fiftyFifty++;
            }

            const msg =
              tr("DOOR UNLOCKED! +", "¡PUERTA ABIERTA! +") +
              subtotal +
              tr(" pts", " pts") +
              (misses > 0
                ? tr(" (with help — try the next one on your own!)", " (con ayuda: ¡intenta la próxima solo!)")
                : "") +
              (misses === 0 && this.streak >= 3 ? tr(" STREAK x", " RACHA x") + this.streak + "!" : "") +
              "  ✔ " +
              q.explain;
            this.fbObj.setText(msg).setColor("#86efac");
            announce(msg);

            this.tweens.add({ targets: this.doorBg, scaleX: 0.1, duration: 500, ease: "Power2" });
            if (!RM()) this.spawnConfetti(W - 80, 430, 15 + this.streak * 3);
            this.streakShake();

            // Walk through the door; students read the worked step meanwhile.
            this.tweens.add({
              targets: this.player,
              x: W - 80,
              duration: RM() ? 300 : 1600,
              ease: "Power2",
              delay: 700,
              onComplete: () => {
                if (!RM()) this.cameras.main.flash(300, 0, 0, 0);
                this.time.delayedCall(900, () => {
                  this.qIndex++;
                  this.playerX = 100;
                  this.player.setPosition(100, this.playerY);
                  this.loadQuestion();
                });
              },
            });
          } else {
            // Not yet: rule this option out, name the mistake, climb one rung
            // of help, and let the student try again. Nothing advances.
            this.attempts = tries + 1;
            this.streak = 0;
            this.comboMultiplier = 1;
            const btn = this.answerBtns[idx];
            btn.eliminated = true;
            btn.bg.setFillStyle(0xef4444, 0.45);
            btn.bg.setStrokeStyle(3, 0xef4444);
            btn.txt.setAlpha(0.5);
            btn.bg.disableInteractive();
            if (this.progDots[this.qIndex]) this.progDots[this.qIndex].setFillStyle(0xf59e0b);
            sfx.trap();
            this.showFloatingText(130 + idx * 220, H - 190, tr("Not yet", "Todavía no"), "#f59e0b", "20px");
            const left = this.answerBtns.filter((b) => !b.eliminated).length;
            const m = /^x = (-?\d+)$/.exec(chosen.trim());
            const why =
              (q.why && q.why[chosen]) ||
              (m && q.stage !== 0 ? checkLine(q, parseInt(m[1], 10)) : "") ||
              tr("that does not make it true.", "eso no la hace verdadera.");
            const lead = tr("Not yet — ", "Todavía no: ") + why;
            let msg;
            if (this.attempts === 1 && left > 1) {
              msg = lead + tr("  Hint: ", "  Pista: ") + q.method;
            } else if (this.attempts === 2 && left > 1) {
              msg = lead + tr("  Try this step: ", "  Prueba este paso: ") + q.step;
            } else {
              msg =
                tr("Here is the full solution: ", "Esta es la solución completa: ") +
                q.explain +
                tr(" Tap the matching choice to go on.", " Toca la opción que coincide para seguir.");
            }
            this.fbObj.setText(msg).setColor("#fde68a");
            // The shared mission panel prints a generic line on a wrong pick;
            // replace it with this rung of the help ladder.
            try {
              const fm = document.querySelector(".fm-feedback");
              if (fm) fm.textContent = msg;
            } catch (e) {}
            if (this.hintObj && this.hintObj.active) this.hintObj.setText("");
            announce(msg);
            if (RM()) {
              const tint = this.add.rectangle(W / 2, H / 2, W, H, 0xff0000, 0.08).setDepth(15);
              this.time.delayedCall(350, () => tint.destroy());
            } else {
              this.cameras.main.shake(150, 0.004);
            }
            if (q.stages && q.stage === 0) this.doorMisses++;
            this.answered = false;
          }
          this.updateHUD();
        }

        handleKey(e) {
          if (this.answered) return;
          if (e.key >= "1" && e.key <= "4") {
            const idx = parseInt(e.key) - 1;
            if (idx < this.answerBtns.length && !this.answerBtns[idx].eliminated)
              this.submitAnswer(idx);
          }
          if (e.key === "f" || e.key === "F") this.usePowerUp("fiftyFifty");
          if (e.key === "d" || e.key === "D") this.usePowerUp("doublePoints");
          if (e.key === "ArrowRight") {
            this.selectedIdx = Math.min((this.selectedIdx || 0) + 1, this.answerBtns.length - 1);
            this.highlightSel();
          }
          if (e.key === "ArrowLeft") {
            this.selectedIdx = Math.max((this.selectedIdx || 0) - 1, 0);
            this.highlightSel();
          }
          if (e.key === "Enter" && this.selectedIdx >= 0) this.submitAnswer(this.selectedIdx);
        }

        highlightSel() {
          const t = this.getTheme();
          this.answerBtns.forEach((b, i) => {
            if (b.eliminated) return;
            const sel = i === this.selectedIdx;
            b.bg.setStrokeStyle(sel ? 3 : 2, sel ? 0xfbbf24 : t.accent);
            if (sel) {
              this.tweens.add({
                targets: b.bg,
                scaleX: 1.05,
                scaleY: 1.05,
                duration: 80,
              });
            } else {
              this.tweens.add({
                targets: b.bg,
                scaleX: 1,
                scaleY: 1,
                duration: 80,
              });
            }
          });
          sfx.click();
        }

        updateHUD() {
          this.hudQ.setText(`${tr("ROOM", "SALA")} ${Math.min(this.qIndex + 1, this.totalQ)}/${this.totalQ}`);
          this.hudScore.setText(`${tr("SCORE", "PUNTOS")}: ${this.score}`);
          // Calm play: no lives to lose — count unaided first tries instead.
          this.hudLives.setText(`${tr("FIRST TRY", "1.er INTENTO")}: ${this.correctAnswers}`);

          // Streak display with pulse
          if (this.streak >= 2) {
            this.hudStreak.setText(`${tr("STREAK", "RACHA")}: ${this.streak}x`);
            if (this.streak >= 5) this.hudStreak.setColor("#ef4444");
            else if (this.streak >= 3) this.hudStreak.setColor("#ff6600");
            else this.hudStreak.setColor("#f59e0b");
          } else {
            this.hudStreak.setText("");
          }

          // Multiplier
          if (this.comboMultiplier > 1) {
            this.hudMultiplier.setText(`x${this.comboMultiplier}`);
          } else {
            this.hudMultiplier.setText("");
          }

          const el = Math.floor((Date.now() - this.startTime) / 1000);
          const m = Math.floor(el / 60),
            s = el % 60;
          void m;
          void s;
          this.hudTimer.setText(""); // calm: no clock on screen

          this.speedIndicator.setText(""); // calm: no FAST/SLOW pressure
        }

        update() {
          this.updateHUD();
          this.updateParallax();
        }

        endGame() {
          if (this.ambientTimer) this.ambientTimer.remove();
          const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
          const correct = this.correctAnswers;

          // Save high score
          const prevBest = parseInt(localStorage.getItem(LS_KEY) || "0");
          const isNewHighScore = this.score > prevBest;
          if (isNewHighScore) {
            localStorage.setItem(LS_KEY, String(this.score));
          }

          const epCorrect = Math.max(0, this.solved);
          try {
            window.EduPulse &&
              EduPulse.record({
                activityTitle: document.title,
                score: epCorrect,
                maxScore: this.totalQ,
                problemsCorrect: epCorrect,
                problemsAttempted: this.totalQ,
                percent: this.totalQ ? Math.round((epCorrect / this.totalQ) * 100) : 0,
              });
          } catch (e) {}

          this.cameras.main.fade(500, 0, 0, 0);
          this.time.delayedCall(500, () => {
            this.scene.start("Results", {
              score: this.score,
              total: this.totalQ,
              correct: Math.max(0, correct),
              bestStreak: this.bestStreak,
              time: elapsed,
              isNewHighScore: isNewHighScore,
              prevBest: prevBest,
              solved: this.solved,
              missed: this.missedQs.length,
            });
          });
        }
      }

          // Previous best
          if (d.prevBest > 0 && !d.isNewHighScore) {
            this.add
              .text(cx, 465, `${tr("Personal Best", "Mejor marca")}: ${d.prevBest}`, {
                fontSize: "13px",
                color: "#64748b",
              })
              .setOrigin(0.5);
          }

          // Buttons with hover effects
          const btn1 = this.add
            .rectangle(cx - 110, 510, 190, 50, 0xe94560)
            .setStrokeStyle(2, 0xff6b81)
            .setInteractive({ useHandCursor: true });
          const btn1Text = this.add
            .text(cx - 110, 510, tr("ESCAPE AGAIN", "OTRA VEZ"), {
              fontSize: "17px",
              color: "#fff",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          btn1.on("pointerdown", () => {
            sfx.click();
            this.cameras.main.fade(400, 0, 0, 0);
            this.time.delayedCall(400, () => this.scene.start("Game"));
          });
          btn1.on("pointerover", () => {
            btn1.setFillStyle(0xff2e5b);
            this.tweens.add({
              targets: [btn1, btn1Text],
              scaleX: 1.05,
              scaleY: 1.05,
              duration: 100,
            });
          });
          btn1.on("pointerout", () => {
            btn1.setFillStyle(0xe94560);
            this.tweens.add({
              targets: [btn1, btn1Text],
              scaleX: 1,
              scaleY: 1,
              duration: 100,
            });
          });

          const btn2 = this.add
            .rectangle(cx + 110, 510, 190, 50, 0x334155)
            .setStrokeStyle(2, 0x475569)
            .setInteractive({ useHandCursor: true });
          const btn2Text = this.add
            .text(cx + 110, 510, tr("MAIN MENU", "MENÚ"), {

              color: "#94a3b8",
              fontStyle: "bold",
            })

          btn2.on("pointerdown", () => {
            sfx.click();
            this.cameras.main.fade(400, 0, 0, 0);
            this.time.delayedCall(400, () => this.scene.start("Title"));
          });
          btn2.on("pointerover", () => {
            btn2.setFillStyle(0x475569);
            this.tweens.add({
              targets: [btn2, btn2Text],
              scaleX: 1.05,
              scaleY: 1.05,
              duration: 100,

          });
          btn2.on("pointerout", () => {
            btn2.setFillStyle(0x334155);

              targets: [btn2, btn2Text],

          this.add

                "Equation Escape — Neft Teacher — Unit 8 · 6.AT.8 / 6.AT.9 · Enter = play again · Esc = menu",

              { fontSize: "13px", color: "#94a3b8" },
            )
            .setOrigin(0.5);
          this.input.keyboard.on("keydown", (e) => {
            if (!this.sys.isActive()) return;
            if (e.key === "Enter" || e.key === " ") {
              this.cameras.main.fade(400, 0, 0, 0);
              this.time.delayedCall(400, () => this.scene.start("Game"));
            }
            if (e.key === "Escape") {
              this.cameras.main.fade(400, 0, 0, 0);
              this.time.delayedCall(400, () => this.scene.start("Title"));
            }
          });
