      // --- CONFIG ---
      window.__flagshipGame = new Phaser.Game({
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0a0a0a",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, GameScene, ResultsScene],
        physics: {
          default: "arcade",
          arcade: { gravity: { y: 0 }, debug: false },
        },
        input: { keyboard: true, mouse: true, touch: true },
      });

      // --- ON-SCREEN MOBILE CONTROLS (additive, touch-only) ---
      // A DOM overlay of real <button>s for touch/Chromebook-tablet players. Each
      // button synthesises the SAME keyboard event the game already handles
      // (digits 1-4 to answer, ← → to move the selection, Enter to confirm,
      // F/D for power-ups), so it changes no game logic — it only routes input.
      (function buildTouchControls() {
        function fireKey(key) {
          try {
            const ev = new KeyboardEvent("keydown", {
              key: key,
              code: key,
              bubbles: true,
              cancelable: true,
            });
            window.dispatchEvent(ev);
          } catch (e) {}
        }

        function mkBtn(label, ariaLabel, key, extraClass) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "ee-pad-btn" + (extraClass ? " " + extraClass : "");
          b.textContent = label;
          b.setAttribute("aria-label", ariaLabel);
          // Pointer (not click) so it feels instant on touch; preventDefault
          // stops the synthetic 300ms tap delay / double-fire.
          b.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            fireKey(key);
          });
          return b;
        }

        const wrap = document.createElement("div");
        wrap.id = "ee-touch-controls";
        wrap.setAttribute("role", "group");
        wrap.setAttribute("aria-label", tr("On-screen game controls", "Controles del juego en pantalla"));

        // Left cluster: D-pad for selecting/confirming answers.
        const dpad = document.createElement("div");
        dpad.className = "ee-dpad";
        dpad.appendChild(mkBtn("◀", tr("Move selection left", "Mover la selección a la izquierda"), "ArrowLeft", "ee-pad-left"));
        dpad.appendChild(mkBtn("OK", tr("Confirm selected answer", "Confirmar la respuesta elegida"), "Enter", "ee-pad-ok"));
        dpad.appendChild(mkBtn("▶", tr("Move selection right", "Mover la selección a la derecha"), "ArrowRight", "ee-pad-right"));
        wrap.appendChild(dpad);

        // Right cluster: numbered answer keys 1-4 + power-ups.
        const keys = document.createElement("div");
        keys.className = "ee-keys";
        for (let i = 1; i <= 4; i++) {
          keys.appendChild(mkBtn(String(i), tr("Answer choice ", "Opción ") + i, String(i), "ee-num"));
        }
        keys.appendChild(mkBtn("50/50", tr("Use fifty-fifty power-up", "Usar el comodín 50/50"), "f", "ee-pu"));
        keys.appendChild(mkBtn("2×", tr("Use double points power-up", "Usar el comodín de puntos dobles"), "d", "ee-pu"));
        wrap.appendChild(keys);

        function attach() {
          if (document.getElementById("ee-touch-controls")) return;
          document.body.appendChild(wrap);
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", attach, { once: true });
        } else {
          attach();
        }
      })();

      // ── ADDITIVE a11y: label the Phaser canvas for assistive tech once it
      //    mounts (the canvas is otherwise opaque to screen readers). Questions
      //    and feedback are also pushed to the aria-live region by announce().
      (function labelCanvas() {
        const c = document.querySelector("canvas");
        if (c) {
          c.setAttribute("role", "application");
          if (!c.hasAttribute("tabindex")) c.setAttribute("tabindex", "0");
          c.setAttribute(
            "aria-label",
            tr(
              "Equation Escape dungeon game. Choose the key move, then solve the one-step equation to unlock each door. Use number keys 1 to 4, or the arrow keys and Enter. Questions and results are also announced as text.",
              "Juego Escape de ecuaciones. Elige el paso llave y luego resuelve la ecuación de un paso para abrir cada puerta. Usa las teclas 1 a 4, o las flechas y Enter. Las preguntas y los resultados también se anuncian como texto.",
            ),
          );
        } else {
          requestAnimationFrame(labelCanvas);
        }
      })();
    </script>
