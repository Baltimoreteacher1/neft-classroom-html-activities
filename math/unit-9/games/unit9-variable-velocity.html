    <script>
      // ── Decorative star-field builder + pointer parallax (gameplay-neutral) ──
      (function () {
        var layer = document.getElementById("vv-bg-layer");
        if (!layer) return;
        var reduce =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var frag = document.createDocumentFragment();
        var i,
          s,
          n = 90;
        for (i = 0; i < n; i++) {
          s = document.createElement("div");
          s.className = "vv-star";
          var sz = 1 + Math.random() * 2.6;
          s.style.width = sz + "px";
          s.style.height = sz + "px";
          s.style.left = Math.random() * 100 + "%";
          s.style.top = Math.random() * 100 + "%";
          s.style.setProperty("--tw", 2 + Math.random() * 4 + "s");
          s.style.animationDelay = -Math.random() * 5 + "s";
          frag.appendChild(s);
        }
        for (i = 0; i < 7; i++) {
          var st = document.createElement("div");
          st.className = "vv-streak";
          st.style.width = 60 + Math.random() * 160 + "px";
          st.style.left = Math.random() * 100 + "%";
          st.style.top = Math.random() * 100 + "%";
          st.style.transform = "rotate(" + (-20 + Math.random() * 40) + "deg)";
          frag.appendChild(st);
        }
        layer.appendChild(frag);
        if (reduce) return;
        var tx = 0,
          ty = 0;
        window.addEventListener(
          "pointermove",
          function (e) {
            tx = (e.clientX / window.innerWidth - 0.5) * -26;
            ty = (e.clientY / window.innerHeight - 0.5) * -18;
            layer.style.transform =
              "translate3d(" + tx + "px," + ty + "px,0)";
          },
          { passive: true },
        );
      })();

    <script>
      // ════════════════════════════════════════════════════════════════════
      //  VARIABLE VELOCITY — ROVER RELAY   ·   Unit 9 · Lessons 9-1 to 9-4
      //  6.AT.11: independent vs. dependent variables, tables, equations
      //  y = kx (+ b), and graphs. The student PLOTS each stop: the y they
      //  compute from the rule is where the relay beacon goes.
      // ════════════════════════════════════════════════════════════════════
      const W = 900,
        H = 620;

      // ── Language (site-wide key: localStorage["nt-lang"] === "es") ──
      const LANG = (() => {
        try {
          return localStorage.getItem("nt-lang") === "es" ? "es" : "en";
        } catch (e) {
          return "en";
        }
      })();
      const ES = LANG === "es";
      const tr = (en, es) => (ES ? es : en);
      if (ES) document.documentElement.lang = "es";
      function toggleLang() {
        try {
          localStorage.setItem("nt-lang", ES ? "en" : "es");
        } catch (e) {}
        location.reload();
      }
      window.ewlToggleLang = toggleLang;

      // Palette (hex ints for Phaser graphics).
      const C = {
        bg: 0x0a1a2e,
        panel: 0x10263f,
        panelEdge: 0x244966,
        grid: 0x1d3a57,
        gridAxis: 0x6fb7e8,
        ink: "#eaf4ff",
        sub: "#9fc1de",
        accent: 0x5ad1ff,
        good: 0x4fd18b,
        bad: 0xff6b6b,
        gold: 0xffcd4d,
        line: 0x5ad1ff,
        rover: 0xffcd4d,
      };

      // ── small helpers ──
      // Reduced motion: the shared "Calm motion" setting wins, else the OS.
      const VV_RM_QUERY =
        window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
      const reducedMotion = () =>
        window.__flagshipReduced ?? !!(VV_RM_QUERY && VV_RM_QUERY.matches);
      const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
      const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
      function shuffle(a) {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      const ruleText = (k, b) => (b > 0 ? `y = ${k}x + ${b}` : `y = ${k}x`);
      const evalText = (k, b, x) => `${k} × ${x}${b ? ` + ${b}` : ""}`;

      // ── Scenario bank. iv = independent variable, dv = dependent variable. ──
      // Levels 1-3 use y = kx; levels 4-5 introduce a start value b (y = kx + b).
      const SCENARIOS = [
        {
          name: tr("Rover Relay", "Relevo del róver"),
          story: tr("Your rover rolls at a steady speed across the dunes.", "Tu róver avanza a velocidad constante por las dunas."),
          iv: tr("time (hours)", "tiempo (horas)"),
          dv: tr("distance (km)", "distancia (km)"),
          ivShort: tr("hours", "horas"),
          dvShort: "km",
          k: 5,
          b: 0,
        },
        {
          name: tr("Crystal Harvest", "Cosecha de cristales"),
          story: tr("A drill collects power crystals at a steady rate.", "Un taladro junta cristales de energía a un ritmo constante."),
          iv: tr("hours mining", "horas de minería"),
          dv: tr("crystals", "cristales"),
          ivShort: tr("hours", "horas"),
          dvShort: tr("crystals", "cristales"),
          k: 4,
          b: 0,
        },
        {
          name: tr("Solar Charge", "Carga solar"),
          story: tr("Solar panels add energy to the battery each minute.", "Los paneles solares agregan energía a la batería cada minuto."),
          iv: tr("minutes", "minutos"),
          dv: tr("energy (kW)", "energía (kW)"),
          ivShort: "min",
          dvShort: "kW",
          k: 6,
          b: 0,
        },
        {
          name: tr("Cargo Run", "Viaje de carga"),
          story: tr("Each delivery trip loads the same number of boxes.", "Cada viaje de entrega carga el mismo número de cajas."),
          iv: tr("trips", "viajes"),
          dv: tr("boxes", "cajas"),
          ivShort: tr("trips", "viajes"),
          dvShort: tr("boxes", "cajas"),
          k: 7,
          b: 0,
        },
        {
          name: tr("Base Camp", "Campamento base"),
          story: tr("Camp starts stocked, then gains supplies each day.", "El campamento empieza con provisiones y gana más cada día."),
          iv: tr("days", "días"),
          dv: tr("supplies", "provisiones"),
          ivShort: tr("days", "días"),
          dvShort: tr("supplies", "provisiones"),
          k: 3,
          b: 6,
        },
        {
          name: tr("Greenhouse Bloom", "Invernadero en flor"),
          story: tr("Seedlings start sprouted, then more bloom each week.", "Algunas plantas ya brotaron y cada semana florecen más."),
          iv: tr("weeks", "semanas"),
          dv: tr("plants", "plantas"),
          ivShort: tr("weeks", "semanas"),
          dvShort: tr("plants", "plantas"),
          k: 4,
          b: 5,
        },
      ];

      const TOTAL_LEVELS = 5; // missions per full run

      // Build a fresh, level-appropriate scenario (k grows; b appears later).
      function buildLevel(levelIndex) {
        const useB = levelIndex >= 3; // levels 4 & 5 (0-indexed) add a start value
        const pool = SCENARIOS.filter((s) => (useB ? s.b > 0 : s.b === 0));
        const sc = choice(pool);
        // x targets the player will plot (3 then 4 points as levels rise).
        const count = levelIndex < 2 ? 3 : 4;
        const xs = [];
        for (let i = 1; i <= count; i++) xs.push(i + 1); // x = 2,3,4(,5)
        return { ...sc, xs, plotted: 0 };
      }

      // Distinct positive numeric choices; wrongs carry their own "why".
      function targetedChoices(ans, wrongs, step) {
        const seen = new Set([ans]);
        const out = [{ label: String(ans), correct: true }];
        wrongs.forEach(([v, why]) => {
          if (out.length < 4 && Number.isInteger(v) && v > 0 && !seen.has(v)) {
            seen.add(v);
            out.push({ label: String(v), correct: false, why });
          }
        });
        let n = 1;
        while (out.length < 4 && n < 40) {
          const v = ans + (n % 2 ? 1 : -1) * Math.ceil(n / 2) * Math.max(1, step);
          if (v > 0 && !seen.has(v)) {
            seen.add(v);
            out.push({ label: String(v), correct: false });
          }
          n++;
        }
        return shuffle(out);
      }

      // ════════════════════════════════════════════════════════════════════
      //  BOOT — generate small reusable textures
      // ════════════════════════════════════════════════════════════════════
      class BootScene extends Phaser.Scene {
        constructor() {
          super("Boot");
        }
        create() {
          const g = this.make.graphics({ add: false });
          g.fillStyle(0xffffff).fillCircle(4, 4, 4);
          g.generateTexture("dot", 8, 8);
          g.clear();
          g.fillStyle(0xffffff, 0.85).fillCircle(10, 10, 10);
          g.generateTexture("glow", 20, 20);
          g.clear();
          g.fillStyle(0xffffff).fillRect(0, 0, 7, 4);
          g.generateTexture("chip", 7, 4);
          g.clear();
          g.destroy();
          this.scene.start("Title");
        }
      }

      // ════════════════════════════════════════════════════════════════════
      //  TITLE
      // ════════════════════════════════════════════════════════════════════
      class TitleScene extends Phaser.Scene {
        constructor() {
          super("Title");
        }
        create() {
          this.cameras.main.setBackgroundColor(C.bg);
          const cx = W / 2;

          // floating rover emblem
          const badge = this.add.container(cx, 150);
          const body = this.add.rectangle(0, 0, 120, 64, 0x1b3a59).setStrokeStyle(3, C.accent);
          const cab = this.add.rectangle(18, -10, 44, 30, 0x0e2840).setStrokeStyle(2, C.gold);
          const w1 = this.add.circle(-34, 36, 16, 0x223b55).setStrokeStyle(3, C.gold);
          const w2 = this.add.circle(34, 36, 16, 0x223b55).setStrokeStyle(3, C.gold);
          const dish = this.add.circle(-34, -28, 11, 0x0e2840).setStrokeStyle(2, C.accent);
          badge.add([w1, w2, body, cab, dish]);
          if (!reducedMotion()) {
            this.tweens.add({
              targets: badge,
              y: 138,
              duration: 1600,
              yoyo: true,
              repeat: -1,
              ease: "Sine.inOut",
            });
          }

          this.add
            .text(cx, 250, "VARIABLE VELOCITY", {
              fontFamily: "Arial, sans-serif",
              fontSize: "52px",
              fontStyle: "900",
              color: "#eaf4ff",
            })
            .setOrigin(0.5);
          this.add
            .text(cx, 296, tr("Rover Relay", "Relevo del róver"), {
              fontFamily: "Arial, sans-serif",
              fontSize: "26px",
              fontStyle: "bold",
              color: "#ffcd4d",
            })
            .setOrigin(0.5);
          this.add
            .text(
              cx,
              348,
              tr(
                "Find the rule that links two variables, then plot each relay stop\nyourself — the y you compute is where the beacon goes.",
                "Halla la regla que une dos variables y luego grafica cada parada\ntú mismo: la y que calculas es donde va la baliza.",
              ),
              {
                fontFamily: "Arial, sans-serif",
                fontSize: "18px",
                color: "#cfe3f5",
                align: "center",
                lineSpacing: 6,
              },
            )
            .setOrigin(0.5);
          this.add
            .text(
              cx,
              404,
              tr(
                "Grade 6 · Unit 9 · Lessons 9-1 to 9-4 · Standard 6.AT.11",
                "Grado 6 · Unidad 9 · Lecciones 9-1 a 9-4 · Estándar 6.AT.11",
              ),
              {
                fontFamily: "Arial, sans-serif",
                fontSize: "15px",
                fontStyle: "bold",
                color: "#5ad1ff",
              },
            )
            .setOrigin(0.5);

          let starting = false;
          const begin = () => {
            if (starting || !this.sys.isActive()) return;
            starting = true;
            this.scene.start("Game", { level: 0, score: 0 });
          };
          this.makeButton(cx, 472, tr("▶  START MISSION", "▶  EMPEZAR MISIÓN"), 0x2f8f5a, begin);
          this.makeButton(W - 90, 36, ES ? "English" : "Español", 0x1b3a59, toggleLang, 150, 46, 18);

          this.add
            .text(
              cx,
              548,
              tr(
                "No clock — take your time. Answer with a tap or keys 1 – 4.  Enter = start · L = Español",
                "Sin reloj: ve a tu ritmo. Responde tocando o con las teclas 1 – 4.  Enter = empezar · L = English",
              ),
              {
                fontFamily: "Arial, sans-serif",
                fontSize: "15px",
                color: "#b5cde3",
                align: "center",
                wordWrap: { width: 820 },
              },
            )
            .setOrigin(0.5);
          // Only this scene's keys: a stopped title must never restart a run.
          this.input.keyboard.on("keydown", (e) => {
            if (!this.sys.isActive()) return;
            if (e.key === "Enter" || e.key === " ") begin();
            if (e.key === "l" || e.key === "L") toggleLang();
          });

          this.setSR(
            tr(
              "Variable Velocity, Rover Relay. A coordinate-plane game for two-variable relationships, standard 6.AT.11. Press Enter to start.",
              "Variable Velocity, Relevo del róver. Un juego en el plano de coordenadas sobre relaciones entre dos variables, estándar 6.AT.11. Presiona Enter para empezar.",
            ),
          );
        }
        makeButton(x, y, label, color, cb, w = 280, h = 56, fs = 22) {
          const b = this.add
            .rectangle(x, y, w, h, color)
            .setStrokeStyle(3, 0xffffff, 0.85)
            .setInteractive({ useHandCursor: true });
          const t = this.add
            .text(x, y, label, {
              fontFamily: "Arial, sans-serif",
              fontSize: fs + "px",
              fontStyle: "bold",
              color: "#ffffff",
            })
            .setOrigin(0.5);
          b.on("pointerover", () => b.setScale(1.04));
          b.on("pointerout", () => b.setScale(1));
          b.on("pointerdown", cb);
          return { b, t };
        }
        setSR(msg) {
          const el = document.getElementById("vv-sr");
          if (el) el.textContent = msg;
        }
      }

      // ════════════════════════════════════════════════════════════════════
      //  GAME
      // ════════════════════════════════════════════════════════════════════
      class GameScene extends Phaser.Scene {
        constructor() {
          super("Game");
        }
        init(data) {
          this.levelIndex = data.level || 0;
          this.score = data.score || 0;
          // Calm play: no lives. Count unaided first tries across the run.
          this.firstTry = data.firstTry || 0;
          this.solved = data.solved || 0;
          this.asked = data.asked || 0;
          this.streak = 0;
          this.locked = false;
        }
        create() {
          this.cameras.main.setBackgroundColor(C.bg);
          this.level = buildLevel(this.levelIndex);
          this.plotCtl = [];
          plotPad.show(false);
          this.events.once("shutdown", () => plotPad.show(false));

          this.buildHUD();
          this.buildGrid();
          this.buildQuestionPanel();
          this.buildAnswerArea();

          // Keys: 1-4 answer a choice; on a plot stop ↑/↓ move the beacon
          // (Shift or PageUp/PageDown = 5), Enter or Space places it.
          ["ONE", "TWO", "THREE", "FOUR"].forEach((key, i) => {
            this.input.keyboard.on("keydown-" + key, () => {
              if (this.sys.isActive()) this.pick(i);
            });
          });
          this.input.keyboard.on("keydown", (e) => {
            if (!this.sys.isActive()) return;
            if (this.levelDone) {
              if (e.key === "Enter" || e.key === " ") this.levelDone();
              return;
            }
            if (!this.current || this.current.kind !== "plot" || this.locked) return;
            const big = e.shiftKey ? 5 : 1;
            if (e.key === "ArrowUp") this.moveBeacon(big);
            else if (e.key === "ArrowDown") this.moveBeacon(-big);
            else if (e.key === "PageUp") this.moveBeacon(5);
            else if (e.key === "PageDown") this.moveBeacon(-5);
            else if (e.key === "Enter" || e.key === " ") this.placeBeacon();
            else return;
            e.preventDefault?.();
          });

          this.queue = this.makeQuestionQueue(this.level);
          this.asked += this.queue.length;
          this.qIndex = 0;
          this.nextQuestion();
          // After "Launch mission" the focus is still on that button, so the
          // first Enter would relaunch the run. Hand focus to the game canvas.
          try {
            const ae = document.activeElement;
            if (ae && (ae.id === "fm-start" || ae === document.body) && this.game.canvas)
              this.game.canvas.focus({ preventScroll: true });
          } catch (e) {}
        }

        // ── HUD ──
        buildHUD() {
          this.add.rectangle(W / 2, 30, W, 60, C.panel).setDepth(1);

                fontStyle: "900",

              .setOrigin(anchor, 0)

        refreshHUD() {
          this.scoreT.setText(String(this.score));
          this.levelT.setText(`${this.levelIndex + 1} / ${TOTAL_LEVELS}`);
          this.streakT.setText(this.streak > 0 ? `×${this.streak}` : "—");
          this.livesT.setText(String(this.firstTry));

        // ── Coordinate grid (right side) ──
        buildGrid() {
          this.gx0 = 470;
          this.gy0 = 540; // origin (bottom-left) in screen coords
          this.gw = 400;
          this.gh = 420;
          this.xMax = this.level.xs[this.level.xs.length - 1] + 1; // a little headroom
          const maxY = this.level.k * this.level.xs[this.level.xs.length - 1] + this.level.b;
          this.yMax = Math.ceil((maxY + 1) / 5) * 5;

          this.add
            .rectangle(this.gx0 + this.gw / 2 - 10, 330, this.gw + 70, 470, C.panel)
            .setStrokeStyle(2, C.panelEdge);

          const gfx = this.add.graphics();
          this.gridGfx = gfx;
          gfx.lineStyle(1, C.grid, 1);
          for (let xi = 0; xi <= this.xMax; xi++) {
            const px = this.sx(xi);
            gfx.lineBetween(px, this.sy(0), px, this.sy(this.yMax));
          }
          const yStep = this.yMax <= 20 ? 2 : this.yMax <= 40 ? 5 : 10;
          for (let yi = 0; yi <= this.yMax; yi += yStep) {
            const py = this.sy(yi);
            gfx.lineBetween(this.sx(0), py, this.sx(this.xMax), py);
          }
          gfx.lineStyle(3, C.gridAxis, 1);
          gfx.lineBetween(this.sx(0), this.sy(0), this.sx(this.xMax), this.sy(0));
          gfx.lineBetween(this.sx(0), this.sy(0), this.sx(0), this.sy(this.yMax));

          for (let xi = 0; xi <= this.xMax; xi++) {
            this.add
              .text(this.sx(xi), this.sy(0) + 8, String(xi), {
                fontFamily: "Arial, sans-serif",
                fontSize: "13px",
                color: "#9fc1de",
              })
              .setOrigin(0.5, 0);
          }
          for (let yi = 0; yi <= this.yMax; yi += yStep) {
            this.add
              .text(this.sx(0) - 8, this.sy(yi), String(yi), {
                fontFamily: "Arial, sans-serif",
                fontSize: "13px",
                color: "#9fc1de",
              })
              .setOrigin(1, 0.5);
          }
          this.add
            .text(this.sx(this.xMax / 2), this.sy(0) + 28, `x: ${this.level.iv}`, {
              fontFamily: "Arial, sans-serif",
              fontSize: "13px",
              fontStyle: "bold",
              color: "#cfe3f5",
            })
            .setOrigin(0.5, 0);
          this.add
            .text(this.sx(0) + 6, this.sy(this.yMax) - 16, `y: ${this.level.dv}`, {
              fontFamily: "Arial, sans-serif",
              fontSize: "13px",
              fontStyle: "bold",
              color: "#cfe3f5",
            })
            .setOrigin(0, 0.5)
            .setDepth(3);

          // dynamic layer for the plotted line + points + rover
          this.plotGfx = this.add.graphics();
          this.plottedPts = [];

          // Tap the grid to set the beacon height on a plot stop.
          this.gridHit = this.add
            .rectangle(this.gx0 + this.gw / 2, this.gy0 - this.gh / 2, this.gw + 30, this.gh + 30, 0xffffff, 0.001)
            .setInteractive({ useHandCursor: true })
            .setDepth(4);
          this.gridHit.on("pointerdown", (p) => {
            if (!this.current || this.current.kind !== "plot" || this.locked) return;
            // Ignore touches that landed on DOM controls floating over the canvas.
            if (p.event && p.event.target && p.event.target !== this.game.canvas) return;
            const y = Math.round(((this.gy0 - p.y) / this.gh) * this.yMax);
            this.setBeacon(y);
          });

          // rover starts on the line at (0, b)
          this.rover = this.makeRover(this.sx(0), this.sy(this.level.b));
        }
        sx(x) {
          return this.gx0 + (x / this.xMax) * this.gw;
        }
        sy(y) {
          return this.gy0 - (y / this.yMax) * this.gh;
        }
        makeRover(x, y) {
          const c = this.add.container(x, y).setDepth(5);
          const body = this.add.rectangle(0, -10, 30, 16, 0xffcd4d).setStrokeStyle(2, 0x6b4e00);
          const cab = this.add.rectangle(5, -20, 14, 10, 0x0e2840).setStrokeStyle(1, 0x6fb7e8);
          const w1 = this.add.circle(-9, 0, 5, 0x223b55).setStrokeStyle(2, 0xffcd4d);
          const w2 = this.add.circle(9, 0, 5, 0x223b55).setStrokeStyle(2, 0xffcd4d);
          c.add([body, cab, w1, w2]);
          return c;
        }

        // ── Question panel (left) ──
        buildQuestionPanel() {
          this.add.rectangle(230, 330, 420, 470, C.panel).setStrokeStyle(2, C.panelEdge);
          this.scTitle = this.add
            .text(40, 110, "", {
              fontFamily: "Arial, sans-serif",
              fontSize: "18px",
              fontStyle: "900",
              color: "#ffcd4d",
            })
            .setOrigin(0, 0);
          this.scStory = this.add
            .text(40, 138, "", {
              fontFamily: "Arial, sans-serif",
              fontSize: "15px",
              color: "#cfe3f5",
              wordWrap: { width: 380 },
              lineSpacing: 4,
            })
            .setOrigin(0, 0);
          this.ruleChip = this.add
            .rectangle(230, 196, 360, 36, 0x0e2840)
            .setStrokeStyle(2, C.accent)
            .setVisible(false);
          this.ruleText = this.add
            .text(230, 196, "", {
              fontFamily: "Arial, sans-serif",
              fontSize: "20px",
              fontStyle: "bold",
              color: "#5ad1ff",
            })
            .setOrigin(0.5)
            .setVisible(false);
          this.tableT = this.add
            .text(40, 212, "", {
              fontFamily: "Consolas, monospace",
              fontSize: "16px",
              color: "#eaf4ff",
              lineSpacing: 4,
            })
            .setOrigin(0, 0);
          this.qText = this.add
            .text(230, 300, "", {
              fontFamily: "Arial, sans-serif",
              fontSize: "18px",
              fontStyle: "bold",
              color: "#eaf4ff",
              align: "center",
              wordWrap: { width: 380 },
              lineSpacing: 5,
            })
            .setOrigin(0.5, 0);
          this.fbText = this.add
            .text(230, 535, "", {
              fontFamily: "Arial, sans-serif",
              fontSize: "15px",
              fontStyle: "bold",
              color: "#4fd18b",
              align: "center",
              wordWrap: { width: 400 },
              backgroundColor: "#0a1a2ee6",
              padding: { x: 6, y: 4 },

        buildAnswerArea() {
          // Answer buttons are rebuilt for each question (see drawAnswers).
          this.answerBtns = [];
        }

        // ── Build the ordered question queue for a mission ──
        makeQuestionQueue(level) {
          const q = [];
          // STEP 1 — establish the rule: variable-ID then rule-from-table.
          q.push(this.qVariableId(level));
          q.push(this.qRuleFromTable(level));
          // STEP 2..n — plot each stop; the last stop of later missions is a
          // reverse question (given y, find x).
          level.xs.forEach((x, i) => {
            if (i === level.xs.length - 1 && this.levelIndex >= 1) q.push(this.qReverse(level, x));
            else q.push(this.qPlot(level, x));
          });
          // FINAL — predict far beyond the grid
          q.push(this.qPredict(level));
          return q;
        }

        // independent vs dependent
        qVariableId(level) {
          const askIndependent = Math.random() < 0.5;
          const correct = askIndependent ? level.iv : level.dv;
          const other = askIndependent ? level.dv : level.iv;
          return {
            kind: "id",
            story: true,
            rule: false,
            prompt: askIndependent
              ? tr(
                  "Which is the INDEPENDENT variable (the one you choose / control)?",
                  "¿Cuál es la variable INDEPENDIENTE (la que tú eliges o controlas)?",
                )
              : tr(
                  "Which is the DEPENDENT variable (the one that responds)?",
                  "¿Cuál es la variable DEPENDIENTE (la que responde)?",
                ),
            choices: shuffle([
              { label: correct, correct: true },
              {
                label: other,
                correct: false,
                why: askIndependent
                  ? tr(`${capit(other)} changes BECAUSE of ${correct}.`, `${capit(other)} cambia A CAUSA de ${correct}.`)
                  : tr(`You choose ${other}; it does not depend on anything.`, `Tú eliges ${other}; no depende de nada.`),
              },
            ]),
            explain: askIndependent
              ? tr(`You control ${level.iv}. ${capit(level.dv)} depends on it.`, `Tú controlas ${level.iv}. ${capit(level.dv)} depende de eso.`)
              : tr(`${capit(level.dv)} responds to ${level.iv}, so it is dependent.`, `${capit(level.dv)} responde a ${level.iv}, así que es dependiente.`),
          };
        }

        // rule from a small table
        qRuleFromTable(level) {
          const k = level.k,
            b = level.b;
          const xsTab = [1, 2, 3];
          const rows = xsTab.map((x) => [x, k * x + b]);
          const table = `x  |  y\n-------\n` + rows.map((r) => `${r[0]}  |  ${r[1]}`).join("\n");
          const correct = ruleText(k, b);
          // Each distractor is a rule; its feedback tests it against a row.
          const rowCheck = (kk, bb) => {
            const bad = rows.find(([x, y]) => kk * x + bb !== y) || rows[0];
            const got = kk * bad[0] + bb;
            return tr(
              `Test x = ${bad[0]}: ${evalText(kk, bb, bad[0])} = ${got}, but the table says ${bad[1]}.`,
              `Prueba x = ${bad[0]}: ${evalText(kk, bb, bad[0])} = ${got}, pero la tabla dice ${bad[1]}.`,
            );
          };
          const opts = [{ label: correct, correct: true }];
          const add = (label, why) => {
            if (label !== correct && !opts.some((o) => o.label === label) && opts.length < 4)
              opts.push({ label, correct: false, why });
          };
          add(
            `y = x + ${k + b}`,
            tr(
              `y = x + ${k + b} only works for x = 1. y grows by ${k} EACH step, so multiply x by ${k}.`,
              `y = x + ${k + b} solo funciona con x = 1. y crece ${k} en CADA paso, así que multiplica x por ${k}.`,
            ),
          );
          if (b > 0)
            add(
              ruleText(k, 0),
              tr(
                `${rowCheck(k, 0)} The table starts ${b} higher.`,
                `${rowCheck(k, 0)} La tabla empieza ${b} más arriba.`,
              ),
            );
          add(ruleText(k + 1, b), rowCheck(k + 1, b));
          add(ruleText(Math.max(2, k - 1), b), rowCheck(Math.max(2, k - 1), b));
          return {
            kind: "rule",
            story: false,
            rule: false,
            table,
            prompt: tr("Which equation matches the table?", "¿Qué ecuación corresponde a la tabla?"),
            choices: shuffle(opts),
            explain: tr(
              `Each y is ${k} times x${b ? ` plus ${b}` : ""}: ${correct}.`,
              `Cada y es ${k} veces x${b ? ` más ${b}` : ""}: ${correct}.`,
            ),
          };
        }

        // PLOT: the student moves the relay beacon to (x, y) and places it.
        qPlot(level, x) {
          const k = level.k,
            b = level.b;
          const ans = k * x + b;
          return {
            kind: "plot",
            story: false,
            rule: true,
            plotX: x,
            plotY: ans,
            prompt: tr(
              `Plot the relay stop for x = ${x} ${level.ivShort}. Move the beacon to the right height (y, ${level.dvShort}), then PLACE it.`,
              `Grafica la parada para x = ${x} ${level.ivShort}. Mueve la baliza a la altura correcta (y, ${level.dvShort}) y luego COLÓCALA.`,
            ),
            explain: `${ruleText(k, b)} → ${evalText(k, b, x)} = ${ans}. ${tr("Stop", "Parada")} (${x}, ${ans}).`,
          };
        }

        // reverse: given y, find x
        qReverse(level, x) {
          const k = level.k,
            b = level.b;
          const y = k * x + b;
          const wrongs = [];
          if (b > 0 && y % k === 0)
            wrongs.push([
              y / k,
              tr(`undo the + ${b} FIRST: ${y} − ${b}, then divide by ${k}.`, `deshaz el + ${b} PRIMERO: ${y} − ${b}, y luego divide entre ${k}.`),
            ]);
          if (b > 0)
            wrongs.push([
              y - b,
              tr(`you subtracted ${b}, but y is ${k} TIMES x. Divide by ${k} too.`, `restaste ${b}, pero y es ${k} VECES x. También divide entre ${k}.`),
            ]);
          wrongs.push([
            x + 1,
            tr(`check it: ${evalText(k, b, x + 1)} = ${k * (x + 1) + b}, not ${y}.`, `compruébalo: ${evalText(k, b, x + 1)} = ${k * (x + 1) + b}, no ${y}.`),
          ]);
          wrongs.push([
            x - 1,
            tr(`check it: ${evalText(k, b, x - 1)} = ${k * (x - 1) + b}, not ${y}.`, `compruébalo: ${evalText(k, b, x - 1)} = ${k * (x - 1) + b}, no ${y}.`),
          ]);
          return {
            kind: "reverse",
            story: false,
            rule: true,
            plotX: x,
            plotY: y,
            prompt: tr(
              `The rover reached y = ${y} ${level.dvShort}. What was x (${level.ivShort})?`,
              `El róver llegó a y = ${y} ${level.dvShort}. ¿Cuánto era x (${level.ivShort})?`,
            ),
            choices: targetedChoices(x, wrongs, 1),
            explain: b ? `(${y} − ${b}) ÷ ${k} = ${x}.` : `${y} ÷ ${k} = ${x}.`,
          };
        }

        // predict a far value (no plot)
        qPredict(level) {
          const k = level.k,
            b = level.b;
          const x = randInt(7, 10);
          const ans = k * x + b;
          const wrongs = [];
          if (b > 0)
            wrongs.push([
              k * x,
              tr(`that is ${k} × ${x}. The rule also adds the start value ${b}.`, `eso es ${k} × ${x}. La regla también suma el valor inicial ${b}.`),
            ]);
          wrongs.push([
            x + k + b,
            tr(`${k}x means ${k} TIMES x, not ${k} plus x.`, `${k}x significa ${k} POR x, no ${k} más x.`),
          ]);
          wrongs.push([
            k * (x + 1) + b,
            tr(`that is the value for x = ${x + 1}. Use x = ${x}.`, `ese es el valor para x = ${x + 1}. Usa x = ${x}.`),
          ]);
          wrongs.push([
            k * (x - 1) + b,
            tr(`that is the value for x = ${x - 1}. Use x = ${x}.`, `ese es el valor para x = ${x - 1}. Usa x = ${x}.`),
          ]);
          return {
            kind: "predict",
            story: false,
            rule: true,
            prompt: tr(
              `Mission check: predict y when x = ${x} ${level.ivShort} (off the grid).`,
              `Revisión de la misión: predice y cuando x = ${x} ${level.ivShort} (fuera de la cuadrícula).`,
            ),
            choices: targetedChoices(ans, wrongs, k),
            explain: `${ruleText(k, b)} → ${evalText(k, b, x)} = ${ans}.`,
          };
        }

        // ── question lifecycle ──
        nextQuestion() {
          if (this.qIndex >= this.queue.length) return this.completeLevel();
          this.locked = false;
          this.tries = 0;
          const q = this.queue[this.qIndex];
          this.current = q;

          this.scTitle.setText(this.level.name);
          this.scStory.setText(q.story ? this.level.story : "");
          this.tableT.setText(q.table || "");

          if (q.rule) {
            this.ruleChip.setVisible(true);
            this.ruleText
              .setVisible(true)
              .setText(`${tr("Rule", "Regla")}:  ${ruleText(this.level.k, this.level.b)}`);
          } else {
            this.ruleChip.setVisible(false);
            this.ruleText.setVisible(false);
          }

          this.qText.setText(q.prompt).setY(q.table ? 312 : 236);
          this.fbText.setText("");
          this.clearPlotControls();
          if (q.kind === "plot") {
            this.drawAnswers([]);
            this.startPlot(q);
            return;
          }
          this.drawAnswers(q.choices);
          this.setSR(
            `${q.prompt} ${tr("Options", "Opciones")}: ${q.choices
              .map((c, i) => `${i + 1}, ${c.label}`)
              .join(". ")}.`,
          );
        }

        drawAnswers(choices) {
          (this.answerBtns || []).forEach((o) => o.destroy());
          this.answerBtns = [];
          const n = choices.length;
          if (!n) return;
          const cols = n <= 2 ? n : 2;
          const rows = Math.ceil(n / cols);
          const bw = cols === 1 ? 380 : 196;
          const bh = 50;
          const gapx = 16,
            gapy = 10;
          const ANS_CY = 462;
          const totalW = cols * bw + (cols - 1) * gapx;
          const x0 = 230 - totalW / 2 + bw / 2;
          const y0 = ANS_CY - ((rows - 1) * (bh + gapy)) / 2;
          choices.forEach((c, i) => {
            const r = Math.floor(i / cols),
              cc = i % cols;
            const x = x0 + cc * (bw + gapx);
            const y = y0 + r * (bh + gapy);
            const cont = this.add.container(x, y).setDepth(6);
            const rect = this.add
              .rectangle(0, 0, bw, bh, 0x163450)
              .setStrokeStyle(2, C.panelEdge)
              .setInteractive({ useHandCursor: true });
            const num = this.add
              .text(-bw / 2 + 14, 0, String(i + 1), {
                fontFamily: "Arial, sans-serif",
                fontSize: "14px",
                fontStyle: "bold",
                color: "#9fc1de",
              })
              .setOrigin(0, 0.5);
            const lab = this.add
              .text(8, 0, c.label, {
                fontFamily: "Arial, sans-serif",
                fontSize: c.label.length > 14 ? "15px" : "18px",
                fontStyle: "bold",
                color: "#eaf4ff",
                align: "center",
                wordWrap: { width: bw - 44 },
              })
              .setOrigin(0.5);
            cont.add([rect, num, lab]);
            cont.rect = rect;
            cont.choice = c;
            rect.on("pointerover", () => {
              if (!this.locked && !cont.eliminated) rect.setFillStyle(0x1d4666);
            });
            rect.on("pointerout", () => {
              if (!this.locked && !cont.eliminated) rect.setFillStyle(0x163450);
            });
            rect.on("pointerdown", () => this.pick(i));
            this.answerBtns.push(cont);
          });
        }

        // ── PLOT stops ──────────────────────────────────────────────────
        startPlot(q) {
          const last = this.plottedPts.length
            ? this.plottedPts[this.plottedPts.length - 1].y
            : this.level.b;
          this.beaconY = last;
          // Highlight the x column the stop must sit on.
          const g = this.add.graphics().setDepth(3);
          g.fillStyle(C.accent, 0.12);
          g.fillRect(this.sx(q.plotX) - 9, this.sy(this.yMax), 18, this.gh);
          g.lineStyle(2, C.accent, 0.5);
          g.lineBetween(this.sx(q.plotX), this.sy(0), this.sx(q.plotX), this.sy(this.yMax));
          this.plotCtl.push(g);
          this.beacon = this.add.container(this.sx(q.plotX), this.sy(last)).setDepth(7);
          const ring = this.add.circle(0, 0, 11, 0x000000, 0).setStrokeStyle(3, 0xff9de2);
          const dotC = this.add.circle(0, 0, 5, 0xff9de2);
          this.beaconLabel = this.add
            .text(14, -14, "", {
              fontFamily: "Arial, sans-serif",
              fontSize: "14px",
              fontStyle: "bold",
              color: "#ffd1f1",
              backgroundColor: "#10263fdd",
              padding: { x: 4, y: 2 },
            })
            .setOrigin(0, 0.5);
          this.beacon.add([ring, dotC, this.beaconLabel]);
          this.plotCtl.push(this.beacon);
          // Controls in the answer area: −5 −1 +1 +5 and PLACE (44px+ targets).
          const mkBtn = (x, y, w, label, fn, color) => {
            const c = this.add.container(x, y).setDepth(6);
            const r = this.add
              .rectangle(0, 0, w, 48, color || 0x163450)
              .setStrokeStyle(2, C.panelEdge)
              .setInteractive({ useHandCursor: true });
            const t = this.add
              .text(0, 0, label, {
                fontFamily: "Arial, sans-serif",
                fontSize: "18px",
                fontStyle: "bold",
                color: "#eaf4ff",
              })
              .setOrigin(0.5);
            c.add([r, t]);
            r.on("pointerdown", () => {
              if (!this.locked) fn();
            });
            this.plotCtl.push(c);
            return c;
          };
          [
            [-5, "▼ 5"],
            [-1, "▼ 1"],
            [1, "▲ 1"],
            [5, "▲ 5"],
          ].forEach(([d, label], i) => mkBtn(74 + i * 104, 430, 94, label, () => this.moveBeacon(d)));
          mkBtn(230, 488, 380, tr("PLACE THE RELAY ✓", "COLOCAR LA BALIZA ✓"), () => this.placeBeacon(), 0x2f8f5a);
          plotPad.show(true);
          this.updateBeacon(true);
        }
        clearPlotControls() {
          (this.plotCtl || []).forEach((o) => o.destroy());
          this.plotCtl = [];
          this.beacon = null;
          plotPad.show(false);
        }
        setBeacon(y) {
          this.beaconY = Phaser.Math.Clamp(y, 0, this.yMax);
          this.updateBeacon();
        }
        moveBeacon(d) {
          this.setBeacon(this.beaconY + d);
        }
        updateBeacon(first) {
          if (!this.beacon) return;
          const q = this.current;
          this.beacon.y = this.sy(this.beaconY);
          this.beaconLabel.setText(`(${q.plotX}, ${this.beaconY})`);
          const msg = first
            ? `${q.prompt} ${tr(
                `The beacon is at y = ${this.beaconY}. Use up and down arrows, or tap the grid, then Enter to place it.`,
                `La baliza está en y = ${this.beaconY}. Usa las flechas arriba y abajo, o toca la cuadrícula, y luego Enter para colocarla.`,
              )}`
            : tr(`Beacon at x = ${q.plotX}, y = ${this.beaconY}.`, `Baliza en x = ${q.plotX}, y = ${this.beaconY}.`);
          this.setSR(msg);
        }
        placeBeacon() {
          const q = this.current;
          if (!q || q.kind !== "plot" || this.locked) return;
          const y = this.beaconY;
          if (y === q.plotY) {
            this.answerCorrect(q, this.sx(q.plotX), this.sy(y));
            return;
          }
          const k = this.level.k,
            b = this.level.b,
            x = q.plotX;
          let why;
          if (b > 0 && y === k * x)
            why = tr(`that height is ${k} × ${x}. The rule also adds the start value ${b}.`, `esa altura es ${k} × ${x}. La regla también suma el valor inicial ${b}.`);
          else if (y === x + k + b)
            why = tr(`${k}x means ${k} TIMES x, not ${k} plus x.`, `${k}x significa ${k} POR x, no ${k} más x.`);
          else if (y === k * (x - 1) + b || y === k * (x + 1) + b)
            why = tr(
              `that is the height for x = ${y === k * (x - 1) + b ? x - 1 : x + 1}. This stop is at x = ${x}.`,
              `esa es la altura para x = ${y === k * (x - 1) + b ? x - 1 : x + 1}. Esta parada está en x = ${x}.`,
            );
          else if (y === b)
            why = tr(`that is the start value at x = 0. Go up ${k} for each step of x.`, `ese es el valor inicial en x = 0. Sube ${k} por cada paso de x.`);
          else
            why =
              y > q.plotY
                ? tr("the beacon is too HIGH for this stop.", "la baliza está demasiado ALTA para esta parada.")
                : tr("the beacon is too LOW for this stop.", "la baliza está demasiado BAJA para esta parada.");
          this.answerWrong(q, why, () => {
            if (this.beacon) {
              this.beacon.list[0].setStrokeStyle(3, C.bad);
              this.time.delayedCall(500, () => this.beacon?.list[0].setStrokeStyle(3, 0xff9de2));
            }
          });
        }

        // Help ladder (calm, earned): miss 1 = method hint with no answer;
        // miss 2 = the worked step with the last value left blank; miss 3 =
        // the full explanation. A wrong pick never shows the answer early.
        methodHint(q) {
          switch (q.kind) {
            case "id":
              return tr(
                "The independent variable is the one you choose or change. The dependent variable changes BECAUSE of it.",
                "La variable independiente es la que eliges o cambias. La variable dependiente cambia A CAUSA de ella.",
              );
            case "rule":
              return tr(
                "Test each equation with a row of the table: put in x and see if you get that row's y. Check more than one row.",
                "Prueba cada ecuación con una fila de la tabla: pon x y mira si sale la y de esa fila. Revisa más de una fila.",
              );
            case "reverse":
              return tr(
                "Work backwards: undo the adding first (subtract), then undo the multiplying (divide).",
                "Trabaja al revés: deshaz primero la suma (resta) y luego la multiplicación (divide).",
              );
            default:
              return tr(
                "Use the rule: put the x value into the equation in place of x. Multiply first, then add.",
                "Usa la regla: pon el valor de x en la ecuación en lugar de x. Primero multiplica y luego suma.",
              );
          }
        }
        workedStep(q) {
          const k = this.level.k,
            b = this.level.b;
          if (q.kind === "rule") return q.explain.split(":")[0] + ".";
          if (q.kind === "id") return this.methodHint(q);
          if (q.kind === "reverse")
            return b ? `(${q.plotY} − ${b}) ÷ ${k} = ?` : `${q.plotY} ÷ ${k} = ?`;
          if (q.kind === "plot") return `y = ${evalText(k, b, q.plotX)} = ?`;
          const cut = q.explain.replace(/\s*=\s*[^=]+$/, "");
          return cut !== q.explain ? cut + " = ?" : q.explain;
        }

        pick(i) {
          if (this.locked) return;
          const btns = this.answerBtns;
          if (!btns || !btns[i] || btns[i].eliminated) return;
          const cont = btns[i];
          const q = this.current;
          if (cont.choice.correct) {
            cont.rect.setFillStyle(0x1c5a3a).setStrokeStyle(3, C.good);
            this.answerCorrect(q, cont.x, cont.y);
            return;
          }
          cont.eliminated = true;
          cont.rect.setFillStyle(0x5a1c1c, 0.6).setStrokeStyle(3, C.bad);
          cont.rect.disableInteractive();
          cont.setAlpha(0.55);
          this.answerWrong(
            q,
            cont.choice.why || tr(`${cont.choice.label} is not it.`, `${cont.choice.label} no es.`),
          );
        }

        answerCorrect(q, fx, fy) {
          this.locked = true;
          const tries = this.tries || 0;
          if (tries === 0) {
            this.streak++;
            this.firstTry++;
          }
          this.solved++;
          // Full points unaided; fewer after help.
          const gain = tries === 0 ? 100 + Math.min(this.streak, 5) * 20 : tries === 1 ? 50 : 25;
          this.score += gain;
          window.FlagshipAdventure?.record({
            firstTry: tries === 0,
            kind: q.plotX != null ? "plot" : "rule",
          });
          if (q.kind === "plot")
            document.dispatchEvent(
              new CustomEvent("flagship:answer", {
                detail: { correct: true, message: tr("Relay placed. ", "Baliza colocada. ") + q.explain },
              }),
            );
          this.fbText.setColor("#4fd18b").setText(`✓ +${gain}   ${q.explain}`);
          if (!reducedMotion()) this.burst(fx, fy, C.good);
          if (q.plotX != null) this.plotPoint(q.plotX, q.plotY);
          this.clearPlotControls();
          this.setSR(`${tr("Correct.", "Correcto.")} ${q.explain}`);
          this.refreshHUD();
          this.time.delayedCall(1700, () => {
            this.qIndex++;
            this.nextQuestion();
          });
        }

        answerWrong(q, why, after) {
          this.streak = 0;
          this.tries = (this.tries || 0) + 1;
          const left =
            q.kind === "plot" ? 2 : this.answerBtns.filter((b) => !b.eliminated).length;
          const lead = tr("Not yet — ", "Todavía no: ") + why;
          let msg;
          if (this.tries === 1 && left > 1) {
            msg = `${lead} ${tr("Hint:", "Pista:")} ${this.methodHint(q)}`;
          } else if (this.tries === 2 && left > 1) {
            msg = `${lead} ${tr("Try this step:", "Prueba este paso:")} ${this.workedStep(q)}`;
          } else if (q.kind === "plot") {
            msg = tr(
              `Here is how: ${q.explain} Move the beacon to y = ${q.plotY} and place it.`,
              `Así se hace: ${q.explain} Mueve la baliza a y = ${q.plotY} y colócala.`,
            );
          } else {
            msg = tr(
              `Here is how: ${q.explain} Tap the matching answer to go on.`,
              `Así se hace: ${q.explain} Toca la respuesta que coincide para seguir.`,
            );
          }
          this.fbText.setColor("#ffcf66").setText(msg);
          this.setSR(msg);
          if (q.kind === "plot")
            document.dispatchEvent(
              new CustomEvent("flagship:answer", { detail: { correct: false, message: msg } }),
            );
          try {
            const fm = document.querySelector(".fm-feedback");
            if (fm) fm.textContent = msg;
          } catch (e) {}
          if (!reducedMotion()) this.cameras.main.shake(120, 0.003);
          if (after) after();
          this.refreshHUD();
        }

        plotPoint(x, y) {
          const px = this.sx(x),
            py = this.sy(y);
          const prev =
            this.plottedPts.length > 0
              ? this.plottedPts[this.plottedPts.length - 1]
              : { px: this.sx(0), py: this.sy(this.level.b) };
          this.plotGfx.lineStyle(3, C.line, 0.9);
          this.plotGfx.lineBetween(prev.px, prev.py, px, py);
          this.plotGfx.fillStyle(C.gold, 1);
          this.plotGfx.fillCircle(px, py, 6);
          this.plotGfx.lineStyle(2, 0x6b4e00, 1);
          this.plotGfx.strokeCircle(px, py, 6);
          this.plottedPts.push({ px, py, x, y });
          if (reducedMotion()) {
            this.rover.x = px;
            this.rover.y = py;
          } else {
            this.tweens.add({ targets: this.rover, x: px, y: py, duration: 600, ease: "Sine.inOut" });
          }
          this.add
            .text(px + 8, py - 8, `(${x}, ${y})`, {
              fontFamily: "Arial, sans-serif",
              fontSize: "13px",
              fontStyle: "bold",
              color: "#ffcd4d",
            })
            .setDepth(6);
        }

        burst(x, y, color) {
          const p = this.add.particles(x, y, "dot", {
            speed: { min: 60, max: 180 },
            angle: { min: 0, max: 360 },
            scale: { start: 1, end: 0 },
            lifespan: 500,
            quantity: 14,
            tint: color,
          });
          this.time.delayedCall(550, () => p.destroy());
        }

        completeLevel() {
          this.score += 250; // mission bonus
          this.refreshHUD();
          this.clearPlotControls();
          const ov = this.add.container(0, 0).setDepth(20);
          ov.add(this.add.rectangle(W / 2, H / 2, W, H, 0x05101d, 0.82));
          ov.add(
            this.add
              .text(W / 2, 230, tr("MISSION COMPLETE", "MISIÓN COMPLETA"), {
                fontFamily: "Arial, sans-serif",
                fontSize: "42px",
                fontStyle: "900",
                color: "#4fd18b",
              })
              .setOrigin(0.5),
          );
          ov.add(
            this.add
              .text(
                W / 2,
                292,
                tr(
                  `Rule mastered:  ${ruleText(this.level.k, this.level.b)}\nThe stops make a straight line: y grows by ${this.level.k} for every 1 step of x.\n+250 mission bonus`,
                  `Regla dominada:  ${ruleText(this.level.k, this.level.b)}\nLas paradas forman una línea recta: y crece ${this.level.k} por cada paso de x.\n+250 de bono`,
                ),
                {
                  fontFamily: "Arial, sans-serif",
                  fontSize: "19px",
                  color: "#eaf4ff",
                  align: "center",
                  lineSpacing: 6,
                  wordWrap: { width: 760 },
                },
              )
              .setOrigin(0.5),
          );
          if (!reducedMotion()) this.confetti();
          const last = this.levelIndex + 1 >= TOTAL_LEVELS;
          const label = last ? tr("🏁  SEE RESULTS", "🏁  VER RESULTADOS") : tr("▶  NEXT MISSION", "▶  SIGUIENTE MISIÓN");
          // Depth 21 is what the shared mission panel looks for to mirror
          // this "Continue mission" control.
          const btn = this.add
            .rectangle(W / 2, 390, 320, 56, 0x2f8f5a)
            .setStrokeStyle(3, 0xffffff, 0.85)
            .setDepth(21)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(W / 2, 390, label, {
              fontFamily: "Arial, sans-serif",
              fontSize: "22px",
              fontStyle: "bold",
              color: "#fff",
            })
            .setOrigin(0.5)
            .setDepth(22);
          btn.on("pointerover", () => btn.setScale(1.04));
          btn.on("pointerout", () => btn.setScale(1));
          const go = () => {
            if (!this.levelDone) return;
            this.levelDone = null;
            const carry = {
              score: this.score,
              firstTry: this.firstTry,
              solved: this.solved,
              asked: this.asked,
            };
            if (last) {
              this.scene.start("Result", { ...carry, won: true });
            } else {
              this.scene.start("Game", { ...carry, level: this.levelIndex + 1 });
            }
          };
          this.levelDone = go;
          btn.on("pointerdown", go);
          this.setSR(
            tr(
              `Mission complete. You mastered ${ruleText(this.level.k, this.level.b)}. Score ${this.score}. Press Enter for the ${last ? "results" : "next mission"}.`,
              `Misión completa. Dominaste ${ruleText(this.level.k, this.level.b)}. Puntos ${this.score}. Presiona Enter para ${last ? "ver los resultados" : "la siguiente misión"}.`,
            ),
          );
        }

        confetti() {
          const p = this.add.particles(W / 2, -10, "chip", {
            x: { min: 0, max: W },
            y: -10,
            speedY: { min: 120, max: 280 },
            speedX: { min: -60, max: 60 },
            angle: { min: 0, max: 360 },
            rotate: { min: 0, max: 360 },
            scale: { min: 0.7, max: 1.4 },
            lifespan: 2600,
            quantity: 3,
            frequency: 40,
            tint: [0xffcd4d, 0x5ad1ff, 0x4fd18b, 0xff6b6b],
          });
          this.time.delayedCall(1800, () => p.stop());
        }

        setSR(msg) {
          const el = document.getElementById("vv-sr");
          if (el) el.textContent = msg;
        }
      }

      // ════════════════════════════════════════════════════════════════════
      //  RESULT
      // ════════════════════════════════════════════════════════════════════
      class ResultScene extends Phaser.Scene {
        constructor() {
          super("Result");
        }
        init(data) {
          this.score = data.score || 0;
          this.won = !!data.won;
          this.firstTry = data.firstTry || 0;
          this.asked = data.asked || 0;
        }
        create() {
          this.cameras.main.setBackgroundColor(C.bg);
          const cx = W / 2;
          // Stars from unaided first tries, not raw points.
          const ratio = this.asked ? this.firstTry / this.asked : 0;
          const stars = ratio >= 0.8 ? 3 : ratio >= 0.6 ? 2 : 1;
          try {
            window.EduPulse &&
              EduPulse.record({
                activityTitle: document.title,
                score: this.firstTry,
                maxScore: this.asked,
                problemsCorrect: this.firstTry,
                problemsAttempted: this.asked,
                percent: Math.round(ratio * 100),
                points: this.score,
                stars: stars,
              });
          } catch (e) {}
          this.add
            .text(cx, 150, this.won ? tr("RELAY COMPLETE!", "¡RELEVO COMPLETO!") : tr("RELAY PAUSED", "RELEVO EN PAUSA"), {
              fontFamily: "Arial, sans-serif",
              fontSize: "46px",
              fontStyle: "900",
              color: this.won ? "#4fd18b" : "#ff8f8f",
            })
            .setOrigin(0.5);

          for (let i = 0; i < 3; i++) {
            this.add
              .text(cx - 80 + i * 80, 240, i < stars ? "★" : "☆", {
                fontFamily: "Arial, sans-serif",
                fontSize: "64px",
                color: i < stars ? "#ffcd4d" : "#3a5774",
              })
              .setOrigin(0.5);
          }

          this.add
            .text(cx, 318, `${tr("Final Score", "Puntaje final")}: ${this.score}`, {
              fontFamily: "Arial, sans-serif",
              fontSize: "30px",
              fontStyle: "bold",
              color: "#eaf4ff",
            })
            .setOrigin(0.5);
          this.add
            .text(
              cx,
              364,
              tr(
                `First try: ${this.firstTry} of ${this.asked}. You linked tables, equations, and graphs across every mission.`,
                `Al primer intento: ${this.firstTry} de ${this.asked}. Uniste tablas, ecuaciones y gráficas en cada misión.`,
              ),
              {
                fontFamily: "Arial, sans-serif",
                fontSize: "17px",
                color: "#cfe3f5",
                align: "center",
                wordWrap: { width: 600 },
              },
            )
            .setOrigin(0.5);

          const again = () => {
            if (!this.sys.isActive()) return;
            this.scene.start("Game", { level: 0, score: 0 });
          };
          this.btn(cx, 460, tr("↻  PLAY AGAIN", "↻  JUGAR OTRA VEZ"), 0x2f8f5a, again);
          this.input.keyboard.on("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") again();
          });

          const el = document.getElementById("vv-sr");
          if (el)
            el.textContent = tr(
              `Relay complete. Final score ${this.score}, ${stars} stars. First try ${this.firstTry} of ${this.asked}. Press Enter to play again.`,
              `Relevo completo. Puntaje final ${this.score}, ${stars} estrellas. Al primer intento ${this.firstTry} de ${this.asked}. Presiona Enter para jugar otra vez.`,
            );
        }
        btn(x, y, label, color, cb) {
          const b = this.add
            .rectangle(x, y, 300, 56, color)
            .setStrokeStyle(3, 0xffffff, 0.85)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(x, y, label, {
              fontFamily: "Arial, sans-serif",
              fontSize: "20px",
              fontStyle: "bold",
              color: "#fff",
            })
            .setOrigin(0.5);
          b.on("pointerover", () => b.setScale(1.04));
          b.on("pointerout", () => b.setScale(1));
          b.on("pointerdown", cb);
        }
      }

      // ── Touch pad for plot stops (phones, tablets): real <button>s with
      // 48px targets, because the scaled canvas buttons get small on a
      // phone. Shown only while a plot stop is waiting for the beacon.
      const plotPad = (() => {
        const wrap = document.createElement("div");
        wrap.id = "vv-plot-pad";
        wrap.setAttribute("role", "group");
        wrap.setAttribute("aria-label", tr("Move the relay beacon", "Mover la baliza"));
        wrap.hidden = true;
        // Keep taps on the pad from reaching the game canvas underneath.
        ["pointerdown", "mousedown", "touchstart"].forEach((t) =>
          wrap.addEventListener(t, (e) => e.stopPropagation(), { passive: true }),
        );
        const scene = () => window.__flagshipGame?.scene.getScene("Game");
        [
          ["▼ 5", -5, tr("Down 5", "Bajar 5")],
          ["▼ 1", -1, tr("Down 1", "Bajar 1")],
          ["▲ 1", 1, tr("Up 1", "Subir 1")],
          ["▲ 5", 5, tr("Up 5", "Subir 5")],
        ].forEach(([label, d, aria]) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = label;
          b.setAttribute("aria-label", aria);
          b.addEventListener("click", () => {
            const s = scene();
            if (s && s.sys.isActive() && !s.locked) s.moveBeacon(d);
          });
          wrap.append(b);
        });
        const place = document.createElement("button");
        place.type = "button";
        place.className = "vv-place";
        place.textContent = tr("Place ✓", "Colocar ✓");
        place.addEventListener("click", () => {
          const s = scene();
          if (s && s.sys.isActive()) s.placeBeacon();
        });
        wrap.append(place);
        const attach = () => document.body.append(wrap);
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", attach, { once: true });
        else attach();
        return { show: (on) => (wrap.hidden = !on) };
      })();

      function capit(s) {
        return s.charAt(0).toUpperCase() + s.slice(1);
      }

      // ── launch ──
      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0a1a2e",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, GameScene, ResultScene],
      };
      const vvGame = (window.__flagshipGame = new Phaser.Game(config));

      // ── Canvas accessibility (additive; no gameplay change) ──
      // Phaser renders into one <canvas> that is not in the tab order by
      // default. Label the canvas, make it focusable, and focus it on first
      // pointer so the keyboard controls work immediately.
      vvGame.events.once("ready", function () {
        try {
          const cv = vvGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            tr(
              "Variable Velocity Rover Relay math game. Identify variables, find the rule, and plot each relay stop. Number keys 1 to 4 choose an answer; on a plot stop, up and down arrows move the beacon (Shift moves 5) and Enter places it. Questions and feedback are announced as text.",
              "Juego Variable Velocity, Relevo del róver. Identifica variables, halla la regla y grafica cada parada. Las teclas 1 a 4 eligen una respuesta; en una parada, las flechas arriba y abajo mueven la baliza (Shift mueve 5) y Enter la coloca. Las preguntas y la retroalimentación se anuncian como texto.",
            ),
          );
          cv.setAttribute("aria-roledescription", tr("math game", "juego de matemáticas"));
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>

      <!-- EWL Diagnostic Misconception Coach -->
      <div class="ewl-coach-card" id="ewl-coach-card" style="display: flex; position: relative; z-index: 100;">
