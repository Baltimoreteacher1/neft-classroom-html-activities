    <script>
      // ───────────────────────────────────────────────────────────
      // DISCOUNT DASH — SALE RUNNER  (Neft Teacher)
      // Grade 6: 6.AT.A.3c — percent of a quantity (discounts, sale price).
      //
      // REAL GAME: A calm, TURN-BASED 3-lane shopping aisle. One deal row sits
      // on the shelf and waits — nothing moves until the student picks. Each
      // lane shows the SAME item at its own price and "% off"; the student
      // picks the lane with the BEST DEAL — the lowest sale price =
      // original × (1 − pct/100). A wrong pick earns a method hint (Tier 1),
      // a second wrong pick earns worked sale prices (Tier 2); the student
      // always finishes the deal (no-fail). Full points for an unaided first
      // pick, fewer when helped. No clock, no speed, no lives.
      // ───────────────────────────────────────────────────────────
      const W = 1024,
        H = 768;
      const LS_KEY = "discountdash_runner_hi";
      const LANES = [W / 2 - 240, W / 2, W / 2 + 240];
      // Turn-based run: fixed number of deal rows; layout rows (canvas px).
      const TOTAL_ROUNDS = 12;
      const ROW_Y = 200; // deal cards sit here and never move
      const COACH_Y = 352; // persistent coach / feedback line
      const CART_Y = 560; // the shopper's cart under the chosen lane
      const NEXT_Y = 660; // "Next deal" button after a solved deal
      // Most points possible: every deal first try, streak bonus capped at +50.
      const MAX_SCORE = Array.from({ length: TOTAL_ROUNDS }, (_, i) => 100 + Math.min(i, 5) * 10).reduce((a, b) => a + b, 0);

      // ── Reduced-motion guard (bespoke FX respect prefers-reduced-motion) ──
      // Live-tracked so an OS-level toggle is honored without a reload.
      const RM = { reduce: false };
      try {
        const _mq = window.matchMedia("(prefers-reduced-motion: reduce)");
        RM.reduce = !!_mq.matches;
        const _onRM = (e) => {
          RM.reduce = !!e.matches;
        };
        _mq.addEventListener
          ? _mq.addEventListener("change", _onRM)
          : _mq.addListener && _mq.addListener(_onRM);
      } catch (e) {}
      const reducedMotion = () => window.__flagshipReduced ?? (RM.reduce);

      class SFX {
        constructor() {
          this.ctx = null;
        }
        init() {
          if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        }
        tone(f, d, t = "sine", v = 0.06) {
          if (window.__flagshipMuted) return;
          if (!this.ctx) return;
          try {
            const o = this.ctx.createOscillator(),
              g = this.ctx.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start();
            o.stop(this.ctx.currentTime + d);
          } catch (e) {}
        }
        grab() {
          this.tone(660, 0.08, "sine");
          setTimeout(() => this.tone(990, 0.1, "sine"), 60);
        }
        bad() {
          this.tone(150, 0.25, "sawtooth", 0.08);
        }
        swish() {
          this.tone(400, 0.05, "triangle", 0.03);
        }
      }
      const sfx = new SFX();
      const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
      const money = (n) => "$" + n.toFixed(2);

      // Build a deal-row: an item at one original price, with a different
      // percent-off in each lane. Exactly one lane is the best (lowest) deal.
      function makeRow(round, tier = 2) {
        const items = ["👟", "🎧", "🧥", "🎒", "⌚", "📱", "🕹️", "👕", "🧢", "👜"];
        const base = tier === 1 ? randInt(2, 12) * 10 : randInt(round < 4 ? 10 : 20, round < 4 ? 60 : 120);
        // percents get closer together as rounds climb (harder to compare)
        const pcts = tier === 1 ? [10, 25, 50] : round < 3 ? [10, 25, 50] : round < 6 ? [15, 30, 45] : [20, 35, 40];
        Phaser.Utils.Array.Shuffle(pcts);
        const emoji = Phaser.Utils.Array.GetRandom(items);
        // Pedagogy fix: give each lane its OWN original price (close to the row
        // base) so the cheapest sale price is NOT just "biggest % off wins" —
        // students must actually compute price × (1 − %/100) to compare. The
        // larger price spread on later rounds keeps the comparison non-trivial.
        const spread = round < 4 ? 8 : 14;
        const cells = pcts.map((p) => {
          const cellBase = tier === 1 ? Math.max(10, base + randInt(-2, 2) * 10) : Math.max(5, base + randInt(-spread, spread));
          return {
            pct: p,
            base: cellBase,
            sale: Math.round(cellBase * (1 - p / 100) * 100) / 100,
          };
        });
        // best deal = lowest sale price; when two lanes tie at the same
        // rounded-cents price, EVERY tied lane counts as correct.
        let bestIdx = 0;
        cells.forEach((c, i) => {
          if (c.sale < cells[bestIdx].sale) bestIdx = i;
        });
        const bestIdxs = cells
          .map((c, i) => i)
          .filter((i) => cells[i].sale === cells[bestIdx].sale);
        return { emoji, base, cells, bestIdx, bestIdxs };
      }

      class BootScene extends Phaser.Scene {
        constructor() {
          super("Boot");
        }
        create() {
          this.scene.start("Title");
        }
      }

      class TitleScene extends Phaser.Scene {
        constructor() {
          super("Title");
        }
        create() {
          this.cameras.main.setBackgroundColor("#10243f");
          this.add
            .text(W / 2, 140, "DISCOUNT DASH", {
              fontFamily: "Arial, Inter, system-ui, sans-serif",
              fontSize: "66px",
              fontStyle: "900",
              color: "#ffe066",
            })
            .setOrigin(0.5);
          this.add
            .text(W / 2, 208, "BEST DEAL SHOPPER", {
              fontFamily: "Arial, Inter, system-ui, sans-serif",
              fontSize: "28px",
              fontStyle: "700",
              color: "#74c0fc",
              letterSpacing: 6,
            })
            .setOrigin(0.5);
          this.add
            .text(
              W / 2,
              320,
              "12 deals. Each lane shows the same kind of item\nat its own price and % off. Nothing moves until you choose —\ntake your time, then pick the lane with the LOWEST sale price!",
              {
                fontFamily: "Arial, Inter, system-ui, sans-serif",
                fontSize: "21px",
                color: "#dbe4ff",
                align: "center",
                lineSpacing: 8,
              },
            )
            .setOrigin(0.5);
          this.add
            .text(
              W / 2,
              440,
              "Tap a deal card, or ← → / 1 2 3 + Enter    •    sale price = price × (100 − % off) ÷ 100",
              {
                fontFamily: "Arial, Inter, system-ui, sans-serif",
                fontSize: "18px",
                color: "#94a3b8",
              },
            )
            .setOrigin(0.5);
          const hi = parseInt(localStorage.getItem(LS_KEY) || "0");
          this.add
            .text(W / 2, 500, "Best savings total: " + hi, {
              fontFamily: "Arial, Inter, system-ui, sans-serif",
              fontSize: "18px",
              color: "#ffd43b",
            })
            .setOrigin(0.5);
          const btn = this.add
            .rectangle(W / 2, 600, 280, 70, 0xffe066)
            .setInteractive({ useHandCursor: true });
          const t = this.add
            .text(W / 2, 600, "START SPREE", {
              fontFamily: "Arial, Inter, system-ui, sans-serif",
              fontSize: "28px",
              fontStyle: "800",
              color: "#10243f",
            })
            .setOrigin(0.5);
          if (!reducedMotion())
            this.tweens.add({
              targets: [btn, t],
              scale: 1.05,
              duration: 700,
              yoyo: true,
              repeat: -1,
              ease: "Sine.inOut",
            });
          const go = () => {
            sfx.init();
            this.scene.start("Game");
          };
          btn.on("pointerdown", go);
          this.input.keyboard.once("keydown-ENTER", go);

        }
      }

      class GameScene extends Phaser.Scene {
        constructor() {
          super("Game");
        }
        create() {
          this.cameras.main.setBackgroundColor("#10243f");
          this.score = 0;
          this.savings = 0;
          this.combo = 0;
          this.firstTry = 0; // deals solved on the first pick, no help
          this.helped = 0; // deals solved after a hint
          this.round = 0;
          this.lane = 1;
          this.gameOver = false;
          // Turn-based: exactly one deal row is on the shelf at a time and it
          // never moves. Nothing happens until the student picks a lane.
          this.row = null;
          this.walk = 0; // cosmetic aisle stroll between deals (ms left)
          this.nextBtn = null;

          // ── Parallax mall storefront background (multi-depth layers) ──
          // Purely decorative; it only drifts during the short stroll between
          // deals (never while a deal waits). Honors reduced-motion.
          this.bgLayers = this.buildStorefronts();
          this.bgSwayX = 0;
          this.input.on("pointermove", (p) => {
            if (reducedMotion()) return;
            this.bgSwayX = ((p.x / W) * 2 - 1) * 18;
          });

          // floor stripes
          this.stripes = [];
          for (let i = 0; i < 14; i++) {
            const s = this.add
              .rectangle(W / 2, i * 60 - 60, 700, 30, i % 2 ? 0x16335a : 0x12294a)
              .setDepth(0);
            this.stripes.push(s);
          }
          // lane dividers
          for (const lx of [W / 2 - 120, W / 2 + 120]) {
            for (let i = 0; i < 20; i++)
              this.add.rectangle(lx, i * 80, 4, 40, 0x2c4a72, 0.6).setDepth(1);
          }

          // player shopper
          this.player = this.add
            .text(LANES[this.lane], CART_Y, "🛒", { fontSize: "64px" })
            .setOrigin(0.5)
            .setDepth(10);

          // HUD
          const hudStyle = (c, s = "22px") => ({
            fontFamily: "Arial, Inter, system-ui, sans-serif",
            fontSize: s,
            fontStyle: "700",
            color: c,
            backgroundColor: "#0a1830",
            padding: { x: 10, y: 4 },
          });
          this.hud = this.add.text(20, 14, "", hudStyle("#ffe066")).setDepth(20);
          this.savHud = this.add.text(W - 20, 14, "", hudStyle("#51cf66")).setOrigin(1, 0).setDepth(20);
          this.comboHud = this.add.text(W / 2, 14, "", hudStyle("#ffd8e8")).setOrigin(0.5, 0).setDepth(20);

          // Coach line (persistent — feedback never fades before it is read).
          this.coach = this.add
            .text(W / 2, COACH_Y, "", {
              fontFamily: "Arial, Inter, system-ui, sans-serif",
              fontSize: "24px",
              fontStyle: "700",
              color: "#dbe4ff",
              backgroundColor: "#0a1830",
              padding: { x: 16, y: 10 },
              align: "center",
              wordWrap: { width: 900 },
              lineSpacing: 4,
            })
            .setOrigin(0.5, 0)
            .setDepth(25);
          this.prompt = this.add
            .text(W / 2, H - 26, "", {
              fontFamily: "Arial, Inter, system-ui, sans-serif",
              fontSize: "18px",
              color: "#a5d8ff",
            })
            .setOrigin(0.5)
            .setDepth(25);

          // input — every action has a key: ←/→ or A/D to move, 1/2/3 to jump
          // to a lane, Enter/Space to pick (or to go on to the next deal).
          const kb = this.input.keyboard;
          kb.on("keydown-LEFT", () => this.move(-1));
          kb.on("keydown-RIGHT", () => this.move(1));
          kb.on("keydown-A", () => this.move(-1));
          kb.on("keydown-D", () => this.move(1));
          kb.on("keydown-ONE", () => this.setLane(0));
          kb.on("keydown-TWO", () => this.setLane(1));
          kb.on("keydown-THREE", () => this.setLane(2));
          kb.on("keydown-ENTER", () => this.primaryAction());
          kb.on("keydown-SPACE", () => this.primaryAction());

          this.nextDeal();
        }

        // Enter/Space: pick the current lane, or continue after a solved deal.
        primaryAction() {
          if (this.gameOver) return;
          if (this.row && this.row.scored) this.nextDeal();
          else this.confirmGrab();
        }

        // Build procedural mall storefronts in three parallax bands. Returns
        // an array of {container, speed, baseX} ready for the scroll loop.
        buildStorefronts() {
          const cfg = [
            {
              speed: 0.18,
              depth: -12,
              alpha: 0.5,
              fill: 0x102a4d,
              w: 120,
              h: 90,
              gap: 30,
            },
            {
              speed: 0.34,
              depth: -11,
              alpha: 0.7,
              fill: 0x163a66,
              w: 150,
              h: 130,
              gap: 26,
            },
            {
              speed: 0.55,
              depth: -10,
              alpha: 0.85,
              fill: 0x1d4a80,
              w: 190,
              h: 180,
              gap: 22,
            },
          ];
          const accent = [0xffe066, 0x74c0fc, 0xff7eb6, 0x51cf66];
          const layers = [];
          cfg.forEach((band, bi) => {
            const cont = this.add.container(0, 0).setDepth(band.depth);
            const unit = band.w + band.gap;
            const count = Math.ceil(W / unit) + 2;
            const baseY = 50 + (2 - bi) * 12;
            // Vertical wrap distance: one band tall + breathing room. Two
            // stacked copies (one a full span above) make the downward scroll
            // seamless — copy A leaves the top exactly as copy B arrives.
            const span = band.h + 70;
            const drawShop = (x, y, i) => {
              const shop = this.add
                .rectangle(x, y, band.w, band.h, band.fill, band.alpha)
                .setOrigin(0.5, 0);
              cont.add(shop);
              // awning stripe (accent) — the classic mall storefront cue
              const aw = this.add
                .rectangle(
                  x,
                  y + band.h,
                  band.w + 6,
                  10,
                  accent[(i + bi) % accent.length],
                  band.alpha,
                )
                .setOrigin(0.5, 0);
              cont.add(aw);
              // lit "window"
              const wq = this.add
                .rectangle(
                  x,
                  y + band.h * 0.45,
                  band.w * 0.6,
                  band.h * 0.4,
                  0x0a1830,
                  Math.min(1, band.alpha + 0.1),
                )
                .setOrigin(0.5, 0.5);
              cont.add(wq);
            };
            for (let i = 0; i < count; i++) {
              const x = i * unit + band.w / 2;
              drawShop(x, baseY, i); // copy B (on-screen)
              drawShop(x, baseY - span, i); // copy A (one span above)
            }
            layers.push({ cont, speed: band.speed, span });
          });
          return layers;
        }

        move(dir) {
          this.setLane(this.lane + dir);
        }

        setLane(nl) {
          nl = Phaser.Math.Clamp(nl, 0, 2);
          if (nl !== this.lane) {
            this.lane = nl;
            sfx.swish();
            this.tweens.add({
              targets: this.player,
              x: LANES[this.lane],
              duration: reducedMotion() ? 0 : 140,
              ease: "Quad.out",
            });
          }
          this.updateHUD();
        }

        say(msg, color) {
          this.coach.setText(msg).setColor(color || "#dbe4ff");
          const fb = document.getElementById("dd-fb");
          if (fb) fb.textContent = msg;
        }

        // Put the next deal row on the shelf. It sits still and waits.
        nextDeal() {
          if (this.gameOver) return;
          if (this.row && !this.row.scored) return;
          if (this.round >= TOTAL_ROUNDS) {
            this.endGame();
            return;
          }
          if (this.nextBtn) {
            this.nextBtn.forEach((o) => o.destroy());
            this.nextBtn = null;
          }
          if (this.row) {
            const old = this.row;
            old.cells.forEach((c) => {
              if (reducedMotion()) c.destroy();
              else
                this.tweens.add({
                  targets: c,
                  y: H + 120,
                  alpha: 0,
                  duration: 420,
                  ease: "Quad.in",
                  onComplete: () => c.destroy(),
                });
            });
            this.walk = reducedMotion() ? 0 : 420;
          }
          this.round++;
          this.spawnRow();
          this.say(
            this.round === 1
              ? "Each lane has its own price and % off. Find each SALE price, then pick the lowest."
              : "New deal! Work out each sale price, then pick the lowest.",
          );
          this.prompt.setText("Tap a deal card  •  or ← → / 1 2 3 and Enter  •  take all the time you need");
          this.updateHUD();
        }

        spawnRow() {
          const data = makeRow(this.round, this.sys.settings.data?.studioTier || 2);
          // Mirror the deal row (given info only — never the sale prices)
          // into the hidden live region for assistive tech + the shared
          // hint ladder. Additive: never touches gameplay/scoring.
          const ddSr = document.getElementById("dd-sr");
          if (ddSr)
            ddSr.textContent =
              `Deal row ${this.round} of ${TOTAL_ROUNDS}: ${data.emoji} — ` +
              data.cells
                .map((cell, i) => `Lane ${i + 1}: ${money(cell.base)} at ${cell.pct}% off`)
                .join(". ") +
              ". Which lane has the lowest sale price?";
          const cells = data.cells.map((cell, i) => {
            const c = this.add.container(LANES[i], ROW_Y).setDepth(5);
            const pad = this.add
              .rectangle(0, 0, 210, 170, 0x1d3a63)
              .setStrokeStyle(3, 0x3b6cb5)
              .setInteractive({ useHandCursor: true });
            pad.on("pointerdown", () => {
              this.setLane(i);
              this.confirmGrab();
            });
            const lane = this.add
              .text(0, -66, "LANE " + (i + 1), {
                fontFamily: "Arial, Inter, system-ui, sans-serif",
                fontSize: "15px",
                fontStyle: "700",
                color: "#a5d8ff",
              })
              .setOrigin(0.5);
            const emo = this.add.text(0, -32, data.emoji, { fontSize: "38px" }).setOrigin(0.5);
            const wasT = this.add
              .text(0, 10, "Price " + money(cell.base), {
                fontFamily: "Arial, Inter, system-ui, sans-serif",
                fontSize: "24px",
                fontStyle: "700",
                color: "#e9ecef",
              })
              .setOrigin(0.5);
            const pctT = this.add
              .text(0, 40, cell.pct + "% OFF", {
                fontFamily: "Arial, Inter, system-ui, sans-serif",
                fontSize: "30px",
                fontStyle: "900",
                color: "#ffe066",
              })
              .setOrigin(0.5);
            // Sale price is hidden until the deal is solved (or worked as a
            // Tier-2 hint for a lane the student already ruled out).
            const saleT = this.add
              .text(0, 112, "", {
                fontFamily: "Arial, Inter, system-ui, sans-serif",
                fontSize: "18px",
                fontStyle: "700",
                color: "#ffffff",
                backgroundColor: "#0a1830",
                padding: { x: 8, y: 4 },
                align: "center",
              })
              .setOrigin(0.5);
            c.add([pad, lane, emo, wasT, pctT, saleT]);
            c.pad = pad;
            c.saleT = saleT;
            if (reducedMotion()) {
              c.setScale(1).setAngle(0);
            } else {
              c.setScale(1, 0.05);
              c.setAngle(i === 0 ? -8 : i === 2 ? 8 : 0);
              this.tweens.add({
                targets: c,
                scaleY: 1,
                angle: 0,
                duration: 360,
                delay: i * 70,
                ease: "Back.out",
              });
            }
            return c;
          });
          if (!this.shelf)
            this.shelf = this.add
              .rectangle(W / 2, ROW_Y + 18, 760, 236, 0x0a1830, 0.88)
              .setStrokeStyle(2, 0x2c4a72)
              .setDepth(3);
          this.row = { data, cells, wrong: [], scored: false, roundNum: this.round };
        }

        // Worked sale price for one lane: price × (100 − %) ÷ 100.
        worked(i) {
          const c = this.row.data.cells[i];
          return money(c.base) + " × " + (100 - c.pct) + "% = " + money(c.sale);
        }

        // Mission-control (flagship-studio) contract: it reads waitingRow and
        // calls setLane()+confirmGrab(), and wraps grabCell() to track accuracy.
        get waitingRow() {
          return this.row && !this.row.scored ? this.row : null;
        }

        confirmGrab() {
          this.grabCell(this.row, this.lane);
        }

        grabCell(row, laneIdx) {
          if (!row || row.scored || this.gameOver) return;
          if (row.wrong.includes(laneIdx)) {
            this.say("You already checked Lane " + (laneIdx + 1) + ". Try a different lane.", "#ffd43b");
            return;
          }
          const rm = reducedMotion();
          const d = row.data;
          // Ties at the same rounded-cents sale price: either lane is correct.
          if (d.bestIdxs.includes(laneIdx)) {
            row.scored = true;
            const tries = row.wrong.length;
            const cell = d.cells[laneIdx];
            const saved = Math.round((cell.base - cell.sale) * 100) / 100;
            let pts;
            if (tries === 0) {
              this.combo++;
              this.firstTry++;
              pts = 100 + Math.min(this.combo - 1, 5) * 10;
            } else {
              this.combo = 0;
              this.helped++;
              pts = tries === 1 ? 50 : 25;
            }
            this.score += pts;
            window.FlagshipAdventure?.record({ firstTry: tries === 0, kind: "discount" });
            const prevSav = this.savings;
            this.savings = Math.round((this.savings + saved) * 100) / 100;
            sfx.grab();
            // Reveal every lane's worked sale price so the comparison is visible.
            row.cells.forEach((c, i) => {
              c.saleT.setText("Sale " + money(d.cells[i].sale));
              if (i !== laneIdx) c.setAlpha(0.6);
            });
            this.flashBestLane(row.cells[laneIdx]);
            this.tickSavings(prevSav, this.savings);
            this.popCombo();
            try {
              window.GameFX && window.GameFX.celebrate(this.game.canvas);
            } catch (e) {}
            if (!rm) {
              for (let i = 0; i < 10; i++) {
                const s = this.add
                  .rectangle(this.player.x, this.player.y, 4, 4, 0xffe066)
                  .setDepth(15);
                this.tweens.add({
                  targets: s,
                  x: this.player.x + randInt(-90, 90),
                  y: this.player.y + randInt(-90, 20),
                  alpha: 0,
                  duration: 500,
                  onComplete: () => s.destroy(),
                });
              }
            }
            const lead = tries === 0 ? "Best deal — first try! +" + pts : "Best deal! +" + pts + " (with help)";
            this.say(
              lead +
                "\nLane " +
                (laneIdx + 1) +
                ": " +
                this.worked(laneIdx) +
                " is the lowest sale price. You saved " +
                money(saved) +
                ".",
              "#8ce99a",
            );
            this.showNext();
          } else {
            row.wrong.push(laneIdx);
            this.combo = 0;
            sfx.bad();
            this.wrongFlash();
            const cellC = row.cells[laneIdx];
            cellC.pad.setStrokeStyle(4, 0xff6b6b);
            cellC.setAlpha(0.55);
            if (row.wrong.length === 1) {
              // Tier 1 — method hint, misconception-specific, no answer.
              const picked = d.cells[laneIdx];
              const maxPct = Math.max(...d.cells.map((c) => c.pct));
              const minBase = Math.min(...d.cells.map((c) => c.base));
              let why;
              if (picked.pct === maxPct)
                why =
                  "Lane " +
                  (laneIdx + 1) +
                  " has the biggest % off, but its price starts higher. The biggest % off is not always the lowest price.";
              else if (picked.base === minBase)
                why =
                  "Lane " +
                  (laneIdx + 1) +
                  " has the lowest starting price, but the discounts are different. Starting low is not enough.";
              else why = "Lane " + (laneIdx + 1) + " is not the lowest sale price.";
              this.say(
                "Not quite. " +
                  why +
                  "\nHint: you pay (100 − % off)% of the price. Find each lane's sale price, then compare.",
                "#ffd43b",
              );
            } else {
              // Tier 2 — concrete worked step for the lanes already ruled out.
              row.wrong.forEach((i) => row.cells[i].saleT.setText("Sale " + money(d.cells[i].sale)));
              this.say(
                "Let's work it out. " +
                  row.wrong.map((i) => "Lane " + (i + 1) + ": " + this.worked(i)).join(".  ") +
                  ".\nNow find the sale price of the last lane the same way and compare.",
                "#ffd43b",
              );
            }
          }
          this.updateHUD();
        }

        showNext() {
          const last = this.round >= TOTAL_ROUNDS;
          const label = last ? "SEE RESULTS ▶" : "NEXT DEAL ▶";
          const bg = this.add
            .rectangle(W / 2, NEXT_Y, 280, 60, 0xffe066)
            .setStrokeStyle(3, 0xffffff)
            .setDepth(26)
            .setInteractive({ useHandCursor: true });
          const t = this.add
            .text(W / 2, NEXT_Y, label, {
              fontFamily: "Arial, Inter, system-ui, sans-serif",
              fontSize: "24px",
              fontStyle: "800",
              color: "#10243f",
            })
            .setOrigin(0.5)
            .setDepth(27);
          bg.on("pointerdown", () => this.nextDeal());
          this.nextBtn = [bg, t];
          this.prompt.setText("Press Enter or tap " + (last ? "SEE RESULTS" : "NEXT DEAL") + " when you are ready");
        }

        // Gold glow + quick pop around the pad the player correctly grabbed.
        flashBestLane(cell) {
          if (!cell || !cell.active) return;
          if (reducedMotion()) {
            // static, readable confirmation outline only
            const g = this.add
              .rectangle(cell.x, cell.y, 224, 174, 0xffe066, 0.18)
              .setStrokeStyle(4, 0xffe066, 0.9)
              .setDepth(4);
            this.time.delayedCall(450, () => g.destroy());
            return;
          }
          const glow = this.add
            .rectangle(cell.x, cell.y, 220, 170, 0xffe066, 0.0)
            .setStrokeStyle(5, 0xffe066, 0.95)
            .setDepth(4);
          // keep the glow pinned to the (still-scrolling) grabbed pad
          const follow = () => {
            if (cell.active) glow.y = cell.y;
          };
          this.events.on("update", follow);
          this.tweens.add({
            targets: glow,
            scaleX: 1.18,
            scaleY: 1.18,
            fillAlpha: 0.28,
            alpha: 0,
            duration: 620,
            ease: "Quad.out",
            onComplete: () => {
              this.events.off("update", follow);
              glow.destroy();
            },
          });
          if (cell.active) {
            this.tweens.add({
              targets: cell,
              scaleX: 1.12,
              scaleY: 1.12,
              yoyo: true,
              duration: 150,
              ease: "Quad.out",
            });
          }
        }

        // Animated savings ticker — eases the SAVED HUD value upward.
        tickSavings(from, to) {
          if (this.savTween) this.savTween.remove();
          if (reducedMotion()) {
            this.savHud.setText("SAVED  " + money(to));
            return;
          }
          const obj = { v: from };
          this.savTween = this.tweens.add({
            targets: obj,
            v: to,
            duration: 500,
            ease: "Cubic.out",
            onUpdate: () => this.savHud.setText("SAVED  " + money(obj.v)),
            onComplete: () => this.savHud.setText("SAVED  " + money(to)),
          });
          try {
            window.GameFX && window.GameFX.pop(this.game.canvas);
          } catch (e) {}
        }

        // Combo multiplier badge scaling — bigger pop for bigger combos.
        popCombo() {
          if (this.combo < 2 || reducedMotion()) return;
          const k = Math.min(1.6, 1.2 + this.combo * 0.05);
          this.comboHud.setScale(1);
          this.tweens.add({
            targets: this.comboHud,
            scaleX: k,
            scaleY: k,
            yoyo: true,
            duration: 170,
            ease: "Back.out",
          });
        }

        // Brief full-screen red flash on a wrong (overpaid) grab.
        wrongFlash() {
          const f = this.add
            .rectangle(W / 2, H / 2, W, H, 0xff3b3b, reducedMotion() ? 0.08 : 0.14)
            .setDepth(30);
          this.tweens.add({
            targets: f,
            alpha: 0,
            duration: reducedMotion() ? 220 : 320,
            ease: "Quad.out",
            onComplete: () => f.destroy(),
          });
        }

        updateHUD() {
          this.hud.setText("SCORE " + this.score);
          if (!(this.savTween && this.savTween.isPlaying())) {
            this.savHud.setText("SAVED  " + money(this.savings));
          }
          this.comboHud.setText(
            "Deal " + this.round + " of " + TOTAL_ROUNDS + (this.combo > 1 ? "   streak x" + this.combo : ""),
          );
        }

        endGame() {
          if (this.gameOver) return;
          this.gameOver = true;
          const hi = parseInt(localStorage.getItem(LS_KEY) || "0");
          if (this.score > hi) localStorage.setItem(LS_KEY, this.score);
          try {
            window.EduPulse &&
              EduPulse.record({
                activityTitle: document.title,
                score: this.score,
                maxScore: MAX_SCORE,
                percent: Math.round((this.score / MAX_SCORE) * 100),
                problemsCorrect: this.firstTry,
                problemsAttempted: TOTAL_ROUNDS,
              });
          } catch (e) {}
          this.scene.start("Results", {
            score: this.score,
            savings: this.savings,
            firstTry: this.firstTry,
            helped: this.helped,
            newBest: this.score > hi,
            tier: this.sys.settings.data?.studioTier,
          });
        }

        update(time, delta) {
          if (this.gameOver) return;
          // The aisle only moves during the short stroll between deals.
          if (this.walk <= 0) return;
          this.walk -= delta;
          const v = (delta / 16.67) * 6;
          if (this.bgLayers) {
            this.bgLayers.forEach((L) => {
              L.cont.y += v * L.speed;
              if (L.cont.y >= L.span) L.cont.y -= L.span;
              L.cont.x += ((this.bgSwayX || 0) * L.speed - L.cont.x) * 0.08;
            });
          }
          this.stripes.forEach((s) => {
            s.y += v;
            if (s.y > H + 30) s.y -= 14 * 60;
          });
        }
      }

      class ResultsScene extends Phaser.Scene {
        constructor() {
          super("Results");
        }
        init(d) {
          this.r = d || {};
        }
        create() {
          this.cameras.main.setBackgroundColor("#10243f");
          const r = this.r;
          const first = r.firstTry || 0;
          const acc = Math.round((first / TOTAL_ROUNDS) * 100);
          const txt = (y, s, size, color, bold) =>
            this.add
              .text(W / 2, y, s, {
                fontFamily: "Arial, Inter, system-ui, sans-serif",
                fontSize: size,
                fontStyle: bold ? "800" : "400",
                color,
                align: "center",
                wordWrap: { width: 880 },
              })
              .setOrigin(0.5);
          txt(110, "CHECKOUT!", "58px", "#ffe066", true);
          txt(190, "Score: " + (r.score || 0) + (r.newBest ? "   ★ New best!" : ""), "32px", "#ffffff", true);
          txt(
            240,
            "Best deal on the first try: " + first + " of " + TOTAL_ROUNDS + " (" + acc + "%)" +
              "   •   With a hint: " + (r.helped || 0),
            "22px",
            "#dbe4ff",
          );
          txt(282, "Total saved: " + money(r.savings || 0), "24px", "#51cf66", true);
          txt(318, "Best score: " + (localStorage.getItem(LS_KEY) || r.score || 0), "20px", "#74c0fc");
          txt(
            380,
            "Skills practiced: percent of a quantity • sale price = price × (100 − % off) ÷ 100 • comparing prices",
            "19px",
            "#c5d3f0",
          );
          const next =
            acc >= 80
              ? "Practice next: try Level 2 (L2 Challenge) — closer discounts and bigger prices."
              : acc >= 50
                ? "Practice next: find each sale price before you pick. Write price × (100 − % off) ÷ 100 for every lane."
                : "Practice next: find 10% of a price first (divide by 10). 20% is double that, 5% is half of it.";
          txt(440, next, "20px", "#ffd43b", true);
          const btn = this.add
            .rectangle(W / 2, 540, 300, 66, 0xffe066)
            .setInteractive({ useHandCursor: true });
          txt(540, "SHOP AGAIN ▶", "26px", "#10243f", true);
          txt(600, "New prices every time. Press Enter or tap.", "17px", "#94a3b8");
          const again = () => this.scene.start("Game", { studioTier: r.tier || 2 });
          btn.on("pointerdown", again);
          this.input.keyboard.once("keydown-ENTER", again);
          const fb = document.getElementById("dd-fb");
          if (fb)
            fb.textContent =
              "Checkout. Score " + (r.score || 0) + ". First-try best deals " + first + " of " + TOTAL_ROUNDS + ". " + next;
        }
      }
      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: "game",
        backgroundColor: "#10243f",
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH,
        },
        scene: [BootScene, TitleScene, GameScene, ResultsScene],
      };
      const ddGame = window.__flagshipGame = new Phaser.Game(config);

      // ── Canvas accessibility (additive; no gameplay change) ──
      // Phaser renders to one <canvas> that is not in the tab order by default,
      // so keyboard-only students cannot focus the game to use the arrow / A-D
      // lane controls. Label the canvas, make it focusable, and focus it on
      // first pointer so the existing keyboard controls work immediately.
      ddGame.events.once("ready", function () {
        try {
          const cv = ddGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Discount Dash best-deal math game. Pick the lane with the " +
              "lowest sale price. Use the left and right arrow keys, A and D, " +
              "or 1, 2, 3 to choose a lane, and Enter to pick or continue.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>
