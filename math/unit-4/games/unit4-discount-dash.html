      // ── Reduced-motion guard (bespoke FX respect prefers-reduced-motion) ──
      // Live-tracked so an OS-level toggle is honored without a reload.
      const RM = { reduce: false };
      try {
        const _mq = window.matchMedia("(prefers-reduced-motion: reduce)");

      class SFX {
        constructor() {
          this.ctx = null;
        }
        init() {
          if (navigator.userActivation && !navigator.userActivation.hasBeenActive)
            return;
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        }
        tone(f, d, t = "sine", v = 0.06) {
          if (window.__flagshipMuted) return;
          if (!this.ctx) return;
          try {
            const o = this.ctx.createOscillator(),
              g = this.ctx.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start();
            o.stop(this.ctx.currentTime + d);
          } catch (e) {}
        }
        grab() {
          this.tone(660, 0.08, "sine");
          setTimeout(() => this.tone(990, 0.1, "sine"), 60);
        }
        bad() {
          this.tone(150, 0.25, "sawtooth", 0.08);

        swish() {
          this.tone(400, 0.05, "triangle", 0.03);
        }
      }
      const sfx = new SFX();
      const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
      const cents = (n) => Math.round(n * 100) / 100;
      const ITEMS = ["👟", "🎧", "🧥", "🎒", "⌚", "📱", "🕹️", "👕", "🧢", "👜"];

      // Build a deal-row: an item at one original price, with a different
      // percent-off in each lane. Exactly one lane is the best (lowest) deal.
      function makeRow(round, tier = 2) {
        const base =
          tier === 1
            ? randInt(2, 12) * 10
            : randInt(round < 4 ? 10 : 20, round < 4 ? 60 : 120);
        // percents get closer together as rounds climb (harder to compare)
        const pcts =
          tier === 1
            ? [10, 25, 50]
            : round < 3
              ? [10, 25, 50]
              : round < 6
                ? [15, 30, 45]
                : [20, 35, 40];
        Phaser.Utils.Array.Shuffle(pcts);
        const emoji = Phaser.Utils.Array.GetRandom(ITEMS);
        // Pedagogy fix: give each lane its OWN original price (close to the row
        // base) so the cheapest sale price is NOT just "biggest % off wins" —
        // students must actually compute price × (1 − %/100) to compare. The
        // larger price spread on later rounds keeps the comparison non-trivial.
        const spread = round < 4 ? 8 : 14;
        const cells = pcts.map((p) => {
          const cellBase =
            tier === 1
              ? Math.max(10, base + randInt(-2, 2) * 10)
              : Math.max(5, base + randInt(-spread, spread));
          return {
            pct: p,
            base: cellBase,
            sale: Math.round(cellBase * (1 - p / 100) * 100) / 100,
          };
        });
        // best deal = lowest sale price; when two lanes tie at the same
        // rounded-cents price, EVERY tied lane counts as correct.
        let bestIdx = 0;
        cells.forEach((c, i) => {
          if (c.sale < cells[bestIdx].sale) bestIdx = i;
        });
        const bestIdxs = cells
          .map((c, i) => i)
          .filter((i) => cells[i].sale === cells[bestIdx].sale);
        return { kind: "compare", emoji, base, cells, bestIdx, bestIdxs };
      }

      // Mystery receipt (Lesson 4-5): find the whole from a part and a percent.
      // Each lane is a possible original tag; the two wrong tags are what a
      // student gets from a specific misconception, so feedback can name it.
      function makeWholeRow(round, tier = 2) {
        const emoji = Phaser.Utils.Array.GetRandom(ITEMS);
        for (let guard = 0; guard < 200; guard++) {
          const pct =
            tier === 1
              ? Phaser.Utils.Array.GetRandom([10, 20, 25, 50])
              : Phaser.Utils.Array.GetRandom([15, 20, 25, 30, 40, 60, 75]);
          const original = tier === 1 ? randInt(2, 10) * 20 : randInt(4, 24) * 5;
          const paidFrame = tier === 1 ? true : Math.random() < 0.6;
          const part = cents(
            paidFrame ? (original * (100 - pct)) / 100 : (original * pct) / 100,
          );
          if (part < 3) continue;
          const decoys = paidFrame
            ? [
                { value: cents(part * (1 + pct / 100)), why: "addBack" },
                { value: cents(part / (pct / 100)), why: "wrongPct" },
                { value: cents((part * (100 - pct)) / 100), why: "pctOfPart" },
                { value: cents(part + pct), why: "addDollars" },
              ]
            : [
                { value: cents(original - part), why: "salePrice" },
                { value: cents(part / ((100 - pct) / 100)), why: "savedAsPaid" },
                { value: cents((part * pct) / 100), why: "pctOfSaved" },
                { value: cents(part + pct), why: "addDollars" },
              ];
          // Keep two decoys that are clearly different from the answer and each other.
          const chosen = [];
          for (const d of decoys) {
            if (chosen.length === 2) break;
            if (d.value <= 0 || Math.abs(d.value - original) < 1) continue;
            if (chosen.some((c) => Math.abs(c.value - d.value) < 1)) continue;
            chosen.push(d);
          }
          if (chosen.length < 2) continue;
          const cells = Phaser.Utils.Array.Shuffle([
            { base: original, pct, why: null },
            { base: chosen[0].value, pct, why: chosen[0].why },
            { base: chosen[1].value, pct, why: chosen[1].why },
          ]).map((c) => ({ ...c, sale: cents((c.base * (100 - pct)) / 100) }));
          const bestIdx = cells.findIndex((c) => c.why === null);
          return {
            kind: "whole",
            frame: paidFrame ? "paid" : "saved",
            emoji,
            pct,
            part,
            original,
            base: original,
            cells,
            bestIdx,
            bestIdxs: [bestIdx],
          };
        }
        return makeRow(round, tier);
      }

      // Which rounds are mystery receipts: tier 1 → 4, 8, 12; tier 2 → every
      // third deal; tier 3 (Detective) → every deal.
      function rowFor(round, tier) {
        const whole =
          tier === 3 ? true : tier === 1 ? round % 4 === 0 : round % 3 === 0;
        return whole
          ? makeWholeRow(round, Math.min(tier, 2))
          : makeRow(round, Math.min(tier, 2));
      }

              alpha: 0.5,
              fill: 0x102a4d,

              speed: 0.55,

          ];
          const accent = [0xffe066, 0x74c0fc, 0xff7eb6, 0x51cf66];
          const layers = [];
          cfg.forEach((band, bi) => {
            const cont = this.add.container(0, 0).setDepth(band.depth);
            const unit = band.w + band.gap;
            const count = Math.ceil(W / unit) + 2;
            const baseY = 50 + (2 - bi) * 12;
            // Vertical wrap distance: one band tall + breathing room. Two
            // stacked copies (one a full span above) make the downward scroll
            // seamless — copy A leaves the top exactly as copy B arrives.
            const span = band.h + 70;
            const drawShop = (x, y, i) => {
              const shop = this.add
                .rectangle(x, y, band.w, band.h, band.fill, band.alpha)
                .setOrigin(0.5, 0);
              cont.add(shop);
              // awning stripe (accent) — the classic mall storefront cue

                .rectangle(

                  y + band.h,
                  band.w + 6,
                  10,
                  accent[(i + bi) % accent.length],
                  band.alpha,
                )
                .setOrigin(0.5, 0);
              cont.add(aw);
              // lit "window"

                .rectangle(
                  x,
                  y + band.h * 0.45,
                  band.w * 0.6,
                  band.h * 0.4,
                  0x0a1830,
                  Math.min(1, band.alpha + 0.1),
                )
                .setOrigin(0.5, 0.5);
              cont.add(wq);

            for (let i = 0; i < count; i++) {
              const x = i * unit + band.w / 2;
              drawShop(x, baseY, i); // copy B (on-screen)
              drawShop(x, baseY - span, i); // copy A (one span above)
            }
            layers.push({ cont, speed: band.speed, span });

              ? t(
                  "rowSrWhole",
                  this.round,
                  this.maxRounds,
                  this.receiptText(data),
                  data.cells
                    .map((cell, i) => t("srTag", i + 1, money(cell.base)))
                    .join(". "),
                )
              : t(
                  "rowSr",
                  this.round,
                  this.maxRounds,
                  data.emoji,
                  data.cells
                    .map((cell, i) => t("srLane", i + 1, money(cell.base), cell.pct))
                    .join(". "),
                );
        }
        spawnRow() {
          const data =
            this.replayQueue && this.replayQueue.length
              ? this.replayQueue.shift()
              : rowFor(this.round, this.tier);
          if (!data.kind) data.kind = "compare";
          const whole = data.kind === "whole";
          const cells = data.cells.map((cell, i) => {
            const c = this.add.container(LANES[i], ROW_Y).setDepth(5);
            const pad = this.add
              .rectangle(0, 0, 210, 170, whole ? 0x2b3a55 : 0x1d3a63)
              .setStrokeStyle(3, whole ? 0xffd43b : 0x3b6cb5)
              .setInteractive({ useHandCursor: true });
            pad.on("pointerdown", () => {
              this.setLane(i);
              this.confirmGrab();
            });
            const laneT = this.add
              .text(0, -66, "", {
                fontFamily: "Arial, Inter, system-ui, sans-serif",
                fontSize: "15px",
                fontStyle: "700",
                color: "#a5d8ff",
              })
              .setOrigin(0.5);
            const emo = this.add
              .text(0, -32, whole ? "🏷️" : data.emoji, { fontSize: "38px" })
              .setOrigin(0.5);
            const wasT = this.add
              .text(0, 10, "", {
                fontFamily: "Arial, Inter, system-ui, sans-serif",
                fontSize: whole ? "30px" : "24px",
                fontStyle: "700",
                color: "#e9ecef",
              })
              .setOrigin(0.5);
            const pctT = this.add
              .text(0, 44, "", {
                fontFamily: "Arial, Inter, system-ui, sans-serif",
                fontSize: whole ? "15px" : "30px",
                fontStyle: "900",
                color: "#ffe066",
              })
              .setOrigin(0.5);
            // Sale price is hidden until the deal is solved (or worked as a
            // Tier-2 hint for a lane the student already ruled out).
            const saleT = this.add
              .text(0, 112, "", {
                fontFamily: "Arial, Inter, system-ui, sans-serif",
                fontSize: "18px",
                fontStyle: "700",
                color: "#ffffff",
                backgroundColor: "#0a1830",
                padding: { x: 8, y: 4 },
                align: "center",
              })
              .setOrigin(0.5);
            c.add([pad, laneT, emo, wasT, pctT, saleT]);
            c.pad = pad;
            c.laneT = laneT;
            c.wasT = wasT;
            c.pctT = pctT;
            c.saleT = saleT;
            c.saleFn = null;
            if (reducedMotion()) {
              c.setScale(1).setAngle(0);
            } else {
              c.setScale(1, 0.05);
              c.setAngle(i === 0 ? -8 : i === 2 ? 8 : 0);
              this.tweens.add({
                targets: c,
                scaleY: 1,
                angle: 0,
                duration: 360,
                delay: i * 70,
                ease: "Back.out",
              });
            }
            return c;
          });
          if (!this.shelf)
            this.shelf = this.add
              .rectangle(W / 2, ROW_Y + 18, 760, 236, 0x0a1830, 0.88)
              .setStrokeStyle(2, 0x2c4a72)
              .setDepth(3);
          this.row = { data, cells, wrong: [], scored: false, roundNum: this.round };
          this.labelRow();
          this.announceRow();
        }
        // Card text in the current language (called again after a language switch).
        labelRow() {
          if (!this.row) return;
          const d = this.row.data;
          this.row.cells.forEach((c, i) => {
            const cell = d.cells[i];
            c.laneT.setText(t("lane", i + 1));
            if (d.kind === "whole") {
              c.wasT.setText(money(cell.base));
              c.pctT.setText(t("tag"));
            } else {
              c.wasT.setText(t("price", money(cell.base)));
              c.pctT.setText(t("off", cell.pct));
            }
            if (c.saleFn) c.saleT.setText(c.saleFn());
          });
          const whole = d.kind === "whole";
          this.receipt.setVisible(whole);
          if (whole) this.receipt.setText(this.receiptText(d));
        }
        setSale(i, fn) {
          const c = this.row.cells[i];
          c.saleFn = fn;
          c.saleT.setText(fn());
        }
        relabel() {
          if (!this.sys.isActive() && !this.sys.isPaused()) return;
          this.labelRow();
          this.announceRow();
          if (this.coachFn) this.say(this.coachFn, this.coachColor);
          this.prompt.setText(
            this.row && this.row.scored
              ? t("whenReady", this.round >= this.maxRounds)
              : t("controlsLine"),
          );
          if (this.nextBtn)
            this.nextBtn[1].setText(
              this.round >= this.maxRounds ? t("seeResults") : t("nextDeal"),
            );
          this.updateHUD();
        }
        // Worked sale price for one lane: price × (100 − %) ÷ 100.
        worked(i) {
          const c = this.row.data.cells[i];
          return money(c.base) + " × " + (100 - c.pct) + "% = " + money(c.sale);
        }
        // Worked check of one tag on a mystery receipt (the student's own lane).
        wholeCheck(i) {
          const d = this.row.data,
            c = d.cells[i];
          const paid = d.frame === "paid";
          const got = paid ? c.sale : cents((c.base * d.pct) / 100);
          return t(
            "wholeCheck",
            i + 1,
            money(c.base),
            d.pct,
            money(got),
            paid,
            money(d.part),
          );
        }
        // Mission-control (flagship-studio) contract: it reads waitingRow and
        // calls setLane()+confirmGrab(), and wraps grabCell() to track accuracy.
        get waitingRow() {
          return this.row && !this.row.scored ? this.row : null;
        }
        confirmGrab() {
          this.grabCell(this.row, this.lane);
        }
        grabCell(row, laneIdx) {
          if (!row || row.scored || this.gameOver) return;
          if (row.wrong.includes(laneIdx)) {
            this.say(() => t("already", laneIdx + 1), "#ffd43b");
            return;
          }
          const rm = reducedMotion();
          const d = row.data;
          const whole = d.kind === "whole";
          // Ties at the same rounded-cents sale price: either lane is correct.
          if (d.bestIdxs.includes(laneIdx)) {
            row.scored = true;
            const tries = row.wrong.length;
            this.solved++;
            this.answerTries++;
            const cell = d.cells[laneIdx];
            const saved = whole
              ? cents(d.frame === "paid" ? d.original - d.part : d.part)
              : Math.round((cell.base - cell.sale) * 100) / 100;
            let pts;
            if (tries === 0) {
              this.combo++;
              this.bestStreak = Math.max(this.bestStreak, this.combo);
              this.firstTry++;
              pts = 100 + Math.min(this.combo - 1, 5) * 10;
            } else {
              this.combo = 0;
              this.helped++;
              pts = tries === 1 ? 50 : 25;
            }
            this.score += pts;
            window.FlagshipAdventure?.record({
              firstTry: tries === 0,
              kind: whole ? "find-whole" : "discount",
            });
            const prevSav = this.savings;
            this.savings = Math.round((this.savings + saved) * 100) / 100;
            sfx.grab();
            // Reveal every lane's worked numbers so the comparison is visible.
            row.cells.forEach((c, i) => {
              if (whole)
                this.setSale(i, () =>
                  d.frame === "paid"
                    ? t("sale", money(d.cells[i].sale))
                    : "−" + money(cents((d.cells[i].base * d.pct) / 100)),
                );
              else this.setSale(i, () => t("sale", money(d.cells[i].sale)));
              if (i !== laneIdx) c.setAlpha(0.6);
            });
            this.flashBestLane(row.cells[laneIdx]);
            this.tickSavings(prevSav, this.savings);
            this.popCombo();
            try {
              window.GameFX && window.GameFX.celebrate(this.game.canvas);
            } catch (e) {}
            if (!rm) {
              for (let i = 0; i < 10; i++) {
                const s = this.add
                  .rectangle(this.player.x, this.player.y, 4, 4, 0xffe066)
                  .setDepth(15);
                this.tweens.add({
                  targets: s,
                  x: this.player.x + randInt(-90, 90),
                  y: this.player.y + randInt(-90, 20),
                  alpha: 0,
                  duration: 500,
                  onComplete: () => s.destroy(),
                });
              }
            }
            const k = d.frame === "paid" ? (100 - d.pct) / 100 : d.pct / 100;
            this.say(() => {
              if (whole) {
                const lead =
                  tries === 0 ? t("wholeFirst", pts) : t("wholeHelped", pts);
                return (
                  lead +
                  (d.frame === "paid"
                    ? t(
                        "wholeWinPaid",
                        money(d.original),
                        d.pct,
                        money(d.part),
                        String(k),
                      )
                    : t(
                        "wholeWinSaved",
                        money(d.original),
                        d.pct,
                        money(d.part),
                        String(k),
                      ))
                );
              }
              const lead = tries === 0 ? t("firstTryWin", pts) : t("helpedWin", pts);
              return (
                lead +
                t("compareWin", laneIdx + 1, this.worked(laneIdx), money(saved))
              );
            }, "#8ce99a");
            this.showNext();
          } else {
            row.wrong.push(laneIdx);
            this.answerTries++;
            this.combo = 0;
            if (row.wrong.length === 1) {
              this.misses.push(JSON.parse(JSON.stringify(d)));
              if (whole) this.wholeMisses++;
            }
            sfx.bad();
            this.wrongFlash();
            const cellC = row.cells[laneIdx];
            cellC.pad.setStrokeStyle(4, 0xff6b6b);
            cellC.setAlpha(0.55);
            if (row.wrong.length === 1) {
              // Tier 1 — method hint, misconception-specific, no answer.
              const picked = d.cells[laneIdx];
              if (whole) {
                const target = money(d.part);
                this.say(() => {
                  const i = laneIdx + 1;
                  const why =
                    picked.why === "addBack"
                      ? tw("addBack", i, d.pct)
                      : picked.why === "wrongPct"
                        ? tw("wrongPct", i, target, d.pct)
                        : picked.why === "pctOfPart"
                          ? tw("pctOfPart", i, target)
                          : picked.why === "addDollars"
                            ? tw("addDollars", i, d.pct)
                            : picked.why === "pctOfSaved"
                              ? tw("pctOfSaved", i, target, d.pct)
                              : picked.why === "savedAsPaid"
                                ? tw("savedAsPaid", i, target)
                                : tw("salePrice", i);
                  return (
                    t("notQuite") +
                    why +
                    t("wholeHint", d.pct, target, d.frame === "paid")
                  );
                }, "#ffd43b");
              } else {
                const maxPct = Math.max(...d.cells.map((c) => c.pct));
                const minBase = Math.min(...d.cells.map((c) => c.base));
                this.say(() => {
                  const why =
                    picked.pct === maxPct
                      ? t("biggestPct", laneIdx + 1)
                      : picked.base === minBase
                        ? t("lowestStart", laneIdx + 1)
                        : t("notLowest", laneIdx + 1);
                  return t("notQuite") + why + t("compareHint");
                }, "#ffd43b");
              }
            } else {
              // Tier 2 — concrete worked step for the lanes already ruled out.
              if (whole) {
                row.wrong.forEach((i) =>
                  this.setSale(i, () =>
                    d.frame === "paid"
                      ? t("sale", money(d.cells[i].sale))
                      : "−" + money(cents((d.cells[i].base * d.pct) / 100)),
                  ),
                );
                this.say(
                  () =>
                    t("workItOut") +
                    row.wrong.map((i) => this.wholeCheck(i)).join(".  ") +
                    t("wholeLast"),
                  "#ffd43b",
                );
              } else {
                row.wrong.forEach((i) =>
                  this.setSale(i, () => t("sale", money(d.cells[i].sale))),
                );
                this.say(
                  () =>
                    t("workItOut") +
                    row.wrong
                      .map((i) => t("laneWorked", i + 1, this.worked(i)))
                      .join(".  ") +
                    t("lastLane"),
                  "#ffd43b",
                );
              }
            }
          }
          this.updateHUD();
        }
        showNext() {
          const last = this.round >= this.maxRounds;
          const bg = this.add
            .rectangle(W / 2, NEXT_Y, 300, 60, 0xffe066)
            .setStrokeStyle(3, 0xffffff)
            .setDepth(26)
            .setInteractive({ useHandCursor: true });
          const label = this.add
            .text(W / 2, NEXT_Y, last ? t("seeResults") : t("nextDeal"), {
              fontFamily: "Arial, Inter, system-ui, sans-serif",
              fontSize: "24px",
              fontStyle: "800",
              color: "#10243f",
            })
            .setOrigin(0.5)
            .setDepth(27);
          bg.on("pointerdown", () => this.nextDeal());
          this.nextBtn = [bg, label];
          this.prompt.setText(t("whenReady", last));
        }
        // Gold glow + quick pop around the pad the player correctly grabbed.
        flashBestLane(cell) {
          if (!cell || !cell.active) return;
          if (reducedMotion()) {
            // static, readable confirmation outline only
            const g = this.add
              .rectangle(cell.x, cell.y, 224, 174, 0xffe066, 0.18)
              .setStrokeStyle(4, 0xffe066, 0.9)
              .setDepth(4);
            this.time.delayedCall(450, () => g.destroy());
            return;
          }
          const glow = this.add
            .rectangle(cell.x, cell.y, 220, 170, 0xffe066, 0.0)
            .setStrokeStyle(5, 0xffe066, 0.95)
            .setDepth(4);
          this.tweens.add({
            targets: glow,
            scaleX: 1.18,
            scaleY: 1.18,
            fillAlpha: 0.28,
            alpha: 0,
            duration: 620,
            ease: "Quad.out",
            onComplete: () => glow.destroy(),
          });
          if (cell.active) {
            this.tweens.add({
              targets: cell,
              scaleX: 1.12,
              scaleY: 1.12,
              yoyo: true,
              duration: 150,
              ease: "Quad.out",
            });
          }
        }
        // Animated savings ticker — eases the SAVED HUD value upward.
        tickSavings(from, to) {
          if (this.savTween) this.savTween.remove();
          if (reducedMotion()) {
            this.savHud.setText(t("saved", money(to)));
            return;
          }
          const obj = { v: from };
          this.savTween = this.tweens.add({
            targets: obj,
            v: to,
            duration: 500,
            ease: "Cubic.out",
            onUpdate: () => this.savHud.setText(t("saved", money(obj.v))),
            onComplete: () => this.savHud.setText(t("saved", money(to))),
          });
          try {
            window.GameFX && window.GameFX.pop(this.game.canvas);
          } catch (e) {}
        }
        // Combo multiplier badge scaling — bigger pop for bigger combos.
        popCombo() {
          if (this.combo < 2 || reducedMotion()) return;
          const k = Math.min(1.6, 1.2 + this.combo * 0.05);
          this.comboHud.setScale(1);
          this.tweens.add({
            targets: this.comboHud,
            scaleX: k,
            scaleY: k,
            yoyo: true,
            duration: 170,
            ease: "Back.out",
          });
        }
        // Brief soft red wash on a wrong pick.
        wrongFlash() {
          const f = this.add
            .rectangle(W / 2, H / 2, W, H, 0xff3b3b, reducedMotion() ? 0.08 : 0.14)
            .setDepth(30);
          this.tweens.add({
            targets: f,
            alpha: 0,
            duration: reducedMotion() ? 220 : 320,
            ease: "Quad.out",
            onComplete: () => f.destroy(),
          });
        }
        updateHUD() {
          this.hud.setText(t("score", this.score));
          if (!(this.savTween && this.savTween.isPlaying())) {
            this.savHud.setText(t("saved", money(this.savings)));
          }
          this.comboHud.setText(t("dealOf", this.round, this.maxRounds, this.combo));
        }
        endGame() {
          if (this.gameOver) return;
          this.gameOver = true;
          const hi = parseInt(localStorage.getItem(LS_KEY) || "0");
          if (this.score > hi) localStorage.setItem(LS_KEY, this.score);
          try {
            window.EduPulse &&
              EduPulse.record({
                activityTitle: document.title,
                score: this.score,
                maxScore: MAX_SCORE,
                percent: Math.round((this.score / MAX_SCORE) * 100),
                problemsCorrect: this.firstTry,
                problemsAttempted: this.maxRounds,
              });
          } catch (e) {}
          this.scene.start("Results", {
            score: this.score,
            savings: this.savings,
            firstTry: this.firstTry,
            helped: this.helped,
            newBest: this.score > hi,
            tier: this.tier,
            bestStreak: this.bestStreak,
            solved: this.solved,
            answerTries: this.answerTries,

            wholeMisses: this.wholeMisses,

        update(time, delta) {
          if (this.gameOver) return;
          // The aisle only moves during the short stroll between deals.
          if (this.walk <= 0) return;
          this.walk -= delta;
          const v = (delta / 16.67) * 6;
          if (this.bgLayers) {
            this.bgLayers.forEach((L) => {
              L.cont.y += v * L.speed;
              if (L.cont.y >= L.span) L.cont.y -= L.span;
              L.cont.x += ((this.bgSwayX || 0) * L.speed - L.cont.x) * 0.08;
            });
          }
          this.stripes.forEach((s) => {
            s.y += v;
            if (s.y > H + 30) s.y -= 14 * 60;

      class ResultsScene extends Phaser.Scene {

          const solved = r.solved != null ? r.solved : items;
          const answerTries = r.answerTries || items;
          const accuracy = answerTries ? solved / answerTries : 0;
          const stars =
            (solved >= 3 ? 1 : 0) +
            ((r.bestStreak || 0) >= 3 || solved >= 8 ? 1 : 0) +
            (items >= 4 && accuracy >= 0.8 ? 1 : 0);

              this.scene.start("Game", { studioTier: r.tier || 2, replay: r.misses }),
            );

            fb.textContent = t("resultsSr", r.score || 0, stars, first, items, next);

          this.events.once("shutdown", () =>

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: "game",
        backgroundColor: "#10243f",
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH,

        scene: [BootScene, TitleScene, GameScene, ResultsScene],

      const ddGame = (window.__flagshipGame = new Phaser.Game(config));
      // Title screen follows a language switch immediately.
      document.addEventListener("ewl:lang", () => {
        const title = ddGame.scene.getScene("Title");
        if (title && title.sys.isActive()) title.scene.restart();

      // ── Canvas accessibility (additive; no gameplay change) ──
      // Phaser renders to one <canvas> that is not in the tab order by default,
      // so keyboard-only students cannot focus the game to use the arrow / A-D
      // lane controls. Label the canvas, make it focusable, and focus it on
      // first pointer so the existing keyboard controls work immediately.
      ddGame.events.once("ready", function () {
        try {
          const cv = ddGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute("aria-label", t("canvas"));
          cv.setAttribute(
            "aria-roledescription",
            lang() === "es" ? "juego de matemáticas" : "math game",
          );
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
