<html lang="en">
  <head>

    <title>Expression Express — Assembler | Math Games</title>
    <meta
      name="description"
      content="A calm build-it math game for Grade 6 lessons 6.1-6.7 (6.EE.1-4): drag number and operator tiles into ordered slots to assemble an expression that equals the target value, respecting order of operations. Choose Level 1 (support) or Level 2 (enrichment)."
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1226;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        touch-action: none;
      }
      canvas {
        display: block;
        margin: 0 auto;
        position: relative;
        z-index: 1;
        touch-action: none;
      }
      canvas:focus-visible {
        outline: 3px solid #b06fd4;
        outline-offset: 4px;
        border-radius: 8px;
      }
      canvas:focus:not(:focus-visible) {
        outline: none;
      }
      #ee-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(
          130% 90% at 50% 0%,
          #34204f 0%,
          #221636 55%,
          #140c20 100%
        );
      }
      #ee-bg-layer {
        position: absolute;
        inset: -6% -6%;
        will-change: transform;
        transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .ee-star {
        position: absolute;
        border-radius: 50%;
        background: #e0c8ff;
        opacity: 0.5;
        animation: eeTwinkle var(--tw, 3s) ease-in-out infinite;
      }
      @keyframes eeTwinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.8);
        }
        50% {
          opacity: 0.75;
          transform: scale(1.2);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #ee-bg-layer {
          transition: none !important;
          transform: none !important;
        }
        .ee-star {
          animation: none !important;
          opacity: 0.4 !important;
        }
      }
      #ee-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

        }
      });
    </script>

  <body>
    <!-- Decorative animated star-field (behind the Phaser canvas). -->
    <div id="ee-bg" data-parallax aria-hidden="true">
      <div id="ee-bg-layer" data-parallax-layer></div>
    </div>
    <!-- Screen-reader live region: mirrors the current expression + result. -->
    <div id="ee-sr" role="status" aria-live="polite"></div>
    <script>
      // Decorative star-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("ee-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 34;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "ee-star";
            var sz = rnd(1.5, 4);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" +
            (dx * 20).toFixed(2) +
            "px," +
            (dy * 12).toFixed(2) +
            "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener)
            reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── EXPRESSION EXPRESS — ASSEMBLER ──────────────────────────────────────
      // Phaser 3 — Grade 6 Math — Building & evaluating expressions, exponents
      // optional, order of operations (6.EE.1-4).
      //
      // Math-as-mechanic (calm, NO timer / NO reflex): a TARGET value is given.
      // The student DRAGS number / operator (and on Level 2, a variable) tiles
      // from the tray into ordered slots to ASSEMBLE an expression that equals
      // the target — respecting order of operations (× before + and −). A live
      // readout evaluates the build as tiles land, so the math IS the action.
      // Lock In checks it. A wrong build (wrong math) costs a life and the game
      // shows one correct assembly to teach, then continues. Every generated
      // target is guaranteed solvable because the puzzle is built from a known
      // valid arrangement plus a few distractor tiles.

      const W = 820,
        H = 600;
      const LS_KEY = "ee_expr_assembler_highscore";

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (
                window.AudioContext || window.webkitAudioContext
              )();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        place() {
          this.play("square", 520, 0.05, 0.08);
        },
        reject() {
          this.play("triangle", 200, 0.12, 0.07);
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
        lose() {
          [400, 330, 260, 200].forEach((f, i) =>
            setTimeout(() => this.play("sawtooth", f, 0.3, 0.14), i * 170),
          );
        },
      };

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          tap() {},
          pop() {},
          correct() {},
          wrong() {},
          whoosh() {},
          fanfare() {},
          musicStart() {},
          musicStop() {},
        },
        theme: () => ({
          accent: "#b06fd4",
          accentN: 0xb06fd4,
          tileN: 0x3a2a58,
          botN: 0x221636,
        }),
        bgGradient() {},
        popIn() {},
        tilePop() {},
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function shuffle(a) {
        const r = [...a];
        for (let i = r.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [r[i], r[j]] = [r[j], r[i]];
        }
        return r;
      }
      function srSay(msg) {
        const el = document.getElementById("ee-sr");
        if (el) el.textContent = msg;
      }

      // ── Expression engine ───────────────────────────────────────────────
      // Evaluate a left-to-right token sequence honouring order of operations:
      // multiply first, then add / subtract. Only +, −, × are used so every
      // value stays a friendly positive integer.
      function evalSeq(nums, ops) {
        const v = [nums[0]];
        const o = [];
        for (let i = 0; i < ops.length; i++) {
          if (ops[i] === "×") v[v.length - 1] = v[v.length - 1] * nums[i + 1];
          else {
            o.push(ops[i]);
            v.push(nums[i + 1]);
          }
        }
        let r = v[0];
        for (let i = 0; i < o.length; i++)
          r = o[i] === "+" ? r + v[i + 1] : r - v[i + 1];
        return r;
      }
      const numTile = (v) => ({ kind: "num", label: String(v), value: v });
      const opTile = (o) => ({ kind: "op", label: o, value: o });
      const varTile = (v) => ({ kind: "var", label: "x", value: v });
      const tileLabel = (t) => t.label;
      const tileSub = (t) => (t.kind === "var" ? String(t.value) : t.label);
      function pick(arr) {
        return arr[randInt(0, arr.length - 1)];
      }
      function distinctNum(avoid) {
        let n,
          guard = 0;
        do {
          n = randInt(2, 12);
          guard++;
        } while (avoid.indexOf(n) !== -1 && guard < 30);
        return n;
      }

      // ── Problem generator ────────────────────────────────────────────────
      // Returns { goal, varVal, slots:[{accept}], tray:[tileDef], solution:[tileDef],
      //           varVal, why, exprStr }. Level drives structure & scaffolding.
      //   Level 1 (support):    [num][op][num]      one operation, hints on.
      //   Level 2 (enrichment): [t][op][t][op][t]   order of operations + a
      //                          variable x to substitute, fewer hints.
      function genLevel1(step) {
        let a,
          b,
          op,
          goal,
          tries = 0;
        do {
          op = pick(["+", "−", "×"]);
          if (op === "×") {
            a = randInt(2, 9);
            b = randInt(2, 6);
          } else {
            a = randInt(2, 12);
            b = randInt(2, 12);
          }
          if (op === "−" && a < b) {
            const t = a;
            a = b;
            b = t;
          }
          goal = evalSeq([a, b], [op]);
          tries++;
        } while ((goal < 2 || goal > 99) && tries < 40);
        if (goal < 2) {
          a = 5;
          b = 3;
          op = "+";
          goal = 8;
        }
        const solution = [numTile(a), opTile(op), numTile(b)];
        const dn = distinctNum([a, b]);
        const dop = pick(["+", "−", "×"].filter((o) => o !== op));
        // A second distractor number after a few rounds keeps it fresh.
        const tray = [
          numTile(a),
          numTile(b),
          numTile(dn),
          opTile(op),
          opTile(dop),
        ];
        if (step >= 4) tray.push(numTile(distinctNum([a, b, dn])));
        return {
          goal,
          varVal: null,
          slots: solution.map((t) => ({
            accept: t.kind === "op" ? "op" : "num",
          })),
          solution,
          tray: shuffle(tray),
          exprStr: a + " " + op + " " + b,
          why: a + " " + op + " " + b + " = " + goal + ".",
        };
      }
      function genLevel2(step) {
        let vals,
          ops,
          goal,
          xVal,
          varPos,
          tries = 0;
        do {
          xVal = randInt(2, 6);
          varPos = randInt(0, 2);
          ops = [pick(["+", "−", "×"]), pick(["+", "−", "×"])];
          vals = [randInt(2, 9), randInt(2, 9), randInt(2, 9)];
          vals[varPos] = xVal;
          goal = evalSeq(vals, ops);
          tries++;
        } while ((goal < 3 || goal > 99) && tries < 80);
        if (goal < 3 || goal > 99) {
          xVal = 3;
          varPos = 1;
          vals = [5, 3, 2];
          ops = ["×", "+"];
          goal = 17;
        }
        const solution = [];
        for (let i = 0; i < 3; i++) {
          if (i > 0) solution.push(opTile(ops[i - 1]));
          solution.push(i === varPos ? varTile(xVal) : numTile(vals[i]));
        }
        const operands = solution.filter((t) => t.kind !== "op");
        const opsTiles = solution.filter((t) => t.kind === "op");
        const dn = distinctNum(vals);
        const dop = pick(["+", "−", "×"]);
        const tray = [...operands, numTile(dn), ...opsTiles, opTile(dop)];
        if (step >= 4) tray.push(opTile(pick(["+", "−", "×"])));
        const exprStr = solution.map(tileLabel).join(" ");
        const subStr = solution.map(tileSub).join(" ");
        return {
          goal,
          varVal: xVal,
          slots: solution.map((t) => ({
            accept: t.kind === "op" ? "op" : "num",
          })),
          solution,
          tray: shuffle(tray),
          exprStr,
          why: "x = " + xVal + ", so " + subStr + " = " + goal + ".",
        };
      }
      function makeProblem(track, step) {
        return track === 2 ? genLevel2(step) : genLevel1(step);
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#221636",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [
          BootScene,
          TitleScene,
          LevelScene,
          VocabScene,
          GameScene,
          ResultScene,
        ],
      };

      // Cross-scene choices (persist across "Play Again", reset only on reload).
      let eeTrack = 1; // 1 = support, 2 = enrichment
      let eeVocabSeen = false;
      const TRACK_LABEL = { 1: "Level 1 · Support", 2: "Level 2 · Enrichment" };

      // ── Vocab gate terms (6.EE.1–4) ─────────────────────────────────────
      // Term + Level-1 (student-facing) definition + emoji image. Shown BEFORE
      // the first round so students meet the key words before they play.
      const VOCAB_TERMS = [
        {
          term: "Expression",
          emoji: "🧮",
          def: "A math phrase made of numbers and operations, like 3 × 4 + 2. It has no equals sign — you build it and find its value.",
        },
        {
          term: "Variable",
          emoji: "🔤",
          def: "A letter that stands for a number you do not know yet, like x. You can plug a number in for it.",
        },
        {
          term: "Coefficient",
          emoji: "✳️",
          def: "The number multiplied by a variable. In 5x, the 5 is the coefficient, so 5x means 5 times x.",
        },
        {
          term: "Term",
          emoji: "➕",
          def: "One part of an expression, separated by + or − signs. In 5x + 2, the terms are 5x and 2.",
        },
        {
          term: "Order of Operations",
          emoji: "📋",
          def: "The rules for what to solve first: parentheses, exponents, then × and ÷, then + and −.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0xb06fd4);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x221636);
        this.add
          .text(cx, 110, "EXPRESSION", {
            fontFamily: "Impact, sans-serif",
            fontSize: "58px",
            color: "#b06fd4",
            stroke: "#140c20",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 162, "EXPRESS", {
            fontFamily: "Impact, sans-serif",
            fontSize: "58px",
            color: "#e0c8ff",
            stroke: "#140c20",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 210, "Expression Assembler", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            color: "#c8a0e0",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            268,
            "Drag number & operator tiles into the slots to BUILD an\nexpression that equals the target. Calm — no timer!",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#e0d0f0",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 318, "6.EE.1–4 · Lessons 6.1–6.7", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#a080c0",
          })
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 350, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#ffd24a",
              fontStyle: "bold",
            })
            .setOrigin(0.5);

        const btn = this.add
          .rectangle(cx, 420, 240, 58, 0x7a3fb0)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 420, "ALL ABOARD ▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "22px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.tweens.add({
          targets: [btn, btnT],
          scaleX: 1.05,
          scaleY: 1.05,
          duration: 800,
          yoyo: true,
          repeat: -1,
        });
        const start = () => {
          SFX.init();
          JUICE.audio.unlock();
          SFX.place();
          this.scene.start("Level");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x9050c8));
        btn.on("pointerout", () => btn.setFillStyle(0x7a3fb0));
        btn.on("pointerdown", start);
        this.input.keyboard.on("keydown-SPACE", start);
        this.input.keyboard.on("keydown-ENTER", start);

        const hub = this.add
          .text(cx, 540, "← Back to Math Games", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#a080c0",
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        hub.on("pointerover", () => hub.setColor("#b06fd4"));
        hub.on("pointerout", () => hub.setColor("#a080c0"));
        hub.on("pointerdown", () => (window.location.href = "/math/games/"));
        srSay(
          "Expression Express Assembler. Press Start to choose your level.",
        );
      };

      // ── LEVEL SELECT ──
      // Two tracks: Level 1 (support) and Level 2 (enrichment). NEVER labelled
      // ESOL. The choice drives the generator and the on-screen scaffolding.
      function LevelScene() {
        Phaser.Scene.call(this, "Level");
      }
      LevelScene.prototype = Object.create(Phaser.Scene.prototype);
      LevelScene.prototype.constructor = LevelScene;
      LevelScene.prototype.init = function () {
        this.sel = eeTrack - 1; // 0 or 1
      };
      LevelScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x221636);
        this.add
          .text(cx, 70, "CHOOSE YOUR LEVEL", {
            fontFamily: "Impact, sans-serif",
            fontSize: "36px",
            color: "#b06fd4",
            stroke: "#140c20",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 116, "You can change this anytime.", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#a080c0",
          })
          .setOrigin(0.5);

        this.cards = [];
        const defs = [
          {
            title: "LEVEL 1",
            sub: "Builder Basics · Support",
            body: "Build 2-number expressions\nwith one operation.\nHints stay on.",
            y: 250,
          },
          {
            title: "LEVEL 2",
            sub: "Order Master · Enrichment",
            body: "Build longer expressions —\n× before + and −, plus a\nvariable x to plug in. Fewer hints.",
            y: 400,
          },
        ];
        defs.forEach((d, i) => {
          const card = this.add
            .rectangle(cx, d.y, 520, 128, 0x2e1f46)

      LevelScene.prototype.refresh = function () {

      // ── GAME ──
      const SLOT_Y = 256;
      const TRAY_Y = 440;
      const NUM_W = 62,
        OP_W = 50,
        TILE_H = 62;

      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function () {

        this.locked = false;

      };

      GameScene.prototype.create = function () {

        this.streakText = this.add

        this.levelText = this.add
          .text(W - 16, 36, TRACK_LABEL[this.track], {

        this.progressText = this.add
          .text(W / 2, 12, "0 / " + this.target, {

        this.goalText = this.add

        this.varText = this.add
          .text(W / 2, 150, "", {

            fontSize: "20px",
            fontStyle: "bold",
            color: "#e0c8ff",
          })
          .setOrigin(0.5);

        // Live evaluation readout (the heart of the mechanic).
        this.readout = this.add
          .text(W / 2, 320, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#8fd6a0",
          })
          .setOrigin(0.5);

        this.feedback = this.add
          .text(W / 2, 360, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            fontStyle: "bold",
            color: "#ffd24a",
            stroke: "#140c20",
            strokeThickness: 3,
            align: "center",
            wordWrap: { width: W - 80 },
          })
          .setOrigin(0.5)
          .setAlpha(0);

        // Lock-in button
        this.lockBtn = this.add
          .rectangle(W / 2, 508, 220, 50, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(W / 2, 508, "LOCK IN ✓", {
            fontFamily: "Segoe UI, sans-serif",

        this.lockBtn.on("pointerover", () =>

        this.lockBtn.on("pointerout", () =>

        // Hint button (Level 1 only — support tier keeps hints on).
        if (this.track === 1) {
          this.hintBtn = this.add
            .rectangle(W / 2 + 150, 508, 110, 44, 0x42305f)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(W / 2 + 150, 508, "💡 Hint", {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              fontStyle: "bold",

            W / 2,

              ? "× happens before + and −. Drag the x tile to plug the variable in."

            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "13px",

              align: "center",
            },
          )
          .setOrigin(0.5);

        this.redFlash = this.add
          .rectangle(W / 2, H / 2, W, H, 0xff3333, 0)
          .setDepth(90);

        // Drag plumbing (Phaser drag events at scene scope).
        this.input.on("dragstart", (p, g) => {
          this.tweens.killTweensOf(g); // Prevent any active tween from fighting the drag!
          g.setDepth(50);
          JUICE.tilePop(this, g);
          if (g._tileObj && g._tileObj.slotIndex != null) {
            const slot = this.slots[g._tileObj.slotIndex];
            if (slot && slot.tileId === g._tileObj.id) {
              slot.tileId = null;
            }
            g._tileObj.slotIndex = null;
            this.refreshReadout();
          }
        });
        this.input.on("drag", (p, g) => {
          g.x = p.worldX;
          g.y = p.worldY;
        });
        this.input.on("dragend", (p, g) => {
          g.setDepth(8);
          if (g._tileObj) this.dropTile(g._tileObj);
        });

        // Keyboard: ← → move slot cursor; ↑ ↓ cycle the tile in the slot;
        // Backspace clears; Enter / Space lock in.
        this.input.keyboard.on("keydown-LEFT", () => this.moveCursor(-1));
        this.input.keyboard.on("keydown-RIGHT", () => this.moveCursor(1));
        this.input.keyboard.on("keydown-A", () => this.moveCursor(-1));
        this.input.keyboard.on("keydown-D", () => this.moveCursor(1));
        this.input.keyboard.on("keydown-UP", () => this.cycleSlot(-1));
        this.input.keyboard.on("keydown-DOWN", () => this.cycleSlot(1));
        this.input.keyboard.on("keydown-W", () => this.cycleSlot(-1));
        this.input.keyboard.on("keydown-S", () => this.cycleSlot(1));
        this.input.keyboard.on("keydown-BACKSPACE", () => {
          this.clearSlot(this.selectedSlot);
          this.refreshReadout();
        });
        this.input.keyboard.on("keydown-ENTER", () => this.lockIn());
        this.input.keyboard.on("keydown-SPACE", () => this.lockIn());

        this.cameras.main.fadeIn(400);
        this.newProblem();
      };

      // ── Board lifecycle ──────────────────────────────────────────────────
      GameScene.prototype.clearBoard = function () {
        this.boardObjs.forEach((o) => {
          try {
            o.destroy();
          } catch (e) {}
        });
        this.boardObjs = [];
        this.ghosts = [];
        this.tiles = [];
        this.slots = [];
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.clearBoard();
        this.problem = makeProblem(this.track, this.solved);
        const p = this.problem;
        this.goalText.setText(String(p.goal));
        this.varText.setText(p.varVal != null ? "Let x = " + p.varVal : "");
        this.buildBoard();
        this.selectedSlot = 0;
        this.updateFocus();
        this.refreshReadout();
        srSay(
          "Build an expression that equals " +
            p.goal +
            (p.varVal != null ? ". Let x equal " + p.varVal : "") +
            ". Drag tiles into the slots, then lock in.",
        );
      };

      GameScene.prototype.rowXs = function (widths, gap, centerX) {
        const total =
          widths.reduce((a, b) => a + b, 0) + gap * (widths.length - 1);
        let x = centerX - total / 2;
        return widths.map((w) => {
          const c = x + w / 2;
          x += w + gap;
          return c;
        });
      };

      GameScene.prototype.buildBoard = function () {
        const p = this.problem;
        // Slots
        const sWidths = p.slots.map((s) => (s.accept === "op" ? OP_W : NUM_W));
        const sXs = this.rowXs(sWidths, 16, W / 2);
        p.slots.forEach((sdef, i) => {
          const w = sWidths[i];
          const rect = this.add
            .rectangle(sXs[i], SLOT_Y, w, TILE_H, 0x1c1330)
            .setStrokeStyle(2, 0x6a4f8c);
          rect.isFilled = true;
          const focus = this.add
            .rectangle(sXs[i], SLOT_Y, w + 10, TILE_H + 10)
            .setStrokeStyle(3, 0xffd24a)
            .setVisible(false);
          this.boardObjs.push(rect, focus);
          this.slots.push({
            x: sXs[i],
            y: SLOT_Y,
            accept: sdef.accept,
            w,
            tileId: null,
            rect,
            focus,
          });
        });

        // Tray tiles
        const tWidths = p.tray.map((t) => (t.kind === "op" ? OP_W : NUM_W));
        const tXs = this.rowXs(tWidths, 16, W / 2);
        p.tray.forEach((def, i) => {
          this.tiles.push(this.makeTile(def, i, tXs[i], TRAY_Y));
        });
      };

      GameScene.prototype.makeTile = function (def, id, x, y) {
        const w = def.kind === "op" ? OP_W : NUM_W;
        const fill =
          def.kind === "op"
            ? 0x4a2c6e
            : def.kind === "var"
              ? 0x6b3fa0
              : 0x3a2a58;
        const stroke = def.kind === "op" ? 0xe0c8ff : 0xb06fd4;
        const rect = this.add
          .rectangle(0, 0, w, TILE_H, fill)
          .setStrokeStyle(3, stroke);
        const txt = this.add
          .text(0, 0, def.label, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: def.kind === "op" ? "30px" : "28px",
            fontStyle: "bold",
            color: def.kind === "var" ? "#ffe9b0" : "#ffffff",
          })
          .setOrigin(0.5);
        const c = this.add
          .container(x, y, [rect, txt])
          .setSize(w, TILE_H)
          .setDepth(8);
        c.setInteractive(
          new Phaser.Geom.Rectangle(-w / 2, -TILE_H / 2, w, TILE_H),
          Phaser.Geom.Rectangle.Contains,
        );
        this.input.setDraggable(c);
        const obj = {
          id,
          kind: def.kind,
          label: def.label,
          value: def.value,
          container: c,
          homeX: x,
          homeY: y,
          slotIndex: null,
        };
        c._tileObj = obj;
        c.on("pointerup", (pointer) => {
          const dist = Phaser.Math.Distance.Between(
            pointer.downX,
            pointer.downY,
            pointer.upX,
            pointer.upY
          );
          if (dist < 6) {
            this.autoPlace(obj);
          }
        });
        this.boardObjs.push(c);
        return obj;
      };

      // ── Placement helpers ────────────────────────────────────────────────
      GameScene.prototype.tileById = function (id) {
        return this.tiles.find((t) => t.id === id) || null;
      };
      GameScene.prototype.kindFits = function (tile, slot) {
        return slot.accept === "op"
          ? tile.kind === "op"
          : tile.kind === "num" || tile.kind === "var";
      };
      GameScene.prototype.tweenTo = function (tile, x, y) {
        this.tweens.killTweensOf(tile.container); // Stop any existing tweens on this container
        if (this.reduceMotion) {
          tile.container.x = x;
          tile.container.y = y;
          return;
        }
        this.tweens.add({
          targets: tile.container,
          x,
          y,
          duration: 180,
          ease: "Quad.Out",
        });
      };
      GameScene.prototype.sendHome = function (tile) {
        if (tile.slotIndex != null) {
          const s = this.slots[tile.slotIndex];
          if (s && s.tileId === tile.id) s.tileId = null;
          tile.slotIndex = null;
        }
        this.tweenTo(tile, tile.homeX, tile.homeY);
      };
      GameScene.prototype.clearSlot = function (i) {
        const s = this.slots[i];
        if (!s || s.tileId == null) return;
        const t = this.tileById(s.tileId);
        if (t) this.sendHome(t);
        s.tileId = null;
        SFX.place();
      };
      GameScene.prototype.assign = function (tile, slotIndex) {
        if (this.locked) return;
        const slot = this.slots[slotIndex];
        if (!slot || !this.kindFits(tile, slot)) {
          SFX.reject();
          this.tweenTo(tile, tile.homeX, tile.homeY);
          return;
        }
        // Detach tile from any prior slot.
        if (tile.slotIndex != null && tile.slotIndex !== slotIndex) {
          const prev = this.slots[tile.slotIndex];
          if (prev && prev.tileId === tile.id) prev.tileId = null;
        }
        // Bump any tile already in this slot back home.
        if (slot.tileId != null && slot.tileId !== tile.id) {
          const occ = this.tileById(slot.tileId);
          if (occ) this.sendHome(occ);
        }
        slot.tileId = tile.id;
        tile.slotIndex = slotIndex;
        this.tweenTo(tile, slot.x, slot.y);
        SFX.place();
      };
      GameScene.prototype.autoPlace = function (tile) {
        if (this.locked) return;
        if (tile.slotIndex != null) {
          this.sendHome(tile);
          SFX.place();
          this.refreshReadout();
          return;
        }
        const i = this.slots.findIndex(
          (s) => s.tileId == null && this.kindFits(tile, s),
        );
        if (i >= 0) {
          this.assign(tile, i);
          this.selectedSlot = i;
          this.updateFocus();
        } else {
          SFX.reject();
        }
        this.refreshReadout();
      };
      GameScene.prototype.dropTile = function (tile) {
        if (this.locked) {
          this.tweenTo(tile, tile.homeX, tile.homeY);
          return;
        }
        let best = null,
          bd = 96;
        const cx = tile.container.x,
          cy = tile.container.y;

        // If the player drops the tile below the midpoint (closer to the tray),
        // return it home immediately without snapping back to the slots.
        if (cy > 348) {
          this.sendHome(tile);
          this.refreshReadout();
          return;
        }

        this.slots.forEach((s, i) => {
          if (!this.kindFits(tile, s)) return;
          const d = Math.hypot(cx - s.x, cy - s.y);
          if (d < bd) {
            bd = d;
            best = i;
          }
        });
        if (best != null) {
          this.assign(tile, best);
          this.selectedSlot = best;
          this.updateFocus();
        } else {
          this.sendHome(tile);
        }
        this.refreshReadout();
      };

      // ── Keyboard cursor ──────────────────────────────────────────────────
      GameScene.prototype.moveCursor = function (dir) {
        if (this.locked || !this.slots.length) return;
        this.selectedSlot = Phaser.Math.Clamp(
          this.selectedSlot + dir,
          0,
          this.slots.length - 1,
        );
        SFX.reject();
        this.updateFocus();
      };
      GameScene.prototype.updateFocus = function () {
        this.slots.forEach((s, i) =>
          s.focus.setVisible(i === this.selectedSlot),
        );
      };
      GameScene.prototype.cycleSlot = function (dir) {
        if (this.locked || !this.slots.length) return;
        const slot = this.slots[this.selectedSlot];
        const pool = this.tiles.filter(
          (t) =>
            this.kindFits(t, slot) &&
            (t.slotIndex == null || t.slotIndex === this.selectedSlot),
        );
        const opts = [null, ...pool.map((t) => t.id)];
        let idx = opts.indexOf(slot.tileId);
        if (idx < 0) idx = 0;
        idx = (idx + dir + opts.length) % opts.length;
        const next = opts[idx];
        if (next == null) this.clearSlot(this.selectedSlot);
        else this.assign(this.tileById(next), this.selectedSlot);
        this.refreshReadout();
      };

      // ── Live readout ─────────────────────────────────────────────────────
      GameScene.prototype.readState = function () {
        const parts = [];
        const nums = [];
        const ops = [];
        let filled = true;
        let hasVar = false;
        this.slots.forEach((s) => {
          if (s.tileId == null) {
            filled = false;
            parts.push({ label: "▢", sub: "▢" });
            return;
          }
          const t = this.tileById(s.tileId);
          parts.push({ label: t.label, sub: tileSub(t) });
          if (t.kind === "var") hasVar = true;
          if (s.accept === "op") ops.push(t.value);
          else nums.push(t.value);
        });
        const value = filled ? evalSeq(nums, ops) : null;
        return { parts, value, filled, hasVar };
      };
      GameScene.prototype.refreshReadout = function () {
        const st = this.readState();
        const expr = st.parts.map((p) => p.label).join(" ");
        if (!st.filled) {
          this.readout.setColor("#c8a0e0");
          this.readout.setText(expr + "  = ?");
          // Announce the in-progress build to screen-reader users (WCAG: the
          // #ee-sr live region must actually be populated as tiles change).
          srSay(
            "Building: " +
              (expr.trim() ? expr : "empty") +
              ". Goal " +
              (this.problem ? this.problem.goal : "") +
              ".",
          );
          return;
        }
        const hit = st.value === this.problem.goal;
        this.readout.setColor(hit ? "#8fd6a0" : "#e0d0f0");
        const sub = st.hasVar
          ? "  →  " + st.parts.map((p) => p.sub).join(" ")
          : "";
        this.readout.setText(expr + sub + "  =  " + st.value);
        srSay(
          expr +
            " equals " +
            st.value +
            ". Goal " +
            this.problem.goal +
            ". " +
            (hit ? "Matches — lock it in." : ""),
        );
      };

      GameScene.prototype.showHint = function () {
        if (this.locked || !this.problem) return;
        const p = this.problem;
        const op = p.solution.find((t) => t.kind === "op");
        this.feedback
          .setText(
            "Hint: this build uses " +
              (op ? op.label : "+") +
              ". Place the values around the sign so it equals " +
              p.goal +
              ".",
          )
          .setColor("#e0c8ff")
          .setAlpha(1);
        srSay(
          "Hint. This expression uses the " +
            (op ? op.label : "plus") +
            " sign.",
        );
      };

      // ── Resolve a Lock In ────────────────────────────────────────────────
      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        const st = this.readState();
        if (!st.filled) {
          this.feedback
            .setText("Fill every slot first, then Lock In.")
            .setColor("#ffd24a")
            .setAlpha(1);
          SFX.reject();
          srSay("Fill every slot first.");
          return;
        }
        this.locked = true;
        const p = this.problem;
        const correct = st.value === p.goal;
        if (correct) {
          SFX.good();
          JUICE.audio.correct(this.streak);
          this.solved++;
          this.streak++;
          const bonus = Math.min(this.streak, 5) * 5;
          const gained = 20 + bonus;
          this.score += gained;
          this.slots.forEach((s) => s.rect.setStrokeStyle(3, 0x36a35b));
          JUICE.burst(this, W / 2, SLOT_Y, [0x34d399, 0xb06fd4, 0xffffff], 18);
          JUICE.shake(this, 0.004 + Math.min(this.streak, 5) * 0.001);
          JUICE.floatText(
            this,
            W / 2,
            SLOT_Y - 40,
            "+" + gained,
            "#34d399",
            38,
          );
          JUICE.award(gained, "u6-expression-express");
          if (this.streak >= 2) JUICE.confetti(this, 1);
          this.feedback
            .setText("Correct!  " + p.why)
            .setColor("#8fd6a0")
            .setAlpha(1);
          srSay("Correct. " + p.why);
          this.afterAttempt();
        } else {
          SFX.bad();
          JUICE.audio.wrong();
          this.streak = 0;
          this.lives--;
          this.flashRed();
          JUICE.shake(this, 0.009);
          this.slots.forEach((s) => s.rect.setStrokeStyle(3, 0xc23b3b));
          this.feedback
            .setText(
              "Not quite. One correct build:  " + p.exprStr + " = " + p.goal,
            )
            .setColor("#ff8f8f")
            .setAlpha(1);
          srSay(
            "Not quite. One correct build is " +
              p.exprStr +
              " equals " +
              p.goal +
              ". " +
              p.why,
          );
          this.showSolution();
          this.time.delayedCall(this.reduceMotion ? 600 : 1500, () =>
            this.afterAttempt(),
          );
        }
      };

      // Teach: clear the student's tiles and reveal one correct assembly.
      GameScene.prototype.showSolution = function () {
        this.tiles.forEach((t) => t.container.setVisible(false));
        const p = this.problem;
        p.solution.forEach((s, i) => {
          const slot = this.slots[i];
          if (!slot) return;
          const w = s.kind === "op" ? OP_W : NUM_W;
          const g = this.add
            .rectangle(slot.x, slot.y, w, TILE_H, 0x2d6b46)
            .setStrokeStyle(3, 0x8fd6a0)
            .setDepth(12);
          const t = this.add
            .text(slot.x, slot.y, s.label, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: s.kind === "op" ? "30px" : "28px",
              fontStyle: "bold",
              color: "#eafff0",
            })
            .setOrigin(0.5)
            .setDepth(13);
          this.boardObjs.push(g, t);
          JUICE.popIn(this, g, i * 60);
        });
      };

      GameScene.prototype.afterAttempt = function () {
        this.updateHUD();
        if (this.lives <= 0) {
          this.endGame(false);
          return;
        }
        if (this.solved >= this.target) {
          this.endGame(true);
          return;
        }
        this.time.delayedCall(this.reduceMotion ? 500 : 900, () => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.flashRed = function () {
        if (this.reduceMotion) return;
        this.redFlash.setAlpha(0.35);
        this.tweens.add({ targets: this.redFlash, alpha: 0, duration: 350 });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.livesText.setText(this.lives > 0 ? "❤".repeat(this.lives) : "—");
        this.streakText.setText("Streak: " + this.streak);
        this.progressText.setText(this.solved + " / " + this.target);
      };

      GameScene.prototype.endGame = function (won) {
        this.locked = true;
        this.time.delayedCall(500, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            won: won,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x221636);
        const stars =
          d.solved >= d.target ? 3 : d.solved >= d.target * 0.6 ? 2 : 1;
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        if (d.score > hs) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }

        this.add
          .text(cx, 110, d.won ? "FULL STEAM AHEAD!" : "OUT OF LIVES", {
            fontFamily: "Impact, sans-serif",
            fontSize: "44px",
            color: d.won ? "#b06fd4" : "#ff8f8f",
            stroke: "#140c20",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 185, "★".repeat(stars) + "☆".repeat(3 - stars), {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "48px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 255, "Score: " + d.score, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "30px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            295,
            "Built " + d.solved + " of " + d.target + " expressions",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "18px",
              color: "#e0d0f0",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 325, "High Score: " + hs, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);

        if (d.won) {
          SFX.win();
          JUICE.audio.fanfare();
          JUICE.confetti(this, 2);
        } else SFX.lose();

        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.score,
              stars: stars,
              standard: "6.EE.2",
              problemsAttempted: d.solved,
            });
        } catch (e) {}
        srSay(
          (d.won ? "You won! " : "Game over. ") +
            "Final score " +
            d.score +
            ", " +
            stars +
            " stars.",
        );

        const btn = this.add
          .rectangle(cx, 400, 220, 54, 0x7a3fb0)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx, 400, "PLAY AGAIN 🔁", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const again = () => this.scene.start("Game");
        btn.on("pointerover", () => btn.setFillStyle(0x9050c8));
        btn.on("pointerout", () => btn.setFillStyle(0x7a3fb0));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        const change = this.add
          .text(cx, 458, "Change level", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#c8a0e0",
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        change.on("pointerover", () => change.setColor("#ffd24a"));
        change.on("pointerout", () => change.setColor("#c8a0e0"));
        change.on("pointerdown", () => this.scene.start("Level"));

        const hub = this.add
          .text(cx, 506, "← Back to Math Games", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#a080c0",
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        hub.on("pointerover", () => hub.setColor("#b06fd4"));
        hub.on("pointerout", () => hub.setColor("#a080c0"));
        hub.on("pointerdown", () => (window.location.href = "/math/games/"));
      };

      // ── Launch ──
      const eeGame = new Phaser.Game(config);

      eeGame.events.once("ready", function () {
        try {
          const cv = eeGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Expression Express Assembler math game. A target value is given. " +
              "Drag number and operator tiles, or use the arrow keys to pick a " +
              "slot and the up and down keys to fill it, to build an expression " +
              "that equals the target. Then press Lock In, Enter, or Space.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>

    <script src="/assets/game-fx.js" defer></script>

    <!-- Student Passport (meta-progression) -->
    <script src="/assets/lesson-passport.js" defer></script>

    <script src="/assets/math-workbench-launcher.js" defer></script>
