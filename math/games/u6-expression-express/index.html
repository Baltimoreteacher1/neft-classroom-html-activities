    <script>
      // Decorative star-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("ee-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 34;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "ee-star";
            var sz = rnd(1.5, 4);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" + (dx * 20).toFixed(2) + "px," + (dy * 12).toFixed(2) + "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener) reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── EXPRESSION EXPRESS — ASSEMBLER ──────────────────────────────────────
      // Phaser 3 — Grade 6 Math — Building & evaluating expressions, exponents
      // optional, order of operations (6.AT.5-4).
      //
      // Math-as-mechanic (calm, NO timer / NO reflex): a TARGET value is given.
      // The student DRAGS number / operator (and on Level 2, a variable) tiles
      // from the tray into ordered slots to ASSEMBLE an expression that equals
      // the target — respecting order of operations (× before + and −). A live
      // readout evaluates the build as tiles land, so the math IS the action.
      // Lock In checks it. A wrong build gets a diagnostic hint and a retry of
      // the SAME problem (no reveal, no penalty); a second wrong build shows
      // one correct assembly to teach, then continues. Every generated
      // target is guaranteed solvable because the puzzle is built from a known
      // valid arrangement plus a few distractor tiles.

      const W = 820,
        H = 600;
      const LS_KEY = "ee_expr_assembler_highscore";

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        place() {
          this.play("square", 520, 0.05, 0.08);
        },
        reject() {
          this.play("triangle", 200, 0.12, 0.07);
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
        lose() {
          [400, 330, 260, 200].forEach((f, i) =>
            setTimeout(() => this.play("sawtooth", f, 0.3, 0.14), i * 170),
          );
        },
      };

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          tap() {},
          pop() {},
          correct() {},
          wrong() {},
          whoosh() {},
          fanfare() {},
          musicStart() {},
          musicStop() {},
        },
        theme: () => ({
          accent: "#b06fd4",
          accentN: 0xb06fd4,
          tileN: 0x3a2a58,
          botN: 0x221636,
        }),
        bgGradient() {},
        popIn() {},
        tilePop() {},
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function shuffle(a) {
        const r = [...a];
        for (let i = r.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [r[i], r[j]] = [r[j], r[i]];
        }
        return r;
      }
      function srSay(msg) {
        const el = document.getElementById("ee-sr");
        if (el) el.textContent = msg;
      }

      // ── Expression engine ───────────────────────────────────────────────
      // Evaluate a left-to-right token sequence honouring order of operations:
      // multiply first, then add / subtract. Only +, −, × are used so every
      // value stays a friendly positive integer.
      function evalSeq(nums, ops) {
        const v = [nums[0]];
        const o = [];
        for (let i = 0; i < ops.length; i++) {
          if (ops[i] === "×") v[v.length - 1] = v[v.length - 1] * nums[i + 1];
          else {
            o.push(ops[i]);
            v.push(nums[i + 1]);
          }
        }
        let r = v[0];
        for (let i = 0; i < o.length; i++) r = o[i] === "+" ? r + v[i + 1] : r - v[i + 1];
        return r;
      }
      const numTile = (v) => ({ kind: "num", label: String(v), value: v });
      const opTile = (o) => ({ kind: "op", label: o, value: o });
      const varTile = (v) => ({ kind: "var", label: "x", value: v });
      const tileLabel = (t) => t.label;
      const tileSub = (t) => (t.kind === "var" ? String(t.value) : t.label);
      function pick(arr) {
        return arr[randInt(0, arr.length - 1)];
      }
      function distinctNum(avoid) {
        let n,
          guard = 0;
        do {
          n = randInt(2, 12);
          guard++;
        } while (avoid.indexOf(n) !== -1 && guard < 30);
        return n;
      }

      // ── Problem generator ────────────────────────────────────────────────
      // Returns { goal, varVal, slots:[{accept}], tray:[tileDef], solution:[tileDef],
      //           varVal, why, exprStr }. Level drives structure & scaffolding.
      //   Level 1 (support):    [num][op][num]      one operation, hints on.
      //   Level 2 (enrichment): [t][op][t][op][t]   order of operations + a
      //                          variable x to substitute, fewer hints.
      function genLevel1(step) {
        let a,
          b,
          op,
          goal,
          tries = 0;
        do {
          op = pick(["+", "−", "×"]);
          if (op === "×") {
            a = randInt(2, 9);
            b = randInt(2, 6);
          } else {
            a = randInt(2, 12);
            b = randInt(2, 12);
          }
          if (op === "−" && a < b) {
            const t = a;
            a = b;
            b = t;
          }
          goal = evalSeq([a, b], [op]);
          tries++;
        } while ((goal < 2 || goal > 99) && tries < 40);
        if (goal < 2) {
          a = 5;
          b = 3;
          op = "+";
          goal = 8;
        }
        const solution = [numTile(a), opTile(op), numTile(b)];
        const dn = distinctNum([a, b]);
        const dop = pick(["+", "−", "×"].filter((o) => o !== op));
        // A second distractor number after a few rounds keeps it fresh.
        const tray = [numTile(a), numTile(b), numTile(dn), opTile(op), opTile(dop)];
        if (step >= 4) tray.push(numTile(distinctNum([a, b, dn])));
        return {
          goal,
          varVal: null,
          slots: solution.map((t) => ({
            accept: t.kind === "op" ? "op" : "num",
          })),
          solution,
          tray: shuffle(tray),
          exprStr: a + " " + op + " " + b,
          why: a + " " + op + " " + b + " = " + goal + ".",
        };
      }
      function genLevel2(step) {
        let vals,
          ops,
          goal,
          xVal,
          varPos,
          tries = 0;
        do {
          xVal = randInt(2, 6);
          varPos = randInt(0, 2);
          ops = [pick(["+", "−", "×"]), pick(["+", "−", "×"])];
          vals = [randInt(2, 9), randInt(2, 9), randInt(2, 9)];
          vals[varPos] = xVal;
          goal = evalSeq(vals, ops);
          tries++;
        } while ((goal < 3 || goal > 99) && tries < 80);
        if (goal < 3 || goal > 99) {
          xVal = 3;
          varPos = 1;
          vals = [5, 3, 2];
          ops = ["×", "+"];
          goal = 17;
        }
        const solution = [];
        for (let i = 0; i < 3; i++) {
          if (i > 0) solution.push(opTile(ops[i - 1]));
          solution.push(i === varPos ? varTile(xVal) : numTile(vals[i]));
        }
        const operands = solution.filter((t) => t.kind !== "op");
        const opsTiles = solution.filter((t) => t.kind === "op");
        const dn = distinctNum(vals);
        const dop = pick(["+", "−", "×"]);
        const tray = [...operands, numTile(dn), ...opsTiles, opTile(dop)];
        if (step >= 4) tray.push(opTile(pick(["+", "−", "×"])));
        const exprStr = solution.map(tileLabel).join(" ");
        const subStr = solution.map(tileSub).join(" ");
        return {
          goal,
          varVal: xVal,
          slots: solution.map((t) => ({
            accept: t.kind === "op" ? "op" : "num",
          })),
          solution,
          tray: shuffle(tray),
          exprStr,
          why: "x = " + xVal + ", so " + subStr + " = " + goal + ".",
        };
      }
      function makeProblem(track, step) {
        return track === 2 ? genLevel2(step) : genLevel1(step);
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#221636",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, LevelScene, VocabScene, GameScene, ResultScene],
      };

      // Cross-scene choices (persist across "Play Again", reset only on reload).
      let eeTrack = 1; // 1 = support, 2 = enrichment
      let eeVocabSeen = false;
      let eeAuto = false; // true when the ✨ Auto button picked the level (NTAdaptive)
      let eeEndless = false; // true for endless (no auto-end) runs
      const TRACK_LABEL = { 1: "Level 1 · Support", 2: "Level 2 · Enrichment" };

      // ── Vocab gate terms (6.AT.5–4) ─────────────────────────────────────
      // Term + Level-1 (student-facing) definition + emoji image. Shown BEFORE
      // the first round so students meet the key words before they play.
      const VOCAB_TERMS = [
        {
          term: "Expression",
          emoji: "🧮",
          def: "A math phrase made of numbers and operations, like 3 × 4 + 2. It has no equals sign — you build it and find its value.",
        },
        {
          term: "Variable",
          emoji: "🔤",
          def: "A letter that stands for a number you do not know yet, like x. You can plug a number in for it.",
        },
        {
          term: "Coefficient",
          emoji: "✳️",
          def: "The number in front of a letter, like the 3 in 3x. In 5x, the 5 is the coefficient, so 5x means 5 times x.",
        },
        {
          term: "Term",
          emoji: "➕",
          def: "One part of an expression, separated by + or − signs. In 5x + 2, the terms are 5x and 2.",
        },
        {
          term: "Order of Operations",
          emoji: "📋",
          def: "The rules for what to solve first: parentheses, exponents, then × and ÷, then + and −.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0xb06fd4);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x221636);
        this.add
          .text(cx, 110, "EXPRESSION", {
            fontFamily: "Impact, sans-serif",
            fontSize: "58px",
            color: "#b06fd4",
            stroke: "#140c20",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 162, "EXPRESS", {
            fontFamily: "Impact, sans-serif",
            fontSize: "58px",
            color: "#e0c8ff",
            stroke: "#140c20",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 210, "Expression Assembler", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            color: "#c8a0e0",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            268,
            "Drag number & operator tiles into the slots to BUILD an\nexpression that equals the target. Calm — no timer!",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#e0d0f0",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 318, "6.AT.5–4 · Lessons 6.1–6.7", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#a080c0",
          })
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 350, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#ffd24a",
              fontStyle: "bold",
            })
            .setOrigin(0.5);

        const btn = this.add
          .rectangle(cx, 420, 240, 58, 0x7a3fb0)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 420, "ALL ABOARD ▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "22px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.tweens.add({
          targets: [btn, btnT],
          scaleX: 1.05,
          scaleY: 1.05,
          duration: 800,
          yoyo: true,
          repeat: -1,
        });
        const start = () => {
          SFX.init();
          JUICE.audio.unlock();
          SFX.place();
          this.scene.start("Level");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x9050c8));
        btn.on("pointerout", () => btn.setFillStyle(0x7a3fb0));
        btn.on("pointerdown", start);
        this.input.keyboard.on("keydown-SPACE", start);
        this.input.keyboard.on("keydown-ENTER", start);
        srSay("Expression Express Assembler. Press Start to choose your level.");
      };

      // ── LEVEL SELECT ──
      // Two tracks: Level 1 (support) and Level 2 (enrichment). NEVER labelled

        const back = this.add

      LevelScene.prototype.refresh = function () {

      // ── GAME ──
      const SLOT_Y = 256;
      const TRAY_Y = 440;
      const NUM_W = 62,
        OP_W = 50,
        TILE_H = 62;

      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function () {
        this.reduceMotion = !!(
          window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
        this.score = 0;
        this.streak = 0;
        this.solved = 0;
        this.auto = eeAuto; // carried into Result for adaptive recordRun
        this.endless = eeEndless; // endless runs never auto-end
        this.attemptsAll = 0; // cumulative graded lock-ins (for accuracy)
        this.target = this.endless ? Infinity : 10; // win when this many expressions are assembled
        this.track = eeTrack;
        this.problem = null;
        this.locked = false;
        this.tiles = [];
        this.slots = [];
        this.ghosts = [];
        this.boardObjs = [];
        this.selectedSlot = 0;
      };

      GameScene.prototype.create = function () {
        this.add.rectangle(W / 2, H / 2, W, H, 0x221636);

        const hudStyle = {
          fontFamily: "Segoe UI, sans-serif",
          fontSize: "18px",
          fontStyle: "bold",
        };
        this.scoreText = this.add.text(16, 12, "Score: 0", {
          ...hudStyle,
          color: "#c8a0e0",
        });
        this.streakText = this.add
          .text(W - 16, 12, "Streak: 0", { ...hudStyle, color: "#ffd24a" })
          .setOrigin(1, 0);
        this.levelText = this.add
          .text(W - 16, 36, TRACK_LABEL[this.track], {
            ...hudStyle,
            fontSize: "15px",
            color: "#e0d0f0",
          })
          .setOrigin(1, 0);
        this.progressText = this.add
          .text(W / 2, 12, "0 / " + (this.endless ? "∞" : this.target), {
            ...hudStyle,
            color: "#e0d0f0",
          })
          .setOrigin(0.5, 0);

        // Endless mode: a small "Finish ✓" HUD control that ends the run now
        // (same Result transition the win uses, with current stats).
        if (this.endless) {
          this.finishBtn = this.add
            .text(16, 40, "Finish ✓", {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd24a",
            })
            .setInteractive({ useHandCursor: true });
          this.finishBtn.on("pointerover", () => this.finishBtn.setColor("#ffffff"));
          this.finishBtn.on("pointerout", () => this.finishBtn.setColor("#ffd24a"));
          this.finishBtn.on("pointerdown", () => {
            if (this.locked) return;
            this.endGame();
          });
        }

        // Target banner — the value to build toward.
        this.add
          .text(W / 2, 74, "Build an expression that equals", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#a080c0",
          })
          .setOrigin(0.5);
        this.goalText = this.add
          .text(W / 2, 112, "", {
            fontFamily: "Impact, sans-serif",
            fontSize: "52px",
            color: "#ffd24a",
            stroke: "#140c20",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        this.varText = this.add
          .text(W / 2, 150, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#e0c8ff",
          })
          .setOrigin(0.5);

        // Live evaluation readout (the heart of the mechanic).
        this.readout = this.add
          .text(W / 2, 320, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#8fd6a0",
          })
          .setOrigin(0.5);

        this.feedback = this.add
          .text(W / 2, 360, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            fontStyle: "bold",
            color: "#ffd24a",
            stroke: "#140c20",
            strokeThickness: 3,
            align: "center",
            wordWrap: { width: W - 80 },
          })
          .setOrigin(0.5)
          .setAlpha(0);

        // Lock-in button
        this.lockBtn = this.add
          .rectangle(W / 2, 508, 220, 50, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(W / 2, 508, "LOCK IN ✓", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "21px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.lockBtn.on("pointerover", () => this.lockBtn.setFillStyle(0x36a35b));
        this.lockBtn.on("pointerout", () => this.lockBtn.setFillStyle(0x2d874b));
        this.lockBtn.on("pointerdown", () => this.lockIn());

        // Hint button (Level 1 only — support tier keeps hints on).
        if (this.track === 1) {
          this.hintBtn = this.add
            .rectangle(W / 2 + 150, 508, 110, 44, 0x42305f)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(W / 2 + 150, 508, "💡 Hint", {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              fontStyle: "bold",
              color: "#e0c8ff",
            })
            .setOrigin(0.5);
          this.hintBtn.on("pointerover", () => this.hintBtn.setFillStyle(0x54407a));
          this.hintBtn.on("pointerout", () => this.hintBtn.setFillStyle(0x42305f));
          this.hintBtn.on("pointerdown", () => this.showHint());
        }

        this.hintLine = this.add
          .text(
            W / 2,
            552,
            this.track === 2
              ? "× happens before + and −. Drag the x tile to plug the variable in."
              : "Drag tiles into the slots. Tap a placed tile to send it back.",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "13px",
              color: "#a080c0",
              align: "center",
            },
          )
          .setOrigin(0.5);

        // Brief calm amber tint for a not-yet attempt (no-fail practice).
        this.amberTint = this.add.rectangle(W / 2, H / 2, W, H, 0xf0b44a, 0).setDepth(90);

        // Drag plumbing (Phaser drag events at scene scope).
        this.activeDragObject = null;
        if (!window._dragLockHandlersRegisteredExpress) {
          window._dragLockHandlersRegisteredExpress = true;
          window.addEventListener("pointerup", () => {
            if (this.sys && this.sys.game) {
              const activeScene = this.sys.game.scene.getScenes(true)[0];
              if (activeScene) activeScene.activeDragObject = null;
            }
          });
          window.addEventListener("blur", () => {
            if (this.sys && this.sys.game) {
              const activeScene = this.sys.game.scene.getScenes(true)[0];
              if (activeScene) activeScene.activeDragObject = null;
            }
          });
        }
        // Tap vs drag semantics (deterministic — no handler races):
        //   • dragstart fires on EVERY pointerdown (zero drag thresholds), so it
        //     must NOT detach the tile or mark it dragged — a pure tap is
        //     handled solely by the container's pointerup → autoPlace toggle.
        //   • Only real movement (≥ 8px, touch-jitter tolerant) marks the tile
        //     as dragged, detaches it from its slot, and moves it.
        //   • dragend runs dropTile ONLY for a real drag; taps never dropTile.
        this.input.on("dragstart", (p, g) => {
          if (this.activeDragObject) return;
          this.activeDragObject = g;
          this.tweens.killTweensOf(g); // Prevent any active tween from fighting the drag!
          g.setDepth(50);
        });
        this.input.on("drag", (p, g) => {
          if (g !== this.activeDragObject || !g._tileObj) return;
          if (!g._tileObj._wasDragged) {
            if (p.getDistance() < 8) return; // still a tap, not a drag
            g._tileObj._wasDragged = true;
            JUICE.tilePop(this, g);
            if (g._tileObj.slotIndex != null) {
              const slot = this.slots[g._tileObj.slotIndex];
              if (slot && slot.tileId === g._tileObj.id) slot.tileId = null;
              g._tileObj.slotIndex = null;
              this.refreshReadout();
            }
          }
          g.x = p.worldX;
          g.y = p.worldY;
        });
        this.input.on("dragend", (p, g) => {
          // Never gate the drop on activeDragObject identity: the window-level
          // pointerup safety net (above) clears it BEFORE Phaser dispatches
          // dragend (DOM pointerup precedes the mouseup/touchend Phaser
          // listens to), which used to skip dropTile on EVERY drag and strand
          // the tile on the board without filling the slot.
          if (g === this.activeDragObject) this.activeDragObject = null;
          g.setDepth(8);
          if (g._tileObj && g._tileObj._wasDragged) this.dropTile(g._tileObj);
        });

        // Keyboard: ← → move slot cursor; ↑ ↓ cycle the tile in the slot;
        // Backspace clears; Enter / Space lock in.
        this.input.keyboard.on("keydown-LEFT", () => this.moveCursor(-1));
        this.input.keyboard.on("keydown-RIGHT", () => this.moveCursor(1));
        this.input.keyboard.on("keydown-A", () => this.moveCursor(-1));
        this.input.keyboard.on("keydown-D", () => this.moveCursor(1));
        this.input.keyboard.on("keydown-UP", () => this.cycleSlot(-1));
        this.input.keyboard.on("keydown-DOWN", () => this.cycleSlot(1));
        this.input.keyboard.on("keydown-W", () => this.cycleSlot(-1));
        this.input.keyboard.on("keydown-S", () => this.cycleSlot(1));
        this.input.keyboard.on("keydown-BACKSPACE", () => {
          this.clearSlot(this.selectedSlot);
          this.refreshReadout();
        });
        this.input.keyboard.on("keydown-ENTER", () => this.lockIn());
        this.input.keyboard.on("keydown-SPACE", () => this.lockIn());

        this.cameras.main.fadeIn(400);
        this.newProblem();
      };

      // ── Board lifecycle ──────────────────────────────────────────────────
      GameScene.prototype.clearBoard = function () {
        this.boardObjs.forEach((o) => {
          try {
            o.destroy();
          } catch (e) {}
        });
        this.boardObjs = [];
        this.ghosts = [];
        this.tiles = [];
        this.slots = [];
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.attempts = 0; // wrong tries on THIS problem (1st = retry, 2nd = teach)
        this.clearBoard();
        this.problem = makeProblem(this.track, this.solved);
        const p = this.problem;
        this.goalText.setText(String(p.goal));
        this.varText.setText(p.varVal != null ? "Let x = " + p.varVal : "");
        this.buildBoard();
        this.selectedSlot = 0;
        this.updateFocus();
        this.refreshReadout();
        srSay(
          "Build an expression that equals " +
            p.goal +
            (p.varVal != null ? ". Let x equal " + p.varVal : "") +
            ". Drag tiles into the slots, then lock in.",
        );
      };

      GameScene.prototype.rowXs = function (widths, gap, centerX) {
        const total = widths.reduce((a, b) => a + b, 0) + gap * (widths.length - 1);
        let x = centerX - total / 2;
        return widths.map((w) => {
          const c = x + w / 2;
          x += w + gap;
          return c;
        });
      };

      GameScene.prototype.buildBoard = function () {
        const p = this.problem;
        // Slots
        const sWidths = p.slots.map((s) => (s.accept === "op" ? OP_W : NUM_W));
        const sXs = this.rowXs(sWidths, 16, W / 2);
        p.slots.forEach((sdef, i) => {
          const w = sWidths[i];
          const rect = this.add
            .rectangle(sXs[i], SLOT_Y, w, TILE_H, 0x1c1330)
            .setStrokeStyle(2, 0x6a4f8c);
          rect.isFilled = true;
          const focus = this.add
            .rectangle(sXs[i], SLOT_Y, w + 10, TILE_H + 10)
            .setStrokeStyle(3, 0xffd24a)
            .setVisible(false);
          this.boardObjs.push(rect, focus);
          this.slots.push({
            x: sXs[i],
            y: SLOT_Y,
            accept: sdef.accept,
            w,
            tileId: null,
            rect,
            focus,
          });
        });

        // Tray tiles
        const tWidths = p.tray.map((t) => (t.kind === "op" ? OP_W : NUM_W));
        const tXs = this.rowXs(tWidths, 16, W / 2);
        p.tray.forEach((def, i) => {
          this.tiles.push(this.makeTile(def, i, tXs[i], TRAY_Y));
        });
      };

      GameScene.prototype.makeTile = function (def, id, x, y) {
        const w = def.kind === "op" ? OP_W : NUM_W;
        const fill = def.kind === "op" ? 0x4a2c6e : def.kind === "var" ? 0x6b3fa0 : 0x3a2a58;
        const stroke = def.kind === "op" ? 0xe0c8ff : 0xb06fd4;
        const rect = this.add.rectangle(0, 0, w, TILE_H, fill).setStrokeStyle(3, stroke);
        const txt = this.add
          .text(0, 0, def.label, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: def.kind === "op" ? "30px" : "28px",
            fontStyle: "bold",
            color: def.kind === "var" ? "#ffe9b0" : "#ffffff",
          })
          .setOrigin(0.5);
        const c = this.add.container(x, y, [rect, txt]).setSize(w, TILE_H).setDepth(8);
        c.setInteractive(
          new Phaser.Geom.Rectangle(-w / 2, -TILE_H / 2, w, TILE_H),
          Phaser.Geom.Rectangle.Contains,
        );
        this.input.setDraggable(c);
        const obj = {
          id,
          kind: def.kind,
          label: def.label,
          value: def.value,
          container: c,
          homeX: x,
          homeY: y,
          slotIndex: null,
        };
        c._tileObj = obj;
        c.on("pointerdown", () => {
          obj._wasDragged = false; // Reset state!
        });
        c.on("pointerup", () => {
          if (!obj._wasDragged) {
            this.autoPlace(obj);
          }
        });
        this.boardObjs.push(c);
        return obj;
      };

      // ── Placement helpers ────────────────────────────────────────────────
      GameScene.prototype.tileById = function (id) {
        return this.tiles.find((t) => t.id === id) || null;
      };
      GameScene.prototype.kindFits = function (tile, slot) {
        return slot.accept === "op"
          ? tile.kind === "op"
          : tile.kind === "num" || tile.kind === "var";
      };
      GameScene.prototype.tweenTo = function (tile, x, y) {
        this.tweens.killTweensOf(tile.container); // Stop any existing tweens on this container
        if (this.reduceMotion) {
          tile.container.x = x;
          tile.container.y = y;
          return;
        }
        this.tweens.add({
          targets: tile.container,
          x,
          y,
          duration: 180,
          ease: "Quad.Out",
        });
      };
      GameScene.prototype.sendHome = function (tile) {
        if (tile.slotIndex != null) {
          const s = this.slots[tile.slotIndex];
          if (s && s.tileId === tile.id) s.tileId = null;
          tile.slotIndex = null;
        }
        this.tweenTo(tile, tile.homeX, tile.homeY);
      };
      GameScene.prototype.clearSlot = function (i) {
        const s = this.slots[i];
        if (!s || s.tileId == null) return;
        const t = this.tileById(s.tileId);
        if (t) this.sendHome(t);
        s.tileId = null;
        SFX.place();
      };
      GameScene.prototype.assign = function (tile, slotIndex) {
        if (this.locked) return;
        const slot = this.slots[slotIndex];
        if (!slot || !this.kindFits(tile, slot)) {
          SFX.reject();
          this.tweenTo(tile, tile.homeX, tile.homeY);
          return;
        }
        // Detach tile from any prior slot.
        if (tile.slotIndex != null && tile.slotIndex !== slotIndex) {
          const prev = this.slots[tile.slotIndex];
          if (prev && prev.tileId === tile.id) prev.tileId = null;
        }
        // Bump any tile already in this slot back home.
        if (slot.tileId != null && slot.tileId !== tile.id) {
          const occ = this.tileById(slot.tileId);
          if (occ) this.sendHome(occ);
        }
        slot.tileId = tile.id;
        tile.slotIndex = slotIndex;
        this.tweenTo(tile, slot.x, slot.y);
        SFX.place();
      };
      GameScene.prototype.autoPlace = function (tile) {
        if (this.locked) return;
        if (tile.slotIndex != null) {
          this.sendHome(tile);
          SFX.place();
          this.refreshReadout();
          return;
        }
        const i = this.slots.findIndex((s) => s.tileId == null && this.kindFits(tile, s));
        if (i >= 0) {
          this.assign(tile, i);
          this.selectedSlot = i;
          this.updateFocus();
        } else {
          SFX.reject();
        }
        this.refreshReadout();
      };
      GameScene.prototype.dropTile = function (tile) {
        if (this.locked) {
          this.tweenTo(tile, tile.homeX, tile.homeY);
          return;
        }
        let best = null,
          bd = 96;
        const cx = tile.container.x,
          cy = tile.container.y;

        // If the player drops the tile below the midpoint (closer to the tray),
        // return it home immediately without snapping back to the slots.
        if (cy > 348) {
          this.sendHome(tile);
          this.refreshReadout();
          return;
        }

        this.slots.forEach((s, i) => {
          if (!this.kindFits(tile, s)) return;
          const d = Math.hypot(cx - s.x, cy - s.y);
          if (d < bd) {
            bd = d;
            best = i;
          }
        });
        if (best != null) {
          this.assign(tile, best);
          this.selectedSlot = best;
          this.updateFocus();
        } else {
          this.sendHome(tile);
        }
        this.refreshReadout();
      };

      // ── Keyboard cursor ──────────────────────────────────────────────────
      GameScene.prototype.moveCursor = function (dir) {
        if (this.locked || !this.slots.length) return;
        this.selectedSlot = Phaser.Math.Clamp(this.selectedSlot + dir, 0, this.slots.length - 1);
        SFX.reject();
        this.updateFocus();
      };
      GameScene.prototype.updateFocus = function () {
        this.slots.forEach((s, i) => s.focus.setVisible(i === this.selectedSlot));
      };
      GameScene.prototype.cycleSlot = function (dir) {
        if (this.locked || !this.slots.length) return;
        const slot = this.slots[this.selectedSlot];
        const pool = this.tiles.filter(
          (t) =>
            this.kindFits(t, slot) && (t.slotIndex == null || t.slotIndex === this.selectedSlot),
        );
        const opts = [null, ...pool.map((t) => t.id)];
        let idx = opts.indexOf(slot.tileId);
        if (idx < 0) idx = 0;
        idx = (idx + dir + opts.length) % opts.length;
        const next = opts[idx];
        if (next == null) this.clearSlot(this.selectedSlot);
        else this.assign(this.tileById(next), this.selectedSlot);
        this.refreshReadout();
      };

      // ── Live readout ─────────────────────────────────────────────────────
      GameScene.prototype.readState = function () {
        const parts = [];
        const nums = [];
        const ops = [];
        let filled = true;
        let hasVar = false;
        this.slots.forEach((s) => {
          if (s.tileId == null) {
            filled = false;
            parts.push({ label: "▢", sub: "▢" });
            return;
          }
          const t = this.tileById(s.tileId);
          parts.push({ label: t.label, sub: tileSub(t) });
          if (t.kind === "var") hasVar = true;
          if (s.accept === "op") ops.push(t.value);
          else nums.push(t.value);
        });
        const value = filled ? evalSeq(nums, ops) : null;
        return { parts, value, filled, hasVar };
      };
      GameScene.prototype.refreshReadout = function () {
        const st = this.readState();
        const expr = st.parts.map((p) => p.label).join(" ");
        if (!st.filled) {
          this.readout.setColor("#c8a0e0");
          this.readout.setText(expr + "  = ?");
          // Announce the in-progress build to screen-reader users (WCAG: the
          // #ee-sr live region must actually be populated as tiles change).
          srSay(
            "Building: " +
              (expr.trim() ? expr : "empty") +
              ". Goal " +
              (this.problem ? this.problem.goal : "") +
              ".",
          );
          return;
        }
        const hit = st.value === this.problem.goal;
        this.readout.setColor(hit ? "#8fd6a0" : "#e0d0f0");
        const sub = st.hasVar ? "  →  " + st.parts.map((p) => p.sub).join(" ") : "";
        this.readout.setText(expr + sub + "  =  " + st.value);
        srSay(
          expr +
            " equals " +
            st.value +
            ". Goal " +
            this.problem.goal +
            ". " +
            (hit ? "Matches — lock it in." : ""),
        );
      };

      GameScene.prototype.showHint = function () {
        if (this.locked || !this.problem) return;
        const p = this.problem;
        const op = p.solution.find((t) => t.kind === "op");
        this.feedback
          .setText(
            "Hint: this build uses " +
              (op ? op.label : "+") +
              ". Place the values around the sign so it equals " +
              p.goal +
              ".",
          )
          .setColor("#e0c8ff")
          .setAlpha(1);
        srSay("Hint. This expression uses the " + (op ? op.label : "plus") + " sign.");
      };

      // ── Resolve a Lock In ────────────────────────────────────────────────
      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        const st = this.readState();
        if (!st.filled) {
          this.feedback
            .setText("Fill every slot first, then Lock In.")
            .setColor("#ffd24a")
            .setAlpha(1);
          SFX.reject();
          srSay("Fill every slot first.");
          return;
        }
        this.locked = true;
        this.attemptsAll++;
        const p = this.problem;
        const correct = st.value === p.goal;
        if (correct) {
          SFX.good();
          JUICE.audio.correct(this.streak);
          this.solved++;
          this.streak++;
          const bonus = Math.min(this.streak, 5) * 5;
          const gained = 20 + bonus;
          this.score += gained;
          this.slots.forEach((s) => s.rect.setStrokeStyle(3, 0x36a35b));
          JUICE.burst(this, W / 2, SLOT_Y, [0x34d399, 0xb06fd4, 0xffffff], 18);
          JUICE.shake(this, 0.004 + Math.min(this.streak, 5) * 0.001);
          JUICE.floatText(this, W / 2, SLOT_Y - 40, "+" + gained, "#34d399", 38);
          JUICE.award(gained, "u6-expression-express");
          if (this.streak >= 2) JUICE.confetti(this, 1);
          // Explain the STUDENT'S build (any valid ordering counts), not just
          // the generator's canonical one.
          const builtWhy = st.hasVar
            ? "x = " +
              p.varVal +
              ", so " +
              st.parts.map((q) => q.sub).join(" ") +
              " = " +
              st.value +
              "."
            : st.parts.map((q) => q.label).join(" ") + " = " + st.value + ".";
          this.feedback
            .setText("Correct!  " + builtWhy)
            .setColor("#8fd6a0")
            .setAlpha(1);
          srSay("Correct. " + builtWhy);
          this.afterAttempt();
        } else {
          SFX.bad();
          JUICE.audio.wrong();
          this.streak = 0;
          this.attempts++;
          this.flashAmber();
          JUICE.shake(this, 0.009);
          this.slots.forEach((s) => s.rect.setStrokeStyle(3, 0xc23b3b));
          this.updateHUD();
          if (this.attempts < 2) {
            // First miss: diagnostic hint + retry the SAME problem (no reveal,
            // no penalty). Tiles stay where the student put them so they can
            // adjust instead of starting over.
            const diag =
              st.value > p.goal
                ? "your build equals " +
                  st.value +
                  " — too high. Try a smaller number or a different sign."
                : "your build equals " +
                  st.value +
                  " — too low. Try a bigger number or a different sign.";
            const oo = st.parts.some((q) => q.label === "×")
              ? " Remember: × happens before + and −."
              : "";
            this.feedback
              .setText("Not quite — " + diag + oo + " Adjust a tile and lock in again!")
              .setColor("#ff8f8f")
              .setAlpha(1);
            srSay(
              "Not quite. Your build equals " +
                st.value +
                ", the target is " +
                p.goal +
                ". " +
                diag +
                " Try again.",
            );
            this.time.delayedCall(this.reduceMotion ? 400 : 700, () => {
              this.slots.forEach((s) => s.rect.setStrokeStyle(2, 0x6a4f8c));
              this.locked = false;
            });
            return;
          }
          // Second miss: teach — show why, reveal one correct assembly, move on.
          this.feedback
            .setText(
              "Your build equals " +
                st.value +
                ", but the target is " +
                p.goal +
                ". One correct build:  " +
                p.exprStr +
                " = " +
                p.goal,
            )
            .setColor("#ff8f8f")
            .setAlpha(1);
          srSay(
            "Not quite. Your build equals " +
              st.value +
              ". One correct build is " +
              p.exprStr +
              " equals " +
              p.goal +
              ". " +
              p.why,
          );
          this.showSolution();
          this.time.delayedCall(this.reduceMotion ? 600 : 1500, () => this.afterAttempt());
        }
      };

      // Teach: clear the student's tiles and reveal one correct assembly.
      GameScene.prototype.showSolution = function () {
        this.tiles.forEach((t) => t.container.setVisible(false));
        const p = this.problem;
        p.solution.forEach((s, i) => {
          const slot = this.slots[i];
          if (!slot) return;
          const w = s.kind === "op" ? OP_W : NUM_W;
          const g = this.add
            .rectangle(slot.x, slot.y, w, TILE_H, 0x2d6b46)
            .setStrokeStyle(3, 0x8fd6a0)
            .setDepth(12);
          const t = this.add
            .text(slot.x, slot.y, s.label, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: s.kind === "op" ? "30px" : "28px",
              fontStyle: "bold",
              color: "#eafff0",
            })
            .setOrigin(0.5)
            .setDepth(13);
          this.boardObjs.push(g, t);
          JUICE.popIn(this, g, i * 60);

      };

      GameScene.prototype.afterAttempt = function () {
        this.updateHUD();

          this.endGame();
          return;
        }
        this.time.delayedCall(this.reduceMotion ? 500 : 900, () => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.flashAmber = function () {
        if (this.reduceMotion) return;
        this.amberTint.setAlpha(0.18);
        this.tweens.add({ targets: this.amberTint, alpha: 0, duration: 350 });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.streakText.setText("Streak: " + this.streak);
        this.progressText.setText(this.solved + " / " + (this.endless ? "∞" : this.target));
      };

      GameScene.prototype.endGame = function () {
        this.locked = true;
        this.time.delayedCall(500, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            track: this.track,
            auto: this.auto,
            endless: this.endless,
            accuracy: this.attemptsAll ? this.solved / this.attemptsAll : 1,
          });
        });
      };

        // Adaptive: only record a run when the level was auto-picked.

          .text(cx, 185, "★".repeat(stars) + "☆".repeat(3 - stars), {

          .setOrigin(0.5);
        this.add

        try {

        const btn = this.add
          .rectangle(cx, 400, 220, 54, 0x7a3fb0)

          .text(cx, 400, "PLAY AGAIN 🔁", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",

        const again = () => {
          eeEndless = false;
          this.scene.start("Game");

        btn.on("pointerout", () => btn.setFillStyle(0x7a3fb0));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        const change = this.add
          .text(cx, 458, "Change level", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#c8a0e0",

          .setInteractive({ useHandCursor: true });

        change.on("pointerout", () => change.setColor("#c8a0e0"));
        change.on("pointerdown", () => this.scene.start("Level"));

        // ♾️ Keep Playing: restart the Game at the same level in endless mode

        const keepBtn = this.add
          .rectangle(cx, 520, 240, 48, 0x2563a8)

          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx, 520, "♾️ Keep Playing", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            fontStyle: "bold",
            color: "#ffffff",

        const keepPlaying = () => {

          eeEndless = true;
          eeAuto = d.auto;
          this.scene.start("Game");
        };
        keepBtn.on("pointerover", () => keepBtn.setFillStyle(0x2f74c2));
        keepBtn.on("pointerout", () => keepBtn.setFillStyle(0x2563a8));
        keepBtn.on("pointerdown", keepPlaying);
      };

      const eeGame = new Phaser.Game(config);

              </div>

                <button class="ewl-mastery-btn ewl-btn-secondary" onclick="location.reload()">🔄 Play Again</button>
                <button class="ewl-mastery-btn ewl-btn-primary" onclick="location.href='${nextUrl}'">🎮 More Games</button>
              </div>
            </div>
          </div>
        `;
        const existing = document.getElementById("ewl-mastery-modal");
        if (existing) existing.remove();
        document.body.insertAdjacentHTML("beforeend", modalHtml);
        
        if (window.GameFX && window.GameFX.AudioSynth) {
          try { window.GameFX.AudioSynth.playSuccess(); } catch(e){}
        }
        if (window.GameFX && window.GameFX.burst) {
          try { window.GameFX.burst(window.innerWidth / 2, window.innerHeight / 3); } catch(e){}
        }
      };
    })();
  </script>
  <!-- Shared Arcade FX Engine & Particles -->
  <canvas id="fx-canvas" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:9999;"></canvas>
  <script src="/math/games/shared/arcade-fx-engine.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const canvas = document.getElementById("fx-canvas");
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener("resize", () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        });
      }

      document.body.addEventListener("pointerdown", function(e) {
        if (window.ArcadeFX) {
          if (canvas) {
            window.ArcadeFX.spawnParticles(canvas, e.clientX, e.clientY, "#a855f7", 16);
          }
        }
      });
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.ArcadeFX) {
        window.ArcadeFX.renderControlBar("arcade-controls-host");
      }
      const canvas = document.getElementById("fx-canvas");
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener("resize", () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        });
      }

      document.body.addEventListener("click", function(e) {
        if (window.ArcadeFX) {
          if (e.target.closest(".btn, button, .bubble, .card, canvas")) {
            window.ArcadeFX.playSFX("click");
            if (canvas && (e.target.closest(".btn, button") || e.target.tagName === "BUTTON")) {
              window.ArcadeFX.spawnParticles(canvas, e.clientX, e.clientY, "#818cf8", 22);
            }
          }
        }
      });
    });
  </script>
  
  <script src="/assets/math-workbench-launcher.js" defer></script>
  <script src="/assets/formula-popup.js" defer></script>
