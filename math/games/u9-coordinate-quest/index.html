<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/math-mobile.css" />
    <title>
      Coordinate Quest — Integers &amp; Coordinate Plane Game | Neft Teacher
    </title>
    <meta
      name="description"
      content="A calm plot-it coordinate-plane game for Grade 6 (6.NS.6): read an ordered pair and place the point on the exact grid cell. Level 1 stays in Quadrant I; Level 2 adds all four quadrants and reflect-across-an-axis missions. No timer — wrong math costs a life and shows the correct spot to teach."
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #060f1c;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      canvas {
        display: block;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }
      canvas:focus-visible {
        outline: 3px solid #5ad1ff;
        outline-offset: 4px;
        border-radius: 8px;
      }
      canvas:focus:not(:focus-visible) {
        outline: none;
      }
      /* Decorative animated star-field behind the Phaser canvas. */
      #cq-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(
          130% 90% at 50% 0%,
          #122c4a 0%,
          #0a1a2e 55%,
          #050b15 100%
        );
      }
      #cq-bg-layer {
        position: absolute;
        inset: -6% -6%;
        will-change: transform;
        transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .cq-star {
        position: absolute;
        border-radius: 50%;
        background: #bfe0ff;
        opacity: 0.5;
        animation: cqTwinkle var(--tw, 3s) ease-in-out infinite;
      }
      @keyframes cqTwinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.8);
        }
        50% {
          opacity: 0.75;
          transform: scale(1.2);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #cq-bg-layer {
          transition: none !important;
          transform: none !important;
        }
        .cq-star {
          animation: none !important;
          opacity: 0.4 !important;
        }
      }
      #cq-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script src="/games/vendor/phaser/phaser-3.80.1.min.js"></script>
    <script>
      // CDN fallback: if the local vendor copy failed, synchronously load Phaser
      // from a mirror (document.write blocks parsing so the mirror is ready
      // before the game script runs).
      if (typeof Phaser === "undefined") {
        document.write(
          '<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\/script>',
        );
      }
      // If both sources are unreachable, show a clear message instead of a blank page.
      window.addEventListener("load", function () {
        if (typeof Phaser === "undefined") {
          document.body.innerHTML =
            '<div style="font:600 18px/1.5 system-ui,sans-serif;padding:2rem;max-width:32rem;margin:3rem auto;text-align:center;color:#bfe0ff">⚠️ This game needs an internet connection to load. Please check your connection and refresh the page.</div>';
        }
      });
    </script>

    <link rel="stylesheet" href="/shared/save-resume/save-resume-styles.css" />

</head>
  <body>
    <!-- Decorative animated star-field (behind the Phaser canvas). -->
    <div id="cq-bg" data-parallax aria-hidden="true">
      <div id="cq-bg-layer" data-parallax-layer></div>
    </div>
    <!-- Screen-reader live region mirrors the current question + result. -->
    <div id="cq-sr" role="status" aria-live="polite"></div>

    <script>
      // Decorative star-field builder + pointer parallax (gameplay-neutral).
      (function () {
        var layer = document.getElementById("cq-bg-layer");
        if (!layer) return;
        var reduce =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < 90; i++) {
          var s = document.createElement("div");
          s.className = "cq-star";
          var sz = 1 + Math.random() * 2.6;
          s.style.width = sz + "px";
          s.style.height = sz + "px";
          s.style.left = Math.random() * 100 + "%";
          s.style.top = Math.random() * 100 + "%";
          s.style.setProperty("--tw", 2 + Math.random() * 4 + "s");
          s.style.animationDelay = -Math.random() * 5 + "s";
          frag.appendChild(s);
        }
        layer.appendChild(frag);
        if (reduce) return;
        window.addEventListener(
          "pointermove",
          function (e) {
            var tx = (e.clientX / window.innerWidth - 0.5) * -26;
            var ty = (e.clientY / window.innerHeight - 0.5) * -18;
            layer.style.transform = "translate3d(" + tx + "px," + ty + "px,0)";
          },
          { passive: true },
        );
      })();
    </script>

    <script>
      // ════════════════════════════════════════════════════════════════════
      //  COORDINATE QUEST — STAR PLOTTER   ·   6.NS.6
      //  Math-as-mechanic, calm, no timer/reflex. The action IS the math: read
      //  an ordered pair, then MOVE a marker (click a cell, or arrow keys) and
      //  PLACE the star on the EXACT grid intersection. Lock In checks the exact
      //  cell. A wrong placement (wrong math, not slow hands) costs a life and
      //  the correct cell lights up so the miss teaches.
      //
      //  LEVEL SELECT drives the generator + scaffolding:
      //   • Level 1 (support)    — Quadrant I only (positive integers), axis
      //                            labels + gridlines + a per-problem hint and
      //                            marker guide-lines.
      //   • Level 2 (enrichment) — all four quadrants with negatives, plus
      //                            reflect-across-an-axis missions, fewer hints.
      // ════════════════════════════════════════════════════════════════════
      const W = 820,
        H = 600;
      const LS_KEY = "cq_star_plotter_highscore";

      // ── Grid geometry (game space; Scale.FIT maps pointer coords into it) ──
      const GRID_CX = 410, // horizontal centre of the grid
        GRID_TOP = 146, // top pixel of the grid box
        GRID_PX = 336; // pixel size of the square grid box
      const GRID_LEFT = GRID_CX - GRID_PX / 2; // 242
      const R1MAX = 8; // Level 1: Quadrant I, 0..8
      const R2MAX = 6; // Level 2: four quadrants, -6..6
      const WIN_TARGET = 10; // solve this many to win
      const START_LIVES = 3;

      const C = {
        bg: 0x0a1a2e,
        panel: 0x10263f,
        panelEdge: 0x244966,
        grid: 0x1d3a57,
        gridAxis: 0x6fb7e8,
        ink: "#eaf4ff",
        sub: "#9fc1de",
        accent: 0x5ad1ff,
        accentS: "#5ad1ff",
        good: 0x4fd18b,
        goodS: "#7ce6ab",
        bad: 0xff6b6b,
        gold: 0xffcd4d,
        goldS: "#ffcd4d",
        q1: 0x0e8a7d,
        q2: 0x1a6fb5,
        q3: 0xd4952a,
        q4: 0xc45a3c,
      };

      const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
      const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
      function shuffle(a) {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      const RM_QUERY =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)");
      const reducedMotion = () => !!(RM_QUERY && RM_QUERY.matches);
      // Real minus sign for negatives (matches the rest of the math UI).
      const fmt = (n) => (n < 0 ? "−" + Math.abs(n) : String(n));
      function srSay(msg) {
        const el = document.getElementById("cq-sr");
        if (el) el.textContent = msg;
      }
      function quadrantOf(x, y) {
        if (x > 0 && y > 0) return 1;
        if (x < 0 && y > 0) return 2;
        if (x < 0 && y < 0) return 3;
        return 4; // x>0, y<0
      }
      const ROMAN = ["", "I", "II", "III", "IV"];

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          tap() {},
          pop() {},
          correct() {},
          wrong() {},
          whoosh() {},
          fanfare() {},
          musicStart() {},
          musicStop() {},
        },
        theme: () => ({}),
        bgGradient() {},
        popIn() {},
        tilePop() {},
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      // ── Local SFX (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (
                window.AudioContext || window.webkitAudioContext
              )();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        move() {
          this.play("square", 880, 0.04, 0.06);
        },
        coin() {
          this.play("square", 1040, 0.05, 0.08);
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
        lose() {
          [400, 330, 260, 200].forEach((f, i) =>
            setTimeout(() => this.play("sawtooth", f, 0.3, 0.14), i * 170),
          );
        },
      };

      // ── Problem generator ────────────────────────────────────────────────
      // Every problem reduces to ONE action: place the marker on an exact cell.
      // Returns { kind, tx, ty, prompt, hint, why, given }.
      //   level 1 : "plot" only, Quadrant I, positive integers 1..8
      //   level 2 : "plot" across all four quadrants + reflect-across-an-axis
      function makeProblem(level) {
        if (level === 1) {
          const x = randInt(1, R1MAX),
            y = randInt(1, R1MAX);
          return {
            kind: "plot",
            tx: x,
            ty: y,
            given: null,
            prompt: "Plot the point  (" + x + ", " + y + ")",
            hint: "Start at 0. Go RIGHT " + x + ", then UP " + y + ". Lock In.",
            why:
              "(" +
              x +
              ", " +
              y +
              "): the x-coordinate " +
              x +
              " is how far RIGHT, the y-coordinate " +
              y +
              " is how far UP.",
          };
        }
        // ── Level 2 ──
        const r = Math.random();
        if (r < 0.4) {
          let x, y;
          do {
            x = randInt(-R2MAX, R2MAX);
          } while (x === 0);
          do {
            y = randInt(-R2MAX, R2MAX);
          } while (y === 0);
          return {
            kind: "plot",
            tx: x,
            ty: y,
            given: null,
            prompt: "Plot the point  (" + fmt(x) + ", " + fmt(y) + ")",
            hint: "",
            why:
              "(" +
              fmt(x) +
              ", " +
              fmt(y) +
              ") sits in Quadrant " +
              ROMAN[quadrantOf(x, y)] +
              ".",
          };
        }
        // Reflect across an axis. P is shown plotted; place its image.
        const acrossX = r < 0.7;
        let a, b;
        do {
          a = randInt(-R2MAX, R2MAX);
        } while (a === 0);
        do {
          b = randInt(-R2MAX, R2MAX);
        } while (b === 0);
        if (acrossX) {
          return {
            kind: "reflect",
            given: { x: a, y: b },
            tx: a,
            ty: -b,
            prompt:
              "Reflect P (" +
              fmt(a) +
              ", " +
              fmt(b) +
              ") across the x-axis. Place the image.",
            hint: "Mirror it over the x-axis: keep x the same, flip the sign of y.",
            why:
              "Across the x-axis: (" +
              fmt(a) +
              ", " +
              fmt(b) +
              ") → (" +
              fmt(a) +
              ", " +
              fmt(-b) +
              "). The x stays; the y flips sign.",
          };
        }
        return {
          kind: "reflect",
          given: { x: a, y: b },
          tx: -a,
          ty: b,
          prompt:
            "Reflect P (" +
            fmt(a) +
            ", " +
            fmt(b) +
            ") across the y-axis. Place the image.",
          hint: "Mirror it over the y-axis: keep y the same, flip the sign of x.",
          why:
            "Across the y-axis: (" +
            fmt(a) +
            ", " +
            fmt(b) +
            ") → (" +
            fmt(-a) +
            ", " +
            fmt(b) +
            "). The y stays; the x flips sign.",
        };
      }
      // Exposed for stress tests / quick console checks.
      window.CoordQuest = { makeProblem, quadrantOf };

      // ── Vocab gate content (term + Level-1 definition + image/emoji) ──
      // Shown BEFORE the first round so students meet the key words first.
      const VOCAB_TERMS = [
        {
          term: "Coordinate plane",
          emoji: "🗺️",
          def: "A grid made by two number lines that cross at zero. You use it to find and plot points.",
        },
        {
          term: "x-axis",
          emoji: "↔️",
          def: "The number line that goes ACROSS (left and right). The first number, x, is measured on it.",
        },
        {
          term: "y-axis",
          emoji: "↕️",
          def: "The number line that goes UP and DOWN. The second number, y, is measured on it.",
        },
        {
          term: "Ordered pair (x, y)",
          emoji: "📍",
          def: "Two numbers in parentheses. The first (x) is how far right or left; the second (y) is how far up or down.",
        },
        {
          term: "Quadrant",
          emoji: "🧭",
          def: "One of the 4 corners of the plane (I, II, III, IV). The signs of x and y tell you which corner.",
        },
      ];

      // Session flags: show the vocab gate once; remember the chosen level so a
      // replay can keep it (the player can still re-pick on the level screen).
      let vocabSeen = false;
      let lastLevel = 1;

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0xffcd4d);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, C.bg);
        this.add
          .text(cx, 118, "COORDINATE QUEST", {
            fontFamily: "Impact, sans-serif",
            fontSize: "60px",
            color: C.goldS,
            stroke: "#061018",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 172, "Star Plotter", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            color: C.accentS,
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            232,
            "Read the ordered pair, move your marker to the exact spot,\nthen LOCK IN to plant the star. Calm and self-paced — no timer.",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: C.ink,
              align: "center",
              lineSpacing: 5,
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 292, "Click a cell or use ← → ↑ ↓ · 6.NS.6 · Unit 9", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: C.sub,
          })
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 328, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              fontStyle: "bold",
              color: C.goldS,
            })
            .setOrigin(0.5);

        const btn = this.add
          .rectangle(cx, 400, 240, 58, 0x2f8f5a)
          .setStrokeStyle(3, 0xffffff, 0.8)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "START ▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.tweens.add({
          targets: [btn, btnT],
          scaleX: 1.05,
          scaleY: 1.05,
          duration: 800,
          yoyo: true,
          repeat: -1,
        });
        const start = () => {
          SFX.init();
          SFX.coin();
          JUICE.audio.unlock();
          // Show vocab before the first run; on a replay jump to level select.
          this.scene.start(vocabSeen ? "Level" : "Vocab");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x37a667));
        btn.on("pointerout", () => btn.setFillStyle(0x2f8f5a));
        btn.on("pointerdown", start);
        this.input.keyboard.on("keydown-SPACE", start);
        this.input.keyboard.on("keydown-ENTER", start);

        const hub = this.add
          .text(cx, 540, "← Back to Math Games", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: C.sub,
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        hub.on("pointerover", () => hub.setColor(C.goldS));
        hub.on("pointerout", () => hub.setColor(C.sub));
        hub.on("pointerdown", () => (window.location.href = "/math/games/"));
        srSay("Coordinate Quest Star Plotter. Press Start to play.");
      };

      // ── VOCAB GATE ──
      // Repo rule: term + Level-1 definition + image/emoji shown BEFORE play.
      function VocabScene() {
        Phaser.Scene.call(this, "Vocab");
      }
      VocabScene.prototype = Object.create(Phaser.Scene.prototype);
      VocabScene.prototype.constructor = VocabScene;
      VocabScene.prototype.init = function () {
        this.idx = 0;
      };
      VocabScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, C.bg);
        this.add
          .text(cx, 64, "WORDS TO KNOW FIRST", {
            fontFamily: "Impact, sans-serif",
            fontSize: "34px",
            color: C.goldS,
            stroke: "#061018",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        this.add
          .rectangle(cx, 318, 560, 320, C.panel)
          .setStrokeStyle(2, C.panelEdge);

        this.stepText = this.add
          .text(cx, 182, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            fontStyle: "bold",
            color: C.accentS,
          })
          .setOrigin(0.5);
        this.emojiText = this.add
          .text(cx, 248, "", { fontSize: "76px" })
          .setOrigin(0.5);
        this.termText = this.add
          .text(cx, 326, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "32px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.defText = this.add
          .text(cx, 398, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            color: C.ink,
            align: "center",
            wordWrap: { width: 500 },
            lineSpacing: 5,
          })
          .setOrigin(0.5);

        const nextBtn = this.add
          .rectangle(cx + 90, 508, 220, 52, 0x2f8f5a)
          .setStrokeStyle(2, 0xffffff, 0.7)
          .setInteractive({ useHandCursor: true });
        const nextT = this.add
          .text(cx + 90, 508, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        nextBtn.on("pointerover", () => nextBtn.setFillStyle(0x37a667));
        nextBtn.on("pointerout", () => nextBtn.setFillStyle(0x2f8f5a));
        nextBtn.on("pointerdown", () => this.advance());
        this.nextBtn = nextBtn;
        this.nextT = nextT;

        const backBtn = this.add
          .rectangle(cx - 120, 508, 130, 52, 0x1a3a48)
          .setInteractive({ useHandCursor: true });
        const backT = this.add
          .text(cx - 120, 508, "← Back", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            fontStyle: "bold",
            color: "#9fc6cf",
          })
          .setOrigin(0.5);
        backBtn.on("pointerover", () => backBtn.setFillStyle(0x244c5c));
        backBtn.on("pointerout", () => backBtn.setFillStyle(0x1a3a48));
        backBtn.on("pointerdown", () => this.goBack());
        this.backBtn = backBtn;

        this.input.keyboard.on("keydown-SPACE", () => this.advance());
        this.input.keyboard.on("keydown-ENTER", () => this.advance());
        this.input.keyboard.on("keydown-RIGHT", () => this.advance());
        this.input.keyboard.on("keydown-LEFT", () => this.goBack());

        this.renderCard();
      };
      VocabScene.prototype.renderCard = function () {
        const v = VOCAB_TERMS[this.idx];
        const last = this.idx === VOCAB_TERMS.length - 1;
        this.stepText.setText(
          "Key word " + (this.idx + 1) + " of " + VOCAB_TERMS.length,
        );
        this.emojiText.setText(v.emoji);
        this.termText.setText(v.term);
        this.defText.setText(v.def);
        this.nextT.setText(last ? "Choose a level ▶" : "Next →");
        const showBack = this.idx > 0;
        this.backBtn.setVisible(showBack);
        this.backT.setVisible(showBack);
        srSay(v.term + ". " + v.def);
      };
      VocabScene.prototype.advance = function () {
        if (this.idx < VOCAB_TERMS.length - 1) {
          this.idx++;
          this.renderCard();
        } else {
          vocabSeen = true;
          this.scene.start("Level");
        }

      VocabScene.prototype.goBack = function () {

      // ── GAME ──
      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function (data) {
        this.reduceMotion = reducedMotion();
        this.chosenLevel = (data && data.level) || 1;
        this.score = 0;
        this.lives = START_LIVES;
        this.streak = 0;
        this.solved = 0;
        this.target = WIN_TARGET;
        this.problem = null;
        this.locked = false;
        // Coordinate range + pixel step for the chosen level.
        if (this.chosenLevel === 1) {
          this.range = { xmin: 0, xmax: R1MAX, ymin: 0, ymax: R1MAX };
        } else {
          this.range = { xmin: -R2MAX, xmax: R2MAX, ymin: -R2MAX, ymax: R2MAX };
        }
        this.range.step = GRID_PX / (this.range.xmax - this.range.xmin);
        this.mx = 0; // current marker grid coords
        this.my = 0;
      };

      // Coord ↔ pixel helpers.
      GameScene.prototype.sx = function (gx) {
        return GRID_LEFT + (gx - this.range.xmin) * this.range.step;
      };
      GameScene.prototype.sy = function (gy) {
        return GRID_TOP + (this.range.ymax - gy) * this.range.step;
      };
      GameScene.prototype.pxToCoord = function (px, py) {
        const R = this.range;
        let gx = Math.round(R.xmin + (px - GRID_LEFT) / R.step);
        let gy = Math.round(R.ymax - (py - GRID_TOP) / R.step);
        gx = Phaser.Math.Clamp(gx, R.xmin, R.xmax);
        gy = Phaser.Math.Clamp(gy, R.ymin, R.ymax);
        return { gx, gy };
      };

      GameScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, C.bg);

        // ── HUD ──

          fontStyle: "bold",

          ...hudStyle,
          color: C.goodS,
        });
        this.livesText = this.add.text(16, 36, "❤❤❤", {
          ...hudStyle,

        });
        this.streakText = this.add
          .text(W - 16, 12, "Streak: 0", { ...hudStyle, color: C.goldS })
          .setOrigin(1, 0);
        this.levelText = this.add
          .text(W - 16, 36, "Level " + this.chosenLevel, {
            ...hudStyle,
            color: C.accentS,
          })
          .setOrigin(1, 0);
        this.progressText = this.add
          .text(cx, 12, "0 / " + this.target, { ...hudStyle, color: C.ink })
          .setOrigin(0.5, 0);

        // ── Problem banner ──
        this.bannerLabel = this.add
          .text(cx, 60, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: C.sub,
          })
          .setOrigin(0.5);
        this.bannerText = this.add
          .text(cx, 90, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#ffffff",
            align: "center",
            wordWrap: { width: W - 60 },
          })
          .setOrigin(0.5);
        this.readout = this.add
          .text(cx, 122, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            fontStyle: "bold",
            color: C.accentS,
          })
          .setOrigin(0.5);

        // ── Grid ──
        this.drawGrid();

        // Guide lines (Level-1 scaffold): marker → each axis.
        this.guideG = this.add.graphics().setDepth(8);

        // Given point P (reflect missions): a star marker + label, hidden by default.
        this.givenStar = this.add
          .star(0, 0, 5, 7, 15, C.accent)
          .setStrokeStyle(2, 0xffffff, 0.85)
          .setDepth(12)
          .setVisible(false);
        this.givenLabel = this.add
          .text(0, 0, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            fontStyle: "bold",
            color: C.accentS,
          })
          .setOrigin(0.5)
          .setDepth(12)
          .setVisible(false);

        // Ghost (shows the correct cell after a miss), hidden by default.
        this.ghost = this.add
          .circle(0, 0, 11, C.good, 0.4)
          .setStrokeStyle(2, C.good)
          .setDepth(11)
          .setVisible(false);

        // Marker (the star you place).
        this.markerRing = this.add
          .circle(0, 0, 13)
          .setStrokeStyle(3, C.gold)
          .setDepth(20);
        this.markerDot = this.add.circle(0, 0, 5, C.gold).setDepth(20);

        // ── Feedback line ──
        this.feedback = this.add
          .text(cx, 500, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            fontStyle: "bold",
            color: C.goldS,
            stroke: "#061018",
            strokeThickness: 3,
            align: "center",
            wordWrap: { width: W - 80 },
          })
          .setOrigin(0.5)
          .setAlpha(0);

        // ── Lock In button ──
        this.lockBtn = this.add
          .rectangle(cx, 538, 240, 46, 0x2f8f5a)
          .setStrokeStyle(3, 0xffffff, 0.8)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx, 538, "LOCK IN ✓", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "22px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.lockBtn.on("pointerover", () =>
          this.lockBtn.setFillStyle(0x37a667),
        );
        this.lockBtn.on("pointerout", () =>
          this.lockBtn.setFillStyle(0x2f8f5a),
        );
        this.lockBtn.on("pointerdown", () => this.lockIn());

        // ── Hint line ──
        this.hintText = this.add
          .text(cx, 576, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "13px",
            color: C.sub,
            align: "center",
          })
          .setOrigin(0.5);

        // ── Particles + red flash ──
        this.burst = this.add
          .particles(0, 0, "spark", {
            speed: { min: 80, max: 240 },
            angle: { min: 0, max: 360 },
            scale: { start: 1.2, end: 0 },
            lifespan: 600,
            emitting: false,
            quantity: 16,
            tint: [0xffcd4d, 0x4fd18b, 0xffffff],
          })
          .setDepth(30);
        this.redFlash = this.add
          .rectangle(cx, H / 2, W, H, 0xff3333, 0)
          .setDepth(40);

        // ── Input ──
        // Click a grid cell to place the marker (recoverable; Lock In confirms).
        this.input.on("pointerdown", (p) => {
          if (this.locked) return;
          if (
            p.x >= GRID_LEFT - 24 &&
            p.x <= GRID_LEFT + GRID_PX + 24 &&
            p.y >= GRID_TOP - 24 &&
            p.y <= GRID_TOP + GRID_PX + 24
          ) {
            const c = this.pxToCoord(p.x, p.y);
            this.setMarker(c.gx, c.gy);
            SFX.move();
          }
        });
        const nudge = (dx, dy) => {
          if (this.locked) return;
          this.setMarker(this.mx + dx, this.my + dy);
          SFX.move();
        };
        this.input.keyboard.on("keydown-LEFT", () => nudge(-1, 0));
        this.input.keyboard.on("keydown-RIGHT", () => nudge(1, 0));
        this.input.keyboard.on("keydown-UP", () => nudge(0, 1));
        this.input.keyboard.on("keydown-DOWN", () => nudge(0, -1));
        this.input.keyboard.on("keydown-A", () => nudge(-1, 0));
        this.input.keyboard.on("keydown-D", () => nudge(1, 0));
        this.input.keyboard.on("keydown-W", () => nudge(0, 1));
        this.input.keyboard.on("keydown-S", () => nudge(0, -1));
        this.input.keyboard.on("keydown-ENTER", () => this.lockIn());
        this.input.keyboard.on("keydown-SPACE", () => this.lockIn());

        this.events.once("shutdown", () => JUICE.audio.musicStop());
        JUICE.audio.musicStart();
        this.cameras.main.fadeIn(400);
        this.newProblem();
      };

      GameScene.prototype.drawGrid = function () {
        const R = this.range;
        const g = this.add.graphics().setDepth(2);
        // Quadrant tints (Level 2 identity; faint).
        if (this.chosenLevel === 2) {
          const ox = this.sx(0),
            oy = this.sy(0),
            l = this.sx(R.xmin),
            r = this.sx(R.xmax),
            t = this.sy(R.ymax),
            b = this.sy(R.ymin);
          g.fillStyle(C.q1, 0.1).fillRect(ox, t, r - ox, oy - t); // QI
          g.fillStyle(C.q2, 0.1).fillRect(l, t, ox - l, oy - t); // QII
          g.fillStyle(C.q3, 0.1).fillRect(l, oy, ox - l, b - oy); // QIII
          g.fillStyle(C.q4, 0.1).fillRect(ox, oy, r - ox, b - oy); // QIV
        }
        // Gridlines.
        g.lineStyle(1, C.grid, 0.9);
        for (let gx = R.xmin; gx <= R.xmax; gx++) {
          g.lineBetween(
            this.sx(gx),
            this.sy(R.ymax),
            this.sx(gx),
            this.sy(R.ymin),
          );
        }
        for (let gy = R.ymin; gy <= R.ymax; gy++) {
          g.lineBetween(
            this.sx(R.xmin),
            this.sy(gy),
            this.sx(R.xmax),
            this.sy(gy),
          );
        }
        // Axes (highlighted).
        g.lineStyle(3, C.gridAxis, 1);
        g.lineBetween(this.sx(R.xmin), this.sy(0), this.sx(R.xmax), this.sy(0));
        g.lineBetween(this.sx(0), this.sy(R.ymax), this.sx(0), this.sy(R.ymin));

        // Axis number labels (every unit for Level 1; every 2 for Level 2 to
        // avoid crowding, plus the endpoints).
        const stepLbl = this.chosenLevel === 1 ? 1 : 2;
        const lblStyle = {
          fontFamily: "Segoe UI, sans-serif",
          fontSize: "12px",
          color: C.sub,
        };
        for (let gx = R.xmin; gx <= R.xmax; gx++) {
          if (gx === 0) continue;
          if (gx % stepLbl !== 0 && gx !== R.xmin && gx !== R.xmax) continue;
          this.add
            .text(this.sx(gx), this.sy(0) + 8, fmt(gx), lblStyle)
            .setOrigin(0.5, 0)
            .setDepth(3);
        }
        for (let gy = R.ymin; gy <= R.ymax; gy++) {
          if (gy === 0) continue;
          if (gy % stepLbl !== 0 && gy !== R.ymin && gy !== R.ymax) continue;
          this.add
            .text(this.sx(0) - 8, this.sy(gy), fmt(gy), lblStyle)
            .setOrigin(1, 0.5)
            .setDepth(3);
        }
        // Origin label.
        this.add
          .text(this.sx(0) - 6, this.sy(0) + 6, "0", lblStyle)
          .setOrigin(1, 0)
          .setDepth(3);
        // Quadrant roman numerals (Level 2).
        if (this.chosenLevel === 2) {
          const qStyle = {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            fontStyle: "bold",
            color: "#ffffff",
          };
          const m = R.xmax;
          [
            [m - 1, m - 1, "I"],
            [-(m - 1), m - 1, "II"],
            [-(m - 1), -(m - 1), "III"],
            [m - 1, -(m - 1), "IV"],
          ].forEach(([gx, gy, t]) => {
            this.add
              .text(this.sx(gx), this.sy(gy), t, qStyle)
              .setOrigin(0.5)
              .setAlpha(0.45)
              .setDepth(3);
          });
        }
      };

      GameScene.prototype.setMarker = function (gx, gy) {
        const R = this.range;
        this.mx = Phaser.Math.Clamp(gx, R.xmin, R.xmax);
        this.my = Phaser.Math.Clamp(gy, R.ymin, R.ymax);
        const px = this.sx(this.mx),
          py = this.sy(this.my);
        this.markerRing.setPosition(px, py);
        this.markerDot.setPosition(px, py);
        this.readout.setText(
          "Marker:  (" + fmt(this.mx) + ", " + fmt(this.my) + ")",
        );
        this.drawGuides();
      };

      GameScene.prototype.drawGuides = function () {
        this.guideG.clear();
        if (this.chosenLevel !== 1) return; // guides are a Level-1 scaffold
        const px = this.sx(this.mx),
          py = this.sy(this.my),
          ax = this.sx(0),
          ay = this.sy(0);
        this.guideG.lineStyle(2, C.gold, 0.45);
        this.guideG.lineBetween(px, ay, px, py); // vertical to x-axis
        this.guideG.lineBetween(ax, py, px, py); // horizontal to y-axis
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.missedOnce = false; // one free retry before a miss costs a life
        this.problem = makeProblem(this.chosenLevel);
        const p = this.problem;
        this.bannerLabel.setText(
          p.kind === "reflect" ? "Reflect" : "Plot a point",
        );
        this.bannerText.setText(p.prompt);
        this.ghost.setVisible(false);
        this.markerRing.setStrokeStyle(3, C.gold);
        this.markerDot.setFillStyle(C.gold);

        // Show / hide the given point P for reflect missions.
        if (p.given) {
          const gx = this.sx(p.given.x),
            gy = this.sy(p.given.y);
          this.givenStar.setPosition(gx, gy).setVisible(true);
          this.givenLabel
            .setText("P (" + fmt(p.given.x) + ", " + fmt(p.given.y) + ")")
            .setPosition(gx, gy - 22)
            .setVisible(true);
        } else {
          this.givenStar.setVisible(false);
          this.givenLabel.setVisible(false);
        }

        // Hint line: Level 1 always shows it; Level 2 keeps it minimal.
        if (this.chosenLevel === 1) {
          this.hintText.setText(p.hint);
        } else {
          this.hintText.setText(
            "Click a cell or use the arrow keys, then Lock In.",
          );
        }

        // Reset marker to the origin each round.
        this.setMarker(0, 0);
        srSay(
          p.prompt +
            ". Move your marker to the spot, then lock it in. " +
            (this.chosenLevel === 1 ? p.hint : ""),
        );
      };

      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        this.locked = true;
        const p = this.problem;
        const correct = this.mx === p.tx && this.my === p.ty;
        if (correct) {
          SFX.good();
          JUICE.audio.correct(this.streak);
          this.solved++;
          this.streak++;
          const bonus = Math.min(this.streak, 5) * 5;
          const gained = 20 + bonus;
          this.score += gained;
          this.markerRing.setStrokeStyle(3, C.good);
          this.markerDot.setFillStyle(C.good);
          const px = this.sx(this.mx),
            py = this.sy(this.my);
          this.burst.setPosition(px, py);
          this.burst.explode(16);
          JUICE.burst(this, px, py, [0x4fd18b, 0x5ad1ff, 0xffffff], 16);
          JUICE.shake(this, 0.004 + Math.min(this.streak, 5) * 0.001);
          JUICE.floatText(this, px, py - 28, "+" + gained, C.goodS, 30);
          const xp = 8 + Math.min(this.streak, 5) * 2;
          JUICE.award(xp, "u9-coordinate-quest");
          if (this.streak >= 2) JUICE.confetti(this, 1);
          this.feedback.setText("Correct! " + p.why).setAlpha(1);
          srSay("Correct. " + p.why);
          this.afterAttempt();
        } else if (!this.missedOnce) {
          // First miss on this problem: give a calm retry — no life lost, the
          // answer is NOT revealed, so the student can rethink and try again.
          this.missedOnce = true;
          this.locked = false;
          this.streak = 0;
          SFX.bad();
          JUICE.audio.wrong();
          JUICE.shake(this, 0.006);
          const tip =
            p.hint ||
            "Check the sign and size of each coordinate, then Lock In.";
          this.feedback.setText("Not quite — try again. " + tip).setAlpha(1);
          this.updateHUD();
          srSay("Not quite. Try again. " + tip);
        } else {
          SFX.bad();
          JUICE.audio.wrong();
          JUICE.shake(this, 0.009);
          this.streak = 0;
          this.lives--;
          this.flashRed();
          this.markerRing.setStrokeStyle(3, C.bad);
          this.markerDot.setFillStyle(C.bad);
          this.feedback.setText("Not quite — " + p.why).setAlpha(1);
          JUICE.floatText(this, W - 44, 30, "−1 ❤", "#ff8f8f", 22);
          srSay("Not quite. " + p.why);
          // Teach: light up the correct cell, glide the marker to it, continue.
          const tx = this.sx(p.tx),
            ty = this.sy(p.ty);
          this.ghost.setPosition(tx, ty).setVisible(true);
          this.tweens.add({
            targets: [this.markerRing, this.markerDot],
            x: tx,
            y: ty,
            duration: this.reduceMotion ? 0 : 600,
            onComplete: () => {
              this.guideG.clear();
              this.afterAttempt();
            },
          });
        }
      };

      GameScene.prototype.afterAttempt = function () {
        this.updateHUD();
        if (this.lives <= 0) {
          // No-fail practice: refill hearts and keep going. Mistakes teach;
          // they never end the game (calm, self-paced classroom mode).
          this.lives = 3;
          this.updateHUD();
        }
        if (this.solved >= this.target) {
          this.endGame(true);
          return;
        }
        this.time.delayedCall(950, () => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.flashRed = function () {
        if (this.reduceMotion) return;
        this.redFlash.setAlpha(0.35);
        this.tweens.add({ targets: this.redFlash, alpha: 0, duration: 350 });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.livesText.setText(this.lives > 0 ? "❤".repeat(this.lives) : "—");
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText("Level " + this.chosenLevel);
        this.progressText.setText(this.solved + " / " + this.target);
      };

      GameScene.prototype.endGame = function (won) {
        this.locked = true;
        if (won) {
          JUICE.confetti(this, 2);
          JUICE.award(40, "u9-coordinate-quest-complete");
        }
        this.time.delayedCall(500, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            level: this.chosenLevel,
            won: won,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, C.bg);

        const stars =
          d.solved >= d.target ? 3 : d.solved >= d.target * 0.6 ? 2 : 1;

        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        if (d.score > hs) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }

        this.add
          .text(cx, 108, d.won ? "QUEST COMPLETE!" : "OUT OF LIVES", {
            fontFamily: "Impact, sans-serif",
            fontSize: "48px",
            color: d.won ? C.goodS : "#ff8f8f",
            stroke: "#061018",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        this.add
          .text(cx, 182, "★".repeat(stars) + "☆".repeat(3 - stars), {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "48px",
            color: C.goldS,
          })
          .setOrigin(0.5);

        this.add
          .text(cx, 252, "Score: " + d.score, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "30px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            292,
            "Plotted " +
              d.solved +
              " of " +
              d.target +
              " points · Level " +
              d.level,
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "18px",
              color: C.ink,
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 322, "High Score: " + hs, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: C.goldS,
          })
          .setOrigin(0.5);

        if (d.won) SFX.win();
        else SFX.lose();
        if (d.won) JUICE.audio.fanfare();

        // EduPulse reporting (guarded; safe no-op without bridge).
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.score,
              stars: stars,
              standard: "6.NS.6",
              problemsAttempted: d.solved,
            });
        } catch (e) {}
        srSay(
          (d.won ? "Quest complete! " : "Game over. ") +
            "Final score " +
            d.score +
            ", " +
            stars +
            " stars.",
        );

        const btn = this.add
          .rectangle(cx, 398, 240, 54, 0x2f8f5a)
          .setStrokeStyle(3, 0xffffff, 0.8)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx, 398, "PLAY AGAIN 🔁", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const again = () => this.scene.start("Level");
        btn.on("pointerover", () => btn.setFillStyle(0x37a667));
        btn.on("pointerout", () => btn.setFillStyle(0x2f8f5a));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        const hub = this.add
          .text(cx, 478, "← Back to Math Games", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: C.sub,
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        hub.on("pointerover", () => hub.setColor(C.goldS));
        hub.on("pointerout", () => hub.setColor(C.sub));
        hub.on("pointerdown", () => (window.location.href = "/math/games/"));
      };

      // ── Launch ──
      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0a1a2e",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [
          BootScene,
          TitleScene,
          VocabScene,
          LevelScene,
          GameScene,
          ResultScene,
        ],
      };
      const cqGame = new Phaser.Game(config);

      // ── Canvas accessibility (additive; no gameplay change) ──
      cqGame.events.once("ready", function () {
        try {
          const cv = cqGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Coordinate Quest Star Plotter math game. Read the ordered pair, " +
              "then click a grid cell or use the arrow keys to move your marker " +
              "to the exact spot, and press Lock In, Enter, or Space to place " +
              "the star.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>
    <script src="/assets/nt-page-enhance.js" defer></script>
    <script src="/assets/edupulse-config.js"></script>
    <script src="/assets/edupulse-bridge.js"></script>
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
    <script src="/shared/save-resume/save-resume-engine.js" defer></script>
    <!-- nsr-injected:end -->
    <!-- gfx-injected:begin (shared game polish — tools/inject-game-fx.js) -->
    <script src="/assets/game-fx.js" defer></script>
    <!-- gfx-injected:end -->
    <!-- mwb-injected:begin (Math Workbench launcher — tools/inject-math-workbench.js) -->
    <script src="/assets/math-workbench-launcher.js" defer></script>
    <!-- mwb-injected:end -->
    <!-- Student Passport (meta-progression pill; boots itself, award() guarded) -->
    <script src="/assets/lesson-passport.js" defer></script>

  <script src="/assets/game-access.js" defer></script>

  <script>
      window.addEventListener('DOMContentLoaded', function () {
        if (window.NeftHintLadder) window.NeftHintLadder.watch({
          sourceSelector: "#cq-sr",

          staticHints: ["Which number is the x (across) and which is the y (up/down)? Check the signs too.","Move along the x-axis first, then up or down for y; negatives go left/down.","Set it up: find the tick mark for each coordinate, then place the point yourself."]
        });
