    <!-- Decorative animated star-field (behind the Phaser canvas). -->

      <div id="cq-bg-layer" data-parallax-layer></div>

    <script>
      // Decorative star-field builder + pointer parallax (gameplay-neutral).
      (function () {
        var layer = document.getElementById("cq-bg-layer");
        if (!layer) return;
        var reduce =
          window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < 90; i++) {
          var s = document.createElement("div");
          s.className = "cq-star";
          var sz = 1 + Math.random() * 2.6;
          s.style.width = sz + "px";
          s.style.height = sz + "px";
          s.style.left = Math.random() * 100 + "%";
          s.style.top = Math.random() * 100 + "%";
          s.style.setProperty("--tw", 2 + Math.random() * 4 + "s");
          s.style.animationDelay = -Math.random() * 5 + "s";
          frag.appendChild(s);
        }
        layer.appendChild(frag);
        if (reduce) return;
        window.addEventListener(
          "pointermove",
          function (e) {
            var tx = (e.clientX / window.innerWidth - 0.5) * -26;
            var ty = (e.clientY / window.innerHeight - 0.5) * -18;
            layer.style.transform = "translate3d(" + tx + "px," + ty + "px,0)";
          },
          { passive: true },
        );
      })();
    </script>

    <script>
      // ════════════════════════════════════════════════════════════════════
      //  COORDINATE QUEST — STAR PLOTTER   ·   6.NOS.6 / 6.NOS.9
      //  Math-as-mechanic, calm, no timer/reflex. The action IS the math: read
      //  an ordered pair, then MOVE a marker (click a cell, or arrow keys) and
      //  PLACE the star on the EXACT grid intersection. Lock In checks the exact
      //  cell. Misses never end the game — after a calm retry the correct cell
      //  lights up so the miss teaches (no-fail practice).
      //
      //  LEVEL SELECT drives the generator + scaffolding:
      //   • Level 1 (support)    — Quadrant I only (positive integers), axis
      //                            labels + gridlines + a per-problem hint and
      //                            marker guide-lines.
      //   • Level 2 (enrichment) — all four quadrants with negatives, plus:
      //                            · reflect across an axis (6.NOS.6)
      //                            · DISTANCE missions (6.NOS.9): plot the 2nd
      //                              point, then answer |a − b| by counting the
      //                              highlighted unit steps (choice buttons).
      //                            · RECTANGLE missions (6.NOS.9): plot the 4th
      //                              vertex, then give one side length.
      // ════════════════════════════════════════════════════════════════════
      const W = 820,
        H = 600;
      const LS_KEY = "cq_star_plotter_highscore";

      // ── Grid geometry (game space; Scale.FIT maps pointer coords into it) ──
      const GRID_CX = 410, // horizontal centre of the grid
        GRID_TOP = 146, // top pixel of the grid box
        GRID_PX = 336; // pixel size of the square grid box
      const GRID_LEFT = GRID_CX - GRID_PX / 2; // 242
      const R1MAX = 8; // Level 1: Quadrant I, 0..8
      const R2MAX = 6; // Level 2: four quadrants, -6..6
      const WIN_TARGET = 10; // every run is 10 rounds; misses never end it
      // Points shrink as help is used: unaided first try earns the most.
      const HELP_POINTS = [20, 12, 6, 0];

      const C = {
        bg: 0x0a1a2e,
        panel: 0x10263f,
        panelEdge: 0x244966,
        grid: 0x1d3a57,
        gridAxis: 0x6fb7e8,
        ink: "#eaf4ff",
        sub: "#9fc1de",
        accent: 0x5ad1ff,
        accentS: "#5ad1ff",
        good: 0x4fd18b,
        goodS: "#7ce6ab",
        bad: 0xff6b6b,
        gold: 0xffcd4d,
        goldS: "#ffcd4d",
        q1: 0x0e8a7d,
        q2: 0x1a6fb5,
        q3: 0xd4952a,
        q4: 0xc45a3c,
      };

      const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
      const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
      function shuffle(a) {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      const RM_QUERY = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
      // Calm motion = the OS setting OR the studio "Calm motion" toggle.
      const reducedMotion = () =>
        !!(
          (RM_QUERY && RM_QUERY.matches) ||
          (window.GameStudio && window.GameStudio.settings.reducedMotion)
        );
      // Real minus sign for negatives (matches the rest of the math UI).
      const fmt = (n) => (n < 0 ? "−" + Math.abs(n) : String(n));
      // Parenthesized negatives for |a − b| style strings: |3 − (−4)|.
      const fmtP = (n) => (n < 0 ? "(" + fmt(n) + ")" : fmt(n));
      function srSay(msg) {
        const el = document.getElementById("cq-sr");
        if (el) el.textContent = msg;
      }
      function quadrantOf(x, y) {
        if (x > 0 && y > 0) return 1;
        if (x < 0 && y > 0) return 2;
        if (x < 0 && y < 0) return 3;
        return 4; // x>0, y<0
      }
      const ROMAN = ["", "I", "II", "III", "IV"];

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          tap() {},
          pop() {},
          correct() {},
          wrong() {},
          whoosh() {},
          fanfare() {},
          musicStart() {},
          musicStop() {},
        },
        theme: () => ({}),
        bgGradient() {},
        popIn() {},
        tilePop() {},
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      // ── Local SFX (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx || window.NT_MUTED) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        move() {
          this.play("square", 880, 0.04, 0.06);
        },
        coin() {
          this.play("square", 1040, 0.05, 0.08);
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
      };

      // ── Problem generator ────────────────────────────────────────────────
      // Every problem reduces to ONE action: place the marker on an exact cell.
      // Returns { kind, tx, ty, prompt, hint, why, given }.
      //   level 1 : "plot" only, Quadrant I, positive integers 1..8
      //   level 2 : "plot" across all four quadrants + reflect-across-an-axis
      function makeProblem(level) {
        if (level === 1) {
          const x = randInt(1, R1MAX),
            y = randInt(1, R1MAX);
          return {
            kind: "plot",
            tx: x,
            ty: y,
            given: null,
            prompt: "Plot the point  (" + x + ", " + y + ")",
            hint: "Start at 0. Go RIGHT " + x + ", then UP " + y + ". Lock In.",
            why:
              "(" +
              x +
              ", " +
              y +
              "): the x-coordinate " +
              x +
              " is how far RIGHT, the y-coordinate " +
              y +
              " is how far UP.",
          };
        }
        // ── Level 2: plot · reflect · distance (6.NOS.9) · rectangle (6.NOS.9) ──
        const r = Math.random();
        if (r < 0.28) return makePlotProblem();
        if (r < 0.52) return makeReflectProblem();
        if (r < 0.78) return makeDistanceProblem();
        return makePolygonProblem();
      }

      function makePlotProblem() {
        let x, y;
        do {
          x = randInt(-R2MAX, R2MAX);
        } while (x === 0);
        do {
          y = randInt(-R2MAX, R2MAX);
        } while (y === 0);
        return {
          kind: "plot",
          tx: x,
          ty: y,
          given: null,
          prompt: "Plot the point  (" + fmt(x) + ", " + fmt(y) + ")",
          hint: "",
          why: "(" + fmt(x) + ", " + fmt(y) + ") sits in Quadrant " + ROMAN[quadrantOf(x, y)] + ".",
        };
      }

      // Reflect across an axis. P is shown plotted; place its image.
      function makeReflectProblem() {
        const acrossX = Math.random() < 0.5;
        let a, b;
        do {
          a = randInt(-R2MAX, R2MAX);
        } while (a === 0);
        do {
          b = randInt(-R2MAX, R2MAX);
        } while (b === 0);
        if (acrossX) {
          return {
            kind: "reflect",
            given: { x: a, y: b },
            tx: a,
            ty: -b,
            prompt:
              "Reflect P (" + fmt(a) + ", " + fmt(b) + ") across the x-axis. Place the image.",
            hint: "Mirror it over the x-axis: keep x the same, flip the sign of y.",
            why:
              "Across the x-axis: (" +
              fmt(a) +
              ", " +
              fmt(b) +
              ") → (" +
              fmt(a) +
              ", " +
              fmt(-b) +
              "). The x stays; the y flips sign.",
          };
        }
        return {
          kind: "reflect",
          given: { x: a, y: b },
          tx: -a,
          ty: b,
          prompt: "Reflect P (" + fmt(a) + ", " + fmt(b) + ") across the y-axis. Place the image.",
          hint: "Mirror it over the y-axis: keep y the same, flip the sign of x.",
          why:
            "Across the y-axis: (" +
            fmt(a) +
            ", " +
            fmt(b) +
            ") → (" +
            fmt(-a) +
            ", " +
            fmt(b) +
            "). The y stays; the x flips sign.",
        };
      }

      // Four choices for a length question. Always includes the correct count;
      // distractors mirror common errors (off-by-one, subtracting the absolute
      // values on a cross-zero pair). `extra` seeds one more distractor.
      function distanceChoices(d, a, b, extra) {
        const set = [d];
        [extra, Math.abs(Math.abs(a) - Math.abs(b)), d - 1, d + 1, d + 2, d - 2, d + 3].forEach(
          (v) => {
            if (typeof v === "number" && set.length < 4 && v >= 1 && set.indexOf(v) === -1)
              set.push(v);
          },
        );
        return shuffle(set);
      }

      // 6.NOS.9 — two points share an x or a y coordinate. Part 1: plot the
      // second point. Part 2: give the distance between them (|a − b|; across
      // zero, add the two distances to the axis, e.g. (−3, 2)→(4, 2) is 7).
      function makeDistanceProblem() {
        const horizontal = Math.random() < 0.5;
        let a, b, c;
        do {
          a = randInt(-R2MAX, R2MAX);
        } while (a === 0);
        do {
          b = randInt(-R2MAX, R2MAX);
        } while (b === 0 || b === a);
        do {
          c = randInt(-R2MAX, R2MAX);
        } while (c === 0);
        const d = Math.abs(a - b);
        const crossPart =
          a * b < 0
            ? " A and B are on opposite sides of the axis, so add the two parts: " +
              Math.abs(a) +
              " + " +
              Math.abs(b) +
              " = " +
              d +
              "."
            : "";
        const A = horizontal ? { x: a, y: c } : { x: c, y: a };
        const B = horizontal ? { x: b, y: c } : { x: c, y: b };
        return {
          kind: "distance",
          given: A,
          tx: B.x,
          ty: B.y,
          prompt:
            "Point A (" +
            fmt(A.x) +
            ", " +
            fmt(A.y) +
            ") is shown. Plot point B (" +
            fmt(B.x) +
            ", " +
            fmt(B.y) +
            ").",
          hint: horizontal
            ? "A and B share the same y-coordinate (" +
              fmt(c) +
              "), so B is straight LEFT or RIGHT of A."
            : "A and B share the same x-coordinate (" +
              fmt(c) +
              "), so B is straight UP or DOWN from A.",
          why:
            "B sits at (" +
            fmt(B.x) +
            ", " +
            fmt(B.y) +
            "), on the same " +
            (horizontal ? "horizontal" : "vertical") +
            " line as A.",
          segment: { x1: A.x, y1: A.y, x2: B.x, y2: B.y },
          answer: {
            question: "How many units apart are A and B?",
            correct: d,
            choices: distanceChoices(d, a, b, null),
            why: "Distance = |" + fmt(a) + " − " + fmtP(b) + "| = " + d + " units." + crossPart,
          },
        };
      }

      // 6.NOS.9 — three vertices of a rectangle are shown. Part 1: plot the 4th
      // vertex. Part 2: give the length of the side along the new vertex
      // (whole-number coordinates inside the Level-2 grid).
      function makePolygonProblem() {
        const wd = randInt(2, 8);
        const ht = randInt(2, 8);
        const x1 = randInt(-R2MAX, R2MAX - wd),
          x2 = x1 + wd;
        const y1 = randInt(-R2MAX, R2MAX - ht),
          y2 = y1 + ht;
        const corners = [
          { x: x1, y: y1 },
          { x: x2, y: y1 },
          { x: x2, y: y2 },
          { x: x1, y: y2 },
        ];
        const missIdx = randInt(0, 3);
        const miss = corners[missIdx];
        const givens = corners.filter((c, i) => i !== missIdx);
        const otherX = miss.x === x1 ? x2 : x1;
        return {
          kind: "polygon",
          givens: givens,
          tx: miss.x,
          ty: miss.y,
          prompt: "Three corners of a rectangle are shown. Plot the missing corner.",
          hint: "The missing corner shares its x with one shown corner and its y with another.",
          why:
            "The missing corner is (" +
            fmt(miss.x) +
            ", " +
            fmt(miss.y) +
            ") — it lines up with the other corners.",
          segment: { x1: miss.x, y1: miss.y, x2: otherX, y2: miss.y },
          outline: { x1: x1, y1: y1, x2: x2, y2: y2 },
          answer: {
            question:
              "How long is the side from (" +
              fmt(miss.x) +
              ", " +
              fmt(miss.y) +
              ") to (" +
              fmt(otherX) +
              ", " +
              fmt(miss.y) +
              ")?",
            correct: wd,
            choices: distanceChoices(wd, miss.x, otherX, ht !== wd ? ht : null),
            why:
              "|" +
              fmt(miss.x) +
              " − " +
              fmtP(otherX) +
              "| = " +
              wd +
              " units — count the grid steps along that side.",
          },
        };
      }
      // Exposed for stress tests / quick console checks.
      window.CoordQuest = {
        makeProblem,
        quadrantOf,
        makeDistanceProblem,
        makePolygonProblem,
      };

      // ── Vocab gate content (term + Level-1 definition + image/emoji) ──
      // Shown BEFORE the first round so students meet the key words first.
      const VOCAB_TERMS = [
        {
          term: "Coordinate plane",
          emoji: "🗺️",
          def: "A grid made by two number lines that cross at zero. You use it to find and plot points.",
        },
        {
          term: "x-axis",
          emoji: "↔️",
          def: "The number line that goes ACROSS (left and right). The first number, x, is measured on it.",
        },
        {
          term: "y-axis",
          emoji: "↕️",
          def: "The number line that goes UP and DOWN. The second number, y, is measured on it.",
        },
        {
          term: "Ordered pair (x, y)",
          emoji: "📍",
          def: "Two numbers in parentheses. The first (x) is how far right or left; the second (y) is how far up or down.",
        },
        {
          term: "Quadrant",
          emoji: "🧭",
          def: "One of the 4 corners of the plane (I, II, III, IV). The signs of x and y tell you which corner.",
        },
      ];

      // Session flags: show the vocab gate once; remember the chosen level so a
      // replay can keep it (the player can still re-pick on the level screen).
      let vocabSeen = false;
      let lastLevel = 1;

      // ── BOOT ──
      function BootScene() {

      GameScene.prototype.init = function (data) {
        this.reduceMotion = reducedMotion();
        this.chosenLevel = (data && data.level) || 1;
        this.autoMode = !!(data && data.auto);
        this.attempts = 0;
        this.endless = !!(data && data.endless);
        this.score = 0;
        this.streak = 0;
        this.solved = 0;
        this.target = this.endless ? Infinity : WIN_TARGET;
        this.problem = null;
        this.locked = false;
        this.round = 0; // rounds finished (solved or shown)
        this.firstTry = 0;
        this.hintsUsed = 0;
        this.misses = 0; // wrong Lock Ins on THIS round (drives the hint tiers)
        this.tally = {}; // problem kind -> { seen, firstTry }
        this.nextMode = false;
        this.phase = "plot"; // "plot" (place the marker) or "answer" (choices)
        // Coordinate range + pixel step for the chosen level.
        if (this.chosenLevel === 1) {
          this.range = { xmin: 0, xmax: R1MAX, ymin: 0, ymax: R1MAX };
        } else {
          this.range = { xmin: -R2MAX, xmax: R2MAX, ymin: -R2MAX, ymax: R2MAX };
        }
        this.range.step = GRID_PX / (this.range.xmax - this.range.xmin);
        this.mx = 0; // current marker grid coords
        this.my = 0;
      };

      // Coord ↔ pixel helpers.
      GameScene.prototype.sx = function (gx) {
        return GRID_LEFT + (gx - this.range.xmin) * this.range.step;
      };
      GameScene.prototype.sy = function (gy) {
        return GRID_TOP + (this.range.ymax - gy) * this.range.step;
      };
      GameScene.prototype.pxToCoord = function (px, py) {
        const R = this.range;
        let gx = Math.round(R.xmin + (px - GRID_LEFT) / R.step);
        let gy = Math.round(R.ymax - (py - GRID_TOP) / R.step);
        gx = Phaser.Math.Clamp(gx, R.xmin, R.xmax);
        gy = Phaser.Math.Clamp(gy, R.ymin, R.ymax);
        return { gx, gy };
      };

        this.hintText = this.add

      GameScene.prototype.drawGrid = function () {
        const R = this.range;
        const g = this.add.graphics().setDepth(2);
        // Quadrant tints (Level 2 identity; faint).
        if (this.chosenLevel === 2) {
          const ox = this.sx(0),
            oy = this.sy(0),
            l = this.sx(R.xmin),
            r = this.sx(R.xmax),
            t = this.sy(R.ymax),
            b = this.sy(R.ymin);
          g.fillStyle(C.q1, 0.1).fillRect(ox, t, r - ox, oy - t); // QI
          g.fillStyle(C.q2, 0.1).fillRect(l, t, ox - l, oy - t); // QII
          g.fillStyle(C.q3, 0.1).fillRect(l, oy, ox - l, b - oy); // QIII
          g.fillStyle(C.q4, 0.1).fillRect(ox, oy, r - ox, b - oy); // QIV
        }
        // Gridlines.
        g.lineStyle(1, C.grid, 0.9);
        for (let gx = R.xmin; gx <= R.xmax; gx++) {
          g.lineBetween(this.sx(gx), this.sy(R.ymax), this.sx(gx), this.sy(R.ymin));
        }
        for (let gy = R.ymin; gy <= R.ymax; gy++) {
          g.lineBetween(this.sx(R.xmin), this.sy(gy), this.sx(R.xmax), this.sy(gy));
        }
        // Axes (highlighted).
        g.lineStyle(3, C.gridAxis, 1);
        g.lineBetween(this.sx(R.xmin), this.sy(0), this.sx(R.xmax), this.sy(0));
        g.lineBetween(this.sx(0), this.sy(R.ymax), this.sx(0), this.sy(R.ymin));

        // Axis number labels (every unit for Level 1; every 2 for Level 2 to
        // avoid crowding, plus the endpoints).
        const stepLbl = this.chosenLevel === 1 ? 1 : 2;
        const lblStyle = {
          fontFamily: "Segoe UI, sans-serif",
          fontSize: "14px",
          fontStyle: "bold",
          color: C.sub,
        };
        for (let gx = R.xmin; gx <= R.xmax; gx++) {
          if (gx === 0) continue;
          if (gx % stepLbl !== 0 && gx !== R.xmin && gx !== R.xmax) continue;
          this.add
            .text(this.sx(gx), this.sy(0) + 8, fmt(gx), lblStyle)
            .setOrigin(0.5, 0)
            .setDepth(3);
        }
        for (let gy = R.ymin; gy <= R.ymax; gy++) {
          if (gy === 0) continue;
          if (gy % stepLbl !== 0 && gy !== R.ymin && gy !== R.ymax) continue;
          this.add
            .text(this.sx(0) - 8, this.sy(gy), fmt(gy), lblStyle)
            .setOrigin(1, 0.5)
            .setDepth(3);
        }
        // Origin label.
        this.add
          .text(this.sx(0) - 6, this.sy(0) + 6, "0", lblStyle)
          .setOrigin(1, 0)
          .setDepth(3);
        // Quadrant roman numerals (Level 2).
        if (this.chosenLevel === 2) {
          const qStyle = {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            fontStyle: "bold",
            color: "#ffffff",
          };
          const m = R.xmax;
          [
            [m - 1, m - 1, "I"],
            [-(m - 1), m - 1, "II"],
            [-(m - 1), -(m - 1), "III"],
            [m - 1, -(m - 1), "IV"],
          ].forEach(([gx, gy, t]) => {
            this.add
              .text(this.sx(gx), this.sy(gy), t, qStyle)
              .setOrigin(0.5)
              .setAlpha(0.45)
              .setDepth(3);
          });
        }
      };

      GameScene.prototype.setMarker = function (gx, gy) {
        const R = this.range;
        this.mx = Phaser.Math.Clamp(gx, R.xmin, R.xmax);
        this.my = Phaser.Math.Clamp(gy, R.ymin, R.ymax);
        const px = this.sx(this.mx),
          py = this.sy(this.my);
        this.markerRing.setPosition(px, py);
        this.markerDot.setPosition(px, py);
        this.readout.setText("Marker:  (" + fmt(this.mx) + ", " + fmt(this.my) + ")");
        this.drawGuides();
        this.updateCoach();
      };

      GameScene.prototype.drawGuides = function () {
        this.guideG.clear();
        if (this.chosenLevel !== 1) return; // guides are a Level-1 scaffold
        const px = this.sx(this.mx),
          py = this.sy(this.my),
          ax = this.sx(0),
          ay = this.sy(0);
        this.guideG.lineStyle(2, C.gold, 0.45);
        this.guideG.lineBetween(px, ay, px, py); // vertical to x-axis
        this.guideG.lineBetween(ax, py, px, py); // horizontal to y-axis
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.phase = "plot";
        this.misses = 0;
        this.answerMissedOnce = false;
        this.helpG.clear();
        this.setNextMode(false);
        this.answerDone = false;
        this.problem = makeProblem(this.chosenLevel);
        const p = this.problem;
        const KIND_LABEL = {
          plot: "Plot a point",
          reflect: "Reflect",
          distance: "Distance mission (6.NOS.9)",
          polygon: "Rectangle mission (6.NOS.9)",
        };
        this.bannerLabel.setText(KIND_LABEL[p.kind] || "Plot a point");
        this.bannerText.setText(p.prompt);
        this.ghost.setVisible(false);
        this.hideChoices();
        this.clearSegment();
        this.lockBtn.setVisible(true);
        this.lockLabel.setVisible(true);
        this.markerRing.setStrokeStyle(3, C.gold);
        this.markerDot.setFillStyle(C.gold);

        // Show / hide the given point(s) for reflect / distance / rectangle.
        const givens = p.givens || (p.given ? [p.given] : []);
        const nameFor = p.kind === "reflect" ? "P " : p.kind === "distance" ? "A " : "";
        this.givenStars.forEach((s, i) => {
          const gp = givens[i];
          if (!gp) {
            s.setVisible(false);
            this.givenLabels[i].setVisible(false);
            return;
          }
          const gx = this.sx(gp.x),
            gy = this.sy(gp.y);
          s.setPosition(gx, gy).setVisible(true);
          this.givenLabels[i]
            .setText(nameFor + "(" + fmt(gp.x) + ", " + fmt(gp.y) + ")")
            .setPosition(gx, gy - 22)
            .setVisible(true);
        });

        // Hint line: Level 1 always shows it; the new mission types keep a
        // light scaffold on Level 2 too (they are two-part questions).
        const showHint = this.chosenLevel === 1 || p.kind === "distance" || p.kind === "polygon";
        if (showHint && p.hint) {
          this.hintText.setText(p.hint);
        } else {
          this.hintText.setText("Click a cell or use the arrow keys, then Lock In.").setColor(C.sub);
        }
        if (showHint && p.hint) this.hintText.setColor(C.sub);

        // Reset marker to the origin each round.
        this.setMarker(0, 0);
        this.updateHUD();
        const srGivens =
          p.kind === "polygon"
            ? " Corners shown: " +
              givens.map((g) => "(" + fmt(g.x) + ", " + fmt(g.y) + ")").join(", ") +
              "."
            : "";
        srSay(
          p.prompt +
            srGivens +
            " Move your marker to the spot, then lock it in. " +
            (showHint && p.hint ? p.hint : ""),
        );
      };

      GameScene.prototype.lockIn = function () {
        if (this.nextMode) return this.pressNext();
        if (this.locked || !this.problem || this.phase !== "plot") return;
        this.locked = true;
        const p = this.problem;
        const correct = this.mx === p.tx && this.my === p.ty;
        if (window.NeftScore) NeftScore.attempt(correct);
        if (correct) {
          SFX.good();
          JUICE.audio.correct(this.streak);
          this.helpG.clear();
          this.markerRing.setStrokeStyle(3, C.good);
          this.markerDot.setFillStyle(C.good);
          const px = this.sx(this.mx),
            py = this.sy(this.my);
          if (!this.reduceMotion) {
            this.burst.setPosition(px, py);
            this.burst.explode(16);
            JUICE.burst(this, px, py, [0x4fd18b, 0x5ad1ff, 0xffffff], 16);
          }
          if (p.answer) {
            // Two-part mission: the point is placed — now ask for the length.
            this.score += 10;
            JUICE.floatText(this, px, py - 28, "+10", C.goodS, 26);
            this.feedback.setText("Placed! " + p.why).setColor(C.goodS).setAlpha(1);
            this.updateHUD();
            srSay("Correct placement. " + p.why);
            this.time.delayedCall(700, () => this.beginAnswerPhase());
            return;
          }
          this.solved++;
          const first = this.misses === 0;
          let gained = HELP_POINTS[Math.min(this.misses, 3)];
          if (first) {
            this.streak++;
            gained += Math.min(this.streak, 5) * 5;
          }
          this.score += gained;
          if (!this.reduceMotion) JUICE.shake(this, 0.004 + Math.min(this.streak, 5) * 0.001);
          JUICE.floatText(this, px, py - 28, "+" + gained, C.goodS, 30);
          JUICE.award(8 + Math.min(this.streak, 5) * 2, "u9-coordinate-quest");
          if (this.streak >= 2 && !this.reduceMotion) JUICE.confetti(this, 1);
          const msg = (first ? "Correct on the first try! " : "Correct! You used the hint well. ") + p.why;
          this.feedback.setText(msg).setColor(C.goodS).setAlpha(1);
          srSay(msg);
          this.afterAttempt(true);
          return;
        }
        SFX.bad();
        JUICE.audio.wrong();
        this.streak = 0;
        this.misses++;
        this.hintsUsed++;
        if (this.misses < 3) {
          // Hint 1 = name the mix-up + the method (no answer).
          // Hint 2 = a concrete step drawn on the grid (still not placed).
          const tip = this.misses === 1 ? this.tier1() : this.tier2();
          const label = this.misses === 1 ? "Hint 1 of 2: " : "Hint 2 of 2: ";
          this.locked = false;
          this.feedback.setText(label + tip).setColor(C.goldS).setAlpha(1);
          this.updateHUD();
          srSay("Not quite. " + label + tip + " Move the marker, then lock in again.");
          return;
        }
        // Third miss: teach — light up the correct cell, glide the marker to
        // it, explain, and continue. The round still counts as finished.
        this.helpG.clear();
        this.markerRing.setStrokeStyle(3, C.bad);
        this.markerDot.setFillStyle(C.bad);
        const msg = "Here is the spot: " + p.why;
        this.feedback.setText(msg).setColor(C.goldS).setAlpha(1);
        this.updateHUD();
        srSay(msg);
        const tx = this.sx(p.tx),
          ty = this.sy(p.ty);
        this.ghost.setPosition(tx, ty).setVisible(true);
        this.tweens.add({
          targets: [this.markerRing, this.markerDot],
          x: tx,
          y: ty,
          duration: this.reduceMotion ? 0 : 600,
          onComplete: () => {
            this.guideG.clear();
            if (p.answer) {
              // Still ask the length question — the points are now visible.
              this.time.delayedCall(700, () => this.beginAnswerPhase());
            } else {
              this.afterAttempt(false);
            }
          },
        });
      };

      // Hint 1: spot the likely mix-up from WHERE the marker is, and name the
      // method. Never states the target point.
      GameScene.prototype.tier1 = function () {
        const p = this.problem;
        const mx = this.mx,
          my = this.my,
          tx = p.tx,
          ty = p.ty;
        if (mx === ty && my === tx && tx !== ty)
          return "You swapped x and y. The FIRST number (x) moves left or right. The SECOND number (y) moves up or down.";
        if (p.kind === "reflect" && p.given) {
          const g = p.given;
          if (mx === g.x && my === g.y)
            return "That is P itself. The image is P's mirror picture on the OTHER side of the axis.";
          if (mx === -g.x && my === -g.y)
            return "You flipped BOTH signs. A reflection across one axis flips only ONE sign.";
          const acrossX = tx === g.x;
          if (acrossX && mx === -g.x && my === g.y)
            return "You reflected across the y-axis. Across the x-axis, x stays the same and only y changes sign.";
          if (!acrossX && mx === g.x && my === -g.y)
            return "You reflected across the x-axis. Across the y-axis, y stays the same and only x changes sign.";
        }
        if (mx === -tx && my === ty && tx !== 0)
          return "Check the sign of x. Negative x goes LEFT of 0. Positive x goes RIGHT.";
        if (my === -ty && mx === tx && ty !== 0)
          return "Check the sign of y. Negative y goes DOWN from 0. Positive y goes UP.";
        if (mx === -tx && my === -ty)
          return "Both signs are flipped. Negative x goes LEFT, negative y goes DOWN.";
        if (Math.abs(mx - tx) + Math.abs(my - ty) === 1)
          return "So close: you are 1 unit away. Count the grid lines again, starting from 0.";
        if (p.kind === "polygon")
          return "Opposite sides of a rectangle line up. The missing corner shares its x with one corner and its y with another.";
        if (p.kind === "distance")
          return p.hint || "B shares one coordinate with A. Keep that one and change the other.";
        return "Start at the origin (0, 0). Move across for x first, then up or down for y.";
      };

      // Hint 2: draw one concrete step on the grid with the student's goal.
      GameScene.prototype.tier2 = function () {
        const p = this.problem;
        const g = this.helpG;
        g.clear();
        g.lineStyle(3, C.gold, 0.75);
        const dashV = (gx, y0, y1) => {
          const a = Math.min(this.sy(y0), this.sy(y1)),
            b = Math.max(this.sy(y0), this.sy(y1));
          for (let y = a; y < b; y += 14) g.lineBetween(this.sx(gx), y, this.sx(gx), Math.min(y + 7, b));
        };
        const dashH = (gy, x0, x1) => {
          const a = Math.min(this.sx(x0), this.sx(x1)),
            b = Math.max(this.sx(x0), this.sx(x1));
          for (let x = a; x < b; x += 14) g.lineBetween(x, this.sy(gy), Math.min(x + 7, b), this.sy(gy));
        };
        const R = this.range;
        if (p.kind === "polygon") {
          // Lines through the two corners that share the missing corner's x / y.
          const sameX = p.givens.find((c) => c.x === p.tx);
          const sameY = p.givens.find((c) => c.y === p.ty);
          if (sameX) dashV(sameX.x, R.ymin, R.ymax);
          if (sameY) dashH(sameY.y, R.xmin, R.xmax);
          return "Follow the two gold lines: one goes straight up and down through a corner, one goes straight across through another. The missing corner is where they cross.";
        }
        if (p.kind === "distance") {
          const A = p.given;
          if (A.y === p.ty) {
            dashH(A.y, R.xmin, R.xmax);
            return "B is on the gold line across from A (y = " + fmt(A.y) + "). Slide along it until x = " + fmt(p.tx) + ".";
          }
          dashV(A.x, R.ymin, R.ymax);
          return "B is on the gold line through A (x = " + fmt(A.x) + "). Slide up or down until y = " + fmt(p.ty) + ".";
        }
        if (p.kind === "reflect") {
          const P = p.given;
          if (p.tx === P.x) {
            dashV(P.x, R.ymin, R.ymax);
            return "Stay on the gold line (x = " + fmt(P.x) + "). P is " + Math.abs(P.y) + " units " + (P.y > 0 ? "above" : "below") + " the x-axis, so its image is " + Math.abs(P.y) + " units " + (P.y > 0 ? "below" : "above") + " it.";
          }
          dashH(P.y, R.xmin, R.xmax);
          return "Stay on the gold line (y = " + fmt(P.y) + "). P is " + Math.abs(P.x) + " units " + (P.x > 0 ? "right of" : "left of") + " the y-axis, so its image is " + Math.abs(P.x) + " units " + (P.x > 0 ? "left of" : "right of") + " it.";
        }
        // Plain plot: mark x on the x-axis and draw the path up/down from it.
        g.fillStyle(C.gold, 1).fillCircle(this.sx(p.tx), this.sy(0), 7);
        dashV(p.tx, 0, p.ty > 0 ? R.ymax : R.ymin);
        return "Step 1: x = " + fmt(p.tx) + " is marked on the x-axis. Step 2: from there, go " + (p.ty > 0 ? "UP " : "DOWN ") + Math.abs(p.ty) + " along the gold line for y.";
      };

      // Level 1 live step coach: names the next move from where the marker is.
      GameScene.prototype.updateCoach = function () {
        if (this.chosenLevel !== 1 || !this.problem || this.phase !== "plot" || this.nextMode) return;
        const p = this.problem;
        let t;
        if (this.mx !== p.tx)
          t =
            "Step 1: move " +
            (this.mx < p.tx ? "RIGHT" : "LEFT") +
            " along the x-axis to x = " +
            p.tx +
            "  (now x = " +
            this.mx +
            ")";
        else if (this.my !== p.ty)
          t =
            "Step 2: x = " +
            p.tx +
            " ✓  Now move " +
            (this.my < p.ty ? "UP" : "DOWN") +
            " to y = " +
            p.ty +
            "  (now y = " +
            this.my +
            ")";
        else t = "Step 3: you are at (" + p.tx + ", " + p.ty + ") ✓  Press LOCK IN.";
        this.hintText.setText(t).setColor(this.mx === p.tx && this.my === p.ty ? C.goodS : "#ffe08a");
      };

      // NEXT ROUND mode: the Lock In button becomes Next so the way forward is
      // on screen. It presses the shared console's Continue button so the
      // studio's pacing (feedback stays until the student continues) holds.
      GameScene.prototype.setNextMode = function (on) {
        this.nextMode = on;
        this.lockBtn.setVisible(true).setFillStyle(on ? 0x2563a8 : 0x2f8f5a);
        this.lockLabel.setVisible(true).setText(on ? "NEXT ROUND ▶" : "LOCK IN ✓");
        if (on) this.hintText.setText("Read the feedback, then press NEXT ROUND (or Enter).").setColor(C.sub);
      };
      GameScene.prototype.pressNext = function () {
        const b = document.querySelector(".cabinet-next");
        if (b && !b.hidden && !b.disabled) b.click();
        else if (!b && this.pendingNext) this.pendingNext();
      };

      // ── Part 2 of distance / rectangle missions: answer the length ──
      GameScene.prototype.beginAnswerPhase = function () {
        const p = this.problem;
        if (!p || !p.answer || this.phase === "answer") return;
        this.phase = "answer";
        this.locked = true; // marker stays put; choice buttons take over
        this.feedback.setAlpha(0);
        this.ghost.setVisible(false);
        if (p.outline) this.drawRectOutline(p.outline);
        if (p.segment) this.drawCountedSegment(p.segment);
        this.bannerLabel.setText(
          p.kind === "distance"
            ? "Distance mission (6.NOS.9) · Part 2"
            : "Rectangle mission (6.NOS.9) · Part 2",
        );
        this.bannerText.setText(p.answer.question);
        this.hintText.setText(
          "Count the dots along the gold line, then tap a number (or press 1–4).",
        );
        this.lockBtn.setVisible(false);
        this.lockLabel.setVisible(false);
        this.showChoices(p.answer.choices);
        srSay(
          p.answer.question +
            " Choices: " +
            p.answer.choices.join(", ") +
            ". Press 1, 2, 3, or 4, or tap a number button.",
        );
      };

      // Gold segment with a dot + count at every unit step, so students can
      // COUNT the distance calmly (matches the |a − b| explanation).
      GameScene.prototype.drawCountedSegment = function (seg) {
        this.segG.lineStyle(4, C.gold, 0.9);
        this.segG.lineBetween(this.sx(seg.x1), this.sy(seg.y1), this.sx(seg.x2), this.sy(seg.y2));
        const steps = Math.abs(seg.x2 - seg.x1) + Math.abs(seg.y2 - seg.y1);
        if (!steps) return;
        const dx = (seg.x2 - seg.x1) / steps,
          dy = (seg.y2 - seg.y1) / steps;
        for (let i = 1; i <= steps; i++) {
          const px = this.sx(seg.x1 + dx * i),
            py = this.sy(seg.y1 + dy * i);
          this.segG.fillStyle(C.gold, 1);
          this.segG.fillCircle(px, py, 4);
          this.segLabels.push(
            this.add
              .text(px + (dy !== 0 ? 14 : 0), py - (dx !== 0 ? 14 : 0), String(i), {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "14px",
                fontStyle: "bold",
                color: C.goldS,
              })
              .setOrigin(0.5)
              .setDepth(9),
          );
        }
      };

      GameScene.prototype.drawRectOutline = function (o) {
        const left = Math.min(this.sx(o.x1), this.sx(o.x2)),
          top = Math.min(this.sy(o.y1), this.sy(o.y2));
        this.segG.lineStyle(2, C.accent, 0.8);
        this.segG.strokeRect(
          left,
          top,
          Math.abs(this.sx(o.x2) - this.sx(o.x1)),
          Math.abs(this.sy(o.y2) - this.sy(o.y1)),
        );
      };

      GameScene.prototype.clearSegment = function () {
        this.segG.clear();
        this.segLabels.forEach((t) => t.destroy());
        this.segLabels = [];
      };

      // Big tappable answer buttons (keyboard: 1–4). Calm, self-paced.
      GameScene.prototype.showChoices = function (values) {
        this.hideChoices();
        this.choiceVals = values.slice();
        this.choiceObjs = [];
        this.choiceRects = [];
        const n = this.choiceVals.length,
          bw = 96,
          gap = 16;
        const x0 = W / 2 - (n * bw + (n - 1) * gap) / 2 + bw / 2;
        this.choiceVals.forEach((v, i) => {
          const bx = x0 + i * (bw + gap);
          const btn = this.add
            .rectangle(bx, 538, bw, 50, 0x1a3a5c)
            .setStrokeStyle(2, C.accent, 0.8)
            .setInteractive({ useHandCursor: true });
          const txt = this.add
            .text(bx, 538, String(v), {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "24px",
              fontStyle: "bold",
              color: "#ffffff",
            })
            .setOrigin(0.5);
          const keyTag = this.add
            .text(bx - bw / 2 + 10, 522, String(i + 1), {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "13px",
              color: C.sub,
            })
            .setOrigin(0.5);
          btn.on("pointerover", () => btn.setFillStyle(0x25507a));
          btn.on("pointerout", () => btn.setFillStyle(0x1a3a5c));
          btn.on("pointerdown", () => this.pickChoice(i));
          this.choiceObjs.push(btn, txt, keyTag);
          this.choiceRects.push(btn);
        });
      };

      // Misconception-aware nudge for a wrong length pick (no answer given).
      GameScene.prototype.answerHint = function (picked) {
        const ans = this.problem.answer;
        const seg = this.problem.segment;
        const a = seg.x1 === seg.x2 ? seg.y1 : seg.x1;
        const b = seg.x1 === seg.x2 ? seg.y2 : seg.x2;
        if (a * b < 0 && picked === Math.abs(Math.abs(a) - Math.abs(b)))
          return "Not quite. The points are on OPPOSITE sides of 0, so ADD their distances to the axis. Count the gold dots, then pick again.";
        if (Math.abs(picked - ans.correct) === 1)
          return "Not quite. Off by one: count the SPACES between points (the numbered gold dots), not the grid lines.";
        return "Not quite. Count the numbered gold dots along the line, then pick again.";
      };

      GameScene.prototype.hideChoices = function () {
        (this.choiceObjs || []).forEach((o) => o.destroy());
        this.choiceObjs = [];
        this.choiceRects = [];
        this.choiceVals = null;
      };

      GameScene.prototype.pickChoice = function (i) {
        if (this.phase !== "answer" || !this.choiceVals || this.answerDone) return;
        if (i < 0 || i >= this.choiceVals.length) return;
        const ans = this.problem.answer;
        if (window.NeftScore) NeftScore.attempt(this.choiceVals[i] === ans.correct);
        if (this.choiceVals[i] === ans.correct) {
          this.answerDone = true;
          SFX.good();
          JUICE.audio.correct(this.streak);
          this.solved++;
          const first = this.misses === 0 && !this.answerMissedOnce;
          let gained = HELP_POINTS[Math.min(this.misses + (this.answerMissedOnce ? 1 : 0), 3)];
          if (first) {
            this.streak++;
            gained += Math.min(this.streak, 5) * 5;
          }
          this.score += gained;
          this.choiceRects[i].setFillStyle(0x2f8f5a);
          JUICE.floatText(this, W / 2, 470, "+" + gained, C.goodS, 30);
          JUICE.award(8 + Math.min(this.streak, 5) * 2, "u9-coordinate-quest");
          if (this.streak >= 2 && !this.reduceMotion) JUICE.confetti(this, 1);
          this.feedback.setText("Correct! " + ans.why).setColor(C.goodS).setAlpha(1);
          srSay("Correct. " + ans.why);
          this.afterAttempt(true);
        } else if (!this.answerMissedOnce) {
          // Calm retry: no reveal, just a nudge back to counting.
          this.answerMissedOnce = true;
          this.hintsUsed++;
          this.streak = 0;
          SFX.bad();
          JUICE.audio.wrong();
          this.feedback
            .setText(this.answerHint(this.choiceVals[i]))
            .setColor(C.goldS)
            .setAlpha(1);
          this.updateHUD();
          srSay("Not quite. Count the unit steps along the highlighted line, then pick again.");
        } else {
          this.answerDone = true;
          this.streak = 0;
          SFX.bad();
          JUICE.audio.wrong();
          const ci = this.choiceVals.indexOf(ans.correct);
          if (ci >= 0) this.choiceRects[ci].setFillStyle(0x2f8f5a);
          this.feedback
            .setText("The answer is " + ans.correct + ". " + ans.why)
            .setColor(C.goldS)
            .setAlpha(1);
          this.updateHUD();
          srSay("The answer is " + ans.correct + ". " + ans.why);
          this.afterAttempt(false);
        }
      };

      GameScene.prototype.afterAttempt = function (solved) {
        // No-fail practice: mistakes teach; they never end the game. Every
        // problem is one round; 10 rounds make a run.
        const kind = this.problem.kind;
        const row = this.tally[kind] || (this.tally[kind] = { seen: 0, firstTry: 0 });
        row.seen++;
        if (solved && this.misses === 0 && !this.answerMissedOnce) {
          row.firstTry++;
          this.firstTry++;
        }
        this.round++;
        this.attempts = this.round;
        this.updateHUD();
        if (this.round >= this.target) {
          this.endGame();
          return;
        }
        // The Next button takes the Lock In slot (choice buttons sit there in
        // a mission's Part 2; the feedback line already names the answer).
        this.hideChoices();
        this.setNextMode(true);
        this.pendingNext = () => {
          this.feedback.setAlpha(0);
          this.newProblem();
        };
        this.studioNextRound(() => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText("Level " + this.chosenLevel);
        const shown = this.endless ? this.round + 1 : Math.min(this.round + 1, this.target);
        this.progressText.setText(
          this.endless
            ? "Round " + shown + " · Solved " + this.solved
            : "Round " + shown + " of " + this.target + " · Solved " + this.solved,
        );
      };

      GameScene.prototype.endGame = function () {
        this.locked = true;
        if (!this.reduceMotion) JUICE.confetti(this, 2);
        JUICE.award(40, "u9-coordinate-quest-complete");
        this.time.delayedCall(500, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            rounds: this.round,
            target: this.endless ? Math.max(this.round, 1) : this.target,
            firstTry: this.firstTry,
            hintsUsed: this.hintsUsed,
            tally: this.tally,
            level: this.chosenLevel,
            auto: this.autoMode,
            accuracy: this.round ? this.firstTry / this.round : 1,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, C.bg);
        const rounds = Math.max(d.rounds || 0, 1);
        const rate = d.solved / rounds;

        // Adaptive: log the run so Auto can pick the next level.
        if (d.auto && window.NTAdaptive)
          window.NTAdaptive.recordRun("u9-coordinate-quest", {
            won: rate >= 0.7,
            accuracy: typeof d.accuracy === "number" ? d.accuracy : 1,
            min: 1,
            max: 2,
          });

        const stars = rate >= 0.9 ? 3 : rate >= 0.6 ? 2 : 1;

        let hs = 0;
        try {
          hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10) || 0;
        } catch (e) {}
        const newBest = d.score > hs;
        if (newBest) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }
        const txt = (y, s, size, color, bold) =>
          this.add
            .text(cx, y, s, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: size + "px",
              fontStyle: bold ? "bold" : "normal",
              color: color,
              align: "center",
              wordWrap: { width: W - 100 },
            })
            .setOrigin(0.5);

        this.add
          .text(cx, 64, rate >= 0.8 ? "QUEST COMPLETE!" : "RUN COMPLETE!", {
            fontFamily: "Impact, sans-serif",
            fontSize: "46px",
            color: C.goodS,
            stroke: "#061018",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        txt(122, "★".repeat(stars) + "☆".repeat(3 - stars), 44, C.goldS, false);
        txt(176, "Score " + d.score + (newBest ? "  ·  NEW BEST!" : "  ·  Best " + hs), 28, "#ffffff", true);
        txt(
          216,
          "Solved " +
            d.solved +
            " of " +
            rounds +
            " · " +
            d.firstTry +
            " on the first try · " +
            d.hintsUsed +
            (d.hintsUsed === 1 ? " hint" : " hints") +
            " used · Level " +
            d.level,
          18,
          C.ink,
          false,
        );
        const names = { plot: "Plot points", reflect: "Reflect", distance: "Distance", polygon: "Rectangles" };
        const tally = d.tally || {};
        const keys = Object.keys(tally);
        txt(
          252,
          "Skills practiced: " +
            (keys.length
              ? keys.map((k) => names[k] + " " + tally[k].firstTry + "/" + tally[k].seen + " first try").join("  ·  ")
              : "none yet"),
          17,
          C.sub,
          false,
        );
        const tips = {
          plot: "x first (left/right), then y (up/down). Watch the signs.",
          reflect: "across the x-axis flip y; across the y-axis flip x.",
          distance: "count unit steps, or add the two distances to the axis.",
          polygon: "the missing corner shares an x with one corner and a y with another.",
        };
        let weakest = null;
        keys.forEach((k) => {
          const r = tally[k].firstTry / tally[k].seen;
          if (weakest === null || r < weakest.r) weakest = { k, r };
        });
        let next;
        if (weakest && weakest.r < 0.6) next = "Practice next: " + names[weakest.k] + ": " + tips[weakest.k];
        else if (d.level === 1) next = "Practice next: you are ready for Level 2 (all four quadrants).";
        else next = "Practice next: keep going in Level 2 and aim for 10 on the first try.";
        txt(300, next, 18, "#ffe08a", true);

        SFX.win();
        if (!reducedMotion()) JUICE.audio.fanfare();

        // Score reporting goes through NeftScore (attempt() at each judge
        // above), which loads the bridge itself and beacons on pagehide —
        // the old direct EduPulse.record here only fired if a student
        // reached this screen with the bridge already loaded, which is why
        // this game never produced a game_scores row.
        try {
          window.NeftScore && NeftScore.finish();
        } catch (e) {}
        srSay(
          "Run complete. Score " +
            d.score +
            ". Solved " +
            d.solved +
            " of " +
            rounds +
            ", " +
            d.firstTry +
            " on the first try. " +
            next,
        );

        const mkBtn = (y, label, fill, hover, cb) => {
          const b = this.add
            .rectangle(cx, y, 300, 54, fill)
            .setStrokeStyle(2, 0xffffff, 0.7)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(cx, y, label, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "20px",
              fontStyle: "bold",
              color: "#ffffff",
            })
            .setOrigin(0.5);
          b.on("pointerover", () => b.setFillStyle(hover));
          b.on("pointerout", () => b.setFillStyle(fill));
          b.on("pointerdown", cb);
        };
        const again = () => this.scene.start("Level");
        mkBtn(390, "PLAY AGAIN · new points", 0x2f8f5a, 0x37a667, again);
        // Endless: keep practicing at the same level without leaving.
        const keepPlaying = () =>
          this.scene.start("Game", {
            level: d.level,
            endless: true,
            auto: !!d.auto,
          });
        mkBtn(458, "♾️ Keep playing this level", 0x2563a8, 0x2f74c2, keepPlaying);
        txt(510, "Enter = play again", 15, C.sub, false);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);
      };

      // ── Launch ──
      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0a1a2e",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, VocabScene, LevelScene, GameScene, ResultScene],
      };
      const cqGame = new Phaser.Game(config);
      window.cqGame = cqGame; // stable handle for automated QA harnesses
      // Native math controls now have a readable, touch-accessible console.
      window.PhaserStudio.mount({
        game: cqGame, id: "u9-coordinate-quest", GameScene, ResultScene, audio: SFX,
        instructions: [
          "Goal: put the star on the exact point, then press Lock In. 10 rounds, no timer.",
          "Click a spot on the grid, or move the marker with the arrow keys. Enter = Lock In.",
          "An ordered pair is (x, y). Go across for x first (right is positive, left is negative), then up or down for y.",
          "Level 1: the step coach tells you the next move. Level 2: all four quadrants, plus reflect, distance, and rectangle missions.",
          "Missions have two parts: plot the point, then pick the length with buttons 1\u20134. Count the numbered gold dots.",
          "A miss unlocks Hint 1 (what went wrong), then Hint 2 (a gold line on the grid). First-try answers earn the most points.",
        ],
        setLevel(level) { lastLevel = level; cqGame.scene.getScenes(true).forEach(scene => cqGame.scene.stop(scene.sys.settings.key)); cqGame.scene.start(vocabSeen ? "Game" : "Vocab", {level}); }
      });

      // ── Canvas accessibility (additive; no gameplay change) ──
      cqGame.events.once("ready", function () {
        try {
          const cv = cqGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Coordinate Quest Star Plotter math game. Read the ordered pair, " +
              "then click a grid cell or use the arrow keys to move your marker " +
              "to the exact spot, and press Lock In, Enter, or Space to place " +
              "the star. Distance and rectangle missions then ask a length " +
              "question: tap a number button or press 1, 2, 3, or 4 to answer.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          // Arrow keys and Space drive the game; stop them from ALSO scrolling
          // the page (it is taller than a Chromebook screen). Registered after
          // Phaser's own window listener, so the game still gets every key;
          // keys typed into buttons, inputs and dialogs are left alone.
          window.addEventListener("keydown", function (e) {
            if (e.target !== cv && e.target !== document.body) return;
            if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) > -1)
              e.preventDefault();
          });
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>
