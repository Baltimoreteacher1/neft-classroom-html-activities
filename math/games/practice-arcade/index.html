            this.time.delayedCall(720, () => {
              if (this.locked) return;
              const touched = new Set();
              this.sortTiles.forEach((t) => {
                if (t.assigned !== t.data.category) {
                  const freed = this.unassignTile(t);
                  if (freed >= 0) touched.add(freed);
                  t.parts.x = t.homeX;
                  t.parts.y = t.homeY;
                }
              });
              // Re-fit the tiles that stayed AFTER homes are set, so a layoutBin
              // tween can't race a freed tile back into the bin.
              touched.forEach((bi) => this.layoutBin(bi));
              this.highlightSort();
            });
          }

          // ── Renderer: MATCH (connect terms to partners) ────────────────────
          renderMatch(r) {
            const pairs = r.pairs;
            const topY = 92 + Math.max(70, this.promptText.height + 30) + 40;
            const gap = Math.min(74, (H - topY - 80) / pairs.length);
            const leftX = W / 2 - 200;
            const rightX = W / 2 + 200;
            const terms = pairs.map((p, i) => ({ ...p, i }));
            const matches = shuffle(pairs.map((p, i) => ({ ...p, i })));
            this.matchSel = null;
            this.matchLeft = [];
            this.matchRight = [];
            this.matchRemaining = pairs.length;
            const LETTERS = ["A", "B", "C", "D", "E", "F", "G"];

            terms.forEach((p, row) => {
              const y = topY + row * gap;
              const t = this.makeTile(leftX, y, 280, 48, row + 1 + ".  " + p.term);
              t.pairId = p.i;
              t.side = "L";
              t.expect = p.match; // value-based comparison (duplicate-text safe)
              this.layer.add(t.parts);
              t.bg.on("pointerdown", () => this.matchTap(t));
              this.matchLeft.push(t);
              this.input.keyboard.on("keydown-" + keyName(row + 1), () => {
                if (!this.matchSel || this.matchSel.side === "R") this.matchTap(t);
              });
            });
            matches.forEach((p, row) => {
              const y = topY + row * gap;
              const t = this.makeTile(rightX, y, 280, 48, LETTERS[row] + ".  " + p.match);
              t.pairId = p.i;
              t.side = "R";
              t.val = p.match;
              this.layer.add(t.parts);
              t.bg.on("pointerdown", () => this.matchTap(t));
              this.matchRight.push(t);
              if (LETTERS[row])
                this.input.keyboard.on("keydown-" + LETTERS[row], () => {
                  if (this.matchSel && this.matchSel.side === "L") this.matchTap(t);
                });
            });
            // Screen-reader roster + instructions for keyboard users.
            srSay(
              rounds[this.idx].prompt +
                ". Left cards: " +
                terms.map((p, i) => i + 1 + " " + p.term).join("; ") +
                ". Right cards: " +
                matches.map((p, i) => LETTERS[i] + " " + p.match).join("; ") +
                ". Press a number to pick a left card, then a letter to pick its match.",
            );
          }
          matchTap(t) {
            if (this.locked || t.done || !this.settled()) return;
            SFX.pick();
            if (!this.matchSel) {
              this.matchSel = t;
              t.bg.setFillStyle(PALETTE.accent);
              return;
            }
            if (this.matchSel === t) {
              this.matchSel = null;
              t.bg.setFillStyle(PALETTE.tile);
              return;
            }
            if (this.matchSel.side === t.side) {
              // re-select within same column
              this.matchSel.bg.setFillStyle(PALETTE.tile);
              this.matchSel = t;
              t.bg.setFillStyle(PALETTE.accent);
              return;
            }
            // attempt a pair — compare by VALUE so duplicate match text still works
            const a = this.matchSel,
              b = t;
            const Ltile = a.side === "L" ? a : b;
            const Rtile = a.side === "L" ? b : a;
            if (Ltile.expect === Rtile.val) {
              a.bg.setFillStyle(PALETTE.good);
              b.bg.setFillStyle(PALETTE.good);
              a.done = b.done = true;
              a.bg.disableInteractive();
              b.bg.disableInteractive();
              this.matchSel = null;
              this.matchRemaining--;
              this.score += 20;
              JUICE.audio.pop();
              this.updateHUD();
              if (this.matchRemaining <= 0) this.resolve(true, "All pairs matched!");
            } else {
              a.bg.setFillStyle(PALETTE.bad);
              b.bg.setFillStyle(PALETTE.bad);
              this.matchSel = null;
              const aa = a,
                bb = b;
              this.time.delayedCall(420, () => {
                if (!aa.done) aa.bg.setFillStyle(PALETTE.tile);
                if (!bb.done) bb.bg.setFillStyle(PALETTE.tile);
              });
              this.resolve(false, "That pair did not match.");
            }
          }

          // ── Renderer: FIXIT (spot the step with the mistake) ───────────────
          renderFixit(r) {
            const hintY = 92 + Math.max(70, this.promptText.height + 30) + 24;
            // Tell the student what to DO — the prompt only names the scenario.
            const cue = this.add
              .text(W / 2, hintY, "One step below has a mistake. Tap the step that is wrong.", {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "15px",
                color: "#e0e7ff",
                align: "center",
                wordWrap: { width: W - 200 },
              })
              .setOrigin(0.5);
            this.layer.add(cue);
            const topY = hintY + 34;
            const gap = Math.min(72, (H - topY - 70) / r.steps.length);
            const tiles = [];
            r.steps.forEach((s, i) => {
              const y = topY + i * gap;
              const label = (s.label ? s.label + ":  " : "") + s.work;
              const t = this.makeTile(W / 2, y, W - 220, 50, i + 1 + ".  " + label, "16px");
              this.layer.add(t.parts);
              tiles.push(t);
              t.bg.on("pointerover", () => !this.locked && t.bg.setFillStyle(PALETTE.tileHi));
              t.bg.on("pointerout", () => !this.locked && t.bg.setFillStyle(PALETTE.tile));
              t.bg.on("pointerdown", () => this.pickFix(r, i, t));
              this.input.keyboard.on("keydown-" + keyName(i + 1), () => this.pickFix(r, i, t));
            });
            this.revealCorrect = () => {
              const ct = tiles[r.errorStep];
              if (ct) ct.bg.setFillStyle(PALETTE.good);
            };
            srSay(
              rounds[this.idx].prompt +
                ". Steps: " +
                r.steps
                  .map((s, i) => i + 1 + ", " + ((s.label ? s.label + " " : "") + s.work))
                  .join("; ") +
                ". Press the number of the step with the mistake.",
            );
          }
          pickFix(r, i, t) {
            if (this.locked || !this.settled()) return;
            SFX.pick();
            const ok = i === r.errorStep;
            t.bg.setFillStyle(ok ? PALETTE.good : PALETTE.bad);
            // Wrong step: flash red, then reset so the student can try again.
            if (!ok)
              this.time.delayedCall(620, () => {
                if (!this.locked) t.bg.setFillStyle(PALETTE.tile);
              });
            this.resolve(ok, r.why);
          }

          // Format a number without floating-point noise.
          fmt(v) {
            return String(Math.round(v * 1000) / 1000);
          }

          // ── Renderer: NUMBER LINE (drag / arrow the marker to a target value) ─
          renderNumberLine(r) {
            const x0 = 150,
              x1 = W - 150,
              ly = 380;
            const range = r.max - r.min;
            const valToX = (v) => x0 + (x1 - x0) * ((v - r.min) / range);
            const snap = (v) => {
              const s = Math.round(v / r.step) * r.step;
              return Math.min(r.max, Math.max(r.min, s));
            };
            const g = this.add.graphics();
            g.lineStyle(6, PALETTE.panelLine, 0.95);
            g.lineBetween(x0, ly, x1, ly);
            this.layer.add(g);
            const nTicks = Math.min(10, Math.max(2, Math.round(range / r.step)));
            for (let i = 0; i <= nTicks; i++) {
              const tx = x0 + ((x1 - x0) * i) / nTicks;
              const val = r.min + (range * i) / nTicks;
              g.lineStyle(2, PALETTE.panelLine, 0.7);
              g.lineBetween(tx, ly - 10, tx, ly + 10);
              const lbl = this.add
                .text(tx, ly + 28, this.fmt(Math.round(val * 100) / 100) + (r.unit || ""), {
                  fontFamily: "Nunito, Segoe UI, sans-serif",
                  fontSize: "13px",
                  color: "#e0e7ff",
                })
                .setOrigin(0.5);
              this.layer.add(lbl);
            }
            this.nlVal = snap(r.min + range / 2);
            const marker = this.add.container(valToX(this.nlVal), ly);
            const dot = this.add.circle(0, 0, 15, PALETTE.gold).setStrokeStyle(3, 0xffffff);
            const bubble = this.add
              .text(0, -40, this.fmt(this.nlVal) + (r.unit || ""), {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "20px",
                fontStyle: "bold",
                color: "#06283f",
                backgroundColor: "#fde047",
                padding: { x: 8, y: 4 },
              })
              .setOrigin(0.5);
            const hit = this.add
              .rectangle(0, -6, 54, 70, 0xffffff, 0.001)
              .setInteractive({ useHandCursor: true });
            marker.add([hit, dot, bubble]);
            this.layer.add(marker);
            const refresh = () => {
              marker.x = valToX(this.nlVal);
              bubble.setText(this.fmt(this.nlVal) + (r.unit || ""));
            };
            // Reliable marker drag: hold the dot, then a SCENE-level pointermove
            // (registered once in create) tracks it — same fix as the sort tiles,
            // since Phaser's drag events on this nested marker are flaky on
            // trackpads/touch. Clamp to the line so the dot never escapes it.
            hit.on("pointerdown", () => {
              this.nlOnMove = (p) => {
                const clampedX = Math.max(x0, Math.min(x1, p.worldX));
                this.nlVal = snap(r.min + range * ((clampedX - x0) / (x1 - x0)));
                refresh();
              };
            });
            const nudge = (d) => {
              this.nlVal = Math.min(r.max, Math.max(r.min, this.nlVal + d * r.step));
              refresh();
              srSay("Marker at " + this.fmt(this.nlVal));
            };
            this.input.keyboard.on("keydown-LEFT", () => nudge(-1));
            this.input.keyboard.on("keydown-RIGHT", () => nudge(1));
            const check = () => {
              if (this.locked || !this.settled()) return;
              const ok = Math.abs(this.nlVal - r.target) <= (r.tol || 0);
              dot.setFillStyle(ok ? PALETTE.good : PALETTE.bad);
              this.resolve(
                ok,
                r.why || "The target is " + this.fmt(r.target) + (r.unit || "") + ".",
              );
              if (!ok)
                this.time.delayedCall(560, () => !this.locked && dot.setFillStyle(PALETTE.gold));
            };
            this.input.keyboard.on("keydown-ENTER", check);
            const cb = makeButton(this, W / 2, ly + 100, 170, 46, t("check"), check);
            this.layer.add(cb.bg);
            this.layer.add(cb.t);
            const cue = this.add
              .text(W / 2, ly - 46, "Drag the dot — or use ← → — then press CHECK.", {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "14px",
                color: "#e0e7ff",
                align: "center",
              })
              .setOrigin(0.5);
            this.layer.add(cue);
          }

          // ── Renderer: BUILD (tap pieces to assemble the answer expression) ────
          renderBuild(r) {
            this.buildSel = [];
            const tray = this.add
              .text(W / 2, 300, "( tap the pieces )", {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "24px",
                fontStyle: "bold",
                color: "#ffffff",
                backgroundColor: "rgba(255,255,255,0.10)",
                padding: { x: 16, y: 10 },
                align: "center",
                wordWrap: { width: W - 200 },
              })
              .setOrigin(0.5);
            this.layer.add(tray);
            const updateTray = () => {
              tray.setText(
                this.buildSel.length
                  ? this.buildSel.map((s) => s.text).join("  ×  ")
                  : "( tap the pieces )",
              );
            };
            const toks = r.tokens;
            const perRow = Math.min(4, toks.length);
            const spacing = Math.min(180, (W - 160) / perRow);
            const tileW = spacing - 20;
            const rowY = 400;
            let ix = (W - (perRow - 1) * spacing) / 2;
            toks.forEach((tk, i) => {
              const col = i % perRow;
              const row = Math.floor(i / perRow);
              const x = ix + col * spacing;
              const y = rowY + row * 74;
              const tile = this.makeTile(x, y, tileW, 56, tk, "22px");
              this.layer.add(tile.parts);
              tile.picked = false;
              tile.bg.on("pointerdown", () => {
                if (this.locked || !this.settled()) return;
                tile.picked = !tile.picked;
                if (tile.picked) {
                  tile.bg.setFillStyle(PALETTE.accent);
                  this.buildSel.push({ text: tk, tile });
                } else {
                  tile.bg.setFillStyle(PALETTE.tile);
                  this.buildSel = this.buildSel.filter((s) => s.tile !== tile);
                }
                SFX.pick();
                updateTray();
              });
            });
            const check = () => {
              if (this.locked || !this.settled()) return;
              const a = this.buildSel
                .map((s) => s.text)
                .slice()
                .sort();
              const b = r.answer.slice().sort();
              const ok = a.length === b.length && a.every((v, i) => v === b[i]);
              this.resolve(ok, r.why || "The answer is " + r.answer.join(" × ") + ".");
              if (!ok)
                this.time.delayedCall(560, () => {
                  if (this.locked) return;
                  this.buildSel.forEach((s) => {
                    s.tile.picked = false;
                    s.tile.bg.setFillStyle(PALETTE.tile);
                  });
                  this.buildSel = [];
                  updateTray();
                });
            };
            this.input.keyboard.on("keydown-ENTER", check);
            const rowsUsed = Math.ceil(toks.length / perRow);
            const cb = makeButton(
              this,
              W / 2,
              rowY + rowsUsed * 74 + 6,
              170,
              46,
              t("check"),
              check,
            );
            this.layer.add(cb.bg);
            this.layer.add(cb.t);
          }

          // ── Renderer: BALANCE (adjust x until the scale is level) ─────────────
          renderBalance(r) {
            this.balVal = r.min;
            const cx = W / 2,
              cy = 360;
            const eq = this.add
              .text(cx, 250, r.expr + " = " + this.fmt(r.equals), {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "26px",
                fontStyle: "bold",
                color: "#fde047",
              })
              .setOrigin(0.5);
            this.layer.add(eq);
            const beam = this.add.graphics();
            this.layer.add(beam);
            const valTxt = this.add
              .text(cx, cy + 120, "x = " + this.fmt(this.balVal), {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "30px",
                fontStyle: "bold",
                color: "#ffffff",
              })
              .setOrigin(0.5);
            this.layer.add(valTxt);
            const drawBeam = () => {
              beam.clear();
              const diff = this.balVal - r.target;
              const tilt = Math.max(-0.32, Math.min(0.32, diff * 0.14));
              const len = 210;
              const dx = Math.cos(tilt) * len,
                dy = Math.sin(tilt) * len;
              // stand + fulcrum
              beam.fillStyle(0xffffff, 0.9);
              beam.fillTriangle(cx - 18, cy + 74, cx + 18, cy + 74, cx, cy);
              // beam
              beam.lineStyle(12, diff === 0 ? PALETTE.good : PALETTE.gold, 1);
              beam.lineBetween(cx - dx, cy - dy, cx + dx, cy + dy);
              // pans
              beam.fillStyle(PALETTE.panelLine, 1);
              beam.fillCircle(cx - dx, cy - dy + 22, 16);
              beam.fillCircle(cx + dx, cy + dy + 22, 16);
            };
            drawBeam();
            const nudge = (d) => {
              this.balVal = Math.min(r.max, Math.max(r.min, this.balVal + d * r.step));
              valTxt.setText("x = " + this.fmt(this.balVal));
              drawBeam();
              srSay("x equals " + this.fmt(this.balVal));
            };
            const minus = makeButton(this, cx - 150, cy + 120, 62, 56, "−", () => nudge(-1));
            const plus = makeButton(this, cx + 150, cy + 120, 62, 56, "+", () => nudge(1));
            this.layer.add(minus.bg);
            this.layer.add(minus.t);
            this.layer.add(plus.bg);
            this.layer.add(plus.t);
            this.input.keyboard.on("keydown-LEFT", () => nudge(-1));
            this.input.keyboard.on("keydown-RIGHT", () => nudge(1));
            const check = () => {
              if (this.locked || !this.settled()) return;
              const ok = Math.abs(this.balVal - r.target) < 1e-9;
              this.resolve(ok, r.why || "x = " + this.fmt(r.target) + " balances it.");
            };
            this.input.keyboard.on("keydown-ENTER", check);
            const cb = makeButton(this, cx, cy + 190, 170, 46, t("check"), check);
            this.layer.add(cb.bg);
            this.layer.add(cb.t);
          }

          // ── Shared tile factory: returns {parts(container), bg, label} ─────
          // The visible face is a rounded, glossy, shadowed graphic for a modern
          // game-UI look. `bg` stays a REAL (transparent) interactive rectangle so
          // every existing call site keeps working — `.on(...)`, `.disableInteractive()`,
          // `.setInteractive()` are native; only `.setFillStyle` / `.setStrokeStyle`
          // are delegated to repaint the rounded face in the requested color.
          makeTile(x, y, w, h, text, fontSize) {
            const c = this.add.container(x, y);
            c.setSize(w, h);
            const R = 14;
            const DEF_STROKE = { w: 2, col: PALETTE.panelLine, a: 0.55 };
            let curFill = PALETTE.tile;
            let curStroke = { ...DEF_STROKE };
            // Drop shadow (slightly below the face) for depth.
            const shadow = this.add.graphics();
            shadow.fillStyle(0x0a0a2a, 0.34);
            shadow.fillRoundedRect(-w / 2, -h / 2 + 5, w, h, R);
            const face = this.add.graphics();
            const paint = () => {
              face.clear();
              face.fillStyle(curFill, 1);
              face.fillRoundedRect(-w / 2, -h / 2, w, h, R);
              // Top gloss highlight for a soft 3D sheen.
              face.fillStyle(0xffffff, 0.1);
              face.fillRoundedRect(-w / 2 + 3, -h / 2 + 3, w - 6, (h - 6) * 0.42, R - 4);
              if (curStroke.w > 0) {
                face.lineStyle(curStroke.w, curStroke.col, curStroke.a);
                face.strokeRoundedRect(-w / 2, -h / 2, w, h, R);
              }
            };
            paint();
            // Transparent hit area owns all input + the native input methods.
            const bg = this.add
              .rectangle(0, 0, w, h, 0xffffff, 0.001)
              .setInteractive({ useHandCursor: true });
            bg.setFillStyle = (color) => {
              curFill = color;
              paint();
              return bg;
            };
            bg.setStrokeStyle = (lw, color, alpha) => {
              // lw 0 (used to clear a highlight) restores the default border so a
              // tile never goes borderless; a positive width is a highlight color.
              curStroke =
                lw > 0
                  ? {
                      w: lw,
                      col: color == null ? DEF_STROKE.col : color,
                      a: alpha == null ? 0.95 : alpha,
                    }
                  : { ...DEF_STROKE };
              paint();
              return bg;
            };
            const label = this.add
              .text(0, 0, text, {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: fontSize || "18px",
                color: "#ffffff",
                fontStyle: "bold",
                align: "center",
                wordWrap: { width: w - 20 },
              })
              .setOrigin(0.5);
            c.add([shadow, face, bg, label]);
            // Juice: tiles pop in on arrival and squash on tap for tactile feel.
            JUICE.popIn(this, c, Math.random() * 120);
            bg.on("pointerdown", () => {
              JUICE.tilePop(this, c);
              JUICE.audio.tap();
            });
            return { parts: c, bg, label, homeX: x, homeY: y };
          }

          // Mascot guide reacts to answers (cheer up / dip down).
          mascotReact(good) {
            if (!this.mascotObj) return;
            if (JUICE.reduceMotion) return;
            const lift = good ? -26 - Math.min(this.streak, 5) * 4 : 12;
            this.tweens.add({
              targets: this.mascotObj,
              y: this.mascotObj.y + lift,
              angle: good ? 0 : -12,
              scale: good ? 1.25 + Math.min(this.streak, 5) * 0.05 : 0.92,
              yoyo: true,
              duration: good ? 260 : 200,
              ease: "Quad.Out",
            });
          }
          // Short speech bubble above the mascot — gives it personality.
          mascotSay(text) {
            if (!this.mascotObj) return;
            if (this.mascotBubble) this.mascotBubble.destroy();
            const bx = this.mascotObj.x + 70,
              by = this.journeyY + 4;
            const c = this.add.container(bx, by).setDepth(40);
            const label = this.add
              .text(0, 0, text, {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "15px",
                fontStyle: "bold",
                color: "#0a0f1f",
              })
              .setOrigin(0, 0.5);
            const pad = 8;
            const bg = this.add
              .rectangle(-pad, 0, label.width + pad * 2, 28, 0xffffff, 0.95)
              .setOrigin(0, 0.5);
            c.add([bg, label]);
            this.mascotBubble = c;
            if (!JUICE.reduceMotion) JUICE.popIn(this, c);
            this.time.delayedCall(1400, () => {
              if (c.active) c.destroy();
              if (this.mascotBubble === c) this.mascotBubble = null;
            });
          }
        }

        // ── RESULT ────────────────────────────────────────────────────────────
        class ResultScene extends Phaser.Scene {
          constructor() {
            super("Result");
          }
          init(d) {
            this.d = d;
          }
          create() {
            drawStars(this);
            const d = this.d;
            const ratio = d.total ? d.correct / d.total : 0;
            const stars = ratio >= 0.85 ? 3 : ratio >= 0.5 ? 2 : 1;

            // Celebrating boss + a medal that spins in — a real "you cleared the
            // level" payoff moment.
            const medal = stars >= 3 ? "🥇" : stars === 2 ? "🥈" : "🥉";
            const boss = this.add.text(W / 2, 92, mascot, { fontSize: "68px" }).setOrigin(0.5);
            const mdl = this.add.text(W / 2 + 46, 112, medal, { fontSize: "40px" }).setOrigin(0.5);
            if (!JUICE.reduceMotion) {
              mdl.setScale(0).setAngle(-40);
              this.tweens.add({
                targets: mdl,
                scale: 1,
                angle: 0,
                ease: "Back.Out",
                duration: 500,
                delay: 200,
              });
              this.tweens.add({
                targets: boss,
                y: 84,
                duration: 900,
                yoyo: true,
                repeat: -1,
                ease: "Sine.InOut",
              });
            }

            this.add
              .text(W / 2, 168, t("levelCleared"), {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "46px",
                fontStyle: "bold",
                color: "#34d399",
                stroke: "#0b1020",
                strokeThickness: 5,
              })
              .setOrigin(0.5);
            // Stars pop in one at a time with a "collect" blip for a payoff beat.
            for (let i = 0; i < 3; i++) {
              const earned = i < stars;
              const star = this.add
                .text(W / 2 - 60 + i * 60, 230, earned ? "★" : "☆", {
                  fontSize: "56px",
                  color: earned ? "#facc15" : "#475569",
                })
                .setOrigin(0.5);
              if (earned && !JUICE.reduceMotion) {
                star.setScale(0);
                this.tweens.add({
                  targets: star,
                  scale: 1,
                  ease: "Back.Out",
                  duration: 320,
                  delay: 300 + i * 320,
                  onStart: () => JUICE.audio.pop(),
                });
              }
            }
            this.add
              .text(
                W / 2,
                310,
                t("score") +
                  " " +
                  d.score +
                  "\n" +
                  d.correct +
                  " " +
                  t("of") +
                  " " +
                  d.total +
                  " " +
                  t("correctWord"),
                {
                  fontFamily: "Nunito, Segoe UI, sans-serif",
                  fontSize: "24px",
                  color: "#e2e8f0",
                  align: "center",
                },
              )
              .setOrigin(0.5);
            // Celebration + meta-progression payout.
            JUICE.audio.fanfare();
            JUICE.confetti(this, 1);
            const bonusXp = d.correct * 10 + 50 + stars * 15;
            JUICE.award(bonusXp, "practice-arcade-complete");
            this.add
              .text(W / 2, 360, "+" + bonusXp + " XP", {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "22px",
                fontStyle: "bold",
                color: "#fde047",
              })
              .setOrigin(0.5);

            // Rank title — a friendly label that rewards higher accuracy and
            // gives the score a name to aim to beat on replay.
            const flawless = d.total > 0 && d.correct === d.total;
            const rank = flawless
              ? "🏆 FLAWLESS — Math Champion!"
              : stars === 3
                ? "🌟 Math Star"
                : stars === 2
                  ? "💪 Getting Strong"
                  : "🌱 Keep Growing";
            this.add
              .text(W / 2, 392, rank, {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "20px",
                fontStyle: "bold",
                color: flawless ? "#facc15" : "#a5f3fc",
              })
              .setOrigin(0.5);

            // Personal best (per lesson, localStorage). Celebrate a new record.
            let best = 0;
            const bestKey = "pa-best-" + activeLesson;
            try {
              best = parseInt(localStorage.getItem(bestKey) || "0", 10) || 0;
            } catch (e) {}
            const isNewBest = d.score > best;
            if (isNewBest) {
              try {
                localStorage.setItem(bestKey, String(d.score));
              } catch (e) {}
              const nb = this.add
                .text(W / 2, 430, "🎉 NEW BEST SCORE!", {
                  fontFamily: "Nunito, Segoe UI, sans-serif",
                  fontSize: "22px",
                  fontStyle: "bold",
                  color: "#34d399",
                })
                .setOrigin(0.5);
              if (!JUICE.reduceMotion) {
                nb.setScale(0);
                this.tweens.add({
                  targets: nb,
                  scale: 1,
                  ease: "Back.Out",
                  duration: 360,
                  delay: 500,
                  onStart: () => JUICE.confetti(this, 1),
                });
              }
            } else if (best > 0) {
              this.add
                .text(W / 2, 430, "Best: " + best + " — beat it next time!", {
                  fontFamily: "Nunito, Segoe UI, sans-serif",
                  fontSize: "17px",
                  color: "#cbd5e1",
                })
                .setOrigin(0.5);
            }
            if (flawless && !JUICE.reduceMotion) JUICE.confetti(this, 1);

            try {
              window.EduPulse &&
                EduPulse.record({
                  activityTitle: lessonTitle + " — Practice Arcade",
                  score: d.score,
                  stars,
                  lesson: activeLesson,
                  tier,
                  problemsAttempted: d.total,
                  items: d.items || [],
                });
            } catch (e) {}
            srSay(
              "Review complete. " + d.correct + " of " + d.total + " correct. " + stars + " stars.",
            );

            // Next-step CTAs. From a single lesson, offer the whole-unit review
            // as a "next level" so the arcade feels like a progression, not a
            // dead end. Otherwise just Play Again.
            const canUnit = !isReviewMode && worldUnit > 0;
            if (canUnit) {
              makeButton(this, W / 2 - 150, 512, 264, 56, t("playAgain"), () =>
                window.location.reload(),
              );
              makeButton(this, W / 2 + 150, 512, 264, 56, t("unitReviewBtn"), () => {
                window.location.href = "/math/games/practice-arcade/?unit=" + worldUnit;
              });
            } else {
              makeButton(this, W / 2, 512, 240, 56, t("playAgain"), () => window.location.reload());
            }
            makeLink(this, W / 2 - 110, 578, "🗺️ " + (lang === "es" ? "Mapa" : "World map"), () => {
              window.location.href = "/math/games/practice-arcade/map.html";
            });
          }
        }

        // ── Shared helpers (scene-agnostic) ───────────────────────────────────
        function drawStars(scene) {
          // Layered, world-themed backdrop for a polished, "AAA level" feel:
          //   1. vertical gradient in the world's colors
          //   2. two soft radial "nebula" glow blobs for depth
          //   3. a fixed field of fine star dots (sparkle, contrast-safe)
          //   4. large translucent math glyphs that drift slowly (parallax life)
          //   5. a vignette that darkens the edges so foreground pops
          // Everything motion-related is gated by prefers-reduced-motion.
          const reduce =
            window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const bg = scene.add.graphics();
          bg.fillGradientStyle(PALETTE.bgTop, PALETTE.bgTop, PALETTE.bgBot, PALETTE.bgBot, 1);
          bg.fillRect(0, 0, W, H);

          // Nebula glow blobs — a lighter tint of the accent, very soft.
          const blob = (cx, cy, rad, color, alpha) => {
            const b = scene.add.graphics();
            const steps = 6;
            for (let s = steps; s >= 1; s--) {
              b.fillStyle(color, (alpha * (0.16 * (steps - s + 1))) / steps);
              b.fillCircle(cx, cy, (rad * s) / steps);
            }
            return b;
          };
          blob(W * 0.22, H * 0.28, 260, PALETTE.accent, 1);
          blob(W * 0.82, H * 0.78, 300, PALETTE.tileHi, 0.9);

          // Fine star dots.
          const g = scene.add.graphics();
          g.fillStyle(0xffffff, 0.26);
          const n = reduce ? 34 : 78;
          for (let i = 0; i < n; i++)
            g.fillCircle(
              Phaser.Math.Between(0, W),
              Phaser.Math.Between(0, H),
              Phaser.Math.Between(1, 2),
            );

          // Drifting background glyphs (the world's math-symbol motif).
          const glyphs = (worldGlyphs || "÷×+−").split("");
          const count = reduce ? 5 : 9;
          for (let i = 0; i < count; i++) {
            const ch = glyphs[i % glyphs.length];
            const gx = Phaser.Math.Between(60, W - 60);
            const gy = Phaser.Math.Between(60, H - 60);
            const size = Phaser.Math.Between(46, 104);
            const gl = scene.add
              .text(gx, gy, ch, {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: size + "px",
                fontStyle: "bold",
                color: "#ffffff",
              })
              .setOrigin(0.5)
              .setAlpha(0.06)
              .setDepth(-1);
            if (!reduce) {
              scene.tweens.add({
                targets: gl,
                y: gy - Phaser.Math.Between(18, 40),
                angle: Phaser.Math.Between(-8, 8),
                alpha: 0.11,
                duration: Phaser.Math.Between(4200, 7200),
                yoyo: true,
                repeat: -1,
                ease: "Sine.InOut",
                delay: i * 260,
              });
            }
          }

          // Edge vignette (four soft dark bands) so the play area reads forward.
          const vg = scene.add.graphics().setDepth(-1);
          vg.fillStyle(0x000000, 0.16);
          const band = 90;
          vg.fillRect(0, 0, W, band);
          vg.fillRect(0, H - band, W, band);
          vg.fillRect(0, 0, band, H);
          vg.fillRect(W - band, 0, band, H);
        }
        // Glossy rounded "pill" button with a drop shadow and a springy press.
        // Returns { bg, t } where bg is the interactive container and t the label,
        // both absolute-positioned so callers can add either to a layer.
        function makeButton(scene, x, y, w, h, text, onClick) {
          const c = scene.add.container(x, y).setSize(w, h);
          const rad = h / 2;
          const shadow = scene.add.graphics();
          shadow.fillStyle(0x0a0a2a, 0.42);
          shadow.fillRoundedRect(-w / 2, -h / 2 + 4, w, h, rad);
          const face = scene.add.graphics();
          const paint = (top, bot) => {
            face.clear();
            face.fillGradientStyle(top, top, bot, bot, 1);
            face.fillRoundedRect(-w / 2, -h / 2, w, h, rad);
            face.fillStyle(0xffffff, 0.18);
            face.fillRoundedRect(-w / 2 + 4, -h / 2 + 4, w - 8, (h - 8) * 0.44, rad);
          };
          paint(0x38e0f0, 0x2563eb);
          const hit = scene.add
            .rectangle(0, 0, w, h, 0xffffff, 0.001)
            .setInteractive({ useHandCursor: true });
          c.add([shadow, face, hit]);
          const t = scene.add
            .text(x, y, text, {
              fontFamily: "Nunito, Segoe UI, sans-serif",
              fontSize: "22px",
              fontStyle: "bold",
              color: "#06283f",
            })
            .setOrigin(0.5);
          hit.on("pointerover", () => paint(0x67e8f9, 0x3b82f6));
          hit.on("pointerout", () => paint(0x38e0f0, 0x2563eb));
          hit.on("pointerdown", () => {
            if (!JUICE.reduceMotion)
              scene.tweens.add({ targets: [c, t], scale: 0.94, yoyo: true, duration: 90 });
            if (onClick) onClick();
          });
          return { bg: c, t };
        }
        function makeLink(scene, x, y, text, onClick) {
          const t = scene.add
            .text(x, y, text, {
              fontFamily: "Nunito, Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#7dd3fc",
            })
            .setOrigin(0.5)
            .setInteractive({ useHandCursor: true });
          t.on("pointerover", () => t.setColor("#bae6fd"));
          t.on("pointerout", () => t.setColor("#7dd3fc"));
          t.on("pointerdown", onClick);
          return t;
        }
        // Strip a teacher-facing differentiation prefix ("Level 2 Extension — ",
        // "Level 1: ", "Level 3 - ") from an authored title so only the
        // student-facing scenario remains. Returns "" for empty/undefined input.
        function stripTierLabel(s) {
          if (!s) return "";
          return String(s)
            .replace(/^\s*level\s*\d+\s*(?:extension)?\s*[—:–-]\s*/i, "")
            .trim();
        }
        // Map a 1-9 number to Phaser's digit key-code name (keydown-ONE … NINE).
        function keyName(n) {
          const names = [
            "",
            "ONE",
            "TWO",
            "THREE",
            "FOUR",
            "FIVE",
            "SIX",
            "SEVEN",
            "EIGHT",
            "NINE",
          ];
          return names[n] || "ONE";
        }

        // Init must survive deferred/async script execution (e.g. Cloudflare Rocket
        // Loader), which runs this script AFTER DOMContentLoaded has already fired —
        // a plain listener would never run and the loader would spin forever. Mirror
        // the readyState guard used by the engine-error block above.
        if (document.readyState === "loading") {
          window.addEventListener("DOMContentLoaded", loadLessonConfig);
        } else {
          loadLessonConfig();
        }
      } // end engine guard (typeof Phaser === "undefined")
    </script>
