      content="A calm, self-paced review lab that turns each lesson's practice into real interactive challenges — sort into bins, match pairs, choose the answer, and spot the mistake. No timers, no twitch."

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0f172a;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        /* Stop the browser from treating a drag as scroll/zoom on tablets, so
           Phaser receives the touch-drag gestures (drag-sort works on touch). */
        touch-action: none;
      }
      canvas {
        display: block;
        margin: 0 auto;
        touch-action: none;
      }
      canvas:focus-visible {
        outline: 3px solid #38bdf8;
        outline-offset: 4px;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #fff;
        z-index: 10;
        font-size: 18px;
        font-weight: 700;
        gap: 10px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
      /* Screen-reader live region (mirrors the prompt + result). */
      #pa-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

    <script>
      // Failsafe: the scene classes below are declared as
      // `class … extends Phaser.Scene`, evaluated the instant this script runs.
      // If the Phaser engine failed to load (blocked CDN fallback on a school
      // network, or a stale deploy missing the vendored file), that line throws
      // and aborts the whole script — so the DOMContentLoaded handler at the
      // bottom never registers and the loader spins on "Loading…" forever.
      // Guard the game behind an engine check: when Phaser is missing, show an
      // actionable error with a Reload button instead of a dead spinner.
      if (typeof Phaser === "undefined") {
        (function () {
          function render() {
            var loader = document.getElementById("loader");
            if (!loader) return;
            loader.innerHTML =
              '<div style="max-width:30rem;text-align:center;color:#e2e8f0;' +
              'font-family:system-ui,-apple-system,sans-serif;padding:1.5rem;line-height:1.5">' +
              '<div style="font-size:2.6rem;margin-bottom:.4rem" aria-hidden="true">🎮⚠️</div>' +
              '<div style="font-size:1.2rem;font-weight:800;margin-bottom:.5rem">' +
              "Couldn't load the game engine</div>" +
              '<div style="opacity:.85;margin-bottom:1.1rem">Check your internet ' +
              "connection, then reload. If you're on the school network and it keeps " +
              "failing, let your teacher know.</div>" +
              '<button type="button" onclick="location.reload()" ' +
              'style="background:#22d3ee;color:#0b1020;border:0;border-radius:.6rem;' +
              'padding:.65rem 1.3rem;font-size:1rem;font-weight:800;cursor:pointer">' +
              "Reload</button></div>";
          }
          if (document.readyState === "loading")
            document.addEventListener("DOMContentLoaded", render);
          else render();
        })();
      } else {
        // ── PRACTICE ARCADE — REVIEW LAB ──────────────────────────────────────
        // Universal per-lesson review game. Reads ?lesson=<id>, fetches that
        // lesson's /lessons/<id>/config.json, and turns each practice item into a
        // REAL interactive challenge matched to its type — sort into bins, match
        // pairs, choose the answer, spot the mistake. Calm and self-paced: no
        // timers, no falling targets, no aiming. Wrong MATH (not slow reflexes)
        // costs a life, and every miss shows the explanation so it teaches.
        const W = 960,
          H = 720;
        const MAX_ROUNDS = 8;
        // Bright, high-contrast, kid-friendly palette. Vivid indigo/violet field
        // with saturated tiles + cyan accent so white text stays legible. A fixed
        // scheme (not the per-lesson dark theme) guarantees consistent contrast;
        // per-lesson identity comes from the mascot emoji instead of color.
        const PALETTE = {
          bgTop: 0x6366f1, // indigo-500  (gradient top)
          bgBot: 0x7c3aed, // violet-600  (gradient bottom)
          panel: 0x312e81, // indigo-900 panel, reads under white text
          panelLine: 0x67e8f9, // cyan-300 border
          tile: 0x4f46e5, // indigo-600 tile
          tileHi: 0x6366f1, // indigo-500 hover
          good: 0x10b981, // emerald-500
          bad: 0xf43f5e, // rose-500
          accent: 0x22d3ee, // cyan-400
          gold: 0xfacc15, // amber-300
        };

        // ── WORLDS ──────────────────────────────────────────────────────────
        // Each unit becomes a distinct "world" — its own color scheme, drifting
        // background glyph motif, and boss guide — so every lesson's arcade feels
        // like a different themed level instead of one reskinned screen. Tiles
        // stay dark + saturated for white-text contrast; correctness colors
        // (good / bad / gold) are fixed across all worlds so ✓/✗ never shift
        // meaning. `good`/`bad`/`gold`/`panel` are inherited from PALETTE.
        const WORLDS = {
          1: {
            name: "Number Nebula",
            bgTop: 0x4338ca,
            bgBot: 0x6d28d9,
            panel: 0x312e81,
            panelLine: 0x67e8f9,
            tile: 0x4f46e5,
            tileHi: 0x6366f1,
            accent: 0x22d3ee,
            glyphs: "÷×+−",
            boss: "🦉",
          },
          2: {
            name: "Fraction Falls",
            bgTop: 0x0f766e,
            bgBot: 0x115e59,
            panel: 0x134e4a,
            panelLine: 0x5eead4,
            tile: 0x0d9488,
            tileHi: 0x14b8a6,
            accent: 0x2dd4bf,
            glyphs: "½¼¾⅓",
            boss: "🐢",
          },
          3: {
            name: "Ratio Reef",
            bgTop: 0x0369a1,
            bgBot: 0x1e40af,
            panel: 0x0c4a6e,
            panelLine: 0x7dd3fc,
            tile: 0x0284c7,
            tileHi: 0x0ea5e9,
            accent: 0x38bdf8,
            glyphs: "∶∷=≈",
            boss: "🐬",
          },
          4: {
            name: "Percent Peaks",
            bgTop: 0x7e22ce,
            bgBot: 0xa21caf,
            panel: 0x581c87,
            panelLine: 0xf0abfc,
            tile: 0x9333ea,
            tileHi: 0xa855f7,
            accent: 0xe879f9,
            glyphs: "%‰¢$",
            boss: "🦄",
          },
          5: {
            name: "Ember Expanse",
            bgTop: 0xb45309,
            bgBot: 0x9a3412,
            panel: 0x7c2d12,
            panelLine: 0xfdba74,
            tile: 0xc2410c,
            tileHi: 0xea580c,
            accent: 0xfb923c,
            glyphs: "△□×²",
            boss: "🦊",
          },
          6: {
            name: "Grove of Signs",
            bgTop: 0x15803d,
            bgBot: 0x166534,
            panel: 0x14532d,
            panelLine: 0xbbf7d0,
            tile: 0x16a34a,
            tileHi: 0x22c55e,
            accent: 0x4ade80,
            glyphs: "±<>≤",
            boss: "🐸",
          },
          7: {
            name: "Cipher Caverns",
            bgTop: 0x1e3a8a,
            bgBot: 0x334155,
            panel: 0x1e293b,
            panelLine: 0x93c5fd,
            tile: 0x1d4ed8,
            tileHi: 0x3b82f6,
            accent: 0x60a5fa,
            glyphs: "xyⁿ=",
            boss: "🦈",
          },
          8: {
            name: "Data Dunes",
            bgTop: 0xbe185d,
            bgBot: 0x9d174d,
            panel: 0x831843,
            panelLine: 0xfbcfe8,
            tile: 0xdb2777,
            tileHi: 0xec4899,
            accent: 0xf472b6,
            glyphs: "▁▄█σ",
            boss: "🦩",
          },
          9: {
            name: "Grid Galaxy",
            bgTop: 0x0e7490,
            bgBot: 0x1e40af,
            panel: 0x164e63,
            panelLine: 0x67e8f9,
            tile: 0x0891b2,
            tileHi: 0x06b6d4,
            accent: 0x22d3ee,
            glyphs: "•xy+",
            boss: "🤖",
          },
          10: {
            name: "Prism Peaks",
            bgTop: 0xa16207,
            bgBot: 0x854d0e,
            panel: 0x713f12,
            panelLine: 0xfde68a,
            tile: 0xca8a04,
            tileHi: 0xeab308,
            accent: 0xfacc15,
            glyphs: "■□³V",
            boss: "🐻",
          },
        };
        let worldUnit = 0; // 0 = default (mixed / unknown) → keep base indigo
        let worldName = "Practice Arcade";
        let worldGlyphs = "÷×+−";
        let worldBoss = "🎮";

        // Copy a world's colors into PALETTE (mutated in place so every renderer
        // that reads PALETTE.tile / .accent / … repaints in the world's scheme).
        function applyWorld(unit) {
          worldUnit = unit || 0;
          const w = WORLDS[worldUnit];
          if (!w) return;
          PALETTE.bgTop = w.bgTop;
          PALETTE.bgBot = w.bgBot;
          PALETTE.panel = w.panel;
          PALETTE.panelLine = w.panelLine;
          PALETTE.tile = w.tile;
          PALETTE.tileHi = w.tileHi;
          PALETTE.accent = w.accent;
          worldName = w.name;
          worldGlyphs = w.glyphs;
          worldBoss = w.boss;
        }
        // Pull the unit integer out of a lesson id ("4-3" → 4) or "unit-4" → 4.
        function unitOf(id) {
          const m = String(id || "").match(/(?:unit-)?(\d+)/);
          return m ? parseInt(m[1], 10) : 0;
        }

        let rounds = []; // rounds actually played (after tier filter)
        let allRounds = []; // every built round, before the Level-1/2 filter
        let lessonTitle = "Lesson";
        let activeLesson = "1-1";
        let isReviewMode = false; // true for unit / multi-lesson cumulative review
        let themeId = "default"; // lesson config "theme" id → palette
        let mascot = "🎮"; // lesson config "themeEmoji" → guide character
        // Difficulty tier the student chose on the Title screen. Level 1 = support,
        // Level 2 = enrichment; "both" plays everything. Persisted per device.
        let tier = "both";
        // Restore the player's last difficulty pick (mirrors the pa-lang block
        // below). Precedence: URL ?tier= (applied later in loadLessonConfig)
        // beats this stored choice, which beats the NTSignal suggestion.
        let tierSource = "default";
        try {
          const st = localStorage.getItem("pa-tier");
          if (st === "l1" || st === "l2" || st === "both") {
            tier = st;
            tierSource = "stored";
          }
        } catch (e) {}
        // Language for the engine's own UI + read-aloud voice. Math prompts stay in
        // English until a config supplies `_es` fields (then they localize too).
        let lang = "en";
        try {
          const sv = localStorage.getItem("pa-lang");
          if (sv === "es" || sv === "en") lang = sv;
        } catch (e) {}

        // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
        // game still runs if /assets/game-juice.js failed to load.
        const JUICE = window.GameJuice || {
          reduceMotion: false,
          audio: {
            unlock() {},
            tap() {},
            pop() {},
            correct() {},
            wrong() {},
            whoosh() {},
            fanfare() {},
            musicStart() {},
            musicStop() {},
          },
          theme: () => ({
            accent: "#38bdf8",
            accentN: 0x38bdf8,
            tileN: 0x334155,
            botN: 0x1e293b,
          }),
          bgGradient() {},
          popIn() {},
          tilePop() {},
          burst() {},
          confetti() {},
          shake() {},
          floatText() {},
          award() {},
        };

        function srSay(msg) {
          const el = document.getElementById("pa-sr");
          if (el) el.textContent = msg;
        }

        // ── i18n ─────────────────────────────────────────────────────────────
        // Engine UI strings in English + Spanish. Math prompts come from lesson
        // configs and are localized only when the config provides an `_es` field.
        const STR = {
          practiceArcade: { en: "PRACTICE ARCADE", es: "ARCADE DE PRÁCTICA" },
          unitReview: { en: "UNIT REVIEW", es: "REPASO DE UNIDAD" },
          start: { en: "START ▶", es: "EMPEZAR ▶" },
          back: { en: "← Back to lessons", es: "← Volver a las lecciones" },
          levelPick: { en: "Choose your level:", es: "Elige tu nivel:" },
          lvl1: { en: "Level 1 · Support", es: "Nivel 1 · Apoyo" },
          lvl2: { en: "Level 2 · Enrichment", es: "Nivel 2 · Reto" },
          lvlBoth: { en: "Everything", es: "Todo" },
          readAloud: { en: "🔊 Read aloud", es: "🔊 Leer en voz alta" },
          chooseAns: { en: "CHOOSE THE ANSWER", es: "ELIGE LA RESPUESTA" },
          sortGroups: { en: "SORT INTO GROUPS", es: "CLASIFICA EN GRUPOS" },
          matchPairs: { en: "MATCH THE PAIRS", es: "UNE LAS PAREJAS" },
          findMistake: { en: "FIND THE MISTAKE", es: "ENCUENTRA EL ERROR" },
          numberLine: { en: "PLACE IT ON THE LINE", es: "COLÓCALO EN LA RECTA" },
          buildIt: { en: "BUILD THE ANSWER", es: "ARMA LA RESPUESTA" },
          balance: { en: "BALANCE THE SCALE", es: "EQUILIBRA LA BALANZA" },
          check: { en: "CHECK ✓", es: "REVISAR ✓" },
          correct: { en: "Correct! ", es: "¡Correcto! " },
          yes: { en: "Yes! ", es: "¡Sí! " },
          tryAgain: { en: "Not quite — try again!", es: "Casi — ¡inténtalo otra vez!" },
          hint: { en: "Hint: ", es: "Pista: " },
          levelCleared: { en: "LEVEL CLEARED!", es: "¡NIVEL COMPLETADO!" },
          playAgain: { en: "PLAY AGAIN 🔁", es: "JUGAR OTRA VEZ 🔁" },
          unitReviewBtn: { en: "UNIT REVIEW ▶", es: "REPASO ▶" },
          score: { en: "Score", es: "Puntos" },
          of: { en: "of", es: "de" },
          correctWord: { en: "correct", es: "correctas" },
          steps: { en: "Steps", es: "Pasos" },
          guidedSteps: { en: "Guided Steps", es: "Pasos Guiados" },
          level1: { en: "Level 1 · Support", es: "Nivel 1 · Apoyo" },
          level2: { en: "Level 2 · Stretch", es: "Nivel 2 · Reto" },
          gotIt: { en: "GOT IT ✓", es: "¡ENTENDIDO! ✓" },
        };
        function t(key) {
          const e = STR[key];
          return e ? e[lang] || e.en : key;
        }

        // Read a string aloud with the Web Speech API. `textLang` is the language
        // of the TEXT (so we pick a matching voice) — defaults to the UI language.
        // Guarded: silent if speech synthesis is unavailable or muted.
        function speak(text, textLang) {
          try {
            if (window.NT_MUTED) return;
            const synth = window.speechSynthesis;
            if (!synth || !text) return;
            synth.cancel();
            const u = new SpeechSynthesisUtterance(String(text));
            u.lang = (textLang || lang) === "es" ? "es-ES" : "en-US";
            u.rate = 0.95;
            synth.speak(u);
          } catch (e) {}
        }

        // Pick the localized field of a config-derived round. Falls back to the
        // English value when no translation was authored.
        function loc(round, base) {
          if (lang === "es" && round[base + "Es"]) return round[base + "Es"];
          return round[base];
        }

        function shuffle(a) {
          const r = a.slice();
          for (let i = r.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [r[i], r[j]] = [r[j], r[i]];
          }
          return r;
        }
        // Tiny WebAudio blips (guarded; silent if no context / muted).
        const SFX = {
          ctx: null,
          on: true,
          init() {
            if (!this.ctx)
              try {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
              } catch (e) {}
          },
          beep(f, d, type = "sine", v = 0.15) {
            if (!this.ctx || !this.on) return;
            try {
              const o = this.ctx.createOscillator(),
                g = this.ctx.createGain();
              o.type = type;
              o.frequency.value = f;
              g.gain.setValueAtTime(v, this.ctx.currentTime);
              g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
              o.connect(g);
              g.connect(this.ctx.destination);
              o.start();
              o.stop(this.ctx.currentTime + d);
            } catch (e) {}
          },
          good() {
            this.beep(660, 0.1);
            this.beep(880, 0.14);
          },
          bad() {
            this.beep(200, 0.25, "sawtooth");
          },
          pick() {
            this.beep(520, 0.05, "square", 0.08);
          },
          win() {
            [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.beep(f, 0.2), i * 110));
          },
        };

        // Derive the played `rounds` from `allRounds` for the chosen tier. Called
        // at load and again whenever the student picks a level on the Title screen.
        // Never yields an empty list — an over-narrow filter falls back to all.
        function buildPlayList() {
          let pool = allRounds.slice();
          if (tier === "l1") pool = pool.filter((r) => r.tier !== 2);
          else if (tier === "l2") pool = pool.filter((r) => r.tier === 2);
          if (!pool.length) pool = allRounds.slice();
          if (isReviewMode) pool = shuffle(pool);
          rounds = pool.slice(0, isReviewMode ? 12 : MAX_ROUNDS);
          if (!rounds.length) rounds = fallbackRounds();
        }

        // ── Load content and build the round list ────────────────────────────
        // Three modes (in priority order):
        //   ?lessons=4-1,4-2   → cumulative review across the listed lessons
        //   ?unit=4            → cumulative review across every lesson in unit 4
        //   ?lesson=4-3        → single-lesson review (default)
        async function loadLessonConfig() {
          const params = new URLSearchParams(window.location.search);
          const unit = params.get("unit");
          const lessonsParam = params.get("lessons");
          let ids;
          let isGroup = true;
          if (lessonsParam) {
            ids = lessonsParam
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean);
          } else if (unit) {
            // Probe N-1 … N-9; missing lessons 404 and are skipped.
            ids = [];
            for (let k = 1; k <= 9; k++) ids.push(unit + "-" + k);
          } else {
            ids = [params.get("lesson") || "1-1"];
            isGroup = false;
          }

          const firstTitles = [];
          let gotTheme = false;
          for (const id of ids) {
            try {
              const res = await fetch(`/lessons/${encodeURIComponent(id)}/config.json`);
              if (!res.ok) continue;
              const data = await res.json();
              if (data.title) firstTitles.push(data.title);
              // Use the first lesson's theme as the visual identity for the run.
              if (!gotTheme) {
                if (data.theme) themeId = data.theme;
                if (data.themeEmoji) mascot = data.themeEmoji;
                gotTheme = true;
              }
              const opt = (data.practice && data.practice.optional) || [];
              opt.forEach((it, idx) => {
                let r = buildRound(it);
                if (!r) return;
                // Attach difficulty tier + any authored Spanish translations, then
                // opportunistically upgrade a plain choose item into a mechanic.
                r.tier = tierOf(it);
                r.standard = data.standard || "";
                r.promptEs = it.stem_es || it.instructions_es || it.label_es || it.title_es || "";
                r.whyEs = it.explanation_es || it.correctWork_es || "";
                r = synthesizeMechanic(r, idx);
                allRounds.push(r);
              });
            } catch (e) {
              /* skip unreachable lesson */
            }
          }

          // NOTE: the palette is intentionally a fixed bright scheme — we no
          // longer recolor it from the per-lesson (dark) theme, which produced
          // the muddy low-contrast look. Per-lesson identity = the mascot emoji.

          isReviewMode = isGroup;
          if (isGroup) {
            lessonTitle = unit ? "Unit " + unit + " Review" : "Mixed Review";
            activeLesson = unit ? "unit-" + unit : ids.join(",");
          } else {
            lessonTitle = firstTitles[0] || "Lesson";
            activeLesson = ids[0];
          }
          document.title = `${lessonTitle} — Practice Arcade`;

          // Pick the world (unit) that colors the whole run. Unit / lessons=
          // reviews use the unit param or the first listed lesson; a single
          // lesson uses its own leading number. A mascot from the config still
          // wins over the world's boss.
          applyWorld(unit ? parseInt(unit, 10) : unitOf(ids[0]));
          if (mascot === "🎮" && worldBoss) mascot = worldBoss;

          if (allRounds.length === 0) allRounds = fallbackRounds().map((r) => ((r.tier = 1), r));

                    ? r.misconceptionTags.filter(Boolean)

        // Per-attempt learning signal: device-local NTSignal record (drives
        // adaptive difficulty + hub suggestions) plus one fire-and-forget row
        // to /api/scores (feeds the teacher radar/heatmap; correct is 0/1 per
        // row, matching the engine3d reportScore convention). Never throws.
        function paSignal(round, correct, tag) {
          if (!round) return;
          try {
            if (window.NTSignal && window.NTSignal.record) {
              window.NTSignal.record({
                standard: round.standard || "",
                correct: !!correct,
                misconceptionTag: tag || undefined,
                lesson: activeLesson,
              });
            }
          } catch (e) {}
          try {
            if (typeof fetch === "function") {
              fetch("/api/scores", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  gameId: "practice-arcade",
                  standard: round.standard || "",
                  level: round.tier || 1,
                  points: correct ? 10 : 0,
                  correct: correct ? 1 : 0,
                  total: 1,
                  misconceptionTag: tag || "",
                }),
                keepalive: true,
                credentials: "omit",
              }).catch(() => {});
            }
          } catch (e) {}
        }

        // Normalize a config practice item into a round descriptor the engine
        // can render. Returns null for unsupported / malformed items.
        function buildRound(it) {
          if (!it || !it.type) return null;
          if (it.type === "multiple-choice") {
            if (!it.stem || !Array.isArray(it.choices) || it.choices.length < 2) return null;
            // Randomize the choice order. Every lesson config authors the correct
            // answer first (correctIndex 0) and the renderer keeps that order, so
            // without this the answer is always the top button — predictable and
            // not a real check for understanding. Track the correct option text
            // through the shuffle so correctIndex stays valid.
            const ci = it.correctIndex || 0;
            // Shuffle by identity (index-tagged), not by text, so a config with
            // two identical choice strings can't mis-locate the correct answer.
            const tagged = it.choices.map((text, idx) => ({ text, idx }));
            const shuffled = shuffle(tagged);
            const newIndex = shuffled.findIndex((t) => t.idx === ci);
            // Optional per-distractor misconception tags (config authoring:
            // misconceptionTags[i] names the wrong idea choice i represents).
            // Tracked through the shuffle by original index.
            const srcTags = Array.isArray(it.misconceptionTags) ? it.misconceptionTags : null;
            return {
              kind: "choose",
              prompt: it.stem,
              choices: shuffled.map((t) => t.text),
              correctIndex: newIndex < 0 ? 0 : newIndex,
              misconceptionTags: srcTags ? shuffled.map((t) => srcTags[t.idx] || null) : null,
              why: it.explanation || "",
            };
          }
          if (it.type === "drag-sort") {
            if (!Array.isArray(it.categories)) return null;
            let items = it.items;
            let cats = it.categories;
            // Tolerate the alternate schema where items are nested inside each
            // category ({categories:[{label, items:[...]}]}) instead of a flat
            // items[] with a category field. Flatten it into the standard shape.
            if (!Array.isArray(items)) {
              const nested = cats.some((c) => Array.isArray(c.items));
              if (!nested) return null;
              // A single nested category is an ORDERING task, not a sort — skip it
              // (it would collapse to one trivial bin); needs a dedicated mode.
              if (cats.length < 2) return null;
              items = [];
              cats.forEach((c) => {
                const id = c.id || c.label;
                (c.items || []).forEach((x) => {
                  const text = typeof x === "string" ? x : x && x.text;
                  if (text != null) items.push({ text: String(text), category: id });
                });
              });
            }
            if (!Array.isArray(items)) return null;
            return {
              kind: "sort",
              prompt: it.instructions || "Sort each tile into the right bin.",
              items: items
                .filter((x) => x && x.text != null && x.category != null)
                .map((x) => ({ text: String(x.text), category: x.category })),
              categories: cats.map((c) => ({
                id: c.id || c.label,
                label: c.label || c.id,
              })),
              why: "",
            };
          }
          if (it.type === "matching-game") {
            if (!Array.isArray(it.pairs) || it.pairs.length < 2) return null;
            return {
              kind: "match",
              // Configs author the matching prompt under `label`; older ones use
              // `instructions`. Fall back to a generic line only if both are absent
              // (otherwise the authored question is silently replaced — the bug
              // that made nearly every lesson read "Match each card to its partner").
              prompt: it.instructions || it.label || it.prompt || "Match each card to its partner.",
              pairs: it.pairs
                .filter((p) => p && p.term != null && p.match != null)
                .slice(0, 5)
                .map((p) => ({ term: String(p.term), match: String(p.match) })),
              why: "",
            };
          }
          if (it.type === "error-analysis") {
            if (!Array.isArray(it.workedExample) || it.errorStep == null) return null;
            return {
              kind: "fixit",
              // Titles are authored with a teacher-facing tier tag
              // ("Level 2 Extension — Catch the Mistake"); strip that prefix so
              // students see only the scenario, not the differentiation label.
              prompt: stripTierLabel(it.title) || "Find the step with the mistake.",
              steps: it.workedExample.map((s) => ({
                label: s.label || "",
                work: s.work || "",
              })),
              errorStep: it.errorStep,
              why: it.correctWork || "",
            };
          }
          // ── Native math-as-mechanic types (also produced by synthesis below) ──
          if (it.type === "number-line") {
            const target = Number(it.target);
            const min = Number(it.min),
              max = Number(it.max);
            if (![target, min, max].every(Number.isFinite) || min >= max) return null;
            return {
              kind: "numline",
              prompt: it.stem || "Drag the marker to the right value.",
              min,
              max,
              target,
              step: Number(it.step) || (max - min) / 10,
              tol: Number(it.tolerance) || 0,
              unit: it.unit || "",
              why: it.explanation || "",
            };
          }
          if (it.type === "build-expression") {
            const answer = normTokens(it.answer);
            if (!answer.length || !Array.isArray(it.tokens)) return null;
            return {
              kind: "build",
              prompt: it.stem || "Tap the pieces to build the answer.",
              tokens: it.tokens.map(String),
              answer,
              why: it.explanation || "",
            };
          }
          if (it.type === "balance-scale") {
            const equals = Number(it.equals);
            const target = Number(it.target);
            const min = Number(it.min),
              max = Number(it.max);
            if (![equals, target, min, max].every(Number.isFinite)) return null;
            return {
              kind: "balance",
              prompt: it.stem || "Set the value so the scale balances.",
              expr: it.expr || "x",
              equals,
              target,
              min,
              max,
              step: Number(it.step) || 1,
              why: it.explanation || "",
            };
          }
          return null;
        }

        // Split an expression answer ("2 × 3 × 3 × 5" or ["2","3","3","5"]) into a
        // normalized token multiset for order-insensitive checking.
        function normTokens(answer) {
          if (Array.isArray(answer)) return answer.map((x) => String(x).trim()).filter(Boolean);
          if (answer == null) return [];
          return String(answer)
            .split(/[×*·xX]/)
            .map((s) => s.trim())
            .filter(Boolean);
        }

        // Difficulty tier of a config item: explicit `level`/`tier`, else a title/
        // label hint ("Level 2", "Extension", "Enrichment", "Challenge") → 2, else 1.
        function tierOf(it) {
          const n = Number(it.level || it.tier);
          if (n === 1 || n === 2) return n;
          const hay = ((it.title || "") + " " + (it.label || "")).toLowerCase();
          if (/level\s*2|extension|enrichment|challenge|stretch/.test(hay)) return 2;
          return 1;
        }

        // Opportunistically turn a numeric or product multiple-choice item into a
        // richer mechanic so the new game types appear across existing lessons —
        // but ONLY when the transform is unambiguous, so no wrong answers are ever
        // synthesized. `salt` (item index) decides whether to transform, keeping a
        // mix of choose + mechanic rounds. Returns the original round otherwise.
        function synthesizeMechanic(round, salt) {
          if (!round || round.kind !== "choose") return round;
          const choices = round.choices || [];
          const correct = choices[round.correctIndex];
          if (correct == null) return round;
          const stem = String(round.prompt || "");
          const computes = /\b(what is|how many|value of|equals?|find|equal to|=)\b/i.test(stem);
          // (A) product → BUILD THE ANSWER (factor/expression assembly)
          const prod = normTokens(correct);
          const isProduct = /[×*·]/.test(String(correct)) && prod.length >= 2;
          if (isProduct && salt % 2 === 0) {
            // Distractor tokens: unique factors from the wrong choices.
            const extra = [];
            choices.forEach((c, i) => {
              if (i === round.correctIndex) return;
              normTokens(c).forEach((tk) => {
                if (!prod.includes(tk) && !extra.includes(tk) && /^\d+$/.test(tk)) extra.push(tk);
              });
            });
            const tokens = shuffle(prod.concat(extra.slice(0, 3)));
            return {
              kind: "build",
              prompt: stem,
              tokens,
              answer: prod,
              why: round.why,
              tier: round.tier,
            };
          }
          // (B) numeric answer + computational stem → PLACE IT ON THE LINE
          const nums = choices.map((c) => Number(String(c).replace(/[^0-9.\-]/g, "")));
          const targetN = Number(String(correct).replace(/[^0-9.\-]/g, ""));
          const allNumeric = nums.every(Number.isFinite) && Number.isFinite(targetN);
          if (allNumeric && computes && salt % 3 === 0) {
            const lo = Math.min(...nums, targetN);
            const hi = Math.max(...nums, targetN);
            const pad = Math.max(1, Math.round((hi - lo) * 0.25)) || 2;
            const isInt = nums.every((n) => Number.isInteger(n)) && Number.isInteger(targetN);
            const min = isInt ? Math.floor(lo - pad) : lo - pad;
            const max = isInt ? Math.ceil(hi + pad) : hi + pad;
            if (max > min) {
              return {
                kind: "numline",
                prompt: stem,
                min,
                max,
                target: targetN,
                step: isInt ? 1 : (max - min) / 20,
                tol: isInt ? 0 : (max - min) / 40,
                unit: "",
                why: round.why,
                tier: round.tier,
              };
            }
          }
          return round;
        }

        function fallbackRounds() {
          return [
            {
              kind: "choose",
              prompt: "Which number is prime?",
              choices: ["15", "21", "29", "35"],
              correctIndex: 2,
              why: "29 has only the factors 1 and 29, so it is prime.",

          ];
        }

              .rectangle(pmX, pmY, pmW, pmH, 0x1e1b4b, 0.9)
              .setOrigin(0, 0.5)
              .setStrokeStyle(2, PALETTE.panelLine, 0.7);
            this.powerFill = this.add
              .rectangle(pmX + 2, pmY, 0, pmH - 6, PALETTE.gold, 1)
              .setOrigin(0, 0.5);
            this.powerLabel = this.add
              .text(pmX + pmW + 8, pmY, "⚡", { fontSize: "16px" })
              .setOrigin(0, 0.5)
              .setAlpha(0.5);

            // ── Gem tray (bottom-left) ── one gem drops in per first-try solve,
            // so progress you earn stacks up somewhere you can see it grow.
            this.trayX = 40;
            this.trayY = H - 74;
            this.add
              .text(this.trayX, this.trayY - 26, "Gems", {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "13px",
                fontStyle: "bold",
                color: "#c7d2fe",
              })
              .setOrigin(0, 0.5);

            // Layer that holds per-round interactive objects (cleared each round)
            this.layer = this.add.container(0, 0);
            this.locked = false;

            // ── Reliable drag-sort pickup + carry + drop (registered ONCE) ─────
            // Phaser's per-object drag/pointer events on a container nested inside
            // another container are flaky: short/quick drags silently fail on
            // trackpads + touch Chromebooks, AND a tile mid-intro (alpha 0 during
            // its pop-in) is skipped by Phaser's hit test entirely — so tapping a
            // just-appeared tile grabs nothing (the recurring "can't drag it in"
            // report). So the WHOLE gesture — pickup, carry, drop — runs from
            // SCENE-level pointer events with our own geometric hit test, which
            // fire reliably on mouse AND touch and ignore alpha/scale/render state.
            // `this.sortTiles` is null outside sort rounds, so these are inert
            // elsewhere.
            this.input.on("pointerdown", (p) => {
              if (!this.sortTiles || this.carrying) return;
              // Nearest tile whose box is under the pointer. Staged tiles use their
              // full nominal size (an easy target even while popping in); tiles
              // already dropped in a bin use their packed on-screen size. Binned
              // tiles are pickable too, so a number can be dragged back OUT of a
              // box or straight into the other one.
              const wx = p.worldX,
                wy = p.worldY;
              let pick = null,
                pickD = Infinity;
              for (const t of this.sortTiles) {
                const c = t.parts;
                const hw = (t.assigned ? c.displayWidth : this.sortTileW || c.width) / 2 + 6;
                const hh = (t.assigned ? c.displayHeight : this.sortTileH || c.height) / 2 + 6;
                if (Math.abs(wx - c.x) <= hw && Math.abs(wy - c.y) <= hh) {
                  const d = Math.hypot(wx - c.x, wy - c.y);
                  if (d < pickD) {
                    pickD = d;
                    pick = t;
                  }
                }
              }
              if (pick) this.pickUpSortTile(pick, p);
            });
            this.input.on("pointermove", (p) => {
              // Number-line marker uses the SAME reliable scene-pointer approach
              // (not Phaser's flaky nested-container drag); nlOnMove is set while
              // the dot is held (see renderNumberLine) and null otherwise.
              if (this.nlOnMove) this.nlOnMove(p);
              const t = this.carrying;
              if (!t) return;
              if (Phaser.Math.Distance.Between(p.downX, p.downY, p.x, p.y) > 6) {
                // First real movement of a tile that started INSIDE a bin: pull it
                // out (free its slot, restore full size) and re-fit that bin so its
                // remaining tiles grow back, so it follows the finger. A pure tap
                // never unassigns — see pointerup.
                if (!this.carryMoved && t.assigned) {
                  const freed = this.unassignTile(t);
                  if (freed >= 0) this.layoutBin(freed);
                }
                this.carryMoved = true;
                this.highlightNearBin(t);
              }
              t.parts.x = p.worldX - (this.grabDX || 0);
              t.parts.y = p.worldY - (this.grabDY || 0);
            });
            this.input.on("pointerup", () => {
              this.nlOnMove = null; // release the number-line marker
              const t = this.carrying;
              if (!t) return;
              this.carrying = null;
              this.clearBinHover();
              t.parts.setDepth(0);
              if (!JUICE.reduceMotion)
                this.tweens.add({ targets: t.parts, scale: 1, duration: 120 });
              else t.parts.setScale(1);
              if (this.carryMoved) {
                // Real drag → drop into the nearest bin (forgiving) or snap home.
                this.dropTile(t);
              } else if (!t.assigned) {
                // Tap on a staged tile → keep it selected for tap-to-place.
                this.selectSortTile(t);
              }
              // Tap on a tile already in a bin → leave it where it is.
            });

            // Persistent, tier-aware "Guided Steps" helper — a calm workspace that
            // scaffolds HOW to attack the current round (process, never the answer).
            this.stepsBtn = makeButton(this, 92, H - 30, 150, 40, "🪜 " + t("steps"), () =>
              this.openSteps(),
            );

            this.updateHUD();
            this.startRound();
          }

          // Highlight the bin the carried tile is currently nearest to, so the
          // drop target is obvious while dragging.
          highlightNearBin(t) {
            if (!this.bins) return;
            const gx = t.parts.x,
              gy = t.parts.y;
            let best = -1,
              bd = Infinity;
            this.bins.forEach((b, i) => {
              const d = Math.hypot(gx - b.x, gy - b.y);
              if (d < bd) {
                bd = d;
                best = i;
              }
            });
            this.bins.forEach((b, i) => {
              if (b.hi) b.hi.setVisible(i === best);
            });
          }
          clearBinHover() {
            (this.bins || []).forEach((b) => {
              if (b.hi) b.hi.setVisible(false);
            });
          }

          // Tier-aware guided steps for the current round. Pure PROCESS scaffolds
          // — deliberately no literal answer / `why` text (scaffold, not giveaway).
          guidedSteps(r) {
            const isL2 = tier === "l2" || r.tier === 2;
            const s = [];
            if (r.kind === "sort") {
              const labels = (r.categories || []).map((c) => c.label).join("   vs   ");
              s.push("Read what each tile says.");
              s.push("Ask: which group does it fit? Boxes: " + labels + ".");
              s.push(
                "Tap a tile, then tap its box — or drag it in. (Keys 1–" +
                  (r.categories || []).length +
                  " work too.)",
              );
              s.push("When every tile is placed, press CHECK ✓.");
            } else if (r.kind === "fixit") {
              s.push("Work the problem yourself, one step at a time.");
              s.push("Compare each step to your own work.");
              s.push("Tap the FIRST step where the numbers stop matching.");
            } else if (r.kind === "build") {
              s.push("Look closely at the answer you must make.");
              s.push("Tap the pieces in order to build it; tap a placed piece to take it back.");
              s.push("Check every piece is used, then submit.");
            } else if (r.kind === "numline") {
              s.push("Find the two labels your value sits between.");
              s.push("Count the tick marks to land exactly on it.");
              s.push("Drag the marker there, then check.");
            } else if (r.kind === "balance") {
              s.push("Both sides of the scale must be equal.");
              s.push("Change your side a little at a time until it is level.");
            } else {
              s.push("Read the question slowly — say it in your own words.");
              s.push("Rule out the choices you know are wrong first.");
              s.push("Pick the choice that must be true, then tap it.");
            }
            s.push(
              isL2
                ? "🚀 Stretch: once you solve it, explain WHY it works — could you prove it another way?"
                : "🧩 Take your time — no timer. Tap 🔊 to hear the prompt, or use the hint if stuck.",
            );
            return s;
          }

          // Open the guided-steps workspace overlay for the current round.
          openSteps() {
            if (this.stepsPanel) {
              this.closeSteps();
              return;
            }
            const r = rounds[this.idx];
            if (!r) return;
            JUICE.audio.tap();
            const steps = this.guidedSteps(r);
            const isL2 = tier === "l2" || r.tier === 2;
            const panel = this.add.container(0, 0).setDepth(120);
            const shade = this.add.rectangle(W / 2, H / 2, W, H, 0x0b1020, 0.62).setInteractive();
            shade.on("pointerdown", () => this.closeSteps());
            panel.add(shade);
            const pw = Math.min(680, W - 80);
            const ph = Math.min(H - 90, 150 + steps.length * 62);
            const card = this.add.graphics();
            card.fillStyle(PALETTE.panel, 0.98);
            card.lineStyle(3, isL2 ? PALETTE.gold : PALETTE.accent, 0.95);
            card.fillRoundedRect(W / 2 - pw / 2, H / 2 - ph / 2, pw, ph, 18);
            card.strokeRoundedRect(W / 2 - pw / 2, H / 2 - ph / 2, pw, ph, 18);
            panel.add(card);
            const title = this.add
              .text(W / 2, H / 2 - ph / 2 + 30, "🪜  " + t("guidedSteps"), {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "24px",
                fontStyle: "bold",
                color: "#ffffff",
              })
              .setOrigin(0.5);
            panel.add(title);
            const chip = this.add
              .text(W / 2, H / 2 - ph / 2 + 58, isL2 ? t("level2") : t("level1"), {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "13px",
                fontStyle: "bold",
                color: "#06283f",
                backgroundColor: isL2 ? "#facc15" : "#7dd3fc",
                padding: { x: 12, y: 4 },
              })
              .setOrigin(0.5);
            panel.add(chip);
            let sy = H / 2 - ph / 2 + 92;
            steps.forEach((txt, i) => {
              const isNote = /^[🚀🧩]/.test(txt);
              const num = this.add
                .text(W / 2 - pw / 2 + 34, sy, isNote ? "" : String(i + 1), {
                  fontFamily: "Nunito, Segoe UI, sans-serif",
                  fontSize: "20px",
                  fontStyle: "bold",
                  color: isL2 ? "#facc15" : "#7dd3fc",
                })
                .setOrigin(0.5, 0);
              const body = this.add
                .text(W / 2 - pw / 2 + 62, sy, txt, {
                  fontFamily: "Nunito, Segoe UI, sans-serif",
                  fontSize: "16px",
                  color: isNote ? "#fde68a" : "#e8edff",
                  wordWrap: { width: pw - 96 },
                })
                .setOrigin(0, 0);
              panel.add(num);
              panel.add(body);
              sy += Math.max(52, body.height + 16);
            });
            const cb = makeButton(this, W / 2, H / 2 + ph / 2 - 30, 150, 42, t("gotIt"), () =>
              this.closeSteps(),
            );
            panel.add(cb.bg);
            panel.add(cb.t);
            this.stepsPanel = panel;
            srSay(t("guidedSteps") + ". " + steps.join(". "));
          }
          closeSteps() {
            if (!this.stepsPanel) return;
            this.stepsPanel.destroy();
            this.stepsPanel = null;
          }

          // Charge the power meter on a first-try solve; at full, arm DOUBLE POINTS
          // for the next solve and discharge. Returns nothing — updateHUD paints it.
          chargePower() {
            if (this.doubled) return; // already armed; spend it before recharging
            this.power = Math.min(this.powerMax, this.power + 1);
            if (this.power >= this.powerMax) {
              this.doubled = true;
              this.power = this.powerMax;
              this.showBanner("⚡ DOUBLE POINTS! ⚡", "#facc15");
              JUICE.audio.pop();
              if (this.powerLabel) this.powerLabel.setAlpha(1).setScale(1.4);
            }
          }

          // Drop a collectible gem into the tray for a first-try solve.
          dropGem() {
            const i = this.gems.length;
            const gx = this.trayX + 10 + (i % 12) * 22;
            const gy = this.trayY + Math.floor(i / 12) * 22;
            const gem = this.add.text(gx, gy - 120, "💎", { fontSize: "18px" }).setOrigin(0.5);
            this.gems.push(gem);
            if (JUICE.reduceMotion) {
              gem.y = gy;
              return;
            }
            this.tweens.add({
              targets: gem,
              y: gy,
              ease: "Bounce.Out",
              duration: 620 + i * 20,
            });
          }

          // Centered milestone banner that slides in, holds, and fades out.
          showBanner(text, color) {
            const b = this.add
              .text(W / 2, 210, text, {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "30px",
                fontStyle: "bold",
                color: color || "#ffffff",
                stroke: "#0b1020",
                strokeThickness: 5,
              })
              .setOrigin(0.5)
              .setDepth(60);
            if (JUICE.reduceMotion) {
              this.time.delayedCall(900, () => b.destroy());
              return;
            }
            b.setScale(0.4).setAlpha(0);
            this.tweens.add({
              targets: b,
              scale: 1,
              alpha: 1,
              ease: "Back.Out",
              duration: 320,
            });
            this.time.delayedCall(1050, () => {
              this.tweens.add({
                targets: b,
                alpha: 0,
                y: 170,
                duration: 340,
                onComplete: () => b.destroy(),
              });
            });
          }

          // Slide the mascot along the journey track toward the goal flag.
          advanceJourney() {
            if (!this.mascotObj) return;
            const total = Math.max(1, rounds.length);
            const x0 = 120,
              x1 = W - 90;
            const done = Math.min(this.idx + 1, total);
            const tx = x0 + ((x1 - x0) * done) / total;
            if (JUICE.reduceMotion) {
              this.mascotObj.x = tx;
              return;
            }
            this.tweens.add({
              targets: this.mascotObj,
              x: tx,
              duration: 500,
              ease: "Quad.InOut",
            });
          }

          startRound() {
            this.layer.removeAll(true);
            // Clear stale per-round key handlers so they can't fire on the
            // destroyed tiles of a previous round.
            this.input.keyboard.removeAllListeners();
            this.feedback.setAlpha(0);
            this.locked = false;
            this.tries = 0;
            this.revealCorrect = null;
            // Drop any half-carried sort tile from a previous round (defensive).
            this.carrying = null;
            this.carryMoved = false;
            this.nlOnMove = null;
            this.bins = null;
            this.sortTiles = null;
            // Input-settle window: ignore selection input for a beat after a round
            // renders. The pointer-UP that started the game (or advanced the last
            // round) can otherwise fall onto the new round's first interactive
            // object — a bin zone, choice tile, or match card — and register a
            // phantom answer the student never made. See settled(). Uses
            // performance.now() (wall clock) because the scene clock reads stale
            // during create(), before the first update tick.
            this.inputSettleUntil = (window.performance ? performance.now() : Date.now()) + 380;
            if (this.idx >= rounds.length) {
              this.finish();
              return;
            }
            const r = rounds[this.idx];
            this.progressText.setText("Round " + (this.idx + 1) + " / " + rounds.length);
            // Prompt panel sized to text (localized when a translation exists).
            this.promptText.setText(loc(r, "prompt"));
            const ph = Math.max(70, this.promptText.height + 30);
            this.promptPanel.clear();
            this.promptPanel.fillStyle(PALETTE.panel, 0.95);
            this.promptPanel.lineStyle(2, PALETTE.panelLine, 0.8);
            this.promptPanel.fillRoundedRect(80, 92, W - 160, ph, 14);
            this.promptPanel.strokeRoundedRect(80, 92, W - 160, ph, 14);
            this.promptText.setY(92 + ph / 2);

            // Mode badge — a "level type" tab on the prompt panel's top edge so
            // students instantly know what kind of challenge this is, in plain
            // words. Lives in this.layer, so it clears with the round.
            const modeMeta = {
              choose: { icon: "✅", key: "chooseAns" },
              sort: { icon: "🧩", key: "sortGroups" },
              match: { icon: "🔗", key: "matchPairs" },
              fixit: { icon: "🔍", key: "findMistake" },
              numline: { icon: "📏", key: "numberLine" },
              build: { icon: "🧱", key: "buildIt" },
              balance: { icon: "⚖️", key: "balance" },
            }[r.kind] || { icon: "✅", key: "chooseAns" };
            const accentHex = "#" + PALETTE.accent.toString(16).padStart(6, "0");
            const badge = this.add
              .text(150, 92, modeMeta.icon + "  " + t(modeMeta.key), {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "14px",
                fontStyle: "bold",
                color: "#06283f",
                backgroundColor: accentHex,
                padding: { x: 12, y: 5 },
              })
              .setOrigin(0.5);
            this.layer.add(badge);

            // Per-round read-aloud button (ESOL): speak the prompt on tap.
            const speaker = this.add
              .text(W - 104, 92, "🔊", {
                fontFamily: "Nunito, Segoe UI, sans-serif",
                fontSize: "20px",
                backgroundColor: "rgba(255,255,255,0.14)",
                padding: { x: 8, y: 5 },
              })
              .setOrigin(0.5)
              .setInteractive({ useHandCursor: true });
            speaker.on("pointerdown", () => speak(loc(r, "prompt")));
            this.layer.add(speaker);

            // Quick round-in pop of the prompt for a snappy transition feel.
            if (!JUICE.reduceMotion) {
              this.promptText.setScale(0.9).setAlpha(0.2);
              this.tweens.add({
                targets: this.promptText,
                scale: 1,
                alpha: 1,
                duration: 240,
                ease: "Back.Out",
              });
            }
            srSay("Round " + (this.idx + 1) + ". " + r.prompt);

            // Milestone cheer: a quick banner at the halfway mark and on the
            // final round to give the run a sense of shape (calm, no timer).
            const total = rounds.length;
            if (total >= 4 && this.idx === Math.floor(total / 2)) {
              this.showBanner("⭐ Halfway there!", "#38bdf8");
            } else if (total >= 3 && this.idx === total - 1) {
              this.showBanner("🏁 Last one — finish strong!", "#a3e635");
            }

            const kind = r.kind;
            if (kind === "sort") this.renderSort(r);
            else if (kind === "match") this.renderMatch(r);
            else if (kind === "fixit") this.renderFixit(r);
            else if (kind === "numline") this.renderNumberLine(r);
            else if (kind === "build") this.renderBuild(r);
            else if (kind === "balance") this.renderBalance(r);
            else this.renderChoose(r);
          }

          // True once the brief input-settle window after a round render has
          // passed — used to reject carried-over pointer/key events (see
          // startRound). Reduced-motion / very-fast play is unaffected: 380ms is
          // shorter than the time to read any prompt.
          settled() {
            return (
              (window.performance ? performance.now() : Date.now()) >= (this.inputSettleUntil || 0)
            );
          }

          // Resolve a round. Correct → reward + advance. Wrong → NO penalty and
          // NO advance: the student gets a hint and tries again until they solve
          // it (calm, no-fail practice). First-try solves drive the star score.
          resolve(correct, why) {
            if (this.locked) return;
            const w = why || rounds[this.idx].why || "";
            const cx = W / 2,
              cy = 300;
            if (correct) {
              this.locked = true;
              const firstTry = this.tries === 0;
              this.streak = firstTry ? this.streak + 1 : 0;
              if (firstTry) {
                this.correctCount++;
                this.chargePower();
                this.dropGem();
              }
              // Spend a charged DOUBLE-POINTS state on this solve.
              const doubling = this.doubled;
              let gained = (firstTry ? 100 : 40) + Math.min(this.streak, 5) * 20;
              if (doubling) {
                gained *= 2;
                this.doubled = false;
                this.power = 0;
                if (this.powerLabel) this.powerLabel.setAlpha(0.5).setScale(1);
              }
              this.score += gained;
              // Juice escalates with the streak: more particles, bigger shake,
              // a second burst + confetti once it's rolling.
              JUICE.audio.correct(this.streak);
              const n = 18 + Math.min(this.streak, 6) * 4;
              JUICE.burst(this, cx, cy, [0x34d399, PALETTE.accent, 0xffffff], n);
              if (this.streak >= 5) JUICE.burst(this, cx, cy + 60, [0xfacc15, 0xffffff], 16);
              JUICE.shake(this, 0.005 + Math.min(this.streak, 5) * 0.001);
              JUICE.floatText(
                this,
                cx,
                cy - 30,
                (doubling ? "⚡ +" : "+") + gained,
                doubling ? "#facc15" : "#34d399",
                doubling ? 48 : 40,
              );
              if (doubling) JUICE.confetti(this, 1);
              this.mascotReact(true);
              this.mascotSay(
                firstTry ? (this.streak >= 3 ? "🔥 On fire!" : "Nice!") : "Got it! 🎉",
              );
              const xp = 10 + Math.min(this.streak, 5) * 2;
              JUICE.award(xp, "practice-arcade");
              if (this.streak >= 2) JUICE.confetti(this, 1);
              this.flashEdge(PALETTE.good);
              this.feedback
                .setColor("#86efac")
                .setText((firstTry ? t("correct") : t("yes")) + w)
                .setAlpha(1);
              srSay("Correct. " + w);
              // Item-level telemetry: one record per solved round (attempts capture
              // struggle). Feeds the end-of-run EduPulse payload + a local log.
              this.logItem(rounds[this.idx], this.tries);
              paSignal(rounds[this.idx], true, null);
              this.updateHUD();
              this.advanceJourney();
              this.time.delayedCall(1100, () => {
                this.idx++;
                this.startRound();
              });
            } else {
              // Wrong: encourage + hint, keep the round open for another attempt.
              this.tries++;
              this.streak = 0;
              paSignal(rounds[this.idx], false, this.lastWrongTag || null);
              JUICE.audio.wrong();
              JUICE.shake(this, 0.006);
              this.mascotReact(false);
              this.mascotSay(this.tries >= 2 ? "Use the hint 👀" : "Try again 👀");
              this.flashEdge(PALETTE.bad);
              const msg = this.tries >= 2 && w ? t("hint") + w : t("tryAgain");
              this.feedback.setColor("#fde68a").setText(msg).setAlpha(1);
              srSay("Not quite. Try again. " + (this.tries >= 2 ? w : ""));
              this.updateHUD();
            }
          }

          // Record one solved item for the teacher gradebook / analytics. Buffered
          // on the scene and mirrored to a bounded localStorage ring so a teacher
          // report can surface which skills needed the most attempts.
          logItem(round, tries) {
            const rec = {
              lesson: activeLesson,
              index: this.idx,
              kind: round.kind,
              tier: round.tier || 1,
              standard: round.standard || "",
              // The last wrong distractor's authored misconception tag (if any) —
              // lets the teacher report say WHICH wrong idea needed the retries.
              tag: tries > 0 ? this.lastWrongTag || null : null,
              tries,
              firstTry: tries === 0,
              ts: Date.now(),
            };
            this.lastWrongTag = null;
            (this.itemLog = this.itemLog || []).push(rec);
            try {
              const key = "pa-itemlog";
              const buf = JSON.parse(localStorage.getItem(key) || "[]");
              buf.push(rec);
              localStorage.setItem(key, JSON.stringify(buf.slice(-300)));
            } catch (e) {}
          }

          finish() {
            JUICE.audio.musicStop();
            this.scene.start("Result", {
              score: this.score,
              correct: this.correctCount,
              total: rounds.length,
              items: this.itemLog || [],
            });
          }

          updateHUD() {
            this.scoreText.setText("Score: " + this.score);
            this.streakText.setText(this.streak > 1 ? "🔥 Streak " + this.streak : "");
            this.livesText.setText("⭐ " + this.correctCount + " / " + rounds.length);
            // Paint the power meter fill (gold when charging, cyan+pulse when armed).
            if (this.powerFill && this.powerBase) {
              const frac = this.doubled ? 1 : this.power / this.powerMax;
              const fullW = this.powerBase.width - 4;
              const targetW = Math.max(0, fullW * frac);
              this.powerFill.setFillStyle(this.doubled ? PALETTE.accent : PALETTE.gold, 1);
              if (JUICE.reduceMotion) {
                this.powerFill.width = targetW;
              } else {
                this.tweens.add({
                  targets: this.powerFill,
                  width: targetW,
                  duration: 260,
                  ease: "Quad.Out",
                });
              }
            }
          }

          flashEdge(color) {
            if (this.reduce) return;
            const r = this.add.rectangle(W / 2, H / 2, W, H, color, 0.22).setDepth(50);
            this.tweens.add({
              targets: r,
              alpha: 0,
              duration: 350,
              onComplete: () => r.destroy(),
            });
          }

          // ── Renderer: CHOOSE (multiple-choice / generic select) ────────────
          renderChoose(r) {
            const startY = 92 + Math.max(70, this.promptText.height + 30) + 50;
            const tileW = Math.min(560, W - 200);
            const gap = 66;
            const tiles = [];
            r.choices.forEach((c, i) => {
              const y = startY + i * gap;
              const t = this.makeTile(W / 2, y, tileW, 52, i + 1 + ".  " + c);
              this.layer.add(t.parts);
              tiles.push(t);
              t.bg.on("pointerover", () => !this.locked && t.bg.setFillStyle(PALETTE.tileHi));
              t.bg.on("pointerout", () => !this.locked && t.bg.setFillStyle(PALETTE.tile));
              t.bg.on("pointerdown", () => this.pickChoice(r, i, t));
              this.input.keyboard.on("keydown-" + keyName(i + 1), () => this.pickChoice(r, i, t));
            });
            // On a miss, flash the correct choice green so the answer is visible.
            this.revealCorrect = () => {
              const ct = tiles[r.correctIndex];
              if (ct) ct.bg.setFillStyle(PALETTE.good);
            };
            // Screen-reader: read out the options after the prompt.
            srSay(
              rounds[this.idx].prompt +
                ". Options: " +
                r.choices.map((c, i) => i + 1 + ", " + c).join("; ") +
                ". Press a number to choose.",
            );
          }
          pickChoice(r, i, t) {
            if (this.locked || !this.settled()) return;
            SFX.pick();
            const ok = i === r.correctIndex;
            t.bg.setFillStyle(ok ? PALETTE.good : PALETTE.bad);
            // Wrong pick: flash red, then reset so the student can try again.
            // Remember WHICH distractor was chosen — its authored misconception
            // tag flows into the item log, EduPulse, and the signal store.
            if (!ok) {
              this.lastWrongTag =
                (Array.isArray(r.misconceptionTags) && r.misconceptionTags[i]) || null;
              this.time.delayedCall(620, () => {
                if (!this.locked) t.bg.setFillStyle(PALETTE.tile);
              });
            }
            this.resolve(ok, r.why);
          }

          // ── Renderer: SORT (drag-sort into category bins) ──────────────────
          renderSort(r) {
            const cats = r.categories;
            // Big, easy drop targets — the bottom boxes fill most of the width so
            // tiles are simple to aim into and have room to land INSIDE the box.
            const binW = Math.min(300, (W - 120) / cats.length - 16);
            const binH = 208;
            const binY = H - 150;
            const totalW = cats.length * binW + (cats.length - 1) * 22;
            let bx = (W - totalW) / 2 + binW / 2;
            this.bins = [];
            cats.forEach((c) => {
              const g = this.add.graphics();
              g.fillStyle(PALETTE.panel, 0.9);
              g.lineStyle(2, PALETTE.accent, 0.7);
              g.fillRoundedRect(bx - binW / 2, binY - binH / 2, binW, binH, 12);
              g.strokeRoundedRect(bx - binW / 2, binY - binH / 2, binW, binH, 12);
              const lbl = this.add
                .text(bx, binY - binH / 2 + 18, c.label, {
                  fontFamily: "Nunito, Segoe UI, sans-serif",
                  fontSize: "16px",
                  fontStyle: "bold",
                  color: "#7dd3fc",
                  align: "center",
                  wordWrap: { width: binW - 16 },
                })
                .setOrigin(0.5, 0);
              // Bright drop-target glow, hidden until a carried tile hovers near
              // this box (see highlightNearBin) — makes the target obvious.
              const hi = this.add.graphics().setVisible(false);
              hi.lineStyle(4, PALETTE.gold, 1);
              hi.strokeRoundedRect(bx - binW / 2 - 3, binY - binH / 2 - 3, binW + 6, binH + 6, 14);
              hi.fillStyle(PALETTE.gold, 0.12);
              hi.fillRoundedRect(bx - binW / 2, binY - binH / 2, binW, binH, 12);
              this.layer.add(g);
              this.layer.add(hi);
              this.layer.add(lbl);
              this.bins.push({
                id: c.id,
                x: bx,
                y: binY,
                w: binW,
                h: binH,
                count: 0,
                hi,
              });
              // Touch-friendly: an invisible tappable zone over the box so a
              // student can TAP a tile then TAP a box to place it (canvas
              // touch-drag is unreliable on some classroom tablets/Chromebooks).
              const bi = this.bins.length - 1;
              const zone = this.add
                .zone(bx, binY, binW, binH)
                .setInteractive({ useHandCursor: true });
              zone.on("pointerup", () => this.placeHighlighted(bi));
              this.layer.add(zone);
              bx += binW + 22;
            });

            // Visible hint so the keyboard path (and drag) is discoverable.
            const hint = this.add
              .text(
                W / 2,
                binY - binH / 2 - 56,
                "Tap a number, then tap a box to place it — or drag it. " +
                  "(Keys 1–" +
                  cats.length +
                  " work too.) Then press CHECK.",
                {
                  fontFamily: "Nunito, Segoe UI, sans-serif",
                  fontSize: "13px",
                  color: "#e0e7ff",
                  align: "center",
                  wordWrap: { width: W - 160 },
                },
              )
              .setOrigin(0.5);
            this.layer.add(hint);

            // Items in a staging grid above the bins. Size tiles TO THEIR CONTENT:
            // short numbers ("99", "17") get a small tile — the old fixed ~260px
            // tiles were absurdly large ("too big"). Long expressions
            // ("½ × 10 × 3 = 15 sq ft") widen and wrap on a taller tile so nothing
            // overflows. Uniform per set (items in one sort are similar length).
            const items = shuffle(r.items);
            const rowY = 92 + Math.max(70, this.promptText.height + 30) + 34;
            const maxLen = Math.max(...items.map((it) => String(it.text).length));
            const tileW = Math.round(Math.min(240, Math.max(66, maxLen * 10 + 24)));
            // Height follows the wrapped text so long expressions don't overflow
            // the tile (short numbers stay compact).
            const charsPerLine = Math.max(6, Math.floor((tileW - 24) / 8.2));
            const lines = Math.max(1, Math.ceil(maxLen / charsPerLine));
            const tileH = Math.min(116, Math.max(44, lines * 20 + 22));
            // Fit as many per row as the width allows (up to 4), never more items.
            const perRow = Math.min(
              items.length,
              Math.max(1, Math.floor((W - 80) / (tileW + 22))),
              4,
            );
            const spacing = tileW + 22;
            const rowGap = tileH + 18;
            let ix = (W - (perRow - 1) * spacing) / 2;
            // Remember tile size so assignTile can grid placed tiles INSIDE a bin.
            this.sortTileW = tileW;
            this.sortTileH = tileH;
            this.sortTiles = [];
            this.sortHi = 0;
            items.forEach((it, i) => {
              const col = i % perRow;
              const row = Math.floor(i / perRow);
              const x = ix + col * spacing;
              const y = rowY + row * rowGap;
              const t = this.makeTile(x, y, tileW, tileH, it.text, "15px");
              t.homeX = x;
              t.homeY = y;
              t.data = it;
              t.assigned = null;
              this.layer.add(t.parts);
              // The child rect must NOT eat pointers — pickup/carry/drop is driven
              // entirely by the SCENE-level pointer handlers (registered once in
              // create) with our own geometric hit test. Container stays interactive
              // only for the hover hand-cursor affordance.
              t.bg.disableInteractive();
              t.parts.setInteractive(
                new Phaser.Geom.Rectangle(
                  -t.parts.width / 2,
                  -t.parts.height / 2,
                  t.parts.width,
                  t.parts.height,
                ),
                Phaser.Geom.Rectangle.Contains,
              );
              this.sortTiles.push(t);
            });
            this.highlightSort();

            // Keyboard: number keys 1..N drop the highlighted tile into bin N
            this.bins.forEach((b, bi) => {
              this.input.keyboard.on("keydown-" + keyName(bi + 1), () => this.placeHighlighted(bi));
            });
            // Keyboard users confirm with Enter (the CHECK button is pointer-only).
            this.input.keyboard.on("keydown-ENTER", () => this.checkSort(r));

            const cb = makeButton(this, W / 2, binY - binH / 2 - 28, 160, 42, "CHECK ✓", () =>
              this.checkSort(r),
            );
            this.layer.add(cb.bg);
            this.layer.add(cb.t);
          }
          highlightSort() {
            if (!this.sortTiles) return;
            // advance highlight to first unassigned
            let n = this.sortTiles.findIndex((t) => !t.assigned);
            this.sortHi = n < 0 ? 0 : n;
            this.sortTiles.forEach((t, i) =>
              t.bg.setStrokeStyle(i === this.sortHi && !t.assigned ? 4 : 0, 0xfacc15),
            );
          }
          // Tap-select a tile: make it the active (highlighted) one so a bin tap
          // or number key places it. Mirrors the keyboard highlight state.
          selectSortTile(t) {
            const i = this.sortTiles.indexOf(t);
            if (i < 0 || t.assigned) return;
            this.sortHi = i;
            this.sortTiles.forEach((tt, j) =>
              tt.bg.setStrokeStyle(j === i && !tt.assigned ? 4 : 0, 0xfacc15),
            );
            if (typeof srSay === "function")
              srSay(t.data.text + " selected. Tap a box to place it.");
          }
          // Place the currently highlighted tile into bin index bi. Shared by the
          // bin tap zones and the 1–N number keys.
          placeHighlighted(bi) {
            if (!this.settled()) return;
            const t = this.sortTiles[this.sortHi];
            if (t && !t.assigned) this.assignTile(t, bi);
          }
          // Grab a sort tile (staged OR already in a bin) under the pointer and
          // start carrying it. A grab-offset keeps it under the finger with no
          // lurch. Assigned tiles are only pulled out of their bin once the
          // gesture becomes a real drag (see pointermove), so a tap can't
          // accidentally empty a box.
          pickUpSortTile(t, p) {
            this.carrying = t;
            this.carryMoved = false;
            this.grabDX = p.worldX - t.parts.x;
            this.grabDY = p.worldY - t.parts.y;
            t.parts.setDepth(20);
            if (!JUICE.reduceMotion)
              this.tweens.add({ targets: t.parts, scale: 1.06, duration: 110 });
          }
          // Pull a tile out of whatever bin it sits in: free the slot, restore full
          // size, and mark it unassigned. Returns the freed bin index (or -1) so the
          // caller can re-fit that bin's remaining tiles when it's ready — callers
          // that also send tiles home must layoutBin AFTER positioning to avoid a
          // tween racing the home move. Shared by drag-out and the checkSort reset.
          unassignTile(t) {
            let bi = -1;
            if (t.binSlot != null) {
              bi = t.binSlot.bi;
              const bin = this.bins[bi];
              bin.count = Math.max(0, bin.count - 1);
              if (bin.tiles) bin.tiles = bin.tiles.filter((x) => x !== t);
              t.binSlot = null;
            }
            t.assigned = null;
            t.bg.setFillStyle(PALETTE.tile);
            t.parts.setScale(1);
            return bi;
          }
          dropTile(t) {
            // The container is positioned in absolute (layer) space while dragging.
            const gx = t.parts.x;
            const gy = t.parts.y;
            // Forgiving drop: pick the NEAREST bin and accept it if the release is
            // anywhere near that bin (a generous margin around the box) OR simply
            // in the lower "bins" zone. Kids shouldn't have to hit a small target
            // pixel-perfectly — getting close to the right box is enough.
            const MARGIN = 70;
            let target = -1;
            let bestD = Infinity;
            this.bins.forEach((b, bi) => {
              const d = Math.hypot(gx - b.x, gy - b.y);
              if (d < bestD) {
                bestD = d;
                target = bi;
              }
            });
            const b = target >= 0 ? this.bins[target] : null;
            const nearBox =
              b && Math.abs(gx - b.x) <= b.w / 2 + MARGIN && Math.abs(gy - b.y) <= b.h / 2 + MARGIN;
            // Also accept if released anywhere in the horizontal band of the bins
            // (so a drop that overshoots vertically still snaps to the nearest box).
            const inBinsBand = b && gy >= b.y - b.h / 2 - MARGIN;
            if (b && (nearBox || inBinsBand)) {
              this.assignTile(t, target);
            } else {
              // released up near the staging row — snap back home
              t.parts.x = t.homeX;
              t.parts.y = t.homeY;
            }
          }
          assignTile(t, bi) {
            if (t.assigned) return;
            JUICE.audio.pop();
            const b = this.bins[bi];
            t.assigned = b.id;
            const slot = b.count++;
            t.binSlot = { bi, slot }; // remembered so a wrong check can free it
            (b.tiles = b.tiles || []).push(t);
            this.layoutBin(bi);
            this.highlightSort();
          }
          // Grid + AUTO-FIT every tile already dropped in bin `bi` so the whole
          // stack always stays INSIDE the box — no matter how many tall (long-text)
          // tiles land in one bin, the tiles shrink together to fit rather than
          // spilling past the bottom edge.
          layoutBin(bi) {
            const b = this.bins[bi];
            const tiles = b.tiles || [];
            if (!tiles.length) return;
            const tw = this.sortTileW || 70,
              th = this.sortTileH || 44;
            const padX = 14,
              padBottom = 14,
              gap = 8,
              labelSpace = 40;
            const availW = b.w - padX * 2;
            const availH = b.h - labelSpace - padBottom;
            const cols = Math.max(1, Math.floor((availW + gap) / (tw + gap)));
            const rows = Math.ceil(tiles.length / cols);
            const gridW = Math.min(tiles.length, cols) * (tw + gap) - gap;
            const gridH = rows * (th + gap) - gap;
            // Shrink uniformly if the grid is wider/taller than the usable space.
            const scale = Math.min(1, availW / gridW, availH / gridH);
            const cw = (tw + gap) * scale,
              ch = (th + gap) * scale;
            tiles.forEach((tile, i) => {
              const col = i % cols,
                row = Math.floor(i / cols);
              const rowCount = Math.min(cols, tiles.length - row * cols);
              const rowW = rowCount * cw - gap * scale;
              const tx = b.x - rowW / 2 + cw / 2 + col * cw;
              const ty = b.y - b.h / 2 + labelSpace + (th * scale) / 2 + row * ch;
              // Kill any in-flight tween on this tile first — layoutBin re-runs as
              // each tile lands, and overlapping tweens on one target fight and can
              // settle at the wrong scale/position.
              this.tweens.killTweensOf(tile.parts);
              if (JUICE.reduceMotion) {
                tile.parts.x = tx;
                tile.parts.y = ty;
                tile.parts.setScale(scale);
              } else {
                this.tweens.add({
                  targets: tile.parts,
                  x: tx,
                  y: ty,
                  scale,
                  duration: 200,
                  ease: "Back.Out",
                });
              }
            });
          }
          checkSort(r) {
            if (this.locked) return;
            const unplaced = this.sortTiles.filter((t) => !t.assigned);
            if (unplaced.length) {
              this.feedback
                .setColor("#fde68a")
                .setText("Place every tile in a bin first.")
                .setAlpha(1);
              srSay("Place every tile in a bin first.");
              return;
            }
            const allRight = this.sortTiles.every((t) => t.assigned === t.data.category);
            this.sortTiles.forEach((t) =>
              t.bg.setFillStyle(t.assigned === t.data.category ? PALETTE.good : PALETTE.bad),
            );
            if (allRight) {
              this.resolve(true, "");
              return;
            }
            // Wrong: keep the correctly-placed tiles, send the misplaced (red)
            // ones home for another try. unassignTile frees each slot and re-fits
            // its bin so the tiles that stayed grow back into the freed space.
            this.resolve(false, "Move the red tiles to the right bin, then check.");
