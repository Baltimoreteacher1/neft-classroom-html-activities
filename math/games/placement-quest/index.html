<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/math-mobile.css" />
    <title>Math Placement Quest — Grade 6 Diagnostic Game</title>
    <meta name="description" content="Help the explorer navigate the grid by solving Grade 6 diagnostic math challenges." />
    <style>
      :root {
        --sky: #38bdf8;
        --emerald: #10b981;
        --indigo: #6366f1;
        --dark: #0f172a;
        --slate: #1e293b;
        --text: #f8fafc;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--dark);
        color: var(--text);
        font-family: 'Outfit', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
      }
      .container {
        max-width: 800px;
        width: 100%;
        background: var(--slate);
        border: 2px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.45);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 12px;
      }
      .header-bar h1 {
        font-size: 20px;
        color: var(--sky);
        font-weight: 800;
      }
      .stats-row {
        display: flex;
        gap: 16px;
        font-size: 14px;
        font-weight: 600;
      }
      .quest-map {
        background: #020617;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        justify-content: center;
      }
      .question-box {
        background: rgba(15,23,42,0.8);
        border: 1px solid var(--sky);
        border-radius: 12px;
        padding: 20px;
        font-size: 16px;
        line-height: 1.5;
      }
      .choices-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 16px;
      }
      .choice-btn {
        background: var(--slate);
        border: 1.5px solid rgba(255,255,255,0.15);
        border-radius: 8px;
        color: var(--text);
        padding: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        text-align: left;
      }
      .choice-btn:hover {
        background: rgba(56, 189, 248, 0.1);
        border-color: var(--sky);
      }
      .result-screen {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 16px;
        padding: 40px 20px;
      }
      .badge-svg {
        width: 120px;
        height: 120px;
      }
      @media (max-width: 600px) {
        .choices-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
    <link rel="stylesheet" href="/shared/save-resume/save-resume-styles.css" />
    <!-- nsr-injected:end -->
    <!-- gfx-injected:begin (shared game polish — tools/inject-game-fx.js) -->
    <link rel="stylesheet" href="/assets/game-fx.css" />
    <!-- gfx-injected:end -->
  </head>
  <body>
    <div class="container">
      <div class="header-bar">
        <h1>🧭 Math Placement Quest</h1>
        <div class="stats-row">
          <span>Question: <span id="q-num">1</span>/10</span>
          <span>Score: <span id="q-score">0</span></span>
        </div>
      </div>
      
      <!-- Stepping stones quest map SVG -->
      <div class="quest-map">
        <svg width="600" height="80" viewBox="0 0 600 80" style="background:#020617">
          <!-- Connective path line -->
          <path d="M 40 40 Q 150 15, 300 40 T 560 40" fill="none" stroke="#1e293b" stroke-width="6" stroke-dasharray="10 5" />
          
          <!-- Moving Explorer Character Icon -->
          <circle id="map-player" cx="40" cy="40" r="14" fill="#38bdf8" stroke="#fff" stroke-width="2" style="transition: all 0.5s ease" />
          
          <!-- Stepping stones -->
          <circle cx="40" cy="40" r="8" fill="#10b981" />
          <circle cx="100" cy="32" r="8" fill="#475569" id="stone-1" />
          <circle cx="160" cy="27" r="8" fill="#475569" id="stone-2" />
          <circle cx="220" cy="28" r="8" fill="#475569" id="stone-3" />
          <circle cx="280" cy="36" r="8" fill="#475569" id="stone-4" />
          <circle cx="340" cy="45" r="8" fill="#475569" id="stone-5" />
          <circle cx="400" cy="48" r="8" fill="#475569" id="stone-6" />
          <circle cx="460" cy="45" r="8" fill="#475569" id="stone-7" />
          <circle cx="510" cy="42" r="8" fill="#475569" id="stone-8" />
          <circle cx="560" cy="40" r="8" fill="#475569" id="stone-9" />
        </svg>
      </div>

      <!-- Play Screen -->
      <div id="play-screen" class="question-box">
        <p id="question-text" style="font-weight:700; font-size:17px; margin-bottom:12px;"></p>
        <div class="choices-grid" id="choices-container"></div>
      </div>

      <!-- Results Screen -->
      <div id="results-screen" class="result-screen">
        <svg class="badge-svg" viewBox="0 0 100 100">
          <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#6366f1" stroke="#fff" stroke-width="3" />
          <circle cx="50" cy="50" r="30" fill="#4f46e5" />
          <text x="50" y="58" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">👑</text>
        </svg>
        <h2 style="color:var(--emerald); font-size:26px; font-weight:800; margin-top:10px;">Quest Completed!</h2>
        <p style="font-size:16px; max-width:500px;" id="feedback-text"></p>
        <button onclick="window.location.reload()" class="choice-btn" style="text-align:center; background:var(--sky); color:#000; border:none; margin-top:20px; font-weight:800; padding:12px 30px;">Play Again</button>
      </div>
    </div>

    <script>
      const questions = [
        {
          q: "What is the greatest common factor (GCF) of 16 and 24?",
          c: ["4", "8", "16", "48"],
          a: 1,
          domain: "Unit 1: Prime Factors"
        },
        {
          q: "Compute: 12.45 + 3.8",
          c: ["12.83", "15.25", "16.25", "16.5"],
          a: 2,
          domain: "Unit 1: Decimals"
        },
        {
          q: "Divide: 3/4 ÷ 1/8",
          c: ["6", "3/32", "1/6", "4"],
          a: 0,
          domain: "Unit 2: Fraction Division"
        },
        {
          q: "A recipe uses 3 cups of flour for every 2 cups of sugar. What is the unit rate of flour per cup of sugar?",
          c: ["1.5 cups", "0.67 cups", "5 cups", "6 cups"],
          a: 0,
          domain: "Unit 3: Ratios & Rates"
        },
        {
          q: "A shirt is on sale for 25% off its original price of $40. What is the sale price?",
          c: ["$10", "$25", "$30", "$38"],
          a: 2,
          domain: "Unit 4: Percents"
        },
        {
          q: "Find the area of a triangle with a base of 8 cm and a height of 5 cm.",
          c: ["40 cm²", "20 cm²", "13 cm²", "10 cm²"],
          a: 1,
          domain: "Unit 5: Area"
        },
        {
          q: "Evaluate: 3² - 2 × 3",
          c: ["3", "15", "21", "9"],
          a: 0,
          domain: "Unit 6: Expressions & Exponents"
        },
        {
          q: "Solve for x: x + 9 = 25",
          c: ["34", "16", "14", "1.5"],
          a: 1,
          domain: "Unit 7: Equations"
        },
        {
          q: "Find the median of this data set: 3, 5, 8, 9, 12",
          c: ["7.4", "8", "9", "12"],
          a: 1,
          domain: "Unit 8: Statistics"
        },
        {
          q: "Which point lies in Quadrant II of the coordinate plane?",
          c: ["(2, 3)", "(-2, 3)", "(-2, -3)", "(2, -3)"],
          a: 1,
          domain: "Unit 9: Coordinate Plane"
        }
      ];

      // Coordinate nodes mapped to stones
      const coordinates = [
        {x: 40, y: 40},
        {x: 100, y: 32},
        {x: 160, y: 27},
        {x: 220, y: 28},
        {x: 280, y: 36},
        {x: 340, y: 45},
        {x: 400, y: 48},
        {x: 460, y: 45},
        {x: 510, y: 42},
        {x: 560, y: 40}
      ];

      let currentIdx = 0;
      let score = 0;

      function loadQuestion() {
        if (currentIdx >= questions.length) {
          showResults();
          return;
        }

        document.getElementById("q-num").textContent = currentIdx + 1;
        
        const q = questions[currentIdx];
        document.getElementById("question-text").textContent = q.q;
        
        const container = document.getElementById("choices-container");
        container.innerHTML = "";
        
        q.c.forEach((choice, index) => {
          const btn = document.createElement("button");
          btn.className = "choice-btn";
          btn.textContent = choice;
          btn.onclick = () => selectChoice(index);
          container.appendChild(btn);
        });
      }

      function selectChoice(index) {
        const q = questions[currentIdx];
        const correct = index === q.a;
        
        if (correct) {
          score += 1000;
          document.getElementById("q-score").textContent = score;
          
          // Color current stepping stone
          if (currentIdx > 0) {
            const stone = document.getElementById(`stone-${currentIdx}`);
            if (stone) stone.setAttribute("fill", "#10b981");
          }

          // Advance explorer icon on map
          currentIdx++;
          const nextCoord = coordinates[Math.min(currentIdx, coordinates.length - 1)];
          const player = document.getElementById("map-player");
          player.setAttribute("cx", nextCoord.x);
          player.setAttribute("cy", nextCoord.y);
          
          // Trigger correct effects
          document.body.classList.add('gfx-correct');
          setTimeout(() => document.body.classList.remove('gfx-correct'), 200);

          setTimeout(loadQuestion, 500);
        } else {
          // Play incorrect buzz, but let them choose again (guided learning)
          document.body.classList.add('gfx-wrong');
          setTimeout(() => document.body.classList.remove('gfx-wrong'), 200);
          
          alert("Incorrect. Think about the concept and try again!");
        }
      }

      function showResults() {
        document.getElementById("play-screen").style.display = "none";
        document.getElementById("results-screen").style.display = "flex";
        
        let placement = "Ratio Scout";
        if (score >= 9000) placement = "Math Overlord";
        else if (score >= 7000) placement = "Equation Knight";
        else if (score >= 5000) placement = "Fraction Champion";

        document.getElementById("feedback-text").innerHTML = `
          You scored <strong>${score} points</strong> and earned the <strong>${placement} Badge</strong>!<br><br>
          Your diagnostic indicates strong Grade 6 preparedness. Feel free to explore the full Curriculum Hub now!
        `;
        
        // Report final score to LMS
        if (window.parent && window.parent.postMessage) {
          window.parent.postMessage({
            type: 'game_completed',
            score: score,
            maxScore: 10000,
            completed: true
          }, '*');
        }
        
        // Celebrate!
        document.body.classList.add('won');
      }

      window.addEventListener("DOMContentLoaded", loadQuestion);
    </script>
    <!-- gfx-injected:begin (shared game polish — tools/inject-game-fx.js) -->
    <script src="/assets/game-fx.js" defer></script>
    <!-- gfx-injected:end -->
  </body>
</html>
