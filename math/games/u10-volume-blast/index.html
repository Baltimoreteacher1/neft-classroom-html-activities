<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/math-mobile.css" />
    <title>Volume Blast — Unit-Cube Stacker | Neft Teacher</title>
    <meta
      name="description"
      content="A calm build-it math game for Grade 6 lessons 10.1-10.5 (6.G.2): stack real unit cubes to build a rectangular prism. Set length, width, and height with steppers, watch L × W × H update live, and lock in the matching volume. Two levels: build to given sizes, or match a target volume and find a missing dimension."
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #061a14;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      canvas {
        display: block;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }
      canvas:focus-visible {
        outline: 3px solid #4fd18b;
        outline-offset: 4px;
        border-radius: 8px;
      }
      canvas:focus:not(:focus-visible) {
        outline: none;
      }
      /* Decorative drifting wireframe-cube field behind the Phaser canvas. */
      #vb-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(
          130% 90% at 50% 0%,
          #103a2c 0%,
          #0a241b 55%,
          #051209 100%
        );
      }
      #vb-bg-layer {
        position: absolute;
        inset: -6% -6%;
        will-change: transform;
        transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .vb-cube {
        position: absolute;
        border: 1.5px solid rgba(180, 255, 220, 0.35);
        border-radius: 3px;
        animation: vbDrift var(--d, 14s) linear infinite;
      }
      .vb-cube::after {
        content: "";
        position: absolute;
        top: -7px;
        left: -7px;
        right: 0;
        bottom: 0;
        border: 1.5px solid rgba(180, 255, 220, 0.18);
        border-radius: 3px;
      }
      @keyframes vbDrift {
        0% {
          transform: translateY(10px) rotate(0deg);
        }
        50% {
          transform: translateY(-14px) rotate(10deg);
        }
        100% {
          transform: translateY(10px) rotate(0deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #vb-bg-layer {
          transition: none !important;
          transform: none !important;
        }
        .vb-cube {
          animation: none !important;
        }
      }
      #vb-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script src="/games/vendor/phaser/phaser-3.80.1.min.js"></script>
    <script>
      // CDN fallback: if the local vendor copy failed, synchronously load Phaser
      // from a mirror (document.write blocks parsing so the mirror is ready
      // before the game script runs).
      if (typeof Phaser === "undefined") {
        document.write(
          '<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\/script>',
        );
      }
      // If both sources are unreachable, show a clear message instead of a blank page.
      window.addEventListener("load", function () {
        if (typeof Phaser === "undefined") {
          document.body.innerHTML =
            '<div style="font:600 18px/1.5 system-ui,sans-serif;padding:2rem;max-width:32rem;margin:3rem auto;text-align:center;color:#bdf5dd">⚠️ This game needs an internet connection to load. Please check your connection and refresh the page.</div>';
        }
      });
    </script>
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
    <link rel="stylesheet" href="/shared/save-resume/save-resume-styles.css" />
    <!-- nsr-injected:end -->
    <!-- gfx-injected:begin (shared game polish — tools/inject-game-fx.js) -->
    <link rel="stylesheet" href="/assets/game-fx.css" />
    <!-- gfx-injected:end -->
    <!-- Student Passport (meta-progression: lifetime XP / streak / badges) -->
    <link rel="stylesheet" href="/assets/lesson-passport.css" />
    <!-- Shared "game feel" layer (juice, audio, theme, progression) -->
    <script src="/assets/game-juice.js"></script>
    <!-- mobile-access-injected:begin (shared mobile a11y — tools/inject-mobile-access.js) -->
    <link rel="stylesheet" href="/assets/mobile-access.css" />
    <!-- mobile-access-injected:end -->
  </head>
  <body>
    <!-- Decorative drifting wireframe-cube field (behind the Phaser canvas). -->
    <div id="vb-bg" data-parallax aria-hidden="true">
      <div id="vb-bg-layer" data-parallax-layer></div>
    </div>
    <!-- Screen-reader live region mirrors the current question + result. -->
    <div id="vb-sr" role="status" aria-live="polite"></div>

    <script>
      // Decorative cube-field builder + pointer parallax (gameplay-neutral).
      (function () {
        var layer = document.getElementById("vb-bg-layer");
        if (!layer) return;
        var reduce =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < 16; i++) {
          var c = document.createElement("div");
          c.className = "vb-cube";
          var size = 18 + Math.round(Math.random() * 40);
          c.style.width = size + "px";
          c.style.height = size + "px";
          c.style.left = Math.round(Math.random() * 92) + "%";
          c.style.top = Math.round(Math.random() * 84) + "%";
          c.style.setProperty("--d", (11 + Math.random() * 8).toFixed(2) + "s");
          c.style.animationDelay = (-Math.random() * 14).toFixed(2) + "s";
          frag.appendChild(c);
        }
        layer.appendChild(frag);
        if (reduce) return;
        window.addEventListener(
          "pointermove",
          function (e) {
            var tx = (e.clientX / window.innerWidth - 0.5) * -22;
            var ty = (e.clientY / window.innerHeight - 0.5) * -14;
            layer.style.transform = "translate3d(" + tx + "px," + ty + "px,0)";
          },
          { passive: true },
        );
      })();
    </script>

    <script>
      // ════════════════════════════════════════════════════════════════════
      //  VOLUME BLAST — UNIT-CUBE STACKER   ·   Lessons 10.1-10.5 · 6.G.2
      //
      //  Math IS the mechanic (calm, no timer, no reflex). A rectangular prism
      //  is drawn as real stacked unit cubes. The student sets length, width,
      //  and height with three +/- steppers (or ← → to pick the active side and
      //  ↑ ↓ / A·D to change it). The prism REDRAWS with that many cubes and a
      //  live readout shows  L × W × H = volume. Lock In checks the build:
      //    • Level 1 (support)    — build a prism that is L long, W wide, H tall
      //                              (dims given; live L×W×H readout + hints).
      //    • Level 2 (enrichment) — build ANY prism with volume = target, OR
      //                              given the volume + two sides, find the third
      //                              (larger volumes, fewer hints).
      //  Wrong MATH (not slow hands) costs a life — and the prism redraws to the
      //  CORRECT cubes with the reason, so every miss teaches.
      // ════════════════════════════════════════════════════════════════════
      const W = 820,
        H = 600;
      const LS_KEY = "vb_cube_stacker_highscore";

      // Theme palette (green "volume lab").
      const C = {
        bg: 0x0a241b,
        panel: 0x123026,
        panelEdge: 0x2a5a44,
        btn: 0x1a4634,
        ink: "#eafff4",
        sub: "#a8d8c4",
        green: "#4fd18b",
        gold: "#ffcd4d",
        bad: "#ff8f8f",
        accentN: 0x4fd18b,
        goldN: 0xffcd4d,
        badN: 0xff6b6b,
        cubeTop: 0x5fe0a0,
        cubeLeft: 0x2a9d6f,
        cubeRight: 0x1c6f4d,
        cubeEdge: 0x0a3a28,
      };

      const DIM_MIN = 1,
        DIM_MAX = 6; // keep dims small so the cube drawing stays readable
      const TARGET_SOLVED = 10; // win condition
      const START_LIVES = 3;

      // Isometric unit-cube geometry (screen space; Scale.FIT maps to any size).
      const HW = 16, // half-width of a cube's top rhombus
        TH = 8, // quarter-height of the top rhombus
        CH = 18; // vertical rise of a cube
      const PRISM_CX = 410,
        PRISM_CY = 338;

      const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
      function shuffle(a) {
        const r = a.slice();
        for (let i = r.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [r[i], r[j]] = [r[j], r[i]];
        }
        return r;
      }
      function srSay(msg) {
        const el = document.getElementById("vb-sr");
        if (el) el.textContent = msg;
      }
      const reduceMQ =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)");
      const reducedMotion = () => !!(reduceMQ && reduceMQ.matches);

      // ── Shared "game feel" layer (guarded; safe no-ops if game-juice.js
      //    failed to load, so the game keeps working). ──
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          tap() {},
          pop() {},
          correct() {},
          wrong() {},
          whoosh() {},
          fanfare() {},
          musicStart() {},
          musicStop() {},
        },
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      // ── Local WebAudio blips (preserved shell SFX; silent without context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (
                window.AudioContext || window.webkitAudioContext
              )();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        click() {
          this.play("square", 720, 0.04, 0.07);
        },
        coin() {
          this.play("square", 1040, 0.05, 0.08);
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
        lose() {
          [400, 330, 260, 200].forEach((f, i) =>
            setTimeout(() => this.play("sawtooth", f, 0.3, 0.14), i * 170),
          );
        },
      };

      // ── Run state (level select + vocab gate) ──
      let vbLevel = 1; // 1 = support, 2 = enrichment
      let vbVocabSeen = false;

      // ── Vocabulary gate (repo rule: term + Level-1 definition + emoji shown
      //    BEFORE play). Five key words for volume of rectangular prisms. ──
      const VOCAB_TERMS = [
        {
          term: "Volume",
          def: "The amount of space inside a 3-D shape — how many unit cubes fill it. We measure it in cubic units.",
          emoji: "🧊",
        },
        {
          term: "Cubic unit",
          def: "One single unit cube — a 1 by 1 by 1 block. We count how many fit inside, written as u³ (cubed).",
          emoji: "⬛",
        },
        {
          term: "Length",
          def: "How long the box is — the number of cubes along one edge of the bottom.",
          emoji: "📏",
        },
        {
          term: "Width",
          def: "How deep the box is — the number of cubes along the other edge of the bottom.",
          emoji: "↔️",
        },
        {
          term: "Height",
          def: "How tall the box is — the number of cubes stacked up from the bottom.",
          emoji: "⬆️",
        },
      ];

      // ── Problem generator. The chosen level drives the framing. ──
      function genProblem(level) {
        if (level === 1) {
          let l, w, h;
          do {
            l = randInt(1, 6);
            w = randInt(1, 6);
            h = randInt(1, 6);
          } while (l * w * h < 2 || (l === 1 && w === 1 && h === 1));
          return {
            mode: "dims",
            l,
            w,
            h,
            V: l * w * h,
            start: { l: 1, w: 1, h: 1 },
            label: "Build the prism",
            prompt:
              "Build a prism that is " +
              l +
              " long, " +
              w +
              " wide, and " +
              h +
              " tall.",
            hint:
              "Set length to " +
              l +
              ", width to " +
              w +
              ", and height to " +
              h +
              ". Watch L × W × H grow.",
            why:
              l + " × " + w + " × " + h + " = " + l * w * h + " cubic units.",
          };
        }
        // Level 2 — alternate two enrichment framings.
        if (Math.random() < 0.55) {
          const a = randInt(2, 6),
            b = randInt(2, 6),
            c = randInt(2, 6);
          const V = a * b * c;
          return {
            mode: "volume",
            V,
            exa: { a, b, c },
            start: { l: 1, w: 1, h: 1 },
            label: "Match the volume",
            prompt: "Build ANY prism with a volume of " + V + " cubic units.",
            hint: "Find three numbers from 1–6 that multiply to " + V + ".",
            why: "For example, " + a + " × " + b + " × " + c + " = " + V + ".",
          };
        }
        const l = randInt(2, 6),
          w = randInt(2, 6),
          h = randInt(2, 6);
        const V = l * w * h;
        return {
          mode: "third",
          l,
          w,
          h,
          V,
          start: { l, w, h: 1 },
          label: "Find the missing height",
          prompt:
            "This prism holds " +
            V +
            " cubic units. Its base is " +
            l +
            " long and " +
            w +
            " wide. Build it to find the height.",
          hint: "Height = " + V + " ÷ (" + l + " × " + w + ").",
          why:
            V +
            " ÷ (" +
            l +
            " × " +
            w +
            ") = " +
            V +
            " ÷ " +
            l * w +
            " = " +
            h +
            ".",
        };
      }
      // Does a built {l,w,h} satisfy the target?
      function isCorrect(t, b) {
        const V = b.l * b.w * b.h;
        if (t.mode === "dims") return b.l === t.l && b.w === t.w && b.h === t.h;
        if (t.mode === "volume") return V === t.V;
        return b.l === t.l && b.w === t.w && V === t.V; // "third"
      }
      // The cubes to show after a wrong answer (the correct build).
      function correctBuild(t) {
        if (t.mode === "volume") return { l: t.exa.a, w: t.exa.b, h: t.exa.c };
        return { l: t.l, w: t.w, h: t.h };
      }
      function goalLine(t) {
        if (t.mode === "dims")
          return "Goal:  " + t.l + " × " + t.w + " × " + t.h;
        if (t.mode === "volume") return "Goal volume:  " + t.V + " u³";
        return (
          "Goal volume:  " + t.V + " u³   (base " + t.l + " × " + t.w + ")"
        );
      }
      // Expose generators for stress testing.
      window.VolumeBlast = { genProblem, isCorrect };

      // ════════════════════════════════════════════════════════════════════
      //  BOOT
      // ════════════════════════════════════════════════════════════════════
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ════════════════════════════════════════════════════════════════════
      //  TITLE
      // ════════════════════════════════════════════════════════════════════
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.cameras.main.setBackgroundColor(C.bg);

        // isometric prism emblem (drawn from the same cube look as gameplay)
        drawIsoCube(this.add.graphics(), cx, 118, 30, 15, 34);

        this.add
          .text(cx, 196, "VOLUME BLAST", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "58px",
            fontStyle: "900",
            color: "#eafff4",
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 242, "Unit-Cube Stacker", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            fontStyle: "bold",
            color: "#ffcd4d",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            300,
            "Stack unit cubes to BUILD a rectangular prism. Set the\nlength, width, and height — watch L × W × H — then Lock In.",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "17px",
              color: "#a8d8c4",
              align: "center",
              lineSpacing: 6,
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 350, "Grade 6 · Lessons 10.1–10.5 · Standard 6.G.2", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            fontStyle: "bold",
            color: "#4fd18b",
          })
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 382, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              fontStyle: "bold",
              color: "#ffcd4d",
            })
            .setOrigin(0.5);

        const start = () => {
          SFX.init();
          JUICE.audio.unlock();
          SFX.coin();
          this.scene.start("LevelSelect");
        };
        const btn = this.add
          .rectangle(cx, 446, 280, 56, 0x1f7a52)
          .setStrokeStyle(3, 0xffffff, 0.85)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 446, "▶  START", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "23px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        if (!reducedMotion())
          this.tweens.add({
            targets: [btn, btnT],
            scaleX: 1.04,
            scaleY: 1.04,
            duration: 850,
            yoyo: true,
            repeat: -1,
          });
        btn.on("pointerover", () => btn.setFillStyle(0x2a9d6a));
        btn.on("pointerout", () => btn.setFillStyle(0x1f7a52));
        btn.on("pointerdown", start);
        this.input.keyboard.on("keydown-SPACE", start);
        this.input.keyboard.on("keydown-ENTER", start);

        makeHubLink(this, cx, 522);
        srSay(
          "Volume Blast, Unit-Cube Stacker. A build-it game for the volume of " +
            "rectangular prisms, standard 6.G.2. Press start to choose a level.",
        );
      };

      // ════════════════════════════════════════════════════════════════════
      //  LEVEL SELECT  (Level 1 = support · Level 2 = enrichment)
      // ════════════════════════════════════════════════════════════════════
      function LevelSelectScene() {
        Phaser.Scene.call(this, "LevelSelect");
      }
      LevelSelectScene.prototype = Object.create(Phaser.Scene.prototype);
      LevelSelectScene.prototype.constructor = LevelSelectScene;
      LevelSelectScene.prototype.create = function () {
        const cx = W / 2;
        this.cameras.main.setBackgroundColor(C.bg);
        this.add
          .text(cx, 90, "CHOOSE YOUR LEVEL", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "34px",
            fontStyle: "900",
            color: "#eafff4",
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 132, "You can switch levels any time you play again.", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#a8d8c4",
          })
          .setOrigin(0.5);

        const pick = (lvl) => {
          vbLevel = lvl;
          SFX.init();
          JUICE.audio.unlock();
          SFX.coin();
          this.scene.start(vbVocabSeen ? "Game" : "Vocab");
        };

        this.makeCard(
          cx,
          240,
          "LEVEL 1",
          "Build it",
          "I tell you the size. Build a prism that is L long, W wide, and H tall, then read the volume.",
          0x1f7a52,
          () => pick(1),
        );
        this.makeCard(
          cx,
          392,
          "LEVEL 2",
          "Match Volume · Find a Missing Side",
          "Match a target volume any way you like — or find a missing side when the volume is given. Bigger numbers, fewer hints.",
          0x2a6f9d,
          () => pick(2),
        );

        makeHubLink(this, cx, 540);
        srSay(
          "Choose your level. Level 1, build it: I give you the size. " +
            "Level 2, challenge: match a volume or find a missing side.",
        );
      };
      LevelSelectScene.prototype.makeCard = function (
        cx,
        cy,
        tag,
        title,
        desc,
        color,
        cb,
      ) {
        const card = this.add
          .rectangle(cx, cy, 560, 124, C.panel)
          .setStrokeStyle(3, color === 0x1f7a52 ? 0x4fd18b : 0x6fb7e8)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx - 250, cy - 32, tag, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            fontStyle: "900",
            color: color === 0x1f7a52 ? "#4fd18b" : "#6fb7e8",
          })
          .setOrigin(0, 0.5);
        this.add
          .text(cx - 250, cy - 6, title, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "27px",
            fontStyle: "900",
            color: "#eafff4",
          })
          .setOrigin(0, 0.5);
        this.add
          .text(cx - 250, cy + 32, desc, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#a8d8c4",
            wordWrap: { width: 500 },
          })
          .setOrigin(0, 0.5);
        card.on("pointerover", () => card.setFillStyle(0x18402f));
        card.on("pointerout", () => card.setFillStyle(C.panel));
        card.on("pointerdown", cb);
      };

      // ════════════════════════════════════════════════════════════════════
      //  VOCAB GATE  ·  Words to know first (shown BEFORE the first round)
      // ════════════════════════════════════════════════════════════════════

      // Build one stepper (name + minus + value + plus).
      GameScene.prototype.makeStepper = function (cx, dim, label) {
        const cy = 408;
        const box = this.add
          .rectangle(cx, cy, 196, 96, C.panel)
          .setStrokeStyle(3, C.panelEdge)
          .setInteractive({ useHandCursor: true });
        box.on("pointerdown", () => {
          this.active = dim;
          this.updateSteppers();
        });
        this.add
          .text(cx, cy - 30, label, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            fontStyle: "900",
            color: "#a8d8c4",
          })
          .setOrigin(0.5);
        const mkBtn = (bx, sym, delta) => {
          const b = this.add
            .rectangle(bx, cy + 12, 44, 44, C.btn)
            .setStrokeStyle(2, C.panelEdge)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(bx, cy + 10, sym, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "30px",
              fontStyle: "bold",
              color: "#eafff4",
            })
            .setOrigin(0.5);
          b.on("pointerover", () => b.setFillStyle(0x255a42));
          b.on("pointerout", () => b.setFillStyle(C.btn));
          b.on("pointerdown", () => {
            this.active = dim;
            this.changeDim(dim, delta);
          });
          return b;
        };
        mkBtn(cx - 66, "−", -1);
        mkBtn(cx + 66, "+", 1);
        const val = this.add
          .text(cx, cy + 12, "1", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "34px",
            fontStyle: "900",
            color: "#eafff4",
          })
          .setOrigin(0.5);
        this.stepRefs[dim] = { box, val };
      };

      GameScene.prototype.selectDim = function (dir) {
        const order = ["l", "w", "h"];
        let i = order.indexOf(this.active) + dir;
        i = (i + order.length) % order.length;
        this.active = order[i];
        SFX.click();
        JUICE.audio.tap();
        this.updateSteppers();
        srSay(
          (this.active === "l"
            ? "Length"
            : this.active === "w"
              ? "Width"
              : "Height") + " selected.",
        );
      };

      GameScene.prototype.changeDim = function (dim, delta) {
        if (this.locked) return;
        const next = Phaser.Math.Clamp(
          this.built[dim] + delta,
          DIM_MIN,
          DIM_MAX,
        );
        if (next === this.built[dim]) return;
        this.built[dim] = next;
        SFX.click();
        JUICE.audio.pop();
        this.redrawPrism();
        this.updateReadout();
        this.updateSteppers();
      };

      GameScene.prototype.updateSteppers = function () {
        ["l", "w", "h"].forEach((dim) => {
          const r = this.stepRefs[dim];
          if (!r) return;
          r.val.setText(String(this.built[dim]));
          r.box.setStrokeStyle(3, dim === this.active ? C.goldN : C.panelEdge);
        });
      };

      GameScene.prototype.updateReadout = function () {
        const b = this.built;
        const V = b.l * b.w * b.h;
        this.readout.setText(
          b.l + " × " + b.w + " × " + b.h + " = " + V + " u³",
        );
        const ok = this.problem && isCorrect(this.problem, b);
        this.readout.setColor(ok ? "#4fd18b" : "#eafff4");
      };

      // Draw the prism as stacked iso unit cubes (painter's order: i+j+k).
      GameScene.prototype.redrawPrism = function () {
        const g = this.prismGfx;
        g.clear();
        const b = this.built;
        // Gather cube top-vertex offsets and find bounds for centering.
        const cubes = [];
        let minX = Infinity,
          maxX = -Infinity,
          minY = Infinity,
          maxY = -Infinity;
        for (let i = 0; i < b.l; i++) {
          for (let j = 0; j < b.w; j++) {
            for (let k = 0; k < b.h; k++) {
              const X = (i - j) * HW;
              const Y = (i + j) * TH - k * CH;
              cubes.push({ X, Y, key: i + j + k });
              if (X - HW < minX) minX = X - HW;
              if (X + HW > maxX) maxX = X + HW;
              if (Y < minY) minY = Y;
              if (Y + 2 * TH + CH > maxY) maxY = Y + 2 * TH + CH;
            }
          }
        }
        const ox = PRISM_CX - (minX + maxX) / 2;
        const oy = PRISM_CY - (minY + maxY) / 2;
        cubes.sort((a, c) => a.key - c.key);
        cubes.forEach((cube) =>
          drawIsoCube(g, cube.X + ox, cube.Y + oy, HW, TH, CH),
        );
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.problem = genProblem(vbLevel);
        this.built = {
          l: this.problem.start.l,
          w: this.problem.start.w,
          h: this.problem.start.h,
        };
        this.active = "l";
        this.bannerLabel.setText(this.problem.label.toUpperCase());
        this.bannerText.setText(this.problem.prompt);
        // Level 1 always shows the hint; Level 2 shows a lighter hint.
        this.problemHint.setText(this.problem.hint);
        this.goalText.setText(goalLine(this.problem));
        this.feedback.setAlpha(0);
        this.lockBtn.setFillStyle(0x1f7a52);
        this.redrawPrism();
        this.updateReadout();
        this.updateSteppers();
        srSay(
          this.problem.prompt +
            " " +
            this.problem.hint +
            " Use the steppers to build, then lock in.",
        );
      };

      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        this.locked = true;
        const correct = isCorrect(this.problem, this.built);
        if (correct) {
          SFX.good();
          JUICE.audio.correct(this.streak);
          this.solved++;
          this.streak++;
          const gain = 20 + Math.min(this.streak, 5) * 5;
          this.score += gain;
          JUICE.award(8 + Math.min(this.streak, 5), "u10-volume-blast");
          this.burstFx.setPosition(PRISM_CX, PRISM_CY);
          this.burstFx.explode(16);
          JUICE.burst(
            this,
            PRISM_CX,
            PRISM_CY,
            [0x4fd18b, 0xffcd4d, 0xffffff],
            16,
          );
          JUICE.floatText(
            this,
            PRISM_CX,
            PRISM_CY - 60,
            "+" + gain,
            "#4fd18b",
            34,
          );
          if (this.streak >= 2) JUICE.confetti(this, 1);
          this.feedback
            .setColor("#4fd18b")
            .setText("✓ Correct!  " + this.problem.why)
            .setAlpha(1);
          srSay("Correct. " + this.problem.why);
          this.afterAttempt(true);
        } else {
          SFX.bad();
          JUICE.audio.wrong();
          this.streak = 0;
          this.lives--;
          this.flashRed();
          JUICE.shake(this, 0.008);
          JUICE.floatText(this, W - 60, 40, "−1 ❤", "#ff8f8f", 22);
          this.feedback
            .setColor("#ff8f8f")
            .setText("✗ Not quite — " + this.problem.why)
            .setAlpha(1);
          srSay("Not quite. " + this.problem.why);
          // Teach: redraw the prism as the CORRECT build, then continue.
          const goal = correctBuild(this.problem);
          this.built = { l: goal.l, w: goal.w, h: goal.h };
          this.redrawPrism();
          this.updateReadout();
          this.updateSteppers();
          this.afterAttempt(false);
        }
      };

      GameScene.prototype.afterAttempt = function (correct) {
        this.updateHUD();
        if (this.lives <= 0) return this.endGame(false);
        if (this.solved >= this.target) return this.endGame(true);
        this.time.delayedCall(correct ? 950 : 1700, () => {
          this.newProblem();
        });
      };

      GameScene.prototype.flashRed = function () {
        if (this.reduceMotion) return;
        this.redFlash.setAlpha(0.35);
        this.tweens.add({ targets: this.redFlash, alpha: 0, duration: 350 });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.livesText.setText(this.lives > 0 ? "❤".repeat(this.lives) : "—");
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText("Level " + vbLevel);
        this.progressText.setText(this.solved + " / " + this.target);
      };

      GameScene.prototype.endGame = function (won) {
        this.locked = true;
        JUICE.audio.musicStop();
        this.time.delayedCall(500, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            won,
          });
        });
      };

      // ════════════════════════════════════════════════════════════════════
      //  RESULT
      // ════════════════════════════════════════════════════════════════════
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.d = data || {};
      };
      ResultScene.prototype.create = function () {
        const d = this.d;
        const cx = W / 2;
        this.cameras.main.setBackgroundColor(C.bg);

        const stars =
          d.solved >= d.target ? 3 : d.solved >= d.target * 0.6 ? 2 : 1;
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        if (d.score > hs) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }

        this.add
          .text(cx, 120, d.won ? "VOLUME MASTERED!" : "OUT OF LIVES", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "46px",
            fontStyle: "900",
            color: d.won ? "#4fd18b" : "#ff8f8f",
          })
          .setOrigin(0.5);

        for (let i = 0; i < 3; i++) {
          this.add
            .text(cx - 80 + i * 80, 200, i < stars ? "★" : "☆", {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "60px",
              color: i < stars ? "#ffcd4d" : "#2a5a44",
            })
            .setOrigin(0.5);
        }

        this.add
          .text(cx, 280, "Score: " + d.score, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "30px",
            fontStyle: "bold",
            color: "#eafff4",
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 318, "Built " + d.solved + " of " + d.target + " prisms", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            color: "#a8d8c4",
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 348, "High Score: " + hs, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            fontStyle: "bold",
            color: "#ffcd4d",
          })
          .setOrigin(0.5);

        if (d.won) {
          SFX.win();
          JUICE.audio.fanfare();
          JUICE.confetti(this, 1);
          JUICE.award(40, "u10-volume-blast");
        } else {
          SFX.lose();
        }

        // EduPulse reporting (guarded; safe no-op without bridge).
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.score,
              stars: stars,
              standard: "6.G.2",
              problemsAttempted: d.solved,
            });
        } catch (e) {}
        srSay(
          (d.won ? "Volume mastered! " : "Out of lives. ") +
            "Final score " +
            d.score +
            ", " +
            stars +
            " stars.",
        );

        const again = this.add
          .rectangle(cx - 150, 430, 270, 54, 0x1f7a52)
          .setStrokeStyle(3, 0xffffff, 0.85)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx - 150, 430, "↻  PLAY AGAIN", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const replay = () => this.scene.start("LevelSelect");
        again.on("pointerover", () => again.setFillStyle(0x2a9d6a));
        again.on("pointerout", () => again.setFillStyle(0x1f7a52));
        again.on("pointerdown", replay);
        this.input.keyboard.on("keydown-SPACE", replay);
        this.input.keyboard.on("keydown-ENTER", replay);

        const home = this.add
          .rectangle(cx + 150, 430, 270, 54, 0x2a6f9d)
          .setStrokeStyle(3, 0xffffff, 0.85)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx + 150, 430, "🏠  ALL GAMES", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        home.on("pointerover", () => home.setFillStyle(0x3585b8));
        home.on("pointerout", () => home.setFillStyle(0x2a6f9d));
        home.on("pointerdown", () => (window.location.href = "/math/games/"));
      };

      // ── Shared helpers ──────────────────────────────────────────────────
      // Draw one isometric unit cube whose top vertex is at (X, Y).
      function drawIsoCube(g, X, Y, hw, th, ch) {
        // top
        g.fillStyle(C.cubeTop, 1);
        g.beginPath();
        g.moveTo(X, Y);
        g.lineTo(X + hw, Y + th);
        g.lineTo(X, Y + 2 * th);
        g.lineTo(X - hw, Y + th);
        g.closePath();
        g.fillPath();
        g.lineStyle(1, C.cubeEdge, 0.85);
        g.strokePath();
        // left face
        g.fillStyle(C.cubeLeft, 1);
        g.beginPath();
        g.moveTo(X - hw, Y + th);
        g.lineTo(X, Y + 2 * th);
        g.lineTo(X, Y + 2 * th + ch);
        g.lineTo(X - hw, Y + th + ch);
        g.closePath();
        g.fillPath();
        g.lineStyle(1, C.cubeEdge, 0.85);
        g.strokePath();
        // right face
        g.fillStyle(C.cubeRight, 1);
        g.beginPath();
        g.moveTo(X, Y + 2 * th);
        g.lineTo(X + hw, Y + th);
        g.lineTo(X + hw, Y + th + ch);
        g.lineTo(X, Y + 2 * th + ch);
        g.closePath();
        g.fillPath();
        g.lineStyle(1, C.cubeEdge, 0.85);
        g.strokePath();
      }

      function makeHubLink(scene, x, y) {
        const t = scene.add
          .text(x, y, "← Back to Math Games", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            fontStyle: "bold",
            color: "#a8d8c4",
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        t.on("pointerover", () => t.setColor("#4fd18b"));
        t.on("pointerout", () => t.setColor("#a8d8c4"));
        t.on("pointerdown", () => (window.location.href = "/math/games/"));
        return t;
      }

      // ── Launch ──
      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0a241b",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [
          BootScene,
          TitleScene,
          LevelSelectScene,
          VocabScene,
          GameScene,
          ResultScene,
        ],
      };
      const vbGame = new Phaser.Game(config);

      // ── Canvas accessibility (additive; no gameplay change) ──
      vbGame.events.once("ready", function () {
        try {
          const cv = vbGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Volume Blast Unit-Cube Stacker math game. Build a rectangular " +
              "prism from unit cubes by setting its length, width, and height " +
              "with the steppers, or use the left and right arrow keys to pick a " +
              "side and the up and down arrows to change it. Watch the live " +
              "length times width times height readout, then press Lock In, " +
              "Enter, or Space.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>
