    <script>
      // Decorative chart-bar builder + pointer parallax (gameplay-neutral).

        if (!layer) return;

    <script>
      // ════════════════════════════════════════════════════════════════════
      //  DATA DASH — LINE PLOT BUILDER   ·   Lessons 8.1-8.7 · 6.DS.6
      //
      //  Math-as-mechanic, calm and self-paced (NO timer, NO reflex): you BUILD
      //  a line plot to hit a target statistic. Tap a value column to ADD a dot,
      //  tap a dot to REMOVE it (keyboard: ← → choose a column, ↑/W add, ↓/S
      //  remove). The MEAN updates live as you build (median + range too at
      //  Level 2), so steering the statistic IS the action. Lock In checks the
      //  target exactly. A wrong build (wrong math) costs a life and shows your
      //  ACTUAL statistic vs. the target with a teaching hint, then continues.
      //
      //  Two levels (never "ESOL"):
      //    Level 1 (support)    — target the MEAN only; small axis 1–6; the live
      //                           mean is shown big with a "sum ÷ count" hint.
      //    Level 2 (enrichment) — target MEAN, MEDIAN, RANGE, or MAD (6.DS.6c);
      //                           wider axis 1–10; fewer hints.
      //
      //  Anti-cheese: every round seeds 2-3 IMMOVABLE gold "given" dots chosen
      //  so the target is NOT already met and CANNOT be met by one added dot —
      //  the student must reason about how added values pull the statistic.
      //  Rounds are built answer-first (an answer plot is constructed, then its
      //  statistic becomes the target), so every target is reachable exactly
      //  with whole-number dots inside the dot cap: means divide exactly and
      //  MAD targets are integers or halves.
      // ════════════════════════════════════════════════════════════════════
      const W = 820,
        H = 600;
      const LS_KEY = "dd_lineplot_highscore";
      const DOT_CAP = 12; // total dots allowed on the plot

      // Plot geometry in game space (Scale.FIT maps pointer coords into this).
      const AX_Y = 470, // baseline of the line plot
        AX_X0 = 120,
        AX_X1 = 700;
      const PLOT_TOP = 210; // dots/columns never rise above this
      const DOT_R = 10,
        DOT_GAP = 21; // stack spacing (12 dots fit between top and baseline)

      // ── Theme colors (Data & Statistics — teal / deep blue) ──
      const C = {
        bg: 0x0a1c2c,
        panel: 0x10283c,
        panelEdge: 0x244a63,
        accent: 0x2bd1c4,
        good: 0x4fd18b,
        bad: 0xff6b6b,
        gold: 0xffcd4d,
        dot: 0x2bd1c4,
        sel: 0x1a6fb5,
      };

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          tap() {},
          pop() {},
          correct() {},
          wrong() {},
          whoosh() {},
          fanfare() {},
          musicStart() {},
          musicStop() {},
        },
        theme: () => ({ accentN: 0x2bd1c4, tileN: 0x163a52, botN: 0x0a1c2c }),
        bgGradient() {},
        popIn() {},
        tilePop() {},
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (
                window.AudioContext || window.webkitAudioContext
              )();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        miss() {
          this.play("triangle", 240, 0.16, 0.12);
        },
        coin() {
          this.play("square", 1040, 0.05, 0.08);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
      };

      // ── helpers ──
      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function shuffle(a) {
        const r = [...a];
        for (let i = r.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [r[i], r[j]] = [r[j], r[i]];
        }
        return r;
      }
      function srSay(msg) {
        const el = document.getElementById("dd-sr");
        if (el) el.textContent = msg;
      }
      function numStr(v) {
        return Number.isInteger(v) ? String(v) : v.toFixed(1);
      }

      // ── Chosen difficulty (set on the Level Select screen) ──
      // 1 = support (mean only, axis 1–6), 2 = enrichment (mean/median/range/
      // MAD, axis 1–10). Drives the generator and how much scaffolding shows.
      let ddLevel = 1;

      // ── Stat definitions (label + teaching hint) ──
      const STAT = {
        mean: {
          name: "MEAN",
          hint: "Mean = sum of all dots ÷ number of dots.",
        },
        median: {
          name: "MEDIAN",
          hint: "Median = the middle value when the dots are in order.",
        },
        range: {
          name: "RANGE",
          hint: "Range = greatest value − least value.",
        },
        mad: {
          name: "MAD",
          hint: "MAD = the mean of each dot's distance from the mean. Find the mean first, then average the distances.",
        },
      };

      // ── Round generator ─────────────────────────────────────────────────
      // Returns { stat, target, given } (plus targetMad for MAD rounds) for the
      // axis [lo..hi]. Anti-cheese design:
      //   • Every round seeds 2-3 IMMOVABLE "given" dots (gold; removeDot
      //     refuses them), chosen so the target is NOT already met and CANNOT
      //     be met by adding any single dot anywhere on the axis — one dot on
      //     the target value never wins.
      //   • Rounds are built answer-first: a full answer plot (given + 2-6
      //     added dots, total ≤ DOT_CAP) is constructed and ITS statistic is
      //     the target, so every target is exactly reachable with whole-number
      //     dots. Mean targets are integers (the sum divides exactly); MAD
      //     rounds pair an integer mean with a MAD that is an integer or a
      //     half (exact in the game's arithmetic).
      function targetMet(counts, lo, problem) {
        if (problem.stat === "mad") {
          const m = statOf(counts, lo, "mean");
          const dv = statOf(counts, lo, "mad");
          return (
            m !== null &&
            dv !== null &&
            Math.abs(m - problem.target) < 1e-9 &&
            Math.abs(dv - problem.targetMad) < 1e-9
          );
        }
        const cur = statOf(counts, lo, problem.stat);
        return cur !== null && Math.abs(cur - problem.target) < 1e-9;
      }

      // True when the given dots alone already meet the target, or when ANY
      // single added dot would meet it (either way the round is cheesable).
      function oneDotCheesable(problem, lo) {
        const g = problem.given;
        if (targetMet(g, lo, problem)) return true;
        for (let i = 0; i < g.length; i++) {
          g[i]++;
          const met = targetMet(g, lo, problem);
          g[i]--;
          if (met) return true;
        }
        return false;
      }

      function genRound(level, lo, hi) {
        const span = hi - lo;
        const statPool =
          level === 1 ? ["mean"] : ["mean", "median", "range", "mad"];
        for (let tries = 0; tries < 400; tries++) {
          const stat = statPool[randInt(0, statPool.length - 1)];
          const gN = randInt(2, 3);
          const given = new Array(span + 1).fill(0);
          if (stat === "range") {
            // Range resists a one-dot fix only when the given dots sit near
            // the middle and the target spread is wider than either side of
            // the axis reaches from them.
            const mid = Math.round(span / 2);
            for (let i = 0; i < gN; i++)
              given[randInt(Math.max(0, mid - 1), Math.min(span, mid + 1))]++;
          } else {
            for (let i = 0; i < gN; i++) given[randInt(0, span)]++;
          }
          // Answer plot = given + k added dots (the reachability witness).
          const k = randInt(2, Math.min(6, DOT_CAP - gN));
          const full = given.slice();
          for (let i = 0; i < k; i++) full[randInt(0, span)]++;

          let problem = null;
          if (stat === "mad") {
            const m = statOf(full, lo, "mean");
            const dv = statOf(full, lo, "mad");
            // Integer mean; MAD an integer or half, and a real spread.
            if (!Number.isInteger(m)) continue;
            if (dv < 1 || !Number.isInteger(dv * 2)) continue;
            problem = { stat, target: m, targetMad: dv, given };
          } else {
            const t = statOf(full, lo, stat);
            if (t === null || !Number.isInteger(t)) continue;
            if (stat === "range" && t < 2) continue;
            // Keep the mean off the axis edges so building is a real task.
            if (stat === "mean" && (t <= lo || t >= hi)) continue;
            problem = { stat, target: t, given };
          }
          if (oneDotCheesable(problem, lo)) continue;
          return problem;
        }
        // Deterministic hand-verified fallback (never one-dot cheesable):
        //   Level 1 (axis 1–6):  given {2,2}, target mean 4. Given mean is 2;
        //     one added dot would need (4+v)/3 = 4 → v = 8, off the axis.
        //     Reachable: add {6,6} → {2,2,6,6}, mean 16 ÷ 4 = 4.
        //   Level 2 (axis 1–10): given {2,2}, target mean 7. One added dot
        //     would need v = 17, off the axis. Reachable: add {9,9,10,10} →
        //     {2,2,9,9,10,10}, mean 42 ÷ 6 = 7.
        const given = new Array(span + 1).fill(0);
        given[1] = 2;
        return { stat: "mean", target: level === 1 ? lo + 3 : lo + 6, given };
      }

      // Compute a statistic from a counts-per-column array. Returns null when
      // undefined (no dots, or range with < 2 dots).
      function statOf(counts, lo, stat) {
        const vals = [];
        for (let i = 0; i < counts.length; i++)
          for (let c = 0; c < counts[i]; c++) vals.push(lo + i);
        const n = vals.length;
        if (n === 0) return null;
        if (stat === "mean") {
          const sum = vals.reduce((a, b) => a + b, 0);
          return sum / n;
        }
        if (stat === "median") {
          // vals are already sorted (columns iterated low→high).
          return n % 2
            ? vals[(n - 1) / 2]
            : (vals[n / 2 - 1] + vals[n / 2]) / 2;
        }
        if (stat === "mad") {
          // Mean absolute deviation: mean of |x − mean| (6.DS.6c).
          const mean = vals.reduce((a, b) => a + b, 0) / n;
          return vals.reduce((a, b) => a + Math.abs(b - mean), 0) / n;
        }
        // range
        if (n < 2) return null;
        return vals[n - 1] - vals[0];
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0a1c2c",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [
          BootScene,
          TitleScene,
          VocabScene,
          LevelScene,
          GameScene,
          ResultScene,
        ],
      };

      // ── Vocab gate state (repo rule: term + Level-1 definition + image/emoji
      // shown BEFORE the first round). Shown once per page session. ──
      let ddVocabSeen = false;

      // ~5 STATS key words — Level-1 (student-facing) definitions + an emoji so
      // a visual always shows even with no network/images. No giveaways.
      const DD_VOCAB = [
        {
          term: "Data",
          emoji: "📊",
          def: "The numbers or facts you collect, like how many pets each kid has.",
        },
        {
          term: "Line plot",
          emoji: "•",
          def: "A number line with a dot for each value. More dots stacked = more of that value.",
        },
        {
          term: "Mean",
          emoji: "⚖️",
          def: "The average. Add all the values, then share them out evenly.",
        },
        {
          term: "Median",
          emoji: "🎯",
          def: "The middle value when you line all the numbers up in order.",
        },
        {
          term: "Range",
          emoji: "↔️",
          def: "How spread out the data is: the biggest value minus the smallest.",
        },
        {
          term: "MAD",
          emoji: "📏",
          def: "Short for Mean Absolute Deviation: the average distance of the data from the mean. Small MAD = data close together.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0xffe07a);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, C.bg);
        this.add
          .text(cx, 120, "DATA DASH", {
            fontFamily: "Impact, sans-serif",
            fontSize: "64px",
            color: "#2bd1c4",
            stroke: "#04121c",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 175, "Line Plot Builder", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            color: "#9cc4dd",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            232,
            "BUILD a line plot to hit a target. Tap a column to add a dot,\ntap a dot to remove it — watch the mean change — then Lock In!",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#bfe9ff",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            295,
            "Tap or ← → ↑ ↓ (A·D·W·S) · 6.DS.6 · Lessons 8.1–8.7",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "14px",
              color: "#9ec9e2",
            },
          )
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 330, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#ffcd4d",
              fontStyle: "bold",
            })
            .setOrigin(0.5);

        const btn = this.add
          .rectangle(cx, 400, 240, 58, 0x148f86)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "START ▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.tweens.add({
          targets: [btn, btnT],
          scaleX: 1.05,
          scaleY: 1.05,
          duration: 800,
          yoyo: true,
          repeat: -1,
        });
        const start = () => {
          SFX.init();
          SFX.coin();
          JUICE.audio.unlock();
          // Vocab gate before the first run; afterwards jump to level select.
          this.scene.start(ddVocabSeen ? "Level" : "Vocab");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x1aa99e));
        btn.on("pointerout", () => btn.setFillStyle(0x148f86));
        btn.on("pointerdown", start);
        this.input.keyboard.on("keydown-SPACE", start);
        this.input.keyboard.on("keydown-ENTER", start);
        srSay("Data Dash Line Plot Builder. Press Start to play.");
      };

      // ── VOCAB GATE ──
      function VocabScene() {
        Phaser.Scene.call(this, "Vocab");
      }
      VocabScene.prototype = Object.create(Phaser.Scene.prototype);
      VocabScene.prototype.constructor = VocabScene;
      VocabScene.prototype.init = function () {
        this.idx = 0;
      };
      VocabScene.prototype.create = function () {

      // ── GAME ──
      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function () {
        this.reduceMotion = !!(
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
        this.score = 0;
        this.lives = 3;
        this.streak = 0;
        this.solved = 0;
        this.target = 10; // win: build this many plots correctly
        this.locked = false;
        // Axis is fixed by chosen level.
        this.lo = 1;
        this.hi = ddLevel === 1 ? 6 : 10;
        this.n = this.hi - this.lo + 1;
        this.counts = new Array(this.n).fill(0);
        // Immovable "given" dots per column (gold; seeded by each round).
        this.given = new Array(this.n).fill(0);
        this.cursor = Math.floor(this.n / 2);
        this.problem = null;
      };

      GameScene.prototype.colX = function (i) {
        return AX_X0 + ((AX_X1 - AX_X0) * i) / (this.n - 1);
      };

        });

          fontSize: "13px",
          fontStyle: "bold",

          .text(W / 2, 142, "", {

            fontSize: "46px",
            color: "#2bd1c4",
            stroke: "#04121c",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        this.subReadout = this.add
          .text(W / 2, 180, "", {

            color: "#9cc4dd",
          })

        // Teaching feedback (shown after Lock In; hidden otherwise).

            color: "#ffcd4d",
            stroke: "#04121c",

          })

        // Plot baseline + value columns/labels.
        this.add

        this.redFlash = this.add

      GameScene.prototype.totalDots = function () {
        return this.counts.reduce((a, b) => a + b, 0);
      };

      GameScene.prototype.moveCursor = function (d) {
        if (this.locked) return;
        this.cursor = Phaser.Math.Clamp(this.cursor + d, 0, this.n - 1);
        this.sel.x = this.colX(this.cursor);
        SFX.coin();
        srSay("Column " + (this.lo + this.cursor) + " selected.");
      };

      GameScene.prototype.addDot = function (i) {
        if (this.locked) return;
        if (this.totalDots() >= DOT_CAP) {
          this.flash(W / 2, 250, "Max " + DOT_CAP + " dots", "#ffcd4d");
          SFX.miss();
          return;
        }
        this.cursor = i;
        this.sel.x = this.colX(i);
        this.counts[i]++;
        SFX.coin();
        JUICE.audio.pop();
        this.redrawDots();
        this.updateReadout();
        srSay("Added a dot at " + (this.lo + i) + ".");
      };

      GameScene.prototype.removeDot = function (i) {
        if (this.locked) return;
        if (this.counts[i] <= this.given[i]) {
          // Only the immovable given dots (or nothing) are left here.
          SFX.miss();
          if (this.counts[i] > 0) {
            this.flash(this.colX(i), AX_Y - 60, "Given dots stay!", "#ffcd4d");
            srSay(
              "The dots left at " +
                (this.lo + i) +
                " are given dots. They cannot be removed.",
            );
          }
          return;
        }
        this.cursor = i;
        this.sel.x = this.colX(i);
        this.counts[i]--;
        SFX.coin();
        JUICE.audio.tap();
        this.redrawDots();
        this.updateReadout();
        srSay("Removed a dot at " + (this.lo + i) + ".");
      };

      GameScene.prototype.redrawDots = function () {
        this.dotLayer.clear(true, true);
        for (let i = 0; i < this.n; i++) {
          const x = this.colX(i);
          for (let j = 0; j < this.counts[i]; j++) {
            const y = AX_Y - 22 - j * DOT_GAP;
            // Bottom given[i] dots are the immovable seed data: gold with a
            // white ring; tapping one explains instead of removing.
            const isGiven = j < this.given[i];
            const d = this.add
              .circle(x, y, DOT_R, isGiven ? C.gold : C.dot)
              .setStrokeStyle(isGiven ? 3 : 2, isGiven ? 0xffffff : 0x0a1c2c)
              .setDepth(6)
              .setInteractive({ useHandCursor: true });
            if (isGiven) d.on("pointerdown", () => this.givenDotTapped(i));
            else d.on("pointerdown", () => this.removeDot(i));
            this.dotLayer.add(d);
            if (!this.reduceMotion && !isGiven && j === this.counts[i] - 1)
              JUICE.tilePop(this, d);
          }
        }
      };

      GameScene.prototype.givenDotTapped = function (i) {
        if (this.locked) return;
        SFX.miss();
        this.flash(this.colX(i), AX_Y - 60, "Given dot — it stays!", "#ffcd4d");
        srSay(
          "The dot at " +
            (this.lo + i) +
            " is a given dot. It cannot be removed.",
        );
      };

      GameScene.prototype.updateReadout = function () {
        const stat = this.problem.stat;
        const tot = this.totalDots();
        if (stat === "mad") {
          // MAD rounds target a mean AND a MAD — show both live.
          const mean = statOf(this.counts, this.lo, "mean");
          const mad = statOf(this.counts, this.lo, "mad");
          this.bigReadout.setText(
            "MEAN = " +
              (mean === null ? "—" : numStr(mean)) +
              "  ·  MAD = " +
              (mad === null ? "—" : numStr(mad)),
          );
        } else {
          const cur = statOf(this.counts, this.lo, stat);
          this.bigReadout.setText(
            STAT[stat].name + " = " + (cur === null ? "—" : numStr(cur)),
          );
        }
        if (ddLevel === 1) {
          // Support tier: a LIVE step coach. It always names the next move so
          // the abstract "hit the mean" task becomes a follow-the-steps
          // procedure — add a high dot to raise the mean, a low dot to lower it.
          const t = this.problem.target;
          const mean = statOf(this.counts, this.lo, "mean");
          let step, col;
          if (mean === null) {
            step = "Step 1: tap a column to add your first dot.";
            col = "#9cc4dd";
          } else if (Math.abs(mean - t) < 1e-9) {
            step = "✓ Mean = " + t + " — press LOCK IN!";
            col = "#4fd18b";
          } else if (mean < t) {
            step =
              "Mean is " +
              numStr(mean) +
              ", need " +
              t +
              " — too LOW. Add a dot on a HIGH number (try " +
              this.hi +
              ").";
            col = "#ffcd4d";
          } else {
            step =
              "Mean is " +
              numStr(mean) +
              ", need " +
              t +
              " — too HIGH. Add a dot on a LOW number (try " +
              this.lo +
              ").";
            col = "#ffcd4d";
          }
          this.subReadout.setText(step).setColor(col);
        } else {
          // Enrichment: show all four live stats, fewer words.
          const mean = statOf(this.counts, this.lo, "mean");
          const med = statOf(this.counts, this.lo, "median");
          const rng = statOf(this.counts, this.lo, "range");
          const mad = statOf(this.counts, this.lo, "mad");
          this.subReadout.setText(
            "Dots: " +
              tot +
              "  ·  Mean " +
              (mean === null ? "—" : numStr(mean)) +
              "  ·  Median " +
              (med === null ? "—" : numStr(med)) +
              "  ·  Range " +
              (rng === null ? "—" : numStr(rng)) +
              "  ·  MAD " +
              (mad === null ? "—" : numStr(mad)),
          );
        }
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.problem = genRound(ddLevel, this.lo, this.hi);
        // The immovable given dots seed the build; the student adds on top.
        this.given = this.problem.given.slice();
        this.counts = this.problem.given.slice();
        this.cursor = Math.floor(this.n / 2);
        this.sel.x = this.colX(this.cursor);
        this.feedback.setAlpha(0);
        this.subReadout.setVisible(true);
        let goal;
        if (this.problem.stat === "mad") {
          goal =
            "Add dots so the MEAN is " +
            this.problem.target +
            " and the MAD is " +
            numStr(this.problem.targetMad) +
            ".";
        } else {
          goal =
            "Add dots so the " +
            STAT[this.problem.stat].name +
            " is " +
            this.problem.target +
            ".";
        }
        this.bannerText.setText(goal);
        // Persistent procedure reminder for the support tier.
        this.bannerLabel.setText(
          ddLevel === 1
            ? "STEPS: mean too LOW? add HIGH dots.  too HIGH? add LOW dots."
            : "BUILD THE LINE PLOT",
        );
        this.redrawDots();
        this.updateReadout();
        const givenN = this.given.reduce((a, b) => a + b, 0);
        srSay(
          goal +
            " " +
            givenN +
            " gold given dots are already on the plot and cannot be removed. " +
            "Tap a column to add a dot, then lock it in.",
        );
      };

      GameScene.prototype.lockIn = function () {
        if (this.locked) return;
        const stat = this.problem.stat;
        const givenN = this.given.reduce((a, b) => a + b, 0);
        if (this.totalDots() <= givenN) {
          // Not an error — just guide; the given dots alone never meet the
          // target (guaranteed by the generator), so ask for a build first.
          SFX.miss();
          this.flash(W / 2, 250, "Add a dot first", "#ffcd4d");
          return;
        }
        this.locked = true;
        const cur = statOf(this.counts, this.lo, stat);
        const correct = targetMet(this.counts, this.lo, this.problem);

        if (correct) {
          SFX.good();
          JUICE.audio.correct(this.streak);
          this.solved++;
          this.streak++;
          const bonus = Math.min(this.streak, 5) * 5;
          const gained = 20 + bonus;
          this.score += gained;
          JUICE.burst(
            this,
            W / 2,
            AX_Y - 60,
            [0x4fd18b, 0x2bd1c4, 0xffffff],
            18,
          );
          JUICE.floatText(this, W / 2, 250, "+" + gained, "#4fd18b", 36);
          JUICE.award(gained, "u8-data-dash");
          if (this.streak >= 2) JUICE.confetti(this, 1);
          this.flash(W / 2, 210, "Correct! ✓", "#4fd18b");
          this.feedback
            .setText("Correct! " + this.successWhy(stat, cur))
            .setAlpha(1);
          this.subReadout.setVisible(false);
          srSay("Correct. " + this.successWhy(stat, cur));
          this.afterAttempt(true);
        } else {
          SFX.bad();
          JUICE.audio.wrong();
          this.streak = 0;
          this.lives--;
          this.flashRed();
          JUICE.shake(this, 0.008);
          const why = this.failWhy(stat, cur);
          this.feedback.setText(why).setAlpha(1);
          this.subReadout.setVisible(false);
          srSay("Not quite. " + why);
          this.afterAttempt(false);
        }
      };

      // Teaching text that shows the student's ACTUAL statistic (the "correct
      // state" of their build) against the target.
      GameScene.prototype.successWhy = function (stat, cur) {
        if (stat === "mean") {
          const tot = this.totalDots();
          const sum = Math.round(cur * tot);
          return "Mean = " + sum + " ÷ " + tot + " = " + numStr(cur) + ".";
        }
        if (stat === "median")
          return "The middle value is " + numStr(cur) + ".";
        if (stat === "mad") {
          const mean = statOf(this.counts, this.lo, "mean");
          return (
            "Mean = " +
            numStr(mean) +
            " and MAD = " +
            numStr(cur) +
            " — on average each dot sits " +
            numStr(cur) +
            " from the mean."
          );
        }
        return "Greatest − least = " + numStr(cur) + ".";
      };
      GameScene.prototype.failWhy = function (stat, cur) {
        const t = this.problem.target;
        if (stat === "mean") {
          const tot = this.totalDots();
          const sum = Math.round(cur * tot);
          return (
            "Your mean is " +
            numStr(cur) +
            " (sum " +
            sum +
            " ÷ " +
            tot +
            " dots), but you need " +
            t +
            ". " +
            STAT.mean.hint
          );
        }
        if (stat === "median") {
          return (
            "Your median is " +
            numStr(cur) +
            ", but you need " +
            t +
            ". " +
            STAT.median.hint
          );
        }
        if (stat === "mad") {
          const mean = statOf(this.counts, this.lo, "mean");
          return (
            "Your mean is " +
            numStr(mean) +
            " and your MAD is " +
            numStr(cur) +
            ", but you need mean " +
            t +
            " and MAD " +
            numStr(this.problem.targetMad) +
            ". " +
            STAT.mad.hint
          );
        }
        return (
          "Your range is " +
          numStr(cur) +
          ", but you need " +
          t +
          ". " +
          STAT.range.hint
        );
      };

      GameScene.prototype.afterAttempt = function (correct) {
        this.updateHUD();
        if (this.lives <= 0) {
          // No-fail practice: refill hearts and keep going. Mistakes teach;
          // they never end the game (calm, self-paced classroom mode).
          this.lives = 3;
          this.updateHUD();
        }
        if (this.solved >= this.target) {
          this.endGame();
          return;
        }
        this.time.delayedCall(correct ? 1100 : 1700, () => {
          this.newProblem();
        });
      };

      GameScene.prototype.flash = function (x, y, text, color) {
        const ft = this.add
          .text(x, y, text, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            fontStyle: "bold",
            color: color,
            stroke: "#04121c",
            strokeThickness: 4,
          })
          .setOrigin(0.5)
          .setDepth(40);
        this.tweens.add({
          targets: ft,
          y: y - 50,
          alpha: { from: 1, to: 0 },
          duration: this.reduceMotion ? 500 : 900,
          onComplete: () => ft.destroy(),
        });
      };

      GameScene.prototype.flashRed = function () {
        if (this.reduceMotion) return;
        this.redFlash.setAlpha(0.35);
        this.tweens.add({ targets: this.redFlash, alpha: 0, duration: 350 });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.livesText.setText(this.lives > 0 ? "❤".repeat(this.lives) : "—");
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText("Level " + ddLevel);
        this.progressText.setText(this.solved + " / " + this.target);
      };

      // Reached only by finishing all target plots (mistakes never end the
      // game), so the Result scene is always a win.
      GameScene.prototype.endGame = function () {
        this.locked = true;
        this.time.delayedCall(600, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, C.bg);
        // The game only ends when every plot is built — always a full win.
        const stars = 3;
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        if (d.score > hs) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }

        this.add
          .text(cx, 110, "DATA MASTER!", {
            fontFamily: "Impact, sans-serif",
            fontSize: "48px",
            color: "#4fd18b",
            stroke: "#04121c",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        const starStr = "★".repeat(stars) + "☆".repeat(3 - stars);
        this.add
          .text(cx, 185, starStr, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "48px",
            color: "#ffcd4d",
          })
          .setOrigin(0.5);

        this.add
          .text(cx, 255, "Score: " + d.score, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "30px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 295, "Built " + d.solved + " of " + d.target + " plots", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            color: "#bfe9ff",
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 325, "High Score: " + hs, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#ffcd4d",
          })
          .setOrigin(0.5);

        SFX.win();
        JUICE.audio.fanfare();
        JUICE.confetti(this, 1);

        // EduPulse reporting (guarded; safe no-op without bridge).
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.score,
              stars: stars,
              standard: "6.DS.6",
              problemsAttempted: d.solved,
            });
        } catch (e) {}
        srSay("You won! Final score " + d.score + ", " + stars + " stars.");

        const btn = this.add
          .rectangle(cx, 400, 220, 54, 0x148f86)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx, 400, "PLAY AGAIN 🔁", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const again = () => this.scene.start("Level");
        btn.on("pointerover", () => btn.setFillStyle(0x1aa99e));
        btn.on("pointerout", () => btn.setFillStyle(0x148f86));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);
      };

      // ── Launch ──
      const ddGame = new Phaser.Game(config);

      // ── Canvas accessibility (additive; no gameplay change) ──
      ddGame.events.once("ready", function () {
        try {
          const cv = ddGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Data Dash Line Plot Builder math game. Read the goal, then build a " +
              "line plot: tap a value column (or use the arrow keys) to add a dot, " +
              "tap a dot to remove it, until the mean, median, range, or MAD " +
              "matches the target. Gold given dots are locked in place. Then " +
              "press Lock In.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>
    <script src="/assets/nt-page-enhance.js" defer></script>
    <script src="/assets/edupulse-config.js"></script>
    <script src="/assets/edupulse-bridge.js"></script>
    <!-- gfx-injected:begin (shared game polish — tools/inject-game-fx.js) -->
    <script src="/assets/game-fx.js" defer></script>
    <!-- gfx-injected:end -->
    <!-- mwb-injected:begin (Math Workbench launcher — tools/inject-math-workbench.js) -->
    <script src="/assets/math-workbench-launcher.js" defer></script>
    <!-- mwb-injected:end -->
    <!-- gacc-injected:begin (calm & accessible games — tools/inject-game-access.js) -->
    <script src="/assets/game-access.js" defer></script>
    <!-- gacc-injected:end -->
    <!-- ghl-injected:begin (Socratic hint ladder — tools/inject-game-hint-ladder.js) -->
    <script src="/assets/game-hint-ladder.js" defer></script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        if (window.NeftHintLadder)
          window.NeftHintLadder.watch({
            sourceSelector: "#dd-sr",
            standard: "6.DS.6",
            staticHints: [
              "Is the target about the center of the data (mean/median), the spread (range), or the typical distance from the mean (MAD)?",
              "Recall the measure: mean = add then divide; median = middle of the ordered list; range = max − min; MAD = the mean of each dot's distance from the mean.",
              "Start from the locked gold given dots: decide whether your added dots must pull the statistic up or down, then check the live readout.",
            ],
          });
      });
    </script>
    <!-- ghl-injected:end -->
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
    <script src="/shared/save-resume/save-resume-engine.js" defer></script>
    <!-- nsr-injected:end -->
    <!-- canvas-bridge-injected:begin (Canvas grade bridge — tools/inject-canvas-bridge.js) -->
    <script src="/assets/canvas-bridge.js" defer></script>
