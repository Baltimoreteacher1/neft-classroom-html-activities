    <!-- Decorative animated spark-field (behind the Phaser canvas). -->
    <div id="dd-bg" data-parallax aria-hidden="true">

    <script>
      // Decorative spark-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("dd-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 32;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "dd-spark";
            var sz = rnd(2, 5);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" +
            (dx * 20).toFixed(2) +
            "px," +
            (dy * 12).toFixed(2) +
            "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener)
            reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── DECIMAL DASH — NUMBER-LINE PLACER ──
      // Phaser 3 — Grade 6 Math — Place & order decimals on a number line.
      // Mechanic (math-as-mechanic, no reflex/timer): the NUMBER LINE is the
      // game. Drag a marker (or nudge ±1 tick with ← → / A·D) onto the tick
      // that matches a decimal, then press Lock In. At higher levels you place
      // 2–3 markers and ordering least→greatest happens by placing each at its
      // value. Endpoints and tick granularity (tenths → hundredths) change every
      // round. A wrong placement (wrong math) costs a life and the markers glide
      // to the correct ticks to teach. Calm, self-paced, no clock.
      //
      // EXACTNESS: every value is generated on a tick (lo + idx*step) and the
      // marker snaps to integer tick indices. Correctness is checked by tick
      // INDEX, never by raw float ==, so decimal drift can never mislabel a spot.

      const W = 820,
        H = 600;
      const LS_KEY = "dd_decimal_dash_highscore";
      const ACTIVITY_TITLE = "Decimal Dash — Lessons 1.4–1.7";
      const STANDARD = "6.NOS.3";

      // Number-line geometry in game space. Phaser Scale.FIT maps pointer
      // coordinates into this space, so drag math works at any screen size.
      const LINE_X0 = 110,
        LINE_X1 = 710,
        LINE_Y = 380;
      const LINE_W = LINE_X1 - LINE_X0;
      const TICKS = 10; // 10 intervals → 11 ticks, indices 0..10
      function tickX(i) {
        return LINE_X0 + (LINE_W * i) / TICKS;
      }
      function nearestIndex(x) {
        return Phaser.Math.Clamp(
          Math.round(((x - LINE_X0) / LINE_W) * TICKS),
          0,
          TICKS,
        );
      }

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          tap() {},
          pop() {},
          correct() {},
          wrong() {},
          whoosh() {},
          fanfare() {},
          musicStart() {},
          musicStop() {},
        },
        theme: () => ({
          accent: "#5ad1ff",
          accentN: 0x5ad1ff,
          tileN: 0x334155,
          botN: 0x1e293b,
        }),
        bgGradient() {},
        popIn() {},
        tilePop() {},
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (
                window.AudioContext || window.webkitAudioContext
              )();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        move() {
          this.play("square", 980, 0.04, 0.07);
        },
        select() {
          this.play("triangle", 540, 0.06, 0.08);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
        lose() {
          [400, 330, 260, 200].forEach((f, i) =>
            setTimeout(() => this.play("sawtooth", f, 0.3, 0.14), i * 170),
          );
        },
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function shuffle(a) {
        const r = [...a];
        for (let i = r.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [r[i], r[j]] = [r[j], r[i]];
        }
        return r;
      }
      function srSay(msg) {
        const el = document.getElementById("dd-sr");
        if (el) el.textContent = msg;
      }

      // Value at a tick index for the current range, as a clean fixed string.
      function rstr(range, idx) {
        return (range.lo + idx * range.step).toFixed(range.decimals);
      }

      // ── Problem generator (number line) ─────────────────────────────────
      // Returns { count, range, beads:[{targetIdx,startIdx,valStr,color}],
      //           label, prompt, why, loStr, midStr, hiStr }.
      // Two student-chosen modes drive both the generator and the scaffolding:
      //   Mode 1 (Support)    : tenths only, small ranges, ONE marker, every
      //                         tick labeled — the gentlest path.
      //   Mode 2 (Enrichment) : harder values, hundredths, and ordering 2–3
      //                         markers; only endpoints + midpoint labeled.
      // Within a mode, an internal difficulty ramp (level) raises challenge.
      const BEAD_COLORS = [0x5ad1ff, 0xf0b44a, 0x7fd6a0];

      function makeRange(level, mode) {
        // Support mode: tenths only, kept in a small, friendly range.
        if (mode === 1) {
          const lo = randInt(0, 5);
          return { lo, hi: lo + 1, step: 0.1, decimals: 1 };
        }
        let hundredths;
        if (level <= 1) hundredths = false;
        else if (level === 2) hundredths = Math.random() < 0.4;
        else hundredths = Math.random() < (level >= 4 ? 0.55 : 0.4);
        if (hundredths) {
          const base = randInt(0, 9);
          const tenth = randInt(0, 9);
          const lo = Math.round((base + tenth / 10) * 10) / 10;
          return {
            lo,
            hi: Math.round((lo + 0.1) * 100) / 100,
            step: 0.01,
            decimals: 2,
          };
        }
        const lo = randInt(0, 12);
        return { lo, hi: lo + 1, step: 0.1, decimals: 1 };
      }

      function decideCount(level, mode) {
        // Support mode is always a single placement.
        if (mode === 1) return 1;
        if (level <= 1) return 1;
        if (level === 2) return 2;
        if (level === 3) return Math.random() < 0.6 ? 3 : 2;
        return 3;
      }

      function genProblem(level, mode) {
        const count = decideCount(level, mode);
        const range = makeRange(level, mode);
        // Distinct target ticks in 1..9 (endpoints stay as readable labels).
        const targetIdxs = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, count);
        const beads = targetIdxs.map((ti, k) => ({
          targetIdx: ti,
          // Spread the starting positions so markers don't stack on top.
          startIdx: Math.max(
            0,
            Math.min(TICKS, Math.round(((k + 1) / (count + 1)) * TICKS)),
          ),
          valStr: rstr(range, ti),
          color: BEAD_COLORS[k % BEAD_COLORS.length],
        }));
        const loStr = range.lo.toFixed(range.decimals);
        const midStr = rstr(range, 5);
        const hiStr = range.hi.toFixed(range.decimals);
        const stepStr = range.decimals === 1 ? "0.1" : "0.01";
        const unitWord = range.decimals === 1 ? "tenth" : "hundredth";
        let label, prompt, why;
        if (count === 1) {
          const b = beads[0];
          label =
            range.decimals === 1
              ? "Place on the number line · tenths"
              : "Place on the number line · hundredths";
          prompt = "Place " + b.valStr;
          why =
            "Each mark is " +
            stepStr +
            " (one " +
            unitWord +
            "), so " +
            b.valStr +
            " is " +
            b.targetIdx +
            " marks past " +
            loStr +
            ".";
        } else {
          label = "Order least → greatest · drag each marker to its value";
          prompt = "Place each:  " + beads.map((b) => b.valStr).join("   ");
          const sorted = beads
            .map((b) => b.valStr)
            .slice()
            .sort((a, c) => parseFloat(a) - parseFloat(c));
          why =
            "Least to greatest: " +
            sorted.join(", ") +
            ".  Each mark is " +
            stepStr +
            ".";
        }
        return {
          count,
          range,
          beads,
          label,
          prompt,
          why,
          loStr,
          midStr,
          hiStr,
        };
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#102338",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [
          BootScene,
          TitleScene,
          VocabScene,
          ModeScene,
          GameScene,
          ResultScene,
        ],
      };

      // ── Vocab gate state (repo rule: term + Level-1 definition + image/emoji
      // shown BEFORE the first round). Shown by default; skippable only on a
      // replay within the same page session. ──
      let ddVocabSeen = false;
      // Chosen difficulty: 1 = Level 1 (support), 2 = Level 2 (enrichment).
      let ddMode = 1;

      // Key words for THIS game's topic (decimals on a number line). Each has a
      // student-facing (Level 1) definition and an emoji so a visual always
      // shows even with no network/images.
      const DD_VOCAB = [
        {
          term: "Decimal",
          emoji: "🔢",
          def: "A number with a dot that shows parts smaller than one, like 3.7 or 0.25.",
        },
        {
          term: "Tenths",
          emoji: "🔟",
          def: "The first place after the dot. In 3.7, the 7 means 7 tenths (0.7).",
        },
        {
          term: "Hundredths",
          emoji: "💯",
          def: "The second place after the dot. In 2.07, the 7 means 7 hundredths (0.07).",
        },
        {
          term: "Number line",
          emoji: "📏",
          def: "A line where numbers grow as you move right. Each mark is one step bigger.",
        },
        {
          term: "Compare",
          emoji: "⚖️",
          def: "To decide which number is bigger. On a number line, farther right is bigger.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0x5ad1ff);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x102338);
        this.add
          .text(cx, 116, "DECIMAL DASH", {
            fontFamily: "Impact, sans-serif",
            fontSize: "62px",
            color: "#5ad1ff",
            stroke: "#0a1626",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 170, "Number-Line Placer", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            color: "#9fd6ff",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            228,
            "Drag the marker onto the number line to PLACE a decimal.\nHigher up: place several and order them least to greatest, then Lock In!",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#bfe0ff",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            292,
            "Drag, or nudge with ← → / A·D · 6.NOS.3 · Lessons 1.4–1.7",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "14px",
              color: "#7fa8c3",
            },
          )
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 330, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#d4952a",
              fontStyle: "bold",
            })
            .setOrigin(0.5);

        const btn = this.add
          .rectangle(cx, 400, 240, 58, 0x1a6fb5)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "START ▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#eaf6ff",
          })
          .setOrigin(0.5);
        this.tweens.add({
          targets: [btn, btnT],
          scaleX: 1.05,
          scaleY: 1.05,
          duration: 800,
          yoyo: true,
          repeat: -1,
        });
        const start = () => {
          SFX.init();
          SFX.select();
          JUICE.audio.unlock();
          // Show the vocab gate before the first round; on a replay (already
          // seen this session) jump straight to the game.
          // Vocab gate first (first play), then the Level chooser, then play.
          this.scene.start(ddVocabSeen ? "Mode" : "Vocab");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x2080cc));
        btn.on("pointerout", () => btn.setFillStyle(0x1a6fb5));
        btn.on("pointerdown", start);
        this.input.keyboard.on("keydown-SPACE", start);
        this.input.keyboard.on("keydown-ENTER", start);
        srSay("Decimal Dash Number-Line Placer. Press Start to play.");
      };

      // ── VOCAB GATE ──
      // Repo rule: term + Level-1 definition + image/emoji shown BEFORE play.
      // One card per key word; Back / Next; last card starts the game. No
      // answers or giveaways are shown here — only the vocabulary.
      function VocabScene() {
        Phaser.Scene.call(this, "Vocab");
      }
      VocabScene.prototype = Object.create(Phaser.Scene.prototype);
      VocabScene.prototype.constructor = VocabScene;
      VocabScene.prototype.init = function () {
        this.idx = 0;
      };
      VocabScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x102338);
        this.add
          .text(cx, 70, "WORDS TO KNOW FIRST", {
            fontFamily: "Impact, sans-serif",
            fontSize: "34px",
            color: "#5ad1ff",
            stroke: "#0a1626",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        // Card surface.
        this.add
          .rectangle(cx, 320, 560, 320, 0x0a1626)
          .setStrokeStyle(2, 0x1f4a5b);

        this.stepText = this.add
          .text(cx, 185, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            fontStyle: "bold",
            color: "#9fc6e0",
          })
          .setOrigin(0.5);
        this.emojiText = this.add
          .text(cx, 250, "", { fontSize: "76px" })
          .setOrigin(0.5);
        this.termText = this.add
          .text(cx, 330, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "32px",
            fontStyle: "bold",
            color: "#d4952a",
          })
          .setOrigin(0.5);
        this.defText = this.add
          .text(cx, 400, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            color: "#dff1f0",

      VocabScene.prototype.renderCard = function () {
        const v = DD_VOCAB[this.idx];

      VocabScene.prototype.advance = function () {

      // ── LEVEL CHOOSER ──

      ModeScene.prototype.create = function () {

      // ── GAME ──
      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function () {
        this.reduceMotion = !!(
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
        this.mode = ddMode; // 1 = Level 1 (support), 2 = Level 2 (enrichment)
        this.score = 0;
        this.streak = 0;
        this.level = 1; // internal difficulty ramp WITHIN the chosen mode
        this.solved = 0; // problems answered correctly
        this.target = 10; // win condition: solve this many problems
        this.problem = null;
        this.locked = false;
        this.dragging = false;
        this.sel = 0; // index of the currently selected marker
        this.beads = [];
        this.ghosts = [];
        this._lastSaid = null; // debounce: last marker value announced to SR
      };

      GameScene.prototype.create = function () {
        this.add.rectangle(W / 2, H / 2, W, H, 0x102338);

        // HUD (same layout as the shell's other games)
        const hudStyle = {
          fontFamily: "Segoe UI, sans-serif",
          fontSize: "18px",
          fontStyle: "bold",
        };
        this.scoreText = this.add.text(16, 12, "Score: 0", {
          ...hudStyle,
          color: "#5ad1ff",
        });
        this.streakText = this.add
          .text(W - 16, 12, "Streak: 0", { ...hudStyle, color: "#d4952a" })
          .setOrigin(1, 0);
        this.levelText = this.add
          .text(
            W - 16,
            36,
            this.mode === 1 ? "Level 1 · Support" : "Level 2 · Enrichment",
            { ...hudStyle, color: this.mode === 1 ? "#7fd6a0" : "#f0b44a" },
          )
          .setOrigin(1, 0);
        this.progressText = this.add
          .text(W / 2, 12, "0 / " + this.target, {
            ...hudStyle,
            color: "#bfe0ff",
          })
          .setOrigin(0.5, 0);

        // Problem banner
        this.bannerLabel = this.add
          .text(W / 2, 76, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#7fa8c3",
          })
          .setOrigin(0.5);
        this.bannerText = this.add
          .text(W / 2, 108, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "27px",
            fontStyle: "bold",
            color: "#ffffff",
            align: "center",
            wordWrap: { width: W - 80 },
          })
          .setOrigin(0.5);

        this.feedback = this.add
          .text(W / 2, 156, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "17px",
            fontStyle: "bold",
            color: "#d4952a",
            stroke: "#0a1626",
            strokeThickness: 3,
            align: "center",
            wordWrap: { width: W - 80 },
          })
          .setOrigin(0.5)
          .setAlpha(0);

        // Live readout — the heart of the mechanic: the value where the selected
        // marker currently sits, updating as it moves.
        this.readoutBig = this.add
          .text(W / 2, 214, "", {
            fontFamily: "Impact, sans-serif",
            fontSize: "52px",
            color: "#d4952a",
            stroke: "#0a1626",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        this.readoutSub = this.add
          .text(W / 2, 258, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            fontStyle: "bold",
            color: "#9fd6ff",
          })
          .setOrigin(0.5);

        // Number line track + ticks (fixed positions; labels change per round).
        this.add
          .rectangle(LINE_X0, LINE_Y, LINE_W, 5, 0x9fc6e0)
          .setOrigin(0, 0.5);
        for (let i = 0; i <= TICKS; i++) {
          const major = i === 0 || i === 5 || i === TICKS;
          this.add
            .rectangle(tickX(i), LINE_Y, 3, major ? 30 : 16, 0x9fc6e0)
            .setOrigin(0.5);
        }
        // One label per tick (set in newProblem). Support mode labels every
        // tick; enrichment shows only the endpoints + midpoint.
        this.tickLabels = [];
        for (let i = 0; i <= TICKS; i++) {
          const major = i === 0 || i === 5 || i === TICKS;
          this.tickLabels.push(
            this.add
              .text(tickX(i), LINE_Y + 28, "", {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: major ? "16px" : "13px",
                fontStyle: major ? "bold" : "normal",
                color: major ? "#bfe0ff" : "#7fa8c3",
              })
              .setOrigin(0.5, 0),
          );
        }

        // Lock-in button
        this.lockBtn = this.add
          .rectangle(W / 2, 482, 240, 54, 0x1a6fb5)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(W / 2, 482, "LOCK IN ✓", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "22px",
            fontStyle: "bold",
            color: "#eaf6ff",
          })
          .setOrigin(0.5);
        this.lockBtn.on("pointerover", () =>
          this.lockBtn.setFillStyle(0x2080cc),
        );
        this.lockBtn.on("pointerout", () =>
          this.lockBtn.setFillStyle(0x1a6fb5),
        );
        this.lockBtn.on("pointerdown", () => this.lockIn());

        // Hint — fuller in support mode, brief in enrichment.
        this.hintText = this.add
          .text(
            W / 2,
            532,
            this.mode === 1
              ? "Drag the marker, or press ← → (A·D) to step one mark at a time. The number under the marker shows where you are. Press Enter when it matches."
              : "Drag a marker or press ← → (A·D). Use 1·2·3 to switch markers. Enter = lock in.",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "14px",
              color: "#7fa8c3",
              align: "center",
              wordWrap: { width: W - 120 },
            },
          )
          .setOrigin(0.5);

        // Brief calm amber tint for a not-yet placement (no-fail practice).
        this.amberTint = this.add
          .rectangle(W / 2, H / 2, W, H, 0xf0b44a, 0)
          .setDepth(30);

        // Input: drag/tap on or near the line; arrows / A·D nudge ±1 tick;
        // 1·2·3 pick a marker; Enter/Space lock in.
        this.input.on("pointerdown", (p) => {
          if (this.locked) return;
          const grabbed = this.beadAt(p.worldX, p.worldY);
          if (grabbed >= 0) {
            this.sel = grabbed;
            this.dragging = true;
            this.updateSelectionVisual();
            this.updateReadout();
            SFX.init();
            SFX.select();
          } else if (
            p.worldY > LINE_Y - 120 &&
            p.worldY < LINE_Y + 40 &&
            this.beads.length
          ) {
            // Tap on/near the number line moves the selected marker there
            // (touch friendly). Band spans the markers (which sit above the
            // line) down to just below it, but stops short of the Lock In
            // button so empty-space taps no longer nudge the marker.
            this.setBeadIndex(this.beads[this.sel], nearestIndex(p.worldX));
            SFX.init();
            SFX.move();
          }
        });
        this.input.on("pointermove", (p) => {
          if (this.dragging && !this.locked && this.beads[this.sel])
            this.setBeadIndex(this.beads[this.sel], nearestIndex(p.worldX));
        });
        this.input.on("pointerup", () => {
          this.dragging = false;
        });
        const nudge = (d) => {
          if (this.locked || !this.beads[this.sel]) return;
          this.setBeadIndex(this.beads[this.sel], this.beads[this.sel].idx + d);
          SFX.init();
          SFX.move();
        };
        this.input.keyboard.on("keydown-LEFT", () => nudge(-1));
        this.input.keyboard.on("keydown-RIGHT", () => nudge(1));
        this.input.keyboard.on("keydown-A", () => nudge(-1));
        this.input.keyboard.on("keydown-D", () => nudge(1));
        this.input.keyboard.on("keydown-ONE", () => this.selectBead(0));
        this.input.keyboard.on("keydown-TWO", () => this.selectBead(1));
        this.input.keyboard.on("keydown-THREE", () => this.selectBead(2));
        this.input.keyboard.on("keydown-ENTER", () => this.lockIn());
        this.input.keyboard.on("keydown-SPACE", () => this.lockIn());

        this.cameras.main.fadeIn(400);
        this.newProblem();
      };

      // Vertical offsets that lift markers off the line so they never overlap.
      GameScene.prototype.offsetsFor = function (count) {
        if (count === 1) return [-50];
        if (count === 2) return [-50, -84];
        return [-46, -76, -106];
      };

      GameScene.prototype.beadAt = function (x, y) {
        let best = -1,
          bd = 1e9;
        this.beads.forEach((b, i) => {
          const bx = b.c.x;
          const by = LINE_Y + b.yOff;
          const d = Math.hypot(x - bx, y - by);
          if (d < bd) {
            bd = d;
            best = i;
          }
        });
        return bd < 70 ? best : -1;
      };

      GameScene.prototype.selectBead = function (i) {
        if (this.locked || i < 0 || i >= this.beads.length) return;
        this.sel = i;
        this.updateSelectionVisual();
        this.updateReadout();
        SFX.init();
        SFX.select();
      };

      GameScene.prototype.updateSelectionVisual = function () {
        this.beads.forEach((b, i) => {
          const on = i === this.sel;
          b.body.setStrokeStyle(on ? 5 : 3, on ? 0xffffff : 0x6b97b3);
          b.c.setDepth(on ? 16 : 14);
        });
      };

      GameScene.prototype.updateReadout = function () {
        const b = this.beads[this.sel];
        if (!b) return;
        this.readoutBig.setText(rstr(this.problem.range, b.idx));
        if (this.beads.length === 1) {
          this.readoutSub.setText("Goal: place " + b.valStr);
        } else {
          this.readoutSub.setText(
            "Marker " +
              (this.sel + 1) +
              " of " +
              this.beads.length +
              " holds " +
              b.valStr +
              " · tap a marker to switch",
          );
        }
      };

      GameScene.prototype.setBeadIndex = function (b, idx) {
        b.idx = Phaser.Math.Clamp(idx, 0, TICKS);
        b.c.x = tickX(b.idx);
        if (this.beads[this.sel] === b) {
          this.updateReadout();
          // Announce the marker's value to screen readers (debounced by value
          // so dragging/nudging doesn't spam the live region).
          if (this.problem) {
            const val = rstr(this.problem.range, b.idx);
            if (val !== this._srVal) {
              this._srVal = val;
              srSay("Marker at " + val + ".");
            }
          }
        }
      };

      GameScene.prototype.buildBeads = function () {
        // Clear any previous markers / teaching ghosts.
        this.beads.forEach((b) => b.c.destroy());
        this.beads = [];
        this.ghosts.forEach((g) => g.destroy());
        this.ghosts = [];

        const list = this.problem.beads;
        const offs = this.offsetsFor(list.length);
        list.forEach((spec, i) => {
          const yOff = offs[i];
          const c = this.add.container(tickX(spec.startIdx), LINE_Y);
          const stem = this.add.rectangle(
            0,
            yOff / 2,
            4,
            Math.abs(yOff),
            0xcfe8ff,
            0.55,
          );
          const dot = this.add
            .circle(0, 0, 6, spec.color)
            .setStrokeStyle(2, 0x0a1626);
          const body = this.add
            .rectangle(0, yOff, 78, 44, spec.color)
            .setStrokeStyle(3, 0x6b97b3);
          const txt = this.add
            .text(0, yOff, spec.valStr, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "22px",
              fontStyle: "bold",
              color: "#0a1626",
            })
            .setOrigin(0.5);
          c.add([stem, dot, body, txt]);
          const bead = {
            c,
            body,
            txt,
            dot,
            stem,
            yOff,
            color: spec.color,
            valStr: spec.valStr,
            targetIdx: spec.targetIdx,
            idx: spec.startIdx,
          };
          this.beads.push(bead);
          JUICE.popIn(this, c, i * 80);
        });
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.dragging = false;
        this.sel = 0;
        this.problem = genProblem(this.level, this.mode);
        this.bannerLabel.setText(this.problem.label);
        this.bannerText.setText(this.problem.prompt);
        // Tick labels: support mode labels every tick; enrichment shows only
        // the endpoints + midpoint.
        const range = this.problem.range;
        for (let i = 0; i <= TICKS; i++) {
          const major = i === 0 || i === 5 || i === TICKS;
          const show = this.mode === 1 || major;
          this.tickLabels[i].setText(show ? rstr(range, i) : "");
        }
        this.feedback.setAlpha(0);
        this.buildBeads();
        this.updateSelectionVisual();
        this.updateReadout();
        const gates = this.problem.beads.map((b) => b.valStr).join(", ");
        srSay(
          this.problem.label +
            ". " +
            this.problem.prompt +
            ". Drag each marker to its spot on the number line from " +
            this.problem.loStr +
            " to " +
            this.problem.hiStr +
            ", then lock it in. Values: " +
            gates +
            ".",
        );
      };

      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        this.locked = true;
        this.dragging = false;
        const allCorrect = this.beads.every((b) => b.idx === b.targetIdx);
        if (allCorrect) {
          SFX.good();
          this.solved++;
          this.streak++;
          const bonus = Math.min(this.streak, 5) * 5;
          const gained = 20 + bonus;
          this.score += gained;
          this.beads.forEach((b) => {
            b.body.setFillStyle(0x2d9e5a);
            const wx = b.c.x;
            const wy = LINE_Y + b.yOff;
            JUICE.burst(this, wx, wy, [0x5ad1ff, 0x7fd6a0, 0xffffff], 14);
          });
          JUICE.audio.correct(this.streak);
          JUICE.floatText(this, W / 2, 200, "+" + gained, "#7fd6a0", 30);
          JUICE.award(gained, "u1-decimal-dash");
          this.flash(W / 2, 188, "Correct! ✓", "#7fd6a0");
          this.feedback.setText("Correct! " + this.problem.why).setAlpha(1);
          srSay("Correct. " + this.problem.why);
          this.afterAttempt(true);
        } else {
          SFX.bad();
          JUICE.audio.wrong();
          this.streak = 0;
          this.flashAmber();
          JUICE.shake(this, 0.006);
          this.beads.forEach((b) => {
            if (b.idx !== b.targetIdx) b.body.setFillStyle(0xc23b3b);
          });
          this.feedback.setText("Not quite — " + this.problem.why).setAlpha(1);
          srSay("Not quite. " + this.problem.why);
          // Teach: drop a green ghost on each correct tick and glide each marker
          // home, then continue.
          this.beads.forEach((b) => {
            const gx = tickX(b.targetIdx);
            const ghost = this.add
              .circle(gx, LINE_Y, 10, 0x7fd6a0, 0.6)
              .setDepth(5);
            this.ghosts.push(ghost);
            this.tweens.add({
              targets: b.c,
              x: gx,
              duration: this.reduceMotion ? 0 : 600,
              ease: "Quad.easeOut",
              onUpdate: () => {
                b.idx = nearestIndex(b.c.x);
              },
            });
          });
          this.time.delayedCall(this.reduceMotion ? 60 : 700, () => {
            this.beads.forEach((b) => (b.idx = b.targetIdx));
            this.afterAttempt(false);
          });
        }
      };

      GameScene.prototype.afterAttempt = function (correct) {
        // Internal difficulty ramp every 2 correct (caps at 5). In enrichment
        // this introduces hundredths + ordering; in support it nudges ranges
        // only. The "Step up!" cue shows in enrichment, where it changes feel.
        const newLevel = Math.min(5, 1 + Math.floor(this.solved / 2));
        if (newLevel > this.level) {
          this.level = newLevel;
          if (this.mode === 2) {
            SFX.level();
            this.flash(W / 2, 188, "STEP UP! ▲", "#f0b44a");
          }
        }
        this.updateHUD();
        if (this.solved >= this.target) {
          this.endGame();
          return;
        }
        this.time.delayedCall(correct ? 900 : 1200, () => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.flash = function (x, y, text, color) {
        const ft = this.add
          .text(x, y, text, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            fontStyle: "bold",
            color: color,
            stroke: "#0a1626",
            strokeThickness: 4,
          })
          .setOrigin(0.5)
          .setDepth(40);
        this.tweens.add({
          targets: ft,
          y: y - 50,
          alpha: { from: 1, to: 0 },
          duration: this.reduceMotion ? 500 : 900,
          onComplete: () => ft.destroy(),
        });
      };

      GameScene.prototype.flashAmber = function () {
        if (this.reduceMotion) return;
        this.amberTint.setAlpha(0.18);
        this.tweens.add({
          targets: this.amberTint,
          alpha: 0,
          duration: 350,
        });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.streakText.setText("Streak: " + this.streak);
        // levelText shows the CHOSEN level (Support / Enrichment); it is set
        // once in create() and stays fixed for the game.
        this.progressText.setText(this.solved + " / " + this.target);
      };

      GameScene.prototype.endGame = function () {
        this.locked = true;
        this.time.delayedCall(500, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.reduceMotion = !!(
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
        this.add.rectangle(cx, H / 2, W, H, 0x102338);
        // Stars from progress.
        const stars =
          d.solved >= d.target ? 3 : d.solved >= d.target * 0.6 ? 2 : 1;
        // High score
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        const isNewHigh = d.score > hs;
        if (isNewHigh) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }

        this.add
          .text(cx, 110, "NUMBER-LINE MASTER!", {
            fontFamily: "Impact, sans-serif",
            fontSize: "46px",
            color: "#5ad1ff",
            stroke: "#0a1626",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        const starStr = "★".repeat(stars) + "☆".repeat(3 - stars);
        this.add
          .text(cx, 185, starStr, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "48px",
            color: "#d4952a",
          })
          .setOrigin(0.5);

        this.add
          .text(cx, 255, "Score: " + d.score, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "30px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            295,
            "Placed " + d.solved + " of " + d.target + " problems",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "18px",
              color: "#bfe0ff",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 325, "High Score: " + hs, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#d4952a",
          })
          .setOrigin(0.5);
        if (isNewHigh && d.score > 0)
          this.add
            .text(cx, 352, "★ NEW HIGH SCORE! ★", {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              fontStyle: "bold",
              color: "#d4952a",
            })
            .setOrigin(0.5);

        SFX.win();
        JUICE.audio.fanfare();
        JUICE.confetti(this, 4);

        // EduPulse reporting (guarded; safe no-op without bridge).
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: ACTIVITY_TITLE,
              score: d.score,
              stars: stars,
              standard: STANDARD,
              problemsCorrect: d.solved,
              problemsAttempted: d.target,
            });
        } catch (e) {}
        srSay("You won! Final score " + d.score + ", " + stars + " stars.");

        const btn = this.add
          .rectangle(cx, 410, 220, 54, 0x1a6fb5)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx, 410, "PLAY AGAIN 🔁", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#eaf6ff",
          })
          .setOrigin(0.5);
        // Back to the level chooser so the student can switch Level 1 / 2.
        const again = () => this.scene.start("Mode");
        btn.on("pointerover", () => btn.setFillStyle(0x2080cc));
        btn.on("pointerout", () => btn.setFillStyle(0x1a6fb5));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        this.cameras.main.fadeIn(400);
      };

      // ── Launch ──
      const ddGame = new Phaser.Game(config);

      // Canvas accessibility (additive; no gameplay change).
      ddGame.events.once("ready", function () {
        try {
          const cv = ddGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Decimal Dash Number-Line Placer math game. A decimal to place " +
              "appears at the top; drag a marker, or use the left and right " +
              "arrow keys or A and D, to move it onto the matching tick on the " +
              "number line. At higher levels, place several markers and order " +
              "them. Press 1, 2, or 3 to pick a marker, then press Lock In, " +
              "Enter, or Space.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>
