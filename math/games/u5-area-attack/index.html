    <!-- Decorative animated spark-field (behind the Phaser canvas). -->
    <div id="aa-bg" data-parallax aria-hidden="true">
      <div id="aa-bg-layer" data-parallax-layer></div>

    <script>
      // Decorative spark-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("aa-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 34;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "aa-spark";
            var sz = rnd(2, 5);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" + (dx * 20).toFixed(2) + "px," + (dy * 12).toFixed(2) + "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener) reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── AREA ATTACK — DECOMPOSE & TILE ──
      // Phaser 3 — Grade 6 Math — Area of rectangles & composite figures.
      // Mechanic (math-as-mechanic, calm, NO timer / NO reflex): a target shape
      // is OUTLINED on a unit grid. The student COVERS it by drawing rectangles
      // of unit tiles — drag from one cell to another (or arrow a cursor and
      // press F to set corner A then corner B). A live readout shows the total
      // tiles placed = the current area. Lock In checks the tiles EXACTLY cover
      // the target (no gaps, no overflow) and the area count is right.
      // On wrong math the gaps and overflow flash and the correct area + the
      // formula are shown, so a miss teaches — no lives, no fail state (calm,
      // self-paced classroom mode). Two levels:
      //   Level 1 (support)    — small rectangles + triangles, base/height
      //                          labels, hints.
      //   Level 2 (enrichment) — larger L-shapes you must DECOMPOSE + bigger
      //                          triangles, fewer labels.
      // Triangles (6.GR.1 ½bh): a right triangle is drawn inside its
      // surrounding rectangle; the student tiles the b×h rectangle and the
      // teach is that the triangle is exactly HALF of it. b·h is always even,
      // so every triangle area is a whole number.

      const W = 820,
        H = 600;
      const LS_KEY = "aa_tile_highscore";

      // ── Unit grid geometry in game space. Phaser Scale.FIT maps pointer
      // coordinates into this space, so cell math works at any screen size. ──
      const COLS = 11,
        ROWS = 8,
        CELL = 38;
      const GRID_X0 = 70,
        GRID_Y0 = 170;
      const GRID_W = COLS * CELL,
        GRID_H = ROWS * CELL;
      function cellPX(c) {
        return GRID_X0 + c * CELL;
      }
      function cellPY(r) {
        return GRID_Y0 + r * CELL;
      }
      function inGrid(x, y) {
        return x >= GRID_X0 && x < GRID_X0 + GRID_W && y >= GRID_Y0 && y < GRID_Y0 + GRID_H;
      }
      function colFromX(x) {
        return Phaser.Math.Clamp(Math.floor((x - GRID_X0) / CELL), 0, COLS - 1);
      }
      function rowFromY(y) {
        return Phaser.Math.Clamp(Math.floor((y - GRID_Y0) / CELL), 0, ROWS - 1);
      }
      const keyRC = (c, r) => c + "," + r;

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx || window.NT_MUTED) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        miss() {
          this.play("triangle", 240, 0.16, 0.12);
        },
        place() {
          this.play("square", 520, 0.05, 0.07);
        },
        coin() {
          this.play("square", 1040, 0.05, 0.08);
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
      };

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          tap() {},
          pop() {},
          correct() {},
          wrong() {},
          whoosh() {},
          fanfare() {},
          musicStart() {},
          musicStop() {},
        },
        theme: () => ({
          accent: "#5fd0ef",
          accentN: 0x5fd0ef,
          tileN: 0x17506a,
          botN: 0x0e2531,
        }),
        bgGradient() {},
        popIn() {},
        tilePop() {},
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function srSay(msg) {
        const el = document.getElementById("aa-sr");
        if (el) el.textContent = msg;
      }

      // ── Triangle problems (6.GR.1: A = ½bh) ──────────────────────────────
      // A right triangle drawn inside its surrounding b×h rectangle. The tile
      // mechanic is unchanged: the student tiles the SURROUNDING RECTANGLE
      // (cells = the b×h block), and the teach is that the triangle is exactly
      // HALF of it — ½ × base × height. b·h is forced even, so the triangle's
      // area is always a whole number.
      function makeTriangle(level) {
        let b, h;
        do {
          b = level === 1 ? randInt(2, 6) : randInt(3, 8);
          h = level === 1 ? randInt(2, 5) : randInt(3, 6);
        } while ((b * h) % 2 !== 0);
        const oc = randInt(0, COLS - b),
          or = randInt(0, ROWS - h);
        const cells = new Set();
        for (let r = 0; r < h; r++) for (let c = 0; c < b; c++) cells.add(keyRC(oc + c, or + r));
        const area = (b * h) / 2;
        return {
          level,
          kind: "tri",
          cells,
          area,
          rectArea: b * h,
          oc,
          or,
          w: b,
          h,
          orient: randInt(0, 3), // which rectangle corner holds the right angle
          label: "Triangle — half the rectangle",
          prompt: "Step 1: tile the rectangle AROUND the triangle. Then Lock In.",
          why:
            "Triangle area = ½ × base × height = ½ × " +
            b +
            " × " +
            h +
            " = " +
            area +
            " square units — half of the " +
            b +
            "×" +
            h +
            " rectangle you tiled.",
        };
      }

      // ── Problem generator (grid shapes) ─────────────────────────────────
      // Returns { level, kind, cells(Set "c,r"), area, oc, or, w, h, cw, ch,
      //           label, prompt, why }. Always on integer cells so an exact
      //           tile-cover is possible.
      function makeProblem(level) {
        // Triangles join the mix at BOTH levels (~40% of problems).
        if (Math.random() < 0.4) return makeTriangle(level);
        if (level === 1) {
          const w = randInt(2, 6),
            h = randInt(2, 5);
          const oc = randInt(0, COLS - w),
            or = randInt(0, ROWS - h);
          const cells = new Set();
          for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) cells.add(keyRC(oc + c, or + r));
          return {
            level: 1,
            kind: "rect",
            cells,
            area: w * h,
            oc,
            or,
            w,
            h,
            label: "Find the area",
            prompt: "Step 1: cover the rectangle with tiles. Then Lock In.",
            why: "Area = base × height = " + w + " × " + h + " = " + w * h + " square units.",
          };
        }
        // Level 2 — an L-shape: a W×H block with one corner notched out, so it
        // can only be covered by 2+ rectangles (forces decomposition).
        const Wc = randInt(4, 7),
          Hc = randInt(4, 6);
        const cw = randInt(1, Wc - 1),
          ch = randInt(1, Hc - 1);
        const corner = randInt(0, 3); // 0 TL, 1 TR, 2 BL, 3 BR
        const oc = randInt(0, COLS - Wc),
          or = randInt(0, ROWS - Hc);
        const removed = (c, r) => {
          const left = c < cw,
            right = c >= Wc - cw,
            top = r < ch,
            bot = r >= Hc - ch;
          if (corner === 0) return left && top;
          if (corner === 1) return right && top;
          if (corner === 2) return left && bot;
          return right && bot;
        };
        const cells = new Set();
        for (let r = 0; r < Hc; r++)
          for (let c = 0; c < Wc; c++) if (!removed(c, r)) cells.add(keyRC(oc + c, or + r));
        const area = Wc * Hc - cw * ch;
        const r1 = Wc * (Hc - ch),
          r2 = (Wc - cw) * ch;
        return {
          level: 2,
          kind: "ell",
          cells,
          area,
          oc,
          or,
          w: Wc,
          h: Hc,
          cw,
          ch,
          label: "Decompose & find the area",
          prompt: "Step 1: cover the L-shape with rectangles of tiles. Then Lock In.",
          why:
            "Break it into 2 rectangles: " +
            Wc +
            "×" +
            (Hc - ch) +
            " + " +
            (Wc - cw) +
            "×" +
            ch +
            " = " +
            r1 +
            " + " +
            r2 +
            " = " +
            area +
            " square units.",
        };
      }

      // ── Step 2: "What is the area?" choices ──────────────────────────────
      // Covering the shape builds the model; the student then states its area.
      // Distractors are real misconceptions, each with its own explanation.
      function areaChoices(p) {
        const ds = [];
        if (p.kind === "tri") {
          const b = p.w,
            h = p.h;
          ds.push({ value: b * h, why: b * h + " is the whole " + b + "×" + h + " rectangle. The triangle covers only HALF of it." });
          ds.push({ value: b + h, why: "You added the base and height. Area multiplies: ½ × base × height." });
          ds.push({ value: b * h * 2, why: "You doubled. The triangle is HALF of the rectangle, so divide by 2." });
          ds.push({ value: p.area + 1, why: "Close. Find b × h first, then take half of it." });
        } else if (p.kind === "ell") {
          const big = p.w * p.h,
            notch = p.cw * p.ch,
            r1 = p.w * (p.h - p.ch);
          ds.push({ value: big, why: big + " is the big " + p.w + "×" + p.h + " rectangle. The corner is cut out, so subtract it." });
          ds.push({ value: r1, why: r1 + " is only one of the two rectangles. Add the other piece too." });
          ds.push({ value: big + notch, why: "You added the missing corner. Subtract it instead." });
          ds.push({ value: 2 * (p.w + p.h), why: "That is the distance AROUND (perimeter). Area counts the squares inside." });
        } else {
          const b = p.w,
            h = p.h;
          ds.push({ value: b + h, why: "You added the base and height. Area multiplies: base × height." });
          ds.push({ value: 2 * (b + h), why: "That is the distance AROUND (perimeter). Area counts the squares inside." });
          ds.push({ value: b * h + b, why: "Close. Recount the rows: there are " + h + " rows of " + b + "." });
          ds.push({ value: b * h - b, why: "Close. Recount the rows: there are " + h + " rows of " + b + "." });
        }
        const seen = new Set([p.area]);
        const opts = [{ value: p.area, correct: true, why: "" }];
        ds.forEach((d) => {
          if (opts.length >= 4 || !(d.value > 0) || seen.has(d.value)) return;
          seen.add(d.value);
          opts.push({ ...d, correct: false });
        });
        for (let i = opts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        return opts.map((o) => ({ ...o, label: String(o.value) }));
      }
      const SHAPE_NAME = { rect: "rectangle", tri: "triangle", ell: "L-shape" };
      const KIND_TIP = {
        rect: "Rectangles: area = base × height (rows × squares in each row).",
        tri: "Triangles: area = ½ × base × height, half of the rectangle around it.",
        ell: "L-shapes: split into two rectangles, find each area, then add.",
      };
      const AA_STREAK_KEY = "aa_tile_beststreak";
      function calmMotion() {
        if (window.GameStudio) return !!window.GameStudio.settings.reducedMotion;
        return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0e2531",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, VocabScene, LevelScene, GameScene, ResultScene],
      };

      // ── Vocab gate state (repo rule: term + Level-1 definition + image/emoji
      // shown BEFORE the first round). Shown by default; skippable only on a
      // replay within the same page session. ──
      let aaVocabSeen = false;
      // Chosen difficulty (set on the Level Select screen). 1 = support, 2 = enrichment.
      let aaLevel = 1;
      let aaAuto = false; // true when the ✨ Auto button picked the level (NTAdaptive)
      let aaEndless = false; // true for endless (no auto-end) runs

      // Key words for THIS game's topic (area on a unit grid). Each has a
      // student-facing (Level 1) definition and an emoji so a visual always
      // shows even with no network/images.
      const AA_VOCAB = [
        {
          term: "Area",
          emoji: "🟦",
          def: "The amount of flat space a shape covers, counted in square units.",
        },
        {
          term: "Square unit",
          emoji: "⬜",
          def: "One little square on the grid. Area is how many of these fit inside a shape.",
        },
        {
          term: "Base",
          emoji: "↔️",
          def: "How wide a shape is — the number of squares across one row.",
        },
        {
          term: "Height",
          emoji: "↕️",
          def: "How tall a shape is — the number of squares up and down.",
        },
        {
          term: "Decompose",
          emoji: "✂️",
          def: "Break a tricky shape into rectangles, find each area, then add them up.",
        },
        {
          term: "Triangle area",
          emoji: "📐",
          def: "A triangle covers HALF of the rectangle around it: area = ½ × base × height.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0x5fd0ef);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");

        this.input.keyboard.on("keydown-DOWN", () => moveCur(0, 1));
        this.input.keyboard.on("keydown-F", () => {
          if (this.locked || this.phase !== "build") return;
          this.kbActive = true;
          if (!this.cornerA) {
            this.cornerA = { c: this.cur.c, r: this.cur.r };
            SFX.place();
          } else {
            this.commitRect(this.cornerA.c, this.cornerA.r, this.cur.c, this.cur.r);
            this.cornerA = null;
          }
          this.drawCursor();
          this.drawPreview();
        });
        this.input.keyboard.on("keydown-U", () => this.undo());
        this.input.keyboard.on("keydown-C", () => this.clearTiles());
        this.input.keyboard.on("keydown-ENTER", () => this.lockIn());
        this.input.keyboard.on("keydown-SPACE", () => this.lockIn());
        ["ONE", "TWO", "THREE", "FOUR"].forEach((k, i) =>
          this.input.keyboard.on("keydown-" + k, () => {
            if (this.phase === "area" && !this.locked) this.submitChoice(i);
          }),
        );
        this.events.once("shutdown", () => this.hideChoices());

        if (!this.reduceMotion) this.cameras.main.fadeIn(400);
        this.newProblem();
      };

      // Static panel + gridlines (drawn once).
      GameScene.prototype.drawStaticGrid = function () {
        const g = this.gStatic;
        g.clear();
        g.fillStyle(0x0c2230, 1).fillRect(GRID_X0, GRID_Y0, GRID_W, GRID_H);
        g.lineStyle(1, 0x1b3543, 1);
        for (let c = 0; c <= COLS; c++) {
          g.lineBetween(cellPX(c), GRID_Y0, cellPX(c), GRID_Y0 + GRID_H);
        }
        for (let r = 0; r <= ROWS; r++) {
          g.lineBetween(GRID_X0, cellPY(r), GRID_X0 + GRID_W, cellPY(r));
        }
        g.lineStyle(2, 0x2a4d5c, 1).strokeRect(GRID_X0, GRID_Y0, GRID_W, GRID_H);
      };

      // Target blueprint (faint fill) + bold outline + Level-1 labels.
      GameScene.prototype.drawTarget = function () {
        const p = this.problem;
        const fill = this.gTargetFill;
        const out = this.gOutline;
        fill.clear();
        out.clear();
        fill.fillStyle(0x17506a, 0.45);
        p.cells.forEach((k) => {
          const [c, r] = k.split(",").map(Number);
          fill.fillRect(cellPX(c) + 1, cellPY(r) + 1, CELL - 2, CELL - 2);
        });
        // Bold outline: stroke each cell edge that borders a non-target cell.
        out.lineStyle(4, 0x5fd0ef, 1);
        p.cells.forEach((k) => {
          const [c, r] = k.split(",").map(Number);
          const x = cellPX(c),
            y = cellPY(r);
          if (!p.cells.has(keyRC(c, r - 1))) out.lineBetween(x, y, x + CELL, y);
          if (!p.cells.has(keyRC(c, r + 1))) out.lineBetween(x, y + CELL, x + CELL, y + CELL);
          if (!p.cells.has(keyRC(c - 1, r))) out.lineBetween(x, y, x, y + CELL);
          if (!p.cells.has(keyRC(c + 1, r))) out.lineBetween(x + CELL, y, x + CELL, y + CELL);
        });

        // Triangle problems: draw the triangle in gold inside the (already
        // outlined) surrounding rectangle. The student tiles the rectangle;
        // the triangle overlay makes "half of it" visible.
        if (p.kind === "tri") {
          const x0 = cellPX(p.oc),
            y0 = cellPY(p.or);
          const x1 = cellPX(p.oc + p.w),
            y1 = cellPY(p.or + p.h);
          const tri = [
            [x0, y1, x1, y1, x0, y0], // right angle bottom-left
            [x0, y1, x1, y1, x1, y0], // right angle bottom-right
            [x0, y0, x1, y0, x0, y1], // right angle top-left
            [x0, y0, x1, y0, x1, y1], // right angle top-right
          ][p.orient];
          out.fillStyle(0xffd24a, 0.25);
          out.fillTriangle(tri[0], tri[1], tri[2], tri[3], tri[4], tri[5]);
          out.lineStyle(4, 0xffd24a, 1);
          out.strokeTriangle(tri[0], tri[1], tri[2], tri[3], tri[4], tri[5]);
        }

        // Clear old labels, then add base/height labels (Level 1 only).
        this.labels.forEach((t) => t.destroy());
        this.labels = [];
        if (p.level === 1) {
          const baseX = cellPX(p.oc + p.w / 2);
          const baseY = cellPY(p.or + p.h) + 12;
          this.labels.push(
            this.add
              .text(baseX, baseY, "base = " + p.w, {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "14px",
                fontStyle: "bold",
                color: "#7ee0ad",
              })
              .setOrigin(0.5, 0)
              .setDepth(6),
          );
          const htX = cellPX(p.oc) - 8;
          const htY = cellPY(p.or + p.h / 2);
          this.labels.push(
            this.add
              .text(htX, htY, "height\n= " + p.h, {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "13px",
                fontStyle: "bold",
                color: "#7ee0ad",
                align: "right",
              })
              .setOrigin(1, 0.5)
              .setDepth(6),
          );
        }
      };

      GameScene.prototype.recompute = function () {
        // Rebuild the cover grid from the list of placed rectangles.
        this.covered = [];
        for (let r = 0; r < ROWS; r++) this.covered.push(new Array(COLS).fill(false));
        this.placed.forEach((rc) => {
          const c0 = Math.min(rc.c0, rc.c1),
            c1 = Math.max(rc.c0, rc.c1);
          const r0 = Math.min(rc.r0, rc.r1),
            r1 = Math.max(rc.r0, rc.r1);
          for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) this.covered[r][c] = true;
        });
        this.drawCover();
      };

      GameScene.prototype.coveredCount = function () {
        let n = 0;
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.covered[r][c]) n++;
        return n;
      };

      GameScene.prototype.drawCover = function () {
        const g = this.gCover;
        g.clear();
        g.fillStyle(0x2fae73, 0.85);
        g.lineStyle(1, 0x176b46, 1);
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            if (this.covered[r][c]) {
              g.fillRect(cellPX(c) + 1, cellPY(r) + 1, CELL - 2, CELL - 2);
              g.strokeRect(cellPX(c) + 1, cellPY(r) + 1, CELL - 2, CELL - 2);
            }
        this.areaNum.setText(String(this.placed.length));
        this.areaUnit.setText(this.placed.length === 1 ? "rectangle placed" : "rectangles placed");
        this.updateCoach();
      };

      GameScene.prototype.drawPreview = function () {
        const g = this.gPreview;
        g.clear();
        let c0, r0, c1, r1;
        if (this.dragging) {
          c0 = this.dragC0;
          r0 = this.dragR0;
          c1 = this.dragC1;
          r1 = this.dragR1;
        } else if (this.cornerA) {
          c0 = this.cornerA.c;
          r0 = this.cornerA.r;
          c1 = this.cur.c;
          r1 = this.cur.r;
        } else {
          return;
        }
        const cc0 = Math.min(c0, c1),
          cc1 = Math.max(c0, c1);
        const rr0 = Math.min(r0, r1),
          rr1 = Math.max(r0, r1);
        g.fillStyle(0x5fd0ef, 0.3);
        g.lineStyle(2, 0x5fd0ef, 0.9);
        const x = cellPX(cc0),
          y = cellPY(rr0);
        const w = (cc1 - cc0 + 1) * CELL,
          h = (rr1 - rr0 + 1) * CELL;
        g.fillRect(x, y, w, h);
        g.strokeRect(x, y, w, h);
      };

      GameScene.prototype.drawCursor = function () {
        const g = this.gCursor;
        g.clear();
        if (!this.kbActive || this.locked || this.phase !== "build") return;
        if (this.cornerA) {
          g.fillStyle(0xffd24a, 0.4);
          g.fillRect(cellPX(this.cornerA.c) + 2, cellPY(this.cornerA.r) + 2, CELL - 4, CELL - 4);
        }
        g.lineStyle(3, 0xffd24a, 1);
        g.strokeRect(cellPX(this.cur.c) + 2, cellPY(this.cur.r) + 2, CELL - 4, CELL - 4);
      };

      GameScene.prototype.commitRect = function (c0, r0, c1, r1) {
        this.placed.push({ c0, r0, c1, r1 });
        this.recompute();
        this.gFlash.clear(); // stale miss-highlights no longer match the cover
        SFX.place();
        JUICE.audio.pop();
        const cx = cellPX((Math.min(c0, c1) + Math.max(c0, c1) + 1) / 2);
        const cy = cellPY((Math.min(r0, r1) + Math.max(r0, r1) + 1) / 2);
        JUICE.tilePop(this, this.gCover);
        JUICE.burst(this, cx, cy, [0x2fae73, 0x5fd0ef, 0xffffff], 8);
      };

      GameScene.prototype.undo = function () {
        if (this.locked || this.phase !== "build" || !this.placed.length) return;
        this.placed.pop();
        this.recompute();
        this.gFlash.clear();
        SFX.miss();
      };

      GameScene.prototype.clearTiles = function () {
        if (this.locked || this.phase !== "build" || !this.placed.length) return;
        this.placed = [];
        this.recompute();
        this.gFlash.clear();
        SFX.miss();
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.phase = "build";
        this.tries = 0;
        this.areaTries = 0;
        this.usedHelp = false;
        this.placed = [];
        this.cornerA = null;
        this.cur = { c: 0, r: 0 };
        this.hideChoices();
        this.problem = makeProblem(this.level);
        this.problem.choices = areaChoices(this.problem);
        this.bannerLabel.setText(this.problem.label + " · Step 1 of 2: cover the shape");
        this.bannerText.setText(this.problem.prompt);
        this.feedback.setAlpha(0).setText("");
        this.areaHead.setText("STEP 1 · BUILD");
        this.buildUI.forEach((o) => o.setVisible(true));
        this.gFlash.clear();
        this.drawTarget();
        this.recompute();
        this.drawCursor();
        this.updateHUD();
        const p = this.problem;
        srSay(
          p.label +
            ". " +
            p.prompt +
            " " +
            (p.kind === "tri"
              ? "A triangle is drawn inside a rectangle " +
                p.w +
                " across and " +
                p.h +
                " tall. Tile the whole rectangle, then lock in."
              : "A " +
                (p.kind === "rect" ? "rectangle" : "L-shape") +
                " is outlined on the grid. Lay tiles to cover it exactly, then lock in."),
        );
      };

      // Support tier (Level 1): a live coach that names the next action.
      // Every level: a key-help line for the current step.
      GameScene.prototype.updateCoach = function () {
        if (!this.hint || !this.problem) return;
        if (this.phase === "area") {
          this.hint.setText("Pick the area: tap a number, or use the arrow keys and Enter, or press 1–4.");
        } else {
          this.hint.setText("Drag across the grid to lay a rectangle of tiles. Keys: arrows move, F sets a corner, U undo, C clear, Enter check.");
        }
        if (this.level !== 1 || this.locked || this.phase === "done") {
          this.coachText.setText("");
          return;
        }
        const p = this.problem;
        let msg;
        if (this.phase === "area")
          msg =
            p.kind === "tri"
              ? "Next: find base × height, then take HALF. Pick that number."
              : "Next: multiply base × height" + (p.kind === "ell" ? " for each piece, then add." : ".") + " Pick that number.";
        else if (!this.placed.length) msg = "Next: drag from one corner of the outlined shape to the opposite corner.";
        else msg = "Next: when every square inside the outline is green, press Enter to check.";
        this.coachText.setText("👉 " + msg);
      };

      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        if (this.phase === "area") return this.submitChoice(this.choiceIdx);
        if (this.phase !== "build") return;
        const p = this.problem;
        // Gaps = target cells not covered; overflow = covered cells off-target.
        const gaps = [];
        const overflow = [];
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++) {
            const inTarget = p.cells.has(keyRC(c, r));
            const cov = this.covered[r][c];
            if (inTarget && !cov) gaps.push([c, r]);
            if (!inTarget && cov) overflow.push([c, r]);
          }
        const correct = gaps.length === 0 && overflow.length === 0;
        this.attempts++; // every graded lock-in counts toward accuracy

        if (correct) {
          this.correctSubs++;
          SFX.good();
          JUICE.audio.correct(this.streak);
          const fx = cellPX(p.oc + p.w / 2),
            fy = cellPY(p.or + p.h / 2);
          JUICE.burst(this, fx, fy, [0x2fae73, 0x5fd0ef, 0xffffff], 12);
          this.feedback
            .setText("The shape is covered exactly! Now find its area.")
            .setColor("#7ee0ad")
            .setAlpha(1);
          this.enterAreaPhase();
          return;
        }
        SFX.bad();
        JUICE.audio.wrong();
        JUICE.shake(this, 0.008);
        this.streak = 0;
        this.tries++;
        this.usedHelp = true;
        this.flashWrong();
        // Teach: flash the gaps (amber) and overflow (red).
        const g = this.gFlash;
        g.clear();
        g.fillStyle(0xffcf4d, 0.55);
        gaps.forEach(([c, r]) => g.fillRect(cellPX(c) + 2, cellPY(r) + 2, CELL - 4, CELL - 4));
        g.fillStyle(0xff5a5a, 0.55);
        overflow.forEach(([c, r]) => g.fillRect(cellPX(c) + 2, cellPY(r) + 2, CELL - 4, CELL - 4));
        // Diagnostic: say exactly WHAT is off (counts), not the answer.
        const diag = [
          gaps.length
            ? gaps.length + (gaps.length === 1 ? " amber square still needs a tile" : " amber squares still need tiles")
            : "",
          overflow.length
            ? overflow.length +
              (overflow.length === 1 ? " red square is outside the shape" : " red squares are outside the shape")
            : "",
        ]
          .filter(Boolean)
          .join(", and ");
        if (this.tries < 2) {
          const method =
            p.kind === "tri"
              ? "Tile every square inside the outlined rectangle around the triangle."
              : p.kind === "ell"
                ? "Cover the whole L-shape. Try splitting it into two rectangles."
                : "Cover every row of the rectangle.";
          this.feedback.setText("Not quite. " + diag + ". " + method + " Fix your tiles, then Lock In again.").setColor("#ffcf4d").setAlpha(1);
          this.flash(W / 2, 320, "Check the highlights", "#ffcf4d");
          srSay("Not quite. " + diag + ". " + method + " Fix your tiles, then lock in again.");
          this.updateHUD();
          this.drawCursor();
          return;
        }
        // Second miss: show the exact cover, then go on to the area step
        // (no-fail: the student still works out the area).
        this.locked = true;
        this.feedback.setText("Not quite. " + diag + ". Here is the exact cover. Now find the area.").setColor("#ffcf4d").setAlpha(1);
        srSay("Not quite. " + diag + ". Here is the exact cover. Now find the area.");
        this.time.delayedCall(this.reduceMotion ? 200 : 900, () => {
          this.placed = [];
          this.covered = [];
          for (let r = 0; r < ROWS; r++) this.covered.push(new Array(COLS).fill(false));
          p.cells.forEach((k) => {
            const [c, r] = k.split(",").map(Number);
            this.covered[r][c] = true;
          });
          this.gFlash.clear();
          this.drawCover();
          this.locked = false;
          this.enterAreaPhase();
        });
      };

      // ── Step 2: state the area ──────────────────────────────────────────
      GameScene.prototype.enterAreaPhase = function () {
        const p = this.problem;
        this.phase = "area";
        this.cornerA = null;
        this.drawCursor();
        this.gPreview.clear();
        this.bannerLabel.setText(p.label + " · Step 2 of 2: find the area");
        this.bannerText.setText(
          "What is the area of the " + SHAPE_NAME[p.kind] + "? (square units)",
        );
        this.areaHead.setText("STEP 2 · AREA = ?");
        this.buildUI.forEach((o) => o.setVisible(false));
        this.showChoices(p.choices);
        this.updateCoach();
        srSay(
          "What is the area of the " +
            SHAPE_NAME[p.kind] +
            "? Choices: " +
            p.choices.map((o, i) => i + 1 + ", " + o.label).join("; ") +
            ". Use the arrow keys and Enter, or press a number.",
        );
      };
      GameScene.prototype.showChoices = function (options) {
        this.hideChoices();
        const px = this.panelX;
        this.choices = options.map((opt, i) => {
          const y = 238 + i * 58;
          const rect = this.add
            .rectangle(px, y, 210, 48, 0x123a4a)
            .setStrokeStyle(3, 0x4aa3bf)
            .setInteractive({ useHandCursor: true });
          const txt = this.add
            .text(px, y, opt.label, { fontFamily: "Segoe UI, sans-serif", fontSize: "24px", fontStyle: "bold", color: "#ffffff" })
            .setOrigin(0.5);
          const num = this.add
            .text(px - 96, y - 20, String(i + 1), { fontFamily: "Segoe UI, sans-serif", fontSize: "13px", color: "#bcd8e2" })
            .setOrigin(0, 0);
          rect.on("pointerdown", () => {
            if (!this.locked) this.submitChoice(i);
          });
          return { opt, rect, txt, num, used: false };
        });
        // Mirror as real buttons in the controls panel (phones, screen readers).
        const host = document.querySelector(".cabinet-console");
        if (host) {
          const bar = document.createElement("div");
          bar.className = "game-choice-bar";
          bar.setAttribute("role", "group");
          bar.setAttribute("aria-label", "Area choices");
          this.choices.forEach((c, i) => {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = c.opt.label;
            b.setAttribute("aria-label", "Choice " + (i + 1) + ": " + c.opt.label + " square units");
            b.addEventListener("click", () => {
              if (!this.locked) this.submitChoice(i);
            });
            c.dom = b;
            bar.append(b);
          });
          host.insertBefore(bar, host.querySelector(".cabinet-controls"));
          this.domBar = bar;
        }
        this.choiceIdx = 0;
        this.paintChoices();
      };
      GameScene.prototype.hideChoices = function () {
        (this.choices || []).forEach((c) => {
          c.rect.destroy();
          c.txt.destroy();
          c.num.destroy();
        });
        this.choices = [];
        if (this.domBar) this.domBar.remove();
        this.domBar = null;
      };
      GameScene.prototype.paintChoices = function () {
        this.choices.forEach((c, i) => {
          const on = i === this.choiceIdx;
          if (c.dom) {
            c.dom.setAttribute("aria-pressed", String(on && !c.used));
            c.dom.disabled = !!c.used || this.locked;
          }
          if (c.done) return;
          c.rect.setFillStyle(c.used ? 0x3b2f17 : on ? 0x1f8f6e : 0x123a4a);
          c.rect.setStrokeStyle(on ? 5 : 3, on ? 0xffd24a : c.used ? 0x8a6a2a : 0x4aa3bf);
          c.txt.setColor(c.used ? "#c9b48a" : "#ffffff");
        });
      };
      GameScene.prototype.moveChoice = function (d) {
        if (!this.choices.length || !d) return;
        let i = this.choiceIdx;
        for (let n = 0; n < this.choices.length; n++) {
          i = (i + (d > 0 ? 1 : -1) + this.choices.length) % this.choices.length;
          if (!this.choices[i].used) break;
        }
        this.choiceIdx = i;
        this.paintChoices();
        SFX.place();
        srSay(this.choices[i].opt.label);
      };
      GameScene.prototype.submitChoice = function (i) {
        if (this.locked || this.phase !== "area") return;
        const c = this.choices[i];
        if (!c || c.used) return;
        const p = this.problem;
        this.attempts++;
        if (c.opt.correct) {
          this.correctSubs++;
          c.done = true;
          c.rect.setFillStyle(0x2fae73).setStrokeStyle(5, 0xffffff);
          this.finishProblem(true);
          return;
        }
        SFX.bad();
        JUICE.audio.wrong();
        this.areaTries++;
        this.usedHelp = true;
        this.streak = 0;
        c.used = true;
        if (this.areaTries >= 2) {
          const right = this.choices.find((k) => k.opt.correct);
          right.done = true;
          right.rect.setFillStyle(0x2fae73).setStrokeStyle(5, 0xffffff);
          this.paintChoices();
          this.feedback.setText(c.opt.why + " " + p.why).setColor("#ffcf4d").setAlpha(1);
          srSay(c.opt.why + " " + p.why);
          this.finishProblem(false, true);
          return;
        }
        // Tier 2 help: label each row's tile count on the grid.
        this.showRowCounts();
        this.moveChoice(1);
        this.feedback.setText("Not quite. " + c.opt.why + " Try another.").setColor("#ffcf4d").setAlpha(1);
        srSay("Not quite. " + c.opt.why + " Try another.");
        this.updateHUD();
      };
      // Concrete step (earned after a wrong area pick): count per row.
      GameScene.prototype.showRowCounts = function () {
        const p = this.problem;
        const rows = {};
        p.cells.forEach((k) => {
          const r = Number(k.split(",")[1]);
          rows[r] = (rows[r] || 0) + 1;
        });
        Object.keys(rows).forEach((r) => {
          const lastC = Math.max(
            ...[...p.cells].filter((k) => Number(k.split(",")[1]) === Number(r)).map((k) => Number(k.split(",")[0])),
          );
          this.labels.push(
            this.add
              .text(cellPX(lastC + 1) + 4, cellPY(Number(r)) + CELL / 2, rows[r] + " in this row", {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "13px",
                fontStyle: "bold",
                color: "#ffe9a8",
                stroke: "#08141b",
                strokeThickness: 3,
              })
              .setOrigin(0, 0.5)
              .setDepth(8),
          );
        });
        if (p.kind === "tri") {
          this.labels.push(
            this.add
              .text(cellPX(p.oc + p.w / 2), cellPY(p.or) - 14, "Rectangle = " + p.w + " × " + p.h + ". Triangle = half.", {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "14px",
                fontStyle: "bold",
                color: "#ffe9a8",
                stroke: "#08141b",
                strokeThickness: 3,
              })
              .setOrigin(0.5, 1)
              .setDepth(8),
          );
        }
      };

      GameScene.prototype.finishProblem = function (correct, keepFeedback) {
        const p = this.problem;
        this.locked = true;
        this.phase = "done";
        this.choices.forEach((c) => {
          if (c.dom) c.dom.disabled = true;
        });
        const st = (this.stats[p.kind] = this.stats[p.kind] || { seen: 0, clean: 0 });
        st.seen += 1;
        if (correct) {
          SFX.good();
          JUICE.audio.correct(this.streak);
          this.solved++;
          let gained;
          if (!this.usedHelp) {
            st.clean += 1;
            this.firstTry++;
            this.streak++;
            this.bestStreak = Math.max(this.bestStreak, this.streak);
            gained = 20 + Math.min(this.streak, 5) * 5 + (this.level === 2 ? 10 : 0);
            this.feedback.setText("Correct! " + p.why).setColor("#7ee0ad").setAlpha(1);
            this.flash(W / 2, 320, "Correct! ✓", "#7ee0ad");
          } else {
            this.streak = 0;
            gained = 10;
            this.feedback.setText("You worked it out! " + p.why).setColor("#7ee0ad").setAlpha(1);
            this.flash(W / 2, 320, "You got it ✓", "#7ee0ad");
          }
          this.score += gained;
          const fx = cellPX(p.oc + p.w / 2),
            fy = cellPY(p.or + p.h / 2);
          JUICE.burst(this, fx, fy, [0x2fae73, 0x5fd0ef, 0xffffff], 18);
          JUICE.floatText(this, fx, fy - 30, "+" + gained, "#7ee0ad", 36);
          JUICE.award(gained, "u5-area-attack");
          if (this.streak >= 2) JUICE.confetti(this, 1);
          srSay("Correct. " + p.why);
        } else if (!keepFeedback) {
          this.feedback.setText(p.why).setColor("#ffcf4d").setAlpha(1);
        }
        this.coachText.setText("");
        this.afterAttempt();
      };

      GameScene.prototype.afterAttempt = function () {
        this.updateHUD();
        if (this.solved >= this.target) {
          this.endGame();
          return;
        }
        this.hint.setText("Read the explanation. Press Enter or Continue when you are ready.");
        this.studioNextRound(() => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.flash = function (x, y, text, color) {
        const ft = this.add
          .text(x, y, text, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            fontStyle: "bold",
            color: color,
            stroke: "#08141b",
            strokeThickness: 4,
          })
          .setOrigin(0.5)
          .setDepth(45);
        this.tweens.add({
          targets: ft,
          y: y - 50,
          alpha: { from: 1, to: 0 },
          duration: this.reduceMotion ? 500 : 900,
          onComplete: () => ft.destroy(),
        });
      };

      // Calm "not yet" cue: a soft amber wash instead of a red failure flash.
      GameScene.prototype.flashWrong = function () {
        if (this.reduceMotion) return;
        this.wrongTint.setAlpha(0.22);
        this.tweens.add({
          targets: this.wrongTint,
          alpha: 0,
          duration: 350,
        });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText("Level " + this.level);
        this.progressText.setText(
          this.endless
            ? "Challenge " + (this.solved + 1) + " · " + this.solved + " solved"
            : "Challenge " + Math.min(this.solved + 1, this.target) + " of " + this.target,
        );
      };

      GameScene.prototype.endGame = function () {
        this.locked = true;
        this.time.delayedCall(600, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            level: this.level,
            auto: this.auto,
            endless: this.endless,
            firstTry: this.firstTry,
            bestStreak: this.bestStreak,
            stats: this.stats,
            attempts: this.attempts,
            correctSubs: this.correctSubs,
            accuracy: this.attempts ? this.correctSubs / this.attempts : 1,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        const T = (size, color, extra) => ({ fontFamily: "Segoe UI, sans-serif", fontSize: size + "px", color, ...(extra || {}) });
        this.add.rectangle(cx, H / 2, W, H, 0x0e2531);
        // Endless runs have no finite target; grade against the standard goal
        // of 10 so stars and the adaptive win-signal stay meaningful.
        const endless = !!d.endless;
        const goal = endless ? 10 : d.target;
        const stars = d.solved >= goal ? 3 : d.solved >= goal * 0.6 ? 2 : 1;
        // Adaptive: only record a run when the level was auto-picked.
        if (d.auto && window.NTAdaptive) {
          window.NTAdaptive.recordRun("u5-area-attack", {
            won: d.solved >= goal,
            accuracy: d.accuracy != null ? d.accuracy : 1,
            min: 1,
            max: 2,
          });
        }
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10) || 0;
        const newBest = d.score > hs;
        let bestStreak = 0;
        try {
          bestStreak = parseInt(localStorage.getItem(AA_STREAK_KEY) || "0", 10) || 0;
          if (newBest) localStorage.setItem(LS_KEY, String(d.score));
          if ((d.bestStreak || 0) > bestStreak) {
            bestStreak = d.bestStreak;
            localStorage.setItem(AA_STREAK_KEY, String(bestStreak));
          }
        } catch (e) {}
        if (newBest) hs = d.score;

        this.add
          .text(cx, 70, "AREA MASTER!", {
            fontFamily: "Impact, sans-serif",
            fontSize: "46px",
            color: "#7ee0ad",
            stroke: "#08141b",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        this.add.text(cx, 128, "★".repeat(stars) + "☆".repeat(3 - stars), T(44, "#5fd0ef")).setOrigin(0.5);
        this.add
          .text(cx, 182, "Score: " + d.score + (newBest ? "  · New high score!" : ""), T(28, "#ffffff", { fontStyle: "bold" }))
          .setOrigin(0.5);

        const stats = d.stats || {};
        const kinds = Object.keys(stats);
        const names = { rect: "Rectangles", tri: "Triangles (½ × b × h)", ell: "L-shapes (decompose)" };
        let weak = null;
        kinds.forEach((k) => {
          const miss = stats[k].seen - stats[k].clean;
          if (miss > 0 && (!weak || miss > stats[weak].seen - stats[weak].clean)) weak = k;
        });
        const acc = Math.round((d.accuracy != null ? d.accuracy : 1) * 100);
        const lines = [
          (endless ? "Solved " + d.solved + " shapes" : "Solved " + d.solved + " of " + d.target + " shapes") +
            " (Level " + d.level + ") · " + (d.firstTry || 0) + " on the first try with no help",
          "Accuracy: " + acc + "% of your answers were right · Best streak ever: " + bestStreak,
          "Skills practiced: " + (kinds.length ? kinds.map((k) => names[k]).join(", ") : "area on a grid"),
          weak
            ? "Practice next → " + KIND_TIP[weak]
            : d.level === 1
              ? "Practice next → try Level 2: L-shapes and bigger triangles."
              : "Practice next → keep your streak going with ♾️ Keep Playing.",
        ];
        this.summary = this.add
          .text(cx, 290, lines.join("\n"), T(17, "#d4ecf3", { align: "center", lineSpacing: 10, wordWrap: { width: W - 70 } }))
          .setOrigin(0.5);
        // The controls panel reads bannerText: mirror the summary there so it
        // is readable at phone width and by screen readers.
        this.bannerText = this.summary;
        this.add.text(cx, 372, "High score: " + hs, T(16, "#5fd0ef")).setOrigin(0.5);

        SFX.win();

        // EduPulse / Canvas code: shapes solved out of the goal (not points
        // over a problem count, which printed e.g. "260/10").
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.solved,
              maxScore: goal,
              percent: acc,
              stars: stars,
              level: d.level,
              standard: "6.GR.1",
              problemsCorrect: d.correctSubs,
              problemsAttempted: d.attempts,
            });
        } catch (e) {}
        srSay("Round complete. Score " + d.score + ", " + stars + " stars. " + lines.join(" "));

        const btn = this.add.rectangle(cx, 430, 240, 54, 0x1f8f6e).setInteractive({ useHandCursor: true });
        this.add.text(cx, 430, "PLAY AGAIN 🔁", T(20, "#ffffff", { fontStyle: "bold" })).setOrigin(0.5);
        // New shapes at the same level (Change level is one tap away below).
        const again = () => {
          aaEndless = false;
          this.scene.start("Game");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x26a884));
        btn.on("pointerout", () => btn.setFillStyle(0x1f8f6e));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        // ♾️ Keep Playing: restart the Game at the same level in endless mode
        // (carries the auto flag so adaptive still records the endless run).
        const keepBtn = this.add
          .rectangle(cx - 130, 496, 240, 50, 0x2563a8)
          .setStrokeStyle(2, 0x7dd3fc)
          .setInteractive({ useHandCursor: true });
        this.add.text(cx - 130, 496, "♾️ Keep Playing", T(18, "#ffffff", { fontStyle: "bold" })).setOrigin(0.5);
        const keepPlaying = () => {
          aaLevel = d.level;
          aaEndless = true;
          aaAuto = d.auto;
          this.scene.start("Game");
        };
        keepBtn.on("pointerover", () => keepBtn.setFillStyle(0x2f74c2));
        keepBtn.on("pointerout", () => keepBtn.setFillStyle(0x2563a8));
        keepBtn.on("pointerdown", keepPlaying);
        const lvlBtn = this.add
          .rectangle(cx + 130, 496, 240, 50, 0x183a48)
          .setStrokeStyle(2, 0x5fd0ef)
          .setInteractive({ useHandCursor: true });
        this.add.text(cx + 130, 496, "Change level", T(18, "#ffffff", { fontStyle: "bold" })).setOrigin(0.5);
        lvlBtn.on("pointerover", () => lvlBtn.setFillStyle(0x224c5c));
        lvlBtn.on("pointerout", () => lvlBtn.setFillStyle(0x183a48));
        lvlBtn.on("pointerdown", () => this.scene.start("Level"));
        this.add.text(cx, 556, "Enter = Play again · Every round has new shapes.", T(15, "#9cc7d4")).setOrigin(0.5);
      };

      // ── Launch ──
      const aaGame = new Phaser.Game(config);
      // Native math controls now have a readable, touch-accessible console.
      window.PhaserStudio.mount({
        game: aaGame, id: "u5-area-attack", GameScene, ResultScene, audio: SFX,
        instructions: [
          "Step 1: cover the outlined shape EXACTLY with tiles. Drag from one corner to the opposite corner to lay a rectangle of tiles. Use more than one rectangle for an L-shape.",
          "Keyboard: arrow keys move the cursor, F sets the first corner, F again sets the other corner. U undoes, C clears. Press Enter to check your tiles.",
          "For a triangle, tile the rectangle AROUND it. The triangle is half of that rectangle.",
          "Step 2: pick the area. Rectangle = base \u00d7 height. Triangle = \u00bd \u00d7 base \u00d7 height. L-shape = add the two rectangles.",
          "Hints appear after a try. First-try answers with no help earn the most points.",
        ],
        setLevel(level) { aaLevel = level; aaAuto = false; aaEndless = false; aaGame.scene.getScenes(true).forEach(scene => aaGame.scene.stop(scene.sys.settings.key)); aaGame.scene.start(aaVocabSeen ? "Game" : "Vocab"); }
      });

      // Canvas accessibility (additive; no gameplay change).
      aaGame.events.once("ready", function () {
        try {
          const cv = aaGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Area Attack, Decompose and Tile math game. A shape is outlined on a " +
              "unit grid. Drag across the grid, or use the arrow keys to move a " +
              "cursor and press F to set two corners, to lay rectangles of tiles " +
              "that exactly cover the shape. For triangle problems, tile the " +
              "rectangle around the triangle. Press Enter to check the tiles. " +
              "Then choose the shape's area with the arrow keys and Enter, " +
              "or press 1 to 4. Use U to undo and C to clear.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>
