    <script>
      // Decorative spark-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("aa-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 34;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "aa-spark";
            var sz = rnd(2, 5);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" + (dx * 20).toFixed(2) + "px," + (dy * 12).toFixed(2) + "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener) reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── AREA ATTACK — DECOMPOSE & TILE ──
      // Phaser 3 — Grade 6 Math — Area of rectangles & composite figures.
      // Mechanic (math-as-mechanic, calm, NO timer / NO reflex): a target shape
      // is OUTLINED on a unit grid. The student COVERS it by drawing rectangles
      // of unit tiles — drag from one cell to another (or arrow a cursor and
      // press F to set corner A then corner B). A live readout shows the total
      // tiles placed = the current area. Lock In checks the tiles EXACTLY cover
      // the target (no gaps, no overflow) and the area count is right.
      // On wrong math the gaps and overflow flash and the correct area + the
      // formula are shown, so a miss teaches — no lives, no fail state (calm,
      // self-paced classroom mode). Two levels:
      //   Level 1 (support)    — small rectangles + triangles, base/height
      //                          labels, hints.
      //   Level 2 (enrichment) — larger L-shapes you must DECOMPOSE + bigger
      //                          triangles, fewer labels.
      // Triangles (6.GR.1 ½bh): a right triangle is drawn inside its
      // surrounding rectangle; the student tiles the b×h rectangle and the
      // teach is that the triangle is exactly HALF of it. b·h is always even,
      // so every triangle area is a whole number.

      const W = 820,
        H = 600;
      const LS_KEY = "aa_tile_highscore";

      // ── Unit grid geometry in game space. Phaser Scale.FIT maps pointer
      // coordinates into this space, so cell math works at any screen size. ──
      const COLS = 11,
        ROWS = 8,
        CELL = 38;
      const GRID_X0 = 70,
        GRID_Y0 = 170;
      const GRID_W = COLS * CELL,
        GRID_H = ROWS * CELL;
      function cellPX(c) {
        return GRID_X0 + c * CELL;
      }
      function cellPY(r) {
        return GRID_Y0 + r * CELL;
      }
      function inGrid(x, y) {
        return x >= GRID_X0 && x < GRID_X0 + GRID_W && y >= GRID_Y0 && y < GRID_Y0 + GRID_H;
      }
      function colFromX(x) {
        return Phaser.Math.Clamp(Math.floor((x - GRID_X0) / CELL), 0, COLS - 1);
      }
      function rowFromY(y) {
        return Phaser.Math.Clamp(Math.floor((y - GRID_Y0) / CELL), 0, ROWS - 1);
      }
      const keyRC = (c, r) => c + "," + r;

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        miss() {
          this.play("triangle", 240, 0.16, 0.12);
        },
        place() {
          this.play("square", 520, 0.05, 0.07);
        },
        coin() {
          this.play("square", 1040, 0.05, 0.08);
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
      };

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          tap() {},
          pop() {},
          correct() {},
          wrong() {},
          whoosh() {},
          fanfare() {},
          musicStart() {},
          musicStop() {},
        },
        theme: () => ({
          accent: "#5fd0ef",
          accentN: 0x5fd0ef,
          tileN: 0x17506a,
          botN: 0x0e2531,
        }),
        bgGradient() {},
        popIn() {},
        tilePop() {},
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function srSay(msg) {
        const el = document.getElementById("aa-sr");
        if (el) el.textContent = msg;
      }

      // ── Triangle problems (6.GR.1: A = ½bh) ──────────────────────────────
      // A right triangle drawn inside its surrounding b×h rectangle. The tile
      // mechanic is unchanged: the student tiles the SURROUNDING RECTANGLE
      // (cells = the b×h block), and the teach is that the triangle is exactly
      // HALF of it — ½ × base × height. b·h is forced even, so the triangle's
      // area is always a whole number.
      function makeTriangle(level) {
        let b, h;
        do {
          b = level === 1 ? randInt(2, 6) : randInt(3, 8);
          h = level === 1 ? randInt(2, 5) : randInt(3, 6);
        } while ((b * h) % 2 !== 0);
        const oc = randInt(0, COLS - b),
          or = randInt(0, ROWS - h);
        const cells = new Set();
        for (let r = 0; r < h; r++) for (let c = 0; c < b; c++) cells.add(keyRC(oc + c, or + r));
        const area = (b * h) / 2;
        return {
          level,
          kind: "tri",
          cells,
          area,
          rectArea: b * h,
          oc,
          or,
          w: b,
          h,
          orient: randInt(0, 3), // which rectangle corner holds the right angle
          label: "Triangle — half the rectangle",
          prompt:
            "Tile the rectangle AROUND the triangle, then Lock In — the triangle is half of it.",
          why:
            "Triangle area = ½ × base × height = ½ × " +
            b +
            " × " +
            h +
            " = " +
            area +
            " square units — half of the " +
            b +
            "×" +
            h +
            " rectangle you tiled.",
        };
      }

      // ── Problem generator (grid shapes) ─────────────────────────────────
      // Returns { level, kind, cells(Set "c,r"), area, oc, or, w, h, cw, ch,
      //           label, prompt, why }. Always on integer cells so an exact
      //           tile-cover is possible.
      function makeProblem(level) {
        // Triangles join the mix at BOTH levels (~40% of problems).
        if (Math.random() < 0.4) return makeTriangle(level);
        if (level === 1) {
          const w = randInt(2, 6),
            h = randInt(2, 5);
          const oc = randInt(0, COLS - w),
            or = randInt(0, ROWS - h);
          const cells = new Set();
          for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) cells.add(keyRC(oc + c, or + r));
          return {
            level: 1,
            kind: "rect",
            cells,
            area: w * h,
            oc,
            or,
            w,
            h,
            label: "Find the area",
            prompt: "Cover the rectangle with tiles, then Lock In.",
            why: "Area = base × height = " + w + " × " + h + " = " + w * h + " square units.",
          };
        }
        // Level 2 — an L-shape: a W×H block with one corner notched out, so it
        // can only be covered by 2+ rectangles (forces decomposition).
        const Wc = randInt(4, 7),
          Hc = randInt(4, 6);
        const cw = randInt(1, Wc - 1),
          ch = randInt(1, Hc - 1);
        const corner = randInt(0, 3); // 0 TL, 1 TR, 2 BL, 3 BR
        const oc = randInt(0, COLS - Wc),
          or = randInt(0, ROWS - Hc);
        const removed = (c, r) => {
          const left = c < cw,
            right = c >= Wc - cw,
            top = r < ch,
            bot = r >= Hc - ch;
          if (corner === 0) return left && top;
          if (corner === 1) return right && top;
          if (corner === 2) return left && bot;
          return right && bot;
        };
        const cells = new Set();
        for (let r = 0; r < Hc; r++)
          for (let c = 0; c < Wc; c++) if (!removed(c, r)) cells.add(keyRC(oc + c, or + r));
        const area = Wc * Hc - cw * ch;
        const r1 = Wc * (Hc - ch),
          r2 = (Wc - cw) * ch;
        return {
          level: 2,
          kind: "ell",
          cells,
          area,
          oc,
          or,
          w: Wc,
          h: Hc,
          cw,
          ch,
          label: "Decompose & find the area",
          prompt: "Cover the L-shape with rectangles, then Lock In.",
          why:
            "Break it into 2 rectangles: " +
            Wc +
            "×" +
            (Hc - ch) +
            " + " +
            (Wc - cw) +
            "×" +
            ch +
            " = " +
            r1 +
            " + " +
            r2 +
            " = " +
            area +
            " square units.",
        };
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0e2531",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, VocabScene, LevelScene, GameScene, ResultScene],
      };

      // ── Vocab gate state (repo rule: term + Level-1 definition + image/emoji
      // shown BEFORE the first round). Shown by default; skippable only on a
      // replay within the same page session. ──
      let aaVocabSeen = false;
      // Chosen difficulty (set on the Level Select screen). 1 = support, 2 = enrichment.
      let aaLevel = 1;
      let aaAuto = false; // true when the ✨ Auto button picked the level (NTAdaptive)
      let aaEndless = false; // true for endless (no auto-end) runs

      // Key words for THIS game's topic (area on a unit grid). Each has a
      // student-facing (Level 1) definition and an emoji so a visual always
      // shows even with no network/images.
      const AA_VOCAB = [
        {
          term: "Area",
          emoji: "🟦",
          def: "The amount of flat space a shape covers, counted in square units.",
        },
        {
          term: "Square unit",
          emoji: "⬜",
          def: "One little square on the grid. Area is how many of these fit inside a shape.",
        },
        {
          term: "Base",
          emoji: "↔️",
          def: "How wide a shape is — the number of squares across one row.",
        },
        {
          term: "Height",
          emoji: "↕️",
          def: "How tall a shape is — the number of squares up and down.",
        },
        {
          term: "Decompose",
          emoji: "✂️",
          def: "Break a tricky shape into rectangles, find each area, then add them up.",
        },
        {
          term: "Triangle area",
          emoji: "📐",
          def: "A triangle covers HALF of the rectangle around it: area = ½ × base × height.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0x5fd0ef);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0e2531);
        this.add
          .text(cx, 118, "AREA ATTACK", {
            fontFamily: "Impact, sans-serif",
            fontSize: "64px",
            color: "#5fd0ef",
            stroke: "#08141b",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 173, "Decompose & Tile", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            color: "#7ee0ad",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            232,
            "Cover the shape with tiles to BUILD its area. Drag rectangles\nof squares (or arrow a cursor + F), then Lock In — no timer, take your time.",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#bcd8e2",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 295, "Tile the grid · 6.GR.1 · Lessons 5.1–5.5", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#6fa6b6",
          })
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 330, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#5fd0ef",
              fontStyle: "bold",
            })
            .setOrigin(0.5);

        const btn = this.add
          .rectangle(cx, 400, 240, 58, 0x1f8f6e)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "START ▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.tweens.add({
          targets: [btn, btnT],
          scaleX: 1.05,
          scaleY: 1.05,
          duration: 800,
          yoyo: true,
          repeat: -1,
        });
        const start = () => {
          SFX.init();
          SFX.coin();
          JUICE.audio.unlock();
          // Show the vocab gate before the first round; on a replay (already
          // seen this session) jump straight to Level Select.
          this.scene.start(aaVocabSeen ? "Level" : "Vocab");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x26a884));

      // Static panel + gridlines (drawn once).
      GameScene.prototype.drawStaticGrid = function () {
        const g = this.gStatic;
        g.clear();
        g.fillStyle(0x0c2230, 1).fillRect(GRID_X0, GRID_Y0, GRID_W, GRID_H);
        g.lineStyle(1, 0x1b3543, 1);
        for (let c = 0; c <= COLS; c++) {
          g.lineBetween(cellPX(c), GRID_Y0, cellPX(c), GRID_Y0 + GRID_H);
        }
        for (let r = 0; r <= ROWS; r++) {
          g.lineBetween(GRID_X0, cellPY(r), GRID_X0 + GRID_W, cellPY(r));
        }
        g.lineStyle(2, 0x2a4d5c, 1).strokeRect(GRID_X0, GRID_Y0, GRID_W, GRID_H);
      };

      // Target blueprint (faint fill) + bold outline + Level-1 labels.
      GameScene.prototype.drawTarget = function () {
        const p = this.problem;
        const fill = this.gTargetFill;
        const out = this.gOutline;
        fill.clear();
        out.clear();
        fill.fillStyle(0x17506a, 0.45);
        p.cells.forEach((k) => {
          const [c, r] = k.split(",").map(Number);
          fill.fillRect(cellPX(c) + 1, cellPY(r) + 1, CELL - 2, CELL - 2);
        });
        // Bold outline: stroke each cell edge that borders a non-target cell.
        out.lineStyle(4, 0x5fd0ef, 1);
        p.cells.forEach((k) => {
          const [c, r] = k.split(",").map(Number);
          const x = cellPX(c),
            y = cellPY(r);
          if (!p.cells.has(keyRC(c, r - 1))) out.lineBetween(x, y, x + CELL, y);
          if (!p.cells.has(keyRC(c, r + 1))) out.lineBetween(x, y + CELL, x + CELL, y + CELL);
          if (!p.cells.has(keyRC(c - 1, r))) out.lineBetween(x, y, x, y + CELL);
          if (!p.cells.has(keyRC(c + 1, r))) out.lineBetween(x + CELL, y, x + CELL, y + CELL);
        });

        // Triangle problems: draw the triangle in gold inside the (already
        // outlined) surrounding rectangle. The student tiles the rectangle;
        // the triangle overlay makes "half of it" visible.
        if (p.kind === "tri") {
          const x0 = cellPX(p.oc),
            y0 = cellPY(p.or);
          const x1 = cellPX(p.oc + p.w),
            y1 = cellPY(p.or + p.h);
          const tri = [
            [x0, y1, x1, y1, x0, y0], // right angle bottom-left
            [x0, y1, x1, y1, x1, y0], // right angle bottom-right
            [x0, y0, x1, y0, x0, y1], // right angle top-left
            [x0, y0, x1, y0, x1, y1], // right angle top-right
          ][p.orient];
          out.fillStyle(0xffd24a, 0.25);
          out.fillTriangle(tri[0], tri[1], tri[2], tri[3], tri[4], tri[5]);
          out.lineStyle(4, 0xffd24a, 1);
          out.strokeTriangle(tri[0], tri[1], tri[2], tri[3], tri[4], tri[5]);
        }

        // Clear old labels, then add base/height labels (Level 1 only).
        this.labels.forEach((t) => t.destroy());
        this.labels = [];
        if (p.level === 1) {
          const baseX = cellPX(p.oc + p.w / 2);
          const baseY = cellPY(p.or + p.h) + 12;
          this.labels.push(
            this.add
              .text(baseX, baseY, "base = " + p.w, {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "14px",
                fontStyle: "bold",
                color: "#7ee0ad",
              })
              .setOrigin(0.5, 0)
              .setDepth(6),
          );
          const htX = cellPX(p.oc) - 8;
          const htY = cellPY(p.or + p.h / 2);
          this.labels.push(
            this.add
              .text(htX, htY, "height\n= " + p.h, {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "13px",
                fontStyle: "bold",
                color: "#7ee0ad",
                align: "right",
              })
              .setOrigin(1, 0.5)
              .setDepth(6),
          );
        }
      };

      GameScene.prototype.recompute = function () {
        // Rebuild the cover grid from the list of placed rectangles.
        this.covered = [];
        for (let r = 0; r < ROWS; r++) this.covered.push(new Array(COLS).fill(false));
        this.placed.forEach((rc) => {
          const c0 = Math.min(rc.c0, rc.c1),
            c1 = Math.max(rc.c0, rc.c1);
          const r0 = Math.min(rc.r0, rc.r1),
            r1 = Math.max(rc.r0, rc.r1);
          for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) this.covered[r][c] = true;
        });
        this.drawCover();
      };

      GameScene.prototype.coveredCount = function () {
        let n = 0;
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.covered[r][c]) n++;
        return n;
      };

      GameScene.prototype.drawCover = function () {
        const g = this.gCover;
        g.clear();
        g.fillStyle(0x2fae73, 0.85);
        g.lineStyle(1, 0x176b46, 1);
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            if (this.covered[r][c]) {
              g.fillRect(cellPX(c) + 1, cellPY(r) + 1, CELL - 2, CELL - 2);
              g.strokeRect(cellPX(c) + 1, cellPY(r) + 1, CELL - 2, CELL - 2);
            }
        const n = this.coveredCount();
        this.areaNum.setText(String(n));
      };

      GameScene.prototype.drawPreview = function () {
        const g = this.gPreview;
        g.clear();
        let c0, r0, c1, r1;
        if (this.dragging) {
          c0 = this.dragC0;
          r0 = this.dragR0;
          c1 = this.dragC1;
          r1 = this.dragR1;
        } else if (this.cornerA) {
          c0 = this.cornerA.c;
          r0 = this.cornerA.r;
          c1 = this.cur.c;
          r1 = this.cur.r;
        } else {
          return;
        }
        const cc0 = Math.min(c0, c1),
          cc1 = Math.max(c0, c1);
        const rr0 = Math.min(r0, r1),
          rr1 = Math.max(r0, r1);
        g.fillStyle(0x5fd0ef, 0.3);
        g.lineStyle(2, 0x5fd0ef, 0.9);
        const x = cellPX(cc0),
          y = cellPY(rr0);
        const w = (cc1 - cc0 + 1) * CELL,
          h = (rr1 - rr0 + 1) * CELL;
        g.fillRect(x, y, w, h);
        g.strokeRect(x, y, w, h);
      };

      GameScene.prototype.drawCursor = function () {
        const g = this.gCursor;
        g.clear();
        if (!this.kbActive || this.locked) return;
        if (this.cornerA) {
          g.fillStyle(0xffd24a, 0.4);
          g.fillRect(cellPX(this.cornerA.c) + 2, cellPY(this.cornerA.r) + 2, CELL - 4, CELL - 4);
        }
        g.lineStyle(3, 0xffd24a, 1);
        g.strokeRect(cellPX(this.cur.c) + 2, cellPY(this.cur.r) + 2, CELL - 4, CELL - 4);
      };

      GameScene.prototype.commitRect = function (c0, r0, c1, r1) {
        this.placed.push({ c0, r0, c1, r1 });
        this.recompute();
        this.gFlash.clear(); // stale miss-highlights no longer match the cover
        SFX.place();
        JUICE.audio.pop();
        const cx = cellPX((Math.min(c0, c1) + Math.max(c0, c1) + 1) / 2);
        const cy = cellPY((Math.min(r0, r1) + Math.max(r0, r1) + 1) / 2);
        JUICE.tilePop(this, this.gCover);
        JUICE.burst(this, cx, cy, [0x2fae73, 0x5fd0ef, 0xffffff], 8);
      };

      GameScene.prototype.undo = function () {
        if (this.locked || !this.placed.length) return;
        this.placed.pop();
        this.recompute();
        this.gFlash.clear();
        SFX.miss();
      };

      GameScene.prototype.clearTiles = function () {
        if (this.locked || !this.placed.length) return;
        this.placed = [];
        this.recompute();
        this.gFlash.clear();
        SFX.miss();
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.tries = 0;
        this.placed = [];
        this.cornerA = null;
        this.cur = { c: 0, r: 0 };
        this.problem = makeProblem(this.level);
        this.bannerLabel.setText(this.problem.label);
        this.bannerText.setText(this.problem.prompt);
        // Triangle rounds count RECTANGLE tiles (the triangle is half), so the
        // readout must not call that number the "area" — misconception guard.
        this.areaHead.setText(this.problem.kind === "tri" ? "RECTANGLE" : "AREA");
        this.areaUnit.setText(
          this.problem.kind === "tri" ? "tiles (triangle = half)" : "square units",
        );
        this.gFlash.clear();
        this.drawTarget();
        this.recompute();
        this.drawCursor();
        const p = this.problem;
        srSay(
          p.label +
            ". " +
            p.prompt +
            " " +
            (p.kind === "tri"
              ? "A triangle is drawn inside a rectangle " +
                p.w +
                " across and " +
                p.h +
                " tall. Tile the whole rectangle, then lock in — the triangle's area is half of it."
              : "A " +
                (p.kind === "rect" ? "rectangle" : "L-shape") +
                " is outlined on the grid. Lay tiles to cover it exactly, then lock in."),
        );
      };

      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        const p = this.problem;
        // Gaps = target cells not covered; overflow = covered cells off-target.
        const gaps = [];
        const overflow = [];
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++) {
            const inTarget = p.cells.has(keyRC(c, r));
            const cov = this.covered[r][c];
            if (inTarget && !cov) gaps.push([c, r]);
            if (!inTarget && cov) overflow.push([c, r]);
          }
        const correct = gaps.length === 0 && overflow.length === 0;
        this.attempts++; // every graded lock-in counts toward accuracy
        this.locked = true;

        if (correct) {
          SFX.good();
          JUICE.audio.correct(this.streak);
          this.solved++;
          this.streak++;
          const bonus = Math.min(this.streak, 5) * 5;
          const gained = 20 + bonus + (this.level === 2 ? 10 : 0);
          this.score += gained;
          this.flash(W / 2, 320, "Correct! ✓", "#7ee0ad");
          this.feedback.setText("Correct! " + p.why).setAlpha(1);
          const fx = cellPX(p.oc + p.w / 2),
            fy = cellPY(p.or + p.h / 2);
          JUICE.burst(this, fx, fy, [0x2fae73, 0x5fd0ef, 0xffffff], 18);
          JUICE.floatText(this, fx, fy - 30, "+" + gained, "#7ee0ad", 36);
          JUICE.award(gained, "u5-area-attack");
          if (this.streak >= 2) JUICE.confetti(this, 1);
          srSay("Correct. " + p.why);
          this.afterAttempt(true);
        } else {
          SFX.bad();
          JUICE.audio.wrong();
          JUICE.shake(this, 0.008);
          this.streak = 0;
          this.tries++;
          this.flashWrong();
          // Teach: flash the gaps (amber) and overflow (red).
          const g = this.gFlash;
          g.clear();
          g.fillStyle(0xffcf4d, 0.55);
          gaps.forEach(([c, r]) => g.fillRect(cellPX(c) + 2, cellPY(r) + 2, CELL - 4, CELL - 4));
          g.fillStyle(0xff5a5a, 0.55);
          overflow.forEach(([c, r]) =>
            g.fillRect(cellPX(c) + 2, cellPY(r) + 2, CELL - 4, CELL - 4),
          );
          // Diagnostic: say exactly WHAT is off (counts), not the answer.
          const diag = [
            gaps.length
              ? gaps.length +
                (gaps.length === 1
                  ? " amber square still needs a tile"
                  : " amber squares still need tiles")
              : "",
            overflow.length
              ? overflow.length +
                (overflow.length === 1
                  ? " red square is outside the shape"
                  : " red squares are outside the shape")
              : "",
          ]
            .filter(Boolean)
            .join(", and ");
          if (this.tries < 2) {
            // First miss: diagnose + retry the SAME problem. Method
            // scaffolding only — no answer reveal (scaffold, not giveaway).
            const method =
              p.kind === "tri"
                ? "Tile every square inside the outlined rectangle around the triangle."
                : p.kind === "ell"
                  ? "Cover the whole L-shape — try splitting it into two rectangles."
                  : "Cover every row of the rectangle — area = base × height.";
            this.feedback
              .setText(
                "Not quite — " + diag + ". " + method + " Fix your tiles, then Lock In again.",
              )
              .setAlpha(1);
            this.flash(W / 2, 320, "Check the highlights", "#ffcf4d");
            srSay("Not quite. " + diag + ". " + method + " Fix your tiles, then lock in again.");
            this.updateHUD();
            this.locked = false;
            this.drawCursor();
            return;
          }
          // Second miss: full teach — reveal the correct cover + formula,
          // then move on (calm, no fail state).
          const msg =
            (p.kind === "tri"
              ? "Not quite — tile the whole " +
                p.w +
                "×" +
                p.h +
                " rectangle (" +
                p.rectArea +
                " tiles). "
              : "Not quite — the area is " + p.area + " square units. ") +
            p.why +
            (gaps.length ? "  (amber = gaps)" : "") +
            (overflow.length ? "  (red = too many)" : "");
          this.feedback.setText(msg).setAlpha(1);
          this.flash(
            W / 2,
            320,
            (p.kind === "tri" ? "Triangle area = " : "Area = ") + p.area,
            "#ffcf4d",
          );
          srSay("Not quite. " + p.why);
          // After a beat, fill the target exactly so the correct cover shows.
          this.time.delayedCall(this.reduceMotion ? 200 : 900, () => {
            this.placed = [
              // store each target cell as a 1×1 rect so the cover renders it
            ];
            this.covered = [];
            for (let r = 0; r < ROWS; r++) this.covered.push(new Array(COLS).fill(false));
            p.cells.forEach((k) => {
              const [c, r] = k.split(",").map(Number);
              this.covered[r][c] = true;
            });
            this.gFlash.clear();
            this.drawCover();
            this.afterAttempt(false);
          });
        }
      };

      GameScene.prototype.afterAttempt = function (correct) {
        this.updateHUD();
        if (this.solved >= this.target) {
          this.endGame();
          return;
        }
        this.time.delayedCall(correct ? 950 : 1300, () => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.flash = function (x, y, text, color) {
        const ft = this.add
          .text(x, y, text, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            fontStyle: "bold",
            color: color,
            stroke: "#08141b",
            strokeThickness: 4,
          })
          .setOrigin(0.5)
          .setDepth(45);
        this.tweens.add({
          targets: ft,
          y: y - 50,
          alpha: { from: 1, to: 0 },
          duration: this.reduceMotion ? 500 : 900,
          onComplete: () => ft.destroy(),
        });
      };

      // Calm "not yet" cue: a soft amber wash instead of a red failure flash.
      GameScene.prototype.flashWrong = function () {
        if (this.reduceMotion) return;
        this.wrongTint.setAlpha(0.22);
        this.tweens.add({
          targets: this.wrongTint,
          alpha: 0,
          duration: 350,
        });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText("Level " + this.level);
        this.progressText.setText(this.solved + " / " + (this.endless ? "∞" : this.target));
      };

      GameScene.prototype.endGame = function () {
        this.locked = true;
        this.time.delayedCall(600, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            level: this.level,
            auto: this.auto,
            endless: this.endless,
            accuracy: this.attempts ? this.solved / this.attempts : 1,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0e2531);
        // Endless runs have no finite target; grade against the standard goal
        // of 10 so stars and the adaptive win-signal stay meaningful.
        const endless = !!d.endless;
        const goal = endless ? 10 : d.target;
        const stars = d.solved >= goal ? 3 : d.solved >= goal * 0.6 ? 2 : 1;
        // Adaptive: only record a run when the level was auto-picked.
        if (d.auto && window.NTAdaptive) {
          window.NTAdaptive.recordRun("u5-area-attack", {
            won: d.solved >= goal,
            accuracy: d.accuracy != null ? d.accuracy : 1,
            min: 1,
            max: 2,
          });
        }
        // High score
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        if (d.score > hs) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }

        this.add
          .text(cx, 110, "AREA MASTER!", {
            fontFamily: "Impact, sans-serif",
            fontSize: "48px",
            color: "#7ee0ad",
            stroke: "#08141b",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        const starStr = "★".repeat(stars) + "☆".repeat(3 - stars);
        this.add
          .text(cx, 185, starStr, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "48px",
            color: "#5fd0ef",
          })
          .setOrigin(0.5);

        this.add
          .text(cx, 255, "Score: " + d.score, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "30px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            295,
            endless
              ? "Tiled " + d.solved + " shapes (Level " + d.level + ")"
              : "Tiled " + d.solved + " of " + d.target + " shapes (Level " + d.level + ")",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "18px",
              color: "#bcd8e2",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 325, "High Score: " + hs, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#5fd0ef",
          })
          .setOrigin(0.5);

        SFX.win();

        // EduPulse reporting (guarded; safe no-op without bridge).
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.score,
              stars: stars,
              standard: "6.GR.1",
              problemsAttempted: d.solved,
            });
        } catch (e) {}
        srSay("You won! Final score " + d.score + ", " + stars + " stars.");

        const btn = this.add
          .rectangle(cx, 400, 240, 54, 0x1f8f6e)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx, 400, "PLAY AGAIN 🔁", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const again = () => this.scene.start("Level");
        btn.on("pointerover", () => btn.setFillStyle(0x26a884));
        btn.on("pointerout", () => btn.setFillStyle(0x1f8f6e));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        // ♾️ Keep Playing: restart the Game at the same level in endless mode
        // (carries the auto flag so adaptive still records the endless run).
        const keepBtn = this.add
          .rectangle(cx, 466, 240, 48, 0x2563a8)
          .setStrokeStyle(2, 0x7dd3fc)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx, 466, "♾️ Keep Playing", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const keepPlaying = () => {
          aaLevel = d.level;
          aaEndless = true;
          aaAuto = d.auto;
          this.scene.start("Game");
        };
        keepBtn.on("pointerover", () => keepBtn.setFillStyle(0x2f74c2));
        keepBtn.on("pointerout", () => keepBtn.setFillStyle(0x2563a8));
        keepBtn.on("pointerdown", keepPlaying);
      };

      // ── Launch ──
      const aaGame = new Phaser.Game(config);

      // Canvas accessibility (additive; no gameplay change).
      aaGame.events.once("ready", function () {
        try {
          const cv = aaGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Area Attack, Decompose and Tile math game. A shape is outlined on a " +
              "unit grid. Drag across the grid, or use the arrow keys to move a " +
              "cursor and press F to set two corners, to lay rectangles of tiles " +
              "that exactly cover the shape. For triangle problems, tile the " +
              "rectangle around the triangle; the triangle's area is half of it. " +
              "Watch the area count, then press " +
              "Lock In, Enter, or Space. Use U to undo and C to clear.",

          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });

              </div>
              <div class="ewl-mastery-actions">
                <button class="ewl-mastery-btn ewl-btn-secondary" onclick="location.reload()">🔄 Play Again</button>
                <button class="ewl-mastery-btn ewl-btn-primary" onclick="location.href='${nextUrl}'">🎮 More Games</button>
              </div>
            </div>
          </div>
        `;
        const existing = document.getElementById("ewl-mastery-modal");
        if (existing) existing.remove();
        document.body.insertAdjacentHTML("beforeend", modalHtml);
        
        if (window.GameFX && window.GameFX.AudioSynth) {
          try { window.GameFX.AudioSynth.playSuccess(); } catch(e){}
        }
        if (window.GameFX && window.GameFX.burst) {
          try { window.GameFX.burst(window.innerWidth / 2, window.innerHeight / 3); } catch(e){}
        }
      };
    })();
  </script>
</body>
</html>
