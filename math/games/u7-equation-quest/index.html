<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/math-mobile.css" />
    <title>Equation Quest — Balance Scale | Math Games</title>
    <meta
      name="description"
      content="A build-it math game for Grade 6 lessons 7.1-7.7 (6.EE.7): keep the balance scale even by doing the SAME inverse operation to both sides until x is alone, then read and lock in its whole-number value."
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #07140f;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      canvas {
        display: block;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }
      canvas:focus-visible {
        outline: 3px solid #3fbf8f;
        outline-offset: 4px;
        border-radius: 8px;
      }
      canvas:focus:not(:focus-visible) {
        outline: none;
      }
      #eq-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(
          130% 90% at 50% 0%,
          #14402e 0%,
          #0c281d 55%,
          #061410 100%
        );
      }
      #eq-bg-layer {
        position: absolute;
        inset: -6% -6%;
        will-change: transform;
        transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .eq-spark {
        position: absolute;
        border-radius: 50%;
        background: #8ff0c4;
        opacity: 0.5;
        animation: eqTwinkle var(--tw, 3s) ease-in-out infinite;
      }
      @keyframes eqTwinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.8);
        }
        50% {
          opacity: 0.75;
          transform: scale(1.2);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #eq-bg-layer {
          transition: none !important;
          transform: none !important;
        }
        .eq-spark {
          animation: none !important;
          opacity: 0.4 !important;
        }
      }
      #eq-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

        }
      });
    </script>

  <body>
    <!-- Decorative animated spark-field (behind the Phaser canvas). -->
    <div id="eq-bg" data-parallax aria-hidden="true">
      <div id="eq-bg-layer" data-parallax-layer></div>
    </div>
    <!-- Screen-reader live region: mirrors the current problem + result. -->
    <div id="eq-sr" role="status" aria-live="polite"></div>
    <script>
      // Decorative spark-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("eq-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 34;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "eq-spark";
            var sz = rnd(2, 5);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" +
            (dx * 20).toFixed(2) +
            "px," +
            (dy * 12).toFixed(2) +
            "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener)
            reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── EQUATION QUEST — BALANCE SCALE ──
      // Phaser 3 — Grade 6 Math — Solving one- and two-step equations (6.EE.7).
      // Mechanic (math-as-mechanic, no reflex/timer): the scale IS the equation.
      // The left pan shows the left side as x-boxes + unit weights; the right pan
      // shows units. You apply the SAME inverse operation to BOTH sides
      // (− a, + a, or ÷ k) to peel weights away until a single x is alone, then
      // read its value and Lock In. An illegal move (one that would unbalance the
      // scale or make a fraction) gently tilts the beam and is refused — no life
      // lost. A wrong final value, or running out of moves, costs a life and the
      // correct sequence is shown to teach. Every value is a whole number.

      const W = 820,
        H = 600;
      const LS_KEY = "eq_balance_scale_highscore";

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (
                window.AudioContext || window.webkitAudioContext
              )();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        tap() {
          this.play("square", 540, 0.05, 0.08);
        },
        move() {
          this.play("sine", 420, 0.08, 0.1);
          this.play("sine", 560, 0.08, 0.08);
        },
        tilt() {
          this.play("triangle", 240, 0.18, 0.12);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        lose() {
          [400, 330, 260, 200].forEach((f, i) =>
            setTimeout(() => this.play("sawtooth", f, 0.3, 0.14), i * 170),
          );
        },
      };

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          tap() {},
          pop() {},
          correct() {},
          wrong() {},
          whoosh() {},
          fanfare() {},
          musicStart() {},
          musicStop() {},
        },
        theme: () => ({
          accent: "#3fbf8f",
          accentN: 0x3fbf8f,
          tileN: 0x0e3326,
          botN: 0x0c281d,
        }),
        bgGradient() {},
        popIn() {},
        tilePop() {},
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function srSay(msg) {
        const el = document.getElementById("eq-sr");
        if (el) el.textContent = msg;
      }

      // ── Problem generator ────────────────────────────────────────────────
      // Returns { A, B, C, s, minMoves, banner, hint, solveHint } describing
      //   A·x + B = C   (solution s, always a whole number).
      // Level 1 (support): one-step — x + a = b (A=1) or a·x = b (B=0).
      // Level 2 (enrichment): two-step — a·x + b = c, bigger numbers.
      function makeProblem(level) {
        if (level === 1) {
          if (Math.random() < 0.5) {
            // x + a = b
            const a = randInt(2, 9),
              s = randInt(1, 9);
            return {
              A: 1,
              B: a,
              C: a + s,
              s,
              minMoves: 1,
              banner: "x + " + a + " = " + (a + s),
              hint:
                "Inverse of + " +
                a +
                " is − " +
                a +
                ". Subtract " +
                a +
                " from both sides.",
              solveHint: "Subtract " + a + " from both sides → x = " + s,
            };
          }
          // a·x = b
          const a = randInt(2, 5),
            s = randInt(1, 9);
          return {
            A: a,
            B: 0,
            C: a * s,
            s,
            minMoves: 1,
            banner: a + "x = " + a * s,
            hint:
              "Inverse of × " +
              a +
              " is ÷ " +
              a +
              ". Divide both sides by " +
              a +
              ".",
            solveHint: "Divide both sides by " + a + " → x = " + s,
          };
        }
        // Level 2: a·x + b = c
        const a = randInt(2, 6),
          s = randInt(1, 9),
          b = randInt(2, 12);
        const c = a * s + b;
        return {
          A: a,
          B: b,
          C: c,
          s,
          minMoves: 2,
          banner: a + "x + " + b + " = " + c,
          hint: "Two steps: first clear the number, then divide by the coefficient.",
          solveHint: "Subtract " + b + ", then divide by " + a + " → x = " + s,
        };
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0c281d",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [
          BootScene,
          TitleScene,
          VocabScene,
          LevelScene,
          GameScene,
          ResultScene,
        ],
      };

      // ── Cross-scene state ──
      let eqVocabSeen = false; // vocab gate: shown once per page session
      let eqLevel = 1; // 1 = support, 2 = enrichment (chosen in LevelScene)

      // Key words for THIS game's topic (solving equations). Each has a
      // student-facing (Level 1) definition and an emoji so a visual always
      // shows even with no network/images.
      const EQ_VOCAB = [
        {
          term: "Equation",
          emoji: "⚖️",
          def: "A math sentence saying two sides are equal, like 2x + 3 = 11.",
        },
        {
          term: "Variable",
          emoji: "🔤",
          def: "A letter, like x, that stands for a number you do not know yet.",
        },
        {
          term: "Balance",
          emoji: "🟰",
          def: "Both sides stay equal. Do the SAME thing to both sides to keep it fair.",
        },
        {
          term: "Inverse operation",
          emoji: "🔄",
          def: "The opposite move that undoes another. − undoes +; ÷ undoes ×.",
        },
        {
          term: "Solution",
          emoji: "🎯",
          def: "The value of x that makes the equation true once x is all alone.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0x8ff0c4);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0c281d);
        this.add
          .text(cx, 116, "EQUATION QUEST", {
            fontFamily: "Impact, sans-serif",
            fontSize: "62px",
            color: "#ffd24a",
            stroke: "#061410",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 170, "Balance Scale", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            color: "#8ff0c4",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            228,
            "Keep the scale even! Do the SAME inverse operation to BOTH\nsides until x is alone — then read its value and Lock In.",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#bfe0c8",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 292, "6.EE.7 · Lessons 7.1–7.7 · Solve equations", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#6fae8c",
          })
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 330, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#ffd24a",
              fontStyle: "bold",
            })
            .setOrigin(0.5);

        const btn = this.add
          .rectangle(cx, 400, 240, 58, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "START ▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.tweens.add({
          targets: [btn, btnT],
          scaleX: 1.05,
          scaleY: 1.05,
          duration: 800,
          yoyo: true,
          repeat: -1,
        });
        const start = () => {
          SFX.init();
          SFX.tap();
          JUICE.audio.unlock();
          // Vocab gate before the first play; on a replay jump to level select.
          this.scene.start(eqVocabSeen ? "Level" : "Vocab");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x36a35b));
        btn.on("pointerout", () => btn.setFillStyle(0x2d874b));
        btn.on("pointerdown", start);
        this.input.keyboard.on("keydown-SPACE", start);
        this.input.keyboard.on("keydown-ENTER", start);

        const hub = this.add
          .text(cx, 540, "← Back to Math Games", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#6fae8c",
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        hub.on("pointerover", () => hub.setColor("#ffd24a"));
        hub.on("pointerout", () => hub.setColor("#6fae8c"));
        hub.on("pointerdown", () => (window.location.href = "/math/games/"));
        srSay("Equation Quest Balance Scale. Press Start to play.");
      };

      // ── VOCAB GATE ──
      // Repo rule: term + Level-1 definition + image/emoji shown BEFORE play.
      function VocabScene() {
        Phaser.Scene.call(this, "Vocab");
      }
      VocabScene.prototype = Object.create(Phaser.Scene.prototype);
      VocabScene.prototype.constructor = VocabScene;
      VocabScene.prototype.init = function () {
        this.idx = 0;
      };
      VocabScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0c281d);
        this.add
          .text(cx, 70, "WORDS TO KNOW FIRST", {
            fontFamily: "Impact, sans-serif",
            fontSize: "34px",
            color: "#ffd24a",
            stroke: "#061410",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        this.add
          .rectangle(cx, 320, 560, 320, 0x0e3326)
          .setStrokeStyle(2, 0x2d874b);

        this.stepText = this.add
          .text(cx, 185, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            fontStyle: "bold",
            color: "#6fae8c",
          })
          .setOrigin(0.5);
        this.emojiText = this.add
          .text(cx, 250, "", { fontSize: "76px" })
          .setOrigin(0.5);
        this.termText = this.add
          .text(cx, 330, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "32px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.defText = this.add
          .text(cx, 400, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            color: "#bfe0c8",
            align: "center",
            wordWrap: { width: 500 },
          })
          .setOrigin(0.5);

        const nextBtn = this.add
          .rectangle(cx + 90, 510, 220, 52, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        const nextT = this.add
          .text(cx + 90, 510, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        nextBtn.on("pointerover", () => nextBtn.setFillStyle(0x36a35b));
        nextBtn.on("pointerout", () => nextBtn.setFillStyle(0x2d874b));
        nextBtn.on("pointerdown", () => this.advance());
        this.nextBtn = nextBtn;
        this.nextT = nextT;

        const backBtn = this.add
          .rectangle(cx - 120, 510, 130, 52, 0x123a48)
          .setInteractive({ useHandCursor: true });
        const backT = this.add
          .text(cx - 120, 510, "← Back", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            fontStyle: "bold",
            color: "#9fc6cf",
          })
          .setOrigin(0.5);
        backBtn.on("pointerover", () => backBtn.setFillStyle(0x1c4c5c));
        backBtn.on("pointerout", () => backBtn.setFillStyle(0x123a48));
        backBtn.on("pointerdown", () => this.goBack());
        this.backBtn = backBtn;
        this.backT = backT;

        this.input.keyboard.on("keydown-SPACE", () => this.advance());
        this.input.keyboard.on("keydown-ENTER", () => this.advance());
        this.input.keyboard.on("keydown-RIGHT", () => this.advance());
        this.input.keyboard.on("keydown-LEFT", () => this.goBack());

        this.renderCard();
      };
      VocabScene.prototype.renderCard = function () {
        const v = EQ_VOCAB[this.idx];
        const last = this.idx === EQ_VOCAB.length - 1;
        this.stepText.setText(
          "Key word " + (this.idx + 1) + " of " + EQ_VOCAB.length,
        );
        this.emojiText.setText(v.emoji);
        this.termText.setText(v.term);
        this.defText.setText(v.def);
        this.nextT.setText(last ? "Choose a level ▶" : "Next →");
        const showBack = this.idx > 0;
        this.backBtn.setVisible(showBack);
        this.backT.setVisible(showBack);
        srSay(v.term + ". " + v.def);
      };
      VocabScene.prototype.advance = function () {
        if (this.idx < EQ_VOCAB.length - 1) {
          this.idx++;
          this.renderCard();
        } else {
          eqVocabSeen = true;
          this.scene.start("Level");
        }
      };
      VocabScene.prototype.goBack = function () {
        if (this.idx > 0) {
          this.idx--;
          this.renderCard();
        }
      };

      // ── LEVEL SELECT ──
      // Required: two choices "Level 1" (support) and "Level 2" (enrichment).
      // The choice drives the generator and on-screen scaffolding, and shows in
      // the HUD during play.
      function LevelScene() {
        Phaser.Scene.call(this, "Level");
      }
      LevelScene.prototype = Object.create(Phaser.Scene.prototype);
      LevelScene.prototype.constructor = LevelScene;
      LevelScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0c281d);
        this.add
          .text(cx, 92, "CHOOSE YOUR LEVEL", {
            fontFamily: "Impact, sans-serif",
            fontSize: "40px",
            color: "#ffd24a",
            stroke: "#061410",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 142, "You can switch any time you play again.", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#bfe0c8",
          })
          .setOrigin(0.5);

        const makeCard = (x, lvl, title, lines, accent) => {
          const card = this.add
            .rectangle(x, 350, 320, 300, 0x0e3326)
            .setStrokeStyle(3, accent)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(x, 235, title, {
              fontFamily: "Impact, sans-serif",
              fontSize: "34px",

            })
            .setOrigin(0.5);
          this.add
            .text(x, 300, lines, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#bfe0c8",
              align: "center",
              lineSpacing: 8,
              wordWrap: { width: 280 },
            })
            .setOrigin(0.5);
          const pill = this.add
            .rectangle(x, 440, 200, 50, 0x2d874b)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(x, 440, "Play " + title, {

          const pick = () => {

          };
          [card, pill].forEach((o) => {
            o.on("pointerover", () => {

            o.on("pointerout", () => {
              card.setFillStyle(0x0e3326);
              pill.setFillStyle(0x2d874b);
            });
            o.on("pointerdown", pick);
          });
          return pick;
        };

        const pick1 = makeCard(
          cx - 180,
          1,
          "Level 1",
          "Support\n\nOne-step equations\nx + a = b  or  a·x = b\nSmall numbers\nInverse-operation hint",
          0x3fbf8f,
        );
        const pick2 = makeCard(
          cx + 180,
          2,
          "Level 2",
          "Enrichment\n\nTwo-step equations\na·x + b = c\nBigger numbers\nFewer hints",
          0xffd24a,
        );

        this.input.keyboard.on("keydown-ONE", pick1);
        this.input.keyboard.on("keydown-TWO", pick2);
        this.input.keyboard.on("keydown-LEFT", pick1);
        this.input.keyboard.on("keydown-RIGHT", pick2);

        this.add
          .text(cx, 540, "Press 1 or 2 (or tap a card) to begin.", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#6fae8c",
          })
          .setOrigin(0.5);
        srSay(
          "Choose your level. Press 1 for Level 1 support, or 2 for Level 2 enrichment.",
        );
      };

      // ── GAME ──
      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function () {
        this.reduceMotion =
          JUICE.reduceMotion ||
          !!(
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches
          );
        this.score = 0;
        this.lives = 3;
        this.streak = 0;
        this.level = eqLevel;
        this.solved = 0;
        this.target = 10; // win: solve this many equations
        // Equation state A·x + B = C and its solution s.
        this.A = 1;
        this.B = 0;
        this.C = 0;
        this.s = 0;
        this.movesLeft = 0;
        this.locked = false;
        this.opType = "sub"; // 'sub' | 'add' | 'div'
        this.opAmt = 1;
        this.dyn = []; // dynamic scale items, rebuilt each redraw
        this.lockTween = null;
        // Balance geometry (game space; Scale.FIT maps pointers in).
        this.pivotX = W / 2;
        this.pivotY = 215;
        this.panDX = 180; // pan offset from pivot
      };

      GameScene.prototype.create = function () {

        // Balance scale group (everything that should tilt together).

        // Beam

        // Hangers + platforms (both pans)

        this.add.rectangle(this.pivotX, this.pivotY + 86, 120, 10, 0x47300f);

        // Live symbolic readouts under each pan (the value you can read off).

        };
        this.leftExpr = this.add
          .text(this.pivotX - this.panDX, this.pivotY + 112, "", exprStyle)

        this.rightExpr = this.add
          .text(this.pivotX + this.panDX, this.pivotY + 112, "", exprStyle)

        this.add
          .text(this.pivotX, this.pivotY + 112, "=", exprStyle)
          .setOrigin(0.5);

        // Moves-left readout
        this.movesText = this.add
          .text(W / 2, 358, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            fontStyle: "bold",
            color: "#bfe0c8",
          })
          .setOrigin(0.5);

        // ── Operation controls ──
        this.add
          .text(150, 392, "Do to BOTH sides:", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",

          })
          .setOrigin(0, 0.5);
        this.chips = {};
        const chipDefs = [

        chipDefs.forEach((def) => {

            glyph = def[1],
            x = def[2];
          const r = this.add
            .rectangle(x, 424, 48, 44, 0x123a48)

          const t = this.add
            .text(x, 424, glyph, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "26px",
              fontStyle: "bold",
              color: "#ffffff",
            })
            .setOrigin(0.5);
          r.on("pointerdown", () => this.setOp(type));
          this.chips[type] = { rect: r, txt: t };
        });

        // Amount stepper
        const minus = this.add
          .rectangle(360, 424, 40, 44, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(360, 424, "◀", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        minus.on("pointerdown", () => this.bumpAmt(-1));
        this.amtBox = this.add
          .rectangle(412, 424, 56, 44, 0x0e3326)
          .setStrokeStyle(2, 0xffd24a);
        this.amtText = this.add
          .text(412, 424, "1", {
            fontFamily: "Impact, sans-serif",
            fontSize: "26px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);
        const plus = this.add
          .rectangle(464, 424, 40, 44, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(464, 424, "▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        plus.on("pointerdown", () => this.bumpAmt(1));

        // Apply button
        this.applyBtn = this.add
          .rectangle(620, 424, 170, 44, 0x2563a8)
          .setStrokeStyle(2, 0x7dd3fc)
          .setInteractive({ useHandCursor: true });
        this.applyText = this.add
          .text(620, 424, "Apply", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.applyBtn.on("pointerover", () =>
          this.applyBtn.setFillStyle(0x2f74c2),
        );
        this.applyBtn.on("pointerout", () =>
          this.applyBtn.setFillStyle(0x2563a8),
        );
        this.applyBtn.on("pointerdown", () => this.applyOp());

        // Lock-in button (armed only when x is alone)
        this.lockBtn = this.add
          .rectangle(W / 2, 486, 280, 50, 0x335544)
          .setStrokeStyle(2, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        this.lockText = this.add
          .text(W / 2, 486, "LOCK IN ✓", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#cfe9da",
          })
          .setOrigin(0.5);
        this.lockBtn.on("pointerdown", () => this.lockIn());

        // Keyboard help
        this.add
          .text(
            W / 2,
            528,
            "↑↓ pick operation · ←→ change amount · Space = Apply · Enter = Lock In",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "13px",
              color: "#6fae8c",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(
            W / 2,
            550,
            "Blue □ = one x · Gold ■ = a 1 weight · Tall gold = a 10",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "12px",
              color: "#4f8c6c",
            },
          )
          .setOrigin(0.5);

        // Effects
        this.burst = this.add
          .particles(0, 0, "spark", {
            speed: { min: 80, max: 240 },
            angle: { min: 0, max: 360 },
            scale: { start: 1.2, end: 0 },
            lifespan: 600,
            emitting: false,
            quantity: 16,
            tint: [0xffd24a, 0x8ff0c4, 0xffffff],
          })
          .setDepth(20);
        this.redFlash = this.add
          .rectangle(W / 2, H / 2, W, H, 0xff3333, 0)
          .setDepth(30);

        // Keyboard
        const order = ["sub", "add", "div"];
        this.input.keyboard.on("keydown-UP", () => {
          const i = order.indexOf(this.opType);
          this.setOp(order[(i + order.length - 1) % order.length]);
        });
        this.input.keyboard.on("keydown-DOWN", () => {
          const i = order.indexOf(this.opType);
          this.setOp(order[(i + 1) % order.length]);
        });
        this.input.keyboard.on("keydown-LEFT", () => this.bumpAmt(-1));
        this.input.keyboard.on("keydown-RIGHT", () => this.bumpAmt(1));
        this.input.keyboard.on("keydown-SPACE", () => this.applyOp());
        this.input.keyboard.on("keydown-ENTER", () => this.lockIn());

        this.cameras.main.fadeIn(400);
        this.newProblem();
      };

      // Current solved-state check: a single bare x on the left.
      GameScene.prototype.isIsolated = function () {
        return this.A === 1 && this.B === 0;
      };

      GameScene.prototype.leftExprStr = function () {
        const coef = this.A === 1 ? "x" : this.A + "x";
        return this.B > 0 ? coef + " + " + this.B : coef;
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        const p = makeProblem(this.level);
        this.A = p.A;
        this.B = p.B;
        this.C = p.C;
        this.s = p.s;
        this.problem = p;
        this.movesLeft = p.minMoves + 2; // generous buffer; "out of moves" = loss
        this.opAmt = 1;
        this.bannerText.setText(p.banner);
        // Level 1 shows the specific inverse-operation hint; Level 2 a shorter,
        // dimmer strategy nudge (fewer hints).
        this.feedback
          .setText(this.level === 1 ? "💡 " + p.hint : p.hint)
          .setColor(this.level === 1 ? "#8ff0c4" : "#4f8c6c");
        this.setOp("sub");
        this.drawScale();
        this.updateLock();
        this.updateMoves();
        srSay(
          "Level " +
            this.level +
            ". Solve " +
            p.banner +
            ". Do the same operation to both sides until x is alone, then lock in its value.",
        );
      };

      // ── Operation UI ──
      GameScene.prototype.setOp = function (type) {
        this.opType = type;
        if (type === "div" && this.opAmt < 2) this.opAmt = 2;
        Object.keys(this.chips).forEach((k) => {
          const sel = k === type;
          this.chips[k].rect.setFillStyle(sel ? 0x2d874b : 0x123a48);
          this.chips[k].rect.setStrokeStyle(2, sel ? 0xffd24a : 0x2d874b);
        });
        this.refreshAmt();
        SFX.tap();
      };
      GameScene.prototype.bumpAmt = function (d) {
        const min = this.opType === "div" ? 2 : 1;
        const max = this.opType === "div" ? 12 : 20;
        this.opAmt = Phaser.Math.Clamp(this.opAmt + d, min, max);
        this.refreshAmt();
        SFX.move();
      };
      GameScene.prototype.refreshAmt = function () {
        this.amtText.setText(String(this.opAmt));
        let lab;
        if (this.opType === "sub")
          lab = "Apply: − " + this.opAmt + " from both";
        else if (this.opType === "add")
          lab = "Apply: + " + this.opAmt + " to both";
        else lab = "Apply: ÷ both by " + this.opAmt;
        this.applyText.setText(lab);
      };
      GameScene.prototype.updateMoves = function () {
        // Reframed as a positive "efficiency bonus" meter: solving while it is
        // still above zero earns extra points, but running it out is NOT a loss
        // — students may take as many inverse moves as they need (calm mode).
        const m = Math.max(0, this.movesLeft);
        this.movesText.setText("Bonus: ★" + m);
        this.movesText.setColor("#bfe0c8");
      };
      GameScene.prototype.updateLock = function () {
        const armed = this.isIsolated();
        this.lockBtn.setFillStyle(armed ? 0x2d874b : 0x335544);
        this.lockBtn.setStrokeStyle(2, armed ? 0xffd24a : 0x2d874b);
        this.lockText
          .setText(armed ? "LOCK IN:  x = " + this.C : "LOCK IN ✓")
          .setColor(armed ? "#ffffff" : "#cfe9da");
        if (this.lockTween) {
          this.lockTween.remove();
          this.lockTween = null;
          this.lockBtn.setScale(1);
          this.lockText.setScale(1);
        }
        if (armed && !this.reduceMotion) {
          this.lockTween = this.tweens.add({
            targets: [this.lockBtn, this.lockText],
            scaleX: 1.05,
            scaleY: 1.05,
            duration: 600,
            yoyo: true,
            repeat: -1,
          });
        }
      };

      // ── Apply the chosen operation to BOTH sides ──
      GameScene.prototype.applyOp = function () {
        if (this.locked) return;
        const n = this.opAmt,
          t = this.opType;
        let legal = false;
        if (t === "sub") {
          legal = this.B - n >= 0 && this.C - n >= 0;
          if (legal) {
            this.B -= n;
            this.C -= n;
          }
        } else if (t === "add") {
          legal = this.C + n <= 99;
          if (legal) {
            this.B += n;
            this.C += n;
          }
        } else {
          // div: must divide A, B, and C exactly (whole numbers, true balance)
          legal =
            n >= 2 && this.A % n === 0 && this.B % n === 0 && this.C % n === 0;
          if (legal) {
            this.A /= n;
            this.B /= n;
            this.C /= n;
          }
        }
        if (!legal) {
          this.tiltScale();
          SFX.tilt();
          this.feedback
            .setText(
              "⚖️ That would unbalance the scale — try a different move.",
            )
            .setColor("#ffb38a");
          srSay("That move would unbalance the scale. Try a different one.");
          return;
        }
        // Legal move
        this.movesLeft--;
        SFX.move();
        JUICE.audio.whoosh();
        this.drawScale();
        this.updateLock();
        this.updateMoves();
        if (this.isIsolated()) {
          this.feedback
            .setText("✅ x is alone! Read the value, then Lock In.")
            .setColor("#8ff0c4");
          srSay("x is alone. It equals " + this.C + ". Press Lock In.");
        } else {
          this.feedback
            .setText("Now: " + this.leftExprStr() + " = " + this.C)
            .setColor("#bfe0c8");
        }
      };

      // ── Lock in the answer ──
      GameScene.prototype.lockIn = function () {
        if (this.locked) return;
        if (this.isIsolated()) {
          // Balance is always preserved by legal ops, so an isolated x is the
          // true solution.
          this.locked = true;
          if (this.lockTween) {
            this.lockTween.remove();
            this.lockTween = null;
          }
          JUICE.audio.correct(this.streak);
          this.solved++;
          this.streak++;
          const bonus = Math.min(this.streak, 5) * 5;
          const eff = Math.max(0, this.movesLeft) * 5;
          const gained = 20 + bonus + eff;
          this.score += gained;
          const cx = this.pivotX + this.panDX,
            cy = this.pivotY;
          this.burst.setPosition(cx, cy);
          this.burst.explode(16);
          JUICE.burst(this, cx, cy, [0x36a35b, 0x8ff0c4, 0xffffff], 16);
          JUICE.shake(this, 0.005);
          JUICE.floatText(this, W / 2, 200, "+" + gained, "#8ff0c4", 38);
          JUICE.award(gained, "u7-equation-quest");
          if (this.streak >= 2) JUICE.confetti(this, 1);
          this.feedback
            .setText("Correct! x = " + this.s + ". " + this.problem.solveHint)
            .setColor("#8ff0c4");
          srSay("Correct. x equals " + this.s + ".");
          this.afterAttempt(true);
        } else {
          // Gentle nudge — NOT a loss. x isn't isolated yet, so just guide the
          // student to keep applying inverse moves (calm, no-penalty).
          SFX.tilt();
          this.feedback
            .setText(
              "x isn't alone yet — keep doing the same move to both sides until x is by itself.",
            )
            .setColor("#ffb38a");
          srSay("x is not alone yet. Keep using inverse moves on both sides.");
        }
      };

      GameScene.prototype.loseRound = function (reason) {
        if (this.locked) return;
        this.locked = true;
        if (this.lockTween) {
          this.lockTween.remove();
          this.lockTween = null;
        }
        JUICE.audio.wrong();
        SFX.tilt();
        this.streak = 0;
        this.lives--;
        this.flashRed();
        JUICE.shake(this, 0.009);
        this.feedback
          .setText(reason + "  ➜  " + this.problem.solveHint)
          .setColor("#ffb38a");
        srSay(reason + " The answer is x equals " + this.s + ".");
        // Teach: show the fully-solved state (x = s) so the correct result is
        // visible before moving on.
        this.A = 1;
        this.B = 0;
        this.C = this.s;
        this.drawScale();
        this.updateLock();
        this.afterAttempt(false);
      };

      GameScene.prototype.afterAttempt = function (correct) {
        this.updateHUD();
        if (this.lives <= 0) {
          // No-fail practice: refill hearts and keep going. Mistakes teach;
          // they never end the game (calm, self-paced classroom mode).
          this.lives = 3;
          this.updateHUD();
        }
        if (this.solved >= this.target) {
          this.endGame(true);
          return;
        }
        this.time.delayedCall(correct ? 1100 : 1700, () => this.newProblem());
      };

      // ── Balance rendering ──
      GameScene.prototype.drawScale = function () {
        this.dyn.forEach((d) => d.destroy());
        this.dyn = [];
        // Left pan: A x-boxes + B unit weights; right pan: C unit weights.
        this.placePan(-this.panDX, this.A, this.B);
        this.placePan(this.panDX, 0, this.C);
        this.leftExpr.setText(this.leftExprStr());
        this.rightExpr.setText(String(this.C));
        this.scaleGroup.setRotation(0);
      };

      // Draws one pan's contents into the (tilting) scale group, in container-
      // local coordinates relative to the pivot.
      GameScene.prototype.placePan = function (cx, xCount, unitVal) {
        const add = (obj) => {
          this.scaleGroup.add(obj);
          this.dyn.push(obj);
        };
        const xbox = (x, y) => {
          const r = this.add.rectangle(x, y, 26, 26, 0x4f9cff);
          r.setStrokeStyle(2, 0x1f5fae);
          add(r);
          add(
            this.add
              .text(x, y, "x", {
                fontFamily: "Impact, sans-serif",
                fontSize: "18px",
                color: "#ffffff",
              })
              .setOrigin(0.5),
          );
        };
        const ten = (x, y) => {
          const r = this.add.rectangle(x, y, 16, 26, 0xffd24a);
          r.setStrokeStyle(2, 0xb8881d);
          add(r);
          add(
            this.add
              .text(x, y, "10", {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "9px",
                fontStyle: "bold",
                color: "#5a3c00",
              })
              .setOrigin(0.5),
          );
        };
        const one = (x, y) => {
          const r = this.add.rectangle(x, y, 13, 13, 0xffe07a);
          r.setStrokeStyle(1, 0xb8881d);
          add(r);
        };
        // Generic centered-row placement.
        const row = (count, size, gap, perRow, baseY, rowGap, fn) => {
          for (let i = 0; i < count; i++) {
            const r = Math.floor(i / perRow);
            const inRow = Math.min(perRow, count - r * perRow);
            const totalW = inRow * size + (inRow - 1) * gap;
            const startX = cx - totalW / 2 + size / 2;
            const col = i % perRow;
            fn(startX + col * (size + gap), baseY + r * (size + rowGap));
          }
        };
        // x-boxes (top rows)
        row(xCount, 26, 6, 4, 24, 2, xbox);
        // unit weights: tens row, then ones row
        const tens = Math.floor(unitVal / 10),
          ones = unitVal % 10;
        row(tens, 16, 5, 6, 80, 0, ten);
        row(ones, 13, 4, 9, 100, 0, one);
      };

      GameScene.prototype.tiltScale = function () {
        if (this.reduceMotion) {
          this.scaleGroup.setRotation(0);
          this.flashRed(0.18);
          return;
        }
        this.tweens.add({
          targets: this.scaleGroup,
          rotation: 0.06,
          duration: 140,
          yoyo: true,
          ease: "Sine.InOut",
          onComplete: () => this.scaleGroup.setRotation(0),
        });
      };

      GameScene.prototype.flashRed = function (a) {
        if (this.reduceMotion && a == null) return;
        this.redFlash.setAlpha(a == null ? 0.32 : a);
        this.tweens.add({ targets: this.redFlash, alpha: 0, duration: 350 });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.livesText.setText(this.lives > 0 ? "❤".repeat(this.lives) : "—");
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText("Level " + this.level);
        this.progressText.setText(this.solved + " / " + this.target);
      };

      GameScene.prototype.endGame = function (won) {
        this.locked = true;
        this.time.delayedCall(600, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            level: this.level,
            won,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0c281d);
        const stars =
          d.solved >= d.target ? 3 : d.solved >= d.target * 0.6 ? 2 : 1;
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        if (d.score > hs) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }

        this.add
          .text(cx, 110, d.won ? "BALANCE MASTER!" : "OUT OF LIVES", {
            fontFamily: "Impact, sans-serif",
            fontSize: "48px",
            color: d.won ? "#8ff0c4" : "#ff8f8f",
            stroke: "#061410",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        const starStr = "★".repeat(stars) + "☆".repeat(3 - stars);
        this.add
          .text(cx, 185, starStr, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "48px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);

        this.add
          .text(cx, 255, "Score: " + d.score, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "30px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            295,
            "Solved " +
              d.solved +
              " of " +
              d.target +
              " equations (Level " +
              d.level +
              ")",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "18px",
              color: "#bfe0c8",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 325, "High Score: " + hs, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);

        if (d.won) JUICE.audio.fanfare();
        else SFX.lose();
        if (d.won) JUICE.confetti(this, 1);

        // EduPulse reporting (guarded; safe no-op without bridge).
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.score,
              stars: stars,
              standard: "6.EE.7",
              problemsAttempted: d.solved,
            });
        } catch (e) {}
        srSay(
          (d.won ? "You won! " : "Game over. ") +
            "Final score " +
            d.score +
            ", " +
            stars +
            " stars.",
        );

        const btn = this.add
          .rectangle(cx, 400, 240, 54, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "PLAY AGAIN 🔁", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const again = () => this.scene.start("Level");
        btn.on("pointerover", () => btn.setFillStyle(0x36a35b));
        btn.on("pointerout", () => btn.setFillStyle(0x2d874b));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        const hub = this.add
          .text(cx, 480, "← Back to Math Games", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#6fae8c",
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        hub.on("pointerover", () => hub.setColor("#ffd24a"));
        hub.on("pointerout", () => hub.setColor("#6fae8c"));
        hub.on("pointerdown", () => (window.location.href = "/math/games/"));
      };

      // ── Launch ──
      const eqGame = new Phaser.Game(config);

      // Canvas accessibility (additive; no gameplay change).
      eqGame.events.once("ready", function () {
        try {
          const cv = eqGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Equation Quest Balance Scale math game. An equation appears at the " +
              "top. Use the up and down arrows to pick an operation, the left " +
              "and right arrows to set the amount, and press Space to apply it " +
              "to both sides of the scale. Keep the scale balanced until x is " +
              "alone, then press Enter to lock in its value.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>
