  <body>

    <!-- Decorative animated spark-field (behind the Phaser canvas). -->
    <div id="eq-bg" data-parallax aria-hidden="true">
      <div id="eq-bg-layer" data-parallax-layer></div>
    </div>
    <!-- Screen-reader live region: mirrors the current problem + result. -->
    <div id="eq-sr" role="status" aria-live="polite"></div>
    <script>
      // Decorative spark-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("eq-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 34;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "eq-spark";
            var sz = rnd(2, 5);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" + (dx * 20).toFixed(2) + "px," + (dy * 12).toFixed(2) + "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener) reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── EQUATION QUEST — BALANCE SCALE ──
      // Phaser 3 — Grade 6 Math — Solving one- and two-step equations (6.AT.8).
      // Mechanic (math-as-mechanic, no reflex/timer): the scale IS the equation.
      // The left pan shows the left side as x-boxes + unit weights; the right pan
      // shows units. You apply the SAME inverse operation to BOTH sides
      // (− a, + a, or ÷ k) to peel weights away until a single x is alone, then
      // read its value and Lock In. An illegal move (one that would unbalance the
      // scale or make a fraction) gently tilts the beam and is refused. Locking
      // in before x is alone just gives a gentle nudge — no-fail, calm practice.
      // Extra moves only spend the efficiency bonus. Every value is a whole
      // number.

      const W = 820,
        H = 600;
      const LS_KEY = "eq_balance_scale_highscore";

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx || window.NT_MUTED) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        tap() {
          this.play("square", 540, 0.05, 0.08);
        },
        move() {
          this.play("sine", 420, 0.08, 0.1);
          this.play("sine", 560, 0.08, 0.08);
        },
        tilt() {
          this.play("triangle", 240, 0.18, 0.12);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        lose() {
          [400, 330, 260, 200].forEach((f, i) =>
            setTimeout(() => this.play("sawtooth", f, 0.3, 0.14), i * 170),
          );
        },
      };

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          tap() {},
          pop() {},
          correct() {},
          wrong() {},
          whoosh() {},
          fanfare() {},
          musicStart() {},
          musicStop() {},
        },
        theme: () => ({
          accent: "#3fbf8f",
          accentN: 0x3fbf8f,
          tileN: 0x0e3326,
          botN: 0x0c281d,
        }),
        bgGradient() {},
        popIn() {},
        tilePop() {},
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function srSay(msg) {
        const el = document.getElementById("eq-sr");
        if (el) el.textContent = msg;
      }

      // ── Problem generator ────────────────────────────────────────────────
      // Returns { A, B, C, s, rel, minMoves, banner, solveHint, check } for
      //   A·x + B (rel) C   with rel "=", ">" or "<" and boundary/solution s
      // (always a whole number).
      // Level 1 (support): one-step — x + a = b (A=1) or a·x = b (B=0).
      // Level 2 (enrichment): two-step — a·x + b = c, bigger numbers.
      // About 1 in 3 rounds at each level is an INEQUALITY (6.AT.9): the scale
      // tips, the same inverse moves isolate x, then the student picks a
      // number that makes the inequality true (substitution, 6.AT.8).
      function lhsStr(A, B) {
        const coef = A === 1 ? "x" : A + "x";
        return B > 0 ? coef + " + " + B : coef;
      }
      function makeProblem(level) {
        let A, B, s;
        if (level === 1) {
          s = randInt(1, 9);
          if (Math.random() < 0.5) {
            A = 1;
            B = randInt(2, 9);
          } else {
            A = randInt(2, 5);
            B = 0;
          }
        } else {
          A = randInt(2, 6);
          s = randInt(1, 9);
          B = randInt(2, 12);
        }
        const C = A * s + B;
        const rel = Math.random() < 0.35 ? (Math.random() < 0.5 ? ">" : "<") : "=";
        const steps = [];
        if (B > 0) steps.push("subtract " + B);
        if (A > 1) steps.push("divide by " + A);
        const p = {
          A,
          B,
          C,
          s,
          rel,
          minMoves: steps.length,
          banner: lhsStr(A, B) + " " + rel + " " + C,
          solveHint: steps.length === 2 ? "Subtract " + B + ", then divide by " + A + "." : "Do one move: " + steps[0] + " on both sides.",
          // Substitution check (6.AT.8): plug a value back into the original.
          check(v) {
            const left = A * v + B;
            const shown = (A === 1 ? String(v) : A + " × " + v) + (B > 0 ? " + " + B : "");
            const ok = rel === "=" ? left === C : rel === ">" ? left > C : left < C;
            return { left, ok, text: shown + " = " + left + ", and " + left + " " + rel + " " + C + " is " + (ok ? "true" : "false") + "." };
          },
        };
        if (rel !== "=") {
          // Choices: one true value, the boundary, one on the wrong side.
          const good = rel === ">" ? s + randInt(1, 4) : Math.max(0, s - randInt(1, Math.max(1, s)));
          const wrongSide = rel === ">" ? Math.max(0, s - randInt(1, Math.max(1, s))) : s + randInt(1, 4);
          const opts = [
            { value: good, correct: true },
            { value: s, correct: false, boundary: true },
          ];
          if (wrongSide !== s && wrongSide !== good) opts.push({ value: wrongSide, correct: false });
          for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
          }
          p.choices = opts.map((o) => {
            const ck = p.check(o.value);
            return {
              ...o,
              label: String(o.value),
              why: o.boundary
                ? o.value + " is the boundary. x " + rel + " " + s + " means x is " + (rel === ">" ? "MORE" : "LESS") + " than " + s + ", so " + s + " itself does not work. Check: " + ck.text
                : "Check by plugging it in: " + ck.text,
            };
          });
        }
        return p;
      }
      const EQ_STREAK_KEY = "eq_balance_scale_beststreak";
      function calmMotion() {
        if (window.GameStudio) return !!window.GameStudio.settings.reducedMotion;
        return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0c281d",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, VocabScene, LevelScene, GameScene, ResultScene],
      };

      // ── Cross-scene state ──
      let eqVocabSeen = false; // vocab gate: shown once per page session
      let eqLevel = 1; // 1 = support, 2 = enrichment (chosen in LevelScene)
      let eqAuto = false; // true when the ✨ Auto button picked the level (NTAdaptive)
      let eqEndless = false; // true for endless (no auto-end) runs

      // Key words for THIS game's topic (solving equations). Each has a
      // student-facing (Level 1) definition and an emoji so a visual always
      // shows even with no network/images.
      const EQ_VOCAB = [
        {
          term: "Equation",
          emoji: "⚖️",
          def: "A math sentence saying two sides are equal, like 2x + 3 = 11.",
        },
        {
          term: "Variable",
          emoji: "🔤",
          def: "A letter, like x, that stands for a number you do not know yet.",
        },
        {
          term: "Balance",
          emoji: "🟰",
          def: "Both sides stay equal. Do the SAME thing to both sides to keep it fair.",
        },
        {
          term: "Inverse operation",
          emoji: "🔄",
          def: "The opposite move that undoes another. − undoes +; ÷ undoes ×.",
        },
        {
          term: "Inequality",
          emoji: "↗️",
          def: "A math sentence with > (greater than) or < (less than). x > 4 means x can be ANY number bigger than 4.",
        },
        {
          term: "Solution",
          emoji: "🎯",
          def: "The value of x that makes the equation true once x is all alone.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0x8ff0c4);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0c281d);
        this.add
          .text(cx, 116, "EQUATION QUEST", {
            fontFamily: "Impact, sans-serif",
            fontSize: "62px",
            color: "#ffd24a",
            stroke: "#061410",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 170, "Balance Scale", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            color: "#8ff0c4",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            228,
            "Do the SAME opposite move to BOTH sides until x is alone.\nThen lock in. Tipped scales are inequalities. No timer.",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#bfe0c8",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 292, "6.AT.8 · 6.AT.9 · Unit 8 · Equations and inequalities", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#9fd8b8",
          })
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 330, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#ffd24a",
              fontStyle: "bold",
            })
            .setOrigin(0.5);

        const btn = this.add
          .rectangle(cx, 400, 240, 58, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "START ▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        if (!calmMotion())
          this.tweens.add({
            targets: [btn, btnT],
            scaleX: 1.04,
            scaleY: 1.04,
            duration: 900,
            yoyo: true,
            repeat: -1,
          });
        const start = () => {
          SFX.init();
          SFX.tap();
          JUICE.audio.unlock();
          // Vocab gate before the first play; on a replay jump to level select.
          this.scene.start(eqVocabSeen ? "Level" : "Vocab");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x36a35b));
        btn.on("pointerout", () => btn.setFillStyle(0x2d874b));
        btn.on("pointerdown", start);
        this.input.keyboard.on("keydown-SPACE", start);
        this.input.keyboard.on("keydown-ENTER", start);
        srSay("Equation Quest Balance Scale. Press Start to play.");
      };

      // ── VOCAB GATE ──
      // Repo rule: term + Level-1 definition + image/emoji shown BEFORE play.
      function VocabScene() {
        Phaser.Scene.call(this, "Vocab");
      }
      VocabScene.prototype = Object.create(Phaser.Scene.prototype);
      VocabScene.prototype.constructor = VocabScene;
      VocabScene.prototype.init = function () {
        this.idx = 0;
      };
      VocabScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0c281d);
        this.add
          .text(cx, 70, "WORDS TO KNOW FIRST", {
            fontFamily: "Impact, sans-serif",
            fontSize: "34px",
            color: "#ffd24a",
            stroke: "#061410",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        this.add.rectangle(cx, 320, 560, 320, 0x0e3326).setStrokeStyle(2, 0x2d874b);

        this.stepText = this.add
          .text(cx, 185, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            fontStyle: "bold",
            color: "#6fae8c",
          })
          .setOrigin(0.5);
        this.emojiText = this.add.text(cx, 250, "", { fontSize: "76px" }).setOrigin(0.5);
        this.termText = this.add
          .text(cx, 330, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "32px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.defText = this.add
          .text(cx, 400, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            color: "#bfe0c8",
            align: "center",
            wordWrap: { width: 500 },
          })
          .setOrigin(0.5);

        const nextBtn = this.add
          .rectangle(cx + 90, 510, 220, 52, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        const nextT = this.add
          .text(cx + 90, 510, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        nextBtn.on("pointerover", () => nextBtn.setFillStyle(0x36a35b));
        nextBtn.on("pointerout", () => nextBtn.setFillStyle(0x2d874b));
        nextBtn.on("pointerdown", () => this.advance());
        this.nextBtn = nextBtn;
        this.nextT = nextT;

        const backBtn = this.add
          .rectangle(cx - 120, 510, 130, 52, 0x123a48)
          .setInteractive({ useHandCursor: true });
        const backT = this.add
          .text(cx - 120, 510, "← Back", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            fontStyle: "bold",
            color: "#9fc6cf",
          })
          .setOrigin(0.5);

      VocabScene.prototype.renderCard = function () {

      // ── GAME ──
      const TXT = (size, color, extra) => ({ fontFamily: "Segoe UI, sans-serif", fontSize: size + "px", color, ...(extra || {}) });
      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function () {

      GameScene.prototype.create = function () {

        this.bannerText = this.add
          .text(W / 2, 94, "", {

            fontSize: "40px",
            color: "#ffffff",

          })
          .setOrigin(0.5);
        // Feedback stays until the next action.

          .text(W / 2, 122, "", TXT(16, "#8ff0c4", { fontStyle: "bold", align: "center", wordWrap: { width: W - 60 } }))
          .setOrigin(0.5, 0);

        // Balance scale group (everything that tilts together).
        this.scaleGroup = this.add.container(this.pivotX, this.pivotY);
        this.beam = this.add.rectangle(0, 0, 380, 14, 0x8a5a2b).setStrokeStyle(2, 0x5e3c1c);

        [-this.panDX, this.panDX].forEach((dx) => {
          this.scaleGroup.add(this.add.rectangle(dx, 22, 4, 44, 0x5e3c1c));
          this.scaleGroup.add(this.add.rectangle(dx, 112, 156, 10, 0x6b4420).setStrokeStyle(2, 0x47300f));
        });

        // up through the beam), on a fixed base plate.
        const g = this.add.graphics();
        g.fillStyle(0x5e3c1c, 1);
        g.fillTriangle(this.pivotX, this.pivotY + 6, this.pivotX - 30, this.pivotY + 92, this.pivotX + 30, this.pivotY + 92);
        g.fillStyle(0x47300f, 1);
        g.fillRect(this.pivotX - 60, this.pivotY + 92, 120, 10);
        this.scaleGroup.add(this.add.circle(0, 0, 10, 0xffd24a));
        this.children.bringToTop(this.scaleGroup);

        // Symbolic readouts BELOW each pan (no longer printed on the platform).

        this.rightExpr = this.add.text(this.pivotX + this.panDX, this.pivotY + 140, "", exprStyle).setOrigin(0.5);

        this.chips = {};
        [
          ["sub", "−", 150],
          ["add", "+", 206],

        ].forEach(([type, glyph, x]) => {
          const r = this.add.rectangle(x, 428, 48, 46, 0x123a48).setStrokeStyle(2, 0x2d874b).setInteractive({ useHandCursor: true });
          const t = this.add.text(x, 428, glyph, TXT(28, "#ffffff", { fontStyle: "bold" })).setOrigin(0.5);
          r.on("pointerdown", () => this.setOp(type));
          this.chips[type] = { rect: r, txt: t };
          this.ctl.push(r, t);
        });
        const minus = this.add.rectangle(360, 428, 44, 46, 0x2d874b).setInteractive({ useHandCursor: true });
        const minusT = this.add.text(360, 428, "◀", TXT(20, "#ffffff")).setOrigin(0.5);
        minus.on("pointerdown", () => this.bumpAmt(-1));
        this.amtBox = this.add.rectangle(414, 428, 58, 46, 0x0e3326).setStrokeStyle(2, 0xffd24a);
        this.amtText = this.add.text(414, 428, "1", { fontFamily: "Impact, sans-serif", fontSize: "26px", color: "#ffd24a" }).setOrigin(0.5);
        const plus = this.add.rectangle(468, 428, 44, 46, 0x2d874b).setInteractive({ useHandCursor: true });
        const plusT = this.add.text(468, 428, "▶", TXT(20, "#ffffff")).setOrigin(0.5);
        plus.on("pointerdown", () => this.bumpAmt(1));
        this.applyBtn = this.add
          .rectangle(630, 428, 200, 46, 0x2563a8)
          .setStrokeStyle(2, 0x7dd3fc)
          .setInteractive({ useHandCursor: true });

        this.applyBtn.on("pointerover", () => this.applyBtn.setFillStyle(0x2f74c2));
        this.applyBtn.on("pointerout", () => this.applyBtn.setFillStyle(0x2563a8));
        this.applyBtn.on("pointerdown", () => this.applyOp());
        this.ctl.push(minus, minusT, this.amtBox, this.amtText, plus, plusT, this.applyBtn, this.applyText);

        // Lock-in button (armed only when x is alone)
        this.lockBtn = this.add
          .rectangle(W / 2, 488, 300, 50, 0x335544)
          .setStrokeStyle(2, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        this.lockText = this.add.text(W / 2, 488, "LOCK IN ✓", TXT(20, "#cfe9da", { fontStyle: "bold" })).setOrigin(0.5);
        this.lockBtn.on("pointerdown", () => this.lockIn());
        this.ctl.push(this.lockBtn, this.lockText);

        this.keysText = this.add.text(W / 2, 532, "", TXT(15, "#a9d4b4", { align: "center", wordWrap: { width: W - 60 } })).setOrigin(0.5);
        this.coachText = this.add
          .text(W / 2, 568, "", TXT(17, "#ffe9a8", { fontStyle: "bold", align: "center", wordWrap: { width: W - 60 } }))
          .setOrigin(0.5);
        this.numberLine = this.add.graphics().setDepth(6);
        this.nlLabels = [];

        this.burst = this.add
          .particles(0, 0, "spark", {
            speed: { min: 80, max: 240 },
            angle: { min: 0, max: 360 },
            scale: { start: 1.2, end: 0 },
            lifespan: 600,
            emitting: false,
            quantity: 16,
            tint: [0xffd24a, 0x8ff0c4, 0xffffff],
          })
          .setDepth(20);
        this.amberTint = this.add.rectangle(W / 2, H / 2, W, H, 0xf0b44a, 0).setDepth(30);

        const order = ["sub", "add", "div"];
        this.input.keyboard.on("keydown-UP", () => {
          if (this.phase !== "solve") return;
          const i = order.indexOf(this.opType);
          this.setOp(order[(i + order.length - 1) % order.length]);
        });
        this.input.keyboard.on("keydown-DOWN", () => {
          if (this.phase !== "solve") return;
          const i = order.indexOf(this.opType);
          this.setOp(order[(i + 1) % order.length]);
        });
        this.input.keyboard.on("keydown-LEFT", () => (this.phase === "pick" ? this.moveChoice(-1) : this.bumpAmt(-1)));
        this.input.keyboard.on("keydown-RIGHT", () => (this.phase === "pick" ? this.moveChoice(1) : this.bumpAmt(1)));
        this.input.keyboard.on("keydown-SPACE", () => {
          if (this.phase === "solve") this.applyOp();
        });
        this.input.keyboard.on("keydown-ENTER", () => this.lockIn());
        ["ONE", "TWO", "THREE"].forEach((k, i) =>
          this.input.keyboard.on("keydown-" + k, () => {
            if (this.phase === "pick" && !this.locked) this.submitChoice(i);
          }),
        );
        this.events.once("shutdown", () => this.hideChoices());

        if (!this.reduceMotion) this.cameras.main.fadeIn(400);
        this.newProblem();
      };

      // Current solved-state check: a single bare x on the left.
      GameScene.prototype.isIsolated = function () {
        return this.A === 1 && this.B === 0;
      };
      GameScene.prototype.leftExprStr = function () {
        return lhsStr(this.A, this.B);
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.phase = "solve";
        const p = makeProblem(this.level);
        this.A = p.A;
        this.B = p.B;
        this.C = p.C;
        this.s = p.s;
        this.rel = p.rel;
        this.problem = p;
        this.usedHelp = false;
        this.missteps = 0; // illegal or backwards moves on this problem
        this.helpTier = 0;
        this.pickTries = 0;
        this.movesLeft = p.minMoves + 2; // efficiency-bonus meter only; never a loss
        this.opAmt = 1;
        this.hideChoices();
        this.numberLine.clear();
        this.nlLabels.forEach((t) => t.destroy());
        this.nlLabels = [];
        this.ctl.forEach((o) => o.setVisible(true));
        this.movesText.setVisible(true);
        // A tipped scale shows an inequality: the heavier side hangs lower.
        this.baseTilt = p.rel === ">" ? -0.07 : p.rel === "<" ? 0.07 : 0;
        this.bannerLabel.setText(p.rel === "=" ? "Solve for x · keep the scale balanced" : "Inequality · the scale is tipped · solve for x");
        this.bannerText.setText(p.banner);
        this.feedback.setText("").setColor("#8ff0c4");
        this.keysText.setText("↑ ↓ pick an operation · ← → change the amount · Space = Apply · Enter = Lock In");
        this.setOp("sub", true);
        this.drawScale();
        this.updateLock();
        this.updateMoves();
        this.updateHUD();
        this.updateCoach();
        srSay(
          "Level " + this.level + ". Solve " + p.banner + ". Do the same operation to both sides until x is alone, then lock in.",
        );
      };

      // Support tier (Level 1): a live coach that names the next action
      // (the kind of move, never the finished answer).
      GameScene.prototype.updateCoach = function () {
        if (this.level !== 1 || this.locked) {
          this.coachText.setText("");
          return;
        }
        let msg;
        if (this.phase === "pick") msg = "Next: plug a choice into the inequality. Pick the one that makes it TRUE.";
        else if (this.isIsolated()) msg = "Next: x is alone. Press Enter to lock in.";
        else if (this.B > 0) msg = "Next: a number is ADDED to x. Pick the sign that undoes adding, set the amount, then Apply.";
        else msg = "Next: x is MULTIPLIED. Pick the sign that undoes multiplying, set the amount, then Apply.";
        this.coachText.setText("👉 " + msg);
      };

      // Earned help: Tier 1 = method; Tier 2 = the concrete next move.
      GameScene.prototype.giveHelp = function () {
        this.usedHelp = true;
        this.helpTier = Math.min(2, this.helpTier + 1);
        let tip;
        if (this.helpTier === 1)
          tip =
            this.B > 0
              ? "💡 Undo the + first: use the opposite of adding on both sides."
              : "💡 x is multiplied. Use the opposite of multiplying on both sides.";
        else tip = this.B > 0 ? "🔎 Choose −, set " + this.B + ", then Apply." : "🔎 Choose ÷, set " + this.A + ", then Apply.";
        return tip;
      };

      // ── Operation UI ──
      GameScene.prototype.setOp = function (type, silent) {
        this.opType = type;
        if (type === "div" && this.opAmt < 2) this.opAmt = 2;
        Object.keys(this.chips).forEach((k) => {
          const sel = k === type;
          this.chips[k].rect.setFillStyle(sel ? 0x2d874b : 0x123a48);
          this.chips[k].rect.setStrokeStyle(sel ? 3 : 2, sel ? 0xffd24a : 0x2d874b);
        });
        this.refreshAmt();
        if (!silent) SFX.tap();
      };
      GameScene.prototype.bumpAmt = function (d) {
        if (this.phase !== "solve" || this.locked) return;
        const min = this.opType === "div" ? 2 : 1;
        const max = this.opType === "div" ? 12 : 20;
        this.opAmt = Phaser.Math.Clamp(this.opAmt + d, min, max);
        this.refreshAmt();
        SFX.move();
      };
      GameScene.prototype.refreshAmt = function () {
        this.amtText.setText(String(this.opAmt));
        // Words, not a small "÷" glyph (it renders like "+" at small sizes).
        let lab;
        if (this.opType === "sub") lab = "Subtract " + this.opAmt + " from both";
        else if (this.opType === "add") lab = "Add " + this.opAmt + " to both";
        else lab = "Divide both by " + this.opAmt;
        this.applyText.setText(lab);
      };
      GameScene.prototype.updateMoves = function () {
        // Positive "efficiency bonus" meter; running out is NOT a loss.
        this.movesText.setText("Efficiency bonus: ★" + Math.max(0, this.movesLeft));
      };
      GameScene.prototype.updateLock = function () {
        const armed = this.isIsolated() && this.phase === "solve";
        this.lockBtn.setFillStyle(armed ? 0x2d874b : 0x335544);
        this.lockBtn.setStrokeStyle(2, armed ? 0xffd24a : 0x2d874b);
        this.lockText.setText(armed ? "LOCK IN:  x " + this.rel + " " + this.C : "LOCK IN ✓").setColor(armed ? "#ffffff" : "#cfe9da");
        if (this.lockTween) {
          this.lockTween.remove();
          this.lockTween = null;
          this.lockBtn.setScale(1);
          this.lockText.setScale(1);
        }
        if (armed && !this.reduceMotion) {
          this.lockTween = this.tweens.add({
            targets: [this.lockBtn, this.lockText],
            scaleX: 1.04,
            scaleY: 1.04,
            duration: 700,
            yoyo: true,
            repeat: -1,
          });
        }
      };

      // Why a move cannot be done — the specific misconception, not a generic "no".
      GameScene.prototype.illegalWhy = function (t, n) {
        if (t === "sub") {
          if (this.B === 0) return "Nothing is added to x here, so there is nothing to subtract. x is multiplied. Try the opposite of multiplying.";
          return "There are only " + this.B + " unit weights next to x. You cannot take away " + n + ". Take away exactly what is added.";
        }
        if (t === "add") return "That would put too many weights on the scale. Use the opposite of what is done to x.";
        if (this.B > 0 && this.A > 1 && this.B % n !== 0)
          return "Undo the + " + this.B + " first. Dividing now would split the " + this.B + " unit weights into pieces.";
        if (this.A % n !== 0) return "There are " + this.A + " x-boxes. You can only split them into " + this.A + " equal groups. Divide by the number of x's.";
        return "Dividing by " + n + " would not give whole weights on the other side. Check the amount.";
      };

      // ── Apply the chosen operation to BOTH sides ──
      GameScene.prototype.applyOp = function () {
        if (this.locked || this.phase !== "solve") return;
        const n = this.opAmt,
          t = this.opType;
        let legal = false;
        if (t === "sub") {
          legal = this.B - n >= 0 && this.C - n >= 0;
          if (legal) {
            this.B -= n;
            this.C -= n;
          }
        } else if (t === "add") {
          legal = this.C + n <= 99;
          if (legal) {
            this.B += n;
            this.C += n;
          }
        } else {
          legal = n >= 2 && this.A % n === 0 && this.B % n === 0 && this.C % n === 0;
          if (legal) {
            this.A /= n;
            this.B /= n;
            this.C /= n;
          }
        }
        if (!legal) {
          this.tiltScale();
          SFX.tilt();
          this.missteps++;
          const why = this.illegalWhy(t, n);
          const help = this.missteps >= 2 ? " " + this.giveHelp() : "";
          this.feedback.setText("⚖️ " + why + help).setColor("#ffb38a");
          srSay(why + help);
          return;
        }
        this.movesLeft--;
        SFX.move();
        JUICE.audio.whoosh();
        this.drawScale();
        this.updateLock();
        this.updateMoves();
        if (t === "add") {
          // Legal (balance kept) but it moves AWAY from x alone.
          this.missteps++;
          const help = this.missteps >= 2 ? " " + this.giveHelp() : "";
          this.feedback
            .setText("Still balanced, but adding put MORE weights next to x. Use the opposite of what is done to x." + help)
            .setColor("#ffb38a");
        } else if (this.isIsolated()) {
          this.feedback.setText("✅ x is alone! Read the scale, then Lock In.").setColor("#8ff0c4");
          srSay("x is alone. x " + (this.rel === "=" ? "equals" : this.rel === ">" ? "is greater than" : "is less than") + " " + this.C + ". Press Lock In.");
        } else {
          this.feedback.setText("Good move. Now: " + this.leftExprStr() + " " + this.rel + " " + this.C).setColor("#bfe0c8");
        }
        this.updateCoach();
      };

      // ── Lock in ──
      GameScene.prototype.lockIn = function () {
        if (this.locked) return;
        if (this.phase === "pick") return this.submitChoice(this.choiceIdx);
        if (this.phase !== "solve") return;
        const p = this.problem;
        this.attempts++;
        if (!this.isIsolated()) {
          // Gentle nudge — NOT a loss.
          SFX.tilt();
          this.missteps++;
          const help = this.giveHelp();
          this.feedback.setText("x is not alone yet. Keep doing the same move to both sides. " + help).setColor("#ffb38a");
          srSay("x is not alone yet. " + help);
          return;
        }
        this.correctSubs++;
        if (this.lockTween) {
          this.lockTween.remove();
          this.lockTween = null;
        }
        if (p.rel !== "=") {
          this.enterPick();
          return;
        }
        this.finishProblem(true);
      };

      // ── Inequality step: pick a value that makes it true ──
      GameScene.prototype.enterPick = function () {
        const p = this.problem;
        this.phase = "pick";
        this.ctl.forEach((o) => o.setVisible(false));
        this.movesText.setVisible(false);
        this.bannerLabel.setText("x " + p.rel + " " + p.s + " · now test a number");
        this.bannerText.setText("Which number makes " + p.banner + " true?");
        this.feedback.setText("x " + p.rel + " " + p.s + " has MANY solutions. Pick one that works.").setColor("#8ff0c4");
        this.keysText.setText("← → choose · Enter = pick · or press 1–" + p.choices.length);
        this.showChoices(p.choices);
        this.updateCoach();
        srSay(
          "x " + p.rel + " " + p.s + ". Which number makes " + p.banner + " true? Choices: " + p.choices.map((c, i) => i + 1 + ", " + c.label).join("; "),
        );
      };
      GameScene.prototype.showChoices = function (options) {
        this.hideChoices();
        const bw = 150,
          gap = 24;
        let x = W / 2 - (options.length * bw + (options.length - 1) * gap) / 2 + bw / 2;
        this.choices = options.map((opt, i) => {
          const rect = this.add.rectangle(x, 430, bw, 56, 0x123a48).setStrokeStyle(3, 0x3fbf8f).setInteractive({ useHandCursor: true });
          const txt = this.add.text(x, 430, "x = " + opt.label, TXT(24, "#ffffff", { fontStyle: "bold" })).setOrigin(0.5);
          const num = this.add.text(x - bw / 2 + 8, 406, String(i + 1), TXT(13, "#bfe0c8"));
          rect.on("pointerdown", () => {
            if (!this.locked) this.submitChoice(i);
          });
          x += bw + gap;
          return { opt, rect, txt, num, used: false };
        });
        const host = document.querySelector(".cabinet-console");
        if (host) {
          const bar = document.createElement("div");
          bar.className = "game-choice-bar";
          bar.setAttribute("role", "group");
          bar.setAttribute("aria-label", "Pick a solution");
          this.choices.forEach((c, i) => {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = "x = " + c.opt.label;
            b.addEventListener("click", () => {
              if (!this.locked) this.submitChoice(i);
            });
            c.dom = b;
            bar.append(b);
          });
          host.insertBefore(bar, host.querySelector(".cabinet-controls"));
          this.domBar = bar;
        }
        this.choiceIdx = 0;
        this.paintChoices();
      };
      GameScene.prototype.hideChoices = function () {
        (this.choices || []).forEach((c) => {
          c.rect.destroy();
          c.txt.destroy();
          c.num.destroy();
        });
        this.choices = [];
        if (this.domBar) this.domBar.remove();
        this.domBar = null;
      };
      GameScene.prototype.paintChoices = function () {
        this.choices.forEach((c, i) => {
          const on = i === this.choiceIdx;
          if (c.dom) {
            c.dom.setAttribute("aria-pressed", String(on && !c.used));
            c.dom.disabled = !!c.used || this.locked;
          }
          if (c.done) return;
          c.rect.setFillStyle(c.used ? 0x3b2f17 : on ? 0x2d874b : 0x123a48);
          c.rect.setStrokeStyle(on ? 5 : 3, on ? 0xffd24a : c.used ? 0x8a6a2a : 0x3fbf8f);
          c.txt.setColor(c.used ? "#c9b48a" : "#ffffff");
        });
      };
      GameScene.prototype.moveChoice = function (d) {
        if (!this.choices.length || this.locked) return;
        let i = this.choiceIdx;
        for (let n = 0; n < this.choices.length; n++) {
          i = (i + d + this.choices.length) % this.choices.length;
          if (!this.choices[i].used) break;
        }
        this.choiceIdx = i;
        this.paintChoices();
        SFX.tap();
        srSay("x = " + this.choices[i].opt.label);
      };
      GameScene.prototype.submitChoice = function (i) {
        if (this.locked || this.phase !== "pick") return;
        const c = this.choices[i];
        if (!c || c.used) return;
        const p = this.problem;
        this.attempts++;
        if (c.opt.correct) {
          this.correctSubs++;
          c.done = true;
          c.rect.setFillStyle(0x36a35b).setStrokeStyle(5, 0xffffff);
          this.finishProblem(true, c.opt.value);
          return;
        }
        SFX.tilt();
        this.pickTries++;
        this.usedHelp = true;
        this.streak = 0;
        c.used = true;
        if (this.pickTries >= 2) {
          const right = this.choices.find((k) => k.opt.correct);
          right.done = true;
          right.rect.setFillStyle(0x36a35b).setStrokeStyle(5, 0xffffff);
          this.feedback.setText(c.opt.why + " A number that works: " + right.opt.label + ".").setColor("#ffb38a");
          srSay(c.opt.why + " A number that works: " + right.opt.label + ".");
          this.finishProblem(false);
          return;
        }
        this.moveChoice(1);
        this.feedback.setText("Not quite. " + c.opt.why + " Try another.").setColor("#ffb38a");
        srSay("Not quite. " + c.opt.why + " Try another.");
      };

      // Number line for x > s or x < s: open circle, arrow toward solutions.
      GameScene.prototype.drawNumberLine = function () {
        const p = this.problem;
        const g = this.numberLine;
        g.clear();
        const y = 372,
          x0 = 180,
          x1 = 640;
        const lo = Math.max(0, p.s - 5),
          hi = lo + 10;
        const X = (v) => x0 + ((v - lo) / (hi - lo)) * (x1 - x0);
        g.lineStyle(3, 0xbfe0c8, 1).lineBetween(x0 - 10, y, x1 + 10, y);
        this.nlLabels.forEach((t) => t.destroy());
        this.nlLabels = [];
        for (let v = lo; v <= hi; v++) {
          g.lineBetween(X(v), y - 7, X(v), y + 7);
          this.nlLabels.push(this.add.text(X(v), y + 12, String(v), TXT(14, "#bfe0c8")).setOrigin(0.5, 0).setDepth(6));
        }
        const end = p.rel === ">" ? x1 + 10 : x0 - 10;
        g.lineStyle(6, 0xffd24a, 1).lineBetween(X(p.s), y, end, y);
        const dir = p.rel === ">" ? 1 : -1;
        g.fillStyle(0xffd24a, 1).fillTriangle(end + dir * 12, y, end, y - 9, end, y + 9);
        g.fillStyle(0x0c281d, 1).fillCircle(X(p.s), y, 8);
        g.lineStyle(3, 0xffd24a, 1).strokeCircle(X(p.s), y, 8);
        this.nlLabels.push(
          this.add.text(W / 2, y - 26, "x " + p.rel + " " + p.s + "  (open circle: " + p.s + " is not a solution)", TXT(15, "#ffe9a8", { fontStyle: "bold" })).setOrigin(0.5).setDepth(6),
        );
      };

      GameScene.prototype.finishProblem = function (correct, picked) {
        const p = this.problem;
        this.locked = true;
        this.phase = "done";
        this.choices.forEach((c) => {
          if (c.dom) c.dom.disabled = true;
        });
        const kind = p.rel !== "=" ? "ineq" : p.minMoves === 2 ? "two" : "one";
        const st = (this.stats[kind] = this.stats[kind] || { seen: 0, clean: 0 });
        st.seen++;
        if (p.rel !== "=") this.drawNumberLine();
        const check = p.check(p.rel === "=" ? p.s : picked != null ? picked : p.rel === ">" ? p.s + 1 : Math.max(0, p.s - 1));
        if (correct) {
          JUICE.audio.correct(this.streak);
          this.solved++;
          const clean = !this.usedHelp && this.missteps === 0;
          let gained;
          if (clean) {
            st.clean++;
            this.firstTry++;
            this.streak++;
            this.bestStreak = Math.max(this.bestStreak, this.streak);
            gained = 20 + Math.min(this.streak, 5) * 5 + Math.max(0, this.movesLeft) * 5;
          } else {
            this.streak = 0;
            gained = 10;
          }
          this.score += gained;
          const cx = this.pivotX + this.panDX;
          if (!this.reduceMotion) {
            this.burst.setPosition(cx, this.pivotY);
            this.burst.explode(16);
          }
          JUICE.floatText(this, W / 2, 200, "+" + gained, "#8ff0c4", 38);
          JUICE.award(gained, "u7-equation-quest");
          if (this.streak >= 2) JUICE.confetti(this, 1);
          const head =
            p.rel === "="
              ? (clean ? "Correct! " : "You got it! ") + "x = " + p.s + ". " + p.solveHint + " Check: "
              : (clean ? "Correct! " : "You got it! ") + "x " + p.rel + " " + p.s + ". Check: ";
          this.feedback.setText(head + check.text).setColor("#8ff0c4");
          srSay(head + check.text);
        }
        this.updateLock();
        this.coachText.setText("");
        this.afterAttempt();
      };

      GameScene.prototype.afterAttempt = function () {
        this.updateHUD();
        if (this.solved >= this.target) {
          this.endGame();
          return;
        }
        this.keysText.setText("Read the check. Press Enter or Continue when you are ready.");
        this.studioNextRound(() => this.newProblem());
      };

      // ── Balance rendering ──
      GameScene.prototype.drawScale = function () {
        this.dyn.forEach((d) => d.destroy());
        this.dyn = [];
        this.placePan(-this.panDX, this.A, this.B);
        this.placePan(this.panDX, 0, this.C);
        this.leftExpr.setText(this.leftExprStr());
        this.rightExpr.setText(String(this.C));
        this.relText.setText(this.rel);
        this.scaleGroup.setRotation(this.baseTilt);
      };

      // One pan's contents, stacked UP from the platform (container-local).
      GameScene.prototype.placePan = function (cx, xCount, unitVal) {
        const add = (obj) => {
          this.scaleGroup.add(obj);
          this.dyn.push(obj);
        };
        const xbox = (x, y) => {
          add(this.add.rectangle(x, y, 26, 26, 0x4f9cff).setStrokeStyle(2, 0x1f5fae));
          add(this.add.text(x, y, "x", { fontFamily: "Impact, sans-serif", fontSize: "18px", color: "#ffffff" }).setOrigin(0.5));
        };
        const ten = (x, y) => {
          add(this.add.rectangle(x, y, 18, 26, 0xffd24a).setStrokeStyle(2, 0xb8881d));
          add(this.add.text(x, y, "10", TXT(10, "#5a3c00", { fontStyle: "bold" })).setOrigin(0.5));
        };
        const one = (x, y) => add(this.add.rectangle(x, y, 13, 13, 0xffe07a).setStrokeStyle(1, 0xb8881d));
        const row = (count, size, gap, perRow, bottomY, fn) => {
          const rows = Math.ceil(count / perRow);
          for (let i = 0; i < count; i++) {
            const r = Math.floor(i / perRow);
            const inRow = Math.min(perRow, count - r * perRow);
            const totalW = inRow * size + (inRow - 1) * gap;
            const startX = cx - totalW / 2 + size / 2;
            fn(startX + (i % perRow) * (size + gap), bottomY - size / 2 - (rows - 1 - r) * (size + 2));
          }
          return bottomY - rows * (size + 2);
        };
        let floor = 106; // platform top
        const ones = unitVal % 10,
          tens = Math.floor(unitVal / 10);
        if (ones) floor = row(ones, 13, 4, 9, floor, one);
        if (tens) floor = row(tens, 18, 5, 6, floor, ten);
        if (xCount) row(xCount, 26, 6, 4, floor, xbox);
      };

      GameScene.prototype.tiltScale = function () {
        if (this.reduceMotion) {
          this.scaleGroup.setRotation(this.baseTilt);
          this.flashAmber(0.18);
          return;
        }
        this.tweens.add({
          targets: this.scaleGroup,
          rotation: this.baseTilt + 0.06,
          duration: 140,
          yoyo: true,
          ease: "Sine.InOut",
          onComplete: () => this.scaleGroup.setRotation(this.baseTilt),
        });
      };
      GameScene.prototype.flashAmber = function (a) {
        if (this.reduceMotion && a == null) return;
        this.amberTint.setAlpha(a == null ? 0.18 : a);
        this.tweens.add({ targets: this.amberTint, alpha: 0, duration: 350 });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText("Level " + this.level);
        this.progressText.setText(
          this.endless
            ? "Challenge " + (this.solved + 1) + " · " + this.solved + " solved"
            : "Challenge " + Math.min(this.solved + 1, this.target) + " of " + this.target,
        );
      };

      GameScene.prototype.endGame = function () {
        this.locked = true;
        this.time.delayedCall(600, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            level: this.level,
            auto: this.auto,
            endless: this.endless,
            firstTry: this.firstTry,
            bestStreak: this.bestStreak,
            stats: this.stats,
            attempts: this.attempts,
            correctSubs: this.correctSubs,
            accuracy: this.attempts ? this.correctSubs / this.attempts : 1,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0c281d);

          });
        }
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10) || 0;

        if (newBest) hs = d.score;

        this.add
          .text(cx, 70, "BALANCE MASTER!", {

        this.add.text(cx, 182, "Score: " + d.score + (newBest ? "  · New high score!" : ""), TXT(28, "#ffffff", { fontStyle: "bold" })).setOrigin(0.5);

        const stats = d.stats || {};

        };
        let weak = null;

          "Accuracy: " + acc + "% of your Lock Ins were right · Best streak ever: " + bestStreak,
          "Skills practiced: " + (kinds.length ? kinds.map((k) => names[k]).join(", ") : "solving equations"),
          weak

        this.summary = this.add

          .setOrigin(0.5);

        srSay("Round complete. Score " + d.score + ", " + stars + " stars. " + lines.join(" "));

        const btn = this.add.rectangle(cx, 430, 240, 54, 0x2d874b).setInteractive({ useHandCursor: true });

        this.add.text(cx, 556, "Enter = Play again · Every round has new numbers.", TXT(15, "#a9d4b4")).setOrigin(0.5);
      };

      // ── Launch ──
      const eqGame = new Phaser.Game(config);
      // Native math controls now have a readable, touch-accessible console.
      window.PhaserStudio.mount({

      eqGame.events.once("ready", function () {
        try {
          const cv = eqGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Equation Quest Balance Scale math game. An equation appears at the " +
              "top. Use the up and down arrows to pick an operation, the left " +
              "and right arrows to set the amount, and press Space to apply it " +
              "to both sides of the scale. Keep the scale balanced until x is " +
              "alone, then press Enter to lock in its value.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
