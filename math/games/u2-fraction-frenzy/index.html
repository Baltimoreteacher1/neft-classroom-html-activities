    <script>
      // Decorative mote-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("fr-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 34;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "fr-mote";
            var sz = rnd(2, 5);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" + (dx * 20).toFixed(2) + "px," + (dy * 12).toFixed(2) + "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener) reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── FRACTION FRENZY — PARTITION & SHADE ──
      // Phaser 3 — Grade 6 Math — Fractions & dividing by unit fractions (6.NOS.1)
      // Mechanic (math-as-mechanic, no reflex/timer): the bar IS one whole.
      // You first CUT the bar into N equal parts with the −/+ steppers (or ← →),
      // then SHADE parts by tapping them (or ↑ ↓) to BUILD the target fraction.
      // Higher levels switch to a measurement model — wholes split into unit
      // fractions, "how many 1/4 fit in 2?" and full fraction ÷ fraction,
      // "how many 2/3 are in 2?" — so the same cut-and-shade action teaches
      // modeling, equivalence, and dividing fractions (6.NOS.1).
      // Lock In checks BOTH the cut count and the shaded count. The FIRST
      // wrong build gets a diagnostic hint about the method (never the answer)
      // and the SAME problem stays up to retry; a second wrong build snaps the
      // bar to the correct model to teach, and play continues — no lives, no
      // fail state (calm, self-paced classroom mode).

      const W = 820,
        H = 600;
      const LS_KEY = "ff_partition_shade_highscore";
      // Shade-bar geometry in game space. Phaser Scale.FIT maps pointer
      // coordinates into this space, so taps land on the right cell at any size.
      const BAR_X0 = 110,
        BAR_X1 = 710,
        BAR_Y = 372,
        BAR_H = 86;
      const BAR_W = BAR_X1 - BAR_X0;

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        cut() {
          this.play("square", 880, 0.05, 0.07);
        },
        coin() {
          this.play("square", 1040, 0.05, 0.08);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
      };

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: { unlock() {} },
        theme: () => ({}),
        bgGradient() {},
        popIn() {},
        tilePop() {},
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function srSay(msg) {
        const el = document.getElementById("fr-sr");
        if (el) el.textContent = msg;
      }

      // ── Fraction ÷ fraction (the heart of 6.NOS.1): a/b ÷ c/b = a ÷ c. ──
      // "How many c/b are in D?" where D = a/b (shown as a whole number when
      // a is a multiple of b). The student cuts each whole into b parts and
      // shades a pieces (the dividend); the WHY shows the shaded pieces
      // grouping into q groups of c. c divides a, so the quotient q = a/c is
      // ALWAYS a whole number, at both tiers.
      //   tier 1 (support)    : b = 3–4, quotients 2–3, small dividends.
      //   tier 2 (enrichment) : b = 3–6, quotients up to 4, bigger dividends.
      // Bar-capacity guarantee: total pieces = ceil(a/b)·b never exceeds 12,
      // so the required cut count is always reachable (see maxParts()).
      function fracDivProblem(tier) {
        const b = tier === 1 ? randInt(3, 4) : randInt(3, 6);
        const c = randInt(2, b - 1);
        // Most 1/b pieces the bar can show: floor(12/b) wholes of b pieces.
        const pieceCap = Math.floor(12 / b) * b;
        const qMax = Math.min(tier === 1 ? 3 : 4, Math.floor(pieceCap / c));
        const q = randInt(2, Math.max(2, qMax)); // whole-number quotient
        const a = q * c; // dividend numerator (c | a by construction)
        const wholes = Math.ceil(a / b);
        const divStr = a % b === 0 ? String(a / b) : a + "/" + b;
        const shadeStr =
          a % b === 0
            ? a / b === 1
              ? "1 whole"
              : a / b + " wholes"
            : "enough pieces to show " + divStr;
        return {
          kind: "fracdiv",
          label: "Divide a fraction by a fraction",
          wholes,
          targetParts: b,
          targetShaded: a,
          prompt:
            "How many " +
            c +
            "/" +
            b +
            " are in " +
            divStr +
            "? Cut each whole into " +
            b +
            " equal parts, shade " +
            shadeStr +
            ", then see how many groups of " +
            c +
            " fit.",
          why:
            divStr +
            " is " +
            a +
            " pieces of 1/" +
            b +
            ", and " +
            a +
            " pieces make " +
            q +
            " groups of " +
            c +
            "/" +
            b +
            " — so " +
            divStr +
            " ÷ " +
            c +
            "/" +
            b +
            " = " +
            q +
            ".",
        };
      }

      // ── Problem generator (partition & shade) ───────────────────────────
      // Every problem reduces to one tactile action: cut the bar into the right
      // number of equal parts and shade the right number of them. Returns
      //   { kind, label, prompt, why, wholes, targetParts, targetShaded }
      // Two chosen TIERS drive the math, and the in-run stage (1-8) ramps within:
      //   tier 1 (support)    : modeling first, friendly denominators 2–4;
      //                         fraction ÷ fraction joins at stage 3+.
      //   tier 2 (enrichment) : larger denominators + equivalent + dividing by
      //                         a unit fraction + fraction ÷ fraction.
      function fracProblem(stage, tier) {
        // ── Tier 1 (support): model proper fractions, denominators 2–4;
        //    later stages mix in gentle fraction ÷ fraction problems. ──
        if (tier === 1) {
          if (stage >= 3 && Math.random() < 0.35) return fracDivProblem(1);
          const d = randInt(2, stage <= 2 ? 3 : 4);
          const n = randInt(1, d - 1);
          return {
            kind: "model",
            label: "Model the fraction",
            wholes: 1,
            targetParts: d,
            targetShaded: n,
            prompt:
              "Model " +
              n +
              "/" +
              d +
              ": cut the bar into " +
              d +
              " equal parts, then shade " +
              n +
              ".",
            why: n + "/" + d + " means " + n + " of " + d + " equal parts.",
          };
        }

        // ── Tier 2 (enrichment): model + equivalent + divide by a unit
        //    fraction + fraction ÷ fraction. ──
        let kind;
        if (stage <= 1) kind = Math.random() < 0.6 ? "model" : "equiv";
        else if (stage <= 3) {
          const r = Math.random();
          kind = r < 0.3 ? "model" : r < 0.55 ? "equiv" : r < 0.8 ? "divide" : "fracdiv";
        } else {
          const r = Math.random();
          kind = r < 0.2 ? "model" : r < 0.4 ? "equiv" : r < 0.65 ? "divide" : "fracdiv";
        }
        if (kind === "fracdiv") return fracDivProblem(tier);

        if (kind === "equiv") {
          const bases = [
            [1, 2],
            [1, 3],
            [2, 3],
            [1, 4],
            [3, 4],
            [1, 5],
            [2, 5],
          ];
          const pick = bases[randInt(0, bases.length - 1)];
          const n = pick[0],
            d = pick[1];
          const maxM = Math.max(2, Math.floor(8 / d));
          const m = randInt(2, maxM);
          const d2 = d * m,
            n2 = n * m;
          return {
            kind,
            label: "Equivalent fraction",
            wholes: 1,
            targetParts: d2,
            targetShaded: n2,
            prompt: "Show a fraction equal to " + n + "/" + d + " using " + d2 + " equal parts.",
            why: n + "/" + d + " = " + n2 + "/" + d2 + ".",
          };
        }

        if (kind === "divide") {
          const wholes = randInt(1, 3);
          let d = randInt(2, 4);
          while (wholes * d > 12) d--;
          if (d < 2) d = 2;
          const ans = wholes * d;
          return {
            kind,
            label: "Divide by a unit fraction",
            wholes,
            targetParts: d,
            targetShaded: ans,
            prompt:
              "How many 1/" +
              d +
              " are in " +
              wholes +
              "? Cut each whole into " +
              d +
              ", then shade them all to count.",
            why:
              wholes +
              " ÷ 1/" +
              d +
              " = " +
              ans +
              " — that many 1/" +
              d +
              " pieces fit in " +
              wholes +
              ".",
          };
        }

        // model (enrichment: bigger denominators)
        const dmax = stage <= 2 ? 6 : 8;
        const d = randInt(3, dmax);
        const n = randInt(1, d - 1);
        return {
          kind: "model",
          label: "Model the fraction",
          wholes: 1,
          targetParts: d,
          targetShaded: n,
          prompt:
            "Model " +
            n +
            "/" +
            d +
            ": cut the bar into " +
            d +
            " equal parts, then shade " +
            n +
            ".",
          why: n + "/" + d + " means " + n + " of " + d + " equal parts.",
        };
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#2a1326",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, VocabScene, LevelScene, GameScene, ResultScene],
      };

      // Chosen tier (repo rule: Level 1 = support, Level 2 = enrichment; never
      // the word "ESOL"). Set on the Level Select screen; drives the generator,
      // the scaffolding hints, and the HUD badge. Defaults to support.
      let ffTier = 1;
      let ffAuto = false; // true when the ✨ Auto button picked the level (NTAdaptive)
      let ffEndless = false; // true for endless (no auto-end) runs

      // ── Vocab gate state (repo rule: term + Level-1 definition + image/emoji
      // shown BEFORE the first round). Shown by default; skippable only on a
      // replay within the same page session. ──
      let ffVocabSeen = false;

      // Key words for THIS game's topic (fractions, equal parts, unit
      // fractions). Each has a student-facing (Level 1) definition and an emoji
      // so a visual always shows even with no network/images.
      const FF_VOCAB = [
        {
          term: "Fraction",
          emoji: "🍕",
          def: "A number for part of a whole. 3/4 means 3 out of 4 equal parts.",
        },
        {
          term: "Numerator",
          emoji: "⬆️",
          def: "The TOP number of a fraction. It tells how many parts you have.",
        },
        {
          term: "Denominator",
          emoji: "⬇️",
          def: "The BOTTOM number. It tells how many equal parts the whole is cut into.",
        },
        {
          term: "Equal parts",
          emoji: "✂️",
          def: "The same-size pieces a whole is cut into. 4 equal parts means each piece is the same size.",
        },
        {
          term: "Unit fraction",
          emoji: "1️⃣",
          def: "A fraction with 1 on top, like 1/4. It is ONE equal part of the whole.",
        },
        {
          term: "Quotient",
          emoji: "➗",
          def: "The answer to a division problem. 2 ÷ 2/3 = 3 because three 2/3 pieces fit inside 2.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0xffd0e0);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x2a1326);
        this.add
          .text(cx, 118, "FRACTION FRENZY", {
            fontFamily: "Impact, sans-serif",
            fontSize: "62px",
            color: "#ff7ba8",
            stroke: "#1c0c19",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 173, "Partition & Shade", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            color: "#f0aec8",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            230,
            "CUT the bar into equal parts, then SHADE it to BUILD the\nfraction. Tap parts to shade, use −/+ to change the cuts, Lock In!",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#e7c4d4",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 295, "Tap or ← → cut · ↑ ↓ shade · 6.NOS.1 · Lessons 2.1–2.5", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#c890a8",
          })
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 330, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#ffd24a",
              fontStyle: "bold",
            })

      // Max cuts per whole so the total piece count stays readable/tappable.
      GameScene.prototype.maxParts = function () {
        return this.wholes === 1 ? 12 : Math.floor(12 / this.wholes);
      };

      GameScene.prototype.setParts = function (p) {
        if (this.locked) return;
        const np = Phaser.Math.Clamp(p, 1, this.maxParts());
        if (np === this.parts) return;
        this.parts = np;
        const total = this.wholes * this.parts;
        if (this.shaded > total) this.shaded = total;
        SFX.cut();
        this.drawBar();
        this.announceModel();
      };

      GameScene.prototype.setShaded = function (s) {
        if (this.locked) return;
        const total = this.wholes * this.parts;
        const ns = Phaser.Math.Clamp(s, 0, total);
        if (ns === this.shaded) return;
        this.shaded = ns;
        SFX.coin();
        this.refreshFills();
        const last = this.cellRects[this.shaded - 1];
        if (last) JUICE.tilePop(this, last);
        this.announceModel();
      };

      GameScene.prototype.tapCell = function (i) {
        if (this.locked) return;
        // Tapping the last shaded cell un-shades it; otherwise shade up to it.
        const target = this.shaded === i + 1 ? i : i + 1;
        this.setShaded(target);
      };

      // Rebuild the whole bar (call when the cut count or whole count changes).
      GameScene.prototype.drawBar = function () {
        this.cellRects.forEach((r) => r.destroy());
        this.dividers.forEach((r) => r.destroy());
        this.cellRects = [];
        this.dividers = [];
        const total = this.wholes * this.parts;
        const cw = BAR_W / total;
        for (let i = 0; i < total; i++) {
          const x = BAR_X0 + i * cw;
          const on = i < this.shaded;
          const rect = this.add
            .rectangle(x, BAR_Y, cw, BAR_H, on ? 0x2d874b : 0x3a1834)
            .setOrigin(0, 0.5)
            .setStrokeStyle(1, 0x6b3050)
            .setInteractive({ useHandCursor: true })
            .setDepth(2);
          rect._idx = i;
          rect.on("pointerdown", () => this.tapCell(i));
          this.cellRects.push(rect);
        }
        // Thick gold dividers between wholes (only when more than one whole).
        for (let w = 1; w < this.wholes; w++) {
          const x = BAR_X0 + (BAR_W / this.wholes) * w;
          this.dividers.push(
            this.add
              .rectangle(x, BAR_Y, 5, BAR_H + 16, 0xffd24a)
              .setOrigin(0.5)
              .setDepth(6),
          );
        }
        // Outer frame.
        this.dividers.push(
          this.add
            .rectangle(BAR_X0, BAR_Y, BAR_W, BAR_H)
            .setOrigin(0, 0.5)
            .setStrokeStyle(3, 0xb83a6e)
            .setDepth(7),
        );
        this.updateReadout();
      };

      // Cheap path: only the shade state changed, so recolor cells in place.
      GameScene.prototype.refreshFills = function () {
        this.cellRects.forEach((r, i) => r.setFillStyle(i < this.shaded ? 0x2d874b : 0x3a1834));
        this.updateReadout();
      };

      GameScene.prototype.updateReadout = function () {
        const total = this.wholes * this.parts;
        if (this.wholes === 1) {
          this.fracReadout.setText(this.shaded + " / " + this.parts);
          this.shadeReadout.setText(this.shaded + " of " + total + " parts shaded");
          this.partsLabel.setText("Cut into " + this.parts);
        } else {
          this.fracReadout.setText(this.shaded + " pieces");
          this.shadeReadout.setText(
            this.shaded + " of " + total + " pieces shaded  (1/" + this.parts + " each)",
          );
          this.partsLabel.setText("Cut each into " + this.parts);
        }
      };

      // Debounced screen-reader announce of the current built model. Fires only
      // when the spoken text actually changes (so repeat keys/steps don't spam),
      // and a short timer coalesces rapid cut/shade changes into one utterance.
      GameScene.prototype.announceModel = function () {
        const total = this.wholes * this.parts;
        const unit = this.wholes === 1 ? "parts" : "pieces";
        const msg = this.shaded + " of " + total + " " + unit + " shaded.";
        if (msg === this._lastModelSay) return;
        this._lastModelSay = msg;
        clearTimeout(this._modelSayTimer);
        this._modelSayTimer = setTimeout(function () {
          srSay(msg);
        }, 280);
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.tries = 0;
        this.problem = fracProblem(this.level, this.tier);
        this.wholes = this.problem.wholes;
        this.parts = 2;
        this.shaded = 0;
        this._lastModelSay = null;
        this.bannerLabel.setText(this.problem.label);
        this.bannerText.setText(this.problem.prompt);
        // Level 1 (support) gets an extra plain-language coaching line; Level 2
        // (enrichment) runs without it.
        if (this.tier === 1) {
          this.tipText.setText(
            this.problem.kind === "fracdiv"
              ? "Tip: shade the starting amount first, then count equal groups the size of the divisor's TOP number."
              : "Tip: the BOTTOM number tells how many parts to cut, the TOP tells how many to shade.",
          );
        } else {
          this.tipText.setText("");
        }
        this.tipText.setVisible(true);
        this.drawBar();
        JUICE.popIn(this, this.fracReadout);
        srSay(
          this.problem.label +
            ": " +
            this.problem.prompt +
            " Cut the bar and shade it, then lock it in.",
        );
      };

      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        this.locked = true;
        const p = this.problem;
        this.tries++;
        const correct = this.parts === p.targetParts && this.shaded === p.targetShaded;
        // Progress accounting: each problem counts as attempted exactly once
        // (on its first Lock In); it counts as correct only when that first
        // Lock In is right. Retries still earn points but not "first try".
        if (this.tries === 1) {
          this.attempted++;
          if (correct) this.firstTryCorrect++;
        }
        // The feedback line and the Level-1 tip share the same screen band;
        // hide the tip while feedback is up so the two never overlap.
        this.tipText.setVisible(false);
        if (correct) {
          SFX.good();
          this.solved++;
          this.streak++;
          const bonus = Math.min(this.streak, 5) * 5;
          const gained = 20 + bonus;
          this.score += gained;
          this.flash(W / 2, 170, "Correct! ✓", "#8fd6a0");
          this.feedback.setText("Correct! " + p.why).setAlpha(1);
          this.burst.setPosition(W / 2, BAR_Y);
          this.burst.explode(16);
          JUICE.burst(this, W / 2, BAR_Y, [0x2d874b, 0xffd24a, 0xff7ba8], 18);
          JUICE.floatText(this, W / 2, 150, "+" + gained, "#8fd6a0", 36);
          JUICE.award(gained, "u2-fraction-frenzy");
          if (this.streak >= 2) JUICE.confetti(this, 1);
          srSay("Correct. " + p.why);
          this.afterAttempt(true);
        } else if (this.tries === 1) {
          // First miss: a diagnostic hint about the METHOD (never the answer),
          // then the SAME problem stays up so the student can fix their build.
          SFX.bad();
          this.streak = 0;
          this.updateHUD();
          this.flashWrong();
          JUICE.shake(this, 0.008);
          const hint = this.diagnosticHint(p);
          this.feedback.setText("Not quite — " + hint).setAlpha(1);
          srSay("Not quite. " + hint);
          this.time.delayedCall(400, () => {
            this.locked = false;
          });
        } else {
          SFX.bad();
          this.streak = 0;
          this.flashWrong();
          JUICE.shake(this, 0.008);
          this.feedback.setText("Not quite — " + p.why).setAlpha(1);
          srSay("Not quite. " + p.why);
          // Teach: snap the bar to the correct cut + shading, pulse it, go on.
          this.parts = p.targetParts;
          this.shaded = p.targetShaded;
          this.drawBar();
          if (!this.reduceMotion) {
            this.tweens.add({
              targets: this.cellRects,
              scaleY: 1.12,
              yoyo: true,
              duration: 220,
            });
          }
          this.time.delayedCall(700, () => this.afterAttempt(false));
        }
      };

      // First-miss coaching: name WHICH part of the build to re-check (the cut
      // count or the shade count) and the method for finding it — restating
      // only what the prompt itself already says, never the target numbers
      // that the student still has to reason out.
      GameScene.prototype.diagnosticHint = function (p) {
        const cutWord = p.wholes > 1 ? "each whole" : "the bar";
        if (this.parts !== p.targetParts) {
          if (p.kind === "model")
            return (
              "check your cuts. The BOTTOM number (denominator) tells how many equal parts to cut " +
              cutWord +
              " into. Fix the cuts, then Lock In again."
            );
          if (p.kind === "equiv")
            return "check your cuts. The problem tells you exactly how many equal parts to use. Fix the cuts, then Lock In again.";
          return (
            "check your cuts. Cut " +
            cutWord +
            " into the number of parts named by the fraction's BOTTOM number. Fix the cuts, then Lock In again."
          );
        }
        if (p.kind === "model")
          return "your cuts are right! Now check the TOP number (numerator) — that is how many parts to shade. Try again.";
        if (p.kind === "equiv")
          return "your cuts are right! Now shade just enough of the smaller parts to cover the SAME amount as the original fraction. Try again.";
        if (p.kind === "divide")
          return "your cuts are right! Shade ALL the pieces — you are counting how many unit fractions fit in the whole amount. Try again.";
        return "your cuts are right! Shade the starting amount (the number being divided up) — then the groups get counted for you. Try again.";
      };

      GameScene.prototype.afterAttempt = function (correct) {
        // Difficulty stage rises every 3 correct (separate from the chosen tier).
        const newStage = Math.min(8, 1 + Math.floor(this.solved / 3));
        if (newStage > this.level) {
          this.level = newStage;
          SFX.level();
          this.flash(W / 2, 200, "STAGE " + this.level + "!", "#ffd24a");
        }
        this.updateHUD();
        if (this.solved >= this.target) {
          this.endGame();
          return;
        }
        this.time.delayedCall(900, () => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.flash = function (x, y, text, color) {
        const ft = this.add
          .text(x, y, text, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            fontStyle: "bold",
            color: color,
            stroke: "#1c0c19",
            strokeThickness: 4,
          })
          .setOrigin(0.5)
          .setDepth(40);
        this.tweens.add({
          targets: ft,
          y: y - 50,
          alpha: { from: 1, to: 0 },
          duration: this.reduceMotion ? 500 : 900,
          onComplete: () => ft.destroy(),
        });
      };

      // Calm "not yet" cue: a soft amber wash instead of a red failure flash.
      GameScene.prototype.flashWrong = function () {
        if (this.reduceMotion) return;
        this.wrongTint.setAlpha(0.22);
        this.tweens.add({
          targets: this.wrongTint,
          alpha: 0,
          duration: 350,
        });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.streakText.setText("Streak: " + this.streak);
        this.stageText.setText("Stage " + this.level);
        this.progressText.setText(this.solved + " / " + (this.endless ? "∞" : this.target));
      };

      GameScene.prototype.endGame = function () {
        this.locked = true;
        this.time.delayedCall(500, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            attempted: this.attempted,
            firstTry: this.firstTryCorrect,
            tier: this.tier,
            auto: this.auto,
            endless: this.endless,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x2a1326);
        // Stars from first-try accuracy (attempted counts each problem once).
        const attempted = d.attempted > 0 ? d.attempted : d.target;
        const firstTry = typeof d.firstTry === "number" ? d.firstTry : d.solved;
        const acc = firstTry / attempted;
        const stars = acc >= 0.85 ? 3 : acc >= 0.6 ? 2 : 1;
        // Endless runs have no finite target; grade the adaptive win-signal
        // against the standard goal of 10 so it stays meaningful.
        const endless = !!d.endless;
        const goal = endless ? 10 : d.target;
        // Adaptive: only record a run when the level was auto-picked.
        if (d.auto && window.NTAdaptive) {
          window.NTAdaptive.recordRun("u2-fraction-frenzy", {
            won: d.solved >= goal,
            accuracy: acc,
            min: 1,
            max: 2,
          });
        }
        // High score
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        if (d.score > hs) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }

        this.add
          .text(cx, 110, "FRACTION MASTER!", {
            fontFamily: "Impact, sans-serif",
            fontSize: "48px",
            color: "#8fd6a0",
            stroke: "#1c0c19",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        const starStr = "★".repeat(stars) + "☆".repeat(3 - stars);
        this.add
          .text(cx, 185, starStr, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "48px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);

        this.add
          .text(cx, 255, "Score: " + d.score, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "30px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            295,
            endless
              ? "Built " + d.solved + " fractions"
              : "Built " + d.solved + " of " + d.target + " fractions",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "18px",
              color: "#e7c4d4",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 322, "Right on the first try: " + firstTry + " of " + attempted, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#8fd6a0",
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 349, "High Score: " + hs, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);

        SFX.win();

        // EduPulse reporting (guarded; safe no-op without bridge).
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.score,
              stars: stars,
              standard: "6.NOS.1",
              problemsCorrect: firstTry,
              problemsAttempted: attempted,
            });
        } catch (e) {}
        srSay("You won! Final score " + d.score + ", " + stars + " stars.");

        const btn = this.add
          .rectangle(cx, 400, 220, 54, 0xb83a6e)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "PLAY AGAIN 🔁", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const again = () => this.scene.start("Level");
        btn.on("pointerover", () => btn.setFillStyle(0xd24a82));
        btn.on("pointerout", () => btn.setFillStyle(0xb83a6e));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        // ♾️ Keep Playing: restart the Game at the same level in endless mode
        // (carries the auto flag so adaptive still records the endless run).
        const keepBtn = this.add
          .rectangle(cx, 466, 240, 48, 0x2563a8)
          .setStrokeStyle(2, 0x7dd3fc)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx, 466, "♾️ Keep Playing", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const keepPlaying = () => {
          ffTier = d.tier;
          ffEndless = true;
          ffAuto = d.auto;
          this.scene.start("Game");
        };
        keepBtn.on("pointerover", () => keepBtn.setFillStyle(0x2f74c2));
        keepBtn.on("pointerout", () => keepBtn.setFillStyle(0x2563a8));
        keepBtn.on("pointerdown", keepPlaying);
      };

      // ── Launch ──
      const ffGame = new Phaser.Game(config);

      // Canvas accessibility (additive; no gameplay change).
      ffGame.events.once("ready", function () {
        try {
          const cv = ffGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Fraction Frenzy Partition and Shade math game. A fraction problem " +
              "appears at the top; cut the bar into equal parts using the minus " +
              "and plus buttons or the left and right arrow keys, shade parts by " +
              "tapping them or using the up and down arrow keys, then press Lock " +
              "In, Enter, or Space.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>

    <script src="/assets/edupulse-bridge.js"></script>

    <script src="/assets/game-fx.js" defer></script>

    <script src="/assets/lesson-passport.js" defer></script>

    <script src="/assets/game-adaptive.js" defer></script>

    <script src="/assets/math-workbench-launcher.js" defer></script>

      window.addEventListener("DOMContentLoaded", function () {

          window.NeftHintLadder.watch({

      <div class="ewl-coach-card" id="ewl-coach-card" style="display: flex;">

        </div>

  <script>
    (function() {
      window.ewlShowMasteryModal = function(opts) {
        opts = opts || {};
        const score = opts.score || 0;
        const maxScore = opts.maxScore || 1000;
        const stars = opts.stars || (score >= maxScore * 0.8 ? 3 : score >= maxScore * 0.5 ? 2 : 1);
        const accuracy = opts.accuracy != null ? opts.accuracy : Math.min(100, Math.round((score / Math.max(1, maxScore)) * 100));
        const gameTitle = opts.title || "Unit Game Complete!";
        const nextUrl = opts.nextUrl || "/math/games/";

        const starStr = "⭐".repeat(stars) + "☆".repeat(3 - stars);
        
        const modalHtml = `
          <div class="ewl-mastery-overlay" id="ewl-mastery-modal">
            <div class="ewl-mastery-card">
              <div class="ewl-mastery-stars">${starStr}</div>
              <h2 class="ewl-mastery-title">${gameTitle}</h2>
              <p class="ewl-mastery-subtitle">Grade 6 Math Review Mastery Achieved!</p>
              <div class="ewl-mastery-stats">
                <div class="ewl-stat-box">
                  <div class="ewl-stat-num">${score}</div>
                  <div class="ewl-stat-lbl">Final Score</div>
                </div>
                <div class="ewl-stat-box">
                  <div class="ewl-stat-num">${accuracy}%</div>
                  <div class="ewl-stat-lbl">Accuracy</div>
                </div>
              </div>
              <div class="ewl-mastery-actions">
                <button class="ewl-mastery-btn ewl-btn-secondary" onclick="location.reload()">🔄 Play Again</button>
                <button class="ewl-mastery-btn ewl-btn-primary" onclick="location.href='${nextUrl}'">🎮 More Games</button>
              </div>
            </div>
          </div>
        `;
        const existing = document.getElementById("ewl-mastery-modal");

        if (window.GameFX && window.GameFX.AudioSynth) {
          try { window.GameFX.AudioSynth.playSuccess(); } catch(e){}
        }
        if (window.GameFX && window.GameFX.burst) {
          try { window.GameFX.burst(window.innerWidth / 2, window.innerHeight / 3); } catch(e){}
        }
      };
    })();
  </script>
