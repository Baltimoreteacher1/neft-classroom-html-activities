    <!-- Decorative animated spark-field (behind the Phaser canvas). -->
    <div id="pp-bg" data-parallax aria-hidden="true">
      <div id="pp-bg-layer" data-parallax-layer></div>

    <script>
      // Decorative spark-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("pp-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 34;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "pp-spark";
            var sz = rnd(2, 5);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" + (dx * 20).toFixed(2) + "px," + (dy * 12).toFixed(2) + "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener) reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── PERCENT POWER — BAR MODEL BUILDER ──
      // Phaser 3 — Grade 6 Math — Percent of a number, sale price, %↔decimal
      // Mechanic (math-as-mechanic, no reflex/timer): the bar IS the whole.
      // Drag the handle (or nudge ±5% with ← → / A D) to SHADE a percent, then
      // press Lock In. The percent dial shows the student's OWN shading; the
      // "part it equals" readout stays HIDDEN so the student must COMPUTE — not
      // hunt for a number to appear. Help is EARNED: after several moves or a
      // wrong lock-in, a benchmark hint appears (Tier 1), then the live part
      // readout switches on (Tier 2). A clean first-try solve scores full
      // points; a helped solve still counts but scores less and resets the
      // independent-solve streak. No-fail: after 3 tries the answer is taught
      // and play continues.
      // Difficulty rises by level: more framings (find the part → decimal →
      // find the percent → sale price).

      const W = 820,
        H = 600;
      const LS_KEY = "pp_bar_builder_highscore";
      // Percent-bar geometry in game space. Phaser Scale.FIT maps pointer
      // coordinates into this space, so drag math works at any screen size.
      const BAR_X0 = 130,
        BAR_X1 = 690,
        BAR_Y = 360,
        BAR_H = 72;
      const BAR_W = BAR_X1 - BAR_X0;
      function pctToX(p) {
        return BAR_X0 + (BAR_W * p) / 100;
      }
      function xToPct(x) {
        // Snap to 5% increments; targets are always 5% multiples → exact match.
        return Phaser.Math.Clamp(Math.round(((x - BAR_X0) / BAR_W) * 20) * 5, 0, 100);
      }

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx || window.NT_MUTED) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        miss() {
          this.play("triangle", 240, 0.16, 0.12);
        },
        coin() {
          this.play("square", 1040, 0.05, 0.08);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function shuffle(a) {
        const r = [...a];
        for (let i = r.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [r[i], r[j]] = [r[j], r[i]];
        }
        return r;
      }
      function srSay(msg) {
        const el = document.getElementById("pp-sr");
        if (el) el.textContent = msg;
      }

      // ── Problem generator (bar model) ───────────────────────────────────
      // Every problem starts with one tactile action: shade the bar (the whole
      // = 100%) to a target percent (a multiple of 5). Framings ramp by level:
      //   level 1-2 : find the part   ("What is 75% of 20?" → shade, then pick 15)
      //   level 3   : + decimal → percent ("Shade the bar to show 0.25")
      //   level 4-5 : + find the percent ("15 is what percent of 20?")
      //   level 6+  : + sale price     ("$20, 25% off — shade what you PAY")
      // "Find the part" and "Sale price" have a STEP 2: the student picks the
      // value the shading is worth from choices built from real misconceptions.
      // Nothing on screen computes the answer for them — the percent dial only
      // echoes their own shading, and value labels on the bar are Tier-2 help.
      const PCTS = [10, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90];
      function pickWholeFor(pct) {
        // A whole that makes the part a whole number, kept student-friendly.
        const bases = [10, 20, 40, 50, 60, 80, 100, 200];
        const ok = bases.filter((b) => Number.isInteger((pct / 100) * b));
        return ok[randInt(0, ok.length - 1)];
      }
      // Correct value + misconception distractors (each carries the reason a
      // student would pick it, so a wrong pick gets a specific explanation).
      function buildChoices(correct, distractors, money) {
        const seen = new Set([correct]);
        const opts = [{ value: correct, correct: true, why: "" }];
        distractors.forEach((d) => {
          if (opts.length >= 4 || !(d.value > 0) || seen.has(d.value)) return;
          seen.add(d.value);
          opts.push({ value: d.value, correct: false, why: d.why });
        });
        return shuffle(opts).map((o) => ({ ...o, label: (money ? "$" : "") + o.value }));
      }
      function barProblem(level) {
        const pct = PCTS[randInt(0, PCTS.length - 1)];
        const whole = pickWholeFor(pct);
        const part = (pct / 100) * whole;
        const tenth = whole / 10;
        const dec = String(pct / 100);
        let kind;
        if (level <= 2) kind = "part";
        else if (level === 3) kind = Math.random() < 0.6 ? "part" : "decimal";
        else if (level <= 5) {
          const r = Math.random();
          kind = r < 0.4 ? "part" : r < 0.7 ? "decimal" : "percent";
        } else {
          const r = Math.random();
          kind = r < 0.3 ? "part" : r < 0.5 ? "decimal" : r < 0.75 ? "percent" : "sale";
        }
        const recount = (v, unit) => ({
          value: v,
          why: "Close, but recount the 10% blocks. Each block is " + unit + ".",
        });
        if (kind === "decimal")
          return {
            kind,
            targetPct: pct,
            whole,
            tenth,
            dec,
            label: "Decimal → percent",
            prompt: "Shade the bar to show " + dec + ".",
            why: dec + " = " + pct + " hundredths = " + pct + "%.",
          };
        if (kind === "percent")
          return {
            kind,
            targetPct: pct,
            whole,
            part,
            tenth,
            label: "Find the percent",
            prompt: part + " is what percent of " + whole + "? Shade it.",
            why:
              "Each 10% of " + whole + " is " + tenth + ". " + part + " out of " + whole + " = " + pct + "%.",
          };
        if (kind === "sale") {
          const off = pct;
          const paid = 100 - pct;
          const offVal = (off / 100) * whole;
          const paidVal = whole - offVal;
          return {
            kind,
            targetPct: paid,
            whole,
            tenth,
            off,
            money: true,
            label: "Sale price",
            prompt: "A $" + whole + " shirt is " + off + "% off. Shade the percent you PAY.",
            why:
              "100% − " + off + "% off = " + paid + "% paid. " + paid + "% of $" + whole + " = $" + paidVal + ".",
            ask: {
              q: "You pay " + paid + "% of $" + whole + ". How many dollars is that?",
              options: buildChoices(
                paidVal,
                [
                  {
                    value: offVal,
                    why: "$" + offVal + " is the discount, the money taken OFF. You pay the rest.",
                  },
                  { value: whole, why: "$" + whole + " is the price before the sale." },
                  {
                    value: paid,
                    why: paid + " is the PERCENT you pay, not the dollars. Each 10% is $" + tenth + ".",
                  },
                  recount(paidVal + tenth, "$" + tenth),
                  recount(paidVal - tenth, "$" + tenth),
                ],
                true,
              ),
            },
          };
        }
        return {
          kind: "part",
          targetPct: pct,
          whole,
          part,
          tenth,
          label: "Find the part",
          prompt: "What is " + pct + "% of " + whole + "? First, shade " + pct + "% of the bar.",
          why: "Each 10% of " + whole + " is " + tenth + ". So " + pct + "% of " + whole + " = " + part + ".",
          ask: {
            q: pct + "% of " + whole + " = ?",
            options: buildChoices(part, [
              {
                value: pct,
                why: pct + " is the percent. The question asks for that part OF " + whole + ".",
              },
              {
                value: whole - part,
                why:
                  whole - part + " is the part you did NOT shade (" + (100 - pct) + "%). Count the shaded part.",
              },
              recount(part + tenth, String(tenth)),
              recount(part - tenth, String(tenth)),
            ]),
          },
        };
      }

      // Misconception-specific feedback for a wrong shading (never states the
      // target percent).
      function shadeMistake(p, m) {
        const t = p.targetPct;
        if (m === 0) return "The bar is empty. Drag the handle or press → to shade it.";
        if (p.kind === "sale" && m === p.off)
          return "You shaded the " + m + "% taken OFF. Shade what is LEFT for you to pay.";
        if (p.kind === "percent" && m === p.part && p.part !== t)
          return (
            "You shaded " + m + "%, but " + p.part + " is the amount, not the percent. Compare " + p.part + " to the whole, " + p.whole + "."
          );
        if (p.kind === "decimal" && m * 10 === t)
          return "Careful: the first digit after the point is TENTHS. Each tenth is 10% of the bar.";
        if (m === 100 - t) return "You shaded the other part of the bar. Check which part the question asks for.";
        return m > t ? "You shaded too much." : "You shaded too little.";
      }

      // ── Earned help. Tier 1 = a method hint that does NOT state the answer.
      // Tier 2 = a concrete step, plus value labels under the bar's ticks.
      function scaffoldHint(p, phase) {
        if (phase === "value")
          return (
            "Find 10% first: divide " + (p.money ? "$" : "") + p.whole + " by 10. Then count the shaded 10% blocks."
          );
        if (p.kind === "decimal")
          return "To change a decimal to a percent, move the decimal point two places right.";
        if (p.kind === "percent")
          return "Find 10% of " + p.whole + " first. Then count how many of those make " + p.part + ".";
        if (p.kind === "sale")
          return "The whole bar is 100% of the price. Take away the percent off. Shade what is left.";
        return "The bar is 100%. Each tick mark is another 10%.";
      }
      function concreteHint(p, phase) {
        const half = p.targetPct % 10 ? " and a half" : "";
        if (phase === "value")
          return (
            "The numbers under the bar now count by " +
            (p.money ? "$" : "") +
            p.tenth +
            ". Read the number where your shading ends."
          );
        if (p.kind === "decimal")
          return p.dec + " has " + Math.floor(p.targetPct / 10) + half + " tenths. Each tenth is one 10% block.";
        if (p.kind === "percent")
          return "The numbers under the bar now count by " + p.tenth + ". Find " + p.part + " and shade up to it.";
        if (p.kind === "sale") return "Start at 100%. Subtract " + p.off + "%. Shade that many percent.";
        return "Shade " + Math.floor(p.targetPct / 10) + half + " of the 10% blocks.";
      }
      const KIND_TIP = {
        part: "Find the part: find 10% first, then count the blocks.",
        decimal: "Decimal → percent: move the decimal point two places right.",
        percent: "Find the percent: compare the part to the whole with 10% blocks.",
        sale: "Sale price: you pay 100% minus the percent off.",
      };

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#122413",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, VocabScene, GameScene, ResultScene],
      };

      // ── Vocab gate state (repo rule: term + Level-1 definition + image/emoji
      // shown BEFORE the first round). Shown by default; skippable only on a
      // replay within the same page session. ──
      let ppVocabSeen = false;
      // ── Run setup (this game has no level-select scene; difficulty ramps
      // in-run from a STARTING level). ✨ Auto picks that starting level from
      // past runs; ♾️ Endless removes the 10-problem cap. ──
      let ppLevel = 1; // starting level for the next run (1..8)
      let ppAuto = false; // true when ✨ Auto picked the starting level (NTAdaptive)
      let ppEndless = false; // true for endless (no auto-end) runs

      // Key words for THIS game's topic (percent of a number, sale price,
      // percent↔decimal). Each has a student-facing (Level 1) definition and an
      // emoji so a visual always shows even with no network/images.
      const PP_VOCAB = [
        {
          term: "Percent",
          emoji: "％",
          def: "A part out of 100. 25% means 25 out of every 100.",
        },
        {
          term: "Percent of a number",
          emoji: "🔢",
          def: "How big a part is. 50% of 20 is half of 20, which is 10.",
        },
        {
          term: "Discount",
          emoji: "🏷️",
          def: "Money taken OFF a price in a sale. 20% off means you pay less.",
        },
        {
          term: "Sale price",
          emoji: "💲",
          def: "The price you pay AFTER the discount is taken off.",
        },
        {
          term: "Equivalent decimal",
          emoji: "🟰",
          def: "The same value written as a decimal. 25% is the same as 0.25.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0xffe07a);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        const T = (size, color, extra) => ({
          fontFamily: "Segoe UI, sans-serif",
          fontSize: size + "px",
          color,
          ...(extra || {}),
        });
        this.add.rectangle(cx, H / 2, W, H, 0x122413);
        this.add
          .text(cx, 92, "PERCENT POWER", {
            fontFamily: "Impact, sans-serif",
            fontSize: "60px",
            color: "#ffd24a",
            stroke: "#0a160b",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add.text(cx, 146, "Bar Model Builder", T(24, "#8fd6a0")).setOrigin(0.5);
        this.add
          .text(

      // ── VOCAB GATE ──
      // Repo rule: term + Level-1 definition + image/emoji shown BEFORE play.

      function VocabScene() {

      VocabScene.prototype = Object.create(Phaser.Scene.prototype);
      VocabScene.prototype.constructor = VocabScene;

      VocabScene.prototype.renderCard = function () {
        const v = PP_VOCAB[this.idx];

      VocabScene.prototype.advance = function () {
        if (this.idx < PP_VOCAB.length - 1) {
          this.idx++;

          ppVocabSeen = true;

      // ── GAME ──
      // Calm motion = the OS setting OR the studio "Calm motion" toggle.
      function calmMotion() {
        if (window.GameStudio) return !!window.GameStudio.settings.reducedMotion;
        return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      }
      const PP_STREAK_KEY = "pp_bar_builder_beststreak";
      const TXT = (size, color, extra) => ({
        fontFamily: "Segoe UI, sans-serif",
        fontSize: size + "px",
        color,
        ...(extra || {}),
      });

      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function () {
        this.reduceMotion = calmMotion();
        this.score = 0;
        this.streak = 0;
        this.bestStreak = 0;
        this.level = ppLevel; // starting level (Auto may pick 1..8)
        this.startLevel = ppLevel; // ramp baseline for this run
        this.support = ppLevel <= 2; // Support start → live step coach
        this.auto = ppAuto; // carried into Result for adaptive recordRun
        this.endless = ppEndless; // endless runs never auto-end
        this.attempts = 0; // graded submissions (shade + value steps)
        this.correctSubs = 0; // graded submissions that were right
        this.solved = 0; // problems finished correctly
        this.firstTry = 0; // solved with no wrong try and no help
        this.round = 0;
        this.target = this.endless ? Infinity : 10; // win: solve this many problems
        this.problem = null;
        this.phase = "shade"; // 'shade' → (optional) 'value' → 'done'
        this.locked = false;
        this.dragging = false;
        this.markerPct = 0;
        this.lastDir = 0;
        this.reversals = 0; // direction changes on this problem (struggle signal)
        this.wrongShade = 0;
        this.wrongValue = 0;
        this.scaffoldTier = 0; // 0 none · 1 method hint · 2 concrete step + labels
        this.usedHelp = false;
        this.choices = [];
        this.choiceIdx = 0;
        this.stats = {}; // kind → { seen, clean }
      };

      GameScene.prototype.create = function () {
        this.add.rectangle(W / 2, H / 2, W, H, 0x122413);
        const hud = { fontFamily: "Segoe UI, sans-serif", fontSize: "18px", fontStyle: "bold" };
        this.scoreText = this.add.text(16, 12, "Score: 0", { ...hud, color: "#8fd6a0" });
        this.streakText = this.add
          .text(W - 16, 12, "Streak: 0", { ...hud, color: "#ffd24a" })
          .setOrigin(1, 0);
        this.levelText = this.add
          .text(W - 16, 36, "Level " + this.level, { ...hud, color: "#bfe0c8" })
          .setOrigin(1, 0);
        this.progressText = this.add.text(W / 2, 12, "", { ...hud, color: "#ffffff" }).setOrigin(0.5, 0);

        // Endless mode: "Finish ✓" ends the run now with current stats.
        if (this.endless) {
          this.finishBtn = this.add
            .text(16, 38, "Finish ✓", TXT(16, "#ffd24a", { fontStyle: "bold" }))
            .setInteractive({ useHandCursor: true });
          this.finishBtn.on("pointerover", () => this.finishBtn.setColor("#ffffff"));
          this.finishBtn.on("pointerout", () => this.finishBtn.setColor("#ffd24a"));
          this.finishBtn.on("pointerdown", () => {
            if (!this.locked) this.endGame();
          });
        }

        // Problem banner: skill label + the question.
        this.bannerLabel = this.add.text(W / 2, 70, "", TXT(16, "#9fd8ae")).setOrigin(0.5);
        this.bannerText = this.add
          .text(W / 2, 108, "", TXT(26, "#ffffff", { fontStyle: "bold", align: "center", wordWrap: { width: W - 80 } }))
          .setOrigin(0.5);
        // Feedback stays on screen until the next action (no auto-fade).
        this.feedback = this.add
          .text(
            W / 2,
            168,
            "",
            TXT(17, "#ffd24a", {
              fontStyle: "bold",
              stroke: "#0a160b",
              strokeThickness: 3,
              align: "center",
              wordWrap: { width: W - 80 },
            }),
          )
          .setOrigin(0.5)
          .setAlpha(0);

        // The percent dial echoes the student's OWN shading — never the answer.
        this.pctReadout = this.add
          .text(W / 2, 236, "0%", {
            fontFamily: "Impact, sans-serif",
            fontSize: "52px",
            color: "#ffd24a",
            stroke: "#0a160b",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        // Support tier: a live coach that names the next action.
        this.coachText = this.add
          .text(W / 2, 290, "", TXT(17, "#ffe9a8", { fontStyle: "bold", align: "center", wordWrap: { width: W - 100 } }))
          .setOrigin(0.5);

        // Bar track + tenth ticks + end labels (0 … whole)
        this.add
          .rectangle(BAR_X0, BAR_Y, BAR_W, BAR_H, 0x0c2532)
          .setOrigin(0, 0.5)
          .setStrokeStyle(2, 0x2d874b);
        for (let i = 1; i < 10; i++) {
          this.add.rectangle(pctToX(i * 10), BAR_Y, 2, BAR_H, 0x2f6b40).setOrigin(0.5);
        }
        this.fill = this.add.rectangle(BAR_X0, BAR_Y, 0, BAR_H, 0x2d874b).setOrigin(0, 0.5);
        const labelY = BAR_Y + BAR_H / 2 + 10;
        this.add.text(BAR_X0, labelY, "0", TXT(16, "#bfe0c8")).setOrigin(0.5, 0);
        this.endR = this.add.text(BAR_X1, labelY, "", TXT(16, "#bfe0c8")).setOrigin(0.5, 0);
        // Tier-2 help: value labels under each 10% tick (hidden until earned).
        this.tickLabels = [];
        for (let i = 1; i < 10; i++) {
          this.tickLabels.push(
            this.add.text(pctToX(i * 10), labelY, "", TXT(15, "#ffe9a8", { fontStyle: "bold" })).setOrigin(0.5, 0).setVisible(false),
          );
        }

        // Handle (large touch target) + knob
        this.handle = this.add
          .rectangle(pctToX(0), BAR_Y, 14, BAR_H + 30, 0xffe07a)
          .setStrokeStyle(2, 0xb87b1d)
          .setDepth(10);
        this.knob = this.add
          .circle(pctToX(0), BAR_Y - BAR_H / 2 - 22, 16, 0xffd24a)
          .setStrokeStyle(3, 0xb87b1d)
          .setDepth(10);

        // Earned-help hint line (Tier 1 / Tier 2). Hidden until unlocked.
        this.hintText = this.add
          .text(
            W / 2,
            446,
            "",
            TXT(16, "#ffd24a", { fontStyle: "bold", stroke: "#0a160b", strokeThickness: 3, align: "center", wordWrap: { width: W - 100 } }),
          )
          .setOrigin(0.5)
          .setAlpha(0);

        // Lock-in button
        this.lockBtn = this.add.rectangle(W / 2, 498, 240, 54, 0x2d874b).setInteractive({ useHandCursor: true });
        this.lockLabel = this.add
          .text(W / 2, 498, "LOCK IN ✓", TXT(22, "#ffffff", { fontStyle: "bold" }))
          .setOrigin(0.5);
        this.lockBtn.on("pointerover", () => this.lockBtn.setFillStyle(0x36a35b));
        this.lockBtn.on("pointerout", () => this.lockBtn.setFillStyle(0x2d874b));
        this.lockBtn.on("pointerdown", () => this.lockIn());

        // Key help (changes with the step).
        this.keysText = this.add.text(W / 2, 556, "", TXT(15, "#a9d4b4", { align: "center" })).setOrigin(0.5);

        this.burst = this.add
          .particles(0, 0, "spark", {
            speed: { min: 80, max: 240 },
            angle: { min: 0, max: 360 },
            scale: { start: 1.2, end: 0 },
            lifespan: 600,
            emitting: false,
            quantity: 16,
            tint: [0xffd24a, 0x8fd6a0, 0xffffff],
          })
          .setDepth(20);

        // Input: drag on the bar band; arrows / A·D nudge ±5% (or move the
        // choice highlight in Step 2); Enter/Space lock; 1-4 pick a choice.
        const inBand = (y) => Math.abs(y - BAR_Y) <= BAR_H / 2 + 40;
        this.input.on("pointerdown", (p) => {
          if (this.locked || this.phase !== "shade") return;
          if (inBand(p.y)) {
            this.dragging = true;
            this.setMarker(xToPct(p.x));
          }
        });
        this.input.on("pointermove", (p) => {
          if (this.dragging && !this.locked && this.phase === "shade") this.setMarker(xToPct(p.x));
        });
        this.input.on("pointerup", () => {
          this.dragging = false;
        });
        const nudge = (d) => {
          if (this.locked) return;
          if (this.phase === "value") return this.moveChoice(d > 0 ? 1 : -1);
          if (this.phase !== "shade") return;
          this.setMarker(this.markerPct + d);
          SFX.coin();
        };
        this.input.keyboard.on("keydown-LEFT", () => nudge(-5));
        this.input.keyboard.on("keydown-RIGHT", () => nudge(5));
        this.input.keyboard.on("keydown-A", () => nudge(-5));
        this.input.keyboard.on("keydown-D", () => nudge(5));
        this.input.keyboard.on("keydown-ENTER", () => this.lockIn());
        this.input.keyboard.on("keydown-SPACE", () => this.lockIn());
        ["ONE", "TWO", "THREE", "FOUR"].forEach((k, i) =>
          this.input.keyboard.on("keydown-" + k, () => {
            if (this.phase === "value" && !this.locked) this.submitChoice(i);
          }),
        );

        this.events.once("shutdown", () => this.hideChoices());
        if (!this.reduceMotion) this.cameras.main.fadeIn(400);
        this.newProblem();
      };

      GameScene.prototype.setMarker = function (pct) {
        const next = Phaser.Math.Clamp(pct, 0, 100);
        if (next !== this.markerPct) {
          const dir = next > this.markerPct ? 1 : -1;
          if (this.lastDir && dir !== this.lastDir) {
            this.reversals += 1;
            // Struggle signal: lots of back-and-forth → offer the Tier-1 hint.
            if (this.reversals === 6) this.setScaffold(1);
          }
          this.lastDir = dir;
        }
        this.markerPct = next;
        const x = pctToX(this.markerPct);
        this.fill.width = (BAR_W * this.markerPct) / 100;
        this.handle.x = x;
        this.knob.x = x;
        this.pctReadout.setText(this.markerPct + "%");
        this.updateCoach();
      };

      GameScene.prototype.setScaffold = function (tier) {
        if (!this.problem || tier <= this.scaffoldTier) return;
        this.scaffoldTier = tier;
        this.usedHelp = true;
        const p = this.problem;
        const text = tier >= 2 ? concreteHint(p, this.phase) : scaffoldHint(p, this.phase);
        this.hintText.setText((tier >= 2 ? "🔎 " : "💡 ") + text).setAlpha(1);
        if (tier >= 2) this.showTickLabels();
        srSay("Hint: " + text);
      };
      GameScene.prototype.showTickLabels = function () {
        const p = this.problem;
        this.tickLabels.forEach((t, i) => t.setText((p.money ? "$" : "") + (p.tenth * (i + 1))).setVisible(true));
      };

      GameScene.prototype.updateCoach = function () {
        if (!this.coachText) return;
        if (this.phase === "value") {
          this.keysText.setText("← → choose a number · Enter = pick it · or press 1–" + this.choices.length);
        } else {
          this.keysText.setText("Drag the handle or press ← → (5% each) · Enter = Lock In");
        }
        if (!this.support || this.locked) {
          this.coachText.setText("");
          return;
        }
        let msg;
        if (this.phase === "value") msg = "Next: use the shaded bar to find the number. Pick it with ← → and Enter.";
        else if (this.markerPct === 0) msg = "Next: press → (or drag the handle) to shade the bar. Each press adds 5%.";
        else msg = "Next: when your shading answers the question, press Enter to Lock In.";
        this.coachText.setText("👉 " + msg);
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.phase = "shade";
        this.round += 1;
        this.reversals = 0;
        this.lastDir = 0;
        this.wrongShade = 0;
        this.wrongValue = 0;
        this.scaffoldTier = 0;
        this.usedHelp = false;
        this.hideChoices();
        this.hintText.setAlpha(0).setText("");
        this.feedback.setAlpha(0).setText("");
        this.tickLabels.forEach((t) => t.setVisible(false));
        this.problem = barProblem(this.level);
        const p = this.problem;
        this.bannerLabel.setText(p.label + (p.ask ? " · Step 1 of 2: shade the bar" : ""));
        this.bannerText.setText(p.prompt);
        this.endR.setText((p.money ? "$" : "") + p.whole);
        this.fill.setFillStyle(0x2d874b);
        this.lockBtn.setVisible(true);
        this.lockLabel.setVisible(true);
        // Start empty (0%) so the student always builds up to the target.
        this.setMarker(0);
        this.reversals = 0;
        this.lastDir = 0;
        this.updateHUD();
        srSay(p.label + ". " + p.prompt + " Drag the handle or use the arrow keys, then lock in.");
      };

      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        if (this.phase === "value") return this.submitChoice(this.choiceIdx);
        if (this.phase !== "shade") return;
        const p = this.problem;
        this.attempts += 1;
        if (this.markerPct === p.targetPct) {
          this.correctSubs += 1;
          SFX.good();
          this.fill.setFillStyle(0x36a35b);
          if (!this.reduceMotion) {
            this.burst.setPosition(pctToX(this.markerPct), BAR_Y);
            this.burst.explode(16);
          }
          if (p.ask) {
            this.feedback.setText("The bar is right! Now use it to find the number.").setColor("#8fd6a0").setAlpha(1);
            this.enterValuePhase();
          } else {
            this.finishProblem(true);
          }
          return;
        }
        SFX.bad();
        this.wrongShade += 1;
        this.usedHelp = true;
        this.streak = 0;
        this.fill.setFillStyle(0xd4952a);
        if (this.wrongShade >= 3) {
          // No-fail last resort: show the shading, explain, and keep going.
          this.locked = true;
          this.feedback.setText("Here is the shading. " + p.why).setColor("#ffd24a").setAlpha(1);
          srSay("Here is the shading. " + p.why);
          this.tweens.add({
            targets: [this.handle, this.knob],
            x: pctToX(p.targetPct),
            duration: this.reduceMotion ? 0 : 600,
            onComplete: () => {
              this.setMarker(p.targetPct);
              this.fill.setFillStyle(0x2d874b);
              if (p.ask) {
                this.locked = false;
                this.enterValuePhase();
              } else this.finishProblem(false);
            },
          });
          return;
        }
        const why = shadeMistake(p, this.markerPct);
        this.setScaffold(this.wrongShade === 1 ? 1 : 2);
        this.feedback.setText("Not quite. " + why + " Try again.").setColor("#ffd24a").setAlpha(1);
        srSay("Not quite. " + why + " Try again.");
        this.updateHUD();
        this.time.delayedCall(700, () => {
          if (this.phase === "shade") this.fill.setFillStyle(0x2d874b);
        });
      };

      // ── Step 2: pick the value the shading is worth ─────────────────────
      GameScene.prototype.enterValuePhase = function () {
        const p = this.problem;
        this.phase = "value";
        this.bannerLabel.setText(p.label + " · Step 2 of 2: find the number");
        this.bannerText.setText(p.ask.q);
        this.lockBtn.setVisible(false);
        this.lockLabel.setVisible(false);
        // A Tier-1 hint from Step 1 is about shading — swap it for this step.
        if (this.scaffoldTier === 1) this.hintText.setText("💡 " + scaffoldHint(p, "value"));
        this.showChoices(p.ask.options);
        this.updateCoach();
        srSay(
          p.ask.q +
            " Choices: " +
            p.ask.options.map((o, i) => i + 1 + ", " + o.label).join("; ") +
            ". Use left and right, then Enter, or press a number key.",
        );
      };
      GameScene.prototype.showChoices = function (options) {
        this.hideChoices();
        const bw = 150,
          gap = 18;
        const total = options.length * bw + (options.length - 1) * gap;
        let x = W / 2 - total / 2 + bw / 2;
        this.choices = options.map((opt, i) => {
          const rect = this.add
            .rectangle(x, 498, bw, 54, 0x1b4a2c)
            .setStrokeStyle(3, 0x5fb37a)
            .setInteractive({ useHandCursor: true });
          const txt = this.add.text(x, 498, opt.label, TXT(24, "#ffffff", { fontStyle: "bold" })).setOrigin(0.5);
          const num = this.add.text(x - bw / 2 + 8, 476, String(i + 1), TXT(13, "#bfe0c8")).setOrigin(0, 0);
          rect.on("pointerdown", () => {
            if (!this.locked) this.submitChoice(i);
          });
          x += bw + gap;
          return { opt, rect, txt, num, used: false };
        });
        // Mirror the choices as real buttons in the controls panel.
        const host = document.querySelector(".cabinet-console");
        if (host) {
          const bar = document.createElement("div");
          bar.className = "game-choice-bar";
          bar.setAttribute("role", "group");
          bar.setAttribute("aria-label", "Answer choices");
          this.choices.forEach((c, i) => {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = c.opt.label;
            b.setAttribute("aria-label", "Choice " + (i + 1) + ": " + c.opt.label);
            b.addEventListener("click", () => {
              if (!this.locked) this.submitChoice(i);
            });
            c.dom = b;
            bar.append(b);
          });
          host.insertBefore(bar, host.querySelector(".cabinet-controls"));
          this.domBar = bar;
        }
        this.choiceIdx = 0;
        this.paintChoices();
      };
      GameScene.prototype.hideChoices = function () {
        (this.choices || []).forEach((c) => {
          c.rect.destroy();
          c.txt.destroy();
          c.num.destroy();
        });
        this.choices = [];
        if (this.domBar) this.domBar.remove();
        this.domBar = null;
      };
      GameScene.prototype.paintChoices = function () {
        this.choices.forEach((c, i) => {
          const on = i === this.choiceIdx;
          if (c.dom) {
            c.dom.setAttribute("aria-pressed", String(on && !c.used));
            c.dom.disabled = !!c.used || this.locked;
          }
          if (c.done) return;
          c.rect.setFillStyle(c.used ? 0x3b2f17 : on ? 0x2d874b : 0x1b4a2c);
          c.rect.setStrokeStyle(on ? 5 : 3, on ? 0xffd24a : c.used ? 0x8a6a2a : 0x5fb37a);
          c.txt.setColor(c.used ? "#c9b48a" : "#ffffff");
        });
      };
      GameScene.prototype.moveChoice = function (d) {
        if (!this.choices.length) return;
        let i = this.choiceIdx;
        for (let n = 0; n < this.choices.length; n++) {
          i = (i + d + this.choices.length) % this.choices.length;
          if (!this.choices[i].used) break;
        }
        this.choiceIdx = i;
        this.paintChoices();
        SFX.coin();
        srSay(this.choices[i].opt.label);
      };
      GameScene.prototype.submitChoice = function (i) {
        if (this.locked || this.phase !== "value") return;
        const c = this.choices[i];
        if (!c || c.used) return;
        const p = this.problem;
        this.attempts += 1;
        if (c.opt.correct) {
          this.correctSubs += 1;
          c.done = true;
          c.rect.setFillStyle(0x36a35b).setStrokeStyle(5, 0xffffff);
          SFX.good();
          this.finishProblem(true);
          return;
        }
        SFX.bad();
        this.wrongValue += 1;
        this.usedHelp = true;
        this.streak = 0;
        c.used = true;
        if (this.wrongValue >= 2) {
          const right = this.choices.find((k) => k.opt.correct);
          right.done = true;
          right.rect.setFillStyle(0x36a35b).setStrokeStyle(5, 0xffffff);
          this.paintChoices();
          this.feedback.setText(c.opt.why + " The answer is " + right.opt.label + ". " + p.why).setColor("#ffd24a").setAlpha(1);
          srSay(c.opt.why + " The answer is " + right.opt.label + ". " + p.why);
          this.finishProblem(false, true);
          return;
        }
        this.setScaffold(2);
        this.moveChoice(1);
        this.feedback.setText("Not quite. " + c.opt.why + " Try another.").setColor("#ffd24a").setAlpha(1);
        srSay("Not quite. " + c.opt.why + " Try another.");
        this.updateHUD();
      };

      GameScene.prototype.finishProblem = function (correct, keepFeedback) {
        const p = this.problem;
        this.locked = true;
        this.phase = "done";
        this.choices.forEach((c) => {
          if (c.dom) c.dom.disabled = true;
        });
        const st = (this.stats[p.kind] = this.stats[p.kind] || { seen: 0, clean: 0 });
        st.seen += 1;
        if (correct) {
          this.solved += 1;
          if (!this.usedHelp) {
            // Unaided first try: full points + streak bonus.
            st.clean += 1;
            this.firstTry += 1;
            this.streak += 1;
            this.bestStreak = Math.max(this.bestStreak, this.streak);
            this.score += 20 + Math.min(this.streak, 5) * 5;
            this.flash(W / 2, 200, "Correct! ✓", "#8fd6a0");
            this.feedback.setText("Correct! " + p.why).setColor("#8fd6a0").setAlpha(1);
            srSay("Correct. " + p.why);
          } else {
            // Helped solve: still counts, fewer points, streak resets.
            this.streak = 0;
            this.score += 10;
            this.flash(W / 2, 200, "You worked it out! ✓", "#8fd6a0");
            this.feedback.setText("You got it. " + p.why).setColor("#8fd6a0").setAlpha(1);
            srSay("Correct with help. " + p.why);
          }
        } else if (!keepFeedback) {
          this.feedback.setText("Here is how it works. " + p.why).setColor("#ffd24a").setAlpha(1);
        }
        this.coachText.setText("");
        this.afterAttempt();
      };

      GameScene.prototype.afterAttempt = function () {
        // Level up every 3 solved, ramping from this run's starting level.
        const newLevel = Math.min(8, this.startLevel + Math.floor(this.solved / 3));
        if (newLevel > this.level) {
          this.level = newLevel;
          SFX.level();
          this.flash(W / 2, 236, "LEVEL " + this.level + "!", "#ffd24a");
        }
        this.updateHUD();
        if (this.solved >= this.target) {
          this.endGame();
          return;
        }
        this.keysText.setText("Read the explanation. Press Enter or Continue when you are ready.");
        this.studioNextRound(() => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.flash = function (x, y, text, color) {
        const ft = this.add
          .text(x, y, text, TXT(26, color, { fontStyle: "bold", stroke: "#0a160b", strokeThickness: 4 }))
          .setOrigin(0.5)
          .setDepth(40);
        this.tweens.add({
          targets: ft,
          y: this.reduceMotion ? y : y - 50,
          alpha: { from: 1, to: 0 },
          duration: this.reduceMotion ? 900 : 900,
          onComplete: () => ft.destroy(),
        });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText("Level " + this.level);
        const n = Math.min(this.solved + 1, this.target);
        this.progressText.setText(
          this.endless ? "Challenge " + (this.solved + 1) + " · " + this.solved + " solved" : "Challenge " + n + " of " + this.target,
        );
      };

      // Reached only by solving all target problems (mistakes never end the
      // game) or by Finish in endless mode.
      GameScene.prototype.endGame = function () {
        this.locked = true;
        this.time.delayedCall(500, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            level: this.level,
            auto: this.auto,
            endless: this.endless,
            startLevel: this.startLevel,
            firstTry: this.firstTry,
            bestStreak: this.bestStreak,
            stats: this.stats,
            attempts: this.attempts,
            correctSubs: this.correctSubs,
            accuracy: this.attempts ? this.correctSubs / this.attempts : 1,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x122413);
        // Endless runs grade against the standard goal of 10.
        const endless = !!d.endless;
        const goal = endless ? 10 : d.target;
        const stars = d.solved >= goal ? 3 : d.solved >= goal * 0.6 ? 2 : 1;
        if (d.auto && window.NTAdaptive) {
          window.NTAdaptive.recordRun("u4-percent-power", {
            won: d.solved >= goal,
            accuracy: d.accuracy != null ? d.accuracy : 1,
            min: 1,
            max: 8,
          });
        }
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10) || 0;
        const newBest = d.score > hs;
        let bestStreak = 0;
        try {
          bestStreak = parseInt(localStorage.getItem(PP_STREAK_KEY) || "0", 10) || 0;
          if (newBest) localStorage.setItem(LS_KEY, String(d.score));
          if ((d.bestStreak || 0) > bestStreak) {
            bestStreak = d.bestStreak;
            localStorage.setItem(PP_STREAK_KEY, String(bestStreak));
          }
        } catch (e) {}
        if (newBest) hs = d.score;

        this.add
          .text(cx, 70, "CITY OF SAVINGS!", {
            fontFamily: "Impact, sans-serif",
            fontSize: "46px",
            color: "#8fd6a0",
            stroke: "#0a160b",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 128, "★".repeat(stars) + "☆".repeat(3 - stars), TXT(44, "#ffd24a"))
          .setOrigin(0.5);
        this.add
          .text(cx, 182, "Score: " + d.score + (newBest ? "  · New high score!" : ""), TXT(28, "#ffffff", { fontStyle: "bold" }))
          .setOrigin(0.5);

        // What happened, what was practiced, and what to practice next.
        const stats = d.stats || {};
        const kinds = Object.keys(stats);
        const names = { part: "Find the part", decimal: "Decimal → percent", percent: "Find the percent", sale: "Sale price" };
        let weak = null;
        kinds.forEach((k) => {
          const miss = stats[k].seen - stats[k].clean;
          if (miss > 0 && (!weak || miss > stats[weak].seen - stats[weak].clean)) weak = k;
        });
        const acc = Math.round((d.accuracy != null ? d.accuracy : 1) * 100);
        const lines = [
          (endless ? "Solved " + d.solved + " problems" : "Solved " + d.solved + " of " + d.target + " problems") +
            " · " + (d.firstTry || 0) + " on the first try with no help",
          "Accuracy: " + acc + "% of your answers were right · Best streak ever: " + bestStreak,
          "Skills practiced: " + (kinds.length ? kinds.map((k) => names[k]).join(", ") : "percent of a number"),
          weak
            ? "Practice next → " + KIND_TIP[weak]
            : d.level < 8
              ? "Practice next → try ✨ Auto. It starts you at a harder level."
              : "Practice next → keep your streak going with ♾️ Keep Playing.",
        ];
        this.summary = this.add
          .text(cx, 290, lines.join("\n"), TXT(17, "#d6eedc", { align: "center", lineSpacing: 10, wordWrap: { width: W - 70 } }))
          .setOrigin(0.5);
        // The controls panel reads bannerText: mirror the summary there so it
        // is readable at phone width and by screen readers.
        this.bannerText = this.summary;
        this.add.text(cx, 372, "High score: " + hs, TXT(16, "#ffd24a")).setOrigin(0.5);

        SFX.win();
        // EduPulse / Canvas code: report problems solved out of the goal (not
        // arcade points over a problem count, which printed e.g. "195/10").
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.solved,
              maxScore: goal,
              percent: acc,
              stars: stars,
              level: d.level,
              standard: "6.AT.4",
              problemsCorrect: d.correctSubs,
              problemsAttempted: d.attempts,
            });
        } catch (e) {}
        srSay("Round complete. Score " + d.score + ", " + stars + " stars. " + lines.join(" "));

        const btn = this.add.rectangle(cx, 430, 240, 54, 0x2d874b).setInteractive({ useHandCursor: true });
        this.add.text(cx, 430, "PLAY AGAIN 🔁", TXT(20, "#ffffff", { fontStyle: "bold" })).setOrigin(0.5);
        const again = () => {
          // Fresh run with new numbers at the same starting point.
          ppLevel = d.auto
            ? window.NTAdaptive
              ? window.NTAdaptive.pickLevel("u4-percent-power", 1, 8)
              : 1
            : d.startLevel || 1;
          ppAuto = !!d.auto;
          ppEndless = false;
          this.scene.start("Game");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x36a35b));
        btn.on("pointerout", () => btn.setFillStyle(0x2d874b));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        // ♾️ Keep Playing: same level, endless (Finish ✓ ends it).
        const keepBtn = this.add
          .rectangle(cx, 496, 240, 50, 0x2563a8)
          .setStrokeStyle(2, 0x7dd3fc)
          .setInteractive({ useHandCursor: true });
        this.add.text(cx, 496, "♾️ Keep Playing", TXT(18, "#ffffff", { fontStyle: "bold" })).setOrigin(0.5);
        const keepPlaying = () => {
          ppLevel = d.level;
          ppEndless = true;
          ppAuto = d.auto;
          this.scene.start("Game");
        };
        keepBtn.on("pointerover", () => keepBtn.setFillStyle(0x2f74c2));
        keepBtn.on("pointerout", () => keepBtn.setFillStyle(0x2563a8));
        keepBtn.on("pointerdown", keepPlaying);
        this.add
          .text(cx, 556, "Enter = Play again · Every round has new numbers.", TXT(15, "#a9d4b4"))
          .setOrigin(0.5);
      };

      // ── Launch ──
      const ppGame = new Phaser.Game(config);
      // Native math controls now have a readable, touch-accessible console.
      window.PhaserStudio.mount({
        game: ppGame, id: "u4-percent-power", GameScene, ResultScene, audio: SFX,
        instructions: [
          "Read the question at the top. The long bar is the whole amount (100%). Each tick mark is 10%.",
          "Shade the bar: drag the handle, or press \u2190 \u2192 to change it by 5%. Press Enter or LOCK IN to check.",
          "Some questions have Step 2: pick the number your shading is worth. Use \u2190 \u2192 and Enter, or press 1\u20134.",
          "Not right? Read the tip and try again. A hint appears after a try. First-try answers with no help earn the most points.",
        ],
        setLevel(level) { ppLevel = level === 1 ? 1 : 4; ppAuto = false; ppEndless = false; ppGame.scene.getScenes(true).forEach(scene => ppGame.scene.stop(scene.sys.settings.key)); ppGame.scene.start(ppVocabSeen ? "Game" : "Vocab"); }
      });

      // Canvas accessibility (additive; no gameplay change).
      ppGame.events.once("ready", function () {
        try {
          const cv = ppGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Percent Power Bar Model Builder math game. A percent problem " +
              "appears at the top; drag the handle, or use the left and right " +
              "arrow keys, to shade the bar, then press Enter. Some problems " +
              "have a second step: choose the number the shading is worth with " +
              "the arrow keys and Enter, or press 1 to 4.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>
