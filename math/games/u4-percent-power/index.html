  <head>

    <meta
      name="description"
      content="A build-it math game for Grade 6 lessons 4.1-4.5 (6.RP.3c): shade a percent bar to show a percent of a number, a sale price, or a decimal — drag the handle or nudge by 5%, then lock in your answer."
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #0f1d10;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      canvas {
        display: block;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }
      canvas:focus-visible {
        outline: 3px solid #d4952a;
        outline-offset: 4px;
        border-radius: 8px;
      }
      canvas:focus:not(:focus-visible) {
        outline: none;
      }
      #pp-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(
          130% 90% at 50% 0%,
          #1e3a22 0%,
          #122413 55%,
          #0a160b 100%
        );
      }
      #pp-bg-layer {
        position: absolute;
        inset: -6% -6%;
        will-change: transform;
        transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .pp-spark {
        position: absolute;
        border-radius: 50%;
        background: #ffe07a;
        opacity: 0.5;
        animation: ppTwinkle var(--tw, 3s) ease-in-out infinite;
      }
      @keyframes ppTwinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.8);
        }
        50% {
          opacity: 0.75;
          transform: scale(1.2);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pp-bg-layer {
          transition: none !important;
          transform: none !important;
        }
        .pp-spark {
          animation: none !important;
          opacity: 0.4 !important;
        }
      }
      #pp-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

  <body>
    <!-- Decorative animated spark-field (behind the Phaser canvas). -->
    <div id="pp-bg" data-parallax aria-hidden="true">
      <div id="pp-bg-layer" data-parallax-layer></div>
    </div>
    <!-- Screen-reader live region: mirrors the current problem + result. -->
    <div id="pp-sr" role="status" aria-live="polite"></div>
    <script>
      // Decorative spark-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("pp-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 34;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "pp-spark";
            var sz = rnd(2, 5);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" +
            (dx * 20).toFixed(2) +
            "px," +
            (dy * 12).toFixed(2) +
            "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener)
            reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── PERCENT POWER — BAR MODEL BUILDER ──
      // Phaser 3 — Grade 6 Math — Percent of a number, sale price, %↔decimal
      // Mechanic (math-as-mechanic, no reflex/timer): the bar IS the whole.
      // Drag the handle (or nudge ±5% with ← → / A D) to SHADE a percent, then
      // press Lock In. Two live readouts — the percent and the part it equals —
      // update as you move, so the percent↔part relationship is the action.
      // A wrong shade (wrong math) costs a life and the marker animates to the
      // correct spot to teach. Difficulty rises by level: more framings (find
      // the part → decimal → find the percent → sale price).

      const W = 820,
        H = 600;
      const LS_KEY = "pp_bar_builder_highscore";
      // Percent-bar geometry in game space. Phaser Scale.FIT maps pointer
      // coordinates into this space, so drag math works at any screen size.
      const BAR_X0 = 130,
        BAR_X1 = 690,
        BAR_Y = 360,
        BAR_H = 72;
      const BAR_W = BAR_X1 - BAR_X0;
      function pctToX(p) {
        return BAR_X0 + (BAR_W * p) / 100;
      }
      function xToPct(x) {
        // Snap to 5% increments; targets are always 5% multiples → exact match.
        return Phaser.Math.Clamp(
          Math.round(((x - BAR_X0) / BAR_W) * 20) * 5,
          0,
          100,
        );
      }

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (
                window.AudioContext || window.webkitAudioContext
              )();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        miss() {
          this.play("triangle", 240, 0.16, 0.12);
        },
        coin() {
          this.play("square", 1040, 0.05, 0.08);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
        lose() {
          [400, 330, 260, 200].forEach((f, i) =>
            setTimeout(() => this.play("sawtooth", f, 0.3, 0.14), i * 170),
          );
        },
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function shuffle(a) {
        const r = [...a];
        for (let i = r.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [r[i], r[j]] = [r[j], r[i]];
        }
        return r;
      }
      function srSay(msg) {
        const el = document.getElementById("pp-sr");
        if (el) el.textContent = msg;
      }

      // ── Problem generator (bar model) ───────────────────────────────────
      // Every problem reduces to one tactile action: set the bar to a target
      // percent (a multiple of 5). Returns
      //   { kind, label, prompt, whole, targetPct, why }
      // Four framings scale with level so the same action teaches percent of a
      // number (both directions), %↔decimal, and sale price:
      //   level 1-2 : find the part   ("Shade 75% of 20")
      //   level 3   : + decimal → bar ("Shade the bar to show 0.25")
      //   level 4-5 : + find percent  ("How much of 20 is 15? Shade it.")
      //   level 6+  : + sale price    ("$20, 25% off — shade what you PAY")
      const PCTS = [10, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90];
      function pickWholeFor(pct) {
        // A whole that makes the part a whole number, kept student-friendly.
        const bases = [10, 20, 40, 50, 60, 80, 100, 200];
        const ok = bases.filter((b) => Number.isInteger((pct / 100) * b));
        return ok[randInt(0, ok.length - 1)];
      }
      function barProblem(level) {
        const pct = PCTS[randInt(0, PCTS.length - 1)];
        const whole = pickWholeFor(pct);
        const part = (pct / 100) * whole;
        const dec = String(pct / 100);
        let kind;
        if (level <= 2) kind = "part";
        else if (level === 3) kind = Math.random() < 0.6 ? "part" : "decimal";
        else if (level <= 5) {
          const r = Math.random();
          kind = r < 0.4 ? "part" : r < 0.7 ? "decimal" : "percent";
        } else {
          const r = Math.random();
          kind =
            r < 0.3
              ? "part"
              : r < 0.5
                ? "decimal"
                : r < 0.75
                  ? "percent"
                  : "sale";
        }
        if (kind === "decimal")
          return {
            kind,
            targetPct: pct,
            whole,
            label: "Decimal → bar",
            prompt: "Shade the bar to show " + dec,
            why: dec + " = " + pct + "%.",
          };
        if (kind === "percent")
          return {
            kind,
            targetPct: pct,
            whole,
            label: "Find the percent",
            prompt: "How much of " + whole + " is " + part + "? Shade it.",
            why: part + " out of " + whole + " = " + pct + "%.",
          };
        if (kind === "sale") {
          const paid = 100 - pct;
          const paidVal = (paid / 100) * whole;
          return {
            kind,
            targetPct: paid,
            whole,
            label: "Sale price",
            prompt: "$" + whole + ", " + pct + "% off — shade what you PAY",
            why: pct + "% off → you pay " + paid + "% = $" + paidVal + ".",
          };
        }
        return {
          kind: "part",
          targetPct: pct,
          whole,
          label: "Find the part",
          prompt: "Shade " + pct + "% of " + whole,
          why: pct + "% of " + whole + " = " + part + ".",
        };
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#122413",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, VocabScene, GameScene, ResultScene],
      };

      // ── Vocab gate state (repo rule: term + Level-1 definition + image/emoji
      // shown BEFORE the first round). Shown by default; skippable only on a
      // replay within the same page session. ──
      let ppVocabSeen = false;

      // Key words for THIS game's topic (percent of a number, sale price,
      // percent↔decimal). Each has a student-facing (Level 1) definition and an
      // emoji so a visual always shows even with no network/images.
      const PP_VOCAB = [
        {
          term: "Percent",
          emoji: "％",
          def: "A part out of 100. 25% means 25 out of every 100.",
        },
        {
          term: "Percent of a number",
          emoji: "🔢",
          def: "How big a part is. 50% of 20 is half of 20, which is 10.",
        },
        {
          term: "Discount",
          emoji: "🏷️",
          def: "Money taken OFF a price in a sale. 20% off means you pay less.",
        },
        {
          term: "Sale price",
          emoji: "💲",
          def: "The price you pay AFTER the discount is taken off.",
        },
        {
          term: "Equivalent decimal",
          emoji: "🟰",
          def: "The same value written as a decimal. 25% is the same as 0.25.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0xffe07a);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x122413);
        this.add
          .text(cx, 120, "PERCENT POWER", {
            fontFamily: "Impact, sans-serif",
            fontSize: "64px",
            color: "#ffd24a",
            stroke: "#0a160b",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 175, "Bar Model Builder", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            color: "#8fd6a0",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            230,
            "Shade the bar to BUILD the answer. Drag the handle (or use\n← →) to set the percent, watch the part update, then Lock In!",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#bfe0c8",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            295,
            "Drag or ← → / A·D by 5% · 6.RP.3c · Lessons 4.1–4.5",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "14px",
              color: "#7fae8c",
            },
          )
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 330, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#ffd24a",
              fontStyle: "bold",
            })
            .setOrigin(0.5);

        const btn = this.add
          .rectangle(cx, 400, 240, 58, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "START ▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.tweens.add({
          targets: [btn, btnT],
          scaleX: 1.05,
          scaleY: 1.05,
          duration: 800,
          yoyo: true,
          repeat: -1,
        });
        const start = () => {
          SFX.init();
          SFX.coin();
          // Show the vocab gate before the first round; on a replay (already
          // seen this session) jump straight to the game.
          this.scene.start(ppVocabSeen ? "Game" : "Vocab");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x36a35b));
        btn.on("pointerout", () => btn.setFillStyle(0x2d874b));
        btn.on("pointerdown", start);
        this.input.keyboard.on("keydown-SPACE", start);
        this.input.keyboard.on("keydown-ENTER", start);

        const hub = this.add
          .text(cx, 540, "← Back to Math Games", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#7fae8c",
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        hub.on("pointerover", () => hub.setColor("#ffd24a"));
        hub.on("pointerout", () => hub.setColor("#7fae8c"));
        hub.on("pointerdown", () => (window.location.href = "/math/games/"));
        srSay("Percent Power Bar Model Builder. Press Start to play.");
      };

      // ── VOCAB GATE ──
      // Repo rule: term + Level-1 definition + image/emoji shown BEFORE play.
      // One card per key word; Back / Next; last card starts the game. No
      // answers or giveaways are shown here — only the vocabulary.
      function VocabScene() {
        Phaser.Scene.call(this, "Vocab");
      }
      VocabScene.prototype = Object.create(Phaser.Scene.prototype);
      VocabScene.prototype.constructor = VocabScene;
      VocabScene.prototype.init = function () {
        this.idx = 0;
      };
      VocabScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x122413);
        this.add
          .text(cx, 70, "WORDS TO KNOW FIRST", {
            fontFamily: "Impact, sans-serif",
            fontSize: "34px",
            color: "#ffd24a",
            stroke: "#0a160b",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        // Card surface.
        this.add
          .rectangle(cx, 320, 560, 320, 0x0c2532)
          .setStrokeStyle(2, 0x2d874b);

        this.stepText = this.add
          .text(cx, 185, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            fontStyle: "bold",
            color: "#7fae8c",
          })
          .setOrigin(0.5);
        this.emojiText = this.add
          .text(cx, 250, "", { fontSize: "76px" })
          .setOrigin(0.5);
        this.termText = this.add
          .text(cx, 330, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "32px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.defText = this.add
          .text(cx, 400, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            color: "#bfe0c8",
            align: "center",
            wordWrap: { width: 500 },
          })
          .setOrigin(0.5);

        // Next / Start button.
        const nextBtn = this.add
          .rectangle(cx + 90, 510, 220, 52, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        const nextT = this.add
          .text(cx + 90, 510, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        nextBtn.on("pointerover", () => nextBtn.setFillStyle(0x36a35b));
        nextBtn.on("pointerout", () => nextBtn.setFillStyle(0x2d874b));
        nextBtn.on("pointerdown", () => this.advance());
        this.nextBtn = nextBtn;
        this.nextT = nextT;

        // Back button (hidden on the first card).
        const backBtn = this.add
          .rectangle(cx - 120, 510, 130, 52, 0x1a3a48)
          .setInteractive({ useHandCursor: true });
        const backT = this.add
          .text(cx - 120, 510, "← Back", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            fontStyle: "bold",
            color: "#9fc6cf",
          })
          .setOrigin(0.5);
        backBtn.on("pointerover", () => backBtn.setFillStyle(0x244c5c));
        backBtn.on("pointerout", () => backBtn.setFillStyle(0x1a3a48));
        backBtn.on("pointerdown", () => this.goBack());
        this.backBtn = backBtn;
        this.backT = backT;

        this.input.keyboard.on("keydown-SPACE", () => this.advance());
        this.input.keyboard.on("keydown-ENTER", () => this.advance());
        this.input.keyboard.on("keydown-RIGHT", () => this.advance());
        this.input.keyboard.on("keydown-LEFT", () => this.goBack());

        this.renderCard();
      };
      VocabScene.prototype.renderCard = function () {
        const v = PP_VOCAB[this.idx];
        const last = this.idx === PP_VOCAB.length - 1;
        this.stepText.setText(
          "Key word " + (this.idx + 1) + " of " + PP_VOCAB.length,
        );
        this.emojiText.setText(v.emoji);
        this.termText.setText(v.term);
        this.defText.setText(v.def);
        this.nextT.setText(last ? "Start playing ▶" : "Next →");
        const showBack = this.idx > 0;
        this.backBtn.setVisible(showBack);
        this.backT.setVisible(showBack);
        srSay(v.term + ". " + v.def);
      };
      VocabScene.prototype.advance = function () {
        if (this.idx < PP_VOCAB.length - 1) {
          this.idx++;
          this.renderCard();
        } else {
          ppVocabSeen = true;
          this.scene.start("Game");
        }
      };
      VocabScene.prototype.goBack = function () {
        if (this.idx > 0) {
          this.idx--;
          this.renderCard();
        }
      };

      // ── GAME ──
      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function () {
        this.reduceMotion = !!(
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
        this.score = 0;
        this.lives = 3;
        this.streak = 0;
        this.level = 1;
        this.solved = 0; // problems answered correctly
        this.target = 10; // win condition: solve this many problems
        this.problem = null;
        this.locked = false;
        this.dragging = false;
        this.markerPct = 50; // current shaded percent (multiple of 5)
      };

      GameScene.prototype.create = function () {
        this.add.rectangle(W / 2, H / 2, W, H, 0x122413);

        // HUD (same layout as the shell's other games)
        const hudStyle = {
          fontFamily: "Segoe UI, sans-serif",
          fontSize: "18px",
          fontStyle: "bold",
        };
        this.scoreText = this.add.text(16, 12, "Score: 0", {
          ...hudStyle,
          color: "#8fd6a0",
        });
        this.livesText = this.add.text(16, 36, "❤❤❤", {
          ...hudStyle,
          color: "#ff8f8f",
        });
        this.streakText = this.add
          .text(W - 16, 12, "Streak: 0", { ...hudStyle, color: "#ffd24a" })
          .setOrigin(1, 0);
        this.levelText = this.add
          .text(W - 16, 36, "Level 1", { ...hudStyle, color: "#bfe0c8" })
          .setOrigin(1, 0);
        this.progressText = this.add
          .text(W / 2, 12, "0 / " + this.target, {
            ...hudStyle,
            color: "#bfe0c8",
          })
          .setOrigin(0.5, 0);

        // Problem banner
        this.bannerLabel = this.add
          .text(W / 2, 78, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#7fae8c",
          })
          .setOrigin(0.5);
        this.bannerText = this.add
          .text(W / 2, 110, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "28px",
            fontStyle: "bold",
            color: "#ffffff",
            align: "center",
            wordWrap: { width: W - 80 },
          })
          .setOrigin(0.5);

        this.feedback = this.add
          .text(W / 2, 168, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "17px",
            fontStyle: "bold",
            color: "#ffd24a",
            stroke: "#0a160b",
            strokeThickness: 3,
            align: "center",
            wordWrap: { width: W - 80 },
          })
          .setOrigin(0.5)
          .setAlpha(0);

        // Live readouts — the heart of the mechanic: the percent and the part
        // it equals, both updating as the bar is shaded.
        this.pctReadout = this.add
          .text(W / 2, 232, "50%", {
            fontFamily: "Impact, sans-serif",
            fontSize: "56px",
            color: "#ffd24a",
            stroke: "#0a160b",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        this.partReadout = this.add
          .text(W / 2, 282, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "22px",
            fontStyle: "bold",
            color: "#8fd6a0",
          })
          .setOrigin(0.5);

        // Bar track + tenth ticks + end labels (0 … whole)
        this.add
          .rectangle(BAR_X0, BAR_Y, BAR_W, BAR_H, 0x0c2532)
          .setOrigin(0, 0.5)
          .setStrokeStyle(2, 0x2d874b);
        for (let i = 1; i < 10; i++) {
          this.add
            .rectangle(pctToX(i * 10), BAR_Y, 2, BAR_H, 0x1f4a2c)
            .setOrigin(0.5);
        }
        this.fill = this.add
          .rectangle(BAR_X0, BAR_Y, BAR_W / 2, BAR_H, 0x2d874b)
          .setOrigin(0, 0.5);
        this.add
          .text(BAR_X0, BAR_Y + BAR_H / 2 + 12, "0", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#bfe0c8",
          })
          .setOrigin(0, 0);
        this.endR = this.add
          .text(BAR_X1, BAR_Y + BAR_H / 2 + 12, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#bfe0c8",
          })
          .setOrigin(1, 0);

        // Handle (large touch target) + knob
        this.handle = this.add
          .rectangle(pctToX(50), BAR_Y, 14, BAR_H + 30, 0xffe07a)
          .setStrokeStyle(2, 0xb87b1d)
          .setDepth(10);
        this.knob = this.add
          .circle(pctToX(50), BAR_Y - BAR_H / 2 - 22, 16, 0xffd24a)
          .setStrokeStyle(3, 0xb87b1d)
          .setDepth(10);

        // Lock-in button
        this.lockBtn = this.add
          .rectangle(W / 2, 482, 240, 54, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(W / 2, 482, "LOCK IN ✓", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "22px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.lockBtn.on("pointerover", () =>
          this.lockBtn.setFillStyle(0x36a35b),
        );
        this.lockBtn.on("pointerout", () =>
          this.lockBtn.setFillStyle(0x2d874b),
        );
        this.lockBtn.on("pointerdown", () => this.lockIn());

        // Hint
        this.add
          .text(
            W / 2,
            532,
            "Drag the handle or press ← → (A·D) to adjust by 5%. Enter = lock in.",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "14px",
              color: "#7fae8c",
              align: "center",
            },
          )
          .setOrigin(0.5);

        // Particles + red flash (reused from the shell)
        this.burst = this.add
          .particles(0, 0, "spark", {
            speed: { min: 80, max: 240 },
            angle: { min: 0, max: 360 },
            scale: { start: 1.2, end: 0 },
            lifespan: 600,
            emitting: false,
            quantity: 16,
            tint: [0xffd24a, 0x8fd6a0, 0xffffff],
          })
          .setDepth(20);
        this.redFlash = this.add
          .rectangle(W / 2, H / 2, W, H, 0xff3333, 0)
          .setDepth(30);

        // Input: drag on the bar band; arrows / A·D nudge ±5%; Enter/Space lock.
        const inBand = (y) => Math.abs(y - BAR_Y) <= BAR_H / 2 + 40;
        this.input.on("pointerdown", (p) => {
          if (this.locked) return;
          if (inBand(p.y)) {
            this.dragging = true;
            this.setMarker(xToPct(p.x));
          }
        });
        this.input.on("pointermove", (p) => {
          if (this.dragging && !this.locked) this.setMarker(xToPct(p.x));
        });
        this.input.on("pointerup", () => {
          this.dragging = false;
        });
        const nudge = (d) => {
          if (this.locked) return;
          this.setMarker(this.markerPct + d);
          SFX.coin();
        };
        this.input.keyboard.on("keydown-LEFT", () => nudge(-5));
        this.input.keyboard.on("keydown-RIGHT", () => nudge(5));
        this.input.keyboard.on("keydown-A", () => nudge(-5));
        this.input.keyboard.on("keydown-D", () => nudge(5));
        this.input.keyboard.on("keydown-ENTER", () => this.lockIn());
        this.input.keyboard.on("keydown-SPACE", () => this.lockIn());

        this.cameras.main.fadeIn(400);
        this.newProblem();
      };

      GameScene.prototype.setMarker = function (pct) {
        this.markerPct = Phaser.Math.Clamp(pct, 0, 100);
        const x = pctToX(this.markerPct);
        this.fill.width = (BAR_W * this.markerPct) / 100;
        this.handle.x = x;
        this.knob.x = x;
        this.pctReadout.setText(this.markerPct + "%");
        if (this.problem) {
          const part = (this.problem.whole * this.markerPct) / 100;
          const partStr = Number.isInteger(part)
            ? String(part)
            : part.toFixed(1);
          this.partReadout.setText(
            "= " + partStr + " of " + this.problem.whole,
          );
        }
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.problem = barProblem(this.level);
        this.bannerLabel.setText(this.problem.label);
        this.bannerText.setText(this.problem.prompt);
        this.endR.setText(String(this.problem.whole));
        this.fill.setFillStyle(0x2d874b);
        // Start empty (0%) every problem so the student always builds up to the
        // target — starting at 50% pre-solved any 50% problem with no movement.
        this.setMarker(0);
        srSay(
          this.problem.label +
            ": " +
            this.problem.prompt +
            ". Drag the handle to shade your answer, then lock it in.",
        );
      };

      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        this.locked = true;
        const correct = this.markerPct === this.problem.targetPct;
        if (correct) {
          SFX.good();
          this.solved++;
          this.streak++;
          const bonus = Math.min(this.streak, 5) * 5;
          this.score += 20 + bonus;
          this.fill.setFillStyle(0x36a35b);
          this.burst.setPosition(pctToX(this.markerPct), BAR_Y);
          this.burst.explode(16);
          this.flash(W / 2, 200, "Correct! ✓", "#8fd6a0");
          this.feedback.setText("Correct! " + this.problem.why).setAlpha(1);
          srSay("Correct. " + this.problem.why);
          this.afterAttempt(true);
        } else {
          SFX.bad();
          this.streak = 0;
          this.lives--;
          this.flashRed();
          this.fill.setFillStyle(0xc23b3b);
          this.feedback.setText("Not quite — " + this.problem.why).setAlpha(1);
          srSay("Not quite. " + this.problem.why);
          // Teach: show the correct shade and glide the handle to it, then go on.
          const ghost = this.add
            .rectangle(
              BAR_X0,
              BAR_Y,
              (BAR_W * this.problem.targetPct) / 100,
              BAR_H,
              0x8fd6a0,
              0.35,
            )
            .setOrigin(0, 0.5)
            .setDepth(5);
          this.tweens.add({
            targets: [this.handle, this.knob],
            x: pctToX(this.problem.targetPct),
            duration: this.reduceMotion ? 0 : 600,
            onComplete: () => {
              ghost.destroy();
              this.afterAttempt(false);
            },
          });
        }
      };

      GameScene.prototype.afterAttempt = function (correct) {
        // Level up every 3 correct.
        const newLevel = Math.min(8, 1 + Math.floor(this.solved / 3));
        if (newLevel > this.level) {
          this.level = newLevel;
          SFX.level();
          this.flash(W / 2, 200, "LEVEL " + this.level + "!", "#ffd24a");
        }
        this.updateHUD();
        if (this.lives <= 0) {
          // No-fail practice: refill hearts and keep going. Mistakes teach;
          // they never end the game (calm, self-paced classroom mode).
          this.lives = 3;
          this.updateHUD();
        }
        if (this.solved >= this.target) {
          this.endGame(true);
          return;
        }
        this.time.delayedCall(900, () => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.flash = function (x, y, text, color) {
        const ft = this.add
          .text(x, y, text, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            fontStyle: "bold",
            color: color,
            stroke: "#0a160b",
            strokeThickness: 4,
          })
          .setOrigin(0.5)
          .setDepth(40);
        this.tweens.add({
          targets: ft,
          y: y - 50,
          alpha: { from: 1, to: 0 },
          duration: this.reduceMotion ? 500 : 900,
          onComplete: () => ft.destroy(),
        });
      };

      GameScene.prototype.flashRed = function () {
        if (this.reduceMotion) return;
        this.redFlash.setAlpha(0.35);
        this.tweens.add({
          targets: this.redFlash,
          alpha: 0,
          duration: 350,
        });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.livesText.setText(this.lives > 0 ? "❤".repeat(this.lives) : "—");
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText("Level " + this.level);
        this.progressText.setText(this.solved + " / " + this.target);
      };

      GameScene.prototype.endGame = function (won) {
        this.locked = true;
        this.time.delayedCall(500, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            won: won,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x122413);
        // Stars from accuracy/score.
        const stars =
          d.solved >= d.target ? 3 : d.solved >= d.target * 0.6 ? 2 : 1;
        // High score
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        if (d.score > hs) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }

        this.add
          .text(cx, 110, d.won ? "CITY OF SAVINGS!" : "OUT OF LIVES", {
            fontFamily: "Impact, sans-serif",
            fontSize: "48px",
            color: d.won ? "#8fd6a0" : "#ff8f8f",
            stroke: "#0a160b",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        const starStr = "★".repeat(stars) + "☆".repeat(3 - stars);
        this.add
          .text(cx, 185, starStr, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "48px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);

        this.add
          .text(cx, 255, "Score: " + d.score, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "30px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            295,
            "Solved " + d.solved + " of " + d.target + " problems",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "18px",
              color: "#bfe0c8",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 325, "High Score: " + hs, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);

        if (d.won) SFX.win();
        else SFX.lose();

        // EduPulse reporting (guarded; safe no-op without bridge).
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.score,
              stars: stars,
              standard: "6.RP.3c",
              problemsAttempted: d.solved,
            });
        } catch (e) {}
        srSay(
          (d.won ? "You won! " : "Game over. ") +
            "Final score " +
            d.score +
            ", " +
            stars +
            " stars.",
        );

        const btn = this.add
          .rectangle(cx, 400, 220, 54, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "PLAY AGAIN 🔁", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const again = () => this.scene.start("Game");
        btn.on("pointerover", () => btn.setFillStyle(0x36a35b));
        btn.on("pointerout", () => btn.setFillStyle(0x2d874b));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        const hub = this.add
          .text(cx, 480, "← Back to Math Games", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#7fae8c",
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        hub.on("pointerover", () => hub.setColor("#ffd24a"));
        hub.on("pointerout", () => hub.setColor("#7fae8c"));
        hub.on("pointerdown", () => (window.location.href = "/math/games/"));
      };

      // ── Launch ──
      const ppGame = new Phaser.Game(config);

      // Canvas accessibility (additive; no gameplay change).
      ppGame.events.once("ready", function () {
        try {
          const cv = ppGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Percent Power Bar Model Builder math game. A percent problem " +
              "appears at the top; drag the handle, or use the left and right " +
              "arrow keys or A and D, to shade the bar to the correct percent, " +
              "then press Lock In, Enter, or Space.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>
    <script src="/assets/nt-page-enhance.js" defer></script>
    <script src="/assets/edupulse-config.js"></script>
    <script src="/assets/edupulse-bridge.js"></script>
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
    <script src="/shared/save-resume/save-resume-engine.js" defer></script>
    <!-- nsr-injected:end -->
    <!-- gfx-injected:begin (shared game polish — tools/inject-game-fx.js) -->
    <script src="/assets/game-fx.js" defer></script>
    <!-- gfx-injected:end -->
    <!-- mwb-injected:begin (Math Workbench launcher — tools/inject-math-workbench.js) -->
    <script src="/assets/math-workbench-launcher.js" defer></script>
    <!-- mwb-injected:end -->
    <!-- gacc-injected:begin (calm & accessible games — tools/inject-game-access.js) -->
  <script src="/assets/game-access.js" defer></script>
  <!-- gacc-injected:end -->
</body>
