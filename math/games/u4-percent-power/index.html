    <script>
      // Decorative spark-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("pp-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 34;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "pp-spark";
            var sz = rnd(2, 5);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" + (dx * 20).toFixed(2) + "px," + (dy * 12).toFixed(2) + "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener) reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── PERCENT POWER — BAR MODEL BUILDER ──
      // Phaser 3 — Grade 6 Math — Percent of a number, sale price, %↔decimal
      // Mechanic (math-as-mechanic, no reflex/timer): the bar IS the whole.
      // Drag the handle (or nudge ±5% with ← → / A D) to SHADE a percent, then
      // press Lock In. The percent dial shows the student's OWN shading; the
      // "part it equals" readout stays HIDDEN so the student must COMPUTE — not
      // hunt for a number to appear. Help is EARNED: after several moves or a
      // wrong lock-in, a benchmark hint appears (Tier 1), then the live part
      // readout switches on (Tier 2). A clean first-try solve scores full
      // points; a helped solve still counts but scores less and resets the
      // independent-solve streak. No-fail: after 3 tries the answer is taught
      // and play continues.
      // Difficulty rises by level: more framings (find the part → decimal →
      // find the percent → sale price).

      const W = 820,
        H = 600;
      const LS_KEY = "pp_bar_builder_highscore";
      // Percent-bar geometry in game space. Phaser Scale.FIT maps pointer
      // coordinates into this space, so drag math works at any screen size.
      const BAR_X0 = 130,
        BAR_X1 = 690,
        BAR_Y = 360,
        BAR_H = 72;
      const BAR_W = BAR_X1 - BAR_X0;
      function pctToX(p) {
        return BAR_X0 + (BAR_W * p) / 100;
      }
      function xToPct(x) {
        // Snap to 5% increments; targets are always 5% multiples → exact match.
        return Phaser.Math.Clamp(Math.round(((x - BAR_X0) / BAR_W) * 20) * 5, 0, 100);
      }

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        miss() {
          this.play("triangle", 240, 0.16, 0.12);
        },
        coin() {
          this.play("square", 1040, 0.05, 0.08);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function shuffle(a) {
        const r = [...a];
        for (let i = r.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [r[i], r[j]] = [r[j], r[i]];
        }
        return r;
      }
      function srSay(msg) {
        const el = document.getElementById("pp-sr");
        if (el) el.textContent = msg;
      }

      // ── Problem generator (bar model) ───────────────────────────────────
      // Every problem reduces to one tactile action: set the bar to a target
      // percent (a multiple of 5). Returns
      //   { kind, label, prompt, whole, targetPct, why }
      // Four framings scale with level so the same action teaches percent of a
      // number (both directions), %↔decimal, and sale price:
      //   level 1-2 : find the part   ("Shade 75% of 20")
      //   level 3   : + decimal → bar ("Shade the bar to show 0.25")
      //   level 4-5 : + find percent  ("How much of 20 is 15? Shade it.")
      //   level 6+  : + sale price    ("$20, 25% off — shade what you PAY")
      const PCTS = [10, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90];
      function pickWholeFor(pct) {
        // A whole that makes the part a whole number, kept student-friendly.
        const bases = [10, 20, 40, 50, 60, 80, 100, 200];
        const ok = bases.filter((b) => Number.isInteger((pct / 100) * b));
        return ok[randInt(0, ok.length - 1)];
      }
      function barProblem(level) {
        const pct = PCTS[randInt(0, PCTS.length - 1)];
        const whole = pickWholeFor(pct);
        const part = (pct / 100) * whole;
        const dec = String(pct / 100);
        let kind;
        if (level <= 2) kind = "part";
        else if (level === 3) kind = Math.random() < 0.6 ? "part" : "decimal";
        else if (level <= 5) {
          const r = Math.random();
          kind = r < 0.4 ? "part" : r < 0.7 ? "decimal" : "percent";
        } else {
          const r = Math.random();
          kind = r < 0.3 ? "part" : r < 0.5 ? "decimal" : r < 0.75 ? "percent" : "sale";
        }
        if (kind === "decimal")
          return {
            kind,
            targetPct: pct,
            whole,
            label: "Decimal → bar",
            prompt: "Shade the bar to show " + dec,
            why: dec + " = " + pct + "%.",
          };
        if (kind === "percent")
          return {
            kind,
            targetPct: pct,
            whole,
            label: "Find the percent",
            prompt: "How much of " + whole + " is " + part + "? Shade it.",
            why: part + " out of " + whole + " = " + pct + "%.",
          };
        if (kind === "sale") {
          const paid = 100 - pct;
          const paidVal = (paid / 100) * whole;
          return {
            kind,
            targetPct: paid,
            whole,
            label: "Sale price",
            prompt: "$" + whole + ", " + pct + "% off — shade what you PAY",
            why: pct + "% off → you pay " + paid + "% = $" + paidVal + ".",
          };
        }
        return {
          kind: "part",
          targetPct: pct,
          whole,
          label: "Find the part",
          prompt: "Shade " + pct + "% of " + whole,
          why: pct + "% of " + whole + " = " + part + ".",
        };
      }

      // ── Earned-help hint text (Tier 1). Guides the METHOD without stating the
      // numeric answer; framing-aware so each problem type gets a real strategy.
      function scaffoldHint(p) {
        const tenth = p.whole / 10;
        if (p.kind === "decimal")
          return "Turn the decimal into a percent: move the point two places right (× 100).";
        if (p.kind === "percent") {
          const part = (p.targetPct / 100) * p.whole;
          return (
            "Start with 10%: 10% of " +
            p.whole +
            " = " +
            tenth +
            ". How many 10%s make " +
            part +
            "?"
          );
        }
        if (p.kind === "sale") {
          const off = 100 - p.targetPct;
          return (
            "Off + paid = 100%. If " +
            off +
            "% is taken off, what percent do you PAY? Then shade that."
          );
        }
        return (
          "Find 10% first: 10% of " +
          p.whole +
          " = " +
          tenth +
          ", then build up to " +
          p.targetPct +
          "%."
        );
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#122413",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, VocabScene, GameScene, ResultScene],
      };

      // ── Vocab gate state (repo rule: term + Level-1 definition + image/emoji
      // shown BEFORE the first round). Shown by default; skippable only on a
      // replay within the same page session. ──
      let ppVocabSeen = false;
      // ── Run setup (this game has no level-select scene; difficulty ramps
      // in-run from a STARTING level). ✨ Auto picks that starting level from
      // past runs; ♾️ Endless removes the 10-problem cap. ──
      let ppLevel = 1; // starting level for the next run (1..8)
      let ppAuto = false; // true when ✨ Auto picked the starting level (NTAdaptive)
      let ppEndless = false; // true for endless (no auto-end) runs

      // Key words for THIS game's topic (percent of a number, sale price,
      // percent↔decimal). Each has a student-facing (Level 1) definition and an
      // emoji so a visual always shows even with no network/images.
      const PP_VOCAB = [
        {
          term: "Percent",
          emoji: "％",
          def: "A part out of 100. 25% means 25 out of every 100.",
        },
        {
          term: "Percent of a number",
          emoji: "🔢",
          def: "How big a part is. 50% of 20 is half of 20, which is 10.",
        },
        {
          term: "Discount",
          emoji: "🏷️",
          def: "Money taken OFF a price in a sale. 20% off means you pay less.",
        },
        {
          term: "Sale price",
          emoji: "💲",
          def: "The price you pay AFTER the discount is taken off.",
        },
        {
          term: "Equivalent decimal",
          emoji: "🟰",
          def: "The same value written as a decimal. 25% is the same as 0.25.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0xffe07a);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x122413);
        this.add
          .text(cx, 120, "PERCENT POWER", {
            fontFamily: "Impact, sans-serif",
            fontSize: "64px",
            color: "#ffd24a",
            stroke: "#0a160b",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 175, "Bar Model Builder", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            color: "#8fd6a0",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            230,
            "Shade the bar to BUILD the answer. Drag the handle (or use\n← →) to set the percent, then Lock In! Stuck? Keep trying —\nhints appear to help you solve it.",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#bfe0c8",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 295, "Drag or ← → / A·D by 5% · 6.AT.4 · Lessons 4.1–4.5", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#7fae8c",
          })
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 330, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#ffd24a",
              fontStyle: "bold",
            })
            .setOrigin(0.5);

        const btn = this.add
          .rectangle(cx, 400, 240, 58, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "START ▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.tweens.add({
          targets: [btn, btnT],
          scaleX: 1.05,
          scaleY: 1.05,
          duration: 800,
          yoyo: true,
          repeat: -1,
        });
        const start = () => {
          SFX.init();
          SFX.coin();
          // Manual START = a fresh Level-1 run (adaptive off).
          ppLevel = 1;
          ppAuto = false;
          ppEndless = false;
          // Show the vocab gate before the first round; on a replay (already
          // seen this session) jump straight to the game.
          this.scene.start(ppVocabSeen ? "Game" : "Vocab");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x36a35b));
        btn.on("pointerout", () => btn.setFillStyle(0x2d874b));
        btn.on("pointerdown", start);
        this.input.keyboard.on("keydown-SPACE", start);
        this.input.keyboard.on("keydown-ENTER", start);

        // ✨ Auto: let the shared adaptive helper pick a STARTING level from
        // past runs. Geometry-safe — this game makes one problem at a time, so
        // Auto only chooses where the difficulty ramp begins (1..8).
        const pickAuto = () => {
          SFX.init();
          SFX.coin();
          const lv = window.NTAdaptive ? window.NTAdaptive.pickLevel("u4-percent-power", 1, 8) : 1;
          ppLevel = lv;
          ppAuto = true;
          ppEndless = false;
          this.scene.start(ppVocabSeen ? "Game" : "Vocab");
        };
        const autoBtn = this.add
          .text(cx, 460, "✨ Auto — picks your start level", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            fontStyle: "bold",
            color: "#ffd24a",
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        autoBtn.on("pointerover", () => autoBtn.setColor("#ffffff"));
        autoBtn.on("pointerout", () => autoBtn.setColor("#ffd24a"));
        autoBtn.on("pointerdown", pickAuto);
        this.input.keyboard.on("keydown-A", pickAuto);

        srSay("Percent Power Bar Model Builder. Press Start to play.");
      };

      // ── VOCAB GATE ──
      // Repo rule: term + Level-1 definition + image/emoji shown BEFORE play.
      // One card per key word; Back / Next; last card starts the game. No
      // answers or giveaways are shown here — only the vocabulary.
      function VocabScene() {
        Phaser.Scene.call(this, "Vocab");
      }
      VocabScene.prototype = Object.create(Phaser.Scene.prototype);
      VocabScene.prototype.constructor = VocabScene;
      VocabScene.prototype.init = function () {
        this.idx = 0;
      };
      VocabScene.prototype.create = function () {

      // ── GAME ──
      function GameScene() {

      GameScene.prototype = Object.create(Phaser.Scene.prototype);

      GameScene.prototype.init = function () {

        this.locked = false;

        this.moves = 0; // adjustments on the current problem (help trigger)
        this.wrongThisProblem = 0;
        this.scaffoldTier = 0; // 0 none · 1 benchmark hint · 2 live part readout

            color: "#7fae8c",
          })
          .setOrigin(0.5);
        this.bannerText = this.add
          .text(W / 2, 110, "", {
            fontFamily: "Segoe UI, sans-serif",

            color: "#ffffff",
            align: "center",
            wordWrap: { width: W - 80 },

          .text(W / 2, 168, "", {

        this.add

          })

        // Handle (large touch target) + knob
        this.handle = this.add
          .rectangle(pctToX(50), BAR_Y, 14, BAR_H + 30, 0xffe07a)

          .setStrokeStyle(3, 0xb87b1d)

        this.lockBtn = this.add

        this.lockBtn.on("pointerout", () => this.lockBtn.setFillStyle(0x2d874b));
        this.lockBtn.on("pointerdown", () => this.lockIn());

        // Hint
        this.add
          .text(
            W / 2,

            "Drag the handle or press ← → (A·D) to adjust by 5%. Enter = lock in.",

        // Particles (reused from the shell)
        this.burst = this.add
          .particles(0, 0, "spark", {

            scale: { start: 1.2, end: 0 },
            lifespan: 600,
            emitting: false,
            quantity: 16,
            tint: [0xffd24a, 0x8fd6a0, 0xffffff],
          })
          .setDepth(20);

        // Input: drag on the bar band; arrows / A·D nudge ±5%; Enter/Space lock.
        const inBand = (y) => Math.abs(y - BAR_Y) <= BAR_H / 2 + 40;
        this.input.on("pointerdown", (p) => {
          if (this.locked) return;
          if (inBand(p.y)) {
            this.dragging = true;
            this.registerMove();
            this.setMarker(xToPct(p.x));
          }
        });
        this.input.on("pointermove", (p) => {
          if (this.dragging && !this.locked) this.setMarker(xToPct(p.x));
        });
        this.input.on("pointerup", () => {
          this.dragging = false;
        });
        const nudge = (d) => {
          if (this.locked) return;
          this.registerMove();
          this.setMarker(this.markerPct + d);
          SFX.coin();
        };
        this.input.keyboard.on("keydown-LEFT", () => nudge(-5));
        this.input.keyboard.on("keydown-RIGHT", () => nudge(5));
        this.input.keyboard.on("keydown-A", () => nudge(-5));
        this.input.keyboard.on("keydown-D", () => nudge(5));
        this.input.keyboard.on("keydown-ENTER", () => this.lockIn());
        this.input.keyboard.on("keydown-SPACE", () => this.lockIn());

        this.cameras.main.fadeIn(400);
        this.newProblem();

      GameScene.prototype.setMarker = function (pct) {
        this.markerPct = Phaser.Math.Clamp(pct, 0, 100);
        const x = pctToX(this.markerPct);
        this.fill.width = (BAR_W * this.markerPct) / 100;
        this.handle.x = x;
        this.knob.x = x;
        this.pctReadout.setText(this.markerPct + "%");
        // The part readout is EARNED — only shown once the Tier-2 scaffold
        // unlocks, so students compute the part instead of hunting for it.
        if (this.problem && this.scaffoldTier >= 2) {
          const part = (this.problem.whole * this.markerPct) / 100;
          const partStr = Number.isInteger(part) ? String(part) : part.toFixed(1);
          this.partReadout.setText("= " + partStr + " of " + this.problem.whole);
        } else {
          this.partReadout.setText("");
        }
      };

      // ── Earned help ─────────────────────────────────────────────────────
      // Each adjustment on the current problem is a "move." After enough moves
      // (or a wrong lock-in) the scaffold ladder unlocks — help, not answers.
      GameScene.prototype.registerMove = function () {
        if (this.locked) return;
        this.moves += 1;
        if (this.moves === 6) this.setScaffold(1);
        else if (this.moves === 12) this.setScaffold(2);
      };

      GameScene.prototype.setScaffold = function (tier) {
        if (!this.problem || tier <= this.scaffoldTier) return;
        this.scaffoldTier = tier;
        this.usedHelp = true;
        const hint = scaffoldHint(this.problem);
        const note = tier >= 2 ? "  ·  Now watch the part update as you move." : "";
        this.hintText.setText("💡 " + hint + note).setAlpha(1);
        // Tier 2 switches on the live part readout (refresh to populate it).
        if (tier >= 2) this.setMarker(this.markerPct);
        srSay("Hint: " + hint);
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        this.moves = 0;
        this.wrongThisProblem = 0;
        this.scaffoldTier = 0;
        this.usedHelp = false;
        if (this.hintText) this.hintText.setAlpha(0).setText("");
        this.problem = barProblem(this.level);
        this.bannerLabel.setText(this.problem.label);
        this.bannerText.setText(this.problem.prompt);
        this.endR.setText(String(this.problem.whole));
        this.fill.setFillStyle(0x2d874b);
        // Start empty (0%) every problem so the student always builds up to the
        // target — starting at 50% pre-solved any 50% problem with no movement.
        this.setMarker(0);
        srSay(
          this.problem.label +
            ": " +
            this.problem.prompt +
            ". Drag the handle to shade your answer, then lock it in.",
        );
      };

      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        this.locked = true;
        this.attempts += 1;
        const correct = this.markerPct === this.problem.targetPct;
        if (correct) {
          SFX.good();
          this.solved++;
          this.fill.setFillStyle(0x36a35b);
          this.burst.setPosition(pctToX(this.markerPct), BAR_Y);
          this.burst.explode(16);
          if (this.usedHelp) {
            // Solved with a scaffold (or after a wrong try): still a win, fewer
            // points, and the independent-solve streak resets.
            this.streak = 0;
            this.score += 10;
            this.flash(W / 2, 200, "You worked it out! ✓", "#8fd6a0");
            this.feedback.setText("Nice — you got it. " + this.problem.why).setAlpha(1);
            srSay("Correct with help. " + this.problem.why);
          } else {
            // Clean first-try solve with no help — full points + streak bonus.
            this.streak++;
            const bonus = Math.min(this.streak, 5) * 5;
            this.score += 20 + bonus;
            this.flash(W / 2, 200, "Correct! ✓", "#8fd6a0");
            this.feedback.setText("Correct! " + this.problem.why).setAlpha(1);
            srSay("Correct. " + this.problem.why);
          }
          this.hintText.setAlpha(0);
          this.afterAttempt(true);
        } else {
          SFX.bad();
          this.wrongThisProblem += 1;
          this.usedHelp = true;
          this.streak = 0;
          if (this.wrongThisProblem >= 3) {
            // No-fail last resort: after 3 tries, teach the answer and move on.
            this.fill.setFillStyle(0xd4952a);
            this.feedback.setText("Here's how it works — " + this.problem.why).setAlpha(1);
            srSay("The answer. " + this.problem.why);
            const ghost = this.add
              .rectangle(
                BAR_X0,
                BAR_Y,
                (BAR_W * this.problem.targetPct) / 100,
                BAR_H,
                0x8fd6a0,
                0.35,
              )
              .setOrigin(0, 0.5)
              .setDepth(5);
            this.tweens.add({
              targets: [this.handle, this.knob],
              x: pctToX(this.problem.targetPct),
              duration: this.reduceMotion ? 0 : 600,
              onComplete: () => {
                ghost.destroy();
                this.hintText.setAlpha(0);
                this.afterAttempt(false);
              },
            });
          } else {
            // Wrong, but they keep the SAME problem — unlock a hint and let them
            // try again. Calm amber blip, no lost hearts, no answer reveal.
            this.setScaffold(this.wrongThisProblem === 1 ? 1 : 2);
            this.fill.setFillStyle(0xd4952a);
            this.feedback.setText("Not quite — try again.").setAlpha(1);
            srSay("Not quite. Try again with the hint.");
            this.updateHUD();
            this.locked = false;
            this.time.delayedCall(700, () => {
              this.feedback.setAlpha(0);
              this.fill.setFillStyle(0x2d874b);
            });
          }
        }
      };

      GameScene.prototype.afterAttempt = function (correct) {
        // Level up every 3 correct, ramping from this run's starting level.
        const newLevel = Math.min(8, this.startLevel + Math.floor(this.solved / 3));
        if (newLevel > this.level) {
          this.level = newLevel;
          SFX.level();
          this.flash(W / 2, 200, "LEVEL " + this.level + "!", "#ffd24a");
        }
        this.updateHUD();
        if (this.solved >= this.target) {
          this.endGame();
          return;
        }
        this.time.delayedCall(900, () => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.flash = function (x, y, text, color) {
        const ft = this.add
          .text(x, y, text, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            fontStyle: "bold",
            color: color,
            stroke: "#0a160b",
            strokeThickness: 4,
          })
          .setOrigin(0.5)
          .setDepth(40);
        this.tweens.add({
          targets: ft,
          y: y - 50,
          alpha: { from: 1, to: 0 },
          duration: this.reduceMotion ? 500 : 900,
          onComplete: () => ft.destroy(),
        });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText("Level " + this.level);
        this.progressText.setText(this.solved + " / " + (this.endless ? "∞" : this.target));
      };

      // Reached only by solving all target problems (mistakes never end the
      // game), so the Result scene is always a win.
      GameScene.prototype.endGame = function () {
        this.locked = true;
        this.time.delayedCall(500, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            level: this.level,
            auto: this.auto,
            endless: this.endless,
            accuracy: this.attempts ? this.solved / this.attempts : 1,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x122413);
        // Endless runs (or an early Finish) have no finite target; grade against
        // the standard goal of 10 so stars and the adaptive win-signal stay
        // meaningful. A normal run still ends only at solved == target → 3 stars.
        const endless = !!d.endless;
        const goal = endless ? 10 : d.target;
        const stars = d.solved >= goal ? 3 : d.solved >= goal * 0.6 ? 2 : 1;
        // Adaptive: only record a run when the level was auto-picked.
        if (d.auto && window.NTAdaptive) {
          window.NTAdaptive.recordRun("u4-percent-power", {
            won: d.solved >= goal,
            accuracy: d.accuracy != null ? d.accuracy : 1,
            min: 1,
            max: 8,
          });
        }
        // High score
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        if (d.score > hs) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }

        this.add
          .text(cx, 110, "CITY OF SAVINGS!", {
            fontFamily: "Impact, sans-serif",
            fontSize: "48px",
            color: "#8fd6a0",
            stroke: "#0a160b",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        const starStr = "★".repeat(stars) + "☆".repeat(3 - stars);
        this.add
          .text(cx, 185, starStr, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "48px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);

        this.add
          .text(cx, 255, "Score: " + d.score, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "30px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            295,
            endless
              ? "Solved " + d.solved + " problems"
              : "Solved " + d.solved + " of " + d.target + " problems",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "18px",
              color: "#bfe0c8",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 325, "High Score: " + hs, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);

        SFX.win();

        // EduPulse reporting (guarded; safe no-op without bridge).
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.score,
              stars: stars,
              standard: "6.AT.4",
              problemsAttempted: d.solved,
            });
        } catch (e) {}
        srSay("You won! Final score " + d.score + ", " + stars + " stars.");

        const btn = this.add
          .rectangle(cx, 400, 220, 54, 0x2d874b)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "PLAY AGAIN 🔁", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const again = () => {
          // Fresh Level-1 run (adaptive off), same as today's replay.
          ppLevel = 1;
          ppAuto = false;
          ppEndless = false;
          this.scene.start("Game");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x36a35b));
        btn.on("pointerout", () => btn.setFillStyle(0x2d874b));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        // ♾️ Keep Playing: restart the Game at the SAME level in endless mode
        // (carries the auto flag so adaptive still records the endless run).
        const keepBtn = this.add
          .rectangle(cx, 466, 240, 48, 0x2563a8)
          .setStrokeStyle(2, 0x7dd3fc)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx, 466, "♾️ Keep Playing", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        const keepPlaying = () => {
          ppLevel = d.level;
          ppEndless = true;
          ppAuto = d.auto;
          this.scene.start("Game");
        };
        keepBtn.on("pointerover", () => keepBtn.setFillStyle(0x2f74c2));
        keepBtn.on("pointerout", () => keepBtn.setFillStyle(0x2563a8));
        keepBtn.on("pointerdown", keepPlaying);
      };

      // ── Launch ──
      const ppGame = new Phaser.Game(config);

      // Canvas accessibility (additive; no gameplay change).
      ppGame.events.once("ready", function () {
        try {
          const cv = ppGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Percent Power Bar Model Builder math game. A percent problem " +
              "appears at the top; drag the handle, or use the left and right " +
              "arrow keys or A and D, to shade the bar to the correct percent, " +
              "then press Lock In, Enter, or Space.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>

  <script>
    (function() {
      window.ewlShowMasteryModal = function(opts) {
        opts = opts || {};
        const score = opts.score || 0;
        const maxScore = opts.maxScore || 1000;
        const stars = opts.stars || (score >= maxScore * 0.8 ? 3 : score >= maxScore * 0.5 ? 2 : 1);
        const accuracy = opts.accuracy != null ? opts.accuracy : Math.min(100, Math.round((score / Math.max(1, maxScore)) * 100));
        const gameTitle = opts.title || "Unit Game Complete!";
        const nextUrl = opts.nextUrl || "/math/games/";

        const starStr = "⭐".repeat(stars) + "☆".repeat(3 - stars);
        
        const modalHtml = `
          <div class="ewl-mastery-overlay" id="ewl-mastery-modal">
            <div class="ewl-mastery-card">
              <div class="ewl-mastery-stars">${starStr}</div>
              <h2 class="ewl-mastery-title">${gameTitle}</h2>
              <p class="ewl-mastery-subtitle">Grade 6 Math Review Mastery Achieved!</p>
              <div class="ewl-mastery-stats">
                <div class="ewl-stat-box">
                  <div class="ewl-stat-num">${score}</div>
                  <div class="ewl-stat-lbl">Final Score</div>
                </div>
                <div class="ewl-stat-box">
                  <div class="ewl-stat-num">${accuracy}%</div>
                  <div class="ewl-stat-lbl">Accuracy</div>
                </div>
              </div>
              <div class="ewl-mastery-actions">
                <button class="ewl-mastery-btn ewl-btn-secondary" onclick="location.reload()">🔄 Play Again</button>
                <button class="ewl-mastery-btn ewl-btn-primary" onclick="location.href='${nextUrl}'">🎮 More Games</button>
              </div>
            </div>
          </div>
        `;
        const existing = document.getElementById("ewl-mastery-modal");
        if (existing) existing.remove();
        document.body.insertAdjacentHTML("beforeend", modalHtml);
        
        if (window.GameFX && window.GameFX.AudioSynth) {
          try { window.GameFX.AudioSynth.playSuccess(); } catch(e){}
        }
        if (window.GameFX && window.GameFX.burst) {
          try { window.GameFX.burst(window.innerWidth / 2, window.innerHeight / 3); } catch(e){}
        }
      };
    })();
