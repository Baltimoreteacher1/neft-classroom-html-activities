  <head>

    <meta
      name="description"
      content="A calm build-it math game for Grade 6 ratios (6.RP.3): line up two number lines so the pair stays in ratio. Slide the knob to fill a missing value, build a full equivalent ratio, or find the unit rate — then Lock In. A live readout shows your ratio and whether it is equivalent."
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0c2a2e;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      canvas {
        display: block;
        margin: 0 auto;

        z-index: 1;

      canvas:focus-visible {
        outline: 3px solid #6be0c0;

      #rr-bg {
        position: fixed;

        position: absolute;

      }
      .rr-spark {
        position: absolute;
        border-radius: 50%;

        animation: rrTwinkle var(--tw, 3s) ease-in-out infinite;
      }
      @keyframes rrTwinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.8);
        }
        50% {
          opacity: 0.75;
          transform: scale(1.2);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #rr-bg-layer {
          transition: none !important;
          transform: none !important;
        }
        .rr-spark {
          animation: none !important;
          opacity: 0.4 !important;
        }
      }
      #rr-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;

        border: 0;
      }

  <body>
    <!-- Decorative animated spark-field (behind the Phaser canvas). -->
    <div id="rr-bg" data-parallax aria-hidden="true">
      <div id="rr-bg-layer" data-parallax-layer></div>
    </div>
    <!-- Screen-reader live region: mirrors the current problem + result. -->
    <div id="rr-sr" role="status" aria-live="polite"></div>
    <script>
      // Decorative spark-field builder (reduced-motion safe; pointer-neutral).
      (function () {
        "use strict";
        var reduceMQ =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("rr-bg-layer");
        if (!layer) return;
        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }
        function build() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var n = reduce ? 16 : 34;
          for (var i = 0; i < n; i++) {
            var s = document.createElement("div");
            s.className = "rr-spark";
            var sz = rnd(2, 5);
            s.style.width = s.style.height = sz.toFixed(1) + "px";
            s.style.left = rnd(0, 100).toFixed(2) + "%";
            s.style.top = rnd(0, 100).toFixed(2) + "%";
            s.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            s.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(s);
          }
        }
        build();
        var driver = false;
        function onMove(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" +
            (dx * 20).toFixed(2) +
            "px," +
            (dy * 12).toFixed(2) +
            "px,0)";
        }
        function attach() {
          if (driver || (reduceMQ && reduceMQ.matches)) return;
          driver = true;
          window.addEventListener("pointermove", onMove, { passive: true });
        }
        function detach() {
          if (!driver) return;
          driver = false;
          window.removeEventListener("pointermove", onMove);
          layer.style.transform = "";
        }
        attach();
        if (reduceMQ) {
          var onChange = function () {
            build();
            if (reduceMQ.matches) detach();
            else attach();
          };
          if (reduceMQ.addEventListener)
            reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
    <script>
      // ── RATIO RUSH — DOUBLE NUMBER LINE ──
      // Phaser 3 — Grade 6 Math — Equivalent ratios, ratio tables, unit rate.
      // Mechanic (math-as-mechanic, no reflex/timer): TWO aligned number lines
      // are the ratio table. A base ratio a:b is given; you slide a knob (snaps
      // to whole ticks) on one line so the live pair STAYS in the ratio. A live
      // readout shows the current ratio c:d and whether it is equivalent
      // (a·d = b·c by cross-multiply). Lock In commits. A wrong lock-in (wrong
      // MATH, not slow reflexes) costs a life and the knob glides to the correct
      // spot — a green ghost marker shows the right value — so it teaches.
      // Levels raise the framing: fill ONE missing value → build a FULL
      // equivalent ratio (both knobs) → find the UNIT RATE (per 1). Whole,
      // friendly numbers only; every value lives on a 0–10 line.

      const W = 820,
        H = 600;
      const LS_KEY = "rr_double_number_line_highscore";
      // Number-line geometry in game space. Phaser Scale.FIT maps pointer
      // coordinates into this space, so drag math works at any screen size.
      const LINE_X0 = 150,
        LINE_X1 = 710,
        TOP_Y = 320,
        BOT_Y = 430;
      const LW = LINE_X1 - LINE_X0;
      const MAXV = 10; // both lines run 0…10, one tick per whole number
      function tickX(v) {
        return LINE_X0 + (LW * v) / MAXV;
      }
      function xToVal(x) {
        // Snap to whole-number ticks; all targets are whole numbers ≤ 10.
        return Phaser.Math.Clamp(
          Math.round(((x - LINE_X0) / LW) * MAXV),
          0,
          MAXV,
        );
      }

      // ── Audio (tiny WebAudio blips; gracefully no-op without a context) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (
                window.AudioContext || window.webkitAudioContext
              )();
            } catch (e) {}
        },
        play(t, f, d, v = 0.18) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        good() {
          this.play("sine", 660, 0.1, 0.25);
          this.play("sine", 880, 0.14, 0.2);
        },
        bad() {
          this.play("sawtooth", 200, 0.25, 0.18);
          this.play("sawtooth", 150, 0.3, 0.14);
        },
        miss() {
          this.play("triangle", 240, 0.16, 0.12);
        },
        coin() {
          this.play("square", 1040, 0.05, 0.08);
        },
        level() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.25), i * 110),
          );
        },
        lose() {
          [400, 330, 260, 200].forEach((f, i) =>
            setTimeout(() => this.play("sawtooth", f, 0.3, 0.14), i * 170),
          );
        },
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function pick(arr) {
        return arr[randInt(0, arr.length - 1)];
      }
      function srSay(msg) {
        const el = document.getElementById("rr-sr");
        if (el) el.textContent = msg;
      }

      // Resolve the shared game-feel layer; provide safe no-op fallbacks so the
      // game still runs if /assets/game-juice.js failed to load.
      const JUICE = window.GameJuice || {
        reduceMotion: false,
        audio: {
          unlock() {},
          correct() {},
          wrong() {},
          fanfare() {},
        },
        burst() {},
        confetti() {},
        shake() {},
        floatText() {},
        award() {},
      };

      // ── Problem generator (double number line) ──────────────────────────
      // Every problem reduces to one tactile action: slide a knob so the live
      // pair on the two number lines is equivalent to a base ratio a:b. Three
      // framings scale with level (all whole numbers, every value ≤ 10):
      //   "one"  : fill ONE missing value — top locked at c (a multiple of a),
      //            slide the bottom knob to the matching d.
      //   "full" : build a FULL equivalent ratio different from a:b — both knobs.
      //   "unit" : find the UNIT RATE — top locked at 1, slide bottom to b÷a.
      const CONTEXTS = [
        { a: "cups berry", b: "cups mango" },
        { a: "miles", b: "minutes" },
        { a: "dollars", b: "tickets" },
        { a: "red beads", b: "blue beads" },
        { a: "scoops", b: "cups water" },
        { a: "apples", b: "oranges" },
      ];
      // Base ratios with both terms ≤ 5 (so doubling stays ≤ 10).
      const BASE_POOL = [
        [1, 2],
        [2, 3],
        [3, 4],
        [2, 5],
        [1, 3],
        [3, 5],
        [4, 5],
        [1, 4],
        [2, 1],
        [3, 2],
        [4, 3],
      ];
      // Unit-rate bases need b divisible by a (so b÷a is a whole number), both
      // terms ≤ 10 (the number line is 0–10), and a > 1 so the unit rate b÷a is
      // NOT already equal to the start value b — the student must actually
      // divide and move the knob (a = 1 would leave the answer pre-placed).
      const UNIT_POOL = [
        [2, 4],
        [2, 6],
        [2, 8],
        [2, 10],
        [3, 6],
        [3, 9],
        [4, 8],
        [5, 10],
      ];

      // Track 1 (support): stay on "fill one missing value" with small ratios,
      // easing into unit rate late. Track 2 (enrichment): build full equivalent
      // ratios and find unit rates from the start.
      function kindForTrack(track, level) {
        if (track === 1) return level <= 4 ? "one" : "unit";
        if (level <= 2) return "full";
        if (level <= 4) return "unit";
        return "full";
      }

      function makeProblem(level, track) {
        const kind = kindForTrack(track, level);
        const ctx = pick(CONTEXTS);
        if (kind === "unit") {
          const [a, b] = pick(UNIT_POOL);
          const d = b / a; // whole-number unit rate
          return {
            kind,
            a,
            b,
            nameA: ctx.a,
            nameB: ctx.b,
            topFixed: 1, // top knob locked at 1
            botFixed: null, // bottom knob is the action
            startTop: 1,
            startBot: b, // start at the base value (not the answer)
            targetTop: 1,
            targetBot: d,
            label: "Find the unit rate",
            prompt:
              "Ratio is " +
              a +
              " " +
              ctx.a +
              " : " +
              b +
              " " +
              ctx.b +
              ". Slide the bottom knob to show how many " +
              ctx.b +
              " for 1 " +
              ctx.a +
              ".",
            why:
              a +
              ":" +
              b +
              " = 1:" +
              d +
              ", so " +
              d +
              " " +
              ctx.b +
              " per 1 " +
              ctx.a +
              ".",
          };
        }
        if (kind === "full") {
          const [a, b] = pick(BASE_POOL);
          return {
            kind,
            a,
            b,
            nameA: ctx.a,
            nameB: ctx.b,
            topFixed: null,
            botFixed: null,
            startTop: a, // both movable; start on the base (must change it)
            startBot: Math.min(MAXV, b + 1),
            targetTop: 2 * a, // a worked example for teaching
            targetBot: 2 * b,
            label: "Build an equivalent ratio",
            prompt:
              "Move BOTH knobs to build a DIFFERENT ratio that is equal to " +
              a +
              ":" +
              b +
              " (" +
              ctx.a +
              " : " +
              ctx.b +
              ").",
            why: a + ":" + b + " = " + 2 * a + ":" + 2 * b + " (×2).",
          };
        }
        // kind === "one"
        let a, b, k;
        do {
          [a, b] = pick(BASE_POOL);
          k = pick([2, 3]);
        } while (a * k > MAXV || b * k > MAXV);
        const c = a * k,
          d = b * k;
        return {
          kind,
          a,
          b,
          nameA: ctx.a,
          nameB: ctx.b,
          topFixed: c, // top locked at the multiple
          botFixed: null, // bottom knob is the action
          startTop: c,
          startBot: b, // start on the base value (not the answer)
          targetTop: c,
          targetBot: d,
          label: "Fill the missing value",
          prompt:
            "Keep the ratio " +
            a +
            ":" +
            b +
            ". The top shows " +
            c +
            " " +
            ctx.a +
            " — slide the bottom knob to the matching " +
            ctx.b +
            ".",
          why: a + ":" + b + " = " + c + ":" + d + " (×" + k + ").",
        };
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0c2a2e",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [
          BootScene,
          TitleScene,
          VocabScene,
          PickScene,
          GameScene,
          ResultScene,
        ],
      };

      // Chosen difficulty track: 1 = support, 2 = enrichment. Set on PickScene
      // before every run; drives the problem generator and on-screen scaffolding.
      let rrTrack = 1;

      // ── Vocab gate state (repo rule: term + Level-1 definition + image/emoji
      // shown BEFORE the first round). Shown by default; skippable only on a
      // replay within the same page session. ──
      let rrVocabSeen = false;

      // Key words for THIS game's topic (ratios). Each has a student-facing
      // (Level 1) definition and an emoji so a visual always shows even with no
      // network/images.
      const RR_VOCAB = [
        {
          term: "Ratio",
          emoji: "⚖️",
          def: "A way to compare two amounts. 2:3 means 2 of one thing for every 3 of another.",
        },
        {
          term: "Rate",
          emoji: "🚗",
          def: "A ratio that compares two different units, like miles to minutes.",
        },
        {
          term: "Equivalent ratio",
          emoji: "🟰",
          def: "A ratio equal to another. 2:3 and 4:6 are equivalent — same comparison.",
        },
        {
          term: "Per",
          emoji: "➗",
          def: "“For each one.” 3 cups per 1 scoop means 3 cups for every 1 scoop.",
        },
        {
          term: "Unit rate",
          emoji: "1️⃣",
          def: "How much you get for just 1. If 2 cost $6, the unit rate is $3 per 1.",
        },
      ];

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0xffffff);
        g.fillCircle(4, 4, 4);
        g.generateTexture("dot", 8, 8);
        g.clear();
        g.fillStyle(0x8ff0d8);
        g.fillCircle(5, 5, 5);
        g.generateTexture("spark", 10, 10);
        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0c2a2e);
        this.add
          .text(cx, 120, "RATIO RUSH", {
            fontFamily: "Impact, sans-serif",
            fontSize: "64px",
            color: "#6be0c0",
            stroke: "#06201f",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 175, "Double Number Line", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            color: "#9fe6cf",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            232,
            "Line up the two number lines so the pair stays in ratio.\nSlide the knob (or use ← →), watch the live readout, then Lock In!",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#bfe6da",
              align: "center",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 295, "Drag or ← → / A·D · 6.RP.3 · Lessons 3.1–3.5", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#7fc4b3",
          })
          .setOrigin(0.5);

        const hs = localStorage.getItem(LS_KEY);
        if (hs)
          this.add
            .text(cx, 330, "High Score: " + hs, {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "16px",
              color: "#ffd24a",
              fontStyle: "bold",
            })
            .setOrigin(0.5);

        const btn = this.add
          .rectangle(cx, 400, 240, 58, 0x1f8a6b)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "START ▶", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "24px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.tweens.add({
          targets: [btn, btnT],
          scaleX: 1.05,
          scaleY: 1.05,
          duration: 800,
          yoyo: true,
          repeat: -1,
        });
        const start = () => {
          SFX.init();
          SFX.coin();
          JUICE.audio.unlock();
          // Show the vocab gate before the first round; on a replay (already
          // seen this session) jump straight to the level picker.
          this.scene.start(rrVocabSeen ? "Pick" : "Vocab");
        };
        btn.on("pointerover", () => btn.setFillStyle(0x27a883));
        btn.on("pointerout", () => btn.setFillStyle(0x1f8a6b));
        btn.on("pointerdown", start);
        this.input.keyboard.on("keydown-SPACE", start);
        this.input.keyboard.on("keydown-ENTER", start);

        const hub = this.add
          .text(cx, 540, "← Back to Math Games", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#7fc4b3",
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        hub.on("pointerover", () => hub.setColor("#ffd24a"));
        hub.on("pointerout", () => hub.setColor("#7fc4b3"));
        hub.on("pointerdown", () => (window.location.href = "/math/games/"));
        srSay("Ratio Rush Double Number Line. Press Start to play.");
      };

      // ── VOCAB GATE ──
      // Repo rule: term + Level-1 definition + image/emoji shown BEFORE play.
      function VocabScene() {
        Phaser.Scene.call(this, "Vocab");
      }
      VocabScene.prototype = Object.create(Phaser.Scene.prototype);
      VocabScene.prototype.constructor = VocabScene;
      VocabScene.prototype.init = function () {
        this.idx = 0;
      };
      VocabScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0c2a2e);
        this.add
          .text(cx, 70, "WORDS TO KNOW FIRST", {
            fontFamily: "Impact, sans-serif",
            fontSize: "34px",
            color: "#6be0c0",
            stroke: "#06201f",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        // Card surface.
        this.add
          .rectangle(cx, 320, 560, 320, 0x0a3338)
          .setStrokeStyle(2, 0x1f8a6b);

        this.stepText = this.add
          .text(cx, 185, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            fontStyle: "bold",
            color: "#7fc4b3",
          })
          .setOrigin(0.5);
        this.emojiText = this.add
          .text(cx, 250, "", { fontSize: "76px" })
          .setOrigin(0.5);
        this.termText = this.add
          .text(cx, 330, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "32px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.defText = this.add
          .text(cx, 400, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "18px",
            color: "#bfe6da",
            align: "center",
            wordWrap: { width: 500 },
          })
          .setOrigin(0.5);

      VocabScene.prototype.renderCard = function () {

      // ── GAME ──
      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function () {
        this.reduceMotion = !!(
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
        this.track = rrTrack; // 1 = support, 2 = enrichment
        this.score = 0;
        this.lives = 3;
        this.streak = 0;
        this.level = 1;
        this.solved = 0; // problems answered correctly
        this.target = 10; // win condition: solve this many problems
        this.problem = null;
        this.locked = false;
        this.dragging = null; // "top" | "bottom" | null
        this.topVal = 0;
        this.botVal = 0;
        this.active = "bottom"; // keyboard-active line
      };

      GameScene.prototype.create = function () {
        this.add.rectangle(W / 2, H / 2, W, H, 0x0c2a2e);

        // HUD (same layout as the shell's other games)
        const hudStyle = {

        this.streakText = this.add
          .text(W - 16, 12, "Streak: 0", { ...hudStyle, color: "#ffd24a" })

        this.levelText = this.add
          .text(

            36,

          )

        this.progressText = this.add
          .text(W / 2, 12, "0 / " + this.target, {

          })

            fontFamily: "Segoe UI, sans-serif",
            fontSize: "14px",
            color: "#7fc4b3",
          })
          .setOrigin(0.5);
        this.bannerText = this.add
          .text(W / 2, 102, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "19px",
            fontStyle: "bold",
            color: "#ffffff",
            align: "center",
            wordWrap: { width: W - 90 },
          })
          .setOrigin(0.5);

        this.feedback = this.add
          .text(W / 2, 160, "", {

            fontStyle: "bold",

            stroke: "#06201f",
            strokeThickness: 3,
            align: "center",
            wordWrap: { width: W - 90 },
          })
          .setOrigin(0.5)
          .setAlpha(0);

        // Live readout — the heart of the mechanic: the current ratio and an
        // equivalence chip, both updating as a knob moves.
        this.ratioReadout = this.add
          .text(W / 2, 205, "0 : 0", {
            fontFamily: "Impact, sans-serif",
            fontSize: "50px",
            color: "#ffd24a",
            stroke: "#06201f",
            strokeThickness: 5,
          })
          .setOrigin(0.5);
        this.chipBg = this.add
          .rectangle(W / 2, 250, 240, 30, 0x163f44)
          .setStrokeStyle(2, 0x1f8a6b);
        this.chipText = this.add
          .text(W / 2, 250, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            fontStyle: "bold",
            color: "#bfe6da",
          })
          .setOrigin(0.5);

        // ── Two number lines (top + bottom) ──
        this.buildLine(TOP_Y, "top");
        this.buildLine(BOT_Y, "bottom");

        // Lock-in button
        this.lockBtn = this.add
          .rectangle(W / 2, 505, 240, 52, 0x1f8a6b)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(W / 2, 505, "LOCK IN ✓", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "22px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.lockBtn.on("pointerover", () =>
          this.lockBtn.setFillStyle(0x27a883),
        );
        this.lockBtn.on("pointerout", () =>
          this.lockBtn.setFillStyle(0x1f8a6b),
        );
        this.lockBtn.on("pointerdown", () => this.lockIn());

        // Hint
        this.add
          .text(
            W / 2,
            550,
            "Drag a knob or press ← → (A·D) to move by 1. ↑ ↓ switch lines. Enter = lock in.",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "13px",
              color: "#7fc4b3",
              align: "center",
            },
          )
          .setOrigin(0.5);

        // Support-track scaffold tip (extra help on Level 1 only).
        if (this.track === 1) {
          this.add
            .text(
              W / 2,
              572,
              "Tip: the glowing dots show the starting ratio — keep your pair equal to it.",
              {
                fontFamily: "Segoe UI, sans-serif",
                fontSize: "12px",
                color: "#8ff0d8",
                align: "center",
              },
            )
            .setOrigin(0.5);
        }

        // Particles + red flash (reused from the shell)
        this.burst = this.add
          .particles(0, 0, "spark", {
            speed: { min: 80, max: 240 },
            angle: { min: 0, max: 360 },
            scale: { start: 1.2, end: 0 },
            lifespan: 600,
            emitting: false,
            quantity: 16,
            tint: [0xffd24a, 0x8ff0d8, 0xffffff],
          })
          .setDepth(20);
        this.redFlash = this.add
          .rectangle(W / 2, H / 2, W, H, 0xff3333, 0)
          .setDepth(30);

        // Input: drag a knob on whichever line you grab; arrows / A·D nudge ±1;
        // up/down (W·S) switch the active line; Enter/Space lock in.
        this.input.on("pointerdown", (p) => {
          if (this.locked) return;
          const line = this.lineAt(p.y);
          if (line && this.isMovable(line)) {
            this.dragging = line;
            this.active = line;
            this.setKnob(line, xToVal(p.x));
          }
        });
        this.input.on("pointermove", (p) => {
          if (this.dragging && !this.locked)
            this.setKnob(this.dragging, xToVal(p.x));
        });
        this.input.on("pointerup", () => {
          this.dragging = null;
        });
        const nudge = (d) => {
          if (this.locked) return;
          const line = this.active;
          if (!this.isMovable(line)) return;
          const cur = line === "top" ? this.topVal : this.botVal;
          this.setKnob(line, cur + d);
          SFX.coin();
        };
        const switchLine = (line) => {
          if (this.isMovable(line)) this.active = line;
          this.refreshActiveCue();
        };
        this.input.keyboard.on("keydown-LEFT", () => nudge(-1));
        this.input.keyboard.on("keydown-RIGHT", () => nudge(1));
        this.input.keyboard.on("keydown-A", () => nudge(-1));
        this.input.keyboard.on("keydown-D", () => nudge(1));
        this.input.keyboard.on("keydown-UP", () => switchLine("top"));
        this.input.keyboard.on("keydown-DOWN", () => switchLine("bottom"));
        this.input.keyboard.on("keydown-W", () => switchLine("top"));
        this.input.keyboard.on("keydown-S", () => switchLine("bottom"));
        this.input.keyboard.on("keydown-ENTER", () => this.lockIn());
        this.input.keyboard.on("keydown-SPACE", () => this.lockIn());

        this.cameras.main.fadeIn(400);
        this.newProblem();
      };

      // Build the static parts of a number line + its movable knob.
      GameScene.prototype.buildLine = function (y, which) {
        // Track.
        this.add.rectangle(LINE_X0, y, LW, 4, 0x1f8a6b).setOrigin(0, 0.5);
        // Ticks + number labels.
        for (let v = 0; v <= MAXV; v++) {
          const x = tickX(v);
          this.add.rectangle(x, y, 2, 14, 0x2f6b63).setOrigin(0.5);
          this.add
            .text(x, y + 14, String(v), {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "12px",
              color: "#7fc4b3",
            })
            .setOrigin(0.5, 0);
        }
        // Line name (set per problem).
        const nameText = this.add
          .text(20, y - 12, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            fontStyle: "bold",
            color: "#bfe6da",
            wordWrap: { width: 120 },
          })
          .setOrigin(0, 0.5);
        // Faint base-ratio anchor marker (shows where a / b sit).
        const anchor = this.add
          .circle(LINE_X0, y, 9, 0x6be0c0, 0.35)
          .setDepth(4);
        const anchorLbl = this.add
          .text(LINE_X0, y - 24, "", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "12px",
            color: "#6be0c0",
          })
          .setOrigin(0.5)
          .setAlpha(0.7);
        // Movable / fixed knob + its value label.
        const knob = this.add
          .circle(LINE_X0, y, 16, 0xffd24a)
          .setStrokeStyle(3, 0xb87b1d)
          .setDepth(10);
        const knobVal = this.add
          .text(LINE_X0, y - 30, "0", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
            stroke: "#06201f",
            strokeThickness: 3,
          })
          .setOrigin(0.5)
          .setDepth(11);
        const refs = { y, name: nameText, anchor, anchorLbl, knob, knobVal };
        if (which === "top") this.topLine = refs;
        else this.botLine = refs;
      };

      GameScene.prototype.lineAt = function (y) {
        if (Math.abs(y - TOP_Y) <= 45) return "top";
        if (Math.abs(y - BOT_Y) <= 45) return "bottom";
        return null;
      };
      GameScene.prototype.isMovable = function (line) {
        if (!this.problem) return false;
        return line === "top"
          ? this.problem.topFixed === null
          : this.problem.botFixed === null;
      };

      GameScene.prototype.setKnob = function (line, val) {
        val = Phaser.Math.Clamp(val, 0, MAXV);
        const refs = line === "top" ? this.topLine : this.botLine;
        if (line === "top") this.topVal = val;
        else this.botVal = val;
        refs.knob.x = tickX(val);
        refs.knobVal.x = tickX(val);
        refs.knobVal.setText(String(val));
        this.refreshReadout();
      };

      GameScene.prototype.refreshReadout = function () {
        const p = this.problem;
        if (!p) return;
        const c = this.topVal,
          d = this.botVal;
        this.ratioReadout.setText(c + " : " + d);
        const equiv = p.a * d === p.b * c;
        let txt,
          color = "#bfe6da",
          fill = 0x163f44;
        if (c === 0 || d === 0) {
          txt = "Move both above 0";
        } else if (p.kind === "full" && c === p.a && d === p.b) {
          txt = "Same ratio — make a NEW one";
          color = "#ffd24a";
          fill = 0x3a3416;
        } else if (equiv) {
          txt = "Equivalent ✓";
          color = "#8ff0d8";
          fill = 0x12463a;
        } else {
          txt = "Not equal ✗";
          color = "#ff9f9f";
          fill = 0x3a1616;
        }
        this.chipText.setText(txt).setColor(color);
        this.chipBg.setFillStyle(fill);
      };

      GameScene.prototype.refreshActiveCue = function () {
        // Subtle ring on the active movable knob (keyboard focus aid).
        [this.topLine, this.botLine].forEach((refs, i) => {
          const line = i === 0 ? "top" : "bottom";
          if (this.isMovable(line) && this.active === line)
            refs.knob.setStrokeStyle(4, 0xffffff);
          else
            refs.knob.setStrokeStyle(
              3,
              this.isMovable(line) ? 0xb87b1d : 0x4f5b58,
            );
        });
      };

      GameScene.prototype.newProblem = function () {
        this.locked = false;
        const p = makeProblem(this.level, this.track);
        this.problem = p;

        this.bannerLabel.setText(p.label);
        this.bannerText.setText(p.prompt);

        // Line names.
        this.topLine.name.setText(p.nameA);
        this.botLine.name.setText(p.nameB);

        // Base-ratio anchors at a / b. Track 1 (support) shows them brightly
        // with number labels; track 2 (enrichment) keeps them faint and unlabeled
        // for less scaffolding.
        const support = this.track === 1;
        this.topLine.anchor.x = tickX(p.a);
        this.topLine.anchor.setAlpha(support ? 0.6 : 0.5);
        this.topLine.anchorLbl.x = tickX(p.a);
        this.topLine.anchorLbl
          .setText(support ? p.a + "" : "")
          .setVisible(support);
        this.botLine.anchor.x = tickX(p.b);
        this.botLine.anchor.setAlpha(support ? 0.6 : 0.5);
        this.botLine.anchorLbl.x = tickX(p.b);
        this.botLine.anchorLbl
          .setText(support ? p.b + "" : "")
          .setVisible(support);

        // Knob colors: fixed knobs are muted, movable knobs are gold.
        const setLook = (line, fixed) => {
          const refs = line === "top" ? this.topLine : this.botLine;
          refs.knob.setFillStyle(fixed ? 0x4f7a73 : 0xffd24a);
          refs.knob.setStrokeStyle(3, fixed ? 0x4f5b58 : 0xb87b1d);
        };
        setLook("top", p.topFixed !== null);
        setLook("bottom", p.botFixed !== null);

        // Default keyboard-active line = a movable one (prefer bottom).
        this.active = this.problem.botFixed === null ? "bottom" : "top";

        // Initial knob positions.
        this.setKnob("top", p.startTop);
        this.setKnob("bottom", p.startBot);
        this.refreshActiveCue();

        srSay(
          p.label +
            ". " +
            p.prompt +
            " Drag the gold knob to set your answer, then lock it in.",
        );
      };

      GameScene.prototype.lockIn = function () {
        if (this.locked || !this.problem) return;
        const p = this.problem;
        const c = this.topVal,
          d = this.botVal;
        const equiv = p.a * d === p.b * c;
        const sameAsBase = c === p.a && d === p.b;
        const correct =
          c > 0 && d > 0 && equiv && !(p.kind === "full" && sameAsBase);
        this.locked = true;

        if (correct) {
          SFX.good();
          JUICE.audio.correct(this.streak);
          this.solved++;
          this.streak++;
          const bonus = Math.min(this.streak, 5) * 5;
          const gained = 20 + bonus;
          this.score += gained;
          this.burst.setPosition(tickX(d), BOT_Y);
          this.burst.explode(16);
          JUICE.burst(
            this,
            tickX(c),
            TOP_Y,
            [0x34d399, 0x8ff0d8, 0xffffff],
            14,
          );
          JUICE.floatText(this, W / 2, 230, "+" + gained, "#8ff0d8", 34);
          JUICE.shake(this, 0.004 + Math.min(this.streak, 5) * 0.001);
          JUICE.award(gained, "u3-ratio-rush");
          if (this.streak >= 2) JUICE.confetti(this, 1);
          this.flash(W / 2, 180, "Correct! ✓", "#8ff0d8");
          this.feedback.setText("Correct! " + p.why).setAlpha(1);
          srSay("Correct. " + p.why);
          this.afterAttempt(true);
        } else {
          SFX.bad();
          JUICE.audio.wrong();
          JUICE.shake(this, 0.008);
          this.streak = 0;
          this.lives--;
          this.flashRed();
          this.feedback.setText("Not quite — " + p.why).setAlpha(1);
          srSay("Not quite. " + p.why);
          // Teach: show the correct value(s) with green ghost markers and glide
          // the movable knob(s) to the right spot, then continue.
          const ghosts = [];
          const makeGhost = (line, val) => {
            const refs = line === "top" ? this.topLine : this.botLine;
            ghosts.push(
              this.add
                .circle(tickX(val), refs.y, 13, 0x8ff0d8, 0.5)
                .setDepth(6),
            );
          };
          const tweenTargets = [];
          if (p.topFixed === null) {
            makeGhost("top", p.targetTop);
            tweenTargets.push({
              o: this.topLine.knob,
              x: tickX(p.targetTop),
            });
            tweenTargets.push({
              o: this.topLine.knobVal,
              x: tickX(p.targetTop),
            });
            this.topLine.knobVal.setText(String(p.targetTop));
          }
          if (p.botFixed === null) {
            makeGhost("bottom", p.targetBot);
            tweenTargets.push({
              o: this.botLine.knob,
              x: tickX(p.targetBot),
            });
            tweenTargets.push({
              o: this.botLine.knobVal,
              x: tickX(p.targetBot),
            });
            this.botLine.knobVal.setText(String(p.targetBot));
          }
          this.ratioReadout.setText(p.targetTop + " : " + p.targetBot);
          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            ghosts.forEach((g) => g.destroy());
            this.afterAttempt(false);
          };
          if (this.reduceMotion || tweenTargets.length === 0) {
            tweenTargets.forEach((t) => (t.o.x = t.x));
            this.time.delayedCall(400, finish);
          } else {
            this.tweens.add({
              targets: tweenTargets.map((t) => t.o),
              duration: 600,
              ease: "Quad.Out",
              x: function (target) {
                const m = tweenTargets.find((t) => t.o === target);
                return m ? m.x : target.x;
              },
              onComplete: finish,
            });
          }
        }
      };

      GameScene.prototype.afterAttempt = function (correct) {
        // Level up every 2 correct (raises the framing: one → full → unit).
        const newLevel = Math.min(8, 1 + Math.floor(this.solved / 2));
        if (newLevel > this.level) {
          this.level = newLevel;
          SFX.level();
          this.flash(W / 2, 180, "STAGE " + this.level + "!", "#ffd24a");
        }
        this.updateHUD();
        if (this.lives <= 0) {
          // No-fail practice: refill hearts and keep going. Mistakes teach;
          // they never end the game (calm, self-paced classroom mode).
          this.lives = 3;
          this.updateHUD();
        }
        if (this.solved >= this.target) {
          this.endGame(true);
          return;
        }
        this.time.delayedCall(950, () => {
          this.feedback.setAlpha(0);
          this.newProblem();
        });
      };

      GameScene.prototype.flash = function (x, y, text, color) {
        const ft = this.add
          .text(x, y, text, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "26px",
            fontStyle: "bold",
            color: color,
            stroke: "#06201f",
            strokeThickness: 4,
          })
          .setOrigin(0.5)
          .setDepth(40);
        this.tweens.add({
          targets: ft,
          y: y - 50,
          alpha: { from: 1, to: 0 },
          duration: this.reduceMotion ? 500 : 900,
          onComplete: () => ft.destroy(),
        });
      };

      GameScene.prototype.flashRed = function () {
        if (this.reduceMotion) return;
        this.redFlash.setAlpha(0.35);
        this.tweens.add({
          targets: this.redFlash,
          alpha: 0,
          duration: 350,
        });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.livesText.setText(this.lives > 0 ? "❤".repeat(this.lives) : "—");
        this.streakText.setText("Streak: " + this.streak);
        this.levelText.setText(
          this.track === 1 ? "Lvl 1 · Support" : "Lvl 2 · Enrich",
        );
        this.progressText.setText(this.solved + " / " + this.target);
      };

      GameScene.prototype.endGame = function (won) {
        this.locked = true;
        this.time.delayedCall(500, () => {
          this.scene.start("Result", {
            score: this.score,
            solved: this.solved,
            target: this.target,
            won: won,
          });
        });
      };

      // ── RESULT ──
      function ResultScene() {
        Phaser.Scene.call(this, "Result");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.data2 = data;
      };
      ResultScene.prototype.create = function () {
        const d = this.data2;
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0c2a2e);
        // Stars from accuracy/score.
        const stars =
          d.solved >= d.target ? 3 : d.solved >= d.target * 0.6 ? 2 : 1;
        // High score
        let hs = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        if (d.score > hs) {
          hs = d.score;
          try {
            localStorage.setItem(LS_KEY, String(hs));
          } catch (e) {}
        }

        this.add
          .text(cx, 110, d.won ? "RATIOS MASTERED!" : "OUT OF LIVES", {
            fontFamily: "Impact, sans-serif",
            fontSize: "48px",
            color: d.won ? "#8ff0d8" : "#ff8f8f",
            stroke: "#06201f",
            strokeThickness: 5,
          })
          .setOrigin(0.5);

        const starStr = "★".repeat(stars) + "☆".repeat(3 - stars);
        this.add
          .text(cx, 185, starStr, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "48px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);

        this.add
          .text(cx, 255, "Score: " + d.score, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "30px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.add
          .text(
            cx,
            295,
            "Solved " + d.solved + " of " + d.target + " problems",
            {
              fontFamily: "Segoe UI, sans-serif",
              fontSize: "18px",
              color: "#bfe6da",
            },
          )
          .setOrigin(0.5);
        this.add
          .text(cx, 325, "High Score: " + hs, {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "16px",
            color: "#ffd24a",
          })
          .setOrigin(0.5);

        if (d.won) {
          SFX.win();
          JUICE.audio.fanfare();
          JUICE.confetti(this, 2);
        } else SFX.lose();

        // EduPulse reporting (guarded; safe no-op without bridge).
        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.score,
              stars: stars,
              standard: "6.RP.3",
              problemsAttempted: d.solved,
            });
        } catch (e) {}
        srSay(
          (d.won ? "You won! " : "Game over. ") +
            "Final score " +
            d.score +
            ", " +
            stars +
            " stars.",
        );

        const btn = this.add
          .rectangle(cx, 400, 220, 54, 0x1f8a6b)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 400, "PLAY AGAIN 🔁", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        // Return to the level picker (consistent with the other games) so a
        // student can switch Level 1 / Level 2 on replay.
        const again = () => this.scene.start("Pick");
        btn.on("pointerover", () => btn.setFillStyle(0x27a883));
        btn.on("pointerout", () => btn.setFillStyle(0x1f8a6b));
        btn.on("pointerdown", again);
        this.input.keyboard.on("keydown-SPACE", again);
        this.input.keyboard.on("keydown-ENTER", again);

        const hub = this.add
          .text(cx, 480, "← Back to Math Games", {
            fontFamily: "Segoe UI, sans-serif",
            fontSize: "15px",
            color: "#7fc4b3",
          })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true });
        hub.on("pointerover", () => hub.setColor("#ffd24a"));
        hub.on("pointerout", () => hub.setColor("#7fc4b3"));
        hub.on("pointerdown", () => (window.location.href = "/math/games/"));
      };

      // ── Launch ──
      const rrGame = new Phaser.Game(config);

      // Canvas accessibility (additive; no gameplay change).
      rrGame.events.once("ready", function () {
        try {
          const cv = rrGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Ratio Rush Double Number Line math game. A ratio problem appears " +
              "at the top; drag a knob, or use the arrow keys (left and right to " +
              "move, up and down to switch lines) or A and D, to line up the two " +
              "number lines so the pair stays in ratio, then press Lock In, " +
              "Enter, or Space.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus({ preventScroll: true });
            } catch (e) {
              cv.focus();
            }
          });
        } catch (e) {}
      });
    </script>

    <script src="/assets/game-fx.js" defer></script>

    <script src="/assets/lesson-passport.js" defer></script>
