    <style>

  <body>
    <div id="rr-bg" aria-hidden="true"></div>
    <div id="rr-sr" role="status" aria-live="polite"></div>
    <!-- Vocab gate: term + Level-1 definition + image/emoji, shown BEFORE play -->
    <div
      id="rr-vocab"
      role="dialog"
      aria-modal="true"
      aria-label="Key words before we play"
    ></div>
    <script>
      (function () {
        var host = document.getElementById("rr-bg");
        if (!host) return;
        var reduce =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var n = reduce ? 10 : 26;
        for (var i = 0; i < n; i++) {
          var d = document.createElement("div");
          d.className = "rr-mote";
          var sz = 2 + Math.random() * 4;
          d.style.width = d.style.height = sz.toFixed(1) + "px";
          d.style.left = (Math.random() * 100).toFixed(2) + "%";
          d.style.top = (Math.random() * 100).toFixed(2) + "%";
          d.style.setProperty("--tw", (2 + Math.random() * 4).toFixed(2) + "s");
          d.style.animationDelay = "-" + (Math.random() * 4).toFixed(2) + "s";
          host.appendChild(d);
        }
      })();
    </script>
    <script>
      // ════════════════════════════════════════════════════════════════════
      // RATIO RUSH — Smoothie Bar  ·  Grade 6  ·  6.RP.A.1
      //
      // MATH-AS-MECHANIC: an order card asks for a target ratio of BERRY:MANGO
      //   scoops (e.g. 3:4). The player POURS scoops into two tubes — the tube
      //   fill heights ARE the ratio. A live blend swatch shows the resulting
      //   smoothie color: hit the target ratio and the swatch matches the order;
      //   pour the wrong ratio and it blends visibly off-color. Equivalence is
      //   FELT: an order for 6:8 is also filled by 3:4 (any equivalent batch),
      //   so the player discovers that 3:4 = 6:8. Correctness is decided by
      //   integer cross-multiplication (b*tm === m*tb), never a float compare
      //   and never by clicking A/B/C/D.
      //
      // CONTROLS: ← / → add a berry / mango scoop · A / D same · Z / C remove a
      //   scoop · ↑ or Enter or Space = SERVE · tap a tube to add, tap SERVE.
      // ════════════════════════════════════════════════════════════════════
      const GAME_ID = "u3-ratio-rush";
      const LS_KEY = "rr_ratio_rush_highscore";
      const TIER_KEY = "rr_ratio_rush_tier";
      const W = 800,
        H = 600;
      const ACTIVITY_TITLE = "Ratio Rush — Smoothie Bar";
      const STANDARD = "6.RP.A.1";
      const MAX_SCOOPS = 12; // per tube capacity

      // Metadata source of truth: window.Games2DData (scripts/games2d/data.mjs →
      // assets/games2d-data.js). Inline fallback keeps the page alive if the
      // artifact fails to load.
      const DATA = (window.Games2DData && window.Games2DData[GAME_ID]) || {
        ccss: "6.RP.A.1",
        title: "Ratio Rush",
        vocab: [
          {
            term: "ratio",
            defn: "A way to compare two amounts, like 2 scoops of berry to 3 scoops of mango. We write it as 2:3.",
          },
          {
            term: "equivalent ratios",
            defn: "Two ratios that compare the same way, like 3:4 and 6:8. Multiply both parts by the same number.",
          },
          {
            term: "part",
            defn: "One of the two amounts in a ratio. In 3:4 the parts are 3 and 4 — the scoops in each tube.",
          },
        ],
        misconceptions: [
          {
            tag: "added-instead-of-scaled",
            trigger:
              "Adds the same number to each tube instead of multiplying.",
            feedback:
              "Equivalent ratios MULTIPLY both parts by the same number — adding changes the flavor.",
          },
          {
            tag: "scaled-one-part",
            trigger: "Pours more into one tube but leaves the other.",
            feedback:
              "Fill BOTH tubes by the same factor so the ratio stays the same.",
          },
          {
            tag: "matched-numbers-not-ratio",
            trigger:
              "Pours the exact target numbers when an equivalent batch would also fill it.",
            feedback:
              "An order for 6:8 is also filled by 3:4 — match the FLAVOR, not just the numbers.",
          },
        ],
        tiers: {
          0: {
            label: "Level 0",
            sub: "Most support",
            desc: "Tiny ratios · matching guide shown · 5 lives",
          },
          1: {
            label: "Level 1",
            sub: "Support",
            desc: "Simplest-form orders · color preview · 4 lives",
          },
          2: {
            label: "Level 2",
            sub: "Challenge",
            desc: "Scaled-up orders · serve an equivalent batch · 3 lives",
          },
        },
      };
      const MIS = {};
      (DATA.misconceptions || []).forEach((m) => (MIS[m.tag] = m));

      // ── Tiny WebAudio SFX (preserved from the original shell) ──
      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            try {
              this.ctx = new (
                window.AudioContext || window.webkitAudioContext
              )();
            } catch (e) {}
        },
        play(t, f, d, v = 0.2) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        noise(d, v = 0.1) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              n = c.sampleRate * d,
              buf = c.createBuffer(1, n, c.sampleRate),
              dt = buf.getChannelData(0);
            for (let i = 0; i < n; i++) dt[i] = Math.random() * 2 - 1;
            const s = c.createBufferSource();
            s.buffer = buf;
            const g = c.createGain();
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            s.connect(g);
            g.connect(c.destination);
            s.start();
            s.stop(c.currentTime + d);
          } catch (e) {}
        },
        pour() {
          this.play("sine", 320, 0.06, 0.14);
          this.play("sine", 480, 0.07, 0.1);
        },
        unpour() {
          this.play("sine", 260, 0.06, 0.1);
        },
        serveGood() {
          [523, 659, 784, 988].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.16, 0.22), i * 70),
          );
        },
        serveBad() {
          this.noise(0.2, 0.1);
          this.play("sawtooth", 180, 0.26, 0.14);
        },
        levelUp() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.22), i * 70),
          );
        },
        win() {
          [523, 659, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.22, 0.28), i * 110),
          );
        },
        lose() {
          [400, 350, 300, 200].forEach((f, i) =>
            setTimeout(() => this.play("sawtooth", f, 0.28, 0.15), i * 170),
          );
        },
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function gcd(a, b) {
        a = Math.abs(a);
        b = Math.abs(b);
        while (b) {
          [a, b] = [b, a % b];
        }
        return a || 1;
      }

      // Simplest-form ratio bases (coprime). The fruit story keeps both parts
      // small enough to pour into a 12-scoop tube even after scaling.
      const BASE_PAIRS = [
        [1, 2],
        [2, 3],
        [3, 4],
        [2, 5],
        [3, 5],
        [4, 5],
        [1, 3],
        [3, 2],
        [4, 3],
        [5, 3],
        [5, 4],
        [5, 2],
      ];

      // Build one smoothie order for a given tier.
      //   tier 0: tiny simplest-form ratios (small parts, 5 lives elsewhere)
      //   tier 1: simplest-form ratios up to 5
      //   tier 2: SCALED orders (e.g. 6:8) that must be served as an equivalent
      //           batch — this is where 3:4 = 6:8 becomes a felt discovery.
      function genOrder(tier) {
        let pool = BASE_PAIRS;
        if (tier === 0) pool = BASE_PAIRS.filter((p) => p[0] <= 3 && p[1] <= 3);
        const base = pool[randInt(0, pool.length - 1)];
        let tb = base[0],
          tm = base[1];
        if (tier === 2) {
          // Scale the displayed order so the simplest form is non-obvious.
          // Cap so both scaled parts still fit a 12-scoop tube comfortably.
          const maxK = Math.max(2, Math.floor(8 / Math.max(tb, tm)));
          const k = maxK >= 2 ? randInt(2, maxK) : 1;
          tb *= k;
          tm *= k;
        }
        const g = gcd(tb, tm);
        return {
          tb: tb,
          tm: tm,
          simpleB: tb / g, // simplest equivalent (smallest batch that fills it)
          simpleM: tm / g,
          tier: tier,
        };
      }

      function srSay(msg) {
        try {
          const el = document.getElementById("rr-sr");
          if (el) el.textContent = msg;
        } catch (e) {}
      }

      // ────────────────────────────────────────────────────────────────────
      // VOCAB GATE — term + student-facing (Level-1) definition + image/emoji,
      // shown BEFORE the first round. No giveaways: the definitions teach the
      // concepts, never the in-game answer (there is no fixed numeric answer to
      // give away — any equivalent ratio is accepted). Shown by default;
      // skippable on REPLAY (once seen this session) via a Skip button.
      // ────────────────────────────────────────────────────────────────────
      const VOCAB_EMOJI = {
        ratio: "🥤",
        "equivalent ratios": "⚖️",
        part: "🫐",
      };
      const RR_VOCAB_TERMS = (DATA.vocab || []).map((v) => ({
        term: v.term,
        def: v.defn,
        image: v.img || "",
        emoji: VOCAB_EMOJI[v.term] || "🥤",
      }));
      let RR_VOCAB_SEEN = false; // becomes true after the gate is completed once

      function rrEscapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // Shows the vocab gate, then calls onComplete(). `allowSkip` adds a Skip
      // button (only used on replay once the student has already seen the words).
      function showVocabGate(onComplete, allowSkip) {
        const overlay = document.getElementById("rr-vocab");
        if (!overlay || !RR_VOCAB_TERMS.length) {
          if (onComplete) onComplete();
          return;
        }
        let i = 0;
        const finish = () => {
          RR_VOCAB_SEEN = true;
          overlay.classList.remove("on");
          overlay.innerHTML = "";
          if (onComplete) onComplete();
        };
        const render = () => {
          const t = RR_VOCAB_TERMS[i];
          const last = i === RR_VOCAB_TERMS.length - 1;
          const media = t.image
            ? `<img src="${rrEscapeHtml(t.image)}" alt="${rrEscapeHtml(t.term)}" onerror="this.replaceWith(document.createTextNode('${rrEscapeHtml(t.emoji || "?")}'))" />`
            : rrEscapeHtml(t.emoji || "?");
          overlay.innerHTML = `
            <div class="rr-vcard">
              <div class="rr-vstep">Key word ${i + 1} of ${RR_VOCAB_TERMS.length}</div>
              <div class="rr-vmedia" aria-hidden="true">${media}</div>
              <h2 class="rr-vterm">${rrEscapeHtml(t.term)}</h2>
              <p class="rr-vdef">${rrEscapeHtml(t.def)}</p>
              <div class="rr-vactions">
                ${i > 0 ? '<button class="rr-vbtn back" type="button" data-act="back">Back</button>' : ""}
                ${allowSkip ? '<button class="rr-vbtn back" type="button" data-act="skip">Skip ▸</button>' : ""}
                <button class="rr-vbtn next" type="button" data-act="next">${last ? "Start blending ▶" : "Next →"}</button>
              </div>
              <div class="rr-vdots">${RR_VOCAB_TERMS.map((_, n) => `<span class="${n === i ? "on" : ""}"></span>`).join("")}</div>
            </div>`;
          const nextBtn = overlay.querySelector('[data-act="next"]');
          const backBtn = overlay.querySelector('[data-act="back"]');
          const skipBtn = overlay.querySelector('[data-act="skip"]');
          nextBtn.addEventListener("click", () => {
            SFX.init();
            SFX.pour();
            if (last) finish();
            else {
              i += 1;
              render();
            }
          });
          if (backBtn)
            backBtn.addEventListener("click", () => {
              i = Math.max(0, i - 1);
              render();
            });
          if (skipBtn) skipBtn.addEventListener("click", finish);
          nextBtn.focus();
          srSay(t.term + ". " + t.def);
        };
        overlay.classList.add("on");
        render();
      }

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0c2a2e",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [],
      };

      // Tube + swatch colors.
      const BERRY = 0x8e3bd6, // deep berry purple
        MANGO = 0xf6a623, // mango orange
        GLASS = 0x123a3e;

      // Blend two RGB ints by a 0..1 fraction of the first.
      function blend(c1, c2, f) {
        const r1 = (c1 >> 16) & 255,
          g1 = (c1 >> 8) & 255,
          b1 = c1 & 255;
        const r2 = (c2 >> 16) & 255,
          g2 = (c2 >> 8) & 255,
          b2 = c2 & 255;
        const r = Math.round(r1 * f + r2 * (1 - f));
        const g = Math.round(g1 * f + g2 * (1 - f));
        const b = Math.round(b1 * f + b2 * (1 - f));
        return (r << 16) | (g << 8) | b;
      }
      function toCss(c) {
        return "#" + ("000000" + c.toString(16)).slice(-6);
      }

      class BootScene extends Phaser.Scene {
        constructor() {
          super("Boot");
        }
        create() {
          const g = this.make.graphics({ add: false });
          g.fillStyle(0xffffff);
          g.fillRect(0, 0, 7, 4);
          g.generateTexture("confetti", 7, 4);
          g.clear();
          g.fillStyle(0xffffff);
          g.fillCircle(4, 4, 4);
          g.generateTexture("drop", 8, 8);
          g.destroy();
          this.scene.start("Title");
        }
      }

      class TitleScene extends Phaser.Scene {
        constructor() {
          super("Title");
        }
        create() {
          const cx = W / 2;
          this.reduce =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          this.add.rectangle(cx, H / 2, W, H, 0x0c2a2e);
          this.add
            .text(cx, 96, "RATIO", {
              fontSize: "66px",
              fontFamily: "Impact, sans-serif",
              color: "#6be0c0",
              stroke: "#07191c",
              strokeThickness: 6,
            })
            .setOrigin(0.5);
          this.add
            .text(cx, 158, "RUSH", {
              fontSize: "66px",
              fontFamily: "Impact, sans-serif",
              color: "#d4952a",
              stroke: "#07191c",
              strokeThickness: 6,
            })
            .setOrigin(0.5);
          this.add
            .text(cx, 210, "Smoothie Bar  ·  Lesson 3  ·  6.RP.A.1", {
              fontSize: "15px",
              color: "#9fd6c0",
            })
            .setOrigin(0.5);
          this.add
            .text(
              cx,
              258,
              "Pour BERRY and MANGO scoops into the two tubes to match\nthe order's ratio. Any equivalent batch fills the order!",
              { fontSize: "15px", color: "#7fb3a0", align: "center" },
            )
            .setOrigin(0.5);
          this.add
            .text(
              cx,
              312,
              "← / → add a scoop   ·   Z / C remove   ·   ↑ or Space to SERVE",
              { fontSize: "14px", color: "#6ba390" },
            )
            .setOrigin(0.5);

          const hs = localStorage.getItem(LS_KEY);
          if (hs)
            this.add
              .text(cx, 352, "HIGH SCORE: " + hs, {
                fontSize: "15px",
                color: "#d4952a",
                fontStyle: "bold",
              })
              .setOrigin(0.5);

          // ── Tier picker (Level 0 / 1 / 2 — mechanic difficulty, not "ESOL") ──
          this.selectedTier = parseInt(
            localStorage.getItem(TIER_KEY) || "1",
            10,
          );
          if (![0, 1, 2].includes(this.selectedTier)) this.selectedTier = 1;

                color: which === "berry" ? "#c79bf0" : "#f6c873",
              },

          } else {

        makeBtn(x, y, label, fn) {

          box.on("pointerout", () => box.setFillStyle(0x10343a));

        }

        nextOrder() {
          if (this.qIndex >= this.TOTAL || this.lives <= 0) {
            this.endGame();
            return;
          }
          this.order = genOrder(this.tier);
          this.qIndex++;
          this.busy = false;
          this.berry = 0;
          this.mango = 0;

          const o = this.order;
          // Show the order ratio in its requested form (tier 2 shows the scaled
          // numbers, e.g. 6:8, so the equivalent batch must be discovered).
          this.orderText.setText("Berry : Mango  =  " + o.tb + " : " + o.tm);
          this.qnumText.setText(this.qIndex + " / " + this.TOTAL);
          // GOAL swatch = the exact target color
          this.targetSwatch.setFillStyle(
            blend(BERRY, MANGO, o.tb / (o.tb + o.tm)),
          );
          this.feedback.setAlpha(0);
          this.matchTag.setText(
            this.tier === 0
              ? "Match the goal color. Tip: " +
                  o.simpleB +
                  " berry to " +
                  o.simpleM +
                  " mango works."
              : "Pour to match the goal color, then SERVE.",
          );
          this.matchTag.setColor("#7fb3a0");
          this.redraw();

          srSay(
            "New order. Berry to mango equals " +
              o.tb +
              " to " +
              o.tm +
              ". Pour scoops into the two tubes to match this ratio, then serve. " +
              "Any equivalent batch works.",
          );
        }

        pour(which, delta) {
          if (this.busy) return;
          SFX.init();
          let v = which === "berry" ? this.berry : this.mango;
          v = Math.max(0, Math.min(MAX_SCOOPS, v + delta));
          if (which === "berry") this.berry = v;
          else this.mango = v;
          if (delta > 0) SFX.pour();
          else SFX.unpour();
          this.redraw();
          // announce live ratio for screen readers
          srSay(
            "Berry " +
              this.berry +
              ", mango " +
              this.mango +
              (this.berry + this.mango
                ? ". Current ratio " + this.berry + " to " + this.mango
                : ""),
          );
        }

        redraw() {
          const drawFill = (g, x, count, color) => {
            g.clear();
            const h = (count / MAX_SCOOPS) * this.TUBE_H;
            const top = this.TUBE_Y + (this.TUBE_H - h);
            if (h > 0) {
              g.fillStyle(color, 0.95);
              g.fillRect(x - this.TUBE_W / 2 + 4, top, this.TUBE_W - 8, h);
              // scoop separators
              g.lineStyle(1, 0x07191c, 0.4);
              for (let i = 1; i < count; i++) {
                const yy =
                  this.TUBE_Y + this.TUBE_H - (i * this.TUBE_H) / MAX_SCOOPS;
                g.lineBetween(
                  x - this.TUBE_W / 2 + 4,
                  yy,
                  x + this.TUBE_W / 2 - 4,
                  yy,
                );
              }
            }
          };
          drawFill(this.berryFill, this.berryX, this.berry, BERRY);
          drawFill(this.mangoFill, this.mangoX, this.mango, MANGO);
          this.berryLbl.setText(String(this.berry));
          this.mangoLbl.setText(String(this.mango));

          // live blend swatch
          const total = this.berry + this.mango;
          if (total === 0) {
            this.blendSwatch.setFillStyle(GLASS);
          } else {
            this.blendSwatch.setFillStyle(
              blend(BERRY, MANGO, this.berry / total),
            );
          }

          // live closeness read-out (no answer given — just "how off" the flavor is)
          if (this.order && total > 0 && !this.busy) {
            const o = this.order;
            const exact = this.berry * o.tm === this.mango * o.tb;
            if (exact) {
              this.matchTag.setText("Flavor matches! ✓  Press SERVE.");
              this.matchTag.setColor("#9fffc0");
            } else {
              // which way is it off? more berry-heavy or mango-heavy than target?
              const playerFrac = this.berry / total;
              const targetFrac = o.tb / (o.tb + o.tm);
              const off =
                playerFrac > targetFrac
                  ? "too much BERRY — add mango or take berry out"
                  : "too much MANGO — add berry or take mango out";
              this.matchTag.setText("Off-color: " + off);
              this.matchTag.setColor("#ffd27f");
            }
          }
        }

        serve() {
          if (this.busy) return;
          const o = this.order;
          const total = this.berry + this.mango;
          this.busy = true;

          // Empty tube(s) → cannot be a ratio
          if (this.berry === 0 || this.mango === 0) {
            this.fail(
              "A smoothie needs BOTH fruits. Pour at least one scoop in each tube.",
              MIS["scaled-one-part"] ? "scaled-one-part" : "",
            );
            return;
          }
          // Equivalence check by integer cross-multiplication — 3:4 fills a 6:8
          // order because 3·8 === 4·6. No float compare, no fixed numeric answer.
          const exact = this.berry * o.tm === this.mango * o.tb;
          if (exact) {
            this.correct++;
            this.streak++;
            this.maxStreak = Math.max(this.maxStreak, this.streak);
            // bonus for serving a SMALLER equivalent batch (efficient blending)
            const usedSimplest =
              this.berry === o.simpleB && this.mango === o.simpleM;
            const gained =
              10 + Math.min(this.streak, 5) * 2 + (usedSimplest ? 5 : 0);
            this.score += gained;
            SFX.serveGood();
            this.confetti.emitParticleAt(W / 2, 360);
            const isEquiv = !(this.berry === o.tb && this.mango === o.tm);
            const why = isEquiv
              ? this.berry +
                ":" +
                this.mango +
                " = " +
                o.tb +
                ":" +
                o.tm +
                " — equivalent ratios serve the same order!"
              : "Exact match: " + this.berry + ":" + this.mango + ".";
            this.flash(
              "✓ +" +
                gained +
                (this.streak > 1 ? "   🔥 ×" + this.streak : "") +
                "   " +
                why,
              "#9fffc0",
            );
            srSay("Served! " + why);
            try {
              if (window.GameFX && GameFX.celebrate && this.streak >= 3)
                GameFX.celebrate(document.querySelector("canvas"));
            } catch (e) {}
            this.updateHUD();
            this.time.delayedCall(1100, () => this.nextOrder());
          } else {
            // Wrong ratio — figure out the misconception for the teacher report.
            const playerSum = this.berry + this.mango;
            const targetSum = o.tb + o.tm;
            let tag = "matched-numbers-not-ratio";
            // added-the-same-amount pattern: berry-tb === mango-tm (shifted both
            // by an equal additive amount instead of scaling)
            if (this.berry - o.tb === this.mango - o.tm && this.berry !== o.tb)
              tag = "added-instead-of-scaled";
            else if (
              (this.berry === o.tb && this.mango !== o.tm) ||
              (this.mango === o.tm && this.berry !== o.tb)
            )
              tag = "scaled-one-part";
            const msg = MIS[tag]
              ? MIS[tag].feedback
              : "That ratio isn't equivalent to the order. Scale BOTH parts by the same number.";
            this.fail(
              "💥 Wrong flavor! " +
                this.berry +
                ":" +
                this.mango +
                " is not " +
                o.tb +
                ":" +
                o.tm +
                ".  " +
                msg,
              tag,
            );
          }
        }

        fail(msg, tag) {
          this.streak = 0;
          this.lives--;
          this.lastMiss = tag || this.lastMiss;
          SFX.serveBad();
          this.splashParticles.emitParticleAt(W / 2, 360);
          this.doRedFlash();
          // blend swatch flashes the WRONG color clearly
          this.blendLabel.setText("OFF-COLOR ✗").setColor("#ff9b8b");
          this.flash(msg + "  (−1 ❤)", "#ffb0a0");
          srSay("Wrong flavor. " + msg);
          this.matchTag.setText(
            "Goal was " +
              this.order.tb +
              ":" +
              this.order.tm +
              ". Try the next order.",
          );
          this.matchTag.setColor("#ffd27f");
          this.updateHUD();
          this.time.delayedCall(1900, () => {
            this.blendLabel.setText("YOUR BLEND").setColor("#9fd6c0");
            this.nextOrder();
          });
        }

        flash(msg, color) {
          this.feedback.setText(msg).setColor(color).setAlpha(1).setScale(0.85);
          this.tweens.add({
            targets: this.feedback,
            scale: 1,
            duration: this.reduce ? 1 : 220,
            ease: "Back.easeOut",
          });
        }
        doRedFlash() {
          if (this.reduce) return;
          this.redFlash.setAlpha(0.3);
          this.tweens.add({ targets: this.redFlash, alpha: 0, duration: 350 });
        }
        updateHUD() {
          this.scoreText.setText("Score: " + this.score);
          this.streakText.setText("Streak: " + this.streak);
          this.livesText.setText(this.lives > 0 ? "❤".repeat(this.lives) : "—");
        }
        endGame() {
          this.scene.start("Result", {
            score: this.score,
            correct: this.correct,
            attempted: this.qIndex,
            maxStreak: this.maxStreak,
            outOfLives: this.lives <= 0,
            lastMiss: this.lastMiss || "",
            tier: this.tier,
          });
        }
      }

      class ResultScene extends Phaser.Scene {
        constructor() {
          super("Result");
        }
        init(data) {
          this.d = data;
        }
        create() {
          const cx = W / 2;
          const d = this.d;
          this.reduce =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          this.add.rectangle(cx, H / 2, W, H, 0x0c2a2e);
          const pct = d.attempted ? (d.correct / d.attempted) * 100 : 0;
          const stars = pct >= 90 ? 3 : pct >= 65 ? 2 : pct >= 40 ? 1 : 0;
          const won = !d.outOfLives;
          if (stars >= 2) SFX.win();
          else SFX.lose();

          this.add
            .text(cx, 70, won ? "ORDERS COMPLETE!" : "OUT OF LIVES", {
              fontSize: "34px",
              fontStyle: "bold",
              color: won ? "#6be0c0" : "#ff7b6b",
              stroke: "#07191c",
              strokeThickness: 4,
            })
            .setOrigin(0.5);

          for (let i = 0; i < 3; i++) {
            const sx = cx - 70 + i * 70;
            this.add
              .text(sx, 150, "☆", { fontSize: "54px", color: "#2a4a48" })
              .setOrigin(0.5);
            if (i < stars) {
              const s = this.add
                .text(sx, 150, "★", { fontSize: "54px", color: "#d4952a" })
                .setOrigin(0.5)
                .setScale(0);
              this.tweens.add({
                targets: s,
                scale: 1,
                duration: this.reduce ? 1 : 380,
                delay: 250 + i * 220,
                ease: "Back.easeOut",
              });
            }
          }

          const prevHigh = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
          const isNewHigh = d.score > prevHigh;
          if (isNewHigh && d.score > 0)
            localStorage.setItem(LS_KEY, String(d.score));

          const stats = [
            ["Final Score", String(d.score)],
            ["Orders Filled", d.correct + " / " + d.attempted],
            ["Accuracy", Math.round(pct) + "%"],
            ["Best Streak", "×" + d.maxStreak],
          ];
          stats.forEach((s, i) => {
            const y = 230 + i * 42;
            this.add.rectangle(cx, y, 380, 34, 0x07191c, 0.85);
            this.add
              .text(cx - 165, y, s[0], { fontSize: "15px", color: "#7fb3a0" })
              .setOrigin(0, 0.5);
            this.add
              .text(cx + 165, y, s[1], {
                fontSize: "17px",
                color: "#6be0c0",
                fontStyle: "bold",
              })
              .setOrigin(1, 0.5);
          });

          if (isNewHigh && d.score > 0)
            this.add
              .text(cx, 415, "★ NEW HIGH SCORE! ★", {
                fontSize: "18px",
                color: "#d4952a",
                fontStyle: "bold",
              })
              .setOrigin(0.5);

          try {
            window.EduPulse &&
              EduPulse.record({
                activityTitle: ACTIVITY_TITLE,
                score: d.score,
                stars: stars,
                problemsCorrect: d.correct,
                problemsAttempted: d.attempted,
                percent: Math.round(pct),
                standard: STANDARD,
                misconceptionTag: d.lastMiss || undefined,
              });
          } catch (e) {}

          srSay(
            (won ? "Orders complete. " : "Out of lives. ") +
              "Score " +
              d.score +
              ", " +
              d.correct +
              " of " +
              d.attempted +
              " orders filled, " +
              stars +
              " stars.",
          );

          const retry = this.add
            .rectangle(cx - 95, 470, 170, 46, 0x0e8a7d)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(cx - 95, 470, "BLEND AGAIN", {
              fontSize: "17px",
              fontStyle: "bold",
              color: "#062420",
            })
            .setOrigin(0.5);
          retry.on("pointerover", () => retry.setFillStyle(0x12a596));
          retry.on("pointerout", () => retry.setFillStyle(0x0e8a7d));
          const tier = d.tier;
          const replay = () => {
            SFX.pour();
            // Replay: words shown again but skippable (already seen this session).
            showVocabGate(
              () => this.scene.start("Game", { tier }),
              RR_VOCAB_SEEN,
            );
          };
          retry.on("pointerdown", replay);

          const hub = this.add
            .rectangle(cx + 95, 470, 170, 46, 0x1a3a3e)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(cx + 95, 470, "ALL GAMES", {
              fontSize: "17px",
              fontStyle: "bold",
              color: "#9fd6c0",
            })
            .setOrigin(0.5);
          hub.on("pointerover", () => hub.setFillStyle(0x244c50));
          hub.on("pointerout", () => hub.setFillStyle(0x1a3a3e));
          hub.on("pointerdown", () => (window.location.href = "/math/games/"));

          this.input.keyboard.on("keydown-SPACE", replay);
          this.input.keyboard.on("keydown-ENTER", replay);

          if (won && stars >= 2 && !this.reduce) {
            const p = this.add
              .particles(0, 0, "confetti", {
                speed: { min: 60, max: 240 },
                angle: { min: 0, max: 360 },
                scale: { start: 1.4, end: 0 },
                rotate: { min: 0, max: 360 },
                lifespan: 1500,
                gravityY: 160,
                quantity: 20,
                tint: [0x6be0c0, 0xd4952a, 0x8e3bd6, 0xf6a623],
              })
              .setDepth(40);
            for (let i = 0; i < 5; i++)
              this.time.delayedCall(i * 280, () =>
                p.emitParticleAt(randInt(120, W - 120), randInt(40, 140)),
              );
          }
          this.cameras.main.fadeIn(400);
        }
      }

      config.scene = [BootScene, TitleScene, GameScene, ResultScene];
      const game = new Phaser.Game(config);

      game.events.once("ready", function () {
        try {
          const cv = game.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Ratio Rush smoothie-bar math game. Each order asks for a ratio of " +
              "berry to mango scoops. Pour scoops into the two tubes with the left " +
              "and right arrow keys (or A and D), remove with Z and C, then press " +
              "Up, Space, or Enter to serve. Any equivalent ratio fills the order. " +
              "Press Space to start.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
          cv.addEventListener("pointerdown", function () {
            try {
              cv.focus();
            } catch (e) {}
          });
        } catch (e) {}
      });
    </script>
    <script src="/assets/nt-page-enhance.js" defer></script>
    <script src="/assets/edupulse-config.js"></script>
    <script src="/assets/edupulse-bridge.js"></script>
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
    <script src="/shared/save-resume/save-resume-engine.js" defer></script>
    <!-- nsr-injected:end -->
    <!-- gfx-injected:begin (shared game polish — tools/inject-game-fx.js) -->
    <script src="/assets/game-fx.js" defer></script>
    <!-- gfx-injected:end -->
    <!-- mwb-injected:begin (Math Workbench launcher — tools/inject-math-workbench.js) -->
    <script src="/assets/math-workbench-launcher.js" defer></script>
    <!-- mwb-injected:end -->
  </body>
</html>
