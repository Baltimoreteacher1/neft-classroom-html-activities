        }
      });
    </script>

    <!-- ARIA live region: announces answer-submission results (correct /
         defective / streaks) to screen-reader students. Additive only. -->
    <div id="ee-live" class="ee-sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <script>
      // Expression Engine — Factory Assembly Line
      // Grade 6 · Unit 6 · Lessons 6-3 to 6-6, 6-8, 6-14, 6-15: 6.AT.5–6.AT.7
      // (exponents, order of operations, write & evaluate expressions)
      // Neft Teacher — Enhanced with juice, particles, streaks, star rating, high scores, power-ups

      const W = 1024,
        H = 768;
      /** 1 star at 3 correct, 2 at a streak of 3 or 8 correct, 3 at 80%+ on a finished round of 4+. */
      function selfPacedStars(correct, total, bestStreak) {
        let stars = 0;
        if (correct >= 3) stars = 1;
        if ((bestStreak || 0) >= 3 || correct >= 8) stars = 2;
        if (total >= 4 && correct / total >= 0.8) stars = 3;
        return stars;
      }
      const LS_KEY = "expression_engine_highscore";

      // --- Accessibility helpers (additive; never touch gameplay/scoring) ---
      // Reduced-motion flag: respects the shared GameFX kit when present, else
      // reads the media query directly. Re-checked live so toggling the OS
      // setting takes effect without a reload.
      const EE_RM_QUERY =
        window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
      function eeReduceMotion() {
        if (typeof window.__flagshipReduced === "boolean") return window.__flagshipReduced;
        if (window.GameFX && typeof window.GameFX.reduce === "boolean") {
          return window.GameFX.reduce;
        }
        return !!(EE_RM_QUERY && EE_RM_QUERY.matches);
      }
      // Announce a message to the ARIA live region for screen-reader students.
      function eeAnnounce(msg) {
        try {
          const el = document.getElementById("ee-live");
          if (!el) return;
          // Clear first so identical consecutive messages are still spoken.
          el.textContent = "";
          window.setTimeout(function () {
            el.textContent = msg;
          }, 30);
        } catch (e) {}
      }

      // --- LANGUAGE (site-wide key: localStorage["nt-lang"] === "es") ---
      const LANG = (() => {
        try {
          return localStorage.getItem("nt-lang") === "es" ? "es" : "en";
        } catch (e) {
          return "en";
        }
      })();
      const ES = LANG === "es";
      const tr = (en, es) => (ES ? es : en);
      if (ES) document.documentElement.lang = "es";
      function toggleLang() {
        try {
          localStorage.setItem("nt-lang", ES ? "en" : "es");
        } catch (e) {}
        location.reload();
      }
      window.ewlToggleLang = toggleLang;
      const SUP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
      const M = "−"; // true minus for display

      // --- QUESTION BANK (procedurally generated, every distractor named) ---
      // Unit 6: 6-3 numerical expressions with exponents (6.AT.5), 6-4 order
      // of operations with exponents (6.AT.6c), 6-5 write and evaluate
      // algebraic expressions (6.AT.6a), and 6-6/6-8/6-14/6-15 equivalent
      // expressions (6.AT.7).
      function generateQuestions() {
        const qs = [];
        const R = (a, b) => Phaser.Math.Between(a, b);
        function shuffle(a) {
          const b = [...a];
          for (let i = b.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [b[i], b[j]] = [b[j], b[i]];
          }
          return b;
        }
        function makeQ(text, correct, wrongs, help, tier, skill) {
          // wrongs: [value, why] pairs — each distractor is a named
          // misconception, so a wrong pick gets feedback about THAT mistake.
          // De-duplicate distractors against the correct answer AND each other
          // (e.g. a=2,c=2 makes a+c === a*c) so no two buttons look identical.
          const seen = new Set([String(correct)]);
          const cleanWrongs = [];
          const why = {};
          wrongs.forEach(([w, reason]) => {
            const s = String(w);
            // Wrongs are listed most-common-misconception first; keep three
            // so every part fits the belt and the 1-4 keys.
            if (!seen.has(s) && cleanWrongs.length < 3) {
              seen.add(s);
              cleanWrongs.push(s);
              why[s] = reason;
            }
          });
          const opts = shuffle([String(correct), ...cleanWrongs]);
          // method = Tier-1 hint (no answer); nudge = Tier-2 concrete first
          // step (still not the final answer); step = full worked solution,
          // shown only after the part is solved.
          return {
            text,
            correct: String(correct),
            options: opts,
            hint: help.method,
            method: help.method,
            nudge: help.nudge,
            step: help.step,
            why,
            tier,
            skill,
          };
        }
        const coef = (n, v) => (n === 1 ? v : `${n}${v}`);
        const SK = {
          sub: tr("substitute and multiply", "sustituir y multiplicar"),
          ooo: tr("order of operations", "orden de las operaciones"),
          pow: tr("exponents", "exponentes"),
          write: tr("writing expressions", "escribir expresiones"),
          dist: tr("distributive property", "propiedad distributiva"),
          like: tr("combining like terms", "combinar términos semejantes"),
          paren: tr("parentheses and order of operations", "paréntesis y orden de las operaciones"),
        };
        // ── TIER 1 ──────────────────────────────────────────────────────
        // Evaluate cx (6-5)
        for (let i = 0; i < 3; i++) {
          const c = R(2, 9),
            x = R(2, 10);
          const ans = c * x;
          qs.push(
            makeQ(
              tr(`Evaluate ${c}x when x = ${x}`, `Evalúa ${c}x cuando x = ${x}`),
              ans,
              [
                [ans + c, tr(`that is one group of ${c} too many. ${c}x means exactly ${x} groups of ${c}.`, `es un grupo de ${c} de más. ${c}x significa exactamente ${x} grupos de ${c}.`)],
                [ans - x, tr("check your multiplication fact again.", "revisa otra vez tu multiplicación.")],
                [c + x, tr(`${c}x means ${c} TIMES x, not ${c} plus x.`, `${c}x significa ${c} POR x, no ${c} más x.`)],
              ],
              {
                method: tr(`A number next to a letter means multiply. Put ${x} in for x.`, `Un número junto a una letra significa multiplicar. Pon ${x} en lugar de x.`),
                nudge: tr(`${c}x = ${c} × ${x}. Find that product.`, `${c}x = ${c} × ${x}. Halla ese producto.`),
                step: `${c}x = ${c} × ${x} = ${ans}`,
              },
              1,
              SK.sub,
            ),
          );
        }
        // Evaluate a + bn (6-5)
        for (let i = 0; i < 2; i++) {
          const a = R(1, 5),
            b = R(2, 7),
            n = R(2, 8);
          const ans = a + b * n;
          qs.push(
            makeQ(
              tr(`Evaluate ${a} + ${b}n when n = ${n}`, `Evalúa ${a} + ${b}n cuando n = ${n}`),
              ans,
              [
                [a * b + n, tr(`you multiplied ${a} × ${b}. The ${b} belongs to n: multiply ${b} × n first.`, `multiplicaste ${a} × ${b}. El ${b} va con n: multiplica ${b} × n primero.`)],
                [b * n, tr(`you found ${b}n but forgot to add the ${a}.`, `hallaste ${b}n pero olvidaste sumar el ${a}.`)],
                [a + b + n, tr(`${b}n means ${b} × n, so multiply before you add.`, `${b}n significa ${b} × n, así que multiplica antes de sumar.`)],
              ],
              {
                method: tr("Order of operations: multiply before you add.", "Orden de las operaciones: multiplica antes de sumar."),
                nudge: tr(`First find ${b}n = ${b} × ${n}. Then add ${a}.`, `Primero halla ${b}n = ${b} × ${n}. Luego suma ${a}.`),
                step: `${b} × ${n} = ${b * n}, ${tr("then", "luego")} ${a} + ${b * n} = ${ans}`,
              },
              1,
              SK.ooo,
            ),
          );
        }
        // Evaluate a power (6-3)
        for (let i = 0; i < 3; i++) {
          const b = R(2, 5),
            e = b === 5 ? R(2, 3) : b === 2 ? R(3, 4) : R(2, 4);
          const ans = b ** e;
          const factors = Array(e).fill(b).join(" × ");
          qs.push(
            makeQ(
              tr(`Evaluate ${b}${SUP[e]}`, `Evalúa ${b}${SUP[e]}`),
              ans,
              [
                [b * e, tr(`${b}${SUP[e]} is not ${b} × ${e}. The exponent tells how many times ${b} is a FACTOR.`, `${b}${SUP[e]} no es ${b} × ${e}. El exponente dice cuántas veces ${b} es FACTOR.`)],
                [b ** (e - 1), tr(`one factor is missing. Write ${e} factors of ${b}.`, `falta un factor. Escribe ${e} factores de ${b}.`)],
                [e ** b, tr(`you swapped them: the base ${b} is multiplied, the exponent ${e} counts the factors.`, `los intercambiaste: la base ${b} se multiplica y el exponente ${e} cuenta los factores.`)],
                [b + e, tr("an exponent means repeated multiplication, not adding.", "un exponente significa multiplicar repetidamente, no sumar.")],
              ],
              {
                method: tr(`The exponent ${e} tells how many times to use ${b} as a factor.`, `El exponente ${e} dice cuántas veces usar ${b} como factor.`),
                nudge: tr(`Write it out: ${factors}. Multiply two at a time.`, `Escríbelo: ${factors}. Multiplica de dos en dos.`),
                step: `${b}${SUP[e]} = ${factors} = ${ans}`,
              },
              1,
              SK.pow,
            ),
          );
        }
        // Write repeated multiplication as a power (6-3)
        for (let i = 0; i < 2; i++) {
          const b = R(3, 9),
            e = R(3, 5);
          const factors = Array(e).fill(b).join(" × ");
          qs.push(
            makeQ(
              tr(`Write ${factors} as a power.`, `Escribe ${factors} como potencia.`),
              `${b}${SUP[e]}`,
              [
                [`${e}${SUP[b]}`, tr(`the base is the number being multiplied (${b}); the exponent counts the factors.`, `la base es el número que se multiplica (${b}); el exponente cuenta los factores.`)],
                [`${b} × ${e}`, tr(`${b} × ${e} adds ${b} ${e} times. A power MULTIPLIES ${b} by itself.`, `${b} × ${e} suma ${b} ${e} veces. Una potencia MULTIPLICA ${b} por sí mismo.`)],
                [`${b}${SUP[e - 1]}`, tr(`count the factors again: there are ${e} of them.`, `cuenta otra vez los factores: hay ${e}.`)],
              ],
              {
                method: tr("Power = base with an exponent. The base is the repeated factor; the exponent counts how many.", "Potencia = base con exponente. La base es el factor que se repite; el exponente cuenta cuántas veces."),
                nudge: tr(`The repeated factor is ${b}. How many ${b}s do you see?`, `El factor que se repite es ${b}. ¿Cuántos ${b} ves?`),
                step: tr(`${e} factors of ${b}: ${b}${SUP[e]}`, `${e} factores de ${b}: ${b}${SUP[e]}`),
              },
              1,
              SK.pow,
            ),
          );
        }
        // ── TIER 2 ──────────────────────────────────────────────────────
        // Distributive property (6-6, 6-14)
        for (let i = 0; i < 3; i++) {
          const a = R(2, 6),
            c = R(1, 9);
          qs.push(
            makeQ(
              tr(`Which is equivalent to ${a}(x + ${c})?`, `¿Cuál es equivalente a ${a}(x + ${c})?`),
              `${a}x + ${a * c}`,
              [
                [`${a}x + ${c}`, tr(`the ${a} multiplies BOTH terms inside. You multiplied x but not ${c}.`, `el ${a} multiplica AMBOS términos de adentro. Multiplicaste x pero no ${c}.`)],
                [`x + ${a * c}`, tr(`the ${a} multiplies BOTH terms inside. You multiplied ${c} but not x.`, `el ${a} multiplica AMBOS términos de adentro. Multiplicaste ${c} pero no x.`)],
                [`${a}x + ${a + c}`, tr(`${a} × ${c} is multiplication, not ${a} + ${c}.`, `${a} × ${c} es multiplicación, no ${a} + ${c}.`)],
              ],
              {
                method: tr("Distributive property: multiply the outside number by EACH term inside the parentheses.", "Propiedad distributiva: multiplica el número de afuera por CADA término dentro del paréntesis."),
                nudge: tr(`${a} × x = ${a}x. Now multiply ${a} × ${c}.`, `${a} × x = ${a}x. Ahora multiplica ${a} × ${c}.`),
                step: `${a}(x + ${c}) = ${a} × x + ${a} × ${c} = ${a}x + ${a * c}`,
              },
              2,
              SK.dist,
            ),
          );
        }
        // Evaluate with an exponent (6-5)
        for (let i = 0; i < 2; i++) {
          const co = R(2, 3),
            a = R(2, 5);
          const ans = co * a * a + 1;
          qs.push(
            makeQ(
              tr(`Evaluate ${coef(co, "a²")} + 1 when a = ${a}`, `Evalúa ${coef(co, "a²")} + 1 cuando a = ${a}`),
              ans,
              [
                [co * a + 1, tr(`a² means a × a = ${a} × ${a}, not just ${a}.`, `a² significa a × a = ${a} × ${a}, no solo ${a}.`)],
                [co * a * a, tr("you skipped the + 1 at the end.", "olvidaste el + 1 del final.")],
                [(co * a) ** 2 + 1, tr(`only a is squared. Square ${a} first, THEN multiply by ${co}.`, `solo a está al cuadrado. Eleva ${a} al cuadrado primero y LUEGO multiplica por ${co}.`)],
                [co + a * a + 1, tr(`${coef(co, "a²")} means ${co} × a², so multiply — do not add the ${co}.`, `${coef(co, "a²")} significa ${co} × a², así que multiplica; no sumes el ${co}.`)],
              ],
              {
                method: tr("Exponents first: a² means a × a. Then multiply, then add.", "Primero los exponentes: a² significa a × a. Luego multiplica y luego suma."),
                nudge: tr(`${a}² = ${a} × ${a} = ${a * a}. Now finish: ${co} × ${a * a} + 1.`, `${a}² = ${a} × ${a} = ${a * a}. Ahora termina: ${co} × ${a * a} + 1.`),
                step: `${a}² = ${a * a}, ${co} × ${a * a} = ${co * a * a}, ${tr("then", "luego")} + 1 = ${ans}`,
              },
              2,
              SK.pow,
            ),
          );
        }
        // Order of operations with exponents, numbers only (6-4)
        for (let i = 0; i < 2; i++) {
          const a = R(2, 9),
            b = R(2, 5),
            c = R(2, 4);
          const ans = a + b * c * c;
          qs.push(
            makeQ(
              tr(`Evaluate ${a} + ${b} × ${c}²`, `Evalúa ${a} + ${b} × ${c}²`),
              ans,
              [
                [(a + b) * c * c, tr(`you added ${a} + ${b} first. Exponents, then multiply, THEN add.`, `sumaste ${a} + ${b} primero. Exponentes, luego multiplica y LUEGO suma.`)],
                [a + (b * c) ** 2, tr(`only ${c} is squared, not ${b} × ${c}. Do the exponent before multiplying.`, `solo ${c} está al cuadrado, no ${b} × ${c}. Haz el exponente antes de multiplicar.`)],
                [a + b * c * 2, tr(`${c}² means ${c} × ${c}, not ${c} × 2.`, `${c}² significa ${c} × ${c}, no ${c} × 2.`)],
              ],
              {
                method: tr("Order: parentheses, exponents, multiply/divide, then add/subtract.", "Orden: paréntesis, exponentes, multiplicar/dividir y luego sumar/restar."),
                nudge: tr(`Exponent first: ${c}² = ${c * c}. Next: ${b} × ${c * c}.`, `Primero el exponente: ${c}² = ${c * c}. Después: ${b} × ${c * c}.`),
                step: `${c}² = ${c * c}, ${b} × ${c * c} = ${b * c * c}, ${a} + ${b * c * c} = ${ans}`,
              },
              2,
              SK.ooo,
            ),
          );
        }
        {
          // ÷ and × go left to right (6-4)
          const q = R(2, 4),
            r = R(2, 4),
            m = R(2, 5);
          const p = q * r * m,
            ans = (p / q) * r;
          qs.push(
            makeQ(
              tr(`Evaluate ${p} ÷ ${q} × ${r}`, `Evalúa ${p} ÷ ${q} × ${r}`),
              ans,
              [
                [m, tr(`you multiplied ${q} × ${r} first. Multiply and divide go LEFT to RIGHT.`, `multiplicaste ${q} × ${r} primero. Multiplicar y dividir van de IZQUIERDA a DERECHA.`)],
                [p / q + r, tr(`after ${p} ÷ ${q}, the next step is × ${r}, not + ${r}.`, `después de ${p} ÷ ${q}, el siguiente paso es × ${r}, no + ${r}.`)],
                [ans + r, tr("check the multiplication at the end again.", "revisa otra vez la multiplicación final.")],
              ],
              {
                method: tr("Multiply and divide have the same rank: work them from left to right.", "Multiplicar y dividir tienen el mismo nivel: hazlas de izquierda a derecha."),
                nudge: tr(`Leftmost first: ${p} ÷ ${q} = ${p / q}. Then × ${r}.`, `Primero la de la izquierda: ${p} ÷ ${q} = ${p / q}. Luego × ${r}.`),
                step: `${p} ÷ ${q} = ${p / q}, ${p / q} × ${r} = ${ans}`,
              },
              2,
              SK.ooo,
            ),
          );
        }
        {
          // Write an algebraic expression from words (6-5)
          const k = R(2, 9),
            m = R(2, 9);
          const words = tr(`${m} more than ${k} times a number n`, `${m} más que ${k} veces un número n`);
          qs.push(
            makeQ(
              tr(`Which expression means "${words}"?`, `¿Qué expresión significa "${words}"?`),
              `${k}n + ${m}`,
              [
                [`${m}n + ${k}`, tr(`"${k} times a number" is ${k}n; "${m} more" adds ${m}.`, `"${k} veces un número" es ${k}n; "${m} más" suma ${m}.`)],
                [`${k}(n + ${m})`, tr(`that adds ${m} BEFORE multiplying. Only n is multiplied by ${k}.`, `eso suma ${m} ANTES de multiplicar. Solo n se multiplica por ${k}.`)],
                [`${k} + ${m}n`, tr(`"${k} times n" is ${k}n, not ${k} + ...`, `"${k} veces n" es ${k}n, no ${k} + ...`)],
              ],
              {
                method: tr('Translate piece by piece: "times a number" is multiplication by n; "more than" means add.', 'Traduce por partes: "veces un número" es multiplicar por n; "más que" significa sumar.'),
                nudge: tr(`"${k} times a number n" = ${k}n. Now show "${m} more than" that.`, `"${k} veces un número n" = ${k}n. Ahora muestra "${m} más que" eso.`),
                step: `${k} × n + ${m} = ${k}n + ${m}`,
              },
              2,
              SK.write,
            ),
          );
        }
        // ── TIER 3 ──────────────────────────────────────────────────────
        // Combine like terms (6-8, 6-15)
        for (let i = 0; i < 2; i++) {
          const a = R(2, 7),
            b = R(3, 9),
            c = R(1, 5),
            d = R(1, b - 1);
          const xc = a + c,
            nc = b - d;
          qs.push(
            makeQ(
              tr(`Simplify: ${a}x + ${b} + ${coef(c, "x")} ${M} ${d}`, `Simplifica: ${a}x + ${b} + ${coef(c, "x")} ${M} ${d}`),
              `${xc}x + ${nc}`,
              [
                [`${xc}x + ${b + d}`, tr(`it is MINUS ${d}, so subtract: ${b} ${M} ${d}.`, `es MENOS ${d}, así que resta: ${b} ${M} ${d}.`)],
                [`${a + c + b}x ${M} ${d}`, tr(`${b} has no x, so it is not a like term with the x-terms.`, `${b} no tiene x, así que no es semejante a los términos con x.`)],
                [`${a * c}x + ${nc}`, tr("to combine like terms, ADD the x-coefficients — do not multiply them.", "para combinar términos semejantes, SUMA los coeficientes de x; no los multipliques.")],
              ],
              {
                method: tr("Like terms have the same variable part. Combine x-terms together and numbers together.", "Los términos semejantes tienen la misma parte variable. Junta los términos con x y junta los números."),
                nudge: tr(`x-terms: ${a}x + ${coef(c, "x")}. Numbers: ${b} ${M} ${d}. Do each one.`, `Términos con x: ${a}x + ${coef(c, "x")}. Números: ${b} ${M} ${d}. Haz cada uno.`),
                step: `${a}x + ${coef(c, "x")} = ${xc}x ${tr("and", "y")} ${b} ${M} ${d} = ${nc}: ${xc}x + ${nc}`,
              },
              3,
              SK.like,
            ),
          );
        }
        // c(ay − b) — parentheses first (6-5)
        for (let i = 0; i < 2; i++) {
          const a = R(2, 5),
            b = R(1, 4),
            c = R(2, 5),
            y = R(2, 6);
          const inner = a * y - b,
            ans = c * inner;
          qs.push(
            makeQ(
              tr(`Evaluate ${c}(${a}y ${M} ${b}) when y = ${y}`, `Evalúa ${c}(${a}y ${M} ${b}) cuando y = ${y}`),
              ans,
              [
                [c * a * y - b, tr(`the ${c} multiplies the WHOLE group (${a}y ${M} ${b}), including the ${b}.`, `el ${c} multiplica TODO el grupo (${a}y ${M} ${b}), incluido el ${b}.`)],
                [ans + c, tr("check the multiplication of the outside number again.", "revisa otra vez la multiplicación del número de afuera.")],
                [ans - b, tr(`work inside the parentheses first, then multiply by ${c}.`, `resuelve primero dentro del paréntesis y luego multiplica por ${c}.`)],
              ],
              {
                method: tr("Parentheses first: find the value inside, then multiply by the outside number.", "Primero el paréntesis: halla el valor de adentro y luego multiplica por el número de afuera."),
                nudge: tr(`Inside: ${a} × ${y} ${M} ${b} = ${inner}. Now multiply by ${c}.`, `Adentro: ${a} × ${y} ${M} ${b} = ${inner}. Ahora multiplica por ${c}.`),
                step: `${a} × ${y} ${M} ${b} = ${inner}, ${tr("then", "luego")} ${c} × ${inner} = ${ans}`,
              },
              3,
              SK.paren,
            ),
          );
        }
        // Two variables with an exponent (6-5)
        for (let i = 0; i < 2; i++) {
          const p = R(2, 6),
            m = R(2, 6),
            n = R(2, 5);
          const ans = p * m + n * n;
          qs.push(
            makeQ(
              tr(`Evaluate ${p}m + n² when m = ${m} and n = ${n}`, `Evalúa ${p}m + n² cuando m = ${m} y n = ${n}`),
              ans,
              [
                [p * m + 2 * n, tr(`n² means n × n = ${n} × ${n}, not ${n} × 2.`, `n² significa n × n = ${n} × ${n}, no ${n} × 2.`)],
                [p + m + n * n, tr(`${p}m means ${p} × m. Multiply, do not add.`, `${p}m significa ${p} × m. Multiplica, no sumes.`)],
                [(p * m + n) ** 2, tr("only n is squared, not the whole sum.", "solo n está al cuadrado, no toda la suma.")],
              ],
              {
                method: tr("Replace EACH letter with its value. Then exponents, multiply, add.", "Cambia CADA letra por su valor. Luego exponentes, multiplica y suma."),
                nudge: tr(`${p}m = ${p} × ${m} and n² = ${n} × ${n}. Find each part.`, `${p}m = ${p} × ${m} y n² = ${n} × ${n}. Halla cada parte.`),
                step: `${p} × ${m} = ${p * m}, ${n}² = ${n * n}, ${p * m} + ${n * n} = ${ans}`,
              },
              3,
              SK.sub,
            ),
          );
        }
        // Grouping with an exponent (6-4)
        for (let i = 0; i < 2; i++) {
          const a = R(1, 5),
            b = R(1, 4),
            c = R(1, 9);
          const s = a + b;
          const ans = s * s - c;
          qs.push(
            makeQ(
              tr(`Evaluate (${a} + ${b})² ${M} ${c}`, `Evalúa (${a} + ${b})² ${M} ${c}`),
              ans,
              [
                [a * a + b * b - c, tr(`square the WHOLE group: (${a} + ${b}) = ${s} first, then square ${s}.`, `eleva TODO el grupo: primero (${a} + ${b}) = ${s} y luego ${s} al cuadrado.`)],
                [s * 2 - c, tr(`${s}² means ${s} × ${s}, not ${s} × 2.`, `${s}² significa ${s} × ${s}, no ${s} × 2.`)],
                [s * s + c, tr(`it is MINUS ${c} at the end.`, `al final es MENOS ${c}.`)],
              ],
              {
                method: tr("Parentheses first, then the exponent, then subtract.", "Primero el paréntesis, luego el exponente y después resta."),
                nudge: tr(`(${a} + ${b}) = ${s}. Now find ${s}².`, `(${a} + ${b}) = ${s}. Ahora halla ${s}².`),
                step: `${a} + ${b} = ${s}, ${s}² = ${s * s}, ${s * s} ${M} ${c} = ${ans}`,
              },
              3,
              SK.paren,
            ),
          );
        }
        return shuffle(qs);
      }

      // --- SOUND SYSTEM (Web Audio API) ---
      class SFX {
        constructor() {
          this.ctx = null;
        }
        init() {
          if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
          if (!this.ctx)
            try {
              this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        }
        play(freq, dur, type = "sine", vol = 0.1) {
          if (window.__flagshipMuted) return;
          if (!this.ctx) return;
          try {
            const o = this.ctx.createOscillator(),
              g = this.ctx.createGain();
            o.type = type;
            o.frequency.value = freq;
            g.gain.setValueAtTime(vol, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start();
            o.stop(this.ctx.currentTime + dur);
          } catch (e) {}
        }
        noise(dur, vol = 0.08) {
          if (window.__flagshipMuted) return;
          if (!this.ctx) return;
          try {
            const bufSize = this.ctx.sampleRate * dur;
            const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const src = this.ctx.createBufferSource();
            src.buffer = buf;
            const g = this.ctx.createGain();
            g.gain.setValueAtTime(vol, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
            src.connect(g);
            g.connect(this.ctx.destination);
            src.start();
            src.stop(this.ctx.currentTime + dur);
          } catch (e) {}
        }

      // --- GAME SCENE ---
      class GameScene extends Phaser.Scene {
        constructor() {
          super("Game");
        }
        init(data) {
          this.difficulty = data.difficulty ?? 1;
          this.presetQueue = Array.isArray(data.queue) ? data.queue : null;
        }
        create() {
          this.cameras.main.setBackgroundColor("#0f172a");
          sfx.init();
          // Snapshot reduced-motion preference for this scene (additive polish).
          this.reduceMotion = eeReduceMotion();
          if (this.presetQueue) {
            this.questions = this.presetQueue.slice();
            this.spare = [];
          } else {
            // Easy = tier 1 (exponents, substitution); Standard = 5 per tier;
            // Expert = tiers 2-3. Parts ramp by tier, so the phase banners at
            // parts 6 and 11 mark a real step up. One spare per tier feeds
            // "Sharpen misses".
            const want =
              this.difficulty === 0
                ? { 1: 15 }
                : this.difficulty === 2
                  ? { 2: 7, 3: 8 }
                  : { 1: 5, 2: 5, 3: 5 };
            const picked = { 1: [], 2: [], 3: [] };
            const seenText = new Set();
            for (let guard = 0; guard < 12; guard++) {
              generateQuestions().forEach((q) => {
                const t = q.tier;
                if (!want[t] || picked[t].length > want[t] || seenText.has(q.text)) return;
                seenText.add(q.text);
                picked[t].push(q);
              });
              if (Object.keys(want).every((t) => picked[t].length > want[t])) break;
            }
            this.questions = [1, 2, 3].flatMap((t) => picked[t].slice(0, want[t] || 0));
            this.spare = [1, 2, 3].flatMap((t) => picked[t].slice(want[t] || 0));
          }
          this.qIndex = 0;
          this.score = 0;
          this.firstTry = 0; // parts solved first try with no help
          this.wrongTries = 0; // wrong picks on the current part

        drawFactory() {
          this.add.rectangle(W / 2, H / 2, W, H, 0x0f172a);
          for (let i = 0; i < 5; i++) {
            this.add.rectangle(i * 260 + 20, H / 2, 8, H, 0x1e293b).setDepth(0);
          }
          this.add.rectangle(W / 2, H - 20, W, 40, 0x1e293b).setDepth(0);
          for (let i = 0; i < 25; i++) {
            this.add
              .rectangle(i * 50, H - 2, 25, 4, i % 2 === 0 ? 0xfbbf24 : 0x0f172a)
              .setOrigin(0, 0.5)
              .setDepth(1);
          }
          this.add.rectangle(50, 200, 12, 300, 0x334155).setDepth(0);
          this.add.rectangle(W - 50, 200, 12, 300, 0x334155).setDepth(0);
          this.add.circle(50, 60, 15, 0x475569).setDepth(0);
          this.add.circle(W - 50, 60, 15, 0x475569).setDepth(0);
          // Decorative background gears — collected as parallax layers.
          this.parallaxLayers = [];
          for (let i = 0; i < 4; i++) {
            const gx = Phaser.Math.Between(100, W - 100),
              gy = Phaser.Math.Between(200, 400);
            const g = this.add.graphics().setPosition(gx, gy).setDepth(0).setAlpha(0.15);
            const r = Phaser.Math.Between(20, 50);
            g.lineStyle(2, 0x64748b);
            g.strokeCircle(0, 0, r);
            for (let t = 0; t < 6; t++) {
              const a = (t * Math.PI) / 3;
              g.lineStyle(2, 0x64748b);
              g.lineBetween(
                Math.cos(a) * (r - 5),
                Math.sin(a) * (r - 5),
                Math.cos(a) * (r + 10),
                Math.sin(a) * (r + 10),
              );
            }
            // Record home position + a parallax depth factor (bigger gears
            // drift more, selling the layered factory background).
            this.parallaxLayers.push({
              obj: g,
              homeX: gx,
              homeY: gy,
              factor: 8 + (r / 50) * 14,
            });
            // Rotation is decorative motion — skip it under reduced motion.
            if (!this.reduceMotion) {
              this.tweens.add({
                targets: g,
                angle: 360,
                duration: 6000 + i * 2000,
                repeat: -1,
                ease: "Linear",
              });
            }
          }
        }

        // Bespoke pointer parallax: background gears ease toward an offset
        // opposite the pointer. Purely cosmetic, depth-0, and fully disabled
        // under reduced motion. Smoothed in update() — no per-frame layout.
        setupParallax() {
          this.parallaxTargetX = 0;
          this.parallaxTargetY = 0;
          this.parallaxX = 0;
          this.parallaxY = 0;
          if (this.reduceMotion || !this.parallaxLayers) return;
          this.input.on("pointermove", (p) => {
            if (this.reduceMotion) return;
            // Normalized -1..1 from canvas center.
            this.parallaxTargetX = (p.x / W - 0.5) * -2;
            this.parallaxTargetY = (p.y / H - 0.5) * -2;
          });
        }

        updateParallax() {
          if (this.reduceMotion || !this.parallaxLayers) return;
          // Ease current toward target (cheap lerp, no layout thrash).
          this.parallaxX += (this.parallaxTargetX - this.parallaxX) * 0.08;
          this.parallaxY += (this.parallaxTargetY - this.parallaxY) * 0.08;
          for (let i = 0; i < this.parallaxLayers.length; i++) {
            const L = this.parallaxLayers[i];
            L.obj.x = L.homeX + this.parallaxX * L.factor;
            L.obj.y = L.homeY + this.parallaxY * L.factor;
          }
        }

        drawRobot(g, color) {
          g.clear();
          g.fillStyle(color);
          g.fillRoundedRect(-30, -45, 60, 55, 6);
          g.fillStyle(0x60a5fa);
          g.fillCircle(-10, -25, 8);
          g.fillCircle(10, -25, 8);
          g.fillStyle(0x1e3a5f);
          g.fillCircle(-10, -25, 4);
          g.fillCircle(10, -25, 4);
          g.fillStyle(0xfbbf24);
          g.fillRect(-12, -3, 24, 4);
          g.fillStyle(0x475569);
          g.fillRect(-22, 10, 12, 30);
          g.fillRect(10, 10, 12, 30);
          g.lineStyle(2, 0x94a3b8);
          g.lineBetween(0, -45, 0, -58);
          g.fillStyle(0xef4444);
          g.fillCircle(0, -60, 4);
        }

        drawLever(g, pulled) {
          g.clear();
          g.fillStyle(0x475569);
          g.fillRect(-5, 0, 10, 60);
          g.fillStyle(pulled ? 0x22c55e : 0xef4444);
          g.fillCircle(0, pulled ? 60 : 0, 12);
          g.lineStyle(2, 0x64748b);
          g.strokeRect(-8, -5, 16, 70);
        }

        activatePowerUp(key) {
          if (this.answered || this.qIndex >= this.totalQ) return;
          if (this.powerUps[key] <= 0) return;

          if (key === "fiftyFifty") {
            this.powerUps.fiftyFifty--;
            sfx.powerUp();
            const q = this.questions[this.qIndex];
            const wrongIndices = [];
            this.answerBoxes.forEach((b, i) => {
              if (b.optText !== q.correct && !this.removedChoices.includes(i)) {
                wrongIndices.push(i);
              }
            });
            const toRemove = wrongIndices.sort(() => Math.random() - 0.5).slice(0, 2);
            toRemove.forEach((i) => {
              const box = this.answerBoxes[i];
              box.bg.setFillStyle(0x111122, 0.3).setStrokeStyle(1, 0x333344);
              box.txt.setText("--");
              box.bg.removeInteractive();
              box.eliminated = true;
              this.removedChoices.push(i);
            });
            this.usedFifty = true;
            this.showFloatingText(W / 2, 350, "50/50!", "#3b82f6");
          } else if (key === "doublePoints") {
            this.powerUps.doublePoints--;
            this.doublePointsActive = true;
            sfx.powerUp();
            this.showFloatingText(W / 2, 350, tr("DOUBLE POINTS!", "¡PUNTOS DOBLES!"), "#fbbf24");
          }
          this.updatePowerUpHUD();
        }

        showFloatingText(x, y, text, color, size) {
          const ft = this.add
            .text(x, y, text, {
              fontSize: size || "24px",
              fontStyle: "bold",
              color: color || "#fbbf24",
              stroke: "#000",
              strokeThickness: 3,
            })
            .setOrigin(0.5)
            .setDepth(40);
          this.tweens.add({
            targets: ft,
            y: y - 60,
            alpha: { from: 1, to: 0 },
            scale: { from: 1, to: 1.5 },
            duration: 1000,
            onComplete: () => ft.destroy(),
          });
        }

        showPhaseTransition(text) {
          sfx.phaseTransition();
          this.transitionOverlay.setAlpha(0);
          this.transitionText.setText(text).setAlpha(0).setScale(0.5);
          this.tweens.add({
            targets: this.transitionOverlay,
            alpha: 0.7,
            duration: 300,
            yoyo: true,
            hold: 800,
          });
          this.tweens.add({
            targets: this.transitionText,
            alpha: 1,
            scale: 1.3,
            duration: 400,
            yoyo: true,
            hold: 600,
            ease: "Back.easeOut",
            onComplete: () => this.transitionText.setAlpha(0),
          });
        }

        updatePowerUpHUD() {
          this.puBtns.forEach((pu) => {
            const count = this.powerUps[pu.key];
            pu.txt.setText(`${pu.label} (${count})`);
            pu.bg.setAlpha(count > 0 ? 1 : 0.3);
          });
        }

        loadQuestion() {
          if (this.qIndex >= this.totalQ) {
            this.endGame();
            return;
          }
          this.answered = false;
          this.selectedIdx = -1;
          this.doublePointsActive = false;
          this.removedChoices = [];
          this.wrongTries = 0;
          this.usedFifty = false;
          this.questionStartTime = Date.now();
          const q = this.questions[this.qIndex];

          // Phase transition at question 6 and 11
          if (this.qIndex === 5) {
            this.showPhaseTransition(tr("PHASE 2: NEW CHALLENGES!", "FASE 2: ¡NUEVOS RETOS!"));
          } else if (this.qIndex === 10) {
            this.showPhaseTransition(tr("PHASE 3: FINAL STRETCH!", "FASE 3: ¡ÚLTIMO TRAMO!"));
          }

          // Update HUD
          this.updateHUD();
          this.updatePowerUpHUD();
          // Progress
          this.progFill.width = (this.qIndex / this.totalQ) * (W - 40);
          // Tier badge
          const tierLabels = [1, 2, 3].map((n) => tr("TIER ", "NIVEL ") + n);
          const tierColors = ["#22c55e", "#f59e0b", "#ef4444"];
          this.tierBadge.setText(tierLabels[q.tier - 1]);
          this.tierBadge.setStyle({
            backgroundColor: tierColors[q.tier - 1],
            color: "#fff",
            fontSize: "13px",
            padding: { x: 8, y: 3 },
          });
          // Question text with entrance animation
          this.qText.setText(q.text).setAlpha(0).setScale(0.8);
          eeAnnounce(
            `${tr("Part", "Parte")} ${this.qIndex + 1} ${tr("of", "de")} ${this.totalQ}. ${q.text}. ${tr("Parts", "Piezas")}: ${q.options
              .map((o, i) => `${i + 1}, ${o}`)
              .join("; ")}.`,
          );
          this.tweens.add({
            targets: this.qText,
            alpha: 1,
            scale: 1,
            duration: 300,
            ease: "Back.easeOut",
          });
          // Clear old answer boxes
          this.answerBoxes.forEach((b) => {
            b.bg.destroy();
            b.txt.destroy();
            b.highlight.destroy();
            if (b.numLabel) b.numLabel.destroy();
          });
          this.answerBoxes = [];
          // flagship-studio reads answerBtns[i].eliminated to disable retired parts.
          this.answerBtns = this.answerBoxes;
          // Create new answer boxes on conveyor
          const opts = q.options;
          const spacing = 200;
          const startX = W + 100;
          opts.forEach((opt, i) => {
            const x = startX + i * spacing;
            const bg = this.add
              .rectangle(x, 440, 160, 50, 0x1e293b)
              .setStrokeStyle(2, 0x3b82f6)
              .setDepth(3)
              .setInteractive({ useHandCursor: true });
            const highlight = this.add.rectangle(x, 440, 164, 54, 0x3b82f6, 0).setDepth(2);
            const txt = this.add
              .text(x, 440, opt, {
                fontSize: "18px",
                color: "#e2e8f0",
                fontStyle: "bold",
              })
              .setOrigin(0.5)
              .setDepth(4);
            const numLabel = this.add
              .text(x - 70, 418, String(i + 1), {
                fontSize: "11px",
                color: "#64748b",
              })
              .setDepth(4);
            bg.on("pointerover", () => {
              if (!this.answered && !this.removedChoices.includes(i)) {
                bg.setStrokeStyle(3, 0xfbbf24);
                this.tweens.add({
                  targets: bg,
                  scaleX: 1.06,
                  scaleY: 1.06,
                  duration: 100,
                });
                sfx.click();
              }
            });
            bg.on("pointerout", () => {
              if (!this.answered && this.selectedIdx !== i) {
                bg.setStrokeStyle(2, 0x3b82f6);
                this.tweens.add({
                  targets: bg,
                  scaleX: 1,
                  scaleY: 1,
                  duration: 100,
                });
              }
            });
            bg.on("pointerdown", () => {
              if (!this.answered && !this.removedChoices.includes(i)) this.selectAnswer(i);
            });
            this.answerBoxes.push({
              bg,
              txt,
              highlight,
              numLabel,
              optText: opt,
              idx: i,
              x,
            });
          });
          // Animate boxes sliding in
          this.answerBoxes.forEach((box, i) => {
            const targetX = 150 + i * 220;
            if (this.reduceMotion) {
              [box.bg, box.txt, box.highlight].forEach((o) => (o.x = targetX));
              box.numLabel.x = targetX - 70;
              return;
            }
            this.tweens.add({
              targets: [box.bg, box.txt, box.highlight, box.numLabel],
              x: targetX,
              duration: 800 + i * 150,
              ease: "Back.easeOut",
              delay: i * 100,
            });
          });
          // Reset feedback
          this.fbText.setText("");
          this.hintText.setText("");
          this.speedIndicator.setAlpha(0);
          this.leverLabel.setAlpha(0);
          this.drawLever(this.lever, false);
        }

        selectAnswer(idx) {
          if (this.answered) return;
          if (this.removedChoices.includes(idx)) return;
          // Second tap on the already-highlighted choice locks it in.
          if (this.selectedIdx === idx) {
            this.submitAnswer(idx);
            return;
          }
          // Deselect previous
          this.answerBoxes.forEach((b, i) => {
            if (!this.removedChoices.includes(i)) {
              b.bg.setStrokeStyle(2, 0x3b82f6);
              b.highlight.setAlpha(0);
            }
          });
          this.selectedIdx = idx;
          const box = this.answerBoxes[idx];
          box.bg.setStrokeStyle(3, 0xfbbf24);
          box.highlight.setAlpha(0.15);
          sfx.click();
          // Highlight only — student confirms via the lever, a second tap
          // on the highlighted choice, or Enter. No auto-submit.
          this.leverLabel.setAlpha(1);
        }

        submitAnswer(idx) {
          if (this.answered) return;
          if (this.removedChoices.includes(idx)) return;
          const q = this.questions[this.qIndex];
          const box = this.answerBoxes[idx];
          const chosen = box.optText;
          const correct = chosen === q.correct;
          this.leverLabel.setAlpha(0);

          // Pull lever animation
          this.drawLever(this.lever, true);
          sfx.lever();
          this.time.delayedCall(350, () => this.drawLever(this.lever, false));

          if (correct) {
            this.answered = true;
            this.totalCorrect++;
            window.FlagshipAdventure?.record({
              firstTry: this.wrongTries === 0 && !this.usedFifty,
              kind: q.skill || "expression",
            });
            const tries = this.wrongTries;
            if (tries === 0 && !this.usedFifty) this.firstTry++;
            let pts = q.tier * 10 * (1 + Math.min(this.streak, 5) * 0.1);
            // Full points for an unaided first try; fewer once help was used.
            if (tries === 1) pts *= 0.5;
            else if (tries >= 2) pts *= 0.25;
            else if (this.usedFifty) pts *= 0.5;
            pts = Math.round(pts);

            // Double points
            if (this.doublePointsActive) {
              pts *= 2;
              this.showFloatingText(W / 2, 300, tr("DOUBLED!", "¡DOBLE!"), "#fbbf24", "18px");
            }

            this.score += pts;
            if (tries === 0) {
              this.streak++;
              if (this.streak > this.bestStreak) this.bestStreak = this.streak;
            } else {
              this.streak = 0;
              this.noteMiss(q);
            }
            this.combo = Math.max(1, Math.min(this.streak, 5));

            box.bg.setFillStyle(0x22c55e);
            box.bg.setStrokeStyle(3, 0x22c55e);
            if (!this.reduceMotion)
              this.tweens.add({
                targets: box.bg,
                scaleX: { from: 1.15, to: 1 },
                scaleY: { from: 1.15, to: 1 },
                duration: 200,
              });

            const streakText = this.streak >= 3 ? tr(` STREAK x${this.streak}!`, ` ¡RACHA x${this.streak}!`) : "";
            const lead =
              tries === 0 && !this.usedFifty
                ? tr(`CORRECT! +${pts} pts`, `¡CORRECTO! +${pts} pts`) + streakText
                : tr(`CORRECT with help! +${pts} pts`, `¡CORRECTO con ayuda! +${pts} pts`);
            this.fbText.setText(lead);
            this.fbText.setColor("#4ade80");
            // Reinforce the method with the full worked step.
            this.hintText.setText(tr("How it works: ", "Así funciona: ") + q.step);
            eeAnnounce(`${lead}. ${q.step}`);
            sfx.correct();
            this.showFloatingText(box.bg.x, box.bg.y - 40, `+${pts}`, "#22c55e", "28px");

            if (this.streak === 3) {
              sfx.streak3();
              this.showFloatingText(W / 2, H / 2 - 50, tr("STREAK x3!", "¡RACHA x3!"), "#f59e0b", "32px");
            } else if (this.streak === 5) {
              sfx.streak5();
              this.showFloatingText(W / 2, H / 2 - 50, tr("STREAK x5! AMAZING!", "¡RACHA x5! ¡INCREÍBLE!"), "#ef4444", "34px");
            } else if (this.streak === 7) {
              sfx.streak7();
              this.showFloatingText(
                W / 2,
                H / 2 - 50,
                tr("STREAK x7! UNSTOPPABLE!", "¡RACHA x7! ¡IMPARABLE!"),
                "#a78bfa",
                "36px",
              );
            }
            if (this.streak >= 2) {
              this.hudStreak.setText(`${tr("STREAK", "RACHA")}: ${this.streak}x`);
              this.streakBg.setSize(130, 28).setFillStyle(0xf59e0b, 0.15);
              if (!this.reduceMotion)
                this.tweens.add({
                  targets: this.streakContainer,
                  scaleX: { from: 1.3, to: 1 },
                  scaleY: { from: 1.3, to: 1 },
                  duration: 300,
                  ease: "Back.easeOut",
                });
            }

            if (!this.reduceMotion) {
              const confettiCount = Math.min(10 + this.streak * 5, 40);
              this.confettiEmitter.setQuantity(confettiCount);
              this.confettiEmitter.emitParticleAt(box.bg.x, box.bg.y);
              this.sparkEmitter.setPosition(box.bg.x, box.bg.y);
              this.sparkEmitter.explode(20);
              this.cameras.main.shake(120, 0.003);
            }
            // Other parts dim out; the accepted part stays put to be read.
            this.answerBoxes.forEach((b, i) => {
              if (i !== idx) {
                b.bg.setFillStyle(0x1e293b, 0.4);
                b.txt.setAlpha(0.4);
              }
            });
            this.showNextButton();
          } else {
            // Wrong: this part is rejected, the student tries again.
            this.wrongTries++;
            this.streak = 0;
            this.combo = 1;
            this.hudStreak.setText("");
            this.streakBg.setFillStyle(0x000000, 0);
            this.selectedIdx = -1;
            box.bg.setFillStyle(0x7f1d1d, 0.6).setStrokeStyle(2, 0xef4444);
            box.txt.setAlpha(0.45);
            box.bg.removeInteractive();
            box.eliminated = true;
            this.removedChoices.push(idx);
            this.missTally[q.skill] = (this.missTally[q.skill] || 0) + 1;
            const why = (q.why && q.why[chosen]) || tr("that part does not match.", "esa pieza no coincide.");
            const left = this.answerBoxes.filter((b, i) => !this.removedChoices.includes(i));
            sfx.wrong();
            this.redFlash.setAlpha(0.12);
            this.tweens.add({ targets: this.redFlash, alpha: 0, duration: 400 });
            this.drawRobot(this.robotG, 0xef4444);
            this.time.delayedCall(500, () => this.drawRobot(this.robotG, 0x3b82f6));
            if (left.length <= 1) {
              // Only the right part is left: show the full worked step.
              this.answered = true;
              const ci = this.answerBoxes.findIndex((b) => b.optText === q.correct);
              if (ci >= 0) {
                this.answerBoxes[ci].bg.setFillStyle(0x166534).setStrokeStyle(3, 0x22c55e);
              }
              this.noteMiss(q);
              // Last rung of the ladder: the worked solution, shown only now.
              const shown = tr("Here is how it works: ", "Así se resuelve: ") + q.step;
              this.fbText.setText(tr("Not quite — ", "Todavía no: ") + why);
              this.fbText.setColor("#fca5a5");
              this.hintText.setText(shown);
              eeAnnounce(`${tr("Not quite.", "Todavía no.")} ${why} ${shown}`);
              this.showNextButton();
            } else {
              const hint =
                this.wrongTries === 1
                  ? tr("Hint: ", "Pista: ") + q.method
                  : tr("Try this step: ", "Prueba este paso: ") + q.nudge;
              this.fbText.setText(tr("Not quite — ", "Todavía no: ") + why);
              this.fbText.setColor("#fca5a5");
              this.hintText.setText(hint);
              eeAnnounce(
                `${tr("Not quite.", "Todavía no.")} ${why} ${hint} ${tr("Pick another part.", "Elige otra pieza.")}`,
              );
            }
          }
          this.updateHUD();
        }

        noteMiss(q) {
          if (q && !this.missedQs.includes(q)) this.missedQs.push(q);
        }

        // Self-paced: the student moves on when ready (button, Enter or Space).
        showNextButton() {
          const last = this.qIndex + 1 >= this.totalQ;
          const label = last ? tr("SEE RESULTS ▶", "VER RESULTADOS ▶") : tr("NEXT PART ▶", "SIGUIENTE ▶");
          const bg = this.add
            .rectangle(W - 140, 640, 230, 56, 0x22c55e)
            .setStrokeStyle(2, 0xbbf7d0)
            .setDepth(30)
            .setInteractive({ useHandCursor: true });
          const t = this.add
            .text(W - 140, 640, label, { fontSize: "20px", color: "#052e16", fontStyle: "bold" })
            .setOrigin(0.5)
            .setDepth(31);
          bg.on("pointerdown", () => this.advance());
          this.nextBtn = [bg, t];
        }

        advance() {
          if (!this.answered || !this.nextBtn) return;
          this.nextBtn.forEach((o) => o.destroy());
          this.nextBtn = null;
          this.qIndex++;
          if (this.qIndex < this.totalQ) this.loadQuestion();
          else this.endGame();
        }

        handleKey(e) {
          if (this.answered) {
            if (e.key === "Enter" || e.key === " ") this.advance();
            return;
          }
          if (e.key >= "1" && e.key <= "4") {
            const idx = parseInt(e.key) - 1;
            if (idx < this.answerBoxes.length && !this.removedChoices.includes(idx))
              this.selectAnswer(idx);
          }
          if (e.key === "q" || e.key === "Q") {
            this.activatePowerUp("fiftyFifty");
          }
          if (e.key === "w" || e.key === "W") {
            this.activatePowerUp("doublePoints");
          }
          if (e.key === "ArrowRight") {
            this.selectedIdx = Math.min(this.selectedIdx + 1, this.answerBoxes.length - 1);
            if (this.selectedIdx < 0) this.selectedIdx = 0;
            // Skip removed choices
            while (
              this.removedChoices.includes(this.selectedIdx) &&
              this.selectedIdx < this.answerBoxes.length - 1
            ) {
              this.selectedIdx++;
            }
            this.highlightSelected();
          }
          if (e.key === "ArrowLeft") {
            this.selectedIdx = Math.max(this.selectedIdx - 1, 0);
            while (this.removedChoices.includes(this.selectedIdx) && this.selectedIdx > 0) {
              this.selectedIdx--;
            }
            this.highlightSelected();
          }
          if (
            e.key === "Enter" &&
            this.selectedIdx >= 0 &&
            !this.removedChoices.includes(this.selectedIdx)
          ) {
            this.submitAnswer(this.selectedIdx);
          }
        }

        highlightSelected() {
          this.answerBoxes.forEach((b, i) => {
            if (this.removedChoices.includes(i)) return;
            if (i === this.selectedIdx) {
              b.bg.setStrokeStyle(3, 0xfbbf24);
              b.highlight.setAlpha(0.15);
            } else {
              b.bg.setStrokeStyle(2, 0x3b82f6);
              b.highlight.setAlpha(0);
            }
          });
          sfx.click();
        }

        updateHUD() {
          this.hudQ.setText(`${tr("PART", "PIEZA")} ${Math.min(this.qIndex + 1, this.totalQ)}/${this.totalQ}`);
          this.hudScore.setText(`${tr("SCORE", "PUNTOS")}: ${this.score}`);
          this.hudLives.setText(`${tr("FIRST TRY", "1.er INTENTO")}: ${this.firstTry}`);
          if (this.streak < 2) {
            this.hudStreak.setText("");
            this.streakBg.setFillStyle(0x000000, 0);
          }
          this.hudCombo.setText(this.combo > 1 ? `${tr("COMBO", "COMBO")} x${this.combo}` : "");
          // Calm play: no on-screen clock (elapsed time still logged at results).
          this.hudTimer.setText("");
        }

        update() {
          // Animate conveyor segments (decorative belt surface). Frozen under
          // reduced motion; conveyorSpeed itself is untouched so gameplay
          // pacing/difficulty logic is unchanged.
          if (!this.reduceMotion) {
            this.conveyorParts.forEach((seg) => {
              seg.x -= this.conveyorSpeed;
              if (seg.x < -40) seg.x += 30 * 40;
            });
          }
          // Smooth pointer parallax on the background gears.
          this.updateParallax();
          // Update timer
          this.updateHUD();
        }

        endGame() {
          const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
          try {
            window.EduPulse &&
              EduPulse.record({
                activityTitle: document.title,
                score: this.totalCorrect,
                maxScore: this.totalQ,
                problemsCorrect: this.totalCorrect,
                problemsAttempted: this.totalQ,
                percent: this.totalQ ? Math.round((this.totalCorrect / this.totalQ) * 100) : 0,
              });
          } catch (e) {}
          this.cameras.main.fadeOut(400);
          this.time.delayedCall(400, () => {
            this.scene.start("Results", {
              score: this.score,
              total: this.totalQ,
              correct: this.totalCorrect,
              bestStreak: this.bestStreak,
              time: elapsed,
              difficulty: this.difficulty,
              firstTry: this.firstTry,
              missTally: this.missTally,
              missed: this.missedQs,
              spare: this.spare || [],
            });
          });
        }
      }

          this.add
            .text(cx, btnY + 62, nextTip, {
              fontSize: "18px",
              color: "#fde68a",
              fontStyle: "bold",
              align: "center",
              wordWrap: { width: 860 },
            })
            .setOrigin(0.5);
          this.add
            .text(
              cx,
              btnY + 100,
              tr(
                "Skills: exponents • order of operations • write and evaluate expressions • distributive property • combining like terms",
                "Destrezas: exponentes • orden de las operaciones • escribir y evaluar expresiones • propiedad distributiva • combinar términos semejantes",
              ),
              { fontSize: "15px", color: "#cbd5e1", align: "center", wordWrap: { width: 860 } },
            )
            .setOrigin(0.5);
          // Footer
          this.add
            .text(
              cx,
              H - 30,
              tr(
                "Expression Engine — Neft Teacher — Unit 6 · 6.AT.5–6.AT.7 · Enter = play again · Esc = menu",
                "Expression Engine — Neft Teacher — Unidad 6 · 6.AT.5–6.AT.7 · Enter = otra vez · Esc = menú",
              ),
              {
              fontSize: "13px",
              color: "#94a3b8",
            })
            .setOrigin(0.5);

          // Keyboard
          this.input.keyboard.on("keydown", (e) => {
            if (!this.sys.isActive()) return;
            if (e.key === "Enter" || e.key === " ") {
              this.cameras.main.fadeOut(300);
              this.time.delayedCall(300, () =>
                this.scene.start("Game", { difficulty: d.difficulty }),
              );
            }
            if (e.key === "Escape") {
              this.cameras.main.fadeOut(300);
              this.time.delayedCall(300, () => this.scene.start("Title"));
            }
          });

          this.cameras.main.fadeIn(600);
        }
      }

      // --- PHASER CONFIG ---
      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0f172a",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, GameScene, ResultsScene],
        physics: {
          default: "arcade",
          arcade: { gravity: { y: 0 }, debug: false },
        },
        input: { keyboard: true, mouse: true, touch: true },
      };
      const game = (window.__flagshipGame = new Phaser.Game(config));

      // --- Focus & keyboard management (additive; no gameplay change) ---
      // Phaser renders to a <canvas>; by default it is not in the tab order, so
      // keyboard-only students cannot focus the game to use Arrow/Enter/1-4.
      // Make the canvas focusable + labeled, and focus it on first pointer so
      // keyboard controls work immediately. The :focus-visible ring comes from
      // the shared GameFX stylesheet.
      game.events.once("ready", function () {
        try {
          const canvas = game.canvas;
          if (!canvas) return;
          if (!canvas.hasAttribute("tabindex")) canvas.setAttribute("tabindex", "0");
          canvas.setAttribute("role", "application");
          canvas.setAttribute(
            "aria-label",
            tr(
              "Expression Engine math game. Use arrow keys to move between answer boxes, Enter to lock in, or number keys 1 to 4 then Enter. Questions and feedback are announced as text.",
              "Juego Expression Engine. Usa las flechas para moverte entre las piezas, Enter para confirmar, o las teclas 1 a 4 y luego Enter. Las preguntas y la retroalimentación se anuncian como texto.",
            ),
          );
          // Focus the game when a student clicks/taps into it.
          canvas.addEventListener("pointerdown", function () {
            try {
              canvas.focus({ preventScroll: true });
            } catch (e) {
              canvas.focus();
            }
          });
        } catch (e) {}
      });
    </script>
