      * {
        margin: 0;

      html,

        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #0a1a2e;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      canvas {
        display: block;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }
      /* Keyboard focus ring on the game canvas (keyboard users only). */
      canvas:focus-visible {
        outline: 3px solid #2f6df0;
        outline-offset: 4px;
        border-radius: 8px;
      }
      canvas:focus:not(:focus-visible) {
        outline: none;
      }
      /* ── Bespoke animated parallax cityscape behind the Phaser canvas ──
         Sits behind the canvas (z-index 0), never intercepts pointer input. */
      #aa-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(120% 80% at 50% 0%, #142c4a 0%, #0a1a2e 60%, #06101d 100%);
      }
      #aa-bg-layer {
        position: absolute;
        inset: -6% -6%;
        will-change: transform;
        transition: transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .aa-twinkle {
        position: absolute;
        border-radius: 50%;
        background: #aaccff;
        opacity: 0.5;
        animation: aaTwinkle var(--tw, 3s) ease-in-out infinite;
      }
      .aa-tower {
        position: absolute;
        bottom: 0;
        opacity: 0.55;
        border-top-left-radius: 4px;
        border-top-right-radius: 4px;
      }
      .aa-tower::after {
        content: "";
        position: absolute;
        inset: 8px 6px auto 6px;
        height: 5px;
        border-radius: 2px;
        background: repeating-linear-gradient(
          90deg,
          rgba(255, 221, 136, 0.55) 0 4px,
          transparent 4px 12px
        );
        box-shadow:
          0 14px rgba(255, 221, 136, 0.4),
          0 28px rgba(255, 221, 136, 0.3);
      }
      @keyframes aaTwinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.85);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.15);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #aa-bg-layer {
          transition: none !important;
          transform: none !important;
        }
        .aa-twinkle {
          animation: none !important;
          opacity: 0.4 !important;
        }
      }
      /* Visually-hidden live region: mirrors the blueprint prompt and each
         lock-in result for screen readers (also feeds the hint ladder). */
      #aa-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

    <script>
      // ── Parallax cityscape builder + pointer driver (additive, gameplay-neutral) ──
      // Procedurally builds a layered skyline of CSS towers + twinkling lights
      // behind the canvas, then drifts it with pointer/device motion. All motion
      // is gated by prefers-reduced-motion (rebuilt static if the user prefers).
      (function () {
        "use strict";
        var reduceMQ = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("aa-bg-layer");
        if (!layer) return;

        var TOWER_COLORS = ["#1a3366", "#224488", "#2a4f93", "#16294a", "#1f3a6e"];

        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }

        function buildSkyline() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var vw = window.innerWidth || 800;
          var vh = window.innerHeight || 600;
          // Twinkling stars (top band).
          var starCount = reduce ? 14 : 28;
          for (var s = 0; s < starCount; s++) {
            var st = document.createElement("div");
            st.className = "aa-twinkle";
            var sz = rnd(1.5, 3.5);
            st.style.width = st.style.height = sz.toFixed(1) + "px";
            st.style.left = rnd(0, 100).toFixed(2) + "%";
            st.style.top = rnd(0, 45).toFixed(2) + "%";
            st.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            st.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(st);
          }
          // Two depth bands of towers for a parallax feel.
          var count = Math.max(10, Math.round(vw / 70));
          for (var i = 0; i < count; i++) {
            var t = document.createElement("div");
            t.className = "aa-tower";
            var w = rnd(36, 84);
            var h = rnd(vh * 0.18, vh * 0.6);
            t.style.width = w.toFixed(0) + "px";
            t.style.height = h.toFixed(0) + "px";
            t.style.left = ((i / count) * 100 + rnd(-3, 3)).toFixed(2) + "%";
            t.style.background = TOWER_COLORS[Math.floor(Math.random() * TOWER_COLORS.length)];
            t.style.opacity = (0.4 + Math.random() * 0.3).toFixed(2);
            layer.appendChild(t);
          }
        }

        buildSkyline();

        // Pointer parallax drift — only when motion is allowed. We listen on
        // window (passive) because the Phaser canvas sits above the background
        // and would otherwise swallow the pointer events; we never call
        // preventDefault, so gameplay input is fully preserved.
        var driverAttached = false;
        function onPointer(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" + (dx * 22).toFixed(2) + "px," + (dy * 14).toFixed(2) + "px,0)";
        }
        function attachDriver() {
          if (driverAttached || (reduceMQ && reduceMQ.matches)) return;
          driverAttached = true;
          window.addEventListener("pointermove", onPointer, { passive: true });
        }
        function detachDriver() {
          if (!driverAttached) return;
          driverAttached = false;
          window.removeEventListener("pointermove", onPointer);
          layer.style.transform = "";
        }

        attachDriver();
        if (reduceMQ) {
          var onChange = function () {
            buildSkyline();
            if (reduceMQ.matches) detachDriver();
            else attachDriver();
          };
          if (reduceMQ.addEventListener) reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }

        // Rebuild skyline on resize/orientation (debounced) so it stays full-bleed.
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(buildSkyline, 200);
        });
      })();
    </script>
    <script>
      // ── AREA ARCHITECT — City Builder (build-the-shape edition) ──
      // Phaser 3 — Grade 6 Math — 6.GR.A.1 (areas of triangles, special
      // quadrilaterals, and composite figures).
      //
      // Math-as-mechanic rebuild: instead of picking one of four answers, the
      // student BUILDS each shape on the blueprint grid with +/− steppers
      // (full keyboard + tap paths), watching a live formula readout until it
      // matches the blueprint, then locks the build in. Calm and self-paced:
      // no timer, no falling shapes, and hearts refill (no game-over).

      const LS_KEY = "area_architect_highscore";

      const SFX = {
        ctx: null,
        init() {
          if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        play(t, f, d, v = 0.2) {
          if (window.__flagshipMuted) return;
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        noise(d, v = 0.08) {
          if (window.__flagshipMuted) return;
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              bufSize = c.sampleRate * d;
            const buf = c.createBuffer(1, bufSize, c.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const src = c.createBufferSource();
            src.buffer = buf;
            const g = c.createGain();
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            src.connect(g);
            g.connect(c.destination);
            src.start();
            src.stop(c.currentTime + d);
          } catch (e) {}
        },
        place() {
          this.play("sine", 440, 0.1, 0.25);
          this.play("sine", 554, 0.12, 0.2);
        },
        correct() {
          this.play("sine", 660, 0.1, 0.3);
          this.play("sine", 880, 0.15, 0.25);
        },
        wrong() {
          this.play("sawtooth", 200, 0.25, 0.2);
          this.play("sawtooth", 150, 0.3, 0.15);
          this.noise(0.15, 0.1);
        },
        drop() {
          this.play("triangle", 200, 0.08, 0.15);
        },
        combo() {
          this.play("sine", 784, 0.08);
          this.play("sine", 988, 0.1);
          this.play("sine", 1175, 0.12);
        },
        streak3() {
          [523, 659, 784].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.12, 0.2), i * 60),
          );
        },
        streak5() {
          [523, 659, 784, 988, 1175].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.25), i * 50),
          );
        },
        streak7() {
          [523, 659, 784, 988, 1175, 1318, 1568].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.18, 0.3), i * 45),
          );
        },
        levelUp() {
          [523, 659, 784, 880, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.25), i * 80),
          );
        },
        phaseTransition() {
          [392, 440, 523, 659, 784, 880].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.2, 0.2), i * 60),
          );
        },
        win() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.3), i * 120),
          );
        },
        win3star() {
          [523, 659, 784, 880, 1047, 1175, 1318, 1568].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.3, 0.3), i * 100),
          );
        },
        tick() {
          this.play("square", 600, 0.03, 0.08);
        },
        highScore() {
          [523, 784, 1047, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.2, 0.3), i * 120),
          );
        },
      };

      // Screen-reader announcer: mirrors the current blueprint prompt and each
      // lock-in result into the #aa-sr aria-live region. This region is also
      // what the Socratic hint ladder watches (see the ghl block at the end of
      // the page).
      function srSay(msg) {
        const el = document.getElementById("aa-sr");
        if (el) el.textContent = msg;
      }

      // ── Language: site-wide key nt-lang; the "ewl:lang" event keeps every
      // open view in sync when it changes. tr({en, es}, vars) fills {names}.
      const LANG_KEY = "nt-lang";
      function lang() {
        try {
          return localStorage.getItem(LANG_KEY) === "es" ? "es" : "en";
        } catch (e) {
          return "en";
        }
      }
      function tr(value, vars) {
        let s = value == null ? "" : typeof value === "string" ? value : value[lang()] || value.en;
        if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
        return s;
      }
      function toggleLang() {
        const next = lang() === "es" ? "en" : "es";
        try {
          localStorage.setItem(LANG_KEY, next);
        } catch (e) {}
        document.dispatchEvent(new CustomEvent("ewl:lang", { detail: { lang: next } }));
      }
      const FONT = '"Outfit", "Segoe UI", system-ui, sans-serif';

      // No Phaser/DOM in this section (only lang()/tr() above): keep it

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function fmtNum(n) {
        return Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10);
      }

          es: "Cuenta los lados: un {name} tiene {sides} lados, así que se divide en {sides} triángulos iguales.",
        },
        m2polyA: {
          en: "One triangle: ½ × {s} × {a} = {tri}. Your total of {t} is too {hl}.",
          es: "Un triángulo: ½ × {s} × {a} = {tri}. Tu total de {t} es demasiado {hl}.",
        },
        // Tier 3 — the meter switches on and the result is shown.
        m3shape: {
          en: "Area meter on: {d} = {v}, because {f} = {need}.",
          es: "Medidor de área encendido: {d} = {v}, porque {f} = {need}.",
        },
        m3comp: {
          en: "Area meter on: {a1} + {a2} = {need}.",
          es: "Medidor de área encendido: {a1} + {a2} = {need}.",
        },
        m3poly: {
          en: "Area meter on: {sides} triangles × {tri} = {need}.",
          es: "Medidor de área encendido: {sides} triángulos × {tri} = {need}.",
        },
        // Misconceptions spotted from the exact wrong build.
        triHalf: {
          en: "{b} × {h} = {need} is the whole dashed rectangle. A triangle is only HALF of it.",
          es: "{b} × {h} = {need} es todo el rectángulo punteado. El triángulo es solo la MITAD.",
        },
        trapHalf: {
          en: "({b1} + {b2}) × {h} is twice the trapezoid — remember the ½.",
          es: "({b1} + {b2}) × {h} es el doble del trapecio: recuerda el ½.",
        },
        trapOne: {
          en: "That uses only one base. A trapezoid's area uses BOTH parallel bases.",
          es: "Eso usa solo una base. El área del trapecio usa LAS DOS bases paralelas.",
        },
        compWhole: {
          en: "{W} × {H} is the whole outer rectangle, but the cut corner is not part of the park.",
          es: "{W} × {H} es todo el rectángulo exterior, pero la esquina cortada no es parte del parque.",
        },
        compAddCut: {
          en: "You added the cut corner. It is missing from the park — add only the two pieces.",
          es: "Sumaste la esquina cortada. No es parte del parque: suma solo las dos partes.",
        },
        compOne: {
          en: "That is only one piece. Add BOTH rectangle pieces.",
          es: "Esa es solo una parte. Suma LAS DOS partes rectangulares.",
        },
        polyNoHalf: {
          en: "{n} × {s} × {a} forgets the ½: each triangle is half of an {s} × {a} rectangle.",
          es: "{n} × {s} × {a} olvida el ½: cada triángulo es la mitad de un rectángulo de {s} × {a}.",
        },
        polyOne: {
          en: "That is only ONE triangle. Multiply by the number of triangles.",
          es: "Ese es solo UN triángulo. Multiplica por el número de triángulos.",
        },
        polyPerim: {
          en: "{n} × {s} is the perimeter (the distance around), not the area.",
          es: "{n} × {s} es el perímetro (la distancia alrededor), no el área.",
        },
      };
      const dimShort = (k) => tr(AT.dimShort[k] || k);
      const rowLabel = (k) => tr(AT.rowLabel[k] || k);

      // Regular polygons with real proportions (apothem ÷ side matches the
      // true shape to within 2%) and whole-number areas.
      const POLYGONS = [
        { sides: 6, s: 4, a: 3.5 },
        { sides: 6, s: 8, a: 7 },
        { sides: 5, s: 8, a: 5.5 },
        { sides: 8, s: 5, a: 6 },
        { sides: 10, s: 4, a: 6.2 },
      ];

      // Rounds where the target is (base, height): the blueprint fixes one
      // dimension and the target area; the student sizes the other dimension.
      function baseHeightRound(type, b, h, area) {
        const givenKey = Math.random() < 0.5 ? "b" : "h";
        const target = { b, h };
        const dims = { b: 2, h: 2 };
        dims[givenKey] = target[givenKey];
        const given = {};
        given[givenKey] = target[givenKey];
        const freeKey = givenKey === "b" ? "h" : "b";
        return settleStart({ type, area, target, given, freeKey, dims, meter: false });
      }

      // The free dimension never STARTS on the answer or on a value that a
      // misconception check would flag — feedback must describe what the
      // student did, not where the stepper happened to begin.
      function settleStart(round) {
        for (const v of [2, 1, 3, 4, 5, 6]) {
          round.dims[round.freeKey] = v;
          if (currentArea(round) !== round.area && !misconceptionFor(round)) break;
        }
        return round;
      }

      function makeRound(type) {
        if (type === "rectangle" || type === "parallelogram") {
          // Parallelograms draw with a 1-cell slant, so cap the base at 9.
          const b = randInt(2, type === "parallelogram" ? 9 : 10);
          const h = randInt(2, 10);
          return baseHeightRound(type, b, h, b * h);
        }
        if (type === "triangle") {
          const b = randInt(2, 10);
          let h = randInt(2, 10);
          if ((b * h) % 2) h += 1; // keep ½·b·h a whole number (h ≤ 11 fits)
          return baseHeightRound(type, b, h, (b * h) / 2);
        }
        if (type === "trapezoid") {
          let h = randInt(2, 8);
          const b1 = randInt(2, 7);
          let b2 = randInt(3, 10);
          if (b2 === b1) b2 = b1 < 10 ? b1 + 1 : b1 - 1;
          if (((b1 + b2) * h) % 2) h += 1; // keep the area a whole number
          return settleStart({
            type,
            area: ((b1 + b2) * h) / 2,
            target: { b1, b2, h },
            given: { b1, h },
            freeKey: "b2",
            dims: { b1, b2: 2, h },
            meter: false,
          });
        }
        if (type === "polygon") {
          const p = POLYGONS[randInt(0, POLYGONS.length - 1)];
          return {
            type,
            sides: p.sides,
            s: p.s,
            a: p.a,
            area: Math.round((p.sides * p.s * p.a) / 2),
            target: { n: p.sides, A: Math.round((p.sides * p.s * p.a) / 2) },
            given: {},
            freeKey: "n",
            dims: { n: 3, A: 0 },
            meter: false,
          };
        }
        // Composite: L-shape = outer W×H rectangle with a top-right corner cut
        // away. Phase 1: pick a slicing line; phase 2: lock in the total area.
        const W = randInt(6, 10);
        const H = randInt(6, 10);
        return {
          type: "composite",
          W,
          H,
          nw: randInt(2, W - 3),
          nh: randInt(2, H - 3),
          get area() {
            return this.W * this.H - this.nw * this.nh;
          },
          sliceIndex: 0,
          phase: "slice",
          total: 0,
          meter: false,
        };
      }

      // Shuffle-bag so every shape type shows up, not just whichever the dice favour.
      function generateRound(levelNum, bag) {
        if (!bag.length) {
          const types =
            levelNum === 1
              ? ["rectangle", "parallelogram", "triangle"]
              : ["parallelogram", "triangle", "trapezoid", "composite", "polygon"];
          bag.push(...types.sort(() => Math.random() - 0.5));
        }
        return makeRound(bag.pop());
      }

      function dimBounds(round, key) {
        if (key === "n") return { min: 3, max: 12 };
        if (key === "A") return { min: 0, max: 300 };
        if (key === "h") return { min: 1, max: 12 };
        return { min: 1, max: round.type === "parallelogram" ? 9 : 10 };
      }

      function currentArea(round) {
        const d = round.dims;
        if (round.type === "triangle") return (d.b * d.h) / 2;
        if (round.type === "trapezoid") return ((d.b1 + d.b2) * d.h) / 2;
        if (round.type === "polygon") return d.A;
        return d.b * d.h;
      }

      // The two valid one-line decompositions of the L-shape: a vertical cut
      // or a horizontal cut through the concave corner. Both split it into
      // exactly two rectangles (w1 × h1 and w2 × h2).
      function sliceOptions(round) {
        const { W, H, nw, nh } = round;
        return [
          {
            dir: "vertical",
            name: tr(AT.sliceV),
            w1: W - nw,
            h1: H,
            a1: (W - nw) * H,
            l1: tr(AT.leftTower),
            w2: nw,
            h2: H - nh,
            a2: nw * (H - nh),
            l2: tr(AT.rightWing),
          },
          {
            dir: "horizontal",
            name: tr(AT.sliceH),
            w1: W,
            h1: H - nh,
            a1: W * (H - nh),
            l1: tr(AT.bottomFloor),
            w2: W - nw,
            h2: nh,
            a2: (W - nw) * nh,
            l2: tr(AT.topFloor),
          },
        ];
      }

      // The live formula. The RESULT stays hidden ("= ?") until the student
      // has earned the area meter (help tier 3) — they do the arithmetic.
      function formulaFor(round) {
        const d = round.dims;
        const show = round.meter;
        if (round.type === "composite") {
          if (round.phase === "slice") return tr(AT.sliceFirst);
          const o = sliceOptions(round)[round.sliceIndex];
          return (
            "(" + o.w1 + " × " + o.h1 + ") + (" + o.w2 + " × " + o.h2 + ") = " +
            (show ? round.area : "?")
          );
        }
        if (round.type === "polygon")
          return (
            d.n + " × ½ × " + round.s + " × " + fmtNum(round.a) + " = " +
            (show ? fmtNum((d.n * round.s * round.a) / 2) : "?")
          );
        const result = show ? fmtNum(currentArea(round)) : "?";
        if (round.type === "triangle") return "½ × " + d.b + " × " + d.h + " = " + result;
        if (round.type === "trapezoid")
          return "½ × (" + d.b1 + " + " + d.b2 + ") × " + d.h + " = " + result;
        return d.b + " × " + d.h + " = " + result;
      }

      // Short, action-first prompt: line 1 = the goal (target area),
      // line 2 = what the blueprint locked, line 3 = exactly what YOU change.
      function promptFor(round) {
        const title = tr(AT.shape[round.type]);
        if (round.type === "composite") return tr(AT.composite, { title });
        if (round.type === "polygon")
          return tr(AT.polygon, {
            title,
            name: tr(AT.polyName[round.sides]),
            s: round.s,
            a: fmtNum(round.a),
          });
        const goal = tr(AT.goal, { title, a: fmtNum(round.area) });
        const keys = Object.keys(round.given);
        const given =
          keys.length === 2
            ? tr(AT.givenTwo, {
                d1: dimShort(keys[0]),
                v1: round.given[keys[0]],
                d2: dimShort(keys[1]),
                v2: round.given[keys[1]],
              })
            : tr(AT.givenOne, { d: dimShort(keys[0]), v: round.given[keys[0]] });
        return goal + "\n" + given + "\n" + tr(AT.change, { d: dimShort(round.freeKey) });
      }

      // A misconception the exact wrong build reveals, or null.
      function misconceptionFor(round) {
        const d = round.dims;
        const need = round.area;
        if (round.type === "triangle" && d.b * d.h === need)
          return tr(AT.triHalf, { b: d.b, h: d.h, need });
        if (round.type === "trapezoid") {
          if ((d.b1 + d.b2) * d.h === need) return tr(AT.trapHalf, { b1: d.b1, b2: d.b2, h: d.h });
          if (d.b2 * d.h === need || d.b1 * d.h === need) return tr(AT.trapOne);
        }
        if (round.type === "composite") {
          const t = round.total;
          const o = sliceOptions(round)[round.sliceIndex];
          if (t === round.W * round.H) return tr(AT.compWhole, { W: round.W, H: round.H });
          if (t === round.W * round.H + round.nw * round.nh) return tr(AT.compAddCut);
          if (t === o.a1 || t === o.a2) return tr(AT.compOne);
        }
        if (round.type === "polygon" && d.n === round.sides) {
          if (d.A === round.sides * round.s * round.a) {
            return tr(AT.polyNoHalf, { n: round.sides, s: round.s, a: fmtNum(round.a) });
          }
          if (d.A === (round.s * round.a) / 2) return tr(AT.polyOne);
          if (d.A === round.sides * round.s) return tr(AT.polyPerim, { n: round.sides, s: round.s });
        }
        return null;
      }

      // Decide whether a lock-in is correct; if not, return a teaching
      // message for this help tier (1 method · 2 concrete step · 3 meter + result).
      function lockDiagnosis(round, tier) {
        const hl = (diff) => tr(diff > 0 ? AT.tooHigh : AT.tooLow);
        if (round.type === "composite") {
          if (round.total === round.area) return { ok: true };
          const o = sliceOptions(round)[round.sliceIndex];
          const step =
            tier === 1
              ? tr(AT.m1.composite)
              : tier === 2
                ? tr(AT.m2comp, {
                    l1: o.l1,
                    a1: o.a1,
                    l2: o.l2,
                    a2: o.a2,
                    t: round.total,
                    hl: hl(round.total - round.area),
                  })
                : tr(AT.m3comp, { a1: o.a1, a2: o.a2, need: round.area });
          return { ok: false, teach: [misconceptionFor(round), step].filter(Boolean).join(" ") };
        }
        if (round.type === "polygon") {
          const d = round.dims;
          if (d.n === round.sides && d.A === round.area) return { ok: true };
          const tri = fmtNum((round.s * round.a) / 2);
          const name = tr(AT.polyName[round.sides]);
          let step;
          if (tier === 1) step = tr(AT.m1.polygon);
          else if (tier === 2)
            step =
              d.n !== round.sides
                ? tr(AT.m2polyN, { name, sides: round.sides })
                : tr(AT.m2polyA, {
                    s: round.s,
                    a: fmtNum(round.a),
                    tri,
                    t: d.A,
                    hl: hl(d.A - round.area),
                  });
          else step = tr(AT.m3poly, { sides: round.sides, tri, need: round.area });
          return { ok: false, teach: [misconceptionFor(round), step].filter(Boolean).join(" ") };
        }
        const a = currentArea(round);
        if (a === round.area) return { ok: true };
        const diff = a - round.area;
        let step;
        if (tier === 1) step = tr(AT.m1[round.type]);
        else if (tier === 2)
          step = tr(AT.m2shape, {
            now: fmtNum(a),
            need: fmtNum(round.area),
            diff: fmtNum(Math.abs(diff)),
            dir: tr(diff > 0 ? AT.tooMany : AT.tooFew),
            d: dimShort(round.freeKey),
            ud: tr(diff > 0 ? AT.down : AT.up),
          });
        else {
          const solved = Object.assign({}, round, { dims: round.target, meter: true });
          step = tr(AT.m3shape, {
            d: dimShort(round.freeKey),
            v: round.target[round.freeKey],
            f: formulaFor(solved).split(" = ")[0],
            need: fmtNum(round.area),
          });
        }
        return { ok: false, teach: [misconceptionFor(round), step].filter(Boolean).join(" ") };
      }

      const W = 800,

      const config = {

        height: H,
        parent: document.body,
        backgroundColor: "#0a1a2e",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, DiffScene, GameScene, ResultScene],
      };

      const SHAPE_COLORS = {
        rectangle: 0x4488ff,
        parallelogram: 0xff8844,

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });

        // Particle
        g.fillStyle(0xffffff);
        g.fillCircle(3, 3, 3);
        g.generateTexture("particle", 6, 6);
        g.clear();

        // Star
        g.fillStyle(0xffdd00);
        g.fillCircle(4, 4, 4);
        g.generateTexture("star", 8, 8);
        g.clear();

        // Confetti piece (small rectangle)
        g.fillStyle(0xffffff);
        g.fillRect(0, 0, 6, 3);
        g.generateTexture("confetti", 6, 3);
        g.clear();

        g.destroy();
        this.scene.start("Title");
      };

      // ── TITLE ──
      function TitleScene() {
        Phaser.Scene.call(this, "Title");
      }
      TitleScene.prototype = Object.create(Phaser.Scene.prototype);
      TitleScene.prototype.constructor = TitleScene;
      TitleScene.prototype.create = function () {
        const cx = W / 2;
        this.add.rectangle(cx, H / 2, W, H, 0x0a1a2e);

        // Ambient floating particles (dust motes)
        this.ambientParticles = this.add.particles(0, 0, "particle", {
          x: { min: 0, max: W },
          y: { min: 0, max: H },
          speed: { min: 5, max: 20 },
          angle: { min: 260, max: 280 },
          scale: { start: 0.3, end: 0 },
          alpha: { start: 0.4, end: 0 },
          lifespan: { min: 3000, max: 6000 },
          frequency: 200,
          tint: [0x4488ff, 0x44cc88, 0x6688aa],
          blendMode: "ADD",
        });

        // City skyline
        const colors = [0x2244aa, 0x3366cc, 0x4488ff, 0x224488, 0x1a3366];
        for (let i = 0; i < 12; i++) {
          const bw = randInt(30, 70),
            bh = randInt(60, 200);
          const bx = i * 70 + randInt(-10, 10);
          const c = colors[randInt(0, colors.length - 1)];
          const bld = this.add.rectangle(bx, H - bh / 2, bw, bh, c, 0.6);
          // Animate buildings rising on scene start
          bld.setScale(1, 0);
          bld.y = H;
          this.tweens.add({
            targets: bld,
            scaleY: 1,
            y: H - bh / 2,
            duration: 600 + i * 100,
            ease: "Back.easeOut",
            delay: i * 80,
          });
          // Windows
          for (let wy = H - bh + 10; wy < H - 10; wy += 20) {
            for (let wx = bx - bw / 2 + 8; wx < bx + bw / 2 - 8; wx += 14) {
              const win = this.add.rectangle(
                wx,
                wy,
                6,
                8,
                Math.random() > 0.3 ? 0xffdd88 : 0x222244,
                0.7,
              );
              // Random window flicker
              if (Math.random() > 0.7) {
                this.tweens.add({
                  targets: win,
                  alpha: { from: 0.7, to: 0.2 },
                  duration: randInt(1000, 3000),
                  yoyo: true,
                  repeat: -1,
                  delay: randInt(0, 2000),
                });
              }
            }
          }
        }
        // Ground
        this.add.rectangle(cx, H - 10, W, 20, 0x1a3a2e);

        // Floating shapes preview with glow
        const shapes = [
          { type: "rect", x: 160, y: 280, w: 60, h: 40, color: 0x4488ff },
          { type: "tri", x: 350, y: 270, w: 50, h: 45, color: 0x44cc88 },
          { type: "para", x: 540, y: 280, w: 65, h: 35, color: 0xff8844 },
          { type: "trap", x: 680, y: 275, w: 55, h: 40, color: 0xcc44cc },
        ];
        shapes.forEach((s) => {
          const g = this.add.graphics();
          g.fillStyle(s.color, 0.5);
          if (s.type === "rect") g.fillRect(s.x - s.w / 2, s.y - s.h / 2, s.w, s.h);
          else if (s.type === "tri") {
            g.beginPath();
            g.moveTo(s.x, s.y - s.h / 2);
            g.lineTo(s.x + s.w / 2, s.y + s.h / 2);
            g.lineTo(s.x - s.w / 2, s.y + s.h / 2);
            g.closePath();
            g.fill();
          } else if (s.type === "para") {
            g.beginPath();
            g.moveTo(s.x - s.w / 2 + 10, s.y - s.h / 2);
            g.lineTo(s.x + s.w / 2 + 10, s.y - s.h / 2);
            g.lineTo(s.x + s.w / 2 - 10, s.y + s.h / 2);
            g.lineTo(s.x - s.w / 2 - 10, s.y + s.h / 2);
            g.closePath();
            g.fill();
          } else {
            g.beginPath();
            g.moveTo(s.x - 20, s.y - s.h / 2);
            g.lineTo(s.x + 20, s.y - s.h / 2);
            g.lineTo(s.x + s.w / 2, s.y + s.h / 2);
            g.lineTo(s.x - s.w / 2, s.y + s.h / 2);
            g.closePath();
            g.fill();
          }
          // Float animation
          this.tweens.add({
            targets: g,
            y: 15,
            duration: randInt(2000, 4000),
            yoyo: true,
            repeat: -1,
          });
          // Pulse glow
          this.tweens.add({
            targets: g,
            alpha: { from: 0.8, to: 1 },
            duration: randInt(800, 1500),
            yoyo: true,
            repeat: -1,
          });
        });

        // Title with animated entrance
        const titleArea = this.add
          .text(cx, 55, tr(AU.title1), {
            fontSize: "72px",
            fontFamily: "Impact,sans-serif",
            color: "#4488ff",
            stroke: "#0a1a2e",
            strokeThickness: 6,
          })
          .setOrigin(0.5)
          .setAlpha(0)
          .setScale(0.5);
        this.tweens.add({
          targets: titleArea,
          alpha: 1,
          scale: 1,
          duration: 800,
          ease: "Back.easeOut",
          delay: 200,
        });

        const titleArch = this.add
          .text(cx, 125, tr(AU.title2), {
            fontSize: "72px",
            fontFamily: "Impact,sans-serif",
            color: "#44cc88",
            stroke: "#0a1a2e",
            strokeThickness: 6,
          })
          .setOrigin(0.5)
          .setAlpha(0)
          .setScale(0.5);
        this.tweens.add({
          targets: titleArch,
          alpha: 1,
          scale: 1,
          duration: 800,
          ease: "Back.easeOut",
          delay: 500,
        });

        // Subtle title pulse
        this.tweens.add({
          targets: [titleArea, titleArch],
          scaleX: { from: 1, to: 1.02 },
          scaleY: { from: 1, to: 1.02 },
          duration: 2000,
          yoyo: true,
          repeat: -1,
          delay: 1500,
        });

        const subtitle = this.add
          .text(cx, 175, tr(AU.subtitle), {
            fontFamily: FONT,
            fontSize: "20px",
            color: "#88aacc",
            letterSpacing: 6,
          })
          .setOrigin(0.5)
          .setAlpha(0);
        this.tweens.add({
          targets: subtitle,
          alpha: 1,
          y: { from: 190, to: 175 },
          duration: 600,
          delay: 900,
        });

        this.add
          .text(cx, 210, tr(AU.shapes), {
            fontFamily: FONT,
            fontSize: "14px",
            color: "#6688aa",
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 235, tr(AU.tip1), {
            fontFamily: FONT,
            fontSize: "14px",
            color: "#88aacc",
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 258, tr(AU.tip2), {
            fontFamily: FONT,
            fontSize: "13px",
            color: "#557788",
          })
          .setOrigin(0.5);

        // High score display
        let hs = null;
        try {
          hs = localStorage.getItem(LS_KEY);
        } catch (e) {}
        if (hs) {
          this.add
            .text(cx, 310, tr(AU.highScore, { n: hs }), {
              fontFamily: FONT,
              fontSize: "14px",
              color: "#ffdd00",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
        }

        const btn = this.add
          .rectangle(cx, 345, 260, 56, 0x44cc88)
          .setInteractive({ useHandCursor: true });
        const btnT = this.add
          .text(cx, 345, tr(AU.build), {
            fontFamily: FONT,
            fontSize: "22px",
            fontStyle: "bold",
            color: "#0a2a1e",
          })
          .setOrigin(0.5);
        this.tweens.add({
          targets: [btn, btnT],
          scaleX: { from: 1, to: 1.05 },
          scaleY: { from: 1, to: 1.05 },
          duration: 800,
          yoyo: true,
          repeat: -1,
        });

        // Button hover glow
        btn.on("pointerover", () => {
          btn.setFillStyle(0x55ddaa);
          SFX.init();
          SFX.tick();
        });
        btn.on("pointerout", () => btn.setFillStyle(0x44cc88));

        const go = () => {
          SFX.init();
          SFX.place();
          this.cameras.main.fadeOut(400);
          this.time.delayedCall(400, () => this.scene.start("DiffSelect"));
        };
        btn.on("pointerdown", go);
        this.input.keyboard.on("keydown-SPACE", go);
        this.input.keyboard.on("keydown-ENTER", go);

        addLangButton(this, W - 12, 12);
        this.cameras.main.fadeIn(500);
      };

      // ── GAME SCENE ──
      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function (data) {
        data = data || {};
        this.levelNum = data.level || 1;
        this.replayQueue =
          data.replay && data.replay.length
            ? data.replay.map((round) => JSON.parse(JSON.stringify(round)))
            : null;
        this.misses = [];
        // Accessibility: respect the OS "reduce motion" preference. Used only
        // to soften purely-decorative animations (no gameplay change).
        this.reduceMotion = !!(
          window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
        this.score = 0;
        this.combo = 0; // consecutive first-try locks
        this.maxCombo = 0;
        this.lives = 3; // hearts — refill at 0 (no-fail)
        this.stage = 1;
        this.totalCorrect = 0; // rounds locked correctly on the first try
        this.totalWrong = 0; // wrong lock attempts across all rounds
        this.shapesPlaced = 0; // buildings added to the city strip
        this.roundsAsked = 0;
        this.maxRounds = this.replayQueue ? this.replayQueue.length : 10;
        this.round = null;
        this.attempts = 0;
        this.selRow = 0;
        this.lockBusy = false;
        this.roundUI = [];
        this.dimLabelsUI = [];
        this.valueTexts = {};
        this.rowBgs = [];
        this.rowKeys = [];
        this.bag = []; // shuffle-bag of shape types for this run
      };

        // Blueprint grid background + lines
