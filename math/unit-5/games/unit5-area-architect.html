    <title>Area Architect — City Builder | Unit 5</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #0a1a2e;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      canvas {
        display: block;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }
      /* Keyboard focus ring on the game canvas (keyboard users only). */
      canvas:focus-visible {
        outline: 3px solid #2f6df0;
        outline-offset: 4px;
        border-radius: 8px;
      }
      canvas:focus:not(:focus-visible) {
        outline: none;
      }
      /* ── Bespoke animated parallax cityscape behind the Phaser canvas ──
         Sits behind the canvas (z-index 0), never intercepts pointer input. */
      #aa-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(
          120% 80% at 50% 0%,
          #142c4a 0%,
          #0a1a2e 60%,
          #06101d 100%
        );
      }
      #aa-bg-layer {
        position: absolute;
        inset: -6% -6%;
        will-change: transform;
        transition: transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .aa-twinkle {
        position: absolute;
        border-radius: 50%;
        background: #aaccff;
        opacity: 0.5;
        animation: aaTwinkle var(--tw, 3s) ease-in-out infinite;
      }
      .aa-tower {
        position: absolute;
        bottom: 0;
        opacity: 0.55;
        border-top-left-radius: 4px;
        border-top-right-radius: 4px;
      }
      .aa-tower::after {
        content: "";
        position: absolute;
        inset: 8px 6px auto 6px;
        height: 5px;
        border-radius: 2px;
        background: repeating-linear-gradient(
          90deg,
          rgba(255, 221, 136, 0.55) 0 4px,
          transparent 4px 12px
        );
        box-shadow:
          0 14px rgba(255, 221, 136, 0.4),
          0 28px rgba(255, 221, 136, 0.3);
      }
      @keyframes aaTwinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.85);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.15);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #aa-bg-layer {
          transition: none !important;
          transform: none !important;
        }
        .aa-twinkle {
          animation: none !important;
          opacity: 0.4 !important;
        }
      }
      /* Visually-hidden live region: mirrors the blueprint prompt and each
         lock-in result for screen readers (also feeds the hint ladder). */
      #aa-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

      // CDN fallback: if the primary CDN failed, synchronously load Phaser from a mirror

        }
      });
    </script>

  <body>
    <!-- Bespoke animated parallax cityscape (behind the Phaser canvas).
         Decorative only: aria-hidden, pointer-events:none, reduced-motion safe. -->
    <div id="aa-bg" data-parallax aria-hidden="true">
      <div id="aa-bg-layer" data-parallax-layer></div>
    </div>
    <!-- Screen-reader live region mirrors the current blueprint + result. -->
    <div id="aa-sr" role="status" aria-live="polite"></div>
    <script>
      // ── Parallax cityscape builder + pointer driver (additive, gameplay-neutral) ──
      // Procedurally builds a layered skyline of CSS towers + twinkling lights
      // behind the canvas, then drifts it with pointer/device motion. All motion
      // is gated by prefers-reduced-motion (rebuilt static if the user prefers).
      (function () {
        "use strict";
        var reduceMQ =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)");
        var layer = document.getElementById("aa-bg-layer");
        if (!layer) return;

        var TOWER_COLORS = [
          "#1a3366",
          "#224488",
          "#2a4f93",
          "#16294a",
          "#1f3a6e",
        ];

        function rnd(a, b) {
          return a + Math.random() * (b - a);
        }

        function buildSkyline() {
          layer.textContent = "";
          var reduce = !!(reduceMQ && reduceMQ.matches);
          var vw = window.innerWidth || 800;
          var vh = window.innerHeight || 600;
          // Twinkling stars (top band).
          var starCount = reduce ? 14 : 28;
          for (var s = 0; s < starCount; s++) {
            var st = document.createElement("div");
            st.className = "aa-twinkle";
            var sz = rnd(1.5, 3.5);
            st.style.width = st.style.height = sz.toFixed(1) + "px";
            st.style.left = rnd(0, 100).toFixed(2) + "%";
            st.style.top = rnd(0, 45).toFixed(2) + "%";
            st.style.setProperty("--tw", rnd(2.2, 5).toFixed(2) + "s");
            st.style.animationDelay = "-" + rnd(0, 4).toFixed(2) + "s";
            layer.appendChild(st);
          }
          // Two depth bands of towers for a parallax feel.
          var count = Math.max(10, Math.round(vw / 70));
          for (var i = 0; i < count; i++) {
            var t = document.createElement("div");
            t.className = "aa-tower";
            var w = rnd(36, 84);
            var h = rnd(vh * 0.18, vh * 0.6);
            t.style.width = w.toFixed(0) + "px";
            t.style.height = h.toFixed(0) + "px";
            t.style.left = ((i / count) * 100 + rnd(-3, 3)).toFixed(2) + "%";
            t.style.background =
              TOWER_COLORS[Math.floor(Math.random() * TOWER_COLORS.length)];
            t.style.opacity = (0.4 + Math.random() * 0.3).toFixed(2);
            layer.appendChild(t);
          }
        }

        buildSkyline();

        // Pointer parallax drift — only when motion is allowed. We listen on
        // window (passive) because the Phaser canvas sits above the background
        // and would otherwise swallow the pointer events; we never call
        // preventDefault, so gameplay input is fully preserved.
        var driverAttached = false;
        function onPointer(e) {
          var dx = e.clientX / (window.innerWidth || 1) - 0.5;
          var dy = e.clientY / (window.innerHeight || 1) - 0.5;
          layer.style.transform =
            "translate3d(" +
            (dx * 22).toFixed(2) +
            "px," +
            (dy * 14).toFixed(2) +
            "px,0)";
        }
        function attachDriver() {
          if (driverAttached || (reduceMQ && reduceMQ.matches)) return;
          driverAttached = true;
          window.addEventListener("pointermove", onPointer, { passive: true });
        }
        function detachDriver() {
          if (!driverAttached) return;
          driverAttached = false;
          window.removeEventListener("pointermove", onPointer);
          layer.style.transform = "";
        }

        attachDriver();
        if (reduceMQ) {
          var onChange = function () {
            buildSkyline();
            if (reduceMQ.matches) detachDriver();
            else attachDriver();
          };
          if (reduceMQ.addEventListener)
            reduceMQ.addEventListener("change", onChange);
          else if (reduceMQ.addListener) reduceMQ.addListener(onChange);
        }

        // Rebuild skyline on resize/orientation (debounced) so it stays full-bleed.
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(buildSkyline, 200);
        });
      })();
    </script>
    <script>
      // ── AREA ARCHITECT — City Builder (build-the-shape edition) ──
      // Phaser 3 — Grade 6 Math — 6.GR.A.1 (areas of triangles, special
      // quadrilaterals, and composite figures).
      //
      // Math-as-mechanic rebuild: instead of picking one of four answers, the
      // student BUILDS each shape on the blueprint grid with +/− steppers
      // (full keyboard + tap paths), watching a live formula readout until it
      // matches the blueprint, then locks the build in. Calm and self-paced:
      // no timer, no falling shapes, and hearts refill (no game-over).

      const LS_KEY = "area_architect_highscore";

      const SFX = {
        ctx: null,
        init() {
          if (!this.ctx)
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        play(t, f, d, v = 0.2) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = t;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            o.connect(g);
            g.connect(c.destination);
            o.start();
            o.stop(c.currentTime + d);
          } catch (e) {}
        },
        noise(d, v = 0.08) {
          if (!this.ctx) return;
          try {
            const c = this.ctx,
              bufSize = c.sampleRate * d;
            const buf = c.createBuffer(1, bufSize, c.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const src = c.createBufferSource();
            src.buffer = buf;
            const g = c.createGain();
            g.gain.setValueAtTime(v, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
            src.connect(g);
            g.connect(c.destination);
            src.start();
            src.stop(c.currentTime + d);
          } catch (e) {}
        },
        place() {
          this.play("sine", 440, 0.1, 0.25);
          this.play("sine", 554, 0.12, 0.2);
        },
        correct() {
          this.play("sine", 660, 0.1, 0.3);
          this.play("sine", 880, 0.15, 0.25);
        },
        wrong() {
          this.play("sawtooth", 200, 0.25, 0.2);
          this.play("sawtooth", 150, 0.3, 0.15);
          this.noise(0.15, 0.1);
        },
        drop() {
          this.play("triangle", 200, 0.08, 0.15);
        },
        combo() {
          this.play("sine", 784, 0.08);
          this.play("sine", 988, 0.1);
          this.play("sine", 1175, 0.12);
        },
        streak3() {
          [523, 659, 784].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.12, 0.2), i * 60),
          );
        },
        streak5() {
          [523, 659, 784, 988, 1175].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.25), i * 50),
          );
        },
        streak7() {
          [523, 659, 784, 988, 1175, 1318, 1568].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.18, 0.3), i * 45),
          );
        },
        levelUp() {
          [523, 659, 784, 880, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.15, 0.25), i * 80),
          );
        },
        phaseTransition() {
          [392, 440, 523, 659, 784, 880].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.2, 0.2), i * 60),
          );
        },
        win() {
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.25, 0.3), i * 120),
          );
        },
        win3star() {
          [523, 659, 784, 880, 1047, 1175, 1318, 1568].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.3, 0.3), i * 100),
          );
        },
        tick() {
          this.play("square", 600, 0.03, 0.08);
        },
        highScore() {
          [523, 784, 1047, 784, 1047, 1318].forEach((f, i) =>
            setTimeout(() => this.play("sine", f, 0.2, 0.3), i * 120),
          );
        },
      };

      // Screen-reader announcer: mirrors the current blueprint prompt and each
      // lock-in result into the #aa-sr aria-live region. This region is also
      // what the Socratic hint ladder watches (see the ghl block at the end of
      // the page).
      function srSay(msg) {
        const el = document.getElementById("aa-sr");
        if (el) el.textContent = msg;
      }

      // ── AA_PURE_BEGIN — round generator + lock validation (pure logic) ──
      // No Phaser/DOM in this section: it is extracted verbatim and unit-run
      // under node during QA, so keep it self-contained.
      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function fmtNum(n) {
        return Number.isInteger(n)
          ? String(n)
          : String(Math.round(n * 10) / 10);
      }
      const DIM_LABELS = {
        b: "the base",
        h: "the height",
        b1: "base b₁",
        b2: "base b₂",
      };
      function dimLabel(k) {
        return DIM_LABELS[k] || k;
      }

      // Rounds where the target is (base, height): the blueprint fixes one
      // dimension and the target area; the student sizes the other dimension.
      function baseHeightRound(type, b, h, area) {
        const givenKey = Math.random() < 0.5 ? "b" : "h";
        const target = { b, h };
        const dims = { b: 2, h: 2 };
        dims[givenKey] = target[givenKey];
        const given = {};
        given[givenKey] = target[givenKey];
        return {
          type,
          area,
          target,
          given,
          freeKey: givenKey === "b" ? "h" : "b",
          dims,
        };
      }

      function makeRound(type) {
        if (type === "rectangle" || type === "parallelogram") {
          // Parallelograms draw with a 1-cell slant, so cap the base at 9.
          const b = randInt(2, type === "parallelogram" ? 9 : 10);
          const h = randInt(2, 10);
          return baseHeightRound(type, b, h, b * h);
        }
        if (type === "triangle") {
          const b = randInt(2, 10);
          let h = randInt(2, 10);
          if ((b * h) % 2) h += 1; // keep ½·b·h a whole number (h ≤ 11 fits)
          return baseHeightRound(type, b, h, (b * h) / 2);
        }
        if (type === "trapezoid") {
          let h = randInt(2, 8);
          const b1 = randInt(2, 7);
          let b2 = randInt(2, 10);
          if (b2 === b1) b2 = b1 < 10 ? b1 + 1 : b1 - 1;
          if (((b1 + b2) * h) % 2) h += 1; // keep the area a whole number
          return {
            type,
            area: ((b1 + b2) * h) / 2,
            target: { b1, b2, h },
            given: { b1, h },
            freeKey: "b2",
            dims: { b1, b2: 2, h },
          };
        }
        // Composite: L-shape = outer W×H rectangle with a top-right corner cut
        // away. Phase 1: pick a slicing line; phase 2: lock in the total area.
        const W = randInt(6, 10);
        const H = randInt(6, 10);
        return {
          type: "composite",
          W,
          H,
          nw: randInt(2, W - 3),
          nh: randInt(2, H - 3),
          get area() {
            return this.W * this.H - this.nw * this.nh;
          },
          sliceIndex: 0,
          phase: "slice",
          total: 0,
        };
      }

      function generateRound(levelNum) {
        const types =
          levelNum === 1
            ? ["rectangle", "parallelogram", "triangle"]
            : [
                "rectangle",
                "parallelogram",
                "triangle",
                "trapezoid",
                "composite",
              ];
        return makeRound(types[randInt(0, types.length - 1)]);
      }

      function dimBounds(round, key) {
        if (key === "h") return { min: 1, max: 12 };
        return { min: 1, max: round.type === "parallelogram" ? 9 : 10 };
      }

      function currentArea(round) {
        const d = round.dims;
        if (round.type === "triangle") return (d.b * d.h) / 2;
        if (round.type === "trapezoid") return ((d.b1 + d.b2) * d.h) / 2;
        return d.b * d.h;
      }

      // The two valid one-line decompositions of the L-shape: a vertical cut
      // or a horizontal cut through the concave corner. Both split it into
      // exactly two rectangles.
      function sliceOptions(round) {
        const { W, H, nw, nh } = round;
        return [
          {
            dir: "vertical",
            name: "Vertical cut (left tower | right wing)",
            a1: (W - nw) * H,
            l1: "left tower",
            a2: nw * (H - nh),
            l2: "right wing",
          },
          {
            dir: "horizontal",
            name: "Horizontal cut (bottom floor / top floor)",
            a1: W * (H - nh),
            l1: "bottom floor",
            a2: (W - nw) * nh,
            l2: "top floor",
          },
        ];
      }

      function formulaFor(round) {
        const d = round.dims;
        if (round.type === "composite") {
          if (round.phase === "slice") return "slice it first…";
          const opt = sliceOptions(round)[round.sliceIndex];
          return opt.a1 + " + " + opt.a2 + " = ?";
        }
        if (round.type === "triangle")
          return (
            "½ × " + d.b + " × " + d.h + " = " + fmtNum(currentArea(round))
          );
        if (round.type === "trapezoid")
          return (
            "½ × (" +
            d.b1 +
            " + " +
            d.b2 +
            ") × " +
            d.h +
            " = " +
            fmtNum(currentArea(round))
          );
        return d.b + " × " + d.h + " = " + fmtNum(currentArea(round));
      }

      function givenSentence(round) {
        const k = Object.keys(round.given)[0];
        return (
          "The blueprint fixes " + dimLabel(k) + " at " + round.given[k] + "."
        );
      }

      function promptFor(round) {
        if (round.type === "rectangle")
          return (
            "Rectangle floor — target area " +
            round.area +
            " sq units. " +
            givenSentence(round)
          );
        if (round.type === "parallelogram")
          return (
            "Parallelogram wall (drawn slanted — area is still b × h) — target area " +
            round.area +
            " sq units. " +
            givenSentence(round)
          );
        if (round.type === "triangle")
          return (
            "Triangle roof — target area " +
            fmtNum(round.area) +
            " sq units. " +
            givenSentence(round) +
            " The dashed rectangle shows b × h — your triangle is half of it."
          );
        if (round.type === "trapezoid")
          return (
            "Trapezoid plaza — target area " +
            fmtNum(round.area) +
            " sq units. b₁ = " +
            round.given.b1 +
            " and height = " +
            round.given.h +
            " are given. Size b₂ to match."
          );
        return "L-shaped park — place one slicing line to split it into two rectangles, then add their areas and lock in the total.";
      }

      // Decide whether a lock-in is correct; if not, return a teaching message
      // that names the dimension that is off and compares counted squares.
      function lockDiagnosis(round) {
        if (round.type === "composite") {
          if (round.total === round.area) return { ok: true };
          const opt = sliceOptions(round)[round.sliceIndex];
          const diff = round.total - round.area;
          return {
            ok: false,
            teach:
              "Count the pieces: the " +
              opt.l1 +
              " covers " +
              opt.a1 +
              " squares and the " +
              opt.l2 +
              " covers " +
              opt.a2 +
              " squares. Add them together — your total of " +
              round.total +
              " is " +
              Math.abs(diff) +
              " too " +
              (diff > 0 ? "high" : "low") +
              ".",
          };
        }
        const wrongGiven = Object.keys(round.given).find(
          (k) => round.dims[k] !== round.given[k],
        );
        if (wrongGiven) {
          return {
            ok: false,
            teach:
              "The blueprint fixes " +
              dimLabel(wrongGiven) +
              " at " +
              round.given[wrongGiven] +
              ", but yours is set to " +
              round.dims[wrongGiven] +
              ". Reset that dimension first.",
          };
        }
        const a = currentArea(round);
        if (a === round.area) return { ok: true };
        const diff = a - round.area;
        return {
          ok: false,
          teach:
            "Your shape covers " +
            fmtNum(a) +
            " unit squares — the blueprint needs " +
            fmtNum(round.area) +
            ". That is " +
            fmtNum(Math.abs(diff)) +
            " too " +
            (diff > 0 ? "many" : "few") +
            ". Step " +
            dimLabel(round.freeKey) +
            " " +
            (diff > 0 ? "down" : "up") +
            ".",
        };
      }
      // ── AA_PURE_END ──

      const W = 800,
        H = 600;
      const GRID_COLS = 10,
        GRID_ROWS = 12,
        CELL = 30;
      const GRID_X = 30,
        GRID_Y = 70;
      const GRID_W = GRID_COLS * CELL,
        GRID_H = GRID_ROWS * CELL;

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#0a1a2e",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, DiffScene, GameScene, ResultScene],
      };

      const SHAPE_COLORS = {
        rectangle: 0x4488ff,
        parallelogram: 0xff8844,
        triangle: 0x44cc88,
        trapezoid: 0xcc44cc,
        composite: 0xddaa00,
      };

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {

      // ── Round lifecycle ──

      GameScene.prototype.nextRound = function () {
        if (this.roundsAsked >= this.maxRounds) {
          this.endGame();
          return;
        }
        this.round = generateRound(this.levelNum);
        this.roundsAsked++;
        this.attempts = 0;
        this.lockBusy = false;
        this.feedbackText.setText("");
        this.promptText.setText(promptFor(this.round));
        this.buildRoundUI();
        this.redrawShape();
        this.updateReadout();
        this.updateHUD();
        const controls =
          this.round.type === "composite"
            ? "Use the left and right arrows or the arrow buttons to pick a slice, then press Enter to confirm."
            : "Use the plus and minus buttons or arrow keys to size the shape, then press Enter to lock it in.";
        srSay(
          "Round " +
            this.roundsAsked +
            " of " +
            this.maxRounds +
            ". " +
            promptFor(this.round) +
            " " +
            controls,
        );
      };

      // ── Round UI (steppers / slice chooser / total stepper) ──

      GameScene.prototype.clearRoundUI = function () {
        this.roundUI.forEach((o) => o.destroy());
        this.roundUI = [];
        this.valueTexts = {};
        this.rowBgs = [];
        this.rowKeys = [];
      };

      // Small factory for a square tap-friendly button (48px hit target).
      GameScene.prototype.makeButton = function (x, y, label, onTap, wide) {
        const w = wide ? 64 : 48;
        const bg = this.add
          .rectangle(x, y, w, 48, 0x1a3355)
          .setStrokeStyle(2, 0x2a5577)
          .setInteractive({ useHandCursor: true });
        const t = this.add
          .text(x, y, label, {
            fontSize: "26px",
            fontStyle: "bold",
            color: "#aaccff",
          })
          .setOrigin(0.5);
        bg.on("pointerover", () => bg.setFillStyle(0x2a4466));
        bg.on("pointerout", () => bg.setFillStyle(0x1a3355));
        bg.on("pointerdown", () => {
          SFX.init();
          if (!this.reduceMotion) {
            this.tweens.add({
              targets: [bg, t],
              scaleX: { from: 0.9, to: 1 },
              scaleY: { from: 0.9, to: 1 },
              duration: 120,
            });
          }
          onTap();
        });
        this.roundUI.push(bg, t);
        return bg;
      };

      GameScene.prototype.buildRoundUI = function () {
        this.clearRoundUI();
        const r = this.round;
        if (r.type === "composite") {
          if (r.phase === "slice") this.buildSliceUI();
          else this.buildTotalUI();
          return;
        }
        const keys = r.type === "trapezoid" ? ["b1", "b2", "h"] : ["b", "h"];
        this.rowKeys = keys;
        const labels = {
          b: "Base b",
          h: "Height h",
          b1: "Base b₁",
          b2: "Base b₂",
        };
        keys.forEach((key, i) => {
          const y = 306 + i * 54;
          const px = this.panelX;
          const rowBg = this.add
            .rectangle(px + 205, y, 400, 50, 0x13284a, 0.9)
            .setStrokeStyle(2, 0x13284a);
          this.roundUI.push(rowBg);
          this.rowBgs.push(rowBg);
          const isGiven = Object.prototype.hasOwnProperty.call(r.given, key);
          const lbl = this.add
            .text(
              px + 12,
              y,
              labels[key] + (isGiven ? "  • given: " + r.given[key] : ""),
              {
                fontSize: "16px",
                fontStyle: "bold",
                color: isGiven ? "#ffdd00" : "#aaccff",
              },
            )
            .setOrigin(0, 0.5);
          this.roundUI.push(lbl);
          this.makeButton(px + 250, y, "−", () => {
            this.setSel(i);
            this.adjustDim(key, -1);
          });
          const val = this.add
            .text(px + 312, y, String(r.dims[key]), {
              fontSize: "28px",
              fontStyle: "bold",
              color: "#ffffff",
            })
            .setOrigin(0.5);
          this.roundUI.push(val);
          this.valueTexts[key] = val;
          this.makeButton(px + 374, y, "+", () => {
            this.setSel(i);
            this.adjustDim(key, 1);
          });
        });
        // Start with the dimension the student must find selected.
        this.setSel(Math.max(0, keys.indexOf(r.freeKey)));
        this.lockBtnText.setText("LOCK IT IN");
      };

      GameScene.prototype.buildSliceUI = function () {
        const px = this.panelX;
        const y = 330;
        const opt = sliceOptions(this.round)[this.round.sliceIndex];
        this.makeButton(px + 40, y, "◀", () => this.toggleSlice());
        this.sliceLabel = this.add
          .text(px + 205, y, opt.name, {
            fontSize: "16px",
            fontStyle: "bold",
            color: "#ffdd00",
            wordWrap: { width: 250 },
            align: "center",
          })
          .setOrigin(0.5);
        this.roundUI.push(this.sliceLabel);
        this.makeButton(px + 370, y, "▶", () => this.toggleSlice());
        const hint = this.add
          .text(px + 205, 390, "Either cut works — both make two rectangles.", {
            fontSize: "13px",
            color: "#557788",
          })
          .setOrigin(0.5);
        this.roundUI.push(hint);
        this.lockBtnText.setText("CONFIRM SLICE");
      };

      GameScene.prototype.buildTotalUI = function () {
        const px = this.panelX;
        const r = this.round;
        const lbl = this.add
          .text(px + 205, 300, "Total area (sq units):", {
            fontSize: "16px",
            fontStyle: "bold",
            color: "#aaccff",
          })
          .setOrigin(0.5);
        this.roundUI.push(lbl);
        this.totalText = this.add
          .text(px + 205, 340, String(r.total), {
            fontSize: "34px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.roundUI.push(this.totalText);
        const y = 396;
        this.makeButton(px + 55, y, "−10", () => this.adjustTotal(-10), true);
        this.makeButton(px + 130, y, "−1", () => this.adjustTotal(-1), true);
        this.makeButton(px + 280, y, "+1", () => this.adjustTotal(1), true);
        this.makeButton(px + 355, y, "+10", () => this.adjustTotal(10), true);
        const hint = this.add
          .text(px + 205, 432, "Arrows: left/right = ±1, up/down = ±10", {
            fontSize: "12px",
            color: "#557788",
          })
          .setOrigin(0.5);
        this.roundUI.push(hint);
        this.lockBtnText.setText("LOCK TOTAL");
      };

      // ── Input plumbing ──

      GameScene.prototype.setSel = function (i) {
        this.selRow = i;
        this.rowBgs.forEach((bg, j) =>
          bg.setStrokeStyle(2, j === i ? 0xffdd00 : 0x13284a),
        );
      };

      GameScene.prototype.onArrowVert = function (dir) {
        const r = this.round;
        if (!r || this.lockBusy) return;
        if (r.type === "composite") {
          if (r.phase === "total") this.adjustTotal(dir === -1 ? 10 : -10);
          return;
        }
        if (!this.rowKeys.length) return;
        const n = this.rowKeys.length;
        this.setSel((this.selRow + dir + n) % n);
        SFX.init();
        SFX.tick();
      };

      GameScene.prototype.onArrowHoriz = function (dir) {
        const r = this.round;
        if (!r || this.lockBusy) return;
        if (r.type === "composite") {
          if (r.phase === "slice") this.toggleSlice();
          else this.adjustTotal(dir);
          return;
        }
        const key = this.rowKeys[this.selRow];
        if (key) this.adjustDim(key, dir);
      };

      GameScene.prototype.adjustDim = function (key, delta) {
        const r = this.round;
        if (!r || this.lockBusy || r.type === "composite") return;
        const bounds = dimBounds(r, key);
        const next = Math.min(
          bounds.max,
          Math.max(bounds.min, r.dims[key] + delta),
        );
        if (next === r.dims[key]) return;
        r.dims[key] = next;
        if (this.valueTexts[key]) this.valueTexts[key].setText(String(next));
        SFX.init();
        SFX.tick();
        this.feedbackText.setText("");
        this.redrawShape();
        this.updateReadout();
      };

      GameScene.prototype.adjustTotal = function (delta) {
        const r = this.round;
        if (
          !r ||
          this.lockBusy ||
          r.type !== "composite" ||
          r.phase !== "total"
        )
          return;
        r.total = Math.min(200, Math.max(0, r.total + delta));
        if (this.totalText) this.totalText.setText(String(r.total));
        SFX.init();
        SFX.tick();
        this.feedbackText.setText("");
      };

      GameScene.prototype.toggleSlice = function () {
        const r = this.round;
        if (
          !r ||
          r.type !== "composite" ||
          r.phase !== "slice" ||
          this.lockBusy
        )
          return;
        r.sliceIndex = r.sliceIndex === 0 ? 1 : 0;
        const opt = sliceOptions(r)[r.sliceIndex];
        if (this.sliceLabel) this.sliceLabel.setText(opt.name);
        SFX.init();
        SFX.tick();
        this.redrawShape();
        srSay("Slice option: " + opt.name + ". Press Enter to confirm.");
      };

      // ── Drawing ──

      function dashLine(g, x1, y1, x2, y2, dash, gap) {
        const dx = x2 - x1,
          dy = y2 - y1;
        const len = Math.sqrt(dx * dx + dy * dy);
        if (!len) return;
        const ux = dx / len,
          uy = dy / len;
        let dist = 0;
        while (dist < len) {
          const seg = Math.min(dash, len - dist);
          g.lineBetween(
            x1 + ux * dist,
            y1 + uy * dist,
            x1 + ux * (dist + seg),
            y1 + uy * (dist + seg),
          );
          dist += dash + gap;
        }
      }

      GameScene.prototype.addDimLabel = function (
        x,
        y,
        text,
        originX,
        originY,
      ) {
        const t = this.add
          .text(x, y, text, {
            fontSize: "15px",
            fontStyle: "bold",
            color: "#ffffff",
            stroke: "#0a1a2e",
            strokeThickness: 4,
          })
          .setOrigin(originX, originY)
          .setDepth(3);
        this.dimLabelsUI.push(t);
      };

      GameScene.prototype.redrawShape = function () {
        const g = this.shapeGraphics;
        g.clear();
        this.dimLabelsUI.forEach((t) => t.destroy());
        this.dimLabelsUI = [];
        const r = this.round;
        if (!r) return;
        const ux = (u) => GRID_X + u * CELL;
        const uy = (u) => GRID_Y + GRID_H - u * CELL;
        const color = SHAPE_COLORS[r.type];
        const d = r.dims;

        if (r.type === "rectangle") {
          g.fillStyle(color, 0.45);
          g.lineStyle(3, color, 1);
          g.fillRect(ux(0), uy(d.h), d.b * CELL, d.h * CELL);
          g.strokeRect(ux(0), uy(d.h), d.b * CELL, d.h * CELL);
          this.addDimLabel(ux(d.b / 2), uy(0) + 6, "b = " + d.b, 0.5, 0);
          this.addDimLabel(ux(d.b) + 8, uy(d.h / 2), "h = " + d.h, 0, 0.5);
        } else if (r.type === "parallelogram") {
          // Slanted 1 cell to the right; the dashed drop shows the true height.
          g.fillStyle(color, 0.45);
          g.lineStyle(3, color, 1);
          g.beginPath();
          g.moveTo(ux(0), uy(0));
          g.lineTo(ux(d.b), uy(0));
          g.lineTo(ux(d.b + 1), uy(d.h));
          g.lineTo(ux(1), uy(d.h));
          g.closePath();
          g.fillPath();
          g.strokePath();
          g.lineStyle(2, 0xffffff, 0.9);
          dashLine(g, ux(1), uy(0), ux(1), uy(d.h), 6, 5);
          this.addDimLabel(ux(d.b / 2), uy(0) + 6, "b = " + d.b, 0.5, 0);
          this.addDimLabel(ux(1) + 8, uy(d.h / 2), "h = " + d.h, 0, 0.5);
        } else if (r.type === "triangle") {
          // Ghost rectangle b × h (dashed) — the triangle is half of it.
          g.lineStyle(2, 0xffffff, 0.55);
          dashLine(g, ux(0), uy(d.h), ux(d.b), uy(d.h), 6, 5);
          dashLine(g, ux(d.b), uy(d.h), ux(d.b), uy(0), 6, 5);
          g.fillStyle(color, 0.45);
          g.lineStyle(3, color, 1);
          g.beginPath();
          g.moveTo(ux(0), uy(0));
          g.lineTo(ux(d.b), uy(0));
          g.lineTo(ux(0), uy(d.h));
          g.closePath();
          g.fillPath();
          g.strokePath();
          this.addDimLabel(ux(d.b / 2), uy(0) + 6, "b = " + d.b, 0.5, 0);
          this.addDimLabel(ux(0) - 8, uy(d.h / 2), "h = " + d.h, 1, 0.5);
          this.addDimLabel(ux(d.b) - 4, uy(d.h) + 4, "½ of b × h", 1, 0);
        } else if (r.type === "trapezoid") {
          // b2 on the bottom, b1 centered on top, height vertical.
          const off = (d.b2 - d.b1) / 2;
          g.fillStyle(color, 0.45);
          g.lineStyle(3, color, 1);
          g.beginPath();
          g.moveTo(ux(0), uy(0));
          g.lineTo(ux(d.b2), uy(0));
          g.lineTo(ux(off + d.b1), uy(d.h));
          g.lineTo(ux(off), uy(d.h));
          g.closePath();
          g.fillPath();
          g.strokePath();
          g.lineStyle(2, 0xffffff, 0.9);
          dashLine(g, ux(d.b2 / 2), uy(0), ux(d.b2 / 2), uy(d.h), 6, 5);
          this.addDimLabel(ux(d.b2 / 2), uy(0) + 6, "b₂ = " + d.b2, 0.5, 0);
          this.addDimLabel(
            ux(off + d.b1 / 2),
            uy(d.h) - 6,
            "b₁ = " + d.b1,
            0.5,
            1,
          );
          this.addDimLabel(ux(d.b2 / 2) + 6, uy(d.h / 2), "h = " + d.h, 0, 0.5);
        } else {
          // Composite L-shape: outer W×H minus a top-right nw×nh cut.
          const { W: w, H: h, nw, nh } = r;
          g.fillStyle(color, 0.45);
          g.lineStyle(3, color, 1);
          g.beginPath();
          g.moveTo(ux(0), uy(0));
          g.lineTo(ux(w), uy(0));
          g.lineTo(ux(w), uy(h - nh));
          g.lineTo(ux(w - nw), uy(h - nh));
          g.lineTo(ux(w - nw), uy(h));
          g.lineTo(ux(0), uy(h));
          g.closePath();
          g.fillPath();
          g.strokePath();
          this.addDimLabel(ux(w / 2), uy(0) + 6, w + " across", 0.5, 0);
          this.addDimLabel(ux(0) - 8, uy(h / 2), h + " tall", 1, 0.5);
          this.addDimLabel(
            ux(w - nw / 2),
            uy(h - nh / 2),
            "cut: " + nw + " × " + nh,
            0.5,
            0.5,
          );
          const opt = sliceOptions(r)[r.sliceIndex];
          if (r.phase === "slice") {
            g.lineStyle(3, 0xffdd00, 1);
            if (opt.dir === "vertical")
              dashLine(g, ux(w - nw), uy(0), ux(w - nw), uy(h), 8, 6);
            else dashLine(g, ux(0), uy(h - nh), ux(w), uy(h - nh), 8, 6);
          } else {
            g.lineStyle(4, 0xffdd00, 1);
            if (opt.dir === "vertical")
              g.lineBetween(ux(w - nw), uy(0), ux(w - nw), uy(h));
            else g.lineBetween(ux(0), uy(h - nh), ux(w), uy(h - nh));
            // Label each rectangle piece with its counted area.
            if (opt.dir === "vertical") {
              this.addDimLabel(
                ux((w - nw) / 2),
                uy(h / 2),
                opt.a1 + " sq",
                0.5,
                0.5,
              );
              this.addDimLabel(
                ux(w - nw / 2),
                uy((h - nh) / 2),
                opt.a2 + " sq",
                0.5,
                0.5,
              );
            } else {
              this.addDimLabel(
                ux(w / 2),
                uy((h - nh) / 2),
                opt.a1 + " sq",
                0.5,
                0.5,
              );
              this.addDimLabel(
                ux((w - nw) / 2),
                uy(h - nh / 2),
                opt.a2 + " sq",
                0.5,
                0.5,
              );
            }
          }
        }
      };

      GameScene.prototype.updateReadout = function () {
        const r = this.round;
        if (!r) return;
        this.readoutText.setText(formulaFor(r));
        if (r.type === "composite") {
          this.readoutHint.setText(
            r.phase === "slice"
              ? "Slice first, then add the two pieces."
              : "Add the two pieces, set the total, lock it in.",
          );
          this.readoutText.setColor("#ffffff");
          return;
        }
        const match = currentArea(r) === r.area;
        this.readoutText.setColor(match ? "#44cc88" : "#ffffff");
        this.readoutHint.setText(
          match
            ? "It matches the target — lock it in!"
            : "Target: " + fmtNum(r.area) + " sq units",
        );
      };

      // ── Lock-in resolution ──

      GameScene.prototype.onLock = function () {
        const r = this.round;
        if (!r || this.lockBusy) return;
        SFX.init();
        if (r.type === "composite" && r.phase === "slice") {
          const opt = sliceOptions(r)[r.sliceIndex];
          r.phase = "total";
          SFX.place();
          this.buildRoundUI();
          this.redrawShape();
          this.updateReadout();
          srSay(
            "Sliced! The " +
              opt.l1 +
              " is " +
              opt.a1 +
              " square units and the " +
              opt.l2 +
              " is " +
              opt.a2 +
              " square units. Enter the total area, then lock it in.",
          );
          return;
        }
        const diag = lockDiagnosis(r);
        if (diag.ok) this.resolveCorrect();
        else this.resolveWrong(diag.teach);
      };

      GameScene.prototype.resolveCorrect = function () {
        const r = this.round;
        this.lockBusy = true;
        const firstTry = this.attempts === 0;
        if (firstTry) {
          this.totalCorrect++;
          this.combo++;
          if (this.combo > this.maxCombo) this.maxCombo = this.combo;
        }
        const pts = firstTry
          ? 100 + this.combo * 20 + (this.stage - 1) * 10
          : 50;
        this.score += pts;
        this.shapesPlaced++;

        SFX.correct();
        this.feedbackText.setText("✓ Locked in! +" + pts).setColor("#44cc88");
        const summary =
          r.type === "composite"
            ? "total area " + r.area + " square units"
            : formulaFor(r) + " square units";
        srSay(
          "Correct! " +
            summary +
            ". Plus " +
            pts +
            " points. Building added to your city.",
        );

        this.showFloatingText(
          GRID_X + GRID_W / 2,
          GRID_Y + GRID_H / 2,
          "+" + pts,
          "#44cc88",
          "28px",
        );

        // Streak milestones (first-try streaks only)
        if (firstTry) {
          if (this.combo === 3) {
            SFX.streak3();
            this.showFloatingText(
              W / 2,
              H / 2 - 30,
              "STREAK x3!",
              "#ffdd00",
              "30px",
            );
          } else if (this.combo === 5) {
            SFX.streak5();
            this.showFloatingText(
              W / 2,
              H / 2 - 30,
              "STREAK x5! AMAZING!",
              "#ff8844",
              "32px",
            );
          } else if (this.combo === 7) {
            SFX.streak7();
            this.showFloatingText(
              W / 2,
              H / 2 - 30,
              "STREAK x7! UNSTOPPABLE!",
              "#ff4488",
              "34px",
            );
          } else if (this.combo >= 3) {
            SFX.combo();
          }
          if (this.combo >= 2) {
            this.comboText.setText("STREAK x" + this.combo + "!");
            if (!this.reduceMotion) {
              this.tweens.add({
                targets: this.streakContainer,
                scaleX: { from: 1.3, to: 1 },
                scaleY: { from: 1.3, to: 1 },
                duration: 300,
                ease: "Back.easeOut",
              });
            }
            this.streakBg.setSize(120, 24).setFillStyle(0xffdd00, 0.15);
          }
        }

        // Confetti burst — intensity scales with streak
        this.confettiEmitter.setQuantity(Math.min(10 + this.combo * 5, 40));
        this.confettiEmitter.emitParticleAt(
          GRID_X + GRID_W / 2,
          GRID_Y + GRID_H / 2,
        );
        if (!this.reduceMotion)
          this.cameras.main.shake(
            120,
            Math.min(0.004 + this.combo * 0.002, 0.015),
          );

        this.addBuilding(SHAPE_COLORS[r.type]);

        // Stage up every 4 buildings
        if (this.shapesPlaced % 4 === 0 && this.roundsAsked < this.maxRounds) {
          this.stage++;
          SFX.levelUp();
          this.showPhaseTransition("STAGE " + this.stage + "!");
        }

        this.updateHUD();
        this.time.delayedCall(1500, () => this.nextRound());
      };

      GameScene.prototype.resolveWrong = function (teach) {
        this.attempts++;
        this.totalWrong++;
        this.combo = 0;
        this.comboText.setText("");
        this.streakBg.setFillStyle(0x000000, 0);
        this.lives--;

        SFX.wrong();
        this.feedbackText.setText("Not yet — " + teach).setColor("#ffaa66");
        srSay("Not yet. " + teach);

        // Calm feedback: gentle shake + brief low-alpha wash (no game-over).
        if (!this.reduceMotion) this.cameras.main.shake(150, 0.006);
        this.redFlash.setAlpha(0.18);
        this.tweens.add({ targets: this.redFlash, alpha: 0, duration: 450 });

        if (this.lives <= 0) {
          // No-fail: refill hearts and keep building.
          this.lives = 3;
          this.showFloatingText(
            GRID_X + GRID_W / 2,
            GRID_Y + GRID_H / 2 + 44,
            "♥ Refilled — keep going!",
            "#44cc88",
            "24px",
          );
        }
        this.updateHUD();
      };

      // ── City strip ──

      GameScene.prototype.addBuilding = function (color) {
        const idx = this.shapesPlaced - 1;
        const bw = randInt(20, 26);
        const bh = randInt(30, 105);
        const bx = GRID_X + 18 + idx * 29;
        const by = 583;
        const bld = this.add
          .rectangle(bx, by, bw, bh, color, 0.85)
          .setOrigin(0.5, 1);
        SFX.drop();
        if (this.reduceMotion) {
          bld.setScale(1, 1);
        } else {
          bld.setScale(1, 0);
          this.tweens.add({
            targets: bld,
            scaleY: 1,
            duration: 500,
            ease: "Back.easeOut",
          });
        }
        for (let wy = by - bh + 8; wy < by - 8; wy += 14) {
          const win = this.add.rectangle(bx, wy, 8, 6, 0xffdd88, 0);
          this.tweens.add({
            targets: win,
            fillAlpha: 0.8,
            duration: 200,
            delay: this.reduceMotion ? 0 : 500 + Math.random() * 400,
          });
        }
        this.sparkles.emitParticleAt(bx, by - bh / 2);
      };

      // ── Shared flair helpers ──

      GameScene.prototype.showFloatingText = function (
        x,
        y,
        text,
        color,
        size,
      ) {
        const ft = this.add
          .text(x, y, text, {
            fontSize: size || "20px",
            fontStyle: "bold",
            color: color || "#ffdd00",
            stroke: "#000",
            strokeThickness: 3,
          })
          .setOrigin(0.5)
          .setDepth(40);
        this.tweens.add({
          targets: ft,
          y: y - 50,
          alpha: { from: 1, to: 0 },
          scale: { from: 1, to: 1.5 },
          duration: 1000,
          onComplete: () => ft.destroy(),
        });
      };

      GameScene.prototype.showPhaseTransition = function (text) {
        SFX.phaseTransition();
        this.transitionOverlay.setAlpha(0);
        this.transitionText.setText(text).setAlpha(0).setScale(0.5);
        this.tweens.add({
          targets: this.transitionOverlay,
          alpha: 0.7,
          duration: 300,
          yoyo: true,
          hold: 800,
        });
        this.tweens.add({
          targets: this.transitionText,
          alpha: 1,
          scale: 1.3,
          duration: 400,
          yoyo: true,
          hold: 600,
          ease: "Back.easeOut",
          onComplete: () => this.transitionText.setAlpha(0),
        });
      };

      GameScene.prototype.endGame = function () {
        SFX.win();
        this.time.delayedCall(500, () => {
          this.scene.start("Results", {
            score: this.score,
            maxCombo: this.maxCombo,
            totalCorrect: this.totalCorrect,
            totalWrong: this.totalWrong,
            levelNum: this.levelNum,
            stage: this.stage,
            rounds: this.maxRounds,
            buildings: this.shapesPlaced,
          });
        });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText("Score: " + this.score);
        this.levelText.setText(
          "Level " + this.levelNum + " • Stage " + this.stage,
        );
        this.livesText.setText(
          "♥".repeat(this.lives) + "♡".repeat(Math.max(0, 3 - this.lives)),
        );
        this.buildingsText.setText("Buildings: " + this.shapesPlaced);
        this.progressBarFill.width = (this.roundsAsked / this.maxRounds) * 200;
        this.progressText.setText(this.roundsAsked + "/" + this.maxRounds);
      };

      // ── RESULTS ──
      function ResultScene() {
        Phaser.Scene.call(this, "Results");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.d = data;
      };
      ResultScene.prototype.create = function () {
        const cx = W / 2,
          d = this.d;
        this.add.rectangle(cx, H / 2, W, H, 0x0a1a2e);

        const pct = (d.totalCorrect / Math.max(1, d.rounds)) * 100;
        const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;

        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.totalCorrect,
              maxScore: d.rounds,
              stars: stars,
              problemsCorrect: d.totalCorrect,
              problemsAttempted: d.rounds,
              percent: Math.round(pct),
            });
        } catch (e) {}

        // High score check
        const prevHigh = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        const isNewHigh = d.score > prevHigh;
        if (isNewHigh && d.score > 0) {
          localStorage.setItem(LS_KEY, String(d.score));
        }

        // Play appropriate sound
        if (stars === 3) {
          SFX.win3star();
        } else {
          SFX.win();
        }

        srSay(
          "City complete! You built " +
            d.buildings +
            " buildings and locked " +
            d.totalCorrect +
            " of " +
            d.rounds +
            " blueprints on the first try. Final score " +
            d.score +
            ".",
        );

        // City skyline celebration
        const colors = [0x4488ff, 0x44cc88, 0xff8844, 0xcc44cc, 0xddaa00];
        for (let i = 0; i < 10; i++) {
          const bw = randInt(25, 55),
            bh = randInt(40, 150);
          const bx = i * 80 + 20;
          this.add.rectangle(
            bx,
            H - bh / 2 - 5,
            bw,
            bh,
            colors[i % colors.length],
            0.6,
          );
          for (let wy = H - bh + 8; wy < H - 8; wy += 16) {
            for (let wx = bx - bw / 2 + 6; wx < bx + bw / 2 - 6; wx += 12) {
              this.add.rectangle(wx, wy, 5, 7, 0xffdd88, 0.7);
            }
          }
        }
        this.add.rectangle(cx, H - 4, W, 8, 0x1a3a2e);

        // Celebration particles
        const burstCount = stars === 3 ? 8 : stars === 2 ? 5 : 3;
        for (let i = 0; i < burstCount; i++) {
          this.time.delayedCall(i * 300, () => {
            const p = this.add.particles(0, 0, "confetti", {
              speed: { min: 60, max: 250 },
              angle: { min: 0, max: 360 },
              scale: { start: 1.5, end: 0 },
              rotate: { min: 0, max: 360 },
              lifespan: 1500,
              quantity: 20,
              tint: [0x44cc88, 0x4488ff, 0xffdd00, 0xff8844, 0xcc44cc],
              gravityY: 150,
            });
            p.emitParticleAt(randInt(100, W - 100), randInt(30, 150));
            this.time.delayedCall(1600, () => p.destroy());
          });
        }

        this.add
          .text(cx, 30, "CITY COMPLETE!", {
            fontSize: "36px",
            fontStyle: "bold",
            color: "#44cc88",
            stroke: "#000",
            strokeThickness: 4,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 60, "Every blueprint became a building!", {
            fontSize: "15px",
            color: "#88aacc",
          })
          .setOrigin(0.5);

        // Star rating with animated fill
        const starY = 90;
        for (let i = 0; i < 3; i++) {
          const sx = cx - 60 + i * 60;
          // Empty star background
          this.add
            .text(sx, starY, "☆", {
              fontSize: "42px",
              color: "#334455",
            })
            .setOrigin(0.5);

          if (i < stars) {
            const fullStar = this.add
              .text(sx, starY, "★", {
                fontSize: "42px",
                color: "#ffdd00",
              })
              .setOrigin(0.5)
              .setAlpha(0)
              .setScale(0);
            this.tweens.add({
              targets: fullStar,
              alpha: 1,
              scale: 1,
              duration: 400,
              delay: 800 + i * 300,
              ease: "Back.easeOut",
              onStart: () => SFX.tick(),
            });
          }
        }

        // NEW HIGH SCORE banner
        if (isNewHigh && d.score > 0) {
          SFX.highScore();
          const hsText = this.add
            .text(cx, 125, "NEW HIGH SCORE!", {
              fontSize: "22px",
              fontStyle: "bold",
              color: "#ffdd00",
              stroke: "#000",
              strokeThickness: 3,
            })
            .setOrigin(0.5);
          this.tweens.add({
            targets: hsText,
            scaleX: { from: 0.8, to: 1.1 },
            scaleY: { from: 0.8, to: 1.1 },
            duration: 600,
            yoyo: true,
            repeat: -1,
          });
        }

        const statsStartY = isNewHigh ? 150 : 130;
        const stats = [
          { label: "Final Score", val: String(d.score), color: "#44cc88" },
          {
            label: "Buildings Built",
            val: String(d.buildings),
            color: "#4488ff",
          },
          {
            label: "First-Try Locks",
            val: d.totalCorrect + " / " + d.rounds,
            color: "#44cc88",
          },
          { label: "Wrong Locks", val: String(d.totalWrong), color: "#ffaa66" },
          { label: "Best Streak", val: "x" + d.maxCombo, color: "#ffaa00" },
          { label: "Stage Reached", val: String(d.stage), color: "#88aacc" },
          { label: "Level", val: "Level " + d.levelNum, color: "#cc88ff" },
        ];
        stats.forEach((s, i) => {
          const y = statsStartY + i * 40;
          this.add.rectangle(cx, y, 400, 32, 0x112233, 0.8);
          this.add
            .text(cx - 170, y, s.label, { fontSize: "15px", color: "#6688aa" })
            .setOrigin(0, 0.5);
          const v = this.add
            .text(cx + 170, y, s.val, {
              fontSize: "17px",
              fontStyle: "bold",
              color: s.color,
            })
            .setOrigin(1, 0.5)
            .setAlpha(0);
          this.tweens.add({
            targets: v,
            alpha: 1,
            x: { from: cx + 210, to: cx + 170 },
            duration: 350,
            delay: i * 100,
          });
        });

        const grade =
          pct >= 90
            ? "A+"
            : pct >= 80
              ? "A"
              : pct >= 70
                ? "B"
                : pct >= 60
                  ? "C"
                  : "D";
        this.add
          .text(cx, 460, grade, {
            fontSize: "48px",
            fontStyle: "bold",
            color: pct >= 80 ? "#44cc88" : pct >= 60 ? "#f59e0b" : "#ff4444",
            stroke: "#000",
            strokeThickness: 4,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 492, `${Math.round(pct)}% First-Try Accuracy`, {
            fontSize: "15px",
            color: "#88aacc",
          })
          .setOrigin(0.5);

        // Personal best display
        const bestScore = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        if (bestScore > 0 && !isNewHigh) {
          this.add
            .text(cx, 515, `Personal Best: ${bestScore}`, {
              fontSize: "13px",
              color: "#6688aa",
            })
            .setOrigin(0.5);
        }

        const retry = this.add
          .rectangle(cx - 100, 550, 170, 42, 0x44cc88)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx - 100, 550, "BUILD AGAIN", {
            fontSize: "17px",
            fontStyle: "bold",
            color: "#0a2a1e",
          })
          .setOrigin(0.5);
        retry.on("pointerover", () => retry.setFillStyle(0x55ddaa));
        retry.on("pointerout", () => retry.setFillStyle(0x44cc88));
        retry.on("pointerdown", () => {
          this.cameras.main.fadeOut(300);
          this.time.delayedCall(300, () =>
            this.scene.start("Game", { level: d.levelNum }),
          );
        });

        const menu = this.add
          .rectangle(cx + 100, 550, 170, 42, 0x1a3355)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx + 100, 550, "MAIN MENU", {
            fontSize: "17px",
            fontStyle: "bold",
            color: "#88aacc",
          })
          .setOrigin(0.5);
        menu.on("pointerover", () => menu.setFillStyle(0x2a4466));
        menu.on("pointerout", () => menu.setFillStyle(0x1a3355));
        menu.on("pointerdown", () => {
          this.cameras.main.fadeOut(300);
          this.time.delayedCall(300, () => this.scene.start("Title"));
        });

        this.cameras.main.fadeIn(600);
      };

      const aaGame = new Phaser.Game(config);

      // ── Canvas accessibility (additive) ──
      // The whole game renders into one Phaser <canvas>. Give assistive tech a
      // label and make the canvas keyboard-focusable so the keyboard controls
      // are discoverable. Prompts and results are mirrored into the #aa-sr
      // aria-live region as the game runs.
      aaGame.events.once("ready", function () {
        try {
          var cv = aaGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute(
            "aria-label",
            "Area Architect city builder math game. " +
              "Build each shape to match the blueprint. " +
              "Use the Up and Down arrows to choose a dimension, " +
              "Left and Right arrows to size it, and Enter to lock in " +
              "your build. Every control can also be tapped.",
          );
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
        } catch (e) {
          /* a11y wiring failed — non-fatal, game still plays */
        }
      });
    </script>
    <script src="/assets/nt-page-enhance.js" defer></script>
    <script src="/assets/edupulse-config.js"></script>
    <script src="/assets/edupulse-bridge.js"></script>
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
    <script src="/shared/save-resume/save-resume-engine.js" defer></script>
    <!-- nsr-injected:end -->
    <!-- gfx-injected:begin (shared game polish — tools/inject-game-fx.js) -->
    <script src="/assets/game-fx.js" defer></script>
    <!-- gfx-injected:end -->
    <!-- mwb-injected:begin (Math Workbench launcher — tools/inject-math-workbench.js) -->
    <script src="/assets/math-workbench-launcher.js" defer></script>
    <!-- mwb-injected:end -->
    <!-- gacc-injected:begin (calm & accessible games — tools/inject-game-access.js) -->
    <script src="/assets/game-access.js" defer></script>
    <!-- gacc-injected:end -->
    <!-- ghl-injected:begin (Socratic hint ladder — tools/inject-game-hint-ladder.js) -->
    <script src="/assets/game-hint-ladder.js" defer></script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        if (window.NeftHintLadder)
          window.NeftHintLadder.watch({
            sourceSelector: "#aa-sr",
            standard: "6.GR.1",
            staticHints: [
              "Count the unit squares your shape covers on the grid. Is that more or fewer than the blueprint asks for?",
              "Watch the live readout as you step one dimension up or down — which number in the formula are you changing?",
              "Set up the formula with your numbers. For a triangle, the dashed rectangle shows why you take half; for the L-shape, add the two rectangle pieces.",
            ],
          });
      });
    </script>
    <!-- ghl-injected:end -->
  </body>
</html>
