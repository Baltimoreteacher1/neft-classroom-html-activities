            fontSize: "22px",
            fontStyle: "bold",
            color: "#0a2a1e",
          })
          .setOrigin(0.5);
        this.lockBtn.on("pointerover", () => {
          this.lockBtn.setFillStyle(0x55ddaa);
          SFX.init();
          SFX.tick();
        });
        this.lockBtn.on("pointerout", () => this.lockBtn.setFillStyle(0x44cc88));
        this.lockBtn.on("pointerdown", () => {
          SFX.init();
          this.onLock();
        });

        // Feedback / teaching text
        this.feedbackText = this.add
          .text(panelX + 205, 512, "", {
            fontFamily: FONT,
            fontSize: "14px",
            color: "#fff",
            fontStyle: "bold",
            wordWrap: { width: 395 },
            align: "center",
            lineSpacing: 3,
          })
          .setOrigin(0.5, 0);

        // Particles — confetti burst for correct locks
        this.confettiEmitter = this.add
          .particles(0, 0, "confetti", {
            speed: { min: 80, max: 300 },
            angle: { min: 0, max: 360 },
            scale: { start: 1.5, end: 0.2 },
            rotate: { min: 0, max: 360 },
            lifespan: 1200,
            emitting: false,
            quantity: 30,
            tint: [0x44cc88, 0x4488ff, 0xffdd00, 0xff8844, 0xcc44cc],
            gravityY: 200,
          })
          .setDepth(25);

        this.sparkles = this.add
          .particles(0, 0, "star", {
            speed: { min: 40, max: 180 },
            scale: { start: 1.5, end: 0 },
            lifespan: 600,
            emitting: false,
            quantity: 10,
            tint: [0x44cc88, 0x4488ff, 0xffdd00],
          })
          .setDepth(20);

        // Gentle red wash for wrong locks (calm — low alpha, short)
        this.redFlash = this.add.rectangle(W / 2, H / 2, W, H, 0xff0000, 0).setDepth(30);

        // Stage transition overlay
        this.transitionOverlay = this.add.rectangle(W / 2, H / 2, W, H, 0x0a1a2e, 0).setDepth(50);
        this.transitionText = this.add
          .text(W / 2, H / 2, "", {
            fontFamily: FONT,
            fontSize: "40px",
            fontStyle: "bold",
            color: "#ffdd00",
            stroke: "#000",
            strokeThickness: 5,
          })
          .setOrigin(0.5)
          .setDepth(51)
          .setAlpha(0);

        // Keyboard paths: Up/Down choose a dimension row, Left/Right size it,
        // Enter/Space locks in. (In L-shape rounds the same keys drive the
        // slice chooser and the total stepper.)
        const kb = this.input.keyboard;
        kb.on("keydown-UP", () => this.onArrowVert(-1));
        kb.on("keydown-DOWN", () => this.onArrowVert(1));
        kb.on("keydown-LEFT", () => this.onArrowHoriz(-1));
        kb.on("keydown-RIGHT", () => this.onArrowHoriz(1));
        kb.on("keydown-ENTER", () => this.onLock());
        kb.on("keydown-SPACE", () => this.onLock());

        this.langBtn = addLangButton(this, GRID_X + GRID_W, 2);
        this.nextRound();
        this.updateHUD();
        this.cameras.main.fadeIn(500);
      };

      // ── Round lifecycle ──

      GameScene.prototype.nextRound = function () {
        if (this.roundsAsked >= this.maxRounds) {
          this.endGame();
          return;
        }
        this.round =
          this.replayQueue && this.replayQueue.length
            ? this.replayQueue.shift()
            : generateRound(this.levelNum, this.bag);
        this.roundCard = JSON.parse(JSON.stringify(this.round));
        this.roundsAsked++;
        this.attempts = 0;
        this.lockBusy = false;
        this.feedbackText.setText("");
        this.promptText.setText(promptFor(this.round));
        this.buildRoundUI();
        this.redrawShape();
        this.updateReadout();
        this.updateHUD();
        this.announceRound();
      };

      GameScene.prototype.announceRound = function () {
        const type = this.round.type;
        const controls = tr(
          type === "composite" ? AU.ctlComposite : type === "polygon" ? AU.ctlPolygon : AU.ctlBuild,
        );
        srSay(
          tr(AU.roundSay, {
            n: this.roundsAsked,
            m: this.maxRounds,
            prompt: promptFor(this.round),
            controls,
          }),
        );
      };

      // Re-draw every visible string in the current language (no state change).
      GameScene.prototype.relabel = function () {
        if (!this.round) return;
        this.gridLabelText.setText(tr(AU.gridLabel));
        this.yourCityText.setText(tr(AU.yourCity));
        this.progressLabel.setText(tr(AU.progress));
        this.blueprintLabel.setText(tr(AU.blueprint));
        this.langBtn.setText(tr(AU.langBtn));
        this.promptText.setText(promptFor(this.round));
        this.feedbackText.setText("");
        this.buildRoundUI();
        this.redrawShape();
        this.updateReadout();
        this.updateHUD();
        this.announceRound();
      };

      // ── Round UI (steppers / slice chooser / total stepper) ──

      GameScene.prototype.clearRoundUI = function () {
        this.roundUI.forEach((o) => o.destroy());
        this.roundUI = [];
        this.valueTexts = {};
        this.rowBgs = [];
        this.rowKeys = [];
      };

      // Small factory for a square tap-friendly button (48px hit target).
      GameScene.prototype.makeButton = function (x, y, label, onTap, wide) {
        const w = wide ? 56 : 48;
        const bg = this.add
          .rectangle(x, y, w, 48, 0x1a3355)
          .setStrokeStyle(2, 0x2a5577)
          .setInteractive({ useHandCursor: true });
        const t = this.add
          .text(x, y, label, {
            fontFamily: FONT,
            fontSize: wide ? "20px" : "26px",
            fontStyle: "bold",
            color: "#aaccff",
          })
          .setOrigin(0.5);
        bg.on("pointerover", () => bg.setFillStyle(0x2a4466));
        bg.on("pointerout", () => bg.setFillStyle(0x1a3355));
        bg.on("pointerdown", () => {
          SFX.init();
          if (!this.reduceMotion) {
            this.tweens.add({
              targets: [bg, t],
              scaleX: { from: 0.9, to: 1 },
              scaleY: { from: 0.9, to: 1 },
              duration: 120,
            });
          }
          onTap();
        });
        this.roundUI.push(bg, t);
        return bg;
      };

      // One row per dimension. Blueprint-given rows are locked (no buttons);
      // only the rows the student must find get steppers and keyboard focus.
      GameScene.prototype.buildRoundUI = function () {
        this.clearRoundUI();
        const r = this.round;
        if (r.type === "composite") {
          if (r.phase === "slice") this.buildSliceUI();
          else this.buildTotalUI();
          return;
        }
        const keys = r.type === "trapezoid" ? ["b1", "b2", "h"] : r.type === "polygon" ? ["n", "A"] : ["b", "h"];
        const isGiven = (key) => Object.prototype.hasOwnProperty.call(r.given, key);
        this.rowKeys = keys.filter((k) => !isGiven(k));
        const px = this.panelX;
        keys.forEach((key, i) => {
          const y = 306 + i * 54;
          const given = isGiven(key);
          const rowBg = this.add
            .rectangle(px + 205, y, 400, 50, given ? 0x0f2238 : 0x13284a, 0.9)
            .setStrokeStyle(2, given ? 0x0f2238 : 0x13284a);
          this.roundUI.push(rowBg);
          if (!given) this.rowBgs.push(rowBg);
          const lbl = this.add
            .text(px + 12, y, rowLabel(key) + (given ? tr(AU.given, { v: r.given[key] }) : ""), {
              fontFamily: FONT,
              fontSize: "16px",
              fontStyle: "bold",
              color: given ? "#ffdd00" : "#aaccff",
            })
            .setOrigin(0, 0.5);
          this.roundUI.push(lbl);
          if (given) return;
          const row = this.rowKeys.indexOf(key);
          const step = (delta) => () => {
            this.setSel(row);
            this.adjustDim(key, delta);
          };
          let valX = px + 312;
          if (key === "A") {
            // Area totals can be large: ±10 and ±1 steppers.
            this.makeButton(px + 128, y, "−10", step(-10), true);
            this.makeButton(px + 184, y, "−", step(-1));
            valX = px + 250;
            this.makeButton(px + 316, y, "+", step(1));
            this.makeButton(px + 372, y, "+10", step(10), true);
          } else {
            this.makeButton(px + 250, y, "−", step(-1));
            this.makeButton(px + 374, y, "+", step(1));
          }
          const val = this.add
            .text(valX, y, String(r.dims[key]), {
              fontFamily: FONT,
              fontSize: "28px",
              fontStyle: "bold",
              color: "#ffffff",
            })
            .setOrigin(0.5);
          this.roundUI.push(val);
          this.valueTexts[key] = val;
        });
        // Start with the dimension the student must find selected.
        this.setSel(Math.max(0, this.rowKeys.indexOf(r.freeKey)));
        this.lockBtnText.setText(tr(AU.lockIn));
      };

      GameScene.prototype.buildSliceUI = function () {
        const px = this.panelX;
        const y = 330;
        const opt = sliceOptions(this.round)[this.round.sliceIndex];
        this.makeButton(px + 40, y, "◀", () => this.toggleSlice());
        this.sliceLabel = this.add
          .text(px + 205, y, opt.name, {
            fontFamily: FONT,
            fontSize: "16px",
            fontStyle: "bold",
            color: "#ffdd00",
            wordWrap: { width: 250 },
            align: "center",
          })
          .setOrigin(0.5);
        this.roundUI.push(this.sliceLabel);
        this.makeButton(px + 370, y, "▶", () => this.toggleSlice());
        const hint = this.add
          .text(px + 205, 390, tr(AU.eitherCut), {
            fontFamily: FONT,
            fontSize: "13px",
            color: "#88aacc",
          })
          .setOrigin(0.5);
        this.roundUI.push(hint);
        this.lockBtnText.setText(tr(AU.confirmSlice));
      };

      GameScene.prototype.buildTotalUI = function () {
        const px = this.panelX;
        const r = this.round;
        const lbl = this.add
          .text(px + 205, 300, tr(AU.totalArea), {
            fontFamily: FONT,
            fontSize: "16px",
            fontStyle: "bold",
            color: "#aaccff",
          })
          .setOrigin(0.5);
        this.roundUI.push(lbl);
        this.totalText = this.add
          .text(px + 205, 340, String(r.total), {
            fontFamily: FONT,
            fontSize: "34px",
            fontStyle: "bold",
            color: "#ffffff",
          })
          .setOrigin(0.5);
        this.roundUI.push(this.totalText);
        const y = 396;
        this.makeButton(px + 55, y, "−10", () => this.adjustTotal(-10), true);
        this.makeButton(px + 130, y, "−1", () => this.adjustTotal(-1), true);
        this.makeButton(px + 280, y, "+1", () => this.adjustTotal(1), true);
        this.makeButton(px + 355, y, "+10", () => this.adjustTotal(10), true);
        const hint = this.add
          .text(px + 205, 432, tr(AU.arrowsTotal), {
            fontFamily: FONT,
            fontSize: "12px",
            color: "#88aacc",
          })
          .setOrigin(0.5);
        this.roundUI.push(hint);
        this.lockBtnText.setText(tr(AU.lockTotal));
      };

      // ── Input plumbing ──

      GameScene.prototype.setSel = function (i) {
        this.selRow = i;
        this.rowBgs.forEach((bg, j) => bg.setStrokeStyle(2, j === i ? 0xffdd00 : 0x13284a));
      };

      GameScene.prototype.onArrowVert = function (dir) {
        const r = this.round;
        if (!r || this.lockBusy) return;
        if (r.type === "composite") {
          if (r.phase === "total") this.adjustTotal(dir === -1 ? 10 : -10);
          return;
        }
        if (this.rowKeys.length < 2) return;
        const n = this.rowKeys.length;
        this.setSel((this.selRow + dir + n) % n);
        SFX.init();
        SFX.tick();
        const key = this.rowKeys[this.selRow];
        srSay(tr(AU.valueSay, { d: rowLabel(key), v: r.dims[key] }));
      };

      GameScene.prototype.onArrowHoriz = function (dir) {
        const r = this.round;
        if (!r || this.lockBusy) return;
        if (r.type === "composite") {
          if (r.phase === "slice") this.toggleSlice();
          else this.adjustTotal(dir);
          return;
        }
        const key = this.rowKeys[this.selRow];
        if (key) this.adjustDim(key, dir);
      };

      GameScene.prototype.adjustDim = function (key, delta) {
        const r = this.round;
        if (!r || this.lockBusy || r.type === "composite") return;
        // Blueprint-given dimensions are locked.
        if (Object.prototype.hasOwnProperty.call(r.given, key)) return;
        const bounds = dimBounds(r, key);
        const next = Math.min(bounds.max, Math.max(bounds.min, r.dims[key] + delta));
        if (next === r.dims[key]) return;
        r.dims[key] = next;
        if (this.valueTexts[key]) this.valueTexts[key].setText(String(next));
        SFX.init();
        SFX.tick();
        this.feedbackText.setText("");
        this.redrawShape();
        this.updateReadout();
        srSay(tr(AU.valueSay, { d: rowLabel(key), v: next }));
      };

      GameScene.prototype.adjustTotal = function (delta) {
        const r = this.round;
        if (!r || this.lockBusy || r.type !== "composite" || r.phase !== "total") return;
        r.total = Math.min(200, Math.max(0, r.total + delta));
        if (this.totalText) this.totalText.setText(String(r.total));
        SFX.init();
        SFX.tick();
        this.feedbackText.setText("");
        srSay(tr(AU.valueSay, { d: tr(AU.totalArea), v: r.total }));
      };

      GameScene.prototype.toggleSlice = function () {
        const r = this.round;
        if (!r || r.type !== "composite" || r.phase !== "slice" || this.lockBusy) return;
        r.sliceIndex = r.sliceIndex === 0 ? 1 : 0;
        const opt = sliceOptions(r)[r.sliceIndex];
        if (this.sliceLabel) this.sliceLabel.setText(opt.name);
        SFX.init();
        SFX.tick();
        this.redrawShape();
        srSay(tr(AU.sliceOption, { name: opt.name }));
      };


      // ── Drawing ──

      function dashLine(g, x1, y1, x2, y2, dash, gap) {
        const dx = x2 - x1,
          dy = y2 - y1;
        const len = Math.sqrt(dx * dx + dy * dy);
        if (!len) return;
        const ux = dx / len,
          uy = dy / len;
        let dist = 0;
        while (dist < len) {
          const seg = Math.min(dash, len - dist);
          g.lineBetween(
            x1 + ux * dist,
            y1 + uy * dist,
            x1 + ux * (dist + seg),
            y1 + uy * (dist + seg),
          );
          dist += dash + gap;
        }
      }

      GameScene.prototype.addDimLabel = function (x, y, text, originX, originY) {
        const t = this.add
          .text(x, y, text, {
            fontFamily: FONT,
            fontSize: "15px",
            fontStyle: "bold",
            color: "#ffffff",
            stroke: "#0a1a2e",
            strokeThickness: 4,
          })
          .setOrigin(originX, originY)
          .setDepth(3);
        this.dimLabelsUI.push(t);
      };

      GameScene.prototype.redrawShape = function () {
        const g = this.shapeGraphics;
        g.clear();
        this.dimLabelsUI.forEach((t) => t.destroy());
        this.dimLabelsUI = [];
        const r = this.round;
        if (!r) return;
        const ux = (u) => GRID_X + u * CELL;
        const uy = (u) => GRID_Y + GRID_H - u * CELL;
        const color = SHAPE_COLORS[r.type];
        const d = r.dims;

        if (r.type === "rectangle") {
          g.fillStyle(color, 0.45);
          g.lineStyle(3, color, 1);
          g.fillRect(ux(0), uy(d.h), d.b * CELL, d.h * CELL);
          g.strokeRect(ux(0), uy(d.h), d.b * CELL, d.h * CELL);
          this.addDimLabel(ux(d.b / 2), uy(0) + 6, "b = " + d.b, 0.5, 0);
          this.addDimLabel(ux(d.b) + 8, uy(d.h / 2), "h = " + d.h, 0, 0.5);
        } else if (r.type === "parallelogram") {
          // Slanted 1 cell to the right; the dashed drop shows the true height.
          g.fillStyle(color, 0.45);
          g.lineStyle(3, color, 1);
          g.beginPath();
          g.moveTo(ux(0), uy(0));
          g.lineTo(ux(d.b), uy(0));
          g.lineTo(ux(d.b + 1), uy(d.h));
          g.lineTo(ux(1), uy(d.h));
          g.closePath();
          g.fillPath();
          g.strokePath();
          g.lineStyle(2, 0xffffff, 0.9);
          dashLine(g, ux(1), uy(0), ux(1), uy(d.h), 6, 5);
          this.addDimLabel(ux(d.b / 2), uy(0) + 6, "b = " + d.b, 0.5, 0);
          this.addDimLabel(ux(1) + 8, uy(d.h / 2), "h = " + d.h, 0, 0.5);
        } else if (r.type === "triangle") {
          // Ghost rectangle b × h (dashed) — the triangle is half of it.
          g.lineStyle(2, 0xffffff, 0.55);
          dashLine(g, ux(0), uy(d.h), ux(d.b), uy(d.h), 6, 5);
          dashLine(g, ux(d.b), uy(d.h), ux(d.b), uy(0), 6, 5);
          g.fillStyle(color, 0.45);
          g.lineStyle(3, color, 1);
          g.beginPath();
          g.moveTo(ux(0), uy(0));
          g.lineTo(ux(d.b), uy(0));
          g.lineTo(ux(0), uy(d.h));
          g.closePath();
          g.fillPath();
          g.strokePath();
          this.addDimLabel(ux(d.b / 2), uy(0) + 6, "b = " + d.b, 0.5, 0);
          // Height on the RIGHT of the ghost rectangle (empty space) so it
          // can't collide with the shape or run off the canvas edge. The
          // "half of the rectangle" idea is carried by the dashed ghost box
          // plus the "½ ×" in the live equation — no jammed on-shape label.
          this.addDimLabel(ux(d.b) + 8, uy(d.h / 2), "h = " + d.h, 0, 0.5);
        } else if (r.type === "trapezoid") {
          // b2 on the bottom, b1 centered on top, height vertical.
          const off = (d.b2 - d.b1) / 2;
          g.fillStyle(color, 0.45);
          g.lineStyle(3, color, 1);
          g.beginPath();
          g.moveTo(ux(0), uy(0));
          g.lineTo(ux(d.b2), uy(0));
          g.lineTo(ux(off + d.b1), uy(d.h));
          g.lineTo(ux(off), uy(d.h));
          g.closePath();
          g.fillPath();
          g.strokePath();
          g.lineStyle(2, 0xffffff, 0.9);
          dashLine(g, ux(d.b2 / 2), uy(0), ux(d.b2 / 2), uy(d.h), 6, 5);
          this.addDimLabel(ux(d.b2 / 2), uy(0) + 6, "b₂ = " + d.b2, 0.5, 0);
          this.addDimLabel(ux(off + d.b1 / 2), uy(d.h) - 6, "b₁ = " + d.b1, 0.5, 1);
          this.addDimLabel(ux(d.b2 / 2) + 6, uy(d.h / 2), "h = " + d.h, 0, 0.5);
        } else if (r.type === "polygon") {
          this.drawPolygon(g, r);
        } else {
          // Composite L-shape: outer W×H minus a top-right nw×nh cut.
          const { W: w, H: h, nw, nh } = r;
          g.fillStyle(color, 0.45);
          g.lineStyle(3, color, 1);
          g.beginPath();
          g.moveTo(ux(0), uy(0));
          g.lineTo(ux(w), uy(0));
          g.lineTo(ux(w), uy(h - nh));
          g.lineTo(ux(w - nw), uy(h - nh));
          g.lineTo(ux(w - nw), uy(h));
          g.lineTo(ux(0), uy(h));
          g.closePath();
          g.fillPath();
          g.strokePath();
          this.addDimLabel(ux(w / 2), uy(0) + 6, String(w), 0.5, 0);
          this.addDimLabel(ux(0) - 8, uy(h / 2), String(h), 1, 0.5);
          this.addDimLabel(ux(w - nw / 2), uy(h - nh / 2), nw + " × " + nh, 0.5, 0.5);
          const opt = sliceOptions(r)[r.sliceIndex];
          if (r.phase === "slice") {
            g.lineStyle(3, 0xffdd00, 1);
            if (opt.dir === "vertical") dashLine(g, ux(w - nw), uy(0), ux(w - nw), uy(h), 8, 6);
            else dashLine(g, ux(0), uy(h - nh), ux(w), uy(h - nh), 8, 6);
          } else {
            g.lineStyle(4, 0xffdd00, 1);
            if (opt.dir === "vertical") g.lineBetween(ux(w - nw), uy(0), ux(w - nw), uy(h));
            else g.lineBetween(ux(0), uy(h - nh), ux(w), uy(h - nh));
            // Label each rectangle piece with its dimensions; the counted
            // areas appear only once help tier 2 is earned.
            const p1 = r.pieceAreas ? opt.a1 + " u²" : opt.w1 + " × " + opt.h1;
            const p2 = r.pieceAreas ? opt.a2 + " u²" : opt.w2 + " × " + opt.h2;
            if (opt.dir === "vertical") {
              this.addDimLabel(ux((w - nw) / 2), uy(h / 2), p1, 0.5, 0.5);
              this.addDimLabel(ux(w - nw / 2), uy((h - nh) / 2), p2, 0.5, 0.5);
            } else {
              this.addDimLabel(ux(w / 2), uy((h - nh) / 2), p1, 0.5, 0.5);
              this.addDimLabel(ux((w - nw) / 2), uy(h - nh / 2), p2, 0.5, 0.5);
            }
          }
        }
      };

      // Regular polygon centred in the grid. The student's n spokes run from
      // the centre; they meet every corner only when n equals the side count.
      GameScene.prototype.drawPolygon = function (g, r) {
        const cx = GRID_X + GRID_W / 2;
        const cy = GRID_Y + GRID_H / 2 - 10;
        const R = 125;
        const start = Math.PI / 2 + Math.PI / r.sides; // flat bottom side
        const pts = [];
        for (let i = 0; i < r.sides; i++) {
          const ang = start + (i * 2 * Math.PI) / r.sides;
          pts.push({ x: cx + R * Math.cos(ang), y: cy + R * Math.sin(ang) });
        }
        g.fillStyle(SHAPE_COLORS.polygon, 0.4);
        g.lineStyle(3, SHAPE_COLORS.polygon, 1);
        g.beginPath();
        g.moveTo(pts[0].x, pts[0].y);
        pts.slice(1).forEach((p) => g.lineTo(p.x, p.y));
        g.closePath();
        g.fillPath();
        g.strokePath();
        // Student's spokes (n of them, evenly spaced from the first corner).
        const n = r.dims.n;
        const fits = n === r.sides;
        g.lineStyle(2, fits ? 0xffdd00 : 0xffffff, fits ? 1 : 0.7);
        for (let i = 0; i < n; i++) {
          const ang = start + (i * 2 * Math.PI) / n;
          const len = fits ? R : R * 1.08;
          dashLine(g, cx, cy, cx + len * Math.cos(ang), cy + len * Math.sin(ang), 6, 4);
        }
        // Side s on the bottom edge, apothem a from the centre to it.
        const p0 = pts[0];
        const pLast = pts[r.sides - 1];
        const midY = (p0.y + pLast.y) / 2;
        g.lineStyle(2, 0xffffff, 0.95);
        dashLine(g, cx, cy, cx, midY, 5, 4);
        g.fillStyle(0xffffff, 1);
        g.fillCircle(cx, cy, 3);
        this.addDimLabel(cx, midY + 6, "s = " + r.s, 0.5, 0);
        this.addDimLabel(cx + 6, (cy + midY) / 2, "a = " + fmtNum(r.a), 0, 0.5);
        this.addDimLabel(cx, cy - R - 8, "n = " + n, 0.5, 1);
      };

      GameScene.prototype.updateReadout = function () {
        const r = this.round;
        if (!r) return;
        this.readoutText.setText(formulaFor(r));
        if (r.type === "composite") {
          this.readoutHint.setText(tr(r.phase === "slice" ? AU.sliceHint : AU.addHint));
          this.readoutText.setColor("#ffffff");
          return;
        }
        // The area is NOT computed for the student unless they earned the meter.
        if (!r.meter) {
          this.readoutText.setColor("#ffffff");
          this.readoutHint.setText(tr(r.type === "polygon" ? AU.polyHint : AU.computeHint));
          return;
        }
        const now = r.type === "polygon" ? (r.dims.n * r.s * r.a) / 2 : currentArea(r);
        const match = now === r.area && (r.type !== "polygon" || r.dims.A === r.area);
        this.readoutText.setColor(now === r.area ? "#44cc88" : "#ffffff");
        this.readoutHint.setText(
          match
            ? tr(AU.matchHint, { a: fmtNum(r.area) })
            : tr(AU.meterHint, { now: fmtNum(now), need: fmtNum(r.area) }),
        );
      };

      // ── Lock-in resolution ──

      GameScene.prototype.onLock = function () {
        const r = this.round;
        if (!r || this.lockBusy) return;
        SFX.init();
        if (r.type === "composite" && r.phase === "slice") {
          const opt = sliceOptions(r)[r.sliceIndex];
          r.phase = "total";
          SFX.place();
          this.buildRoundUI();
          this.redrawShape();
          this.updateReadout();
          srSay(
            tr(AU.sliced, {
              l1: opt.l1,
              w1: opt.w1,
              h1: opt.h1,
              l2: opt.l2,
              w2: opt.w2,
              h2: opt.h2,
            }),
          );
          return;
        }
        // Help tier for THIS miss: 1 method · 2 concrete step · 3 meter + result.
        const tier = Math.min(3, this.attempts + 1);
        const diag = lockDiagnosis(r, tier);
        if (diag.ok) {
          this.resolveCorrect();
          return;
        }
        if (tier >= 2) r.pieceAreas = true;
        if (tier >= 3) r.meter = true;
        this.redrawShape();
        this.updateReadout();
        this.resolveWrong(diag.teach);
      };


      GameScene.prototype.resolveCorrect = function () {
        const r = this.round;
        this.lockBusy = true;
        const firstTry = this.attempts === 0;
        if (firstTry) {
          this.totalCorrect++;
          this.combo++;
          if (this.combo > this.maxCombo) this.maxCombo = this.combo;
        }
        // Full points only for an unaided first lock; less as help is earned.
        const pts = firstTry
          ? 100 + this.combo * 20 + (this.stage - 1) * 10
          : [0, 50, 35][this.attempts] || 20;
        this.score += pts;
        this.shapesPlaced++;
        window.FlagshipAdventure?.record({ firstTry, kind: r.type });

        SFX.correct();
        r.meter = true;
        this.updateReadout();
        this.feedbackText.setText(tr(AU.lockedIn, { p: pts })).setColor("#44cc88");
        const summary =
          r.type === "composite" ? tr(AU.totalSay, { a: r.area }) : formulaFor(r);
        srSay(tr(AU.correctSay, { summary, p: pts }));

        this.showFloatingText(
          GRID_X + GRID_W / 2,
          GRID_Y + GRID_H / 2,
          "+" + pts,
          "#44cc88",
          "28px",
        );

        // Streak milestones (first-try streaks only)
        if (firstTry) {
          if (this.combo === 3) {
            SFX.streak3();
            this.showFloatingText(W / 2, H / 2 - 30, tr(AU.streak, { n: 3 }), "#ffdd00", "30px");
          } else if (this.combo === 5) {
            SFX.streak5();
            this.showFloatingText(W / 2, H / 2 - 30, tr(AU.streak5), "#ff8844", "32px");
          } else if (this.combo === 7) {
            SFX.streak7();
            this.showFloatingText(W / 2, H / 2 - 30, tr(AU.streak7), "#ff4488", "34px");
          } else if (this.combo >= 3) {
            SFX.combo();
          }
          if (this.combo >= 2) {
            this.comboText.setText(tr(AU.streak, { n: this.combo }));
            if (!this.reduceMotion) {
              this.tweens.add({
                targets: this.streakContainer,
                scaleX: { from: 1.3, to: 1 },
                scaleY: { from: 1.3, to: 1 },
                duration: 300,
                ease: "Back.easeOut",
              });
            }
            this.streakBg.setSize(120, 24).setFillStyle(0xffdd00, 0.15);
          }
        }

        // Confetti burst — intensity scales with streak
        this.confettiEmitter.setQuantity(Math.min(10 + this.combo * 5, 40));
        this.confettiEmitter.emitParticleAt(GRID_X + GRID_W / 2, GRID_Y + GRID_H / 2);
        if (!this.reduceMotion)
          this.cameras.main.shake(120, Math.min(0.004 + this.combo * 0.002, 0.015));

        this.addBuilding(SHAPE_COLORS[r.type]);

        // Stage up every 4 buildings
        if (this.shapesPlaced % 4 === 0 && this.roundsAsked < this.maxRounds) {
          this.stage++;
          SFX.levelUp();
          this.showPhaseTransition(tr(AU.stage, { n: this.stage }));
        }

        this.updateHUD();
        this.time.delayedCall(1500, () => this.nextRound());
      };

      GameScene.prototype.resolveWrong = function (teach) {
        this.attempts++;
        if (this.attempts === 1 && this.roundCard) this.misses.push(this.roundCard);
        this.totalWrong++;
        this.combo = 0;
        this.comboText.setText("");
        this.streakBg.setFillStyle(0x000000, 0);
        this.lives--;

        SFX.wrong();
        this.feedbackText.setText(tr(AU.notYet) + teach).setColor("#ffaa66");
        srSay(tr(AU.notYet) + teach);

        // Calm feedback: gentle shake + brief low-alpha wash (no game-over).
        if (!this.reduceMotion) this.cameras.main.shake(150, 0.006);
        this.redFlash.setAlpha(0.18);
        this.tweens.add({ targets: this.redFlash, alpha: 0, duration: 450 });

        if (this.lives <= 0) {
          // No-fail: refill hearts and keep building.
          this.lives = 3;
          this.showFloatingText(
            GRID_X + GRID_W / 2,
            GRID_Y + GRID_H / 2 + 44,
            tr(AU.refilled),
            "#44cc88",
            "24px",
          );
        }
        this.updateHUD();
      };

      // ── City strip ──

      GameScene.prototype.addBuilding = function (color) {
        const idx = this.shapesPlaced - 1;
        const bw = randInt(20, 26);
        const bh = randInt(30, 105);
        const bx = GRID_X + 18 + idx * 29;
        const by = 583;
        const bld = this.add.rectangle(bx, by, bw, bh, color, 0.85).setOrigin(0.5, 1);
        SFX.drop();
        if (this.reduceMotion) {
          bld.setScale(1, 1);
        } else {
          bld.setScale(1, 0);
          this.tweens.add({
            targets: bld,
            scaleY: 1,
            duration: 500,
            ease: "Back.easeOut",
          });
        }
        for (let wy = by - bh + 8; wy < by - 8; wy += 14) {
          const win = this.add.rectangle(bx, wy, 8, 6, 0xffdd88, 0);
          this.tweens.add({
            targets: win,
            fillAlpha: 0.8,
            duration: 200,
            delay: this.reduceMotion ? 0 : 500 + Math.random() * 400,
          });
        }
        this.sparkles.emitParticleAt(bx, by - bh / 2);
      };

      // ── Shared flair helpers ──

      GameScene.prototype.showFloatingText = function (x, y, text, color, size) {
        const ft = this.add
          .text(x, y, text, {
            fontFamily: FONT,
            fontSize: size || "20px",
            fontStyle: "bold",
            color: color || "#ffdd00",
            stroke: "#000",
            strokeThickness: 3,
          })
          .setOrigin(0.5)
          .setDepth(40);
        this.tweens.add({
          targets: ft,
          y: y - 50,
          alpha: { from: 1, to: 0 },
          scale: { from: 1, to: 1.5 },
          duration: 1000,
          onComplete: () => ft.destroy(),
        });
      };

      GameScene.prototype.showPhaseTransition = function (text) {
        SFX.phaseTransition();
        this.transitionOverlay.setAlpha(0);
        this.transitionText.setText(text).setAlpha(0).setScale(0.5);
        this.tweens.add({
          targets: this.transitionOverlay,
          alpha: 0.7,
          duration: 300,
          yoyo: true,
          hold: 800,
        });
        this.tweens.add({
          targets: this.transitionText,
          alpha: 1,
          scale: 1.3,
          duration: 400,
          yoyo: true,
          hold: 600,
          ease: "Back.easeOut",
          onComplete: () => this.transitionText.setAlpha(0),
        });
      };

      GameScene.prototype.endGame = function () {
        SFX.win();
        this.time.delayedCall(500, () => {
          this.scene.start("Results", {
            score: this.score,
            maxCombo: this.maxCombo,
            totalCorrect: this.totalCorrect,
            totalWrong: this.totalWrong,
            levelNum: this.levelNum,
            stage: this.stage,
            rounds: this.maxRounds,
            buildings: this.shapesPlaced,
            misses: this.misses.slice(),
          });
        });
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText(tr(AU.score, { n: this.score }));
        this.levelText.setText(tr(AU.levelStage, { l: this.levelNum, s: this.stage }));
        this.livesText.setText("♥".repeat(this.lives) + "♡".repeat(Math.max(0, 3 - this.lives)));
        this.buildingsText.setText(tr(AU.buildings, { n: this.shapesPlaced }));
        this.progressBarFill.width = (this.roundsAsked / this.maxRounds) * 200;
        this.progressText.setText(this.roundsAsked + "/" + this.maxRounds);
      };

      // ── RESULTS ──
      function ResultScene() {
        Phaser.Scene.call(this, "Results");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.d = data;
      };
      ResultScene.prototype.create = function () {
        const cx = W / 2,
          d = this.d;
        this.add.rectangle(cx, H / 2, W, H, 0x0a1a2e);

        const pct = (d.totalCorrect / Math.max(1, d.rounds)) * 100;
        const solved = d.rounds || 0;
        const attempts = solved + (d.totalWrong || 0);
        const accuracy = attempts ? solved / attempts : 0;
        const stars =
          (solved >= 3 ? 1 : 0) +
          (d.maxCombo >= 3 || solved >= 8 ? 1 : 0) +
          (solved >= 4 && accuracy >= 0.8 ? 1 : 0);

        // A language switch re-creates this scene with the same data: report
        // and save the high score only once.
        const firstShow = !d.shown;
        d.shown = true;
        if (firstShow) try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.totalCorrect,
              maxScore: d.rounds,
              stars: stars,
              problemsCorrect: d.totalCorrect,
              problemsAttempted: d.rounds,
              percent: Math.round(pct),
            });
        } catch (e) {}

        // High score check
        if (firstShow) {
          let prevHigh = 0;
          try {
            prevHigh = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
          } catch (e) {}
          d.isNewHigh = d.score > prevHigh && d.score > 0;
          if (d.isNewHigh) {
            try {
              localStorage.setItem(LS_KEY, String(d.score));
            } catch (e) {}
          }
          // Play appropriate sound
          if (stars === 3) SFX.win3star();
          else SFX.win();
        }
        const isNewHigh = !!d.isNewHigh;

        srSay(
          tr(AU.citySay, { b: d.buildings, c: d.totalCorrect, r: d.rounds, s: d.score }),
        );

        // City skyline celebration
        const colors = [0x4488ff, 0x44cc88, 0xff8844, 0xcc44cc, 0xddaa00];
        for (let i = 0; i < 10; i++) {
          const bw = randInt(25, 55),
            bh = randInt(40, 150);
          const bx = i * 80 + 20;
          this.add.rectangle(bx, H - bh / 2 - 5, bw, bh, colors[i % colors.length], 0.6);
          for (let wy = H - bh + 8; wy < H - 8; wy += 16) {
            for (let wx = bx - bw / 2 + 6; wx < bx + bw / 2 - 6; wx += 12) {
              this.add.rectangle(wx, wy, 5, 7, 0xffdd88, 0.7);
            }
          }
        }
        this.add.rectangle(cx, H - 4, W, 8, 0x1a3a2e);

        // Celebration particles
        const burstCount = stars === 3 ? 8 : stars === 2 ? 5 : 3;
        for (let i = 0; i < burstCount; i++) {
          this.time.delayedCall(i * 300, () => {
            const p = this.add.particles(0, 0, "confetti", {
              speed: { min: 60, max: 250 },
              angle: { min: 0, max: 360 },
              scale: { start: 1.5, end: 0 },
              rotate: { min: 0, max: 360 },
              lifespan: 1500,
              quantity: 20,
              tint: [0x44cc88, 0x4488ff, 0xffdd00, 0xff8844, 0xcc44cc],
              gravityY: 150,
            });
            p.emitParticleAt(randInt(100, W - 100), randInt(30, 150));
            this.time.delayedCall(1600, () => p.destroy());
          });
        }

        this.add
          .text(cx, 30, tr(AU.cityComplete), {
            fontFamily: FONT,
            fontSize: "36px",
            fontStyle: "bold",
            color: "#44cc88",
            stroke: "#000",
            strokeThickness: 4,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 60, tr(AU.everyBlueprint), {
            fontFamily: FONT,
            fontSize: "15px",
            color: "#88aacc",
          })
          .setOrigin(0.5);

        // Star rating with animated fill
        const starY = 90;
        for (let i = 0; i < 3; i++) {
          const sx = cx - 60 + i * 60;
          // Empty star background
          this.add
            .text(sx, starY, "☆", {
              fontFamily: FONT,
              fontSize: "42px",
              color: "#334455",
            })
            .setOrigin(0.5);

          if (i < stars) {
            const fullStar = this.add
              .text(sx, starY, "★", {
                fontFamily: FONT,
                fontSize: "42px",
                color: "#ffdd00",
              })
              .setOrigin(0.5)
              .setAlpha(0)
              .setScale(0);
            this.tweens.add({
              targets: fullStar,
              alpha: 1,
              scale: 1,
              duration: 400,
              delay: 800 + i * 300,
              ease: "Back.easeOut",
              onStart: () => SFX.tick(),
            });
          }
        }

        // NEW HIGH SCORE banner
        if (isNewHigh) {
          if (firstShow) SFX.highScore();
          const hsText = this.add
            .text(cx, 125, tr(AU.newHigh), {
              fontFamily: FONT,
              fontSize: "22px",
              fontStyle: "bold",
              color: "#ffdd00",
              stroke: "#000",
              strokeThickness: 3,
            })
            .setOrigin(0.5);
          this.tweens.add({
            targets: hsText,
            scaleX: { from: 0.8, to: 1.1 },
            scaleY: { from: 0.8, to: 1.1 },
            duration: 600,
            yoyo: true,
            repeat: -1,
          });
        }

        const statsStartY = isNewHigh ? 150 : 130;
        const stats = [
          { label: tr(AU.finalScore), val: String(d.score), color: "#44cc88" },
          {
            label: tr(AU.buildingsBuilt),
            val: String(d.buildings),
            color: "#4488ff",
          },
          {
            label: tr(AU.firstTry),
            val: d.totalCorrect + " / " + d.rounds,
            color: "#44cc88",
          },
          { label: tr(AU.wrongLocks), val: String(d.totalWrong), color: "#ffaa66" },
          { label: tr(AU.bestStreak), val: "x" + d.maxCombo, color: "#ffaa00" },
          { label: tr(AU.stageReached), val: String(d.stage), color: "#88aacc" },
          { label: tr(AU.levelLbl), val: tr(AU.levelN, { n: d.levelNum }), color: "#cc88ff" },
        ];
        stats.forEach((s, i) => {
          const y = statsStartY + i * 40;
          this.add.rectangle(cx, y, 400, 32, 0x112233, 0.8);
          this.add
            .text(cx - 170, y, s.label, { fontFamily: FONT, fontSize: "15px", color: "#6688aa" })
            .setOrigin(0, 0.5);
          const v = this.add
            .text(cx + 170, y, s.val, {
              fontFamily: FONT,
              fontSize: "17px",
              fontStyle: "bold",
              color: s.color,
            })
            .setOrigin(1, 0.5)
            .setAlpha(0);
          this.tweens.add({
            targets: v,
            alpha: 1,
            x: { from: cx + 210, to: cx + 170 },
            duration: 350,
            delay: i * 100,
          });
        });

        const grade = pct >= 90 ? "A+" : pct >= 80 ? "A" : pct >= 70 ? "B" : pct >= 60 ? "C" : "D";
        this.add
          .text(cx, 460, grade, {
            fontFamily: FONT,
            fontSize: "48px",
            fontStyle: "bold",
            color: pct >= 80 ? "#44cc88" : pct >= 60 ? "#f59e0b" : "#ff4444",
            stroke: "#000",
            strokeThickness: 4,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 492, tr(AU.accuracy, { p: Math.round(pct) }), {
            fontFamily: FONT,
            fontSize: "15px",
            color: "#88aacc",
          })
          .setOrigin(0.5);

        // Personal best display
        let bestScore = 0;
        try {
          bestScore = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
        } catch (e) {}
        if (bestScore > 0 && !isNewHigh) {
          this.add
            .text(cx, 515, tr(AU.personalBest, { n: bestScore }), {
              fontFamily: FONT,
              fontSize: "13px",
              color: "#6688aa",
            })
            .setOrigin(0.5);
        }

        const retry = this.add
          .rectangle(cx - 100, 550, 170, 42, 0x44cc88)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx - 100, 550, tr(AU.buildAgain), {
            fontFamily: FONT,
            fontSize: "17px",
            fontStyle: "bold",
            color: "#0a2a1e",
          })
          .setOrigin(0.5);
        retry.on("pointerover", () => retry.setFillStyle(0x55ddaa));
        retry.on("pointerout", () => retry.setFillStyle(0x44cc88));
        retry.on("pointerdown", () => {
          this.cameras.main.fadeOut(300);
          this.time.delayedCall(300, () => this.scene.start("Game", { level: d.levelNum }));
        });

        const menu = this.add
          .rectangle(cx + 100, 550, 170, 42, 0x1a3355)
          .setInteractive({ useHandCursor: true });
        this.add
          .text(cx + 100, 550, tr(AU.mainMenu), {
            fontFamily: FONT,
            fontSize: "17px",
            fontStyle: "bold",
            color: "#88aacc",
          })
          .setOrigin(0.5);
        menu.on("pointerover", () => menu.setFillStyle(0x2a4466));
        menu.on("pointerout", () => menu.setFillStyle(0x1a3355));
        menu.on("pointerdown", () => {
          this.cameras.main.fadeOut(300);
          this.time.delayedCall(300, () => this.scene.start("Title"));
        });
        if (d.misses && d.misses.length) {
          const practice = this.add
            .rectangle(cx, 586, 250, 22, 0xf0b429)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(cx, 586, tr(AU.practiceMisses), {
              fontFamily: FONT,
              fontSize: "13px",
              fontStyle: "bold",
              color: "#1a1408",
            })
            .setOrigin(0.5);
          practice.on("pointerdown", () =>
            this.scene.start("Game", { level: d.levelNum, replay: d.misses }),
          );
        }

        addLangButton(this, W - 12, 12);
        if (firstShow) this.cameras.main.fadeIn(600);
      };

      const aaGame = (window.__flagshipGame = new Phaser.Game(config));

      // ── Canvas accessibility (additive) ──
      // The whole game renders into one Phaser <canvas>. Give assistive tech a
      // label and make the canvas keyboard-focusable so the keyboard controls
      // are discoverable. Prompts and results are mirrored into the #aa-sr
      // aria-live region as the game runs.
      aaGame.events.once("ready", function () {
        try {
          var cv = aaGame.canvas;
          if (!cv) return;
          cv.setAttribute("role", "application");
          cv.setAttribute("aria-label", tr(AU.canvasLabel));
          cv.setAttribute("aria-roledescription", "math game");
          if (!cv.hasAttribute("tabindex")) cv.setAttribute("tabindex", "0");
        } catch (e) {
          /* a11y wiring failed — non-fatal, game still plays */
        }
      });

      // Language switch: the running game scene relabels in place; menus and
      // results re-create themselves with the same data.
      function applyLang() {
        document.documentElement.lang = lang();
        if (aaGame.canvas) aaGame.canvas.setAttribute("aria-label", tr(AU.canvasLabel));
        aaGame.scene.getScenes(true).forEach((sc) => {
          if (typeof sc.relabel === "function") sc.relabel();
          else if (sc.scene.key !== "Boot") sc.scene.restart(sc.d);
        });
      }
      document.addEventListener("ewl:lang", applyLang);
      window.addEventListener("storage", (e) => {
        if (e.key === LANG_KEY) applyLang();
      });
      document.documentElement.lang = lang();
    </script>
