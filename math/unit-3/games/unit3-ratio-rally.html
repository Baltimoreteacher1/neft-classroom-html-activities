    <script>
      // ── RATIO RALLY — Road Trip Checkpoints (calm, turn-based) ──
      // Phaser 3 — Grade 6 Math — Equivalent Ratios, Proportions, Unit Rates

      const LS_KEY = "ratio_rally_hiscore";

      const SFX = {
        ctx: null,
        init() {
          if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        play(t, f, d, v = 0.2) {
          if (window.__flagshipMuted) return;
          this.init();
          if (!this.ctx) return;
          const c = this.ctx,
            o = c.createOscillator(),
            g = c.createGain();
          o.type = t;
          o.frequency.value = f;
          g.gain.setValueAtTime(v, c.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
          o.connect(g);
          g.connect(c.destination);
          o.start();
          o.stop(c.currentTime + d);
        },
        noise(d, v = 0.1) {
          if (window.__flagshipMuted) return;
          this.init();
          if (!this.ctx) return;
          const c = this.ctx;
          const bufferSize = c.sampleRate * d;
          const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const src = c.createBufferSource();
          src.buffer = buffer;
          const g = c.createGain();
          g.gain.setValueAtTime(v, c.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
          src.connect(g);
          g.connect(c.destination);
          src.start();
        },
        engine() {
          this.play("sawtooth", 80, 0.08, 0.06);
        },
        boost() {
          this.play("sine", 400, 0.1, 0.25);
          this.play("sine", 600, 0.12, 0.2);

        wrong() {

        },

        },
        lap() {

        streak7() {

        glassBreak() {

        },
        phaseTransition() {

        },
        powerUp() {

        },
        newRecord() {

            setTimeout(() => this.play("sine", f, 0.15, 0.3), i * 90),
          );
        },
        coin() {

        },
        nitro() {

          );
        },

        },
        stamp() {

          this.play("square", 110, 0.2, 0.25);
        },
        crowd(level) {

        },
      };

      function randInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }
      function shuffle(a) {
        const r = [...a];
        for (let i = r.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [r[i], r[j]] = [r[j], r[i]];
        }
        return r;
      }
      function gcd(a, b) {
        return b === 0 ? a : gcd(b, a % b);
      }
      function simplifyRatio(a, b) {
        const g = gcd(a, b);
        return `${a / g}:${b / g}`;
      }
      // True if a ratio-shaped string ("x:y") is mathematically equivalent to
      // the answer ratio. Used to weed out distractors that *reduce* to the
      // correct ratio (e.g. 1:1 collisions when a === b), which would make a
      // question have two right answers.
      function ratioEquiv(choice, answer) {
        const cm = /^(\d+):(\d+)$/.exec(choice);
        const am = /^(\d+):(\d+)$/.exec(answer);
        if (!cm || !am) return false;
        const cn = +cm[1],
          cd = +cm[2],
          an = +am[1],
          ad = +am[2];
        if (cd === 0 || ad === 0) return false;
        return cn * ad === an * cd; // cross-multiply: equal ratios
      }

      // ── Question Generator ──
      // Every question carries its own coaching: a misconception-specific
      // "why" for each distractor, a Tier 1 method hint that never states the
      // answer, a Tier 2 concrete step, and a worked explanation shown after
      // the answer is found. Skill tags feed the end-of-trip summary.
      const SKILLS = [
        "Writing a ratio in order",
        "Equivalent ratios",
        "Ratio tables",
        "Unit rate (price for 1)",
        "Equivalent fractions",
        "Percent of a number",
      ];
      function makeQuestion(type) {
        const choice = (values) => values[randInt(0, values.length - 1)];
        let prompt, answer, wrong, hint1, hint2, explain;
        if (type === 0) {
          const a = randInt(2, 10);
          let b = randInt(2, 10);
          while (b === a) b = randInt(2, 10);
          prompt = `A bag has ${a} red and ${b} blue marbles. What is the ratio of red to blue?`;
          answer = `${a}:${b}`;
          wrong = {
            [`${b}:${a}`]:
              "That ratio is blue to red. The order of the words sets the order of the numbers.",
            [`${a + 1}:${b}`]:
              "Check the count of red marbles again. Use the numbers from the story exactly.",
            [`${a}:${b + 2}`]:
              "Check the count of blue marbles again. Use the numbers from the story exactly.",
          };
          hint1 =
            "Read the question: which color is named FIRST? That amount goes first in the ratio.";
          hint2 = `Red comes first, so start with the red count (${a}). Then write a colon and the blue count.`;
          explain = `Red to blue means red first: ${a} red : ${b} blue = ${answer}.`;
        } else if (type === 1) {
          const a = randInt(2, 6);
          let b = randInt(2, 6);
          while (b === a) b = randInt(2, 6);
          const m = randInt(2, 5);
          prompt = `Which ratio is equivalent to ${a}:${b}?`;
          answer = `${a * m}:${b * m}`;
          wrong = {
            [`${a * m + 1}:${b * m}`]:
              "The first part was not multiplied by the same number as the second part.",
            [`${a * m}:${b * m + 2}`]:
              "The second part was not multiplied by the same number as the first part.",
            [`${a + b}:${b * 2}`]:
              "Adding does not keep a ratio equal. Multiply BOTH parts by the same number.",
          };
          hint1 =
            "Equivalent ratios multiply BOTH parts by the same number. For each choice, divide each part by the original part.";
          hint2 = `Try ×${m}: ${a} × ${m} = ${a * m}. Which choice has ${a * m} first AND the second part ${b} × ${m}?`;
          explain = `${a} × ${m} = ${a * m} and ${b} × ${m} = ${b * m}, so ${a}:${b} = ${answer}.`;
        } else if (type === 2) {
          const a = randInt(2, 6),
            b = randInt(2, 8),
            m = randInt(2, 5);
          prompt = `Ratio table: ${a} → ${b}. If the first column is ${a * m}, what is the second column?`;
          answer = String(b * m);
          wrong = {
            [String(b * m + a)]:
              "It looks like you added. In a ratio table you MULTIPLY both columns by the same factor.",
            [String(b * m - 1)]: "Close! Re-check your multiplication.",
            [String(a * m)]: "That is the first-column value. Find what the SECOND column becomes.",
          };
          hint1 = `Find the scale factor: what times ${a} gives ${a * m}? Use that same factor on the other column.`;
          hint2 = `${a} × ${m} = ${a * m}, so the factor is ${m}. Now multiply ${b} × ${m}.`;
          explain = `Scale factor ${m}: ${b} × ${m} = ${answer}.`;
        } else if (type === 3) {
          const items = randInt(3, 12);
          const rate = randInt(2, 5);
          const cost = items * rate;
          prompt = `${items} items cost $${cost}. What is the price for 1 item?`;
          answer = `$${rate}`;
          wrong = {
            [`$${rate + 1}`]: "Check your division: total cost ÷ number of items.",
            [`$${rate - 1}`]: "Check your division: total cost ÷ number of items.",
            [`$${items}`]:
              "That is the number of items, not the price. Divide the cost by the number of items.",
            [`$${cost - items}`]:
              "Subtracting does not find a unit rate. Divide the cost by the number of items.",
          };
          hint1 =
            "A unit rate is the amount for ONE. Divide the total cost by the number of items.";
          hint2 = `Divide: $${cost} ÷ ${items} = ?  Check: the answer × ${items} should equal ${cost}.`;
          explain = `$${cost} ÷ ${items} = $${rate} for each item. Check: ${items} × $${rate} = $${cost}.`;
        } else if (type === 4) {
          const a = randInt(2, 8);
          let b = randInt(2, 8);
          while (b === a) b = randInt(2, 8);
          const m = randInt(2, 5);
          prompt = `Fill in the missing number: ${a}/${b} = ${a * m}/?`;
          answer = String(b * m);
          wrong = {
            [String(b * m + 2)]:
              "Re-check: the denominator must be multiplied by the same number as the numerator.",
            [String(a * m)]:
              "That is the new numerator. Multiply the DENOMINATOR by the same factor.",
            [String(b * m - 1)]: "Close! Re-check your multiplication.",
            [String(b + a * m - a)]:
              "It looks like you added. Equivalent fractions multiply top and bottom by the same number.",
          };
          hint1 = `What number times ${a} gives ${a * m}? Multiply the bottom by that same number.`;
          hint2 = `${a} × ${m} = ${a * m}, so multiply the denominator: ${b} × ${m}.`;
          explain = `${a} × ${m} = ${a * m}, and ${b} × ${m} = ${answer}, so ${a}/${b} = ${a * m}/${answer}.`;
        } else {
          const pct = choice([10, 20, 25, 50, 75]);
          const total = choice([40, 60, 80, 100, 120, 200]);
          const part = (pct * total) / 100;
          prompt = `What is ${pct}% of ${total}?`;
          answer = String(part);
          wrong = {
            [String((total * pct) / 10)]: "Percent means per 100. Divide by 100, not by 10.",
            [String(part + 5)]:
              "Close. Find 10% first (divide by 10), then build up to the percent you need.",
            [String(part - 5)]:
              "Close. Find 10% first (divide by 10), then build up to the percent you need.",
            [String(total - part)]: `That is the part that is NOT ${pct}%. Find ${pct}% itself.`,
          };
          hint1 = "Percent means 'out of 100'. Find 10% or 1% of the number first, then scale up.";
          hint2 = `${pct}% = ${pct}/100. Compute ${total} × ${pct} ÷ 100.`;
          explain = `${pct}% of ${total} = ${total} × ${pct} ÷ 100 = ${answer}.`;
        }
        // Build 4 distinct choices; no distractor may equal (or be equivalent
        // to) the answer, and none may be zero/negative.
        const ok = (c) => c !== answer && !ratioEquiv(c, answer) && !/^\$?-|^\$?0$|^0:|:0$/.test(c);
        let pool = Object.keys(wrong).filter(ok);
        pool = [...new Set(pool)];
        let guard = 0;
        while (pool.length < 3 && guard < 200) {
          guard++;
          let fill;
          if (answer[0] === "$") fill = `$${randInt(1, 30)}`;
          else if (answer.includes(":")) fill = `${randInt(1, 20)}:${randInt(1, 20)}`;
          else fill = String(randInt(1, 60));
          if (ok(fill) && !pool.includes(fill)) {
            pool.push(fill);
            wrong[fill] = "Not quite. " + hint1;
          }
        }
        const choices = shuffle([answer, ...shuffle(pool).slice(0, 3)]);
        return { prompt, answer, choices, type, wrong, hint1, hint2, explain };
      }
      function generateQuestions(difficulty, count = 10) {
        const qs = [];
        const seen = new Set();
        // Cycle through the track's skills so every skill appears.
        const types =
          difficulty === "easy"
            ? [0, 1, 2]
            : difficulty === "hard"
              ? [3, 4, 5, 1, 2]
              : [0, 1, 2, 3, 4, 5];
        let guard = 0;
        while (qs.length < count && guard < 500) {
          guard++;
          const type = types[qs.length % types.length];
          const q = makeQuestion(type);
          if (seen.has(q.prompt)) continue;
          seen.add(q.prompt);
          qs.push(q);
        }
        return shuffle(qs);
      }

      const W = 800,
        H = 600;
      const ROAD_W = 300,
        LANE_W = 75;
      const ROAD_LEFT = (W - ROAD_W) / 2;

      const config = {
        type: Phaser.AUTO,
        width: W,
        height: H,
        parent: document.body,
        backgroundColor: "#1a3a1a",
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: [BootScene, TitleScene, DiffScene, GameScene, ResultScene],
      };

      // ── BOOT ──
      function BootScene() {
        Phaser.Scene.call(this, "Boot");
      }
      BootScene.prototype = Object.create(Phaser.Scene.prototype);
      BootScene.prototype.constructor = BootScene;
      BootScene.prototype.create = function () {
        const g = this.make.graphics({ add: false });

        // Player car (top-down view)
        g.fillStyle(0x00aaff);
        g.fillRoundedRect(0, 0, 30, 50, 6);
        g.fillStyle(0x0088cc);
        g.fillRect(4, 4, 22, 14);
        g.fillStyle(0x333333);
        g.fillRect(0, 0, 6, 12);
        g.fillRect(24, 0, 6, 12);
        g.fillStyle(0x333333);
        g.fillRect(0, 38, 6, 12);
        g.fillRect(24, 38, 6, 12);
        g.generateTexture("car_player", 30, 50);
        g.clear();

        // AI car 1
        g.fillStyle(0xff4444);
        g.fillRoundedRect(0, 0, 30, 50, 6);
        g.fillStyle(0xcc2222);
        g.fillRect(4, 4, 22, 14);
        g.fillStyle(0x333333);
        g.fillRect(0, 0, 6, 12);
        g.fillRect(24, 0, 6, 12);
        g.fillStyle(0x333333);
        g.fillRect(0, 38, 6, 12);
        g.fillRect(24, 38, 6, 12);
        g.generateTexture("car_ai1", 30, 50);
        g.clear();

        // AI car 2
        g.fillStyle(0xffaa00);
        g.fillRoundedRect(0, 0, 30, 50, 6);
        g.fillStyle(0xcc8800);
        g.fillRect(4, 4, 22, 14);
        g.fillStyle(0x333333);
        g.fillRect(0, 0, 6, 12);
        g.fillRect(24, 0, 6, 12);
        g.fillStyle(0x333333);
        g.fillRect(0, 38, 6, 12);
        g.fillRect(24, 38, 6, 12);
        g.generateTexture("car_ai2", 30, 50);
        g.clear();

        // Road segment
        g.fillStyle(0x444444);
        g.fillRect(0, 0, ROAD_W, H);
        g.lineStyle(3, 0xffffff);
        g.lineBetween(0, 0, 0, H);
        g.lineBetween(ROAD_W, 0, ROAD_W, H);
        g.lineStyle(2, 0xffff00, 0.5);
        for (let y = 0; y < H; y += 40) {
          g.fillStyle(0xffff00);
          g.fillRect(ROAD_W / 2 - 2, y, 4, 20);
        }
        g.generateTexture("road", ROAD_W, H);
        g.clear();

        // Checkpoint banner
        g.fillStyle(0xff8800, 0.8);
        g.fillRect(0, 0, ROAD_W, 8);
        g.fillStyle(0xffffff);
        for (let x = 0; x < ROAD_W; x += 16) {
          g.fillRect(x, 0, 8, 8);
        }
        g.generateTexture("checkpoint", ROAD_W, 8);
        g.clear();

        // Obstacle (cone)
        g.fillStyle(0xff6600);
        g.beginPath();
        g.moveTo(12, 0);
        g.lineTo(24, 24);
        g.lineTo(0, 24);
        g.closePath();
        g.fill();
        g.fillStyle(0xffffff);
        g.fillRect(2, 12, 20, 4);
        g.generateTexture("cone", 24, 24);
        g.clear();

        // Speed boost

      // ── GAME SCENE (calm, turn-based) ──
      // The car only moves when a checkpoint question is solved. No steering,
      // no obstacles, no countdown, no speed — unlimited think time. A wrong
      // try removes that choice and earns coaching: try 1 → why it is wrong +
      // a Tier 1 method hint; try 2 → a Tier 2 concrete step; try 3 → the
      // worked answer, then the student taps it to drive on (no-fail).
      const TRIP_LEN = 10;
      const POINTS = [100, 60, 30, 10]; // by number of wrong tries first
      function GameScene() {
        Phaser.Scene.call(this, "Game");
      }
      GameScene.prototype = Object.create(Phaser.Scene.prototype);
      GameScene.prototype.constructor = GameScene;

      GameScene.prototype.init = function (data) {
        this.difficulty = (data && data.difficulty) || "easy";
        const replay = data && data.replay;
        this.questions =
          replay && replay.length
            ? replay.map((q) => JSON.parse(JSON.stringify(q)))
            : generateQuestions(this.difficulty, TRIP_LEN);
        this.missed = [];
        this.currentQ = 0;
        this.score = 0;
        this.combo = 0;
        this.maxCombo = 0;
        this.totalCorrect = 0; // first-try, unaided
        this.totalWrong = 0; // wrong tries (all)
        this.helped = 0; // questions solved after coaching
        this.skillMiss = {};
        this.skillSeen = {};
        this.totalCheckpoints = this.questions.length;
        this.checkpointsHit = 0;
        this.paused = true; // a question is always on screen between drives
        this.raceFinished = false;
        this.tries = 0;
        this.locked = false;
        this.answerBtns = [];
        this.envColors =
          this.difficulty === "easy"
            ? { grass: 0xd4a050, road: 0x666655 }
            : this.difficulty === "medium"
              ? { grass: 0x334455, road: 0x555555 }
              : { grass: 0x1a0a33, road: 0x333344 };
        this.questionStartTime = 0;
        this.race = RRPro.createRace(this.difficulty, this.questions.length);
        this.coins = 0;
        this.needBounce = false;
        this.bounceRun = 0;
        this.recovered = false;
        this.nitro = false;
        this.toastQ = [];
        this.toastBusy = false;
      };

      // Respect the OS "reduce motion" setting and the studio Calm motion toggle.
      function gfxReducedMotion() {
        try {
          if (window.__flagshipReduced) return true;
          return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) {
          return false;
        }
      }

      // ── Decorative parallax layers (static under reduced motion) ──
      GameScene.prototype.buildParallaxBackground = function () {
        this.parallaxLayers = [];
        const horizonColor =
          this.difficulty === "easy"
            ? 0xe8b878
            : this.difficulty === "medium"
              ? 0x4a5a72
              : 0x2a1a55;
        this.add.rectangle(W / 2, 70, W, 140, horizonColor, 0.35).setDepth(0);
        const farTint =
          this.difficulty === "hard"
            ? [0xffffff, 0xaaccff, 0xffeeaa]
            : this.difficulty === "medium"
              ? [0xffdd88, 0xfff0c0, 0xcce0ff]
              : [0xfff4d8, 0xffe0a0];
        const farDots = [];
        for (let i = 0; i < 28; i++) {
          farDots.push(
            this.add
              .image(randInt(0, W), randInt(0, 150), "farDot")
              .setTint(farTint[i % farTint.length])
              .setScale(randInt(5, 11) / 10)
              .setAlpha(randInt(35, 80) / 100)
              .setDepth(0),
          );
        }
        this.parallaxLayers.push({ items: farDots, factor: 0.12, wrap: 150 });
        const midItems = [];
        const midColor =
          this.difficulty === "easy"
            ? 0xb07840
            : this.difficulty === "medium"
              ? 0x2c3850
              : 0x1a0e3a;
        for (let i = 0; i < 9; i++) {
          const isCity = this.difficulty === "medium";
          const bw = isCity ? randInt(40, 70) : randInt(90, 150);
          const bh = isCity ? randInt(60, 150) : randInt(50, 100);
          midItems.push(
            this.add
              .rectangle(i * (W / 8) + randInt(-20, 20), 150 - bh / 2, bw, bh, midColor, 0.5)
              .setDepth(0),
          );
        }
        this.parallaxLayers.push({ items: midItems, factor: 0.28, wrap: W });
      };

      GameScene.prototype.buildRoadPerspective = function () {
        const g = this.add.graphics().setDepth(1);
        const hx = W / 2,
          hy = 90;
        [0, 1, 2, 3, 4].forEach((k) => {
          const x = ROAD_LEFT + LANE_W * k;
          g.lineStyle(2, 0xffffff, 0.08);
          g.lineBetween(x, H, hx + (x - hx) * 0.18, hy);
        });
        g.fillStyle(0xffffff, 0.05);
        g.fillTriangle(ROAD_LEFT, H, ROAD_LEFT + ROAD_W, H, hx, hy);
      };

      GameScene.prototype.updateHUD = function () {
        this.scoreText.setText(`Score: ${this.score}`);
        const n = Math.min(this.currentQ + 1, this.totalCheckpoints);
        const snap = this.race.snapshot();
        this.progressLabel.setText(
          this.raceFinished
            ? `Finished ${RRPro.ordinal(snap.position)}!`
            : `${RRPro.ordinal(snap.position)} place · Checkpoint ${n} of ${this.totalCheckpoints}`,
        );
        const tier = RRPro.tierFor(this.combo);
        this.streakLabel
          .setText(
            tier ? `${tier.name} x${tier.mult}` : this.combo >= 2 ? `Streak x${this.combo}` : "",
          )
          .setColor(tier ? tier.color : "#ffdd00");
        this.coinText.setText(String(this.coins));
        this.flags.forEach((f, i) => {
          f.setFillStyle(
            i < this.checkpointsHit ? 0x22cc66 : i === this.currentQ ? 0xffaa00 : 0x445566,
          );
        });
        const x0 = 150,
          x1 = W - 150;
        const pos = Math.min(this.checkpointsHit, this.totalCheckpoints - 1);
        const along = (progress) => x0 + (x1 - x0) * Math.min(1, progress / this.totalCheckpoints);
        this.mapCar.x = along(snap.player);
        this.rivalDots.forEach((dot, i) => (dot.x = along(snap.rivals[i])));
        this.placeRivals(snap, !this.reducedMotion && this.driving);
      };

      // Rivals sit on the road by their lead over the player (110 px per checkpoint).
      GameScene.prototype.placeRivals = function (snap, animate) {
        this.rivalCars.forEach((car, i) => {
          const y = Phaser.Math.Clamp(H - 120 - (snap.rivals[i] - snap.player) * 110, -90, H + 90);
          if (animate)
            this.tweens.add({ targets: car, y, duration: this.driveMs, ease: "Sine.easeInOut" });
          else car.y = y;
        });
      };

      // Drive one segment of road. Pure reward animation AFTER a solved
      // checkpoint; nothing to steer or dodge.
      GameScene.prototype.driveSegment = function (done) {
        const nitro = this.nitro;
        this.driveMs = nitro ? 1500 : 1100;
        this.driving = true;
        const finish = () => {
          this.driving = false;
          done();
        };
        if (this.reducedMotion) {
          this.updateHUD();
          this.time.delayedCall(250, finish);
          return;
        }
        const dist = { v: 0 };
        let last = 0;
        SFX.engine();
        if (nitro) {
          SFX.nitro();
          RRPro.shake(this, 700, 0.003);
          this.speedLines.start();
          this.flames.forEach((f) =>
            this.tweens.add({
              targets: f,
              alpha: 1,
              scaleY: { from: 0.8, to: 1.3 },
              duration: 90,
              yoyo: true,
              repeat: 7,
            }),
          );
          this.tweens.add({
            targets: this.cameras.main,
            zoom: 1.05,
            duration: 500,
            yoyo: true,
            hold: 400,
          });
        }
        // The checkpoint gate sweeps over the car as you drive through it.
        const gate = this.add
          .container(W / 2, -40, [
            this.add.rectangle(0, 0, ROAD_W + 50, 22, 0xff8800),
            this.add
              .text(0, 0, `CHECKPOINT ${this.checkpointsHit}`, {
                fontSize: "14px",
                fontStyle: "bold",
                color: "#ffffff",
              })
              .setOrigin(0.5),
            this.add.rectangle(-(ROAD_W / 2 + 25), 40, 8, 80, 0xffffff),
            this.add.rectangle(ROAD_W / 2 + 25, 40, 8, 80, 0xffffff),
          ])
          .setDepth(5);
        this.tweens.add({
          targets: gate,
          y: H + 100,
          duration: this.driveMs,
          ease: "Sine.easeIn",
          onComplete: () => gate.destroy(),
        });
        this.updateHUD();
        this.tweens.add({
          targets: dist,
          v: nitro ? 700 : 420,
          duration: this.driveMs,
          ease: "Sine.easeInOut",
          onUpdate: () => {
            const d = dist.v - last;
            last = dist.v;
            this.rumble.forEach((r) => (r.tilePositionY -= d));
            this.laneLines.forEach((l) => {
              l.y += d;
              if (l.y > H + 40) l.y -= H + 80;
            });
            this.scenery.forEach((sc) => {
              sc.y += d * 0.7;
              if (sc.y > H + 60) sc.y -= H + 120;
            });
            this.parallaxLayers.forEach((layer) =>
              layer.items.forEach((it) => {
                it.y += d * layer.factor * 0.3;
                if (it.y > layer.wrap + 20) it.y = -20;
              }),
            );
          },
          onComplete: () => {
            this.speedLines.stop();
            this.flames.forEach((f) => f.setAlpha(0));
            finish();
          },
        });
      };

      GameScene.prototype.clearPanel = function () {
        (this.panelElems || []).forEach((e) => e && e.destroy && e.destroy());
        this.panelElems = [];
      };

      GameScene.prototype.say = function (text) {
        const rrSr = document.getElementById("rr-sr");
        if (rrSr) rrSr.textContent = text;
      };

      GameScene.prototype.showCheckpointQuestion = function () {
        const q = this.questions[this.currentQ];
        if (!q) return this.finishTrip();
        this.clearPanel();
        this.paused = true;
        this.tries = 0;
        this.questionStartTime = Date.now();
        this.skillSeen[q.type] = true;
        // Mirror into the live region (screen readers + shared hint ladder).
        this.say(
          `Checkpoint question ${this.currentQ + 1} of ${this.totalCheckpoints}: ${q.prompt}`,
        );

        const E = this.panelElems;
        const cy = 300;
        E.push(
          this.add
            .rectangle(W / 2, cy, 640, 400, 0x0d1b33, 0.94)
            .setStrokeStyle(3, 0x00ccff)
            .setDepth(16),
        );
        E.push(
          this.add
            .text(
              W / 2,
              cy - 172,
              `CHECKPOINT ${this.currentQ + 1} OF ${this.totalCheckpoints}  ·  ${SKILLS[q.type]}`,
              {
                fontSize: "16px",
                color: "#7fe0ff",
                fontStyle: "bold",
              },
            )
            .setOrigin(0.5)
            .setDepth(17),
        );
        E.push(
          this.add
            .text(W / 2, cy - 112, q.prompt, {
              fontSize: "24px",
              color: "#ffffff",
              fontStyle: "bold",
              wordWrap: { width: 580 },
              align: "center",
            })
            .setOrigin(0.5)
            .setDepth(17),
        );
        E.push(
          this.add
            .text(W / 2, cy - 58, "Take your time. Solve it to drive to the next checkpoint.", {
              fontSize: "15px",
              color: "#a8e6c8",
            })
            .setOrigin(0.5)
            .setDepth(17),
        );

        this.answerBtns = [];
        q.choices.forEach((c, i) => {
          const x = W / 2 - 225 + i * 150;
          const y = cy + 6;
          // 105×55 is the size the shared mission panel looks for to mirror
          // these choices as real DOM buttons — keep it.
          const rect = this.add
            .rectangle(x, y, 105, 55, 0x224466)
            .setStrokeStyle(2, 0x6fa8dc)
            .setInteractive({ useHandCursor: true })
            .setDepth(17);
          const key = this.add
            .text(x - 46, y - 24, String(i + 1), { fontSize: "13px", color: "#9fc3e6" })
            .setDepth(18);
          const val = this.add
            .text(x, y + 2, c, { fontSize: "21px", color: "#fff", fontStyle: "bold" })
            .setOrigin(0.5)
            .setDepth(18);
          E.push(rect, key, val);
          const entry = { rect, val, eliminated: false };
          this.answerBtns.push(entry);
          rect.on("pointerover", () => {
            if (!entry.eliminated) rect.setFillStyle(0x336688);
          });
          rect.on("pointerout", () => {
            if (!entry.eliminated) rect.setFillStyle(0x224466);
          });
          rect.on("pointerdown", () => this.pickChoice(i));
        });

        this.fbText = this.add
          .text(W / 2, cy + 64, "", {
            fontSize: "17px",
            color: "#ffd27a",
            fontStyle: "bold",
            wordWrap: { width: 590 },
            align: "center",
          })
          .setOrigin(0.5, 0)
          .setDepth(17);
        E.push(this.fbText);
        this.updateHUD();
      };

      GameScene.prototype.pickChoice = function (i) {
        const q = this.questions[this.currentQ];
        const entry = this.answerBtns[i];
        if (!q || !entry || entry.eliminated || this.locked) return;
        const c = q.choices[i];
        const isCorrect = c === q.answer;
        if (isCorrect) {
          this.locked = true;
          if (this.tries === 0) {
            this.totalCorrect++;
            this.combo++;
            this.maxCombo = Math.max(this.maxCombo, this.combo);
            if (this.needBounce && ++this.bounceRun >= 3) this.recovered = true;
          } else {
            this.helped++;
            this.needBounce = true;
            this.bounceRun = 0;
          }
          const pts = RRPro.points(
            POINTS[Math.min(this.tries, POINTS.length - 1)],
            this.tries,
            this.combo,
          );
          this.score += pts;
          const tier = RRPro.tierFor(this.combo);
          this.nitro = this.tries === 0 && !!tier;
          const gained = RRPro.coinsFor(this.tries, this.nitro);
          RRPro.popup(this, entry.rect.x, entry.rect.y - 40, `+${pts}`, "#7dffb0", 26);
          RRPro.coinFly(
            this,
            { x: entry.rect.x, y: entry.rect.y },
            { x: 128, y: 44 },
            gained,
            () => {
              this.coins++;
              this.coinText.setText(String(this.coins));
              SFX.coin();
            },
          );
          if (this.reducedMotion) this.coins += gained;
          if (tier && this.tries === 0 && this.combo === tier.min) {
            RRPro.flair(this, `${tier.name}! x${tier.mult} points`, tier.color);
            SFX.badge();
          }
          if (this.totalCorrect === 1 && this.tries === 0)
            RRPro.toast(this, "First try!", "Solved without a hint. Keep it going.");
          if (this.combo === 5 && this.tries === 0)
            RRPro.toast(this, "Five Alive", "5 first tries in a row.", 0xff8a4a);
          this.checkpointsHit++;
          SFX.correct();
          entry.rect.setFillStyle(0x1f9d55);
          this.answerBtns.forEach((b) => b.rect.disableInteractive());
          const msg =
            (this.tries === 0 ? `Correct! +${pts}. ` : `You got it! +${pts}. `) + q.explain;
          this.fbText.setColor("#7dffb0").setText(msg);
          document.dispatchEvent(
            new CustomEvent("flagship:answer", { detail: { correct: true, message: msg } }),
          );
          this.say(msg);
          this.confettiEmitter.emitParticleAt(entry.rect.x, entry.rect.y);
          if (this.combo === 3) SFX.streak3();
          else if (this.combo === 5) SFX.streak5();
          this.updateHUD();
          // Let the explanation be read, then drive one road segment.
          this.time.delayedCall(1600, () => {
            this.clearPanel();
            SFX.checkpoint();
            this.race.advance(this.tries, this.nitro);
            this.driveSegment(() => {
              this.locked = false;
              this.currentQ++;
              if (this.currentQ >= this.questions.length) this.finishTrip();
              else this.showCheckpointQuestion();
            });
          });
          return;
        }
        // Wrong try: eliminate the choice and coach. No penalty but fewer points.
        this.tries++;
        if (this.tries === 1) this.missed.push(JSON.parse(JSON.stringify(q)));
        this.totalWrong++;
        this.combo = 0;
        this.skillMiss[q.type] = (this.skillMiss[q.type] || 0) + 1;
        entry.eliminated = true;
        entry.rect.setFillStyle(0x5a2330).disableInteractive();
        this.nitro = false;
        if (!this.reducedMotion)
          this.tweens.add({
            targets: [entry.rect, entry.val],
            x: "+=6",
            duration: 50,
            yoyo: true,
            repeat: 3,
          });
        entry.val.setAlpha(0.45);
        SFX.wrong();
        const why = q.wrong[c] || "Not quite.";
        let msg;
        if (this.tries === 1) msg = `${why}  Hint: ${q.hint1}`;
        else if (this.tries === 2) msg = `${why}  Step: ${q.hint2}`;
        else msg = `${why}  Step: ${q.hint2} Missed questions can be replayed from the results screen.`;
        this.fbText.setColor("#ffd27a").setText(msg);
        document.dispatchEvent(
          new CustomEvent("flagship:answer", { detail: { correct: false, message: msg } }),
        );
        this.say(msg);
        this.updateHUD();
      };

      GameScene.prototype.finishTrip = function () {
        if (this.raceFinished) return;
        this.raceFinished = true;
        this.paused = false;
        this.clearPanel();
        this.updateHUD();
        SFX.win();
        this.time.delayedCall(this.reducedMotion ? 200 : 900, () => {
          this.scene.start("Results", {
            score: this.score,
            maxCombo: this.maxCombo,
            totalCorrect: this.totalCorrect,
            helped: this.helped,
            totalWrong: this.totalWrong,
            questions: this.totalCheckpoints,
            difficulty: this.difficulty,
            checkpointsHit: this.checkpointsHit,
            skillMiss: this.skillMiss,
            skillSeen: Object.keys(this.skillSeen).map(Number),
            coins: this.coins,
            position: this.race.snapshot().position,
            recovered: this.recovered,
            missed: this.missed,
          });
        });
      };

      // ── RESULTS ──
      function ResultScene() {
        Phaser.Scene.call(this, "Results");
      }
      ResultScene.prototype = Object.create(Phaser.Scene.prototype);
      ResultScene.prototype.constructor = ResultScene;
      ResultScene.prototype.init = function (data) {
        this.d = data;
      };
      ResultScene.prototype.create = function () {
        const cx = W / 2,
          d = this.d;
        const reduced = gfxReducedMotion();
        this.add.rectangle(cx, H / 2, W, H, 0x0a1628);
        const total = Math.max(1, d.questions || d.totalCorrect + d.helped);
        // Accuracy = checkpoints solved on the first try, without help.
        const pct = (d.totalCorrect / total) * 100;
        const solved = (d.totalCorrect || 0) + (d.helped || 0);
        const attempts = solved + (d.totalWrong || 0);
        const accuracy = attempts ? solved / attempts : 0;
        const stars =
          (solved >= 3 ? 1 : 0) +
          (d.maxCombo >= 3 || solved >= 8 ? 1 : 0) +
          (total >= 4 && accuracy >= 0.8 ? 1 : 0);

        try {
          window.EduPulse &&
            EduPulse.record({
              activityTitle: document.title,
              score: d.totalCorrect,
              maxScore: total,
              stars: stars,
              problemsCorrect: d.totalCorrect,
              problemsAttempted: total,
              percent: Math.round(pct),
            });
        } catch (e) {}

        let prevHigh = 0;
        try {
          prevHigh = parseInt(localStorage.getItem(LS_KEY) || "0", 10) || 0;
        } catch (e) {}
        const isNewHighScore = d.score > prevHigh;
        if (isNewHighScore) {
          try {
            localStorage.setItem(LS_KEY, String(d.score));
          } catch (e) {}
        }
        if (stars === 3) SFX.winElaborate();
        else SFX.win();

        if (!reduced) {
          const p = this.add.particles(0, 0, "confetti", {
            speed: { min: 60, max: 220 },
            scale: { start: 1.4, end: 0 },
            lifespan: 900,
            quantity: 30,
            emitting: false,
            tint: [0x00ccff, 0xff8800, 0x22cc66, 0xff4488, 0xffdd00],
            angle: { min: 0, max: 360 },
            gravityY: 150,
          });
          p.emitParticleAt(cx, 120);
        }

        this.add
          .text(cx, 34, "TRIP COMPLETE!", {
            fontSize: "40px",
            fontStyle: "bold",
            color: "#22cc66",
            stroke: "#000",
            strokeThickness: 4,
          })
          .setOrigin(0.5);
        this.add
          .text(cx, 72, `You reached all ${d.checkpointsHit} checkpoints.`, {
            fontSize: "18px",
            color: "#b8d4ee",
          })
          .setOrigin(0.5);
        for (let i = 0; i < 3; i++) {
          this.add.image(570 + i * 45, 116, i < stars ? "bigstar" : "emptystar").setScale(0.8);
        }
        if (isNewHighScore && d.score > 0) {
          SFX.newRecord();
          this.add
            .text(230, 110, "NEW PERSONAL BEST!", {
              fontSize: "20px",
              fontStyle: "bold",
              color: "#ffdd00",
            })
            .setOrigin(0.5);
        }

        const position = d.position || 1;
        const rank = RRPro.rank(pct, position);
        const res = RRPro.commit({
          total,
          totalCorrect: d.totalCorrect,
          maxCombo: d.maxCombo,
          helped: d.helped,
          position,
          recovered: d.recovered,
          skillSeen: d.skillSeen || [],
          coins: d.coins || 0,
        });
        const stats = [
          ["Score", String(d.score), "#7fe0ff"],
          ["First-try correct", `${d.totalCorrect} of ${total} (${Math.round(pct)}%)`, "#22cc66"],
          ["Solved with coaching", String(d.helped), "#ffb347"],
          ["Best streak", `x${d.maxCombo}`, "#ffdd00"],
          ["Coins earned", `${d.coins || 0}  (${res.totalCoins} saved)`, "#ffd23d"],
        ];
        stats.forEach((s, i) => {
          const y = 140 + i * 28;
          this.add.rectangle(230, y, 400, 25, 0x1a2a4a, 0.9);
          this.add.text(40, y, s[0], { fontSize: "15px", color: "#b8d4ee" }).setOrigin(0, 0.5);
          this.add
            .text(420, y, s[1], { fontSize: "16px", fontStyle: "bold", color: s[2] })
            .setOrigin(1, 0.5);
        });
        // Rank stamp + race finish
        const rankColor = { S: "#ffdd00", A: "#22cc66", B: "#4fb3ff", C: "#ffb347" }[rank];
        const stamp = this.add
          .text(615, 190, rank, {
            fontSize: "96px",
            fontStyle: "bold",
            color: rankColor,
            stroke: "#000",
            strokeThickness: 6,
          })
          .setOrigin(0.5);
        this.add
          .text(615, 246, `RANK ${rank}`, { fontSize: "14px", fontStyle: "bold", color: "#b8d4ee" })
          .setOrigin(0.5);
        this.add
          .text(615, 270, `Finished ${RRPro.ordinal(position)} in the race`, {
            fontSize: "16px",
            fontStyle: "bold",
            color: position === 1 ? "#ffdd00" : "#d6e6f5",
          })
          .setOrigin(0.5);
        if (!reduced) {
          stamp.setScale(3).setAlpha(0);
          this.tweens.add({
            targets: stamp,
            scale: 1,
            alpha: 1,
            duration: 350,
            delay: 400,
            ease: "Back.easeIn",
            onComplete: () => {
              SFX.stamp();
              this.cameras.main.shake(120, 0.004);
            },
          });
        }
        // Badges
        this.add.text(
          40,
          272,
          `BADGES  ${Object.keys(res.owned).length} of ${RRPro.BADGES.length}`,
          { fontSize: "13px", fontStyle: "bold", color: "#9fc3e6" },
        );
        RRPro.BADGES.forEach((b, i) => {
          const bx = 40 + (i % 3) * 245,
            by = 304 + Math.floor(i / 3) * 34;
          const isNew = res.fresh.includes(b),
            has = res.earned.includes(b) || res.owned[b.id];
          this.add
            .rectangle(bx + 115, by, 232, 28, isNew ? 0x3a3210 : 0x1a2a4a, 0.95)
            .setStrokeStyle(isNew ? 2 : 1, isNew ? 0xffdd00 : 0x35507a);
          this.add
            .text(bx + 8, by, `${has ? "★" : "☆"} ${b.name}${isNew ? "  NEW" : ""}`, {
              fontSize: "13px",
              fontStyle: "bold",
              color: has ? "#ffe9a0" : "#6f86a3",
            })
            .setOrigin(0, 0.5);
        });
        if (res.fresh.length) SFX.badge();
        const unlock = res.unlockedSkins.length
          ? `NEW CAR UNLOCKED: ${res.unlockedSkins.map((k) => k.name).join(", ")}! Pick it on the title screen.`
          : "";
        if (unlock)
          this.add
            .text(cx, 366, unlock, { fontSize: "15px", fontStyle: "bold", color: "#7dffb0" })
            .setOrigin(0.5);

        // Skills practiced + what to practice next
        const seen = (d.skillSeen || []).map((t) => SKILLS[t]).filter(Boolean);
        this.add
          .text(cx, 382, "Skills practiced: " + seen.join(" · "), {
            fontSize: "13px",
            color: "#d6e6f5",
            wordWrap: { width: 740 },
            align: "center",
          })
          .setOrigin(0.5, 0);
        const miss = d.skillMiss || {};
        const worst = Object.keys(miss).sort((a, b) => miss[b] - miss[a])[0];
        const next =
          worst != null
            ? `Practice next: ${SKILLS[worst]} (${miss[worst]} wrong ${miss[worst] === 1 ? "try" : "tries"}). Replay this track for new numbers.`
            : d.difficulty === "hard"
              ? "Practice next: you are ready for the Unit 3 project. Great work!"
              : "Practice next: try a harder track for new kinds of ratio problems.";
        this.add
          .text(cx, 432, next, {
            fontSize: "17px",
            fontStyle: "bold",
            color: "#ffd27a",
            wordWrap: { width: 680 },
            align: "center",
          })
          .setOrigin(0.5, 0);
        const summary = `Trip complete. Score ${d.score}. First-try correct ${d.totalCorrect} of ${total}. ${next}`;
        const rrSr = document.getElementById("rr-sr");
        if (rrSr) rrSr.textContent = summary;

        const btnY = 520;
        const mk = (x, label, fill, color, fn) => {
          const r = this.add
            .rectangle(x, btnY, 230, 52, fill)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(x, btnY, label, { fontSize: "18px", fontStyle: "bold", color })
            .setOrigin(0.5);
          r.on("pointerdown", fn);
          return r;
        };
        const again = () => this.scene.start("Game", { difficulty: d.difficulty });
        const menu = () => this.scene.start("DiffSelect");
        mk(cx - 125, "DRIVE AGAIN (Enter)", 0x00ccff, "#002244", again);
        mk(cx + 125, "CHOOSE TRACK (T)", 0x2a3a5a, "#d6e6f5", menu);
        if (d.missed && d.missed.length) {
          const practice = this.add
            .rectangle(cx, 572, 280, 36, 0xffaa00)
            .setInteractive({ useHandCursor: true });
          this.add
            .text(cx, 572, "PRACTICE THE MISSES", {
              fontSize: "16px",
              fontStyle: "bold",
              color: "#1a1206",
            })
            .setOrigin(0.5);
          practice.on("pointerdown", () =>
            this.scene.start("Game", { difficulty: d.difficulty, replay: d.missed }),
          );
        } else {
          this.add
            .text(cx, 566, "New numbers every trip.", { fontSize: "14px", color: "#9fb6cc" })
            .setOrigin(0.5);
        }
        this.input.keyboard.once("keydown-ENTER", again);
        this.input.keyboard.once("keydown-T", menu);
