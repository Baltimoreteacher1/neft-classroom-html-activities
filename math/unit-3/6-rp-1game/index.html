          cookAgain: { en: "COOK AGAIN (Enter)", es: "COCINAR OTRA VEZ (Enter)" },
          changeLevel: { en: "CHANGE LEVEL (L)", es: "CAMBIAR NIVEL (L)" },
          canvas: {
            en: "Ratio Kitchen: press 1 or 2 to add a scoop, Backspace to remove, Enter to serve, H for a hint. The order and feedback are read aloud.",
            es: "Cocina de razones: presiona 1 o 2 para agregar una cucharada, Retroceso para quitar, Enter para servir, H para una pista. El pedido y la retroalimentación se leen en voz alta.",
          },
        };
        const t = (key, ...args) => {
          const v = TX[key][lang()];
          return typeof v === "function" ? v(...args) : v;
        };
        // Keys pressed on a focused page control (mission panel, dialog, toolbar)
        // belong to that control, not to the kitchen underneath.
        const pageControlFocused = () => {
          const a = document.activeElement;
          return !!a && /^(BUTTON|INPUT|SELECT|TEXTAREA|SUMMARY|A)$/.test(a.tagName);
        };

        // ─── SOUND ENGINE ───
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let actx = null;
        function ensureAudio() {
          if (!actx && AudioCtx) actx = new AudioCtx();
          if (actx && actx.state === "suspended") actx.resume();
        }
        function beep(freq, dur, type = "sine", vol = 0.16) {
          if (window.__flagshipMuted) return;
          if (!actx) return;
          const o = actx.createOscillator(),
            g = actx.createGain();
          o.connect(g);
          g.connect(actx.destination);
          o.frequency.value = freq;
          o.type = type;
          g.gain.setValueAtTime(vol, actx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
          o.start();
          o.stop(actx.currentTime + dur);
        }
        const sfxScoop = () => beep(420 + Math.random() * 60, 0.07, "sine", 0.12);
        const sfxRemove = () => beep(240, 0.08, "sine", 0.1);
        const sfxServe = () => {
          beep(523, 0.08);
          setTimeout(() => beep(659, 0.08), 70);
          setTimeout(() => beep(880, 0.16), 150);
        };
        const sfxWrong = () => beep(170, 0.22, "square", 0.1);
        const sfxLevel = () =>
          [523, 659, 784, 1047].forEach((f, i) =>
            setTimeout(() => beep(f, 0.14), i * 90),
          );
        const sfxClick = () => beep(440, 0.05, "sine", 0.09);

        // ─── PALETTE ───
        const W = 1024,
          H = 768;
        const C = {
          bg: 0x14082a,
          panel: 0x2a1850,
          panelHi: 0x3a2270,
          gold: 0xf6c343,
          white: 0xffffff,
          dim: 0x9b86c9,
          green: 0x2ec26b,
          red: 0xe7556b,
          glass: 0x0d0420,
          stroke: 0x533a8f,
        };
        // Ingredients: colour + label + emoji. Colour is never the only cue —
        // every tube is labelled with the fruit name + emoji (colourblind-safe).
        // `name` follows the current language (the mission panel reads it too).
        const ingredient = (en, es, emoji, color, css) => ({
          en,
          es,
          emoji,
          color,
          css,
          get name() {
            return lang() === "es" ? this.es : this.en;
          },
        });
        const INGREDIENTS = [
          ingredient("Strawberry", "Fresa", "\u{1F353}", 0xf5476c, "#f5476c"),
          ingredient("Banana", "Plátano", "\u{1F34C}", 0xf1c40f, "#f1c40f"),
          ingredient("Blueberry", "Arándano", "\u{1FAD0}", 0x4a7cf0, "#4a7cf0"),
          ingredient("Lime", "Lima", "\u{1F33F}", 0x42c96a, "#42c96a"),
          ingredient("Mango", "Mango", "\u{1F96D}", 0xe6892b, "#e6892b"),
          ingredient("Grape", "Uva", "\u{1F347}", 0xa569d6, "#a569d6"),
        ];

        // ─── MATH HELPERS ───
        const gcd = (a, b) => (b ? gcd(b, a % b) : a);
        const rnd = (n) => Math.floor(Math.random() * n);
        const pick = (arr) => arr[rnd(arr.length)];
        function shuffle(arr) {
          const a = [...arr];
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        }
        // current counts [ca,cb] equivalent to target [a,b] via cross-multiply
        const crossMatch = (ca, cb, a, b) => ca > 0 && cb > 0 && ca * b === cb * a;

        // capacity ceiling for the visual tubes (keeps art clean)
        const TUBE_MAX = 12;

        // ─── ROUND GENERATOR ───
        // level 1 = support (small ratios, more help); level 2 = challenge.
        function makeRound(tier, index) {
          // two distinct ingredients
          const [ia, ib] = shuffle(INGREDIENTS).slice(0, 2);
          // base ratio in lowest terms
          const lowPairs = [
            [1, 2],
            [2, 3],
            [1, 3],
            [3, 4],
            [2, 5],
            [3, 5],
            [1, 4],
            [4, 5],
            [3, 2],
            [2, 1],
          ];
          let [a, b] = pick(lowPairs);
          const g = gcd(a, b);
          a /= g;
          b /= g; // ensure lowest terms
          let type;
          if (tier === 1) type = ["make", "missing", "table"][index % 3];
          else type = pick(["make", "batch", "missing", "table", "batch", "table"]);
          const r = {
            ia,
            ib,
            a,
            b,
            type,
            preseed: [0, 0],
            capacity: null,
            locked: false,
          };
          // largest scale factor whose solution still fits the visual tubes
          const maxK = Math.floor(TUBE_MAX / Math.max(a, b));
          if (
            (type === "batch" || type === "missing" || type === "table") &&
            maxK < 2
          )
            type = "make";
          r.type = type;
          if (type === "batch") {
            // scale the base ratio by k so total fills a fill-line (solution fits tubes)
            const sum = a + b;
            const k = 2 + rnd(Math.min(maxK, tier === 1 ? 3 : 4) - 1);
            r.capacity = sum * k; // exact total scoops needed
            r.need = [a * k, b * k];
          } else if (type === "missing") {
            // pre-pour ingredient A (locked); student completes B to keep ratio
            const k = 2 + rnd(Math.min(maxK, 3) - 1);
            r.preseed = [a * k, 0];
            r.locked = true;
            r.need = [a * k, b * k];
          } else if (type === "table") {
            // Ratio table (Lesson 3-3): 1 group, 2 groups, then the
            // target column with ONE entry given. The student pours that column.
            const k = 2 + rnd(Math.min(maxK, tier === 1 ? 3 : 5) - 1);
            r.capacity = (a + b) * k; // checked, but never shown as a fill line
            r.hideTotal = true;
            r.need = [a * k, b * k];
            r.given = rnd(2); // which row of the last column is printed
            r.columns = k === 2 ? [1, 2] : [1, 2, k];
          } else {
            // make: build any equivalent of a:b (smallest is a:b)
            r.need = [a, b];
          }
          return r;
        }

        // ════════════════════════════════════════════════════════════════
        //  TITLE SCENE — real choice: Level 1 (support) vs Level 2 (challenge)
        // ════════════════════════════════════════════════════════════════
        class TitleScene extends Phaser.Scene {

        // ════════════════════════════════════════════════════════════════
        //  GAME SCENE
        // ════════════════════════════════════════════════════════════════
        class GameScene extends Phaser.Scene {

            this.tubeLabel = this.tubeX.map((x) =>
              this.add

            this.dispenser = [];
            [0, 1].forEach((i) => {

            this.feedback = this.add
              .text(512, 640, "", {

            // Enter serves. If the shared "Launch mission" button still has
            // focus, Enter would relaunch and wipe the round — move focus to

              } else if (e.key === "Enter") this.serve();
              else if (e.key.toLowerCase() === "h") this.showHint();

          makeBtn(x, y, w, h, label, color, cb, fs = "18px", txtColor = 0xffffff) {
            const r = this.add
              .rectangle(x, y, w, h, color)
              .setStrokeStyle(2, 0x000000, 0.25)

            r.on("pointerout", () => r.setScale(1));

            r._t = label_;

            this.labelStatic();
            this.renderOrder();

            if (this.feedbackFn)
              this.flash(
                this.feedback,
                this.feedbackFn,
                this.feedbackColor,

              );

          loadRound() {
            this.roundLocked = false;
            this.round = makeRound(this.tier, this.roundIx);
            const r = this.round;
            this.counts = [r.preseed[0], r.preseed[1]];
            this.attempts = 0;
            this.lifeMisses = 0;
            this.hintTier = 0;
            this.typesSeen[r.type] = true;
            this.feedbackFn = null;
            this.feedback.setText("");

            // customer + order
            this.customer.setText(
              pick([
                "\u{1F466}",
                "\u{1F467}",
                "\u{1F469}",
                "\u{1F468}",
                "\u{1F475}",
                "\u{1F474}",
                "\u{1F9D1}",
                "\u{1F471}",
              ]),
            );
            this.orderRatio.setColor("#fff");
            this.renderOrder();

            // dispensers
            [0, 1].forEach((i) => {
              const d = this.dispenser[i];
              const locked = r.locked && i === 0;
              d.addBtn.setAlpha(locked ? 0.35 : 1).setData("locked", locked);
              d.remBtn.setAlpha(locked ? 0.35 : 1).setData("locked", locked);
              d.addBtn.fillColor = locked ? 0x3a2f50 : 0x2e7d46;
            });

            this.updateHUD();
            this.redrawTubes(true);
          }

          taskText() {
            const r = this.round;
            if (r.type === "make")
              return t("taskMake", r.a, r.ia.name, r.b, r.ib.name);
            if (r.type === "batch") return t("taskBatch", r.capacity, r.a, r.b);
            if (r.type === "missing")
              return t("taskMissing", r.preseed[0], r.ia.name, r.ib.name, r.a, r.b);
            return t("taskTable");
          }
          // The ratio table for "table" rounds; the target column hides one entry.
          tableRows() {
            const r = this.round;
            const cell = (row, k, last) => {
              if (last && row !== r.given) return "?";
              return String((row === 0 ? r.a : r.b) * k);
            };
            return [0, 1].map((row) =>
              r.columns
                .map((k, ci) =>
                  cell(row, k, ci === r.columns.length - 1).padStart(3, " "),
                )
                .join(" |"),
            );
          }
          renderOrder() {
            const r = this.round;
            this.orderRatio.setText(`${r.a} : ${r.b}`);
            if (r.type === "table") {
              const rows = this.tableRows();
              this.orderLegend
                .setFontFamily("Courier New, monospace")
                .setFontSize("22px")
                .setText(`${r.ia.emoji} ${rows[0]}\n${r.ib.emoji} ${rows[1]}`);
            } else {
              this.orderLegend
                .setFontFamily("Arial")
                .setFontSize("15px")
                .setText(
                  `${r.ia.emoji} ${r.ia.name}  ${r.a}\n${r.ib.emoji} ${r.ib.name}  ${r.b}`,
                );
            }
            const task = this.taskText();
            this.orderTask.setText(task);

            // Mirror the order into the hidden live region (assistive tech +
            // shared hint ladder). Additive: never touches gameplay/scoring.
            const rkSr = document.getElementById("rk-sr");
            if (rkSr) {
              let text = t(
                "srOrder",
                r.a,
                r.b,
                r.ia.name,
                r.ib.name,
                task.replace(/\n/g, " "),
              );
              if (r.type === "table") {
                const rows = this.tableRows();
                text += t(
                  "srTable",
                  `${r.ia.name}: ${rows[0].replace(/\s+/g, " ")}; ${r.ib.name}: ${rows[1].replace(/\s+/g, " ")}`,
                );
              }
              rkSr.textContent = text;
            }

            // fill-line note (hidden on table rounds: the table carries the target)
            this.fillNote.setText(
              r.capacity && !r.hideTotal ? t("fillLine", r.capacity) : "",
            );

            // dispensers
            [0, 1].forEach((i) => {
              const ing = i === 0 ? r.ia : r.ib;
              const d = this.dispenser[i];
              d.emoji.setText(ing.emoji);
              d.name.setText(ing.name);
            });
          }

          ingColor(i) {
            return (i === 0 ? this.round.ia : this.round.ib).color;
          }

          addScoop(i) {
            if (this.roundLocked || window.GameStudio?.paused) return;
            const r = this.round;
            if (r.locked && i === 0) {
              sfxWrong();
              this.flash(this.feedback, () => t("lockedIngredient"));
              return;
            }
            const total = this.counts[0] + this.counts[1];
            if (
              this.counts[i] >= TUBE_MAX ||
              (r.capacity && !r.hideTotal && total >= r.capacity + 2)
            ) {
              sfxWrong();
              this.flash(this.feedback, () =>
                r.capacity && !r.hideTotal ? t("overflowing") : t("tubeFull"),
              );
              return;
            }
            this.counts[i]++;
            sfxScoop();
            this.redrawTubes();
            this.checkOverfill();
          }
          removeScoop(i) {
            if (this.roundLocked || window.GameStudio?.paused) return;
            const r = this.round;
            if (r.locked && i === 0) {
              sfxWrong();
              return;
            }
            if (this.counts[i] <= (r.preseed[i] || 0)) {
              sfxWrong();
              return;
            }
            this.counts[i]--;
            sfxRemove();
            this.redrawTubes();
            this.feedbackFn = null;
            this.feedback.setText("");
          }
          clearTubes() {
            if (this.roundLocked || window.GameStudio?.paused) return;
            sfxClick();
            this.counts = [this.round.preseed[0], this.round.preseed[1]];
            this.feedbackFn = null;
            this.feedback.setText("");
            this.redrawTubes();
          }

          checkOverfill() {
            const r = this.round,
              total = this.counts[0] + this.counts[1];
            if (r.capacity && !r.hideTotal && total > r.capacity)
              this.flash(
                this.feedback,
                () => t("overLine", total, r.capacity),
                "#ffb4b4",
              );
          }

          redrawTubes(full) {
            const g = this.tubeGfx;
            g.clear();
            this.scoopLayer.removeAll(true);
            // draw glass shells
            this.tubeX.forEach((x) => {
              g.fillStyle(C.glass, 1);
              g.fillRoundedRect(
                x - this.tubeW / 2,
                this.tubeBottom - this.tubeMaxH,
                this.tubeW,
                this.tubeMaxH,
                8,
              );
              g.lineStyle(3, C.stroke, 1);
              g.strokeRoundedRect(
                x - this.tubeW / 2,
                this.tubeBottom - this.tubeMaxH,
                this.tubeW,
                this.tubeMaxH,
                8,
              );
            });
            // scoops
            [0, 1].forEach((i) => {
              const x = this.tubeX[i],
                color = this.ingColor(i);
              const preset = this.round.preseed[i] || 0;
              for (let s = 0; s < this.counts[i]; s++) {
                const y = this.tubeBottom - s * this.scoopH - this.scoopH / 2 - 3;
                const rect = this.add
                  .rectangle(x, y, this.tubeW - 12, this.scoopH - 4, color)
                  .setStrokeStyle(1, 0x000000, 0.28);
                if (s < preset) rect.setStrokeStyle(2, C.white, 0.5); // mark pre-poured (locked)
                this.scoopLayer.add(rect);
              }
            });
            // fill line
            this.fillLine.clear();
            if (this.round.capacity && !this.round.hideTotal) {
              // a "total scoops" gauge to the right of the tubes
              const need = this.round.capacity;
              const gx = 612,
                gTop = this.tubeBottom - this.tubeMaxH,
                gH = this.tubeMaxH;
              this.fillLine
                .fillStyle(C.glass, 1)
                .fillRoundedRect(gx, gTop, 26, gH, 6);
              this.fillLine
                .lineStyle(2, C.stroke, 1)
                .strokeRoundedRect(gx, gTop, 26, gH, 6);
              const total = this.counts[0] + this.counts[1];
              const fillH = Math.min(total / TUBE_MAX, 1) * gH;
              const ok = total === need;
              this.fillLine.fillStyle(
                ok ? C.green : total > need ? C.red : C.gold,
                0.9,
              );
              this.fillLine.fillRoundedRect(
                gx + 3,
                this.tubeBottom - fillH,
                20,
                fillH,
                4,
              );
              // target tick
              const ty = this.tubeBottom - Math.min(need / TUBE_MAX, 1) * gH;
              this.fillLine.lineStyle(3, C.white, 0.95).beginPath();
              this.fillLine.moveTo(gx - 4, ty);
              this.fillLine.lineTo(gx + 30, ty);
              this.fillLine.strokePath();
            }
            // labels
            this.tubeLabel[0].setText(`${this.round.ia.emoji}\n${this.counts[0]}`);
            this.tubeLabel[1].setText(`${this.round.ib.emoji}\n${this.counts[1]}`);
            const [ca, cb] = this.counts;
            this.liveRatio.setText(t("you", ca, cb));
            const match = crossMatch(ca, cb, this.round.a, this.round.b);
            this.liveRatio.setColor(match ? "#2ec26b" : "#9b86c9");
          }

          serve() {
            if (this.roundLocked || window.GameStudio?.paused) return;
            const r = this.round,
              [ca, cb] = this.counts;
            const total = ca + cb;
            const ratioOk = crossMatch(ca, cb, r.a, r.b);
            const capOk = !r.capacity || total === r.capacity;

            if (ratioOk && capOk) {
              this.onCorrect();
              return;
            }

            // ── diagnostic, non-giveaway failure ──
            sfxWrong();
            this.attempts++;
            this.streak = 0;
            this.missByType[r.type] = (this.missByType[r.type] || 0) + 1;
            const msg = () => {
              if (ca === 0 || cb === 0) return t("addBoth");
              if (!ratioOk && crossMatch(ca, cb, r.b, r.a))
                return t("switched", r.a, r.ia.name, r.b, r.ib.name);
              if (!ratioOk && ca - cb === r.a - r.b)
                return t("sameDiff", ca, cb, r.a, r.b);
              if (!ratioOk) return t("notEquivalent", ca, cb, r.a, r.b);
              if (r.type === "table") {
                const row = r.given;
                return t("tableColumn", r.need[row], (row === 0 ? r.ia : r.ib).name);
              }
              if (r.capacity && total < r.capacity)
                return t("reachLine", r.capacity, total);
              if (r.capacity && total > r.capacity)
                return t("overRight", total - r.capacity);
              return t("compare");
            };
            this.flash(
              this.feedback,
              () => "❌ " + msg() + t("hintReady"),
              "#ffb4b4",
              Infinity,
            );
            this.say(msg() + t("hintReadySay"));
            this.orderRatio.setColor("#ffd34d");

            // a wrong serve costs a life only after a nudge, so support tier stays gentle
            // (counted apart from `attempts`, which also gates first-try credit and hints)
            this.lifeMisses = (this.lifeMisses || 0) + 1;
            if (this.lifeMisses >= (this.tier === 1 ? 3 : 2)) {
              this.lives--;
              this.lifeMisses = 0;
              if (this.lives <= 0) {
                // No-fail: refill lives instead of closing the kitchen early.
                // The run always continues to its normal round count.
                this.lives = this.tier === 1 ? 5 : 3;
                this.time.delayedCall(1400, () => {
                  this.flash(this.feedback, () => t("refilled"), "#bff7cf");
                });
              }
            }
            this.updateHUD();
          }

          onCorrect() {
            if (this.roundLocked) return;
            this.roundLocked = true;
            sfxServe();
            this.correct++;
            window.FlagshipAdventure?.record({
              firstTry: this.attempts === 0 && this.hintTier === 0,
              kind: this.round.type,
            });
            this.served++;
            this.streak++;
            if (this.streak > this.bestStreak) this.bestStreak = this.streak;
            const combo = Math.min(4, 1 + Math.floor(this.streak / 3));
            const unaided = this.attempts === 0 && this.hintTier === 0;
            if (unaided) this.firstTry++;
            const firstTry = unaided ? 60 : 0;
            const k = this.counts[0] / this.round.a;
            const pts = (100 + firstTry + this.streak * 8) * combo;
            this.score += pts;
            this.orderRatio.setColor("#2ec26b");
            const [ca, cb] = this.counts,
              { a, b } = this.round;
            this.flash(
              this.feedback,
              () => t("servedOk", ca, cb, a, b, k, pts, combo),
              "#bff7cf",
            );
            this.say(t("servedSay", ca, cb, a, b, k, pts));
            this.popServe();

            if (this.correct % 4 === 0) {
              this.level++;
              sfxLevel();
            }
            this.updateHUD();

            const done = this.served >= (this.tier === 1 ? 10 : 12);
            this.time.delayedCall(1100, () => {
              if (done) this.endGame();
              else {
                this.roundIx++;
                this.loadRound();
              }
            });
          }

          popServe() {
            const calm = window.__flagshipReduced;
            if (calm) return;
            const cup = this.add
              .text(512, 560, "\u{1F379}", { fontSize: "54px" })
              .setOrigin(0.5);
            this.tweens.add({
              targets: cup,
              y: 168,
              x: 176,
              scale: 0.4,
              alpha: 0,
              duration: 850,
              ease: "Cubic.easeIn",
              onComplete: () => cup.destroy(),
            });
            for (let i = 0; i < 18; i++) {
              const p = this.add.circle(
                512,
                520,
                3 + Math.random() * 3,
                [C.gold, C.green, INGREDIENTS[0].color, INGREDIENTS[1].color][rnd(4)],
              );
              this.tweens.add({
                targets: p,
                x: 512 + (Math.random() - 0.5) * 320,
                y: 520 + (Math.random() - 0.5) * 220,
                alpha: 0,
                scale: 0,
                duration: 600 + Math.random() * 400,
                onComplete: () => p.destroy(),
              });
            }
          }

          hintText(tier) {
            const r = this.round,
              ia = r.ia.name,
              ib = r.ib.name;
            if (tier === 3) return t("h3", r.need[0], ia, r.need[1], ib);
            if (tier === 1) {
              if (r.type === "missing") return t("h1Missing", r.a, ia, r.b, ib);
              if (r.type === "batch") return t("h1Batch", r.a, r.b);
              if (r.type === "table") {
                const row = r.given;
                return t(
                  "h1Table",
                  r.need[row],
                  (row === 0 ? r.ia : r.ib).name,
                  row === 0 ? r.a : r.b,
                );
              }
              return t("h1Make", r.a, ia, r.b, ib);
            }
            const g = r.preseed[0] / r.a;
            if (r.type === "missing")
              return t("h2Missing", r.preseed[0], ia, r.a, g, r.b, ib);
            if (r.type === "batch")
              return t(
                "h2Batch",
                r.capacity,
                r.a + r.b,
                r.capacity / (r.a + r.b),
                r.a,
                ia,
                r.b,
                ib,
              );
            if (r.type === "table") {
              const row = r.given,
                base = row === 0 ? r.a : r.b,
                k = r.need[row] / base;
              return t(
                "h2Table",
                r.need[row],
                base,
                k,
                row === 0 ? r.b : r.a,
                (row === 0 ? r.ib : r.ia).name,
              );
            }
            return t("h2Make", r.a, ia, r.b, ib);
          }

          showHint() {
            if (this.roundLocked || window.GameStudio?.paused) return;
            sfxClick();
            // Help is earned: try a serve first. Tier 1 = method (no answer),
            // Tier 2 (after a second wrong serve, or a second tap) = a concrete step,
            // Tier 3 (only after two wrong serves and the step) = a worked example.
            if (this.attempts === 0) {
              this.flash(this.feedback, () => t("tryFirst"), "#ffe9a8", Infinity);
              this.say(t("tryFirst").replace("\u{1F4A1} ", ""));
              return;
            }
            const cap = this.attempts >= 2 ? 3 : 2;
            this.hintTier = Math.min(
              cap,
              Math.max(
                this.hintTier + 1,
                this.attempts >= 2 && this.hintTier < 2 ? 2 : 1,
              ),
            );
            const tier = this.hintTier;
            this.say(t("hintPrefix") + this.hintText(tier));
            this.flash(
              this.feedback,
              () => "\u{1F4A1} " + this.hintText(tier),
              "#ffe9a8",
              Infinity,
            );
          }

          // Mirror coaching to the screen-reader live region and to the
          // readable mission panel above the canvas (visible without scrolling).
          say(msg) {
            const plain = String(msg).replace(/^[\u{1F4A1}❌✅]\s*/u, "");
            this.feedbackText = plain;
            const rk = document.getElementById("rk-sr");
            if (rk) rk.textContent = plain;
            const fm = document.querySelector(".flagship-mission .fm-feedback");
            if (fm) fm.textContent = plain;
          }

          // msg may be a function that rebuilds the text in the current language.
          flash(obj, msg, color = "#ffffff", hold = 2400) {
            const text = typeof msg === "function" ? msg() : msg;
            if (obj === this.feedback) {
              this.feedbackFn =
                hold === Infinity && typeof msg === "function" ? msg : null;
              this.feedbackColor = color;
            }
            obj.setText(text).setColor(color).setAlpha(1);
            this.tweens.killTweensOf(obj);
            if (hold === Infinity) return; // stays until the next action
            this.tweens.add({
              targets: obj,
              alpha: 1,
              duration: 10,
              onComplete: () => {
                this.time.delayedCall(hold, () => {
                  if (obj.text === text)
                    this.tweens.add({
                      targets: obj,
                      alpha: 0.0,
                      duration: 400,
                    });
                });
              },
            });
          }

          updateHUD() {
            this.hScore.setText(this.score.toLocaleString());
            this.hLevel.setText(t("level", this.level));
            this.hServed.setText(t("served", this.served));
            this.hLives.setText("❤️".repeat(Math.max(0, this.lives)));
            this.hStreak.setText(this.streak >= 3 ? "\u{1F525} " + this.streak : "");
          }

          endGame() {
            this.cameras.main.fadeOut(450, 0, 0, 0);
            this.time.delayedCall(450, () =>
              this.scene.start("ResultScene", {
                tier: this.tier,
                score: this.score,
                correct: this.correct,
                served: this.served,
                bestStreak: this.bestStreak,
                level: this.level,
                firstTry: this.firstTry,
                missByType: this.missByType,
                typesSeen: Object.keys(this.typesSeen),
              }),
            );
          }
        }

        // ════════════════════════════════════════════════════════════════
        //  RESULT SCENE
        // ════════════════════════════════════════════════════════════════
        class ResultScene extends Phaser.Scene {
          constructor() {
            super("ResultScene");
          }
          init(d) {
            this.data_ = d;
            Object.assign(this, d);
          }
          create() {
            this.cameras.main.setBackgroundColor(C.bg);
            this.cameras.main.fadeIn(450);
            const goal = this.tier === 1 ? 10 : 12;
            // Accuracy = drinks served right on the first serve, without a hint.
            const firstTry = this.firstTry || 0;
            const pct = goal > 0 ? Math.round((firstTry / goal) * 100) : 0;
            let best = 0;
            try {
              best = Number(localStorage.getItem("ratio_kitchen_best")) || 0;
              if (this.score > best && !this.recorded)
                localStorage.setItem("ratio_kitchen_best", String(this.score));
            } catch (e) {}
            const newBest = this.score > best || this.wasNewBest;
            if (!this.recorded) {
              this.recorded = true;
              this.wasNewBest = newBest;
              try {
                window.EduPulse &&
                  EduPulse.record({
                    activityTitle: document.title,
                    score: this.correct,
                    maxScore: goal,
                    problemsCorrect: firstTry,
                    problemsAttempted: this.served,
                    standard: "6.AT.1",
                  });
              } catch (e) {}
            }

            const rankIndex = pct >= 90 ? 3 : pct >= 75 ? 2 : pct >= 50 ? 1 : 0;
            const emoji = ["\u{1F4DA}", "⭐", "\u{1F3C6}", "\u{1F451}"][rankIndex];
            const rank = TX.rank[lang()][rankIndex];

            this.add.text(W / 2, 80, emoji, { fontSize: "64px" }).setOrigin(0.5);
            this.add
              .text(W / 2, 150, t("closed"), {
                fontSize: "46px",
                fontFamily: "Arial Black",
                color: "#f6c343",
                stroke: "#000",
                strokeThickness: 4,
              })
              .setOrigin(0.5);
            this.add
              .text(W / 2, 198, rank, {
                fontSize: "24px",
                fontFamily: "Arial",
                fontStyle: "bold",
                color: "#fff",
              })
              .setOrigin(0.5);
            this.add
              .text(W / 2, 250, this.score.toLocaleString(), {
                fontSize: "58px",
                fontFamily: "Arial Black",
                color: "#f6c343",
              })
              .setOrigin(0.5);
            this.add
              .text(
                W / 2,
                290,
                newBest
                  ? t("newBest")
                  : t("personalBest", Math.max(best, this.score).toLocaleString()),
                {
                  fontSize: "16px",
                  color: "#c9b6ff",
                },
              )
              .setOrigin(0.5);

            const stats = [
              { l: t("drinksServed"), v: `${this.correct}/${goal}` },
              { l: t("firstTryNoHint"), v: `${firstTry} (${pct}%)` },
              { l: t("bestStreak"), v: this.bestStreak },
            ];
            stats.forEach((s, i) => {
              const x = 282 + i * 230,
                y = 370;
              this.add.rectangle(x, y, 210, 96, C.panel).setStrokeStyle(2, C.stroke);
              this.add
                .text(x, y - 12, String(s.v), {
                  fontSize: "30px",
                  fontFamily: "Arial Black",
                  color: "#f6c343",
                })
                .setOrigin(0.5);
              this.add
                .text(x, y + 26, s.l, { fontSize: "15px", color: "#c9b6ff" })
                .setOrigin(0.5);
            });

            // Skills practiced + what to practice next
            const SKILL = TX.skill[lang()];
            const seen = (this.typesSeen || []).map((k) => SKILL[k]).filter(Boolean);
            const miss = this.missByType || {};
            const worst = Object.keys(miss).sort((a, b) => miss[b] - miss[a])[0];
            const next = worst
              ? t("nextWorst", SKILL[worst], miss[worst])
              : this.tier === 1
                ? t("nextTier1")
                : t("nextTier2");
            this.add
              .text(W / 2, 448, t("skillsPracticed") + seen.join(" · "), {
                fontSize: "16px",
                color: "#e6dcff",
                align: "center",
                wordWrap: { width: 820 },
              })
              .setOrigin(0.5, 0);
            this.add
              .text(W / 2, 484, next, {
                fontSize: "17px",
                fontStyle: "bold",
                color: "#ffe9a8",
                align: "center",
                wordWrap: { width: 820 },
              })
              .setOrigin(0.5, 0);
            const rk = document.getElementById("rk-sr");
            if (rk) rk.textContent = t("resultsSr", this.score, firstTry, goal, next);

            const again = this.add
              .rectangle(W / 2 - 140, 580, 260, 58, C.gold)
              .setInteractive({ useHandCursor: true });
            this.add
              .text(W / 2 - 140, 580, t("cookAgain"), {
                fontSize: "17px",
                fontFamily: "Arial Black",
                color: "#1a0d35",
              })
              .setOrigin(0.5);
            const cookAgain = () => {
              ensureAudio();
              sfxClick();
              this.scene.start("GameScene", { tier: this.tier });
            };
            again.on("pointerdown", cookAgain);
            this.input.keyboard.on("keydown-ENTER", () => {
              if (!pageControlFocused()) cookAgain();
            });
            again.on("pointerover", () => again.setScale(1.05));
            again.on("pointerout", () => again.setScale(1));

            const menu = this.add
              .rectangle(W / 2 + 140, 580, 260, 58, C.panel)
              .setStrokeStyle(2, C.stroke)
              .setInteractive({ useHandCursor: true });
            this.add
              .text(W / 2 + 140, 580, t("changeLevel"), {
                fontSize: "17px",
                fontFamily: "Arial Black",
                color: "#fff",
              })
              .setOrigin(0.5);
            const changeLevel = () => {
              ensureAudio();
              sfxClick();
              this.scene.start("TitleScene");
            };
            menu.on("pointerdown", changeLevel);
            this.input.keyboard.on("keydown-L", () => {
              if (!pageControlFocused()) changeLevel();
            });
            menu.on("pointerover", () => menu.setScale(1.05));
            menu.on("pointerout", () => menu.setScale(1));

            const calm =
              window.__flagshipReduced ||
              (window.matchMedia &&
                window.matchMedia("(prefers-reduced-motion: reduce)").matches);
            for (let i = 0; i < (calm ? 0 : 28); i++) {
              const p = this.add
                .circle(
                  Math.random() * W,
                  Math.random() * H,
                  2 + Math.random() * 3,
                  [C.gold, INGREDIENTS[0].color, INGREDIENTS[1].color, C.green][
                    rnd(4)
                  ],
                )
                .setAlpha(0.7);
              this.tweens.add({
                targets: p,
                y: p.y - 200 - Math.random() * 300,
                alpha: 0,
                duration: 2000 + Math.random() * 2000,
                delay: Math.random() * 1000,
                repeat: 2,
                ease: "Power1",
              });
            }
            const relabel = () =>
              this.scene.restart({
                ...this.data_,
                recorded: true,
                wasNewBest: newBest,
              });
            document.addEventListener("ewl:lang", relabel);
            this.events.once("shutdown", () =>

          const title = rkGame.scene.getScene("TitleScene");
          if (title && title.sys.isActive()) title.scene.restart();
        });
      })();
