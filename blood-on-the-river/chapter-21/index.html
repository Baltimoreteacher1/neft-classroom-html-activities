renderChapter({"chapter":21,"heroCopy":"Explore Chapter 21 as Samuel meets the Great Powhatan, Smith warns that the coronation is a mistake, Newport forces the ceremony anyway, and a wedding briefly restores hope.","notice":"<strong>Chapter 21 focus:</strong> meeting Wahunsonacock, Powhatan’s claim to his land, Captain Smith’s anger, the forced coronation, Powhatan’s resistance, and Ann Laydon’s wedding.","heroArt":"native","heroArtLabel":"Powhatan refuses to lower himself for an English crown.","vocab":[["Wahunsonacock","The personal name of the Great Powhatan.","👑"],["regal","Looking royal, powerful, and dignified.","✨"],["emperor","A ruler over many peoples or lands.","🏛️"],["prince","A ruler below a king in English rank.","👑"],["coronation","A ceremony where someone receives a crown.","🎖️"],["subject","A person ruled by a king or government.","🙇"],["mantle","A cloak or special covering.","🧣"],["marionette","A puppet moved by strings.","🪆"]],"snapshot":[["Setting","Werowocomoco, the village of the Great Powhatan, and then James Town after Newport attempts to carry out the Virginia Company’s orders."],["Main conflict","The English try to fit Powhatan into English hierarchy, but Powhatan understands himself as a ruler of his own land and people."],["Character focus","Samuel now understands enough to recognize the arrogance and danger of the English plan. Smith sees the disaster coming."],["Chapter job","Chapter 21 dramatizes cultural misunderstanding through the coronation and shows how a public ceremony can deepen political conflict."]],"scenes":[{"n":"01","page":"Ch. 21 opening","title":"Samuel sees the Great Powhatan","quote":"“tall and imposing”","kind":"native","label":"Samuel meets Wahunsonacock for the first time.","summary":"Samuel sees Wahunsonacock, the Great Powhatan, and is struck by his powerful, regal presence, copper necklace, and strings of beads.","details":["Samuel sees Powhatan as wealthy and powerful.","Copper and beads signal status in Powhatan society.","The scene corrects any idea that Powhatan is a lesser ruler."],"explain":"This quote matters because Samuel’s first impression confirms that Powhatan is a true ruler, not someone waiting to be made important by the English.","check":["Who does Samuel meet?","What makes Powhatan look powerful?"]},{"n":"02","page":"Ch. 21 opening","title":"Smith delivers the message","quote":"“Will the great chief come”","kind":"leaders","label":"Smith carries Newport’s insulting invitation.","summary":"Captain Smith asks whether Powhatan will come to James Town to receive King James’s gifts. Samuel immediately sees that asking an emperor to come receive gifts is wrong.","details":["Smith is forced to deliver a bad message.","Samuel understands the insult.","The English invitation ignores Powhatan’s status."],"explain":"This quote matters because the mistake begins before the crown appears. The English expect Powhatan to come to them.","check":["What does Smith ask Powhatan to do?","Why is the request insulting?"]},{"n":"03","page":"Ch. 21 opening","title":"Powhatan claims his land","quote":"“I also am a king”","kind":"power","label":"Powhatan asserts his own sovereignty.","summary":"Powhatan responds angrily that he is also a king and that the land is his. He says Captain Newport must come to him instead.","details":["Powhatan rejects English superiority.","He makes a land claim with his words and gesture.","This response shows political clarity and dignity."],"explain":"This quote matters because it states the chapter’s central conflict: two rulers and two political worlds collide.","check":["What does Powhatan say he also is?","Whose land does he say it is?"]},{"n":"04","page":"Ch. 21 middle","title":"Smith is furious on the path home","quote":"“They know nothing”","kind":"conflict","label":"Smith blames distant investors for dangerous ignorance.","summary":"On the way back to James Town, Captain Smith shouts that the Virginia Company investors do not understand the reality in Virginia and will get everyone killed.","details":["Smith’s anger comes from practical knowledge.","He understands Powhatan power better than Newport does.","The soldiers stay quiet because Smith is so angry."],"explain":"This quote matters because Smith sees that decisions made far away can create danger for people on the ground.","check":["Who does Smith blame?","Why is he angry?"]},{"n":"05","page":"Ch. 21 middle","title":"Making an emperor a prince","quote":"“making an emperor into a prince”","kind":"power","label":"Smith names the absurdity of the plan.","summary":"Smith explains that crowning Powhatan as a prince under King James is insulting because Powhatan is already an emperor in his own world.","details":["The English rank system does not fit Powhatan politics.","Smith predicts trouble.","Samuel understands the plan is a mistake."],"explain":"This quote matters because it clearly explains the diplomatic insult. The ceremony lowers Powhatan rather than honoring him.","check":["What does Smith call Powhatan?","Why is making him a prince insulting?"]},{"n":"06","page":"Ch. 21 middle","title":"Newport obeys anyway","quote":"“still determined”","kind":"ship","label":"Newport follows the Company’s orders despite the warning.","summary":"Back in James Town, Newport decides to follow the Virginia Company’s orders anyway and take the gifts and crown to Werowocomoco.","details":["Newport values obedience to the Company.","Smith’s warning is ignored.","The gifts must travel a long route by water."],"explain":"This quote matters because bad decisions continue even after people understand the danger.","check":["Who ignores Smith’s warning?","Where will the gifts be taken?"]},{"n":"07","page":"Ch. 21 middle","title":"Powhatan refuses to kneel","quote":"“would not kneel”","kind":"native","label":"Powhatan refuses the posture of submission.","summary":"At the ceremony, Powhatan pretends not to understand the request to kneel. Newport demonstrates kneeling again and again, but Powhatan refuses.","details":["Kneeling would symbolize submission.","Powhatan preserves his dignity.","People begin to snicker at Newport’s repeated demonstrations."],"explain":"This quote matters because Powhatan understands perfectly what kneeling means. His refusal is political resistance.","check":["What does Newport want Powhatan to do?","Does Powhatan do it willingly?"]},{"n":"08","page":"Ch. 21 ending","title":"The forced crown","quote":"“push down hard”","kind":"power","label":"The English force the coronation moment.","summary":"Newport orders soldiers to push Powhatan’s shoulders down just enough to place the crown on his head. Muskets fire to celebrate, but the moment is deeply wrong.","details":["The ceremony becomes force instead of honor.","The English declare him a subject of King James.","Powhatan’s response through gifts suggests contempt."],"explain":"This quote matters because the coronation is not a true agreement. It is a forced performance that creates resentment.","check":["How do they get the crown on Powhatan?","Is the ceremony respectful?"]},{"n":"09","page":"Ch. 21 ending","title":"A wedding after the mistake","quote":"“a wedding”","kind":"camp","label":"Ann and John Laydon marry after the political mistake.","summary":"After the coronation mistake, the chapter shifts to Ann and John Laydon’s wedding, giving the settlement a brief moment of celebration and human hope.","details":["The wedding contrasts with the failed coronation.","Ann and John represent ordinary life and commitment.","The colony holds joy and danger at the same time."],"explain":"This quote matters because the wedding reminds readers that life continues even amid political mistakes and danger.","check":["Who gets married?","How does the wedding feel different from the coronation?"]}],"structure":["Samuel meets Wahunsonacock, the Great Powhatan.","Smith delivers Newport’s invitation.","Powhatan says he is also a king and the land is his.","Smith angrily warns that the Virginia Company understands nothing.","Newport still follows orders to crown Powhatan.","Powhatan refuses to kneel.","Soldiers force the crown onto him.","Powhatan gives a return gift that suggests insult.","Ann and John Laydon’s wedding brings a brief moment of hope."],"quick":{"question":"Why is the coronation in Chapter 21 such a mistake?","choices":["Powhatan is already a powerful ruler and does not accept being made a subject under King James.","Powhatan wants to move to England.","Newport forgets to bring any gifts.","Samuel refuses to translate."],"correct":0,"feedback":"Correct — the coronation insults Powhatan by trying to make him lower than King James."},"ican":["I can summarize the main events of Chapter 21.","I can explain why Powhatan refuses to kneel.","I can describe why Smith thinks the coronation is dangerous.","I can compare the forced coronation with Ann and John’s wedding."]});
