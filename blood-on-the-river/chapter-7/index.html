renderChapter({"chapter":7,"heroCopy":"Explore Chapter 7 as the gallows wait for Captain Smith, Reverend Hunt saves him, and the voyage leaves Nevis with a new warning about pride, survival, and ignorance.","notice":"<strong>Chapter 7 focus:</strong> gallows, Reverend Hunt’s sermon, Captain Smith’s captivity story, Smith’s release, leaving Nevis, the deadly Mona hunting trip, and fear-fed dreams.","heroArt":"trial","heroArtLabel":"The gallows are built, but Smith survives.","vocab":[["gallows","A wooden frame used for hanging someone.","⚖️"],["sermon","A religious speech or lesson.","⛪"],["repent","To admit wrong and try to change.","🙏"],["Ottoman Empire","A powerful empire Smith fought against as a soldier.","🗺️"],["auction","A sale where people bid money for something.","🏷️"],["translator","A person who helps people understand another language.","💬"],["Mona","An island where the fleet stops for water and hunting.","🏝️"],["ignorant","Not knowing important information.","❓"]],"snapshot":[["Setting","Nevis and Mona during the final part of the Caribbean stop before the fleet sails toward Virginia."],["Main conflict","Captain Smith is nearly executed, but Reverend Hunt persuades the leaders that Smith is too valuable to kill."],["Character focus","Samuel admires Smith’s courage and learns that strength can come from survival, self-control, and usefulness."],["Chapter job","Chapter 7 saves Smith from hanging and shows that ignorance in the New World can be deadly."]],"scenes":[{"n":"01","page":"PDF p. 46","title":"The gallows are ready","quote":"“the gallows sits ready”","kind":"trial","label":"The gallows wait for Captain Smith.","summary":"The next morning is clear and warm, but Captain Smith is back in chains and the gallows are prepared for him.","details":["The danger from Chapter 4 has not disappeared.","The warm day contrasts with the threat of death.","Samuel understands that Smith may be killed."],"explain":"This quote matters because it turns the accusation against Smith into a visible death threat. The gallows make the conflict real.","check":["What is ready for Captain Smith?","Is Smith free at the start of the chapter?"]},{"n":"02","page":"PDF p. 46","title":"Reverend Hunt uses the sermon","quote":"“to tell a lie is a sin”","kind":"paper","label":"Reverend Hunt challenges the men through faith.","summary":"Reverend Hunt preaches for hours and focuses on lying, repentance, and hell. Samuel notices that Wingfield squirms while Ratcliffe stays stiff.","details":["Hunt cannot command the leaders, but he can shame them morally.","The sermon is aimed at the men who accused Smith.","Samuel hopes the sermon can save Smith."],"explain":"This quote matters because Reverend Hunt is using his only real power: moral persuasion. He tries to make the accusers face the seriousness of lying.","check":["What sin does Hunt focus on?","Who seems uncomfortable?"]},{"n":"03","page":"PDF p. 46","title":"Smith tells his captivity story","quote":"“I’ve been a prisoner before.”","kind":"leaders","label":"Smith has survived captivity before.","summary":"Smith tells the boys that he was once captured while fighting the Ottoman Empire, enslaved, shaved, and sold like a beast.","details":["Smith’s past helps explain why he is calm now.","The boys learn that Smith has faced worse danger before.","Samuel begins to see Smith as a survivor."],"explain":"This quote matters because Smith’s courage has a history. He is not pretending to be fearless; he has survived captivity before.","check":["What does Smith say he has been before?","Why does this story impress Samuel?"]},{"n":"04","page":"PDF p. 47","title":"Smith escapes slavery","quote":"“rode off on his horse”","kind":"conflict","label":"Smith tells how he escaped slavery.","summary":"Smith describes killing his cruel master, taking his clothes and horse, and escaping to freedom.","details":["The story is violent but shows Smith’s refusal to stay trapped.","Samuel admires Smith’s courage and independence.","Smith’s story deepens Samuel’s respect for commoners who defy rank."],"explain":"This quote matters because it shows why Samuel sees Smith as powerful. Smith’s life story challenges the idea that gentlemen are naturally superior.","check":["How does Smith escape?","Why does Samuel admire him?"]},{"n":"05","page":"PDF p. 47","title":"Reverend Hunt frees Smith","quote":"“without you as translator”","kind":"paper","label":"Hunt convinces them Smith is needed.","summary":"Reverend Hunt unlocks Smith and explains that the expedition will perish in Virginia without Smith as a translator.","details":["Hunt saves Smith through practical argument.","Smith’s knowledge makes him too valuable to kill.","Survival begins to matter more than pride."],"explain":"This quote matters because Smith is saved not by innocence but by usefulness. The colony needs his knowledge to survive.","check":["Why does Hunt say Smith is needed?","What role can Smith play in Virginia?"]},{"n":"06","page":"PDF p. 47","title":"A favor: act respectful","quote":"“act as though you have proper respect”","kind":"leaders","label":"Hunt asks Smith to control his pride.","summary":"Reverend Hunt asks Smith to show outward respect to the gentlemen so they will not choose pride over survival again.","details":["Hunt knows Smith is stubborn.","He also knows the gentlemen are proud and dangerous.","The chapter connects self-control to survival."],"explain":"This quote matters because Hunt understands social power. Smith may be right, but if he insults powerful men, they may destroy him and endanger everyone.","check":["What favor does Hunt ask?","Why is respect important here?"]},{"n":"07","page":"PDF p. 47","title":"The gallows become firewood","quote":"“thrown on the fire”","kind":"camp","label":"The gallows are destroyed and used for supper.","summary":"The gallows are cut up and burned, roasting fish instead of hanging Smith.","details":["The image turns death into survival.","Smith is safe for now.","The chapter gives brief relief after danger."],"explain":"This quote matters because it symbolically reverses the threat. The wood meant for execution becomes wood for food.","check":["What happens to the gallows?","What do they use the fire for?"]},{"n":"08","page":"PDF p. 48","title":"Leaving Nevis and stopping at Mona","quote":"“it is time to leave”","kind":"sea","label":"The fleet leaves the island abundance.","summary":"After six days on Nevis, the men are cleaner and better fed. They pack fruit, water, meat, fish, and supplies, then stop at Mona.","details":["Nevis helped the men recover.","The fleet continues toward Virginia.","Mona becomes another lesson in danger."],"explain":"This quote matters because comfort is temporary. The voyage keeps moving, and each stop brings new risks.","check":["What island are they leaving?","What supplies do they pack?"]},{"n":"09","page":"PDF p. 48","title":"Edward Brookes dies from heat","quote":"“exhausted and faint”","kind":"trial","label":"Ignorance in the tropics becomes deadly.","summary":"A hunting party returns with animals and the dead gentleman Edward Brookes. Smith privately criticizes gentlemen who ignored the heat and did not carry enough water.","details":["The death is caused by ignorance, not battle.","Class status does not protect men from the environment.","Samuel dreams fearfully about Brookes after he is buried."],"explain":"This quote matters because it shows that survival requires adaptation. Acting like English gentlemen in tropical heat can be fatal.","check":["Who dies on Mona?","What mistake did the hunting party make?"]}],"structure":["Smith begins the chapter in chains with the gallows ready.","Reverend Hunt uses a sermon to confront lying.","Smith tells the boys about being captured and escaping slavery.","Hunt convinces the leaders to free Smith because they need him as translator.","The gallows are burned for cooking.","The fleet leaves Nevis and stops at Mona.","Edward Brookes dies after a foolish hunting trip in the tropical heat."],"quick":{"question":"What saves Captain Smith from hanging in Chapter 7?","choices":["He escapes during the night.","Reverend Hunt convinces the leaders Smith is needed as translator.","Wingfield apologizes and confesses.","Samuel cuts the chains himself."],"correct":1,"feedback":"Correct — Hunt convinces the leaders that Smith is too useful as translator to hang."},"ican":["I can summarize the main events of Chapter 7.","I can explain how Reverend Hunt saves Captain Smith.","I can describe why Smith’s past matters to Samuel.","I can explain how ignorance becomes dangerous on Mona."]});
