<script>
renderChapter({"chapter":1,"heroCopy":"In the dark streets of London, Samuel takes back his mother's locket from a pawnshop — and is captured. Chapter 1 sets up his poverty, his anger, and the danger he is in.","notice":"<strong>Before you read:</strong> notice how the locket stands for Samuel's mother and his past. Watch how poverty and the city shape the choices he makes.","heroArt":"street","heroArtLabel":"London, 1607","vocab":[["prophecy","A message or warning about what may happen in the future.","📜"],["pawnshop","A shop where people sell or leave items in exchange for money.","🏪"],["locket","A small necklace case that can hold something special inside.","◉"],["cobblestones","Small stones used to make old streets or paths.","▦"],["docks","The place by the water where ships stop, load, and unload.","⛵"],["poorhouse","A place where very poor people had to live and work.","⌂"],["nailery","A workshop where people make nails, often with hard labor.","🔨"],["magistrate","A local judge or official who can decide punishment.","⚖"]],"snapshot":[["Setting","London, England — dark streets, the docks, and London Bridge, 1607."],["Who","Samuel Collier, the pawnshop keeper and his son, and a magistrate."],["Key event","Samuel steals back his mother's locket and is captured."],["Symbol","The locket — memory, grief, and Samuel's lost family."]],"scenes":[{"n":"01","page":"PDF p. 15","title":"Prophecy and historical warning","quote":"“there will come a tribe from the bay of the Chesapeake”","kind":"prophecy","summary":"The novel opens with a prophecy delivered to Chief Powhatan. Before Samuel appears, readers learn that future contact between the Powhatan and an incoming group will lead to repeated conflict and devastating bloodshed.","details":["This framing device widens the scope of the story beyond one boy in London.","It signals that Jamestown will not be a simple adventure story.","It prepares students to track both personal conflict and historical conflict."],"explain":"This quote matters because it introduces the long historical arc of the novel. Chapter 1 is not only about Samuel stealing a locket; it is also the beginning of a much larger story involving colonization, conflict, and survival.","check":["What warning does the prophecy give?","Who might be affected by this warning?"],"label":"Prophecy and historical warning"},{"n":"02","page":"PDF p. 15","title":"Samuel runs to the pawnshop","quote":"“My feet slap, bare and cold, on the cobblestones.”","kind":"street","summary":"Samuel is running barefoot through London at night toward the pawnshop marked by three gold balls. He breaks the padlock with a rock and slips inside.","details":["The opening shows immediate urgency, danger, and poverty.","Samuel is active from the first page; the chapter begins in motion.","The bare feet and darkness show how hard his life is before the theft even happens."],"explain":"This quote matters because it gives readers a physical sense of Samuel’s situation. He is cold, poor, and desperate. The chapter wants us to understand his world before we judge his decision.","check":["Where is Samuel running?","What detail shows that Samuel is poor or uncomfortable?"],"label":"Samuel runs to the pawnshop"},{"n":"03","page":"PDF p. 15","title":"Samuel sees his mother’s locket","quote":"“There is the locket, displayed on a piece of beaver felt.”","kind":"locket","summary":"Samuel spots the silver locket in the pawnshop. He has not touched it since the day his mother died, and he believes it should have been his.","details":["The locket is the key symbol of the chapter.","It connects Samuel to his mother, grief, memory, and anger.","This scene explains why the object matters emotionally, not just materially."],"explain":"This quote matters because it turns the locket into more than a piece of property. For Samuel, it is a reminder of his mother and the life he lost. That emotional meaning drives the chapter’s conflict.","check":["What object does Samuel see?","Why is the locket important to him?"],"label":"Samuel sees his mother’s locket"},{"n":"04","page":"PDF p. 16","title":"The wire cuts his hand","quote":"“The wire slices my hand.”","kind":"wire","summary":"When Samuel hears footsteps, he panics and yanks too hard. The wire cuts his hand, but he manages to tear the locket free and escape the shopkeeper’s first grab.","details":["This is the chapter’s key cause-and-effect moment.","The theft leaves a physical mark, which intensifies the sense of danger.","The scene shows how emotion pushes Samuel to act without thinking."],"explain":"This quote matters because it makes the action suddenly physical and painful. Samuel’s choice has an immediate cost. The chapter moves from emotional desire to real danger in just a few seconds.","check":["What hurts Samuel’s hand?","Does Samuel stop or keep going?"],"label":"The wire cuts his hand"},{"n":"05","page":"PDF p. 16","title":"The docks and Samuel’s self-justification","quote":"“I have not stolen anything, only taken back what is mine.”","kind":"docks","summary":"Samuel walks the foggy docks and tries to calm down. He listens to sailors, hides in the dark, and tells himself that he did not steal—he reclaimed what belonged to his mother.","details":["This scene reveals Samuel’s motive in his own words.","The ships at the docks quietly foreshadow the larger journey ahead.","The foggy setting creates a temporary feeling of escape, but not safety."],"explain":"This quote matters because it reveals Samuel’s thinking. He does not see himself as a thief. Whether readers agree or not, understanding his reasoning is essential to understanding his character.","check":["Where does Samuel go after leaving the shop?","Does Samuel think he stole the locket? Yes or no?"],"label":"The docks and Samuel’s self-justification"},{"n":"06","page":"PDF p. 16","title":"Poorhouse backstory and hunger","quote":"“Can I help it if I’m always hungry?”","kind":"poorhouse","summary":"Samuel remembers the poorhouse, constant hunger, beatings in the nailery, the loss of the cottage, and his mother’s punishing labor. The chapter explains that his anger has deep roots.","details":["This backstory gives essential context for Samuel’s behavior.","His mother’s suffering and death are tied to poverty and hard labor.","The memory section turns Samuel into a layered character rather than a simple troublemaker."],"explain":"This quote matters because it captures the relentless hunger and unfairness that shaped Samuel. It helps readers see that his anger comes from long-term hardship, not from selfishness alone.","check":["What does Samuel remember about the poorhouse?","How does hunger help explain Samuel’s anger?"],"label":"Poorhouse backstory and hunger"},{"n":"07","page":"PDF p. 17","title":"Hiding place near London Bridge","quote":"“I find my favorite hollow near the London Bridge.”","kind":"bridge","summary":"Samuel reaches his sleeping spot near London Bridge, where a severed traitor’s head is displayed on a pole. He curls up with the locket hidden under his shirt, hoping to keep it for just one night.","details":["Even Samuel’s shelter is surrounded by violence and danger.","The severed head sharpens the chapter’s mood and raises the stakes.","The locket against his chest emphasizes how personal and intimate the object is."],"explain":"This quote matters because it shows how little security Samuel has. His favorite place is still cold, exposed, and frightening. The setting keeps reminding readers that his world is harsh.","check":["Where does Samuel try to sleep?","Is this place safe or unsafe?"],"label":"Hiding place near London Bridge"},{"n":"08","page":"PDF p. 17","title":"The shopkeeper and son capture him","quote":"“It’s mine,” I cry. “Mine!”","kind":"capture","summary":"Samuel is kicked awake, grabbed by the shopkeeper and his son, and overpowered. The shopkeeper pulls the locket from under Samuel’s shirt while Samuel insists it belongs to him.","details":["This is the moment when Samuel loses control completely.","The adults do not listen to his claim; they treat him only as a criminal.","The ropes and rough handling show how powerless he is in this world."],"explain":"This quote matters because it captures Samuel’s desperation and emotional attachment. He is not just protesting the capture; he is defending the one object that connects him to his mother.","check":["Who captures Samuel?","What does Samuel say about the locket?"],"label":"The shopkeeper and son capture him"},{"n":"09","page":"PDF pp. 17–18","title":"Threat of hanging and blackout ending","quote":"“The sooner he’s hanged the better.”","kind":"threat","summary":"As the men tie Samuel’s arms, they talk about delivering him to the magistrate and hanging him. Samuel strikes back, the son hits him, and the chapter ends with Samuel collapsing into blackness.","details":["The ending is abrupt and unresolved, which propels the reader into Chapter 2.","The threat of hanging shows how severe the consequences could be for a poor boy.","The blackout ending leaves Samuel physically and emotionally overwhelmed."],"explain":"This quote matters because it reveals the full danger hanging over Samuel. The threat is not minor punishment. The chapter ends by making readers fear what will happen to him next.","check":["What punishment do the men talk about?","How does Chapter 1 end?"],"label":"Threat of hanging and blackout ending"}],"structure":["The prophecy opens with a historical warning.","Samuel breaks into the pawnshop and takes the locket.","The docks and poorhouse memories deepen character understanding.","London Bridge becomes temporary shelter.","Capture, threat, and blackout end the chapter in crisis."],"quick":{"question":"What best explains why the locket matters so much to Samuel?","choices":["It is valuable money that he wants to sell.","It belonged to his mother and symbolizes memory, grief, and identity.","It proves he wants to become a sailor.","It belongs to the shopkeeper’s family."],"correct":1,"feedback":"correct"},"ican":["I can summarize the main events of Chapter 1.","I can explain why the locket is important to Samuel.","I can describe how poverty and setting shape Samuel’s decisions.","I can use a quote to explain a character or theme."]});
