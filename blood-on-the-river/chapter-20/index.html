renderChapter({"chapter":20,"heroCopy":"Explore Chapter 20 as Newport returns with new colonists, new profit schemes, and dangerous orders to crown Chief Powhatan under King James.","notice":"<strong>Chapter 20 focus:</strong> Newport’s return, failed gold hopes, new tradesmen and profit plans, Namontack’s report about King James, and the shocking order to crown Chief Powhatan.","heroArt":"ship","heroArtLabel":"Newport returns with supplies, orders, and dangerous misunderstandings.","vocab":[["glasshouse","A workshop with a furnace where glass is made.","🏭"],["pitch","Sticky material from trees used to seal ships.","🛢️"],["tar","Dark sticky material used to waterproof ships and ropes.","⚫"],["soap-ashes","Ashes used in making soap and other products.","🧼"],["tradesmen","Skilled workers trained in a craft or trade.","🛠️"],["subject","A person under the rule of a king or government.","👑"],["coronation","A ceremony where someone is crowned.","👑"],["distasteful","Unpleasant or offensive.","😬"]],"snapshot":[["Setting","James Town after Captain Newport returns from England with more colonists, stores, tradesmen, and new orders from the Virginia Company."],["Main conflict","The Virginia Company keeps misunderstanding reality in Virginia, especially by ordering the English to crown Chief Powhatan as a prince under King James."],["Character focus","Samuel understands more than many adults because he listens to Namontack and sees the conflict from both English and Powhatan perspectives."],["Chapter job","Chapter 20 sets up a major diplomatic mistake: the English plan to impose English hierarchy on a powerful Powhatan ruler."]],"scenes":[{"n":"01","page":"Ch. 20 opening","title":"Namontack’s English improves","quote":"“speaking English so well”","kind":"native","label":"Namontack returns with new language skills.","summary":"Namontack’s return shows that he has learned English well during his trip. Reverend Hunt is pleased, but the language exchange leads to deeper cultural questions.","details":["Language helps people communicate across cultures.","Namontack is not only a visitor; he becomes a bridge between worlds.","The chapter begins with learning, not fighting."],"explain":"This quote matters because language gives Namontack power to explain what he saw and what he believes.","check":["What language has Namontack learned better?","Why does this matter?"]},{"n":"02","page":"Ch. 20 early","title":"Newport brings more colonists","quote":"“seventy new colonists”","kind":"ship","label":"Newport arrives with more people.","summary":"Captain Newport returns with about seventy new colonists, stores, and fresh expectations from England.","details":["More people may help the colony.","More people also create more mouths to feed.","The colony is still not stable enough for careless growth."],"explain":"This quote matters because help from England is complicated. New arrivals bring hope and pressure at the same time.","check":["Who returns with new colonists?","Why can more people be a problem?"]},{"n":"03","page":"Ch. 20 early","title":"The rocks are just rocks","quote":"“just rocks”","kind":"paper","label":"The gold dream fails again.","summary":"Newport reports that the rocks sent back to England were not gold. The colony’s earlier treasure hopes were mistaken again.","details":["The Virginia Company wants profit.","The colonists have wasted effort on false wealth.","Smith’s practical warnings look wiser."],"explain":"This quote matters because it exposes the danger of wishful thinking. Gold dreams have distracted the colony from survival.","check":["What did the rocks turn out to be?","Why is that disappointing?"]},{"n":"04","page":"Ch. 20 middle","title":"A new profit plan","quote":"“glass, pitch, tar, and soap-ashes”","kind":"work","label":"The Company tries new ways to make money.","summary":"The Virginia Company now wants the colony to use raw materials to make products like glass, pitch, tar, and soap-ashes to send to England.","details":["Profit pressure continues even after the gold failure.","New tradesmen are sent to begin these projects.","The colony is still expected to serve investors."],"explain":"This quote matters because the colony’s purpose remains economic. Survival needs are still tangled with investor demands.","check":["Name one product the Company wants made.","Who is sent to help make them?"]},{"n":"05","page":"Ch. 20 middle","title":"The glasshouse begins","quote":"“a large furnace”","kind":"work","label":"Tradesmen build a glasshouse near the fort.","summary":"Polish and German tradesmen begin building a glasshouse with a large furnace near James Town.","details":["The colony is becoming more industrial.","Skilled workers matter in a survival colony.","The glasshouse shows English plans for production."],"explain":"This quote matters because the Company is trying to turn Virginia’s resources into profit, not simply keep settlers alive.","check":["What building is started?","What is inside it?"]},{"n":"06","page":"Ch. 20 middle","title":"A crown for Powhatan","quote":"“place an English crown”","kind":"power","label":"The Company orders Powhatan to be crowned.","summary":"Newport brings orders to place an English crown on Chief Powhatan’s head, making him a prince under King James and making his people English subjects.","details":["The order shows deep misunderstanding.","The English think in terms of kings, princes, and subjects.","Samuel immediately senses the idea is wrong."],"explain":"This quote matters because it creates the chapter’s main conflict. The English are trying to force their political system onto Powhatan.","check":["Who is supposed to be crowned?","Under which king?"]},{"n":"07","page":"Ch. 20 middle","title":"Samuel’s mind reels","quote":"“tangles my brain in knots”","kind":"paper","label":"Samuel sees the contradiction.","summary":"Samuel realizes the idea makes no sense: Chief Powhatan thinks the English are his subjects, while the English want Powhatan to become King James’s subject.","details":["Samuel can see both perspectives.","The adults’ plan is politically dangerous.","This shows Samuel’s growing cultural understanding."],"explain":"This quote matters because Samuel understands the conflict better than many leaders. He sees the contradiction at the center of the plan.","check":["What confuses Samuel?","Why is the plan dangerous?"]},{"n":"08","page":"Ch. 20 ending","title":"Namontack compares kings","quote":"“Our Chief Powhatan is much better”","kind":"native","label":"Namontack compares Powhatan and King James.","summary":"Speaking Algonquian, Namontack says Powhatan is stronger, cleaner, and more honorable than King James, whom he saw in England.","details":["Namontack does not automatically respect English power.","His comparison would offend the English gentlemen.","Samuel understands why Powhatan people might reject English rule."],"explain":"This quote matters because it reverses English assumptions of superiority. To Namontack, Powhatan is the true great ruler.","check":["Who does Namontack think is better?","Why does he say this quietly?"]},{"n":"09","page":"Ch. 20 ending","title":"A chance to meet Powhatan","quote":"“first chance to meet”","kind":"native","label":"Samuel prepares to meet the Great Powhatan.","summary":"Captain Smith prepares to take Samuel, Namontack, and three other men overland to Werowocomoco to meet Chief Powhatan.","details":["Samuel is moving closer to Powhatan political power.","His language skills and relationships matter.","The chapter ends by setting up the meeting in Chapter 21."],"explain":"This quote matters because Samuel is about to see the Powhatan leader for himself, not just hear English opinions.","check":["Where are they going?","Who will Samuel meet?"]}],"structure":["Namontack returns speaking stronger English.","Newport returns with seventy colonists and stores.","The rocks sent to England are not gold.","The Company pushes new profit plans: glass, pitch, tar, and soap-ashes.","Polish and German tradesmen begin a glasshouse.","The Company orders Chief Powhatan to be crowned under King James.","Samuel sees the political contradiction.","Namontack compares Powhatan and King James.","Smith prepares to take Samuel to meet the Great Powhatan."],"quick":{"question":"What dangerous mistake does the Virginia Company make in Chapter 20?","choices":["It asks Smith to stop learning languages.","It orders the English to crown Chief Powhatan as a prince under King James.","It tells everyone to leave James Town.","It sends no new settlers."],"correct":1,"feedback":"Correct — the Company misunderstands Powhatan power by ordering a coronation under King James."},"ican":["I can summarize the main events of Chapter 20.","I can explain why the gold failure matters.","I can describe the Company’s new profit plans.","I can explain why crowning Powhatan is politically dangerous."]});
