renderChapter({"chapter":2,"heroCopy":"Samuel is spared from hanging and sent to the ships. He meets kind Reverend Hunt and tough Captain John Smith, and joins the voyage to Virginia.","notice":"<strong>Before you read:</strong> watch the new adults in Samuel's life. Reverend Hunt shows mercy and Captain Smith shows strength — both will shape who Samuel becomes.","heroArt":"ship","heroArtLabel":"The voyage to Virginia begins","vocab":[["orphanage","A place where children without parents live.","🏠"],["gallows","A wooden structure used for hanging people as punishment.","⚠"],["reverend","A religious leader or minister.","✝"],["charter","Official permission from a king or government.","📜"],["Virginia Company","The English company sending men to Virginia.","🏛"],["page","A young servant who helps and learns from an important person.","🧭"],["gentleman","A high-status man from the upper class.","🎩"],["commoner","A person who is not part of the upper class or nobility.","👞"]],"snapshot":[["Setting","A London jail and the docks, then aboard ship, 1607."],["Who","Samuel, Reverend Robert Hunt, Captain John Smith, and the gentlemen."],["Key event","Samuel is spared and becomes part of the Virginia expedition."],["Theme","A second chance — kindness and discipline begin to change Samuel."]],"scenes":[{"n":"01","page":"PDF p. 19","title":"Lucky or doomed?","quote":"“Some would say I am lucky. Others would say I’m doomed.”","kind":"jail","summary":"Chapter 2 opens after Samuel survives the threat of hanging. He has been in jail for two days, and the magistrate decides to send him to Reverend Hunt instead of the gallows.","details":["The chapter begins with mixed emotions: escape and danger at the same time.","Samuel is not free in a simple way; his life is being redirected by adults.","This opening connects Chapter 1’s crisis to a new path."],"explain":"This quote matters because it captures Samuel’s uncertain future. He escaped death, but he is being pushed toward a journey that may be just as dangerous.","check":["Why might Samuel feel lucky?","Why might he also feel doomed?"],"label":"Lucky or doomed?"},{"n":"02","page":"PDF p. 19","title":"Reverend Hunt takes Samuel in","quote":"“His name’s Samuel Collier, age eleven…”","kind":"orphanage","summary":"The magistrate brings Samuel to Reverend Hunt at the orphanage. Reverend Hunt accepts him and gives him a bed among the other boys.","details":["Samuel is officially identified as an eleven-year-old orphan.","The orphanage is safer than the streets, but it is not emotionally easy for him.","Reverend Hunt becomes a major moral guide for Samuel."],"explain":"This quote matters because Samuel is reduced to a short description by the magistrate. Readers see how little power Samuel has over how adults define him.","check":["Where does the magistrate take Samuel?","Who agrees to take him in?"],"label":"Reverend Hunt takes Samuel in"},{"n":"03","page":"PDF p. 19","title":"Love, anger, and right choices","quote":"“You need to make decisions based on love, not on anger.”","kind":"hunt","summary":"Reverend Hunt tells Samuel that stealing the locket was wrong because it no longer belonged to him. Samuel argues that he acted from love, but he slowly recognizes that anger was driving him.","details":["This scene directly names one of the chapter’s central themes.","Reverend Hunt challenges Samuel to think about motive, not only action.","Samuel begins to understand that grief and anger are mixed together inside him."],"explain":"This quote matters because it gives Samuel a moral lesson he will struggle with throughout the novel: anger can feel powerful, but it does not always lead to right choices.","check":["What does Reverend Hunt want Samuel to choose from: love or anger?","Why did Samuel really steal the locket?"],"label":"Love, anger, and right choices"},{"n":"04","page":"PDF p. 20","title":"Trouble at the orphanage","quote":"“The boys started calling me ‘thief’ and ‘jail rat.’”","kind":"fight","summary":"Although the orphanage is better than the streets, Samuel gets into fights when the other boys insult him. He breaks Collin’s nose and knocks out Richard’s loose tooth.","details":["Samuel still uses fighting as his main way to solve problems.","The scene shows how quickly shame and anger turn into violence for him.","Richard is introduced as someone who will matter later."],"explain":"This quote matters because it shows why Samuel struggles at the orphanage. He is wounded by insults and responds the only way he knows: with his fists.","check":["What names do the boys call Samuel?","How does Samuel respond?"],"label":"Trouble at the orphanage"},{"n":"05","page":"PDF p. 20","title":"Chosen for the New World","quote":"“Richard and I are the two boys Reverend Hunt decided to bring…”","kind":"journey","summary":"Reverend Hunt chooses Richard and Samuel to join the Virginia journey. Richard will serve Reverend Hunt, and Samuel will serve Captain John Smith.","details":["Samuel’s punishment becomes a life-changing journey.","The New World is presented as both mission and danger.","Samuel is assigned to Captain John Smith before he has even met him."],"explain":"This quote matters because it explains the chapter’s biggest plot shift. Samuel is no longer only an orphan in London; he is being pulled into the Jamestown expedition.","check":["Who are the two boys chosen for the journey?","Who will Samuel serve?"],"label":"Chosen for the New World"},{"n":"06","page":"PDF p. 20","title":"Foggy walk to the docks","quote":"“My new shoes clomp on the cobblestones.”","kind":"docks","summary":"Samuel, Richard, and Reverend Hunt walk from the orphanage to the docks in cold fog. Samuel’s borrowed shoes are too big, but Reverend Hunt insists he cannot go barefoot in the New World.","details":["The shoes show Samuel has moved out of street life, but he still does not fully fit his new role.","The fog creates uncertainty around the coming journey.","The Virginia Company mission is introduced as a serious English venture."],"explain":"This quote matters because the shoes symbolize Samuel’s awkward transition. He has been given help, but he is not yet comfortable in this new life.","check":["Where are they walking?","Why does Samuel have shoes now?"],"label":"Foggy walk to the docks"},{"n":"07","page":"PDF p. 21","title":"The three ships","quote":"“the Susan Constant… the Godspeed… the Discovery”","kind":"ships","summary":"At the harbor, Samuel sees the three ships that will carry the expedition: the Susan Constant, the Godspeed, and the Discovery. The docks are full of noise, loading, people, animals, and supplies.","details":["The three ships become key setting details for the journey.","The busy harbor shows the size and seriousness of the expedition.","Samuel notices class differences among gentlemen, sailors, servants, and workers."],"explain":"This quote matters because it names the vessels that will carry Samuel away from England. The chapter turns from personal trouble to historical voyage.","check":["What are the three ships called?","What is happening at the harbor?"],"label":"The three ships"},{"n":"08","page":"PDF p. 22","title":"Captain John Smith appears","quote":"“We’ll take that energy you’ve got for fighting…”","kind":"smith","summary":"Captain John Smith studies Samuel and sees his fighting energy. Instead of simply condemning him, Smith suggests that Samuel’s energy can be put to useful work.","details":["Smith immediately recognizes something useful in Samuel.","Samuel responds with suspicion and defiance.","This scene begins the complicated Samuel-Smith relationship."],"explain":"This quote matters because Captain Smith sees Samuel differently from others. Samuel’s anger is a problem, but Smith also sees potential in him.","check":["Who is Samuel assigned to serve?","What does Captain Smith notice about Samuel?"],"label":"Captain John Smith appears"},{"n":"09","page":"PDF pp. 22–23","title":"Gentlemen, captains, and hierarchy","quote":"“Do not forget who he is.”","kind":"gentlemen","summary":"Reverend Hunt points out important leaders: Wingfield, Gosnold, Ratcliffe, and Newport. Samuel learns that rank, class, and respect will matter on the voyage.","details":["The chapter introduces several important expedition leaders.","Reverend Hunt warns Samuel and Richard to show respect to high-ranking men.","The chapter ends with distance between Samuel and Richard: Samuel still insists he does not need a friend."],"explain":"This quote matters because it shows the strict social hierarchy Samuel is entering. The voyage will not only be about survival; it will also be about power, rank, and class.","check":["Why does Reverend Hunt point out the leaders?","Does Samuel want a friend at the end?"],"label":"Gentlemen, captains, and hierarchy"}],"structure":["Samuel escapes hanging and is taken to the orphanage.","Reverend Hunt teaches him about love, anger, and right choices.","Samuel’s fighting gets him chosen for the Virginia journey.","The chapter introduces the ships, Captain Smith, and the gentlemen.","Samuel ends still guarded, insisting he does not need a friend."],"quick":{"question":"What is the biggest change in Samuel’s life during Chapter 2?","choices":["He gets his locket back safely.","He moves from jail and orphanage toward the New World expedition.","He becomes a ship captain.","He decides he is ready to be friends with Richard."],"correct":1,"feedback":"correct"},"ican":["I can summarize the main events of Chapter 2.","I can explain Reverend Hunt’s lesson about love and anger.","I can identify the three ships and key expedition leaders.","I can explain how Chapter 2 sets up the journey to the New World."]});
</script>
