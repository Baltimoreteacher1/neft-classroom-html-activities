renderChapter({"chapter":14,"heroCopy":"Explore Chapter 14 as James Town grows healthier, houses replace tents, Smith leads by example, and his disappearance on the Chickahominy creates fear.","notice":"<strong>Chapter 14 focus:</strong> health returning, Native trade, building warm houses, teamwork, the search for a passage to the Orient, friendship with Richard, and worry when Captain Smith disappears.","heroArt":"fort","heroArtLabel":"James Town begins building houses and fragile stability.","vocab":[["harvest","Crops gathered from fields or gardens.","🌾"],["thatch","Bundles of reeds or straw used for a roof.","🏠"],["wattle and daub","Walls made from woven sticks covered with clay and straw.","🧱"],["clapboard","Wood split into long boards for building.","🪵"],["Orient","Old European term for East Asia, especially China and India.","🧭"],["Chickahominy River","A river Smith explores while searching for a route west.","🌊"],["hominy","A porridge-like food made from ground corn.","🥣"],["hoar frost","White frost that coats branches and grass.","❄️"]],"snapshot":[["Setting","James Town in autumn and early winter, after the worst sickness has passed and the settlers begin building more permanent homes."],["Main conflict","The colony is healthier but still fragile; once Smith leaves to explore, work habits weaken and fear returns when he does not come back."],["Character focus","Samuel and Richard now act like real friends, while Samuel depends deeply on Captain Smith for safety and stability."],["Chapter job","Chapter 14 shows what effective leadership and teamwork can build, then removes Smith to reveal how fragile the colony still is."]],"scenes":[{"n":"01","page":"PDF p. 88","title":"Health returns","quote":"“we are healthy again”","kind":"camp","label":"The colony begins to recover after sickness.","summary":"Newport does not return in October, but the colonists are healthier. Some Native groups trade food, the river water improves, and birds become easier to hunt.","details":["The chapter opens with relief after months of sickness.","Native trade helps keep the English alive.","The environment is still hard, but survival now seems possible."],"explain":"This quote matters because it shows a major change in mood. James Town has not become easy, but it is no longer only death and hunger.","check":["Has Newport returned yet?","Are the colonists healthier?"]},{"n":"02","page":"PDF p. 88","title":"Smith leads trading and building","quote":"“in charge of trading”","kind":"trade","label":"Smith becomes central to survival.","summary":"Captain Smith is put in charge of trading with Native villages and organizing houses for everyone as winter approaches.","details":["Smith’s practical skills keep the colony supplied.","Trading brings corn and meat when food runs low.","Building houses becomes urgent because tents are rotting."],"explain":"This quote matters because Smith’s leadership connects diplomacy, labor, and survival. He helps the colony stand on more than one leg.","check":["What is Smith in charge of?","Why do they need houses?"]},{"n":"03","page":"PDF p. 88–89","title":"Everyone builds together","quote":"“Captain Smith always working the hardest”","kind":"work","label":"Smith works beside the men.","summary":"The settlers cut trees, split clapboard, gather thatch, frame houses, and build walls from wattle and daub. Smith works hardest of all.","details":["Smith leads by example, not only orders.","Some gentlemen work until their hands become rough.","Samuel feels proud of the work he helps create."],"explain":"This quote matters because it shows the leadership style that works in James Town: shared labor, practical goals, and visible effort.","check":["What are the settlers building?","Who works the hardest?"]},{"n":"04","page":"PDF p. 89","title":"Warm houses replace tents","quote":"“warm, dry houses”","kind":"fort","label":"The settlers build better shelter for winter.","summary":"By cold weather, the settlers have houses for everyone, even the servants. Samuel feels proud that his work helped make shelter.","details":["The colony becomes more permanent.","Servants also receive shelter, which matters to Samuel.","Teamwork makes something no one could build alone."],"explain":"This quote matters because shelter marks progress. James Town is slowly becoming a settlement rather than a desperate camp.","check":["What replaces the rotting tents?","Who gets houses?"]},{"n":"05","page":"PDF p. 89","title":"Searching for the passage","quote":"“the passage to the Pacific”","kind":"river","label":"Smith leaves to explore the Chickahominy.","summary":"Smith chooses nine men and sails up the Chickahominy River, hoping it might lead toward the Pacific Ocean and the riches of the Orient.","details":["The search reflects the Virginia Company’s economic goals.","The men still hope geography will bring profit.","Smith’s absence creates problems at the fort."],"explain":"This quote matters because the colony is not only about survival. Investors want a route to Asian trade, and that goal drives dangerous exploration.","check":["What river does Smith explore?","What route is he hoping to find?"]},{"n":"06","page":"PDF p. 89–90","title":"Work weakens without Smith","quote":"“the gentlemen stop working”","kind":"leaders","label":"Discipline weakens when Smith leaves.","summary":"Once Smith is gone, many gentlemen and even common men shirk their chores. Servants like Samuel and Richard keep cooking, hauling water, and chopping wood.","details":["Smith’s leadership had been holding the community together.","Class divisions return quickly.","The servants carry more than their share."],"explain":"This quote matters because it reveals how fragile the colony’s teamwork is. Without strong leadership, old habits return.","check":["What happens after Smith leaves?","Who keeps doing the work?"]},{"n":"07","page":"PDF p. 90","title":"Fire and friendship","quote":"“they’d freeze if they didn’t have us”","kind":"camp","label":"Samuel and Richard keep the fire alive.","summary":"Samuel and Richard tend the morning fire while others come to borrow embers because they let their own fires go out overnight.","details":["The boys now work as partners.","Samuel recognizes their importance.","Small daily tasks are survival tasks."],"explain":"This quote matters because Samuel and Richard are not powerless. Their steady work keeps others warm and fed.","check":["What do people come to borrow?","Who keeps the fire going?"]},{"n":"08","page":"PDF p. 91","title":"Smith does not return","quote":"“He did not return.”","kind":"river","label":"Smith disappears on the Chickahominy.","summary":"The exploring men return without Smith. They report that the river became too narrow, Smith went ahead with two men, and then did not come back.","details":["The colony loses its strongest practical leader.","Samuel fears Smith may be dead.","The report includes capture and violence."],"explain":"This quote matters because Smith’s disappearance threatens both Samuel personally and the colony politically.","check":["Who does not return?","How does Samuel feel?"]},{"n":"09","page":"PDF pp. 91–93","title":"Richard comforts Samuel","quote":"“Maybe he will still come back”","kind":"paper","label":"Richard shows friendship when Samuel is afraid.","summary":"Samuel leaves the fort worried about Smith. Richard brings him hominy, sits beside him, and later plays stone-skipping with him.","details":["Richard acts like a true friend.","Samuel accepts care instead of pushing him away.","The chapter ends with another crisis: the food stores disappear and the gentlemen are gone."],"explain":"This quote matters because Samuel has changed. He now has someone who notices his worry and brings him food.","check":["Who brings Samuel food?","What is missing at the end of the chapter?"]}],"structure":["The colony grows healthier after sickness.","Native trade and better water help survival.","Smith leads trading and building work.","The settlers build warm houses.","Smith leaves to explore the Chickahominy River.","Work weakens when Smith is away.","Samuel and Richard keep the fire and chores going.","Smith does not return from exploration.","Richard comforts Samuel, but food and gentlemen disappear."],"quick":{"question":"What does Chapter 14 show about Captain Smith’s leadership?","choices":["The colony works better when Smith leads by example.","The colony does better when Smith leaves.","Smith wants everyone to stop building houses.","Smith refuses to trade with Native villages."],"correct":0,"feedback":"Correct — Chapter 14 shows that the colony works better when Smith leads by example."},"ican":["I can summarize the main events of Chapter 14.","I can explain how Smith leads through work.","I can describe how houses show progress in James Town.","I can explain why Smith’s disappearance worries Samuel."]});
