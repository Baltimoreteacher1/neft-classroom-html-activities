renderChapter({"chapter":3,"heroCopy":"Life below deck is crowded, dark, and miserable. Seasickness, fear, and mistrust lead to conflict as the ships push across the ocean.","notice":"<strong>Before you read:</strong> picture the tight, smelly 'tween deck. Notice how hard conditions make people argue — and how Samuel reacts to the other boys.","heroArt":"ship","heroArtLabel":"Below deck on the crossing","vocab":[["’tween deck","The middle level of a ship, below the top deck; dark, crowded, and uncomfortable.","🛳️"],["seasick","Feeling sick because the ship rocks and moves on the water.","🤢"],["slop bucket","A bucket used as a toilet on the ship.","🪣"],["contract","A signed promise or agreement, such as the seven-year Virginia Company contract.","📜"],["gentleman","A high-status man who thinks he is above common workers.","🎩"],["commoner","A person who is not part of the upper class or nobility.","👞"],["partition","A cloth or wall used to separate spaces for privacy.","▥"],["discontent","A strong unhappy feeling that can grow into anger or rebellion.","⚡"]],"snapshot":[["Setting","The crowded 'tween deck of the ship at sea."],["Who","Samuel, the other boys (Richard and James), Captain Smith, and Wingfield."],["Key event","Seasickness and mistrust spark conflict among the passengers."],["Theme","Survival in close quarters tests everyone's patience."]],"scenes":[{"n":"01","page":"Ch. 3 opening","title":"Anchored in the Downs","quote":"“the winds continued contrary”","kind":"storm","summary":"Chapter 3 begins with the fleet unable to leave England because of storms and wrong winds. The epigraph sets up the frustration before Samuel even describes the ship.","details":["The voyage begins with delay, not adventure.","The men are close enough to England to imagine turning back.","This creates the pressure that will build throughout the chapter."],"explain":"This quote matters because it explains why the men are trapped. The problem is not only discomfort; the voyage feels stalled before it has really begun.","check":["Why can’t the fleet sail forward?","How might being stuck make people feel?"],"label":"Anchored in the Downs"},{"n":"02","page":"Ch. 3 opening","title":"Samuel wakes in the dark lower deck","quote":"“I rub my eyes and blink”","kind":"deck","summary":"Samuel wakes in the dim ’tween deck. He knows it is morning only because of a little light and the noise of chickens below. The space feels close, crowded, and uncomfortable.","details":["The chapter begins from Samuel’s body and senses.","The lower deck feels more like a cellar than an adventure.","Students should notice the cramped setting right away."],"explain":"This quote matters because it places readers directly inside Samuel’s tired, uncomfortable point of view. The ship is not romantic or exciting here; it is dark and confining.","check":["Where does Samuel wake up?","What makes the space feel uncomfortable?"],"label":"Samuel wakes in the dark lower deck"},{"n":"03","page":"Ch. 3 opening","title":"The crowded ’tween deck","quote":"“one long room”","kind":"crowded","summary":"Samuel explains how barrels, crates, card games, partitions, animals, and supplies fill the ’tween deck. The gentlemen try to claim privacy, but the cramped conditions make everyone share the same miserable space.","details":["The setting reveals class conflict: gentlemen expect comfort even on a crowded ship.","The animals sometimes get better treatment than passengers.","Crowding makes boredom and anger worse."],"explain":"This quote matters because the ship becomes a social pressure cooker. Everyone is trapped together, and the small space makes every disagreement harder to avoid.","check":["What fills the ’tween deck?","Why does crowding cause conflict?"],"label":"The crowded ’tween deck"},{"n":"04","page":"Ch. 3 middle","title":"Seasick, bored, and going nowhere","quote":"“We are all seasick. And bored.”","kind":"sick","summary":"Samuel describes the worst part of the delay: everyone is sick, bored, cold, and stuck near England. The smells of the lower deck make the conditions even harder to bear.","details":["This is the chapter’s main mood: misery plus waiting.","The men are not yet surviving Virginia; they are struggling to survive the ship.","Students should connect physical discomfort to rising anger."],"explain":"This quote matters because it summarizes the emotional condition of the ship. Seasickness and boredom are not small details; they help explain why the men are ready to explode.","check":["How do the men feel on the ship?","Why are they so frustrated?"],"label":"Seasick, bored, and going nowhere"},{"n":"05","page":"Ch. 3 middle","title":"James, Richard, and Samuel share a bed","quote":"“all three of us boys”","kind":"boys","summary":"Samuel explains that he, Richard, and nine-year-old James are crowded into the same straw-and-canvas bed. James serves George Percy, Richard serves Reverend Hunt, and Samuel keeps his distance from both boys.","details":["This scene introduces the boy servants as a small group inside the larger ship community.","James is frightened and younger; Richard is quieter and steadier.","Samuel notices friendship between James and Richard but refuses to join it."],"explain":"This quote matters because it shows that Samuel is physically close to James and Richard but emotionally separate. He shares space, not trust.","check":["Which boys share the sleeping space?","Does Samuel treat them like friends yet?"],"label":"James, Richard, and Samuel share a bed"},{"n":"06","page":"Ch. 3 middle","title":"Samuel’s rule: trust no one","quote":"“Trust no one.”","kind":"trust","summary":"Samuel explains that he has kept away from everyone on the Susan Constant. His past in the poorhouse, the streets, and the orphanage taught him that trusting people is dangerous.","details":["This is one of Samuel’s most important character beliefs.","The rule protects him, but it also isolates him.","The chapter invites students to watch whether this rule changes later."],"explain":"This quote matters because it names Samuel’s survival strategy. He thinks mistrust keeps him safe, but the story will challenge whether he can survive alone.","check":["What is Samuel’s rule?","Why might he have learned this rule?"],"label":"Samuel’s rule: trust no one"},{"n":"07","page":"Ch. 3 middle","title":"Captain Smith has not beaten him","quote":"“you never can tell”","kind":"smith","summary":"Samuel says Captain Smith has not beaten him yet and does not seem inclined to, but Samuel still refuses to trust him fully. His duties are simple: bring wash water and empty slop buckets.","details":["Smith is not cruel to Samuel here, but Samuel remains suspicious.","Samuel’s expectation of violence shows how harsh his past has been.","The ship leaves him with too much empty time and not enough healthy purpose."],"explain":"This quote matters because Samuel cannot relax even when Smith has not harmed him. His fear is learned from past adults, not from Smith’s actions so far.","check":["What jobs does Samuel do for Smith?","Does Samuel fully trust Smith?"],"label":"Captain Smith has not beaten him"},{"n":"08","page":"Ch. 3 ending","title":"Wingfield wants to turn back","quote":"“I have had enough.”","kind":"wingfield","summary":"Master Wingfield complains that the food is monotonous, the commoners stink, and the storms will not stop. He wants the men to sail back to London.","details":["Wingfield represents the gentlemen’s frustration and class pride.","His complaint shows contempt for commoners as well as discomfort.","This moment turns private misery into open rebellion."],"explain":"This quote matters because Wingfield’s frustration becomes a public challenge. Once he speaks, the conflict between quitting and continuing cannot stay hidden.","check":["What does Wingfield want to do?","What reasons does he give?"],"label":"Wingfield wants to turn back"},{"n":"09","page":"Ch. 3 ending","title":"Smith challenges the gentlemen","quote":"“Are you all cowards?”","kind":"fight","summary":"Captain Smith stands against Wingfield and the gentlemen, reminding them that they signed contracts with the Virginia Company. Reverend Hunt steps in before the conflict becomes a fight.","details":["Smith challenges both their courage and their honesty.","Wingfield is furious because Smith is a commoner challenging gentlemen.","Reverend Hunt creates a fragile peace, but Samuel knows Wingfield is not finished."],"explain":"This quote matters because Smith’s courage also creates danger. He may be right, but he insults powerful men, and Samuel recognizes that power can strike back in ways worse than fists.","check":["What does Smith remind the men about?","Who stops the fight for now?"],"label":"Smith challenges the gentlemen"}],"structure":["The chapter opens in the dark, crowded ’tween deck.","Storms and wrong winds keep the ships stuck near England.","Samuel describes sickness, boredom, rats, animals, and slop buckets.","James and Richard reveal class differences and possible friendship.","Wingfield wants to turn back, Smith challenges him, and Reverend Hunt prevents violence."],"quick":{"question":"What problem makes the conflict in Chapter 3 worse?","choices":["The men have already reached Virginia.","The ships are stuck, crowded, sick, and going nowhere.","Samuel has become friends with everyone.","Captain Smith has been made president."],"correct":1,"feedback":"correct"},"ican":["I can summarize the main events of Chapter 3.","I can explain why the ship becomes a pressure cooker.","I can describe how class conflict appears between gentlemen and commoners.","I can explain Samuel’s “trust no one” survival rule."]});
</script>
