renderChapter({"chapter":10,"heroCopy":"Explore Chapter 10 as James Town works, prays, struggles with salty water, and is suddenly attacked in the night.","notice":"<strong>Chapter 10 focus:</strong> Newport explores, James Town builds a chapel, crops wilt, Samuel tries to be kinder, danger hides in the woods, and a night attack ends with James’s death.","heroArt":"camp","heroArtLabel":"James Town works and prays before a night attack.","vocab":[["shallop","A small boat used for exploring rivers and shallow water.","🚣"],["provisions","Food and supplies needed to live or travel.","🥖"],["chapel","A small place for prayer and worship.","⛪"],["awning","A covering that gives shade or protection from rain.","⛺"],["pulpit","A raised place where a preacher speaks.","📖"],["pews","Benches used for sitting during worship.","🪑"],["wilt","To droop or dry up from lack of water.","🥀"],["raid","A sudden attack, often by surprise.","⚠️"]],"snapshot":[["Setting","James Town after the settlement site has been chosen. Newport and Smith explore while the remaining colonists work, pray, and try to keep crops alive."],["Main conflict","The settlement looks peaceful during the day, but warning signs show that danger is nearby. The night attack reveals how vulnerable the colonists are."],["Character focus","Samuel is trying, awkwardly, to be less cruel to Richard and James, but he still struggles to connect before tragedy strikes."],["Chapter job","Chapter 10 turns James Town from a work camp into a battlefield and makes Samuel’s failure to protect James emotionally devastating."]],"scenes":[{"n":"01","page":"PDF p. 66","title":"Newport explores with Smith","quote":"“goes off exploring”","kind":"river","label":"Newport and Smith leave James Town to explore.","summary":"Captain Newport leaves in the shallop with gentlemen, sailors, and Captain Smith as interpreter. They search for gold, silver, and a passage to the Orient.","details":["Smith is needed because he can communicate with Native p ting is a start.","details":["Samuel is slowly beginning to examine his behavior.","He still does not know how to make friendship happen.","The thought becomes tragic after what happens later."],"explain":"This quote matters because Samuel is beginning to change, but the change is small and unfinished.","check":["Who keeps away from Samuel?","What does Samuel think might be enough?"]},{"n":"05","page":"PDF p. 67","title":"A shape in the woods","quote":"“Who’s there?”","kind":"forest","label":"Samuel senses something moving near the camp.","summary":"Samuel goes into the woods at dusk and sees a dark form slip behind a tree. He calls out, even using Wingapo, but gets no answer.","details":["The danger is close before the attack begins.","Samuel notices the warning but cannot confirm it.","The silence creates suspense."],"explain":"This quote matters because the threat is already inside the edge of the settlement. The chapter shifts from ordinary chores to danger.","check":["What does Samuel see?","Does anyone answer him?"]},{"n":"06","page":"PDF p. 68","title":"The night attack begins","quote":"“a shriek like a demon’s cry”","kind":"attack","label":"The night erupts with screams and arrows.","summary":"Samuel wakes to terrifying cries. An arrow pierces the tent near him, and he orders Richard and James to get under the mattress.","details":["The attack is sudden and confusing.","Samuel acts quickly under pressure.","The mattress becomes a desperate shield."],"explain":"This quote matters because the attack is experienced through sound and fear before anyone can understand what is happening.","check":["What wakes Samuel up?","What comes through the tent?"]},{"n":"07","page":"PDF p. 68","title":"James runs toward the ships","quote":"“I’m going to the ships!”","kind":"conflict","label":"James panics and runs from the tent.","summary":"James tries to escape to the ships. Samuel grabs him, but James bites Samuel’s arm and gets away.","details":["James is terrified and acts without thinking.","Samuel tries to stop him but fails.","This becomes the moment Samuel will blame himself for."],"explain":"This quote matters because it marks the last choice James makes. Panic sends him into greater danger.","check":["Where does James try to go?","How does he get away from Samuel?"]},{"n":"08","page":"PDF p. 69","title":"Under the mattress","quote":"“Will the mattresses protect us?”","kind":"camp","label":"Samuel and Richard hide under the mattress.","summary":"Samuel and Richard hide beneath the mattress as arrows fly, muskets fire, and cannons finally scare the attackers away.","details":["Samuel is frightened but tries to protect Richard.","The attack shows how unprepared the settlement is.","Cannon fire saves the camp from worse destruction."],"explain":"This quote matters because survival feels uncertain. The boys do not know whether their protection will work.","check":["Where do Samuel and Richard hide?","What sound helps end the attack?"]},{"n":"09","page":"PDF p. 70","title":"James is dead","quote":"“This one is dead.”","kind":"trial","label":"Captain Gosnold carries James’s body.","summary":"After the attack, men count the wounded. Captain Gosnold carries James’s limp body and says he is dead.","details":["Seventeen are wounded, but James is the one who dies.","Samuel’s guilt will carry into the next chapter.","The colony’s danger becomes deeply personal."],"explain":"This quote matters because the chapter ends with a child’s death, not just a military attack. For Samuel, the loss is personal and crushing.","check":["Who is carried by Captain Gosnold?","What happens to James?"]}],"structure":["Newport and Smith leave to explore.","The colonists build a simple chapel and pray.","The crops wilt and the river water is salty.","Samuel tries to think about being kinder.","He sees a dark shape in the woods.","A night attack erupts with arrows and screams.","James runs from the tent toward the ships.","Cannons scare off the attackers.","James is found dead."],"quick":{"question":"What is the turning point of Chapter 10?","choices":["The chapel is finished.","The night attack kills James.","The wheat grows quickly.","Newport finds gold."],"correct":1,"feedback":"Correct — the night attack and James’s death change everything for Samuel and the settlement."},"ican":["I can summarize the main events of Chapter 10.","I can explain why salty water matters.","I can describe how the attack shows James Town is vulnerable.","I can explain why James’s death affects Samuel so deeply."]});
