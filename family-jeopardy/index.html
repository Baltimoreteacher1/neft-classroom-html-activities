<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Family Jeopardy · Jeopardy en familia</title>
    <meta
      name="description"
      content="A bilingual (English/Spanish) family Jeopardy game for Pre-K through 8th grade academic and family nights."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --stage: #070f2b;
        --stage2: #0f2166;
        --tile: #132a78;
        --tile2: #1e44b3;
        --tile-edge: #081745;
        --gold: #ffc83d;
        --gold2: #ff9f1c;
        --gold-shadow: #8a5200;
        --coral: #ff5c7a;
        --mint: #35e0a1;
        --sky: #8fe3ff;
        --purple: #c79bff;
        --ink: #fff6dc;
        --muted: #a9b8ec;
        --es: #9be9ff;
        --display: "Lilita One", "Baloo 2", "Fredoka", "Arial Rounded MT Bold", sans-serif;
        --body: "Nunito", "Segoe UI", "Helvetica Neue", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: var(--body);
        font-weight: 700;
        color: var(--ink);
        background: var(--stage);
        background-image:
          radial-gradient(ellipse 60% 55% at 15% -10%, rgba(255, 200, 61, 0.25), transparent 60%),
          radial-gradient(ellipse 60% 55% at 85% -10%, rgba(255, 92, 122, 0.2), transparent 60%),
          radial-gradient(ellipse 80% 40% at 50% 110%, rgba(53, 224, 161, 0.12), transparent 60%),
          radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1.5px);
        background-size: auto, auto, auto, 26px 26px;
        padding: 0 clamp(10px, 2vw, 28px) 40px;
        overflow-x: hidden;
      }
      button {
        font-family: inherit;
        font-weight: 800;
        cursor: pointer;
        border: 0;
        color: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      label:focus-within {
        outline: 3px solid var(--sky);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .es {
        color: var(--es);
      }
      .sep {
        opacity: 0.45;
        margin: 0 0.35em;
      }

      /* ---------- top bar ---------- */
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 18px;
        align-items: center;
        justify-content: space-between;
        padding: 14px 4px 10px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand h1 {
        font-family: var(--display);
        font-size: clamp(1.4rem, 2.8vw, 2.2rem);
        margin: 0;
        letter-spacing: 0.5px;
        line-height: 1;
        background: linear-gradient(180deg, #fff2b0, var(--gold) 55%, var(--gold2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 2px 0 var(--gold-shadow));
      }
      .brand .logo {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff5c2, var(--gold) 45%, var(--gold2) 80%);
        box-shadow: 0 0 0 3px var(--stage), 0 0 0 6px var(--gold2), 0 0 24px rgba(255, 200, 61, 0.5);
        display: grid;
        place-items: center;
        font-size: 24px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .seg {
        display: inline-flex;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 3px;
      }
      .seg button {
        padding: 6px 14px;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 0.9rem;
        transition: background 0.1s, color 0.1s;
      }
      .seg button[aria-pressed="true"] {
        background: var(--gold);
        color: #1a1200;
        box-shadow: 0 2px 0 var(--gold-shadow);
      }
      .icon-btn {
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.16);
        font-size: 0.9rem;
        transition: transform 0.1s, border-color 0.1s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .icon-btn:hover {
        border-color: var(--sky);
        transform: translateY(-1px);
      }
      .icon-btn[aria-pressed="true"] {
        border-color: var(--mint);
        color: var(--mint);
      }

      /* ---------- setup screen ---------- */
      .screen {
        max-width: 1280px;
        margin: 0 auto;
      }
      .hero {
        text-align: center;
        padding: 16px 0 10px;
      }
      .hero h2 {
        font-family: var(--display);
        font-size: clamp(2.2rem, 5.5vw, 4.2rem);
        margin: 0;
        line-height: 0.95;
        letter-spacing: 1px;
        background: linear-gradient(180deg, #fff9d6 0%, var(--gold) 50%, var(--gold2) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 4px 0 var(--gold-shadow)) drop-shadow(0 8px 20px rgba(255, 159, 28, 0.35));
      }
      .hero p {
        font-size: clamp(1rem, 1.8vw, 1.25rem);
        color: var(--muted);
        margin: 10px 0 0;
      }
      .panel {
        background: linear-gradient(180deg, rgba(30, 68, 179, 0.32), rgba(19, 42, 120, 0.32));
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
        padding: 20px;
        margin-top: 18px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
      }
      .panel h3 {
        font-family: var(--display);
        font-size: clamp(1.2rem, 2.2vw, 1.6rem);
        margin: 0 0 12px;
        color: var(--gold);
        letter-spacing: 0.5px;
        font-weight: 400;
      }
      .setup-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
        gap: 16px;
      }
      .boards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
        gap: 14px;
      }
      .board-card {
        text-align: left;
        padding: 16px;
        border-radius: 18px;
        background: rgba(7, 15, 43, 0.65);
        border: 3px solid rgba(255, 255, 255, 0.12);
        transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .board-card:hover {
        transform: translateY(-3px);
        border-color: rgba(255, 200, 61, 0.45);
      }
      .board-card[aria-pressed="true"] {
        border-color: var(--gold);
        background: rgba(19, 42, 120, 0.65);
        box-shadow: 0 0 0 3px rgba(255, 200, 61, 0.25), 0 0 24px rgba(255, 200, 61, 0.25);
      }
      .board-card .em {
        font-size: 2rem;
        line-height: 1;
      }
      .board-card .nm {
        font-family: var(--display);
        font-size: 1.25rem;
        margin: 6px 0 3px;
        font-weight: 400;
        color: #fff;
      }
      .board-card .bl {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 600;
        line-height: 1.35;
        margin-bottom: 10px;
      }
      .board-card ul {
        margin: auto 0 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .board-card li {
        font-size: 0.78rem;
        background: rgba(255, 255, 255, 0.08);
        padding: 3px 8px;
        border-radius: 999px;
        font-weight: 700;
      }
      .stepper {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: rgba(7, 15, 43, 0.6);
        border-radius: 999px;
        padding: 5px;
      }
      .stepper button {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--gold);
        color: #1a1200;
        font-size: 1.5rem;
        line-height: 1;
        box-shadow: 0 3px 0 var(--gold-shadow);
      }
      .stepper button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .stepper output {
        font-family: var(--display);
        font-size: 1.6rem;
        min-width: 2ch;
        text-align: center;
      }
      .team-inputs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 8px;
        margin-top: 12px;
      }
      .team-inputs label {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(7, 15, 43, 0.6);
        border-radius: 12px;
        padding: 6px 10px;
        border-left: 6px solid var(--c);
      }
      .team-inputs input,
      .score input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        color: var(--ink);
        font: inherit;
        font-size: 1rem;
        padding: 6px 2px;
        font-weight: 800;
      }
      .team-inputs input:focus,
      .score input:focus {
        outline: 2px solid var(--sky);
        border-radius: 6px;
      }
      .toggles {
        display: grid;
        gap: 8px;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(7, 15, 43, 0.6);
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
        font-size: 0.95rem;
      }
      .toggle input {
        width: 22px;
        height: 22px;
        accent-color: var(--mint);
        cursor: pointer;
      }
      .timer-select-wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(7, 15, 43, 0.6);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 0.95rem;
      }
      .timer-select-wrap select {
        background: rgba(255, 255, 255, 0.12);
        color: var(--ink);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        padding: 6px 10px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .howto ol {
        margin: 0;
        padding-left: 1.4em;
        display: grid;
        gap: 8px;
        font-size: 1rem;
        line-height: 1.4;
      }
      .howto li::marker {
        color: var(--gold);
        font-family: var(--display);
      }
      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 22px;
      }
      .btn {
        padding: 13px 26px;
        border-radius: 999px;
        font-size: 1.15rem;
        letter-spacing: 0.3px;
        transition: transform 0.12s, box-shadow 0.12s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn:active {
        transform: translateY(2px);
      }
      .btn-gold {
        background: linear-gradient(180deg, #ffe27a, var(--gold) 60%, var(--gold2));
        color: #1a1200;
        box-shadow: 0 5px 0 var(--gold-shadow), 0 10px 24px rgba(255, 159, 28, 0.35);
      }
      .btn-gold:active {
        box-shadow: 0 2px 0 var(--gold-shadow);
      }
      .btn-ghost {
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.22);
      }
      .btn-mint {
        background: var(--mint);
        color: #032a1a;
        box-shadow: 0 5px 0 #147a55;
      }
      .btn-coral {
        background: var(--coral);
        color: #fff;
        box-shadow: 0 5px 0 #a3243f;
      }
      .btn-purple {
        background: var(--purple);
        color: #1f0b3b;
        box-shadow: 0 5px 0 #6e4699;
      }
      .btn-sm {
        padding: 8px 16px;
        font-size: 0.95rem;
      }

      /* ---------- game board ---------- */
      .gamebar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
        justify-content: space-between;
        margin: 8px 0 10px;
      }
      .gamebar .bname {
        font-family: var(--display);
        font-size: clamp(1.2rem, 2.5vw, 1.8rem);
        letter-spacing: 0.5px;
        font-weight: 400;
      }
      .gamebar .bname small {
        display: block;
        font-family: var(--body);
        font-size: 0.82rem;
        color: var(--muted);
        letter-spacing: 0;
      }
      .gamebar .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      /* Turn Bar */
      .turn-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: rgba(7, 15, 43, 0.75);
        border: 2px solid rgba(255, 255, 255, 0.16);
        border-left: 8px solid var(--c);
        border-radius: 14px;
        padding: 8px 16px;
        margin-bottom: 12px;
      }
      .turn-info {
        font-size: 1.05rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .turn-info b {
        color: var(--c);
        font-family: var(--display);
        font-size: 1.25rem;
        font-weight: 400;
      }
      .turn-actions {
        display: flex;
        gap: 6px;
      }
      .turn-btn {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.85rem;
      }
      .turn-btn:hover {
        background: rgba(255, 255, 255, 0.22);
      }

      .board-wrap {
        overflow-x: auto;
        padding: 12px;
        border-radius: 24px;
        background: linear-gradient(180deg, #0b1a52, #060e30);
        border: 4px solid #0b1a52;
        box-shadow:
          0 0 0 3px var(--gold2),
          0 0 0 8px #0b1a52,
          0 24px 60px rgba(0, 0, 0, 0.5);
        position: relative;
      }
      .board-wrap::before {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 32px;
        pointer-events: none;
        border: 5px dotted #ffe9a3;
        animation: marquee 0.9s steps(2) infinite alternate;
      }
      @keyframes marquee {
        from { opacity: 0.35; }
        to { opacity: 1; }
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(130px, 1fr));
        gap: 8px;
        min-width: 820px;
      }
      .cat {
        background: linear-gradient(180deg, #ffe27a, var(--gold) 55%, var(--gold2));
        color: #1a1200;
        border-radius: 14px;
        padding: 8px 6px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-height: 84px;
        box-shadow: 0 4px 0 var(--gold-shadow);
        animation: drop 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) both;
        animation-delay: calc(var(--i) * 50ms);
      }
      .cat .em {
        font-size: 1.6rem;
        line-height: 1;
      }
      .cat .nm {
        font-family: var(--display);
        font-size: clamp(0.88rem, 1.3vw, 1.1rem);
        line-height: 1.15;
        font-weight: 400;
      }
      .cat .nm span {
        display: block;
      }
      .cat .nm .es {
        font-size: 0.86em;
        color: #4a3200;
        font-weight: 700;
        opacity: 0.9;
      }
      .cell {
        position: relative;
        min-height: clamp(68px, 10vh, 100px);
        border-radius: 14px;
        background: linear-gradient(180deg, var(--tile2), var(--tile));
        border: 3px solid var(--tile-edge);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.18), 0 5px 0 #050c26;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        transition: transform 0.12s, box-shadow 0.12s, filter 0.2s;
        animation: drop 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) both;
        animation-delay: calc(var(--i) * 30ms);
        cursor: pointer;
      }
      .cell .v {
        font-family: var(--display);
        font-size: clamp(1.7rem, 3.4vw, 2.8rem);
        color: var(--gold);
        text-shadow: 0 2px 0 var(--gold-shadow), 0 0 16px rgba(255, 200, 61, 0.35);
        line-height: 1;
        font-weight: 400;
      }
      .cell .g {
        font-size: 0.76rem;
        color: var(--muted);
        letter-spacing: 0.3px;
        font-weight: 700;
      }
      .cell:hover:not(.used) {
        transform: translateY(-3px);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.2), 0 8px 0 #050c26, 0 0 24px rgba(255, 200, 61, 0.35);
      }
      .cell:active {
        transform: translateY(2px);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.18), 0 2px 0 #050c26;
      }
      .cell.used {
        filter: saturate(0.3);
        opacity: 0.4;
        cursor: default;
      }
      .cell.used .v {
        font-size: 1.8rem;
        color: #fff;
      }
      .cell.used.won .v {
        color: var(--mint);
      }
      @keyframes drop {
        from {
          opacity: 0;
          transform: translateY(-20px) scale(0.9);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- scoreboard ---------- */
      .scores {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      .score {
        background: rgba(7, 15, 43, 0.7);
        border-radius: 16px;
        padding: 10px 14px;
        border-top: 7px solid var(--c);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }
      .score.leader::after {
        content: "👑";
        position: absolute;
        right: 10px;
        top: 6px;
        font-size: 1.4rem;
      }
      .score .pts {
        font-family: var(--display);
        font-size: clamp(1.8rem, 3.4vw, 2.6rem);
        line-height: 1;
        margin: 4px 0 6px;
        color: var(--c);
        font-weight: 400;
        transition: transform 0.2s;
      }
      .score .pts.bump {
        animation: bump 0.4s;
      }
      @keyframes bump {
        30% { transform: scale(1.2); }
      }
      .score .adj {
        display: flex;
        gap: 6px;
      }
      .score .adj button {
        flex: 1;
        padding: 5px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 0.85rem;
      }
      .score .adj button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(200%);
        visibility: hidden;
        background: var(--gold);
        color: #1a1200;
        padding: 12px 22px;
        border-radius: 999px;
        font-size: 1.05rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        transition: transform 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
        z-index: 70;
        max-width: 90vw;
        text-align: center;
        font-weight: 800;
      }
      .toast.show {
        transform: translateX(-50%);
        visibility: visible;
      }

      /* ---------- modals ---------- */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(3, 8, 30, 0.88);
        backdrop-filter: blur(8px);
        overflow-y: auto;
      }
      .card {
        width: min(880px, 96vw);
        background: linear-gradient(180deg, #14309a, #0b1a52 40%, #070f2b);
        border: 4px solid var(--gold);
        border-radius: 26px;
        padding: clamp(16px, 2.5vw, 32px);
        box-shadow:
          0 0 0 6px #0b1a52,
          0 0 60px rgba(255, 200, 61, 0.35),
          0 30px 80px rgba(0, 0, 0, 0.6);
        text-align: center;
        animation: pop 0.3s cubic-bezier(0.2, 1.4, 0.4, 1);
        position: relative;
        margin: auto;
      }
      @keyframes pop {
        from {
          transform: scale(0.88);
          opacity: 0;
        }
      }

      /* Card Top Bar */
      .card-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      .card-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .card-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .chip {
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 0.92rem;
      }
      .chip.val-chip {
        background: var(--gold);
        color: #1a1200;
        border-color: var(--gold);
        font-family: var(--display);
        font-size: 1.15rem;
        font-weight: 400;
      }
      .audio-btn {
        background: rgba(53, 224, 161, 0.15);
        border: 2px solid var(--mint);
        color: var(--mint);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 0.88rem;
        font-weight: 800;
        transition: transform 0.1s, background 0.1s;
      }
      .audio-btn:hover {
        background: rgba(53, 224, 161, 0.3);
        transform: translateY(-1px);
      }
      .close-x {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        font-size: 1.2rem;
        display: grid;
        place-items: center;
        transition: background 0.1s;
      }
      .close-x:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      /* Status Bar (Timer & Buzzer) */
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 8px auto 14px;
      }
      .timer-box {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(7, 15, 43, 0.7);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        padding: 4px 12px;
        font-family: var(--display);
        font-size: 1.25rem;
        color: var(--gold);
      }
      .timer-box.urgent {
        color: var(--coral);
        border-color: var(--coral);
        animation: pulseTimer 0.5s infinite alternate;
      }
      @keyframes pulseTimer {
        from { transform: scale(1); }
        to { transform: scale(1.05); }
      }
      .timer-btn {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 0.85rem;
      }
      .buzz-action-btn {
        background: var(--coral);
        color: #fff;
        border-radius: 999px;
        padding: 6px 16px;
        font-size: 0.95rem;
        box-shadow: 0 3px 0 #a3243f;
      }
      .buzz-action-btn:hover {
        transform: translateY(-1px);
      }
      .buzz-pill {
        background: linear-gradient(90deg, #ff5c7a, #ff9f1c);
        color: #fff;
        border-radius: 999px;
        padding: 6px 14px;
        font-family: var(--display);
        font-size: 1.15rem;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
      }
      .buzz-x {
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        font-size: 0.8rem;
      }

      /* Daily Double Banner */
      .dbl {
        display: inline-block;
        background: linear-gradient(90deg, var(--coral), var(--gold2));
        color: #fff;
        font-family: var(--display);
        font-size: clamp(1.2rem, 2.6vw, 1.8rem);
        padding: 6px 22px;
        border-radius: 999px;
        margin-bottom: 12px;
        animation: wiggle 0.6s ease-in-out infinite alternate;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        font-weight: 400;
      }
      @keyframes wiggle {
        from { transform: rotate(-2deg); }
        to { transform: rotate(2deg); }
      }

      /* Clue Text */
      .clue {
        font-size: clamp(1.4rem, 2.8vw, 2.3rem);
        line-height: 1.35;
        margin: 14px auto;
        max-width: 780px;
        text-align: center;
      }
      .clue.long {
        font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      }
      .q-en {
        display: block;
        color: #ffffff;
      }
      .q-es {
        display: block;
        color: var(--es);
        font-size: 0.88em;
        margin-top: 10px;
        font-weight: 700;
      }
      .q-es::before,
      .a-es::before,
      .hint-es::before {
        content: "ES";
        font-size: 0.55em;
        vertical-align: middle;
        background: var(--es);
        color: #04233a;
        padding: 2px 6px;
        border-radius: 5px;
        margin-right: 8px;
        font-family: var(--body);
        font-weight: 900;
      }

      /* Scaffold Hint */
      .hint-wrap {
        margin: 12px auto;
        max-width: 680px;
      }
      .hint-btn {
        background: rgba(255, 200, 61, 0.12);
        border: 2px dashed var(--gold);
        color: var(--gold);
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 0.92rem;
        transition: transform 0.1s, background 0.1s;
      }
      .hint-btn:hover {
        background: rgba(255, 200, 61, 0.22);
        transform: translateY(-1px);
      }
      .hint-box {
        margin-top: 8px;
        background: rgba(255, 200, 61, 0.1);
        border: 2px solid var(--gold);
        border-radius: 14px;
        padding: 10px 16px;
        font-size: 1.05rem;
        color: #fff9e6;
        animation: pop 0.2s ease-out;
        text-align: center;
      }
      .hint-es {
        margin-top: 6px;
        font-size: 0.9em;
        color: #ffe699;
      }

      /* Answer */
      .answer {
        margin: 16px auto;
        padding: 16px 22px;
        border-radius: 16px;
        background: rgba(53, 224, 161, 0.14);
        border: 2px dashed var(--mint);
        font-size: clamp(1.3rem, 2.5vw, 2rem);
        line-height: 1.35;
        color: #d9fff0;
        max-width: 740px;
        animation: pop 0.25s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .a-es {
        display: block;
        font-size: 0.88em;
        margin-top: 6px;
        color: #9affd5;
      }

      /* Award Section */
      .award {
        margin-top: 18px;
      }
      .award-label {
        color: var(--muted);
        margin-bottom: 10px;
        font-size: 1rem;
      }
      .teams-award-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .tbtn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--c);
        color: #04102a;
        font-size: 1.05rem;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        transition: transform 0.1s;
      }
      .tbtn:hover {
        transform: translateY(-2px);
      }
      .tbtn:active {
        transform: translateY(2px);
        box-shadow: none;
      }
      .tbtn .neg {
        margin-left: 4px;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font-size: 0.85rem;
      }

      /* Daily Double Wager */
      .dd-wager-box {
        background: rgba(7, 15, 43, 0.7);
        border: 2px solid var(--gold);
        border-radius: 18px;
        padding: 16px;
        margin: 14px auto;
        max-width: 500px;
      }
      .dd-wager-box .quick-wagers {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin: 12px 0;
      }
      .dd-wager-box input {
        width: 160px;
        text-align: center;
        font-family: var(--display);
        font-size: 1.6rem;
        color: var(--gold);
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid var(--gold);
        border-radius: 10px;
        padding: 6px;
      }

      /* Final Challenge */
      .final-teams {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 10px;
        margin: 16px 0;
      }
      .ft {
        background: rgba(7, 15, 43, 0.7);
        border-radius: 14px;
        padding: 10px;
        border-left: 6px solid var(--c);
        text-align: left;
      }
      .ft .nm {
        font-size: 1.05rem;
        font-weight: 900;
      }
      .ft .have {
        color: var(--muted);
        font-size: 0.88rem;
      }
      .ft input[type="number"] {
        width: 100%;
        margin-top: 6px;
        font: inherit;
        font-size: 1.2rem;
        font-weight: 900;
        padding: 6px 8px;
        border-radius: 8px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
      }
      .ft .verdict {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .ft .verdict button {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        font-size: 0.95rem;
      }
      .ft .verdict .ok { background: var(--mint); color: #032a1a; }
      .ft .verdict .no { background: var(--coral); color: #fff; }
      .ft .verdict button:disabled { opacity: 0.35; cursor: not-allowed; }
      .ft.decided .verdict button:not(:disabled) { outline: 3px solid #fff; }

      /* Podium */
      .podium {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 16px auto 0;
        max-width: 520px;
      }
      .podium .row {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(7, 15, 43, 0.7);
        border-radius: 14px;
        padding: 10px 14px;
        border-left: 8px solid var(--c);
        text-align: left;
      }
      .podium .rank {
        font-family: var(--display);
        font-size: 1.8rem;
        width: 2.2ch;
      }
      .podium .nm {
        flex: 1;
        font-size: 1.2rem;
      }
      .podium .pts {
        font-family: var(--display);
        font-size: 1.6rem;
        color: var(--c);
      }

      /* Shortcuts Modal */
      .shortcuts-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
        margin: 16px 0;
        text-align: left;
      }
      .shortcuts-list .sc-item {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .shortcuts-list kbd {
        background: #111;
        color: var(--gold);
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 3px 8px;
        font-family: var(--display);
        font-size: 1rem;
        min-width: 36px;
        text-align: center;
      }

      #confetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 80;
        width: 100%;
        height: 100%;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      @media (max-width: 640px) {
        .card { padding: 16px; }
        .board-wrap { padding: 8px; }
        .grid { gap: 6px; }
        .cell { min-height: 60px; }
        .cell .g { display: none; }
      }
    
      /* Projector Font Resizer & Master Volume */
      :root {
        --font-scale: 1;
      }
      body {
        font-size: calc(1rem * var(--font-scale));
      }
      .zoom-seg {
        display: inline-flex;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 2px;
      }
      .zoom-seg button {
        padding: 4px 10px;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 0.85rem;
        font-family: var(--display);
        transition: color 0.1s, background 0.1s;
      }
      .zoom-seg button:hover {
        color: var(--gold);
        background: rgba(255, 255, 255, 0.1);
      }
      .zoom-seg button.active {
        background: var(--gold);
        color: #1a1200;
      }

      .volume-box {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 0.85rem;
      }
      .volume-box input[type="range"] {
        width: 55px;
        height: 5px;
        accent-color: var(--mint);
        cursor: pointer;
      }

      /* Buzzer Pad on Clue Card */
      .buzzer-box {
        margin: 10px auto 12px;
        max-width: 780px;
        background: rgba(7, 15, 43, 0.65);
        border: 2px solid rgba(255, 255, 255, 0.16);
        border-radius: 18px;
        padding: 10px 14px;
        text-align: center;
      }
      .buzzer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 0.92rem;
        color: var(--muted);
      }
      .buzzer-header .buzzer-kbd-hint {
        font-size: 0.8rem;
        opacity: 0.8;
      }
      .buzzer-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .buzzer-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid var(--c);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 800;
        transition: transform 0.1s, background 0.1s;
      }
      .buzzer-btn:not(:disabled):hover {
        background: var(--c);
        color: #04102a;
        transform: translateY(-2px);
      }
      .buzzer-btn.active-buzz {
        background: var(--c);
        color: #04102a;
        box-shadow: 0 0 20px var(--c);
        animation: pulseBuzz 0.4s infinite alternate;
      }
      @keyframes pulseBuzz {
        from { transform: scale(1); }
        to { transform: scale(1.06); }
      }
      .buzzer-btn.locked-out {
        opacity: 0.35;
        cursor: not-allowed;
        border-style: dashed;
        filter: grayscale(0.8);
      }
      .buzz-badge {
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        font-family: var(--display);
        font-size: 0.85rem;
      }
      .active-buzz .buzz-badge {
        background: #04102a;
        color: #fff;
      }
      .buzz-alert-bar {
        margin: 10px auto 2px;
        padding: 8px 18px;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff5c7a, #ff9f1c);
        color: #fff;
        font-family: var(--display);
        font-size: 1.15rem;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 14px rgba(255, 92, 122, 0.4);
        animation: pop 0.25s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .buzz-alert-bar .pass-btn {
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.5);
        color: #fff;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 0.88rem;
        font-family: var(--body);
        font-weight: 800;
        cursor: pointer;
        transition: background 0.1s;
      }
      .buzz-alert-bar .pass-btn:hover {
        background: rgba(0, 0, 0, 0.6);
      }

      /* Multiple Choice Kid Scaffolds */
      .mc-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin: 10px auto 4px;
        max-width: 640px;
      }
      .mc-pill {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 0.95rem;
        color: #fff;
      }

      /* Certificate Modal & Print Styling */
      .cert-card {
        width: min(920px, 96vw);
        background: #fff;
        color: #0c1a40;
        border-radius: 20px;
        padding: clamp(16px, 2.5vw, 32px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
        animation: pop 0.3s cubic-bezier(0.2, 1.4, 0.4, 1);
        position: relative;
        margin: auto;
        max-height: 90vh;
        overflow-y: auto;
      }
      .cert-sheet {
        border: 6px double #d4af37;
        outline: 2px solid #b38728;
        outline-offset: -12px;
        padding: clamp(16px, 2.5vw, 32px);
        text-align: center;
        background: radial-gradient(circle at 50% 50%, #fffef8, #fbf7ee);
        box-shadow: inset 0 0 25px rgba(212, 175, 55, 0.15);
        position: relative;
        margin-bottom: 16px;
      }
      .cert-seal {
        font-size: 3.2rem;
        line-height: 1;
        margin-bottom: 6px;
      }
      .cert-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.4rem, 3vw, 2.4rem);
        font-weight: 900;
        letter-spacing: 2px;
        color: #8c6d1f;
        margin: 0 0 4px;
        text-transform: uppercase;
      }
      .cert-subtitle {
        font-size: 0.95rem;
        color: #665220;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 800;
        margin-bottom: 12px;
      }
      .cert-awarded {
        font-size: 1.05rem;
        font-style: italic;
        color: #555;
        margin: 10px 0 4px;
      }
      .cert-name-input {
        font-family: Georgia, cursive, serif;
        font-size: clamp(1.6rem, 3.5vw, 2.7rem);
        font-weight: 900;
        color: #0b1a52;
        text-align: center;
        border: none;
        border-bottom: 2px solid #d4af37;
        background: transparent;
        width: 90%;
        max-width: 580px;
        padding: 4px;
        margin: 0 auto 10px;
        outline: none;
      }
      .cert-reason {
        max-width: 660px;
        margin: 8px auto;
        font-size: 1.02rem;
        line-height: 1.45;
        color: #243360;
      }
      .cert-score-badge {
        display: inline-block;
        background: linear-gradient(135deg, #f7df8b, #d4af37);
        color: #1a1200;
        font-family: var(--display);
        font-size: 1.25rem;
        padding: 4px 18px;
        border-radius: 999px;
        margin: 8px 0 16px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      }
      .cert-footer-row {
        display: flex;
        justify-content: space-around;
        gap: 16px;
        margin-top: 24px;
        padding-top: 10px;
        flex-wrap: wrap;
      }
      .cert-sig-block {
        flex: 1;
        min-width: 170px;
        text-align: center;
      }
      .cert-sig-line {
        border-top: 2px solid #444;
        margin: 22px auto 4px;
        width: 80%;
      }
      .cert-sig-label {
        font-size: 0.88rem;
        color: #444;
        font-weight: 800;
      }
      .cert-meta-input {
        font-family: inherit;
        font-size: 0.92rem;
        text-align: center;
        border: none;
        border-bottom: 1px dashed #aaa;
        background: transparent;
        width: 100%;
        color: #222;
        font-weight: 700;
      }
      .cert-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 8px;
        flex-wrap: wrap;
      }

      @media print {
        body {
          background: #fff !important;
          padding: 0 !important;
          margin: 0 !important;
          color: #000 !important;
        }
        .topbar, main, #clue, #final, #winner, #shortcutsModal, #toast, #confetti, .cert-actions, .close-x {
          display: none !important;
        }
        #certificateModal {
          display: block !important;
          position: static !important;
          background: none !important;
          padding: 0 !important;
          width: 100% !important;
          height: auto !important;
        }
        .cert-card {
          box-shadow: none !important;
          width: 100% !important;
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
          max-height: none !important;
          overflow: visible !important;
        }
        .cert-sheet {
          outline: 2px solid #000 !important;
          border: 6px double #b38728 !important;
          page-break-after: always;
          margin: 0 !important;
          padding: 24px !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .cert-name-input, .cert-meta-input {
          border-bottom: none !important;
        }
        @page {
          size: landscape;
          margin: 0.4in;
        }
      }

    </style>
  </head>
  <body>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">🎓</div>
        <h1 id="brandTitle">Family Jeopardy</h1>
      </div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Language / Idioma" id="langSeg">
          <button data-lang="en">English</button
          ><button data-lang="es">Español</button
          ><button data-lang="both">Both · Ambos</button>
        </div>
        <div class="zoom-seg" role="group" aria-label="Text Size / Tamaño de texto">
          <button id="zoomOutBtn" title="Smaller text (A−)">A−</button
          ><button id="zoomResetBtn" title="Default text size (A)" class="active">A</button
          ><button id="zoomInBtn" title="Larger text (A+)">A+</button>
        </div>
        <button class="icon-btn" id="undoBtn" title="Undo / Deshacer (Ctrl+Z)" disabled>
          ↩️ <span class="undo-txt">Undo</span>
        </button>
        <div class="volume-box" title="Master Volume / Volumen principal">
          <button id="soundBtn" style="background:transparent;padding:0;font-size:1rem" aria-label="Mute / Silenciar">🔊</button>
          <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
        </div>
        <button class="icon-btn" id="fsBtn" title="Fullscreen / Pantalla completa">
          ⛶
        </button>
        <button class="icon-btn" id="scBtn" title="Keyboard Shortcuts / Atajos">
          ⌨️
        </button>
      </div>
    </header>

    <main>
      <section id="setup" class="screen"></section>
      <section id="game" class="screen" hidden></section>
    </main>

    <div id="clue" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="clueTitle"></div>
    <div id="final" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="finalTitle"></div>

      let AC;
      let masterGainNode;
      function getMasterGain() {
        if (!AC) return null;
        if (!masterGainNode) {
          masterGainNode = AC.createGain();
          masterGainNode.connect(AC.destination);
        }
        const vol = S.sound ? (S.volume !== undefined ? S.volume : 0.8) : 0;
        masterGainNode.gain.setValueAtTime(vol, AC.currentTime);
        return masterGainNode;
      }

      function beep(seq) {
        if (!S.sound || (S.volume !== undefined && S.volume <= 0)) return;
        try {
          AC = AC || new (window.AudioContext || window.webkitAudioContext)();
          if (AC.state === "suspended") AC.resume();
          const master = getMasterGain();
          let at = AC.currentTime;
          for (const [f, d, type, gainPeak] of seq) {
            const o = AC.createOscillator(),
              g = AC.createGain();
            o.type = type || "triangle";
            o.frequency.value = f;
            const peak = gainPeak || 0.2;
            g.gain.setValueAtTime(0.0001, at);
            g.gain.exponentialRampToValueAtTime(peak, at + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, at + d);
            o.connect(g).connect(master || AC.destination);
            o.start(at);
            o.stop(at + d + 0.02);
            at += d;
          }
        } catch (e) {}
      }

      function speak(text, lang = "en") {
        if (!("speechSynthesis" in window)) return;
        try {
          window.speechSynthesis.cancel();
          const cleanText = text.replace(/<[^>]*>/g, "").trim();
          const utter = new SpeechSynthesisUtterance(cleanText);
          utter.rate = 0.92;
          utter.pitch = 1.05;
          const voices = window.speechSynthesis.getVoices();
          const target = lang === "es" ? "es" : "en";
          const match = voices.find((v) => v.lang.toLowerCase().startsWith(target));
          if (match) utter.voice = match;
          utter.lang = target === "es" ? "es-US" : "en-US";
          window.speechSynthesis.speak(utter);
        } catch (e) {}
      }

      /* Canvas Confetti */
      const cv = $("#confetti"),
        cx = cv.getContext("2d");
      let parts = [],
        raf = null;

      function confetti(n = 160) {
        cv.width = innerWidth;
        cv.height = innerHeight;
        const cols = [
          "#ffc83d",
          "#ff5c7a",
          "#35e0a1",
          "#8fe3ff",
          "#ffffff",
          "#ff9f1c",
          "#c79bff",
        ];
        for (let i = 0; i < n; i++)
          parts.push({
            x: Math.random() * cv.width,
            y: -20 - Math.random() * cv.height * 0.4,
            r: 6 + Math.random() * 8,
            c: cols[i % cols.length],
            vy: 2.5 + Math.random() * 4,
            vx: -2 + Math.random() * 4,
            rot: Math.random() * 6.3,
            vr: -0.2 + Math.random() * 0.4,
            isStar: i % 4 === 0,
          });
        if (!raf) tick();
      }

      function tick() {
        cx.clearRect(0, 0, cv.width, cv.height);
        parts = parts.filter((p) => p.y < cv.height + 30);
        for (const p of parts) {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          p.vy += 0.04;
          cx.save();
          cx.translate(p.x, p.y);
          cx.rotate(p.rot);
          cx.fillStyle = p.c;
          if (p.isStar) {
            cx.beginPath();
            for (let s = 0; s < 5; s++) {
              cx.lineTo(Math.cos(((18 + s * 72) * Math.PI) / 180) * p.r, -Math.sin(((18 + s * 72) * Math.PI) / 180) * p.r);
              cx.lineTo(Math.cos(((54 + s * 72) * Math.PI) / 180) * (p.r / 2), -Math.sin(((54 + s * 72) * Math.PI) / 180) * (p.r / 2));
            }
            cx.closePath();
            cx.fill();
          } else {
            cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
          }
          cx.restore();
        }
        raf = parts.length
          ? requestAnimationFrame(tick)
          : (cx.clearRect(0, 0, cv.width, cv.height), null);

    }

    ${
      open.played
        ? `<div class="cta-row"><span class="chip">✓ ${t("played")}</span><button class="btn btn-ghost btn-sm" id="closeBtn">${t("close")}</button></div>`
        : ""
    }
  </div>`;

        $("#clueClose").onclick = closeClue;
        const cb = $("#closeBtn");
        if (cb) cb.onclick = closeClue;

        $("#ttsEnBtn").onclick = () => speak(q.q.en, "en");
        $("#ttsEsBtn").onclick = () => speak(q.q.es, "es");

        const hb = $("#hintToggleBtn");
        if (hb) {
          hb.onclick = () => {
            open.showHint = !open.showHint;
            if (open.showHint) SFX.hint();
            renderClue();
          };
        }

        const pb = $("#pauseTimerBtn");
        if (pb) {
          pb.onclick = () => {
            timerPaused = !timerPaused;
            if (timerPaused) stopThinkGroove();
            else startThinkGroove();
            renderClue();
          };
        }

        const atb = $("#addTimerBtn");
        if (atb) {
          atb.onclick = () => {
            timerLeft += 10;
            updateTimerDisplay();
            SFX.open();
          };
        }

        document.querySelectorAll("[data-buzz-team]").forEach((btn) => {
          btn.onclick = () => {
            const teamIdx = +btn.dataset.buzzTeam;
            if (lockedOutTeams.has(teamIdx)) return;
            buzzedTeam = teamIdx;
            buzzElapsed = ((performance.now() - clueStartTime) / 1000).toFixed(2);
            timerPaused = true;
            stopThinkGroove();
            SFX.buzz();
            renderClue();
          };
        });

        const passBtn = $("#passBuzzBtn");
        if (passBtn) {
          passBtn.onclick = () => {
            if (buzzedTeam !== null) {
              lockedOutTeams.add(buzzedTeam);
            }
            buzzedTeam = null;
            buzzElapsed = null;
            timerPaused = false;
            startThinkGroove();
            SFX.open();
            renderClue();
          };
        }

        const rb = $("#revealBtn");
        if (rb) {
          rb.onclick = () => {
            open.revealed = true;
            stopClueTimer();
            SFX.reveal();
            renderClue();
          };
          rb.focus();
        }

        document.querySelectorAll("[data-win]").forEach(
          (bt) =>
            (bt.onclick = (e) => {
              const lose = e.target.closest("[data-lose]");
              if (lose) {
                addScore(+lose.dataset.lose, -val);
                SFX.lose();
                return;
              }
              const winnerIdx = +bt.dataset.win;
              pushUndoState();
              S.teams[winnerIdx].score += val;
              S.used[open.k] = "won";
              S.currentTurn = (winnerIdx + 1) % S.teams.length;
              save();
              SFX.win();
              confetti(140);
              closeClue();
            }),
        );

        const nb = $("#nobodyBtn");
        if (nb) {
          nb.onclick = () => {
            pushUndoState();
            S.used[open.k] = "miss";
            S.currentTurn = (S.currentTurn + 1) % S.teams.length;
            save();
            SFX.lose();
            closeClue();
          };
        }
      }

      function closeClue() {
        stopClueTimer();
        stopSpeaking();
        $("#clue").hidden = true;
        open = null;
        buzzedTeam = null;
        renderGame();
        const total = board().cats.length * ROWS.length;
        if (Object.keys(S.used).length >= total && !S.finalDone) {
          toast(t("allDone"));
        }
      }

      /* ============================== FINAL CHALLENGE ============================== */
      let fin = null;
      function openFinal() {
        fin = {
          step: "wager",
          wagers: S.teams.map((tm) =>
            Math.min(tm.score, Math.max(0, Math.round(tm.score / 2 / 100) * 100)),
          ),
          decided: S.teams.map(() => null),
        };
        renderFinal();
        $("#final").hidden = false;
        SFX.fanfare();
      }

      function renderFinal() {
        const b = board(),
          f = b.final;
        const teamCards = S.teams
          .map(
            (tm, i) => `<div class="ft ${fin.decided[i] !== null ? "decided" : ""}" style="--c:${TEAM_COLORS[i]}">
    <div class="nm">${esc(tm.name)}</div>
    <div class="have">${t("youHave")}: <b>${tm.score}</b> · ${t("wager")}: <b>${fin.wagers[i]}</b></div>
    ${fin.step === "wager" ? `<input type="number" min="0" max="${Math.max(0, tm.score)}" step="100" value="${fin.wagers[i]}" data-wager="${i}" aria-label="${esc(tm.name)} wager">` : ""}
    ${
      fin.step === "answer"
        ? `<div class="verdict">
      <button class="ok" data-fin="${i}" data-ok="1" ${fin.decided[i] !== null && fin.decided[i] !== true ? "disabled" : ""}>${t("correct")}</button>
      <button class="no" data-fin="${i}" data-ok="0" ${fin.decided[i] !== null && fin.decided[i] !== false ? "disabled" : ""}>${t("incorrect")}</button>
    </div>`
        : ""
    }
  </div>`,
          )
          .join("");

        $("#final").innerHTML = `<div class="card">
    <div class="card-bar">
      <div class="card-meta">
        <span class="chip val-chip">🏆 ${t("final")}</span>
      </div>
      <div class="card-actions">
        <button class="close-x" id="finalClose" aria-label="${esc(UI.close.en)}">✕</button>
      </div>
    </div>
    <h2 id="finalTitle" class="clue" style="font-size:clamp(1.15rem,2.2vw,1.5rem);color:var(--muted);margin:10px auto">${fin.step === "wager" ? t("finalIntro") : ""}</h2>
    ${fin.step !== "wager" ? `<h2 class="clue ${f.q.en.length > 75 ? "long" : ""}"><span class="q-en">${esc(f.q.en)}</span>${S.lang !== "en" ? `<span class="q-es">${esc(f.q.es)}</span>` : ""}</h2>` : ""}
    ${fin.step === "answer" ? `<div class="answer"><div class="a-en">${esc(f.a.en)}</div>${S.lang !== "en" ? `<div class="a-es">${esc(f.a.es)}</div>` : ""}</div>` : ""}
    <div class="final-teams">${teamCards}</div>
    <div class="cta-row">
      ${fin.step === "wager" ? `<button class="btn btn-gold" id="finNext">👀 ${t("reveal")}</button>` : ""}
      ${fin.step === "question" ? `<button class="btn btn-gold" id="finNext">👀 ${t("showAnswer")}</button>` : ""}
      ${fin.step === "answer" ? `<button class="btn btn-gold" id="finNext" ${fin.decided.some((d) => d === null) ? "disabled" : ""}>🎉 ${t("results")}</button>` : ""}
    </div>
  </div>`;

        $("#finalClose").onclick = () => {
          $("#final").hidden = true;
          renderGame();
        };

        document.querySelectorAll("[data-wager]").forEach(
          (inp) =>
            (inp.oninput = () => {
              const i = +inp.dataset.wager,
                max = Math.max(0, S.teams[i].score);
              fin.wagers[i] = Math.max(
                0,
                Math.min(max, Math.round(+inp.value || 0)),
              );
            }),
        );

        document.querySelectorAll("[data-fin]").forEach(
          (bt) =>
            (bt.onclick = () => {
              const i = +bt.dataset.fin,
                ok = bt.dataset.ok === "1";
              if (fin.decided[i] !== null) return;
              fin.decided[i] = ok;
              addScore(i, ok ? fin.wagers[i] : -fin.wagers[i]);
              ok ? SFX.win() : SFX.lose();
              renderFinal();
            }),
        );

        const nx = $("#finNext");
        if (nx)
          nx.onclick = () => {
            if (fin.step === "wager") {
              fin.step = "question";
              SFX.open();
            } else if (fin.step === "question") {
              fin.step = "answer";
              SFX.reveal();
            } else {
              S.finalDone = true;
              save();
              $("#final").hidden = true;
              showWinner();
              return;
            }
            renderFinal();
          };
      }

      
      /* ============================== CERTIFICATE PRINT SYSTEM ============================== */
      function openCertificateModal(champion, allTeams) {
        const teamsToPrint = allTeams || (champion ? [champion] : S.teams);
        const todayStr = new Date().toLocaleDateString(S.lang === "es" ? "es-US" : "en-US", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });

        const sheetsHtml = teamsToPrint.map((tm, idx) => `
          <div class="cert-sheet">
            <div class="cert-seal">🎓</div>
            <div class="cert-title">${t("certTitle")}</div>
            <div class="cert-subtitle">${t("certSubtitle")}</div>
            <div class="cert-awarded">${t("certAwarded")}</div>
            <input type="text" class="cert-name-input" value="${esc(tm.name)}" aria-label="Team Name">
            <p class="cert-reason">${t("certReason")}</p>
            <div class="cert-score-badge">⭐ ${t("certScore")}: <b>${tm.score} ${t("points")}</b> ${idx === 0 ? (S.lang === "es" ? "· 🏆 1.er Lugar · Campeón" : S.lang === "en" ? "· 🏆 1st Place · Champion" : "· 🏆 1st Place · 1.er Lugar") : (S.lang === "es" ? "· Mención de Honor" : S.lang === "en" ? "· Honor Award" : "· Honor Award · Mención de Honor")} ⭐</div>
            <div class="cert-footer-row">
              <div class="cert-sig-block">
                <input type="text" class="cert-meta-input" value="School Community Family Night · Noche Familiar" aria-label="School or Organization">
                <div class="cert-sig-line"></div>
                <div class="cert-sig-label">${t("certSchool")}</div>
              </div>
              <div class="cert-sig-block">
                <input type="text" class="cert-meta-input" value="${todayStr}" aria-label="Date">
                <div class="cert-sig-line"></div>
                <div class="cert-sig-label">${S.lang === "es" ? "Fecha" : "Date"}</div>
              </div>
              <div class="cert-sig-block">
                <div style="height:20px"></div>
                <div class="cert-sig-line"></div>
                <div class="cert-sig-label">${t("certPrincipal")}</div>
              </div>
              <div class="cert-sig-block">
                <div style="height:20px"></div>
                <div class="cert-sig-line"></div>
                <div class="cert-sig-label">${t("certTeacher")}</div>
              </div>
            </div>
          </div>
        `).join("");

        $("#certificateModal").innerHTML = `
          <div class="cert-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
              <span class="chip val-chip" style="font-size:1rem">📜 ${t("certTitle")}</span>
              <button class="close-x" id="certCloseBtn" aria-label="${esc(UI.close.en)}">✕</button>
            </div>
            ${sheetsHtml}
            <div class="cert-actions">
              <button class="btn btn-mint" id="printDocBtn">${t("printNow")}</button>
              <button class="btn btn-ghost" id="certDoneBtn">${t("close")}</button>
            </div>
          </div>
        `;

        $("#certificateModal").hidden = false;
        $("#certCloseBtn").onclick = () => { $("#certificateModal").hidden = true; };
        $("#certDoneBtn").onclick = () => { $("#certificateModal").hidden = true; };
        $("#printDocBtn").onclick = () => { window.print(); };
      }

      function showWinner() {
        const sorted = S.teams
          .map((tm, i) => ({ ...tm, i }))
          .sort((a, b) => b.score - a.score);
        const tie = sorted.length > 1 && sorted[0].score === sorted[1].score;

        $("#winner").innerHTML = `<div class="card">
    <div style="font-size:3.8rem;line-height:1">${tie ? "🤝" : "🏆"}</div>
    <div style="margin:10px 0"><span class="chip val-chip">${tie ? t("tie") : t("winner")}</span></div>
    <h2 id="winTitle" class="clue" style="color:var(--gold);margin:8px auto">${tie ? "🤝" : esc(sorted[0].name)}</h2>
    <p style="font-size:1.15rem;color:var(--muted);margin:8px 0 16px">${t("everyone")}</p>
    <div class="podium">
      ${sorted.map((tm, r) => `<div class="row" style="--c:${TEAM_COLORS[tm.i]}"><span class="rank">${["🥇", "🥈", "🥉"][r] || r + 1}</span><span class="nm">${esc(tm.name)}</span><span class="pts">${tm.score}</span></div>`).join("")}
    </div>
    <div class="cta-row">
      <button class="btn btn-ghost" id="winBack">${t("backToBoard")}</button>
      <button class="btn btn-mint" id="winCertBtn">${t("printCert")}</button>
      <button class="btn btn-purple" id="winAllCertsBtn">${t("printAllCerts")}</button>
      <button class="btn btn-gold" id="winAgain">🔁 ${t("playAgain")}</button>
    </div>
  </div>`;

        $("#winner").hidden = false;
        SFX.fanfare();
        confetti(300);
        setTimeout(() => confetti(180), 800);

        $("#winCertBtn").onclick = () => openCertificateModal(sorted[0]);
        $("#winAllCertsBtn").onclick = () => openCertificateModal(null, sorted);

        $("#winBack").onclick = () => {
          $("#winner").hidden = true;
          renderGame();
        };
        $("#winAgain").onclick = () => {
          $("#winner").hidden = true;
          S.inGame = false;
          save();
          showScreen("setup");
        };
      }

      /* ============================== KEYBOARD SHORTCUTS MODAL ============================== */
      function openShortcuts() {
        $("#shortcutsModal").innerHTML = `<div class="card" style="max-width:580px">
          <div class="card-bar">
            <div class="card-meta">
              <span class="chip val-chip">⌨️ ${t("shortcuts")}</span>
            </div>
            <div class="card-actions">
              <button class="close-x" id="scClose">✕</button>
            </div>
          </div>
          <div class="shortcuts-list">
            <div class="sc-item"><kbd>Space</kbd> <span>${t("showAnswer")}</span></div>
            <div class="sc-item"><kbd>1 – 8</kbd> <span>${t("buzzIn")} (Before) / Award (After)</span></div>
            <div class="sc-item"><kbd>P</kbd> <span>Pass Buzzer to Next Team</span></div>
            <div class="sc-item"><kbd>Ctrl+Z / U</kbd> <span>${t("undo")} (Previous Turn/Score)</span></div>
            <div class="sc-item"><kbd>0 / N</kbd> <span>${t("nobody")}</span></div>
            <div class="sc-item"><kbd>T</kbd> <span>Pause / Resume Timer</span></div>
            <div class="sc-item"><kbd>+</kbd> <span>+10s More Time</span></div>
            <div class="sc-item"><kbd>F</kbd> <span>Fullscreen</span></div>
            <div class="sc-item"><kbd>Esc</kbd> <span>${t("close")}</span></div>
          </div>
          <div class="cta-row">
            <button class="btn btn-gold btn-sm" id="scDone">${t("close")}</button>
          </div>
        </div>`;
        $("#shortcutsModal").hidden = false;
        $("#scClose").onclick = () => ($("#shortcutsModal").hidden = true);
        $("#scDone").onclick = () => ($("#shortcutsModal").hidden = true);
      }

      /* ============================== FULLSCREEN ============================== */
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      /* ============================== WIRING & KEYBOARD ============================== */
      document.querySelectorAll("#langSeg button").forEach(
        (b) =>
          (b.onclick = () => {
            S.lang = b.dataset.lang;
            save();
            renderAll();
          }),
      );

      $("#soundBtn").onclick = () => {
        S.sound = !S.sound;
        if (S.sound && (S.volume === undefined || S.volume === 0)) {
          S.volume = 0.8;
          if ($("#volSlider")) $("#volSlider").value = 0.8;
        }
        getMasterGain();
        save();
        renderShell();
        if (!$("#setup").hidden) renderSetup();
        SFX.open();
      };

      
      /* Projector Font Scaling */
      function setFontScale(scale) {
        S.zoom = scale;
        document.documentElement.style.setProperty("--font-scale", scale);
        document.querySelectorAll(".zoom-seg button").forEach((btn) => btn.classList.remove("active"));
        if (scale < 0.95 && $("#zoomOutBtn")) $("#zoomOutBtn").classList.add("active");
        else if (scale > 1.05 && $("#zoomInBtn")) $("#zoomInBtn").classList.add("active");
        else if ($("#zoomResetBtn")) $("#zoomResetBtn").classList.add("active");
        save();
      }

      const zoBtn = $("#zoomOutBtn");
      if (zoBtn) zoBtn.onclick = () => setFontScale(0.85);
      const zrBtn = $("#zoomResetBtn");
      if (zrBtn) zrBtn.onclick = () => setFontScale(1.0);
      const ziBtn = $("#zoomInBtn");
      if (ziBtn) ziBtn.onclick = () => setFontScale(1.2);

      if (S.zoom) {
        setFontScale(S.zoom);
      }

      /* Master Volume Slider */
      const volSlider = $("#volSlider");
      if (volSlider) {
        volSlider.value = S.volume !== undefined ? S.volume : 0.8;
        volSlider.oninput = (e) => {
          S.volume = parseFloat(e.target.value);
          if (S.volume > 0) S.sound = true;
          getMasterGain();
          const ic = $("#soundBtn");
          if (ic) ic.textContent = S.volume === 0 ? "🔇" : S.volume < 0.4 ? "🔈" : S.volume < 0.75 ? "🔉" : "🔊";
          save();
        };
      }

      const ub = $("#undoBtn");
      if (ub) {
        ub.onclick = undo;
      }

      $("#fsBtn").onclick = toggleFullscreen;
      $("#scBtn").onclick = openShortcuts;

      document.addEventListener("keydown", (e) => {
        const tag = (e.target.tagName || "").toLowerCase();
        if (tag === "input" || tag === "select" || tag === "textarea") return;

        if (e.key === "Escape") {
          if (!$("#certificateModal").hidden) {
            $("#certificateModal").hidden = true;
          } else if (!$("#shortcutsModal").hidden) {
            $("#shortcutsModal").hidden = true;
          } else if (!$("#clue").hidden) {
            closeClue();
          } else if (!$("#final").hidden) {
            $("#final").hidden = true;
            renderGame();
          } else if (!$("#winner").hidden) {
            $("#winner").hidden = true;
            renderGame();
          }
          return;
        }

        if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) {
          e.preventDefault();
          undo();
          return;
        }

        if (e.key === "u" || e.key === "U") {
          undo();
          return;
        }

        if (e.key === "f" || e.key === "F") {
          toggleFullscreen();
          return;
        }

        if (e.key === "?" || (e.shiftKey && e.key === "/")) {
          openShortcuts();
          return;
        }

        if (!$("#clue").hidden && open) {
          if (e.key === " " && !open.revealed && !open.waitingWager) {
            e.preventDefault();
            open.revealed = true;
            stopClueTimer();
            SFX.reveal();
            renderClue();
            return;
          }

          if (e.key === "t" || e.key === "T") {
            timerPaused = !timerPaused;
            if (timerPaused) stopThinkGroove();
            else startThinkGroove();
            renderClue();
            return;
          }

          if (e.key === "+" || e.key === "=") {
            timerLeft += 10;
            updateTimerDisplay();
            SFX.open();
            return;
          }

          if ((e.key === "p" || e.key === "P") && buzzedTeam !== null && !open.revealed) {
            lockedOutTeams.add(buzzedTeam);
            buzzedTeam = null;
            buzzElapsed = null;
            timerPaused = false;
            startThinkGroove();
            SFX.open();
            renderClue();
            return;
          }

          const num = parseInt(e.key, 10);
          if (num >= 1 && num <= S.teams.length) {
            const teamIdx = num - 1;
            if (!open.revealed) {
              if (lockedOutTeams.has(teamIdx)) return;
              buzzedTeam = teamIdx;
              buzzElapsed = ((performance.now() - clueStartTime) / 1000).toFixed(2);
              timerPaused = true;
              stopThinkGroove();
              SFX.buzz();
              renderClue();
            } else if (open.revealed && !open.played) {
              pushUndoState();
              S.teams[teamIdx].score += open.wager;
              S.used[open.k] = "won";
              S.currentTurn = (teamIdx + 1) % S.teams.length;
              save();
              SFX.win();
              confetti(140);
              closeClue();
            }
            return;
          }

          if ((e.key === "0" || e.key === "n" || e.key === "N") && open.revealed && !open.played) {
            S.used[open.k] = "miss";
            S.currentTurn = (S.currentTurn + 1) % S.teams.length;
            save();
            SFX.lose();
            closeClue();
            return;
          }
        }
      });

      addEventListener("resize", () => {
        cv.width = innerWidth;
        cv.height = innerHeight;
      });

      function renderAll() {
        renderShell();
        if (!$("#setup").hidden) renderSetup();
        else renderGame();
        if (open) renderClue();
        if (fin && !$("#final").hidden) renderFinal();
      }

      renderShell();
      showScreen(S.inGame ? "game" : "setup");
    </script>
  </body>
</html>
