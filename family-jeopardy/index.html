<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Family Jeopardy · Jeopardy en familia</title>
    <meta
      name="description"
      content="A bilingual (English/Spanish) family Jeopardy game for Pre-K through 8th grade academic nights."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --stage: #070f2b;
        --stage2: #0f2166;
        --tile: #132a78;
        --tile2: #1e44b3;
        --tile-edge: #081745;
        --gold: #ffc83d;
        --gold2: #ff9f1c;
        --gold-shadow: #8a5200;
        --coral: #ff5c7a;
        --mint: #35e0a1;
        --sky: #8fe3ff;
        --ink: #fff6dc;
        --muted: #a9b8ec;
        --es: #9be9ff;
        --display:
          "Lilita One", "Baloo 2", "Fredoka", "Arial Rounded MT Bold",
          sans-serif;
        --body: "Nunito", "Segoe UI", "Helvetica Neue", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: var(--body);
        font-weight: 700;
        color: var(--ink);
        background: var(--stage);
        background-image:
          radial-gradient(
            ellipse 60% 55% at 15% -10%,
            rgba(255, 200, 61, 0.28),
            transparent 60%
          ),
          radial-gradient(
            ellipse 60% 55% at 85% -10%,
            rgba(255, 92, 122, 0.22),
            transparent 60%
          ),
          radial-gradient(
            ellipse 80% 40% at 50% 110%,
            rgba(53, 224, 161, 0.14),
            transparent 60%
          ),
          radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1.5px);
        background-size:
          auto,
          auto,
          auto,
          26px 26px;
        padding: 0 clamp(12px, 2vw, 32px) 48px;
        overflow-x: hidden;
      }
      button {
        font-family: inherit;
        font-weight: 800;
        cursor: pointer;
        border: 0;
        color: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      label:focus-within {
        outline: 4px solid var(--sky);
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .es {
        color: var(--es);
      }
      .btn-gold .es,
      .btn-mint .es,
      .btn-coral .es,
      .chip.val .es,
      .toast .es,
      .dbl .es {
        color: inherit;
        opacity: 0.8;
      }
      .howto {
        grid-column: 1 / -1;
      }
      .sep {
        opacity: 0.5;
        margin: 0 0.35em;
      }

      /* ---------- top bar ---------- */
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: center;
        justify-content: space-between;
        padding: 14px 4px 8px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand h1 {
        font-family: var(--display);
        font-size: clamp(1.5rem, 3.2vw, 2.4rem);
        margin: 0;
        letter-spacing: 0.5px;
        line-height: 1;
        background: linear-gradient(
          180deg,
          #fff2b0,
          var(--gold) 55%,
          var(--gold2)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 3px 0 var(--gold-shadow));
      }
      .brand .logo {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #fff5c2,
          var(--gold) 45%,
          var(--gold2) 80%
        );
        box-shadow:
          0 0 0 4px var(--stage),
          0 0 0 7px var(--gold2),
          0 0 30px rgba(255, 200, 61, 0.6);
        display: grid;
        place-items: center;
        font-size: 24px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .seg {
        display: inline-flex;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 4px;
      }
      .seg button {
        padding: 8px 16px;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .seg button[aria-pressed="true"] {
        background: var(--gold);
        color: #1a1200;
        box-shadow: 0 2px 0 var(--gold-shadow);
      }
      .icon-btn {
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.18);
        font-size: 0.95rem;
      }
      .icon-btn[aria-pressed="true"] {
        border-color: var(--mint);
        color: var(--mint);
      }

      /* ---------- setup ---------- */
      .screen {
        max-width: 1280px;
        margin: 0 auto;
      }
      .hero {
        text-align: center;
        padding: 22px 0 10px;
      }
      .hero h2 {
        font-family: var(--display);
        font-size: clamp(2.4rem, 7vw, 5rem);
        margin: 0;
        line-height: 0.95;
        letter-spacing: 1px;
        background: linear-gradient(
          180deg,
          #fff9d6 0%,
          var(--gold) 50%,
          var(--gold2) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 5px 0 var(--gold-shadow))
          drop-shadow(0 10px 24px rgba(255, 159, 28, 0.35));
      }
      .hero p {
        font-size: clamp(1.05rem, 2vw, 1.35rem);
        color: var(--muted);
        margin: 14px 0 0;
      }
      .panel {
        background: linear-gradient(
          180deg,
          rgba(30, 68, 179, 0.35),
          rgba(19, 42, 120, 0.35)
        );
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        padding: 22px;
        margin-top: 22px;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .panel h3 {
        font-family: var(--display);
        font-size: clamp(1.3rem, 2.6vw, 1.8rem);
        margin: 0 0 14px;
        color: var(--gold);
        letter-spacing: 0.5px;
        font-weight: 400;
      }
      .setup-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 18px;
      }
      .boards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
      }
      .board-card {
        text-align: left;
        padding: 16px;
        border-radius: 18px;
        background: rgba(7, 15, 43, 0.6);
        border: 3px solid rgba(255, 255, 255, 0.12);
        transition:
          transform 0.15s,
          border-color 0.15s;
      }
      .board-card:hover {
        transform: translateY(-3px);
      }
      .board-card[aria-pressed="true"] {
        border-color: var(--gold);
        box-shadow:
          0 0 0 3px rgba(255, 200, 61, 0.25),
          0 0 30px rgba(255, 200, 61, 0.25);
      }
      .board-card .em {
        font-size: 2rem;
        line-height: 1;
      }
      .board-card .nm {
        font-family: var(--display);
        font-size: 1.35rem;
        margin: 6px 0 4px;
        font-weight: 400;
      }
      .board-card .bl {
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 600;
      }
      .board-card ul {
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .board-card li {
        font-size: 0.8rem;
        background: rgba(255, 255, 255, 0.08);
        padding: 3px 8px;
        border-radius: 999px;
        font-weight: 700;
      }
      .stepper {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: rgba(7, 15, 43, 0.6);
        border-radius: 999px;
        padding: 6px;
      }
      .stepper button {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--gold);
        color: #1a1200;
        font-size: 1.6rem;
        line-height: 1;
        box-shadow: 0 3px 0 var(--gold-shadow);
      }
      .stepper button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .stepper output {
        font-family: var(--display);
        font-size: 1.8rem;
        min-width: 2ch;
        text-align: center;
      }
      .team-inputs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .team-inputs label {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(7, 15, 43, 0.6);
        border-radius: 14px;
        padding: 6px 8px 6px 12px;
        border-left: 6px solid var(--c);
      }
      .team-inputs input,
      .score input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        color: var(--ink);
        font: inherit;
        font-size: 1.05rem;
        padding: 8px 4px;
        font-weight: 800;
      }
      .team-inputs input:focus,
      .score input:focus {
        outline: 2px solid var(--sky);
        border-radius: 8px;
      }
      .toggles {
        display: grid;
        gap: 10px;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(7, 15, 43, 0.6);
        border-radius: 14px;
        padding: 12px 14px;
        cursor: pointer;
      }
      .toggle input {
        width: 26px;
        height: 26px;
        accent-color: var(--mint);
        cursor: pointer;
      }
      .howto ol {
        margin: 0;
        padding-left: 1.4em;
        display: grid;
        gap: 10px;
        font-size: 1.05rem;
        line-height: 1.45;
      }
      .howto li::marker {
        color: var(--gold);
        font-family: var(--display);
      }
      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
        margin-top: 26px;
      }
      .btn {
        padding: 16px 30px;
        border-radius: 999px;
        font-size: 1.25rem;
        letter-spacing: 0.3px;
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .btn:active {
        transform: translateY(3px);
      }
      .btn-gold {
        background: linear-gradient(
          180deg,
          #ffe27a,
          var(--gold) 60%,
          var(--gold2)
        );
        color: #1a1200;
        box-shadow:
          0 6px 0 var(--gold-shadow),
          0 12px 30px rgba(255, 159, 28, 0.35);
      }
      .btn-gold:active {
        box-shadow: 0 3px 0 var(--gold-shadow);
      }
      .btn-ghost {
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.22);
      }
      .btn-mint {
        background: var(--mint);
        color: #032a1a;
        box-shadow: 0 6px 0 #147a55;
      }
      .btn-coral {
        background: var(--coral);
        color: #fff;
        box-shadow: 0 6px 0 #a3243f;
      }
      .btn-sm {
        padding: 10px 18px;
        font-size: 1rem;
      }

      /* ---------- game board ---------- */
      .gamebar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
        justify-content: space-between;
        margin: 10px 0 14px;
      }
      .gamebar .bname {
        font-family: var(--display);
        font-size: clamp(1.3rem, 3vw, 2rem);
        letter-spacing: 0.5px;
        font-weight: 400;
      }
      .gamebar .bname small {
        display: block;
        font-family: var(--body);
        font-size: 0.85rem;
        color: var(--muted);
        letter-spacing: 0;
      }
      .gamebar .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .board-wrap {
        overflow-x: auto;
        padding: 14px;
        border-radius: 26px;
        background: linear-gradient(180deg, #0b1a52, #060e30);
        border: 4px solid #0b1a52;
        box-shadow:
          0 0 0 3px var(--gold2),
          0 0 0 9px #0b1a52,
          0 30px 80px rgba(0, 0, 0, 0.5);
        position: relative;
      }
      .board-wrap::before {
        content: "";
        position: absolute;
        inset: -12px;
        border-radius: 34px;
        pointer-events: none;
        border: 6px dotted #ffe9a3;
        animation: marquee 0.9s steps(2) infinite alternate;
      }
      @keyframes marquee {
        from { opacity: 0.35; }
        to { opacity: 1; }
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(140px, 1fr));
        gap: 8px;
        min-width: 880px;
      }
      .cat {
        background: linear-gradient(
          180deg,
          #ffe27a,
          var(--gold) 55%,
          var(--gold2)
        );
        color: #1a1200;
        border-radius: 14px;
        padding: 10px 8px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 92px;
        box-shadow: 0 4px 0 var(--gold-shadow);
        animation: drop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
        animation-delay: calc(var(--i) * 60ms);
      }
      .cat .em {
        font-size: 1.7rem;
        line-height: 1;
      }
      .cat .nm {
        font-family: var(--display);
        font-size: clamp(0.95rem, 1.5vw, 1.2rem);
        line-height: 1.1;
        font-weight: 400;
      }
      .cat .nm span {
        display: block;
      }
      .cat .nm .es {
        color: #4a3200;
      }
      .cell {
        position: relative;
        min-height: clamp(74px, 11vh, 112px);
        border-radius: 14px;
        background: linear-gradient(180deg, var(--tile2), var(--tile));
        border: 3px solid var(--tile-edge);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.18),
          0 6px 0 #050c26;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        transition:
          transform 0.12s,
          box-shadow 0.12s,
          filter 0.2s;
        animation: drop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
        animation-delay: calc(var(--i) * 45ms);
      }
      .cell .v {
        font-family: var(--display);
        font-size: clamp(1.7rem, 3.6vw, 3rem);
        color: var(--gold);
        text-shadow:
          0 3px 0 var(--gold-shadow),
          0 0 18px rgba(255, 200, 61, 0.35);
        line-height: 1;
        font-weight: 400;
      }
      .cell .g {
        font-size: 0.78rem;
        color: var(--muted);
        letter-spacing: 0.3px;
      }
      .cell:hover:not(.used) {
        transform: translateY(-4px);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.2),
          0 10px 0 #050c26,
          0 0 28px rgba(255, 200, 61, 0.35);
      }
      .cell:active {
        transform: translateY(2px);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.18),
          0 2px 0 #050c26;
      }
      .cell.used {
        filter: saturate(0.3);
        opacity: 0.45;
      }
      .cell.used .v {
        font-size: 2rem;
        color: #fff;
      }
      .cell.used.won .v {
        color: var(--mint);
      }
      @keyframes drop {
        from {
          opacity: 0;
          transform: translateY(-24px) scale(0.9);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- scoreboard ---------- */
      .scores {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
        margin-top: 18px;
      }
      .score {
        background: rgba(7, 15, 43, 0.7);
        border-radius: 18px;
        padding: 12px 14px;
        border-top: 8px solid var(--c);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }
      .score.leader::after {
        content: "👑";
        position: absolute;
        right: 10px;
        top: 8px;
        font-size: 1.5rem;
      }
      .score .pts {
        font-family: var(--display);
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1;
        margin: 4px 0 8px;
        color: var(--c);
        font-weight: 400;
        transition: transform 0.2s;
      }
      .score .pts.bump {
        animation: bump 0.5s;
      }
      @keyframes bump {
        30% {
          transform: scale(1.25);
        }
      }
      .score .adj {
        display: flex;
        gap: 6px;
      }
      .score .adj button {
        flex: 1;
        padding: 6px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 0.9rem;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%) translateY(200%);
        visibility: hidden;
        background: var(--gold);
        color: #1a1200;
        padding: 14px 22px;
        border-radius: 999px;
        font-size: 1.1rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        transition: transform 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
        z-index: 60;
        max-width: 92vw;
        text-align: center;
      }
      .toast.show {
        transform: translateX(-50%);
        visibility: visible;
      }

      /* ---------- modals ---------- */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(3, 8, 30, 0.86);
        backdrop-filter: blur(8px);
        overflow: auto;
      }
      .card {
        width: min(1100px, 100%);
        background: linear-gradient(180deg, #14309a, #0b1a52 40%, #070f2b);
        border: 4px solid var(--gold);
        border-radius: 28px;
        padding: clamp(18px, 3vw, 40px);
        box-shadow:
          0 0 0 8px #0b1a52,
          0 0 80px rgba(255, 200, 61, 0.35),
          0 40px 100px rgba(0, 0, 0, 0.6);
        text-align: center;
        animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
        position: relative;
      }
      @keyframes pop {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
      }
      .card .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 14px;
      }
      .chip {
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 1rem;
      }
      .chip.val {
        background: var(--gold);
        color: #1a1200;
        border-color: var(--gold);
        font-family: var(--display);
        font-size: 1.2rem;
        font-weight: 400;
      }
      .dbl {
        display: inline-block;
        background: linear-gradient(90deg, var(--coral), var(--gold2));
        color: #fff;
        font-family: var(--display);
        font-size: clamp(1.3rem, 3vw, 2rem);
        padding: 8px 26px;
        border-radius: 999px;
        margin-bottom: 14px;
        animation: wiggle 0.6s ease-in-out infinite alternate;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        font-weight: 400;
      }
      @keyframes wiggle {
        from {
          transform: rotate(-2deg) scale(1);
        }
        to {
          transform: rotate(2deg) scale(1.05);
        }
      }
      .clue {
        font-size: clamp(1.5rem, 3.4vw, 2.7rem);
        line-height: 1.3;
        margin: 10px auto;
        max-width: 22ch;
        text-wrap: balance;
      }
      .clue.long {
        font-size: clamp(1.25rem, 2.5vw, 2rem);
        max-width: 30ch;
      }
      .clue .es {
        font-size: 0.86em;
        display: block;
        margin-top: 12px;
      }
      .clue .es::before,
      .answer .es::before {
        content: "ES";
        font-size: 0.55em;
        vertical-align: middle;
        background: var(--es);
        color: #04233a;
        padding: 2px 7px;
        border-radius: 6px;
        margin-right: 10px;
        font-family: var(--body);
        font-weight: 900;
      }
      .answer {
        margin: 20px auto 0;
        padding: 18px;
        border-radius: 18px;
        background: rgba(53, 224, 161, 0.14);
        border: 3px dashed var(--mint);
        font-size: clamp(1.4rem, 3vw, 2.3rem);
        line-height: 1.3;
        color: #d9fff0;
        max-width: 26ch;
        animation: pop 0.3s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .answer .es {
        display: block;
        font-size: 0.86em;
        margin-top: 8px;
      }
      .award {
        margin-top: 22px;
      }
      .award .lbl {
        color: var(--muted);
        margin-bottom: 10px;
        font-size: 1.05rem;
      }
      .award .teams {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .tbtn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--c);
        color: #04102a;
        font-size: 1.1rem;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);

          beep([
            [784, 0.08],
            [988, 0.08],
            [1175, 0.08],
            [1568, 0.28],
          ]),
        fanfare: () =>
          beep([
            [523, 0.15],
            [523, 0.15],
            [523, 0.15],
            [659, 0.3],
            [587, 0.15],
            [659, 0.15],
            [784, 0.5],
          ]),
      };
      const cv = $("#confetti"),
        cx = cv.getContext("2d");
      let parts = [],
        raf = null;
      function confetti(n = 180) {
        cv.width = innerWidth;
        cv.height = innerHeight;
        const cols = [
          "#ffc83d",
          "#ff5c7a",
          "#35e0a1",
          "#8fe3ff",
          "#ffffff",
          "#ff9f1c",
          "#c79bff",
        ];
        for (let i = 0; i < n; i++)
          parts.push({
            x: Math.random() * cv.width,
            y: -20 - Math.random() * cv.height * 0.4,
            r: 7 + Math.random() * 9,
            c: cols[i % cols.length],
            vy: 2.5 + Math.random() * 4,
            vx: -2 + Math.random() * 4,
            rot: Math.random() * 6.3,
            vr: -0.25 + Math.random() * 0.5,
          });
        if (!raf) tick();
      }
      function tick() {
        cx.clearRect(0, 0, cv.width, cv.height);
        parts = parts.filter((p) => p.y < cv.height + 30);
        for (const p of parts) {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          p.vy += 0.04;
          cx.save();
          cx.translate(p.x, p.y);
          cx.rotate(p.rot);
          cx.fillStyle = p.c;
          cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
          cx.restore();
        }
        raf = parts.length
          ? requestAnimationFrame(tick)
          : (cx.clearRect(0, 0, cv.width, cv.height), null);
      }
      let toastTimer;
      function toast(html) {
        const el = $("#toast");
        el.innerHTML = html;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 4200);
      }

      /* ============================== RENDER: SHELL ============================== */
      function renderShell() {
        document.documentElement.lang = S.lang === "es" ? "es" : "en";
        document.title = UI.title.en + " · " + UI.title.es;
        $("#brandTitle").innerHTML = t("title");
        document
          .querySelectorAll("#langSeg button")
          .forEach((b) =>
            b.setAttribute("aria-pressed", b.dataset.lang === S.lang),
          );
        $("#soundBtn").setAttribute("aria-pressed", S.sound);
        $("#soundBtn").innerHTML = (S.sound ? "🔊 " : "🔇 ") + t("sound");
      }

      /* ============================== RENDER: SETUP ============================== */
      function renderSetup() {
        const b = board();
        $("#setup").innerHTML = `
  <div class="hero"><h2>${t("title")}</h2><p>${t("subtitle")}</p></div>
  <div class="panel"><h3>${t("chooseBoard")}</h3><div class="boards">
    ${BOARDS.map(
      (
        x,
      ) => `<button class="board-card" data-board="${x.id}" aria-pressed="${x.id === S.boardId}">
      <div class="em">${x.emoji}</div><div class="nm">${L(x.name)}</div><div class="bl">${L(x.blurb)}</div>
      <ul>${x.cats.map((c) => `<li>${c.emoji} ${esc(S.lang === "es" ? c.name.es : c.name.en)}</li>`).join("")}</ul></button>`,
    ).join("")}
  </div></div>
  <div class="setup-grid">
    <div class="panel"><h3>${t("teams")}</h3>
      <div class="stepper"><button id="teamMinus" aria-label="−" ${S.teams.length <= 1 ? "disabled" : ""}>−</button><output>${S.teams.length}</output><button id="teamPlus" aria-label="+" ${S.teams.length >= 8 ? "disabled" : ""}>+</button></div>
      <div class="team-inputs">${S.teams.map((tm, i) => `<label style="--c:${TEAM_COLORS[i]}"><span>${i + 1}.</span><input data-team="${i}" value="${esc(tm.name)}" maxlength="24" aria-label="Team ${i + 1} name"></label>`).join("")}</div>
    </div>
    <div class="panel"><h3>${t("options")}</h3><div class="toggles">
      <label class="toggle"><input type="checkbox" id="optSound" ${S.sound ? "checked" : ""}><span>🔊 ${t("sound")}</span></label>
      <label class="toggle"><input type="checkbox" id="optPenalty" ${S.penalty ? "checked" : ""}><span>➖ ${t("penalty")}</span></label>
    </div></div>
    <div class="panel howto"><h3>${t("howTo")}</h3><ol>${[1, 2, 3, 4, 5].map((n) => `<li>${t("howTo" + n)}</li>`).join("")}</ol></div>
  </div>
  <div class="cta-row">
    ${S.inGame ? `<button class="btn btn-mint" id="resumeBtn">▶ ${t("resume")}</button>` : ""}
    <button class="btn btn-gold" id="startBtn">🎉 ${t("start")}</button>
  </div>`;
        document.querySelectorAll(".board-card").forEach(
          (el) =>
            (el.onclick = () => {
              S.boardId = el.dataset.board;
              save();
              renderSetup();
              SFX.open();
            }),
        );
        $("#teamMinus").onclick = () => {
          S.teams.pop();
          save();
          renderSetup();
        };
        $("#teamPlus").onclick = () => {
          S.teams.push({ name: "Familia " + (S.teams.length + 1), score: 0 });
          save();
          renderSetup();
        };
        document.querySelectorAll("[data-team]").forEach(
          (inp) =>
            (inp.oninput = () => {
              S.teams[+inp.dataset.team].name =
                inp.value.trim() || "Familia " + (+inp.dataset.team + 1);
              save();
            }),
        );
        $("#optSound").onchange = (e) => {
          S.sound = e.target.checked;
          save();
          renderShell();
        };
        $("#optPenalty").onchange = (e) => {
          S.penalty = e.target.checked;
          save();
        };
        $("#startBtn").onclick = startGame;
        const r = $("#resumeBtn");
        if (r)
          r.onclick = () => {
            showScreen("game");
          };
      }

      function startGame() {
        S.inGame = true;
        S.used = {};
        S.finalDone = false;
        S.teams.forEach((tm) => (tm.score = 0));
        // two hidden DOUBLE squares, rows 300+ in different categories
        const cats = [...Array(6).keys()]
          .sort(() => Math.random() - 0.5)
          .slice(0, 2);
        S.doubles = cats.map((c) =>
          cellKey(c, 2 + Math.floor(Math.random() * 3)),
        );
        save();
        SFX.fanfare();
        showScreen("game");
      }
      function showScreen(name) {
        $("#setup").hidden = name !== "setup";
        $("#game").hidden = name !== "game";
        name === "setup" ? renderSetup() : renderGame();
        window.scrollTo({ top: 0 });
      }

      /* ============================== RENDER: GAME ============================== */
      let newGameArmed = false;
      function renderGame() {
        const b = board();
        const cells = [];
        ROWS.forEach((row, r) =>
          b.cats.forEach((c, ci) => {
            const k = cellKey(ci, r),
              u = S.used[k];
            cells.push(`<button class="cell ${u ? "used " + u : ""}" data-c="${ci}" data-r="${r}" style="--i:${r * 6 + ci + 6}" aria-label="${esc(c.name.en)} ${row.v}${u ? " (played)" : ""}">
      <span class="v">${u === "won" ? "✓" : u ? "—" : row.v}</span><span class="g">${esc(S.lang === "es" ? row.g.es : row.g.en)}</span></button>`);
          }),
        );
        $("#game").innerHTML = `
  <div class="gamebar">
    <div class="bname">${b.emoji} ${L(b.name)}<small>${t("board")} · ${L(UI.subtitle)}</small></div>
    <div class="actions">
      <button class="btn btn-ghost btn-sm" id="randomBtn">🎲 ${t("random")}</button>
      <button class="btn btn-mint btn-sm" id="finalBtn">🏆 ${t("finalBtn")}</button>
      <button class="btn btn-ghost btn-sm" id="setupBtn">⚙️ ${t("setup")}</button>
      <button class="btn btn-coral btn-sm" id="newBtn">${t("newGame")}</button>
    </div>
  </div>
  <div class="board-wrap"><div class="grid" role="grid">
    ${b.cats.map((c, i) => `<div class="cat" style="--i:${i}"><span class="em">${c.emoji}</span><span class="nm">${LStack(c.name)}</span></div>`).join("")}
    ${cells.join("")}
  </div></div>
  <h3 class="sr">${t("scoreboard")}</h3>
  <div class="scores" id="scores"></div>`;
        renderScores();
        document
          .querySelectorAll(".cell")
          .forEach(
            (el) => (el.onclick = () => openClue(+el.dataset.c, +el.dataset.r)),
          );
        $("#randomBtn").onclick = () => {
          const free = [...document.querySelectorAll(".cell:not(.used)")];
          if (!free.length) return toast(t("allDone"));
          const el = free[Math.floor(Math.random() * free.length)];
          el.scrollIntoView({ block: "nearest" });
          openClue(+el.dataset.c, +el.dataset.r);
        };
        $("#finalBtn").onclick = openFinal;
        $("#setupBtn").onclick = () => showScreen("setup");
        $("#newBtn").onclick = (e) => {
          if (!newGameArmed) {
            newGameArmed = true;
            e.target.textContent =
              "⚠️ " + (S.lang === "es" ? UI.confirmNew.es : UI.confirmNew.en);
            setTimeout(() => {
              newGameArmed = false;
              if ($("#newBtn")) $("#newBtn").innerHTML = t("newGame");
            }, 3000);
            return;
          }
          newGameArmed = false;
          S.inGame = false;
          save();
          showScreen("setup");
        };
      }
      function renderScores() {
        const max = Math.max(...S.teams.map((x) => x.score));
        $("#scores").innerHTML = S.teams
          .map(
            (tm, i) => `
    <div class="score ${tm.score === max && max > 0 ? "leader" : ""}" style="--c:${TEAM_COLORS[i]}">
      <input data-score-team="${i}" value="${esc(tm.name)}" maxlength="24" aria-label="Team ${i + 1} name">
      <div class="pts" id="pts${i}">${tm.score}</div>
      <div class="adj"><button data-adj="${i}" data-d="-100" aria-label="minus 100">−100</button><button data-adj="${i}" data-d="100" aria-label="plus 100">+100</button></div>
    </div>`,
          )
          .join("");
        document.querySelectorAll("[data-score-team]").forEach(
          (inp) =>
            (inp.onchange = () => {
              S.teams[+inp.dataset.scoreTeam].name =
                inp.value.trim() || "Familia " + (+inp.dataset.scoreTeam + 1);
              save();
              renderScores();
            }),
        );
        document
          .querySelectorAll("[data-adj]")
          .forEach(
            (bt) =>
              (bt.onclick = () => addScore(+bt.dataset.adj, +bt.dataset.d)),
          );
      }
      function addScore(i, d) {
        S.teams[i].score += d;
        save();
        renderScores();
        const el = $("#pts" + i);
        if (el) {
          el.classList.add("bump");
        }
      }

      /* ============================== CLUE MODAL ============================== */
      let open = null;
      function openClue(c, r) {
        const k = cellKey(c, r);
        open = {
          c,
          r,
          k,
          revealed: !!S.used[k],
          played: !!S.used[k],
          dbl: S.doubles.includes(k),
        };
        renderClue();
        $("#clue").hidden = false;
        open.dbl && !open.played ? SFX.dbl() : SFX.open();
      }
      function renderClue() {
        if (!open) return;
        const b = board(),
          c = b.cats[open.c],
          q = c.qs[open.r],
          row = ROWS[open.r],
          val = cellValue(open.c, open.r);
        $("#clue").innerHTML = `<div class="card">
    <button class="close-x" id="clueClose" aria-label="${esc(UI.close.en)}">✕</button>
    <div class="chips"><span class="chip">${c.emoji} ${L(c.name)}</span><span class="chip val">${val} ${t("points")}</span><span class="chip">${L(row.g)}</span></div>
    ${open.dbl ? `<div class="dbl">${t("double")}</div>` : ""}
    <h2 id="clueTitle" class="clue ${q.q.en.length > 80 ? "long" : ""}">${LStack(q.q)}</h2>
    ${open.revealed ? `<div class="answer">${LStack(q.a)}</div>` : `<div class="cta-row"><button class="btn btn-gold" id="revealBtn">👀 ${t("showAnswer")}</button></div>`}
    ${
      open.revealed && !open.played
        ? `<div class="award"><div class="lbl">${t("whoGotIt")}</div><div class="teams">
      ${S.teams.map((tm, i) => `<button class="tbtn" style="--c:${TEAM_COLORS[i]}" data-win="${i}">🎉 ${esc(tm.name)} <b>+${val}</b>${S.penalty ? `<span class="neg" data-lose="${i}" role="button" aria-label="minus ${val}">−${val}</span>` : ""}</button>`).join("")}
    </div><div class="cta-row"><button class="btn btn-ghost btn-sm" id="nobodyBtn">${t("nobody")}</button></div></div>`
        : ""
    }
    ${open.played ? `<div class="cta-row"><span class="chip">✓ ${t("played")}</span><button class="btn btn-ghost btn-sm" id="closeBtn">${t("close")}</button></div>` : ""}
  </div>`;
        $("#clueClose").onclick = closeClue;
        const cb = $("#closeBtn");
        if (cb) cb.onclick = closeClue;
        const rb = $("#revealBtn");
        if (rb) {
          rb.onclick = () => {
            open.revealed = true;
            SFX.reveal();
            renderClue();
          };
          rb.focus();
        }
        document.querySelectorAll("[data-win]").forEach(
          (bt) =>
            (bt.onclick = (e) => {
              const lose = e.target.closest("[data-lose]");
              if (lose) {
                addScore(+lose.dataset.lose, -val);
                SFX.lose();
                return;
              }
              addScore(+bt.dataset.win, val);
              S.used[open.k] = "won";
              save();
              SFX.win();
              confetti();
              closeClue();
            }),
        );
        const nb = $("#nobodyBtn");
        if (nb)
          nb.onclick = () => {
            S.used[open.k] = "miss";
            save();
            SFX.lose();
            closeClue();
          };
      }
      function closeClue() {
        $("#clue").hidden = true;
        open = null;
        renderGame();
        const total = board().cats.length * ROWS.length;
        if (Object.keys(S.used).length >= total && !S.finalDone)
          toast(t("allDone"));
      }

      /* ============================== FINAL CHALLENGE ============================== */
      let fin = null;
      function openFinal() {
        fin = {
          step: "wager",
          wagers: S.teams.map((tm) =>
            Math.min(
              tm.score,
              Math.max(0, Math.round(tm.score / 2 / 100) * 100),
            ),
          ),
          decided: S.teams.map(() => null),
        };
        renderFinal();
        $("#final").hidden = false;
        SFX.fanfare();
      }
      function renderFinal() {
        const b = board(),
          f = b.final;
        const teamCards = S.teams
          .map(
            (
              tm,
              i,
            ) => `<div class="ft ${fin.decided[i] !== null ? "decided" : ""}" style="--c:${TEAM_COLORS[i]}">
    <div class="nm">${esc(tm.name)}</div><div class="have">${t("youHave")}: <b>${tm.score}</b> · ${t("wager")}: <b>${fin.wagers[i]}</b></div>
    ${fin.step === "wager" ? `<input type="number" min="0" max="${Math.max(0, tm.score)}" step="100" value="${fin.wagers[i]}" data-wager="${i}" aria-label="${esc(tm.name)} wager">` : ""}
    ${
      fin.step === "answer"
        ? `<div class="verdict">
      <button class="ok" data-fin="${i}" data-ok="1" ${fin.decided[i] !== null && fin.decided[i] !== true ? "disabled" : ""}>${t("correct")}</button>
      <button class="no" data-fin="${i}" data-ok="0" ${fin.decided[i] !== null && fin.decided[i] !== false ? "disabled" : ""}>${t("incorrect")}</button></div>`
        : ""
    }
  </div>`,
          )
          .join("");
        $("#final").innerHTML = `<div class="card">
    <button class="close-x" id="finalClose" aria-label="${esc(UI.close.en)}">✕</button>
    <div class="chips"><span class="chip val">🏆 ${t("final")}</span></div>
    <h2 id="finalTitle" class="clue" style="font-size:clamp(1.2rem,2.4vw,1.6rem);color:var(--muted)">${fin.step === "wager" ? t("finalIntro") : ""}</h2>
    ${fin.step !== "wager" ? `<h2 class="clue ${f.q.en.length > 80 ? "long" : ""}">${LStack(f.q)}</h2>` : ""}
    ${fin.step === "answer" ? `<div class="answer">${LStack(f.a)}</div>` : ""}
    <div class="final-teams">${teamCards}</div>
    <div class="cta-row">
      ${fin.step === "wager" ? `<button class="btn btn-gold" id="finNext">👀 ${t("reveal")}</button>` : ""}
      ${fin.step === "question" ? `<button class="btn btn-gold" id="finNext">👀 ${t("showAnswer")}</button>` : ""}
      ${fin.step === "answer" ? `<button class="btn btn-gold" id="finNext" ${fin.decided.some((d) => d === null) ? "disabled" : ""}>🎉 ${t("results")}</button>` : ""}
    </div></div>`;
        $("#finalClose").onclick = () => {
          $("#final").hidden = true;
          renderGame();
        };
        document.querySelectorAll("[data-wager]").forEach(
          (inp) =>
            (inp.oninput = () => {
              const i = +inp.dataset.wager,
                max = Math.max(0, S.teams[i].score);
              fin.wagers[i] = Math.max(
                0,
                Math.min(max, Math.round(+inp.value || 0)),
              );
            }),
        );
        document.querySelectorAll("[data-fin]").forEach(
          (bt) =>
            (bt.onclick = () => {
              const i = +bt.dataset.fin,
                ok = bt.dataset.ok === "1";
              if (fin.decided[i] !== null) return;
              fin.decided[i] = ok;
              addScore(i, ok ? fin.wagers[i] : -fin.wagers[i]);
              ok ? SFX.win() : SFX.lose();
              renderFinal();
            }),
        );
        const nx = $("#finNext");
        if (nx)
          nx.onclick = () => {
            if (fin.step === "wager") {
              fin.step = "question";
              SFX.open();
            } else if (fin.step === "question") {
              fin.step = "answer";
              SFX.reveal();
            } else {
              S.finalDone = true;
              save();
              $("#final").hidden = true;
              showWinner();
              return;
            }
            renderFinal();
          };
      }
      function showWinner() {
        const sorted = S.teams
          .map((tm, i) => ({ ...tm, i }))
          .sort((a, b) => b.score - a.score);
        const tie = sorted.length > 1 && sorted[0].score === sorted[1].score;
        $("#winner").innerHTML = `<div class="card">
    <div style="font-size:4rem;line-height:1">${tie ? "🤝" : "🏆"}</div>
    <div class="chips"><span class="chip val">${tie ? t("tie") : t("winner")}</span></div>
    <h2 id="winTitle" class="clue" style="color:var(--gold)">${tie ? "🤝" : esc(sorted[0].name)}</h2>
    <p style="font-size:1.2rem;color:var(--muted)">${t("everyone")}</p>
    <div class="podium">${sorted.map((tm, r) => `<div class="row" style="--c:${TEAM_COLORS[tm.i]};--i:${r}"><span class="rank">${["🥇", "🥈", "🥉"][r] || r + 1}</span><span class="nm">${esc(tm.name)}</span><span class="pts">${tm.score}</span></div>`).join("")}</div>
    <div class="cta-row"><button class="btn btn-ghost" id="winBack">${t("backToBoard")}</button><button class="btn btn-gold" id="winAgain">🔁 ${t("playAgain")}</button></div>
  </div>`;
        $("#winner").hidden = false;
        SFX.fanfare();
        confetti(320);
        setTimeout(() => confetti(200), 900);
        $("#winBack").onclick = () => {
          $("#winner").hidden = true;
          renderGame();
        };
        $("#winAgain").onclick = () => {
          $("#winner").hidden = true;
          S.inGame = false;
          save();
          showScreen("setup");
        };
      }

      /* ============================== WIRING ============================== */
      document.querySelectorAll("#langSeg button").forEach(
        (b) =>
          (b.onclick = () => {
            S.lang = b.dataset.lang;
            save();
            renderAll();
          }),
      );
      $("#soundBtn").onclick = () => {
        S.sound = !S.sound;
        save();
        renderShell();
        if (!$("#setup").hidden) renderSetup();
        SFX.open();
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (!$("#clue").hidden) closeClue();
          else if (!$("#final").hidden) {
            $("#final").hidden = true;
            renderGame();
          } else if (!$("#winner").hidden) {
            $("#winner").hidden = true;
            renderGame();
          }
        }
      });
      addEventListener("resize", () => {
        cv.width = innerWidth;
        cv.height = innerHeight;
      });
      function renderAll() {
        renderShell();
        if (!$("#setup").hidden) renderSetup();
        else renderGame();
        if (open) renderClue();
        if (fin && !$("#final").hidden) renderFinal();
      }
      renderShell();
      showScreen(S.inGame ? "game" : "setup");
    </script>
  </body>
</html>
