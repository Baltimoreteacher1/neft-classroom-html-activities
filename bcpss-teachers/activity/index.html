<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BCPSS Unit Activity — EduWonderLab</title>
    <meta
      name="description"
      content="Distraction-free, WCAG 2.1 AA student and teacher activity runner aligned to Baltimore City Public Schools K–8 units and WIDA 2020 scaffolds."
    />
    <meta name="theme-color" content="#1e3a5f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='17' height='17' rx='5.5' fill='%231e3a5f'/%3E%3Crect x='21' y='2' width='17' height='17' rx='5.5' fill='%230f766e'/%3E%3Crect x='2' y='21' width='17' height='17' rx='5.5' fill='%234a1f35'/%3E%3Crect x='21' y='21' width='17' height='17' rx='5.5' fill='%23b45309'/%3E%3C/svg%3E"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/assets/fonts/inter-1dc044f4.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/assets/fonts/plus-jakarta-sans-069be307.woff2"
    />
    <link rel="stylesheet" href="/bcpss-teachers/activity/activity-view.css" />
    <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
  <link rel="stylesheet" href="/shared/save-resume/save-resume-styles.css?v=20260714-v2">
  <!-- nsr-injected:end -->
</head>
  <body>
    <a class="skip-link" href="#activityMain">Skip to activity</a>

    <header class="av-topbar no-print" aria-label="Activity controls and accessibility bar">
      <div class="av-topbar-inner">
        <a class="av-back-link" id="backToUnitLink" href="/bcpss-teachers?tab=activities">
          <span aria-hidden="true">←</span>
          <span>Back to Unit</span>
        </a>

        <div class="av-controls-cluster">
          <div class="av-segmented" role="group" aria-label="View mode">
            <button
              type="button"
              class="av-seg-btn"
              data-mode-btn="student"
              aria-pressed="true"
            >
              Student View
            </button>
            <button
              type="button"
              class="av-seg-btn"
              data-mode-btn="teacher"
              aria-pressed="false"
            >
              Teacher View
            </button>
          </div>

          <div class="av-segmented" role="group" aria-label="WIDA support level">
            <button
              type="button"
              class="av-seg-btn"
              data-wida-btn="1_2"
              aria-pressed="false"
            >
              Levels 1–2
            </button>
            <button
              type="button"
              class="av-seg-btn"
              data-wida-btn="3_4"
              aria-pressed="true"
            >
              Levels 3–4
            </button>
            <button
              type="button"
              class="av-seg-btn"
              data-wida-btn="5_6"
              aria-pressed="false"
            >
              Levels 5–6
            </button>
          </div>

          <div class="av-comfort-group" role="group" aria-label="Reading comfort and print">
            <button
              type="button"
              class="av-icon-btn"
              id="largeTextBtn"
              aria-pressed="false"
              title="Toggle larger text"
            >
              A+
            </button>
            <button
              type="button"
              class="av-icon-btn"
              id="highContrastBtn"
              aria-pressed="false"
              title="Toggle high contrast mode"
            >
              High Contrast
            </button>
            <button
              type="button"
              class="av-icon-btn av-print-btn"
              id="printActivityBtn"
              title="Print student handout"
            >
              Print Activity
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="activityMain" class="av-main" tabindex="-1">
      <div class="av-loading" role="status">Loading activity…</div>
    </main>

    <nav
      id="activityStepper"
      class="av-stepper no-print"
      aria-label="Unit activity sequence"
      hidden
    ></nav>

    <div id="avLiveAnnouncer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/bcpss-teachers/activity/activity-view.js"></script>
  <!-- nsr-injected:begin (multi-day save/resume — tools/inject-save-resume.js) -->
  <script src="/shared/save-resume/save-resume-engine.js?v=20260714-v2" defer></script>
  <!-- nsr-injected:end -->
  </body>
</html>
