<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Socratic Voice Tutor — Neft Teacher</title>
    <link rel="stylesheet" href="styles.css" />
  <!-- mobile-access-injected:begin (shared mobile a11y — tools/inject-mobile-access.js) -->
  <link rel="stylesheet" href="/assets/mobile-access.css">
  <!-- mobile-access-injected:end -->
  <!-- support-profile-injected:begin (persistent support profile — tools/inject-support-profile.js) -->
  <link rel="stylesheet" href="/shared/support/support-profile.css">
  <!-- support-profile-injected:end -->
</head>
  <body>
    <header class="top">
      <h1>🎙️ Socratic Voice Tutor</h1>
      <div class="sub">
        Talk through the problem out loud. I only ask questions — you find the
        answer.
      </div>
      <span class="privacy"
        >🔒 Your voice is processed on your device and is never recorded or sent
        anywhere.</span
      >
    </header>
    <main>
      <div class="picker" id="picker"></div>
      <section class="card">
        <span class="tag" id="tag"></span>
        <p class="qtext" id="qtext"></p>
        <div class="ladder" id="ladder"></div>
        <div class="tutor" id="tutor"></div>
        <div class="controls" id="controls">
          <button class="mic" id="mic" aria-label="Speak your answer">
            🎤
          </button>
          <button class="btn alt" id="repeat">🔁 Repeat question</button>
          <form class="typed" id="typed-form">
            <input
              id="typed-input"
              type="text"
              placeholder="…or type your thinking here"
              autocomplete="off"
              aria-label="Type your answer"
            />
            <button class="btn" type="submit">Send</button>
          </form>
        </div>
        <div class="transcript" id="transcript"></div>
        <div class="note" id="voice-note">
          Tip: speak in full sentences — explain your reasoning, not just a
          number.
        </div>
      </section>
    </main>
    <script src="problems.js"></script>
    <script src="app.js"></script>
  <!-- support-profile-injected:begin (persistent support profile — tools/inject-support-profile.js) -->
  <script src="/shared/support/support-profile.js" defer></script>
  <!-- support-profile-injected:end -->
</body>
</html>
