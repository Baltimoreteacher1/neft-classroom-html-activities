<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal Access Layer — Neft Teacher</title>
    <link rel="stylesheet" href="css/styles.css" />
  <!-- mobile-access-injected:begin (shared mobile a11y — tools/inject-mobile-access.js) -->
  <link rel="stylesheet" href="/assets/mobile-access.css">
  <!-- mobile-access-injected:end -->
  <!-- support-profile-injected:begin (persistent support profile — tools/inject-support-profile.js) -->
  <link rel="stylesheet" href="/shared/support/support-profile.css">
  <!-- support-profile-injected:end -->
</head>
  <body>
    <header class="top">
      <h1>🌐 Universal Access Layer</h1>
      <div class="sub">
        Any Grade 6 problem, instantly re-leveled, read aloud, and translated —
        your choice.
      </div>
      <span class="privacy"
        >🔒 Runs entirely in your browser · opt-in · no PII · no
        translation/network calls (translations are pre-authored)</span
      >
    </header>
    <main>
      <div class="controls">
        <div class="ctl">
          <span class="lbl">Problem</span>
          <div class="seg" id="seg-problem"></div>
        </div>
        <div class="ctl">
          <span class="lbl">Language</span>
          <div class="seg" id="seg-lang"></div>
        </div>
      </div>
      <span
        class="lbl"
        style="
          display: block;
          color: #5f6f80;
          font-weight: 800;
          text-transform: uppercase;
          font-size: 12px;
          letter-spacing: 0.05em;
          margin-bottom: 8px;
        "
        >Support level</span
      >
      <div class="levelbar" id="levelbar"></div>
      <section class="problem">
        <h2 id="ptitle"></h2>
        <div class="ptext" id="ptext"></div>
        <div class="toolbar">
          <button class="btn" id="speak">🔊 Read aloud</button>
          <span class="rate"
            >Speed
            <input
              id="rate"
              type="range"
              min="0.6"
              max="1"
              step="0.05"
              value="0.85"
              aria-label="Reading speed"
          /></span>
          <span class="rate">💡 Tap a gold word for its meaning.</span>
        </div>
      </section>
    </main>
    <div class="gloss" id="gloss" role="dialog" aria-label="Glossary"></div>
    <script type="module" src="js/app.js"></script>
  <!-- support-profile-injected:begin (persistent support profile — tools/inject-support-profile.js) -->
  <script src="/shared/support/support-profile.js" defer></script>
  <!-- support-profile-injected:end -->
</body>
</html>
