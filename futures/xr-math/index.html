<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XR Math — Neft Teacher</title>
    <link rel="stylesheet" href="css/styles.css?v=3" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="top-bar">
      <div class="switcher">
        <button class="scene-btn" data-scene="volume" aria-pressed="true">
          🧱 Volume builder
        </button>
        <button class="scene-btn" data-scene="coord" aria-pressed="false">
          🧭 Coordinate space
        </button>
      </div>
      <div id="xr-button-wrap"></div>
    </div>
    <p id="instructions"></p>
    <canvas id="scene-canvas"></canvas>
    <div class="control-row">
      <div id="readout"></div>
      <button class="mini-btn" id="reset-btn" style="display: none">
        ↺ Clear cubes
      </button>
      <button class="mini-btn" id="next-challenge" style="display: none">
        Next challenge ▶
      </button>
    </div>
    <script type="module" src="js/main.js?v=3"></script>
  </body>
</html>
