<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Overnight Loop — Neft Teacher</title>
    <link rel="stylesheet" href="styles.css" />
  <!-- mobile-access-injected:begin (shared mobile a11y — tools/inject-mobile-access.js) -->
  <link rel="stylesheet" href="/assets/mobile-access.css">
  <!-- mobile-access-injected:end -->
  <!-- support-profile-injected:begin (persistent support profile — tools/inject-support-profile.js) -->
  <link rel="stylesheet" href="/shared/support/support-profile.css">
  <!-- support-profile-injected:end -->
</head>
  <body>
    <header class="top">
      <h1>🌙 The Overnight Loop</h1>
      <div class="sub">
        Last night's results → this morning's targeted plan. Demo on synthetic
        data.
      </div>
      <span class="privacy"
        >🔒 Synthetic, anonymized data only · runs entirely in your browser · no
        PII, no network calls</span
      >
    </header>
    <main>
      <div class="tabs">
        <button data-tab="briefing" aria-selected="true">
          Morning Briefing
        </button>
        <button data-tab="students">Per-Student</button>
      </div>
      <div class="actions">
        <button class="btn" id="print">🖨️ Print briefing</button>
      </div>
      <div id="view" class="grid"></div>
    </main>

    <dialog id="dlg">
      <div class="dlg-head"><h2 id="dlg-title">Student</h2></div>
      <div class="dlg-body" id="dlg-body"></div>
      <div style="padding: 14px 22px; text-align: right">
        <button class="btn alt" id="dlg-close">Close</button>
      </div>
    </dialog>

    <script src="data.js"></script>
    <script src="app.js"></script>
  <!-- support-profile-injected:begin (persistent support profile — tools/inject-support-profile.js) -->
  <script src="/shared/support/support-profile.js" defer></script>
  <!-- support-profile-injected:end -->
</body>
</html>
