s the cable was replaced on schedule.\",\"connectors\":[\"because\"],\"topic\":\"a headline that says more than paragraph three\",\"audience\":\"the newsroom editors\"},\"wida\":{\"standard\":\"Language for Language Arts\",\"frameworkNote\":\"Aligned to the WIDA 2020 English Language Development Standards Framework. Observers name language moves in discourse, sentence, and word/phrase. They do not report a level, a composite, or a placement.\",\"discourse\":\"Shape a argue for the newsroom editors in The Headline That Outran the Report, and keep the claim chained to one cited line about a headline that says more than paragraph three.\",\"sentence\":\"Join the evidence in The Headline That Outran the Report with because, so, although, or therefore so the audience can see the reason or the limit.\",\"wordPhrase\":\"Use precise case words for a headline that says more than paragraph three and avoid vague stand-ins while you cite the reading in The Headline That Outran the Report.\"},\"vocabulary\":[{\"word\":\"headline\",\"meaning\":\"the short line above a report\",\"example\":\"In the record, headline is the precise name the writer keeps.\"},{\"word\":\"paragraph\",\"meaning\":\"a block of the report\",\"example\":\"In the record, paragraph is the precise name the writer keeps.\"},{\"word\":\"claim\",\"meaning\":\"what the headline wants readers to believe\",\"example\":\"In the record, claim is the precise name the writer keeps.\"},{\"word\":\"evidence\",\"meaning\":\"the sentence in paragraph three\",\"example\":\"In the record, evidence is the precise name the writer keeps.\"},{\"word\":\"citation\",\"meaning\":\"naming paragraph three in your note\",\"example\":\"In the record, citation is the precise name the writer keeps.\"},{\"word\":\"audience\",\"meaning\":\"the editors who must fix the line\",\"example\":\"In the record, audience is the precise name the writer keeps.\"}],\"dialogue\":{\"page\":\"the newsroom editors stops you at the edge of the case and asks what The Headline That Outran the Report means for the next hour. They want a reason, not a shrug.\",\"ending\":\"The precise reply cites the record and names the next action for the newsroom editors. The vague reply sends them off without a line they can check.\",\"readingAdd\":\"Read the cited line about a headline that says more than paragraph three once more before you answer the newsroom editors.\",\"speakingAdd\":\"Say the connector aloud before you add the detail.\",\"writingAdd\":\"Write the audience's name in the first line of the note.\",\"options\":[{\"id\":\"precise\",\"quality\":\"precise\",\"text\":\"Paragraph three states that one cable was replaced on schedule and the span stayed open. Because of that, the editors rewrite the headline to match paragraph three\",\"response\":\"The reply cites the line and gives the audience a reason they can check.\"},{\"id\":\"partial\",\"quality\":\"partial\",\"text\":\"Something changed with a headline that says more than paragraph three, so we should look again later.\",\"response\":\"The reply has a connector, but it never cites the line the audience can check.\"},{\"id\":\"unclear\",\"quality\":\"unclear\",\"text\":\"It looks kind of different, so maybe it is fine to go ahead.\",\"response\":\"The reply hides the evidence. The audience cannot tell what to do next.\"}]},\"forks\":[{\"id\":\"fork-open\",\"after\":\"open\",\"prompt\":\"Before you read, which path fits The Headline That Outran the Report?\",\"options\":[{\"id\":\"open-a\",\"label\":\"Start with the cited line\",\"ending\":\"the newsroom editors asks you to find the line about a headline that says more than paragraph three before anyone debates the plan.\",\"readingAdd\":\"Underline the sentence that states a headline that says more than paragraph three without adding a new fact.\",\"speakingAdd\":\"Tell the audience which line you will use.\",\"writingAdd\":\"Open the note by naming the source of the line.\"},{\"id\":\"open-b\",\"label\":\"Start with the audience\",\"ending\":\"You name the newsroom editors first so the later claim has a person who must act on a headline that says more than paragraph three.\",\"readingAdd\":\"After you name the audience, return to the sentence about a headline that says more than paragraph three.\",\"speakingAdd\":\"Address the audience by the role named in the case.\",\"writingAdd\":\"Put the audience in the first sentence of the draft.\"}]},{\"id\":\"fork-read\",\"after\":\"read\",\"prompt\":\"The sources are open. Which move comes next for a headline that says more than paragraph three?\",\"options\":[{\"id\":\"read-a\",\"label\":\"the editors rewrite the headline to match paragraph three\",\"ending\":\"You follow the first stake: the editors rewrite the headline to match paragraph three The cited line still has to appear in what you say.\",\"readingAdd\":\"Check that this stake does not erase the sentence about a headline that says more than paragraph three.\",\"speakingAdd\":\"Give the stake and the cited line in one turn.\",\"writingAdd\":\"Use because to tie the stake to the cited line.\"},{\"id\":\"read-b\",\"label\":\"the editors add the paragraph-three fact under the headline\",\"ending\":\"You follow the second stake: the editors add the paragraph-three fact under the headline The limit in the second source still counts.\",\"readingAdd\":\"Use the second source to test this stake about a headline that says more than paragraph three.\",\"speakingAdd\":\"Name the limit before you recommend the stake.\",\"writingAdd\":\"Use although or whereas if the second source pushes back.\"}]}],\"tool\":{\"id\":\"press\",\"headline\":\"Bridge failed before dawn\",\"paragraph\":\"Paragraph three states that one cable was replaced on schedule and the span stayed open. The headline's word failed is not in that paragraph.\",\"question\":\"Which line should limit the headline?\"},\"pathways\":{\"guided\":{\"speakingFrames\":[\"The reason is ___ because ___.\",\"the newsroom editors should ___ so ___.\"],\"writingFrames\":[\"I am writing to the newsroom editors because ___.\",\"The record says ___, so ___.\"],\"wordBank\":[\"headline\",\"paragraph\",\"claim\",\"evidence\"],\"stretch\":\"\"},\"developing\":{\"speakingFrames\":[\"The claim is ___. The evidence is ___.\"],\"writingFrames\":[\"Although ___, the next action is ___.\"],\"wordBank\":[\"headline\",\"paragraph\"],\"stretch\":\"\"},\"independent\":{\"speakingFrames\":[],\"writingFrames\":[],\"wordBank\":[],\"stretch\":\"Without frames, address the newsroom editors, cite one line about a headline that says more than paragraph three, and choose a connector that shows cause or limit.\"}},\"bands\":{\"3-5\":{\"listening\":{\"script\":\"Listen to the field log for The Headline That Outran the Report. Keep the number or the named limit, and keep the reason that follows it. Paragraph three states that one cable was replaced on schedule and the span stayed open. Listen for the words stayed open. Those words fight the headline. Write the key line in your own short words before you choose an answer. The next person on duty will use your note.\",\"choices\":[{\"id\":\"c1\",\"text\":\"Keep the cited line and the reason: a headline that says more than paragraph three.\",\"correct\":true,\"feedback\":\"This choice keeps the cited line and the reason together.\"},{\"id\":\"c2\",\"text\":\"Act now, because a general feeling is enough in The Headline That Outran the Report.\",\"correct\":false,\"feedback\":\"A feeling drops the cited line. Go back to the record.\"},{\"id\":\"c3\",\"text\":\"Nothing in the log is clear, so any action is fine.\",\"correct\":false,\"feedback\":\"The log has a clear line. Any action erases it.\"}]},\"reading\":{\"paragraphs\":[\"The Headline That Outran the Report is on the table for the newsroom editors. Paragraph three states that one cable was replaced on schedule and the span stayed open. The record keeps that line beside the time, the tool, and the people who must act.\",\"The headline uses the word failed. Paragraph three does not. Editors have to decide which line a reader should trust, and they have to say why.\"],\"evidenceSentence\":\"Paragraph three states that one cable was replaced on schedule and the span stayed open.\",\"secondSource\":\"Newsroom rule: a headline may not claim a failure that the body of the report does not support. Paragraph three is part of the body.\"},\"speaking\":{\"prompt\":\"Speak to the newsroom editors about a headline that says more than paragraph three. Use first and because. Point back to the line you chose in the reading.\",\"plan\":[\"Name the audience.\",\"Cite the line you chose.\",\"Add because or so and the next action.\"],\"lookFor\":[\"because or so\",\"the cited line\"]},\"writing\":{\"prompt\":\"Write to the newsroom editors about The Headline That Outran the Report. Tell them a headline that says more than paragraph three. Use because or so, and cite this line in your own sentence: Paragraph three states that one cable was replaced on schedule and the span stayed open.\",\"plan\":[\"Name who will read the note.\",\"Put the evidence in your own sentence.\",\"Add the action you recommend.\"],\"rubric\":[\"The audience is named.\",\"A line from the source is cited.\",\"because or so links the reason to the action.\"]}},\"6-8\":{\"listening\":{\"script\":\"Listen to the academic brief for The Headline That Outran the Report. Track the constraint, the cited line, and the action it supports. Paragraph three states that one cable was replaced on schedule and the span stayed open. The brief asks you to cite paragraph three against the headline's claim. A precise note lets the audience act without inventing a cause. Mark the connector you hear before you choose.\",\"choices\":[{\"id\":\"c1\",\"text\":\"The claim stays inside the evidence about a headline that says more than paragraph three.\",\"correct\":true,\"feedback\":\"This choice keeps the cited line and the reason together.\"},{\"id\":\"c2\",\"text\":\"Act now, because a general feeling is enough in The Headline That Outran the Report.\",\"correct\":false,\"feedback\":\"A feeling drops the cited line. Go back to the record.\"},{\"id\":\"c3\",\"text\":\"Nothing in the log is clear, so any action is fine.\",\"correct\":false,\"feedback\":\"The log has a clear line. Any action erases it.\"}]},\"reading\":{\"paragraphs\":[\"The Headline That Outran the Report is on the table for the newsroom editors. Paragraph three states that one cable was replaced on schedule and the span stayed open. The record keeps that line beside the time, the tool, and the people who must act.\",\"The headline uses the word failed. Paragraph three does not. Editors have to decide which line a reader should trust, and they have to say why.\"],\"evidenceSentence\":\"Paragraph three states that one cable was replaced on schedule and the span stayed open.\",\"secondSource\":\"Newsroom rule: a headline may not claim a failure that the body of the report does not support. Paragraph three is part of the body.\"},\"speaking\":{\"prompt\":\"Brief the newsroom editors on a headline that says more than paragraph three. Use a causal or concessive connector and one precise noun from the case. Do not add a fact that is not in the sources.\",\"plan\":[\"State the claim for this audience.\",\"Cite the evidence and the second source.\",\"Use although, whereas, therefore, or because.\"],\"lookFor\":[\"a concessive or causal connector\",\"one precise case noun\"]},\"writing\":{\"prompt\":\"Write an academic note to the newsroom editors about The Headline That Outran the Report. Make a claim about a headline that says more than paragraph three, concede a limit with although or whereas, and cite this evidence: Paragraph three states that one cable was replaced on schedule and the span stayed open.\",\"plan\":[\"Open with the claim.\",\"Cite the evidence.\",\"Concede one limit from the second source.\"],\"rubric\":[\"The claim is scoped to the sources.\",\"Evidence is cited, not replaced by a reaction.\",\"A subordinate connector shows cause or concession.\"]}}},\"replay\":{\"scripts\":{\"3-5\":\"Replay for a later watch. One condition has changed, so listen again instead of trusting the first memory. Listen to the field log for The Headline That Outran the Report. Keep the number or the named limit, and keep the reason that follows it. Paragraph three states that one cable was replaced on schedule and the span stayed open. Listen for the words stayed open. Those words fight the headline. Write the key line in your own short words before you choose an answer. The next person on duty will use your note. Say what stayed the same and what the new condition asks you to change.\",\"6-8\":\"Replay for a later watch. One condition has changed, so listen again instead of trusting the first memory. Listen to the academic brief for The Headline That Outran the Report. Track the constraint, the cited line, and the action it supports. Paragraph three states that one cable was replaced on schedule and the span stayed open. The brief asks you to cite paragraph three against the headline's claim. A precise note lets the audience act without inventing a cause. Mark the connector you hear before you choose. Say what stayed the same and what the new condition asks you to change.\"},\"prompts\":{\"3-5\":\"On the replay, tell the newsroom editors what stayed the same about a headline that says more than paragraph three.\",\"6-8\":\"On the replay, revise the claim for the newsroom editors if the new condition changes a headline that says more than paragraph three.\"},\"writingTwist\":\"Add one sentence that names what changed on the replay of The Headline That Outran the Report.\",\"speakingTwist\":\"Tell the newsroom editors which part of the first plan still stands.\"}},\"worldId\":\"media-detectives\"}]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"na
