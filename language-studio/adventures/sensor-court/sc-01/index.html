"so\"],\"topic\":\"how Sensor A changed between two times\",\"audience\":\"the measurement board\"},\"wida\":{\"standard\":\"Language for Mathematics\",\"frameworkNote\":\"Aligned to the WIDA 2020 English Language Development Standards Framework. Observers name language moves in discourse, sentence, and word/phrase. They do not report a level, a composite, or a placement.\",\"discourse\":\"Shape a inform for the measurement board in The Dissolved Oxygen Brief, and keep the claim chained to one cited line about how Sensor A changed between two times.\",\"sentence\":\"Join the evidence in The Dissolved Oxygen Brief with because, so, although, or therefore so the audience can see the reason or the limit.\",\"wordPhrase\":\"Use precise case words for how Sensor A changed between two times and avoid vague stand-ins while you cite the reading in The Dissolved Oxygen Brief.\"},\"vocabulary\":[{\"word\":\"sensor\",\"meaning\":\"the device that records the measure\",\"example\":\"In the record, sensor is the precise name the writer keeps.\"},{\"word\":\"measurement\",\"meaning\":\"a reading with a unit and a time\",\"example\":\"In the record, measurement is the precise name the writer keeps.\"},{\"word\":\"oxygen\",\"meaning\":\"the gas measured in milligrams per liter\",\"example\":\"In the record, oxygen is the precise name the writer keeps.\"},{\"word\":\"dissolved\",\"meaning\":\"carried in the water\",\"example\":\"In the record, dissolved is the precise name the writer keeps.\"},{\"word\":\"difference\",\"meaning\":\"the gap between two readings\",\"example\":\"In the record, difference is the precise name the writer keeps.\"},{\"word\":\"evidence\",\"meaning\":\"the pair of readings you cite\",\"example\":\"In the record, evidence is the precise name the writer keeps.\"}],\"dialogue\":{\"page\":\"the measurement board stops you at the edge of the case and asks what The Dissolved Oxygen Brief means for the next hour. They want a reason, not a shrug.\",\"ending\":\"The
